| `kind` | `png` / `webp` / `jpg`（クロップ方法の分岐に使う） |
| `imgSize` | 現在の `[幅, 高さ]` |
| `mdx` | 図を載せている記事 MDX（**読むだけ**。設問・本文の文脈と図番号の確認用） |
| `signals` | 機械の兆候。`EDGE_CUT(side)`＝その縁で線が切れている疑い／`STRAY_SLIVER`・`STRAY_LABEL`＝縁の離れ島／`recrop*`＝OCR が拾った写り込み。**疑う場所の手がかりで、判定は必ず目視で行う** |
