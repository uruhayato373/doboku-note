## 実行手順

1. **入力ファイル特定**: `.Codex/state/metrics/gsc/` と `.Codex/state/metrics/ga4/` を `Glob` で探索し、各 dimension ごとに最新ファイルを選ぶ
2. **読み込み**: JSON を Read で取得（容量が大きければ `rows` の上位 N 件に絞る）
3. **パターン抽出**: 8 つの条件式で該当行を抽出（Pattern 6 は SNS 流入・要 `ga4-sourceMedium-sns-*.json`／Pattern 7/8 は `gsc-page-query-*.json`・前週スナップショット）
4. **存在判定（Pattern 5 のみ）**: `.local/r2/posts/` に対して Grep で slug 主要語検索
5. **出力書き出し**: `.Codex/state/improvements/{YYYY-MM-DD}.md` を Write
6. **サマリーを標準出力に返す**: 件数のみ。詳細はファイル経由で呼び出し元が Read する

## 制約事項

- **採点はしない**（rubric は `/nsm-experiment propose` の責務）
- **施策案は書かない**（具体的な書き換え案の提案は避ける、候補の surface までが責務）
- **新規ファイル作成は `.Codex/state/improvements/` のみ**

## 参照

- `.Codex/skills/management/weekly-improve/SKILL.md` — 本エージェントの主な呼び出し元
- `.Codex/skills/management/nsm-experiment/references/rubric.md` — 候補採点の rubric（本エージェントは採点しない）
- `.Codex/scripts/lib/metrics-reader.mjs` — 週次メトリクス取得ユーティリティ
- AGENTS.md §ハーネス設計原則 — Generator/Evaluator 分離原則"""
