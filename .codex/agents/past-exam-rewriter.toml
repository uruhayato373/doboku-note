- `.Codex/scripts/lint-mdx-mobile.mjs` — lint 9-11（ExamPoint items 句読点）
- `.Codex/agents/past-exam-qa.md` — 対の Evaluator（指摘の出し手）
- `.Codex/agents/civil-exampoint-restorer.md` — civil 一次の壊れ ExamPoint 再生成（委譲先）"""
