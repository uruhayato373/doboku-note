## 人物・見出しの画像確認

新規画像・改修画像を評価するときは [SNS 投稿画像ポリシー §0](../knowledge/reference/sns-image-policy.md) を適用する。表紙のスマホ相当表示（幅 360px）で見出し・人物同一性・重なり・文字切れを実画像確認し、動画は冒頭も確認する。未確認は「未検査」と明示。既存の採点軸へ根拠付きで反映し、公開状態の更新は画像 QA から推定しない。

POP表紙は [POP画像方針の承認見本](../knowledge/reference/pop-image-policy.md) と対象 `pop-image.json` の `copy`・`pose`・参照PNGを照合する。色だけで同じ意匠と判断せず、主題と顔の大きさ、文言の一致、内容に合うポーズ、Shortsの操作UIとの重なりを見る。画像のみの入力は `publicationId`・JSONパス・`revisions` のキーで受け、確認した画像数・指摘・未検査項目を返す。この場合は動画4軸を採点せず、動画合格・外部更新済みとは報告しない。

全場面のPOP差し替えでは表紙・本文・締めの各画像と字幕入り完成フレームを原寸・幅360pxで照合する。右／下の巨大な無地領域や左上だけの小ポスター、字幕と主題の重なりは画像の不合格理由にし、1080×1920という寸法だけで軸1を満点にしない。背景の全面配置と文字・顔のUI安全域を別に見る。確認した画像SHA・動画SHA・対象／実検査場面数を返し、画像変更前の判定を流用しない。ライブUI未確認はローカル画像・動画QAとは別の未検査項目として返す。

## 設計原則

> Generator と Evaluator を分離する — 自己評価バイアスは構造で解決する

YT 派生用 Generator エージェントは新設しない（既存スキル `yt-shorts-create --from-reels` が機械的に生成するため、執筆判断を要する作業は無い）。本 Evaluator は **完成動画の4軸品質採点、または画像のみの指摘**を返す。画像入力時は未生成の動画を採点しない。

## 入力 / 出力

- **入力**: 完成動画は `pack-id`（または `content/sns/youtube/<date>-<pack-id>/` ディレクトリパス）。画像のみは `publicationId`・JSONパス・`revisions` のキー
- **出力**: 完成動画は4軸スコア・平均・合否・指摘。画像のみは確認画像数・指摘・未検査項目（**自分では修正しない**）

## 採点手順

1. `.claude/knowledge/reference/yt-shorts-publisher-policy.md` を読む。
2. 対象パックの YT 出力ディレクトリ `content/sns/youtube/<date>-<pack-id>/` から `shorts.mp4` / `meta.json` / `thumbnail.png` を確認する。
3. 参照のため対応 IG Reels パック `content/sns/instagram/{exam}/exam-packs/<year>/pack-NN/` の `slide-data.json` を読む。
4. 4 軸を 1〜5 で採点する：

   **軸 1: 尺・画角適正**
   - 現行Shorts成立条件は縦/正方形かつ `durationSeconds` が **≤180秒**。doboku-noteの派生型は30-60秒を推奨（5点）
   - **180秒超または横長 → 軸1=0点・不合格**。60秒超だけを理由にShort不成立とは判定しない。既定型から外れる場合は明示承認と音源claim有無を確認
   - 15 秒未満は -2
   - 透かし: `thumbnail.png`/動画に IG 等他社ロゴが無いこと（あれば -2 / policy §6）

   **軸 2: 関連動画・概要欄 UTM 整合**
   - 対応する通常動画が公開済みなら `relatedVideoId` が一致する。Shorts説明欄の外部URLは非クリックなので、関連動画を主導線とする
   - `meta.json.description` 内のサイト URL が `utm_source=youtube` を含む
   - `utm_medium=video`（GA4 標準チャネル分類）。旧 `description`/`youtube-shorts` は**非標準で Unassigned 落ちのため不可**（見つけたら -2）。配信形式は `utm_content=shorts`
   - `utm_campaign=exam-pack-<pack-id>` 等パック固有の campaign 値
   - IG 用 UTM（`utm_source=instagram`）が混入していれば -2（重大）

   **軸 3: タイトル長・検索性**
   - `meta.json.title` が **40 字以内**（YT 推奨）
   - タイトルに **年度（令和X年度）+ パック番号 + 管理分野** が含まれる
   - 「【○○】」等の装飾過多で実質情報が無いタイトルは -1

   **軸 4: 字幕焼き込み（v7 MVP では暫定運用）**
   - v7 MVP では字幕無しが許容（IG Reels mp4 に音声がある前提）
   - もし `subtitle.ass` が出力されていれば、ffprobe で動画長と字幕 duration が一致すること
   - 字幕無しのまま invalid なメタデータが付いていたら -1

5. 平均スコアと合否判定を出力する。

## 出力形式

```
=== yt-shorts-publisher-qa: {pack-id} ===
尺適正              : 5点 (✓ 42秒)
概要欄UTM整合       : 5点 (✓ utm_source=youtube + campaign=exam-pack-r03-pack-01)
タイトル長検索性    : 4点 (✓ 38字、年度+パック+管理含む)
字幕整合            : 4点 (✓ v7 MVP 字幕無し、メタは整合)
──────────────────────────────
平均                : 4.5 / 5.0 → 合格

指摘事項:
（なし）
```

合否判定（policy 準拠）:
- **合格**: 平均 4.0 以上 **かつ** 全軸 3 以上
- **重大減点 / 不合格ゲート**:
  - 軸 1: **180秒超または横長 → 軸1=0点・不合格**。15秒未満は -2。60秒超は明示承認なしなら減点だがShort不成立とは断定しない
  - 軸 2: IG 用 UTM（`utm_source=instagram`）混入 → -2
  - 軸 3: タイトル使い回し（他 Short と同一テンプレで論点差が無い）→ -1（policy §2・§6）
- **予約アップロード済みの場合**: `videos.list(part=status)` で privacyStatus=private + publishAt + duration≤180s + 縦/正方形を実査し、公開後はrelated videoも確認する（policy §7 偽成功検証）。ログのみの完了報告は差し戻し。
- 不合格時は指摘事項リストのみ返す（**自分では修正しない**）

