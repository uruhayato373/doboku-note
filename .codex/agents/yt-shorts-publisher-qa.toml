- **shorts.mp4 / meta.json の生成** — `yt-shorts-create --from-reels`（機械処理）
- **IG Reels mp4 の生成・採点** — `ig-reel-create` + `ig-reels-qa`
- **YouTube Data API での実投稿** — `media-uploader.mjs`（別工程）
- **字幕焼き込みの実装** — Phase D2 で対応予定
