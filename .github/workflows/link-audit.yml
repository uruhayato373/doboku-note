name: Audit links

on:
  schedule:
    - cron: "0 22 * * 4" # 毎週金曜 07:00 JST（木曜 22:00 UTC）
  workflow_dispatch:

# DN-0109 Phase 1: develop への自動書込み系ワークフロー間の push 衝突を防ぐ共通グループ。
# 同時実行を待たせるだけで落とさない（cancel-in-progress: false）。
concurrency:
  group: develop-git-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      # check-links.mjs は npm 依存ゼロ（fs/path と #lib 内ローカル import のみ）のため
      # npm ci は不要。
      - name: Run internal link audit
        continue-on-error: true
        run: npm run check-links-audit

      - name: Run external link audit
        continue-on-error: true
        run: npm run check-external-links -- --report .claude/state/link-audit/external-latest.json

      - name: Publish report to develop branch (.claude/state/link-audit/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .claude/state/link-audit
          if git diff --cached --quiet; then
            echo "No link-audit changes to publish"
            exit 0
          fi

          BROKEN=$(node -e "const fs=require('fs');const f=fs.readdirSync('.claude/state/link-audit').filter(x=>x.startsWith('audit-')).sort().pop();console.log(JSON.parse(fs.readFileSync('.claude/state/link-audit/'+f,'utf8')).summary.HIGH);")
          git commit -m "chore(metrics): link audit $(date -u +%Y-%m-%dT%H:%MZ) — ${BROKEN} broken [skip ci]"
          git push origin develop
