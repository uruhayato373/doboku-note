name: Guard PDCA cycle (weekly-review + offline surfacers)

# 週次レビュー（/weekly-review）を回すクラウドルーティン（正典 = doboku-note weekly PDCA）が
# 停止・無効・cron ズレで発火しなくなっても、状態はクラウド側にしかなく repo からは見えない。
# 実際 2026-W27/W28 の 2 週分が silent に欠落した（docs/reviews/weekly が W26 で止まっていた）。
#
# 本ガードは毎週月曜に「先週分の *-review.md が生成済みか」を決定的に検査し、無ければ赤落ちさせて
# ルーティン停止を可視化する（r2-audit / check-ogp-coverage と同じ backstop 思想。レビューの生成は
# しない＝生成はクラウドルーティンの責務、本ガードは発火の欠落検知のみ）。
#
# 赤落ち時の対処: 対話セッション（デスクトップ/web アプリ）で /routines（list-first）→ 無ければ
#   /schedule で再作成、cron ズレなら update。真実源: .claude/skills/management/routines/SKILL.md
#
# 2026-07-30: 本 workflow は「レビュー生成の欠落検知」だけでなく、**オフラインで判定できる
# PDCA surfacer の実行キャリア**も兼ねる。理由: surfacer を weekly-review スキルの中だけに置くと
# ルーティン停止時に一緒に沈黙する（W30/W31 は手動生成・本ガードは 07-20/07-27 と 2 週連続赤）。
# creds も外部到達性も要らない判定は CI 側で必ず動かす（「計測は CI/CD 供給が正」と同じ思想）。

on:
  schedule:
    - cron: "17 2 * * 1" # 毎週月曜 11:17 JST（月曜 02:17 UTC）。先週分の review 生成を検査
  workflow_dispatch:

permissions:
  contents: read
  issues: write # 自動化の沈黙を automation-failure Issue に記録する（限定例外）

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # ── PDCA サイクルの surfacer（オフライン・creds 不要・依存パッケージ不要）─────────
      # 2026-07-30 追加。これらは weekly-review（クラウドルーティン）の中で列挙する設計だったが、
      # そのルーティンが停止しても発火しなくなる（実際 W30/W31 は手動生成・本ガードは 2 週連続赤）。
      # 判定に creds も外部到達性も要らないので **CI 側で必ず動かす**＝ルーティン生存に依存させない。
      # surfacer は落とさず job summary に出す（DUE があるのは正常な状態でもありうる）。
      - name: Surface cycle state (experiments / UI collection / GA4 settings)
        continue-on-error: true
        run: |
          {
            echo "## PDCA サイクルの状態（$(date -u +%Y-%m-%dT%H:%MZ)）"
            echo
            echo '### 実験の再計測期限（check-experiment-due）'
            echo '```'
            node scripts/check-experiment-due.mjs || true
            echo '```'
            echo '### GSC/GA4 UI 取得の期限と完全性（check-gsc-ui-due）'
            echo '```'
            node scripts/check-gsc-ui-due.mjs || true
            echo '```'
            echo '### GSC 自動レビューの発火監視（check-gsc-auto-review）'
            echo '```'
            node scripts/check-gsc-auto-review.mjs || true
            echo '```'
            echo '### UI CSV SSOT の整合（check-google-ui-ssot）'
            echo '```'
            node scripts/check-google-ui-ssot.mjs || true
            echo '```'
            echo '### GA4 管理画面 設定ドリフト（check-ga4-dimensions）'
            echo '```'
            node scripts/check-ga4-custom-dimensions.mjs || true
            echo '```'
            echo '### 競合スキャン期限（CI取得の停止 + X/Brain手動期限）'
            echo '```'
            node scripts/check-competitor-scan-due.mjs || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 記録層（観測ログへの追記）の沈黙を Issue に記録する。
      # job summary は人が見に行かないと届かない＝沈黙した自動化ほど気づかれない。
      # Issue なら通知が飛び open のまま残るので能動チャネルになる（限定例外・
      # 真実源: .claude/knowledge/reference/information-architecture.md）。
      # 赤落ちはさせない（DUE は「復旧すべき状態」であって CI の失敗ではない）。
      - name: Report - GSC auto review silence
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/check-gsc-auto-review.mjs --json > /tmp/auto-review.json || true
          if ! node -e "process.exit(JSON.parse(require('fs').readFileSync('/tmp/auto-review.json','utf8')).anyDue ? 0 : 1)"; then
            echo "GSC 自動レビューは正常（DUE なし）— Issue は起票しない"
            exit 0
          fi
          {
            echo "GSC 計測の**記録層**が沈黙しています（データ取得 CI とは別系統）。"
            echo ""
            echo '```'
            node scripts/check-gsc-auto-review.mjs || true
            echo '```'
            echo ""
            echo "- 確認: 対話セッションで \`/routines\`（list-first）→ ルーティン \`doboku-note GSC auto review\` の enabled / cron / last_fired_at"
            echo "- 応急: \`/gsc-review\`（月次）・\`/weekly-improve\`（週次）を手動実行して観測ログへ追記"
            echo "- 判定ロジック: \`scripts/check-gsc-auto-review.mjs\`"
          } > /tmp/auto-review-body.md
          node scripts/report-automation-failure.mjs \
            --channel gsc-auto-review \
            --title "記録層の沈黙を検知（weekly-review-guard）" \
            --body-file /tmp/auto-review-body.md

      # 決定的ゲート: 公開ページが GSC の 404/リダイレクト URL を指していたら赤。
      # これは「0 件が正常」な検査なので surfacer と違い hard fail にする。
      - name: Gate - internal links vs GSC 404/redirect
        run: node scripts/check-internal-links-vs-gsc.mjs

      # 先週分の docs/reviews/weekly/YYYY-Www-review.md が無ければ exit 1（赤落ち）。
      # 依存パッケージ不要（fs のみ）なので npm ci はスキップ。
      # surfacer より後に置く＝レビュー欠落で赤くても上のサマリは必ず残る。
      - name: Check last week's review exists
        if: always()
        run: node scripts/check-weekly-review.mjs
