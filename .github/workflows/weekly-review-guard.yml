name: Guard PDCA cycle (weekly-review + offline surfacers)

# 週次レビュー（/weekly-review）を回すクラウドルーティン（正典 = doboku-note weekly PDCA）が
# 停止・無効・cron ズレで発火しなくなっても、状態はクラウド側にしかなく repo からは見えない。
# 実際 2026-W27/W28 の 2 週分が silent に欠落した（docs/reviews/weekly が W26 で止まっていた）。
#
# 本ガードは毎週月曜に「先週分の *-review.md が生成済みか」を決定的に検査し、無ければ赤落ちさせて
# ルーティン停止を可視化する（r2-audit / check-ogp-coverage と同じ backstop 思想。レビューの生成は
# しない＝生成はクラウドルーティンの責務、本ガードは発火の欠落検知のみ）。
#
# 赤落ち時の対処: 対話セッション（デスクトップ/web アプリ）で /routines（list-first）→ 無ければ
#   /schedule で再作成、cron ズレなら update。真実源: .claude/skills/management/routines/SKILL.md
#
# 2026-07-30: 本 workflow は「レビュー生成の欠落検知」だけでなく、**オフラインで判定できる
# PDCA surfacer の実行キャリア**も兼ねる。理由: surfacer を weekly-review スキルの中だけに置くと
# ルーティン停止時に一緒に沈黙する（W30/W31 は手動生成・本ガードは 07-20/07-27 と 2 週連続赤）。
# creds も外部到達性も要らない判定は CI 側で必ず動かす（「計測は CI/CD 供給が正」と同じ思想）。

on:
  schedule:
    - cron: "17 2 * * 1" # 毎週月曜 11:17 JST（月曜 02:17 UTC）。先週分の review 生成を検査
  workflow_dispatch:

permissions:
  contents: read
  issues: write # 自動化の沈黙を automation-failure Issue に記録する（限定例外）

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # 2026-08-29: doc-meta-index生成用のnpm ci追加分の余裕（元5分）
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      # ── PDCA サイクルの surfacer（オフライン・creds 不要・依存パッケージ不要）─────────
      # 2026-07-30 追加。これらは weekly-review（クラウドルーティン）の中で列挙する設計だったが、
      # そのルーティンが停止しても発火しなくなる（実際 W30/W31 は手動生成・本ガードは 2 週連続赤）。
      # 判定に creds も外部到達性も要らないので **CI 側で必ず動かす**＝ルーティン生存に依存させない。
      # surfacer は落とさず job summary に出す（DUE があるのは正常な状態でもありうる）。
      - name: Surface cycle state (experiments / UI collection / GA4 settings)
        continue-on-error: true
        run: |
          {
            echo "## PDCA サイクルの状態（$(date -u +%Y-%m-%dT%H:%MZ)）"
            echo
            echo '### 実験の再計測期限（check-experiment-due）'
            echo '```'
            node scripts/check-experiment-due.mjs || true
            echo '```'
            echo '### GSC/GA4 UI 取得の期限と完全性（check-gsc-ui-due）'
            echo '```'
            node scripts/check-gsc-ui-due.mjs || true
            echo '```'
            echo '### GSC 自動レビューの発火監視（check-gsc-auto-review）'
            echo '```'
            node scripts/check-gsc-auto-review.mjs || true
            echo '```'
            echo '### UI CSV SSOT の整合（check-google-ui-ssot）'
            echo '```'
            node scripts/check-google-ui-ssot.mjs || true
            echo '```'
            echo '### GA4 管理画面 設定ドリフト（check-ga4-dimensions）'
            echo '```'
            node scripts/check-ga4-custom-dimensions.mjs || true
            echo '```'
            echo '### 競合スキャン期限（CI取得の停止 + X/Brain手動期限）'
            echo '```'
            node scripts/check-competitor-scan-due.mjs || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 記録層（観測ログへの追記）の沈黙を Issue に記録する。
      # job summary は人が見に行かないと届かない＝沈黙した自動化ほど気づかれない。
      # Issue なら通知が飛び open のまま残るので能動チャネルになる（限定例外・
      # 真実源: .claude/knowledge/reference/information-architecture.md）。
      # 赤落ちはさせない（DUE は「復旧すべき状態」であって CI の失敗ではない）。
      - name: Report - GSC auto review silence
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/check-gsc-auto-review.mjs --json > /tmp/auto-review.json || true
          if ! node -e "process.exit(JSON.parse(require('fs').readFileSync('/tmp/auto-review.json','utf8')).anyDue ? 0 : 1)"; then
            echo "GSC 自動レビューは正常（DUE なし）— Issue は起票しない"
            exit 0
          fi
          {
            echo "GSC 計測の**記録層**が沈黙しています（データ取得 CI とは別系統）。"
            echo ""
            echo '```'
            node scripts/check-gsc-auto-review.mjs || true
            echo '```'
            echo ""
            echo "- 確認: 対話セッションで \`/routines\`（list-first）→ ルーティン \`doboku-note GSC auto review\` の enabled / cron / last_fired_at"
            echo "- 応急: \`/gsc-review\`（月次）・\`/weekly-improve\`（週次）を手動実行して観測ログへ追記"
            echo "- 判定ロジック: \`scripts/check-gsc-auto-review.mjs\`"
          } > /tmp/auto-review-body.md
          node scripts/report-automation-failure.mjs \
            --channel gsc-auto-review \
            --title "記録層の沈黙を検知（weekly-review-guard）" \
            --body-file /tmp/auto-review-body.md

      # check-internal-links-vs-gsc.mjs は src/config/doc-meta-index.json を直接読む。
      # 同ファイルは git 追跡から外した生成物（2026-08-29・履歴肥大の再発防止）で、
      # 生成スクリプト自体は gray-matter に依存するため、ここでのみ依存インストールが要る
      # （このジョブの他ステップは node: 標準モジュールのみで npm ci 不要）。
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Build doc meta index
        run: node .claude/scripts/build-doc-meta-index.mjs --ci

      # 決定的ゲート: 公開ページが GSC の 404/リダイレクト URL を指していたら赤。
      # これは「0 件が正常」な検査なので surfacer と違い hard fail にする。
      - name: Gate - internal links vs GSC 404/redirect
        run: node scripts/check-internal-links-vs-gsc.mjs

      # ルーティンが「実際に成果物を出したか」を PR の実在で検査する（2026-08-16 追加）。
      # 上の Check last week's review は**レビューの存在**しか見ないため、ルーティンが死んでいても
      # 対話セッションで人が書けば緑になる。実際 W32/W33 の 2 週連続失敗は、W31/W32 が人手で
      # 書かれていたせいで 13 日間ガードに映らなかった。「成果物がある」と「自動化が生きている」は
      # 別の命題で、後者を直接見る検査がこれ。
      # 赤落ちはさせず Issue で能動通知する（GSC auto review の沈黙報告と同じ方針＝
      # 人手で回した週まで赤くすると、常に赤いゲートは読み飛ばされて本物の欠落を隠す）。
      - name: Report - weekly PDCA routine silence
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          node scripts/check-weekly-routine-fired.mjs
          rc=$?
          set -e
          # rc=0 発火あり / rc=1 2週連続で成果物なし / rc=2 検査不成立（gh 不通）
          if [ "$rc" = "0" ]; then
            echo "ルーティンは生きています — Issue は起票しない"
            exit 0
          fi
          if [ "$rc" = "2" ]; then
            echo "::warning::routine 発火の検査が不成立（gh 不通）。異常なしとは扱わない"
            exit 0
          fi
          {
            echo "クラウドルーティン \`doboku-note weekly PDCA\` が **2 週連続で成果物を出していません**。"
            echo ""
            echo '```'
            node scripts/check-weekly-routine-fired.mjs || true
            echo '```'
            echo ""
            echo "週次レビューのファイル自体は人手でも書けるため、\`check-weekly-review\` は緑のまま通ります。"
            echo "緑であることを「自動化が生きている」と読まないでください（2026-08-16 の 13 日欠落の原因）。"
            echo ""
            echo "- 確認: \`RemoteTrigger {action:\"get\", trigger_id:\"trig_01Edgim5qXCiGwKtnL4AVEmM\"}\`（\`list\` はページ送りが効かない）"
            echo "- 応急: 対話セッションで \`/weekly-review\` を実行してサイクルを埋める"
            echo "- 真実源: \`.claude/knowledge/reference/workflows.md\`「発火の信頼性」"
          } > /tmp/routine-silence.md
          node scripts/report-automation-failure.mjs \
            --channel weekly-pdca \
            --title "週次ルーティンが2週連続で成果物を出していません" \
            --body-file /tmp/routine-silence.md

      # 重要 workflow が「赤いまま」「動いていないまま」を検知する watchdog（2026-08-24 新設）。
      #
      # ci.yml 自身の失敗通知（if: failure）は即時の一撃だが、**workflow が起動すらしなくなった
      # 沈黙**は拾えない（cron 破損・schedule 無効化・token 切れ）。「最後に成功したのはいつか」を
      # 定期に見る経路が無く、develop の Pre-merge check が 24 連続赤でも 2 日気づかれなかった。
      # 実際この watchdog の初回実行で note-live-audit の 21 日沈黙が出た（Issue #473）。
      #
      # 赤落ちさせず Issue で能動通知する（上の 2 つと同じ方針＝常に赤いゲートは読み飛ばされる）。
      - name: Report - workflow health (赤が続いている/動いていない)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if node scripts/check-workflow-health.mjs > /tmp/wf-health.txt 2>&1; then
            echo 'workflow health: 全て健全'
            cat /tmp/wf-health.txt
            exit 0
          fi
          {
            echo "重要 workflow のうち、最後の success が古いか連続失敗しているものがあります。"
            echo ""
            echo '```'
            cat /tmp/wf-health.txt
            echo '```'
            echo ""
            echo "- 閾値の真実源: \`.claude/config/workflow-health.json\`（実行間隔＋バッファで決める）"
            echo "- 判定ロジック: \`scripts/check-workflow-health.mjs\`"
            echo "- 閾値そのものを変えるときは config に理由を書く（間隔より短い上限は偽赤になる）"
          } > /tmp/wf-health-body.md
          node scripts/report-automation-failure.mjs \n            --channel workflow-health \n            --title "重要 workflow が赤いまま/動いていません" \n            --body-file /tmp/wf-health-body.md

      # report 区分（quality-audit の ci:false）の読み手を機械化する（2026-08-24 新設）。
      #
      # ci:false は落ちても CI が緑のまま通り、レポート（audit-latest.md）は --ci では書かれず
      # gitignore 済み。つまり FAIL は「人がローカルでフル監査を叩いた端末」にしか存在せず、
      # 読む自動経路がゼロだった（DN-0087）。ここで週次に実行して Issue に集約する。
      # CLAUDE.md §9「赤いのに誰も見ていない検査は、無いのと同じ」への機械的な回答。
      - name: Report - quality audit report区分 (ci:false) の FAIL
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci --legacy-peer-deps
          if node scripts/quality-audit.mjs --report-only > /tmp/report-digest.txt 2>&1; then
            echo 'report 区分: FAIL なし'
            tail -20 /tmp/report-digest.txt
            exit 0
          fi
          {
            echo "quality-audit の report 区分（ci:false）で FAIL があります。"
            echo "これは Pre-merge check を**赤くしない**検査群なので、ここで拾わないと誰も気づきません。"
            echo ""
            echo '```'
            tail -60 /tmp/report-digest.txt
            echo '```'
            echo ""
            echo "- 定義: \`scripts/quality-audit.mjs\` の CHECKS（ci:false）"
            echo "- 再現: \`node scripts/quality-audit.mjs --report-only\`"
            echo "- 直すか、読む人がいないなら検査ごと消す（CLAUDE.md §9）"
          } > /tmp/report-digest-body.md
          node scripts/report-automation-failure.mjs \n            --channel report-checks \n            --title "quality-audit の report 区分に FAIL があります" \n            --body-file /tmp/report-digest-body.md

      # 先週分の docs/reviews/weekly/YYYY-Www-review.md が無ければ exit 1（赤落ち）。
      # 依存パッケージ不要（fs のみ）なので npm ci はスキップ。
      # surfacer より後に置く＝レビュー欠落で赤くても上のサマリは必ず残る。
      - name: Check last week's review exists
        if: always()
        run: node scripts/check-weekly-review.mjs
