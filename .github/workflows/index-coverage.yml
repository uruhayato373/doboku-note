name: Index coverage audit (URL Inspection)

# サイト全 sitemap URL の Google index 状態（送信して登録 / 検出-未登録 等）を
# URL Inspection API で月次取得し、.claude/state/metrics/url-inspection/ と
# index-coverage-history.json（時系列）に commit する。
# ローカルは creds 未設定で叩けない（計測は CI/CD 供給が正・measurement-incidents.md 2026-06-05）ため CI で実行。
# 設計の真実源: .claude/knowledge/reference/gsc-management.md / 分業: gsc-index-auditor + /gsc-review。
# URL Inspection は 2,000 URL/日/property が上限。月次なら quota 余裕（現在 ~1030 URL）。

on:
  schedule:
    - cron: "0 2 1 * *" # UTC 02:00 毎月1日 = JST 11:00 毎月1日
  workflow_dispatch:

# DN-0109 Phase 1: develop への自動書込み系ワークフロー間の push 衝突を防ぐ共通グループ。
# 同時実行を待たせるだけで落とさない（cancel-in-progress: false）。
concurrency:
  group: develop-git-write
  cancel-in-progress: false

permissions:
  contents: write
  issues: write # 閾値の無条件異常を automation-failure Issue に記録する（限定例外）

jobs:
  inspect:
    runs-on: ubuntu-latest
    # 2026-09-01: 1,468 URL を直列で inspect して 120 分に当たり、部分結果を 1 件も残さず cancelled。
    # inspect-url は 5 並列＋checkpoint になったが、job の上限は step 内の `timeout` （180 分）と
    # その flush・publish・ゲートが収まる 240 に置く。job timeout に当たると publish もゲートも
    # 走らないので、時間切れは job ではなく step の `timeout -s INT` で受ける。
    timeout-minutes: 240
    steps:
      - name: Checkout develop
        # schedule はデフォルトブランチ（main）を checkout するため、ref を明示しないと
        # npm ci が main のフックを入れる。その後 publish step で develop へ切り替えると
        # フックの drift guard が bot commit を拒否して落ちる（2026-08-20 に psi-audit が
        # `[pre-commit] 導入済みフックが古い` で実際に失敗した）。fetch-metrics.yml と同じ形で
        # 最初から develop を checkout し、順序依存そのものを無くす。
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: develop

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # npm ci（--ignore-scripts なし）は prepare で pre-commit フックを入れる。そのフックの
      # check-x-campaign-plan などが src/config/doc-meta-index.json を直接読むが、これは
      # git 追跡外の生成物なので、ここで作らないと **commit の瞬間に ENOENT で落ちる**。
      # 症状はワークフロー全体の赤で、本来の処理が終わっていても記録が残らない。
      - name: Build doc meta index
        run: node .claude/scripts/build-doc-meta-index.mjs --ci


      - name: Restore service account key
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          mkdir -p credentials
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_KEY_JSON" > credentials/gsc-service-account.json
          chmod 600 credentials/gsc-service-account.json

      - name: Build URL list from live sitemap
        run: |
          mkdir -p .tmp
          node .claude/scripts/list-sitemap-urls.mjs > .tmp/all-urls.txt
          # URL Inspection は 2,000 URL/日/property が上限。安全側に 1,900 で頭打ち。
          head -n 1900 .tmp/all-urls.txt > .tmp/inspect-urls.txt
          echo "SITEMAP_COUNT=$(wc -l < .tmp/all-urls.txt | tr -d ' ')" >> "$GITHUB_ENV"
          echo "sitemap URLs: $(wc -l < .tmp/all-urls.txt) / inspecting: $(wc -l < .tmp/inspect-urls.txt)"

      - name: Fetch fresh GSC page snapshot (28d)
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ./credentials/gsc-service-account.json
        run: npm run fetch-gsc-data -- --dimension page --days 28 --limit 1000

      # 時間切れは job timeout でなく step 内の `timeout -s INT` で受ける。INT を受けた inspect-url は
      # 新規取得を止めて部分結果を flush し exit 3 で返る（timeout 自体は 124 を返す）。-k 60 は
      # flush が終わらない場合の保険で、その場合も直近 checkpoint（100 件ごと）までは残っている。
      # 部分結果は publish はするが history には積まず、後段の完全性ゲートで赤にする。
      - name: URL Inspection (all sitemap URLs)
        id: inspect
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ./credentials/gsc-service-account.json
        run: |
          set +e
          timeout -s INT -k 60 180m \
            node .claude/scripts/inspect-url.mjs --file .tmp/inspect-urls.txt --concurrency 5 --checkpoint-every 100 \
            > /tmp/inspect.log 2>&1
          rc=$?
          set -e
          echo "--- tail of inspection log ---"
          tail -8 /tmp/inspect.log
          echo "inspect-url exit code: $rc"

          LATEST=$(ls -t .claude/state/metrics/url-inspection/inspection-batch-*.json 2>/dev/null | head -1)
          if [ -z "$LATEST" ]; then echo "::error::inspection batch not produced（checkpoint も残っていない）"; exit 1; fi
          PARTIAL=$(jq -r '.partial // false' "$LATEST")
          COMPLETED=$(jq -r '.completed // (.results|length)' "$LATEST")
          TOTAL=$(jq -r '.total // (.results|length)' "$LATEST")
          {
            echo "partial=$PARTIAL"
            echo "completed=$COMPLETED"
            echo "total=$TOTAL"
          } >> "$GITHUB_OUTPUT"

          # 124 = timeout が INT を送った / 3 = inspect-url が中断 flush / 137 = -k で KILL された
          case "$rc" in
            0) ;;
            124|3|137)
              if [ "$PARTIAL" != "true" ]; then echo "::error::rc=$rc なのに batch が partial でない（flush の契約が壊れている）"; exit 1; fi
              echo "::warning::URL Inspection が制限時間内に完走せず（rc=$rc）。部分結果 $COMPLETED/$TOTAL を publish し、完全性ゲートで赤にする"
              ;;
            *) exit "$rc" ;;
          esac

      - name: Summarize coverage_state (→ job summary)
        run: |
          LATEST=$(ls -t .claude/state/metrics/url-inspection/inspection-batch-*.json 2>/dev/null | head -1)
          if [ -z "$LATEST" ]; then echo "::error::inspection batch not produced"; exit 1; fi
          {
            echo "## Index coverage audit"
            echo ""
            echo "snapshot: \`$LATEST\`"
            echo ""
            echo "inspected: $(jq '.results|length' "$LATEST") / total: ${{ steps.inspect.outputs.total }} / partial: ${{ steps.inspect.outputs.partial }}"
            echo ""
            echo '```'
            jq -r '.results[].index.coverage_state // "（error/null）"' "$LATEST" | sort | uniq -c | sort -rn
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - name: Stage outputs
        run: |
          mkdir -p /tmp/idx
          cp -r .claude/state/metrics/url-inspection /tmp/idx/ 2>/dev/null || true
          cp -r .claude/state/metrics/gsc /tmp/idx/ 2>/dev/null || true

      - name: Publish to develop (+ append history)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin develop
          git checkout develop
          git pull --rebase origin develop

          # npm ci は main のフックを prepare で導入するため、develop の
          # ソースへ切り替えた時点で bot commit 用フックも同期する。
          npm run pre-commit:install

          mkdir -p .claude/state/metrics/url-inspection .claude/state/metrics/gsc
          cp -r /tmp/idx/url-inspection/* .claude/state/metrics/url-inspection/ 2>/dev/null || true
          cp -r /tmp/idx/gsc/* .claude/state/metrics/gsc/ 2>/dev/null || true

          # develop の現行 history.json に対し、今回 batch を1エントリ追記（冪等: 同 date は skip）。
          # 部分結果（partial=true）は history に積まない: 分母が偽って小さくなり indexed_ratio が
          # 動いてしまう。batch ファイルだけ残して、完全性ゲートで赤にする。
          LATEST=$(ls -t .claude/state/metrics/url-inspection/inspection-batch-*.json 2>/dev/null | head -1)
          if [ "${{ steps.inspect.outputs.partial }}" = "true" ]; then
            echo "partial batch（${{ steps.inspect.outputs.completed }}/${{ steps.inspect.outputs.total }}）: history には追記しない"
            SUBJECT="chore(metrics): index-coverage audit $(date -u +%Y-%m-%dT%H:%MZ) PARTIAL ${{ steps.inspect.outputs.completed }}/${{ steps.inspect.outputs.total }} [skip ci]"
          else
            node .claude/scripts/append-coverage-history.mjs \
              --batch "$LATEST" \
              --date "$(date -u +%Y-%m-%d)" \
              --sitemap-count "${SITEMAP_COUNT:-0}" \
              --notes "monthly cron (index-coverage.yml)"
            SUBJECT="chore(metrics): index-coverage audit $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          fi

          git add .claude/state/metrics/url-inspection .claude/state/metrics/gsc
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "$SUBJECT"
          git push origin develop

      # 完全性ゲート: publish の**後**（部分結果は develop に残す）。inspect が完走しなかった月は
      # history が更新されず、閾値ゲートは前月のエントリを見て緑になってしまうので、ここで赤にする。
      - name: Gate - inspection completeness
        id: completeness_gate
        run: |
          if [ "${{ steps.inspect.outputs.partial }}" = "true" ]; then
            echo "::error::URL Inspection が完走していない（${{ steps.inspect.outputs.completed }}/${{ steps.inspect.outputs.total }}）。history は未更新。並列度/step timeout（index-coverage.yml）を見直すか、workflow_dispatch で再実行"
            exit 1
          fi
          echo "[completeness] ${{ steps.inspect.outputs.completed }}/${{ steps.inspect.outputs.total }} 件を検査・完走"

      # 機械ゲート: publish の**後**に走らせる（赤でも取得済みデータは develop に残る）。
      # 赤にするのは「機械が無条件に異常と断定できるもの」だけ（inspected 0 / 1900 件上限到達 /
      # indexed_ratio < 60%）。前月比の低下や hygiene は warning に留め、判断は
      # クラウドルーティン（GSC auto review）が観測ログへ記録する＝月次 red の狼少年化を防ぐ。
      - name: Gate - coverage thresholds
        id: coverage_gate
        run: node .claude/scripts/check-coverage-thresholds.mjs

      - name: Report - coverage threshold failure
        if: failure() && (steps.coverage_gate.outcome == 'failure' || steps.completeness_gate.outcome == 'failure')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            if [ "${{ steps.completeness_gate.outcome }}" = "failure" ]; then
              echo "月次 index coverage の URL Inspection が完走しませんでした（${{ steps.inspect.outputs.completed }}/${{ steps.inspect.outputs.total }}・部分結果の batch は develop に commit 済み・history は未更新）。"
            else
              echo "月次 index coverage の閾値ゲートが赤になりました（データ自体は develop に commit 済み）。"
            fi
            echo ""
            echo '```'
            node .claude/scripts/check-coverage-thresholds.mjs 2>&1 || true
            echo '```'
            echo ""
            echo "- しきい値の真実源: \`.claude/knowledge/reference/gsc-management.md\` の「閾値」節"
            echo "- 判定ロジック: \`.claude/scripts/check-coverage-thresholds.mjs\`"
            echo "- 再実行: \`gh workflow run index-coverage.yml\`"
          } > /tmp/coverage-body.md
          node scripts/report-automation-failure.mjs \
            --channel index-coverage \
            --title "閾値ゲートが赤（無条件異常）" \
            --body-file /tmp/coverage-body.md

      - name: Cleanup credentials
        if: always()
        run: rm -f credentials/gsc-service-account.json
