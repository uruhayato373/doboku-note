name: Audit R2 image sync

# .local/r2/posts の画像が R2 バケットに正しく同期されているかを定期監査する。
# あわせて published 記事の OGP 画像(ogp.png)未生成も検知する（check-ogp-coverage）。
#
# 目的: r2-sync の「サイレント失敗」を早期検知する二重チェック。
#   2026-05 に R2 トークンが失効し、upload スクリプトが個別失敗を握りつぶして
#   exit 0 を返していたため、約2週間「Uploaded: 0」が success 表示のまま放置され、
#   本番画像が 404 になっていた。r2-sync 側は失敗で赤く落ちるよう修正済みだが、
#   本監査はそれが走らないケース（画像 push を伴わない drift 等）の backstop。
#
# diff-r2 は読み取り専用（ListObjectsV2）。書き込み権限は不要。
# 基準は main: R2 は main push 時のみ同期されるため、develop-only コンテンツを
#   比較対象にすると「未同期」と誤検知する。よって main を checkout して比較する。

on:
  schedule:
    - cron: "0 22 * * 0" # 毎週月曜 07:00 JST（日曜 22:00 UTC）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main (production source)
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      # OGP 未生成の能動検知（creds 不要のローカル検査）。diff-r2 は「local にあるが R2 に
      # 無い」しか見ず「そもそも未生成」を素通りするため、published 記事の ogp.png 欠落を別途
      # 捕捉する（2026-06-12 OGP 404 incident の backstop）。
      - name: Check OGP coverage (published articles have ogp.png)
        run: node scripts/check-ogp-coverage.mjs

      # 孤児 OGP の能動検知（coverage の逆方向）。記事 MDX を撤去（ステージング退避・非公開化）
      # しても ogp.png/webp が git に取り残される死に資産を捕捉する（2026-07 reference-materials
      # 5 記事の孤児 OGP 掃除の再発防止）。修正は `npm run check-orphan-ogp -- --fix`。
      - name: Check orphan OGP (ogp.png/webp with no article MDX)
        run: npm run check-orphan-ogp

      # note 導線（ファネル）ドリフトの能動検知（creds 不要のローカル検査）。
      # 公開記事の CTA 欠落・公開マガジンの L2 もくじ未収録・L2 の L1 未リンクを
      # 赤落ちで捕捉する。真実源: .claude/knowledge/reference/note-funnel-architecture.md
      - name: Check note funnel drift (CTA / mokuji / L1-L2 links)
        run: npm run check-note-funnel

      # 転職・キャリア記事（tags: [career]）が学習系ナビ一覧に混ざらないことの検証。
      # career は group: guide のため classifyDoc が 'guide' を返し、素朴な filter だと
      # サイドバー「試験ガイド」へ混入する（2026-07-28 に civil-1 で 49 件中 26 件が混入）。
      # ここは source 層（career タグ ⇔ HIGH_INTENT/careerFeatured の整合）。
      # ビルド後の HTML 検査は `--built` で、build を伴う別ワークフロー側で回す。
      - name: Check career separation (career articles not in study nav)
        run: npm run check-career-separation

      # 共通プリミティブの迂回検知（WARN のみ・赤落ちしない）。
      # 2026-07 に「共通機構があるのに新しい面が独自実装する」事故が 3 回起きた
      # （resolveCurriculum 未使用で career 混入 / shortTitle 未使用で冗長表示 /
      #  AuthorProfile 未使用で運営者カード 54 行の重複）。ページが SSOT データを
      # 直接 import していたら迂回のサインとして surface する。判断は人。
      - name: Check SSOT consumers (pages bypassing shared components)
        run: npm run check-ssot-consumers

      # ガイド記事（group: guide）の本文 3,000 字下限（薄い記事の再発防止、content-principles §25）。
      # published guide 全件を検査。pre-commit は staged のみ検査するため、CI で全量の backstop。
      - name: Check guide article length (published guide >= 3000 chars)
        run: npm run check-guide-length

      # note ハッシュタグ 90 個以上 / 有料境界 paidBoundary 解決可能性の全量 backstop。
      # pre-commit は staged のみ＝クラウド自動生成記事を守れないため CI で docs/note 全量を検査（creds不要）。
      - name: Check note hashtags (>=90 tags, full)
        run: npm run check-note-hashtags

      - name: Check note paid boundary (paidBoundary resolvable, full)
        run: npm run check-note-boundary

      # 有料記事の L3 帰路 CTA（資格別 L2 もくじ）が paywall の中に埋まっていないか。
      # 末尾配置のままだと非購入者に一度も見えない（2026-07-31 に 238 本を是正）。
      - name: Check note paid CTA placement (L2 mokuji in free preview, full)
        run: npm run check-note-paid-cta

      # 単品価格の一貫性（マガジン内 L1 / 宣言済みシリーズ L2）。pre-commit は --staged のみで
      # 「触っていないマガジンのドリフト」を拾えないため、全量の backstop をここに置く。
      # network 不要（ソース内検査）。2026-07-28 新設。
      - name: Check note price consistency (full)
        run: npm run check-note-price-consistency

      # PDF 配布を約束している note 記事に、添付すべき PDF 実体がディスク上にあるか。
      # 「約束したのに購入者へ届かない」の source 側の網。ライブに実際に添付されているかは
      # 有料エリアの添付カードが未ログイン HTML に出ないため CI からは原理的に見えず、
      # ローカルの `npm run check-note-attachments:live` が担う。2026-07-28 新設。
      - name: Check note attachments (promised PDFs exist on disk)
        run: npm run check-note-attachments

      # 有料記事の無料部分に「この記事でわかること」があるか。無料部分は購入判断のすべてで、
      # 何が得られるかが無いと読者は代金に見合うか判断できない。実測で 580/580 が境界前に
      # 置く例外のない慣行、欠落は最高価格帯の PDF 商品5本のみだった。2026-07-28 新設。
      - name: Check note intro benefit (paid articles state what buyer gets, before paywall)
        run: npm run check-note-intro-benefit

      # メタゲート: ゲート自身が壊れて「1件も検査せずに緑」を返していないかを検査する。
      # 2026-07-28 に4つのゲートが同時にこの状態だった（走査ロジック / 取得経路の故障）。
      - name: Check gate coverage (gates are actually inspecting)
        run: npm run check-gate-coverage

      # affiliate-career-only 違反 prose（添削サービス/講座ブランド等の再提案）の全量 backstop。
      # pre-commit はローカル限定でクラウドルーティンの自動生成を守れないため CI で全 .local/r2/posts を検査。
      - name: Check affiliate-career-only prose (no abolished course/添削 re-proposals)
        run: npm run check-affiliate-prose

      # 孤立 figure（img/figure-*.svg が同記事の本文から未参照＝サイト非表示）の全量 backstop。
      # pre-commit は staged のみ検査するため、CI で全 .local/r2/posts を検査する。
      - name: Check orphan figures (figure-*.svg referenced in article body)
        run: npm run check-orphan-figures

      # モバイル可読性ラチェット。全 published MDX を content-rules.json の fullScan ルール
      # （表/入れ子リスト/段落長/見出し/文体）で走査し、baseline を超える新規違反があれば赤落ち。
      # 既存違反は baseline で grandfather 済み（リライトで漸減）。レポートは PR 差分では追わず、
      # 全量 backstop として週次で回す。
      - name: Check content quality ratchet (mobile readability, no new violations)
        run: npm run check-content-quality:ci

      - name: Diff local (main) vs R2 — images only
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        run: |
          set +e
          node .claude/skills/dev/diff-r2/scripts/diff-r2.mjs --images-only --json > r2-diff.json
          DIFF_EXIT=$?
          set -e

          # diff-r2 は creds 不足で exit 2（stdout に JSON を出さない）、
          # トークン無効だと S3 例外で異常終了する。JSON が無ければ「監査実行不能」= 失敗。
          if ! node -e "JSON.parse(require('fs').readFileSync('r2-diff.json','utf8'))" 2>/dev/null; then
            echo "::error::diff-r2 が JSON を出力しませんでした（R2 認証失敗/権限不足の可能性, exit=$DIFF_EXIT）"
            {
              echo "## R2 監査: 実行失敗"
              echo ""
              echo "diff-r2 が JSON を返しませんでした（exit=$DIFF_EXIT）。"
              echo "R2 トークン（CLOUDFLARE_R2_ACCESS_KEY_ID / SECRET）の有効性・権限を確認してください。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          node -e '
            const fs = require("fs");
            const d = JSON.parse(fs.readFileSync("r2-diff.json", "utf8"));
            const miss = d.onlyLocal || [];       // local にあるが R2 に無い = 同期漏れ（致命）
            const mism = d.sizeMismatch || [];     // サイズ不一致 = 古い/壊れた同期
            const orphan = d.onlyRemote || [];     // R2 のみ = 削除済みの残骸（許容）
            const out = [];
            out.push("## R2 画像同期 監査");
            out.push("");
            out.push("| 指標 | 件数 |");
            out.push("|---|---|");
            out.push(`| local(main) 画像 | ${d.localCount} |`);
            out.push(`| R2 画像 | ${d.remoteCount} |`);
            out.push(`| **未同期 (local にあるが R2 に無い)** | **${miss.length}** |`);
            out.push(`| **サイズ不一致** | **${mism.length}** |`);
            out.push(`| R2 のみ (orphan・許容) | ${orphan.length} |`);
            const samples = [...miss, ...mism].slice(0, 15);
            if (samples.length) {
              out.push("");
              out.push("### 要対応の例");
              for (const x of samples) out.push(`- ${x.key}`);
              const total = miss.length + mism.length;
              if (total > 15) out.push(`- ... 他 ${total - 15} 件`);
            }
            const fail = miss.length > 0 || mism.length > 0;
            out.push("");
            if (fail) {
              out.push("> **対処**: R2 トークンの有効性を確認し、`gh workflow run r2-sync.yml` で再同期してください。");
            } else {
              out.push("OK: main の画像はすべて R2 に同期されています。");
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out.join("\n") + "\n");
            if (fail) {
              console.error(`R2 同期漏れ: 未同期 ${miss.length} 件 / サイズ不一致 ${mism.length} 件`);
              process.exit(1);
            }
            console.log("R2 in sync (images).");
          '
