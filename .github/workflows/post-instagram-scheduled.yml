name: 📸 Instagram scheduled post (daily)

# IG Graph API は scheduled_publish_time が Carousel 非対応のため、
# GitHub Actions cron で post-from-schedule.cjs を毎朝発火する形で予約投稿を実現。
# 投稿対象は .claude/state/instagram-schedule.json の today (JST) エントリのみ、
# 該当なしなら exit 0 で何もしない。
#
# 戦略: docs/project/03_SNS/01_SNS集客戦略.md v5.2
# 実装パターン: uruhayato373/stats47 の post-instagram-scheduled.yml を参考

on:
  schedule:
    - cron: "3 0 * * *" # 09:03 JST (UTC 00:03) — 戦略 v5 火金 07:00 投稿に合わせる場合は 22 * * 1,4 に変更
  workflow_dispatch:
    inputs:
      force_date:
        description: "JST 日付を強制指定 (YYYY-MM-DD)、空なら今日"
        required: false

permissions:
  contents: write

concurrency:
  group: post-instagram-scheduled
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 🧰 Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📸 Post to Instagram (if today is scheduled)
        id: post
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID_DOBOKU_NOTE }}
          IG_FORCE_DATE: ${{ inputs.force_date }}
        run: |
          set -o pipefail
          node .claude/scripts/instagram/post-from-schedule.cjs 2>&1 | tee /tmp/post-output.log
          PERMALINK=$(grep -oE 'PERMALINK=https?://[^ ]+' /tmp/post-output.log | head -1 | cut -d= -f2- || echo "")
          KEY=$(grep -oE 'CONTENT_KEY=[a-z0-9-]+' /tmp/post-output.log | head -1 | cut -d= -f2 || echo "")
          DATE=$(grep -oE 'today \(JST\): [0-9]{4}-[0-9]{2}-[0-9]{2}' /tmp/post-output.log | head -1 | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' || echo "")
          DOMAIN=$(grep -oE 'DOMAIN=[a-z0-9-]+' /tmp/post-output.log | head -1 | cut -d= -f2 || echo "")
          if [ -n "${PERMALINK}" ]; then SKIP=0; else SKIP=1; fi
          echo "permalink=${PERMALINK}" >> "$GITHUB_OUTPUT"
          echo "content_key=${KEY}" >> "$GITHUB_OUTPUT"
          echo "post_date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "domain=${DOMAIN}" >> "$GITHUB_OUTPUT"
          echo "skipped=${SKIP}" >> "$GITHUB_OUTPUT"

      - name: 📝 Mark posted in schedule + append log
        if: success() && steps.post.outputs.permalink != ''
        run: |
          POSTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # ログ追記
          echo "{\"date\":\"${{ steps.post.outputs.post_date }}\",\"domain\":\"${{ steps.post.outputs.domain }}\",\"content_key\":\"${{ steps.post.outputs.content_key }}\",\"permalink\":\"${{ steps.post.outputs.permalink }}\",\"posted_at\":\"${POSTED_AT}\"}" \
            >> .claude/state/ig-posted-log.jsonl

          # schedule.json の status を "posted" に更新
          node -e "
            const fs=require('fs');
            const p='.claude/state/instagram-schedule.json';
            const e=JSON.parse(fs.readFileSync(p,'utf-8'));
            const today='${{ steps.post.outputs.post_date }}';
            const ck='${{ steps.post.outputs.content_key }}';
            for(const x of e){ if(x.date===today && x.content_key===ck){ x.status='posted'; x.permalink='${{ steps.post.outputs.permalink }}'; } }
            fs.writeFileSync(p, JSON.stringify(e,null,2)+'\n');
          "

          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add .claude/state/ig-posted-log.jsonl .claude/state/instagram-schedule.json
          git commit -m "chore(ig): mark ${{ steps.post.outputs.content_key }} as posted [skip ci]"
          git push origin main

      - name: 💬 Notify on failure
        if: failure()
        run: |
          echo "::error::Instagram 投稿失敗。/tmp/post-output.log を確認してください"
          tail -40 /tmp/post-output.log || true
