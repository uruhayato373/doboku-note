name: Playwright E2E

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "content/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.mjs"
      - "playwright.config.ts"
      - "e2e/**"
      - ".github/workflows/e2e.yml"
  # コンテンツは develop へ直 push されるため PR 経路の E2E を通らない。MDX コンポーネントの誤用で
  # 画面が壊れても ci.yml（build + check-seo-build）は通ることがあるので、develop を夜間 1 回だけ回す。
  # schedule はデフォルトブランチ（main）版の workflow で動くが、checkout は develop に向ける。
  schedule:
    - cron: "0 18 * * *" # UTC 18:00 = JST 03:00
  workflow_dispatch:

permissions:
  contents: read
  issues: write # 夜間 run の失敗を automation-failure Issue に記録する（限定例外）

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # src/config/doc-meta-index.json はビルド生成物で git 追跡していない。これが無いと
      # type-check が「Cannot find module '@/config/doc-meta-index.json'」で落ち、E2E 本体に
      # 到達しないまま赤になる（2026-08-22 の run も同じ理由で、ずっと誰も見ていなかった）。
      # ci.yml / ogp-supply.yml には配線済みだったが、このワークフローだけ漏れていた。
      - name: Build doc meta index
        run: node .claude/scripts/build-doc-meta-index.mjs --ci

      - name: Type check
        run: npm run type-check

      # E2E は dev サーバーではなくビルド成果物（out/）に対して回す。
      # dev だと初めて踏むルートがリクエスト時にコンパイルされ、落ちるテストが実行ごとに
      # 入れ替わる（実装は正しいのに赤）。さらに旧 /category/ /docs/ は Cloudflare の
      # _redirects でしか存在せず dev では必ず 404 になり、リダイレクト検査が成立しない。
      - name: Build
        run: npm run build

      # E2E 本体の前に「叩く URL が実在するか」を見る。存在しない URL だと個々の
      # テストが謎の 404 で落ちるだけで、原因（フィクスチャの陳腐化）に辿り着けない。
      - name: Check E2E targets (out/)
        run: npm run check-e2e-targets

      - name: Run E2E
        run: npm run test:e2e

      # 夜間 run は PR に紐づかず誰も見ないので、失敗を Issue にする（PR run は PR 上で見える）。
      - name: Report - nightly E2E failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "develop の夜間 E2E が失敗した。PR を経ずに develop へ入った変更（コンテンツ・MDX コンポーネント）で画面が壊れている可能性。"
            echo ""
            echo "- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}（artifact: playwright-e2e-${{ github.run_attempt }}）"
            echo "- 再現: \`npm run build && npm run test:e2e\`（a11y だけなら \`npm run test:e2e:a11y\`）"
          } > /tmp/e2e-body.md
          node scripts/report-automation-failure.mjs \
            --channel e2e-nightly \
            --title "develop 夜間 E2E 失敗" \
            --body-file /tmp/e2e-body.md

      # 夜間 run が緑に戻ったら e2e-nightly channel の open Issue を自動クローズ（起票と対）。
      - name: Resolve - nightly E2E Issue (復旧)
        if: success() && github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/report-automation-failure.mjs --resolve --channel e2e-nightly \
            --body "復旧 run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-e2e-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
