name: Playwright E2E

on:
  pull_request:
    # サイトの画面とビルドの手順が変わる PR だけで回す（DN-0803）。検査・運用・SNS・note のスクリプトや package.json の
    # scripts だけの変更は ci.yml の build（実際にビルドする）と夜間の E2E に任せる。依存の変更は package-lock.json で拾う。
    # PR は主要導線だけ（desktop の smoke・navigation・cta）を回して待ち時間を縮め、全 spec は夜間と手動で回す。
    # ビルドの手順（package.json の prebuild・build が npm run でたどるスクリプト）は下に全部書き、tests/e2e-paths.test.mjs が
    # scripts/lib/build-chain.mjs で手順をたどって漏れを止める（手順のスクリプトが読む lib の変更は夜間の E2E が見る）。
    paths:
      - "src/**"
      - "public/**"
      - "content/site/**"
      # src/ が src の外から import するもの（DN-0808。tests/e2e-paths.test.mjs が siteImportedFiles で漏れを止める）
      - "config/site-thumbnails.json"
      - "scripts/assets/design-tokens/note-cover-tokens.json"
      - "config/affiliate-placements.json"
      - "config/cta-placements.json"
      - "data/affiliate/catalog.json"
      - "config/egov-laws.json"
      - "config/policy-registry.json"
      - "config/exam-calendar.json"
      - "config/keiken-answer-sheet-limits.json"
      - "config/note-funnel.json"
      - "config/site-cta-surfaces.json"
      - "config/business-direction.json"
      - "config/product-lineup.json"
      - "config/products.json"
      - "config/qualification-registry.json"
      - "config/seo-meta-config.json"
      - "config/standards-structure.json"
      - "config/utm-templates.json"
      - "config/x-account.json"
      - "scripts/lib/jst-date.mjs"
      - "scripts/lib/qualification-names.mjs"
      - "scripts/lib/repository-paths.mjs"
      - "next.config.mjs"
      - "package-lock.json"
      - "playwright.config.ts"
      - "e2e/**"
      - ".github/workflows/e2e.yml"
      # ビルドの手順
      - "scripts/local/clean-build-output.mjs"
      - "scripts/build/generate-sitemap.mjs"
      - "scripts/build/generate-rss.mjs"
      - "scripts/checks/check-public-bloat.mjs"
      - "scripts/build/build-frequent-topics.mjs"
      - "scripts/build/build-llms-txt.mjs"
      - "scripts/build/build-popular-pages.mjs"
      - "scripts/build/build-public-route-redirects.ts"
      - "scripts/build/build-quiz-data.mjs"
      - "scripts/build/build-search-index.mjs"
      - "scripts/build/build-standards-data.ts"
      - "scripts/checks/check-standards-data.mjs"
      - "scripts/content/parse-exam-questions.mjs"
      - "scripts/local/slim-build-output.mjs"
      - "scripts/build/build-civil-exam-textbook-index.mjs"
      - "scripts/build/build-doc-meta-index.mjs"
      - "scripts/build/build-note-published-index.mjs"
      - "scripts/build/build-pillar-exam-questions.mjs"
      - "scripts/build/build-tag-index.mjs"
      - "scripts/build/generate-webp.mjs"
      - "scripts/sns/parse-civil-1-questions.mjs"
      - "scripts/sns/parse-civil-2-questions.mjs"
      - "scripts/maint/update-mdx-image-refs.mjs"
      - "scripts/exam-backlinks/build-exam-backlinks.mjs"
      - "scripts/exam-backlinks/build-keyword-relations.mjs"
  # コンテンツは develop へ直 push されるため PR 経路の E2E を通らない。MDX コンポーネントの誤用で
  # 画面が壊れても ci.yml（build + check-seo-build）は通ることがあるので、develop を夜間 1 回だけ回す。
  # schedule はデフォルトブランチ（main）版の workflow で動くが、checkout は develop に向ける。
  schedule:
    # 毎時 0 分を外し、JST 23:17 に置く（2026-11-13）。UTC 18:00（JST 03:00）の指定では実際の起動が JST 06:27〜10:12 で
    # （11/02〜11/13 の 12 回）、失敗 Issue が朝の作業時間に立って deploy:main を止めていた。
    - cron: "17 14 * * 1-6" # 月〜土の JST 23:17。a11y を除く
    - cron: "17 14 * * 0" # 日の JST 23:17。a11y を含む全件
  workflow_dispatch:
    inputs:
      standards_scope:
        description: 基準書の描画の範囲（distinct＝比較の内の文書・all＝必携・マニュアルなども全ページ）
        type: choice
        options: [distinct, all]
        default: distinct

permissions:
  contents: read
  issues: write # 夜間 run の失敗を automation-failure Issue に記録する（限定例外）

jobs:
  e2e:
    runs-on: ubuntu-latest
    # 夜間・手動は全 spec を回し、日曜は公的基準の全文書も描画する（STANDARDS_RENDER_SCOPE=all・DN-0850）ので長めに取る
    timeout-minutes: ${{ github.event_name == 'pull_request' && 30 || 60 }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # src/config/doc-meta-index.json はビルド生成物で git 追跡していない（2026-08-22 の run はこれが無く、
      # E2E 本体に到達しないまま赤になっていた）。ci.yml / ogp-supply.yml と同じく明示して作る。
      # type-check はここでは回さない（2026-11-11）。PR も develop も ci.yml の audit が同じ commit で回している。
      - name: Build doc meta index
        run: node scripts/build/build-doc-meta-index.mjs --ci

      # E2E は dev サーバーではなくビルド成果物（out/）に対して回す。
      # dev だと初めて踏むルートがリクエスト時にコンパイルされ、落ちるテストが実行ごとに
      # 入れ替わる（実装は正しいのに赤）。さらに旧 /category/ /docs/ は Cloudflare の
      # _redirects でしか存在せず dev では必ず 404 になり、リダイレクト検査が成立しない。
      # ci.yml の build と同じキー（同じ Next.js のビルドキャッシュを共有する）
      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.js', 'src/**/*.jsx', 'src/**/*.ts', 'src/**/*.tsx', 'src/**/*.mjs', 'next.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build

      # E2E 本体の前に「叩く URL が実在するか」を見る。存在しない URL だと個々の
      # テストが謎の 404 で落ちるだけで、原因（フィクスチャの陳腐化）に辿り着けない。
      - name: Check E2E targets (out/)
        run: npm run check-e2e-targets

      # 確認は 2 組に分ける（2026-11-23 運営者判断「デプロイを止めるのは壊れた類だけ」）。
      # - 壊れた類（表示・本文・リンク・操作・基準書の描画など）: 夜間に落ちると channel e2e-nightly の Issue になり、deploy:main を止める
      # - デザインの類（タグ @layout。広告の枠数・空きの上限・幅のそろい）: 夜間は下の別の段で回し、落ちても channel
      #   e2e-layout-nightly の Issue に記録するだけ（scripts/lib/deploy-main.mjs の blockingNightlyIssues は見ない）
      # PR はデザインを変えたその場で気づけるよう、@layout を含む desktop.spec・ad-coverage.spec も回して PR を落とす。
      - name: Run E2E
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: .tmp/e2e-report.json
          PLAYWRIGHT_HTML_OPEN: never
          # 比較の外の文書（必携・マニュアル・特記など）の全ページ描画は、日曜の夜間と手動で all を選んだときだけ（月〜土は distinct）
          STANDARDS_RENDER_SCOPE: ${{ (github.event.schedule == '17 14 * * 0' || (github.event_name == 'workflow_dispatch' && inputs.standards_scope == 'all')) && 'all' || 'distinct' }}
          # アクセシビリティは週 1 回だけ回す（毎日の夜間は除く）
          E2E_SKIP_A11Y: ${{ github.event.schedule == '17 14 * * 1-6' && '1' || '' }}
        run: npm run test:e2e -- --reporter=line,html,json ${{ github.event_name == 'pull_request' && '--project=desktop-chromium e2e/smoke.spec.ts e2e/navigation.spec.ts e2e/cta.spec.ts e2e/desktop.spec.ts e2e/ad-coverage.spec.ts' || '--grep-invert @layout' }}

      # 夜間・手動のデザインの確認（@layout）。落ちても job は緑のまま（continue-on-error）で、下の段が別の Issue にする。
      # 報告・画像の置き場を分ける（Playwright は実行のたびに --output の置き場を消すので、上の段の失敗の画像を消さない）
      - name: Run E2E (layout)
        id: layout
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: .tmp/e2e-layout-report.json
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-layout
        run: npm run test:e2e -- --reporter=line,html,json --grep @layout --output test-results-layout

      - name: Check E2E execution coverage
        if: always()
        run: npm run check-e2e-execution -- --report .tmp/e2e-report.json

      # @layout の組も対象 0・未実行・スキップは止める（検査ゼロを緑にしない）。失敗そのものは上の段の結果で別の Issue にする
      - name: Check E2E execution coverage (layout)
        if: ${{ always() && steps.layout.outcome != 'skipped' }}
        run: npm run check-e2e-execution -- --report .tmp/e2e-layout-report.json --allow-failures

      # 夜間 run は PR に紐づかず誰も見ないので、失敗を Issue にする（PR run は PR 上で見える）。
      - name: Report - nightly E2E failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "develop の夜間 E2E が失敗した。PR を経ずに develop へ入った変更（コンテンツ・MDX コンポーネント）で画面が壊れている可能性。"
            echo ""
            echo "- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}（artifact: playwright-e2e-${{ github.run_attempt }}）"
            echo "- 再現: \`npm run build && npm run test:e2e\`（a11y だけなら \`npm run test:e2e:a11y\`）"
          } > /tmp/e2e-body.md
          node scripts/reports/report-automation-failure.mjs \
            --channel e2e-nightly \
            --title "develop 夜間 E2E 失敗" \
            --body-file /tmp/e2e-body.md

      # 夜間 run が緑に戻ったら e2e-nightly channel の open Issue を自動クローズ（起票と対）。
      - name: Resolve - nightly E2E Issue (復旧)
        if: success() && github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/reports/report-automation-failure.mjs --resolve --channel e2e-nightly \
            --body "復旧 run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # デザインの確認（@layout）の夜間の失敗。デプロイは止めない（channel が e2e-nightly と違う）
      - name: Report - nightly layout E2E failure
        if: ${{ always() && github.event_name == 'schedule' && steps.layout.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "develop の夜間 E2E のデザインの確認（タグ @layout：広告の枠数・空きの上限・幅のそろい）が失敗した。デプロイは止めていない。"
            echo "デザインを意図して変えたなら検査の期待値を、意図していないなら画面を直す。"
            echo ""
            echo "- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}（artifact: playwright-e2e-${{ github.run_attempt }} の playwright-report-layout）"
            echo "- 再現: \`npm run build && npm run test:e2e -- --grep @layout\`"
          } > /tmp/e2e-layout-body.md
          node scripts/reports/report-automation-failure.mjs \
            --channel e2e-layout-nightly \
            --title "develop 夜間 E2E（デザインの確認）失敗" \
            --body-file /tmp/e2e-layout-body.md

      - name: Resolve - nightly layout E2E Issue (復旧)
        if: ${{ always() && github.event_name == 'schedule' && steps.layout.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/reports/report-automation-failure.mjs --resolve --channel e2e-layout-nightly \
            --body "復旧 run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Upload Playwright artifacts
        if: ${{ failure() || steps.layout.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-e2e-${{ github.run_attempt }}
          path: |
            playwright-report/
            playwright-report-layout/
            .tmp/e2e-report.json
            .tmp/e2e-layout-report.json
            test-results/
            test-results-layout/
          if-no-files-found: ignore
          retention-days: 14
