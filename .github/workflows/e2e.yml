name: Playwright E2E

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "content/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.mjs"
      - "playwright.config.ts"
      - "e2e/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # src/config/doc-meta-index.json はビルド生成物で git 追跡していない。これが無いと
      # type-check が「Cannot find module '@/config/doc-meta-index.json'」で落ち、E2E 本体に
      # 到達しないまま赤になる（2026-08-22 の run も同じ理由で、ずっと誰も見ていなかった）。
      # ci.yml / ogp-supply.yml には配線済みだったが、このワークフローだけ漏れていた。
      - name: Build doc meta index
        run: node .claude/scripts/build-doc-meta-index.mjs --ci

      - name: Type check
        run: npm run type-check

      # E2E は dev サーバーではなくビルド成果物（out/）に対して回す。
      # dev だと初めて踏むルートがリクエスト時にコンパイルされ、落ちるテストが実行ごとに
      # 入れ替わる（実装は正しいのに赤）。さらに旧 /category/ /docs/ は Cloudflare の
      # _redirects でしか存在せず dev では必ず 404 になり、リダイレクト検査が成立しない。
      - name: Build
        run: npm run build

      # E2E 本体の前に「叩く URL が実在するか」を見る。存在しない URL だと個々の
      # テストが謎の 404 で落ちるだけで、原因（フィクスチャの陳腐化）に辿り着けない。
      - name: Check E2E targets (out/)
        run: npm run check-e2e-targets

      - name: Run E2E
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-e2e-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
