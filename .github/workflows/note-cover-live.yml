name: Note cover live check

# note のカバー（記事 eyecatch・マガジン cover）が最新デザインで登録済みかを判定する（読み取りだけ）。
# 生成と登録は Mac の週次 launchd（scripts/note-cover-routine.mjs・日曜 3:00 JST）の担当で、CI は書き込まない。
# 判定の実装は scripts/lib/note-cover-live.mjs（routine と共用）、CLI は scripts/check-note-cover-live.mjs。
#
# 赤（rc=1）＝要登録が残っている: Mac が寝ていた・note のログイン切れ・登録失敗。
#   確認: npm run note-cover:install -- --status / ~/Library/Logs/doboku-note/note-cover.log
# 赤（rc=2）＝検査不成立: note API に届かない・取得失敗 20% 超・マガジン一覧が取れない。
# 失敗は automation-failure Issue（channel note-cover-live）に記録し、次に緑になったら自動で閉じる。
#
# note-live-audit.yml に載せないのは、あちらが既に 40 分超で、記事 900 件超の API 取得（5〜8 分）を
# 足すと 45 分の上限に掛かるため。

on:
  schedule:
    - cron: "0 0 * * 1" # UTC 00:00 月曜 = JST 09:00 月曜（日曜 3:00 の Mac の週次の後）
  workflow_dispatch:

permissions:
  contents: read
  issues: write # 要登録の残りを automation-failure Issue に記録する（限定例外）

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # 台帳（.claude/state/note/cover-ledger.json）は Mac の週次が develop へ push する。
      # schedule は main の定義で走るので、ref を書かないと main の古い台帳で判定してしまう。
      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm

      # 対象一覧（note-cover-inventory）が gray-matter と描画 lib を import する。commit はしないので
      # pre-commit フックは要らない（--ignore-scripts）。
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Check note live covers
        id: check
        run: |
          set +e
          node scripts/check-note-cover-live.mjs 2>&1 | tee /tmp/note-cover-live.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          {
            echo "## note カバーの登録状況（rc=$rc）"
            echo '```'
            grep -v '記事 [0-9]*00/' /tmp/note-cover-live.log | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Report - note cover pending
        if: failure() && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "note のカバー判定が失敗（rc=${{ steps.check.outputs.rc }}）。rc=1 は最新デザインで登録されていない記事・マガジンが残っている、rc=2 は検査不成立（note API 取得失敗）。"
            echo ""
            echo '```'
            grep -v '記事 [0-9]*00/' /tmp/note-cover-live.log 2>/dev/null | head -40 || echo "(log なし)"
            echo '```'
            echo ""
            echo "- 登録は Mac の週次: \`npm run note-cover:install -- --status\`（即実行は \`-- --run-now\`・ログ \`~/Library/Logs/doboku-note/note-cover.log\`）"
            echo "- 手元で判定: \`npm run check-note-cover-live\`"
          } > /tmp/note-cover-body.md
          node scripts/report-automation-failure.mjs \
            --channel note-cover-live \
            --title "note カバーの登録残り（rc=${{ steps.check.outputs.rc }}）" \
            --body-file /tmp/note-cover-body.md

      - name: Resolve - note-cover-live Issue (復旧)
        if: success() && github.event_name != 'workflow_dispatch'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/report-automation-failure.mjs --resolve --channel note-cover-live \
            --body "復旧 run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
