name: 🔁 Sync YouTube descriptions

# 投稿済み動画の概要欄を台帳（.claude/state/youtube-schedule.json）の description へ揃える。
#
# 背景（2026-08-13）: SNS 共通設定 sns-common/sns-config.mjs の noteUrl が旧ハンドル
# （HTTP 404）のままで、そこから生成された概要欄が **note への送客が死んだ状態**で公開されていた。
# SSOT を直しても公開済みの概要欄は自動では変わらないので、台帳を正として live へ流す。
#
# **手動трigger 専用**（schedule なし）。収益チャネルへの書き込みなので、既定は dry-run で
# 差分だけ出し、commit=true を明示したときにだけ実更新する。
#
# 前提 Secrets: YOUTUBE_CLIENT_ID / YOUTUBE_CLIENT_SECRET / YOUTUBE_REFRESH_TOKEN
# （ローカルに creds は置かない＝計測・投稿系は CI/CD 供給が正。measurement-incidents.md 2026-06-05）

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "descriptions=概要欄 / thumbnail-inventory=一覧のみ / thumbnail-refresh=確認済みサムネ"
        type: choice
        options: [descriptions, thumbnail-inventory, thumbnail-refresh, migration-upload]
        default: descriptions
      report_public_key:
        description: "サムネ棚卸し用の一時公開鍵（秘密鍵を入力しない）"
        type: string
        default: ""
      commit:
        description: "選択したoperationの実更新（既定 false = 読み取りのみ）"
        type: boolean
        default: false
      plan_sha256:
        description: "thumbnail-refresh の手元で確認した計画SHA-256"
        type: string
        default: ""
      batch_start:
        description: "videoId固定順の開始位置（0始まり）"
        type: string
        default: "0"
      batch_limit:
        description: "処理本数（既定1・最大400）"
        type: string
        default: "1"
      only_video_id:
        description: "試行用の単一videoId（空なら開始位置・本数を使用）"
        type: string
        default: ""
      public_only:
        description: "公開中の対象を先に処理する（公開設定は変更しない）"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync:
    if: inputs.operation == 'descriptions' || inputs.operation == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout develop
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: develop
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Sync descriptions
        id: sync
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -o pipefail
          if [ "${{ inputs.commit }}" = "true" ]; then
            node .claude/scripts/youtube/sync-descriptions.mjs --commit 2>&1 | tee /tmp/yt-sync.log
          else
            node .claude/scripts/youtube/sync-descriptions.mjs 2>&1 | tee /tmp/yt-sync.log
          fi
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Report diff (dry-run)
        if: steps.sync.outputs.exit_code == '2'
        run: |
          echo "::notice::概要欄に台帳との差分があります。反映するには commit=true で再実行してください。"
          tail -40 /tmp/yt-sync.log || true

      - name: Fail on auth/API error
        if: steps.sync.outputs.exit_code == '1'
        run: |
          echo "::error::sync-descriptions.mjs が認証/API エラーで失敗しました。"
          tail -40 /tmp/yt-sync.log || true
          exit 1

      - name: Fail on inspection-not-established
        if: steps.sync.outputs.exit_code == '3'
        run: |
          echo "::error::検査不成立（台帳が無い / videoId を持つ item が 0 件）。0 件を「差分なし」と読まないための明示的な失敗です。"
          tail -40 /tmp/yt-sync.log || true
          exit 1

  thumbnail-inventory:
    if: inputs.operation == 'thumbnail-inventory'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Inventory only (no YouTube writes)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_REPORT_PUBLIC_KEY: ${{ inputs.report_public_key }}
        run: node scripts/youtube-thumbnail-rollout.mjs --mode inventory --out .tmp/youtube-rollout-export
      - name: Export encrypted report only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: youtube-thumbnail-report
          path: .tmp/youtube-rollout-export/*.enc.json
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: warn

  thumbnail-refresh:
    if: inputs.operation == 'thumbnail-refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: youtube-thumbnail-refresh
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Restore approved covers from private transfer storage
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        run: node scripts/stage-youtube-covers.mjs --pull
      - name: Update only checked thumbnails
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_REPORT_PUBLIC_KEY: ${{ inputs.report_public_key }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
          BATCH_START: ${{ inputs.batch_start }}
          BATCH_LIMIT: ${{ inputs.batch_limit }}
          ONLY_VIDEO_ID: ${{ inputs.only_video_id }}
          APPLY_THUMBNAILS: ${{ inputs.commit }}
          PUBLIC_ONLY: ${{ inputs.public_only }}
        run: |
          args=(--mode refresh --out .tmp/youtube-rollout-export --expect-plan-sha256 "$PLAN_SHA256" --start "$BATCH_START" --limit "$BATCH_LIMIT")
          if [ -n "$ONLY_VIDEO_ID" ]; then args+=(--only-video-id "$ONLY_VIDEO_ID"); fi
          if [ "$APPLY_THUMBNAILS" = "true" ]; then args+=(--commit); fi
          if [ "$PUBLIC_ONLY" = "true" ]; then args+=(--public-only); fi
          node scripts/youtube-thumbnail-rollout.mjs "${args[@]}"
      - name: Export encrypted receipts and old thumbnails only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: youtube-thumbnail-report
          path: .tmp/youtube-rollout-export/*.enc.json
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: warn

  migration-upload:
    if: inputs.operation == 'migration-upload'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: youtube-video-migration
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Upload verified replacements privately (no old-video deletion)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_REPORT_PUBLIC_KEY: ${{ inputs.report_public_key }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
          BATCH_START: ${{ inputs.batch_start }}
          BATCH_LIMIT: ${{ inputs.batch_limit }}
          APPLY_MIGRATION: ${{ inputs.commit }}
        run: node scripts/youtube-migration.mjs
      - name: Export encrypted migration receipt only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: youtube-migration-report
          path: .tmp/youtube-migration-export/*.enc.json
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: warn
