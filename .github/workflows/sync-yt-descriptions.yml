name: 🔁 Sync YouTube descriptions

# YouTube のサムネ棚卸し・サムネ更新・動画の移行を手動で回す（schedule なし）。
# 概要欄を旧台帳（youtube-schedule.json）から流す job は 2026-10-09 に旧台帳ごと消した。
# 収益チャネルへの書き込みなので、既定は読み取りのみで、commit=true を明示したときにだけ実更新する。
#
# 前提 Secrets: YOUTUBE_CLIENT_ID / YOUTUBE_CLIENT_SECRET / YOUTUBE_REFRESH_TOKEN
# （ローカルに creds は置かない＝計測・投稿系は CI/CD 供給が正。measurement-incidents.md 2026-06-05）

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "thumbnail-inventory=一覧のみ / thumbnail-refresh=確認済みサムネ / migration-*=動画の移行 / pack-metadata=動画パックの公開済み・予約済みの題名・概要欄・開示を youtube.json に合わせる"
        type: choice
        options: [thumbnail-inventory, thumbnail-refresh, migration-upload, migration-audit, migration-thumbnail, migration-activate, migration-delete, pack-metadata]
        default: thumbnail-inventory
      report_public_key:
        description: "サムネ棚卸し用の一時公開鍵（秘密鍵を入力しない）"
        type: string
        default: ""
      commit:
        description: "選択したoperationの実更新（既定 false = 読み取りのみ）"
        type: boolean
        default: false
      plan_sha256:
        description: "thumbnail-refresh の手元で確認した計画SHA-256"
        type: string
        default: ""
      batch_start:
        description: "videoId固定順の開始位置（0始まり）"
        type: string
        default: "0"
      batch_limit:
        description: "処理本数（既定1・最大400）"
        type: string
        default: "1"
      only_video_id:
        description: "試行用の単一videoId（空なら開始位置・本数を使用）"
        type: string
        default: ""
      pack_ids:
        description: "pack-metadata の対象 packId（カンマ区切り・最大 10）"
        type: string
        default: ""
      public_only:
        description: "公開中の対象を先に処理する（公開設定は変更しない）"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  thumbnail-inventory:
    if: inputs.operation == 'thumbnail-inventory'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Inventory only (no YouTube writes)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_REPORT_PUBLIC_KEY: ${{ inputs.report_public_key }}
        run: node scripts/youtube-thumbnail-rollout.mjs --mode inventory --out .tmp/youtube-rollout-export
      - name: Export encrypted report only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: youtube-thumbnail-report
          path: .tmp/youtube-rollout-export/*.enc.json
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: warn

  thumbnail-refresh:
    if: inputs.operation == 'thumbnail-refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: youtube-thumbnail-refresh
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Restore approved covers from private transfer storage
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        run: node scripts/stage-youtube-covers.mjs --pull
      - name: Update only checked thumbnails
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_REPORT_PUBLIC_KEY: ${{ inputs.report_public_key }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
          BATCH_START: ${{ inputs.batch_start }}
          BATCH_LIMIT: ${{ inputs.batch_limit }}
          ONLY_VIDEO_ID: ${{ inputs.only_video_id }}
          APPLY_THUMBNAILS: ${{ inputs.commit }}
          PUBLIC_ONLY: ${{ inputs.public_only }}
        run: |
          args=(--mode refresh --out .tmp/youtube-rollout-export --expect-plan-sha256 "$PLAN_SHA256" --start "$BATCH_START" --limit "$BATCH_LIMIT")
          if [ -n "$ONLY_VIDEO_ID" ]; then args+=(--only-video-id "$ONLY_VIDEO_ID"); fi
          if [ "$APPLY_THUMBNAILS" = "true" ]; then args+=(--commit); fi
          if [ "$PUBLIC_ONLY" = "true" ]; then args+=(--public-only); fi
          node scripts/youtube-thumbnail-rollout.mjs "${args[@]}"
      - name: Export encrypted receipts and old thumbnails only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: youtube-thumbnail-report
          path: .tmp/youtube-rollout-export/*.enc.json
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: warn

  migration-upload:
    if: startsWith(inputs.operation, 'migration-')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: youtube-video-migration
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Run selected migration phase with verified private receipts
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_REPORT_PUBLIC_KEY: ${{ inputs.report_public_key }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
          BATCH_START: ${{ inputs.batch_start }}
          BATCH_LIMIT: ${{ inputs.batch_limit }}
          APPLY_MIGRATION: ${{ inputs.commit }}
          MIGRATION_OPERATION: ${{ inputs.operation }}
        run: node scripts/youtube-migration.mjs
      - name: Export encrypted migration receipt only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: youtube-migration-report
          path: .tmp/youtube-migration-export/*.enc.json
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: warn

  # 動画パック（content/sns/video-packs）の公開済み・予約済みの通常動画・Shorts の題名・概要欄・開示を、
  # youtube.json に合わせて videos.update し、読み直して照合する（publish-video-pack.cjs --phase metadata）。
  # 予約の publishAt と privacy は今の値を保つ。commit=false は対象の確認だけ（YouTube へ書かない）。
  # 日次の配信 workflow（旧 post-youtube-scheduled）は 2026-10-24 に廃止した（ログインを要る取得・投稿は土曜の Mac 収集 weekly-collect と運営者の端末だけ・DN-0817）ので、こちらの手動専用の workflow に置く。
  pack-metadata:
    if: inputs.operation == 'pack-metadata'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: youtube-video-migration
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Sync pack metadata
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PACK_IDS: ${{ inputs.pack_ids }}
          APPLY: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          IFS=',' read -r -a packs <<< "$PACK_IDS"
          if [ "${#packs[@]}" -eq 0 ] || [ "${#packs[@]}" -gt 10 ]; then
            echo "::error::pack_ids に 1〜10 件の packId（カンマ区切り）が必要です"
            exit 1
          fi
          for pack_id in "${packs[@]}"; do
            pack_id="$(echo "$pack_id" | tr -d '[:space:]')"
            if ! [[ "$pack_id" =~ ^[a-z0-9][a-z0-9-]{2,80}$ ]]; then
              echo "::error::packId の形式が不正です: $pack_id"
              exit 1
            fi
            args=(--pack-id "$pack_id" --phase metadata)
            if [ "$APPLY" != "true" ]; then args+=(--dry-run); fi
            node .claude/scripts/youtube/publish-video-pack.cjs "${args[@]}"
          done
      - name: Commit metadata sync state
        if: inputs.commit
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          node scripts/ci-data.mjs add --paths content/registry
          git diff --cached --quiet && exit 0
          git commit -m "chore(youtube): record pack metadata sync [skip ci]"
          git pull --rebase origin develop
          git push origin HEAD:develop
