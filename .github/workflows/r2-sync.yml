name: R2 Sync Images

# content/site/**/img/** が変更されたとき、R2 に自動同期する。
# 既存 .claude/scripts/upload-images-to-r2.mjs（S3 API）を流用。
# バケットを 1 回一覧して中身（MD5）が変わった画像だけ送る（2026-10-20。旧実装は毎回全件を PutObject していた）。
# MDX は R2 へ置かない（公開 URL で下書きまで読めるため）。
# R2 専用 API Token（access key + secret）で認証。

on:
  # main へ push 時、画像パス変更のみトリガー
  push:
    branches:
      - main
    paths:
      - 'content/site/**/img/**'
      # ogp.png は R2 退避対象（asset-storage.json の site-ogp-png group）へ移行したため、
      # 新規生成時は asset-offload で直接 R2 へ上げる。git 経由の同期は不要になった
      # （旧: img/** だけだと OGP 更新が push で自動同期されず 404 になるため明示的に拾っていた
      # ＝ 2026-06-12 技術士建設部門の note リンクカード不具合。ogp.png は git 追跡対象でなくなる
      # ため、この経路そのものが不要）。

  # 手動実行（初回・緊急・一括同期用）
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run（アップロードせず対象一覧のみ出力）'
        required: false
        default: false
        type: boolean
      force:
        description: '全件を送り直す（Cache-Control を全件に付け直すときなど。既定は変わった画像だけ）'
        required: false
        default: false
        type: boolean

concurrency:
  group: r2-sync-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Sync images to R2 (S3 API)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          ARGS="$ARGS --changed-out $RUNNER_TEMP/r2-changed.json"
          echo "Running: npm run upload-images-r2 -- $ARGS"
          npm run upload-images-r2 -- $ARGS

      # 上書きした画像の CDN キャッシュを URL で消し、通常 URL の実体を SHA-256 で照合する（DN-0756）。
      # 同じ URL への上書きだけでは CDN が max-age（1 日）のあいだ旧版を返す
      - name: Purge CDN cache for changed images and verify
        if: github.event.inputs.dry_run != 'true'
        env:
          CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
        run: node scripts/purge-r2-changed.mjs --list "$RUNNER_TEMP/r2-changed.json"

      # 同期の後に main の画像と R2 の差分を確かめる（未同期・サイズ不一致は赤）。2026-10-24 まで週次の r2-audit.yml が
      # 別に見ていた（Issue も出さず Step Summary だけ）のを、上げた直後のこの段へ移した（DN-0817）。R2 にしか無い画像は許容。
      - name: Verify R2 matches main (images)
        if: github.event.inputs.dry_run != 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_AUDIT_ACCESS_KEY_ID || secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_AUDIT_SECRET_ACCESS_KEY || secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        run: |
          set +e
          node .claude/skills/dev/diff-r2/scripts/diff-r2.mjs --images-only --json > "$RUNNER_TEMP/r2-diff.json"
          rc=$?
          set -e
          node -e '
            const fs = require("fs");
            let d;
            try { d = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); } catch { console.error(`::error::diff-r2 が JSON を返さない（exit=${process.argv[2]}・R2 の読み取りの権限を確かめる）`); process.exit(1); }
            const miss = d.onlyLocal || [], mism = d.sizeMismatch || [];
            const lines = ["## R2 画像の照合", "", `main の画像 ${d.localCount} / R2 ${d.remoteCount} / 未同期 ${miss.length} / サイズ不一致 ${mism.length} / R2 のみ ${(d.onlyRemote || []).length}`];
            for (const x of [...miss, ...mism].slice(0, 15)) lines.push(`- ${x.key}`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            if (miss.length || mism.length) { console.error("::error::main の画像が R2 に揃っていない。force=true で r2-sync を流し直す"); process.exit(1); }
          ' "$RUNNER_TEMP/r2-diff.json" "$rc"

      - name: Summary
        if: always()
        run: |
          echo "## R2 Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Dry run: ${{ github.event.inputs.dry_run || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Force（全件）: ${{ github.event.inputs.force || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Head SHA: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
