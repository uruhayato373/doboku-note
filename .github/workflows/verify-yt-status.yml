name: 🔎 Verify YouTube publish status (weekly)

# .claude/state/youtube-schedule.json の videoId を持つ item を YouTube API(videos.list) と照合し、
# 「台帳は uploaded だが実際は削除/非公開」「publishAt を過ぎたのに未公開」を検知する read-only reconciler。
# 是正はしない（検知・報告のみ）。実装パターン: fetch-metrics.yml（Publish ステップの git 書式を流用）。
#
# 前提 Secrets: YOUTUBE_CLIENT_ID / YOUTUBE_CLIENT_SECRET / YOUTUBE_REFRESH_TOKEN

on:
  schedule:
    - cron: "0 20 * * 4" # JST 05:00 Friday（UTC 20:00 Thursday）
  workflow_dispatch:

# DN-0109 Phase 1: develop への自動書込み系ワークフロー間の push 衝突を防ぐ共通グループ。
# 同時実行を待たせるだけで落とさない（cancel-in-progress: false）。
concurrency:
  group: develop-git-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout develop
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: develop
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # npm ci（--ignore-scripts なし）は prepare で pre-commit フックを入れる。そのフックの
      # check-x-campaign-plan などが src/config/doc-meta-index.json を直接読むが、これは
      # git 追跡外の生成物なので、ここで作らないと **commit の瞬間に ENOENT で落ちる**。
      # 症状はワークフロー全体の赤で、本来の処理が終わっていても記録が残らない。
      - name: Build doc meta index
        run: node .claude/scripts/build-doc-meta-index.mjs --ci


      - name: Verify YouTube publish status
        id: verify
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -o pipefail
          node .claude/scripts/youtube/verify-yt-status.mjs 2>&1 | tee /tmp/yt-verify.log
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      # 動画パック（DN-0110）の派生物照合。Shorts 台帳とは対象が別（台帳＝IG 過去問由来のレガシー、
      # こちら＝video-content-status.json の派生物）。creds 不足・API 失敗は exit 2＝検査不成立で、
      # 記録を書き換えない（偽の緑を残さない）。対象 0 件（公開前）は checked:0 を記録して正常終了。
      - name: Verify video pack publication
        id: verify_packs
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -o pipefail
          node scripts/verify-video-publication.mjs 2>&1 | tee /tmp/video-verify.log
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Publish report to develop (.claude/state/yt-verify/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .claude/state/yt-verify .claude/state/video-publication-verify.json
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi

          git commit -m "chore(youtube): verify-yt-status weekly audit $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git pull --rebase origin develop
          git push origin develop

      - name: Fail on drift (アラート)
        if: steps.verify.outputs.exit_code == '2'
        run: |
          echo "::error::YouTube 公開状態ドリフトを検出（verify-yt-status.mjs）。.claude/state/yt-verify/latest.json を確認してください。"
          exit 1

      - name: Fail on auth/network error
        if: steps.verify.outputs.exit_code == '1'
        run: |
          echo "::error::verify-yt-status.mjs が認証/ネットワークエラーで失敗しました。/tmp/yt-verify.log を確認してください"
          tail -40 /tmp/yt-verify.log || true
          exit 1

      - name: Fail on video pack drift
        if: steps.verify_packs.outputs.exit_code == '1'
        run: |
          echo "::error::動画パックの公開実体にドリフト（削除/非公開/CTA UTM 欠落/関連動画未設定）。.claude/state/video-publication-verify.json を確認してください。"
          tail -40 /tmp/video-verify.log || true
          exit 1

      - name: Fail on video pack verification not possible
        if: steps.verify_packs.outputs.exit_code == '2'
        run: |
          echo "::error::動画パック照合が検査不成立（creds 不足 / API 失敗）。記録は更新していません＝以後 check-video-publication が鮮度切れで赤くなります。"
          tail -40 /tmp/video-verify.log || true
          exit 1
