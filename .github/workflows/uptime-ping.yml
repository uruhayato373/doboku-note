name: Production check (uptime ping + all-URL sweep)

# 本番を外から確かめる 2 つの検査を 1 本にまとめたもの（DN-0853・旧 production-sweep.yml を統合）。
# - ping（1 日 3 回）: 代表 3 ページの SSR・body・GA 計装。下に経緯。Issue channel: uptime
# - sweep（日曜・本番 deploy の成功後・手動の sweep）: sitemap 全 URL を実際に叩く。check-seo-build は out/ の検査で、
#   Cloudflare 層（_redirects・_headers・キャッシュ・R2 の og:image）は本番でしか見えない。
#   検査内容と exit code は scripts/check-production-sweep.mjs ヘッダ、閾値は scripts/lib/production-sweep.mjs。
#   失敗（本番異常 rc=1 / 検査不成立 rc=2）は Issue channel: production-sweep
# 定期実行と workflow_run はデフォルトブランチ（main）の版で動く。
#
# ping: サイト健全性監視（旧 Issue #130-C）。
# BAILOUT_TO_CLIENT_SIDE_RENDERING（2026-W16 事件）のような「200 だが body 空」
# パターンも検出する。失敗時は automation-failure Issue へ起票する（限定例外チャネル）。
# 2026-08-24 まで doc は「task-queue.json に append」と書いていたが、その台帳は
# 2026-06-11 に廃止済みで実体も無く、**失敗がどこにも届かない**状態だった。

on:
  schedule:
    # ping: JST 08:00 / 14:00 / 20:00 (UTC 23:00 / 05:00 / 11:00)
    - cron: "0 23,5,11 * * *"
    # sweep: UTC 20:30 日曜 = JST 05:30 月曜（weekly-review-guard の前）
    - cron: "30 20 * * 0"
  workflow_run:
    workflows: ["Deploy to production (Cloudflare Pages)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      sweep:
        description: "全 URL の検査を回す（false なら代表 3 ページの ping）"
        type: boolean
        default: false
      sample:
        description: "全 URL の検査を先頭 N 件だけ（空なら全件）"
        required: false
        default: ""

permissions:
  contents: read
  # 失敗時に automation-failure Issue を起票する（限定例外）。
  issues: write

jobs:
  ping:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 23,5,11 * * *') || (github.event_name == 'workflow_dispatch' && inputs.sweep != true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Check site health
        id: check
        continue-on-error: true
        run: |
          set +e

          # 注: doboku-note.com は Cloudflare Bot Protection が GitHub Actions IP を
          # 403 でブロックするため、直 URL（doboku-note.pages.dev）で SSR / body を検証する。
          # カスタムドメイン (doboku-note.com) の DNS / CF 設定の問題は別系統で監視する想定。
          # **正規 URL を叩く。** 旧 /docs/ /category/ は `_redirects` の転送元で 301 を返し、
          # この検査は 200 しか通さないので必ず落ちる。実際 IA 移行後ずっと赤で、
          # 「SSR 壊れ」と報告し続けていた（サイトは終始正常・2026-08-30 実測）。
          # 毎回オオカミ少年になる監視は、本物の障害が来ても見分けられない＝無いのと同じ。
          URLS=(
            "https://doboku-note.pages.dev/"
            "https://doboku-note.pages.dev/exam/pe-comprehensive-management/guide/keyword-2026"
            "https://doboku-note.pages.dev/exam/civil-construction-1"
          )

          UA_DESKTOP="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          UA_MOBILE="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"

          FAILURES=()

          for URL in "${URLS[@]}"; do
            for UA_LABEL in desktop mobile; do
              if [ "$UA_LABEL" = "mobile" ]; then
                UA="$UA_MOBILE"
              else
                UA="$UA_DESKTOP"
              fi

              RESULT=$(curl -sS -o /tmp/body.html -w "%{http_code}|%{size_download}" \
                --max-time 15 -A "$UA" "$URL" 2>/dev/null)
              CURL_CODE=$?
              CODE=$(echo "$RESULT" | cut -d'|' -f1)
              SIZE=$(echo "$RESULT" | cut -d'|' -f2)

              if [ $CURL_CODE -ne 0 ]; then
                FAILURES+=("$URL [$UA_LABEL] curl failed (exit $CURL_CODE)")
                continue
              fi

              if [ "$CODE" != "200" ]; then
                FAILURES+=("$URL [$UA_LABEL] HTTP $CODE (size=$SIZE)")
                continue
              fi

              # SSR 検証: <main> タグと body 内の実コンテンツを確認
              # BAILOUT_TO_CLIENT_SIDE_RENDERING 対策として、単なる status/size だけでなく
              # 実際にコンテンツがレンダリングされているかをチェック
              if [ "$SIZE" -lt 10000 ]; then
                FAILURES+=("$URL [$UA_LABEL] body too small (size=$SIZE < 10000)")
                continue
              fi

              if ! grep -q '<main' /tmp/body.html; then
                FAILURES+=("$URL [$UA_LABEL] no <main> element (size=$SIZE)")
                continue
              fi

              # 主要コンテンツキーワードが body に含まれるか
              if ! grep -qE '土木|doboku-note|技術士|1級' /tmp/body.html; then
                FAILURES+=("$URL [$UA_LABEL] no content keywords matched (size=$SIZE)")
                continue
              fi

              # GA 計装検証: gtag スクリプトが SSR HTML に載っているか。
              # GoogleAnalytics を client-gating 等に変えると gtag が SSR から消え本番 GA が
              # 停止する regression（2026-07-03 #6）を機械検知する。pages.dev でも script tag
              # 自体は在る（config のみ hostname で抑止）ので、この検査は全 URL で成立する。
              if ! grep -q 'googletagmanager' /tmp/body.html; then
                FAILURES+=("$URL [$UA_LABEL] no GA script (googletagmanager) — GA 計装が SSR HTML から消失")
                continue
              fi

              echo "OK: $URL [$UA_LABEL] size=$SIZE"
            done
          done

          if [ ${#FAILURES[@]} -gt 0 ]; then
            {
              echo "## Uptime ping 失敗検出"
              echo ""
              echo "**検出時刻**: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo ""
              echo "### 失敗項目"
              for F in "${FAILURES[@]}"; do
                echo "- $F"
              done
              echo ""
              echo "### 判定ロジック"
              echo "- HTTP 200 以外"
              echo "- response body < 10KB（空に近い HTML）"
              echo "- \`<main>\` タグ不在"
              echo "- 主要キーワード（土木/doboku-note/技術士/1級）非含有 = SSR 壊れの兆候"
              echo ""
              echo "### 参考"
              echo "- 2026-W16 事件（BAILOUT_TO_CLIENT_SIDE_RENDERING / 6 日データ欠損）の再発防止"
              echo "- 関連: .claude/reference/measurement-incidents.md（2026-W16 BAILOUT）"
              echo "- workflow: \`.github/workflows/uptime-ping.yml\`（ping ジョブ）"
            } > /tmp/failure-report.md

            echo "failed=true" >> $GITHUB_OUTPUT
            cat /tmp/failure-report.md
            exit 1
          fi

          echo "failed=false" >> $GITHUB_OUTPUT

      # タスク自動化(task-queue.json/build-todo)は廃止(2026-06-11、.claude/todo/ 手動運用へ一本化)。
      # SSR 壊れ等は CI 失敗として即通知（2026-W16 BAILOUT 再発監視）。人が .claude/todo/ に手動起票する。
      # ::error:: は run のログに出るだけで、人が見に行かないと届かない。
      # open Issue にして初めて通知が飛ぶ（information-architecture.md の限定例外）。
      - name: Report failure (automation-failure Issue)
        if: steps.check.outputs.failed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "SSR 壊れ / body 空 / HTTP エラーのいずれか。2026-W16 BAILOUT の再発監視。"
            echo "run のログで、どの URL がどう落ちたかを確認する。"
          } > /tmp/uptime-body.md
          node scripts/report-automation-failure.mjs \
            --channel uptime \
            --title "サイト健全性チェック失敗（uptime-ping）" \
            --body-file /tmp/uptime-body.md

      # 健全に戻ったら uptime channel の open Issue を自動クローズ（1 日 3 回走るので復旧は同日中に閉じる）。
      - name: Resolve uptime Issue (復旧)
        if: steps.check.outputs.failed == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/report-automation-failure.mjs --resolve --channel uptime \
            --body "復旧 run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Fail on uptime failure (アラート)
        if: steps.check.outputs.failed == 'true'
        run: |
          echo "::error::サイト健全性チェック失敗（SSR 壊れ / body 空 / HTTP エラー）。2026-W16 BAILOUT 再発監視。automation-failure Issue を起票済み。"
          exit 1

  sweep:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '30 20 * * 0') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && inputs.sweep == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # deploy 直後は Cloudflare のエッジ伝播が数十秒遅れることがある。1 分待ってから叩く。
      - name: Wait for edge propagation
        if: ${{ github.event_name == 'workflow_run' }}
        run: sleep 60

      # 依存ゼロ（node:child_process + curl）なので npm ci しない。
      - name: Sweep production
        id: sweep
        env:
          SAMPLE: ${{ inputs.sample }}
        run: |
          set +e
          ARGS=""
          [ -n "$SAMPLE" ] && ARGS="--sample $SAMPLE"
          node scripts/check-production-sweep.mjs $ARGS 2>&1 | tee /tmp/sweep.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          {
            echo "## Production sweep（rc=$rc）"
            echo '```'
            head -60 /tmp/sweep.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Report - production anomaly
        if: failure() && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "本番全 URL スイープが失敗（rc=${{ steps.sweep.outputs.rc }}）。rc=1 は本番異常（非 200・転送元が sitemap に混入・canonical ずれ・og:image 欠落・セキュリティヘッダ不足）、rc=2 は検査不成立（sitemap 取得不可・接続失敗 5% 超）。"
            echo ""
            echo '```'
            head -80 /tmp/sweep.log 2>/dev/null || echo "(log なし)"
            echo '```'
            echo ""
            echo "- 再実行: \`gh workflow run uptime-ping.yml -f sweep=true\`（手元: \`npm run check-production-sweep -- --sample 50\`）"
            echo "- 判定: \`scripts/lib/production-sweep.mjs\` / 実行: \`scripts/check-production-sweep.mjs\`"
          } > /tmp/sweep-body.md
          node scripts/report-automation-failure.mjs \
            --channel production-sweep \
            --title "本番スイープ失敗（rc=${{ steps.sweep.outputs.rc }}）" \
            --body-file /tmp/sweep-body.md

      # 全 URL が健全に戻ったら production-sweep channel の open Issue を自動クローズ（起票と対）。
      - name: Resolve - production-sweep Issue (復旧)
        if: success() && github.event_name != 'workflow_dispatch'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/report-automation-failure.mjs --resolve --channel production-sweep \
            --body "復旧 run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
