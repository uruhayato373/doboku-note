name: Pre-merge check (quality audit + build)

on:
  pull_request:
    branches: [main, develop]
  # automerge のマージは GITHUB_TOKEN なので push の CI が起動しない。automerge がこの入口で develop の先頭を検査する
  workflow_dispatch:
  push:
    branches: [develop]
    # 記憶と台帳だけの push は CI を走らせない（PR は従来どおり全検査）。
    # 2026-11-01〜06 の push の実行 300 回のうち 112 回がこれで、この push に取り消された実行も 26 回あった。
    # ゲートは pre-commit（check-memory・check-backlog-schema・check-task-plan-links・project-task-refs・
    # search-improvements）と todo:add の addCard。ここに足すなら tests/ci-push-scope.test.mjs も直す。
    paths-ignore:
      - '.claude/memory/**'
      - '.claude/todo/**'
      - '.claude/state/todo-claims.json'

# PR は新しい push が来たら古い実行を止める（結果を待つ意味が無い）。
# develop は止めない（2026-11-11）。実行中の 1 本は最後まで走り、待ちは最新の 1 本だけ残る（古い待ちは GitHub が取り消す）。
# 止めていた間は push が続くと結果が出ず、2026-11-10〜11 の 9 時間で 36 回のうち 18 回を取り消し（うち 6 回は 4〜6 分走った後）、
# 赤い develop に気づくのも昇格（deploy:main は緑を待つ）も遅れていた。最新の push の結果は最長で 2 周待つ。
# 失敗 Issue の起票・解消は実行の順に起きるので、最後に終わった実行の結果が残る。
concurrency:
  group: pre-merge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # 失敗時に automation-failure Issue を起票する（限定例外チャネル）。
  issues: write

jobs:
  # 品質検査とビルドは互いの出力を使わないので、別ジョブで並行に走らせる（2026-09-30）。
  # 1 ジョブで直列だと 品質検査 156s + ビルド 148s + SEO 55s が積み上がっていた。
  # unit-tests も別ジョブ（test）に分けた（2026-11-11）。audit の中では並列分が終わった後に 1 本で約 2 分走り、
  # audit 6.9 分のうち 123 秒を占めていた。
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      # 依存の既知脆弱性（high 以上）を job summary に出すだけで、red にはしない（DN-0242）。
      # CodeQL と Socket は GitHub 側の既定セットアップで別に走っている。audit fix は自動適用しない
      # （ERESOLVE 環境で依存が勝手に動くため）。
      - name: npm audit (report only)
        run: |
          {
            echo "### npm audit（high 以上・report only）"
            echo '```'
            npm audit --audit-level=high 2>&1 | tail -n 40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # doc-meta-index.json は git 追跡から外した生成物（2026-08-29・履歴肥大の再発防止）。
      # ビルド時に自動生成されるが、それより前に走る quality:audit:ci の各検査が
      # src/config/doc-meta-index.json を直接読むため、ここで明示的に生成しておく。
      - name: Build doc meta index
        run: node .claude/scripts/build-doc-meta-index.mjs --ci

      # auditジョブも生成物を自分で検査する。別のbuildジョブの存在に依存してskipしない。
      - name: Build standards data for audit
        run: npm run build-standards-data

      # 機械品質チェックを横断実行（type-check / test / validate-mdx / eslint /
      # ラチェット / frontmatter / svg / image / links / 台帳整合 等を1ステップに集約）。
      # 個別ステップの真実源は scripts/quality-audit.mjs の CHECKS(ci:true)。
      # Kindle の配布 EPUB・表紙（scripts/kindle-dist）は private R2 に退避してあり git には無い（DN-0562・2026-10-12）。
      # check-kindle-epub-leak（quality:audit:ci）が展開して読むので、検査の前に取り戻す。
      # 取り戻せなければここで赤になる（読めないまま 0 冊で検査しない）。
      - name: Hydrate Kindle dist (private R2)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        run: node scripts/asset-hydrate.mjs --group kindle-dist

      # unit-tests は test ジョブが回す。手元の npm run quality:audit:ci は全部回す。
      - name: Quality audit (ci gate)
        run: npm run quality:audit:ci -- --except unit-tests

  # unit-tests（tests/*.test.mjs・3,000 件超）。quality-audit 経由で回し、失敗行の抜き出し・timeout・検査不成立の扱いを audit と揃える。
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      # テストが読む git 管理外の生成物を、audit の中で走っていたときと同じにそろえる
      # （doc-meta-index・Kindle の配布物・refresh-indexes が書く public/quiz と public/standards-data）。
      - name: Build doc meta index
        run: node .claude/scripts/build-doc-meta-index.mjs --ci

      - name: Hydrate Kindle dist (private R2)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        run: node scripts/asset-hydrate.mjs --group kindle-dist

      - name: Refresh generated indexes
        run: npm run refresh-indexes

      - name: Unit tests
        run: npm run quality:audit:ci -- --only unit-tests


  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      # doc-meta-index.json は git 追跡から外した生成物（2026-08-29・履歴肥大の再発防止）。
      # ビルド時に自動生成されるが、それより前に走る quality:audit:ci の各検査が
      # src/config/doc-meta-index.json を直接読むため、ここで明示的に生成しておく。
      - name: Build doc meta index
        run: node .claude/scripts/build-doc-meta-index.mjs --ci

      # Next.js のビルドキャッシュ（Turbopack のファイルシステムキャッシュ）を実行間で引き継ぐ。
      # 形は node_modules/next/dist/docs/01-app/02-guides/ci-build-caching.md の GitHub Actions 例。
      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.js', 'src/**/*.jsx', 'src/**/*.ts', 'src/**/*.tsx', 'src/**/*.mjs', 'next.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build

      # build 依存の SEO ゲートは build 直後にのみ置く（build 前の quality:audit:ci へは混ぜない）。
      # out/ を突合するので Build の後。quality-audit（Build より前に走る）へ入れると
      # 常に out/ 不在で検査不成立になる。
      - name: Check E2E targets (out/)
        run: npm run check-e2e-targets

      # --summary-out は warn（jsonld_recommended_missing など）が CI ログにしか残らず誰も読んでいなかった問題（DN-0676）への対応。
      # 結果は publish-seo-summary ジョブが data/analysis/seo-build-summary.json へ足し、週次レビューの下書きが前週比を出す。
      - name: Check build-time SEO (out/)
        id: seo_build
        run: npm run check-seo-build:ci -- --summary-out "$RUNNER_TEMP/seo-build-run.json"

      # /standards が説明文を増やし一覧のリンク密度を落としていないか（config/standards-page-density.json）。
      - name: Check standards page density (out/)
        run: npm run check-standards-density

      # error で落ちた run の件数も履歴に要る。check の成否にかかわらず上げる（無ければ publish 側が何もしない）。
      - name: Upload SEO build summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seo-build-run
          path: ${{ runner.temp }}/seo-build-run.json
          if-no-files-found: ignore
          retention-days: 3

      # client に同梱される JS 1 本の上限（DN-0684・2026-10-11）。/search のチャンクに doc-meta-index.json が入って
      # 1.66MB になっていた。client component の import 1 行で再発するので build の直後に止める。
      - name: Check client chunk size (out/)
        run: npm run check-client-chunk-size

      # --built は「学習系ナビに career 記事が混ざっていないか」を out/ の HTML で見る。
      # 2026-09 の URL 分割で走査先が out/docs のまま取り残され、誰も起動していなかったため
      # 壊れたまま気づかれなかった。ここに置いて読み手を作る（0 箇所なら検査不成立で赤）。
      - name: Check career separation (out/)
        run: npm run check-career-separation:built

      # 「CI が赤い」ことを人へ届ける唯一の経路（2026-08-24 新設）。
      #
      # これが無かった間、develop の Pre-merge check は 2026-08-19 から **24 連続で赤**だったのに
      # 2 日間誰も気づかなかった。赤は GitHub の Status バッジにしか現れず、それを読む機械・
      # スキル・ダッシュボード・週次レビューがリポジトリ内に 1 つも無かった（実査）。
      # branch protection は採用しない——CI bot が develop へ直 push する設計（fetch-metrics /
      # cloudflare-metrics 等）と main への ff 昇格を壊すため。通知で代替する。
      #
      # report-automation-failure.mjs が重複防止を担う（同 channel の open Issue があれば
      # コメント追記）。復旧は下の Resolve step（develop push の成功）で自動クローズする
      # （2026-09-18 まで「クローズは人間」だったが、復旧しても誰も閉じず通知チャネルが死んでいた）。
      # 起票は develop への push だけ。PR の赤は PR 画面に出て作者が見る（30 日で 58 敗のうち 37 敗が PR で、
      # 全部を同じ Issue にコメント追記していたため本物の develop の赤が埋もれていた）。

  # check-seo-build の結果（検査数・error・warn の型別件数）を data/analysis/ の履歴へ足して develop へ書き戻す（DN-0676）。
  # develop への push だけ。書き込み権限をこのジョブに閉じ、PR の build ジョブには渡さない。
  publish-seo-summary:
    needs: [build]
    if: always() && github.event_name == 'push' && github.ref_name == 'develop' && needs.build.result != 'skipped' && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: develop-git-write
      cancel-in-progress: false

    steps:
      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop

      - name: Download SEO build summary
        id: download
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: seo-build-run
          path: ${{ runner.temp }}/seo-build

      - name: Setup Node.js
        if: steps.download.outcome == 'success'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        if: steps.download.outcome == 'success'
        run: npm ci --legacy-peer-deps

      - name: Publish SEO build summary
        if: steps.download.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          node scripts/record-seo-build-summary.mjs "$RUNNER_TEMP/seo-build/seo-build-run.json"
          node scripts/ci-data.mjs add --datasets analysis.seo-build-summary
          if git diff --cached --quiet; then
            echo "No SEO build summary changes to publish"
            exit 0
          fi
          git commit -m "chore(seo): build 後 SEO スキャンの件数を記録 $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git fetch origin develop
          git rebase origin/develop
          git push origin HEAD:develop

  # 失敗 Issue の起票と解消は、3 ジョブの結果を見て 1 か所で行う。
  report:
    needs: [audit, test, build]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # actions: read は、最後に成功した run の commit を読むため（赤を入れた範囲を Issue に載せる）
    permissions:
      contents: read
      issues: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Report failure (automation-failure Issue)
        if: github.event_name == 'push' && (needs.audit.result == 'failure' || needs.test.result == 'failure' || needs.build.result == 'failure')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- branch: \`${{ github.ref_name }}\` / sha: \`${{ github.sha }}\`"
            echo "- trigger: ${{ github.event_name }}"
            echo
            echo "どのゲートが落ちたかは run のログ（Quality audit / Unit tests / Build / SEO）を見る。"
            echo "ローカル再現: \`npm run quality:audit:ci\`"
            # 赤を入れた範囲: 最後に成功した run の commit から今回まで。並行セッションのどの変更かを件名で見分ける（DN-1133）。
            # checkout は浅いので compare API で読む。取れなくても起票は続ける。
            BASE=$(gh run list --workflow ci.yml --branch develop --status success --limit 1 --json headSha --jq '.[0].headSha // ""' || true)
            if [ -n "$BASE" ]; then
              echo
              echo "最後の緑（\`${BASE:0:9}\`）から今回までの commit（新しい 20 件まで）:"
              gh api "repos/${{ github.repository }}/compare/${BASE}...${{ github.sha }}" --jq '.commits[-20:][] | "- `\(.sha[0:9])` \(.commit.message | split("\n")[0])"' || echo "- （取得できなかった）"
            fi
          } > /tmp/ci-body.md
          node scripts/report-automation-failure.mjs \
            --channel pre-merge \
            --title "Pre-merge check が赤（${{ github.ref_name }}）" \
            --body-file /tmp/ci-body.md

      # develop への push が緑になったら pre-merge channel の open Issue を自動クローズする。
      # PR の成功では閉じない（PR が緑でも develop 本体が赤いままのことがある）。
      - name: Resolve pre-merge Issue (develop が緑)
        if: github.event_name == 'push' && github.ref_name == 'develop' && needs.audit.result == 'success' && needs.test.result == 'success' && needs.build.result == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/report-automation-failure.mjs --resolve --channel pre-merge \
            --body "復旧 run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
