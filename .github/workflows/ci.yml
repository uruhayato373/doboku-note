name: Pre-merge check (type + test + build)

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Type Check
        run: npm run type-check

      - name: Unit Tests
        run: npm test

      - name: Validate MDX
        run: npm run validate-mdx

      - name: Build
        run: npm run build
