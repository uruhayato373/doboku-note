name: Lighthouse CI

# PSI（.claude/config/psi-config.json）は本番の事後計測（毎日22URL・CrUX field データ）で、
# マージ前に LCP 画像肥大や a11y スコア低下を止める手段が無かった（DN-0240）。
# ここでは build 成果物（npm run serve・e2e.yml と同じ静的配信）に対し代表4ページで
# lighthouserc.json の閾値を強制する。しきい値は lighthouserc.json が SSOT で、
# psi-config.json（本番 field 監視・閾値は別の目的で別の値）とは二重管理しない。
# 役割の違いは .claude/knowledge/reference/commands.md を参照。

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "content/**"
      - "next.config.mjs"
      - "lighthouserc.json"
      - ".github/workflows/lighthouse.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      # src/config/doc-meta-index.json はビルド生成物で git 追跡していない（ci.yml / e2e.yml と同じ理由）。
      - name: Build doc meta index
        run: node .claude/scripts/build-doc-meta-index.mjs --ci

      - name: Build
        run: npm run build

      - name: Run Lighthouse CI
        run: npx lhci autorun --config=lighthouserc.json

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports-${{ github.run_attempt }}
          path: .lighthouseci/
          if-no-files-found: ignore
