name: Lighthouse CI

# PSI（config/psi-config.json）は本番の事後計測（毎日22URL・CrUX field データ）で、
# 本番へ出す前に LCP 画像肥大や a11y スコア低下を止める手段が無かった（DN-0240）。
# ここでは build 成果物（npm run serve・e2e.yml と同じ静的配信）に対し代表4ページで
# lighthouserc.json の閾値を強制する。しきい値は lighthouserc.json が SSOT で、
# psi-config.json（本番 field 監視・閾値は別の目的で別の値）とは二重管理しない。
# 役割の違いは .claude/knowledge/reference/commands.md を参照。

# 毎晩 develop を測る。PR ごとの 8 分の待ちをやめ、失敗は Issue にする。deploy:main は未解決の Issue があると止まる。
# schedule はデフォルトブランチ（main）版の workflow で動くが、checkout は develop に向ける。
on:
  schedule:
    - cron: "30 18 * * *" # UTC 18:30 = JST 03:30
  workflow_dispatch:

permissions:
  contents: read
  issues: write # 夜間 run の失敗を automation-failure Issue に記録する（限定例外）

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      # src/config/doc-meta-index.json はビルド生成物で git 追跡していない（ci.yml / e2e.yml と同じ理由）。
      - name: Build doc meta index
        run: node .claude/scripts/build-doc-meta-index.mjs --ci

      - name: Build
        run: npm run build

      - name: Run Lighthouse CI
        run: npx lhci autorun --config=lighthouserc.json

      # 夜間 run は PR に紐づかず誰も見ないので、失敗を Issue にする。
      - name: Report - nightly Lighthouse failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "develop の夜間 Lighthouse が閾値を割った。"
            echo ""
            echo "- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- 再現: \`npm run build && npx lhci autorun --config=lighthouserc.json\`"
          } > /tmp/lighthouse-body.md
          node scripts/report-automation-failure.mjs \
            --channel lighthouse-nightly \
            --title "develop 夜間 Lighthouse 失敗" \
            --body-file /tmp/lighthouse-body.md

      # 夜間 run が緑に戻ったら lighthouse-nightly channel の open Issue を自動クローズ（起票と対）。
      - name: Resolve - nightly Lighthouse Issue (復旧)
        if: success() && github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/report-automation-failure.mjs --resolve --channel lighthouse-nightly \
            --body "復旧 run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports-${{ github.run_attempt }}
          path: .lighthouseci/
          if-no-files-found: ignore
