name: "Ops Write (CI write operations)"

# workflow_dispatch 専用。外部サービス（note / ココナラ / Brain / KDP / X）への**書き込み**を
# CI から実行する唯一の入口。実行できる operation は .claude/config/ci-write-operations.json
# （カタログ・18 操作）だけで、この choice の並びはそのキーと同期させる（check-playwright-auth-wiring
# の 9 番目の検査がカタログと playwright-auth-profiles.json ci.writeScripts の整合を見る）。
#
# 安全境界（scripts/lib/ci-write-gate.mjs・scripts/ops-write.mjs）: 人は Mac で
# `npm run ops-write:plan -- --operation <id> --args '<json>'` を叩いて plan hash を得て
# 内容を確認する。ここへは args と一緒にその hash（plan_sha256）を渡す。CI は checkout した
# tree で plan を**再計算**し、一致したときだけ DOBOKU_CI_WRITE_PLAN_SHA256 を子プロセスにだけ
# 付けて実行する。不一致（確認後に記事や引数が変わった）は ops-write.mjs 側が exit 2 で
# 何もしない。resolver（playwright-auth-profile.mjs）は write script にこの env が無いと
# profile を返さないので、カタログ外・hash 無しの書き込みは起動できない。
#
# workflow-health.json には載せない: dispatch 専用で、人が明示的に叩いたときだけ動く操作の
# ため「動いているはずの時刻に動いたか」という age watchdog の対象にならない
# （login-collectors.yml のような cron 定期実行とは性質が違う）。

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "実行する操作（.claude/config/ci-write-operations.json のキー。カタログと同期。check-playwright-auth-wiring (9) が検査）"
        required: true
        type: choice
        options:
          - note.sync-tags
          - note.update-body
          - note.update-cover
          - note.update-partial
          - note.publish
          - note.price-sweep
          - note.append-cta
          - note.magazine-add-articles
          - note.attach-file
          - note.membership-plan-edit
          - coconala.publish
          - coconala.edit
          - brain.publish
          - brain.profile-edit
          - kdp.publish
          - x.article-publish
          - x.thread-replies
          - instagram.publish-bs
      args:
        description: "operation の引数（JSON 文字列。例: {\"article\":\"content/note/foo/article.md\"}）"
        required: false
        default: "{}"
        type: string
      plan_sha256:
        description: "npm run ops-write:plan で得た plan hash（64桁 hex）。commit=true のときだけ照合する"
        required: false
        default: ""
        type: string
      commit:
        description: "true で実際に書き込みを実行する（false は plan の再確認のみ・何も書き込まない）"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      service: ${{ steps.resolve.outputs.service }}
      playwright: ${{ steps.resolve.outputs.playwright }}
    steps:
      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # カタログから service を取り、playwright:false（instagram-graph 等の API 経路）を判定する。
      # playwright:false の service は restore-auth-state を経由しない。
      - name: Resolve service from catalog
        id: resolve
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          node -e "
            const fs = require('fs');
            const catalog = JSON.parse(fs.readFileSync('.claude/config/ci-write-operations.json', 'utf8'));
            const op = catalog.operations[process.env.OPERATION];
            if (!op) { console.error('unknown operation: ' + process.env.OPERATION); process.exit(1); }
            const playwright = op.playwright === false ? 'false' : 'true';
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'service=' + op.service + '\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'playwright=' + playwright + '\n');
            console.log('service=' + op.service + ' playwright=' + playwright);
          "

  write:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: auth-state-${{ needs.resolve.outputs.service }}
      cancel-in-progress: false
    # environment: external-writes を要求すると、Environment を作っていない間は
    # GitHub がそれを無視せず job そのものを失敗させる。作成するまでコメントアウトしておく。
    # environment: external-writes
    permissions:
      contents: write
      issues: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      DOBOKU_AUTH_AGE_IDENTITY: ${{ secrets.DOBOKU_AUTH_AGE_IDENTITY }}
    steps:
      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      # --ignore-scripts を付けない。prepare が pre-commit フックを入れ、Publish ledger
      # ステップの git commit にもフルゲートが走るようにするため（ogp-supply.yml と同じ判断）。
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # doc-meta-index.json は git 追跡から外した生成物。無いと Publish ledger の
      # git commit で pre-commit フックが ENOENT で落ちる（ci.yml / ogp-supply.yml と同じ配線）。
      - name: Build doc meta index
        run: node .claude/scripts/build-doc-meta-index.mjs --ci

      - name: Restore auth state
        id: restore
        if: needs.resolve.outputs.playwright != 'false'
        continue-on-error: true
        uses: ./.github/actions/restore-auth-state
        with:
          service: ${{ needs.resolve.outputs.service }}

      # playwright:false（API 経路）は restore を経由しないので常に実行してよい。
      # playwright 経路は restore が authenticated を返したときだけ実行する。
      - name: Execute ops-write
        id: exec
        if: needs.resolve.outputs.playwright == 'false' || steps.restore.outputs.status == 'authenticated'
        continue-on-error: true
        env:
          OPERATION: ${{ inputs.operation }}
          ARGS: ${{ inputs.args }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
          COMMIT_FLAG: ${{ inputs.commit == true && '--commit' || '' }}
        run: |
          set +e
          node scripts/ops-write.mjs exec \
            --operation "${OPERATION}" \
            --args "${ARGS}" \
            --plan-sha256 "${PLAN_SHA256}" \
            ${COMMIT_FLAG}
          rc=$?
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"

      - name: Writeback auth state (auth:ci-writeback)
        if: always() && needs.resolve.outputs.playwright != 'false' && steps.restore.outcome == 'success' && steps.restore.outputs.status == 'authenticated'
        run: |
          node scripts/playwright-auth.mjs ci-writeback --service "${{ needs.resolve.outputs.service }}" --collector-exit "${{ steps.exec.outputs.rc || 1 }}" --json

      # カタログの op.ledger に列挙された台帳パスだけを commit する（ledger が空の操作は
      # 差分が無ければ何もしない）。commit → fetch → rebase → push の順を厳守する
      # （逆順だと staged な index が残ったまま rebase して失敗する。ogp-supply.yml の実害と同型・
      # check-workflow-publish-ref.mjs の auditGitPublishOrder が検査する順序）。
      - name: Publish ledger
        if: always() && steps.exec.outputs.rc == '0'
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          node -e "
            const fs = require('fs');
            const catalog = JSON.parse(fs.readFileSync('.claude/config/ci-write-operations.json', 'utf8'));
            const op = catalog.operations[process.env.OPERATION];
            for (const p of (op.ledger || [])) console.log(p);
          " > /tmp/ops-write-ledger-paths.txt

          if [ -s /tmp/ops-write-ledger-paths.txt ]; then
            xargs -a /tmp/ops-write-ledger-paths.txt git add
          fi

          if git diff --cached --quiet; then
            echo "ledger に差分なし（この操作に ledger が無い、または変化なし）。commit しない。"
          else
            git commit -m "chore(ops-write): ${OPERATION} $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            git fetch origin develop
            git rebase origin/develop
            git push origin HEAD:develop
          fi

      - name: Report failure
        if: always() && steps.exec.outputs.rc != '0'
        run: |
          node scripts/report-automation-failure.mjs \
            --channel "ops-write-${{ needs.resolve.outputs.service }}" \
            --title "ops-write ${{ inputs.operation }} failed (rc=${{ steps.exec.outputs.rc }})" \
            --body "operation=${{ inputs.operation }} hash=${{ inputs.plan_sha256 }} rc=${{ steps.exec.outputs.rc }}"

      - name: Resolve failure channel on success
        if: always() && steps.exec.outputs.rc == '0' && inputs.commit == true
        run: |
          node scripts/report-automation-failure.mjs --resolve --channel "ops-write-${{ needs.resolve.outputs.service }}"

      - name: Cleanup auth root
        if: always() && needs.resolve.outputs.playwright != 'false'
        run: rm -rf "${DOBOKU_AUTH_ROOT}"

      - name: Fail job on non-zero exec rc
        if: always() && steps.exec.outputs.rc != '0'
        run: exit 1
