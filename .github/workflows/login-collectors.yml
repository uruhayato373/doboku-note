name: "🔐 Login collectors (encrypted state)"

# サービスごとの Playwright ログイン収集を、Mac のローカル手動実行から GitHub Actions（hosted runner）へ
# 移す仕組み。認証は Mac 側で事前に取得した storageState を age で暗号化して R2 に置き、
# ここでは DOBOKU_AUTH_AGE_IDENTITY（GitHub Secret）で復号するだけ（対話ログインはしない）。
# 対象サービス・許可スクリプト・cron は .claude/config/playwright-auth-profiles.json（ci ブロック）が
# 唯一の真実源。ci.enabled=false の間は plan が 0 件を返し、このワークフロー自体は緑のまま沈黙する
# （canary 開始までは「動いているか」を watchdog（workflow-health.json）で見ない）。
#
# cron は登録済み全サービスの ci.cron の和集合（JST は UTC+9）:
on:
  schedule:
    - cron: "20 21 * * 1" # a8       月 21:20 UTC = 火 06:20 JST
    - cron: "20 21 * * 2" # coconala 火 21:20 UTC = 水 06:20 JST
    - cron: "20 21 * * 3" # note     水 21:20 UTC = 木 06:20 JST
    - cron: "50 21 * * 3" # brain    水 21:50 UTC = 木 06:50 JST
    - cron: "40 21 15,27 * *" # kdp  15/27日 21:40 UTC = 16/28日 06:40 JST
    - cron: "10 22 * * 5" # x        金 22:10 UTC = 土 07:10 JST
    - cron: "20 21 2 * *" # google   毎月2日 21:20 UTC = 3日 06:20 JST
    - cron: "30 22 3 * *" # afb      毎月3日 22:30 UTC = 4日 07:30 JST
    - cron: "40 21 * * 4" # instagram 木 21:40 UTC = 金 06:40 JST（Meta 利用制限中は Graph API 不可＝Playwright 照合）
  workflow_dispatch:
    inputs:
      service:
        description: "対象サービス（all で登録済み全サービス）"
        type: choice
        default: all
        options:
          - all
          - a8
          - kdp
          - coconala
          - note
          - brain
          - x
          - google
          - afb
          - instagram
      mode:
        description: "collect=収集まで実行 / probe-only=認証状態の復元確認のみ"
        type: choice
        default: collect
        options:
          - collect
          - probe-only

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build plan (ci-plan)
        id: plan
        run: |
          set +e
          node scripts/playwright-auth.mjs ci-plan \
            --event "${{ github.event_name }}" \
            --schedule "${{ github.event.schedule }}" \
            --service "${{ inputs.service || 'all' }}" \
            --mode "${{ inputs.mode || 'collect' }}" \
            --json > plan.json
          rc=$?
          set -e
          cat plan.json

          if [ "$rc" = "2" ]; then
            echo "::error::auth ci-plan が invalid（検査不成立）。.claude/config/playwright-auth-profiles.json の ci ブロックを確認してください。"
            exit 2
          fi
          if [ "$rc" != "0" ]; then
            echo "::error::auth ci-plan が失敗しました（rc=$rc）。"
            exit "$rc"
          fi

          matrix=$(node -e "console.log(JSON.stringify(JSON.parse(require('fs').readFileSync('plan.json','utf8')).matrix))")
          count=$(node -e "console.log(JSON.parse(require('fs').readFileSync('plan.json','utf8')).matrix.length)")
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "plan: ${count} 件"

  collect:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
      max-parallel: 1
      fail-fast: false
    concurrency:
      group: auth-state-${{ matrix.service }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      DOBOKU_AUTH_AGE_IDENTITY: ${{ secrets.DOBOKU_AUTH_AGE_IDENTITY }}
    steps:
      # 同時起動の cron が同じ瞬間に外部サイトへ集中しないための分散。
      - name: Jitter
        run: sleep $((RANDOM % 600))

      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build doc meta index
        run: node .claude/scripts/build-doc-meta-index.mjs --ci

      - name: Restore auth state
        id: restore
        continue-on-error: true
        uses: ./.github/actions/restore-auth-state
        with:
          service: ${{ matrix.service }}

      # --- サービス別 collector。matrix は 1 job = 1 service なので実際に走るのは 1 本だけ。---
      - name: "a8: fetch + normalize"
        id: collect_a8
        if: matrix.service == 'a8' && steps.restore.outputs.status == 'authenticated' && matrix.mode != 'probe-only'
        continue-on-error: true
        run: |
          set +e
          npm run a8-ui:fetch -- --month "$(date -u -d 'last month' +%Y-%m)" && npm run a8-ui:normalize
          rc=$?
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"

      - name: "kdp: report"
        id: collect_kdp
        if: matrix.service == 'kdp' && steps.restore.outputs.status == 'authenticated' && matrix.mode != 'probe-only'
        continue-on-error: true
        run: |
          set +e
          day=$(date -u +%d)
          rc=0
          if [ "$((10#$day))" -ge 16 ]; then
            npm run kdp-report -- --month "$(date -u -d 'last month' +%Y-%m)"
            c=$?
            [ "$c" -ne 0 ] && rc=$c
          fi
          if [ "$((10#$day))" -ge 28 ]; then
            npm run kdp-report -- --month "$(date -u +%Y-%m)"
            c=$?
            [ "$c" -ne 0 ] && rc=$c
          fi
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"

      - name: "coconala: orders + analytics"
        id: collect_coconala
        if: matrix.service == 'coconala' && steps.restore.outputs.status == 'authenticated' && matrix.mode != 'probe-only'
        continue-on-error: true
        run: |
          set +e
          rc=0
          npm run coconala-orders -- --headless
          c=$?; [ "$c" -ne 0 ] && rc=$c
          npm run coconala-analytics -- --headless --append-kpi
          c=$?; [ "$c" -ne 0 ] && rc=$c
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"

      - name: "note: traffic + sales + attachments + membership"
        id: collect_note
        if: matrix.service == 'note' && steps.restore.outputs.status == 'authenticated' && matrix.mode != 'probe-only'
        continue-on-error: true
        run: |
          set +e
          rc=0
          npm run note-traffic-fetch -- --commit
          c=$?; [ "$c" -ne 0 ] && rc=$c
          npm run note-sales-fetch -- --month "$(date -u +%Y-%m)" --commit
          c=$?; [ "$c" -ne 0 ] && rc=$c
          npm run check-note-attachments:live
          c=$?; [ "$c" -ne 0 ] && rc=$c
          npm run check-note-membership:live
          c=$?; [ "$c" -ne 0 ] && rc=$c
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"

      - name: "brain: sales fetch"
        id: collect_brain
        if: matrix.service == 'brain' && steps.restore.outputs.status == 'authenticated' && matrix.mode != 'probe-only'
        continue-on-error: true
        run: |
          set +e
          node scripts/brain-sales-fetch.mjs --json
          rc=$?
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"

      - name: "instagram: public status reconcile (verify-ig-status, no planner)"
        id: collect_instagram
        if: matrix.service == 'instagram' && steps.restore.outputs.status == 'authenticated' && matrix.mode != 'probe-only'
        continue-on-error: true
        run: |
          set +e
          # プランナー（予約スロット）の月ビュー走査は headless で不安定なので CI では --no-planner。
          # 予約の実体確認が要るときはローカルで verify-ig-status を回す（フォールバック）。
          node scripts/verify-ig-status.mjs --no-planner --json > "$RUNNER_TEMP/ig-status.json"
          rc=$?
          node -e "const j=require(process.argv[1]); console.log('[instagram] live', j.live?.posts ?? '?', '/ counts', JSON.stringify(j.counts ?? {}))" "$RUNNER_TEMP/ig-status.json" || true
          # exit 2 = SoT ドリフトあり（snapshot は書けている）。ドリフトは慢性（2026-09-21 実測 published_UNrecorded 47）なので
          # 収集としては成功扱いにし、是正は /ig-reconcile が snapshot を読んで行う。exit 1（ライブ取得失敗）だけを失敗にする。
          if [ "$rc" -eq 2 ]; then echo "::notice::instagram SoT ドリフトあり（snapshot に記録・/ig-reconcile で是正）"; rc=0; fi
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"

      - name: "x: own metrics + repost discover"
        id: collect_x
        if: matrix.service == 'x' && steps.restore.outputs.status == 'authenticated' && matrix.mode != 'probe-only'
        continue-on-error: true
        run: |
          set +e
          rc=0
          node scripts/x-own-metrics.mjs
          c=$?; [ "$c" -ne 0 ] && rc=$c
          if [ -f .claude/skills/social/x-repost/x-repost-discover.ts ]; then
            npx tsx .claude/skills/social/x-repost/x-repost-discover.ts
            c=$?; [ "$c" -ne 0 ] && rc=$c
          else
            echo "skip: x-repost-discover.ts が存在しません"
          fi
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"

      - name: "google: GSC + GA4 UI CSV"
        id: collect_google
        if: matrix.service == 'google' && steps.restore.outputs.status == 'authenticated' && matrix.mode != 'probe-only'
        continue-on-error: true
        run: |
          set +e
          rc=0
          npm run gsc-ui:fetch
          c=$?; [ "$c" -ne 0 ] && rc=$c
          node scripts/fetch-ga4-ui-csv.mjs
          c=$?; [ "$c" -ne 0 ] && rc=$c
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"

      - name: "afb: scan"
        id: collect_afb
        if: matrix.service == 'afb' && steps.restore.outputs.status == 'authenticated' && matrix.mode != 'probe-only'
        continue-on-error: true
        run: |
          set +e
          npm run afb:scan -- --rel rel --max-pages 3
          rc=$?
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"

      # 各サービス step は id が別々なので、matrix.service に応じて 1 つの outputs.rc へ集約する。
      - name: Aggregate collector rc
        id: collect_rc
        if: always()
        run: |
          case "${{ matrix.service }}" in
            a8) rc="${{ steps.collect_a8.outputs.rc }}" ;;
            kdp) rc="${{ steps.collect_kdp.outputs.rc }}" ;;
            coconala) rc="${{ steps.collect_coconala.outputs.rc }}" ;;
            note) rc="${{ steps.collect_note.outputs.rc }}" ;;
            brain) rc="${{ steps.collect_brain.outputs.rc }}" ;;
            x) rc="${{ steps.collect_x.outputs.rc }}" ;;
            google) rc="${{ steps.collect_google.outputs.rc }}" ;;
            afb) rc="${{ steps.collect_afb.outputs.rc }}" ;;
            instagram) rc="${{ steps.collect_instagram.outputs.rc }}" ;;
            *) rc="" ;;
          esac
          echo "rc=${rc:-0}" >> "$GITHUB_OUTPUT"

      - name: Writeback auth state (auth:ci-writeback)
        id: writeback
        if: always() && steps.restore.outcome == 'success' && steps.restore.outputs.status == 'authenticated'
        run: |
          npm run auth:ci-writeback -- --service "${{ matrix.service }}" --collector-exit "${{ steps.collect_rc.outputs.rc }}" --json

      - name: Stage outputs
        if: always()
        run: |
          mkdir -p "${RUNNER_TEMP}/out"
          git status --porcelain -- .claude/state | awk '{print $2}' | while read -r f; do
            mkdir -p "${RUNNER_TEMP}/out/$(dirname "$f")"
            cp -r "$f" "${RUNNER_TEMP}/out/$f"
          done

      - name: Upload staged state
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: auth-state-${{ matrix.service }}
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore

      - name: Report failure (automation-failure Issue)
        if: always() && (steps.restore.outputs.status != 'authenticated' || steps.collect_rc.outputs.rc != '0')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- service: \`${{ matrix.service }}\`"
            echo "- restore status: \`${{ steps.restore.outputs.status }}\`"
            echo "- collector rc: \`${{ steps.collect_rc.outputs.rc }}\`"
            echo
            echo "Mac 側の復旧手順:"
            echo '1. `npm run auth:login -- --service ${{ matrix.service }}`'
            echo '2. `npm run auth:export -- --service ${{ matrix.service }}`'
          } > /tmp/auth-state-body.md
          node scripts/report-automation-failure.mjs \
            --channel "auth-state-${{ matrix.service }}" \
            --title "login collector ${{ matrix.service }}: ${{ steps.restore.outputs.status }} / rc=${{ steps.collect_rc.outputs.rc }}" \
            --body-file /tmp/auth-state-body.md

      - name: Resolve automation-failure Issue（成功）
        if: always() && steps.restore.outputs.status == 'authenticated' && steps.collect_rc.outputs.rc == '0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/report-automation-failure.mjs --resolve --channel "auth-state-${{ matrix.service }}" \
            --body "復旧 run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Cleanup auth root
        if: always()
        run: rm -rf "${DOBOKU_AUTH_ROOT}"

      - name: Fail on auth state not ready（検査不成立）
        if: steps.restore.outputs.status != 'authenticated'
        run: |
          echo "::error::${{ matrix.service }} の認証状態が authenticated ではありません（status=${{ steps.restore.outputs.status }}）。検査不成立。"
          exit 2

      - name: Fail on collector error
        if: steps.restore.outputs.status == 'authenticated' && steps.collect_rc.outputs.rc != '0'
        run: |
          echo "::error::${{ matrix.service }} の collector が rc=${{ steps.collect_rc.outputs.rc }} で失敗しました。"
          exit 1

  publish:
    needs: [plan, collect]
    if: always() && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: develop-git-write
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build doc meta index
        run: node .claude/scripts/build-doc-meta-index.mjs --ci

      - name: Download staged auth state
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: auth-state-*
          merge-multiple: true
          path: ${{ runner.temp }}/out

      # note-live-audit.yml の Publish snapshots と同じ書式（develop の in-place dirty を避け、
      # origin/develop 先頭へ hard reset してからステージ済み成果物を復元する）。
      - name: Publish snapshots to develop (.claude/state/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin develop
          git checkout -f develop
          git reset --hard origin/develop
          npm run pre-commit:install

          if [ -d "${{ runner.temp }}/out" ]; then
            cp -r "${{ runner.temp }}/out/." .
          fi

          git add -- .claude/state/metrics .claude/state/sales .claude/state/coconala .claude/state/note .claude/state/ads .claude/state/x-metrics .claude/state/ig-reconcile 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "chore(auth-state): login collectors $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git push origin develop
