name: Fetch SEO metrics (GSC + GA4)

on:
  schedule:
    - cron: "0 11 * * 0" # JST 20:00 Sunday (UTC 11:00)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Restore service account key
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          mkdir -p credentials
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_KEY_JSON" > credentials/gsc-service-account.json
          chmod 600 credentials/gsc-service-account.json

      - name: Fetch GA4 (channel)
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ./credentials/gsc-service-account.json
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: npm run fetch-ga4-data

      - name: Fetch GA4 (date, for data-integrity-gate)
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ./credentials/gsc-service-account.json
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: npm run fetch-ga4-data -- --dimension date

      - name: Fetch GSC
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ./credentials/gsc-service-account.json
        run: npm run fetch-gsc-data

      - name: Check data integrity (Issue #130-A)
        id: integrity
        continue-on-error: true
        run: |
          mkdir -p /tmp/metrics-report
          node .claude/scripts/check-data-integrity.mjs --report /tmp/metrics-report/integrity.md
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Stage outputs
        run: |
          mkdir -p /tmp/metrics-publish
          cp -r .claude/state/metrics/* /tmp/metrics-publish/ 2>/dev/null || true
          ls -la /tmp/metrics-publish

      - name: Publish to develop branch (.claude/state/metrics/{ga4,gsc}/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin develop
          git checkout develop
          git pull --rebase origin develop

          mkdir -p .claude/state/metrics/ga4 .claude/state/metrics/gsc
          cp -r /tmp/metrics-publish/ga4/* .claude/state/metrics/ga4/ 2>/dev/null || true
          cp -r /tmp/metrics-publish/gsc/* .claude/state/metrics/gsc/ 2>/dev/null || true

          git add .claude/state/metrics/ga4 .claude/state/metrics/gsc
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi

          git commit -m "chore(metrics): gsc+ga4 weekly fetch $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git push origin develop

      - name: Open or update data-integrity Issue
        if: steps.integrity.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 既存の open な data-integrity Issue があれば続報コメント、なければ新規作成
          EXISTING=$(gh issue list \
            --repo ${{ github.repository }} \
            --label "data-integrity,auto-generated" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          DATE=$(date -u +%Y-%m-%d)

          if [ -n "$EXISTING" ]; then
            echo "既存 Issue #$EXISTING に続報コメントを追加"
            gh issue comment "$EXISTING" \
              --repo ${{ github.repository }} \
              --body-file /tmp/metrics-report/integrity.md
          else
            echo "新規 Issue を起票"
            gh issue create \
              --repo ${{ github.repository }} \
              --title "[Data-Integrity] GA4 date 欠損検出 ${DATE}" \
              --label "data-integrity,auto-generated,weekly-pdca" \
              --body-file /tmp/metrics-report/integrity.md
          fi

      - name: Cleanup credentials
        if: always()
        run: rm -f credentials/gsc-service-account.json
