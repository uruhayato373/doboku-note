name: Fetch SEO metrics (GSC + GA4)

on:
  schedule:
    - cron: "0 21 * * 4" # JST 06:00 Friday (UTC 21:00 Thursday)
  workflow_dispatch:

# DN-0109 Phase 1: develop への自動書込み系ワークフロー間の push 衝突を防ぐ共通グループ。
# 同時実行を待たせるだけで落とさない（cancel-in-progress: false）。
concurrency:
  group: develop-git-write
  cancel-in-progress: false

permissions:
  contents: write
  # 計測アラート（整合性・日次異常・事業計測の取得失敗）を automation-failure Issue に記録する
  issues: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout develop
        # schedule はデフォルトブランチ（main）を checkout するため、ref を明示しないと
        # npm ci が main のフックを入れる。その後 publish step で develop へ切り替えると
        # フックの drift guard が bot commit を拒否して落ちる（2026-08 に実発生し、
        # by-label スナップショットが 2026-08-13 で停止した）。link-audit.yml と同じ形で
        # 最初から develop を checkout し、順序依存そのものを無くす。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # npm ci（--ignore-scripts なし）は prepare で pre-commit フックを入れる。そのフックの
      # check-x-campaign-plan などが src/config/doc-meta-index.json を直接読むが、これは
      # git 追跡外の生成物なので、ここで作らないと **commit の瞬間に ENOENT で落ちる**。
      # 症状はワークフロー全体の赤で、本来の処理が終わっていても記録が残らない。
      - name: Build doc meta index
        run: node .claude/scripts/build-doc-meta-index.mjs --ci


      - name: Restore service account key
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          mkdir -p credentials
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_KEY_JSON" > credentials/gsc-service-account.json
          chmod 600 credentials/gsc-service-account.json

      # 失敗しても GA4/GSC の取得と publish を止めない（月初の金曜に月次の未確定で落ち、
      # その週の計測がすべて失われた欠陥の是正）。結果は末尾の Report step が Issue にする。
      - name: Fetch qualification business metrics (completed week/month)
        id: business
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ./credentials/gsc-service-account.json
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: |
          npm run fetch-business-metrics -- --commit
          npm run business-review -- snapshot --commit
          npm run business-review -- snapshot --monthly --commit
          npm run check-business-direction

      - name: Fetch GA4 (channel)
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ./credentials/gsc-service-account.json
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: npm run fetch-ga4-data

      - name: Fetch GA4 (date, for data-integrity-gate)
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ./credentials/gsc-service-account.json
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: npm run fetch-ga4-data -- --dimension date

      # 週次レビュー(オフライン)用: クリーンな7日窓の Organic Search スナップショット。
      # 既定の channel フェッチは28日窓のため WoW にならない。これは ga4-channel-organic-*.json として出力され、
      # weekly-review のオフライン経路が最新2ファイルで NSM の週次比較を算出する。
      - name: Fetch GA4 (organic, 7d for weekly NSM)
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ./credentials/gsc-service-account.json
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: npm run fetch-ga4-data -- --dimension channel --days 7 --organic-only

      # SNS 流入 breakdown（source×medium 別・7d）。weekly-review の SNS フェーズと
      # metrics-analyzer の SNS-Source-Shift が最新2ファイルで WoW を算出する。
      - name: Fetch GA4 (SNS source×medium, 7d for weekly SNS review)
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ./credentials/gsc-service-account.json
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: npm run fetch-ga4-data -- --dimension sourceMedium --days 7 --sns-only --limit 50

      # 動画パック単位の送客（DN-0110 Phase 3）。utm_campaign = packId なので campaign 別に見ると
      # 「どの企画が実際に送客したか」が分かる。管理画面 /metrics/video が最新ファイルを読む。
      # 28d なのは公開直後の 7d では母数が小さすぎて判断できないため（KPI は 06_動画コンテンツ運用設計 §9）。
      - name: Fetch GA4 (campaign, 28d for video pack outcomes)
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ./credentials/gsc-service-account.json
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: npm run fetch-ga4-data -- --dimension campaign --days 28 --limit 200

      - name: Fetch GSC
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ./credentials/gsc-service-account.json
        run: npm run fetch-gsc-data -- --all

      # 週次レビュー(オフライン)用: クリーンな7日窓の日次 GSC スナップショット（gsc-date-*.json）。
      # 既定の query フェッチは28日窓。最新2ファイルの日次 clicks/impressions 合計で週次比較を算出する。
      - name: Fetch GSC (date, 7d for weekly trend)
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ./credentials/gsc-service-account.json
        run: npm run fetch-gsc-data -- --dimension date --days 7

      # GA4×GSC crosswalk 用: ページ別 GSC スナップショット（gsc-page-*.json）。
      # 従来 page 次元は月次 index-coverage でしか取れず crosswalk が最大月次だった。
      # 週次化して ga4-page（週次）と鮮度を揃える。
      - name: Fetch GSC (page, for crosswalk)
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ./credentials/gsc-service-account.json
        run: npm run fetch-gsc-data -- --dimension page --all

      # cannibalization / content-decay 分析用: page×query の全行スナップショット
      # （gsc-page-query-*.json）。25,000 件単位でページングし --all で全取得。
      # metrics-analyzer が同一 query に複数 page が競合する状況・順位/CTR の継続悪化を検出する。
      - name: Fetch GSC (page x query, for cannibalization/decay)
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ./credentials/gsc-service-account.json
        run: npm run fetch-gsc-data -- --dimensions page,query --days 28 --all

      # sitemap の送信と Google の読み込み状況（Search Console API・ブラウザのログインは使わない）。
      # 送る対象は本番 robots.txt の Sitemap 行（sitemap.xml と期限内の sitemap-legacy.xml）。
      # 送信にはサービスアカウントの「フル」権限が要る。失敗は sitemaps-latest.json に残り、
      # 月曜の weekly-review-guard が check-gsc-sitemaps で拾うので、ここでは計測の publish を止めない。
      - name: GSC sitemaps (submit + status)
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ./credentials/gsc-service-account.json
        run: node scripts/gsc-sitemaps.mjs --submit

      # 登録クエリの計測・効果判定・改善は日次 seo-rank-watch.yml が担当する。

      # 収益カバレッジ ダッシュボード用: ページ別流入（report-monetization-coverage.mts が
      # 最新 ga4-page-*.json を読む）。
      - name: Fetch GA4 (page, for monetization coverage)
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ./credentials/gsc-service-account.json
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        # 上位 100 件で切ると crosswalk の結合が 29 ページに留まった。全ページを取る（meta.truncated で確認可能）
        run: npm run fetch-ga4-data -- --dimension page --limit 10000

      # 収益カバレッジ ダッシュボード用: note/アフィリ CTA クリック（eventName × pagePath）。
      # 本番クリックが蓄積するまで 0 件が正常（計装は AnalyticsProvider のデリゲートリスナー）。
      - name: Fetch GA4 (CTA clicks, for monetization coverage)
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ./credentials/gsc-service-account.json
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: npm run fetch-ga4-cta-clicks

      # モバイル最適化の意思決定用: デバイス別の流入シェア（mobile/desktop/tablet × sessions/engagement）。
      # 「サイトはモバイル中心か」を勘でなくデータで確定する（ga4-device-*.json）。
      - name: Fetch GA4 (device, for mobile share)
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ./credentials/gsc-service-account.json
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: npm run fetch-ga4-data -- --dimension device

      # モバイル最適化の意思決定用: デバイス別の CTA クリック（eventName × deviceCategory）。
      # 上の device 別 sessions を分母にして「モバイル vs PC の affiliate/note CTR」を出す
      # （ga4-cta-clicks-by-device-*.json・既定の page 別とは別ファイル）。
      - name: Fetch GA4 (CTA clicks by device, for mobile vs PC CTR)
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ./credentials/gsc-service-account.json
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: npm run fetch-ga4-cta-clicks -- --by-device

      # アフィリ EPC 判定用: プログラム/面別（event_label）の CTA クリック内訳
      # （BuildJob-sidebar / KensetsuJobs-sidebar / BuildJob-midtext / ビルドジョブ 等）。
      # 要 GA4 カスタムディメンション（イベントスコープ・event_label）。未登録なら script が
      # 手順を出して exit 0（continue-on-error でも他 step を止めない）。ga4-cta-clicks-by-label-*.json。
      - name: Fetch GA4 (CTA clicks by label, for affiliate program/surface EPC)
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ./credentials/gsc-service-account.json
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: npm run fetch-ga4-cta-clicks -- --by-label

      # 1級土木PWA Phase 0: 無料演習→Premium関心の匿名ファネル。
      # eventName別 totalUsers を成功判定に使い、eventCount の重複を購入希望人数へ足さない。
      - name: Fetch GA4 (quiz Premium Phase 0 funnel)
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ./credentials/gsc-service-account.json
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: node scripts/fetch-ga4-quiz-funnel.mjs

      - name: Report quiz Premium Phase 0 gate
        run: node scripts/report-quiz-premium-funnel.mjs

      # アフィリ面改善用: 配置別（cta_placement）の可視 impression / click。
      # article-mid / article-end-mobile / category-sidebar など配置単位の CTR を出す。
      # 要 GA4 カスタムディメンション（イベントスコープ・cta_placement）。登録前データは遡及しない。
      # 未反映期は script が手順を出して exit 0。ga4-cta-clicks-by-placement-*.json。
      - name: Fetch GA4 (affiliate impressions/clicks by placement, for placement CTR)
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ./credentials/gsc-service-account.json
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: npm run fetch-ga4-cta-clicks -- --by-placement

      # afb（アフィリエイトB）成果を公式 API で取得する。Playwright 提携状態スキャンとは別系統
      # （読み取り専用の conversion API・doboku-note の partner_site_id=984453 を行ごとに検査して
      # 他サイト混入を防ぐ）。取得失敗はワークフロー全体を落とさず、鮮度は quality-audit の ops 区分
      # （check-afb-outcomes-freshness）が日次で見る。
      - name: Fetch afb outcomes (official API)
        continue-on-error: true
        env:
          AFB_API_KEY: ${{ secrets.AFB_API_KEY }}
        run: node .claude/scripts/fetch-afb-outcomes.mjs --commit

      # 週次 NSM スナップショット（.claude/state/weekly-metrics/YYYY-Www.json）。
      # 2026-W18 でローカル手動実行が途絶したのを CI 供給へ移行（measurement-incidents.md
      # 「計測は CI/CD 供給が正」2026-06-05）。metrics-reader が NSM+SNS流入(source別WoW)を
      # ライブ取得して time-series を積む。weekly-review の SNS フェーズが最新スナップショットを読む。
      - name: Snapshot weekly NSM + SNS metrics
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ./credentials/gsc-service-account.json
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
        run: node .claude/scripts/snapshot-weekly-metrics.mjs --force

      # 収益カバレッジ ダッシュボード生成: ページ別流入(ga4-page) × CTA クリック(ga4-cta-clicks) ×
      # 配置真実源を突合し monetization/coverage-*.{json,md} を生成（オフライン・上の fetch 結果を読む）。
      # 従来 npm script のみで CI 未配線＝coverage-latest.md が 2026-06-18 で停止していたのを週次自動化。
      - name: Generate monetization coverage report
        continue-on-error: true
        run: npm run report-monetization-coverage

      # 商品ID付き note CTA のクリック/表示と、同じ期間のマガジン売上を並べる。
      # 購入者単位の結合ではないため CVR/因果 attribution とは扱わず、期間効率の診断に限定する。
      - name: Generate note funnel efficiency report
        continue-on-error: true
        run: npm run report-note-funnel-efficiency

      # bot 混入監視: Japan フィルタ後も残る bot 署名（高外国比率・低engagement の参照元）を surface し
      # bot-audit-*.json を ga4/ に出力（新規スパム候補は STDOUT）。従来 CI 未配線＝2026-05-17 以降実行ゼロ。
      - name: Audit GA4 bot ratio
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ./credentials/gsc-service-account.json
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: npm run audit-ga4-bot-ratio

      # GA4×GSC crosswalk 生成: 上で取得した ga4-page × gsc-page を URL で突合し、
      # title/meta 機会（上位表示低CTR）と ランキング機会（表示多い低順位）を surface（オフライン）。
      # 成長パック: 事業レビューと同じ前の完了週（月〜日・JST）＋直前 28 日の基線で GA4 × GSC を全件取得する。
      # 機会ダイジェスト（build-growth-digest）の唯一の入力。rc=1 取得失敗 / rc=2 検査不成立（認証・GSC 確定前）。
      - name: Fetch growth pack (GA4 x GSC, fixed Mon-Sun week)
        id: growth
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ./credentials/gsc-service-account.json
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: |
          set +e
          node scripts/fetch-growth-pack.mjs
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      # Bing Webmaster（GA4 Organic の bing と照合する実クリック・表示）。キー未設定は rc=2 で検査不成立 Issue へ。
      - name: Fetch Bing Webmaster (query / page / traffic)
        id: bing
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: |
          set +e
          node scripts/fetch-bing-webmaster.mjs
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      # GA4 管理設定（カスタムディメンション・キーイベント・データ保持）を Admin API で観測し inventory を更新する。
      # 閲覧者権限で足りる。check-ga4-dimensions（weekly-review-guard）がこの観測を読む。
      - name: Observe GA4 admin settings (Admin API)
        id: ga4admin
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ./credentials/gsc-service-account.json
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: |
          set +e
          node scripts/ga4-admin-api.mjs check --commit
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Generate GA4xGSC crosswalk report
        continue-on-error: true
        run: npm run report-ga4-gsc-crosswalk

      # 既定シェルは bash -e。`node …; echo "exit_code=$?"` だと非 0 で step が先に終わり exit_code が
      # 立たず、下の判定が一度も発火しなかった（2026-09 発覚）。set +e で rc を必ず取る。
      - name: Check data integrity
        id: integrity
        run: |
          mkdir -p /tmp/metrics-report
          set +e
          node .claude/scripts/check-data-integrity.mjs --report /tmp/metrics-report/integrity.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Check daily anomaly
        id: anomaly
        run: |
          mkdir -p /tmp/metrics-report
          set +e
          node .claude/scripts/check-daily-anomaly.mjs --report /tmp/metrics-report/anomaly.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Stage outputs
        run: |
          mkdir -p /tmp/metrics-publish
          cp -r .claude/state/metrics/* /tmp/metrics-publish/ 2>/dev/null || true
          # weekly-metrics は metrics/ の兄弟ディレクトリなので個別にコピーする
          mkdir -p /tmp/weekly-metrics-publish
          cp -r .claude/state/weekly-metrics/* /tmp/weekly-metrics-publish/ 2>/dev/null || true
          ls -la /tmp/metrics-publish

      - name: Publish to develop branch (.claude/state/metrics/{ga4,gsc}/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin develop
          # 実行中の in-place 書き込み（crosswalk-latest.md・weekly-metrics/index.json 等の追跡ファイル）で
          # 作業ツリーが dirty になり `git pull --rebase` が "cannot pull with rebase" で失敗するのを防ぐ。
          # 成果物は直前の "Stage outputs" で /tmp に退避済みなので、origin/develop 先頭へ hard reset して
          # クリーンにしてから /tmp を復元する（-f で dirty tree でも develop へ切替）。
          git checkout -f develop
          git reset --hard origin/develop

          # checkout で develop を指定済みなので npm ci は develop のフックを入れており、
          # 本来ここは不要。ただし上の hard reset でフック定義が変わる可能性を潰す保険として
          # 残す（drift guard に拒否されると bot commit が丸ごと落ちるため）。
          npm run pre-commit:install

          mkdir -p .claude/state/metrics/ga4 .claude/state/metrics/gsc .claude/state/metrics/monetization .claude/state/metrics/crosswalk .claude/state/metrics/affiliate .claude/state/metrics/growth .claude/state/metrics/bing .claude/state/metrics/ga4-admin .claude/state/weekly-metrics
          cp -r /tmp/metrics-publish/ga4/* .claude/state/metrics/ga4/ 2>/dev/null || true
          cp -r /tmp/metrics-publish/gsc/* .claude/state/metrics/gsc/ 2>/dev/null || true
          cp -r /tmp/metrics-publish/monetization/* .claude/state/metrics/monetization/ 2>/dev/null || true
          cp -r /tmp/metrics-publish/crosswalk/* .claude/state/metrics/crosswalk/ 2>/dev/null || true
          cp -r /tmp/metrics-publish/affiliate/* .claude/state/metrics/affiliate/ 2>/dev/null || true
          cp -r /tmp/metrics-publish/growth/* .claude/state/metrics/growth/ 2>/dev/null || true
          cp -r /tmp/metrics-publish/bing/* .claude/state/metrics/bing/ 2>/dev/null || true
          cp -r /tmp/metrics-publish/ga4-admin/* .claude/state/metrics/ga4-admin/ 2>/dev/null || true
          cp -r /tmp/weekly-metrics-publish/* .claude/state/weekly-metrics/ 2>/dev/null || true

          # 寿命表（scripts/lib/prune-state-snapshots.mjs）に従って古い snapshot を消す（business は除外 dir・触らない）。
          # affiliate family は keep-all（`-YYYY-MM-DD.json` は消さない台帳）なので prune 対象に含めても実害は無いが、
          # 台帳性格が他 family と違うため対象には入れない（誤って keep-all の前提が壊れたときに気づけるようにする）。
          # 書き手と同じ commit で消すのが唯一安全（別 commit は上の reset --hard + copy-back に戻される）。
          node scripts/prune-state-snapshots.mjs --commit --family ga4,gsc,monetization,crosswalk,weekly-metrics,growth,bing

          git add .claude/state/metrics/business .claude/state/metrics/ga4 .claude/state/metrics/gsc .claude/state/metrics/monetization .claude/state/metrics/crosswalk .claude/state/metrics/affiliate .claude/state/metrics/growth .claude/state/metrics/bing .claude/state/metrics/ga4-admin .claude/state/weekly-metrics
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi

          git commit -m "chore(metrics): gsc+ga4 weekly fetch $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git push origin develop

      # 計測データは前ステップで commit 済み。異常は automation-failure Issue に記録し、復旧時に自動クローズする。
      # rc=1（計測異常・事業計測の取得失敗）と rc=2（検査不成立＝入力ファイルなし）は channel を分ける。
      - name: Report measurement alerts
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INTEGRITY_RC: ${{ steps.integrity.outputs.exit_code }}
          ANOMALY_RC: ${{ steps.anomaly.outputs.exit_code }}
          BUSINESS_OUTCOME: ${{ steps.business.outcome }}
          GROWTH_RC: ${{ steps.growth.outputs.rc }}
          BING_RC: ${{ steps.bing.outputs.rc }}
          GA4ADMIN_RC: ${{ steps.ga4admin.outputs.rc }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          anomalies=() invalid=()
          [ "$INTEGRITY_RC" = "1" ] && anomalies+=("GA4 データ整合性違反（check-data-integrity.mjs）")
          [ "$ANOMALY_RC" = "1" ] && anomalies+=("GA4 日次異常（check-daily-anomaly.mjs）")
          [ "$BUSINESS_OUTCOME" = "failure" ] && anomalies+=("資格別事業計測の取得失敗（fetch-business-metrics / business-review snapshot）")
          [ "$GROWTH_RC" = "1" ] && anomalies+=("成長パック（fetch-growth-pack）の取得失敗（区画ごとの error は pack の sections を参照）")
          [ "$BING_RC" = "1" ] && anomalies+=("Bing Webmaster の取得失敗")
          [ "$GA4ADMIN_RC" = "1" ] && anomalies+=("GA4 Admin API の観測失敗")
          [ "$GROWTH_RC" = "2" ] && invalid+=("成長パック: 認証なし、または週が GSC 確定前で取得せず")
          [ "$BING_RC" = "2" ] && invalid+=("Bing Webmaster: BING_WEBMASTER_API_KEY 未設定（Bing Webmaster Tools → 設定 → API アクセスで発行し Secret へ）")
          [ "$GA4ADMIN_RC" = "2" ] && invalid+=("GA4 Admin API: 権限不足または API 未有効化（ログの hint を参照）")
          [ "$INTEGRITY_RC" = "2" ] && invalid+=("check-data-integrity: ga4-date が無く検査不成立")
          [ "$ANOMALY_RC" = "2" ] && invalid+=("check-daily-anomaly: ga4-date が無く検査不成立")
          # 検査 step まで到達しなかった（前段で落ちた）場合も検査不成立として扱う
          [ -z "$INTEGRITY_RC" ] && invalid+=("check-data-integrity が実行されていない（前段の失敗）")
          [ -z "$ANOMALY_RC" ] && invalid+=("check-daily-anomaly が実行されていない（前段の失敗）")
          report() {
            {
              echo "## 検出"
              for x in "$@"; do echo "- $x"; done
              echo
              for f in /tmp/metrics-report/integrity.md /tmp/metrics-report/anomaly.md; do
                if [ -f "$f" ]; then echo; cat "$f"; fi
              done
              echo
              echo "- run: $RUN_URL"
              echo "- 異常の読み方: \`.claude/knowledge/reference/measurement-incidents.md\`"
            } > /tmp/metrics-alert.md
          }
          status=0
          if [ ${#anomalies[@]} -gt 0 ]; then
            report "${anomalies[@]}"
            node scripts/report-automation-failure.mjs --channel fetch-metrics --title "計測アラート（${#anomalies[@]} 件）" --body-file /tmp/metrics-alert.md
            status=1
          else
            node scripts/report-automation-failure.mjs --resolve --channel fetch-metrics --body "復旧 run: $RUN_URL" || true
          fi
          if [ ${#invalid[@]} -gt 0 ]; then
            report "${invalid[@]}"
            node scripts/report-automation-failure.mjs --channel fetch-metrics-check-invalid --title "計測検査が不成立（${#invalid[@]} 件）" --body-file /tmp/metrics-alert.md
            status=1
          else
            node scripts/report-automation-failure.mjs --resolve --channel fetch-metrics-check-invalid --body "復旧 run: $RUN_URL" || true
          fi
          exit $status

      - name: Cleanup credentials
        if: always()
        run: rm -f credentials/gsc-service-account.json
