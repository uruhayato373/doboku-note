name: Fetch SEO metrics (GSC + GA4)

on:
  schedule:
    - cron: "0 21 * * 4" # JST 06:00 Friday (UTC 21:00 Thursday)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Restore service account key
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          mkdir -p credentials
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_KEY_JSON" > credentials/gsc-service-account.json
          chmod 600 credentials/gsc-service-account.json

      - name: Fetch GA4 (channel)
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ./credentials/gsc-service-account.json
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: npm run fetch-ga4-data

      - name: Fetch GA4 (date, for data-integrity-gate)
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ./credentials/gsc-service-account.json
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: npm run fetch-ga4-data -- --dimension date

      # 週次レビュー(オフライン)用: クリーンな7日窓の Organic Search スナップショット。
      # 既定の channel フェッチは28日窓のため WoW にならない。これは ga4-channel-organic-*.json として出力され、
      # weekly-review のオフライン経路が最新2ファイルで NSM の週次比較を算出する。
      - name: Fetch GA4 (organic, 7d for weekly NSM)
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ./credentials/gsc-service-account.json
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: npm run fetch-ga4-data -- --dimension channel --days 7 --organic-only

      - name: Fetch GSC
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ./credentials/gsc-service-account.json
        run: npm run fetch-gsc-data

      # 週次レビュー(オフライン)用: クリーンな7日窓の日次 GSC スナップショット（gsc-date-*.json）。
      # 既定の query フェッチは28日窓。最新2ファイルの日次 clicks/impressions 合計で週次比較を算出する。
      - name: Fetch GSC (date, 7d for weekly trend)
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ./credentials/gsc-service-account.json
        run: npm run fetch-gsc-data -- --dimension date --days 7

      - name: Check data integrity
        id: integrity
        continue-on-error: true
        run: |
          mkdir -p /tmp/metrics-report
          node .claude/scripts/check-data-integrity.mjs --report /tmp/metrics-report/integrity.md
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Check daily anomaly
        id: anomaly
        continue-on-error: true
        run: |
          mkdir -p /tmp/metrics-report
          node .claude/scripts/check-daily-anomaly.mjs --report /tmp/metrics-report/anomaly.md
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Stage outputs
        run: |
          mkdir -p /tmp/metrics-publish
          cp -r .claude/state/metrics/* /tmp/metrics-publish/ 2>/dev/null || true
          ls -la /tmp/metrics-publish

      - name: Publish to develop branch (.claude/state/metrics/{ga4,gsc}/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin develop
          git checkout develop
          git pull --rebase origin develop

          mkdir -p .claude/state/metrics/ga4 .claude/state/metrics/gsc
          cp -r /tmp/metrics-publish/ga4/* .claude/state/metrics/ga4/ 2>/dev/null || true
          cp -r /tmp/metrics-publish/gsc/* .claude/state/metrics/gsc/ 2>/dev/null || true

          git add .claude/state/metrics/ga4 .claude/state/metrics/gsc
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi

          git commit -m "chore(metrics): gsc+ga4 weekly fetch $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git push origin develop

      # GitHub Issue は廃止。違反検出は task-queue.json に append する
      # （dedupe_key で重複起票防止 = 旧 find-or-create ロジックの置換）。
      - name: Append to task-queue on data-integrity violation
        if: steps.integrity.outputs.exit_code == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin develop
          git checkout develop
          git pull --rebase origin develop

          DATE=$(date -u +%Y-%m-%d)
          node .claude/scripts/lib/task-queue.mjs add \
            --title "GA4 date 欠損検出 ${DATE}" \
            --category infra --priority high --source ci:fetch-metrics \
            --dedupe-key ci:fetch-metrics:data-integrity \
            --notes "fetch-metrics で GA4 データ整合性違反を検出。詳細は check-data-integrity.mjs の出力（GitHub Actions ログ）"
          npm run build-todo

          git add .claude/state/task-queue.json docs/project/TODO.md
          if git diff --cached --quiet; then
            echo "No task-queue changes to publish"
            exit 0
          fi
          git commit -m "chore(metrics): data-integrity violation -> task-queue $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git push origin develop

      - name: Append to task-queue on daily-anomaly violation
        if: steps.anomaly.outputs.exit_code == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin develop
          git checkout develop
          git pull --rebase origin develop

          DATE=$(date -u +%Y-%m-%d)
          node .claude/scripts/lib/task-queue.mjs add \
            --title "GA4 日次異常検出 ${DATE}" \
            --category infra --priority high --source ci:fetch-metrics \
            --dedupe-key ci:fetch-metrics:daily-anomaly \
            --notes "fetch-metrics で GA4 日次異常を検出。詳細は check-daily-anomaly.mjs の出力（GitHub Actions ログ）"
          npm run build-todo

          git add .claude/state/task-queue.json docs/project/TODO.md
          if git diff --cached --quiet; then
            echo "No task-queue changes to publish"
            exit 0
          fi
          git commit -m "chore(metrics): daily-anomaly violation -> task-queue $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git push origin develop

      - name: Cleanup credentials
        if: always()
        run: rm -f credentials/gsc-service-account.json
