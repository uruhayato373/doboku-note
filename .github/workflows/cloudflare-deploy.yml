name: Deploy to production (Cloudflare Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_only:
        description: '本番表示の検査だけを実行（ビルド・再デプロイなし）'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        if: inputs.verify_only != true
        run: npm ci --legacy-peer-deps

      - name: Build
        if: inputs.verify_only != true
        run: npm run build
        env:
          NEXT_PUBLIC_GA_ID: G-8VXJ1RL1HG

      - name: Deploy to Cloudflare Pages
        if: inputs.verify_only != true
        run: npx wrangler@3 pages deploy out --project-name=doboku-note --commit-message="deploy ${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: doboku-note

      - name: Verify production SSR
        run: npm run check-production-ssr

  # デプロイが成功したあと、sitemap の lastmod が直近 7 日の URL を IndexNow（Bing 等）へ通知する（DN-0853・旧 indexnow-submit.yml を統合）。
  # Google は IndexNow に参加していない（Google 側は index-coverage.yml / gsc-request-indexing）。
  # 状態は持たない: deploy ごとに直近 7 日を再送する（IndexNow は再送を許容。lastmod は pre-commit が
  # 本文変更のときだけ動かすので、送る集合は実際に変わったページ）。
  # 設計の真実源: .claude/knowledge/reference/gsc-management.md「Bing（IndexNow）」。
  # 送り直すときは失敗したジョブだけ gh run rerun <run-id> --failed（手元なら npm run indexnow:submit）。
  indexnow:
    needs: deploy
    if: inputs.verify_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # 送信失敗を automation-failure Issue に記録する（限定例外）
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # deploy 直後は key ファイルがまだ edge に伝播しておらず IndexNow が 403 を返す
      # （2026-09-19 の初回 run で実発生・手動再送は 200）。本番で key の中身が一致するまで待つ。
      - name: Wait for key file on production (edge propagation)
        run: |
          KEY=$(node -e 'const c=require("./config/indexnow.json");process.stdout.write(c.key||"")')
          HOST=$(node --input-type=module -e 'import { SITE_HOST } from "./src/config/site-identity.mjs"; process.stdout.write(SITE_HOST)')
          for i in $(seq 1 18); do
            body=$(curl -sS --max-time 15 -A "Mozilla/5.0" "https://$HOST/$KEY.txt" || true)
            if [ "$body" = "$KEY" ]; then echo "key file OK after $i tries"; exit 0; fi
            sleep 10
          done
          echo "::warning::key ファイルが 180 秒待っても本番で一致しない（HTTP 403 になりうる）。送信は続行する"

      # 依存ゼロ（node:fs と global fetch だけ）なので npm ci しない。
      - name: Submit recently modified URLs
        id: submit
        run: |
          set +e
          node scripts/indexnow-submit.mjs 2>&1 | tee /tmp/indexnow.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          {
            echo "## IndexNow submit（rc=$rc）"
            echo '```'
            cat /tmp/indexnow.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 0 = 送信済み or 対象 0 件 / 1 = 送信して非 2xx / 2 = 検査不成立（sitemap・key が読めない）
          exit "$rc"

      - name: Report - submit failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "IndexNow への送信が失敗（rc=${{ steps.submit.outputs.rc }}）。Bing 側の更新通知が止まっている。"
            echo ""
            echo '```'
            cat /tmp/indexnow.log 2>/dev/null || echo "(log なし)"
            echo '```'
            echo ""
            echo "- rc=2 は検査不成立（本番 sitemap か \`public/<key>.txt\` が読めない）。deploy 直後の伝播待ちなら \`gh run rerun ${{ github.run_id }} --failed\` で indexnow ジョブだけ再実行"
            echo "- rc=1 は IndexNow が非 2xx。403/422 は key・host の不一致、429 は送信間隔"
            echo "- 設定: \`config/indexnow.json\` / 判定: \`scripts/lib/indexnow.mjs\`"
          } > /tmp/indexnow-body.md
          node scripts/report-automation-failure.mjs \
            --channel indexnow \
            --title "IndexNow 送信失敗（rc=${{ steps.submit.outputs.rc }}）" \
            --body-file /tmp/indexnow-body.md

      # 送信が通ったら indexnow channel の open Issue を自動クローズ（起票と対）。
      - name: Resolve - indexnow Issue (復旧)
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/report-automation-failure.mjs --resolve --channel indexnow \
            --body "復旧 run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
