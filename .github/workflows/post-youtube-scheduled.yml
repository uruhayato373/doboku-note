name: YouTube scheduled delivery (daily)

on:
  schedule:
    - cron: "17 11 * * *" # 20:17 JST. Publication itself follows each approved publishAt.
  workflow_dispatch:
    inputs:
      apply:
        description: "確認済みキューを続行する（falseは書き込みなしの試運転）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: youtube-video-migration
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout reviewed delivery code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Pin the implementation while the broader video branch is under review.
          # Updating this revision requires running the delivery/migration tests.
          ref: e85b3fb03ca265dbeec9f0ba7ecc65e081e69268
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Verify restart, quota and publication guards
        run: node --test tests/youtube-delivery*.test.mjs tests/youtube-migration*.test.mjs
      - name: Resume approved private delivery queue
        env:
          APPLY_DELIVERY: ${{ github.event_name == 'schedule' || inputs.apply == true }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        run: node scripts/youtube-delivery.mjs
