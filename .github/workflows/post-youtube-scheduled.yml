name: YouTube scheduled delivery (daily)

on:
  schedule:
    - cron: "17 11 * * *" # 20:17 JST. Publication itself follows each approved publishAt.
  workflow_dispatch:
    inputs:
      apply:
        description: "確認済みキューを続行する（falseは書き込みなしの試運転）"
        type: boolean
        default: false
      pack_publish:
        description: "新規の承認済み動画パック1本だけを予約する: <packId>:<longform|thumbnail>[:PUBLISH]（PUBLISH なしは試運転・空なら日次キュー）"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: youtube-video-migration
  cancel-in-progress: false

jobs:
  deliver:
    if: github.event_name == 'schedule' || inputs.pack_publish == ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout reviewed delivery code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pin the implementation while the broader video branch is under review.
          # Updating this revision requires running the delivery/migration tests.
          ref: 1dd9e3b8332688184eaf9ae99774e9af2a7e116a
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Verify restart, quota and publication guards
        run: node --test tests/youtube-delivery*.test.mjs tests/youtube-migration*.test.mjs
      - name: Resume approved private delivery queue
        env:
          APPLY_DELIVERY: ${{ github.event_name == 'schedule' || inputs.apply == true }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        run: node scripts/youtube-delivery.mjs

  # 日次キュー（移行対象344本）に入らない新規の承認済みパック（総まとめなど）を1本ずつ手動で予約する。
  # 9/10 に外した pack: 経路の後継。publish-video-pack.cjs が承認（approvedBy: user）と5分より先の
  # publishAt を確かめてから private で上げて予約し、予約状態を develop の台帳（content/registry と写しの state）へ書き戻す。
  publish-pack:
    if: github.event_name == 'workflow_dispatch' && inputs.pack_publish != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Verify publish guards
        run: node --test tests/youtube-video-pack-publisher.test.mjs
      - name: Publish one approved video pack
        env:
          PACK_PUBLISH: ${{ inputs.pack_publish }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          IFS=':' read -r pack_id phase confirm <<< "$PACK_PUBLISH"
          if ! [[ "$pack_id" =~ ^[a-z0-9][a-z0-9-]{2,80}$ ]] || { [ "$phase" != "longform" ] && [ "$phase" != "thumbnail" ]; }; then
            echo "::error::pack_publish=<packId>:<longform|thumbnail>[:PUBLISH] が必要です"
            exit 1
          fi
          args=(--pack-id "$pack_id" --phase "$phase")
          if [ "${confirm:-}" != "PUBLISH" ]; then args+=(--dry-run); fi
          node .claude/scripts/youtube/publish-video-pack.cjs "${args[@]}"
      - name: Commit publication state
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          # 正本はコンテンツ台帳（content/registry）だけ（動画の状態の写しファイルは 2026-10-09 に消した）
          node scripts/ci-data.mjs add --paths content/registry
          git diff --cached --quiet && exit 0
          git commit -m "chore(youtube): record manually published video pack [skip ci]"
          git pull --rebase origin develop
          git push origin HEAD:develop
