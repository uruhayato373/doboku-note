name: Exam keyword cycle (weekly)

# 過去問起点のキーワード校正サイクル (/exam-keyword-cycle) を週 2 回走らせる。
# - schedule: JST 22:00 Mon / Thu
# - workflow_dispatch: 手動起動用（remote trigger 実装完了までは主にこちら）
#
# NOTE: GitHub Actions 内から /exam-keyword-cycle スキルを呼び出す仕組みは
# 現時点（2026-04-20）未確定。Claude Code remote trigger 仕様が固まり次第、
# 「Run exam-keyword-cycle via remote trigger」ステップに接続する。
# それまでは workflow_dispatch で起動し、事前準備（build-backlinks 等）のみ実行する。

on:
  schedule:
    - cron: "0 13 * * 1,4" # JST 22:00 Mon / Thu (UTC 13:00)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Refresh backlinks index
        run: npm run build-backlinks

      - name: Dry-run select-next-question
        id: select
        run: |
          node .claude/skills/content/exam-keyword-cycle/scripts/select-next-question.mjs --pretty | tee /tmp/next-question.json

      # TODO (remote trigger): 次のステップで実際に /exam-keyword-cycle --auto を起動する
      # - Claude Code remote trigger 仕様が確定したらここに uses: anthropics/claude-code-action@... を追加
      # - Auth token は secrets.CLAUDE_CODE_TOKEN に保管する想定
      # - 失敗時（MDX パース失敗・PR 作成失敗等）は下の task-queue append ステップで記録する

      - name: Placeholder - notify selection only
        if: github.event_name == 'schedule'
        run: |
          echo "::notice::exam-keyword-cycle: selected next question"
          cat /tmp/next-question.json

      # GitHub Issue は廃止。クリティカル失敗は task-queue.json に append する。
      - name: Append to task-queue on critical failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin develop
          git checkout develop
          git pull --rebase origin develop

          DATE=$(date -u +%Y-%m-%d)
          node .claude/scripts/lib/task-queue.mjs add \
            --title "exam-keyword-cycle 自動サイクル失敗 ${DATE}" \
            --category quality --priority high --source ci:exam-keyword-cycle \
            --dedupe-key ci:exam-keyword-cycle:failure \
            --notes "ワークフロー ${{ github.workflow }} / Run ${{ github.run_id }} / コミット ${{ github.sha }}。GitHub Actions ログを確認。"
          npm run build-todo

          git add .claude/state/task-queue.json docs/project/TODO.md
          if git diff --cached --quiet; then
            echo "No task-queue changes to publish"
            exit 0
          fi
          git commit -m "chore(ci): exam-keyword-cycle failure -> task-queue $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git push origin develop
