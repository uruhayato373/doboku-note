name: ☁️ Fetch Cloudflare zone analytics (daily)

# Cloudflare Zone Analytics（GraphQL）から日次でトラフィック指標を取得し、
# .claude/state/metrics/cloudflare/ へ commit する。
# 失敗・成功は automation-failure Issue（channel: cloudflare-metrics）で通知する
# （scripts/report-automation-failure.mjs）。
#
# 前提 Secrets: CLOUDFLARE_ANALYTICS_API_TOKEN / CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
# 実装: scripts/fetch-cloudflare-analytics.mjs（lib: scripts/lib/cloudflare-analytics.mjs）
# exit: 0 取得成功 / 1 認証・ネットワーク失敗 / 2 検査不成立（0 件取得。成果物は書かない）

on:
  schedule:
    - cron: "23 20 * * *" # JST 05:23（UTC 20:23）
  workflow_dispatch:

# DN-0109 Phase 1: develop への自動書込み系ワークフロー間の push 衝突を防ぐ共通グループ。
# 同時実行を待たせるだけで落とさない（cancel-in-progress: false）。
concurrency:
  group: develop-git-write
  cancel-in-progress: false

permissions:
  contents: write
  issues: write # automation-failure Issue の起票・自動クローズ（限定例外）

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # npm ci（--ignore-scripts なし）は prepare で pre-commit フックを入れる。そのフックの
      # check-x-campaign-plan などが src/config/doc-meta-index.json を直接読むが、これは
      # git 追跡外の生成物なので、ここで作らないと **commit の瞬間に ENOENT で落ちる**。
      - name: Build doc meta index
        run: node .claude/scripts/build-doc-meta-index.mjs --ci

      - name: Fetch Cloudflare zone analytics
        id: fetch
        continue-on-error: true
        env:
          CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          node scripts/fetch-cloudflare-analytics.mjs 2>&1 | tee "$RUNNER_TEMP/cf.log"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Publish to develop (.claude/state/metrics/cloudflare/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          node scripts/prune-state-snapshots.mjs --commit --family cloudflare

          # 取得が失敗した run ではディレクトリ自体が無い。pathspec 不一致で git が exit 128 になり
          # 「取得失敗」が「publish 失敗」に見えるのを避ける（2026-09-21 初回 run で実測）。
          if [ -d .claude/state/metrics/cloudflare ]; then git add .claude/state/metrics/cloudflare; fi
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "chore(metrics): cloudflare zone analytics daily $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git pull --rebase origin develop
          git push origin develop

      - name: Build failure body (rc=2 は検査不成立と明記)
        if: steps.fetch.outputs.exit_code != '0'
        run: |
          {
            echo "fetch-cloudflare-analytics.mjs が失敗しました（rc=${{ steps.fetch.outputs.exit_code }}）。"
            echo ""
            if [ "${{ steps.fetch.outputs.exit_code }}" = "2" ]; then
              echo "rc=2 は**検査不成立**（0 件取得。成果物は書いていません）です。認証/ネットワーク障害（rc=1）とは区別してください。"
            else
              echo "rc=1 は認証/ネットワーク障害です。"
            fi
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/cf.log" 2>/dev/null || true
            echo '```'
          } > "$RUNNER_TEMP/cf-body.md"

      - name: Report - fetch failure (automation-failure Issue)
        if: steps.fetch.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          node scripts/report-automation-failure.mjs \
            --channel cloudflare-metrics \
            --title "Cloudflare zone analytics 取得失敗（rc=${{ steps.fetch.outputs.exit_code }}）" \
            --body-file "$RUNNER_TEMP/cf-body.md"

      - name: Resolve - close cloudflare-metrics Issue on recovery
        if: steps.fetch.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          node scripts/report-automation-failure.mjs --resolve --channel cloudflare-metrics \
            --body "復旧 run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Fail on fetch error
        if: steps.fetch.outputs.exit_code != '0'
        run: |
          echo "::error::fetch-cloudflare-analytics.mjs が失敗しました（rc=${{ steps.fetch.outputs.exit_code }}）。automation-failure Issue（channel: cloudflare-metrics）を参照。"
          exit 1
