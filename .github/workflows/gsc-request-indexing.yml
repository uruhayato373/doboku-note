name: GSC request indexing (self-hosted)

# 順位表（index-coverage.yml が水曜に作る .claude/state/metrics/gsc-indexing/priority-latest.txt）の先頭から、
# 未登録 URL に GSC の「インデックス登録をリクエスト」を送る（DN-0291）。Google は登録リクエストの API を
# 出していないので画面操作で、1 日 10 件前後が上限。結果は gsc-indexing/{requests-latest,history}.json に
# commit し、14 日以内に受理した URL は scripts/gsc-request-indexing.mjs が自分で除外する。
#
# **self-hosted runner（自宅回線の Mac）限定**: GitHub hosted runner（datacenter IP）で Google の認証を
# 復元すると、Google がその場で Mac 側まで含めてセッションを全面失効させる（2026-09-21 実測・
# .claude/knowledge/reference/measurement-incidents.md）。実行先はカタログの google.request-indexing の
# selfHostedRunsOn（runs-on に渡すラベル配列。例: ["self-hosted","macOS","doboku-mac"]・"self-hosted" 必須は
# ci-write-gate が検証）で決め、null の間は gate job が警告と job summary を出して何もしない
# （検査ゼロを緑と呼ばない）。立ち上げと canary は backlog DN-0291。
#
# 書き込みの承認: .claude/config/ci-write-operations.json の google.request-indexing（risk low・scheduled・
# requiresSelfHostedRunner）。引数は固定で、ops-write.mjs exec --scheduled が CI 自身で plan を作る
# （scripts/lib/ci-write-gate.mjs 方針 5・6）。放置の検知は weekly-review-guard の check-gsc-indexing-due。

on:
  schedule:
    - cron: "0 5 * * 3" # 水 14:00 JST（index-coverage.yml 水 11:00 JST の順位表更新の後）。2 回無事なら毎日へ
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      runs_on: ${{ steps.gate.outputs.runs_on }}
    steps:
      - name: Checkout develop (catalog only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 1
          sparse-checkout: .claude/config

      - name: Read self-hosted runner labels from catalog
        id: gate
        run: |
          labels=$(node -e "
            const c = JSON.parse(require('fs').readFileSync('.claude/config/ci-write-operations.json', 'utf8'));
            const op = c.operations['google.request-indexing'];
            const l = op && op.selfHostedRunsOn;
            process.stdout.write(Array.isArray(l) && l.includes('self-hosted') ? JSON.stringify(l) : '');
          ")
          if [ -z "${labels}" ]; then
            echo "::warning::google.request-indexing の selfHostedRunsOn が null のため登録リクエストを送らない（hosted runner では Google のセッションが失効する・DN-0291）"
            {
              echo "## GSC request indexing: skipped"
              echo "self-hosted runner が未設定（ci-write-operations.json の selfHostedRunsOn が null）。登録リクエストは 1 件も送っていない。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "runner labels: ${labels}"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "runs_on=${labels}" >> "$GITHUB_OUTPUT"
          fi

  request:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ${{ fromJSON(needs.gate.outputs.runs_on) }}
    timeout-minutes: 40
    concurrency:
      group: auth-state-google
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      DOBOKU_AUTH_AGE_IDENTITY: ${{ secrets.DOBOKU_AUTH_AGE_IDENTITY }}
    steps:
      # 変数の設定ミスで hosted runner のラベルを指したときに、認証の復元より前で止める。
      - name: Refuse hosted runner
        run: |
          if [ "${RUNNER_ENVIRONMENT}" != "self-hosted" ]; then
            echo "::error::RUNNER_ENVIRONMENT=${RUNNER_ENVIRONMENT}。Google の認証は self-hosted runner でしか復元しない。"
            exit 1
          fi

      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      # --ignore-scripts を付けない。prepare が pre-commit フックを入れ、Publish ledger の commit にも
      # フルゲートが走るようにするため（ops-write.yml と同じ判断）。
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # doc-meta-index.json は git 追跡外の生成物。無いと commit 時に pre-commit フックが ENOENT で落ちる。
      - name: Build doc meta index
        run: node .claude/scripts/build-doc-meta-index.mjs --ci

      - name: Restore auth state
        id: restore
        continue-on-error: true
        uses: ./.github/actions/restore-auth-state
        with:
          service: google

      - name: Request indexing (ops-write --scheduled)
        id: exec
        if: steps.restore.outputs.status == 'authenticated'
        continue-on-error: true
        run: |
          set +e
          node scripts/ops-write.mjs exec --operation google.request-indexing --scheduled --commit
          rc=$?
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"

      - name: Writeback auth state (auth:ci-writeback)
        if: always() && steps.restore.outcome == 'success' && steps.restore.outputs.status == 'authenticated'
        run: |
          node scripts/playwright-auth.mjs ci-writeback --service google --collector-exit "${{ steps.exec.outputs.rc || 1 }}" --json

      # 送信の一部が失敗しても（gsc-request-indexing は受理に至らない件があると exit 2）、受理した分と
      # 失敗の内訳は history.json に残す。commit → fetch → rebase → push の順を厳守する（ops-write.yml と同じ）。
      - name: Publish ledger
        if: always() && steps.exec.outputs.rc != ''
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude/state/metrics/gsc-indexing/requests-latest.json .claude/state/metrics/gsc-indexing/history.json
          if git diff --cached --quiet; then
            echo "gsc-indexing の台帳に差分なし。commit しない。"
          else
            git commit -m "chore(gsc-indexing): 登録リクエスト $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            git fetch origin develop
            git rebase origin/develop
            git push origin HEAD:develop
          fi

      - name: Report failure
        if: always() && (steps.restore.outputs.status != 'authenticated' || steps.exec.outputs.rc != '0')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/report-automation-failure.mjs \
            --channel gsc-indexing \
            --title "GSC 登録リクエストが完走しない（restore=${{ steps.restore.outputs.status }} rc=${{ steps.exec.outputs.rc }}）" \
            --body "restore=${{ steps.restore.outputs.status }} rc=${{ steps.exec.outputs.rc }}。内訳は .claude/state/metrics/gsc-indexing/requests-latest.json。Mac 側の npm run auth:status -- --service google も確認する。run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Resolve failure channel on success
        if: always() && steps.exec.outputs.rc == '0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/report-automation-failure.mjs --resolve --channel gsc-indexing \
            --body "復旧 run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Cleanup auth root
        if: always()
        run: rm -rf "${DOBOKU_AUTH_ROOT:-/nonexistent-doboku-auth-root}"

      - name: Fail job when not completed
        if: always() && (steps.restore.outputs.status != 'authenticated' || steps.exec.outputs.rc != '0')
        run: exit 1
