name: Audit performance (PSI)

on:
  schedule:
    - cron: "0 17 * * *" # JST 02:00 daily (UTC 17:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run PSI audit (mobile + desktop)
        env:
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
        run: npm run fetch-psi-audit

      - name: Threshold check and report
        id: check
        continue-on-error: true
        run: |
          mkdir -p /tmp/psi-report
          npm run psi-audit:check -- --output /tmp/psi-report/report.md
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Stage outputs
        run: |
          mkdir -p /tmp/psi-publish
          cp -r .claude/state/metrics/psi/* /tmp/psi-publish/ 2>/dev/null || true
          cp /tmp/psi-report/report.md /tmp/psi-publish/latest-report.md 2>/dev/null || true
          ls -la /tmp/psi-publish

      - name: Publish to develop branch (.claude/state/metrics/psi/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin develop
          git checkout develop
          git pull --rebase origin develop

          mkdir -p .claude/state/metrics/psi
          cp -r /tmp/psi-publish/* .claude/state/metrics/psi/ 2>/dev/null || true

          git add .claude/state/metrics/psi
          if git diff --cached --quiet; then
            echo "No PSI changes to publish"
            exit 0
          fi

          git commit -m "chore(metrics): psi daily audit $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git push origin develop

      # GitHub Issue は廃止。しきい値違反は task-queue.json に append する
      # （information-architecture.md の 4 ゾーンモデル）。
      - name: Append to task-queue on threshold violations
        if: steps.check.outputs.exit_code == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin develop
          git checkout develop
          git pull --rebase origin develop

          DATE=$(date -u +%Y-%m-%d)
          node .claude/scripts/lib/task-queue.mjs add \
            --title "PSI しきい値割れ検知 ${DATE}" \
            --category infra --priority high --source ci:psi-audit \
            --dedupe-key ci:psi-audit:threshold \
            --notes "psi daily audit でしきい値違反を検出。詳細は .claude/state/metrics/psi/latest-report.md"
          npm run build-todo

          git add .claude/state/task-queue.json docs/project/TODO.md
          if git diff --cached --quiet; then
            echo "No task-queue changes to publish"
            exit 0
          fi

          git commit -m "chore(metrics): psi threshold violation -> task-queue $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git push origin develop
