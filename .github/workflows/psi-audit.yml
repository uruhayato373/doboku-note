name: Audit performance (PSI)

on:
  schedule:
    - cron: "0 17 * * *" # JST 02:00 daily (UTC 17:00)
  workflow_dispatch:

# DN-0109 Phase 1: develop への自動書込み系ワークフロー間の push 衝突を防ぐ共通グループ。
# 同時実行を待たせるだけで落とさない（cancel-in-progress: false）。
concurrency:
  group: develop-git-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    # 20 だった 2026-09-01 に「Run PSI audit」が 20 分で cancelled。44 計測を直列で回すと 15〜21 分
    # （リトライが積むと超える）で、上限が直列実測の下限に等しかった。fetch-psi-data を 4 並列にして
    # 見込み 6〜8 分にしたうえで、並列が効かず直列に退化しても収まる 40 に置く。
    timeout-minutes: 40
    steps:
      - name: Checkout develop
        # schedule はデフォルトブランチ（main）を checkout するため、ref を明示しないと
        # npm ci が main のフックを入れる。その後 publish step で develop へ切り替えると
        # フックの drift guard が bot commit を拒否して落ちる（2026-08-20 に psi-audit が
        # `[pre-commit] 導入済みフックが古い` で実際に失敗した）。fetch-metrics.yml と同じ形で
        # 最初から develop を checkout し、順序依存そのものを無くす。
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: develop

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # npm ci（--ignore-scripts なし）は prepare で pre-commit フックを入れる。そのフックの
      # check-x-campaign-plan などが src/config/doc-meta-index.json を直接読むが、これは
      # git 追跡外の生成物なので、ここで作らないと **commit の瞬間に ENOENT で落ちる**。
      # 症状はワークフロー全体の赤で、本来の処理が終わっていても記録が残らない。
      - name: Build doc meta index
        run: node .claude/scripts/build-doc-meta-index.mjs --ci


      - name: Run PSI audit (mobile + desktop)
        env:
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
        run: npm run fetch-psi-audit

      - name: Threshold check and report
        id: check
        run: |
          mkdir -p /tmp/psi-report
          set +e
          npm run psi-audit:check -- --output /tmp/psi-report/report.md
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Stage outputs
        run: |
          mkdir -p /tmp/psi-publish
          cp -r .claude/state/metrics/psi/* /tmp/psi-publish/ 2>/dev/null || true
          cp /tmp/psi-report/report.md /tmp/psi-publish/latest-report.md 2>/dev/null || true
          ls -la /tmp/psi-publish

      - name: Publish to develop branch (.claude/state/metrics/psi/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin develop
          git checkout develop
          git pull --rebase origin develop

          # npm ci は main のフックを prepare で導入するため、develop の
          # ソースへ切り替えた時点で bot commit 用フックも同期する。
          npm run pre-commit:install

          mkdir -p .claude/state/metrics/psi
          cp -r /tmp/psi-publish/* .claude/state/metrics/psi/ 2>/dev/null || true

          git add .claude/state/metrics/psi
          if git diff --cached --quiet; then
            echo "No PSI changes to publish"
            exit 0
          fi

          git commit -m "chore(metrics): psi daily audit $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git push origin develop

      # タスク自動化(task-queue.json/build-todo)は廃止(2026-06-11、.claude/todo/ 手動運用へ一本化)。
      # CI 失敗にするのは3種類だけ: field 実害 / 取得失敗率20%超 / **field 判定不能**。
      # 単発 lab 超過はレポート上の改善候補で赤にしない（2026-07-27 の誤報対策）。
      # field 判定不能 = CrUX が 1 件も返らない状態。判定材料が無いことを緑で隠さない（DN-0127）。
      - name: Fail on field violations or invalid input (アラート)
        if: steps.check.outputs.exit_code != '0'
        run: |
          echo "::error::PSI の field 実害 / 取得失敗率20%超 / field 判定不能（CrUX ゼロ）を検出。詳細は .claude/state/metrics/psi/latest-report.md の冒頭『field(CrUX) 取得』行。.claude/todo/ に手動で起票してください。"
          exit 1
