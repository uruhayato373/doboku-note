name: ☁️ Audit Cloudflare zone config (weekly)

# Cloudflare ゾーン設定（キャッシュ/圧縮/WAF/Bot Management）を REST API から取得し、
# 直前スナップショット（baseline）との差分だけを検知する read-only audit。
# 管理画面からの変更は誰でもできてしまい、気づかず SEO・障害調査で別原因を疑い続けるのを防ぐ。
# 是正はしない（検知・報告のみ）。
#
# rc=2（ドリフトあり）は**是正 or 承認するまで赤が正常**（verify-yt-status.yml と同じ考え方）。
# workflow_dispatch の accept_baseline: true で現在値を新しい baseline として commit すると緑に戻る。
#
# 前提 Secrets: CLOUDFLARE_ANALYTICS_API_TOKEN（Zone Settings:Read を含む読み取り専用・無ければ CLOUDFLARE_API_TOKEN に fallback）/ CLOUDFLARE_ACCOUNT_ID
# 実装: scripts/fetch-cloudflare-zone-config.mjs（lib: scripts/lib/cloudflare-zone-config.mjs）
# exit: 0 ドリフトなし / 1 認証・ネットワーク失敗 / 2 ドリフトあり

on:
  schedule:
    - cron: "47 21 * * 1" # JST 06:47 Monday（UTC 21:47 Sunday）
  workflow_dispatch:
    inputs:
      accept_baseline:
        description: "現在のゾーン設定を新しい baseline として承認する"
        type: boolean
        default: false

# DN-0109 Phase 1: develop への自動書込み系ワークフロー間の push 衝突を防ぐ共通グループ。
# 同時実行を待たせるだけで落とさない（cancel-in-progress: false）。
concurrency:
  group: develop-git-write
  cancel-in-progress: false

permissions:
  contents: write
  issues: write # automation-failure Issue の起票・自動クローズ（限定例外）

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # npm ci（--ignore-scripts なし）は prepare で pre-commit フックを入れる。そのフックの
      # check-x-campaign-plan などが src/config/doc-meta-index.json を直接読むが、これは
      # git 追跡外の生成物なので、ここで作らないと **commit の瞬間に ENOENT で落ちる**。
      - name: Build doc meta index
        run: node .claude/scripts/build-doc-meta-index.mjs --ci

      - name: Audit Cloudflare zone config
        id: audit
        continue-on-error: true
        env:
          CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          ARGS=""
          if [ "${{ inputs.accept_baseline }}" = "true" ]; then
            ARGS="--accept-baseline"
          fi
          node scripts/fetch-cloudflare-zone-config.mjs $ARGS 2>&1 | tee "$RUNNER_TEMP/cf-config.log"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Publish to develop (.claude/state/cloudflare/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 取得が失敗した run ではディレクトリ自体が無い。pathspec 不一致で git が exit 128 になり
          # 「取得失敗」が「publish 失敗」に見えるのを避ける（2026-09-21 初回 run で実測）。
          if [ -d .claude/state/cloudflare ]; then git add .claude/state/cloudflare; fi
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "chore(metrics): cloudflare zone config audit weekly $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git pull --rebase origin develop
          git push origin develop

      - name: Report - config drift (automation-failure Issue)
        if: steps.audit.outputs.exit_code == '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          node scripts/report-automation-failure.mjs \
            --channel cloudflare-config \
            --title "Cloudflare zone 設定ドリフト" \
            --body-file .claude/state/cloudflare/zone-config-drift.json

      - name: Report - fetch failure (automation-failure Issue)
        if: steps.audit.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          node scripts/report-automation-failure.mjs \
            --channel cloudflare-config \
            --title "Cloudflare zone config 取得失敗" \
            --body-file "$RUNNER_TEMP/cf-config.log"

      - name: Resolve - close cloudflare-config Issue on recovery
        if: steps.audit.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          node scripts/report-automation-failure.mjs --resolve --channel cloudflare-config \
            --body "復旧 run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Fail on drift or fetch error
        if: steps.audit.outputs.exit_code != '0'
        run: |
          if [ "${{ steps.audit.outputs.exit_code }}" = "2" ]; then
            echo "::error::Cloudflare zone 設定にドリフトを検出しました。.claude/state/cloudflare/zone-config-drift.json を確認し、意図した変更なら workflow_dispatch の accept_baseline を true にして再実行してください。"
          else
            echo "::error::fetch-cloudflare-zone-config.mjs が認証/ネットワークエラーで失敗しました（rc=${{ steps.audit.outputs.exit_code }}）。"
          fi
          exit 1
