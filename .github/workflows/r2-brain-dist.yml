name: R2 Brain Dist Upload

# Brain 商品配布物（content/brain/dist/）を R2 brain/dist/ へアップロードする。
# 手動トリガー専用（workflow_dispatch）。配布URLは storage.doboku-note.com/brain/dist/<file>。

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run（アップロードせず対象一覧のみ）'
        required: false
        default: false
        type: boolean
      file:
        description: '対象 basename（既存ZIP差替え時は必須）'
        required: false
        type: string
      overwrite:
        description: '同一 object key を上書き（file 指定必須）'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Upload brain dist to R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        run: |
          set -eu
          ARGS=()
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS+=(--dry-run); fi
          if [ -n "${{ github.event.inputs.file }}" ]; then ARGS+=(--file "${{ github.event.inputs.file }}"); fi
          if [ "${{ github.event.inputs.overwrite }}" = "true" ]; then ARGS+=(--overwrite); fi
          node scripts/upload-brain-dist-r2.mjs "${ARGS[@]}"

      - name: Purge overwritten distribution URL from CDN
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.overwrite == 'true' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DIST_FILE: ${{ github.event.inputs.file }}
        run: |
          set -euo pipefail
          test -n "$DIST_FILE"
          DOMAIN_RESPONSE=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/doboku-note/domains")
          ZONE_ID=$(printf '%s' "$DOMAIN_RESPONSE" | jq -er \
            '.result[] | select(.name == "doboku-note.com") | .zone_tag')
          DIST_URL="https://storage.doboku-note.com/brain/dist/$DIST_FILE"
          PURGE_PAYLOAD=$(jq -cn --arg url "$DIST_URL" '{files: [$url]}')
          PURGE_RESPONSE=$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$PURGE_PAYLOAD" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache")
          printf '%s' "$PURGE_RESPONSE" | jq -e '.success == true' >/dev/null
          echo "purged: $DIST_URL"
