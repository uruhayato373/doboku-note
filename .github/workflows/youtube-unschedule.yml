name: YouTube unschedule (manual)

# 2026-10-13: 運営者が YouTube の投稿を一旦止め、予約済みの公開も取り消すと決めた。台帳で scheduled の未来の公開を
# private のまま予約なしに戻し（動画は消さない）、台帳（content/registry）を uploaded_private に合わせて develop へ書き戻す。
# 既定は試運転（YouTube を読むだけ）。apply=true で外す。後で予約し直すときは通常の予約の手順を使う。
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "予約を外す（false は読むだけの試運転）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: youtube-video-migration
  cancel-in-progress: false

jobs:
  unschedule:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Verify unschedule rules
        run: node --test tests/youtube-unschedule.test.mjs
      - name: Unschedule on YouTube
        env:
          APPLY: ${{ inputs.apply }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$APPLY" = "true" ]; then
            node scripts/youtube-unschedule.mjs --apply --out .tmp/youtube-unscheduled.txt
          else
            node scripts/youtube-unschedule.mjs
          fi
      - name: Record in the content registry
        if: inputs.apply
        run: |
          set -euo pipefail
          test -s .tmp/youtube-unscheduled.txt || { echo "外した公開が 0 件"; exit 0; }
          while read -r id; do
            [ -n "$id" ] || continue
            node scripts/registry.mjs unschedule --pub "$id" --reason "運営者の指示で公開予約を解除（実行 $GITHUB_RUN_ID）"
          done < .tmp/youtube-unscheduled.txt
          node scripts/check-content-registry.mjs
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          node scripts/ci-data.mjs add --paths content/registry
          git diff --cached --quiet && exit 0
          git commit -m "chore(youtube): 公開予約を外した記録（run $GITHUB_RUN_ID）[skip ci]"
          git fetch origin develop
          git rebase origin/develop
          git push origin HEAD:develop
