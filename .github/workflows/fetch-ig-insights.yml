name: 📸 Fetch Instagram insights (weekly)

# Instagram Graph API から週次でインサイトを取得し、.claude/state/metrics/instagram/ へ commit する。
# 失敗・成功は automation-failure Issue（channel: ig-insights）で通知する（scripts/report-automation-failure.mjs）。
# ドリフト（--reconcile の差分）は赤にせず job summary に末尾だけ残す read-only 情報として扱う。
#
# 前提 Secrets: IG_GRAPH_ACCESS_TOKEN / IG_BUSINESS_ACCOUNT_ID
# 実装: scripts/fetch-ig-insights.mjs（lib: scripts/lib/ig-graph.mjs, scripts/lib/ig-reconcile-core.mjs）

# 2026-09-21: Meta の利用制限で Graph API トークンを発行できないため cron を外し dispatch 専用にした。
# 2026-09-23: Instagram は Graph API を使わない（ユーザー決定）。制限が解けても cron は戻さない。
# 公開状態の照合は login-collectors.yml（encrypted-state・verify-ig-status）が担う。
on:
  workflow_dispatch:

# DN-0109 Phase 1: develop への自動書込み系ワークフロー間の push 衝突を防ぐ共通グループ。
# 同時実行を待たせるだけで落とさない（cancel-in-progress: false）。
concurrency:
  group: develop-git-write
  cancel-in-progress: false

permissions:
  contents: write
  issues: write # automation-failure Issue の起票・自動クローズ（限定例外）

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # npm ci（--ignore-scripts なし）は prepare で pre-commit フックを入れる。そのフックの
      # check-x-campaign-plan などが src/config/doc-meta-index.json を直接読むが、これは
      # git 追跡外の生成物なので、ここで作らないと **commit の瞬間に ENOENT で落ちる**。
      - name: Build doc meta index
        run: node .claude/scripts/build-doc-meta-index.mjs --ci

      - name: Fetch Instagram insights
        id: fetch
        continue-on-error: true
        env:
          IG_GRAPH_ACCESS_TOKEN: ${{ secrets.IG_GRAPH_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
        run: |
          set -o pipefail
          node scripts/fetch-ig-insights.mjs --reconcile 2>&1 | tee "$RUNNER_TEMP/ig.log"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Publish to develop (.claude/state/metrics/instagram/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          node scripts/prune-state-snapshots.mjs --commit --family instagram

          git add .claude/state/metrics/instagram .claude/state/ig-reconcile/snapshot.json
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "chore(metrics): instagram insights weekly $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git pull --rebase origin develop
          git push origin develop

      - name: Summarize drift (job summary・赤にしない)
        if: always()
        run: |
          {
            echo "## Instagram insights fetch（$(date -u +%Y-%m-%dT%H:%MZ)）"
            echo '```'
            tail -5 "$RUNNER_TEMP/ig.log" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report - fetch failure (automation-failure Issue)
        if: steps.fetch.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          node scripts/report-automation-failure.mjs \
            --channel ig-insights \
            --title "Instagram insights 取得失敗（rc=${{ steps.fetch.outputs.exit_code }}）" \
            --body-file "$RUNNER_TEMP/ig.log"

      - name: Resolve - close ig-insights Issue on recovery
        if: steps.fetch.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          node scripts/report-automation-failure.mjs --resolve --channel ig-insights \
            --body "復旧 run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Fail on fetch error
        if: steps.fetch.outputs.exit_code != '0'
        run: |
          echo "::error::fetch-ig-insights.mjs が失敗しました（rc=${{ steps.fetch.outputs.exit_code }}）。automation-failure Issue（channel: ig-insights）を参照。"
          exit 1
