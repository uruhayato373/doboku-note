name: YouTube Single Publish

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'publish・概要欄同期・読取監査・公開状態の照合・指定した公開の予約解除'
        required: false
        default: publish
        type: choice
        options: [publish, sync-funnel, audit-funnel, reconcile, unschedule, purge-shorts-audit, purge-shorts, replace-cover]
      publication:
        description: '承認済みの通常動画の公開ID（初回または個別改訂版）か、初回のショートの公開ID'
        required: false
        type: string
      cover:
        description: 'replace-cover の差し替え先の表紙（台帳の素材 ID）'
        required: false
        type: string
      expect:
        description: 'registry publish-youtube dry-run の入力digest（64桁）。purge-shorts では試運転の digest'
        required: false
        type: string
      metadata_plan:
        description: '概要欄同期計画（省略時は予約済み17本）'
        required: false
        default: 'content/sns/youtube/metadata-plans/2026-10-31-funnel.json'
        type: string
  # 公開日時を過ぎた予約を毎朝 published へ照合する（DN-1070）。照合が手動のままだと台帳が scheduled に残り、
  # youtube-analytics（published だけを測る）から公開済みの動画が漏れる。schedule は main の版で走る
  schedule:
    - cron: '40 23 * * *' # 毎日 08:40 JST（前夜 20:30 の公開の後）

concurrency:
  group: youtube-single-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: inputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUB_ID: ${{ inputs.publication }}
      EXPECT: ${{ inputs.expect }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Validate one publication and input digest
        run: |
          [[ "$PUB_ID" =~ ^[a-z0-9-]+/[a-z0-9-]+/youtube\.(longform(\.[a-z0-9-]+)?|short\.[a-z0-9-]+)$ ]]
          [[ "$EXPECT" =~ ^[a-f0-9]{64}$ ]]
      - name: Upload private and wait for processing, cover, schedule
        run: |
          command=publish-youtube
          if [[ "$PUB_ID" == *'/youtube.longform.'* ]]; then command=publish-youtube-revision; fi
          npm run registry -- "$command" --pub "$PUB_ID" --phase upload --commit --expect "$EXPECT"
          # ショートは Studio で関連動画を設定して record-related で記録するまで予約しない（API で設定できない・DN-1002）
          if [[ "$PUB_ID" == *'/youtube.short.'* ]] && ! node -e 'const p=require("./content/registry/publications/youtube/"+process.env.PUB_ID.split("/")[0]+".json").publications.find(p=>p.id===process.env.PUB_ID);process.exit(p?.platform?.relatedVideoId?0:1)'; then
            echo "Short uploaded as private. Set the related video in Studio, then record-related and run publish again"
            exit 0
          fi
          for attempt in {1..15}; do
            npm run registry -- "$command" --pub "$PUB_ID" --phase schedule --commit --expect "$EXPECT"
            if node -e 'const p=require("./content/registry/publications/youtube/"+process.env.PUB_ID.split("/")[0]+".json").publications.find(p=>p.id===process.env.PUB_ID);process.exit(p?.status==="scheduled"?0:1)'; then
              echo "YouTube schedule verified in registry"
              exit 0
            fi
            sleep 20
          done
          echo 'YouTube processing or cover verification did not finish in time' >&2
          exit 1
      - name: Preserve verified registry state on develop
        if: always()
        run: |
          if [[ ! "$PUB_ID" =~ ^[a-z0-9-]+/[a-z0-9-]+/youtube\.(longform(\.[a-z0-9-]+)?|short\.[a-z0-9-]+)$ ]]; then exit 1; fi
          exam="${PUB_ID%%/*}"
          git add "content/registry/publications/youtube/${exam}.json"
          if ! git diff --cached --quiet; then
            git config user.name 'doboku-note-bot'
            git config user.email 'bot@doboku-note.com'
            git commit -m "Record verified YouTube publication state"
            git pull --rebase origin develop
            git push origin HEAD:develop
          fi
  replace-cover:
    # 投稿済みの動画の表紙だけを台帳の表紙に差し替える（2026-11-11）。手元で registry replace-youtube-cover --stage-r2 を済ませてから流す
    if: inputs.mode == 'replace-cover'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUB_ID: ${{ inputs.publication }}
      COVER: ${{ inputs.cover }}
      EXPECT: ${{ inputs.expect }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Replace the cover and verify it by reading it back
        run: |
          [[ "$PUB_ID" =~ ^[a-z0-9-]+/[a-z0-9-]+/youtube\.(longform(\.[a-z0-9-]+)?|short\.[a-z0-9-]+)$ ]]
          [[ "$COVER" =~ ^[a-z0-9-]+/[a-z0-9-]+/[a-z0-9./-]+$ ]]
          [[ "$EXPECT" =~ ^[a-f0-9]{64}$ ]]
          npm run registry -- replace-youtube-cover --pub "$PUB_ID" --cover "$COVER" --commit --expect "$EXPECT"
      - name: Record the verified cover on develop
        run: |
          exam="${PUB_ID%%/*}"
          git add "content/registry/publications/youtube/${exam}.json"
          if ! git diff --cached --quiet; then
            git config user.name 'doboku-note-bot'
            git config user.email 'bot@doboku-note.com'
            git commit -m "Record replaced YouTube cover"
            git pull --rebase origin develop
            git push origin HEAD:develop
          fi
  unschedule:
    if: inputs.mode == 'unschedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      PUB_IDS: ${{ inputs.publication }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - run: node scripts/youtube-unschedule.mjs --apply --pub "$PUB_IDS"
      - name: Match the ledger to the verified state
        run: |
          while read -r id; do
            npm run -s registry -- unschedule --pub "$id" --reason '読み上げを直した版へ差し替える'
          done < .tmp/youtube-unscheduled.txt
          git add content/registry/publications/youtube
          if ! git diff --cached --quiet; then
            git config user.name 'doboku-note-bot'
            git config user.email 'bot@doboku-note.com'
            git commit -m 'Unschedule YouTube videos to replace them'
            git pull --rebase origin develop
            git push origin HEAD:develop
          fi
  purge-shorts:
    # 旧工程の非公開ショートを消す（取り消せない・2026-11-10 運営者の決定）。audit は読むだけ、purge-shorts は試運転と同じ digest のときだけ消す
    if: inputs.mode == 'purge-shorts-audit' || inputs.mode == 'purge-shorts'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      MODE: ${{ inputs.mode }}
      EXPECT: ${{ inputs.expect }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Audit or delete old private Shorts
        run: |
          if [[ "$MODE" == 'purge-shorts' ]]; then
            [[ "$EXPECT" =~ ^[a-f0-9]{64}$ ]]
            node scripts/youtube-purge-shorts.mjs --apply --expect "$EXPECT"
          else
            node scripts/youtube-purge-shorts.mjs
          fi
  sync-funnel:
    if: inputs.mode == 'sync-funnel'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      METADATA_PLAN: ${{ inputs.metadata_plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - run: npm run check-content-registry
      - run: '[[ "$METADATA_PLAN" =~ ^content/sns/youtube/metadata-plans/[a-z0-9-]+\.json$ ]]'
      - run: node scripts/youtube-sync-funnel.mjs --plan "$METADATA_PLAN" --commit
  audit-funnel:
    if: inputs.mode == 'audit-funnel'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - run: npm run check-youtube-funnels
      - run: node scripts/youtube-audit-live-funnels.mjs
  reconcile:
    if: inputs.mode == 'reconcile' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - run: node scripts/registry-reconcile.mjs
      - name: Preserve observed publication states
        run: |
          git add content/registry/publications/youtube .claude/state/registry-reconcile/youtube.json
          if ! git diff --cached --quiet; then
            git config user.name 'doboku-note-bot'
            git config user.email 'bot@doboku-note.com'
            git commit -m 'Reconcile published YouTube videos with API'
            git pull --rebase origin develop
            git push origin HEAD:develop
          fi
