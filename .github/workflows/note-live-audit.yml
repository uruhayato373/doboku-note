name: Audit note live state

# note の公開状態を public API だけで横断照合する。認証済みブラウザやローカル端末は不要。
# 構造・タグ・本文破損・frontmatter公開状態・マガジンSoT・CTAライブ反映を同じ週次CIに集約する。
# ソース→ライブ再公開ドリフトは surfacer としてJSONを残し、公開操作自体はログインが必要なため行わない。
#
# 背景: この監査は長らくローカル専用で、かつ会社 PC では Node の fetch がプロキシに
#   遮断され 675/675 が FETCH_ERR でも exit 0 を返していた（検査ゼロの偽 PASS）。
#   2026-07-28 に curl 経路化＋「取得失敗率 20% 超で exit 1」を入れ、初回の実検査で
#   FULL_LOCK 2 件（¥980・¥1,980 の有料記事が無料プレビュー 0 字）を検出している。
#   ローカル実行は「回すのを忘れる」リスクが残るため CI へ載せる。
#
# Actions ランナーから note API へ到達できることは 2026-08-03 の定期実行で確認済み。
# ただし到達性の将来ドリフトを本体の「取得失敗」と区別するため、先頭の疎通確認は残す。

on:
  schedule:
    - cron: "30 22 * * 0" # 毎週月曜 07:30 JST（r2-audit の 30 分後にずらす）
  workflow_dispatch:

# DN-0109 Phase 1: develop への自動書込み系ワークフロー間の push 衝突を防ぐ共通グループ。
# 同時実行を待たせるだけで落とさない（cancel-in-progress: false）。
concurrency:
  group: develop-git-write
  cancel-in-progress: false

permissions:
  # snapshot（.claude/state/note/）を develop へ commit back するため write が要る。
  # read のままだと artifact にしか残らず、2026-06-12 の snapshot が 73 日腐り続けた。
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout develop
        # schedule はデフォルトブランチ（main）の定義で走り、ref を書かないと main を checkout する。
        # この workflow は snapshot を develop へ push するので、最初から develop を見て
        # 「main で検査し develop へ書く」ねじれを無くす（fetch-metrics.yml が 2026-08 に
        # このねじれで drift guard に弾かれ、GA4 スナップショットが 8 日間停止した）。
        # fetch-depth は既定（1）。full clone はランナーを枯渇させる。
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: develop

      - name: note API 疎通確認（届かなければここで落とす）
        run: |
          set -euo pipefail
          mkdir -p .tmp
          code=$(curl -s -o /tmp/note-probe.json -w '%{http_code}' -m 30 \
            -H 'User-Agent: Mozilla/5.0' -H 'Accept: application/json' \
            https://note.com/api/v3/notes/n252fdfb14e54)
          echo "HTTP $code"
          head -c 300 /tmp/note-probe.json || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::note API に到達できません（HTTP $code）。Actions の IP がブロックされている可能性があります。"
            exit 1
          fi

      - name: Setup Node
        if: always()
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      # 監査スクリプト自体は node 組込み + curl だけで動くので依存は要らない。
      # だが最後の publish 段が pre-commit フックを入れて commit するため、
      # フックが import する gray-matter 等が無いと **commit が丸ごと落ちて job が赤になる**。
      # 2026-08-25: DN-0126 で CRITICAL 71 を解消したあと workflow_dispatch したところ、
      # 監査は全て通ったのに publish 段の ERR_MODULE_NOT_FOUND: gray-matter で失敗した
      # （21 日赤の原因は 71 件だけではなかった）。psi-audit.yml と同じく npm ci を置く。
      - name: Install dependencies
        if: always()
        run: npm ci --legacy-peer-deps

      # npm ci（--ignore-scripts なし）は prepare で pre-commit フックを入れる。そのフックの
      # check-x-campaign-plan などが src/config/doc-meta-index.json を直接読むが、これは
      # git 追跡外の生成物なので、ここで作らないと **commit の瞬間に ENOENT で落ちる**。
      # 症状はワークフロー全体の赤で、本来の処理が終わっていても記録が残らない。
      - name: Build doc meta index
        run: node .claude/scripts/build-doc-meta-index.mjs --ci


      - name: Audit note live structure
        if: always()
        run: node scripts/check-note-structure.mjs --ci

      - name: Audit note live hashtags
        if: always()
        run: node scripts/check-note-live-tags.mjs

      - name: Audit note live body (URL headings / empty quotes / images)
        if: always()
        run: node scripts/check-note-live-headings.mjs

      # audit-note-cards は 2026-07-28 の「article.md 固定で型別ファイルを落とす」事故の当事者で、
      # 直したあと**どの経路にも配線されないまま**だった（2026-08-18 に実質オーファンとして検出）。
      # ライブ本文を curl で取りに行くので quality:audit（ローカル・オフライン前提）には置けない。
      # この workflow は冒頭で note API 疎通を確認しており、live 取得系の正しい置き場。
      - name: Audit note live link cards (単独URL段落の未カード / OGP 到達)
        if: always()
        run: node scripts/audit-note-cards.mjs

      - name: Reconcile noteStatus with live status
        if: always()
        run: |
          set -o pipefail
          node scripts/verify-note-status.mjs --ci --json --snapshot | tee .tmp/note-status.json

      - name: Reconcile magazines with source-of-truth
        if: always()
        run: |
          set -o pipefail
          # --contents を渡さないと magazines[].notes[] が入らない＝収録リストが取れず、
          # check-magazine-membership の軸 C が永久に「検査不成立」になる（2026-08-24 まで実際そうだった）。
          node scripts/verify-note-magazines.mjs --vs-txt --contents --json | tee .tmp/note-magazines.log

      # snapshot 再生成の直後に回す。ライブ実体に対して三軸（repo 実数 ↔ SoT の price 件数 ↔
      # ライブ収録数）を突合できるのは週次のここだけ（pre-commit は軸 A↔B のみ）。
      - name: Verify magazine membership (repo x SoT x live)
        if: always()
        run: node scripts/check-magazine-membership.mjs --ci

      - name: Audit note funnel live reflection (D5)
        if: always()
        run: |
          set -o pipefail
          node scripts/audit-note-funnel.mjs --live --ci | tee .tmp/note-funnel-live.log

      # ソース変更からライブへの再公開待ちは正常な中間状態でもあるためゲートにはしない。
      # cloud weekly-review に依存せず、CI artifact で本文/タグ/メタ/アセットのdirty flagを供給する。
      - name: Surface note republish drift
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/check-note-republish.mjs --json | tee .tmp/note-republish.json

      - name: Stage outputs
        if: always()
        run: |
          mkdir -p /tmp/note-publish
          cp .claude/state/note/magazines-snapshot.json /tmp/note-publish/ 2>/dev/null || true
          cp .claude/state/note/status-snapshot.json /tmp/note-publish/ 2>/dev/null || true

      # if: always() — **監査が赤でも snapshot は commit する**。鮮度の腐敗こそが止めたい対象で、
      # 「監査が落ちたので snapshot も更新しない」は問題を二重にする。
      - name: Publish snapshots to develop (.claude/state/note/)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin develop
          # 監査中の in-place 書き込みで作業ツリーが dirty になっている可能性があるため、
          # 成果物を /tmp に退避済みの状態で origin/develop 先頭へ hard reset してから復元する。
          git checkout -f develop
          git reset --hard origin/develop
          # hard reset でフック定義が変わりうるので入れ直す（drift guard に拒否されると commit が丸ごと落ちる）。
          npm run pre-commit:install

          mkdir -p .claude/state/note
          cp /tmp/note-publish/*.json .claude/state/note/ 2>/dev/null || true

          git add .claude/state/note/magazines-snapshot.json .claude/state/note/status-snapshot.json
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "chore(note): live snapshot weekly fetch $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git push origin develop

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: note-live-audit
          path: |
            .tmp/note-structure-audit.md
            .tmp/note-status.json
            .tmp/note-magazines.log
            .tmp/note-funnel-live.log
            .tmp/note-republish.json
            .claude/state/note/magazines-snapshot.json
            .claude/state/note/status-snapshot.json
          if-no-files-found: ignore
