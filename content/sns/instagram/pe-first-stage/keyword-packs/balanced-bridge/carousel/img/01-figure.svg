<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="等しい上下枝を持つ平衡ブリッジでは中点CとDが等電位で中央抵抗の電流が0になる"><rect width="400" height="500" fill="#ffffff"/><defs><style>text{font-family:Inter,'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif;fill:#1a3a5c}</style><marker id="arrow" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker></defs><text x="200" y="35" font-size="18" text-anchor="middle">両端の電位が等しければ電流は0</text><path d="M40,130 L360,130" stroke="#2e6da4" stroke-width="2" fill="none"  /><path d="M40,330 L360,330" stroke="#2e6da4" stroke-width="2" fill="none"  /><path d="M40,130 L40,330" stroke="#2e6da4" stroke-width="2" fill="none"  /><path d="M360,130 L360,330" stroke="#2e6da4" stroke-width="2" fill="none"  /><path d="M200,130 L200,330" stroke="#d4a017" stroke-width="2" fill="none"  /><rect x="91" y="120" width="48" height="20" fill="#fff" stroke="#2e6da4" stroke-width="2"/><text x="115" y="109" font-size="15" text-anchor="middle">2 Ω</text><rect x="261" y="120" width="48" height="20" fill="#fff" stroke="#2e6da4" stroke-width="2"/><text x="285" y="109" font-size="15" text-anchor="middle">2 Ω</text><rect x="91" y="320" width="48" height="20" fill="#fff" stroke="#2e6da4" stroke-width="2"/><text x="115" y="309" font-size="15" text-anchor="middle">2 Ω</text><rect x="261" y="320" width="48" height="20" fill="#fff" stroke="#2e6da4" stroke-width="2"/><text x="285" y="309" font-size="15" text-anchor="middle">2 Ω</text><rect x="190" y="200" width="20" height="54" fill="#fff3cd" stroke="#d4a017" stroke-width="2"/><circle cx="40" cy="230" r="4" fill="#1a3a5c"/><circle cx="360" cy="230" r="4" fill="#1a3a5c"/><circle cx="200" cy="130" r="4" fill="#1a3a5c"/><circle cx="200" cy="330" r="4" fill="#1a3a5c"/><text x="19" y="207" font-size="16" text-anchor="middle">A</text><text x="20" y="250" font-size="14" text-anchor="middle">12 V</text><text x="381" y="207" font-size="16" text-anchor="middle">B</text><text x="380" y="250" font-size="14" text-anchor="middle">0 V</text><text x="200" y="110" font-size="17" text-anchor="middle">C：6 V</text><text x="200" y="363" font-size="17" text-anchor="middle">D：6 V</text><text x="244" y="223" font-size="16" text-anchor="start">電位差0 V</text><text x="244" y="248" font-size="16" text-anchor="start">電流0 A</text><rect x="24" y="393" width="352" height="85" rx="10" fill="#e8f0fe"/><text x="200" y="421" font-size="18" text-anchor="middle">上下は 4 Ω と 4 Ω の並列</text><text x="200" y="449" font-size="21" text-anchor="middle">合成抵抗は 2 Ω</text><text x="200" y="471" font-size="14" text-anchor="middle">抵抗値や電源端子を変えたら再判定</text></svg>
