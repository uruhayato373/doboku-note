<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="図の読み方と条件"><style>text{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif}</style><rect width="400" height="500" fill="#ffffff"/><rect width="400" height="72" fill="#1a3a5c"/><text x="24" y="46" font-size="24" fill="#ffffff">立式と検算の3ステップ</text><text x="24" y="115" font-size="22" fill="#1a3a5c">1  上下の中点を見る</text><text x="44" y="146" font-size="18" fill="#1a3a5c">図ではどちらも6 V</text><text x="24" y="192" font-size="22" fill="#1a3a5c">2  電位差が0</text><text x="44" y="223" font-size="18" fill="#1a3a5c">中央枝の電流も0 A</text><text x="24" y="269" font-size="22" fill="#1a3a5c">3  条件が違えば立式</text><text x="44" y="300" font-size="18" fill="#1a3a5c">節点で流入と流出をそろえる</text><rect x="20" y="345" width="360" height="92" rx="10" fill="#fff6eb" stroke="#a36b2c"/><text x="36" y="375" font-size="18" fill="#1a3a5c">形が似ているだけでは不十分</text><text x="36" y="407" font-size="18" fill="#1a3a5c">抵抗比・接続条件を確かめる</text><rect y="460" width="400" height="40" fill="#1a3a5c"/><text x="104" y="486" font-size="16" fill="#ffffff">doboku-note.com</text></svg>