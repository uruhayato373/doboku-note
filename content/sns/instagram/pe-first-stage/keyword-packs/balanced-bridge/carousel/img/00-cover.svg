
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500" role="img" aria-label="技術士 第一次 橋形回路の中央枝を外してよい条件を同電位と節点の立式で判断したい。">
  <defs><style>text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }</style></defs>
  <rect width="400" height="500" fill="#1a3a5c"/>
  <rect x="0" y="0" width="400" height="5" fill="#a36b2c"/>

  
  <rect x="24" y="20" width="110" height="26" rx="13" fill="#a36b2c"/>
  <text x="79" y="37" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">技術士 第一次</text>
  <rect x="144" y="20" width="124" height="26" rx="13" fill="none" stroke="#a36b2c" stroke-width="1.5"/>
  <text x="206" y="37" text-anchor="middle" font-size="11" fill="#d4956a">基礎科目・電気</text>

  
  <text x="200" y="170" text-anchor="middle" font-size="42" font-weight="bold" fill="#ffffff">中央の抵抗に</text>
