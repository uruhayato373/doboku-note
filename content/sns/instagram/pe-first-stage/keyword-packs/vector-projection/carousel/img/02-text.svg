<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="図の読み方と条件"><style>text{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif}</style><rect width="400" height="500" fill="#ffffff"/><rect width="400" height="72" fill="#1a3a5c"/><text x="24" y="46" font-size="24" fill="#ffffff">立式と検算の3ステップ</text><text x="24" y="115" font-size="22" fill="#1a3a5c">1  係数は内積から</text><text x="44" y="146" font-size="18" fill="#1a3a5c">a・b を b・b で割る</text><text x="24" y="192" font-size="22" fill="#1a3a5c">2  方向も戻す</text><text x="44" y="223" font-size="18" fill="#1a3a5c">係数 × b が射影ベクトル</text><text x="24" y="269" font-size="22" fill="#1a3a5c">3  直角で検算</text><text x="44" y="300" font-size="18" fill="#1a3a5c">(a − p)・b が0になる</text><rect x="20" y="345" width="360" height="92" rx="10" fill="#fff6eb" stroke="#a36b2c"/><text x="36" y="375" font-size="18" fill="#1a3a5c">bは零ベクトルにしない</text><text x="36" y="407" font-size="18" fill="#1a3a5c">長さは p のノルムを求める</text><rect y="460" width="400" height="40" fill="#1a3a5c"/><text x="104" y="486" font-size="16" fill="#ffffff">doboku-note.com</text></svg>