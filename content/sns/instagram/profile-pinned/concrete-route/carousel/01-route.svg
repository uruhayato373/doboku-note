<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif}.title{font-size:58px;font-weight:800;fill:#15283A}.subtitle{font-size:29px;font-weight:600;fill:#34485C}.label{font-size:30px;font-weight:700;fill:#7151A8}.choice{font-size:35px;font-weight:700;fill:#15283A}.step{font-size:36px;font-weight:700}.num{font-size:30px;font-weight:800}.foot{font-size:26px;font-weight:600;fill:#526679}</style><rect width="1080" height="1350" fill="#F7F9FC"/><rect width="1080" height="20" fill="#7151A8"/><text x="92" y="115" class="label">保存版｜学習の入口</text><text x="92" y="205" class="title">コンクリート試験対策</text><text x="92" y="263" class="subtitle">技士と主任技士は、入口を分けて学ぶ</text><text x="92" y="325" class="label">対象を選ぶ</text><rect x="92" y="350" width="896" height="78" rx="20" fill="#FFFFFF" stroke="#7151A8" stroke-width="3"/><text x="540" y="402" text-anchor="middle" class="choice">コンクリート技士</text>
