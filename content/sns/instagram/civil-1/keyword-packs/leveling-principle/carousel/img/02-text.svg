<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="測量 図の読み方と注意点"><style>text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif}</style><rect width="400" height="500" fill="#ffffff"/><rect width="400" height="60" fill="#1a3a5c"/><text x="200" y="24" text-anchor="middle" font-size="13" fill="#ffffff">1級土木 | 測量</text><text x="200" y="48" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">図を読む3つのポイント</text><circle cx="32" cy="92" r="15" fill="#1a3a5c"/><text x="32" y="97" text-anchor="middle" font-size="15" fill="#ffffff">1</text><text x="57" y="96" font-size="16" font-weight="bold" fill="#1a3a5c">高低差は後視 a − 前視 b</text><text x="24" y="127" font-size="14" fill="#555">同じ水平な視準線から両方を読む</text><circle cx="32" cy="180" r="15" fill="#1a3a5c"/><text x="32" y="185" text-anchor="middle" font-size="15" fill="#ffffff">2</text><text x="57" y="184" font-size="16" font-weight="bold" fill="#1a3a5c">標高は既知点から引き継ぐ</text><text x="24" y="215" font-size="14" fill="#555">到達点の標高 = 既知点の標高 + 高低差</text><circle cx="32" cy="268" r="15" fill="#1a3a5c"/><text x="32" y="273" text-anchor="middle" font-size="15" fill="#ffffff">3</text><text x="57" y="272" font-size="16" font-weight="bold" fill="#1a3a5c">レベルは標尺から等距離へ</text><text x="24" y="303" font-size="14" fill="#555">視準線誤差などの影響を抑える</text><rect x="20" y="345" width="360" height="95" rx="6" fill="#fce8d0"/><text x="35" y="369" font-size="15" font-weight="bold" fill="#a36b2c">混同しないために</text><text x="35" y="395" font-size="14" fill="#555">標尺の読みが大きいほど、</text><text x="35" y="419" font-size="14" fill="#555">その点の地盤が高いわけではありません。</text><rect y="460" width="400" height="40" fill="#1a3a5c"/><text x="200" y="485" text-anchor="middle" font-size="13" fill="#ffffff">doboku-note.com</text></svg>