<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="3種類の余裕時間（トータルフロート・フリーフロート・インターフェアリングフロート）を1つのタイムラインで比較">
<rect width="400" height="500" fill="#ffffff"/>
  <style>
    .title { font-family: "Hiragino Sans","Yu Gothic",sans-serif; font-size: 13px; fill: #555; }
    .row-label { font-family: "Hiragino Sans","Yu Gothic",sans-serif; font-size: 14px; fill: #222; font-weight: 600; }
    .axis-label { font-family: "Hiragino Sans","Yu Gothic",sans-serif; font-size: 13px; fill: #555; }
    .float-tf { font-family: "Hiragino Sans","Yu Gothic",sans-serif; font-size: 14px; fill: #1a3a5c; font-weight: 700; }
    .float-ff { font-family: "Hiragino Sans","Yu Gothic",sans-serif; font-size: 14px; fill: #3a7d44; font-weight: 700; }
    .float-if { font-family: "Hiragino Sans","Yu Gothic",sans-serif; font-size: 14px; fill: #b22234; font-weight: 700; }
    .sub { font-family: "Hiragino Sans","Yu Gothic",sans-serif; font-size: 13px; fill: #555; }
    .rule-title { font-family: "Hiragino Sans","Yu Gothic",sans-serif; font-size: 14px; fill: #1a3a5c; font-weight: 700; }
    .rule-body { font-family: "Hiragino Sans","Yu Gothic",sans-serif; font-size: 13px; fill: #222; }
  </style>

  <text x="200" y="22" text-anchor="middle" class="title">TF = 5日・FF = 3日・IF = 2日の例</text>

  <!-- timeline axis (y=380 に下げてタイムライン領域を拡大) -->
  <line x1="55" y1="370" x2="385" y2="370" stroke="#222" stroke-width="1.5"/>
  <text x="55"  y="385" text-anchor="middle" class="axis-label">0</text>
  <text x="110" y="385" text-anchor="middle" class="axis-label">2</text>
  <text x="165" y="385" text-anchor="middle" class="axis-label">4</text>
  <text x="220" y="385" text-anchor="middle" class="axis-label">6</text>
  <text x="275" y="385" text-anchor="middle" class="axis-label">8</text>
  <text x="330" y="385" text-anchor="middle" class="axis-label">10</text>
  <text x="385" y="385" text-anchor="middle" class="axis-label">12</text>

  <!-- tick marks -->
  <line x1="55"  y1="368" x2="55"  y2="373" stroke="#222"/>
  <line x1="110" y1="368" x2="110" y2="373" stroke="#222"/>
  <line x1="165" y1="368" x2="165" y2="373" stroke="#222"/>
  <line x1="220" y1="368" x2="220" y2="373" stroke="#222"/>
  <line x1="275" y1="368" x2="275" y2="373" stroke="#222"/>
  <line x1="330" y1="368" x2="330" y2="373" stroke="#222"/>
  <line x1="385" y1="368" x2="385" y2="373" stroke="#222"/>

  <!-- 1 目盛り = 27.5px = 1日 (12日で385-55=330px) -->
  <!-- 3日=82.5px → x=137.5、7日=192.5px → x=247.5、10日=275px → x=330、12日=330px → x=385 -->

  <!-- Row 1: Activity at EST (earliest start), 3日〜7日 -->
  <text x="12" y="88" class="row-label">EST で開始</text>
  <text x="12" y="102" class="sub">（最も早く）</text>
  <!-- 3日=x137.5、4日幅=110px -->
  <rect x="137" y="74" width="110" height="26" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="192" y="92" text-anchor="middle" class="sub">作業（4日）</text>
  <text x="137" y="66" text-anchor="middle" class="axis-label">3日</text>
  <text x="247" y="66" text-anchor="middle" class="axis-label">7日（EFT）</text>

  <!-- Row 2: Successor activity at its EST, 10日〜 -->
  <text x="12" y="150" class="row-label">後続作業</text>
  <text x="12" y="164" class="sub">（10日から開始）</text>
  <!-- 10日=x330、幅55px (2日) -->
  <rect x="330" y="136" width="55" height="26" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
  <text x="357" y="154" text-anchor="middle" class="sub">後続</text>
  <text x="330" y="128" text-anchor="middle" class="axis-label">後続EST 10日</text>

  <!-- FF bracket (EFT=247 〜 後続EST=330) -->
  <line x1="247" y1="178" x2="330" y2="178" stroke="#3a7d44" stroke-width="2"/>
  <line x1="247" y1="173" x2="247" y2="183" stroke="#3a7d44" stroke-width="2"/>
  <line x1="330" y1="173" x2="330" y2="183" stroke="#3a7d44" stroke-width="2"/>
  <text x="288" y="198" text-anchor="middle" class="float-ff">FF = 3日</text>

  <!-- Row 3: Activity at LST (latest start), 8日〜12日 -->
  <text x="12" y="248" class="row-label">LST で開始</text>
  <text x="12" y="262" class="sub">（最も遅く）</text>
  <!-- 8日=x275、4日幅=110px、LFT=12日=x385 -->
  <rect x="275" y="234" width="110" height="26" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text x="330" y="252" text-anchor="middle" class="sub">作業（4日）</text>
  <text x="275" y="226" text-anchor="middle" class="axis-label">8日（LST）</text>
  <text x="386" y="279" text-anchor="end" class="axis-label">12日（LFT）</text>

  <!-- TF bracket (EST=137 〜 LST=275) -->
  <line x1="137" y1="290" x2="275" y2="290" stroke="#d4a017" stroke-width="2"/>
  <line x1="137" y1="285" x2="137" y2="295" stroke="#d4a017" stroke-width="2"/>
  <line x1="275" y1="285" x2="275" y2="295" stroke="#d4a017" stroke-width="2"/>
  <text x="206" y="310" text-anchor="middle" class="float-tf">TF = 5日</text>

  <!-- IF = TF - FF = 12 - 10 = 2 days, on the same finish-time axis -->
  <line x1="330" y1="328" x2="385" y2="328" stroke="#b22234" stroke-width="2"/>
  <line x1="330" y1="323" x2="330" y2="333" stroke="#b22234" stroke-width="2"/>
  <line x1="385" y1="323" x2="385" y2="333" stroke="#b22234" stroke-width="2"/>
  <text x="358" y="351" text-anchor="middle" class="float-if">IF = 2日</text>

  <rect x="20" y="403" width="360" height="85" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="36" y="425" class="rule-body">TF = LST − EST = LFT − EFT</text>
  <text x="36" y="450" class="rule-body">FF = 後続EST − 当作業EFT</text>
  <text x="36" y="475" class="rule-body">IF = TF − FF（後続へ影響する余裕）</text>
</svg>
