<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="コンクリート 図の読み方と注意点"><style>text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif}</style><rect width="400" height="500" fill="#ffffff"/><rect width="400" height="60" fill="#1a3a5c"/><text x="200" y="24" text-anchor="middle" font-size="13" fill="#ffffff">1級土木 | コンクリート</text><text x="200" y="48" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">図を読む3つのポイント</text><circle cx="32" cy="92" r="15" fill="#1a3a5c"/><text x="32" y="97" text-anchor="middle" font-size="15" fill="#ffffff">1</text><text x="57" y="96" font-size="16" font-weight="bold" fill="#1a3a5c">空隙の水と表面の水を分ける</text><text x="24" y="127" font-size="14" fill="#555">絶乾・気乾は空隙の水が少ない状態</text><circle cx="32" cy="180" r="15" fill="#1a3a5c"/><text x="32" y="185" text-anchor="middle" font-size="15" fill="#ffffff">2</text><text x="57" y="184" font-size="16" font-weight="bold" fill="#1a3a5c">配合計算は表乾が基準</text><text x="24" y="215" font-size="14" fill="#555">内部は満水でも、表面は乾いている</text><circle cx="32" cy="268" r="15" fill="#1a3a5c"/><text x="32" y="273" text-anchor="middle" font-size="15" fill="#ffffff">3</text><text x="57" y="272" font-size="16" font-weight="bold" fill="#1a3a5c">湿潤なら表面にも水がある</text><text x="24" y="303" font-size="14" fill="#555">表面水を考慮して練混ぜ水を補正</text><rect x="20" y="345" width="360" height="95" rx="6" fill="#fce8d0"/><text x="35" y="369" font-size="15" font-weight="bold" fill="#a36b2c">混同しないために</text><text x="35" y="395" font-size="14" fill="#555">「内部が満水」と「表面がぬれている」は</text><text x="35" y="419" font-size="14" fill="#555">同じ状態ではありません。</text><rect y="460" width="400" height="40" fill="#1a3a5c"/><text x="200" y="485" text-anchor="middle" font-size="13" fill="#ffffff">doboku-note.com</text></svg>