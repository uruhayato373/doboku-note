<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="1級土木 ウェルポイント工法 図の読み方と条件">
  <style>text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif}</style>
  <rect width="400" height="500" fill="#ffffff"/>
  <rect width="400" height="60" fill="#1a3a5c"/>
  <text x="200" y="24" text-anchor="middle" font-size="13" fill="#ffffff">1級土木 | 土工・排水</text>
  <text x="200" y="48" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">図を読む3つのポイント</text>
  <circle cx="32" cy="92" r="15" fill="#1a3a5c"/>
  <text x="32" y="97" text-anchor="middle" font-size="15" fill="#ffffff">1</text>
  <text x="57" y="97" font-size="17" font-weight="bold" fill="#1a3a5c">掘削箇所の周囲に設置</text>
  <text x="24" y="128" font-size="14" fill="#555">多数のウェルポイントを配管でつなぐ</text>
  <circle cx="32" cy="180" r="15" fill="#1a3a5c"/>
  <text x="32" y="185" text-anchor="middle" font-size="15" fill="#ffffff">2</text>
  <text x="57" y="185" font-size="17" font-weight="bold" fill="#1a3a5c">真空ポンプで強制排水</text>
  <text x="24" y="216" font-size="14" fill="#555">先端の吸水部から地下水を集める</text>
  <circle cx="32" cy="268" r="15" fill="#1a3a5c"/>
  <text x="32" y="273" text-anchor="middle" font-size="15" fill="#ffffff">3</text>
  <text x="57" y="273" font-size="17" font-weight="bold" fill="#1a3a5c">地下水位を下げる</text>
  <text x="24" y="304" font-size="14" fill="#555">掘削箇所への湧水を抑えて施工する</text>
  <rect x="20" y="345" width="360" height="95" rx="6" fill="#fce8d0"/>
  <text x="35" y="370" font-size="15" font-weight="bold" fill="#a36b2c">どんな地盤でも使える？</text>
  <text x="35" y="396" font-size="14" fill="#555">土質・揚水高さ・排水量で工法を選ぶ。</text>
  <text x="35" y="421" font-size="14" fill="#555">周辺の井戸や地盤沈下にも配慮する。</text>
  <rect y="460" width="400" height="40" fill="#1a3a5c"/>
  <text x="200" y="485" text-anchor="middle" font-size="13" fill="#ffffff">doboku-note.com</text>
</svg>
