<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500" style="max-width:400px;width:100%" role="img" aria-label="安全衛生に関する委員会の整理。安全委員会は特定業種（建設業・製造業等）で設置し、危険防止対策や安全教育計画を審議する。衛生委員会は全業種で設置し、健康障害防止対策や健康の保持増進を審議する。安全衛生委員会は両委員会の設置義務がある場合に統合して設置できる。いずれも常時50人以上の事業場で設置し、毎月1回以上開催して議事録を3年間保存する。委員は労使で構成し、委員の半数は労働者の過半数代表の推薦により指名される。">
  <rect width="400" height="500" fill="#ffffff"/>
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-head { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .th     { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .cl     { font-size: 12px; font-weight: bold; }
      .cell   { font-size: 11px; fill: #222; }
      .f-head { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .f-foot { font-size: 11px; fill: #555; }
    </style>
  </defs>

  <text class="t-head" x="200" y="36" text-anchor="middle">安全委員会と衛生委員会の違い</text>

  <!-- ヘッダー -->
  <rect x="10"  y="48" width="120" height="28" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.2"/>
  <text class="th" x="70"  y="66" text-anchor="middle">委員会</text>
  <rect x="130" y="48" width="120" height="28" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.2"/>
  <text class="th" x="190" y="66" text-anchor="middle">設置する業種</text>
  <rect x="250" y="48" width="140" height="28" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.2"/>
  <text class="th" x="320" y="66" text-anchor="middle">主な審議事項</text>

  <!-- 安全委員会 -->
  <rect x="10"  y="76" width="120" height="74" fill="#fff3cd" stroke="#d4a017" stroke-width="1.2"/>
  <text class="cl" x="70" y="116" text-anchor="middle" fill="#d4a017">安全委員会</text>
  <rect x="130" y="76" width="120" height="74" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text class="cell" x="190" y="108" text-anchor="middle">特定業種</text>
  <text class="cell" x="190" y="125" text-anchor="middle">（建設・製造 等）</text>
  <rect x="250" y="76" width="140" height="74" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text class="cell" x="320" y="108" text-anchor="middle">危険防止対策・</text>
  <text class="cell" x="320" y="125" text-anchor="middle">安全教育計画</text>

  <!-- 衛生委員会 -->
  <rect x="10"  y="150" width="120" height="74" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.2"/>
  <text class="cl" x="70" y="190" text-anchor="middle" fill="#3a7d44">衛生委員会</text>
  <rect x="130" y="150" width="120" height="74" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text class="cell" x="190" y="191" text-anchor="middle">全業種</text>
  <rect x="250" y="150" width="140" height="74" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text class="cell" x="320" y="182" text-anchor="middle">健康障害防止・</text>
  <text class="cell" x="320" y="199" text-anchor="middle">健康の保持増進</text>

  <!-- 安全衛生委員会 -->
  <rect x="10"  y="224" width="120" height="74" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.2"/>
  <text class="cl" x="70" y="256" text-anchor="middle" fill="#2e6da4">安全衛生</text>
  <text class="cl" x="70" y="274" text-anchor="middle" fill="#2e6da4">委員会</text>
  <rect x="130" y="224" width="120" height="74" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text class="cell" x="190" y="256" text-anchor="middle">両委員会の設置</text>
  <text class="cell" x="190" y="273" text-anchor="middle">義務がある場合</text>
  <rect x="250" y="224" width="140" height="74" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text class="cell" x="320" y="256" text-anchor="middle">両委員会の事項を</text>
  <text class="cell" x="320" y="273" text-anchor="middle">統合して審議</text>

  <!-- 共通ルール -->
  <rect x="10" y="312" width="380" height="174" rx="8" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.3"/>
  <text class="f-head" x="24" y="334" text-anchor="start">委員会の共通ルール</text>
  <text class="f-foot" x="24" y="358" text-anchor="start">● 常時50人以上の事業場で設置する</text>
  <text class="f-foot" x="24" y="382" text-anchor="start">● 毎月1回以上開催し、議事録を3年間保存</text>
  <text class="f-foot" x="24" y="406" text-anchor="start">● 労使の委員で構成し、委員の半数は</text>
  <text class="f-foot" x="24" y="424" text-anchor="start">　 労働者の過半数代表の推薦で指名される</text>
  <text class="f-foot" x="24" y="448" text-anchor="start">● 調査審議の結果を踏まえ事業者に意見を述べる</text>
  <text class="f-foot" x="24" y="472" text-anchor="start">　（安全委員会は政令で定める業種が対象）</text>
</svg>
