<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500" style="max-width:400px;width:100%" role="img" aria-label="職能別組織と事業部制組織の優位性比較。職能別組織は専門機能ごとに部門化する集権型で、トップが一元的に意思決定する。強みは専門知識の蓄積と規模の経済（単位コストの低下）、弱みは縦割りと意思決定の遅れ。事業部制組織は製品・地域・顧客ごとに事業部を編成する分権型で、事業部に権限を委譲する。強みは環境変化への迅速な対応と次世代経営者の育成、弱みは投資の二重化と縄張り主義。専門性・コスト効率を重視するなら職能別、変化対応・経営者育成を重視するなら事業部制が適する。">
  <rect width="400" height="500" fill="#ffffff"/>
  <rect id="topic-band" x="0" y="0" width="400" height="22" fill="#1a3a5c"/>
  <text x="200" y="15" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">職能別 vs 事業部制</text>
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-head { font-size: 16px; font-weight: bold; fill: #1a3a5c; }
      .th     { font-size: 12px; font-weight: bold; }
      .lbl    { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .cell   { font-size: 11px; fill: #222; }
      .f-head { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .f-foot { font-size: 11px; fill: #555; }
    </style>
  </defs>

  <text class="t-head" x="200" y="38" text-anchor="middle">集権で専門を深め、分権で変化に速い</text>

  <!-- ヘッダー行 -->
  <rect x="10"  y="50" width="68"  height="32" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <text class="th" x="44"  y="70" text-anchor="middle" fill="#1a3a5c">観点</text>
  <rect x="78"  y="50" width="156" height="32" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.3"/>
  <text class="th" x="156" y="70" text-anchor="middle" fill="#2e6da4">職能別組織</text>
  <rect x="234" y="50" width="156" height="32" fill="#fff3cd" stroke="#d4a017" stroke-width="1.3"/>
  <text class="th" x="312" y="70" text-anchor="middle" fill="#d4a017">事業部制組織</text>

  <!-- row1 部門化 -->
  <rect x="10"  y="82" width="68"  height="62" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <text class="lbl" x="44" y="117" text-anchor="middle">部門化</text>
  <rect x="78"  y="82" width="156" height="62" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text class="cell" x="156" y="106" text-anchor="middle">専門機能で部門化</text>
  <text class="cell" x="156" y="123" text-anchor="middle">（製造・営業 等）</text>
  <rect x="234" y="82" width="156" height="62" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text class="cell" x="312" y="106" text-anchor="middle">製品・地域・顧客で</text>
  <text class="cell" x="312" y="123" text-anchor="middle">事業部を編成</text>

  <!-- row2 権限 -->
  <rect x="10"  y="144" width="68"  height="62" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <text class="lbl" x="44" y="179" text-anchor="middle">権限</text>
  <rect x="78"  y="144" width="156" height="62" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text class="cell" x="156" y="168" text-anchor="middle">集権</text>
  <text class="cell" x="156" y="185" text-anchor="middle">（トップが一元決定）</text>
  <rect x="234" y="144" width="156" height="62" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text class="cell" x="312" y="168" text-anchor="middle">分権</text>
  <text class="cell" x="312" y="185" text-anchor="middle">（事業部へ委譲）</text>

  <!-- row3 強み1 -->
  <rect x="10"  y="206" width="68"  height="62" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <text class="lbl" x="44" y="241" text-anchor="middle">強み①</text>
  <rect x="78"  y="206" width="156" height="62" fill="#e8f0fe" stroke="#d7d7d7" stroke-width="1"/>
  <text class="cell" x="156" y="241" text-anchor="middle">専門知識の蓄積</text>
  <rect x="234" y="206" width="156" height="62" fill="#fff3cd" stroke="#d7d7d7" stroke-width="1"/>
  <text class="cell" x="312" y="230" text-anchor="middle">環境変化へ</text>
  <text class="cell" x="312" y="247" text-anchor="middle">迅速に対応</text>

  <!-- row4 強み2 -->
  <rect x="10"  y="268" width="68"  height="62" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <text class="lbl" x="44" y="303" text-anchor="middle">強み②</text>
  <rect x="78"  y="268" width="156" height="62" fill="#e8f0fe" stroke="#d7d7d7" stroke-width="1"/>
  <text class="cell" x="156" y="292" text-anchor="middle">規模の経済</text>
  <text class="cell" x="156" y="309" text-anchor="middle">（単位コスト低下）</text>
  <rect x="234" y="268" width="156" height="62" fill="#fff3cd" stroke="#d7d7d7" stroke-width="1"/>
  <text class="cell" x="312" y="292" text-anchor="middle">次世代経営者</text>
  <text class="cell" x="312" y="309" text-anchor="middle">の育成</text>

  <!-- row5 弱み -->
  <rect x="10"  y="330" width="68"  height="62" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <text class="lbl" x="44" y="365" text-anchor="middle">弱み</text>
  <rect x="78"  y="330" width="156" height="62" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text class="cell" x="156" y="354" text-anchor="middle">縦割り・調整が</text>
  <text class="cell" x="156" y="371" text-anchor="middle">トップに集中</text>
  <rect x="234" y="330" width="156" height="62" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text class="cell" x="312" y="354" text-anchor="middle">投資の二重化</text>
  <text class="cell" x="312" y="371" text-anchor="middle">縄張り主義</text>

  <!-- フッタ -->
  <rect x="10" y="400" width="380" height="86" rx="8" fill="#ffffff" stroke="#d7d7d7" stroke-width="1.3"/>
  <text class="f-head" x="24" y="422" text-anchor="start">選び方の軸：集権 ⇔ 分権</text>
  <text class="f-foot" x="24" y="446" text-anchor="start">専門性・コスト効率を重視 → 職能別組織</text>
  <text class="f-foot" x="24" y="468" text-anchor="start">変化対応・経営者育成を重視 → 事業部制組織</text>
</svg>
