<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500" role="img" aria-label="フェールセーフの2パターン：フェールパッシブ（停止）とフェールアクティブ（代替動作）の比較図">
  <defs><style>text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }</style></defs>
  <rect width="400" height="500" fill="#ffffff"/>

  <!-- ヘッダー -->
  <rect width="400" height="72" fill="#1a3a5c"/>
  <text x="200" y="28" text-anchor="middle" font-size="11" fill="#d4956a">技術士 総監 | 安全管理</text>
  <text x="200" y="56" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">フェールセーフの2パターン</text>

  <!-- フェールパッシブ -->
  <rect x="20" y="90" width="360" height="162" rx="10" fill="#fce8d0" stroke="#a36b2c" stroke-width="2"/>
  <rect x="20" y="90" width="360" height="36" rx="10" fill="#a36b2c"/>
  <rect x="20" y="108" width="360" height="18" fill="#a36b2c"/>
  <text x="200" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">フェールパッシブ（縮退停止型）</text>
  <text x="40" y="164" font-size="12" fill="#333">故障が検知されたとき、</text>
  <text x="40" y="182" font-size="12" fill="#333">システムを「安全な停止状態」に移行する。</text>
  <rect x="40" y="196" width="320" height="1" fill="#d4956a"/>
  <text x="40" y="218" font-size="12" font-weight="bold" fill="#a36b2c">例：</text>
  <text x="64" y="218" font-size="12" fill="#555">信号故障 → 「赤（停止）」に固定</text>
  <text x="40" y="238" font-size="12" fill="#555">　　断線 → 自動でブレーキが締まる</text>

  <!-- フェールアクティブ -->
  <rect x="20" y="268" width="360" height="162" rx="10" fill="#e8f0fe" stroke="#2e6da4" stroke-width="2"/>
  <rect x="20" y="268" width="360" height="36" rx="10" fill="#2e6da4"/>
  <rect x="20" y="286" width="360" height="18" fill="#2e6da4"/>
  <text x="200" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">フェールアクティブ（代替動作型）</text>
  <text x="40" y="342" font-size="12" fill="#333">故障が検知されたとき、</text>
  <text x="40" y="360" font-size="12" fill="#333">安全な「代替動作」を能動的に継続する。</text>
  <rect x="40" y="374" width="320" height="1" fill="#2e6da4" opacity="0.4"/>
  <text x="40" y="396" font-size="12" font-weight="bold" fill="#2e6da4">例：</text>
  <text x="64" y="396" font-size="12" fill="#555">エンジン停止 → 補助電源に自動切替</text>
  <text x="40" y="416" font-size="12" fill="#555">　　冗長系が故障 → 残りの系で継続</text>

  <rect x="0" y="460" width="400" height="40" fill="#0f2035"/>
  <text x="200" y="485" text-anchor="middle" font-size="12" fill="#6a8faf">doboku-note.com</text>
</svg>
