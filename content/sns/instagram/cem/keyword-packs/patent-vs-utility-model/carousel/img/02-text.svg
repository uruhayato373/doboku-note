<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <rect width="400" height="500" fill="#ffffff"/>

  <!-- ヘッダ帯 -->
  <rect x="0" y="0" width="400" height="56" fill="#1a3a5c"/>
  <text x="16" y="24" font-size="10" fill="#d4926a" font-family="sans-serif" font-weight="bold">技術士 総監｜情報管理</text>
  <text x="16" y="45" font-size="17" fill="#ffffff" font-family="sans-serif" font-weight="bold">それぞれの権利を理解する</text>

  <!-- 特許権ブロック -->
  <rect x="16" y="72" width="368" height="118" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <rect x="16" y="72" width="368" height="28" rx="8" fill="#1a3a5c"/>
  <text x="28" y="91" font-size="14" fill="#ffffff" font-family="sans-serif" font-weight="bold">特許権 ＝ 高度な「発明」を守る</text>
  <text x="28" y="120" font-size="12" fill="#333" font-family="sans-serif">自然法則を使った技術的アイデアのうち</text>
  <text x="28" y="138" font-size="12" fill="#333" font-family="sans-serif">「高度なもの」が対象。物の発明も方法の</text>
  <text x="28" y="156" font-size="12" fill="#333" font-family="sans-serif">発明も守れる。実体審査を通るので権利が</text>
  <text x="28" y="174" font-size="12" fill="#2e6da4" font-family="sans-serif" font-weight="bold">強く安定。存続20年・登録後すぐ行使できる</text>

  <!-- 実用新案権ブロック -->
  <rect x="16" y="204" width="368" height="118" rx="8" fill="#fce8d0" stroke="#a36b2c" stroke-width="1.5"/>
  <rect x="16" y="204" width="368" height="28" rx="8" fill="#a36b2c"/>
  <text x="28" y="223" font-size="14" fill="#ffffff" font-family="sans-serif" font-weight="bold">実用新案権 ＝ 物品の「考案」を守る</text>
  <text x="28" y="252" font-size="12" fill="#333" font-family="sans-serif">物品の形状・構造・組合せの工夫が対象</text>
  <text x="28" y="270" font-size="12" fill="#333" font-family="sans-serif">（方法は守れない）。無審査で速く・安く</text>
  <text x="28" y="288" font-size="12" fill="#333" font-family="sans-serif">権利化できるが、その分中身は未審査。</text>
  <text x="28" y="306" font-size="12" fill="#a36b2c" font-family="sans-serif" font-weight="bold">存続10年・行使には技術評価書が必要</text>

  <!-- 注意 Callout -->
  <rect x="16" y="338" width="368" height="74" rx="6" fill="#fff3cd"/>
  <rect x="16" y="338" width="5" height="74" rx="3" fill="#d4a017"/>
  <text x="32" y="362" font-size="12" fill="#5e3d18" font-family="sans-serif" font-weight="bold">引っかけ注意</text>
  <text x="32" y="382" font-size="12" fill="#5e3d18" font-family="sans-serif">「無審査＝権利が強い」は誤解。中身は未審査</text>
  <text x="32" y="400" font-size="12" fill="#5e3d18" font-family="sans-serif">なので、行使前に技術評価書での裏付けが必須。</text>

  <rect x="0" y="460" width="400" height="40" fill="#1a3a5c"/>
  <text x="200" y="485" text-anchor="middle" font-size="13" fill="#7aaed6" font-family="sans-serif">doboku-note.com</text>
</svg>
