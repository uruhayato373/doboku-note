<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500" role="img" aria-label="温室効果ガス 頻出ポイント">
  <defs><style>text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }</style></defs>
  <rect width="400" height="500" fill="#ffffff"/>
  <rect x="0" y="0" width="400" height="52" fill="#1a3a5c"/>
  <text x="200" y="18" text-anchor="middle" font-size="10" fill="#a36b2c">技術士 総監 | 社会環境管理</text>
  <text x="200" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">温室効果ガス 頻出ポイント</text>
  <circle cx="34" cy="92" r="16" fill="#1a3a5c"/>
  <text x="34" y="97" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">1</text>
  <text x="60" y="84" font-size="13" font-weight="bold" fill="#1a3a5c">削減目標は2013年度比</text>
  <text x="60" y="102" font-size="12" fill="#555">2030年度▲46%（さらに50%へ）・2035▲60%・</text>
  <text x="60" y="118" font-size="12" fill="#555">2040▲73%・2050年に実質ゼロ（CN）</text>
  <line x1="20" y1="138" x2="380" y2="138" stroke="#e8f0fe" stroke-width="1"/>
  <circle cx="34" cy="168" r="16" fill="#1a3a5c"/>
  <text x="34" y="173" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">2</text>
  <text x="60" y="160" font-size="13" font-weight="bold" fill="#1a3a5c">内訳はCO2が約9割</text>
  <text x="60" y="178" font-size="12" fill="#555">CO2のほかメタン・一酸化二窒素・フロン類。</text>
  <text x="60" y="194" font-size="12" fill="#555">CO2換算でCO2が約9割を占める</text>
  <line x1="20" y1="214" x2="380" y2="214" stroke="#e8f0fe" stroke-width="1"/>
  <circle cx="34" cy="244" r="16" fill="#1a3a5c"/>
  <text x="34" y="249" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">3</text>
  <text x="60" y="236" font-size="13" font-weight="bold" fill="#1a3a5c">2013年度がピーク・産業＞家庭</text>
  <text x="60" y="254" font-size="12" fill="#555">総排出量は2013年度以降減少傾向。</text>
  <text x="60" y="270" font-size="12" fill="#555">部門別は産業部門が家庭部門を大きく上回る</text>
  <rect x="20" y="296" width="360" height="86" rx="6" fill="#fce8d0"/>
  <rect x="20" y="296" width="5" height="86" rx="2" fill="#a36b2c"/>
  <text x="36" y="318" font-size="12" font-weight="bold" fill="#a36b2c">引っかけ注意（R5 Ⅰ-1-34）</text>
  <text x="36" y="338" font-size="11" fill="#555">「CO2は約5割」は誤り（正しくは約9割）。</text>
  <text x="36" y="356" font-size="11" fill="#555">「2013年度以降は増加傾向」も誤り。</text>
  <text x="36" y="374" font-size="11" fill="#555">2013年度をピークに減少傾向が正しい。</text>
  <rect x="0" y="460" width="400" height="40" fill="#1a3a5c"/>
  <text x="200" y="485" text-anchor="middle" font-size="12" fill="#6a8faf">doboku-note.com</text>
</svg>
