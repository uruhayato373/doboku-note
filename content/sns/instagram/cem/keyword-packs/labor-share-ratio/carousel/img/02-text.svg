<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500" role="img" aria-label="労働分配率 頻出ポイント">
  <defs><style>text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }</style></defs>
  <rect width="400" height="500" fill="#ffffff"/>
  <rect x="0" y="0" width="400" height="52" fill="#1a3a5c"/>
  <text x="200" y="18" text-anchor="middle" font-size="10" fill="#a36b2c">技術士 総監 | 人的資源管理</text>
  <text x="200" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">労働分配率 頻出ポイント</text>
  <circle cx="34" cy="92" r="16" fill="#1a3a5c"/>
  <text x="34" y="97" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">1</text>
  <text x="60" y="84" font-size="13" font-weight="bold" fill="#1a3a5c">付加価値に占める人件費の割合</text>
  <text x="60" y="102" font-size="12" fill="#555">付加価値＝売上高−外部購入費用。</text>
  <text x="60" y="118" font-size="12" fill="#555">その人件費分が労働分配率</text>
  <line x1="20" y1="138" x2="380" y2="138" stroke="#e8f0fe" stroke-width="1"/>
  <circle cx="34" cy="168" r="16" fill="#1a3a5c"/>
  <text x="34" y="173" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">2</text>
  <text x="60" y="160" font-size="13" font-weight="bold" fill="#1a3a5c">景気と逆方向に動く（逆相関）</text>
  <text x="60" y="178" font-size="12" fill="#555">拡大期は付加価値増に人件費が</text>
  <text x="60" y="194" font-size="12" fill="#555">追いつかず低下、後退期は上昇</text>
  <line x1="20" y1="214" x2="380" y2="214" stroke="#e8f0fe" stroke-width="1"/>
  <circle cx="34" cy="244" r="16" fill="#1a3a5c"/>
  <text x="34" y="249" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">3</text>
  <text x="60" y="236" font-size="13" font-weight="bold" fill="#1a3a5c">適正水準は業種で異なる</text>
  <text x="60" y="254" font-size="12" fill="#555">製造業45〜55％・サービス業60〜70％。</text>
  <text x="60" y="270" font-size="12" fill="#555">同業他社・時系列比較が重要</text>
  <rect x="20" y="296" width="360" height="86" rx="6" fill="#fce8d0"/>
  <rect x="20" y="296" width="5" height="86" rx="2" fill="#a36b2c"/>
  <text x="36" y="318" font-size="12" font-weight="bold" fill="#a36b2c">引っかけ注意</text>
  <text x="36" y="338" font-size="11" fill="#555">景気拡大→分配率「上昇」は誤り。</text>
  <text x="36" y="356" font-size="11" fill="#555">付加価値の伸びに人件費が追いつかず</text>
  <text x="36" y="374" font-size="11" fill="#555">拡大期はむしろ低下する（逆相関）</text>
  <rect x="0" y="460" width="400" height="40" fill="#1a3a5c"/>
  <text x="200" y="485" text-anchor="middle" font-size="12" fill="#6a8faf">doboku-note.com</text>
</svg>
