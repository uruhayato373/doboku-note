<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500" role="img" aria-label="環境政策の実施手法 試験出題ポイント3点">
  <defs><style>text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }</style></defs>
  <rect width="400" height="500" fill="#ffffff"/>

  <rect x="0" y="0" width="400" height="72" fill="#1a3a5c"/>
  <text x="200" y="24" text-anchor="middle" font-size="10" fill="#d4956a">技術士 総監 | 社会環境管理</text>
  <text x="200" y="52" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">試験での出題ポイント</text>

  <!-- ポイント1 -->
  <circle cx="44" cy="114" r="16" fill="#1a3a5c"/>
  <text x="44" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">1</text>
  <text x="72" y="106" font-size="13" font-weight="bold" fill="#1a3a5c">自主的取組 vs 情報的手法</text>
  <text x="72" y="123" font-size="11" fill="#555">自主的取組＝事業者が行動計画を自ら設定・公表</text>
  <text x="72" y="139" font-size="11" fill="#555">情報的手法＝環境負荷情報の開示・提供</text>

  <line x1="24" y1="162" x2="376" y2="162" stroke="#e8e8e8" stroke-width="1"/>

  <!-- ポイント2 -->
  <circle cx="44" cy="200" r="16" fill="#1a3a5c"/>
  <text x="44" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">2</text>
  <text x="72" y="192" font-size="13" font-weight="bold" fill="#1a3a5c">直接規制 vs 枠組規制的手法</text>
  <text x="72" y="209" font-size="11" fill="#555">直接規制＝法令で目標・遵守事項を直接統制</text>
  <text x="72" y="225" font-size="11" fill="#555">枠組規制＝達成目標を義務付け、方法は自由</text>

  <line x1="24" y1="248" x2="376" y2="248" stroke="#e8e8e8" stroke-width="1"/>

  <!-- ポイント3 -->
  <circle cx="44" cy="286" r="16" fill="#1a3a5c"/>
  <text x="44" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">3</text>
  <text x="72" y="278" font-size="13" font-weight="bold" fill="#1a3a5c">手続的手法の代表は環境アセスメント</text>
  <text x="72" y="295" font-size="11" fill="#555">意思決定過程に環境配慮の手続きを組み込む</text>
  <text x="72" y="311" font-size="11" fill="#555">例：環境影響評価（環境アセス）・PRTR制度</text>

  <!-- 注意Callout -->
  <rect x="24" y="338" width="352" height="76" rx="8" fill="#fce8d0"/>
  <rect x="24" y="338" width="5" height="76" rx="4" fill="#a36b2c"/>
  <text x="44" y="362" font-size="11" font-weight="bold" fill="#5e3d18">試験の注意ポイント（R6年度出題）</text>
  <text x="44" y="380" font-size="11" fill="#5e3d18">「消費者が選択できるよう情報開示」→ 情報的手法</text>
  <text x="44" y="397" font-size="11" fill="#5e3d18">自主的取組手法とは別カテゴリ（混同が誤答の定番）</text>

  <rect x="0" y="460" width="400" height="40" fill="#1a3a5c"/>
  <text x="200" y="485" text-anchor="middle" font-size="12" fill="#6a8faf">doboku-note.com</text>
</svg>
