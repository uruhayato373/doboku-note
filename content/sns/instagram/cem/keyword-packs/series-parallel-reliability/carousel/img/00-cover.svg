<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500" role="img" aria-label="技術士総監 安全管理 直列・並列の信頼度計算 表紙">
  <defs><style>text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }</style></defs>
  <rect width="400" height="500" fill="#1a3a5c"/>
  <rect x="0" y="0" width="400" height="5" fill="#a36b2c"/>

  <!-- バッジ -->
  <rect x="24" y="20" width="110" height="26" rx="13" fill="#a36b2c"/>
  <text x="79" y="37" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">技術士 総監</text>
  <rect x="144" y="20" width="100" height="26" rx="13" fill="none" stroke="#a36b2c" stroke-width="1.5"/>
  <text x="194" y="37" text-anchor="middle" font-size="11" fill="#d4956a">安全管理</text>

  <!-- メインタイトル -->
  <text x="200" y="158" text-anchor="middle" font-size="36" font-weight="bold" fill="#ffffff">直列・並列の</text>
  <text x="200" y="204" text-anchor="middle" font-size="36" font-weight="bold" fill="#ffffff">信頼度計算</text>

  <!-- 区切り線 -->
  <rect x="40" y="230" width="320" height="1.5" fill="#a36b2c" opacity="0.5"/>

  <!-- サブコピー -->
  <text x="200" y="266" text-anchor="middle" font-size="13" fill="#b8d0e8">複合システムの解き方を図解</text>
  <text x="200" y="288" text-anchor="middle" font-size="13" fill="#b8d0e8">R03 Ⅰ−1−30 を徹底解説</text>

  <!-- 頻出バッジ -->
  <rect x="104" y="316" width="192" height="40" rx="20" fill="#a36b2c"/>
  <text x="200" y="341" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">択一 頻出テーマ</text>

  <!-- スワイプ促進 -->
  <text x="200" y="424" text-anchor="middle" font-size="12" fill="#6a8faf">スワイプして解法を確認 ▶</text>

  <!-- フッター -->
  <rect x="0" y="460" width="400" height="40" fill="#0f2035"/>
  <text x="200" y="485" text-anchor="middle" font-size="12" fill="#6a8faf">doboku-note.com</text>
</svg>
