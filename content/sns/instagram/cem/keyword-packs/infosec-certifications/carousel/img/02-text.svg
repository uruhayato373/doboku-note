<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500" role="img" aria-label="情報セキュリティ認証制度 頻出ポイント">
  <defs><style>text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }</style></defs>
  <rect width="400" height="500" fill="#ffffff"/>
  <rect x="0" y="0" width="400" height="52" fill="#1a3a5c"/>
  <text x="200" y="18" text-anchor="middle" font-size="10" fill="#a36b2c">技術士 総監 | 情報管理</text>
  <text x="200" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">情報セキュリティ認証 頻出ポイント</text>
  <circle cx="34" cy="92" r="16" fill="#1a3a5c"/>
  <text x="34" y="97" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">1</text>
  <text x="60" y="84" font-size="13" font-weight="bold" fill="#1a3a5c">制度ごとに準拠規格が決まる</text>
  <text x="60" y="102" font-size="12" fill="#555">ISMS＝ISO/IEC 27001（JIS Q 27001）／</text>
  <text x="60" y="118" font-size="12" fill="#555">Pマーク＝JIS Q 15001／JISEC＝ISO/IEC 15408</text>
  <line x1="20" y1="138" x2="380" y2="138" stroke="#e8f0fe" stroke-width="1"/>
  <circle cx="34" cy="168" r="16" fill="#1a3a5c"/>
  <text x="34" y="173" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">2</text>
  <text x="60" y="160" font-size="13" font-weight="bold" fill="#1a3a5c">組織を認証か、製品を認証か</text>
  <text x="60" y="178" font-size="12" fill="#555">ISMS・プライバシーマークは組織を認証、</text>
  <text x="60" y="194" font-size="12" fill="#555">JISEC（CC）はIT製品を認証する</text>
  <line x1="20" y1="214" x2="380" y2="214" stroke="#e8f0fe" stroke-width="1"/>
  <circle cx="34" cy="244" r="16" fill="#1a3a5c"/>
  <text x="34" y="249" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">3</text>
  <text x="60" y="236" font-size="13" font-weight="bold" fill="#1a3a5c">ISMSの基本＝CIA×PDCA</text>
  <text x="60" y="254" font-size="12" fill="#555">機密性・完全性・可用性（CIA）を</text>
  <text x="60" y="270" font-size="12" fill="#555">PDCAで継続的に維持・改善（R06のISMS方針）</text>
  <rect x="20" y="296" width="360" height="86" rx="6" fill="#fce8d0"/>
  <rect x="20" y="296" width="5" height="86" rx="2" fill="#a36b2c"/>
  <text x="36" y="318" font-size="12" font-weight="bold" fill="#a36b2c">引っかけ注意（R5 Ⅰ-1-19）</text>
  <text x="36" y="338" font-size="11" fill="#555">ISO/IEC 27001＝JIS Q 27001（同一規格）。</text>
  <text x="36" y="356" font-size="11" fill="#555">プライバシーマークはJIS Q 15001で別。</text>
  <text x="36" y="374" font-size="11" fill="#555">CC（ISO 15408）は製品認証でISMSと混同しない。</text>
  <rect x="0" y="460" width="400" height="40" fill="#1a3a5c"/>
  <text x="200" y="485" text-anchor="middle" font-size="12" fill="#6a8faf">doboku-note.com</text>
</svg>
