<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500" style="max-width:400px;width:100%" role="img" aria-label="フレックスタイム制と変形労働時間制の対比。柔軟化する対象はフレックスが日々の始業・終業時刻、変形が期間内の労働時間配分。始業・終業時刻の決定権者はフレックスが労働者本人、変形は使用者が事前特定する点が識別の核心。根拠はフレックスが労基法第32条の3、変形が第32条の2・4・5。時間の基準はフレックスが清算期間で総労働時間を清算、変形は期間平均で週40時間以内。向く業務はフレックスが研究開発・企画・事務、変形が建設・製造など繁閑差の大きい業種。裁量労働制・高度プロフェッショナル制度も関連する柔軟な働き方。">
  <rect width="400" height="500" fill="#ffffff"/>
  <rect id="topic-band" x="0" y="0" width="400" height="22" fill="#1a3a5c"/>
  <text x="200" y="15" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">フレックス vs 変形労働時間制</text>
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-sub  { font-size: 11px; fill: #8a8a8a; }
      .t-head { font-size: 16px; font-weight: bold; fill: #1a3a5c; }
      .th     { font-size: 12px; font-weight: bold; }
      .lbl    { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .cell   { font-size: 11px; fill: #222; }
      .cellb  { font-size: 12px; font-weight: bold; }
      .f-foot { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .f-note { font-size: 11px; fill: #555; }
      .pill-t { font-size: 11px; font-weight: bold; }
    </style>
  </defs>

  <text class="t-head" x="200" y="40" text-anchor="middle">柔軟化する対象と決定権が異なる</text>

  <!-- ヘッダー行 -->
  <rect x="10"  y="54" width="76"  height="30" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <text class="th" x="48"  y="73" text-anchor="middle" fill="#1a3a5c">観点</text>
  <rect x="86"  y="54" width="152" height="30" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.3"/>
  <text class="th" x="162" y="73" text-anchor="middle" fill="#2e6da4">フレックス制</text>
  <rect x="238" y="54" width="152" height="30" fill="#fff3cd" stroke="#d4a017" stroke-width="1.3"/>
  <text class="th" x="314" y="73" text-anchor="middle" fill="#d4a017">変形労働時間制</text>

  <!-- 行1 柔軟化の対象 -->
  <rect x="10"  y="84" width="76"  height="50" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <text class="lbl"  x="48"  y="113" text-anchor="middle">柔軟化の対象</text>
  <rect x="86"  y="84" width="152" height="50" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text class="cell" x="162" y="106" text-anchor="middle">日々の</text>
  <text class="cell" x="162" y="122" text-anchor="middle">始業・終業時刻</text>
  <rect x="238" y="84" width="152" height="50" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text class="cell" x="314" y="106" text-anchor="middle">期間内の</text>
  <text class="cell" x="314" y="122" text-anchor="middle">労働時間の配分</text>

  <!-- 行2 決定権者（識別の核心・ハイライト） -->
  <rect x="10"  y="134" width="76"  height="48" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text class="lbl"  x="48"  y="156" text-anchor="middle">始業終業の</text>
  <text class="lbl"  x="48"  y="172" text-anchor="middle">決定権者</text>
  <rect x="86"  y="134" width="152" height="48" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.3"/>
  <text class="cellb" x="162" y="163" text-anchor="middle" fill="#2e6da4">労働者本人</text>
  <rect x="238" y="134" width="152" height="48" fill="#fff3cd" stroke="#d4a017" stroke-width="1.3"/>
  <text class="cellb" x="314" y="163" text-anchor="middle" fill="#d4a017">使用者が事前特定</text>

  <!-- 行3 根拠条文 -->
  <rect x="10"  y="182" width="76"  height="34" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <text class="lbl"  x="48"  y="203" text-anchor="middle">根拠（労基法）</text>
  <rect x="86"  y="182" width="152" height="34" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text class="cell" x="162" y="203" text-anchor="middle">第32条の3</text>
  <rect x="238" y="182" width="152" height="34" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text class="cell" x="314" y="203" text-anchor="middle">第32条の2・4・5</text>

  <!-- 行4 時間の基準 -->
  <rect x="10"  y="216" width="76"  height="50" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <text class="lbl"  x="48"  y="245" text-anchor="middle">時間の基準</text>
  <rect x="86"  y="216" width="152" height="50" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text class="cell" x="162" y="238" text-anchor="middle">清算期間で</text>
  <text class="cell" x="162" y="254" text-anchor="middle">総労働時間を清算</text>
  <rect x="238" y="216" width="152" height="50" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text class="cell" x="314" y="238" text-anchor="middle">期間平均で</text>
  <text class="cell" x="314" y="254" text-anchor="middle">週40時間以内</text>

  <!-- 行5 向く業務 -->
  <rect x="10"  y="266" width="76"  height="50" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <text class="lbl"  x="48"  y="295" text-anchor="middle">向く業務</text>
  <rect x="86"  y="266" width="152" height="50" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text class="cell" x="162" y="288" text-anchor="middle">研究開発・企画・</text>
  <text class="cell" x="162" y="304" text-anchor="middle">事務など</text>
  <rect x="238" y="266" width="152" height="50" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text class="cell" x="314" y="288" text-anchor="middle">建設・製造など</text>
  <text class="cell" x="314" y="304" text-anchor="middle">繁閑差の大きい業種</text>

  <!-- フッタ：識別の核心 -->
  <rect x="10" y="330" width="380" height="156" rx="8" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.3"/>
  <text class="f-foot" x="200" y="356" text-anchor="middle">識別の核心：始業・終業時刻の決定権者</text>
  <rect x="28"  y="372" width="160" height="40" rx="20" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.3"/>
  <text class="pill-t" x="108" y="397" text-anchor="middle" fill="#2e6da4">労働者が決める→フレックス</text>
  <rect x="212" y="372" width="160" height="40" rx="20" fill="#fff3cd" stroke="#d4a017" stroke-width="1.3"/>
  <text class="pill-t" x="292" y="397" text-anchor="middle" fill="#d4a017">使用者が特定→変形</text>
  <text class="f-note" x="200" y="438" text-anchor="middle">どちらも総労働時間は増やさず繁閑・生活に合わせて配分</text>
  <text class="f-note" x="200" y="460" text-anchor="middle">裁量労働制・高度プロフェッショナル制度も</text>
  <text class="f-note" x="200" y="476" text-anchor="middle">関連する柔軟な働き方の制度</text>
</svg>
