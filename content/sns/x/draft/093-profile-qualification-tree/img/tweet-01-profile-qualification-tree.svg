    <rect x="0" y="615" width="1200" height="60" fill="#16365c"/>
    <text x="58" y="653" font-size="23" font-weight="700" fill="#fff">過去問・無料解説・答案設計を試験別に</text>
    <text x="1142" y="653" text-anchor="end" font-size="22" font-weight="800" fill="#fff">doboku-note.com</text>
