      <rect x="450" y="420" width="14" height="116" rx="7" fill="#0f6e6e"/>
      <text x="493" y="464" font-size="25" font-weight="800" fill="#0a4f4f">コンクリート</text>
      <rect x="493" y="481" width="250" height="37" rx="18" fill="#e5f3f3"/>
      <text x="618" y="507" text-anchor="middle" font-size="19" font-weight="800" fill="#0a4f4f">主任技士</text>
      <rect x="757" y="481" width="250" height="37" rx="18" fill="#f1eaf5"/>
      <text x="882" y="507" text-anchor="middle" font-size="19" font-weight="800" fill="#522a69">診断士</text>
