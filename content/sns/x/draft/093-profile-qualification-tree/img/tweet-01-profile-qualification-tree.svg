      <rect x="493" y="235" width="214" height="37" rx="18" fill="#eaf3fc"/>
      <text x="600" y="261" text-anchor="middle" font-size="20" font-weight="800" fill="#155293">1級土木</text>
      <rect x="721" y="235" width="214" height="37" rx="18" fill="#e7f3ed"/>
      <text x="828" y="261" text-anchor="middle" font-size="20" font-weight="800" fill="#1c5038">2級土木</text>
      <text x="960" y="260" font-size="18" font-weight="700" fill="#3a4250">一次・二次</text>
