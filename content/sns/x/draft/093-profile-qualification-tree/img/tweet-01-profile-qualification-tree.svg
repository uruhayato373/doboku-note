      <rect x="450" y="297" width="14" height="116" rx="7" fill="#33356b"/>
      <text x="493" y="341" font-size="25" font-weight="800" fill="#24264f">技術士</text>
      <rect x="493" y="358" width="180" height="37" rx="18" fill="#e9edf4"/>
      <text x="583" y="384" text-anchor="middle" font-size="19" font-weight="800" fill="#0e2645">第一次</text>
      <rect x="687" y="358" width="180" height="37" rx="18" fill="#ececf5"/>
      <text x="777" y="384" text-anchor="middle" font-size="19" font-weight="800" fill="#24264f">建設部門</text>
      <rect x="881" y="358" width="180" height="37" rx="18" fill="#e9edf4"/>
      <text x="971" y="384" text-anchor="middle" font-size="19" font-weight="800" fill="#0e2645">総監</text>
