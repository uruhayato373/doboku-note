<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="doboku-noteの土木・建設系7資格の学習ルート">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f6f9"/>
      <stop offset="1" stop-color="#e4e9f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0e2645" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#paper)"/>
  <path d="M0 0H1200V14H0Z" fill="#16365c"/>
  <circle cx="1110" cy="84" r="115" fill="#1e73c8" opacity="0.06"/>
  <circle cx="80" cy="600" r="145" fill="#0f6e6e" opacity="0.05"/>

  <g font-family="Noto Sans JP, Yu Gothic, Meiryo, sans-serif">
    <g transform="translate(58 48)">
      <rect width="32" height="32" rx="8" fill="#1e73c8"/>
      <path d="M9 21L16 10L23 21" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="46" y="24" font-size="23" font-weight="800" fill="#16365c">doboku-note</text>
    </g>

    <text x="58" y="150" font-size="26" font-weight="700" fill="#1e73c8">自分の試験から、迷わず始める</text>
    <text x="58" y="213" font-size="49" font-weight="900" fill="#1b2430">土木資格の</text>
    <text x="58" y="273" font-size="49" font-weight="900" fill="#1b2430">学習ルート</text>
    <rect x="58" y="302" width="168" height="46" rx="23" fill="#16365c"/>
    <text x="142" y="333" text-anchor="middle" font-size="23" font-weight="800" fill="#fff">全7資格</text>
    <text x="58" y="391" font-size="25" font-weight="700" fill="#3a4250">過去問 → 解説 → 記述・論文</text>
    <text x="58" y="432" font-size="22" fill="#3a4250">元・自治体土木職の発注者視点で整理</text>

    <path d="M408 181V531" stroke="#8a8f98" stroke-width="3" stroke-linecap="round"/>
    <path d="M408 233H450M408 356H450M408 479H450" stroke="#8a8f98" stroke-width="3" stroke-linecap="round"/>

    <g filter="url(#shadow)">
      <rect x="450" y="174" width="692" height="116" rx="18" fill="#fff"/>
      <rect x="450" y="174" width="14" height="116" rx="7" fill="#1e73c8"/>
