<svg width="100%" viewBox="0 0 300 140" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;width:100%;font-family:sans-serif;font-size:13px;">
  <!-- Input line -->
  <line x1="0" y1="70" x2="60" y2="70" stroke="#333" stroke-width="2"/>
  <!-- Split -->
  <line x1="60" y1="70" x2="60" y2="20" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="70" x2="60" y2="70" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="70" x2="60" y2="120" stroke="#333" stroke-width="2"/>
  <!-- Top branch -->
  <line x1="60" y1="20" x2="100" y2="20" stroke="#333" stroke-width="2"/>
  <rect x="100" y="5" width="80" height="30" rx="4" fill="#d0e4f7" stroke="#3366aa" stroke-width="1.5"/>
  <text x="140" y="24" text-anchor="middle">f₁</text>
  <line x1="180" y1="20" x2="240" y2="20" stroke="#333" stroke-width="2"/>
  <!-- Middle branch -->
  <line x1="60" y1="70" x2="100" y2="70" stroke="#333" stroke-width="2"/>
  <rect x="100" y="55" width="80" height="30" rx="4" fill="#d0e4f7" stroke="#3366aa" stroke-width="1.5"/>
  <text x="140" y="74" text-anchor="middle">f₂</text>
  <line x1="180" y1="70" x2="240" y2="70" stroke="#333" stroke-width="2"/>
  <!-- Bottom branch -->
  <line x1="60" y1="120" x2="100" y2="120" stroke="#333" stroke-width="2"/>
  <rect x="100" y="105" width="80" height="30" rx="4" fill="#d0e4f7" stroke="#3366aa" stroke-width="1.5"/>
  <text x="140" y="124" text-anchor="middle">f₃</text>
  <line x1="180" y1="120" x2="240" y2="120" stroke="#333" stroke-width="2"/>
  <!-- Merge -->
  <line x1="240" y1="20" x2="240" y2="120" stroke="#333" stroke-width="2"/>
  <line x1="240" y1="70" x2="300" y2="70" stroke="#333" stroke-width="2"/>
</svg>
