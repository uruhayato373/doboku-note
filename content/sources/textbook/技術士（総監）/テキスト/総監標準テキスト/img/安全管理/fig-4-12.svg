<svg width="100%" viewBox="0 0 480 220" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;width:100%;font-family:sans-serif;font-size:11px;">
  <!-- Initial event box -->
  <rect x="0" y="90" width="70" height="30" rx="2" fill="#d0e4f7" stroke="#3366aa" stroke-width="1"/>
  <text x="35" y="109" text-anchor="middle">ガス漏れ</text>
  <!-- Branch labels at top -->
  <text x="90" y="20" text-anchor="middle" font-size="10">早期発見</text>
  <text x="165" y="20" text-anchor="middle" font-size="10">計器による発見</text>
  <text x="255" y="20" text-anchor="middle" font-size="10">検査による発見</text>
  <text x="330" y="20" text-anchor="middle" font-size="10">着火しない</text>
  <!-- Main horizontal line -->
  <line x1="70" y1="105" x2="400" y2="105" stroke="#555" stroke-width="1.5"/>
  <!-- Branch 1: 早期発見 at x=90 -->
  <line x1="90" y1="105" x2="90" y2="35" stroke="#555" stroke-width="1"/>
  <line x1="90" y1="35" x2="130" y2="35" stroke="#555" stroke-width="1"/>
  <line x1="90" y1="105" x2="130" y2="105" stroke="#555" stroke-width="1"/>
  <text x="112" y="30" text-anchor="middle" font-size="10">成功</text>
  <text x="112" y="115" text-anchor="middle" font-size="10">失敗</text>
  <text x="115" y="52" text-anchor="middle" font-size="10">0.9</text>
  <text x="115" y="95" text-anchor="middle" font-size="10">0.1</text>
  <!-- Branch 2: 計器 at x=165 -->
  <line x1="165" y1="105" x2="165" y2="70" stroke="#555" stroke-width="1"/>
  <line x1="165" y1="70" x2="200" y2="70" stroke="#555" stroke-width="1"/>
  <line x1="165" y1="105" x2="200" y2="105" stroke="#555" stroke-width="1"/>
  <text x="185" y="65" text-anchor="middle" font-size="10">成功</text>
  <text x="185" y="118" text-anchor="middle" font-size="10">失敗</text>
  <text x="185" y="85" text-anchor="middle" font-size="10">0.9</text>
  <text x="185" y="98" text-anchor="middle" font-size="10">0.1</text>
  <!-- Branch 3: 検査 at x=255 -->
  <line x1="255" y1="105" x2="255" y2="87" stroke="#555" stroke-width="1"/>
  <line x1="255" y1="87" x2="290" y2="87" stroke="#555" stroke-width="1"/>
  <line x1="255" y1="105" x2="290" y2="105" stroke="#555" stroke-width="1"/>
  <text x="274" y="82" text-anchor="middle" font-size="10">成功</text>
  <text x="274" y="118" text-anchor="middle" font-size="10">失敗</text>
  <text x="274" y="92" text-anchor="middle" font-size="10">0.9</text>
  <text x="274" y="103" text-anchor="middle" font-size="10">0.1</text>
  <!-- Branch 4: 着火 at x=330 -->
  <line x1="330" y1="105" x2="330" y2="96" stroke="#555" stroke-width="1"/>
  <line x1="330" y1="96" x2="365" y2="96" stroke="#555" stroke-width="1"/>
  <line x1="330" y1="105" x2="365" y2="105" stroke="#555" stroke-width="1"/>
  <text x="350" y="90" text-anchor="middle" font-size="10">成功</text>
  <text x="350" y="118" text-anchor="middle" font-size="10">失敗</text>
  <text x="350" y="99" text-anchor="middle" font-size="10">0.5</text>
  <text x="350" y="110" text-anchor="middle" font-size="10">0.5</text>
  <!-- Final outcome -->
  <rect x="400" y="100" width="70" height="25" rx="2" fill="#ffd6d6" stroke="#aa3333" stroke-width="1"/>
  <text x="435" y="117" text-anchor="middle">ガス爆発</text>
  <!-- Calculation -->
  <text x="10" y="200" text-anchor="start" font-size="11">0.1×0.1×0.1×0.5 = 0.0005</text>
</svg>
