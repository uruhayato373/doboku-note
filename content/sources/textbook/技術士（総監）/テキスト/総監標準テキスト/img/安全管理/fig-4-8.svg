<svg width="100%" viewBox="0 0 560 370" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;width:100%;font-family:sans-serif;font-size:11px;">
  <rect x="0" y="0" width="120" height="30" fill="#d0d8e8" stroke="#555" stroke-width="1"/>
  <rect x="120" y="0" width="220" height="30" fill="#d0d8e8" stroke="#555" stroke-width="1"/>
  <rect x="340" y="0" width="220" height="30" fill="#d0d8e8" stroke="#555" stroke-width="1"/>
  <text x="60" y="20" text-anchor="middle" font-weight="bold"></text>
  <text x="230" y="20" text-anchor="middle" font-weight="bold">企業の従来の防災活動</text>
  <text x="450" y="20" text-anchor="middle" font-weight="bold">企業の事業継続マネジメント</text>
  <!-- Row: 主な目的 -->
  <rect x="0" y="30" width="120" height="45" fill="#f0f4ff" stroke="#555" stroke-width="1"/>
  <rect x="120" y="30" width="220" height="45" fill="#fff" stroke="#555" stroke-width="1"/>
  <rect x="340" y="30" width="220" height="45" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="60" y="57" text-anchor="middle">主な目的</text>
  <text x="130" y="48" text-anchor="start">・身体・生命の安全確保</text>
  <text x="130" y="63" text-anchor="start">・物的被害の軽減</text>
  <text x="350" y="42" text-anchor="start">・身体・生命の安全確保に加え、優先</text>
  <text x="350" y="56" text-anchor="start">的に継続・復旧すべき重要業務の継続</text>
  <text x="350" y="70" text-anchor="start">または早期復旧</text>
  <!-- Row: 考慮すべき事象 -->
  <rect x="0" y="75" width="120" height="40" fill="#f0f4ff" stroke="#555" stroke-width="1"/>
  <rect x="120" y="75" width="220" height="40" fill="#fff" stroke="#555" stroke-width="1"/>
  <rect x="340" y="75" width="220" height="40" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="60" y="90" text-anchor="middle">考慮すべき</text>
  <text x="60" y="105" text-anchor="middle">事象</text>
  <text x="130" y="90" text-anchor="start">・拠点がある地域で発生す</text>
  <text x="130" y="105" text-anchor="start">ることが想定される災害</text>
  <text x="350" y="90" text-anchor="start">・自社の事業中断の原因となりうるあら</text>
  <text x="350" y="105" text-anchor="start">ゆる発生事象（インシデント）</text>
  <!-- Row: 重要視される事項 -->
  <rect x="0" y="115" width="120" height="85" fill="#f0f4ff" stroke="#555" stroke-width="1"/>
  <rect x="120" y="115" width="220" height="85" fill="#fff" stroke="#555" stroke-width="1"/>
  <rect x="340" y="115" width="220" height="85" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="60" y="143" text-anchor="middle">重要視される</text>
  <text x="60" y="157" text-anchor="middle">事項</text>
  <text x="130" y="128" text-anchor="start">・以下を最小限にすること</text>
  <text x="130" y="143" text-anchor="start"> 死傷者数、損害額</text>
  <text x="130" y="158" text-anchor="start">・従業員等の安否を確認</text>
  <text x="130" y="173" text-anchor="start"> し、被災者を救助・支援</text>
  <text x="130" y="188" text-anchor="start"> すること</text>
  <text x="350" y="128" text-anchor="start">・死傷者数、損害額を最小限にし、</text>
  <text x="350" y="143" text-anchor="start"> 従業員の安否確保や被災者の救助・</text>
  <text x="350" y="158" text-anchor="start"> 支援を行うことに加え、以下を含む</text>
  <text x="350" y="173" text-anchor="start"> ○重要業務の目標復旧時間・目標復旧</text>
  <text x="350" y="188" text-anchor="start">  レベルを達成すること</text>
  <!-- Row: 活動, 対策の検討の範囲 -->
  <rect x="0" y="200" width="120" height="80" fill="#f0f4ff" stroke="#555" stroke-width="1"/>
  <rect x="120" y="200" width="220" height="80" fill="#fff" stroke="#555" stroke-width="1"/>
  <rect x="340" y="200" width="220" height="80" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="60" y="225" text-anchor="middle">活動、対策</text>
  <text x="60" y="240" text-anchor="middle">の検討の範囲</text>
  <text x="130" y="215" text-anchor="start">・自社の拠点ごと</text>
  <text x="130" y="230" text-anchor="start"> ○本社ビル ○工場</text>
  <text x="130" y="245" text-anchor="start"> ○データセンター等</text>
  <text x="350" y="215" text-anchor="start">・全社的（拠点横断的）</text>
  <text x="350" y="230" text-anchor="start">・サプライチェーン等依存関係のある主体</text>
  <text x="350" y="245" text-anchor="start"> ○委託先 ○調達先 ○供給先　等</text>
  <!-- Row: 取組単位・主体 -->
  <rect x="0" y="280" width="120" height="45" fill="#f0f4ff" stroke="#555" stroke-width="1"/>
  <rect x="120" y="280" width="220" height="45" fill="#fff" stroke="#555" stroke-width="1"/>
  <rect x="340" y="280" width="220" height="45" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="60" y="300" text-anchor="middle">取組の単位</text>
  <text x="60" y="315" text-anchor="middle">主体</text>
  <text x="130" y="295" text-anchor="start">・防災部門、総務部門、施設</text>
  <text x="130" y="310" text-anchor="start"> 部門等、特定の防災関連部</text>
  <text x="130" y="325" text-anchor="start"> 門が取り組む</text>
  <text x="350" y="295" text-anchor="start">・経営者を中心に、各事業部門、調達・</text>
  <text x="350" y="310" text-anchor="start"> 販売部門、サポート部門（経営企画・</text>
  <text x="350" y="325" text-anchor="start"> 広報、財務、総務、情報システム等）</text>
  <!-- Source -->
  <text x="560" y="365" text-anchor="end" fill="#666">出典：事業継続ガイドライン：平成25年8月改定（内閣府）</text>
</svg>
