<svg width="100%" viewBox="0 0 560 220" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;width:100%;font-family:sans-serif;font-size:12px;">
  <rect x="0" y="0" width="120" height="30" fill="#d0d8e8" stroke="#555" stroke-width="1"/>
  <rect x="120" y="0" width="440" height="30" fill="#d0d8e8" stroke="#555" stroke-width="1"/>
  <text x="60" y="20" text-anchor="middle" font-weight="bold">疾患名</text>
  <text x="340" y="20" text-anchor="middle" font-weight="bold">症状</text>
  <!-- Row 1 -->
  <rect x="0" y="30" width="120" height="48" fill="#f0f4ff" stroke="#555" stroke-width="1"/>
  <rect x="120" y="30" width="440" height="48" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="60" y="58" text-anchor="middle">うつ病</text>
  <text x="130" y="48" text-anchor="start">「ゆううつである」とか「気分が落ち込んでいる」といった抑</text>
  <text x="130" y="64" text-anchor="start">つ気分が強い状態で、うつ状態がある程度以上ある場合をうつ病という</text>
  <!-- Row 2 -->
  <rect x="0" y="78" width="120" height="48" fill="#f0f4ff" stroke="#555" stroke-width="1"/>
  <rect x="120" y="78" width="440" height="48" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="60" y="96" text-anchor="middle">外傷後ストレス</text>
  <text x="60" y="112" text-anchor="middle">障害（PTSD）</text>
  <text x="130" y="96" text-anchor="start">生死にかかわるような危険や死傷の現場を目撃するなどの怖い</text>
  <text x="130" y="112" text-anchor="start">思いをした記憶が残って、そのことが何度も思い出されて恐怖を感じさせる疾病</text>
  <!-- Row 3 -->
  <rect x="0" y="126" width="120" height="48" fill="#f0f4ff" stroke="#555" stroke-width="1"/>
  <rect x="120" y="126" width="440" height="48" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="60" y="154" text-anchor="middle">強迫性障害</text>
  <text x="130" y="144" text-anchor="start">強い不安からくる強迫観念や、強いこだわりからくる強迫行為に</text>
  <text x="130" y="160" text-anchor="start">よって、日常生活に支障をきたす疾病</text>
  <!-- Row 4 -->
  <rect x="0" y="174" width="120" height="46" fill="#f0f4ff" stroke="#555" stroke-width="1"/>
  <rect x="120" y="174" width="440" height="46" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="60" y="200" text-anchor="middle">統合失調症</text>
  <text x="130" y="192" text-anchor="start">脳の働きをまとめることができなくなり、幻覚や妄想などの症</text>
  <text x="130" y="208" text-anchor="start">状が起きる精神的疾患で、人との交流や社会生活に支障をきたす結果をもたらす</text>
</svg>
