<svg width="100%" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;width:100%;font-family:sans-serif;font-size:13px;">
  <!-- AND gate symbol -->
  <g transform="translate(20,60)">
    <line x1="0" y1="25" x2="25" y2="25" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="55" x2="25" y2="55" stroke="#333" stroke-width="2"/>
    <!-- AND gate body: flat left, semicircle right -->
    <path d="M25,10 L25,70 Q80,70 80,40 Q80,10 25,10 Z" fill="#d0e8f8" stroke="#3366aa" stroke-width="2"/>
    <line x1="80" y1="40" x2="110" y2="40" stroke="#333" stroke-width="2"/>
    <text x="-15" y="29" text-anchor="middle">X</text>
    <text x="-15" y="59" text-anchor="middle">Y</text>
    <text x="120" y="44" text-anchor="start">Z</text>
    <text x="55" y="100" text-anchor="middle">論理式：X・Y = Z</text>
  </g>
  <!-- Truth table -->
  <rect x="200" y="0" width="120" height="10" fill="#c0ccdd" stroke="#555" stroke-width="0.5"/>
  <rect x="320" y="0" width="60" height="10" fill="#c0ccdd" stroke="#555" stroke-width="0.5"/>
  <text x="260" y="9" text-anchor="middle" font-size="9">入力</text>
  <text x="350" y="9" text-anchor="middle" font-size="9">出力</text>
  <rect x="200" y="10" width="60" height="25" fill="#d0d8e8" stroke="#555" stroke-width="1"/>
  <rect x="260" y="10" width="60" height="25" fill="#d0d8e8" stroke="#555" stroke-width="1"/>
  <rect x="320" y="10" width="60" height="25" fill="#d0d8e8" stroke="#555" stroke-width="1"/>
  <text x="230" y="27" text-anchor="middle" font-weight="bold">X</text>
  <text x="290" y="27" text-anchor="middle" font-weight="bold">Y</text>
  <text x="350" y="27" text-anchor="middle" font-weight="bold">Z</text>
  <rect x="200" y="35" width="60" height="35" fill="#fff" stroke="#555" stroke-width="1"/>
  <rect x="260" y="35" width="60" height="35" fill="#fff" stroke="#555" stroke-width="1"/>
  <rect x="320" y="35" width="60" height="35" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="230" y="58" text-anchor="middle">0</text><text x="290" y="58" text-anchor="middle">0</text><text x="350" y="58" text-anchor="middle">0</text>
  <rect x="200" y="70" width="60" height="35" fill="#fff" stroke="#555" stroke-width="1"/>
  <rect x="260" y="70" width="60" height="35" fill="#fff" stroke="#555" stroke-width="1"/>
  <rect x="320" y="70" width="60" height="35" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="230" y="93" text-anchor="middle">0</text><text x="290" y="93" text-anchor="middle">1</text><text x="350" y="93" text-anchor="middle">0</text>
  <rect x="200" y="105" width="60" height="35" fill="#fff" stroke="#555" stroke-width="1"/>
  <rect x="260" y="105" width="60" height="35" fill="#fff" stroke="#555" stroke-width="1"/>
  <rect x="320" y="105" width="60" height="35" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="230" y="128" text-anchor="middle">1</text><text x="290" y="128" text-anchor="middle">0</text><text x="350" y="128" text-anchor="middle">0</text>
  <rect x="200" y="140" width="60" height="35" fill="#fff" stroke="#555" stroke-width="1"/>
  <rect x="260" y="140" width="60" height="35" fill="#fff" stroke="#555" stroke-width="1"/>
  <rect x="320" y="140" width="60" height="35" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="230" y="163" text-anchor="middle">1</text><text x="290" y="163" text-anchor="middle">1</text><text x="350" y="163" text-anchor="middle">1</text>
</svg>
