<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 180" width="500" height="180">
  <!-- 標準時間 (root) -->
  <rect x="10" y="70" width="90" height="36" rx="3" fill="none" stroke="#333" stroke-width="1.2"/>
  <text x="55" y="93" text-anchor="middle" font-size="12" fill="#333" font-family="sans-serif">標準時間</text>

  <!-- Branch line from root -->
  <line x1="100" y1="88" x2="140" y2="88" stroke="#333" stroke-width="1.2"/>
  <!-- vertical line -->
  <line x1="140" y1="50" x2="140" y2="126" stroke="#333" stroke-width="1.2"/>

  <!-- 主体作業時間 branch -->
  <line x1="140" y1="50" x2="180" y2="50" stroke="#333" stroke-width="1.2"/>
  <rect x="180" y="32" width="100" height="36" rx="3" fill="none" stroke="#333" stroke-width="1.2"/>
  <text x="230" y="55" text-anchor="middle" font-size="12" fill="#333" font-family="sans-serif">主体作業時間</text>

  <!-- from 主体作業時間 -->
  <line x1="280" y1="50" x2="320" y2="50" stroke="#333" stroke-width="1.2"/>
  <line x1="320" y1="30" x2="320" y2="70" stroke="#333" stroke-width="1.2"/>
  <line x1="320" y1="30" x2="360" y2="30" stroke="#333" stroke-width="1.2"/>
  <rect x="360" y="14" width="70" height="28" rx="2" fill="none" stroke="#333" stroke-width="1"/>
  <text x="395" y="32" text-anchor="middle" font-size="11" fill="#333" font-family="sans-serif">正味時間</text>
  <line x1="320" y1="70" x2="360" y2="70" stroke="#333" stroke-width="1.2"/>
  <rect x="360" y="54" width="70" height="28" rx="2" fill="none" stroke="#333" stroke-width="1"/>
  <text x="395" y="72" text-anchor="middle" font-size="11" fill="#333" font-family="sans-serif">余裕時間</text>

  <!-- 準備段取作業時間 branch -->
  <line x1="140" y1="126" x2="180" y2="126" stroke="#333" stroke-width="1.2"/>
  <rect x="180" y="108" width="100" height="36" rx="3" fill="none" stroke="#333" stroke-width="1.2"/>
  <text x="230" y="125" text-anchor="middle" font-size="11" fill="#333" font-family="sans-serif">準備段取作業時間</text>

  <!-- from 準備段取 -->
  <line x1="280" y1="126" x2="320" y2="126" stroke="#333" stroke-width="1.2"/>
  <line x1="320" y1="106" x2="320" y2="146" stroke="#333" stroke-width="1.2"/>
  <line x1="320" y1="106" x2="360" y2="106" stroke="#333" stroke-width="1.2"/>
  <rect x="360" y="90" width="70" height="28" rx="2" fill="none" stroke="#333" stroke-width="1"/>
  <text x="395" y="108" text-anchor="middle" font-size="11" fill="#333" font-family="sans-serif">正味時間</text>
  <line x1="320" y1="146" x2="360" y2="146" stroke="#333" stroke-width="1.2"/>
  <rect x="360" y="130" width="70" height="28" rx="2" fill="none" stroke="#333" stroke-width="1"/>
  <text x="395" y="148" text-anchor="middle" font-size="11" fill="#333" font-family="sans-serif">余裕時間</text>
</svg>
