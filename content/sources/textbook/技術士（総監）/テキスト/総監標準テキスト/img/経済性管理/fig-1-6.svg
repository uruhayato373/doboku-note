<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" width="340" height="280">
  <!-- Axes -->
  <line x1="50" y1="240" x2="300" y2="240" stroke="#333" stroke-width="1.5"/>
  <line x1="50" y1="20" x2="50" y2="240" stroke="#333" stroke-width="1.5"/>
  <!-- Axis labels -->
  <text x="175" y="260" text-anchor="middle" font-size="11" fill="#333" font-family="sans-serif">売上高・売上数量</text>
  <text x="32" y="132" text-anchor="middle" font-size="11" fill="#333" font-family="sans-serif" transform="rotate(-90,32,132)">収益・費用</text>

  <!-- Fixed cost line (horizontal) -->
  <line x1="50" y1="190" x2="300" y2="190" stroke="#333" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="304" y="194" font-size="10" fill="#333" font-family="sans-serif">© 固定費</text>

  <!-- Total cost line (Ⓑ: starts at fixed cost, slopes up) -->
  <line x1="50" y1="190" x2="260" y2="80" stroke="#555" stroke-width="1.5"/>
  <text x="265" y="78" font-size="10" fill="#333" font-family="sans-serif">Ⓑ 総費用</text>
  <text x="265" y="92" font-size="10" fill="#333" font-family="sans-serif">　変動費</text>

  <!-- Sales line (Ⓐ: from origin, steeper slope) -->
  <line x1="50" y1="240" x2="260" y2="50" stroke="#333" stroke-width="2"/>
  <text x="265" y="54" font-size="10" fill="#333" font-family="sans-serif">Ⓐ 売上高</text>

  <!-- Breakeven point -->
  <circle cx="152" cy="148" r="4" fill="#333"/>
  <text x="108" y="138" font-size="10" fill="#333" font-family="sans-serif">損益分岐点</text>
  <line x1="152" y1="148" x2="152" y2="240" stroke="#333" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="50" y1="148" x2="152" y2="148" stroke="#333" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Profit region label -->
  <text x="220" y="120" font-size="11" fill="#333" font-family="sans-serif">利益</text>

  <!-- Fixed cost label -->
  <text x="304" y="207" font-size="10" fill="#333" font-family="sans-serif">固定費</text>
</svg>
