<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="sans-serif">
<style>.t{font-size:12px;fill:#333}.s{font-size:11px;fill:#666}.h{font-size:14px;fill:#333;font-weight:bold}.a{font-size:11px;fill:#e8632a}</style>
<text x="8" y="18" class="h">地盤改良工法の対応深度と選定の分かれ目</text>
<line x1="60" y1="44" x2="60" y2="250" stroke="#333" stroke-width="2"/>
<g class="s" text-anchor="end" fill="#666">
<text x="54" y="48">GL</text><text x="54" y="76">-2m</text><text x="54" y="132">-13m</text><text x="54" y="176">-25m</text><text x="54" y="250">-50m</text>
</g>
<g stroke="#666" stroke-dasharray="3 3">
<line x1="60" y1="72" x2="700" y2="72"/><line x1="60" y1="128" x2="700" y2="128"/>
<line x1="60" y1="172" x2="700" y2="172"/><line x1="60" y1="246" x2="700" y2="246"/>
</g>
<rect x="80" y="44" width="110" height="28" fill="#e8632a" opacity="0.75"/>
<text x="200" y="62" class="t">浅層混合処理　バックホウ／スタビライザで撹拌</text>
<rect x="80" y="76" width="110" height="52" fill="#e8632a" opacity="0.55"/>
<text x="200" y="106" class="t">中層混合処理　バックホウ基幹の専用機。狭所でも可</text>
<rect x="80" y="132" width="110" height="114" fill="#e8632a" opacity="0.35"/>
<text x="200" y="196" class="t">深層混合処理　リーダー式マシン。広い作業スペースが要る</text>
<rect x="200" y="44" width="0" height="0"/>
<rect x="600" y="44" width="90" height="128" fill="none" stroke="#e8632a" stroke-width="2"/>
<text x="645" y="100" class="t" text-anchor="middle">高圧噴射</text>
<text x="645" y="118" class="t" text-anchor="middle">撹拌</text>
<text x="645" y="136" class="s" text-anchor="middle">機械が小さく</text>
<text x="645" y="152" class="s" text-anchor="middle">狭所向き</text>
<text x="20" y="276" class="a">選定の軸は「深さ」と「作業スペース」。同じ深さでも敷地が狭ければ高圧噴射撹拌が候補になる。</text>
<text x="20" y="294" class="s">薬液注入は深度ではなく、固結時間と地質で工法（単管／二重管／恒久グラウト等）を選ぶ。</text>
</svg>
