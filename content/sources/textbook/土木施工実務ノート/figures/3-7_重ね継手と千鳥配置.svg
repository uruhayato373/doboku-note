<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="sans-serif">
<style>.t{font-size:12px;fill:#333}.s{font-size:11px;fill:#666}.b{font-size:14px;font-weight:bold;fill:#222}</style>
<text x="20" y="24" class="b">§3-7 重ね継手長さ（L1）と千鳥配置</text>

<g stroke="#333" stroke-width="5">
<line x1="60" y1="80" x2="300" y2="80"/><line x1="240" y1="80" x2="480" y2="80"/>
</g>
<line x1="240" y1="62" x2="240" y2="74" stroke="#e8632a"/><line x1="300" y1="62" x2="300" y2="74" stroke="#e8632a"/>
<line x1="240" y1="68" x2="300" y2="68" stroke="#e8632a" stroke-width="1.5"/>
<text x="270" y="58" text-anchor="middle" class="t" fill="#e8632a" font-weight="bold">重ね継手長さ L1</text>

<g stroke="#333" stroke-width="5">
<line x1="60" y1="140" x2="380" y2="140"/><line x1="320" y1="140" x2="560" y2="140"/>
</g>
<line x1="300" y1="80" x2="300" y2="200" stroke="#0a72b0" stroke-dasharray="4 3"/>
<line x1="380" y1="80" x2="380" y2="200" stroke="#0a72b0" stroke-dasharray="4 3"/>
<line x1="300" y1="185" x2="380" y2="185" stroke="#0a72b0" stroke-width="1.5"/>
<line x1="300" y1="180" x2="300" y2="190" stroke="#0a72b0"/><line x1="380" y1="180" x2="380" y2="190" stroke="#0a72b0"/>
<text x="340" y="208" text-anchor="middle" class="t" fill="#0a72b0" font-weight="bold">25d 以上ずらす</text>

<g stroke="#333" stroke-width="5">
<line x1="60" y1="240" x2="300" y2="240"/><line x1="240" y1="240" x2="480" y2="240"/>
</g>
<text x="590" y="84" class="s">1段目</text>
<text x="590" y="144" class="s">2段目（ずらす）</text>
<text x="590" y="244" class="s">3段目</text>
<text x="20" y="280" class="s">継手が同一断面に集中すると弱点になる。千鳥状に配置して、全ての鉄筋が同じ位置で継がれないようにする</text>
<text x="20" y="296" class="s" fill="#e8632a">D29以上には重ね継手を適用しない（ガス圧接継手または機械式継手を用いる）</text>
</svg>
