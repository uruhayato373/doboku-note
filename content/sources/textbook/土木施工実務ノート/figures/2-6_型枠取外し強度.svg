<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="sans-serif">
<style>.t{font-size:12px;fill:#333}.s{font-size:11px;fill:#666}.b{font-size:14px;font-weight:bold;fill:#222}.n{font-size:16px;font-weight:bold;fill:#e8632a}</style>
<text x="20" y="24" class="b">§2-6 型枠を取り外してもよい時期のコンクリート圧縮強度</text>

<g>
<rect x="50" y="60" width="200" height="120" fill="#f5f0ea" stroke="#666"/>
<rect x="50" y="60" width="18" height="120" fill="#c9a882"/>
<text x="150" y="128" text-anchor="middle" class="s">厚い部材の鉛直面</text>
<text x="150" y="146" text-anchor="middle" class="s">例：フーチング側面</text>
<text x="150" y="212" text-anchor="middle" class="n">3.5 N/mm²</text>
</g>
<g>
<rect x="280" y="60" width="200" height="120" fill="#f5f0ea" stroke="#666"/>
<rect x="280" y="60" width="9" height="120" fill="#c9a882"/>
<text x="390" y="128" text-anchor="middle" class="s">薄い部材の鉛直面</text>
<text x="390" y="146" text-anchor="middle" class="s">例：柱、壁、はりの側面</text>
<text x="385" y="212" text-anchor="middle" class="n">5.0 N/mm²</text>
</g>
<g>
<rect x="510" y="60" width="200" height="120" fill="#f5f0ea" stroke="#666"/>
<rect x="510" y="168" width="200" height="12" fill="#c9a882"/>
<text x="610" y="118" text-anchor="middle" class="s">スラブ・はりの底面</text>
<text x="610" y="136" text-anchor="middle" class="s">アーチの内面</text>
<text x="610" y="212" text-anchor="middle" class="n">14.0 N/mm²</text>
</g>

<rect x="50" y="236" width="660" height="46" rx="4" fill="#fdece4" stroke="#e8632a"/>
<text x="380" y="256" text-anchor="middle" class="t" fill="#e8632a" font-weight="bold">14.0 N/mm² が要る部位では、取外し前に圧縮試験を行う</text>
<text x="380" y="274" text-anchor="middle" class="s">標準養生の供試体ではなく「現場条件で養生した供試体」を使うこと</text>
<text x="50" y="298" class="s">解体順序：荷重のかからない部材から。鉛直部材（柱・壁）→ 水平部材（床版・はり側・はり底）</text>
</svg>
