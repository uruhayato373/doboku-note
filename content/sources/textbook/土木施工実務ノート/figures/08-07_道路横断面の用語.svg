<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="sans-serif">
<style>.t{font-size:12px;fill:#333}.s{font-size:11px;fill:#666}.h{font-size:14px;fill:#333;font-weight:bold}.a{font-size:11px;fill:#e8632a}</style>
<text x="8" y="18" class="h">道路横断面の用語と歩道の3形式</text>
<text x="20" y="44" class="t">［歩道がある場合］</text>
<rect x="20" y="52" width="90" height="26" fill="#ddd" stroke="#333"/><text x="65" y="69" class="t" text-anchor="middle">歩道</text>
<rect x="110" y="52" width="46" height="26" fill="#e8632a" opacity="0.3" stroke="#333"/><text x="133" y="69" class="s" text-anchor="middle">路肩</text>
<rect x="156" y="52" width="200" height="26" fill="#f2f2f2" stroke="#333"/><text x="256" y="69" class="t" text-anchor="middle">車道</text>
<text x="133" y="98" class="a" text-anchor="middle">道路構造令では「路肩」</text>
<text x="133" y="114" class="a" text-anchor="middle">道路交通法では「車道」</text>
<text x="400" y="44" class="t">［歩道がない場合］</text>
<rect x="400" y="52" width="60" height="26" fill="#e8632a" opacity="0.3" stroke="#333"/><text x="430" y="69" class="s" text-anchor="middle">路側帯</text>
<rect x="460" y="52" width="200" height="26" fill="#f2f2f2" stroke="#333"/><text x="560" y="69" class="t" text-anchor="middle">車道</text>
<text x="430" y="98" class="s" text-anchor="middle">道路標示で区画</text>
<text x="430" y="114" class="s" text-anchor="middle">歩行者の通行を確保</text>
<line x1="20" y1="132" x2="700" y2="132" stroke="#666"/>
<text x="20" y="154" class="t">［歩道の3形式］車道との高低差の取り方が違う</text>
<g transform="translate(20,168)">
<text x="80" y="12" class="t" text-anchor="middle">マウントアップ型</text>
<rect x="20" y="24" width="70" height="34" fill="#ddd" stroke="#333"/>
<rect x="90" y="42" width="14" height="16" fill="#999" stroke="#333"/>
<rect x="104" y="46" width="66" height="12" fill="#f2f2f2" stroke="#333"/>
<text x="80" y="76" class="s" text-anchor="middle">歩道が一段高い</text>
<text x="80" y="92" class="a" text-anchor="middle">車両進入部で斜路が発生</text>
<text x="80" y="108" class="s" text-anchor="middle">バス乗降に支障 → 減少傾向</text>
</g>
<g transform="translate(255,168)">
<text x="80" y="12" class="t" text-anchor="middle">フラット型</text>
<rect x="20" y="42" width="70" height="16" fill="#ddd" stroke="#333"/>
<rect x="90" y="42" width="14" height="16" fill="#999" stroke="#333"/>
<rect x="104" y="46" width="66" height="12" fill="#f2f2f2" stroke="#333"/>
<text x="80" y="76" class="s" text-anchor="middle">歩道と車道がほぼ同高</text>
<text x="80" y="92" class="s" text-anchor="middle">縁石で分離</text>
</g>
<g transform="translate(490,168)">
<text x="80" y="12" class="t" text-anchor="middle">セミフラット型</text>
<rect x="20" y="36" width="70" height="22" fill="#ddd" stroke="#333"/>
<rect x="90" y="40" width="14" height="18" fill="#999" stroke="#333"/>
<rect x="104" y="46" width="66" height="12" fill="#f2f2f2" stroke="#333"/>
<text x="80" y="76" class="s" text-anchor="middle">歩道をやや高くする</text>
<text x="80" y="92" class="a" text-anchor="middle">今後の主流と目される</text>
</g>
<text x="20" y="306" class="s">※ 防護柵を停車帯・歩道に設置する場合は、車道の外側に25cm程度の空間を確保する（建築限界／→§8-8）</text>
</svg>
