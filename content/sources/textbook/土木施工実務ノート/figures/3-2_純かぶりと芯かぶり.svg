<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="sans-serif">
<style>.t{font-size:12px;fill:#333}.s{font-size:11px;fill:#666}.b{font-size:14px;font-weight:bold;fill:#222}</style>
<text x="20" y="24" class="b">§3-2 純かぶりと芯かぶりの違い</text>

<rect x="60" y="60" width="260" height="180" fill="#f5f0ea" stroke="#555"/>
<circle cx="130" cy="110" r="12" fill="#8a5a3b"/><circle cx="190" cy="110" r="12" fill="#8a5a3b"/><circle cx="250" cy="110" r="12" fill="#8a5a3b"/>
<line x1="60" y1="60" x2="60" y2="240" stroke="#e8632a" stroke-width="2.5"/>
<line x1="60" y1="98" x2="118" y2="98" stroke="#e8632a" stroke-width="1.5"/>
<line x1="60" y1="93" x2="60" y2="103" stroke="#e8632a"/><line x1="118" y1="93" x2="118" y2="103" stroke="#e8632a"/>
<text x="89" y="88" text-anchor="middle" class="t" fill="#e8632a" font-weight="bold">純かぶり</text>
<text x="190" y="270" text-anchor="middle" class="s">コンクリート表面 → 鋼材表面の最短距離</text>
<text x="190" y="286" text-anchor="middle" class="s" fill="#e8632a">これが設計上のかぶり</text>

<rect x="400" y="60" width="260" height="180" fill="#f5f0ea" stroke="#555"/>
<circle cx="470" cy="110" r="12" fill="#8a5a3b"/><circle cx="530" cy="110" r="12" fill="#8a5a3b"/><circle cx="590" cy="110" r="12" fill="#8a5a3b"/>
<line x1="400" y1="60" x2="400" y2="240" stroke="#0a72b0" stroke-width="2.5"/>
<line x1="400" y1="98" x2="470" y2="98" stroke="#0a72b0" stroke-width="1.5"/>
<line x1="400" y1="93" x2="400" y2="103" stroke="#0a72b0"/><line x1="470" y1="93" x2="470" y2="103" stroke="#0a72b0"/>
<line x1="470" y1="98" x2="470" y2="110" stroke="#0a72b0" stroke-dasharray="3 2"/>
<text x="435" y="88" text-anchor="middle" class="t" fill="#0a72b0" font-weight="bold">芯かぶり</text>
<text x="530" y="270" text-anchor="middle" class="s">コンクリート表面 → 鉄筋の中心</text>
<text x="530" y="286" text-anchor="middle" class="s" fill="#0a72b0">純かぶり ＋ 鉄筋半径</text>

<rect x="60" y="160" width="260" height="40" fill="none"/>
<text x="80" y="185" class="s">※現場は表面まで測ることが多い。径の分だけ差が出る</text>
<text x="420" y="185" class="s">※目標は設計かぶり ＋5mm 程度</text>
<text x="420" y="203" class="s" fill="#e8632a">マイナス方向の誤差は有効高さを減らす</text>
</svg>
