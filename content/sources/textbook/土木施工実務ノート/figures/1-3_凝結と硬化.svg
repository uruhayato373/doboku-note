<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="sans-serif">
<style>.t{font-size:13px;fill:#333}.s{font-size:11px;fill:#666}.b{font-size:14px;font-weight:bold;fill:#222}.o{fill:#e8632a}</style>
<text x="20" y="26" class="b">§1-3 コンクリートの凝結と硬化（普通ポルトランドセメント・20℃前後の目安）</text>

<rect x="60" y="70" width="180" height="34" fill="#fdece4" stroke="#e8632a"/>
<rect x="240" y="70" width="180" height="34" fill="#f9c9ae" stroke="#e8632a"/>
<rect x="420" y="70" width="260" height="34" fill="#e8632a"/>
<text x="150" y="92" text-anchor="middle" class="t">生コンクリート</text>
<text x="330" y="92" text-anchor="middle" class="t">凝　結</text>
<text x="550" y="92" text-anchor="middle" class="t" fill="#fff">硬　化（強度発現）</text>

<line x1="60" y1="130" x2="700" y2="130" stroke="#333" stroke-width="1.5"/>
<polygon points="700,130 692,126 692,134" fill="#333"/>
<text x="710" y="134" class="s">時間</text>

<g stroke="#333"><line x1="60" y1="126" x2="60" y2="134"/><line x1="240" y1="126" x2="240" y2="134"/><line x1="420" y1="126" x2="420" y2="134"/></g>
<text x="60" y="150" text-anchor="middle" class="s">練混ぜ</text>
<text x="240" y="150" text-anchor="middle" class="s">2〜4時間</text>
<text x="420" y="150" text-anchor="middle" class="s">4〜6時間</text>

<line x1="240" y1="60" x2="240" y2="70" stroke="#e8632a" stroke-width="2"/>
<line x1="420" y1="60" x2="420" y2="70" stroke="#e8632a" stroke-width="2"/>
<text x="240" y="54" text-anchor="middle" class="t o" font-weight="bold">始　発</text>
<text x="420" y="54" text-anchor="middle" class="t o" font-weight="bold">終　結</text>

<rect x="160" y="175" width="170" height="56" rx="4" fill="#fff" stroke="#e8632a"/>
<text x="245" y="195" text-anchor="middle" class="t o" font-weight="bold">貫入抵抗 3.5 N/mm²</text>
<text x="245" y="213" text-anchor="middle" class="s">流動性を失う</text>
<text x="245" y="227" text-anchor="middle" class="s">指で押すと跡がつく</text>

<rect x="340" y="175" width="170" height="56" rx="4" fill="#fff" stroke="#e8632a"/>
<text x="425" y="195" text-anchor="middle" class="t o" font-weight="bold">貫入抵抗 28 N/mm²</text>
<text x="425" y="213" text-anchor="middle" class="s">押しても跡がつかない</text>
<text x="425" y="227" text-anchor="middle" class="s">＝硬化の開始</text>

<line x1="60" y1="258" x2="700" y2="258" stroke="#ccc"/>
<text x="20" y="278" class="s" fill="#333">仕上げ作業</text>
<rect x="160" y="266" width="170" height="24" rx="3" fill="#f5f5f5" stroke="#999"/>
<text x="245" y="282" text-anchor="middle" class="s">木ゴテ仕上げ</text>
<rect x="420" y="266" width="200" height="24" rx="3" fill="#f5f5f5" stroke="#999"/>
<text x="520" y="282" text-anchor="middle" class="s">金ゴテ押さえ／散水養生</text>
<text x="20" y="310" class="s">※セメント種類・水分量・外気温・部材厚で大きく変動する</text>
</svg>
