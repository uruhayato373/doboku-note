<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" font-family="sans-serif">
<style>.t{font-size:12px;fill:#333}.s{font-size:11px;fill:#666}.b{font-size:14px;font-weight:bold;fill:#222}.h{font-size:13px;font-weight:bold;fill:#e8632a}</style>
<text x="20" y="24" class="b">§6-9 盛土の沈下・側方移動と観測</text>

<g>
<text x="190" y="52" text-anchor="middle" class="h">沈下盤による沈下量の把握</text>
<polygon points="90,200 290,200 250,120 130,120" fill="#8a6a4a"/>
<line x1="60" y1="200" x2="330" y2="200" stroke="#555" stroke-width="2"/>
<text x="60" y="218" class="s">現地盤</text>
<g stroke="#333" stroke-width="2">
<line x1="150" y1="200" x2="150" y2="100"/><line x1="190" y1="200" x2="190" y2="100"/><line x1="230" y1="200" x2="230" y2="100"/>
</g>
<g fill="#333"><rect x="138" y="198" width="24" height="6"/><rect x="178" y="198" width="24" height="6"/><rect x="218" y="198" width="24" height="6"/></g>
<text x="255" y="98" class="s">連結された鋼棒</text>
<text x="255" y="114" class="s">（レベル測量で計測）</text>
<text x="190" y="240" text-anchor="middle" class="s">盛土施工前に現地盤上に沈下盤を設置し、</text>
<text x="190" y="256" text-anchor="middle" class="s">盛土上方まで鋼棒を延長する</text>
<text x="190" y="278" text-anchor="middle" class="s" fill="#e8632a">施工直後の計測精度が高いほど</text>
<text x="190" y="292" text-anchor="middle" class="s" fill="#e8632a">最終沈下量の予測精度が上がる（双曲線法）</text>
</g>

<g>
<text x="580" y="52" text-anchor="middle" class="h">側方移動と連込み沈下</text>
<polygon points="480,190 680,190 640,110 520,110" fill="#8a6a4a"/>
<path d="M410,190 L480,190" stroke="#555" stroke-width="2"/>
<path d="M680,190 L750,190" stroke="#555" stroke-width="2"/>
<path d="M410,186 Q450,182 480,196 L680,196 Q710,182 750,186" stroke="#e8632a" stroke-width="2" fill="none" stroke-dasharray="5 3"/>
<line x1="450" y1="170" x2="416" y2="170" stroke="#e8632a" stroke-width="2.5"/>
<polygon points="410,170 424,163 424,177" fill="#e8632a"/>
<line x1="710" y1="170" x2="744" y2="170" stroke="#e8632a" stroke-width="2.5"/>
<polygon points="750,170 736,163 736,177" fill="#e8632a"/>
<text x="430" y="160" text-anchor="middle" class="s" fill="#e8632a">側方移動</text>
<text x="730" y="160" text-anchor="middle" class="s" fill="#e8632a">側方移動</text>
<line x1="580" y1="196" x2="580" y2="218" stroke="#e8632a" stroke-width="2.5"/>
<polygon points="580,224 573,210 587,210" fill="#e8632a"/>
<text x="580" y="240" text-anchor="middle" class="s" fill="#e8632a">連込み沈下</text>
<text x="580" y="266" text-anchor="middle" class="s">軟弱地盤に載荷すると、せん断変形に伴う</text>
<text x="580" y="280" text-anchor="middle" class="s">側方移動と、圧密に伴う沈下が同時に起きる</text>
<text x="580" y="302" text-anchor="middle" class="s" fill="#e8632a">対策：基礎地盤改良／盛土荷重の軽減／構造物による補強</text>
</g>
</svg>
