<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="sans-serif">
<style>.t{font-size:12px;fill:#333}.s{font-size:11px;fill:#666}.b{font-size:14px;font-weight:bold;fill:#222}.o{fill:#e8632a}</style>
<text x="20" y="24" class="b">§1-26 コンクリート1m³の体積構成 — 何を動かすとどこが変わるか</text>

<g>
<rect x="60" y="60" width="90" height="30" fill="#dceaf5" stroke="#666"/>
<rect x="60" y="90" width="90" height="55" fill="#f2f2f2" stroke="#666"/>
<rect x="60" y="145" width="90" height="90" fill="#f9c9ae" stroke="#666"/>
<rect x="60" y="235" width="90" height="120" fill="#e8b98f" stroke="#666"/>
<text x="105" y="79" text-anchor="middle" class="s">空気</text>
<text x="105" y="122" text-anchor="middle" class="s">水</text>
<text x="105" y="195" text-anchor="middle" class="s">細骨材</text>
<text x="105" y="300" text-anchor="middle" class="s">粗骨材</text>
<text x="105" y="375" text-anchor="middle" class="t">基準</text>
</g>

<g>
<rect x="230" y="60" width="90" height="46" fill="#dceaf5" stroke="#666"/>
<rect x="230" y="106" width="90" height="55" fill="#f2f2f2" stroke="#666"/>
<rect x="230" y="161" width="90" height="86" fill="#f9c9ae" stroke="#666"/>
<rect x="230" y="247" width="90" height="108" fill="#e8b98f" stroke="#666"/>
<text x="275" y="88" text-anchor="middle" class="s">空気↑</text>
<text x="275" y="375" text-anchor="middle" class="t">① 空気量を増やす</text>
<text x="275" y="392" text-anchor="middle" class="s" fill="#e8632a">骨材の体積が押し下げられる</text>
</g>

<g>
<rect x="400" y="60" width="90" height="30" fill="#dceaf5" stroke="#666"/>
<rect x="400" y="90" width="90" height="72" fill="#f2f2f2" stroke="#666"/>
<rect x="400" y="162" width="90" height="82" fill="#f9c9ae" stroke="#666"/>
<rect x="400" y="244" width="90" height="111" fill="#e8b98f" stroke="#666"/>
<text x="445" y="130" text-anchor="middle" class="s">水＋セメント↑</text>
<text x="445" y="375" text-anchor="middle" class="t">② W/C を上げる</text>
<text x="445" y="392" text-anchor="middle" class="s" fill="#e8632a">ペースト量が増え骨材が減る</text>
</g>

<g>
<rect x="570" y="60" width="90" height="30" fill="#dceaf5" stroke="#666"/>
<rect x="570" y="90" width="90" height="55" fill="#f2f2f2" stroke="#666"/>
<rect x="570" y="145" width="90" height="128" fill="#f9c9ae" stroke="#666"/>
<rect x="570" y="273" width="90" height="82" fill="#e8b98f" stroke="#666"/>
<text x="615" y="215" text-anchor="middle" class="s">細骨材↑</text>
<text x="615" y="375" text-anchor="middle" class="t">③ s/a を上げる</text>
<text x="615" y="392" text-anchor="middle" class="s" fill="#e8632a">骨材内の配分だけが変わる</text>
</g>

<line x1="40" y1="145" x2="700" y2="145" stroke="#e8632a" stroke-dasharray="4 3"/>
<text x="36" y="141" text-anchor="end" class="s" fill="#e8632a">水の下端</text>
<line x1="40" y1="355" x2="700" y2="355" stroke="#333"/>
<text x="36" y="359" text-anchor="end" class="s">1 m³</text>
</svg>
