<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="sans-serif">
<style>.t{font-size:12px;fill:#333}.s{font-size:11px;fill:#666}.b{font-size:14px;font-weight:bold;fill:#222}.h{font-size:13px;font-weight:bold;fill:#e8632a}</style>
<text x="20" y="24" class="b">§4-6 鋼矢板の頭部水平変位 — なぜ1次掘削で大きいのか</text>

<g>
<text x="170" y="52" text-anchor="middle" class="h">1次掘削：片持ち梁</text>
<rect x="60" y="70" width="90" height="180" fill="#e8d5c0"/>
<path d="M162,70 Q158,150 155,180 L155,250" stroke="#555" stroke-width="4" fill="none"/>
<rect x="155" y="250" width="120" height="0" fill="none"/>
<circle cx="155" cy="180" r="6" fill="none" stroke="#e8632a" stroke-width="2"/>
<text x="200" y="184" class="s" fill="#e8632a">固定点（掘削面）</text>
<line x1="185" y1="70" x2="155" y2="70" stroke="#e8632a" stroke-width="1.5"/>
<polygon points="155,70 163,66 163,74" fill="#e8632a"/>
<text x="192" y="66" class="s" fill="#e8632a">頭部変位 大</text>
<g stroke="#0a72b0" stroke-width="1"><line x1="152" y1="90" x2="132" y2="90"/><line x1="152" y1="110" x2="136" y2="110"/><line x1="152" y1="130" x2="140" y2="130"/><line x1="152" y1="150" x2="144" y2="150"/></g>
<text x="105" y="272" text-anchor="middle" class="s">分布荷重</text>
</g>

<g>
<text x="470" y="52" text-anchor="middle" class="h">2次掘削以降：単純梁</text>
<rect x="360" y="70" width="90" height="180" fill="#e8d5c0"/>
<path d="M453,70 L453,110 Q447,140 453,175 L453,250" stroke="#555" stroke-width="4" fill="none"/>
<circle cx="453" cy="110" r="6" fill="none" stroke="#0a72b0" stroke-width="2"/>
<circle cx="453" cy="175" r="6" fill="none" stroke="#0a72b0" stroke-width="2"/>
<rect x="455" y="104" width="60" height="12" fill="#888"/>
<text x="522" y="114" class="s">1段目の腹起こし・切梁</text>
<text x="500" y="180" class="s" fill="#0a72b0">固定点（掘削面）</text>
<text x="470" y="272" text-anchor="middle" class="s">両端支持となりたわみが小さい</text>
</g>

<rect x="60" y="290" width="600" height="26" rx="4" fill="#fdece4" stroke="#e8632a"/>
<text x="360" y="308" text-anchor="middle" class="t" fill="#e8632a" font-weight="bold">片持ち梁のたわみ量は、同じ分布荷重でも単純梁のおおよそ9〜10倍</text>
</svg>
