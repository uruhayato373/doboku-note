<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="sans-serif">
<style>.t{font-size:12px;fill:#333}.s{font-size:11px;fill:#666}.b{font-size:14px;font-weight:bold;fill:#222}.o{fill:#e8632a}.lbl{font-size:12px;font-weight:bold;fill:#e8632a}</style>
<text x="20" y="24" class="b">§1-16〜19 現場で守る4つの数値</text>

<line x1="120" y1="50" x2="120" y2="330" stroke="#555" stroke-width="3"/>
<line x1="480" y1="50" x2="480" y2="330" stroke="#555" stroke-width="3"/>
<text x="90" y="46" class="s">型枠</text>

<rect x="123" y="230" width="354" height="100" fill="#f9c9ae"/>
<rect x="123" y="180" width="354" height="50" fill="#fdece4"/>
<line x1="123" y1="230" x2="477" y2="230" stroke="#e8632a" stroke-dasharray="4 3"/>
<text x="300" y="262" text-anchor="middle" class="t">下　層</text>
<text x="300" y="205" text-anchor="middle" class="t">上　層</text>

<g stroke="#e8632a" stroke-width="2">
<line x1="123" y1="180" x2="133" y2="180"/><line x1="123" y1="230" x2="133" y2="230"/>
<line x1="123" y1="280" x2="133" y2="280"/><line x1="123" y1="330" x2="133" y2="330"/>
</g>
<text x="108" y="184" text-anchor="end" class="s">150cm</text>
<text x="108" y="234" text-anchor="end" class="s">100cm</text>
<text x="108" y="284" text-anchor="end" class="s">50cm</text>

<line x1="60" y1="180" x2="60" y2="230" stroke="#e8632a" stroke-width="1.5"/>
<polygon points="60,180 56,188 64,188" fill="#e8632a"/><polygon points="60,230 56,222 64,222" fill="#e8632a"/>
<text x="52" y="210" text-anchor="end" class="lbl">1-16</text>
<text x="52" y="224" text-anchor="end" class="s">50cm以下</text>

<rect x="200" y="52" width="90" height="18" fill="#888"/>
<text x="245" y="66" text-anchor="middle" class="s" fill="#fff">コンクリートホース</text>
<line x1="245" y1="70" x2="245" y2="178" stroke="#e8632a" stroke-width="1.5" stroke-dasharray="5 3"/>
<polygon points="245,178 241,170 249,170" fill="#e8632a"/>
<text x="255" y="120" class="lbl">1-17</text>
<text x="255" y="136" class="s">自由落下高さ</text>
<text x="255" y="150" class="s">1.5m以下・鉛直に</text>

<g>
<rect x="360" y="60" width="10" height="140" fill="#777"/>
<rect x="360" y="200" width="10" height="40" fill="#e8632a"/>
<text x="385" y="215" class="lbl">1-18</text>
<text x="385" y="231" class="s">下層に10cm程度挿入</text>
<line x1="352" y1="230" x2="352" y2="240" stroke="#e8632a"/>
<line x1="345" y1="230" x2="359" y2="230" stroke="#e8632a"/>
<line x1="345" y1="240" x2="359" y2="240" stroke="#e8632a"/>
</g>

<g>
<circle cx="160" cy="360" r="5" fill="#e8632a"/><circle cx="240" cy="360" r="5" fill="#e8632a"/>
<circle cx="320" cy="360" r="5" fill="#e8632a"/><circle cx="400" cy="360" r="5" fill="#e8632a"/>
<line x1="160" y1="375" x2="240" y2="375" stroke="#e8632a"/>
<line x1="160" y1="371" x2="160" y2="379" stroke="#e8632a"/>
<line x1="240" y1="371" x2="240" y2="379" stroke="#e8632a"/>
<text x="200" y="393" text-anchor="middle" class="s">50cm以下</text>
<text x="440" y="364" class="lbl">1-19</text>
<text x="440" y="380" class="s">挿入間隔50cm以下</text>
<text x="440" y="394" class="s">1カ所5〜15秒</text>
</g>
<text x="20" y="420" class="s">※型枠に50cm間隔でマーキング、バイブレーター先端から10cmにテープを巻くと現場で守れる</text>
</svg>
