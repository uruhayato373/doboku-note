<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="sans-serif">
<style>.t{font-size:12px;fill:#333}.s{font-size:11px;fill:#666}.h{font-size:14px;fill:#333;font-weight:bold}.a{font-size:11px;fill:#e8632a}</style>
<text x="8" y="18" class="h">舗装の層構成と厚さの目安（一般道路／簡易舗装／歩道）</text>
<g>
<text x="30" y="46" class="t">一般道路</text>
<rect x="30" y="54" width="150" height="18" fill="#333"/><text x="190" y="67" class="t">表層</text>
<rect x="30" y="72" width="150" height="18" fill="#555"/><text x="190" y="85" class="t">基層</text>
<rect x="30" y="90" width="150" height="34" fill="#bbb" stroke="#333"/><text x="190" y="111" class="t">路盤（上層／下層）</text>
<rect x="30" y="124" width="150" height="40" fill="#e8dcd2" stroke="#333"/><text x="190" y="148" class="t">路床（約1m）</text>
<rect x="30" y="164" width="150" height="26" fill="#f2f2f2" stroke="#333"/><text x="190" y="181" class="t">路体（盛土部分）</text>
<path d="M20 54 L20 90" stroke="#e8632a" stroke-width="2" marker-start="url(#e)" marker-end="url(#e)"/>
<text x="10" y="76" class="a" text-anchor="end">15–20cm</text>
<path d="M20 90 L20 124" stroke="#e8632a" stroke-width="2" marker-start="url(#e)" marker-end="url(#e)"/>
<text x="10" y="110" class="a" text-anchor="end">20cm</text>
</g>
<g transform="translate(360,0)">
<text x="30" y="46" class="t">簡易舗装（駐車場等）</text>
<rect x="30" y="54" width="150" height="14" fill="#333"/><text x="190" y="65" class="t">表層のみ</text>
<rect x="30" y="68" width="150" height="34" fill="#bbb" stroke="#333"/><text x="190" y="90" class="t">路盤</text>
<text x="25" y="65" class="a" text-anchor="end">3–4cm</text>
<text x="25" y="90" class="a" text-anchor="end">15cm</text>
<text x="30" y="140" class="t">歩道</text>
<rect x="30" y="148" width="150" height="14" fill="#333"/><text x="190" y="159" class="t">表層</text>
<rect x="30" y="162" width="150" height="24" fill="#bbb" stroke="#333"/><text x="190" y="179" class="t">路盤</text>
<text x="25" y="159" class="a" text-anchor="end">3–4cm</text>
<text x="25" y="179" class="a" text-anchor="end">10cm</text>
<text x="30" y="206" class="s">※基層の有無は設置条件で判断</text>
</g>
<line x1="20" y1="212" x2="680" y2="212" stroke="#666"/>
<text x="20" y="234" class="t">層の役割（上から下へ荷重を分散して伝える）</text>
<text x="20" y="254" class="s">表層＝走行面・排水／基層＝下面の不陸を補正し荷重を均等に伝達／路盤＝荷重を分散し路床へ／路床＝舗装の支持地盤</text>
<text x="20" y="276" class="a">つまり、上層ほど「面をつくる」層、下層ほど「支える」層。どこか一層が弱いと上の層で吸収できない。</text>
<text x="20" y="300" class="s">路床のCBRが3未満なら、置換・安定処理・盛土のいずれかで構築路床とする（→§8-4）</text>
<defs><marker id="e" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0 3 L6 0 L6 6 z" fill="#e8632a"/></marker></defs>
</svg>
