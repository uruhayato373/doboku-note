<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="sans-serif">
<style>.t{font-size:12px;fill:#333}.s{font-size:11px;fill:#666}.h{font-size:14px;fill:#333;font-weight:bold}.a{font-size:11px;fill:#e8632a}</style>
<text x="8" y="18" class="h">河川横断面の用語（下流を向いて左が左岸）</text>
<path d="M20 200 L120 200 L180 130 L280 130 L320 165 L420 165 L460 130 L560 130 L620 200 L700 200" fill="#e0d6cc" stroke="#333"/>
<path d="M320 165 L420 165 L420 200 L320 200 Z" fill="#8fb6d0" stroke="none"/>
<rect x="320" y="160" width="100" height="6" fill="#8fb6d0"/>
<line x1="180" y1="130" x2="280" y2="130" stroke="#e8632a" stroke-width="3"/>
<line x1="460" y1="130" x2="560" y2="130" stroke="#e8632a" stroke-width="3"/>
<text x="230" y="122" class="a" text-anchor="middle">左岸堤防</text>
<text x="510" y="122" class="a" text-anchor="middle">右岸堤防</text>
<text x="370" y="192" class="t" text-anchor="middle">低水路</text>
<text x="370" y="156" class="s" text-anchor="middle">平常時の水面</text>
<text x="298" y="158" class="t" text-anchor="end">高水敷</text>
<text x="442" y="158" class="t">高水敷</text>
<line x1="180" y1="215" x2="560" y2="215" stroke="#e8632a" marker-start="url(#f)" marker-end="url(#f)"/>
<text x="370" y="232" class="a" text-anchor="middle">堤外地（河道内）— ここの水が「外水」</text>
<text x="100" y="232" class="t" text-anchor="middle">堤内地</text>
<text x="100" y="248" class="s" text-anchor="middle">住居・農地側</text>
<text x="640" y="232" class="t" text-anchor="middle">堤内地</text>
<text x="100" y="264" class="a" text-anchor="middle">たまる水が「内水」</text>
<text x="230" y="108" class="s" text-anchor="middle">←川裏</text>
<text x="280" y="108" class="s" text-anchor="middle">川表→</text>
<line x1="180" y1="130" x2="180" y2="200" stroke="#666" stroke-dasharray="3 3"/>
<line x1="560" y1="130" x2="560" y2="200" stroke="#666" stroke-dasharray="3 3"/>
<text x="20" y="286" class="s">河積＝増水時に洪水が流れる横断面積。計画高水位を超えてあふれる状態が超過洪水、堤防が壊れることを破堤という。</text>
<defs><marker id="f" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0 3 L6 0 L6 6 z" fill="#e8632a"/></marker></defs>
</svg>
