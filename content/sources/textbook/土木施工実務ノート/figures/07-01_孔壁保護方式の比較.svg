<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="sans-serif">
<style>.t{font-size:13px;fill:#333}.s{font-size:11px;fill:#666}.h{font-size:14px;fill:#333;font-weight:bold}</style>
<text x="8" y="18" class="h">場所打ち杭 4工法の孔壁保護のしくみ</text>
<g>
<rect x="10" y="34" width="160" height="216" fill="none" stroke="#333"/>
<text x="90" y="54" class="h" text-anchor="middle">オールケーシング</text>
<rect x="60" y="70" width="60" height="140" fill="none" stroke="#e8632a" stroke-width="4"/>
<rect x="66" y="76" width="48" height="128" fill="#f6f6f6" stroke="none"/>
<text x="90" y="145" class="s" text-anchor="middle">孔内</text>
<text x="90" y="230" class="t" text-anchor="middle">鋼管で物理的に押える</text>
<text x="90" y="245" class="s" text-anchor="middle">ケーシングチューブ</text>
</g>
<g>
<rect x="180" y="34" width="160" height="216" fill="none" stroke="#333"/>
<text x="260" y="54" class="h" text-anchor="middle">アースドリル</text>
<rect x="230" y="70" width="60" height="140" fill="#e8632a" opacity="0.18" stroke="#333"/>
<text x="260" y="130" class="s" text-anchor="middle">安定液</text>
<text x="260" y="148" class="s" text-anchor="middle">比重1.01–1.10</text>
<path d="M225 140 L232 140 M288 140 L295 140" stroke="#e8632a" stroke-width="2"/>
<text x="260" y="230" class="t" text-anchor="middle">液の比重で押し返す</text>
<text x="260" y="245" class="s" text-anchor="middle">比重管理が生命線</text>
</g>
<g>
<rect x="350" y="34" width="160" height="216" fill="none" stroke="#333"/>
<text x="430" y="54" class="h" text-anchor="middle">リバース</text>
<rect x="400" y="70" width="60" height="140" fill="#e8632a" opacity="0.12" stroke="#333"/>
<line x1="380" y1="105" x2="480" y2="105" stroke="#e8632a" stroke-width="2"/>
<line x1="368" y1="128" x2="398" y2="128" stroke="#666" stroke-dasharray="4 3"/>
<line x1="462" y1="128" x2="492" y2="128" stroke="#666" stroke-dasharray="4 3"/>
<path d="M372 105 L372 128" stroke="#e8632a" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="378" y="122" class="s" fill="#e8632a">2m</text>
<text x="430" y="175" class="s" text-anchor="middle">孔内水</text>
<text x="430" y="230" class="t" text-anchor="middle">水頭差で押し返す</text>
<text x="430" y="245" class="s" text-anchor="middle">周囲地下水位＋2m以上</text>
</g>
<g>
<rect x="520" y="34" width="190" height="216" fill="none" stroke="#333"/>
<text x="615" y="54" class="h" text-anchor="middle">深礎</text>
<g stroke="#e8632a" stroke-width="3" fill="none">
<rect x="585" y="70" width="60" height="20"/><rect x="585" y="90" width="60" height="20"/>
<rect x="585" y="110" width="60" height="20"/><rect x="585" y="130" width="60" height="20"/>
<rect x="585" y="150" width="60" height="20"/><rect x="585" y="170" width="60" height="20"/>
<rect x="585" y="190" width="60" height="20"/></g>
<text x="615" y="230" class="t" text-anchor="middle">土留材を段積みする</text>
<text x="615" y="245" class="s" text-anchor="middle">ライナープレート</text>
</g>
<defs><marker id="a" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0 3 L6 0 L6 6 z" fill="#e8632a"/></marker></defs>
