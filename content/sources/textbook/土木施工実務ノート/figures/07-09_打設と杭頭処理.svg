<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="sans-serif">
<style>.t{font-size:12px;fill:#333}.s{font-size:11px;fill:#666}.h{font-size:14px;fill:#333;font-weight:bold}.a{font-size:11px;fill:#e8632a}</style>
<text x="8" y="18" class="h">水中コンクリート打設の寸法管理と杭頭処理</text>
<text x="20" y="42" class="t">［良い例］</text>
<rect x="30" y="52" width="120" height="230" fill="#f2f2f2" stroke="#333"/>
<rect x="30" y="120" width="120" height="162" fill="#ddd" stroke="#333"/>
<rect x="78" y="40" width="24" height="130" fill="none" stroke="#333" stroke-width="2"/>
<line x1="30" y1="120" x2="150" y2="120" stroke="#333" stroke-width="2"/>
<path d="M162 120 L162 170" stroke="#e8632a" stroke-width="2" marker-start="url(#c)" marker-end="url(#c)"/>
<text x="168" y="150" class="a">2m以上</text>
<text x="90" y="90" class="s" text-anchor="middle">孔内水</text>
<text x="90" y="230" class="s" text-anchor="middle">コンクリート</text>
<text x="235" y="42" class="t">［悪い例］</text>
<rect x="245" y="52" width="120" height="230" fill="#f2f2f2" stroke="#333"/>
<rect x="245" y="120" width="120" height="162" fill="#ddd" stroke="#333"/>
<rect x="293" y="40" width="24" height="100" fill="none" stroke="#333" stroke-width="2"/>
<line x1="245" y1="120" x2="365" y2="120" stroke="#333" stroke-width="2"/>
<path d="M377 120 L377 140" stroke="#e8632a" stroke-width="2" marker-start="url(#c)" marker-end="url(#c)"/>
<text x="383" y="136" class="a">2m未満</text>
<circle cx="305" cy="160" r="16" fill="none" stroke="#e8632a" stroke-width="2"/>
<text x="383" y="172" class="a">不純物が杭体に残る</text>
<line x1="430" y1="34" x2="430" y2="300" stroke="#666" stroke-dasharray="4 4"/>
<text x="450" y="42" class="t">［杭頭処理］</text>
<rect x="470" y="52" width="110" height="60" fill="#e8632a" opacity="0.25" stroke="#333"/>
<rect x="470" y="112" width="110" height="170" fill="#ddd" stroke="#333"/>
<text x="525" y="88" class="s" text-anchor="middle">余盛り</text>
<text x="525" y="200" class="s" text-anchor="middle">杭本体</text>
<line x1="460" y1="112" x2="592" y2="112" stroke="#666" stroke-dasharray="3 3"/>
<text x="596" y="116" class="s">計画天端</text>
<line x1="460" y1="102" x2="592" y2="102" stroke="#e8632a" stroke-width="2"/>
<text x="596" y="100" class="a">縁切り位置</text>
<path d="M452 102 L452 112" stroke="#e8632a" stroke-width="2" marker-start="url(#c)" marker-end="url(#c)"/>
<text x="400" y="110" class="a">約10cm</text>
<path d="M525 46 L525 24" stroke="#e8632a" stroke-width="2" marker-end="url(#d)"/>
<text x="525" y="18" class="s" text-anchor="middle">吊上げ撤去</text>
<text x="10" y="304" class="s">※ 余盛りは、孔内水の不純物と撤去時のバケット当りから鉄筋を守るための「捨てる部分」。少なすぎると鉄筋を損傷する。</text>
<text x="10" y="320" class="s">※ 打設前に杭頭鉄筋へ発泡スチロール製カバーを掛けておくと、余盛りの吊上げが円滑になる。</text>
<defs><marker id="c" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0 3 L6 0 L6 6 z" fill="#e8632a"/></marker>
<marker id="d" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#e8632a"/></marker></defs>
</svg>
