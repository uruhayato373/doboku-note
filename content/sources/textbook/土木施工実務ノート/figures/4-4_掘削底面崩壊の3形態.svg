<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="sans-serif">
<style>.t{font-size:12px;fill:#333}.s{font-size:10.5px;fill:#666}.b{font-size:14px;font-weight:bold;fill:#222}.h{font-size:13px;font-weight:bold;fill:#e8632a}</style>
<text x="20" y="24" class="b">§4-4 掘削底面崩壊の3形態</text>

<g>
<text x="130" y="52" text-anchor="middle" class="h">ボイリング</text>
<rect x="40" y="60" width="80" height="150" fill="#e8d5c0"/>
<rect x="180" y="60" width="80" height="150" fill="#e8d5c0"/>
<rect x="120" y="60" width="4" height="180" fill="#555"/>
<rect x="176" y="60" width="4" height="180" fill="#555"/>
<rect x="124" y="150" width="52" height="60" fill="#fff"/>
<line x1="40" y1="90" x2="120" y2="90" stroke="#0a72b0" stroke-width="1.5"/>
<line x1="180" y1="90" x2="260" y2="90" stroke="#0a72b0" stroke-width="1.5"/>
<text x="30" y="86" text-anchor="end" class="s" fill="#0a72b0">地下水位</text>
<path d="M110,200 Q112,180 124,168 Q136,158 150,155" stroke="#0a72b0" stroke-width="2" fill="none"/>
<path d="M190,200 Q188,180 176,168 Q164,158 150,155" stroke="#0a72b0" stroke-width="2" fill="none"/>
<polygon points="150,150 145,160 155,160" fill="#0a72b0"/>
<text x="150" y="232" text-anchor="middle" class="s">上向き浸透流</text>
<text x="150" y="252" text-anchor="middle" class="s">土の有効重量を超えると</text>
<text x="150" y="266" text-anchor="middle" class="s">砂が沸騰するように噴出</text>
<text x="150" y="292" text-anchor="middle" class="s" fill="#e8632a">対策：根入れを深く／</text>
<text x="150" y="306" text-anchor="middle" class="s" fill="#e8632a">水位低下／薬液注入</text>
</g>

<g>
<text x="410" y="52" text-anchor="middle" class="h">ヒービング</text>
<rect x="320" y="60" width="80" height="150" fill="#cbbba6"/>
<rect x="460" y="60" width="80" height="150" fill="#cbbba6"/>
<rect x="400" y="60" width="4" height="180" fill="#555"/>
<rect x="456" y="60" width="4" height="180" fill="#555"/>
<rect x="404" y="150" width="52" height="60" fill="#fff"/>
<path d="M404,210 Q430,190 456,210" stroke="#e8632a" stroke-width="2" fill="none"/>
<polygon points="430,192 424,202 436,202" fill="#e8632a"/>
<path d="M350,60 L350,72" stroke="#e8632a" stroke-width="2"/>
<polygon points="350,74 345,64 355,64" fill="#e8632a"/>
<text x="350" y="86" text-anchor="middle" class="s">沈下</text>
<text x="430" y="232" text-anchor="middle" class="s">底面の隆起</text>
<text x="410" y="252" text-anchor="middle" class="s">軟弱粘性土（N値3以下）で</text>
<text x="410" y="266" text-anchor="middle" class="s">背面沈下＋底面隆起</text>
<text x="410" y="292" text-anchor="middle" class="s" fill="#e8632a">対策：根入れを深く／</text>
<text x="410" y="306" text-anchor="middle" class="s" fill="#e8632a">地盤改良／背面を掘り下げ</text>
</g>

<g>
<text x="680" y="52" text-anchor="middle" class="h">盤ぶくれ</text>
<rect x="590" y="60" width="80" height="120" fill="#e8d5c0"/>
<rect x="730" y="60" width="80" height="120" fill="#e8d5c0"/>
<rect x="590" y="180" width="220" height="16" fill="#a89a86"/>
<rect x="590" y="196" width="220" height="24" fill="#bcd8ea"/>
<rect x="670" y="60" width="4" height="120" fill="#555"/>
<rect x="726" y="60" width="4" height="120" fill="#555"/>
<rect x="674" y="120" width="52" height="60" fill="#fff"/>
<text x="815" y="192" text-anchor="end" class="s" fill="#7a6a56">難透水層</text>
<text x="815" y="214" text-anchor="end" class="s" fill="#0a72b0">被圧帯水層</text>
<g stroke="#0a72b0" stroke-width="1.5">
<line x1="620" y1="196" x2="620" y2="184"/><line x1="660" y1="196" x2="660" y2="184"/>
<line x1="700" y1="196" x2="700" y2="184"/><line x1="740" y1="196" x2="740" y2="184"/>
<line x1="780" y1="196" x2="780" y2="184"/>
</g>
<path d="M674,180 Q700,164 726,180" stroke="#e8632a" stroke-width="2" fill="none"/>
<text x="700" y="240" text-anchor="middle" class="s">下部の水圧が難透水層を</text>
<text x="700" y="254" text-anchor="middle" class="s">押し上げ底面が膨れる</text>
<text x="700" y="292" text-anchor="middle" class="s" fill="#e8632a">対策：難透水層下まで根入れ／</text>
<text x="700" y="306" text-anchor="middle" class="s" fill="#e8632a">揚水で揚圧力低下／地盤改良</text>
</g>
</svg>
