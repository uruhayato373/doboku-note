<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <rect x="0" y="0" width="1200" height="520" fill="#ffffff"/>
  <rect x="1" y="1" width="1198" height="518" fill="none" stroke="#d8dde3" stroke-width="2" rx="14"/>
  <text x="48" y="64" font-size="30" font-weight="700" fill="#181a1f">やることは、たった3つ</text>
  <text x="48" y="100" font-size="20" fill="#5a5f6a">パソコンで Claude Code（CLI）と Node.js を使える方向けの、ローカル作業キットです</text>

  <!-- card 1 -->
  <rect x="48" y="150" width="344" height="300" rx="14" fill="#fbfcfe" stroke="#c9d3df" stroke-width="2"/>
  <circle cx="98" cy="208" r="26" fill="#2a5f96"/><text x="98" y="217" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="140" y="217" font-size="24" font-weight="700" fill="#181a1f">展開して開く</text>
  <text x="76" y="272" font-size="19" fill="#33363d">キットの ZIP を展開し、</text>
  <text x="76" y="302" font-size="19" fill="#33363d">Claude Code でフォルダを</text>
  <text x="76" y="332" font-size="19" fill="#33363d">開きます。</text>

  <!-- card 2 -->
  <rect x="428" y="150" width="344" height="300" rx="14" fill="#fbfcfe" stroke="#c9d3df" stroke-width="2"/>
  <circle cx="478" cy="208" r="26" fill="#2a5f96"/><text x="478" y="217" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="520" y="217" font-size="24" font-weight="700" fill="#181a1f">経験を記入</text>
  <text x="456" y="272" font-size="19" fill="#33363d">入力シートに、自分の</text>
  <text x="456" y="302" font-size="19" fill="#33363d">工事経験を記入します。</text>
  <text x="456" y="332" font-size="19" fill="#33363d">分からない数値は空欄で可。</text>

  <!-- card 3 -->
  <rect x="808" y="150" width="344" height="300" rx="14" fill="#edf3fa" stroke="#2a5f96" stroke-width="2"/>
  <circle cx="858" cy="208" r="26" fill="#2a5f96"/><text x="858" y="217" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="900" y="217" font-size="24" font-weight="700" fill="#181a1f">スキルを実行</text>
  <text x="836" y="272" font-size="19" fill="#33363d">不足を補いながら、</text>
  <text x="836" y="302" font-size="19" fill="#33363d">答案案・独立レビュー・</text>
  <text x="836" y="332" font-size="19" fill="#33363d">字数検査を受け取ります。</text>

  <text x="600" y="392" font-size="18" fill="#98a0ac" text-anchor="middle" opacity="0"></text>
  <text x="1152" y="490" font-size="17" fill="#98a0ac" text-anchor="end">doboku-note</text>
</svg>
