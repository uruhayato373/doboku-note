<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" lang="ja">
<head>
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="format-detection" content="telephone=no" />
  <title>登録の確認｜doboku-note</title>
  <style type="text/css">
    *{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
    body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",helvetica,arial,sans-serif;}
    table{margin:0 auto;}
    div,a,li,td{-webkit-text-size-adjust:none;}
    @media only screen and (max-width:640px){table[class=full]{width:100%!important;}}
    @media only screen and (max-width:479px){table[class=fullcenter]{width:100%!important;text-align:center!important;}}
  </style>
</head>
<body style="margin:0;padding:0;">
<table width="100%" cellspacing="0" cellpadding="0" border="0" align="center" bgcolor="#ffffff" style="background:#ffffff;">
  <tbody>
  <tr>
    <td>
      <table class="full" align="center" width="570" border="0" cellpadding="0" cellspacing="0" style="padding:0 5px;">
        <tbody>
        <tr>
          <td height="30" width="100%"></td>
        </tr>
        <!-- Title -->
        <tr>
          <td align="left" style="padding:0 20px;text-align:left;font-size:18px;color:#16365c;line-height:30px;font-weight:700;" valign="middle" width="100%">
            登録の確認をお願いします
          </td>
        </tr>
        <tr>
          <td height="16" width="100%"></td>
        </tr>
        <!-- Lead -->
        <tr>
          <td align="left" style="padding:0 20px;text-align:left;font-size:15px;color:#333333;line-height:26px;" valign="middle" width="100%">
            技術士第一次試験 令和8年度の自己採点シートのお申し込み、ありがとうございます。<br />
            下のボタンを押すと登録が完了し、自己採点シートと「結果別の次の一手」をお送りします。
          </td>
        </tr>
        <tr>
          <td height="30" width="100%"></td>
        </tr>
        <!-- Button -->
        <tr>
          <td align="center" style="padding:0 20px;text-align:center;" valign="middle" width="100%">
            <table cellspacing="0" cellpadding="0" border="0" align="center" class="fullcenter">
              <tbody>
              <tr>
                <td style="background:#16365c;-webkit-border-radius:5px;-moz-border-radius:5px;border-radius:5px;padding:0 32px;font-weight:700;color:#ffffff;" align="center" bgcolor="#16365c" height="48">
                  <a href="{{ doubleoptin }}" target="_blank" style="color:#ffffff;font-size:16px;text-decoration:none;line-height:24px;width:100%;">登録を完了する</a>
                </td>
              </tr>
              </tbody>
            </table>
          </td>
        </tr>
        <tr>
          <td height="30" width="100%"></td>
        </tr>
        <!-- Text -->
        <tr>
          <td align="left" style="padding:0 20px;text-align:left;font-size:13px;color:#676a6c;line-height:22px;" valign="middle" width="100%">
            このメールに心当たりがない場合は、何もしないでください。ボタンを押さなければ登録されず、今後メールが届くこともありません。
          </td>
        </tr>
        <tr>
          <td height="40" width="100%"></td>
        </tr>
        <!-- Footer -->
        <tr>
          <td align="left" style="padding:16px 20px 0;text-align:left;font-size:12px;color:#888888;line-height:20px;border-top:1px solid #e5e5e5;" valign="middle" width="100%">
            doboku-note（<a href="https://doboku-note.com" target="_blank" style="color:#888888;">https://doboku-note.com</a>）<br />
            送信者の情報・個人情報の扱い：<a href="https://doboku-note.com/privacy#mail" target="_blank" style="color:#888888;">https://doboku-note.com/privacy#mail</a>
          </td>
        </tr>
        <tr>
          <td height="40" width="100%"></td>
        </tr>
        </tbody>
      </table>
    </td>
  </tr>
  </tbody>
</table>
</body>
</html>
