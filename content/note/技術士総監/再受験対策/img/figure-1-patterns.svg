<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Yu Gothic, Noto Sans JP, sans-serif">
  <!-- 背景 #ffffff -->
  <rect width="1200" height="880" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <!-- タイトル -->
  <text x="40" y="64" font-size="34" font-weight="700" fill="#222222">不合格の3パターン分析フロー</text>
  <text x="40" y="104" font-size="22" fill="#555555">成績通知と択一式の自己採点から、自分のパターンを特定する</text>

  <!-- 起点 -->
  <rect x="300" y="144" width="600" height="96" rx="8" fill="#2e6da4"/>
  <text x="600" y="184" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">不合格の結果を確認する</text>
  <text x="600" y="220" font-size="20" fill="#ffffff" text-anchor="middle">成績通知（必須科目の評価）＋ 択一式の自己採点</text>

  <!-- 起点 → 3パターン -->
  <g stroke="#8a8a8a" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M 420 240 L 200 296"/>
    <path d="M 600 240 L 600 296"/>
    <path d="M 780 240 L 1000 296"/>
  </g>

  <!-- パターン1 -->
  <rect x="40" y="300" width="320" height="100" rx="8" fill="#fdecee" stroke="#b22234" stroke-width="2"/>
  <text x="62" y="340" font-size="20" font-weight="700" fill="#b22234">パターン1</text>
  <text x="62" y="378" font-size="26" font-weight="700" fill="#222222">択一式の得点不足</text>

  <!-- パターン2 -->
  <rect x="400" y="300" width="400" height="100" rx="8" fill="#fdf6e3" stroke="#d4a017" stroke-width="2"/>
  <text x="422" y="340" font-size="20" font-weight="700" fill="#9a7410">パターン2</text>
  <text x="422" y="378" font-size="26" font-weight="700" fill="#222222">記述式の得点不足</text>

  <!-- パターン3 -->
  <rect x="840" y="300" width="320" height="100" rx="8" fill="#f3f4f6" stroke="#555555" stroke-width="2"/>
  <text x="862" y="340" font-size="20" font-weight="700" fill="#555555">パターン3</text>
  <text x="862" y="378" font-size="26" font-weight="700" fill="#222222">口頭試験で不合格</text>

  <!-- パターン1 → 根本要因 -->
  <path d="M 200 400 L 200 456" stroke="#8a8a8a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="40" y="460" width="320" height="170" rx="8" fill="#f8fafc" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="62" y="498" font-size="20" fill="#8a8a8a">根本要因</text>
  <text x="62" y="538" font-size="24" font-weight="700" fill="#222222">分野別正答率の偏り</text>
  <text x="62" y="576" font-size="20" fill="#555555">特定の管理分野の理解不足</text>
  <text x="62" y="608" font-size="20" fill="#555555">分野ごとに正答数を数える</text>

  <!-- パターン2 → 水準の見積もり -->
  <path d="M 600 400 L 600 436" stroke="#8a8a8a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="400" y="440" width="400" height="110" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="2"/>
  <text x="600" y="482" font-size="24" font-weight="700" fill="#1a3a5c" text-anchor="middle">記述式の水準を見積もる</text>
  <text x="600" y="520" font-size="20" fill="#1a3a5c" text-anchor="middle">必須科目の評価と択一式の得点から</text>

  <!-- 見積もり → B判定 / C判定 -->
  <g stroke="#8a8a8a" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M 540 550 L 500 606"/>
    <path d="M 660 550 L 700 606"/>
  </g>
  <rect x="400" y="610" width="190" height="170" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="2"/>
  <text x="495" y="654" font-size="26" font-weight="700" fill="#2e6da4" text-anchor="middle">B判定</text>
  <text x="495" y="694" font-size="22" font-weight="700" fill="#222222" text-anchor="middle">あと一歩</text>
  <text x="495" y="730" font-size="20" fill="#555555" text-anchor="middle">視点は合うが</text>
  <text x="495" y="760" font-size="20" fill="#555555" text-anchor="middle">深みが不足</text>

  <rect x="610" y="610" width="190" height="170" rx="8" fill="#fdecee" stroke="#b22234" stroke-width="2"/>
  <text x="705" y="654" font-size="26" font-weight="700" fill="#b22234" text-anchor="middle">C判定</text>
  <text x="705" y="694" font-size="22" font-weight="700" fill="#222222" text-anchor="middle">大きく不足</text>
  <text x="705" y="730" font-size="20" fill="#555555" text-anchor="middle">求められる方向</text>
  <text x="705" y="760" font-size="20" fill="#555555" text-anchor="middle">からずれている</text>

  <!-- パターン3 → 根本要因 -->
  <path d="M 1000 400 L 1000 456" stroke="#8a8a8a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="840" y="460" width="320" height="170" rx="8" fill="#f8fafc" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="862" y="498" font-size="20" fill="#8a8a8a">根本要因</text>
  <text x="862" y="538" font-size="24" font-weight="700" fill="#222222">業務経歴の語り方のずれ</text>
  <text x="862" y="576" font-size="20" fill="#555555">専門技術の成果を語り、</text>
  <text x="862" y="608" font-size="20" fill="#555555">5管理の統合が伝わらない</text>

  <!-- ブランド -->
  <text x="1160" y="850" font-size="18" fill="#8a8a8a" text-anchor="end">doboku-note.com</text>
</svg>
