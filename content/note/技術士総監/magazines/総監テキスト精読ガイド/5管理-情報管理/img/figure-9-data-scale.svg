<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="574" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Yu Gothic, Noto Sans JP, sans-serif">
  
  <text x="40" y="60" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Yu Gothic, Noto Sans JP, sans-serif" font-size="32" font-weight="800" fill="#222222">4つのデータ尺度と適切な統計量</text>
  <text x="40" y="96" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Yu Gothic, Noto Sans JP, sans-serif" font-size="22" fill="#555555">名義・順序・間隔・比例の違いを正確に把握</text>
  
    <rect x="40" y="110" width="1120" height="82" rx="10" fill="#f8fafc" stroke="#8a8a8a" stroke-width="1.5"/>
    <text x="72" y="148" font-size="23" font-weight="800" fill="#8a8a8a">名義尺度</text>
    <text x="72" y="172" font-size="18" fill="#8a8a8a">Nominal</text>
    <text x="310" y="148" font-size="18" fill="#555555">郵便番号・電話番号・血液型</text>
    <text x="310" y="174" font-size="18" fill="#8a8a8a">大小比較×、差分×、比率×</text>
    <rect x="980" y="122" width="160" height="52" rx="8" fill="white" stroke="#8a8a8a" stroke-width="1.5"/>
    <text x="1060" y="142" text-anchor="middle" font-size="17" fill="#8a8a8a">代表統計量</text>
    <text x="1060" y="166" text-anchor="middle" font-size="20" font-weight="700" fill="#8a8a8a">最頻値</text>
    <rect x="40" y="200" width="1120" height="82" rx="10" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
    <text x="72" y="238" font-size="23" font-weight="800" fill="#2e6da4">順序尺度</text>
    <text x="72" y="262" font-size="18" fill="#8a8a8a">Ordinal</text>
    <text x="310" y="238" font-size="18" fill="#555555">5段階評価・震度・学年</text>
    <text x="310" y="264" font-size="18" fill="#8a8a8a">大小比較○、差分×、比率×</text>
    <rect x="980" y="212" width="160" height="52" rx="8" fill="white" stroke="#2e6da4" stroke-width="1.5"/>
    <text x="1060" y="232" text-anchor="middle" font-size="17" fill="#8a8a8a">代表統計量</text>
    <text x="1060" y="256" text-anchor="middle" font-size="20" font-weight="700" fill="#2e6da4">中央値</text>
    <rect x="40" y="290" width="1120" height="82" rx="10" fill="#e6f1e8" stroke="#3a7d44" stroke-width="1.5"/>
    <text x="72" y="328" font-size="23" font-weight="800" fill="#3a7d44">間隔尺度</text>
    <text x="72" y="352" font-size="18" fill="#8a8a8a">Interval</text>
    <text x="310" y="328" font-size="18" fill="#555555">温度（℃）・西暦・知能指数</text>
    <text x="310" y="354" font-size="18" fill="#8a8a8a">大小比較○、差分○、比率×</text>
    <rect x="980" y="302" width="160" height="52" rx="8" fill="white" stroke="#3a7d44" stroke-width="1.5"/>
    <text x="1060" y="322" text-anchor="middle" font-size="17" fill="#8a8a8a">代表統計量</text>
    <text x="1060" y="346" text-anchor="middle" font-size="20" font-weight="700" fill="#3a7d44">算術平均</text>
    <rect x="40" y="380" width="1120" height="82" rx="10" fill="#fbf3df" stroke="#d4a017" stroke-width="1.5"/>
    <text x="72" y="418" font-size="23" font-weight="800" fill="#d4a017">比例尺度</text>
    <text x="72" y="442" font-size="18" fill="#8a8a8a">Ratio</text>
    <text x="310" y="418" font-size="18" fill="#555555">身長・体重・金額・距離</text>
    <text x="310" y="444" font-size="18" fill="#8a8a8a">大小比較○、差分○、比率○</text>
    <rect x="980" y="392" width="160" height="52" rx="8" fill="white" stroke="#d4a017" stroke-width="1.5"/>
    <text x="1060" y="412" text-anchor="middle" font-size="17" fill="#8a8a8a">代表統計量</text>
    <text x="1060" y="436" text-anchor="middle" font-size="20" font-weight="700" fill="#d4a017">算術平均</text>
  <text x="40" y="472" font-size="18" fill="#555555">間隔尺度と比例尺度の違い：間隔尺度は「絶対ゼロ点がない」（℃の0度は寒さの基準）。比例尺度は絶対ゼロ点あり（0kgは本当に質量ゼロ）。</text>
  
</svg>