<!-- authored 2026-10-16 doboku-note 自作。数値は国土交通省「建設後50年以上経過する社会資本の割合」（本文の表）。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="建設後50年以上経過する社会資本の割合を、道路橋、トンネル、河川管理施設、水道管路、下水道管渠、港湾施設ごとに2025年3月、2030年3月、2040年3月の3時点で比べた横棒図。道路橋は約42%から約75%、水道管路は約10%から約40%へ増える。">
  <defs>
