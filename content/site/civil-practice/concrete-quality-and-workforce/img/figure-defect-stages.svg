<!-- authored 2026-10-15 doboku-note 自作。論点はコンクリートの不具合が生まれる三つの段階（製造・施工・条件設定）と、段階ごとに働く制度・記録の対応。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="コンクリートの不具合が生まれる三つの段階と、段階ごとに止める仕組みの対応図。製造は認証工場の選定、配合計画書、納入書。施工は荷卸し時の試験、単位水量の測定、施工計画書、段階確認、施工記録。条件設定は設計図書、工期、指示・協議の記録。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 12px; fill: #555; }
      .v { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .o { font-size: 12px; fill: #222; }
      .s { font-size: 11px; font-weight: bold; fill: #555; }
      .c { font-size: 13px; fill: #222; }
      .zone { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .cb { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; } /* brand-fill / brand */
      .cp { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; } /* positive-fill / positive */
      .cw { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; } /* warn-fill / warn */
      .pb { fill: #fff; stroke: #2e6da4; stroke-width: 1.5; }
      .pp { fill: #fff; stroke: #3a7d44; stroke-width: 1.5; }
      .pw { fill: #fff; stroke: #d4a017; stroke-width: 1.5; }
    </style>
  </defs>

  <rect class="zone" x="16" y="12" width="368" height="132" rx="8"/>
  <rect class="cb" x="28" y="22" width="56" height="24" rx="12"/><text class="v" x="56" y="38" text-anchor="middle">製造</text>
  <text class="o" x="94" y="38">工場で配合どおりに造る</text>
  <text class="s" x="28" y="64">止める仕組み</text>
  <rect class="pb" x="28" y="72" width="168" height="28" rx="6"/><text class="c" x="112" y="90" text-anchor="middle">認証工場の選定</text>
  <rect class="pb" x="204" y="72" width="168" height="28" rx="6"/><text class="c" x="288" y="90" text-anchor="middle">配合計画書</text>
  <rect class="pb" x="28" y="108" width="168" height="28" rx="6"/><text class="c" x="112" y="126" text-anchor="middle">納入書</text>
  <rect class="zone" x="16" y="158" width="368" height="168" rx="8"/>
  <rect class="cp" x="28" y="168" width="56" height="24" rx="12"/><text class="v" x="56" y="184" text-anchor="middle">施工</text>
  <text class="o" x="94" y="184">現場へ運び、打込み・締固め・養生</text>
  <text class="s" x="28" y="210">止める仕組み</text>
  <rect class="pp" x="28" y="218" width="168" height="28" rx="6"/><text class="c" x="112" y="236" text-anchor="middle">荷卸し時の試験</text>
  <rect class="pp" x="204" y="218" width="168" height="28" rx="6"/><text class="c" x="288" y="236" text-anchor="middle">単位水量の測定</text>
  <rect class="pp" x="28" y="254" width="168" height="28" rx="6"/><text class="c" x="112" y="272" text-anchor="middle">施工計画書</text>
  <rect class="pp" x="204" y="254" width="168" height="28" rx="6"/><text class="c" x="288" y="272" text-anchor="middle">段階確認</text>
  <rect class="pp" x="28" y="290" width="168" height="28" rx="6"/><text class="c" x="112" y="308" text-anchor="middle">施工記録</text>
  <rect class="zone" x="16" y="340" width="368" height="132" rx="8"/>
  <rect class="cw" x="28" y="350" width="84" height="24" rx="12"/><text class="v" x="70" y="366" text-anchor="middle">条件設定</text>
  <text class="o" x="122" y="366">何を・いつまでに・どの条件で造るか決める</text>
  <text class="s" x="28" y="392">止める仕組み</text>
  <rect class="pw" x="28" y="400" width="168" height="28" rx="6"/><text class="c" x="112" y="418" text-anchor="middle">設計図書</text>
  <rect class="pw" x="204" y="400" width="168" height="28" rx="6"/><text class="c" x="288" y="418" text-anchor="middle">工期</text>
  <rect class="pw" x="28" y="436" width="168" height="28" rx="6"/><text class="c" x="112" y="454" text-anchor="middle">指示・協議の記録</text>
</svg>
