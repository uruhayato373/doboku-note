<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="回帰、最適化、ニューラルネットワーク、ファジィ推論、遺伝的アルゴリズムについて、何を求める方法かと確かめる点を並べた比較" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
<rect width="400" height="500" fill="#ffffff"/>
<text x="20" y="24" font-size="12" fill="#555">何を求める方法かで区別する</text>
<rect x="20" y="34" width="360" height="70" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/><text x="32" y="56" font-size="14" font-weight="700" fill="#1a3a5c">回帰</text><text x="32" y="76" font-size="13" fill="#222">求める：データ間の関係から量を推定</text><text x="32" y="94" font-size="13" fill="#222">確かめる：当たる予測と最適な案は別</text>
<rect x="20" y="108" width="360" height="70" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/><text x="32" y="130" font-size="14" font-weight="700" fill="#1a3a5c">最適化</text><text x="32" y="150" font-size="13" fill="#222">求める：目的関数と制約の下で案を探す</text><text x="32" y="168" font-size="13" fill="#222">確かめる：条件を変えたときの結果</text>
<rect x="20" y="182" width="360" height="70" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/><text x="32" y="204" font-size="14" font-weight="700" fill="#1a3a5c">ニューラルネットワーク</text><text x="32" y="224" font-size="13" fill="#222">求める：学習と推論を分けて結果を出す</text><text x="32" y="242" font-size="13" fill="#222">確かめる：入力データの範囲・評価用データ</text>
<rect x="20" y="256" width="360" height="70" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/><text x="32" y="278" font-size="14" font-weight="700" fill="#1a3a5c">ファジィ推論</text><text x="32" y="298" font-size="13" fill="#222">求める：当てはまりの度合いとルールで出力</text><text x="32" y="316" font-size="13" fill="#222">確かめる：言葉の意味と範囲、確率とは別</text>
<rect x="20" y="330" width="360" height="70" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/><text x="32" y="352" font-size="14" font-weight="700" fill="#1a3a5c">遺伝的アルゴリズム</text><text x="32" y="372" font-size="13" fill="#222">求める：選択・交叉・突然変異で案を探す</text><text x="32" y="390" font-size="13" fill="#222">確かめる：目的関数・制約・終了条件</text>
<rect x="20" y="410" width="360" height="78" rx="8" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
<text x="200" y="436" font-size="13" font-weight="700" text-anchor="middle" fill="#1a3a5c">名前だけで採用しない</text>
<text x="200" y="458" font-size="13" text-anchor="middle" fill="#222">入力・評価方法・条件を変えたときの結果を確認</text>
</svg>
