<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="色分布図・断面図・等値面・ベクトル図の四つの表示方法について、分かることと注意点を並べた比較">
  <defs><style>
    text { font-family: Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif; font-size: 13px; fill: #1a3a5c; } /* ink */
    .h { font-size: 15px; font-weight: bold; }
    .s { font-size: 12px; fill: #555; } /* ink-body */
    .w { font-size: 13px; font-weight: bold; fill: #b22234; } /* danger */
    .n { fill: #e8f0fe; stroke: #2e6da4; } /* brand */
    .c { fill: #f5f5f5; stroke: #d7d7d7; } /* surface */
  </style></defs>
  <rect width="400" height="500" fill="#ffffff" />
  <rect class="n" x="20" y="20" width="112" height="95" rx="8" /><rect class="c" x="140" y="20" width="240" height="95" rx="8" />
  <text class="h" x="76" y="64" text-anchor="middle">色分布図</text><text class="s" x="76" y="86" text-anchor="middle">コンター</text>
  <text x="152" y="46">分かる：値の分布と大きい所</text><text x="152" y="72"><tspan class="w">注意：</tspan>色の上下限と刻みで</text><text x="152" y="94">印象が変わる</text>
  <rect class="n" x="20" y="130" width="112" height="95" rx="8" /><rect class="c" x="140" y="130" width="240" height="95" rx="8" />
  <text class="h" x="76" y="174" text-anchor="middle">断面図</text><text class="s" x="76" y="196" text-anchor="middle">内部を切って見る</text>
  <text x="152" y="156">分かる：内部の値と層ごとの差</text><text x="152" y="182"><tspan class="w">注意：</tspan>切る位置で最大値の</text><text x="152" y="204">見え方が変わる</text>
  <rect class="n" x="20" y="240" width="112" height="95" rx="8" /><rect class="c" x="140" y="240" width="240" height="95" rx="8" />
  <text class="h" x="76" y="284" text-anchor="middle">等値面</text><text class="s" x="76" y="306" text-anchor="middle">同じ値をつなぐ面</text>
  <text x="152" y="266">分かる：同じ値の範囲の立体形</text><text x="152" y="292"><tspan class="w">注意：</tspan>選んだ値の根拠を</text><text x="152" y="314">示す必要がある</text>
  <rect class="n" x="20" y="350" width="112" height="95" rx="8" /><rect class="c" x="140" y="350" width="240" height="95" rx="8" />
  <text class="h" x="76" y="394" text-anchor="middle">ベクトル図</text><text class="s" x="76" y="416" text-anchor="middle">矢印で表す</text>
  <text x="152" y="376">分かる：向きと大きさ</text><text x="152" y="402"><tspan class="w">注意：</tspan>矢印の倍率と間引きを</text><text x="152" y="424">明示する</text>
  <rect x="20" y="458" width="360" height="30" rx="8" fill="#fff3cd" stroke="#d4a017" /> <!-- warn -->
  <text x="200" y="478" text-anchor="middle" style="font-weight:bold">同じ数値でも、設定で見え方は変わる</text>
</svg>
