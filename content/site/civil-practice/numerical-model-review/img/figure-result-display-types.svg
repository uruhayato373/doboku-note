<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="色分布図・断面図・等値面・ベクトル図の四つの表示方法について、分かることと注意点を並べた比較">
  <defs><style>
    text { font-family: Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif; font-size: 13px; fill: #1a3a5c; } /* ink */
    .h { font-size: 15px; font-weight: bold; }
    .s { font-size: 12px; fill: #555; } /* ink-body */
    .w { font-size: 13px; font-weight: bold; fill: #b22234; } /* danger */
    .n { fill: #e8f0fe; stroke: #2e6da4; } /* brand */
    .c { fill: #f5f5f5; stroke: #d7d7d7; } /* surface */
  </style></defs>
  <rect width="400" height="500" fill="#ffffff" />
  <text class="s" x="20" y="28">同じ数値の分布を、色の上下限だけ変えて描くと</text>
  <rect x="20" y="40" width="28" height="20" fill="#f5f5f5" stroke="#d7d7d7"/><rect x="48" y="40" width="28" height="20" fill="#e8f0fe" stroke="#d7d7d7"/><rect x="76" y="40" width="28" height="20" fill="#2e6da4" stroke="#d7d7d7"/><rect x="104" y="40" width="28" height="20" fill="#1a3a5c" stroke="#d7d7d7"/><rect x="132" y="40" width="28" height="20" fill="#2e6da4" stroke="#d7d7d7"/><rect x="160" y="40" width="28" height="20" fill="#e8f0fe" stroke="#d7d7d7"/><rect x="20" y="60" width="28" height="20" fill="#e8f0fe" stroke="#d7d7d7"/><rect x="48" y="60" width="28" height="20" fill="#1a3a5c" stroke="#d7d7d7"/><rect x="76" y="60" width="28" height="20" fill="#1a3a5c" stroke="#d7d7d7"/><rect x="104" y="60" width="28" height="20" fill="#1a3a5c" stroke="#d7d7d7"/><rect x="132" y="60" width="28" height="20" fill="#1a3a5c" stroke="#d7d7d7"/><rect x="160" y="60" width="28" height="20" fill="#2e6da4" stroke="#d7d7d7"/><rect x="20" y="80" width="28" height="20" fill="#f5f5f5" stroke="#d7d7d7"/><rect x="48" y="80" width="28" height="20" fill="#2e6da4" stroke="#d7d7d7"/><rect x="76" y="80" width="28" height="20" fill="#1a3a5c" stroke="#d7d7d7"/><rect x="104" y="80" width="28" height="20" fill="#1a3a5c" stroke="#d7d7d7"/><rect x="132" y="80" width="28" height="20" fill="#1a3a5c" stroke="#d7d7d7"/><rect x="160" y="80" width="28" height="20" fill="#e8f0fe" stroke="#d7d7d7"/>
  <rect x="212" y="40" width="28" height="20" fill="#f5f5f5" stroke="#d7d7d7"/><rect x="240" y="40" width="28" height="20" fill="#f5f5f5" stroke="#d7d7d7"/><rect x="268" y="40" width="28" height="20" fill="#e8f0fe" stroke="#d7d7d7"/><rect x="296" y="40" width="28" height="20" fill="#e8f0fe" stroke="#d7d7d7"/><rect x="324" y="40" width="28" height="20" fill="#e8f0fe" stroke="#d7d7d7"/><rect x="352" y="40" width="28" height="20" fill="#f5f5f5" stroke="#d7d7d7"/><rect x="212" y="60" width="28" height="20" fill="#f5f5f5" stroke="#d7d7d7"/><rect x="240" y="60" width="28" height="20" fill="#e8f0fe" stroke="#d7d7d7"/><rect x="268" y="60" width="28" height="20" fill="#2e6da4" stroke="#d7d7d7"/><rect x="296" y="60" width="28" height="20" fill="#2e6da4" stroke="#d7d7d7"/><rect x="324" y="60" width="28" height="20" fill="#2e6da4" stroke="#d7d7d7"/><rect x="352" y="60" width="28" height="20" fill="#e8f0fe" stroke="#d7d7d7"/><rect x="212" y="80" width="28" height="20" fill="#f5f5f5" stroke="#d7d7d7"/><rect x="240" y="80" width="28" height="20" fill="#e8f0fe" stroke="#d7d7d7"/><rect x="268" y="80" width="28" height="20" fill="#2e6da4" stroke="#d7d7d7"/><rect x="296" y="80" width="28" height="20" fill="#1a3a5c" stroke="#d7d7d7"/><rect x="324" y="80" width="28" height="20" fill="#2e6da4" stroke="#d7d7d7"/><rect x="352" y="80" width="28" height="20" fill="#f5f5f5" stroke="#d7d7d7"/>
  <text class="s" x="104" y="116" text-anchor="middle">上下限を狭く設定</text><text class="s" x="296" y="116" text-anchor="middle">上下限を広く設定</text>
  <text class="s" x="200" y="136" text-anchor="middle">濃いほど値が大きい。同じ数値でも、印象が違う</text>
  <rect class="n" x="20" y="148" width="112" height="64" rx="8" /><rect class="c" x="140" y="148" width="240" height="64" rx="8" />
  <text class="h" x="76" y="178" text-anchor="middle">色分布図</text><text class="s" x="76" y="198" text-anchor="middle">コンター</text>
  <text x="152" y="168">分かる：値の分布と大きい所</text><text x="152" y="186"><tspan class="w">注意：</tspan>色の上下限と刻みで</text><text x="152" y="204">印象が変わる</text>
  <rect class="n" x="20" y="216" width="112" height="64" rx="8" /><rect class="c" x="140" y="216" width="240" height="64" rx="8" />
  <text class="h" x="76" y="246" text-anchor="middle">断面図</text><text class="s" x="76" y="266" text-anchor="middle">内部を切って見る</text>
  <text x="152" y="236">分かる：内部の値と層ごとの差</text><text x="152" y="254"><tspan class="w">注意：</tspan>切る位置で最大値の</text><text x="152" y="272">見え方が変わる</text>
  <rect class="n" x="20" y="284" width="112" height="64" rx="8" /><rect class="c" x="140" y="284" width="240" height="64" rx="8" />
  <text class="h" x="76" y="314" text-anchor="middle">等値面</text><text class="s" x="76" y="334" text-anchor="middle">同じ値をつなぐ面</text>
  <text x="152" y="304">分かる：同じ値の範囲の立体形</text><text x="152" y="322"><tspan class="w">注意：</tspan>選んだ値の根拠を</text><text x="152" y="340">示す必要がある</text>
  <rect class="n" x="20" y="352" width="112" height="64" rx="8" /><rect class="c" x="140" y="352" width="240" height="64" rx="8" />
  <text class="h" x="76" y="382" text-anchor="middle">ベクトル図</text><text class="s" x="76" y="402" text-anchor="middle">矢印で表す</text>
  <text x="152" y="372">分かる：向きと大きさ</text><text x="152" y="390"><tspan class="w">注意：</tspan>矢印の倍率と間引きを</text><text x="152" y="408">明示する</text>
  <rect x="20" y="424" width="360" height="64" rx="8" fill="#fff3cd" stroke="#d4a017" /> <!-- warn -->
  <text x="200" y="450" text-anchor="middle" style="font-weight:bold">同じ数値でも、設定で見え方は変わる</text>
  <text class="s" x="200" y="472" text-anchor="middle">複数のケースを比べるなら、上下限と刻みをそろえる</text>
</svg>
