      .s { font-size: 11px; fill: #555; }
      .card { fill: #fff; stroke: #d7d7d7; stroke-width: 1.5; }
      .sep { stroke: #d7d7d7; stroke-width: 1; fill: none; }
    </style>
  </defs>
  <rect class="card" x="10" y="8" width="380" height="424" rx="8"/>
  <rect x="118" y="16" width="82" height="40" rx="5" style="fill:#f8d7da;stroke:#b22234;stroke-width:1.5"/>
