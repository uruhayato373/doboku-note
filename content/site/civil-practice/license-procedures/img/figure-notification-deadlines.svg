  <path class="sep" d="M20,374H380"/>
  <circle cx="30" cy="392" r="7" style="fill:#555"/>
  <text class="s" x="44" y="396">その出来事の届出の期限</text>
  <circle cx="30" cy="414" r="6.5" style="fill:#fff;stroke:#555;stroke-width:2;stroke-dasharray:3 2"/>
  <text class="s" x="44" y="418">常勤役員等だった人の後任の届出は2週間</text>
  <text class="s" x="200" y="446" text-anchor="middle">根拠は法第11条・第12条、施行規則第7条の2・第8条</text>
  <text class="s" x="200" y="464" text-anchor="middle">運用は四国地方整備局の建設業許可の手引（令和7年12月版）</text>
