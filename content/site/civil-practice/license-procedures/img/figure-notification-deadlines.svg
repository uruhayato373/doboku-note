  <text class="n" x="335" y="33" text-anchor="middle">事業年度終了後</text>
  <text class="n" x="335" y="49" text-anchor="middle">4か月以内</text>
  <path class="sep" d="M20,64H380"/>
  <text class="n" x="22" y="92">役員の就任・退任</text>
  <text class="s" x="22" y="110">役員等の変更</text>
  <circle cx="243" cy="95" r="13" style="fill:#d4a017;stroke:#fff;stroke-width:2"/>
  <circle cx="159" cy="95" r="12" style="fill:#fff;stroke:#b22234;stroke-width:2.5;stroke-dasharray:4 2.5"/>
  <path class="sep" d="M20,126H380"/>
