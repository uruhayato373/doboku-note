  <circle cx="243" cy="219" r="13" style="fill:#d4a017;stroke:#fff;stroke-width:2"/>
  <path class="sep" d="M20,250H380"/>
  <text class="n" x="22" y="278">決算</text>
  <text class="s" x="22" y="296">決算変更届</text>
  <circle cx="335" cy="281" r="13" style="fill:#2e6da4;stroke:#fff;stroke-width:2"/>
  <path class="sep" d="M20,312H380"/>
  <text class="n" x="22" y="340">廃業</text>
