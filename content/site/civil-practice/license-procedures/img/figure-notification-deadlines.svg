<!-- authored 2026-10-16 doboku-note 自作。論点は建設業法第11条・第12条と施行規則第7条の2・第8条の届出の期限。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="届出の期限の早見表。役員の就任・退任は30日以内、ただし常勤役員等の後任は2週間以内。営業所技術者の交代は2週間以内。営業所の新設と廃業は30日以内。決算は事業年度終了後4か月以内。">
  <defs>
