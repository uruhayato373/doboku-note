<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="指針の要素を店社と作業所に振り分け、店社から下ろすもの、作業所から上げるもの、往復するもの、監査の周期を矢印で示した対応図" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
<defs><marker id="a" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker></defs>
<g fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"><rect x="20" y="44" width="160" height="62" rx="6"/><rect x="20" y="114" width="160" height="62" rx="6"/><rect x="20" y="184" width="160" height="62" rx="6"/><rect x="20" y="254" width="160" height="62" rx="6"/><rect x="20" y="324" width="160" height="62" rx="6"/><rect x="20" y="394" width="160" height="62" rx="6"/></g>
<g fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"><rect x="220" y="44" width="160" height="62" rx="6"/><rect x="220" y="114" width="160" height="62" rx="6"/><rect x="220" y="184" width="160" height="62" rx="6"/><rect x="220" y="254" width="160" height="62" rx="6"/><rect x="220" y="324" width="160" height="62" rx="6"/><rect x="220" y="394" width="160" height="62" rx="6"/></g>
<g fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#a)"><path d="M184 71H216"/><path d="M184 141H216"/><path d="M216 211H184"/><path d="M216 281H184"/><path d="M184 346H216"/><path d="M216 356H184"/><path d="M184 416H216"/><path d="M216 426H184"/></g>
<g font-size="14" font-weight="700" fill="#222" text-anchor="middle"><text x="100" y="32">店社（本店・支店）</text><text x="300" y="32">作業所（現場）</text></g>
<g font-size="12" font-weight="700" fill="#222"><text x="30" y="66">方針と手順を示す</text><text x="230" y="66">工事の目標・計画へ</text><text x="30" y="136">人材と予算を確保</text><text x="230" y="136">危険源の調査</text><text x="30" y="206">意見を計画に反映</text><text x="230" y="206">労働者の意見を聞く</text><text x="30" y="276">原因と傾向を分析</text><text x="230" y="276">実績と是正を記録</text><text x="30" y="346">判断基準と連絡網</text><text x="230" y="346">現場の想定と退避</text><text x="30" y="416">監査を計画して実施</text><text x="230" y="416">監査を受けて是正</text></g>
<g font-size="11" font-weight="400" fill="#1a3a5c"><text x="30" y="84">役割と権限を指名</text><text x="230" y="84">具体化して周知</text><text x="30" y="154">教育の枠組みを用意</text><text x="230" y="154">日常の点検・改善</text><text x="30" y="224">次期の目標を決める</text><text x="230" y="224">反映先を記録する</text><text x="30" y="294">手順や方針を直す</text><text x="230" y="294">災害の原因を調べる</text><text x="30" y="364">応援の手配</text><text x="230" y="364">止める判断</text><text x="30" y="434">結果から見直す</text><text x="230" y="434">仕組みの不備を伝える</text></g>
<g font-size="11" font-weight="400" fill="#555"><text x="30" y="99">第5・7・8条</text><text x="230" y="99">第11〜13条</text><text x="30" y="169">第7条</text><text x="230" y="169">第10・15条</text><text x="30" y="239">第6・11・12条</text><text x="230" y="239">第6条</text><text x="30" y="309">第16・18条</text><text x="230" y="309">第9・15・16条</text><text x="30" y="379">第14条</text><text x="230" y="379">第14条</text><text x="30" y="449">第17・18条</text><text x="230" y="449">第17条</text><text x="200" y="91" text-anchor="middle">下ろす</text><text x="200" y="161" text-anchor="middle">下ろす</text><text x="200" y="231" text-anchor="middle">上げる</text><text x="200" y="301" text-anchor="middle">上げる</text><text x="200" y="371" text-anchor="middle">往復</text><text x="200" y="441" text-anchor="middle">周期</text><text x="20" y="490">割り振りは各社が文書で決める。矢印は決定と情報の向き</text></g>
</svg>
