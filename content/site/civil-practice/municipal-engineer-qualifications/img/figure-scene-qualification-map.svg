  <text class="n" x="30" y="116" text-anchor="start">施工管理技士</text>
  <rect class="g" x="160" y="48" width="220" height="60" rx="6"/>
  <text class="s" x="170" y="64" text-anchor="start">条文が資格を求めるか</text>
