  <text class="s" x="30" y="365" text-anchor="start">資格</text>
  <text class="n" x="30" y="396" text-anchor="start">測量士・</text>
  <text class="n" x="30" y="416" text-anchor="start">測量士補</text>
  <rect class="p" x="160" y="348" width="220" height="60" rx="6"/>
