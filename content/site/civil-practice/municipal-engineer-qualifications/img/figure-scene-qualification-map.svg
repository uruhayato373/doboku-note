<!-- authored 2026-10-15 doboku-note 自作。論点は地方自治法第234条の2、技術士法第32条・第46条、測量法第48条・第49条と、各資格の確かめ先。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="仕事の場面ごとに、条文が資格を求めるかを示した図。工事の監督・検査は地方自治法第234条の2が資格を求めない。技術士は登録した部門を表示する（技術士法第46条）。公共測量は登録された測量士・測量士補が必要（測量法第48条）。">
  <defs>
