<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="同じ橋脚を三つの作り方で並べた図。ワイヤーフレームは線だけで体積は出せない。サーフェスは面だけで、面が閉じていなければ体積は定まらない。ソリッドは内部が詰まっていて体積が定まる。">
