  <path d="M338,46L338,102" stroke="#555" stroke-width="1.5" fill="none"/>
  <path d="M258,46L258,102" stroke="#555" stroke-width="1.5" fill="none"/>
  <path d="M258,102L338,102" stroke="#555" stroke-width="1.5" fill="none"/>
  <path d="M230,66L258,46" stroke="#555" stroke-width="1.5" fill="none"/>
  <path d="M310,66L338,46" stroke="#555" stroke-width="1.5" fill="none"/>
  <path d="M310,122L310,122" stroke="#555" stroke-width="1.5" fill="none"/>
  <path d="M230,122L258,102" stroke="#555" stroke-width="1.5" fill="none"/>
  <rect class="warn" x="24" y="122" width="150" height="28" rx="14"/>
  <text class="t12 b" x="99.0" y="140.0" text-anchor="middle">体積は出せない</text>
  <rect class="wh" x="10" y="174" width="380" height="152" rx="8"/>
  <text class="n" x="24" y="202">サーフェス</text>
  <text class="t12" x="24" y="224">面だけを持つ</text>
  <text class="t12" x="24" y="242">曲面の形や面積は読める</text>
  <polygon points="226,226 270,226 270,266 226,266" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
  <polygon points="226,226 270,226 286,212 242,212" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <polygon points="270,226 286,212 286,252 270,266" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
  <text class="m" x="248" y="284" text-anchor="middle">閉じている</text>
  <polygon points="316,226 360,226 360,266 316,266" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
  <polygon points="316,226 360,226 376,212 332,212" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <polygon points="360,226 376,212 376,252 360,266" fill="none" stroke="#b22234" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text class="m" x="342" y="284" text-anchor="middle">一面が欠ける</text>
  <rect class="warn" x="24" y="288" width="170" height="28" rx="14"/>
  <text class="t12 b" x="109.0" y="306.0" text-anchor="middle">欠けると体積は定まらない</text>
  <rect class="wh" x="10" y="338" width="380" height="152" rx="8"/>
  <text class="n" x="24" y="366">ソリッド</text>
  <text class="t12" x="24" y="388">内部が詰まっている</text>
  <text class="t12" x="24" y="406">体積を求められる</text>
  <polygon points="230,394 310,394 310,450 230,450" fill="#e8f0fe" stroke="#555" stroke-width="1.5"/>
  <polygon points="230,394 310,394 338,374 258,374" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <polygon points="310,394 338,374 338,430 310,450" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
  <rect class="pos" x="24" y="448" width="150" height="28" rx="14"/>
  <text class="t12 b" x="99.0" y="466.0" text-anchor="middle">体積が定まる</text>
</svg>
