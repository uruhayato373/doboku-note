<!-- authored 2026-10-16 doboku-note 自作。論点は寸法を読む図は投影面に正対させた平行投影にすること、斜めに見ると辺が縮んで見えること、透視投影は平行な辺が消失点へ寄っていくこと。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="同じ直方体の見え方の違い。投影面に正対させた平行投影は、辺が実長で表れて寸法を読める。斜めに見た平行投影は、奥行きの辺が縮んで見えるので寸法の根拠にしない。透視投影は遠い辺が小さく、平行な辺が消失点へ寄っていくので、画面上の長さを寸法にできない。">
  <defs>
  <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 11px; fill: #222; }
      .b { font-weight: bold; fill: #1a3a5c; }
      .m { fill: #555; }
      .t12 { font-size: 12px; }
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .pos { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .dng { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .sf { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .wh { fill: #fff; stroke: #2e6da4; stroke-width: 1.5; }
      .dash { fill: #fff; stroke: #555; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .grid { stroke: #d7d7d7; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .ax { stroke: #555; stroke-width: 1.5; fill: none; }
      .ar { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .ark { stroke: #555; stroke-width: 2; fill: none; }
  </style>
  <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  <marker id="ak" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  <marker id="as" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  <marker id="asg" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  </defs>
  <rect class="wh" x="10" y="8" width="380" height="152" rx="8"/>
  <text class="n" x="24" y="34">平行投影</text>
  <text class="m" x="24" y="52">（投影面に正対）</text>
  <text class="t12" x="24" y="76">平行な辺は平行なまま</text>
  <text class="t12" x="24" y="94">辺は実長で表れる</text>
  <rect x="200" y="30" width="110" height="74" fill="#e8f0fe" stroke="#555" stroke-width="1.5"/>
  <path d="M200,122H310" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#ak)"/><path d="M310,122H200" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#ak)"/><path d="M330,30V104" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#ak)"/><path d="M330,104V30" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#ak)"/>
  <text class="m" x="255" y="140" text-anchor="middle">実長</text>
  <text class="m" x="338" y="72">実長</text>
  <rect class="pos" x="24" y="120" width="150" height="28" rx="14"/>
  <text class="t12 b" x="99.0" y="138.0" text-anchor="middle">寸法を読める</text>
  <rect class="wh" x="10" y="168" width="380" height="152" rx="8"/>
  <text class="n" x="24" y="194">平行投影</text>
  <text class="m" x="24" y="212">（斜めに見る）</text>
  <text class="t12" x="24" y="236">斜め上から見るビュー</text>
  <text class="t12" x="24" y="254">奥行きの辺が縮んで見える</text>
  <polygon points="196,230 270,230 270,286 196,286" fill="#e8f0fe" stroke="#555" stroke-width="1.5"/>
  <polygon points="196,230 270,230 300,208 226,208" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <polygon points="270,230 300,208 300,264 270,286" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
  <text class="m" x="312" y="244">辺が縮んで</text>
  <text class="m" x="312" y="258">見える</text>
  <rect class="dng" x="24" y="280" width="170" height="28" rx="14"/>
  <text class="t12 b" x="109.0" y="298.0" text-anchor="middle">寸法の根拠にしない</text>
  <rect class="wh" x="10" y="328" width="380" height="152" rx="8"/>
  <text class="n" x="24" y="354">透視投影</text>
  <text class="t12" x="24" y="376">遠い辺は近い辺より小さい</text>
  <text class="t12" x="24" y="394">平行な辺は消失点へ寄る</text>
  <polygon points="200.0,359.0 263.0,359.0 301.5,355.5 270.0,355.5" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <polygon points="263.0,359.0 301.5,355.5 301.5,383.5 263.0,415.0" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
  <polygon points="200.0,359.0 263.0,359.0 263.0,415.0 200.0,415.0" fill="#e8f0fe" stroke="#555" stroke-width="1.5"/>
  <path d="M270.0,355.5L340.0,352.0M301.5,355.5L340.0,352.0M301.5,383.5L340.0,352.0" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 3" fill="none"/>
  <circle cx="340.0" cy="352.0" r="4" fill="#2e6da4"/>
  <text class="m" x="346.0" y="356.0">消失点</text>
  <rect class="dng" x="24" y="448" width="150" height="26" rx="13"/>
  <text class="t12 b" x="99.0" y="465.0" text-anchor="middle">寸法は読めない</text>
</svg>
