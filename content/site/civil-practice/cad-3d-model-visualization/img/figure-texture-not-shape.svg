  <rect x="324" y="56" width="22" height="100" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
  <text class="m" x="72" y="176" text-anchor="middle">凹凸なし</text>
  <text class="m" x="200" y="176" text-anchor="middle">石積みに見える</text>
  <text class="m" x="335" y="176" text-anchor="middle">平らなまま</text>
