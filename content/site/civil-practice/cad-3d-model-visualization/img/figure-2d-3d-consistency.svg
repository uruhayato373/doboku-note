<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="2次元図面と3次元モデルを整合させる三つの道。3次元モデルから図面を切り出す場合と、同じ入力から3次元形状と図面を同時に生成する場合は、根拠が確認できれば整合確認が不要。別々に作る場合は、外形線を重ねて一致を見る確認が必要。">
  <defs>
  <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 12px; fill: #555; }
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .s { font-size: 11px; fill: #555; }
      .k { font-size: 12px; fill: #222; }
      .p { fill: #fff; stroke: #d7d7d7; stroke-width: 1.5; }
      .bb { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .bp { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .bw { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .bd { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .bs { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .ln { stroke: #2e6da4; stroke-width: 1.5; fill: none; stroke-linejoin: round; }
      .hd { stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 4 3; fill: none; }
      .ar { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .gy { stroke: #555; stroke-width: 1.5; fill: none; }
  </style>
  <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  <marker id="ag" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  <marker id="ags" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  </defs>
  <rect class="p" x="10" y="10" width="380" height="140" rx="8"/>
  <text class="n" x="24" y="34">3次元モデルから、図面を切り出す</text>
  <rect class="bb" x="24" y="48" width="130" height="44" rx="6"/><text class="t" x="89" y="75" text-anchor="middle">3次元モデル</text>
  <path class="ar" d="M158,70H244" marker-end="url(#ah)"/><text class="s" x="201" y="62" text-anchor="middle">切り出し</text>
  <rect class="bb" x="248" y="48" width="130" height="44" rx="6"/><text class="t" x="313" y="75" text-anchor="middle">2次元図面</text>
  <rect class="bp" x="24" y="108" width="130" height="26" rx="13"/><text class="t" x="89" y="125" text-anchor="middle">整合確認は不要</text>
  <text class="s" x="168" y="125">根拠が確認できる場合</text>
  <rect class="p" x="10" y="160" width="380" height="170" rx="8"/>
  <text class="n" x="24" y="184">同じ入力から、同時に生成する</text>
  <rect class="bb" x="24" y="206" width="130" height="56" rx="6"/><text class="t" x="89" y="231" text-anchor="middle">同一の入力情報</text><text class="s" x="89" y="249" text-anchor="middle">同一ソフトウェア</text>
  <path class="ar" d="M158,226L244,212" marker-end="url(#ah)"/>
  <path class="ar" d="M158,242L244,256" marker-end="url(#ah)"/>
  <rect class="bb" x="248" y="196" width="130" height="34" rx="6"/><text class="t" x="313" y="218" text-anchor="middle">3次元形状</text>
  <rect class="bb" x="248" y="240" width="130" height="34" rx="6"/><text class="t" x="313" y="262" text-anchor="middle">2次元図面</text>
  <text class="s" x="168" y="206">自動生成</text>
  <rect class="bp" x="24" y="288" width="130" height="26" rx="13"/><text class="t" x="89" y="305" text-anchor="middle">整合確認は不要</text>
  <text class="s" x="168" y="305">根拠が確認できる場合</text>
  <rect class="p" x="10" y="340" width="380" height="150" rx="8"/>
  <text class="n" x="24" y="364">別々に作る</text>
  <rect class="bb" x="24" y="380" width="110" height="40" rx="6"/><text class="t" x="79" y="405" text-anchor="middle">2次元図面</text>
  <path class="ar" d="M138,400H264" marker-end="url(#ah)"/><text class="s" x="201" y="392" text-anchor="middle">外形線を取り込む</text>
  <rect class="bb" x="268" y="380" width="110" height="40" rx="6"/><text class="t" x="323" y="405" text-anchor="middle">3次元モデル</text>
  <path d="M79,424V442H323V424" class="hd"/>
  <text class="s" x="201" y="436" text-anchor="middle" style="fill:#555">外形線を重ねて、一致を見る</text>
  <rect class="bw" x="24" y="454" width="130" height="26" rx="13"/><text class="t" x="89" y="471" text-anchor="middle">整合確認が必要</text>
  <text class="s" x="168" y="471">一致しなければ、モデルを直す</text>

</svg>
