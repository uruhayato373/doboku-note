<!-- authored 2026-11-05 doboku-note 自作。論点は道路構造令第11条（歩道の幅員と路上施設の加算）と第12条（建築限界の高さ）。模式図で縮尺は示さない。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="道路の横断面の模式図。中央に車道、その両側に路肩、さらに外側に歩道が並ぶ。車道の上には建築限界の空間があり、高さは4.5メートル。橋桁、標識、信号機、電線、街路樹の枝はこの空間に入れられない。歩道の幅員は歩行者が多い道路で3.5メートル以上、その他は2メートル以上で、路上施設を置くとその分を加える。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 12px; fill: #555; }  /* ink-body */
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .b { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .k { fill: #222; }  /* ink-strong */
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }  /* brand-fill / brand */
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }  /* warn-fill / warn */
      .pos { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }  /* positive-fill / positive */
      .sur { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }  /* surface */
      .ln { stroke: #2e6da4; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#2e6da4"/>
    </marker>
  </defs>
  <rect fill="#ffffff" stroke="#2e6da4" stroke-width="1.5" stroke-dasharray="6 4" x="115" y="20" width="170" height="270"/>
  <text class="n" x="200" y="46" text-anchor="middle">建築限界</text>
  <text class="k" x="200" y="74" text-anchor="middle">橋桁・標識・</text>
  <text class="k" x="200" y="92" text-anchor="middle">信号機・電線・</text>
  <text class="k" x="200" y="110" text-anchor="middle">街路樹の枝は</text>
  <text class="k" x="200" y="128" text-anchor="middle">入れられない</text>

  <line class="ln" x1="100" y1="155" x2="100" y2="24" marker-end="url(#arrow)"/>
  <line class="ln" x1="100" y1="155" x2="100" y2="286" marker-end="url(#arrow)"/>
  <text class="b" x="92" y="148" text-anchor="end">高さ</text>
  <text class="b" x="92" y="168" text-anchor="end">4.5m</text>

  <rect class="pos" x="15" y="268" width="70" height="32"/>
  <rect class="sur" x="85" y="290" width="30" height="10"/>
  <rect fill="#d7d7d7" stroke="#8a8a8a" stroke-width="1.5" x="115" y="290" width="170" height="10"/>
  <rect class="sur" x="285" y="290" width="30" height="10"/>
  <rect class="pos" x="315" y="268" width="70" height="32"/>

  <text class="b" x="50" y="322" text-anchor="middle">歩道</text>
  <text class="k" x="100" y="322" text-anchor="middle">路肩</text>
  <text class="b" x="200" y="322" text-anchor="middle">車道</text>
  <text class="k" x="300" y="322" text-anchor="middle">路肩</text>
  <text class="b" x="350" y="322" text-anchor="middle">歩道</text>

  <rect class="brand" x="10" y="342" width="380" height="82" rx="8"/>
  <text class="n" x="24" y="366">歩道の幅員（第11条）</text>
  <text class="k" x="24" y="388">歩行者が多い道路は3.5m以上、その他は2m以上</text>
  <text class="k" x="24" y="408">路上施設を置くとその分を加える</text>

  <rect class="warn" x="10" y="434" width="380" height="54" rx="8"/>
  <text class="n" x="24" y="456">建築限界（第12条）</text>
  <text class="k" x="24" y="476">普通道路の車道で高さ4.5m（重要物流道路は4.8m）</text>
</svg>
