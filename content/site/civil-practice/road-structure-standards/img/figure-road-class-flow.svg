<!-- authored 2026-11-05 doboku-note 自作。論点は道路構造令第3条（地域と自動車専用かによる第1種〜第4種の区分、計画交通量による級、級を一つ下げる扱い）。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="道路構造令第3条の区分の流れ図。まず自動車専用かを見る。高速自動車国道と自動車専用道路は地方部が第1種、都市部が第2種。その他の道路は地方部が第3種、都市部が第4種。市道の大半はその他の道路で第3種か第4種。次に計画交通量で級を決め、やむを得ないときは一つ下の級にできる。ただし第3種第5級と第4種第4級は対象外。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 12px; fill: #555; }  /* ink-body */
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .b { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .k { fill: #222; }  /* ink-strong */
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }  /* brand-fill / brand */
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }  /* warn-fill / warn */
      .pos { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }  /* positive-fill / positive */
      .sur { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }  /* surface */
      .ln { stroke: #2e6da4; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#2e6da4"/>
    </marker>
  </defs>
  <rect class="brand" x="100" y="10" width="200" height="40" rx="6"/>
  <text class="n" x="200" y="35" text-anchor="middle">道路は自動車専用か</text>

  <line class="ln" x1="150" y1="50" x2="104" y2="84" marker-end="url(#arrow)"/>
  <line class="ln" x1="250" y1="50" x2="296" y2="84" marker-end="url(#arrow)"/>

  <rect class="sur" x="10" y="88" width="185" height="62" rx="6"/>
  <text class="b" x="102" y="112" text-anchor="middle">高速自動車国道</text>
  <text class="b" x="102" y="132" text-anchor="middle">自動車専用道路</text>
  <rect class="warn" x="205" y="88" width="185" height="62" rx="6"/>
  <text class="b" x="298" y="112" text-anchor="middle">その他の道路</text>
  <text class="k" x="298" y="132" text-anchor="middle">市道の大半はこちら</text>

  <line class="ln" x1="102" y1="150" x2="102" y2="168" marker-end="url(#arrow)"/>
  <line class="ln" x1="298" y1="150" x2="298" y2="168" marker-end="url(#arrow)"/>

  <rect class="brand" x="10" y="172" width="185" height="40" rx="6"/>
  <text class="k" x="102" y="197" text-anchor="middle">地方部 → 第1種</text>
  <rect class="brand" x="10" y="220" width="185" height="40" rx="6"/>
  <text class="k" x="102" y="245" text-anchor="middle">都市部 → 第2種</text>
  <rect class="pos" x="205" y="172" width="185" height="40" rx="6"/>
  <text class="b" x="298" y="197" text-anchor="middle">地方部 → 第3種</text>
  <rect class="pos" x="205" y="220" width="185" height="40" rx="6"/>
  <text class="b" x="298" y="245" text-anchor="middle">都市部 → 第4種</text>

  <line class="ln" x1="200" y1="266" x2="200" y2="290" marker-end="url(#arrow)"/>

  <rect class="brand" x="10" y="294" width="380" height="82" rx="8"/>
  <text class="n" x="24" y="320">次に級を決める</text>
  <text class="k" x="24" y="344">市町村道は計画交通量で決める</text>
  <text class="k" x="24" y="364">やむを得ないときは一つ下の級にできる</text>

  <rect class="warn" x="10" y="392" width="380" height="94" rx="8"/>
  <text class="n" x="24" y="418">級を下げられない区分</text>
  <text class="k" x="24" y="442">第3種第5級と第4種第4級は、</text>
  <text class="k" x="24" y="462">これ以上下がないので対象外</text>
</svg>
