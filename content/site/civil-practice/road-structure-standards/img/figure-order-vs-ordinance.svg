<!-- authored 2026-11-05 doboku-note 自作。論点は道路法第30条第1項〜第3項と道路構造令第1条（国道は政令、県道・市町村道は三つだけ政令で残りは条例）。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="国道と市町村道で、基準を決める主体を並べた図。国道は幅員、線形、勾配、排水、待避所など13の事項をすべて政令が決める。県道と市町村道は、通行する自動車の種類、建築限界、橋などの自動車荷重に対する強度の三つだけを政令が決め、残りは管理者の条例が構造令を参酌して決める。市の道路では最初に自市の道路構造条例を開く。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 12px; fill: #555; }  /* ink-body */
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .b { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .k { fill: #222; }  /* ink-strong */
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }  /* brand-fill / brand */
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }  /* warn-fill / warn */
      .pos { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }  /* positive-fill / positive */
      .sur { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }  /* surface */
      .ln { stroke: #2e6da4; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#2e6da4"/>
    </marker>
  </defs>
  <rect class="brand" x="10" y="12" width="380" height="104" rx="8"/>
  <text class="n" x="24" y="38">国道（高速自動車国道を含む）</text>
  <text class="k" x="24" y="62">幅員・線形・勾配・排水・待避所など</text>
  <text class="k" x="24" y="80">13の事項を、すべて</text>
  <text class="b" x="24" y="102">政令（道路構造令）が決める</text>

  <rect class="sur" x="10" y="132" width="380" height="226" rx="8"/>
  <text class="n" x="24" y="158">県道・市町村道</text>

  <rect class="warn" x="22" y="172" width="170" height="172" rx="6"/>
  <text class="b" x="34" y="196">政令が決める三つ</text>
  <text class="k" x="34" y="224">・通行する自動車</text>
  <text class="k" x="34" y="242">　の種類</text>
  <text class="k" x="34" y="268">・建築限界</text>
  <text class="k" x="34" y="294">・橋などの自動車荷</text>
  <text class="k" x="34" y="312">　重に対する強度</text>

  <rect class="pos" x="208" y="172" width="170" height="172" rx="6"/>
  <text class="b" x="220" y="196">管理者の条例が決める</text>
  <text class="k" x="220" y="228">残りのすべての事項</text>
  <text class="k" x="220" y="262">構造令を参酌して</text>
  <text class="k" x="220" y="280">定める</text>
  <text class="k" x="220" y="312">値は市ごとに違いうる</text>

  <line class="ln" x1="200" y1="358" x2="200" y2="386" marker-end="url(#arrow)"/>
  <rect class="brand" x="10" y="390" width="380" height="96" rx="8"/>
  <text class="n" x="200" y="424" text-anchor="middle">市の道路を設計するとき</text>
  <text class="b" x="200" y="452" text-anchor="middle">最初に開くのは自市の道路構造条例</text>
  <text class="k" x="200" y="472" text-anchor="middle">構造令は条例を読み解く手がかり</text>
</svg>
