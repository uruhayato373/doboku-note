<!-- authored 2026-10-15 doboku-note 自作。論点は環境影響評価法第38条、騒音規制法・振動規制法第14条、建設リサイクル法第10条・第11条。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="公共工事の計画から完了まで、環境アセス、騒音・振動、建設副産物の3本の帯で発注者が決めることを並べた図。計画で環境アセスの対象かを確かめ、設計で規制地域と機械、発生を抑える工法を決め、積算で低騒音型の扱いと再資源化費用を見込む。特記仕様書で評価書の措置と副産物の条件を書き、契約では着工まで7日を確保する。着工前は騒音・振動を施工者が7日前に届け出、建設リサイクル法は発注者が通知する。完了で措置の記録と再資源化等の報告を受ける。">
