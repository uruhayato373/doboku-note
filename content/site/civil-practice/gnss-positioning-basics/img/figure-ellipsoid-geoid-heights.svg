<text x="52" y="446"><tspan class="b">h</tspan>　楕円体高　受信機が出す高さ</text>
<rect x="32" y="455" width="12" height="12" fill="#fff3cd" stroke="#d4a017"/>
<text x="52" y="465"><tspan class="b">N</tspan>　ジオイド高　地理院のモデルで求める</text>
<rect x="32" y="474" width="12" height="12" fill="#d0e8d0" stroke="#3a7d44"/>
<text x="52" y="484"><tspan class="b">H</tspan>　標高　図面と同じ基準　H = h − N</text>
