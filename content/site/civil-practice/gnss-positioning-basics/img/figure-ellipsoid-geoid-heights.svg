<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="地表、ジオイド、準拠楕円体の位置関係。GNSSアンテナの位置で、楕円体高hはジオイド高Nと標高Hの和になる">
<style>
text{font-family:Inter,'Noto Sans JP','Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif;font-size:13px;fill:#1a3a5c}
.s{font-size:11px;fill:#555}
.b{font-size:15px;font-weight:bold}
.d{stroke-width:3;fill:none}
.t{stroke-width:1.5;fill:none}
</style>
<rect width="400" height="500" fill="#fff"/>
<path d="M20 236C80 226 130 196 190 160C250 126 320 118 380 146L380 262C200 268 120 285 20 290Z" fill="#f5f5f5" stroke="none"/>
<path d="M20 236C80 226 130 196 190 160C250 126 320 118 380 146" fill="none" stroke="#555" stroke-width="2"/>
<path d="M20 290C120 285 200 268 380 262" fill="none" stroke="#3a7d44" stroke-width="2"/>
<path d="M20 392C140 384 260 372 380 356" fill="none" stroke="#2e6da4" stroke-width="2" stroke-dasharray="6 4"/>
<text x="24" y="224" class="s">地表</text>
<text x="24" y="278" class="s" style="fill:#3a7d44;font-weight:bold">ジオイド</text>
<text x="24" y="414" class="s" style="fill:#2e6da4;font-weight:bold">準拠楕円体</text>
<line x1="250" y1="117.69999999999999" x2="250" y2="135.7" stroke="#222" stroke-width="2"/>
<circle cx="250" cy="113.69999999999999" r="5" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<text x="250" y="99.69999999999999" text-anchor="middle">GNSSアンテナ</text>
<path d="M250 135.7V371.8" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="250" y1="135.7" x2="250" y2="269.1" class="d" stroke="#3a7d44"/>
<line x1="250" y1="269.1" x2="250" y2="371.8" class="d" stroke="#d4a017"/>
<path d="M258 135.7H318M258 371.8H318" class="t" stroke="#8a8a8a" stroke-dasharray="3 3"/>
<line x1="318" y1="135.7" x2="318" y2="371.8" class="d" stroke="#2e6da4"/>
<text x="260" y="207.4" class="b">H</text>
<text x="260" y="325.5" class="b">N</text>
<text x="330" y="216" class="b">h</text>
