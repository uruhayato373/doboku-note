<!-- authored 2026-10-15 doboku-note 自作。減歩の考え方は土地区画整理法の説明（国土交通省）による。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="土地区画整理の前後を並べた模式図。従前の宅地のまま並ぶ区画から、地権者が土地を少しずつ出し合う減歩によって、道路や公園などの公共用地と、売却して事業費に充てる保留地が生まれ、残りが宅地になる。">
