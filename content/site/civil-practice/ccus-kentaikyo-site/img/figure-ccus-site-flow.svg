<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="CCUSの現場運用の流れ。技能者、元請、下請の三つの列に分けて、技能者が登録してカードを受け取り、元請が現場と契約情報を登録し、下請が施工体制と技能者の立場を登録し、入場のたびにカードをタッチする。蓄積した履歴は能力評価、社会保険の加入確認、建退共の掛金充当に使われる" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker></defs>
<rect width="400" height="500" fill="#ffffff"/>
<rect x="14" y="10" width="118" height="28" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<text x="73" y="29" font-size="13" font-weight="700" fill="#1a3a5c" text-anchor="middle">技能者</text>
<rect x="14" y="44" width="118" height="296" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
<rect x="141" y="10" width="118" height="28" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<text x="200" y="29" font-size="13" font-weight="700" fill="#1a3a5c" text-anchor="middle">元請</text>
<rect x="141" y="44" width="118" height="296" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
<rect x="268" y="10" width="118" height="28" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<text x="327" y="29" font-size="13" font-weight="700" fill="#1a3a5c" text-anchor="middle">下請</text>
<rect x="268" y="44" width="118" height="296" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
<rect x="20" y="54" width="106" height="60" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<text x="73" y="80" font-size="12" font-weight="700" fill="#222" text-anchor="middle">登録し、カードを</text>
<text x="73" y="97" font-size="12" font-weight="700" fill="#222" text-anchor="middle">受け取る</text>
<rect x="147" y="130" width="106" height="60" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<text x="200" y="156" font-size="12" font-weight="700" fill="#222" text-anchor="middle">現場と契約を登録</text>
<text x="200" y="173" font-size="12" font-weight="700" fill="#222" text-anchor="middle">読取機を置く</text>
<rect x="274" y="206" width="106" height="60" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<text x="327" y="232" font-size="12" font-weight="700" fill="#222" text-anchor="middle">技能者の職種と</text>
<text x="327" y="249" font-size="12" font-weight="700" fill="#222" text-anchor="middle">立場を登録</text>
<rect x="20" y="282" width="106" height="60" rx="6" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
<text x="73" y="308" font-size="12" font-weight="700" fill="#222" text-anchor="middle">入場のたびに</text>
<text x="73" y="325" font-size="12" font-weight="700" fill="#222" text-anchor="middle">カードをタッチ</text>
<g stroke="#2e6da4" stroke-width="1.5" fill="none">
<path d="M126,84 H200 V128" marker-end="url(#ar)"/>
<path d="M253,160 H327 V204" marker-end="url(#ar)"/>
<path d="M327,266 V274 H73 V280" marker-end="url(#ar)"/>
</g>
<rect x="14" y="352" width="372" height="48" rx="8" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
<text x="26" y="374" font-size="12" font-weight="700" fill="#1a3a5c">立場（職長・班長）の入力が、後の評価に効く</text>
<text x="26" y="391" font-size="11" fill="#555">作業員名簿は、元請や上位の下請が代理登録できる</text>
<rect x="14" y="410" width="372" height="52" rx="8" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
<text x="26" y="432" font-size="12" font-weight="700" fill="#1a3a5c">蓄積した履歴の使い道</text>
<text x="26" y="451" font-size="11" fill="#555">能力評価、社会保険の加入確認、建退共の掛金充当</text>
<text x="20" y="484" font-size="11" fill="#555">技能者の登録料は簡略型2,500円・詳細型4,900円（税込）</text>
</svg>
