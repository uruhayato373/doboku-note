<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="公共工事の建退共の手続きを、契約時、施工中、完成時の三段と、元請、下請、発注者の三列で見せた図。契約時は下請が加入労働者数報告書を出し、元請が購入額を算定して掛金収納書を出す。施工中は元請が現場標識を掲げ、下請が毎月就労状況を報告する。完成時は元請が納付日数と購入日数を比べ、発注者が総括表で確かめる" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker></defs>
<rect width="400" height="500" fill="#ffffff"/>
<rect x="70" y="10" width="100" height="28" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<text x="120" y="29" font-size="13" font-weight="700" fill="#1a3a5c" text-anchor="middle">元請</text>
<rect x="178" y="10" width="100" height="28" rx="6" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
<text x="228" y="29" font-size="13" font-weight="700" fill="#1a3a5c" text-anchor="middle">下請</text>
<rect x="286" y="10" width="100" height="28" rx="6" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
<text x="336" y="29" font-size="13" font-weight="700" fill="#1a3a5c" text-anchor="middle">発注者</text>
<text x="14" y="98" font-size="12" font-weight="700" fill="#1a3a5c">契約時</text>
<rect x="70" y="48" width="100" height="88" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<text x="120" y="78" font-size="12" fill="#222" text-anchor="middle">購入額を算定</text>
<text x="120" y="96" font-size="12" fill="#222" text-anchor="middle">し、掛金収納</text>
<text x="120" y="114" font-size="12" fill="#222" text-anchor="middle">書を出す</text>
<rect x="178" y="48" width="100" height="88" rx="8" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
<text x="228" y="78" font-size="12" fill="#222" text-anchor="middle">加入労働者数</text>
<text x="228" y="96" font-size="12" fill="#222" text-anchor="middle">報告書を元請</text>
<text x="228" y="114" font-size="12" fill="#222" text-anchor="middle">へ出す</text>
<rect x="286" y="48" width="100" height="88" rx="8" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
<text x="336" y="87" font-size="12" fill="#222" text-anchor="middle">掛金収納書</text>
<text x="336" y="105" font-size="12" fill="#222" text-anchor="middle">を受ける</text>
<text x="14" y="194" font-size="12" font-weight="700" fill="#1a3a5c">施工中</text>
<rect x="70" y="144" width="100" height="88" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<text x="120" y="174" font-size="12" fill="#222" text-anchor="middle">現場標識を</text>
<text x="120" y="192" font-size="12" fill="#222" text-anchor="middle">掲げ、下請の報告</text>
<text x="120" y="210" font-size="12" fill="#222" text-anchor="middle">と自社分で充当</text>
<rect x="178" y="144" width="100" height="88" rx="8" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
<text x="228" y="174" font-size="12" fill="#222" text-anchor="middle">毎月、就労</text>
<text x="228" y="192" font-size="12" fill="#222" text-anchor="middle">状況を元請に</text>
<text x="228" y="210" font-size="12" fill="#222" text-anchor="middle">報告</text>
<rect x="286" y="144" width="100" height="88" rx="8" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
<text x="336" y="194" font-size="13" fill="#8a8a8a" text-anchor="middle">—</text>
<text x="14" y="290" font-size="12" font-weight="700" fill="#1a3a5c">完成時</text>
<rect x="70" y="240" width="100" height="88" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<text x="120" y="261" font-size="12" fill="#222" text-anchor="middle">納付と購入の</text>
<text x="120" y="279" font-size="12" fill="#222" text-anchor="middle">日数を比べ、</text>
<text x="120" y="297" font-size="12" fill="#222" text-anchor="middle">足りなければ</text>
<text x="120" y="315" font-size="12" fill="#222" text-anchor="middle">追加で納める</text>
<rect x="178" y="240" width="100" height="88" rx="8" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
<text x="228" y="290" font-size="13" fill="#8a8a8a" text-anchor="middle">—</text>
<rect x="286" y="240" width="100" height="88" rx="8" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
<text x="336" y="270" font-size="12" fill="#222" text-anchor="middle">総括表で</text>
<text x="336" y="288" font-size="12" fill="#222" text-anchor="middle">納付と購入</text>
<text x="336" y="306" font-size="12" fill="#222" text-anchor="middle">を確かめる</text>
<rect x="14" y="344" width="372" height="64" rx="8" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
<text x="26" y="368" font-size="13" font-weight="700" fill="#1a3a5c">掛金収納書の期限</text>
<text x="26" y="390" font-size="12" fill="#222">電子ポイントは契約から40日以内、証紙は1か月以内</text>
<rect x="14" y="420" width="372" height="44" rx="8" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
<text x="26" y="447" font-size="12" font-weight="700" fill="#222">元請は、書類を1年間保存する</text>
</svg>
