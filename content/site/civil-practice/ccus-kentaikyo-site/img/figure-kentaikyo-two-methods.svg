<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="建退共の掛金納付の二つの方式の比較。証紙貼付方式は証紙を買い、手帳に貼って消印し、受払簿に記録する。電子ポイント方式はポイントを買い、月に一度就労日数を入力し、掛金充当書で確認する。どちらの方式でも掛金日額は320円で、公共工事では元請がまとめて購入する" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker></defs>
<rect width="400" height="500" fill="#ffffff"/>
<text x="18" y="30" font-size="13" font-weight="700" fill="#222">証紙貼付方式</text>
<text x="210" y="30" font-size="13" font-weight="700" fill="#222">電子ポイント方式</text>
<rect x="18" y="44" width="172" height="84" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<text x="28" y="70" font-size="13" font-weight="700" fill="#222">証紙を買う</text>
<text x="28" y="94" font-size="12" fill="#555">金融機関の窓口で、</text>
<text x="28" y="112" font-size="12" fill="#555">契約者証の原本を示す</text>
<rect x="210" y="44" width="172" height="84" rx="8" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
<text x="220" y="70" font-size="13" font-weight="700" fill="#222">ポイントを買う</text>
<text x="220" y="94" font-size="12" fill="#555">ペイジーか口座振替</text>
<text x="220" y="112" font-size="12" fill="#555">3,000円分から10円単位</text>
<line x1="104" y1="128" x2="104" y2="146" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="296" y1="128" x2="296" y2="146" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="18" y="148" width="172" height="84" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<text x="28" y="174" font-size="13" font-weight="700" fill="#222">手帳に貼って消印</text>
<text x="28" y="198" font-size="12" fill="#555">賃金を払う都度、</text>
<text x="28" y="216" font-size="12" fill="#555">少なくとも月1回</text>
<rect x="210" y="148" width="172" height="84" rx="8" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
<text x="220" y="174" font-size="13" font-weight="700" fill="#222">就労日数を入力</text>
<text x="220" y="198" font-size="12" fill="#555">月に1回、被共済者</text>
<text x="220" y="216" font-size="12" fill="#555">ごとの日数を報告</text>
<line x1="104" y1="232" x2="104" y2="250" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="296" y1="232" x2="296" y2="250" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="18" y="252" width="172" height="84" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<text x="28" y="278" font-size="13" font-weight="700" fill="#222">受払簿に記録</text>
<text x="28" y="302" font-size="12" fill="#555">購入・下請へ渡した・</text>
<text x="28" y="320" font-size="12" fill="#555">貼った枚数を合わせる</text>
<rect x="210" y="252" width="172" height="84" rx="8" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
<text x="220" y="278" font-size="13" font-weight="700" fill="#222">掛金充当書で確認</text>
<text x="220" y="302" font-size="12" fill="#555">翌月末日までに充当し、</text>
<text x="220" y="320" font-size="12" fill="#555">申請との相違を確かめる</text>
<rect x="18" y="368" width="364" height="100" rx="8" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
<text x="30" y="396" font-size="13" font-weight="700" fill="#222">どちらの方式でも</text>
<text x="30" y="422" font-size="12" fill="#222">掛金日額は320円</text>
<text x="30" y="446" font-size="12" fill="#222">公共工事では、元請が下請の分もまとめて購入</text>
</svg>
