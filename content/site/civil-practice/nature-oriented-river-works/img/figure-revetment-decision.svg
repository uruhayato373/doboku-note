<!-- authored 2026-10-16 doboku-note 自作。論点は「中小河川に関する河道計画の技術基準について」（平成22年8月9日）の護岸を設置しない場所の条件と、設置する場合の環境上の機能。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="護岸の要否の判定の流れ図。設計の前に七つの条件のいずれかに当たるかを見る。当たれば護岸を設置しないことを原則に検討する。当たらず河岸防護が必要なときだけ護岸の設計に入り、のり肩・水際の植生、空隙、根固めの天端高を確かめる。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 12px; fill: #555; }
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .x { font-size: 12px; fill: #222; }
      .s { font-size: 11px; fill: #555; }
      .sb { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .p { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .d { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .g { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .wh { fill: #fff; stroke: #8a8a8a; stroke-width: 1.5; }
      .dz { fill: #fff; stroke: #2e6da4; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .l { stroke: #d7d7d7; stroke-width: 1; fill: none; }
      .ln { stroke: #8a8a8a; stroke-width: 1; fill: none; }
      .ld { stroke: #8a8a8a; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
      .a { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .ar { stroke: #b22234; stroke-width: 2; fill: none; }
      .ag { stroke: #3a7d44; stroke-width: 2; fill: none; }
      .ax { stroke: #8a8a8a; stroke-width: 2; fill: none; }
    </style>
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
    <marker id="ahr" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#b22234"/></marker>
    <marker id="ahg" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#3a7d44"/></marker>
    <marker id="ahk" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#8a8a8a"/></marker>
  </defs>
  <rect class="b" x="10" y="8" width="380" height="34" rx="8"/>
  <text class="t" x="200.0" y="29.0" text-anchor="middle">設計の前に、護岸の要否を判定する</text>
  <path class="a" d="M200,42V54" marker-end="url(#ah)"/>
  <rect class="g" x="10" y="56" width="380" height="200" rx="8"/>
  <text class="t" x="20" y="76" text-anchor="start">次のいずれかに当たるか</text>
  <text class="x" x="20" y="98" text-anchor="start" style="font-size:11.5px">1　周辺の土地利用から、河岸を防御する必要性が低い</text>
  <text class="x" x="20" y="119" text-anchor="start" style="font-size:11.5px">2　自然河岸で、侵食が大きく進んだ様子がない</text>
  <text class="x" x="20" y="140" text-anchor="start" style="font-size:11.5px">3　岩河岸など、侵食が急激に進む恐れがない</text>
  <text class="x" x="20" y="161" text-anchor="start" style="font-size:11.5px">4　川幅が局所的に広がって死水域になる</text>
  <text class="x" x="20" y="182" text-anchor="start" style="font-size:11.5px">5　洪水でも変わらない寄州が河岸を覆っている</text>
  <text class="x" x="20" y="203" text-anchor="start" style="font-size:11.5px">6　改修後の代表流速が毎秒1.8メートル以下※</text>
  <text class="x" x="20" y="224" text-anchor="start" style="font-size:11.5px">7　水制など、護岸以外の方法のほうがよい</text>
  <text class="s" x="20" y="246" text-anchor="start">※河岸が防御機能のある石礫で覆われていない箇所を除く</text>
  <path class="a" d="M100,256V274" marker-end="url(#ah)"/>
  <path class="a" d="M300,256V274" marker-end="url(#ah)"/>
  <text class="sb" x="108" y="270" text-anchor="start">当たる</text>
  <text class="sb" x="308" y="270" text-anchor="start">当たらない</text>
  <rect class="p" x="10" y="276" width="180" height="60" rx="8"/>
  <text class="t" x="100.0" y="301.5" text-anchor="middle">護岸を設置しないことを</text>
  <text class="t" x="100.0" y="318.5" text-anchor="middle">原則に検討する</text>
  <rect class="w" x="210" y="276" width="180" height="60" rx="8"/>
  <text class="t" x="300.0" y="293.0" text-anchor="middle">河岸防護が必要なときだけ</text>
  <text class="t" x="300.0" y="310.0" text-anchor="middle">護岸の設計に入る</text>
  <text class="s" x="300.0" y="327.0" text-anchor="middle">（既設の改修も同じ判断）</text>
  <path class="a" d="M300,336V354" marker-end="url(#ah)"/>
  <rect class="wh" x="210" y="356" width="180" height="128" rx="8"/>
  <text class="t" x="220" y="378" text-anchor="start">設ける場合に確かめる点</text>
  <text class="s" x="220" y="400" text-anchor="start">のり肩・水際に植生</text>
  <text class="s" x="220" y="417" text-anchor="start">空隙と透水性・保水性</text>
  <text class="s" x="220" y="434" text-anchor="start">根固めはできるだけ</text>
  <text class="s" x="220" y="451" text-anchor="start">露出しない天端高</text>
  <rect class="d" x="10" y="356" width="190" height="128" rx="8"/>
  <text class="t" x="105.0" y="386.0" text-anchor="middle">完成直後の見た目で</text>
  <text class="t" x="105.0" y="405.0" text-anchor="middle">成果を判定しない</text>
  <text class="s" x="105.0" y="424.0" text-anchor="middle">植生が育つ前は、</text>
  <text class="s" x="105.0" y="443.0" text-anchor="middle">コンクリートが目立つ</text>
  <text class="s" x="105.0" y="462.0" text-anchor="middle">のが普通</text>
</svg>
