<!-- authored 2026-10-16 doboku-note 自作。論点はかわまちづくり支援制度の実施要綱（推進主体と河川管理者の共同作成・登録・計画の必須項目・区域指定・5年以内の検証）。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="かわまちづくりの役割分担図。河川管理者のハード施策とソフト施策、推進主体の営業・利用と維持管理が、計画の項目に対応する。計画には生物の生息・生育・繁殖の場の保全・創出と維持管理計画が必須。登録後5年以内に共同で検証する。準用河川は市町村長が河川管理者。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 12px; fill: #555; }
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .x { font-size: 12px; fill: #222; }
      .s { font-size: 11px; fill: #555; }
      .sb { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .p { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .d { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .g { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .wh { fill: #fff; stroke: #8a8a8a; stroke-width: 1.5; }
      .dz { fill: #fff; stroke: #2e6da4; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .l { stroke: #d7d7d7; stroke-width: 1; fill: none; }
      .ln { stroke: #8a8a8a; stroke-width: 1; fill: none; }
      .ld { stroke: #8a8a8a; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
      .a { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .ar { stroke: #b22234; stroke-width: 2; fill: none; }
      .ag { stroke: #3a7d44; stroke-width: 2; fill: none; }
      .ax { stroke: #8a8a8a; stroke-width: 2; fill: none; }
    </style>
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
    <marker id="ahr" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#b22234"/></marker>
    <marker id="ahg" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#3a7d44"/></marker>
    <marker id="ahk" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#8a8a8a"/></marker>
  </defs>
  <rect class="b" x="10" y="10" width="184" height="38" rx="8"/>
  <text class="t" x="102.0" y="25.5" text-anchor="middle">河川管理者</text>
  <text class="s" x="102.0" y="40.5" text-anchor="middle">支援する側</text>
  <rect class="p" x="206" y="10" width="184" height="38" rx="8"/>
  <text class="t" x="298.0" y="25.5" text-anchor="middle">推進主体</text>
  <text class="s" x="298.0" y="40.5" text-anchor="middle">市町村・民間事業者など</text>
  <rect class="wh" x="10" y="54" width="184" height="52" rx="8"/>
  <circle class="b" cx="26" cy="70" r="9"/>
  <text class="t" x="26" y="74" text-anchor="middle">1</text>
  <text class="t" x="42" y="74" text-anchor="start">ハード施策</text>
  <text class="s" x="24" y="92" text-anchor="start">親水護岸</text>
  <text class="s" x="24" y="104" text-anchor="start">河川管理用通路</text>
  <rect class="wh" x="10" y="112" width="184" height="52" rx="8"/>
  <circle class="b" cx="26" cy="128" r="9"/>
  <text class="t" x="26" y="132" text-anchor="middle">1</text>
  <text class="t" x="42" y="132" text-anchor="start">ソフト施策</text>
  <text class="s" x="24" y="148" text-anchor="start">調査・検討の連携</text>
  <text class="s" x="24" y="160" text-anchor="start">区域指定の支援</text>
  <rect class="wh" x="206" y="54" width="184" height="52" rx="8"/>
  <circle class="w" cx="222" cy="70" r="9"/>
  <text class="t" x="222" y="74" text-anchor="middle">2</text>
  <text class="t" x="238" y="74" text-anchor="start">営業・利用</text>
  <text class="s" x="220" y="90" text-anchor="start">民間のカフェなどは</text>
  <text class="s" x="220" y="102" text-anchor="start">指定区域で</text>
  <rect class="wh" x="206" y="112" width="184" height="52" rx="8"/>
  <circle class="p" cx="222" cy="128" r="9"/>
  <text class="t" x="222" y="132" text-anchor="middle">3</text>
  <text class="t" x="238" y="132" text-anchor="start">維持管理</text>
  <text class="s" x="220" y="148" text-anchor="start">洪水を防ぐ施設以外は</text>
  <text class="s" x="220" y="160" text-anchor="start">事前に協議</text>
  <path class="a" d="M102,166V180" marker-end="url(#ah)"/>
  <path class="a" d="M298,166V180" marker-end="url(#ah)"/>
  <rect class="w" x="10" y="182" width="380" height="140" rx="8"/>
  <text class="t" x="200" y="200" text-anchor="middle">かわまちづくり計画（共同で作成）</text>
  <circle class="b" cx="26" cy="218" r="9"/>
  <text class="t" x="26" y="222" text-anchor="middle">1</text>
  <text class="x" x="42" y="222" text-anchor="start">ソフト施策・ハード施策の内容</text>
  <circle class="w" cx="26" cy="240" r="9"/>
  <text class="t" x="26" y="244" text-anchor="middle">2</text>
  <text class="x" x="42" y="244" text-anchor="start">都市・地域再生等利用区域の指定に関する取組</text>
  <circle class="p" cx="26" cy="262" r="9"/>
  <text class="t" x="26" y="266" text-anchor="middle">3</text>
  <text class="x" x="42" y="266" text-anchor="start">維持管理計画</text>
  <rect class="p" x="18" y="274" width="364" height="40" rx="6"/>
  <text class="t" x="28" y="291" text-anchor="start">必須：生物の生息・生育・繁殖の場の</text>
  <text class="t" x="28" y="306" text-anchor="start">保全・創出に関する取組</text>
  <path class="a" d="M200,324V336" marker-end="url(#ah)"/>
  <rect class="b" x="10" y="338" width="380" height="30" rx="8"/>
  <text class="t" x="200.0" y="357.0" text-anchor="middle">登録：水管理・国土保全局長へ申請</text>
  <path class="a" d="M200,370V380" marker-end="url(#ah)"/>
  <rect class="p" x="10" y="382" width="380" height="30" rx="8"/>
  <text class="t" x="200.0" y="401.0" text-anchor="middle">共同で検証：登録後5年以内。必要なら変更</text>
  <rect class="g" x="10" y="422" width="380" height="72" rx="8"/>
  <text class="t" x="20" y="440" text-anchor="start">準用河川は市町村長が河川管理者</text>
  <text class="s" x="20" y="456" text-anchor="start">管理者と推進主体が、同じ市町村の中にいる</text>
  <text class="s" x="20" y="471" text-anchor="start">民間が推進主体なら、河川管理者と市町村を含む</text>
  <text class="s" x="20" y="486" text-anchor="start">協議会などを設置して地域の合意を図る</text>
</svg>
