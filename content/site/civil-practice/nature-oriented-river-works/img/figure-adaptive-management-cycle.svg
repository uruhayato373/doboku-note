<!-- authored 2026-10-16 doboku-note 自作。論点は多自然川づくり基本指針の適用範囲（調査から災害復旧までの全段階）と順応的管理（モニタリングを踏まえた見直し）。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="多自然川づくりの全段階の図。調査から維持管理・更新へ一方向に進み、災害復旧は輪の外の段階として並ぶ。中心のモニタリングと見直しは、すべての段階にかかる。頻度と担当は設計の段階で決める。">
