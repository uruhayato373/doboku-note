<!-- authored 2026-10-16 doboku-note 自作。論点はバッファの端部の設定による面積の違い（200m×60m＝12,000m²、丸めると約14,800m²）と、距離の単位が座標系で決まること。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="バッファの図。道路中心線（延長200m）の両側30mは、端部を平らに切ると12,000平方メートル、両端を丸めると約14,800平方メートル。距離dに30と入れたとき、座標系の単位がメートルなら30m、緯度経度なら30度になる。">
  <defs>
  <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 11px; fill: #222; }
      .b { font-weight: bold; fill: #1a3a5c; }
      .m { fill: #555; }
      .t12 { font-size: 12px; }
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .pos { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .dng { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .sf { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .wh { fill: #fff; stroke: #2e6da4; stroke-width: 1.5; }
      .dash { fill: #fff; stroke: #555; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .grid { stroke: #d7d7d7; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .ax { stroke: #555; stroke-width: 1.5; fill: none; }
      .ar { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .ark { stroke: #555; stroke-width: 2; fill: none; }
  </style>
  <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  <marker id="ak" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  <marker id="as" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  <marker id="asg" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  </defs>
  <rect x="20" y="10" width="14" height="14" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text class="m" x="40" y="22">元の図形</text>
  <rect x="120" y="10" width="14" height="14" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text class="m" x="140" y="22">バッファの範囲（外側へ距離 d）</text>
  <rect class="sf" x="12" y="32" width="376" height="52" rx="8"/>
  <text class="t12 b" x="22" y="56">点</text>
  <text class="m" x="22" y="72">マンホール</text>
  <circle cx="270" cy="58" r="22" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5" stroke-dasharray="5 3"/><circle cx="270" cy="58" r="4" fill="#2e6da4"/>
  <rect class="sf" x="12" y="90" width="376" height="128" rx="8"/>
  <text class="t12 b" x="22" y="110">線　道路中心線 200m（両側30m）</text>
  <rect x="30" y="134" width="150" height="40" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5" stroke-dasharray="5 3"/><path d="M30,154H180" stroke="#2e6da4" stroke-width="3"/>
  <text class="t12 b" x="105" y="192" text-anchor="middle">端部を平らに切る</text>
  <text class="m" x="105" y="208" text-anchor="middle">12,000m²（200×60）</text>
  <rect x="214" y="134" width="170" height="40" rx="20" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5" stroke-dasharray="5 3"/><path d="M234,154H364" stroke="#2e6da4" stroke-width="3"/>
  <text class="t12 b" x="299" y="192" text-anchor="middle">両端を丸める（既定）</text>
  <text class="m" x="299" y="208" text-anchor="middle">約14,800m²</text>
  <rect class="sf" x="12" y="224" width="376" height="56" rx="8"/>
  <text class="t12 b" x="22" y="248">面</text>
  <text class="m" x="22" y="264">工事範囲</text>
  <rect x="236" y="232" width="100" height="40" rx="14" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5" stroke-dasharray="5 3"/><rect x="254" y="244" width="64" height="16" fill="#e8f0fe" stroke="#2e6da4" stroke-width="2"/>
  <text class="t12 b" x="200" y="306" text-anchor="middle">バッファの距離 d に 30 と入れたとき</text>
  <rect class="pos" x="12" y="318" width="184" height="66" rx="8"/>
  <text class="t12" x="104.0" y="345.0" text-anchor="middle">座標系の単位がメートル</text>
  <text class="t12 b" x="104.0" y="365.0" text-anchor="middle">d＝30 は 30m</text>
  <rect class="dng" x="204" y="318" width="184" height="66" rx="8"/>
  <text class="t12" x="296.0" y="345.0" text-anchor="middle">緯度経度（度）</text>
  <text class="t12 b" x="296.0" y="365.0" text-anchor="middle">d＝30 は 30度</text>
  <rect class="dng" x="12" y="396" width="376" height="86" rx="8"/>
  <text class="t12 b" x="200.0" y="423.0" text-anchor="middle">基盤地図情報は緯度経度（度）</text>
  <text class="t12" x="200.0" y="443.0" text-anchor="middle">そのままかけると意図と大きく違う範囲になる</text>
  <text class="t12" x="200.0" y="463.0" text-anchor="middle">メートルの座標系へ変換してから実行</text>
</svg>
