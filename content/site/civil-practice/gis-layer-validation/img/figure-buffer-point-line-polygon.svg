<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="点、線、面のそれぞれに距離dのバッファをかけた範囲。元の図形の外側へ等しい距離だけ広がり、距離の単位は座標系の単位になる" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
  <rect width="400" height="500" fill="#ffffff"/>

  <!-- 点 -->
  <rect x="20" y="16" width="360" height="130" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="36" y="76" font-size="13" font-weight="700" fill="#222">点</text>
  <text x="36" y="96" font-size="11" fill="#555">マンホール</text>
  <circle cx="255" cy="81" r="50" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5" stroke-dasharray="5 3"/>
  <circle cx="255" cy="81" r="5" fill="#2e6da4" stroke="#1a3a5c" stroke-width="1"/>
  <path d="M255 81 H305 M305 75 V87" fill="none" stroke="#1a3a5c" stroke-width="1.5"/>
  <text x="280" y="73" text-anchor="middle" font-size="12" font-weight="700" fill="#1a3a5c">d</text>

  <!-- 線 -->
  <rect x="20" y="156" width="360" height="130" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="36" y="216" font-size="13" font-weight="700" fill="#222">線</text>
  <text x="36" y="236" font-size="11" fill="#555">道路中心線</text>
  <rect x="145" y="171" width="220" height="100" rx="50" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5" stroke-dasharray="5 3"/>
  <path d="M195 221 H315" fill="none" stroke="#2e6da4" stroke-width="3"/>
  <path d="M255 221 V271 M249 271 H261" fill="none" stroke="#1a3a5c" stroke-width="1.5"/>
  <text x="265" y="251" font-size="12" font-weight="700" fill="#1a3a5c">d</text>

  <!-- 面 -->
  <rect x="20" y="296" width="360" height="130" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="36" y="356" font-size="13" font-weight="700" fill="#222">面</text>
  <text x="36" y="376" font-size="11" fill="#555">工事範囲</text>
  <rect x="196" y="305" width="128" height="112" rx="34" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="230" y="339" width="60" height="44" fill="#e8f0fe" stroke="#2e6da4" stroke-width="2"/>
  <path d="M290 361 H324 M324 355 V367" fill="none" stroke="#1a3a5c" stroke-width="1.5"/>
  <text x="307" y="353" text-anchor="middle" font-size="12" font-weight="700" fill="#1a3a5c">d</text>

  <!-- 凡例 -->
  <rect x="36" y="440" width="14" height="14" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="58" y="452" font-size="11" fill="#555">元の図形</text>
  <rect x="140" y="440" width="14" height="14" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="162" y="452" font-size="11" fill="#555">バッファの範囲（外側へ距離 d）</text>
  <text x="36" y="480" font-size="12" font-weight="700" fill="#1a3a5c">d の単位＝座標系の単位</text>
</svg>
