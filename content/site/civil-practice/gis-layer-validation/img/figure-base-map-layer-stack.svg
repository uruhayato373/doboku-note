<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="基盤地図情報を土台に、台帳、災害リスク、工事範囲・搬入路・仮置場の層を順に重ねる構成。重ねる前に座標系、時点、出所をそろえる" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
  <rect width="400" height="500" fill="#ffffff"/>

  <!-- 最上層: 工事範囲・搬入路・仮置場 -->
  <polygon points="70,24 330,24 290,76 30,76" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
  <text x="180" y="46" text-anchor="middle" font-size="13" font-weight="700" fill="#1a3a5c">工事範囲・搬入路・仮置場</text>
  <text x="180" y="64" text-anchor="middle" font-size="11" fill="#1a3a5c">確認したい計画の位置を図形で持つ</text>

  <path d="M100 78 V96 M250 78 V96" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- 災害リスク -->
  <polygon points="70,98 330,98 290,150 30,150" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text x="180" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#1a3a5c">災害リスク</text>
  <text x="180" y="138" text-anchor="middle" font-size="11" fill="#1a3a5c">浸水想定・警戒区域・避難所・人口</text>

  <path d="M100 152 V170 M250 152 V170" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- 台帳・設備 -->
  <polygon points="70,172 330,172 290,224 30,224" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="180" y="194" text-anchor="middle" font-size="13" font-weight="700" fill="#1a3a5c">台帳・設備</text>
  <text x="180" y="212" text-anchor="middle" font-size="11" fill="#1a3a5c">道路・管路・施設の位置と属性</text>

  <path d="M100 226 V244 M250 226 V244" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- 土台: 基盤地図情報 -->
  <polygon points="70,246 330,246 290,298 30,298" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
  <text x="180" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#222">基盤地図情報（位置の基準）</text>
  <text x="180" y="286" text-anchor="middle" font-size="11" fill="#555">道路縁・建築物の外周線・境界</text>


  <!-- 重ねる前にそろえるもの -->
  <rect x="20" y="318" width="360" height="100" rx="6" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text x="200" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="#1a3a5c">重ねる前に、全層でそろえる</text>
  <text x="200" y="365" text-anchor="middle" font-size="12" fill="#1a3a5c">座標系と測地系</text>
  <text x="200" y="385" text-anchor="middle" font-size="12" fill="#1a3a5c">データの時点（いつの現況か）</text>
  <text x="200" y="405" text-anchor="middle" font-size="12" fill="#1a3a5c">出所と利用条件</text>

  <path d="M200 420 V436" fill="none" stroke="#2e6da4" stroke-width="2"/>
  <polygon points="200,446 192,434 208,434" fill="#2e6da4"/>

  <rect x="20" y="450" width="360" height="38" rx="6" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
  <text x="200" y="474" text-anchor="middle" font-size="13" font-weight="700" fill="#1a3a5c">重なりから、先に確認する場所を決める</text>
</svg>
