  <circle cx="270" cy="162" r="4" fill="#fff" stroke="#2e6da4" stroke-width="2"/>
  <circle cx="320" cy="168" r="4" fill="#fff" stroke="#2e6da4" stroke-width="2"/>
  <circle cx="360" cy="146" r="4" fill="#fff" stroke="#2e6da4" stroke-width="2"/>
  <rect class="sf" x="12" y="194" width="376" height="58" rx="8"/>
  <text class="t12 b" x="22" y="218">基盤地図情報</text>
