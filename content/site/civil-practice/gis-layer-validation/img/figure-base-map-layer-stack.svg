  <rect x="140" y="304" width="50" height="54" fill="#fff" fill-opacity="0.6" stroke="#3a7d44" stroke-width="2"/>
  <rect x="140" y="304" width="30" height="34" fill="#f8d7da" stroke="#b22234" stroke-width="3"/>
  <polyline points="20,352 60,334 100,340 150,320" fill="none" stroke="#2e6da4" stroke-width="2.5"/>
  <rect class="dng" x="212" y="278" width="176" height="90" rx="8"/>
  <text class="t12 b" x="300.0" y="303.0" text-anchor="middle">重なった部分に</text>
  <text class="t12" x="300.0" y="319.0" text-anchor="middle">印を付けて</text>
  <text class="t12" x="300.0" y="335.0" text-anchor="middle">先に確認する場所を</text>
  <text class="t12" x="300.0" y="351.0" text-anchor="middle">決める</text>
  <rect class="warn" x="12" y="380" width="376" height="62" rx="8"/>
