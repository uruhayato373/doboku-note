  <rect x="300" y="20" width="56" height="34" fill="#fff" stroke="#3a7d44" stroke-width="2"/>
  <path d="M220,48H300" stroke="#3a7d44" stroke-width="3" fill="none"/><rect x="216" y="42" width="12" height="12" fill="#fff" stroke="#3a7d44" stroke-width="2"/>
  <rect class="dng" x="12" y="70" width="376" height="58" rx="8"/>
