  <text class="t12 b" x="78.0" y="426.0" text-anchor="middle">出所</text>
  <rect class="wh" x="144" y="410" width="108" height="24" rx="6"/>
  <text class="t12 b" x="198.0" y="426.0" text-anchor="middle">時点</text>
  <rect class="wh" x="264" y="410" width="108" height="24" rx="6"/>
  <text class="t12 b" x="318.0" y="426.0" text-anchor="middle">座標系</text>
  <rect class="warn" x="12" y="452" width="376" height="40" rx="8"/>
  <text class="t12 b" x="200.0" y="476.0" text-anchor="middle">層が増えるほど、どの層のずれか切り分けにくい</text>
</svg>
