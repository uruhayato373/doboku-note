<!-- authored 2026-10-16 doboku-note 自作。論点は工事範囲6,000m²と注意区域の交差1,200m²・差4,800m²の検算と、切り出し後の属性の面積の再計算。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="工事範囲100m×60mの6,000平方メートルと注意区域を重ね、交差部分20m×60mの1,200平方メートルを切り出す例。交差1,200と差4,800を足すと元の6,000に戻る。切り出し後の属性の面積は6,000のままなので、形状から再計算して1,200にする。">
  <defs>
  <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 11px; fill: #222; }
      .b { font-weight: bold; fill: #1a3a5c; }
      .m { fill: #555; }
      .t12 { font-size: 12px; }
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .pos { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .dng { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .sf { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .wh { fill: #fff; stroke: #2e6da4; stroke-width: 1.5; }
      .dash { fill: #fff; stroke: #555; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .grid { stroke: #d7d7d7; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .ax { stroke: #555; stroke-width: 1.5; fill: none; }
      .ar { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .ark { stroke: #555; stroke-width: 2; fill: none; }
  </style>
  <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  <marker id="ak" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  <marker id="as" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  <marker id="asg" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  </defs>
  <pattern id="hh" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#b22234" stroke-width="1.5"/></pattern>
  <text class="t12 b" x="12" y="22">交差で切り出し、面積を検算する</text>
  <rect x="40" y="52" width="160" height="120" fill="#e8f0fe" stroke="#2e6da4" stroke-width="2"/>
  <rect x="200" y="36" width="140" height="152" fill="#fff3cd" stroke="#d4a017" stroke-width="2"/>
  <rect x="200" y="52" width="40" height="120" fill="#f8d7da" stroke="#b22234" stroke-width="2"/><rect x="200" y="52" width="40" height="120" fill="url(#hh)"/>
  <text class="t12 b" x="120" y="96" text-anchor="middle">工事範囲</text>
  <text class="t12" x="120" y="114" text-anchor="middle">差 4,800m²</text>
  <text class="m" x="120" y="132" text-anchor="middle">（80m × 60m）</text>
  <text class="t12 b" x="290" y="100" text-anchor="middle">注意区域</text>
  <text class="m" x="120" y="200" text-anchor="middle">100m</text>
  <path d="M40,206H200" stroke="#555" stroke-width="1.5" marker-start="url(#asg)" marker-end="url(#ak)" fill="none"/>
  <text class="m" x="30" y="116" text-anchor="end">60m</text>
  <path d="M34,52V172" stroke="#555" stroke-width="1.5" marker-start="url(#asg)" marker-end="url(#ak)" fill="none"/>
  <text class="m" x="220" y="30" text-anchor="middle">20m</text>
  <text class="m" x="250" y="200">交差 20m×60m</text>
  <text class="t12 b" x="250" y="214">＝1,200m²</text>
  <rect class="pos" x="12" y="230" width="376" height="46" rx="8"/>
  <text class="t12 b" x="200.0" y="248.0" text-anchor="middle">交差 1,200 ＋ 差 4,800 ＝ 元の 6,000 m²</text>
  <text class="t12" x="200.0" y="266.0" text-anchor="middle">重なる割合 1,200÷6,000＝20％</text>
  <text class="t12 b" x="200" y="300" text-anchor="middle">切り出し後の属性表の「面積」</text>
  <rect class="dng" x="12" y="312" width="160" height="60" rx="8"/>
  <text class="t12 b" x="92.0" y="338.0" text-anchor="middle">面積 6,000</text>
  <text class="t12" x="92.0" y="354.0" text-anchor="middle">（元のまま）</text>
  <rect class="pos" x="228" y="312" width="160" height="60" rx="8"/>
  <text class="t12 b" x="308.0" y="338.0" text-anchor="middle">面積 1,200</text>
  <text class="t12" x="308.0" y="354.0" text-anchor="middle">（再計算後）</text>
  <path class="ar" d="M174,342H226" marker-end="url(#ah)"/>
  <text class="m" x="200" y="334" text-anchor="middle">再計算</text>
  <text class="m" x="200" y="392" text-anchor="middle">形状は1,200m²なのに、属性が6,000のまま残る失敗</text>
  <rect class="pos" x="12" y="420" width="376" height="52" rx="8"/>
  <text class="t12 b" x="200.0" y="450.0" text-anchor="middle">対象区間を現地で確認し、計画へ</text>
</svg>
