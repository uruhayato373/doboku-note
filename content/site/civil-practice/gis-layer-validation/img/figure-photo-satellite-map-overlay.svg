<!-- authored 2026-10-16 doboku-note 自作。論点は写真と地図を重ねたときのずれの見え方二種と、原因を座標系・正射変換・撮影時点の順に切り分ける手順。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="写真を地図に重ねたときのずれの二つの見え方と、原因の切り分けの順の図。全体が同じ向きにずれるなら座標系や撮影時点を疑う。高い構造物の像だけ傾くなら正射変換がない。切り分けは座標系、正射変換、撮影時点の順。背景に使う画像には撮影日、取得元、解像度、座標系と正射変換の有無を記録する。">
  <defs>
  <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 11px; fill: #222; }
      .b { font-weight: bold; fill: #1a3a5c; }
      .m { fill: #555; }
      .t12 { font-size: 12px; }
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .pos { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .dng { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .sf { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .wh { fill: #fff; stroke: #2e6da4; stroke-width: 1.5; }
      .dash { fill: #fff; stroke: #555; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .grid { stroke: #d7d7d7; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .ax { stroke: #555; stroke-width: 1.5; fill: none; }
      .ar { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .ark { stroke: #555; stroke-width: 2; fill: none; }
  </style>
  <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  <marker id="ak" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  <marker id="as" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  <marker id="asg" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  </defs>
  <text class="t12 b" x="104" y="20" text-anchor="middle">全体が同じ向きにずれる</text>
  <text class="t12 b" x="296" y="20" text-anchor="middle">高い構造物の像だけ傾く</text>
  <rect class="sf" x="12" y="30" width="184" height="190" rx="8"/>
  <rect class="sf" x="204" y="30" width="184" height="190" rx="8"/>
  <polygon points="24,140 188,92 188,112 24,162" fill="#d7d7d7"/>
  <path d="M24,120L188,72" stroke="#2e6da4" stroke-width="3" fill="none"/>
  <rect x="40" y="60" width="26" height="20" fill="none" stroke="#2e6da4" stroke-width="2"/><rect x="52" y="82" width="26" height="20" fill="#d7d7d7" stroke="#555" stroke-width="1.5"/>
  <path d="M110,100V122" stroke="#b22234" stroke-width="2" fill="none" marker-end="url(#ak)"/>
  <text class="b" x="24" y="50">地図の線</text>
  <text class="m" x="24" y="206">写真の像（灰）が一様にずれ</text>
  <polygon points="262,168 322,168 358,70 298,70" fill="#d7d7d7" stroke="#555" stroke-width="1.5"/>
  <rect x="262" y="150" width="60" height="18" fill="none" stroke="#2e6da4" stroke-width="2.5"/>
  <text class="b" x="212" y="50">地図の外形（青）</text>
  <text class="m" x="212" y="206">写真の像（灰）が傾く</text>
  <rect class="warn" x="12" y="232" width="184" height="40" rx="8"/>
  <text class="t12 b" x="104.0" y="248.0" text-anchor="middle">疑う原因</text>
  <text class="t12" x="104.0" y="264.0" text-anchor="middle">座標系・撮影時点</text>
  <rect class="warn" x="204" y="232" width="184" height="40" rx="8"/>
  <text class="t12 b" x="296.0" y="248.0" text-anchor="middle">疑う原因</text>
  <text class="t12" x="296.0" y="264.0" text-anchor="middle">正射変換がない</text>
  <text class="t12 b" x="200" y="300" text-anchor="middle">ずれを見つけたら、この順に原因を切り分ける</text>
  <rect class="brand" x="12" y="312" width="112" height="40" rx="8"/>
  <text class="t12 b" x="68.0" y="336.0" text-anchor="middle">1 座標系</text>
  <path class="ar" d="M126,332H142" marker-end="url(#ah)"/>
  <rect class="brand" x="144" y="312" width="112" height="40" rx="8"/>
  <text class="t12 b" x="200.0" y="336.0" text-anchor="middle">2 正射変換</text>
  <path class="ar" d="M258,332H274" marker-end="url(#ah)"/>
  <rect class="brand" x="276" y="312" width="112" height="40" rx="8"/>
  <text class="t12 b" x="332.0" y="336.0" text-anchor="middle">3 撮影時点</text>
  <rect class="warn" x="12" y="376" width="376" height="108" rx="8"/>
  <text class="t12 b" x="200" y="402" text-anchor="middle">背景に使う画像に添える記録</text>
  <text class="t12" x="200" y="430" text-anchor="middle">撮影日・取得元・解像度</text>
  <text class="t12" x="200" y="454" text-anchor="middle">座標系と、正射変換の有無</text>
</svg>
