<!-- authored 2026-10-16 doboku-note 自作。論点は東京都環境局「緑化計画の手引」（令和7年3月）の屋上植栽断面の層の順と、発注者が確かめる五つの点。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="屋上緑化の標準断面。上からマルチング、基盤、透水層、保水層、排水層、防根層、防水層、スラブの順に並ぶ。発注者が確かめる点は、荷重、層の構成、排水口、かん水、防水の五つ。層の順は東京都の手引の例で、全国共通の基準ではない。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 11px; fill: #555; }
      .n { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .l { font-size: 12px; fill: #1a3a5c; }
      .bd { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .bn { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
    </style>
  </defs>

  <text x="14" y="26">屋上緑化の標準断面（上が表面）</text>

  <!-- 植栽 -->
  <circle cx="70" cy="68" r="11" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
  <circle cx="118" cy="64" r="14" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
  <circle cx="166" cy="69" r="10" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>

  <!-- 層 -->
  <rect x="34" y="84" width="170" height="26" fill="#f5f5f5" stroke="#8a8a8a"/>
  <text class="l" x="44" y="102">マルチング（土壌被覆）</text>
  <rect x="34" y="110" width="170" height="44" fill="#d0e8d0" stroke="#3a7d44"/>
  <text class="l" x="44" y="136">基盤（土壌・マット等）</text>
  <rect x="34" y="154" width="170" height="38" fill="#fff" stroke="#8a8a8a"/>
  <text class="l" x="44" y="177">透水層</text>
  <rect x="34" y="192" width="170" height="38" fill="#e8f0fe" stroke="#2e6da4"/>
  <text class="l" x="44" y="215">保水層</text>
  <rect x="34" y="230" width="170" height="38" fill="#fff" stroke="#8a8a8a"/>
  <text class="l" x="44" y="253">排水層</text>
  <rect x="34" y="268" width="170" height="38" fill="#d0e8d0" stroke="#3a7d44"/>
  <text class="l" x="44" y="291">防根（耐根）層</text>
  <rect x="34" y="306" width="170" height="38" fill="#fff3cd" stroke="#d4a017"/>
  <text class="l" x="44" y="329">防水層</text>
  <rect x="34" y="344" width="170" height="48" fill="#d7d7d7" stroke="#8a8a8a"/>
  <text class="l" x="44" y="372">スラブ</text>

  <!-- 排水口 -->
  <rect x="178" y="230" width="20" height="162" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>

  <!-- ① 荷重の範囲 -->
  <path d="M30,110H24V268H30" fill="none" stroke="#2e6da4" stroke-width="1.5"/>
  <circle class="bd" cx="13" cy="189" r="8"/><text class="bn" x="13" y="193" text-anchor="middle">1</text>

  <!-- 確認点 -->
  <path d="M204,132H220" stroke="#8a8a8a" fill="none"/>
  <circle class="bd" cx="232" cy="108" r="8"/><text class="bn" x="232" y="112" text-anchor="middle">4</text>
  <text class="n" x="246" y="112">かん水</text>
  <text x="222" y="128">給水栓などの設備を</text>
  <text x="222" y="142">最初に設ける</text>

  <circle class="bd" cx="232" cy="172" r="8"/><text class="bn" x="232" y="176" text-anchor="middle">1</text>
  <text class="n" x="246" y="176">荷重</text>
  <text x="222" y="192">植栽の荷重が</text>
  <text x="222" y="206">設計積載荷重を</text>
  <text x="222" y="220">超えない</text>

  <path d="M204,287H220" stroke="#8a8a8a" fill="none"/>
  <circle class="bd" cx="232" cy="248" r="8"/><text class="bn" x="232" y="252" text-anchor="middle">2</text>
  <text class="n" x="246" y="252">層の構成</text>
  <text x="222" y="268">防根シート・フィルターの</text>
  <text x="222" y="282">破損・すき間・折れ</text>
  <text x="222" y="296">覆う前に検査</text>

  <path d="M204,325H220" stroke="#8a8a8a" fill="none"/>
  <circle class="bd" cx="232" cy="318" r="8"/><text class="bn" x="232" y="322" text-anchor="middle">5</text>
  <text class="n" x="246" y="322">防水</text>
  <text x="222" y="338">建築工事の仕様書に従う</text>
  <text x="222" y="352">（建築担当）</text>

  <path d="M198,368H220" stroke="#8a8a8a" fill="none"/>
  <circle class="bd" cx="232" cy="368" r="8"/><text class="bn" x="232" y="372" text-anchor="middle">3</text>
  <text class="n" x="246" y="372">排水口</text>
  <text x="222" y="388">ルーフドレンを</text>
  <text x="222" y="402">定期的に清掃</text>

  <!-- 出典 -->
  <rect x="10" y="418" width="380" height="74" rx="8" style="fill:#fff3cd;stroke:#d4a017;stroke-width:1.5"/>
  <text class="n" x="20" y="438">東京都の手引の例（全国共通の基準ではない）</text>
  <text x="20" y="456">出典：東京都環境局「緑化計画の手引」（令和7年3月）</text>
  <text x="20" y="472">層の厚さの数値は設計図書で決まる</text>
</svg>
