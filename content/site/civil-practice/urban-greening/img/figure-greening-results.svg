<!-- authored 2026-10-16 doboku-note 自作。数値は記事本文に引いた国土交通省「全国屋上・壁面緑化施工実績調査」（令和7年12月12日発表）の値だけを使用。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="全国屋上・壁面緑化施工実績調査の数字の読み方。令和6年の新規創出面積は屋上緑化が約14.5ヘクタール、壁面緑化が約4.6ヘクタールで暫定値。平成12年から令和6年の25年間の累計は屋上緑化が約633ヘクタール、壁面緑化が約131ヘクタール。令和4年の屋上緑化は暫定値156,762平方メートルが確定値181,595平方メートルへ約16パーセント増えた。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 11px; fill: #555; }
      .n { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .l { font-size: 12px; fill: #1a3a5c; }
      .p { fill: #fff; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
  </defs>

  <text x="14" y="24">国土交通省の全国調査（令和7年12月12日発表）</text>

  <!-- 令和6年 -->
  <rect class="p" x="10" y="34" width="380" height="102" rx="8"/>
  <text class="n" x="20" y="54">令和6年に新たに創出された面積（ヘクタール）</text>
  <text class="l" x="20" y="83">屋上緑化</text>
  <rect x="92" y="66" width="220" height="24" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text class="n" x="320" y="83">約14.5</text>
  <text class="l" x="20" y="115">壁面緑化</text>
  <rect x="92" y="98" width="70" height="24" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text class="n" x="170" y="115">約4.6</text>
  <text x="224" y="115">暫定値</text>

  <!-- 25年間の累計 -->
  <rect class="p" x="10" y="148" width="380" height="102" rx="8"/>
  <text class="n" x="20" y="168">平成12年〜令和6年の25年間の累計（ヘクタール）</text>
  <text class="l" x="20" y="197">屋上緑化</text>
  <rect x="92" y="180" width="220" height="24" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text class="n" x="320" y="197">約633</text>
  <text class="l" x="20" y="229">壁面緑化</text>
  <rect x="92" y="212" width="45" height="24" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
  <text class="n" x="145" y="229">約131</text>

  <!-- 暫定値と確定値 -->
  <rect class="p" x="10" y="262" width="380" height="126" rx="8"/>
  <text class="n" x="20" y="282">令和4年の屋上緑化（平方メートル）</text>
  <text class="l" x="20" y="311">暫定値</text>
  <rect x="72" y="294" width="205" height="24" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text class="n" x="285" y="311">156,762</text>
  <text class="l" x="20" y="343">確定値</text>
  <rect x="72" y="326" width="238" height="24" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text class="n" x="318" y="343">181,595</text>
  <text class="n" x="72" y="376">約16パーセント増えた</text>

  <!-- 引き方 -->
  <rect x="10" y="400" width="380" height="90" rx="8" style="fill:#fff3cd;stroke:#d4a017;stroke-width:1.5"/>
  <text class="n" x="20" y="422">令和5年・令和6年のデータは暫定値</text>
  <text x="20" y="440">年次と、暫定値かどうかを添えて引く</text>
  <text x="20" y="458">破線の棒は暫定値、棒の目盛りは枠ごとに違う</text>
  <text x="20" y="476">出典：国土交通省 全国屋上・壁面緑化施工実績調査</text>
</svg>
