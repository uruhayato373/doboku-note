<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="荷の重さと作業の続き方で、装着型の補助具を検討する優先度を整理した2×2の目安。どの区画でも動作の確認が別に要る" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
  <g font-size="13" font-weight="700" fill="#222" text-anchor="middle">
    <text x="105" y="36">同じ動作が続く作業</text>
    <text x="295" y="36">場面が切り替わる作業</text>
  </g>
  <g font-size="12" font-weight="700" fill="#555">
    <text x="16" y="64">荷が重い</text>
    <text x="16" y="230">荷が軽い</text>
  </g>
  <g stroke-width="1.5">
    <!-- 機械化が先: warn / 検討しやすい: positive / 比較して判断: surface -->
    <rect x="16" y="74" width="178" height="130" rx="6" fill="#fff3cd" stroke="#d4a017"/>
    <rect x="206" y="74" width="178" height="130" rx="6" fill="#fff3cd" stroke="#d4a017"/>
    <rect x="16" y="240" width="178" height="130" rx="6" fill="#d0e8d0" stroke="#3a7d44"/>
    <rect x="206" y="240" width="178" height="130" rx="6" fill="#f5f5f5" stroke="#d7d7d7"/>
    <rect x="16" y="392" width="368" height="90" rx="6" fill="#e8f0fe" stroke="#2e6da4"/>
  </g>
  <g font-size="14" font-weight="700" fill="#222">
    <text x="28" y="102">機械化を先に</text>
    <text x="218" y="102">機械で扱えないか</text>
    <text x="28" y="268">検討しやすい</text>
    <text x="218" y="268">効果と手間を比べる</text>
  </g>
  <g font-size="12" fill="#1a3a5c">
    <text x="28" y="128">重い荷の繰り返しは、</text>
    <text x="28" y="148">荷の分割や機械化が先。</text>
    <text x="28" y="168">残る負担を補助具で補う</text>
    <text x="218" y="128">場面が変わっても重い荷は</text>
    <text x="218" y="148">クレーン等の機械で</text>
    <text x="218" y="168">扱えるかを先に検討</text>
    <text x="28" y="294">中腰や前屈が続き、</text>
    <text x="28" y="314">疲労が重なる作業で</text>
    <text x="28" y="334">効果を試着で確かめる</text>
    <text x="218" y="294">場面が変わる作業は</text>
    <text x="218" y="314">着脱や動作の制約が</text>
    <text x="218" y="334">効果を上回らないか</text>
    <text x="218" y="354">見て判断する</text>
  </g>
  <text x="28" y="414" font-size="13" font-weight="700" fill="#222">どの区画でも別に確かめる点</text>
  <g font-size="12" fill="#1a3a5c">
    <text x="28" y="436">・高所、狭い場所、はしごの昇降で動けるか</text>
    <text x="28" y="454">・着用者ごとの体格と効果の出方</text>
    <text x="28" y="472">・装置自体が新たな危険源にならないか</text>
  </g>
</svg>
