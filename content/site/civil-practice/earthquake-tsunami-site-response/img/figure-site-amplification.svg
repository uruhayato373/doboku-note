<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="地震基盤から工学的基盤、表層地盤へ揺れが伝わり、軟らかい表層ほど増幅する断面と、地盤の基本固有周期の求め方" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
  <defs>
    <marker id="up-head" markerWidth="12" markerHeight="11" refX="12" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,0 12,5.5 0,11" fill="#b22234"/>
    </marker>
  </defs>
  <rect width="400" height="500" fill="#ffffff"/>

  <!-- 地表の構造物 -->
  <rect x="300" y="20" width="26" height="44" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
  <text x="290" y="46" text-anchor="end" font-size="11" fill="#555">構造物</text>

  <!-- 表層地盤: warn（軟らかい） -->
  <rect x="20" y="64" width="360" height="58" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text x="76" y="88" font-size="13" font-weight="700" fill="#1a3a5c">表層地盤（数十m程度）</text>
  <text x="76" y="109" font-size="12" fill="#1a3a5c">軟らかいほど、揺れが増幅される</text>

  <!-- 深部の地盤: brand -->
  <rect x="20" y="122" width="360" height="140" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="76" y="144" font-size="12" fill="#1a3a5c">上面が工学的基盤（S波速度 300〜700 m/s 程度）</text>
  <text x="76" y="178" font-size="13" font-weight="700" fill="#1a3a5c">深部の地盤（数十〜3,000 m程度）</text>
  <text x="76" y="199" font-size="12" fill="#1a3a5c">長い周期を含む広い周期帯に影響</text>
  <path d="M76 222 H370" fill="none" stroke="#2e6da4" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="76" y="246" font-size="12" fill="#1a3a5c">下面が地震基盤（S波速度 約3 km/s）</text>

  <!-- 地震基盤: surface -->
  <rect x="20" y="262" width="360" height="60" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="76" y="286" font-size="13" font-weight="700" fill="#222">地震基盤</text>
  <text x="76" y="307" font-size="12" fill="#555">地盤の影響を受けにくい堅い岩盤</text>

  <!-- 揺れの伝わり方（太さ = 揺れの大きさ）: danger -->
  <path d="M46 316 L46 270" fill="none" stroke="#b22234" stroke-width="1.5" marker-end="url(#up-head)"/>
  <path d="M46 256 L46 130" fill="none" stroke="#b22234" stroke-width="3" marker-end="url(#up-head)"/>
  <path d="M46 116 L46 72" fill="none" stroke="#b22234" stroke-width="5" marker-end="url(#up-head)"/>
  <text x="46" y="342" text-anchor="middle" font-size="11" fill="#555">揺れ小</text>
  <text x="46" y="58" text-anchor="middle" font-size="11" fill="#555">揺れ大</text>

  <!-- 基本固有周期: warn -->
  <rect x="20" y="356" width="360" height="130" rx="6" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text x="200" y="378" text-anchor="middle" font-size="13" font-weight="700" fill="#1a3a5c">地盤の基本固有周期</text>
  <text x="200" y="398" text-anchor="middle" font-size="13" fill="#1a3a5c">T<tspan dy="3" font-size="11">G</tspan><tspan dy="-3"> = 4 × Σ（層厚 H ÷ S波速度 Vs）</tspan></text>
  <text x="200" y="418" text-anchor="middle" font-size="12" fill="#555">Σは地表面から耐震設計上の基盤面まで</text>
  <text x="200" y="442" text-anchor="middle" font-size="13" fill="#1a3a5c">厚く軟らかい層ほど、周期が長くなる</text>
  <text x="200" y="462" text-anchor="middle" font-size="13" fill="#1a3a5c">構造物の周期と近いと、共振しやすい</text>
  <text x="200" y="480" text-anchor="middle" font-size="12" fill="#555">道路橋の地盤種別（Ⅰ〜Ⅲ種）は、この周期で区分</text>
</svg>
