<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="水深が浅いほど津波の速さは落ち、湾口から湾奥へ水深が浅く幅が狭くなるほど波が集中して高くなる関係" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
  <defs>
    <marker id="wave-head" markerWidth="10" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,0 10,4.5 0,9" fill="#2e6da4"/>
    </marker>
  </defs>
  <rect width="400" height="500" fill="#ffffff"/>

  <!-- 上段: 水深ごとの伝わる速さ（棒の長さ = 速さ） -->
  <text x="20" y="30" font-size="12" fill="#555">水深ごとの伝わる速さ（v = √(g×水深)）</text>

  <!-- brand-fill / brand -->
  <text x="20" y="62" font-size="13" fill="#222">水深5,000 m</text>
  <rect x="116" y="46" width="150" height="22" rx="3" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="274" y="62" font-size="13" font-weight="700" fill="#1a3a5c">約800 km/h</text>

  <text x="20" y="96" font-size="13" fill="#222">水深200 m</text>
  <rect x="116" y="80" width="30" height="22" rx="3" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="154" y="96" font-size="13" font-weight="700" fill="#1a3a5c">約160 km/h</text>

  <text x="20" y="130" font-size="13" fill="#222">水深50 m</text>
  <rect x="116" y="114" width="15" height="22" rx="3" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="139" y="130" font-size="13" font-weight="700" fill="#1a3a5c">約80 km/h</text>

  <!-- warn-fill / warn: 海岸に近い浅い海 -->
  <text x="20" y="164" font-size="13" fill="#222">水深10 m</text>
  <rect x="116" y="148" width="7" height="22" rx="2" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text x="131" y="164" font-size="13" font-weight="700" fill="#1a3a5c">約36 km/h</text>

  <!-- 要点ボックス -->
  <rect x="20" y="186" width="360" height="58" rx="6" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text x="200" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#1a3a5c">浅くなると先頭が遅くなり、後ろが追いついて高くなる</text>
  <text x="200" y="231" text-anchor="middle" font-size="12" fill="#555">時速36 kmでも、走って逃げ切れる速さではない</text>

  <!-- 下段: 湾の形と波の集中（平面図） -->
  <text x="20" y="274" font-size="12" fill="#555">湾の形と波の集中（上から見た図）</text>

  <!-- 沖: brand-fill -->
  <rect x="20" y="284" width="360" height="40" fill="#e8f0fe"/>
  <text x="200" y="309" text-anchor="middle" font-size="12" fill="#1a3a5c">沖：深く、波は低くて速い</text>

  <!-- 陸: surface -->
  <rect x="20" y="324" width="360" height="142" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <text x="44" y="400" text-anchor="middle" font-size="11" fill="#8a8a8a">陸</text>
  <text x="356" y="400" text-anchor="middle" font-size="11" fill="#8a8a8a">陸</text>

  <!-- 湾（水面）: 湾口が広く、湾奥が狭い -->
  <polygon points="70,324 330,324 252,440 148,440" fill="#e8f0fe"/>
  <path d="M70,324 L148,440 L252,440 L330,324" fill="none" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="200" y="344" text-anchor="middle" font-size="12" fill="#1a3a5c">湾口：広い</text>

  <!-- 波が集まる向き -->
  <path d="M128,358 L172,418" fill="none" stroke="#2e6da4" stroke-width="2" marker-end="url(#wave-head)"/>
  <path d="M200,358 L200,418" fill="none" stroke="#2e6da4" stroke-width="2" marker-end="url(#wave-head)"/>
  <path d="M272,358 L228,418" fill="none" stroke="#2e6da4" stroke-width="2" marker-end="url(#wave-head)"/>

  <text x="200" y="458" text-anchor="middle" font-size="12" font-weight="700" fill="#1a3a5c">湾奥：狭く浅い → 波が集中して高くなる</text>

  <text x="200" y="488" text-anchor="middle" font-size="12" fill="#555">高さの目安：水深の1/4乗・湾幅の1/2乗に反比例</text>
</svg>
