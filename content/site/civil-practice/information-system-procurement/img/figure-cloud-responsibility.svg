<!-- authored 2026-10-16 doboku-note 自作。論点は NIST SP 800-145 の三つのサービスモデルの説明（本文の記述）。特定の図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="IaaS、PaaS、SaaSで、利用者が管理する範囲と事業者が管理する範囲を積み上げて比べた図。IaaSは利用者がデータ、アプリ、OSを管理する。PaaSはデータとアプリを管理する。SaaSは利用者がデータを管理し、アプリの設定は一部だけ。借りる範囲が広いほど責任の分かれ目は上へ移る。">
