<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="設計と施工の発注の三つの形を契約の線で比べた図。分離発注は発注者が設計者と施工者それぞれと契約し、ECIは施工者が設計段階で技術協力をしてから工事契約を結び、一括発注は設計と施工を一つの受注者に任せる" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
