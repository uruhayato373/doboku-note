<!-- authored 2026-10-15 doboku-note 自作。論点は労働安全衛生法第15条第3項・第30条第2項・第3項、労働安全衛生規則第643条。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="分離発注の現場で統括する人を発注者が指名する関係の図。発注者は請負人Aの同意を得て統括の措置を講ずる者に指名し、請負人Bの作業従事者も統括の対象になる。指名できないときは労働基準監督署長に届け出、指名がなければ署長が指名する。作業従事者が常時50人以上（ずい道等は30人以上）なら、統括安全衛生責任者を選任する。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 11px; fill: #555; }
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .s { font-size: 11px; fill: #555; }
      .bb { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .bp { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .bw { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .bd { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .bs { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .a { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .aw { stroke: #d4a017; stroke-width: 2; fill: none; }
      .ag { stroke: #555; stroke-width: 1.5; fill: none; }
      .ap { stroke: #3a7d44; stroke-width: 2; fill: none; }
    </style>
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
    <marker id="aw" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#d4a017"/></marker>
    <marker id="ap" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#3a7d44"/></marker>
    <marker id="ag" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  </defs>
  <rect class="bb" x="110" y="16" width="180" height="70" rx="8"/>
  <text class="n" x="200" y="56" text-anchor="middle">発注者</text>
  <rect class="bp" x="10" y="186" width="170" height="96" rx="8"/>
  <text class="n" x="95" y="226" text-anchor="middle">請負人A</text>
  <text class="t" x="95" y="248" text-anchor="middle">統括の措置を講ずる者</text>
  <rect class="bb" x="212" y="186" width="170" height="96" rx="8"/>
  <text class="n" x="297" y="226" text-anchor="middle">請負人B</text>
  <text class="s" x="297" y="248" text-anchor="middle">統括の措置の対象</text>
  <path class="ap" d="M130,86V184" marker-end="url(#ap)"/>
  <text class="t" x="138" y="140" text-anchor="start">同意を得て指名</text>
  <path class="ag" d="M270,86V184" marker-end="url(#ag)"/>
  <rect class="bp" x="10" y="382" width="170" height="96" rx="8"/>
  <text class="n" x="95" y="416" text-anchor="middle" style="font-size:12px">統括安全衛生責任者を選任</text>
  <text class="s" x="95" y="440" text-anchor="middle">常時50人以上</text>
  <text class="s" x="95" y="458" text-anchor="middle">（ずい道等は30人以上）</text>
  <path class="ap" d="M95,282V380" marker-end="url(#ap)"/>
  <text class="t" x="104" y="336" text-anchor="start">人数が基準以上</text>
  <rect class="bw" x="212" y="382" width="170" height="96" rx="8"/>
  <text class="n" x="297" y="416" text-anchor="middle">労働基準監督署長</text>
  <text class="s" x="297" y="440" text-anchor="middle">指名できないとき届出を受け</text>
  <text class="s" x="297" y="458" text-anchor="middle">指名がなければ署長が指名</text>
  <path class="aw" d="M290,51H391V356H297V380" marker-end="url(#aw)"/>
  <path class="aw" d="M212,430H196V234H181" marker-end="url(#aw)"/>
</svg>
