<!-- authored 2026-10-15 doboku-note 自作。論点は補助金等に係る予算の執行の適正化に関する法律第5条・第6条・第14条・第15条と、社会資本整備総合交付金交付要綱の第7〜第9。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="補助金は事業ごとに、交付金は計画ごとに動くことを比べた流れ図。補助金は申請、交付の決定、実績報告、額の確定の順。交付金は事業を計画に位置づけ、社会資本総合整備計画を提出し、毎年度交付を申請し、事業の進み具合で次年度の交付限度額を調整する。">
