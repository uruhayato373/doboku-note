  <rect class="b-b" x="204" y="92" width="182" height="30" rx="4"/>
  <text class="k" x="295" y="112" text-anchor="middle">支出（年割額）</text>
  <text class="s" x="14" y="146">数年度の総額と年割額を決めて支出する</text>
  <path d="M10,162H390" stroke="#d7d7d7" stroke-width="1" fill="none"/>
  <text class="t" x="14" y="186">繰越明許費</text>
  <text class="s" x="87" y="186">第213条</text>
  <rect class="b-b" x="300" y="171" width="86" height="22" rx="11"/>
  <text class="s" x="343" y="186" text-anchor="middle">予算で定める</text>
