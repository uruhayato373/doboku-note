  <rect class="b-b" x="204" y="308" width="130" height="30" rx="4"/>
  <text class="k" x="269" y="328" text-anchor="middle">支出</text>
  <text class="s" x="14" y="362">今年度の予算の金額を超える債務を契約で負う</text>
