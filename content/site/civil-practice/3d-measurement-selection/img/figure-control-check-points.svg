<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="UAV写真点群測量の標定点と検証点の配置の模式図と、位置精度ごとの配置間隔。作業地域の周囲に外側標定点を3点以上、内側に内側標定点を1点以上置き、標定点から離れた場所に検証点を均等に置く。検証点は標定点の総数の半数以上。位置精度0.05mは外側標定点の間隔100m以内・内側までの距離200m以内、0.10mは100m以内・400m以内、0.20mは200m以内・600m以内。">
