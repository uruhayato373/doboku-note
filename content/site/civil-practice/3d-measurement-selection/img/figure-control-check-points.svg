<!-- authored 2026-10-16 doboku-note 自作。論点は標定点（位置を与える計算に使う）と検証点（計算に使わず確かめる）の役目の違い、判定と再計算・再撮影の順。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="UAV写真点群測量の標定点と検証点の図。標定点は位置を与える計算に使い、検証点は計算に使わず確かめる。外側標定点は3点以上、内側標定点は1点以上、検証点は標定点の総数の半数以上。標定点の残差と検証点の較差がX・Y・Zすべてで位置精度以内か確かめ、満たさなければ不良な写真の除去と特徴点の修正で再計算し、それでも満たさなければ再撮影。">
  <defs>
  <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 11px; fill: #222; }
      .b { font-weight: bold; fill: #1a3a5c; }
      .m { fill: #555; }
      .t12 { font-size: 12px; }
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .pos { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .dng { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .sf { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .wh { fill: #fff; stroke: #2e6da4; stroke-width: 1.5; }
      .dash { fill: #fff; stroke: #555; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .grid { stroke: #d7d7d7; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .ax { stroke: #555; stroke-width: 1.5; fill: none; }
      .ar { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .ark { stroke: #555; stroke-width: 2; fill: none; }
  </style>
  <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  <marker id="ak" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  <marker id="as" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  <marker id="asg" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  </defs>
  <rect class="wh" x="10" y="8" width="380" height="214" rx="8"/>
  <rect x="40" y="46" width="320" height="168" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text class="m" x="46" y="208">作業地域</text>
  <text class="m" x="354" y="208" text-anchor="end">配置の模式図</text>
  <path d="M66,38H194" stroke="#555" stroke-width="1.2" fill="none" marker-start="url(#asg)" marker-end="url(#ak)"/>
  <text class="t12 b" x="130" y="30" text-anchor="middle">外側標定点の間隔</text>
  <polygon points="60,68 52,82 68,82" fill="#2e6da4" stroke="#1a3a5c" stroke-width="1"/>
  <polygon points="200,68 192,82 208,82" fill="#2e6da4" stroke="#1a3a5c" stroke-width="1"/>
  <polygon points="340,68 332,82 348,82" fill="#2e6da4" stroke="#1a3a5c" stroke-width="1"/>
  <polygon points="60,176 52,190 68,190" fill="#2e6da4" stroke="#1a3a5c" stroke-width="1"/>
  <polygon points="200,176 192,190 208,190" fill="#2e6da4" stroke="#1a3a5c" stroke-width="1"/>
  <polygon points="340,176 332,190 348,190" fill="#2e6da4" stroke="#1a3a5c" stroke-width="1"/>
  <rect x="193" y="123" width="14" height="14" fill="#3a7d44" stroke="#1a3a5c" stroke-width="1"/>
  <circle cx="130" cy="104" r="7" fill="#d4a017" stroke="#1a3a5c" stroke-width="1"/>
  <circle cx="270" cy="104" r="7" fill="#d4a017" stroke="#1a3a5c" stroke-width="1"/>
  <circle cx="130" cy="156" r="7" fill="#d4a017" stroke="#1a3a5c" stroke-width="1"/>
  <circle cx="270" cy="156" r="7" fill="#d4a017" stroke="#1a3a5c" stroke-width="1"/>
  <path d="M214,123V82" stroke="#2e6da4" stroke-width="2" fill="none" marker-start="url(#asg)" marker-end="url(#ak)"/>
  <text class="t12 b" x="224" y="128">内側から外側</text>
  <text class="t12 b" x="224" y="142">までの距離</text>
  <rect class="sf" x="10" y="230" width="380" height="76" rx="8"/>
  <polygon points="26,244 18,258 34,258" fill="#2e6da4" stroke="#1a3a5c" stroke-width="1"/>
  <text class="t12 b" x="44" y="257">標定点</text>
  <text class="t12" x="96" y="257">位置を与える計算に使う</text>
  <circle cx="26" cy="284" r="7" fill="#d4a017" stroke="#1a3a5c" stroke-width="1"/>
  <text class="t12 b" x="44" y="289">検証点</text>
  <text class="t12" x="96" y="289">計算に使わず、確かめる</text>
  <text class="m" x="20" y="321">外側標定点3点以上・内側1点以上・検証点は標定点の半数以上</text>
  <rect class="brand" x="10" y="334" width="380" height="44" rx="8"/>
  <text class="t12" x="200.0" y="352.0" text-anchor="middle">標定点の残差と検証点の較差が</text>
  <text class="t12" x="200.0" y="368.0" text-anchor="middle">X・Y・Zすべてで位置精度以内か</text>
  <path class="ar" d="M200,378V398" marker-end="url(#ah)"/>
  <text class="m" x="210" y="392">満たさない</text>
  <rect class="warn" x="10" y="400" width="380" height="36" rx="8"/>
  <text class="t12" x="200.0" y="422.0" text-anchor="middle">不良な写真の除去と特徴点の修正で再計算</text>
  <path class="ar" d="M200,436V454" marker-end="url(#ah)"/>
  <text class="m" x="210" y="450">それでも満たさない</text>
  <rect class="dng" x="10" y="456" width="380" height="34" rx="8"/>
  <text class="t12 b" x="200.0" y="477.0" text-anchor="middle">再撮影</text>
</svg>
