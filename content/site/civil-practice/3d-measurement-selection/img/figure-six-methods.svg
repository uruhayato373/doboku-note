<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="準則の六つの3次元計測の方式を、計測する場所で並べた図。空からは航空レーザ測量、UAVレーザ測量、UAV写真点群測量。地上からは地上レーザ測量。車両からは車載写真レーザ測量。水域は航空レーザ測深測量。各方式の標準の点密度と精度を添える。">
  <defs>
  <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 11px; fill: #555; }
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .s { font-size: 11px; fill: #555; }
      .m { font-size: 11px; fill: #8a8a8a; }
      .p { fill: #fff; stroke: #d7d7d7; stroke-width: 1.5; }
      .bb { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .bp { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .bw { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .bd { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .bs { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .a { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .ln { stroke: #8a8a8a; stroke-width: 1; fill: none; }
  </style>
  <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  <marker id="at" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  </defs>
<rect class="bb" x="10" y="8" width="380" height="22" rx="6"/>
  <text class="t" x="20" y="24">空から（航空機・UAV）</text>
  <rect class="p" x="10" y="34" width="380" height="56" rx="6"/>
  <text class="n" x="20" y="52">航空レーザ測量</text>
  <text class="s" x="20" y="68" style="fill:#222">地図情報レベル500〜5000</text>
  <text class="s" x="20" y="83" style="fill:#222">点密度は1点/0.25㎡以上から1点/25㎡以上まで</text>
  <rect class="p" x="10" y="94" width="380" height="56" rx="6"/>
  <text class="n" x="20" y="112">UAVレーザ測量</text>
  <text class="s" x="20" y="128" style="fill:#222">レベル500：400点/㎡以上、水平0.15m・標高0.2m以内</text>
  <text class="s" x="20" y="143" style="fill:#222">レベル1000：100点/㎡以上、水平0.3m・標高0.3m以内</text>
  <rect class="p" x="10" y="154" width="380" height="42" rx="6"/>
  <text class="n" x="20" y="172">UAV写真点群測量</text>
  <text class="s" x="20" y="188" style="fill:#222">位置精度は0.05m・0.10m・0.20m以内</text>
  <rect class="bp" x="10" y="206" width="380" height="22" rx="6"/>
  <text class="t" x="20" y="222">地上から（据え置き）</text>
  <rect class="p" x="10" y="232" width="380" height="56" rx="6"/>
  <text class="n" x="20" y="250">地上レーザ測量</text>
  <text class="s" x="20" y="266" style="fill:#222">変位の比較では、較差の許容5mmで点間隔250mm、</text>
  <text class="s" x="20" y="281" style="fill:#222">10mmで500mm（放射方向）</text>
  <rect class="bw" x="10" y="298" width="380" height="22" rx="6"/>
  <text class="t" x="20" y="314">車両から（道路とその周辺）</text>
  <rect class="p" x="10" y="324" width="380" height="56" rx="6"/>
  <text class="n" x="20" y="342">車載写真レーザ測量（MMS）</text>
  <text class="s" x="20" y="358" style="fill:#222">UAVレーザ測量と同じ値</text>
  <text class="s" x="20" y="373" style="fill:#222">レベル500：400点/㎡以上、レベル1000：100点/㎡以上</text>
  <rect class="bb" x="10" y="390" width="380" height="22" rx="6"/>
  <text class="t" x="20" y="406">水域（河川とその周辺の陸域）</text>
  <rect class="p" x="10" y="416" width="380" height="56" rx="6"/>
  <text class="n" x="20" y="434">航空レーザ測深測量</text>
  <text class="s" x="20" y="450" style="fill:#222">陸部・水底の標高とも標準偏差0.3m以内</text>
  <text class="s" x="20" y="465" style="fill:#222">水質で測深できない場合、水底には適用しない</text>
  <text class="m" x="20" y="490">数値は準則の標準値。成果が違う数値は並べて比べない</text>
</svg>
