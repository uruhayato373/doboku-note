<!-- authored 2026-10-16 doboku-note 自作。論点は準則の六つの方式を計測する場所で並べ、方式ごとの向く場面と注意する場面を示す。数値は本文の表に任せる。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="準則の六つの3次元計測の方式を、計測する場所で並べた図。空からは航空レーザ測量、UAVレーザ測量、UAV写真点群測量。地上からは地上レーザ測量。車両からは車載写真レーザ測量。水域は航空レーザ測深測量。方式ごとに向く場面と注意する場面を一行ずつ書く。">
  <defs>
  <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 11px; fill: #222; }
      .b { font-weight: bold; fill: #1a3a5c; }
      .m { fill: #555; }
      .t12 { font-size: 12px; }
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .pos { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .dng { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .sf { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .wh { fill: #fff; stroke: #2e6da4; stroke-width: 1.5; }
      .dash { fill: #fff; stroke: #555; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .grid { stroke: #d7d7d7; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .ax { stroke: #555; stroke-width: 1.5; fill: none; }
      .ar { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .ark { stroke: #555; stroke-width: 2; fill: none; }
  </style>
  <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  <marker id="ak" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  <marker id="as" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  <marker id="asg" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  </defs>
  <rect class="brand" x="10" y="8" width="380" height="20" rx="6"/>
  <text class="t12 b" x="20" y="23">空から（航空機・UAV）</text>
  <rect class="wh" x="10" y="30" width="380" height="52" rx="6"/>
  <text class="t12 b" x="20" y="47">航空レーザ測量</text>
  <text class="t12" x="20" y="63">向く: 広い範囲</text>
  <text class="m" x="20" y="77">注意: 格子の標高データを作る前提の点密度</text>
  <rect class="wh" x="10" y="84" width="380" height="52" rx="6"/>
  <text class="t12 b" x="20" y="101">UAVレーザ測量</text>
  <text class="t12" x="20" y="117">向く: 植生の下の地表も狙う</text>
  <text class="m" x="20" y="131">注意: 植生の影響が大きいと点密度を2倍にする</text>
  <rect class="wh" x="10" y="138" width="380" height="52" rx="6"/>
  <text class="t12 b" x="20" y="155">UAV写真点群測量</text>
  <text class="t12" x="20" y="171">向く: 裸地など対象物が写る区域</text>
  <text class="m" x="20" y="185">注意: 写らない草木の下の地面は復元できない</text>
  <rect class="pos" x="10" y="192" width="380" height="20" rx="6"/>
  <text class="t12 b" x="20" y="207">地上から（据え置き）</text>
  <rect class="wh" x="10" y="214" width="380" height="52" rx="6"/>
  <text class="t12 b" x="20" y="231">地上レーザ測量</text>
  <text class="t12" x="20" y="247">向く: 狭い範囲を高密度に</text>
  <text class="m" x="20" y="261">注意: 変位の比較は較差の許容を先に決める</text>
  <rect class="sf" x="10" y="268" width="380" height="20" rx="6"/>
  <text class="t12 b" x="20" y="283">車両から（道路とその周辺）</text>
  <rect class="wh" x="10" y="290" width="380" height="52" rx="6"/>
  <text class="t12 b" x="20" y="307">車載写真レーザ測量（MMS）</text>
  <text class="t12" x="20" y="323">向く: 道路とその周辺</text>
  <text class="m" x="20" y="337">注意: 所定の精度が得られる範囲にとどめる</text>
  <rect class="brand" x="10" y="344" width="380" height="20" rx="6"/>
  <text class="t12 b" x="20" y="359">水域（河川とその周辺の陸域）</text>
  <rect class="wh" x="10" y="366" width="380" height="52" rx="6"/>
  <text class="t12 b" x="20" y="383">航空レーザ測深測量</text>
  <text class="t12" x="20" y="399">向く: 水域と、その周辺の陸域</text>
  <text class="m" x="20" y="413">注意: 濁りで水底が測れない場合がある</text>
  <rect class="warn" x="10" y="430" width="380" height="50" rx="8"/>
  <text class="t12 b" x="200.0" y="450.0" text-anchor="middle">数値は本文の表に任せる</text>
  <text class="t12" x="200.0" y="468.0" text-anchor="middle">数値の大小だけで方式を比べない</text>
</svg>
