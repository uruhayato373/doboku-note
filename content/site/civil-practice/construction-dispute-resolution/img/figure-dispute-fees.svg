<!-- authored 2026-10-16 doboku-note 自作。数値は国土交通省の費用の案内の算出表からの計算値（本文の記載どおり）。棒の長さは円額に比例 -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="請求額ごとの申請手数料の棒グラフ。750万5,000円はあっせん21,765円、調停42,275円、仲裁105,060円。1,000万円はあっせん25,500円、調停48,500円、仲裁120,000円。5,000万円はあっせん73,000円、調停148,500円、仲裁360,000円。仲裁がいちばん高い。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 12px; fill: #222; }
