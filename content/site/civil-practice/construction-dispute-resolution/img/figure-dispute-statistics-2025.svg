  <text class="tn" x="190.3793103448276" y="93" text-anchor="middle">28</text>
  <rect class="b-warn" x="235.3" y="70" width="54.5" height="36"/>
  <text class="tn" x="262.5344827586207" y="93" text-anchor="middle">17</text>
