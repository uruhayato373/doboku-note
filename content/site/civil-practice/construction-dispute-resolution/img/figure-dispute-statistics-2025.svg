  <rect class="b-wh" x="373.2" y="228" width="12.8" height="36"/>
  <rect class="b-brand" x="14" y="271" width="13" height="13" rx="2"/>
  <text class="tx" x="34" y="282">建築　84件</text>
  <rect class="b-warn" x="204" y="271" width="13" height="13" rx="2"/>
  <text class="tx" x="224" y="282">土木　15件</text>
  <rect class="b-pos" x="14" y="293" width="13" height="13" rx="2"/>
  <text class="tx" x="34" y="304">設備　11件</text>
  <rect class="b-sur" x="204" y="293" width="13" height="13" rx="2"/>
  <text class="tx" x="224" y="304">電気　2件</text>
  <rect class="b-wh" x="14" y="315" width="13" height="13" rx="2"/>
  <text class="tx" x="34" y="326">その他　4件</text>
  <rect class="b-warn" x="14" y="372" width="372" height="74" rx="6"/>
  <text class="tt" x="200.0" y="405.9" text-anchor="middle">土木工事は 15件 ÷ 116件 ＝ 13％</text>
  <text class="ts" x="200.0" y="421.9" text-anchor="middle">全国の申請116件のうち、土木工事の割合</text>
  <text class="ts" x="14" y="478">出典：中央建設工事紛争審査会の取扱状況（令和7年度）</text>
