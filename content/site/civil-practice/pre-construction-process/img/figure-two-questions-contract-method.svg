<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="入札契約方式を読む二つの問い。競争に参加できる者は一般競争、指名競争、随意契約、落札者の選び方は価格競争、総合評価、技術提案・交渉に分かれる図" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
  <rect width="400" height="500" fill="#ffffff"/>
  <g font-size="13" font-weight="700" fill="#555">
    <text x="16" y="24">競争に参加できる者</text>
    <text x="16" y="246">落札者の選び方</text>
  </g>
  <text x="200" y="224" font-size="16" font-weight="700" fill="#555" text-anchor="middle">×</text>
  <g stroke-width="1.5">
    <g fill="#e8f0fe" stroke="#2e6da4">
      <rect x="16" y="34" width="124" height="50" rx="6"/>
      <rect x="16" y="92" width="124" height="50" rx="6"/>
      <rect x="16" y="150" width="124" height="50" rx="6"/>
    </g>
    <g fill="#fff3cd" stroke="#d4a017">
      <rect x="16" y="256" width="124" height="50" rx="6"/>
      <rect x="16" y="314" width="124" height="50" rx="6"/>
      <rect x="16" y="372" width="124" height="50" rx="6"/>
    </g>
    <g fill="#f5f5f5" stroke="#d7d7d7">
      <rect x="148" y="34" width="236" height="50" rx="6"/>
      <rect x="148" y="92" width="236" height="50" rx="6"/>
      <rect x="148" y="150" width="236" height="50" rx="6"/>
      <rect x="148" y="256" width="236" height="50" rx="6"/>
      <rect x="148" y="314" width="236" height="50" rx="6"/>
      <rect x="148" y="372" width="236" height="50" rx="6"/>
      <rect x="16" y="436" width="368" height="50" rx="6"/>
    </g>
  </g>
  <g font-size="13" font-weight="700" fill="#1a3a5c">
    <text x="28" y="64">一般競争入札</text>
    <text x="28" y="122">指名競争入札</text>
    <text x="28" y="180">随意契約</text>
    <text x="28" y="286">価格競争</text>
    <text x="28" y="344">総合評価</text>
    <text x="28" y="402">技術提案・交渉</text>
  </g>
  <g font-size="12" fill="#222">
    <text x="160" y="56">資格要件を満たし、</text>
    <text x="160" y="74">参加を申し込んだ者</text>
    <text x="160" y="114">発注者が指名した</text>
    <text x="160" y="132">複数の者</text>
    <text x="160" y="172">競争によらず、発注者が</text>
    <text x="160" y="190">特定した者と契約</text>
    <text x="160" y="278">予定価格の範囲で</text>
    <text x="160" y="296">最も低い価格の者</text>
    <text x="160" y="336">価格以外の要素も</text>
    <text x="160" y="354">点数化して総合評価</text>
    <text x="160" y="394">提案を審査し、交渉で</text>
    <text x="160" y="412">仕様と価格を確定</text>
  </g>
  <g font-size="12" fill="#555" text-anchor="middle">
    <text x="200" y="456">国土交通省直轄工事の多くは</text>
    <text x="200" y="474">一般競争と総合評価の組合せ</text>
  </g>
</svg>
