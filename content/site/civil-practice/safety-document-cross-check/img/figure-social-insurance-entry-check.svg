<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="下請の選定時、再下請負通知書、作業員名簿の三段で社会保険の加入を確かめ、作業員の加入を確認できなければ原則として現場に入れない流れを示した図" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
<defs><marker id="a" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker><marker id="b" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#d4a017"/></marker></defs>
<g stroke-width="1.5"><rect x="30" y="20" width="336" height="64" rx="8" fill="#e8f0fe" stroke="#2e6da4"/><rect x="30" y="112" width="336" height="64" rx="8" fill="#e8f0fe" stroke="#2e6da4"/><rect x="30" y="204" width="336" height="64" rx="8" fill="#e8f0fe" stroke="#2e6da4"/><rect x="30" y="296" width="336" height="46" rx="8" fill="#fff3cd" stroke="#d4a017"/><rect x="30" y="368" width="160" height="52" rx="6" fill="#d0e8d0" stroke="#3a7d44"/><rect x="206" y="368" width="160" height="52" rx="6" fill="#f8d7da" stroke="#b22234"/><rect x="30" y="442" width="336" height="46" rx="6" fill="#fff3cd" stroke="#d4a017"/></g>
<g fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#a)"><path d="M198 84V110"/><path d="M198 176V202"/><path d="M198 268V294"/><path d="M110 342V366"/><path d="M286 342V366"/></g>
<path d="M286 420V440" fill="none" stroke="#d4a017" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#b)"/>
<g text-anchor="middle" fill="#222" font-weight="700" font-size="14"><text x="198" y="46">① 下請の選定時（会社）</text><text x="198" y="138">② 再下請負通知書（会社）</text><text x="198" y="230">③ 作業員名簿（新規入場者ごと）</text><text x="198" y="324">作業員の加入を確認できたか</text></g>
<g text-anchor="middle" fill="#1a3a5c" font-size="12"><text x="198" y="68">CCUSの登録内容などで確認。未加入なら選ばない</text><text x="198" y="160">「健康保険等の加入状況」欄で確認。未加入は指導</text><text x="198" y="252">社会保険欄の空欄、国保・国民年金を点検</text></g>
<g text-anchor="middle" fill="#222" font-size="13" font-weight="700"><text x="110" y="391">確認できた</text><text x="286" y="391">確認できない</text></g>
<g text-anchor="middle" fill="#1a3a5c" font-size="12"><text x="110" y="409">入場を認める</text><text x="286" y="409">原則、入場を認めない</text></g>
<g text-anchor="middle" fill="#222"><text x="198" y="462" font-size="12" font-weight="700">例外は次の三つに限る</text><text x="198" y="479" font-size="11">特殊な技能が要る／加入手続き中／災害時の緊急対応</text></g>
</svg>
