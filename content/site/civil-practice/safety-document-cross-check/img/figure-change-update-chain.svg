<g font-size="11" fill="#555"><circle cx="30" cy="392" r="6" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/><text x="42" y="396">更新する</text><path d="M120 392H134" stroke="#8a8a8a" stroke-width="1.5"/><text x="142" y="396">変わらない</text></g>
<g text-anchor="middle" fill="#222"><text x="200" y="430" font-size="12" font-weight="700">直す順番は、写し元から先に</text><text x="200" y="452" font-size="11">通知書（二次以下の変更）→ 台帳 → 体系図の順に直す</text><text x="200" y="470" font-size="11">名簿は、入場前に資格と社会保険まで確かめる</text></g>
</svg>
