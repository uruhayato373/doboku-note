<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="新規の下請、作業員の交代、下請の技術者の交代、工期や工事内容の変更のそれぞれで、再下請負通知書、施工体制台帳、施工体系図、作業員名簿のどれを更新するかを示した表" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
<g stroke-width="1.5"><rect x="20" y="20" width="360" height="52" rx="6" fill="#e8f0fe" stroke="#2e6da4"/><rect x="20" y="406" width="360" height="74" rx="8" fill="#f5f5f5" stroke="#d7d7d7"/></g>
<path d="M20 148H380M20 224H380M20 300H380M20 376H380M150 20V376M206 20V376M262 20V376M318 20V376" stroke="#d7d7d7"/>
<g text-anchor="middle" font-size="11" font-weight="700" fill="#1a3a5c"><text x="178" y="44">再下請負</text><text x="178" y="60">通知書</text><text x="234" y="44">施工体制</text><text x="234" y="60">台帳</text><text x="290" y="44">施工</text><text x="290" y="60">体系図</text><text x="346" y="44">作業員</text><text x="346" y="60">名簿</text></g>
<g font-size="12" font-weight="700" fill="#222"><text x="28" y="116">新規の下請が入る</text><text x="28" y="192">作業員の交代・追加</text><text x="28" y="268">下請の技術者が交代</text><text x="28" y="336">工期・工事内容</text><text x="28" y="352">が変わる</text></g>
<g stroke="#3a7d44" stroke-width="1.5" fill="#d0e8d0"><circle cx="178" cy="110" r="10"/><circle cx="234" cy="110" r="10"/><circle cx="290" cy="110" r="10"/><circle cx="346" cy="110" r="10"/><circle cx="178" cy="186" r="10"/><circle cx="234" cy="186" r="10"/><circle cx="346" cy="186" r="10"/><circle cx="178" cy="262" r="10"/><circle cx="234" cy="262" r="10"/><circle cx="290" cy="262" r="10"/><circle cx="346" cy="262" r="10"/><circle cx="178" cy="338" r="10"/><circle cx="234" cy="338" r="10"/><circle cx="290" cy="338" r="10"/></g>
