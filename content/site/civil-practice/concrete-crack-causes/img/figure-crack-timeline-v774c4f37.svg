<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
     style="max-width:400px;width:100%"
     role="img"
     aria-label="コンクリートのひび割れを発生時期、主な原因、典型的な位置、処置の窓で切り分けた図。上は数時間で進行が止まり、下は年単位で進行する。時間の目盛りは対数風">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-summary { font-size: 11px; fill: #555; } /* ink-body */
      .t-axis { font-size: 11px; font-weight: bold; fill: #555; } /* ink-body */
      .t-field { font-size: 11px; fill: #555; } /* ink-body */
      .t-value { font-size: 13px; font-weight: bold; fill: #222; } /* ink-strong */
      .box-brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; } /* brand-fill / brand */
      .box-warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; } /* warn-fill / warn */
      .box-danger { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; } /* danger-fill / danger */
      .box-surface { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; } /* surface / token-border */
      .axis-band { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1; } /* surface / token-border */
      .axis-line { fill: none; stroke: #555; stroke-width: 2; } /* ink-body */
      .dot-brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 2; } /* brand-fill / brand */
      .dot-warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 2; } /* warn-fill / warn */
      .dot-danger { fill: #f8d7da; stroke: #b22234; stroke-width: 2; } /* danger-fill / danger */
      .arrow-ink { fill: #555; } /* ink-body */
    </style>
    <marker id="time-arrow" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon class="arrow-ink" points="0,0 8,3.5 0,7"/>
    </marker>
  </defs>

  <text class="t-summary" x="20" y="18">上は数時間で進行が止まり、下は年単位で進行する</text>
  <rect class="axis-band" x="20" y="28" width="64" height="400" rx="8"/>
  <text class="t-axis" x="52" y="46" text-anchor="middle">時間</text>
  <line class="axis-line" x1="52" y1="54" x2="52" y2="420" marker-end="url(#time-arrow)"/>
  <rect class="box-brand" x="85" y="34" width="295" height="90" rx="8"/>
  <circle class="dot-brand" cx="52" cy="74" r="8"/>
  <rect x="24" y="87" width="56" height="17" fill="#f5f5f5"/>
  <text class="t-field" x="52" y="100" text-anchor="middle">数時間</text>
  <text class="t-field" x="100" y="54">発生時期</text>
  <text class="t-value" x="190" y="54">打込み後数時間</text>
  <text class="t-field" x="100" y="74">主な原因</text>
  <text class="t-value" x="190" y="74">沈下</text>
  <text class="t-field" x="100" y="94">典型的な位置</text>
  <text class="t-value" x="190" y="94">鉄筋・型枠沿い</text>
  <text class="t-field" x="100" y="114">処置の窓</text>
  <text class="t-value" x="190" y="114">凝結が終わる前にタンピング</text>
  <rect class="box-brand" x="85" y="132" width="295" height="90" rx="8"/>
  <circle class="dot-brand" cx="52" cy="172" r="8"/>
  <rect x="24" y="185" width="56" height="17" fill="#f5f5f5"/>
  <text class="t-field" x="52" y="198" text-anchor="middle">数日</text>
  <text class="t-field" x="100" y="152">発生時期</text>
  <text class="t-value" x="190" y="152">数日〜2週間</text>
  <text class="t-field" x="100" y="172">主な原因</text>
  <text class="t-value" x="190" y="172">温度応力</text>
  <text class="t-field" x="100" y="192">典型的な位置</text>
  <text class="t-value" x="190" y="192">部材中央・等間隔</text>
  <text class="t-field" x="100" y="212">処置の窓</text>
  <text class="t-value" x="190" y="212">貫通の有無を確認する</text>
  <rect class="box-warn" x="85" y="230" width="295" height="90" rx="8"/>
  <circle class="dot-warn" cx="52" cy="270" r="8"/>
  <rect x="24" y="283" width="56" height="17" fill="#f5f5f5"/>
  <text class="t-field" x="52" y="296" text-anchor="middle">数か月</text>
  <text class="t-field" x="100" y="250">発生時期</text>
  <text class="t-value" x="190" y="250">数週間〜数か月</text>
  <text class="t-field" x="100" y="270">主な原因</text>
  <text class="t-value" x="190" y="270">乾燥収縮</text>
  <text class="t-field" x="100" y="290">典型的な位置</text>
  <text class="t-value" x="190" y="290">開口部・隅角部</text>
  <text class="t-field" x="100" y="310">処置の窓</text>
  <text class="t-value" x="190" y="310">幅が安定してから塗布・注入</text>
  <rect class="box-danger" x="85" y="328" width="295" height="90" rx="8"/>
  <circle class="dot-danger" cx="52" cy="368" r="8"/>
  <rect x="24" y="381" width="56" height="17" fill="#f5f5f5"/>
  <text class="t-field" x="52" y="394" text-anchor="middle">数年</text>
  <text class="t-field" x="100" y="348">発生時期</text>
  <text class="t-value" x="190" y="348">数年〜数十年</text>
  <text class="t-field" x="100" y="368">主な原因</text>
  <text class="t-value" x="190" y="368">劣化（塩害等）</text>
  <text class="t-field" x="100" y="388">典型的な位置</text>
  <text class="t-value" x="190" y="388">鉄筋沿い・錆汁</text>
  <text class="t-field" x="100" y="408">処置の窓</text>
  <text class="t-value" x="190" y="408">記録して専門調査へ</text>
  <rect class="box-surface" x="20" y="436" width="360" height="52" rx="6"/>
  <text class="t-summary" x="200" y="456" text-anchor="middle">時間の目盛りは対数風（時間→日→月→年）</text>
  <text class="t-summary" x="200" y="474" text-anchor="middle">境界は目安で、部材厚・養生条件で前後する</text>
</svg>
