<!-- authored 2026-10-16 doboku-note 自作。論点は、スランプの許容差を外れたときの再試験と受入れ拒否の分岐（記事本文の扱いのみ）。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="スランプ試験の判定の流れ。許容差内なら受入れ。外れたらその場で1回に限り再試験し、内なら受入れ、再び外れたら受入れを拒否してそのアジテータ車は使わない。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 13px; fill: #222; }
      .hd { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .in { font-size: 13px; font-weight: bold; fill: #1a3a5c; text-anchor: middle; }
      .lb { font-size: 12px; fill: #555; }
      .yn { font-size: 12px; font-weight: bold; fill: #2e6da4; }
      .pos { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .brd { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .wrn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .dng { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .sf { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .ar { stroke: #2e6da4; stroke-width: 2.5; fill: none; }
    </style>
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  </defs>
  <rect class="brd" x="30" y="14" width="200" height="48" rx="8"/><text class="in" x="130" y="44">荷卸し地点で試験</text>
  <path class="ar" d="M130,62V92" marker-end="url(#ah)"/>
  <polygon class="sf" points="130,96 230,142 130,188 30,142"/>
  <text class="in" x="130" y="146">許容差内か</text>
  <path class="ar" d="M230,142H280" marker-end="url(#ah)"/><text class="yn" x="236" y="132">はい</text>
  <rect class="pos" x="284" y="120" width="106" height="44" rx="8"/><text class="in" x="337" y="147">受入れ</text>
  <path class="ar" d="M130,188V224" marker-end="url(#ah)"/><text class="yn" x="140" y="212">いいえ</text>
  <rect class="wrn" x="30" y="228" width="200" height="56" rx="8"/><text class="in" x="130" y="253">その場で1回に限り</text><text class="in" x="130" y="272">再試験</text>
  <path class="ar" d="M130,284V312" marker-end="url(#ah)"/>
  <polygon class="sf" points="130,316 230,362 130,408 30,362"/>
  <text class="in" x="130" y="366">許容差内か</text>
  <path class="ar" d="M230,362H280" marker-end="url(#ah)"/><text class="yn" x="236" y="352">はい</text>
  <rect class="pos" x="284" y="340" width="106" height="44" rx="8"/><text class="in" x="337" y="367">受入れ</text>
  <path class="ar" d="M130,408V438" marker-end="url(#ah)"/><text class="yn" x="140" y="430">いいえ</text>
  <rect class="dng" x="30" y="442" width="360" height="48" rx="8"/><text class="in" x="210" y="462">受入れを拒否する</text><text class="in" x="210" y="480">そのアジテータ車は打込みに使わない</text>
</svg>
