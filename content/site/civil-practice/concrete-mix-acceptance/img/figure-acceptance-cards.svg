<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
     style="max-width:400px;width:100%"
     role="img"
     aria-label="生コン受入れ検査の流れ。納入書を指定と突合したあと、スランプ・空気量・塩化物イオン量を荷卸し地点で試験し、圧縮強度は供試体を採取して後日の結果を待つ。外れたときの扱いも示す。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-title { font-size: 14px; font-weight: bold; fill: #222; }
      .t-label { font-size: 12px; fill: #555; }
      .t-num   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .box-brand    { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-warn     { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-pos      { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .head-brand   { fill: #2e6da4; }
      .head-warn    { fill: #d4a017; }
      .head-pos     { fill: #3a7d44; }
    </style>
  </defs>

  <rect class="box-pos" x="15" y="8" width="370" height="74" rx="8"/>
  <rect class="head-pos" x="15" y="8" width="8" height="74" rx="4"/>
  <text class="t-title" x="35" y="30">0 納入書を指定と突合する</text>
  <text class="t-num" x="35" y="51">呼び強度・スランプ・空気量の指定値</text>
  <text class="t-num" x="35" y="69">最大寸法・セメントの種類・練混ぜ時刻</text>

  <rect class="box-brand" x="15" y="89" width="370" height="82" rx="8"/>
  <rect class="head-brand" x="15" y="89" width="8" height="82" rx="4"/>
  <text class="t-title" x="35" y="111">① スランプ（またはスランプフロー）</text>
  <text class="t-num" x="35" y="132">荷卸し地点で試験。許容差は指定値により ±1.0〜±2.5cm</text>
  <text class="t-label" x="35" y="150">外れたら：その場で1回再試験。再び外れたら受入れ拒否</text>

  <rect class="box-brand" x="15" y="178" width="370" height="82" rx="8"/>
  <rect class="head-brand" x="15" y="178" width="8" height="82" rx="4"/>
  <text class="t-title" x="35" y="200">② 空気量</text>
  <text class="t-num" x="35" y="221">荷卸し地点で試験。普通 4.5%±1.5% ／ 軽量 5.0%±1.5%</text>
  <text class="t-label" x="35" y="239">過不足のどちらも品質を落とす。範囲に収めるのが目的</text>

  <rect class="box-brand" x="15" y="267" width="370" height="82" rx="8"/>
  <rect class="head-brand" x="15" y="267" width="8" height="82" rx="4"/>
  <text class="t-title" x="35" y="289">③ 塩化物イオン量</text>
  <text class="t-num" x="35" y="310">荷卸し地点で試験。原則 0.30kg/m³以下</text>
  <text class="t-label" x="35" y="328">購入者の承認があれば 0.60kg/m³以下まで（例外）</text>

  <rect class="box-warn" x="15" y="356" width="370" height="98" rx="8"/>
  <rect class="head-warn" x="15" y="356" width="8" height="98" rx="4"/>
  <text class="t-title" x="35" y="378">④ 圧縮強度</text>
  <text class="t-label" x="35" y="399">採取：150m³ごとまたは1日1回、1回に3個</text>
  <text class="t-num" x="35" y="417">1回の結果（3個平均）が呼び強度の85%以上、</text>
  <text class="t-num" x="35" y="435">かつ3回の平均が呼び強度以上</text>

  <text class="t-label" x="200" y="477" text-anchor="middle">①〜③はその場で異常の兆候を捉える役割</text>
  <text class="t-label" x="200" y="497" text-anchor="middle">④だけは打込み後にしか結果が出ない</text>
</svg>
