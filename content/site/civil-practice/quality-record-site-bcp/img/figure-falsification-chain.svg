<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="記録の偽装に進む流れ（圧力、黙認、改ざん、発覚）と、それぞれの段階を断つ手立て" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker></defs>
<rect width="400" height="500" fill="#ffffff"/>
<g stroke-width="1.5">
<rect x="12" y="14" width="170" height="28" rx="6" fill="#f5f5f5" stroke="#d7d7d7"/>
<rect x="218" y="14" width="170" height="28" rx="6" fill="#f5f5f5" stroke="#d7d7d7"/>
<rect x="12" y="52" width="170" height="78" rx="8" fill="#fff3cd" stroke="#d4a017"/>
<rect x="12" y="150" width="170" height="78" rx="8" fill="#fff3cd" stroke="#d4a017"/>
<rect x="12" y="248" width="170" height="78" rx="8" fill="#f8d7da" stroke="#b22234"/>
<rect x="12" y="346" width="170" height="78" rx="8" fill="#f8d7da" stroke="#b22234"/>
<rect x="218" y="52" width="170" height="78" rx="8" fill="#d0e8d0" stroke="#3a7d44"/>
<rect x="218" y="150" width="170" height="78" rx="8" fill="#d0e8d0" stroke="#3a7d44"/>
<rect x="218" y="248" width="170" height="78" rx="8" fill="#d0e8d0" stroke="#3a7d44"/>
<rect x="218" y="346" width="170" height="78" rx="8" fill="#d0e8d0" stroke="#3a7d44"/>
<rect x="12" y="438" width="376" height="50" rx="8" fill="#f5f5f5" stroke="#d7d7d7"/>
<g stroke="#2e6da4">
<line x1="97" y1="131" x2="97" y2="148" marker-end="url(#ar)"/>
<line x1="97" y1="229" x2="97" y2="246" marker-end="url(#ar)"/>
<line x1="97" y1="327" x2="97" y2="344" marker-end="url(#ar)"/>
<line x1="212" y1="91" x2="188" y2="91" marker-end="url(#ar)"/>
<line x1="212" y1="189" x2="188" y2="189" marker-end="url(#ar)"/>
<line x1="212" y1="287" x2="188" y2="287" marker-end="url(#ar)"/>
<line x1="212" y1="385" x2="188" y2="385" marker-end="url(#ar)"/>
</g>
</g>
<g fill="#222" font-size="12" font-weight="700" text-anchor="middle">
<text x="97" y="33">偽装に進む流れ</text>
<text x="303" y="33">流れを断つ手立て</text>
</g>
<g fill="#222" font-size="13" font-weight="700">
<text x="22" y="76">圧力が重なる</text>
<text x="22" y="174">黙って済ませる</text>
<text x="22" y="272">記録を偽る</text>
<text x="22" y="370">あとで発覚する</text>
<text x="228" y="76">協議で解く</text>
<text x="228" y="174">補完を決めておく</text>
<text x="228" y="272">第三者と原本</text>
<text x="228" y="370">引渡し前に見る</text>
</g>
<g fill="#555" font-size="12">
<text x="22" y="95">工期・費用・受注方針の</text>
<text x="22" y="112">重圧が現場にかかる</text>
<text x="22" y="193">取り損ね・規格外を</text>
<text x="22" y="210">報告せず任せきりに</text>
<text x="22" y="291">データ流用・虚偽の</text>
<text x="22" y="308">検査報告や完成図書</text>
<text x="22" y="389">引渡し後の別工事や</text>
<text x="22" y="406">再調査で初めて判明</text>
<text x="228" y="95">工程・費用の無理は</text>
<text x="228" y="112">設計変更で協議する</text>
<text x="228" y="193">取れない時の手立てを</text>
<text x="228" y="210">着工前に決めておく</text>
<text x="228" y="291">検査会社は元請が契約</text>
<text x="228" y="308">改ざん検知つきの記録</text>
<text x="228" y="389">段階確認と抜き打ち</text>
<text x="228" y="406">立会で実物を確かめる</text>
</g>
<g fill="#555" font-size="11">
<text x="22" y="459">書類だけを順に確かめる仕組みでは、</text>
<text x="22" y="476">実物を見る人が途中で不在になる</text>
</g>
</svg>
