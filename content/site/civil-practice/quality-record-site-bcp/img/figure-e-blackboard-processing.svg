<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="電子小黒板の撮影時の電子的記入と、撮影後の画像編集を対比した図" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
<rect width="400" height="500" fill="#ffffff"/>
<g stroke-width="1.5">
<rect x="12" y="14" width="180" height="32" rx="6" fill="#d0e8d0" stroke="#3a7d44"/>
<rect x="208" y="14" width="180" height="32" rx="6" fill="#f8d7da" stroke="#b22234"/>
<rect x="12" y="58" width="180" height="84" rx="8" fill="#d0e8d0" stroke="#3a7d44"/>
<rect x="12" y="154" width="180" height="84" rx="8" fill="#d0e8d0" stroke="#3a7d44"/>
<rect x="12" y="250" width="180" height="84" rx="8" fill="#d0e8d0" stroke="#3a7d44"/>
<rect x="208" y="58" width="180" height="84" rx="8" fill="#f8d7da" stroke="#b22234"/>
<rect x="208" y="154" width="180" height="84" rx="8" fill="#f8d7da" stroke="#b22234"/>
<rect x="208" y="250" width="180" height="84" rx="8" fill="#f8d7da" stroke="#b22234"/>
<rect x="12" y="350" width="376" height="138" rx="8" fill="#f5f5f5" stroke="#d7d7d7"/>
<line x1="24" y1="414" x2="376" y2="414" stroke="#d7d7d7" stroke-width="1"/>
</g>
<g fill="#222" font-size="13" font-weight="700" text-anchor="middle">
<text x="102" y="35">認められる処理と条件</text>
<text x="298" y="35">認められない処理（例）</text>
</g>
<g fill="#222" font-size="13" font-weight="700">
<text x="22" y="84">撮影と同時に記録</text>
<text x="22" y="180">改ざん検知を備える</text>
<text x="22" y="276">納品時に確認する</text>
<text x="218" y="84">あとから書き足す</text>
<text x="218" y="180">あとで画像を変える</text>
<text x="218" y="276">あとで差し替える</text>
<text x="24" y="382">写真編集は認めない（原則）</text>
</g>
<g fill="#555" font-size="12">
<text x="22" y="106">工種・測点・寸法・略図を</text>
<text x="22" y="124">画像と一緒に残す</text>
<text x="22" y="202">検知機能を持つ</text>
<text x="22" y="220">機器・ソフトで撮る</text>
<text x="22" y="298">信憑性チェックの結果を</text>
<text x="22" y="316">監督職員へ提出する</text>
<text x="218" y="106">黒板の事項を撮影後に</text>
<text x="218" y="124">画像へ書き込む</text>
<text x="218" y="202">明るさ・色の変更や</text>
<text x="218" y="220">切り抜きを行う</text>
<text x="218" y="298">別の画像と合成する、</text>
<text x="218" y="316">写真を入れ替える</text>
<text x="24" y="402">例外は小黒板情報の電子的記入だけ</text>
</g>
<g fill="#555" font-size="11">
<text x="24" y="436">右の列は編集の例示で、基準は中身を列挙していない</text>
<text x="24" y="456">矢印・印は例外に書かれておらず、付け方を着工前に協議する</text>
</g>
</svg>
