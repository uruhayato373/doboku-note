<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="災害協定にもとづく出動の流れ。平常時に協定を結んで備え、予兆から発災直後に要請を受けて出動し、着工後に積算して契約する" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker></defs>
<rect width="400" height="500" fill="#ffffff"/>
<g stroke-width="1.5">
<rect x="12" y="14" width="170" height="28" rx="6" fill="#f5f5f5" stroke="#d7d7d7"/>
<rect x="218" y="14" width="170" height="28" rx="6" fill="#f5f5f5" stroke="#d7d7d7"/>
<rect x="12" y="70" width="170" height="80" rx="8" fill="#e8f0fe" stroke="#2e6da4"/>
<rect x="218" y="70" width="170" height="80" rx="8" fill="#d0e8d0" stroke="#3a7d44"/>
<rect x="12" y="188" width="170" height="80" rx="8" fill="#e8f0fe" stroke="#2e6da4"/>
<rect x="218" y="188" width="170" height="80" rx="8" fill="#d0e8d0" stroke="#3a7d44"/>
<rect x="12" y="306" width="170" height="80" rx="8" fill="#e8f0fe" stroke="#2e6da4"/>
<rect x="218" y="306" width="170" height="80" rx="8" fill="#d0e8d0" stroke="#3a7d44"/>
<rect x="12" y="404" width="376" height="84" rx="8" fill="#f5f5f5" stroke="#d7d7d7"/>
<g stroke="#2e6da4">
<line x1="188" y1="102" x2="212" y2="102" marker-end="url(#ar)"/>
<line x1="212" y1="118" x2="188" y2="118" marker-end="url(#ar)"/>
<line x1="188" y1="228" x2="212" y2="228" marker-end="url(#ar)"/>
<line x1="212" y1="346" x2="188" y2="346" marker-end="url(#ar)"/>
</g>
</g>
<g fill="#222" font-size="12" font-weight="700" text-anchor="middle">
<text x="97" y="33">発注者（国・自治体）</text>
<text x="303" y="33">協会・会員企業</text>
</g>
<g fill="#1a3a5c" font-size="12" font-weight="700">
<text x="12" y="62">1　平常時</text>
<text x="12" y="180">2　予兆・発災後</text>
<text x="12" y="298">3　出動のあと</text>
</g>
<g fill="#222" font-size="13" font-weight="700">
<text x="22" y="96">災害協定を結ぶ</text>
<text x="228" y="96">備蓄と体制を整える</text>
<text x="22" y="214">出動を要請する</text>
<text x="228" y="214">手配して出動する</text>
<text x="22" y="332">着工後に契約する</text>
<text x="228" y="332">応急工事を進める</text>
</g>
<g fill="#555" font-size="12">
<text x="22" y="116">出動・費用負担・</text>
<text x="22" y="134">訓練などを定める</text>
<text x="228" y="116">連絡体制・BCP策定・</text>
<text x="228" y="134">備蓄状況の報告</text>
<text x="22" y="234">待機・巡回・現地</text>
<text x="22" y="252">出動を求める</text>
<text x="228" y="234">人員・資機材を集め</text>
<text x="228" y="252">現地へ向かう</text>
<text x="22" y="352">設計・積算で予定価格</text>
<text x="22" y="370">を作り、書面で契約</text>
<text x="228" y="352">道路啓開・がれき撤去</text>
<text x="228" y="370">などで被害を抑える</text>
</g>
<g fill="#555" font-size="11">
<text x="22" y="426">協定にもとづく出動のほかに、日常の維持工事の枠でも</text>
<text x="22" y="444">応急対応は行われる。いずれかの実績がある企業は約88%</text>
<text x="22" y="462">（国土交通省の調査、直近10年、回答988社）</text>
</g>
</svg>
