  <path d="M30,370.0 C43.7,370.0 95.3,374.0 112,370.0 C128.7,366.0 124.3,357.5 130,346.0 C135.7,334.5 142.0,309.0 146,301.0 C150.0,293.0 150.3,297.0 154,298.0 C157.7,299.0 155.0,305.5 168,307.0 C181.0,308.5 219.0,308.5 232,307.0 C245.0,305.5 242.3,299.0 246,298.0 C249.7,297.0 250.0,293.0 254,301.0 C258.0,309.0 264.3,334.5 270,346.0 C275.7,357.5 271.0,366.0 288,370.0 C305.0,374.0 358.0,370.0 372,370.0" fill="none" stroke="#3a7d44" stroke-width="2.5" />
  <path d="M20,426.0 H46" stroke="#b22234" stroke-width="2.5" />
  <text x="54" y="430.0" class="">予熱なし・急冷：HAZが硬化し割れやすい</text>
  <path d="M20,450.0 H46" stroke="#3a7d44" stroke-width="2.5" />
  <text x="54" y="454.0" class="">予熱あり・徐冷：硬化が抑えられ水素が抜ける</text>
</svg>
