<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="溶接金属と熱影響部と母材の断面、およびその硬さ分布で、予熱なしだと熱影響部が硬化し予熱ありだと抑えられることを示す概念図">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; fill: #1a3a5c; font-size: 12px; }
      .h { font-size: 13px; font-weight: bold; }
      .s { font-size: 12px; fill: #555; }
      .m { text-anchor: middle; }
      .e { text-anchor: end; }
      .big { font-size: 24px; font-weight: bold; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .positive { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .danger { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .surface { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .axis { fill: none; stroke: #555; stroke-width: 1.5; }
      .guide { fill: none; stroke: #d7d7d7; stroke-width: 1; stroke-dasharray: 3 3; }
      .arrow { fill: none; stroke: #2e6da4; stroke-width: 2; marker-end: url(#arrow); }
    </style>
    <!-- brand / positive / warn / danger / surface tokens -->
    <marker id="arrow" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4" /></marker>
  </defs>
  <rect width="400" height="500" fill="#ffffff" />
  <text x="20" y="26" class="s">溶接線に直交する断面と硬さの分布</text>
  <rect class="surface" x="30" y="56" width="100" height="64" />
  <rect class="danger" x="130" y="56" width="24" height="64" />
  <rect class="warn" x="154" y="56" width="92" height="64" />
  <rect class="danger" x="246" y="56" width="24" height="64" />
  <rect class="surface" x="270" y="56" width="100" height="64" />
  <text x="80" y="48" class="m">母材</text>
  <text x="142" y="48" class="m">HAZ</text>
  <text x="200" y="48" class="m">溶接金属</text>
  <text x="258" y="48" class="m">HAZ</text>
  <text x="320" y="48" class="m">母材</text>
  <text x="200" y="140" class="s m">HAZ（熱影響部）は溶けないが、熱で組織が変わる部分</text>
  <path class="guide" d="M130,120 V128" />
  <path class="guide" d="M130,156 V370.0" />
  <path class="guide" d="M154,120 V128" />
  <path class="guide" d="M154,156 V370.0" />
  <path class="guide" d="M246,120 V128" />
  <path class="guide" d="M246,156 V370.0" />
  <path class="guide" d="M270,120 V128" />
  <path class="guide" d="M270,156 V370.0" />
  <path class="axis" d="M30,156 V370.0 H372" />
  <text x="36" y="172" class="s">硬さ</text>
  <text x="372" y="390.0" class="s e">溶接線に直交する位置</text>
  <path d="M30,274.0 H372" fill="none" stroke="#d4a017" stroke-width="1.5" stroke-dasharray="6 4" />
  <text x="326" y="250.0" class="s m">仕様で定める</text>
  <text x="326" y="265.0" class="s m">硬さの上限</text>
