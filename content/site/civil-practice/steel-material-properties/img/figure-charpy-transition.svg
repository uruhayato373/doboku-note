<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="温度が下がると吸収エネルギーが急に低下し脆性破面率が増える遷移曲線。試験温度では規定値を満たしても使用最低温度では下回りうることを示す図">
