<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="炭素量と温度から組織を読む簡略化したFe-C状態図と、室温で現れる三つの組織">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; fill: #1a3a5c; font-size: 12px; }
      .h { font-weight: bold; }
      .s { font-size: 11px; fill: #555; }
      .m { text-anchor: middle; }
      .e { text-anchor: end; }
      .brand { fill: #e8f0fe; }
      .positive { fill: #d0e8d0; }
      .warn { fill: #fff3cd; }
      .card { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .line { fill: none; stroke: #222; stroke-width: 2; }
      .num { fill: #ffffff; stroke: #2e6da4; stroke-width: 1.5; }
    </style>
    <!-- brand / positive / warn / surface tokens -->
  </defs>
  <rect width="400" height="500" fill="#ffffff" />
  <text x="20" y="40" class="s">温度（℃）</text>
  <text x="366" y="40" class="s e">液相側は省略</text>
  <polygon class="brand" points="60,165 172,239 354,71 354,50 60,50" />
  <polygon class="warn" points="60,165 172,239 63,239" />
  <polygon class="warn" points="172,239 354,71 354,239" />
  <polygon class="positive" points="63,239 354,239 354,290 60,290" />
  <polyline class="line" points="60,165 172,239 354,71" />
  <path d="M63,239 H354" fill="none" stroke="#b22234" stroke-width="1.5" />
  <path d="M60,50 V290 H354" fill="none" stroke="#555" stroke-width="1.5" />
  <circle cx="172" cy="239" r="4" fill="#b22234" />
  <text x="70" y="88" class="h">オーステナイト（γ・fcc）</text>
  <text x="70" y="106" class="s">炭素を約2.1%まで固溶</text>
  <text x="92" y="229" class="s m">α+γ</text>
  <text x="278" y="204" class="s m">γ+セメンタイト</text>
  <text x="207" y="269" class="m">フェライト+セメンタイト</text>
  <text x="142" y="203" class="s h">A3</text>
  <text x="318" y="132" class="s h">Acm</text>
  <text x="350" y="233" class="s h e">A1 727℃</text>
  <text x="54" y="169" class="s e">912</text>
  <text x="54" y="243" class="s e">727</text>
  <text x="60" y="312" class="s m">0</text>
  <text x="172" y="312" class="s m">0.8（共析点）</text>
  <text x="354" y="312" class="s m">2.1</text>
  <text x="207" y="330" class="s m">炭素量（質量%）</text>
  <text x="20" y="330" class="s">α＝フェライト（bcc）</text>
  <circle class="num" cx="88" cy="290" r="9" />
  <circle class="num" cx="172" cy="290" r="9" />
  <circle class="num" cx="270" cy="290" r="9" />
  <text x="88" y="294" class="s h m">1</text>
  <text x="172" y="294" class="s h m">2</text>
  <text x="270" y="294" class="s h m">3</text>
  <rect class="card" x="20" y="346" width="360" height="40" />
  <circle class="num" cx="40" cy="366" r="10" />
  <text x="40" y="370" class="s h m">1</text>
  <text x="60" y="363" class="h">C 約0.2%：フェライトにパーライトが混じる</text>
  <text x="60" y="379" class="s">構造用圧延鋼材の範囲。よく伸び、溶接しやすい</text>
  <rect class="card" x="20" y="394" width="360" height="40" />
  <circle class="num" cx="40" cy="414" r="10" />
  <text x="40" y="418" class="s h m">2</text>
  <text x="60" y="411" class="h">C 約0.8%：全体がパーライト（共析鋼）</text>
  <text x="60" y="427" class="s">層状の組織。強いが、伸びは小さい</text>
  <rect class="card" x="20" y="442" width="360" height="40" />
  <circle class="num" cx="40" cy="462" r="10" />
  <text x="40" y="466" class="s h m">3</text>
  <text x="60" y="459" class="h">C 0.8%超：パーライトにセメンタイトが加わる</text>
  <text x="60" y="475" class="s">硬くて脆い。構造用の圧延鋼材では使わない範囲</text>
</svg>
