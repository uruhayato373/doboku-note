<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="鋼材記号SM490YBを材質・強度・降伏点・衝撃値の区分に分解し、数字が引張強さか降伏点かは規格で異なることを示す図">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; fill: #1a3a5c; font-size: 12px; }
      .h { font-size: 13px; font-weight: bold; }
      .s { font-size: 12px; fill: #555; }
      .m { text-anchor: middle; }
      .e { text-anchor: end; }
      .big { font-size: 24px; font-weight: bold; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .positive { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .danger { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .surface { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .axis { fill: none; stroke: #555; stroke-width: 1.5; }
      .guide { fill: none; stroke: #d7d7d7; stroke-width: 1; stroke-dasharray: 3 3; }
      .arrow { fill: none; stroke: #2e6da4; stroke-width: 2; marker-end: url(#arrow); }
    </style>
    <!-- brand / positive / warn / danger / surface tokens -->
    <marker id="arrow" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4" /></marker>
  </defs>
  <rect width="400" height="500" fill="#ffffff" />
  <rect class="brand" x="20" y="20" width="84" height="56" rx="6" />
  <text x="62" y="58" class="big m">SM</text>
  <rect class="positive" x="112" y="20" width="84" height="56" rx="6" />
  <text x="154" y="58" class="big m">490</text>
  <rect class="warn" x="204" y="20" width="84" height="56" rx="6" />
  <text x="246" y="58" class="big m">Y</text>
  <rect class="danger" x="296" y="20" width="84" height="56" rx="6" />
  <text x="338" y="58" class="big m">B</text>
  <rect class="surface" x="20" y="96" width="360" height="48" rx="6" />
  <rect class="brand" x="20" y="96" width="8" height="48" rx="3" />
  <text x="40" y="116" class="h">SM　溶接構造用圧延鋼材</text>
  <text x="40" y="134" class="s">JIS G 3106。溶接を前提に成分を規定</text>
  <rect class="surface" x="20" y="150" width="360" height="48" rx="6" />
  <rect class="positive" x="20" y="150" width="8" height="48" rx="3" />
  <text x="40" y="170" class="h">490　引張強さの下限</text>
  <text x="40" y="188" class="s">490〜610 N/mm²の範囲で保証</text>
  <rect class="surface" x="20" y="204" width="360" height="48" rx="6" />
  <rect class="warn" x="20" y="204" width="8" height="48" rx="3" />
  <text x="40" y="224" class="h">Y　降伏点を高めた系列</text>
  <text x="40" y="242" class="s">SM490Yは厚さ16mm以下で365 N/mm²以上</text>
  <rect class="surface" x="20" y="258" width="360" height="62" rx="6" />
  <rect class="danger" x="20" y="258" width="8" height="62" rx="3" />
  <text x="40" y="278" class="h">B　衝撃値の区分（A・B・C）</text>
  <text x="40" y="296" class="s">A は規定なし、B は0℃で27J以上</text>
  <text x="40" y="313" class="s">C は0℃で47J以上（厚さ12mm超）</text>
  <text x="20" y="352" class="h">数字の意味は規格ごとに違う</text>
  <rect class="brand" x="20" y="364" width="360" height="56" rx="6" />
  <text x="34" y="389" class="h">SM490・SKK400</text>
  <text x="34" y="409" class="s">数字は引張強さの下限（N/mm²）</text>
  <rect class="warn" x="20" y="432" width="360" height="56" rx="6" />
  <text x="34" y="457" class="h">SY295・SYW295</text>
  <text x="34" y="477" class="s">数字は降伏点の下限（N/mm²）</text>
</svg>
