<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="環境アセスメントの核となる流れ。調べる、公表する、意見を聴く、計画を見直す、を段階ごとに繰り返し、許認可の審査と評価書どおりの実施につなぐ図" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="400" height="500" fill="#ffffff"/>

  <g stroke-width="1.5">
    <rect x="20" y="20" width="240" height="64" rx="6" fill="#e8f0fe" stroke="#2e6da4"/>
    <rect x="20" y="110" width="240" height="64" rx="6" fill="#e8f0fe" stroke="#2e6da4"/>
    <rect x="20" y="200" width="240" height="64" rx="6" fill="#fff3cd" stroke="#d4a017"/>
    <rect x="20" y="290" width="240" height="64" rx="6" fill="#e8f0fe" stroke="#2e6da4"/>
    <rect x="20" y="380" width="360" height="64" rx="6" fill="#d0e8d0" stroke="#3a7d44"/>
  </g>
  <rect x="20" y="456" width="360" height="32" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>

  <g font-size="14" font-weight="700" fill="#1a3a5c">
    <text x="36" y="46">調べる</text>
    <text x="36" y="136">公表する</text>
    <text x="36" y="226">意見を聴く</text>
    <text x="36" y="316">計画を見直す</text>
    <text x="36" y="406">許認可で審査され、評価書どおりに実施</text>
  </g>
  <g font-size="12" fill="#555">
    <text x="36" y="68">調査・予測・評価を事業者が行う</text>
    <text x="36" y="158">図書を縦覧し、説明会を開く</text>
    <text x="36" y="248">住民・自治体・国が意見を述べる</text>
    <text x="36" y="338">位置・規模・措置の内容を直す</text>
    <text x="36" y="428">確定した評価書の記載が、事業者の実施義務になる</text>
    <text x="200" y="477" text-anchor="middle">この一巡を、五つの手続きの中で段階ごとに行う</text>
  </g>

  <g stroke="#2e6da4" stroke-width="1.5" fill="none" marker-end="url(#ar)">
    <line x1="140" y1="88" x2="140" y2="106"/>
    <line x1="140" y1="178" x2="140" y2="196"/>
    <line x1="140" y1="268" x2="140" y2="286"/>
    <line x1="140" y1="358" x2="140" y2="376"/>
    <path d="M260 322 H290 V52 H264"/>
  </g>
  <g font-size="11" fill="#555">
    <text x="298" y="182">段階ごとに</text>
    <text x="298" y="198">繰り返す</text>
  </g>
</svg>
