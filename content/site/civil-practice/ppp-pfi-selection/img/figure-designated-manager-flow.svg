  <rect class="bw" x="10" y="406" width="290" height="46" rx="8"/>
  <text class="n" x="155" y="426" text-anchor="middle">指定の取消し・業務の停止</text>
  <text class="s" x="155" y="442" text-anchor="middle">第11項</text>
