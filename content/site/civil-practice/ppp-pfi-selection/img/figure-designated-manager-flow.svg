  <text class="n" x="155" y="103.5" text-anchor="middle">募集</text>
  <path class="a" d="M155.0,122V140" marker-end="url(#ah)"/>
  <rect class="bb" x="10" y="142" width="290" height="46" rx="8"/>
  <text class="n" x="155" y="169.5" text-anchor="middle">選定</text>
  <path class="a" d="M155.0,188V206" marker-end="url(#ah)"/>
  <rect class="bb" x="10" y="208" width="290" height="46" rx="8"/>
  <text class="n" x="155" y="228" text-anchor="middle">議会の議決</text>
  <text class="s" x="155" y="244" text-anchor="middle">第6項</text>
  <path class="a" d="M155.0,254V272" marker-end="url(#ah)"/>
  <rect class="bp" x="10" y="274" width="290" height="46" rx="8"/>
  <text class="n" x="155" y="294" text-anchor="middle">期間を定めて指定</text>
  <text class="s" x="155" y="310" text-anchor="middle">第5項</text>
