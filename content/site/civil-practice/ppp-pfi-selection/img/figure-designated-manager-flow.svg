  <rect class="bw" x="10" y="340" width="290" height="46" rx="8"/>
  <text class="n" x="155" y="360" text-anchor="middle">事業報告書・報告の徴収</text>
  <text class="s" x="155" y="376" text-anchor="middle">第7項・第10項</text>
