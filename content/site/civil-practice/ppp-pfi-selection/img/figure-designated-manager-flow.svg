<!-- authored 2026-10-15 doboku-note 自作。論点は地方自治法第244条の2（指定管理者）第4項〜第11項。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="指定管理者の指定手続の流れ図。条例の整備、募集、選定、議会の議決、期間を定めた指定の順に進み、指定のあとは事業報告書の提出と報告の徴収、不適当なときは指定の取消しや業務の停止に進む。">
  <defs>
