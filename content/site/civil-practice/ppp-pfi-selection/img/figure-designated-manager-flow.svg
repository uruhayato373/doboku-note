      .t { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .s { font-size: 11px; fill: #555; }
      .bb { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .bp { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .bw { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .bd { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .bs { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .a { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .aw { stroke: #d4a017; stroke-width: 2; fill: none; }
      .ag { stroke: #555; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
    <marker id="aw" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#d4a017"/></marker>
    <marker id="ag" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  </defs>
  <rect class="bb" x="10" y="10" width="290" height="46" rx="8"/>
  <text class="n" x="155" y="30" text-anchor="middle">条例の整備</text>
  <text class="s" x="155" y="46" text-anchor="middle">第4項</text>
