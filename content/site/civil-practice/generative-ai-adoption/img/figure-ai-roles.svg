  <text class="l" x="122" y="31">決めること</text>
  <text x="122" y="47">使う目的・責任者・予算</text>
  <text class="l2" x="122" y="64">資料</text>
  <text x="154" y="64">AI事業者ガイドライン</text>
  <text x="154" y="80">第2部E（第1.2版・令和8年3月31日）</text>
  <rect class="card" x="10" y="102" width="380" height="84" rx="8"/>
  <rect x="18" y="110" width="92" height="68" rx="6" style="fill:#d0e8d0;stroke:#3a7d44;stroke-width:1.5"/>
  <text class="n" x="64" y="143" text-anchor="middle">推進者</text>
  <text class="s" x="64" y="161" text-anchor="middle">社内</text>
  <text class="l" x="122" y="125">決めること</text>
  <text x="122" y="141">社内ルール・教育・評価</text>
  <text class="l2" x="122" y="158">資料</text>
  <text x="154" y="158">AI事業者ガイドライン</text>
  <text x="154" y="174">第5部（利用者の事項）</text>
  <rect class="card" x="10" y="196" width="380" height="84" rx="8"/>
  <rect x="18" y="204" width="92" height="68" rx="6" style="fill:#fff3cd;stroke:#d4a017;stroke-width:1.5"/>
  <text class="n" x="64" y="237" text-anchor="middle">承認者</text>
