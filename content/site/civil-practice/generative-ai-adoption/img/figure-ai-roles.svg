  <rect x="18" y="298" width="92" height="68" rx="6" style="fill:#f5f5f5;stroke:#8a8a8a;stroke-width:1.5"/>
  <text class="n" x="64" y="331" text-anchor="middle">発注者</text>
  <text class="s" x="64" y="349" text-anchor="middle">社外</text>
  <text class="l" x="122" y="305">求めること</text>
  <text x="122" y="321">利活用計画書と</text>
