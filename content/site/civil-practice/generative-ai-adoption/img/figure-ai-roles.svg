<!-- authored 2026-10-16 doboku-note 自作。論点は建設会社が生成AIを導入するときの、経営者・推進者・承認者・発注者・サービス提供者それぞれが決めることと確かめる資料。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="生成AI導入で誰が何を決めるかの図。経営者は使う目的と責任者と予算、推進者は社内ルールと教育と評価、承認者は書類ごとの出力の承認、発注者は利活用計画書と成果物への明示、サービス提供者は利用規約と想定範囲を決める。それぞれ確かめる資料を添えた。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 12px; fill: #222; }
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .s { font-size: 11px; fill: #555; }
      .l, .l2 { font-size: 11px; font-weight: bold; fill: #2e6da4; }
      .card { fill: #fff; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
  </defs>
  <rect class="card" x="10" y="8" width="380" height="84" rx="8"/>
  <rect x="18" y="16" width="92" height="68" rx="6" style="fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5"/>
