<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="生成AI導入で誰が何を決めるかの図。社内は経営者、推進者、承認者が順に責任者の指名とルールの確認者でつながり、社外の発注者とサービス提供者には求める資料がある" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
  <defs><marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4"/></marker></defs>
  <text x="116" y="30" font-size="13" font-weight="700" fill="#222" text-anchor="middle">社内</text>
  <text x="311" y="30" font-size="13" font-weight="700" fill="#222" text-anchor="middle">社外</text>
  <rect x="10" y="40" width="212" height="100" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/> <!-- brand-fill / brand -->
  <text x="22" y="64" font-size="14" font-weight="700" fill="#222">経営者</text>
  <text x="22" y="84" font-size="12" fill="#1a3a5c">使う目的・責任者・予算</text>
  <text x="22" y="102" font-size="11" fill="#555">資料：ガイドライン第2部E</text>
  <rect x="10" y="170" width="212" height="100" rx="6" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/> <!-- positive -->
  <text x="22" y="194" font-size="14" font-weight="700" fill="#222">推進者</text>
  <text x="22" y="214" font-size="12" fill="#1a3a5c">社内ルール・教育・評価</text>
  <text x="22" y="232" font-size="11" fill="#555">資料：ガイドライン第5部</text>
  <rect x="10" y="300" width="212" height="100" rx="6" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/> <!-- warn -->
  <text x="22" y="324" font-size="14" font-weight="700" fill="#222">承認者</text>
  <text x="22" y="344" font-size="12" fill="#1a3a5c">書類ごとに出力を承認する</text>
  <text x="22" y="362" font-size="12" fill="#1a3a5c">使った本人とは別の人</text>
  <text x="22" y="380" font-size="11" fill="#555">資料：確かめた事実の記録</text>
  <path d="M50 142V168" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="60" y="160" font-size="11" fill="#555">責任者を指名</text>
  <path d="M50 272V298" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="60" y="290" font-size="11" fill="#555">ルールに確認者を書く</text>
  <rect x="232" y="40" width="158" height="150" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/> <!-- surface -->
  <text x="244" y="64" font-size="14" font-weight="700" fill="#222">発注者</text>
  <text x="244" y="84" font-size="12" fill="#1a3a5c">利活用計画書と</text>
  <text x="244" y="102" font-size="12" fill="#1a3a5c">成果物への明示を求める</text>
  <text x="244" y="120" font-size="11" fill="#555">資料：国土交通省の通知</text>
  <text x="244" y="138" font-size="11" fill="#555">対象は建設コンサルタント</text>
  <text x="244" y="156" font-size="11" fill="#555">業務等</text>
  <rect x="232" y="204" width="158" height="130" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/> <!-- surface -->
  <text x="244" y="228" font-size="14" font-weight="700" fill="#222">サービス提供者</text>
  <text x="244" y="248" font-size="12" fill="#1a3a5c">利用規約と想定範囲</text>
  <text x="244" y="266" font-size="12" fill="#1a3a5c">を示すよう求める</text>
  <text x="244" y="284" font-size="11" fill="#555">資料：利用規約、</text>
  <text x="244" y="302" font-size="11" fill="#555">プライバシーポリシー</text>
  <rect x="10" y="418" width="380" height="64" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/> <!-- brand-fill / brand -->
  <text x="24" y="442" font-size="12" fill="#1a3a5c">ガイドラインは、法的拘束力のない</text>
  <text x="24" y="462" font-size="12" fill="#1a3a5c">自主的な取組の指針</text>
</svg>
