  <text class="l" x="122" y="219">決めること</text>
  <text x="122" y="235">書類ごとに、出力を承認する</text>
  <text x="122" y="251">使った本人とは別の人</text>
  <text class="l2" x="122" y="268">資料</text>
  <text x="154" y="268">承認者が確かめた事実の記録</text>
