<!-- authored 2026-10-16 doboku-note 自作。論点は生成AI導入を広げる四つの段階と、AI事業者ガイドライン第2部Eの環境・リスク分析からの循環。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="生成AI導入の広げ方の図。運用のあとも再び環境・リスク分析へ戻る。推進者が習熟し、パイロットで試し、全社へ拡大し、自走して見直す四つの段階と、段階で決めるルール・教育・評価。下に、AI事業者ガイドライン第2部Eの環境・リスク分析、ゴール設定、システムデザイン、運用、評価の循環を重ねた。">
