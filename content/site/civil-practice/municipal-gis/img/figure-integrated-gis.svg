<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="統合型GISの構成図。庁内で共用する層では、行政区域・道路中心線・建物など16項目の共用空間データを背景の地図とし、その上に道路・下水道・都市計画・防災の主題データを重ねる。庁内の層には個人の権利に関わる情報や作業中の図面も入る。住民・事業者に見せる公開の層は、庁内の層から外に出してよいものだけを選び、精度と注意書きを添えて出す。">
  <defs>
  <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 11px; fill: #555; }
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .s { font-size: 11px; fill: #555; }
      .m { font-size: 11px; fill: #8a8a8a; }
      .p { fill: #fff; stroke: #d7d7d7; stroke-width: 1.5; }
      .bb { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .bp { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .bw { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .bd { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .bs { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .a { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .ln { stroke: #8a8a8a; stroke-width: 1; fill: none; }
  </style>
  <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  <marker id="at" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  </defs>
<rect class="bp" x="10" y="10" width="380" height="122" rx="8"/>
  <text class="n" x="22" y="34">公開の層</text><text class="s" x="92" y="34" style="fill:#1a3a5c">住民・事業者に見せる</text>
  <rect class="p" x="22" y="46" width="356" height="34" rx="6"/>
  <text class="t" x="34" y="68">庁内の層から、外に出してよいものだけを選ぶ</text>
  <rect class="p" x="22" y="88" width="356" height="34" rx="6"/>
  <text class="t" x="34" y="110">精度と注意書きを添えて出す</text>
  <path class="a" d="M60,184V140" marker-end="url(#ah)" style="stroke-width:2.5"/>
  <text class="t" x="72" y="166">選んで出す</text>
  <rect class="bs" x="10" y="190" width="380" height="300" rx="8"/>
  <text class="n" x="22" y="214">庁内で共用する層</text><text class="s" x="140" y="214">各部署が活用する</text>
  <text class="m" x="22" y="238">主題データ（業務ごとに重ねる）</text>
  <rect class="bb" x="22" y="246" width="174" height="42" rx="6"/>
  <text class="t" x="32" y="264">道路</text><text class="s" x="32" y="280">工事履歴など</text>
  <rect class="bb" x="204" y="246" width="174" height="42" rx="6"/>
  <text class="t" x="214" y="264">下水道</text><text class="s" x="214" y="280">管路の図面</text>
  <rect class="bb" x="22" y="294" width="174" height="42" rx="6"/>
  <text class="t" x="32" y="312">都市計画</text><text class="s" x="32" y="328">計画図</text>
  <rect class="bb" x="204" y="294" width="174" height="42" rx="6"/>
  <text class="t" x="214" y="312">防災</text><text class="s" x="214" y="328">ハザードマップ</text>
  <path class="a" d="M200,342V366" marker-end="url(#ah)" style="stroke-width:2.5"/>
  <text class="s" x="212" y="360">背景の地図の上に重ねる</text>
  <rect class="bw" x="22" y="372" width="356" height="56" rx="6"/>
  <text class="n" x="34" y="394">共用空間データ（背景の地図）</text>
  <text class="s" x="34" y="414">行政区域・道路中心線・建物など16項目</text>
  <rect class="bd" x="22" y="438" width="356" height="40" rx="6"/>
  <text class="s" x="34" y="456" style="fill:#1a3a5c">庁内の層には、個人の権利に関わる情報や</text>
  <text class="s" x="34" y="471" style="fill:#1a3a5c">作業中の図面も入る</text>
</svg>
