<!-- authored 2026-10-16 doboku-note 自作。論点は統合型GISの庁内の層（共用空間データの背景と主題データ）と公開の層、台帳の更新のきっかけ。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="統合型GISの構成図。庁内で共用する層では、行政区域・道路中心線・建物・標高など16項目の共用空間データを背景に、位置をキーに対応付けて道路・下水道・都市計画・防災の主題データを重ねる。台帳は工事の完成と点検・調査の結果が入ったとき更新する。公開の層は庁内の層から外に出してよいものだけを出す。">
  <defs>
  <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 11px; fill: #222; }
      .b { font-weight: bold; fill: #1a3a5c; }
      .m { fill: #555; }
      .t12 { font-size: 12px; }
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .pos { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .dng { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .sf { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .wh { fill: #fff; stroke: #2e6da4; stroke-width: 1.5; }
      .dash { fill: #fff; stroke: #555; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .grid { stroke: #d7d7d7; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .ax { stroke: #555; stroke-width: 1.5; fill: none; }
      .ar { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .ark { stroke: #555; stroke-width: 2; fill: none; }
  </style>
  <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  <marker id="ak" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  <marker id="as" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  <marker id="asg" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  </defs>
  <rect class="warn" x="10" y="10" width="380" height="122" rx="8"/>
  <text class="n" x="22" y="34">公開の層</text>
  <text class="m" x="92" y="34">住民・事業者に見せる</text>
  <rect class="wh" x="22" y="46" width="356" height="34" rx="8"/>
  <text class="t12" x="200.0" y="67.0" text-anchor="middle">庁内の層から、外に出してよいものだけを選ぶ</text>
  <rect class="wh" x="22" y="88" width="356" height="34" rx="8"/>
  <text class="t12" x="200.0" y="109.0" text-anchor="middle">精度と注意書きを添えて出す</text>
  <path class="ar" d="M60,184V140" marker-end="url(#ah)"/>
  <text class="t12" x="72" y="166">選んで出す</text>
  <rect class="sf" x="10" y="190" width="380" height="300" rx="8"/>
  <text class="n" x="22" y="214">庁内で共用する層</text>
  <text class="m" x="140" y="214">各部署が活用する</text>
  <text class="m" x="22" y="236">主題データ（業務ごとに重ねる）</text>
  <rect class="brand" x="22" y="244" width="174" height="36" rx="6"/>
  <text class="t12 b" x="32" y="259">道路</text>
  <text class="m" x="32" y="274">工事履歴など</text>
  <rect class="brand" x="204" y="244" width="174" height="36" rx="6"/>
  <text class="t12 b" x="214" y="259">下水道</text>
  <text class="m" x="214" y="274">管路の図面</text>
  <rect class="brand" x="22" y="284" width="174" height="36" rx="6"/>
  <text class="t12 b" x="32" y="299">都市計画</text>
  <text class="m" x="32" y="314">計画図</text>
  <rect class="brand" x="204" y="284" width="174" height="36" rx="6"/>
  <text class="t12 b" x="214" y="299">防災</text>
  <text class="m" x="214" y="314">ハザードマップ</text>
  <text class="m" x="22" y="336">台帳の更新: 工事の完成、点検・調査の結果が入ったとき</text>
  <path class="ar" d="M200,344V366" marker-end="url(#ah)"/>
  <text class="m" x="212" y="360">位置をキーに対応付ける</text>
  <rect class="wh" x="22" y="372" width="356" height="62" rx="6"/>
  <text class="n" x="34" y="392">共用空間データ（背景の地図）</text>
  <text class="m" x="34" y="410">行政区域・道路中心線・建物・標高など16項目</text>
  <text class="m" x="34" y="426">背景は各課が共用する</text>
  <rect class="dng" x="22" y="442" width="356" height="38" rx="6"/>
  <text class="m" x="34" y="458">庁内の層には、個人の権利に関わる情報や</text>
  <text class="m" x="34" y="473">作業中の図面も入る</text>
</svg>
