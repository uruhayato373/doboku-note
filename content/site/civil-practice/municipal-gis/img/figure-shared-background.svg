<!-- authored 2026-10-16 doboku-note 自作。論点は背景の地図を課ごとに別にした場合と、一つに揃えて各課の台帳を重ねた場合の違い。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="背景の地図を揃えない場合と揃えた場合の対比図。上は道路課・下水道課・都市計画課が別々の背景で、同じ道路が少しずつ違う位置に描かれる。下は共用の背景を一つ置き、三つの課の台帳を重ねると道路が一致する。">
  <defs>
  <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 11px; fill: #222; }
      .b { font-weight: bold; fill: #1a3a5c; }
      .m { fill: #555; }
      .t12 { font-size: 12px; }
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .pos { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .dng { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .sf { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .wh { fill: #fff; stroke: #2e6da4; stroke-width: 1.5; }
      .dash { fill: #fff; stroke: #555; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .grid { stroke: #d7d7d7; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .ax { stroke: #555; stroke-width: 1.5; fill: none; }
      .ar { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .ark { stroke: #555; stroke-width: 2; fill: none; }
  </style>
  <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  <marker id="ak" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  <marker id="as" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  <marker id="asg" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  </defs>
  <text class="t12 b" x="12" y="22">背景が課ごとに別</text>
  <rect class="sf" x="12" y="32" width="376" height="200" rx="8"/>
  <path d="M24,142 C120,88 250,192 376,116" stroke="#2e6da4" stroke-width="4" fill="none"/>
  <path d="M24,150 C120,96 250,200 376,124" stroke="#3a7d44" stroke-width="4" fill="none"/>
  <path d="M24,159 C120,105 250,209 376,133" stroke="#d4a017" stroke-width="4" fill="none"/>
  <rect x="24" y="47" width="14" height="8" fill="#2e6da4"/>
  <text class="m" x="44" y="56">道路課</text>
  <rect x="24" y="65" width="14" height="8" fill="#3a7d44"/>
  <text class="m" x="44" y="74">下水道課</text>
  <rect x="24" y="83" width="14" height="8" fill="#d4a017"/>
  <text class="m" x="44" y="92">都市計画課</text>
  <text class="t12 b" x="200" y="214" text-anchor="middle">同じ道路が、課によって少しずつ違う位置に描かれる</text>
  <text class="t12 b" x="12" y="266">背景を一つに揃える</text>
  <rect class="sf" x="12" y="276" width="376" height="150" rx="8"/>
  <path d="M24,370 C120,316 250,420 376,344" stroke="#555" stroke-width="9" fill="none" opacity="0.35"/>
  <path d="M24,370 C120,316 250,420 376,344" stroke="#2e6da4" stroke-width="2" fill="none" stroke-dasharray="22 18" stroke-dashoffset="0"/>
  <path d="M24,370 C120,316 250,420 376,344" stroke="#3a7d44" stroke-width="2" fill="none" stroke-dasharray="22 18" stroke-dashoffset="13"/>
  <path d="M24,370 C120,316 250,420 376,344" stroke="#d4a017" stroke-width="2" fill="none" stroke-dasharray="22 18" stroke-dashoffset="26"/>
  <rect class="wh" x="24" y="288" width="150" height="22" rx="6"/>
  <text class="b" x="99" y="303" text-anchor="middle">共用の背景（灰）</text>
  <text class="t12 b" x="200" y="414" text-anchor="middle">各課の台帳を背景に重ねると、道路が一致する</text>
  <rect class="warn" x="12" y="440" width="376" height="48" rx="8"/>
  <text class="t12 b" x="200.0" y="459.0" text-anchor="middle">背景を一つに揃え、各課の台帳をその上に重ねる</text>
  <text class="t12" x="200.0" y="477.0" text-anchor="middle">形が統合型の基本</text>
</svg>
