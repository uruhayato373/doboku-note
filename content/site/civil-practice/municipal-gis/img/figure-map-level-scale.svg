<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="法定の縮尺と地図情報レベルの対応図。地図情報レベル250から10000までの水平位置の標準偏差は0.12m・0.25m・0.70m・1.75m・3.50m・7.00m以内。下水道台帳の施設平面図1/500はレベル500、道路台帳の図面1/1,000以上はレベル1000、都市計画の計画図1/2,500以上はレベル2500に当たり、都市計画の総括図1/25,000以上は対応するレベルがない。">
  <defs>
  <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 11px; fill: #555; }
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .s { font-size: 11px; fill: #555; }
      .m { font-size: 11px; fill: #8a8a8a; }
      .p { fill: #fff; stroke: #d7d7d7; stroke-width: 1.5; }
      .bb { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .bp { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .bw { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .bd { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .bs { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .a { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .ln { stroke: #8a8a8a; stroke-width: 1; fill: none; }
  </style>
  <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  <marker id="at" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  </defs>
<text class="m" x="14" y="24">地図情報レベル</text>
  <text class="m" x="130" y="18">水平位置の</text><text class="m" x="130" y="32">標準偏差</text>
  <text class="m" x="226" y="24">台帳・図書の縮尺</text>
  <rect class="bb" x="10" y="42" width="108" height="48" rx="6"/>
  <text class="n" x="64" y="72" text-anchor="middle">250</text>
  <rect class="p" x="122" y="42" width="96" height="48" rx="6"/>
  <text class="s" x="170" y="72" text-anchor="middle" style="fill:#222">0.12m以内</text>
  <rect class="bb" x="10" y="96" width="108" height="48" rx="6"/>
  <text class="n" x="64" y="126" text-anchor="middle">500</text>
  <rect class="p" x="122" y="96" width="96" height="48" rx="6"/>
  <text class="s" x="170" y="126" text-anchor="middle" style="fill:#222">0.25m以内</text>
  <rect class="bw" x="226" y="96" width="164" height="48" rx="6"/>
  <text class="t" x="236" y="117">下水道台帳の施設平面図</text><text class="s" x="236" y="134" style="fill:#222">1/500</text>
  <path d="M218,120H226" style="stroke:#d4a017;stroke-width:2" fill="none"/>
  <rect class="bb" x="10" y="150" width="108" height="48" rx="6"/>
  <text class="n" x="64" y="180" text-anchor="middle">1000</text>
  <rect class="p" x="122" y="150" width="96" height="48" rx="6"/>
  <text class="s" x="170" y="180" text-anchor="middle" style="fill:#222">0.70m以内</text>
  <rect class="bw" x="226" y="150" width="164" height="48" rx="6"/>
  <text class="t" x="236" y="171">道路台帳の図面</text><text class="s" x="236" y="188" style="fill:#222">1/1,000以上</text>
  <path d="M218,174H226" style="stroke:#d4a017;stroke-width:2" fill="none"/>
  <rect class="bb" x="10" y="204" width="108" height="48" rx="6"/>
  <text class="n" x="64" y="234" text-anchor="middle">2500</text>
  <rect class="p" x="122" y="204" width="96" height="48" rx="6"/>
  <text class="s" x="170" y="234" text-anchor="middle" style="fill:#222">1.75m以内</text>
  <rect class="bw" x="226" y="204" width="164" height="48" rx="6"/>
  <text class="t" x="236" y="225">都市計画の計画図</text><text class="s" x="236" y="242" style="fill:#222">1/2,500以上</text>
  <path d="M218,228H226" style="stroke:#d4a017;stroke-width:2" fill="none"/>
  <rect class="bb" x="10" y="258" width="108" height="48" rx="6"/>
  <text class="n" x="64" y="288" text-anchor="middle">5000</text>
  <rect class="p" x="122" y="258" width="96" height="48" rx="6"/>
  <text class="s" x="170" y="288" text-anchor="middle" style="fill:#222">3.50m以内</text>
  <rect class="bb" x="10" y="312" width="108" height="48" rx="6"/>
  <text class="n" x="64" y="342" text-anchor="middle">10000</text>
  <rect class="p" x="122" y="312" width="96" height="48" rx="6"/>
  <text class="s" x="170" y="342" text-anchor="middle" style="fill:#222">7.00m以内</text>
  <rect class="bs" x="10" y="366" width="108" height="48" rx="6" style="stroke-dasharray:5 3"/>
  <text class="t" x="64" y="396" text-anchor="middle">対応なし</text>
  <rect class="p" x="122" y="366" width="96" height="48" rx="6" style="stroke-dasharray:5 3"/>
  <text class="s" x="170" y="387" text-anchor="middle">準則の表の</text><text class="s" x="170" y="403" text-anchor="middle">範囲外</text>
  <rect class="bw" x="226" y="366" width="164" height="48" rx="6"/>
  <text class="t" x="236" y="387">都市計画の総括図</text><text class="s" x="236" y="404" style="fill:#222">1/25,000以上</text>
  <path d="M218,390H226" style="stroke:#d4a017;stroke-width:2" fill="none"/>
  <rect class="bd" x="10" y="426" width="380" height="64" rx="8"/>
  <text class="s" x="200" y="456" text-anchor="middle" style="fill:#1a3a5c">縮尺から精度の桁を見積もる目安で、</text>
  <text class="s" x="200" y="472" text-anchor="middle" style="fill:#1a3a5c">台帳そのものの精度の保証ではない</text>
</svg>
