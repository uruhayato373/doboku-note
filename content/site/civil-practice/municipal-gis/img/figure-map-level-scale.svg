<!-- authored 2026-10-16 doboku-note 自作。論点は地図情報レベルごとの水平位置の標準偏差（準則）と、台帳の縮尺の対応。縮尺は下限で、それより細かい側も含む。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="地図情報レベルと台帳の縮尺の対応図。標準偏差は250で0.12m、500で0.25m、1000で0.70m、2500で1.75m、5000で3.50m、10000で7.00m。下水道の施設平面図は1/500、道路台帳は1/1,000以上、都市計画の計画図は1/2,500以上で、矢印はそれより細かい側も含む。総括図と下水道の一般図は対応なし。">
  <defs>
  <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 11px; fill: #222; }
      .b { font-weight: bold; fill: #1a3a5c; }
      .m { fill: #555; }
      .t12 { font-size: 12px; }
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .pos { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .dng { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .sf { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .wh { fill: #fff; stroke: #2e6da4; stroke-width: 1.5; }
      .dash { fill: #fff; stroke: #555; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .grid { stroke: #d7d7d7; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .ax { stroke: #555; stroke-width: 1.5; fill: none; }
      .ar { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .ark { stroke: #555; stroke-width: 2; fill: none; }
  </style>
  <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  <marker id="ak" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  <marker id="as" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  <marker id="asg" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  </defs>
  <text class="m" x="10" y="22">レベル</text>
  <text class="m" x="76" y="22">水平位置の標準偏差</text>
  <text class="m" x="390" y="22" text-anchor="end">矢印＝より細かい側も含む</text>
  <rect class="brand" x="10" y="34" width="56" height="44" rx="8"/>
  <text class="n" x="38.0" y="60.0" text-anchor="middle">250</text>
  <rect class="pos" x="76" y="44" width="3" height="24" rx="3"/>
  <text class="t12" x="85" y="60">0.12m以内</text>
  <rect class="brand" x="10" y="86" width="56" height="44" rx="8"/>
  <text class="n" x="38.0" y="112.0" text-anchor="middle">500</text>
  <rect class="pos" x="76" y="96" width="3.571428571428571" height="24" rx="3"/>
  <text class="t12" x="85.57142857142857" y="112">0.25m以内</text>
  <rect class="brand" x="10" y="138" width="56" height="44" rx="8"/>
  <text class="n" x="38.0" y="164.0" text-anchor="middle">1000</text>
  <rect class="pos" x="76" y="148" width="10.0" height="24" rx="3"/>
  <text class="t12" x="92.0" y="164">0.70m以内</text>
  <rect class="brand" x="10" y="190" width="56" height="44" rx="8"/>
  <text class="n" x="38.0" y="216.0" text-anchor="middle">2500</text>
  <rect class="pos" x="76" y="200" width="25.0" height="24" rx="3"/>
  <text class="t12" x="107.0" y="216">1.75m以内</text>
  <rect class="brand" x="10" y="242" width="56" height="44" rx="8"/>
  <text class="n" x="38.0" y="268.0" text-anchor="middle">5000</text>
  <rect class="pos" x="76" y="252" width="50.0" height="24" rx="3"/>
  <text class="t12" x="132.0" y="268">3.50m以内</text>
  <rect class="brand" x="10" y="294" width="56" height="44" rx="8"/>
  <text class="n" x="38.0" y="320.0" text-anchor="middle">10000</text>
  <rect class="pos" x="76" y="304" width="100.0" height="24" rx="3"/>
  <text class="t12" x="182.0" y="320">7.00m以内</text>
  <rect class="wh" x="282" y="86" width="108" height="44" rx="8"/>
  <text class="t12 b" x="336.0" y="104.0" text-anchor="middle">下水道 施設平面図</text>
  <text class="t12" x="336.0" y="120.0" text-anchor="middle">1/500</text>
  <rect class="wh" x="282" y="138" width="108" height="44" rx="8"/>
  <text class="t12 b" x="336.0" y="156.0" text-anchor="middle">道路台帳 図面</text>
  <text class="t12" x="336.0" y="172.0" text-anchor="middle">1/1,000以上</text>
  <rect class="wh" x="282" y="190" width="108" height="44" rx="8"/>
  <text class="t12 b" x="336.0" y="208.0" text-anchor="middle">都市計画 計画図</text>
  <text class="t12" x="336.0" y="224.0" text-anchor="middle">1/2,500以上</text>
  <path d="M258,160H280M258,160V56" stroke="#2e6da4" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M246,212H280M246,212V50" stroke="#2e6da4" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <rect class="dash" x="10" y="350" width="126" height="92" rx="8"/>
  <text class="t12 b" x="73" y="386" text-anchor="middle">対応なし</text>
  <text class="m" x="73" y="404" text-anchor="middle">準則の表の</text>
  <text class="m" x="73" y="418" text-anchor="middle">範囲外</text>
  <rect class="wh" x="282" y="350" width="108" height="42" rx="8"/>
  <text class="t12 b" x="336.0" y="367.0" text-anchor="middle">都市計画 総括図</text>
  <text class="t12" x="336.0" y="383.0" text-anchor="middle">1/25,000以上</text>
  <rect class="wh" x="282" y="400" width="108" height="42" rx="8"/>
  <text class="t12 b" x="336.0" y="417.0" text-anchor="middle">下水道 一般図</text>
  <text class="t12" x="336.0" y="433.0" text-anchor="middle">1/50,000以上</text>
  <path class="grid" d="M138,371H280"/>
  <path class="grid" d="M138,421H280"/>
  <rect class="warn" x="10" y="452" width="380" height="40" rx="8"/>
  <text class="t12" x="200.0" y="468.0" text-anchor="middle">縮尺から精度の桁を見積もる目安で、</text>
  <text class="t12" x="200.0" y="484.0" text-anchor="middle">台帳そのものの精度の保証ではない</text>
</svg>
