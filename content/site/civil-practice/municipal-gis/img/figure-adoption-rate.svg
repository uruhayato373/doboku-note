  <text class="t12" x="138" y="188">83.1％（936団体）</text>
  <text class="t12 b" x="14" y="222">都道府県</text>
  <text class="m" x="14" y="238">消防防災</text>
  <rect class="pos" x="128" y="206" width="231.84" height="30" rx="4"/>
  <text class="t12" x="138" y="226">92.0％（23団体）</text>
  <path class="ax" d="M128,164V240"/>
  <path class="grid" d="M254,164V240"/>
  <text class="m" x="254" y="254" text-anchor="middle">50</text>
  <path class="grid" d="M380,164V240"/>
  <text class="m" x="380" y="254" text-anchor="end">100％</text>
  <text class="m" x="128" y="254">0</text>
  <text class="n" x="14" y="284">導入予定のない団体のうち、財政状況を挙げた割合</text>
  <text class="m" x="14" y="300">母数は導入予定のない団体（導入団体・全団体とは別）</text>
  <text class="t12 b" x="14" y="326">市区町村</text>
  <rect class="warn" x="128" y="310" width="150.94799999999998" height="30" rx="4"/>
  <text class="t12" x="138" y="330">59.9％（173団体）</text>
  <text class="t12 b" x="14" y="364">都道府県</text>
  <rect class="warn" x="128" y="348" width="141.87599999999998" height="30" rx="4"/>
  <text class="t12" x="138" y="368">56.3％（9/16団体）</text>
  <path class="ax" d="M128,306V382"/>
  <path class="grid" d="M254,306V382"/>
  <text class="m" x="254" y="396" text-anchor="middle">50</text>
