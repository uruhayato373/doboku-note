<!-- authored 2026-10-16 doboku-note 自作。論点は平面直角座標系の縮尺係数（原点を通る子午線で0.9999・東西約130km以内が適用範囲）。曲線は近似式 k＝0.9999×{1＋Y²/(2R²)}（R＝6,371km）から計算し、130km で約1.0001になることを確かめた。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="平面直角座標系の一つの系について、原点からの東西距離と縮尺係数の関係を示す図。原点を通る子午線で0.9999、東西に離れるほど大きくなり、適用範囲の東西約130kmの端で約1.0001に達する。縦軸は拡大した目盛り。">
  <defs>
  <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 11px; fill: #222; }
      .b { font-weight: bold; fill: #1a3a5c; }
      .m { fill: #555; }
      .t12 { font-size: 12px; }
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .pos { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .dng { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .sf { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .wh { fill: #fff; stroke: #2e6da4; stroke-width: 1.5; }
      .dash { fill: #fff; stroke: #555; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .grid { stroke: #d7d7d7; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .ax { stroke: #555; stroke-width: 1.5; fill: none; }
      .ar { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .ark { stroke: #555; stroke-width: 2; fill: none; }
  </style>
  <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  <marker id="ak" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  <marker id="as" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  <marker id="asg" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  </defs>
  <path class="ax" d="M66,318V60" marker-end="url(#ak)"/>
  <text class="m" x="74" y="64">縮尺係数 k</text>
  <path class="ax" d="M66,318H390" marker-end="url(#ak)"/>
  <path class="grid" d="M66,130H378"/>
  <path class="grid" d="M66,300H378"/>
  <text class="b" x="62" y="134" text-anchor="end">1.0001</text>
  <text class="b" x="62" y="304" text-anchor="end">0.9999</text>
  <path class="grid" d="M73.0,120V318M359.0,120V318M216.0,282V318"/>
  <polyline points="73.0,123.1 84.0,149.2 95.0,173.3 106.0,195.3 117.0,215.2 128.0,233.0 139.0,248.7 150.0,262.3 161.0,273.8 172.0,283.2 183.0,290.6 194.0,295.8 205.0,299.0 216.0,300.0 227.0,299.0 238.0,295.8 249.0,290.6 260.0,283.2 271.0,273.8 282.0,262.3 293.0,248.7 304.0,233.0 315.0,215.2 326.0,195.3 337.0,173.3 348.0,149.2 359.0,123.1" fill="none" stroke="#2e6da4" stroke-width="3"/>
  <circle cx="216.0" cy="300" r="5" fill="#fff3cd" stroke="#d4a017" stroke-width="2"/>
  <circle cx="73" cy="123" r="4" fill="#e8f0fe" stroke="#2e6da4" stroke-width="2"/>
  <circle cx="359" cy="123" r="4" fill="#e8f0fe" stroke="#2e6da4" stroke-width="2"/>
  <text class="b" x="216.0" y="278" text-anchor="middle">原点で 0.9999</text>
  <text class="m" x="216.0" y="198" text-anchor="middle">原点から離れるほど</text>
  <text class="m" x="216.0" y="213" text-anchor="middle">k は大きくなる</text>
  <text class="m" x="73.0" y="336" text-anchor="middle">西130km</text>
  <text class="b" x="216.0" y="336" text-anchor="middle">原点（子午線）</text>
  <text class="m" x="359.0" y="336" text-anchor="middle">東130km</text>
  <text class="b" x="216" y="92" text-anchor="middle">端で約1.0001（1万分の1以内の設計）</text>
  <path class="ar" d="M75.0,350H357.0" marker-end="url(#ah)"/>
  <path class="ar" d="M75.0,350H357.0" marker-start="url(#as)" marker-end="url(#ah)"/>
  <text class="b" x="216" y="368" text-anchor="middle">適用範囲: 原点から東西約130km以内</text>
  <rect class="brand" x="12" y="380" width="376" height="70" rx="8"/>
  <text class="b" x="24" y="402">座標上の距離 s ＝ k × 楕円体面上の距離 S</text>
  <text class="t12" x="24" y="422">1万分の1は100mで1cm。数cmを争う出来形</text>
  <text class="t12" x="24" y="438">の計測では無視できない</text>
  <text class="m" x="12" y="466">曲線は近似式 k＝0.9999×{1＋Y²/(2R²)} から計算</text>
  <text class="m" x="12" y="480">（Y は東西の距離、R は地球半径 約6,371km）</text>
  <text class="m" x="12" y="494">出典: 平成14年国土交通省告示第9号、国土地理院</text>
</svg>
