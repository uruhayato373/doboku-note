<!-- authored 2026-10-15 doboku-note 自作。論点は、JIS A 5308 の生コンの呼び方（種類・呼び強度・スランプ・粗骨材の最大寸法・セメントの種類）の読み方と、規格が購入者に必ず指定を求める四事項のうち呼び方に出る二つ・出ない二つ。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="生コンの呼び方「普通 24 12 20 N」の読み方を引き出し線で示した図。規格が購入者に必ず指定を求める四事項のうち、セメントの種類Nと粗骨材の最大寸法20は呼び方に出るが、骨材の種類とアルカリシリカ反応の抑制対策は呼び方に出ないので別に書いて注文する。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 13px; fill: #222; }
      .big { font-size: 36px; font-weight: bold; fill: #1a3a5c; text-anchor: middle; }
      .nm { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .rd { font-size: 12px; fill: #555; }
      .hd { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .hs { font-size: 12px; fill: #555; }
      .chip { font-size: 13px; fill: #222; text-anchor: middle; }
      .card { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1.5; }
      .tok { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .must { fill: #e8f0fe; stroke: #b22234; stroke-width: 4; }
      .panel { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .cp { fill: #ffffff; stroke: #2e6da4; stroke-width: 1.5; }
      .cpm { fill: #ffffff; stroke: #b22234; stroke-width: 4; }
      .ld { stroke: #2e6da4; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <!-- 呼び方の一行 -->
  <rect class="tok" x="19" y="124" width="92" height="66" rx="8"/><text class="big" x="65" y="170">普通</text>
  <rect class="tok" x="119" y="124" width="62" height="66" rx="8"/><text class="big" x="150" y="170">24</text>
  <rect class="tok" x="189" y="124" width="62" height="66" rx="8"/><text class="big" x="220" y="170">12</text>
  <rect class="must" x="261" y="124" width="60" height="66" rx="8"/><text class="big" x="291" y="170">20</text>
  <rect class="must" x="331" y="124" width="48" height="66" rx="8"/><text class="big" x="355" y="170">N</text>

  <!-- 上の引き出し：種類・スランプ・セメント -->
  <rect class="card" x="10" y="14" width="142" height="64" rx="8"/>
  <text class="nm" x="20" y="38">コンクリートの種類</text><text class="rd" x="20" y="58">普通コンクリート</text>
  <path class="ld" d="M65,78V124"/><circle cx="65" cy="124" r="3.5" fill="#2e6da4"/>

  <rect class="card" x="158" y="14" width="106" height="64" rx="8"/>
  <text class="nm" x="166" y="38">スランプ 12cm</text><text class="rd" x="166" y="58">荷卸し地点の値</text>
  <path class="ld" d="M220,78V124"/><circle cx="220" cy="124" r="3.5" fill="#2e6da4"/>

  <rect class="card" x="270" y="14" width="120" height="64" rx="8"/>
  <text class="nm" x="280" y="34">セメントの種類</text><text class="rd" x="280" y="52">普通ポルトランド</text><text class="rd" x="280" y="68">セメント</text>
  <path class="ld" d="M355,78V124"/><circle cx="355" cy="124" r="3.5" fill="#2e6da4"/>

  <!-- 下の引き出し：呼び強度・粗骨材の最大寸法 -->
  <path class="ld" d="M150,190V232"/><circle cx="150" cy="190" r="3.5" fill="#2e6da4"/>
  <rect class="card" x="10" y="232" width="190" height="64" rx="8"/>
  <text class="nm" x="20" y="254">呼び強度 24 N/mm²</text><text class="rd" x="20" y="276">保証材齢は指定なしなら28日</text>

  <path class="ld" d="M291,190V232"/><circle cx="291" cy="190" r="3.5" fill="#2e6da4"/>
  <rect class="card" x="228" y="232" width="162" height="64" rx="8"/>
  <text class="nm" x="238" y="254">粗骨材の最大寸法</text><text class="rd" x="238" y="274">20mm</text>

  <!-- 凡例 -->
  <rect class="must" x="14" y="312" width="22" height="14" rx="3"/>
  <text class="hs" x="44" y="324">太枠：規格が購入者に必ず指定を求める四事項</text>
  <text class="hs" x="44" y="342">呼び方に出るのは N と 20 の二つだけ</text>

  <!-- セメントの記号の例 -->
  <rect class="panel" x="10" y="354" width="380" height="62" rx="8"/>
  <text class="hd" x="22" y="374">セメントの記号の例</text>
  <rect class="cp" x="22" y="382" width="62" height="26" rx="13"/><text class="chip" x="53" y="400"><tspan style="font-weight:bold;fill:#1a3a5c">N</tspan> 普通</text>
  <rect class="cp" x="92" y="382" width="62" height="26" rx="13"/><text class="chip" x="123" y="400"><tspan style="font-weight:bold;fill:#1a3a5c">H</tspan> 早強</text>
  <rect class="cp" x="162" y="382" width="160" height="26" rx="13"/><text class="chip" x="242" y="400"><tspan style="font-weight:bold;fill:#1a3a5c">BB</tspan> 高炉セメントB種</text>

  <!-- 呼び方に出ない指定 -->
  <rect class="panel" x="10" y="426" width="380" height="66" rx="8"/>
  <text class="hd" x="22" y="446">呼び方に出ない指定</text><text class="hs" x="148" y="446">別に書いて注文する</text>
  <rect class="cpm" x="24" y="456" width="86" height="26" rx="13"/><text class="chip" x="67" y="474">骨材の種類</text>
  <rect class="cpm" x="118" y="456" width="204" height="26" rx="13"/><text class="chip" x="220" y="474">アルカリシリカ反応の抑制対策</text>
</svg>
