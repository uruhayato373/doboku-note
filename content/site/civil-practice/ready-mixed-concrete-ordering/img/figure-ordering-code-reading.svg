<!-- authored 2026-10-15 doboku-note 自作。論点は、JIS A 5308 の生コンの呼び方（種類・呼び強度・スランプ・粗骨材の最大寸法・セメントの種類）の読み方と、呼び方に出ない指定。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="生コンの呼び方「普通 24 12 20 N」の読み方を、引き出し線で示した図。普通はコンクリートの種類で普通コンクリート、24は呼び強度、12はスランプ12cm、20は粗骨材の最大寸法20mm、Nはセメントの種類で普通ポルトランドセメント。下段に、セメントの記号の例と、呼び方に出ないので別に書いて注文する骨材の種類とアルカリシリカ反応の抑制対策を示す。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 13px; fill: #222; }
      .big { font-size: 36px; font-weight: bold; fill: #1a3a5c; text-anchor: middle; }
      .nm { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .rd { font-size: 12px; fill: #555; }
      .hd { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .hs { font-size: 12px; fill: #555; }
      .chip { font-size: 13px; fill: #222; text-anchor: middle; }
      .card { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1.5; }
      .tok { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .panel { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .cp { fill: #ffffff; stroke: #2e6da4; stroke-width: 1.5; }
      .ld { stroke: #2e6da4; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <!-- 呼び方の一行 -->
  <rect class="tok" x="19" y="130" width="92" height="70" rx="8"/><text class="big" x="65" y="178">普通</text>
  <rect class="tok" x="119" y="130" width="62" height="70" rx="8"/><text class="big" x="150" y="178">24</text>
  <rect class="tok" x="189" y="130" width="62" height="70" rx="8"/><text class="big" x="220" y="178">12</text>
  <rect class="tok" x="259" y="130" width="62" height="70" rx="8"/><text class="big" x="290" y="178">20</text>
  <rect class="tok" x="329" y="130" width="52" height="70" rx="8"/><text class="big" x="355" y="178">N</text>

  <!-- 上の引き出し：種類・スランプ・セメント -->
  <rect class="card" x="10" y="18" width="136" height="68" rx="8"/>
  <text class="nm" x="20" y="40">コンクリートの種類</text><text class="rd" x="20" y="58">普通コンクリート</text>
  <path class="ld" d="M65,86V130"/><circle cx="65" cy="130" r="3.5" fill="#2e6da4"/>

  <rect class="card" x="182" y="18" width="76" height="68" rx="8"/>
  <text class="nm" x="192" y="40">スランプ</text><text class="rd" x="192" y="58">12cm</text>
  <path class="ld" d="M220,86V130"/><circle cx="220" cy="130" r="3.5" fill="#2e6da4"/>

  <rect class="card" x="266" y="18" width="124" height="68" rx="8"/>
  <text class="nm" x="276" y="40">セメントの種類</text><text class="rd" x="276" y="58">普通ポルトランド</text><text class="rd" x="276" y="74">セメント</text>
  <path class="ld" d="M355,86V130"/><circle cx="355" cy="130" r="3.5" fill="#2e6da4"/>

  <!-- 下の引き出し：呼び強度・粗骨材の最大寸法 -->
  <path class="ld" d="M150,200V244"/><circle cx="150" cy="200" r="3.5" fill="#2e6da4"/>
  <rect class="card" x="105" y="244" width="90" height="58" rx="8"/>
  <text class="nm" x="115" y="266">呼び強度</text><text class="rd" x="115" y="285">24</text>

  <path class="ld" d="M290,200V244"/><circle cx="290" cy="200" r="3.5" fill="#2e6da4"/>
  <rect class="card" x="228" y="244" width="124" height="58" rx="8"/>
  <text class="nm" x="238" y="266">粗骨材の最大寸法</text><text class="rd" x="238" y="285">20mm</text>

  <!-- セメントの記号の例 -->
  <rect class="panel" x="10" y="324" width="380" height="72" rx="8"/>
  <text class="hd" x="22" y="346">セメントの記号の例</text>
  <rect class="cp" x="22" y="356" width="62" height="28" rx="14"/><text class="chip" x="53" y="375"><tspan style="font-weight:bold;fill:#1a3a5c">N</tspan> 普通</text>
  <rect class="cp" x="92" y="356" width="62" height="28" rx="14"/><text class="chip" x="123" y="375"><tspan style="font-weight:bold;fill:#1a3a5c">H</tspan> 早強</text>
  <rect class="cp" x="162" y="356" width="160" height="28" rx="14"/><text class="chip" x="242" y="375"><tspan style="font-weight:bold;fill:#1a3a5c">BB</tspan> 高炉セメントB種</text>

  <!-- 呼び方に出ない指定 -->
  <rect class="panel" x="10" y="412" width="380" height="72" rx="8"/>
  <text class="hd" x="22" y="434">呼び方に出ない指定</text><text class="hs" x="148" y="434">別に書いて注文する</text>
  <rect class="cp" x="22" y="444" width="86" height="28" rx="14"/><text class="chip" x="65" y="463">骨材の種類</text>
  <rect class="cp" x="116" y="444" width="204" height="28" rx="14"/><text class="chip" x="218" y="463">アルカリシリカ反応の抑制対策</text>
</svg>
