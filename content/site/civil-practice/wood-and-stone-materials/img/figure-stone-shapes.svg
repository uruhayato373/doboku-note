<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="石の形状四種の寸法の見方。角石は幅が厚さの3倍未満、板石は厚さ15cm未満で幅が厚さの3倍以上、間知石は控えを四方落とし、割石は二方落とし" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
  <defs><marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4"/></marker></defs>
  <defs><marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4"/></marker><marker id="ar2" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto"><polygon points="8,0 0,3 8,6" fill="#2e6da4"/></marker></defs>
  <rect x="20" y="20" width="175" height="220" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/> <!-- brand-fill / brand -->
  <text x="32" y="46" font-size="15" font-weight="700" fill="#222">角石</text>
  <rect x="50" y="80" width="90" height="45" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <path d="M50 138L140 138" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-start="url(#ar2)" marker-end="url(#ar)"/>
  <text x="95" y="154" font-size="12" fill="#1a3a5c" text-anchor="middle">幅</text>
  <path d="M154 80L154 125" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-start="url(#ar2)" marker-end="url(#ar)"/>
  <text x="160" y="106" font-size="11" fill="#1a3a5c">厚さ</text>
  <text x="32" y="186" font-size="12" fill="#1a3a5c">幅が厚さの3倍未満</text>
  <text x="32" y="206" font-size="11" fill="#555">ある長さをもつもの</text>
  <rect x="205" y="20" width="175" height="220" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/> <!-- brand-fill / brand -->
  <text x="217" y="46" font-size="15" font-weight="700" fill="#222">板石</text>
  <rect x="225" y="98" width="110" height="16" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <path d="M225 132L335 132" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-start="url(#ar2)" marker-end="url(#ar)"/>
  <text x="280" y="150" font-size="12" fill="#1a3a5c" text-anchor="middle">幅</text>
  <path d="M347 98L347 114" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-start="url(#ar2)" marker-end="url(#ar)"/>
  <text x="353" y="128" font-size="11" fill="#1a3a5c">厚さ</text>
  <text x="217" y="186" font-size="12" fill="#1a3a5c">厚さが15cm未満</text>
  <text x="217" y="206" font-size="12" fill="#1a3a5c">幅が厚さの3倍以上</text>
  <rect x="20" y="250" width="175" height="220" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/> <!-- brand-fill / brand -->
  <text x="32" y="276" font-size="15" font-weight="700" fill="#222">間知石</text>
  <polygon points="42,320 88,320 88,366 42,366" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <polygon points="88.0,308.0 114.0,308.0 114.0,334.0 88.0,334.0" fill="#f5f5f5" stroke="#555" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M42 320L88.0 308.0" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <path d="M88 320L114.0 308.0" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <path d="M88 366L114.0 334.0" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <path d="M42 366L88.0 334.0" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <polygon points="42,320 88,320 88,366 42,366" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <path d="M92 380L105.0 348.0" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-start="url(#ar2)" marker-end="url(#ar)"/>
  <text x="118" y="396" font-size="11" fill="#1a3a5c">控え</text>
  <text x="65.0" y="382" font-size="12" fill="#1a3a5c" text-anchor="middle">面</text>
  <text x="32" y="406" font-size="12" fill="#1a3a5c">面はほぼ方形</text>
  <text x="32" y="424" font-size="12" fill="#1a3a5c">控えは四方落とし</text>
  <text x="32" y="442" font-size="12" fill="#1a3a5c">控えの長さは面の最小辺の</text>
  <text x="32" y="460" font-size="12" fill="#1a3a5c">1.5倍以上</text>
  <rect x="205" y="250" width="175" height="220" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/> <!-- brand-fill / brand -->
  <text x="217" y="276" font-size="15" font-weight="700" fill="#222">割石</text>
  <polygon points="227,320 273,320 273,366 227,366" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <polygon points="273.0,298.0 299.0,298.0 299.0,344.0 273.0,344.0" fill="#f5f5f5" stroke="#555" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M227 320L273.0 298.0" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <path d="M273 320L299.0 298.0" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <path d="M273 366L299.0 344.0" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <path d="M227 366L273.0 344.0" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <polygon points="227,320 273,320 273,366 227,366" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <path d="M277 380L290.0 358.0" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-start="url(#ar2)" marker-end="url(#ar)"/>
  <text x="303" y="396" font-size="11" fill="#1a3a5c">控え</text>
  <text x="250.0" y="382" font-size="12" fill="#1a3a5c" text-anchor="middle">面</text>
  <text x="217" y="406" font-size="12" fill="#1a3a5c">面はほぼ方形</text>
  <text x="217" y="424" font-size="12" fill="#1a3a5c">控えは二方落とし</text>
  <text x="217" y="442" font-size="12" fill="#1a3a5c">控えの長さは面の最小辺の</text>
  <text x="217" y="460" font-size="12" fill="#1a3a5c">1.2倍以上</text>
  <text x="20" y="492" font-size="11" fill="#555">JIS A 5003 の形状の定義。図の縮尺・比率は目安</text>
</svg>
