<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="鋼と連続繊維補強材（棒）の応力とひずみを一つの軸に重ねた概念図。鋼は降伏して水平に伸びる。繊維は鋼より緩い直線のまま破断し、炭素が最も小さいひずみで折れる。" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
  <defs><marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4"/></marker></defs>
  <!-- 鋼 / 炭素 / アラミド / ガラス を同一座標に重ねた概念図（目盛りなし） -->
  <path d="M50 420V60" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M50 420H376" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="58" y="70" font-size="11" fill="#555">応力</text>
  <text x="376" y="438" font-size="11" fill="#555" text-anchor="end">ひずみ</text>
  <path d="M50 420L84 204H340" fill="none" stroke="#555" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="84" cy="204" r="4" fill="#fff" stroke="#555" stroke-width="2"/>
  <text x="100" y="196" font-size="11" fill="#555">降伏</text>
  <path d="M335 199L345 209M335 209L345 199" fill="none" stroke="#b22234" stroke-width="2.5" stroke-linecap="round"/>
  <text x="340" y="228" font-size="13" font-weight="700" fill="#222" text-anchor="middle">鋼</text>
  <path d="M50 420L150 120" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round"/>
  <path d="M145 115L155 125M145 125L155 115" fill="none" stroke="#b22234" stroke-width="2.5" stroke-linecap="round"/>
  <text x="160" y="116" font-size="12" font-weight="700" fill="#222">炭素</text>
  <path d="M50 420L240 135" fill="none" stroke="#2e6da4" stroke-width="3" stroke-linecap="round"/>
  <path d="M235 130L245 140M235 140L245 130" fill="none" stroke="#b22234" stroke-width="2.5" stroke-linecap="round"/>
  <text x="236" y="122" font-size="12" font-weight="700" fill="#2e6da4">アラミド</text>
  <path d="M50 420L330 140" fill="none" stroke="#3a7d44" stroke-width="3" stroke-linecap="round"/>
  <path d="M325 135L335 145M325 145L335 135" fill="none" stroke="#b22234" stroke-width="2.5" stroke-linecap="round"/>
  <text x="338" y="162" font-size="12" font-weight="700" fill="#3a7d44">ガラス</text>
  <text x="376" y="350" font-size="11" fill="#555" text-anchor="end">直線の傾き＝弾性率</text>
  <text x="376" y="368" font-size="11" fill="#555" text-anchor="end">鋼 ＞ 炭素 ＞ アラミド ＞ ガラス</text>
  <rect x="20" y="452" width="360" height="40" rx="6" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/> <!-- warn -->
  <text x="34" y="469" font-size="12" font-weight="700" fill="#1a3a5c">炭素は破断ひずみが最小。警告なく折れる</text>
  <text x="34" y="485" font-size="11" fill="#555">図は補強材（棒）の関係。シートの値とは並べない</text>
</svg>
