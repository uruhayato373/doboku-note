<!-- authored 2026-10-15 doboku-note 自作。論点は鋼の降伏と連続繊維補強材の直線破断の違い、および繊維の種類による弾性係数（傾き）の違い。縦軸の大きさは材料間で揃えていない概念図 -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="応力とひずみの関係を、鋼と連続繊維補強材で並べた概念図。鋼は降伏してから大きく伸びて破断する。連続繊維補強材は降伏せず直線のまま破断し、直線の傾き（弾性率）は炭素、アラミド、ガラスの順に小さくなる。炭素は小さいひずみで破断する。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 11px; fill: #555; }
      .h { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .b { font-size: 12px; fill: #1a3a5c; }
      .p { fill: #fff; stroke: #d7d7d7; stroke-width: 1.5; }
      .pill { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .ax { stroke: #8a8a8a; stroke-width: 1.5; fill: none; }
      .x { stroke: #b22234; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .ln { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="ax" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#8a8a8a"/></marker>
  </defs>

  <!-- 鋼 -->
  <rect class="p" x="10" y="10" width="380" height="228" rx="8"/>
  <rect class="pill" x="20" y="20" width="40" height="20" rx="10"/><text class="h" x="40" y="34" text-anchor="middle">鋼</text>
  <text class="b" x="72" y="34">降伏して、伸びてから破断</text>
  <path class="ax" d="M50,210V62" marker-end="url(#ax)"/>
  <path class="ax" d="M50,210H372" marker-end="url(#ax)"/>
  <text x="58" y="66">応力</text>
  <text x="372" y="226" text-anchor="end">ひずみ</text>
  <path class="ln" d="M50,210L90,116L150,116C190,116 232,84 286,84C316,84 330,96 338,118" style="stroke:#555"/>
  <circle cx="90" cy="116" r="4" fill="#fff" style="stroke:#555;stroke-width:2"/>
  <text class="b" x="90" y="104" text-anchor="middle">降伏</text>
  <path class="x" d="M333,113L343,123M333,123L343,113"/>
  <text class="b" x="338" y="141" text-anchor="middle">破断</text>

  <!-- 連続繊維補強材 -->
  <rect class="p" x="10" y="250" width="380" height="240" rx="8"/>
  <rect class="pill" x="20" y="260" width="132" height="20" rx="10"/><text class="h" x="86" y="274" text-anchor="middle">連続繊維補強材</text>
  <text class="b" x="164" y="274">降伏せず、直線のまま破断</text>
  <path class="ax" d="M50,462V308" marker-end="url(#ax)"/>
  <path class="ax" d="M50,462H372" marker-end="url(#ax)"/>
  <text x="58" y="312">応力</text>
  <text x="372" y="478" text-anchor="end">ひずみ</text>
  <path class="ln" d="M50,462L116,326" style="stroke:#222"/>
  <path class="ln" d="M50,462L240,352" style="stroke:#2e6da4"/>
  <path class="ln" d="M50,462L312,392" style="stroke:#3a7d44"/>
  <path class="x" d="M111,321L121,331M111,331L121,321"/>
  <path class="x" d="M235,347L245,357M235,357L245,347"/>
  <path class="x" d="M307,387L317,397M307,397L317,387"/>
  <text class="b" x="128" y="330">炭素</text>
  <text class="b" x="252" y="356">アラミド</text>
  <text class="b" x="324" y="396">ガラス</text>
  <text class="b" x="376" y="318" text-anchor="end">傾き（弾性率）は</text>
  <text class="b" x="376" y="334" text-anchor="end">繊維の種類で違う</text>
</svg>
