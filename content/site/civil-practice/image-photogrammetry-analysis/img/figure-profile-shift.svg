<!-- authored 2026-10-16 doboku-note 自作。論点は加工でひびの輪郭の位置と読める幅が動くこと（模式図）。幅や位置を読むときは加工前の元画像と加工後の画像で同じ値になるかを照らす。特定の書籍図の複製ではない -->
