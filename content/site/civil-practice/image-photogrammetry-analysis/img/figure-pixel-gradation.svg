<text x="32" y="400">同じ幅8mmのひび割れ、範囲は120mm×80mm</text>
<text x="32" y="422" class="s">粗い画素と2段階では、ひびが画素の一部しか占めず消える。</text>
<text x="32" y="440" class="s">階調が多いと薄い線で残り、画素が細かいと形が追える。</text>
<text x="32" y="458" class="s">どちらも撮影の時点で決まり、後からは増やせない。</text>
