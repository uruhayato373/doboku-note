  <text class="m" x="202" y="420" text-anchor="middle">境目がなだらか</text>
  <rect x="268" y="314" width="124" height="70" fill="#fff" stroke="#d7d7d7"/>
  <polyline points="270.0,372.0 281.9,372.0 293.8,372.0 305.7,372.0 317.6,372.0 327.8,372.0 338.0,370.0 343.1,348.0 348.2,326.0 358.4,326.0 368.6,326.0 389.0,326.0" fill="none" stroke="#2e6da4" stroke-width="2"/>
  <text class="t12 b" x="330" y="404" text-anchor="middle">鮮鋭化後</text>
  <text class="m" x="330" y="420" text-anchor="middle">境目が急</text>
  <rect class="warn" x="12" y="430" width="376" height="60" rx="8"/>
  <text class="t12 b" x="24" y="452">どちらも、元の画素値を計算し直しただけ</text>
  <text class="m" x="24" y="472">見やすくはなるが、撮影で得られなかった情報は増えない</text>
