  <polyline points="142.0,372.0 153.9,372.0 165.8,372.0 177.7,372.0 189.6,370.0 199.8,362.0 210.0,350.0 220.2,338.0 230.4,330.0 240.6,327.0 250.8,326.0 261.0,326.0" fill="none" stroke="#3a7d44" stroke-width="2"/>
