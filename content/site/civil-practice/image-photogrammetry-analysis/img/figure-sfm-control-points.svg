<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="写真測量の流れ。重なる写真から特徴点を探し、カメラの位置と形を計算し、標定点で座標を与え、検証点で確かめる。区域の周りに外側標定点、内側に内側標定点、別に検証点を置く">
<defs><marker id="a" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#555"/></marker></defs>
<style>text{font-family:Inter,'Noto Sans JP','Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif;font-size:13px;fill:#1a3a5c}.s{font-size:11px;fill:#555}.b{font-weight:bold}.m{text-anchor:middle}</style>
<rect width="400" height="500" fill="#fff"/>
<text x="20" y="24" class="b">1 重なる写真から、共通の点を探す</text>
<rect x="65" y="34" width="100" height="58" fill="none" stroke="#2e6da4" stroke-width="1.5"/>
<rect x="135" y="34" width="100" height="58" fill="none" stroke="#3a7d44" stroke-width="1.5"/>
<rect x="205" y="34" width="100" height="58" fill="none" stroke="#d4a017" stroke-width="1.5"/>
<circle cx="150" cy="48" r="3" fill="#f8d7da" stroke="#b22234"/>
<circle cx="150" cy="66" r="3" fill="#f8d7da" stroke="#b22234"/>
<circle cx="150" cy="82" r="3" fill="#f8d7da" stroke="#b22234"/>
<circle cx="220" cy="50" r="3" fill="#f8d7da" stroke="#b22234"/>
<circle cx="220" cy="70" r="3" fill="#f8d7da" stroke="#b22234"/>
<circle cx="220" cy="84" r="3" fill="#f8d7da" stroke="#b22234"/>
<text x="200" y="108" class="s m">赤い点が、複数の写真に写る特徴点</text>
<line x1="200" y1="114" x2="200" y2="132" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="20" y="136" width="360" height="54" rx="6" fill="#e8f0fe" stroke="#2e6da4"/>
<text x="32" y="158" class="b">2 カメラの位置と、点の3次元位置を計算</text>
<text x="32" y="178" class="s">形は復元できるが、大きさ・位置・向きは決まらない。</text>
<line x1="200" y1="194" x2="200" y2="212" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="20" y="232" class="b">3 標定点で座標を与え、4 検証点で確かめる</text>
<rect x="60" y="242" width="280" height="124" fill="#f5f5f5" stroke="#d7d7d7"/>
<polygon points="78,254 86,268 70,268" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
<polygon points="322,254 330,268 314,268" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
<polygon points="78,338 86,352 70,352" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
<polygon points="322,338 330,352 314,352" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
<polygon points="200,296 208,310 192,310" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
<circle cx="140" cy="278" r="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<circle cx="262" cy="330" r="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<circle cx="140" cy="330" r="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<rect x="20" y="380" width="360" height="104" rx="6" fill="#fff" stroke="#d7d7d7"/>
<polygon points="40,392 46,402 34,402" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
<text x="56" y="402" class="s">外側標定点　区域の外周に置く。3点以上</text>
<polygon points="40,414 46,424 34,424" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
<text x="56" y="424" class="s">内側標定点　区域の内部に置く。1点以上</text>
<circle cx="40" cy="442" r="5" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/><text x="56" y="446" class="s">検証点　計算に使わない。標定点の半数以上</text>
<text x="32" y="470" class="s">標定点の残差と検証点の較差が位置精度以内なら基準を満たす。</text>
</svg>