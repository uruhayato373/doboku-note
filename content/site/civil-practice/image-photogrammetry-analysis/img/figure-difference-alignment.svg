<!-- authored 2026-10-16 doboku-note 自作。論点は前回と今回の画像の差を取る前に位置を合わせること。ずれが変状の幅より大きいと撮影位置の違いと変状の進行を区別できない。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="前回と今回の画像の差を見る図。位置がずれたまま差を取ると輪郭がすべて変わった部分として現れる。位置を合わせてから差を取ると、進行したひびだけが残る。残るずれが変状の幅より大きいと、撮影位置の違いと変状の進行を区別できない。">
  <defs>
  <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 11px; fill: #222; }
      .b { font-weight: bold; fill: #1a3a5c; }
      .m { fill: #555; }
      .t12 { font-size: 12px; }
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .pos { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .dng { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .sf { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .wh { fill: #fff; stroke: #2e6da4; stroke-width: 1.5; }
      .dash { fill: #fff; stroke: #555; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .grid { stroke: #d7d7d7; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .ax { stroke: #555; stroke-width: 1.5; fill: none; }
      .ar { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .ark { stroke: #555; stroke-width: 2; fill: none; }
  </style>
  <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  <marker id="ak" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  <marker id="as" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  <marker id="asg" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  </defs>
  <rect class="wh" x="12" y="8" width="184" height="254" rx="8"/>
  <text class="t12 b" x="104" y="30" text-anchor="middle">位置がずれたまま</text>
  <text class="m" x="104" y="50" text-anchor="middle">前回（青）と今回（灰）</text>
  <rect x="54" y="62" width="100" height="56" fill="none" stroke="#2e6da4" stroke-width="2"/><path d="M72,110L122,70" stroke="#2e6da4" stroke-width="2" fill="none"/>
  <rect x="62" y="70" width="100" height="56" fill="none" stroke="#8a8a8a" stroke-width="2"/><path d="M80,118L144,74" stroke="#8a8a8a" stroke-width="2" fill="none"/>
  <path class="ar" d="M104,128V160" marker-end="url(#ah)"/>
  <text class="m" x="112" y="150">差を取る</text>
  <rect x="54" y="170" width="100" height="56" fill="none" stroke="#b22234" stroke-width="3"/><rect x="62" y="178" width="100" height="56" fill="none" stroke="#b22234" stroke-width="3"/>
  <text class="t12 b" x="104" y="252" text-anchor="middle">輪郭が全部「変わった部分」</text>
  <rect class="wh" x="204" y="8" width="184" height="254" rx="8"/>
  <text class="t12 b" x="296" y="30" text-anchor="middle">位置を合わせてから</text>
  <text class="m" x="296" y="50" text-anchor="middle">前回（青）と今回（灰）</text>
  <rect x="246" y="62" width="100" height="56" fill="none" stroke="#2e6da4" stroke-width="2"/><path d="M264,110L314,70" stroke="#2e6da4" stroke-width="2" fill="none"/>
  <rect x="246" y="62" width="100" height="56" fill="none" stroke="#8a8a8a" stroke-width="2"/><path d="M264,110L328,66" stroke="#8a8a8a" stroke-width="2" fill="none"/>
  <path class="ar" d="M296,128V160" marker-end="url(#ah)"/>
  <text class="m" x="304" y="150">差を取る</text>
  <rect x="246" y="170" width="100" height="56" fill="none" stroke="#d7d7d7" stroke-width="1" stroke-dasharray="3 3"/><path d="M314,180L328,186" stroke="#b22234" stroke-width="3" fill="none"/>
  <text class="t12 b" x="296" y="246" text-anchor="middle">進行したひびだけが残る</text>
  <rect class="warn" x="12" y="276" width="376" height="72" rx="8"/>
  <text class="t12 b" x="200" y="300" text-anchor="middle">残るずれが変状の幅より大きいと</text>
  <text class="t12 b" x="200" y="320" text-anchor="middle">撮影位置の違いと変状の進行を区別できない</text>
  <text class="t12 b" x="12" y="376">残るずれと、変状の幅</text>
  <rect x="12" y="388" width="200" height="22" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text class="t12" x="220" y="404">残るずれ（大）</text>
  <rect x="12" y="420" width="60" height="22" fill="#f8d7da" stroke="#b22234" stroke-width="1.5"/>
  <text class="t12" x="80" y="436">変状の幅（小）</text>
  <text class="m" x="200" y="470" text-anchor="middle">ずれ ＞ 幅 のとき、差は変状の進行を示さない</text>
</svg>
