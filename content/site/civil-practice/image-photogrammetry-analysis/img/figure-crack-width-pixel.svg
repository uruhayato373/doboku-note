<!-- authored 2026-10-16 doboku-note 自作。論点は幅0.2mmのひびと1画素1mmの関係（仮の例）と、検出できるかは撮影距離・照明・検出の手法を含む条件つきの性能値で決まること。特定の書籍図の複製ではない -->
