<!-- authored 2026-10-15 doboku-note 自作。論点は、コンクリート構造物に関わる五つの立場が決める内容・確かめる内容と、渡す書類。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="コンクリート構造物に関わる五つの立場が、何を決め、何を確かめ、どの書類を渡すかを順に示した図。決める立場と確かめる立場が分かれている。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 13px; fill: #222; }
      .role { font-size: 14px; font-weight: bold; fill: #1a3a5c; }
      .tk { font-size: 11px; font-weight: bold; fill: #2e6da4; }
      .tc { font-size: 11px; font-weight: bold; fill: #b22234; }
      .td { font-size: 11px; font-weight: bold; fill: #3a7d44; }
      .v { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .d { font-size: 13px; fill: #555; }
      .lg { font-size: 11px; fill: #555; }
      .card { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1.5; }
      .rb { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .ar { stroke: #2e6da4; stroke-width: 2.5; fill: none; }
    </style>
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  </defs>

  <!-- 発注者 -->
  <rect class="card" x="10" y="8" width="380" height="80" rx="8"/>
  <path class="rb" d="M18,8H114V88H18A8,8 0 0 1 10,80V16A8,8 0 0 1 18,8Z"/>
  <text class="role" x="62" y="53" text-anchor="middle">発注者</text>
  <text class="tk" x="124" y="30">決める</text><text class="v" x="172" y="30">造るものと確かめる基準</text>
  <text class="tc" x="124" y="52">確かめる</text><text class="v" x="172" y="52">完成の検査</text>
  <text class="td" x="124" y="74">書類</text><text class="d" x="172" y="74">共通仕様書・契約約款</text>
  <path class="ar" d="M62,88V96" marker-end="url(#ah)"/>

  <!-- 設計者 -->
  <rect class="card" x="10" y="98" width="380" height="80" rx="8"/>
  <path class="rb" d="M18,98H114V178H18A8,8 0 0 1 10,170V106A8,8 0 0 1 18,98Z"/>
  <text class="role" x="62" y="143" text-anchor="middle">設計者</text>
  <text class="tk" x="124" y="120">決める</text><text class="v" x="172" y="120">強度・耐久性・形</text>
  <text class="tc" x="124" y="142">確かめる</text><text class="v" x="172" y="142">図面が施工・検査で読めること</text>
  <text class="td" x="124" y="164">書類</text><text class="d" x="172" y="164">設計図書</text>
  <path class="ar" d="M62,178V186" marker-end="url(#ah)"/>

  <!-- 生コン工場 -->
  <rect class="card" x="10" y="188" width="380" height="80" rx="8"/>
  <path class="rb" d="M18,188H114V268H18A8,8 0 0 1 10,260V196A8,8 0 0 1 18,188Z"/>
  <text class="role" x="62" y="233" text-anchor="middle">生コン工場</text>
  <text class="tk" x="124" y="210">決める</text><text class="v" x="172" y="210">実際の配合</text>
  <text class="tc" x="124" y="232">確かめる</text><text class="v" x="172" y="232">配合どおりの出荷品質</text>
  <text class="td" x="124" y="254">書類</text><text class="d" x="172" y="254">配合計画書・納入書</text>
  <path class="ar" d="M62,268V276" marker-end="url(#ah)"/>

  <!-- 施工者 -->
  <rect class="card" x="10" y="278" width="380" height="80" rx="8"/>
  <path class="rb" d="M18,278H114V358H18A8,8 0 0 1 10,350V286A8,8 0 0 1 18,278Z"/>
  <text class="role" x="62" y="323" text-anchor="middle">施工者</text>
  <text class="tk" x="124" y="300">決める</text><text class="v" x="172" y="300">運ぶ・打つ・守る手順</text>
  <text class="tc" x="124" y="322">確かめる</text><text class="v" x="172" y="322">受入れ検査・かぶりの確認</text>
  <text class="td" x="124" y="344">書類</text><text class="d" x="172" y="344">施工計画書・施工記録・完成図書</text>
  <path class="ar" d="M62,358V366" marker-end="url(#ah)"/>

  <!-- 維持管理者 -->
  <rect class="card" x="10" y="368" width="380" height="80" rx="8"/>
  <path class="rb" d="M18,368H114V448H18A8,8 0 0 1 10,440V376A8,8 0 0 1 18,368Z"/>
  <text class="role" x="62" y="413" text-anchor="middle">維持管理者</text>
  <text class="tk" x="124" y="390">決める</text><text class="v" x="172" y="390">点検と手当ての時期</text>
  <text class="tc" x="124" y="412">確かめる</text><text class="v" x="172" y="412">定期点検</text>
  <text class="td" x="124" y="434">書類</text><text class="d" x="172" y="434">点検記録</text>

  <!-- 凡例 -->
  <path class="ar" d="M22,466V488" marker-end="url(#ah)"/>
  <text class="lg" x="36" y="482">矢印は、決めた値を次の立場へ渡す向き</text>
</svg>
