<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="点検、診断、措置、記録の順に進み、記録が次回の点検へ戻る循環。橋の重要度で点検間隔と措置の優先順位を変える">
  <defs>
    <style>
      text { font-family: Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif; fill: #1a3a5c; font-size: 12px; }
      .h { font-size: 15px; font-weight: bold; }
      .k { font-size: 13px; font-weight: bold; fill: #222; text-anchor: middle; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .positive { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #2e6da4; stroke-width: 2; marker-end: url(#a); }
    </style>
    <!-- brand / warn / positive / surface tokens -->
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4"/></marker>
  </defs>
  <rect width="400" height="500" fill="#ffffff"/>
  <rect class="brand" x="40" y="20" width="280" height="76" rx="8"/>
  <text class="h" x="56" y="48">点検</text>
  <text x="56" y="70">状態を把握し、損傷を見つける</text>
  <text x="56" y="86">5年に1回を基本。必要なら短く</text>
  <path class="arrow" d="M180 99V117"/>
  <rect class="brand" x="40" y="120" width="280" height="76" rx="8"/>
  <text class="h" x="56" y="148">診断</text>
  <text x="56" y="170">損傷の程度と影響を評価する</text>
  <text x="56" y="186">健全性をⅠ〜Ⅳに区分する</text>
  <path class="arrow" d="M180 199V217"/>
  <rect class="warn" x="40" y="220" width="280" height="76" rx="8"/>
  <text class="h" x="56" y="248">措置</text>
  <text x="56" y="270">通行規制・補修補強・更新</text>
  <text x="56" y="286">優先順位は橋の重要度でも変わる</text>
  <path class="arrow" d="M180 299V317"/>
  <rect class="positive" x="40" y="320" width="280" height="76" rx="8"/>
  <text class="h" x="56" y="348">記録</text>
  <text x="56" y="370">結果と判断の根拠を残す</text>
  <text x="56" y="386">次回点検の前提として引き継ぐ</text>
  <path class="arrow" d="M320 358H350V58H327"/>
  <rect x="24" y="412" width="352" height="70" rx="8" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text class="k" x="200" y="440">サイクルは全橋で同じ</text>
  <text class="k" x="200" y="462">間隔と優先順位は重要度で変える</text>
</svg>
