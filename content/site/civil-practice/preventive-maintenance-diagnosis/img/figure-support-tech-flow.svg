<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="ドローンなどで撮影し、AIが損傷の候補を検出し、技術者が現地での打音や触診を含めて確認し、調書に記録して措置を検討する流れ">
  <defs>
    <style>
      text { font-family: Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif; fill: #1a3a5c; font-size: 12px; }
      .h { font-size: 15px; font-weight: bold; }
      .k { font-size: 13px; font-weight: bold; fill: #222; text-anchor: middle; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .positive { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #2e6da4; stroke-width: 2; marker-end: url(#a); }
    </style>
    <!-- brand / warn / positive / surface tokens -->
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4"/></marker>
  </defs>
  <rect width="400" height="500" fill="#ffffff"/>
  <rect class="brand" x="40" y="20" width="320" height="76" rx="8"/>
  <text class="h" x="56" y="48">撮影</text>
  <text x="56" y="70">距離と角度をそろえて撮る</text>
  <text x="56" y="86">位置と撮影日を記録する</text>
  <path class="arrow" d="M200 99V117"/>
  <rect class="brand" x="40" y="120" width="320" height="76" rx="8"/>
  <text class="h" x="56" y="148">AIが損傷の候補を検出</text>
  <text x="56" y="170">ひび割れやさび汁などを拾う</text>
  <text x="56" y="186">汚れや継ぎ目を誤って拾うこともある</text>
  <path class="arrow" d="M200 199V217"/>
  <rect class="warn" x="40" y="220" width="320" height="76" rx="8"/>
  <text class="h" x="56" y="248">技術者が確認</text>
  <text x="56" y="270">画像で足りない所は現地へ行く</text>
  <text x="56" y="286">打音・触診で確かめ、疑わしければ撮り直す</text>
  <path class="arrow" d="M200 299V317"/>
  <rect class="positive" x="40" y="320" width="320" height="76" rx="8"/>
  <text class="h" x="56" y="348">調書に記録して措置を検討</text>
  <text x="56" y="370">使った機器と範囲も残す</text>
  <text x="56" y="386">健全性の区分を決めるのは技術者</text>
  <rect x="24" y="412" width="352" height="70" rx="8" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text class="k" x="200" y="440">AIは候補を出す役</text>
  <text class="k" x="200" y="462">判断と記録の責任は使う側にある</text>
</svg>
