<!-- authored 2026-10-15 doboku-note 自作。論点は道路法第32条〜第34条・第40条・第87条と道路法施行令第9〜15条の当てはめ順。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="道路占用許可の審査の流れを縦に並べた図。申請書の受付、警察署長・他の占用者・埋設物の管理者との協議、基準への当てはめと許可・条件、工事、復旧の確認、更新または廃止と原状回復の順で、各段の当てはめ先の条文を添えている。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 11px; fill: #555; }
      .t { font-size: 14px; font-weight: bold; fill: #1a3a5c; }
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .b-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .b-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .b-p { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .num { fill: #fff; stroke: #8a8a8a; stroke-width: 1.5; }
      .a { stroke: #2e6da4; stroke-width: 2.5; fill: none; }
    </style>
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  </defs>

  <rect class="b-b" x="14" y="14" width="372" height="62" rx="8"/>
  <circle class="num" cx="40" cy="45" r="13"/><text class="n" x="40" y="49.5" text-anchor="middle">1</text>
  <text class="t" x="66" y="41">申請書の受付</text>
  <text x="66" y="60">法第32条第2項（申請書の記載事項）</text>
  <path class="a" d="M200,77V95" marker-end="url(#ah)"/>
  <rect class="b-w" x="14" y="96" width="372" height="62" rx="8"/>
  <circle class="num" cx="40" cy="127" r="13"/><text class="n" x="40" y="131.5" text-anchor="middle">2</text>
  <text class="t" x="66" y="118">協議</text>
  <text x="66" y="133">警察署長・他の占用者・埋設物の管理者</text>
  <text x="66" y="148">法第32条第5項・第34条／施行令第13条第6号</text>
  <path class="a" d="M200,159V177" marker-end="url(#ah)"/>
  <rect class="b-b" x="14" y="178" width="372" height="62" rx="8"/>
  <circle class="num" cx="40" cy="209" r="13"/><text class="n" x="40" y="213.5" text-anchor="middle">3</text>
  <text class="t" x="66" y="200">基準への当てはめと許可・条件</text>
  <text x="66" y="215">法第33条・施行令第9〜15条</text>
  <text x="66" y="230">条件は法第87条</text>
  <path class="a" d="M200,241V259" marker-end="url(#ah)"/>
  <rect class="b-b" x="14" y="260" width="372" height="62" rx="8"/>
  <circle class="num" cx="40" cy="291" r="13"/><text class="n" x="40" y="295.5" text-anchor="middle">4</text>
  <text class="t" x="66" y="287">工事</text>
  <text x="66" y="306">施行令第13条（方法）・第14条（時期）</text>
  <path class="a" d="M200,323V341" marker-end="url(#ah)"/>
  <rect class="b-b" x="14" y="342" width="372" height="62" rx="8"/>
  <circle class="num" cx="40" cy="373" r="13"/><text class="n" x="40" y="377.5" text-anchor="middle">5</text>
  <text class="t" x="66" y="369">復旧の確認</text>
  <text x="66" y="388">施行令第15条（復旧の方法）</text>
  <path class="a" d="M200,405V423" marker-end="url(#ah)"/>
  <rect class="b-p" x="14" y="424" width="372" height="62" rx="8"/>
  <circle class="num" cx="40" cy="455" r="13"/><text class="n" x="40" y="459.5" text-anchor="middle">6</text>
  <text class="t" x="66" y="451">更新、または廃止と原状回復</text>
  <text x="66" y="470">更新は施行令第9条の期間内／廃止は法第40条</text>
