<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="大規模盛土造成地の調査から対策までの流れと国の交付率。第一次と第二次スクリーニングは3分の1。安全率が1.0以上でも継続的な確認が望ましく、1.0未満は対策工事まで経過観察を続け、工事の交付率は原則4分の1">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; font-size: 12px; fill: #222; }
      .b { font-size: 13px; font-weight: bold; }
      .e { font-size: 12px; font-weight: bold; text-anchor: end; fill: #1a3a5c; }
      .s { font-size: 11px; fill: #555; }
      .bx { stroke-width: 1.5; }
      .br { fill: #e8f0fe; stroke: #2e6da4; }
      .ln { stroke: #555; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="a" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#555"/></marker>
  </defs>
  <rect class="bx br" x="15" y="15" width="370" height="56" rx="8"/>
  <text class="b" x="27" y="37">1　第一次スクリーニング</text>
  <text class="e" x="373" y="37">交付率 1/3</text>
  <text x="27" y="57">マップで盛土を抽出する（机上の調査が中心）</text>
  <path class="ln" d="M200,71 V85" marker-end="url(#a)"/>
  <rect class="bx br" x="15" y="87" width="370" height="68" rx="8"/>
  <text class="b" x="27" y="109">2　第二次スクリーニング</text>
  <text class="e" x="373" y="109">交付率 1/3</text>
  <text x="27" y="129">造成年代と現地踏査で、調べる順番を決める</text>
  <text x="27" y="145">ボーリングと安定計算で、地震時の安全率を出す</text>
  <path class="ln" d="M200,155 V169" marker-end="url(#a)"/>
  <rect class="bx" x="15" y="171" width="370" height="46" rx="8" fill="#fff3cd" stroke="#d4a017"/>
  <text class="b" x="200" y="199" text-anchor="middle">地震時の安全率は 1.0 以上か</text>
  <path class="ln" d="M100,217 V233" marker-end="url(#a)"/>
  <path class="ln" d="M292,217 V233" marker-end="url(#a)"/>
  <rect class="bx" x="15" y="235" width="171" height="152" rx="8" fill="#d0e8d0" stroke="#3a7d44"/>
  <text class="b" x="27" y="257">1.0 以上</text>
  <text x="27" y="277">継続的な確認が望ましい</text>
  <text x="27" y="297">水位が上がりうる盛土は</text>
  <text x="27" y="313">高に準じる：1年ごと</text>
  <text x="27" y="333">それ以外は必要に応じ、</text>
  <text x="27" y="349">行うなら中：5年ごと</text>
  <text x="27" y="369">地震・豪雨後も点検</text>
  <rect class="bx" x="198" y="235" width="187" height="72" rx="8" fill="#f8d7da" stroke="#b22234"/>
  <text class="b" x="210" y="257">1.0 未満</text>
  <text x="210" y="277">対策工法を検討する</text>
  <text x="210" y="295">対策工事まで経過観察を継続</text>
  <path class="ln" d="M292,307 V321" marker-end="url(#a)"/>
  <rect class="bx br" x="198" y="323" width="187" height="64" rx="8"/>
  <text class="b" x="210" y="344">3　滑動崩落防止工事</text>
  <text class="s" x="210" y="362">水の排除・抑止杭・擁壁補強</text>
  <text class="e" x="373" y="378">交付率 1/4（条件で1/2）</text>
  <rect x="15" y="399" width="370" height="86" rx="8" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text class="b" x="27" y="419">工事の補助を受ける要件（三つとも必要）</text>
  <text x="27" y="437">① 造成宅地防災区域・安全率1未満・勧告のいずれか</text>
  <text x="27" y="453">② 谷埋め：3,000m²以上かつ家屋10戸以上 など</text>
  <text x="27" y="469">③ 道路・河川・鉄道・避難路への影響のおそれ</text>
</svg>
