<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="令和8年度の建設投資見通し81兆4,700億円の内訳。政府投資は土木18.6兆円と建築8.0兆円、民間投資は土木9.9兆円と建築44.9兆円の積み上げ" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
<rect width="400" height="500" fill="#ffffff"/>
<g fill="#222" font-size="13" font-weight="700">
<text x="20" y="34">総額 81兆4,700億円（前年度比 +2.9%）</text>
</g>
<g fill="#555" font-size="11">
<text x="20" y="54">出来高ベース・名目値。建築には改装・改修を含む</text>
</g>
<g stroke-width="1.5">
<rect x="50" y="354.3" width="130" height="55.7" fill="#e8f0fe" stroke="#2e6da4"/>
<rect x="50" y="102.7" width="130" height="251.6" fill="#fff3cd" stroke="#d4a017"/>
<rect x="220" y="306" width="130" height="104" fill="#e8f0fe" stroke="#2e6da4"/>
<rect x="220" y="261.1" width="130" height="44.9" fill="#fff3cd" stroke="#d4a017"/>
</g>
<line x1="30" y1="410" x2="370" y2="410" stroke="#8a8a8a" stroke-width="1"/>
<g fill="#222" text-anchor="middle" font-size="12">
<text x="115" y="386">土木 9.9兆円</text>
<text x="115" y="233">建築 44.9兆円</text>
<text x="285" y="362">土木 18.6兆円</text>
<text x="285" y="288">建築 8.0兆円</text>
</g>
<g fill="#222" text-anchor="middle" font-size="12" font-weight="700">
<text x="115" y="94">民間投資 54.9兆円（67%）</text>
<text x="285" y="252">政府投資 26.6兆円（33%）</text>
</g>
<g fill="#222" text-anchor="middle" font-size="13" font-weight="700">
<text x="115" y="430">民間</text>
<text x="285" y="430">政府</text>
</g>
<rect x="30" y="444" width="12" height="12" fill="#e8f0fe" stroke="#2e6da4"/>
<rect x="100" y="444" width="12" height="12" fill="#fff3cd" stroke="#d4a017"/>
<g fill="#555" font-size="11">
<text x="48" y="454">土木</text>
<text x="118" y="454">建築</text>
</g>
<g fill="#222" font-size="12">
<text x="20" y="476">土木は約28.5兆円のうち政府が65%（18.6兆円）</text>
<text x="20" y="494">建築は約53兆円のうち民間が85%（44.9兆円）</text>
</g>
</svg>
