<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="発注の三つの形を契約の線で比べた図。一括発注は発注者が元請と総価請負契約を結び元請が下請に出す。分離発注は発注者が工種ごとに専門工事業者と直接契約する。ピュア型のCMは発注者がCMRに管理を委託し、施工者とは個別に請負契約を結ぶ" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
