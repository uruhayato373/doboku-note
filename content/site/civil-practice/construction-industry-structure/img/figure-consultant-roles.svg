<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="事業の段階ごとの主役の対応。調査・計画と設計と維持管理ではコンサルタントが、施工では施工者が主役になり、事業が進むと主役が替わる。設計段階の施工者は原則未参加" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
<rect width="400" height="500" fill="#ffffff"/>
<!-- 列見出し: 発注者=brand / コンサル=warn / 施工者=positive -->
<g stroke-width="1.5">
<rect x="90" y="14" width="94" height="32" rx="6" fill="#e8f0fe" stroke="#2e6da4"/>
<rect x="188" y="14" width="94" height="32" rx="6" fill="#fff3cd" stroke="#d4a017"/>
<rect x="286" y="14" width="94" height="32" rx="6" fill="#d0e8d0" stroke="#3a7d44"/>
</g>
<g fill="#222" text-anchor="middle" font-size="13" font-weight="700">
<text x="137" y="35">発注者</text>
<text x="235" y="35">コンサル</text>
<text x="333" y="35">施工者</text>
</g>
<!-- 段階名 -->
<g fill="#222" font-size="13" font-weight="700">
<text x="14" y="98">調査・計画</text>
<text x="14" y="180">設計</text>
<text x="14" y="262">施工</text>
<text x="14" y="344">維持管理</text>
</g>
<!-- 行1 調査・計画: 主役=コンサル -->
<g stroke-width="1.5">
<rect x="90" y="62" width="94" height="52" rx="6" fill="#f5f5f5" stroke="#d7d7d7"/>
<rect x="188" y="62" width="94" height="52" rx="6" fill="#fff3cd" stroke="#d4a017" stroke-width="3"/>
<rect x="286" y="62" width="94" height="52" rx="6" fill="#f5f5f5" stroke="#d7d7d7"/>
<rect x="90" y="144" width="94" height="52" rx="6" fill="#f5f5f5" stroke="#d7d7d7"/>
<rect x="188" y="144" width="94" height="52" rx="6" fill="#fff3cd" stroke="#d4a017" stroke-width="3"/>
<rect x="286" y="144" width="94" height="52" rx="6" fill="#f5f5f5" stroke="#d7d7d7"/>
<rect x="90" y="226" width="94" height="52" rx="6" fill="#f5f5f5" stroke="#d7d7d7"/>
<rect x="188" y="226" width="94" height="52" rx="6" fill="#f5f5f5" stroke="#d7d7d7"/>
<rect x="286" y="226" width="94" height="52" rx="6" fill="#d0e8d0" stroke="#3a7d44" stroke-width="3"/>
<rect x="90" y="308" width="94" height="52" rx="6" fill="#f5f5f5" stroke="#d7d7d7"/>
<rect x="188" y="308" width="94" height="52" rx="6" fill="#fff3cd" stroke="#d4a017" stroke-width="3"/>
<rect x="286" y="308" width="94" height="52" rx="6" fill="#f5f5f5" stroke="#d7d7d7"/>
</g>
<g text-anchor="middle" font-size="12">
<g fill="#555">
<text x="137" y="93">発注</text>
<text x="333" y="93">未選定</text>
<text x="137" y="175">条件提示</text>
<text x="333" y="175">原則未参加</text>
<text x="137" y="257">監督・検査</text>
<text x="235" y="257">支援</text>
<text x="137" y="339">補修判断</text>
<text x="333" y="339">補修工事</text>
</g>
<g fill="#222" font-weight="700">
<text x="235" y="93">調査・計画</text>
<text x="235" y="175">設計</text>
<text x="333" y="257">施工</text>
<text x="235" y="339">点検・診断</text>
</g>
</g>
<!-- 凡例 -->
<rect x="14" y="386" width="22" height="14" rx="3" fill="#fff3cd" stroke="#d4a017" stroke-width="3"/>
<rect x="14" y="410" width="22" height="14" rx="3" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
<g fill="#555" font-size="11">
<text x="44" y="397">太い枠は、その段階の主役</text>
<text x="44" y="421">薄い箱は、関与の仕方</text>
<text x="14" y="448">設計段階の施工者は原則未参加（ECIは技術協力）</text>
</g>
<g fill="#222" font-size="12" font-weight="700">
<text x="14" y="480">上流の成果が、下流の契約条件になる</text>
</g>
</svg>
