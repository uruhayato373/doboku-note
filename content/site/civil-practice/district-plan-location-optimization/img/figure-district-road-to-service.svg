<!-- authored 2026-11-05 doboku-note 自作。論点は都市計画法第12条の5・第33条、建築基準法第42条第1項第5号、道路法第8条・第18条。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="地区施設の道路が市町村道になるまでの流れ。地区整備計画で配置と規模が定まり、これに即して開発許可または道路位置の指定が行われる。次に市町村長が議会の議決を経て路線を認定し、区域決定と供用開始を公示して供用となる。認定の前は、まだ市町村道ではない。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 12px; fill: #555; }  /* ink-body */
      .h { font-size: 11px; fill: #8a8a8a; }  /* ink-muted */
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .b { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .k { fill: #222; }  /* ink-strong */
      .tag { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }  /* surface */
      .src { fill: #fff; stroke: #d7d7d7; stroke-width: 1.5; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }  /* brand-fill / brand */
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }  /* warn-fill / warn */
      .pos { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }  /* positive-fill / positive */
      .danger { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }  /* danger-fill / danger */
      .arr { stroke: #555; stroke-width: 1.5; fill: none; marker-end: url(#a); }
    </style>
    <marker id="a" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#555"/></marker>
  </defs>

  <rect class="warn" x="10" y="12" width="380" height="64" rx="6"/>
  <text class="n" x="22" y="38">地区整備計画</text>
  <text class="k" x="22" y="58">地区施設の道路の、配置と規模が決まる</text>

  <line class="arr" x1="200" y1="76" x2="200" y2="102"/>
  <text class="h" x="212" y="94">これに即して</text>

  <rect class="brand" x="10" y="104" width="185" height="82" rx="6"/>
  <text class="n" x="20" y="128">開発許可</text>
  <text class="k" x="20" y="150">道路や公園の設計を</text>
  <text class="k" x="20" y="168">審査する</text>
  <rect class="brand" x="205" y="104" width="185" height="82" rx="6"/>
  <text class="n" x="215" y="128">道路位置の指定</text>
  <text class="k" x="215" y="150">築造する者が特定</text>
  <text class="k" x="215" y="168">行政庁から受ける</text>

  <line class="arr" x1="200" y1="186" x2="200" y2="214"/>

  <rect class="pos" x="10" y="216" width="380" height="68" rx="6"/>
  <text class="n" x="22" y="240">路線認定</text>
  <text class="k" x="22" y="262">議会の議決を経て、市町村長が認定する</text>
  <text class="h" x="378" y="240" text-anchor="end">道路法第8条</text>

  <line class="arr" x1="200" y1="284" x2="200" y2="312"/>

  <rect class="pos" x="10" y="314" width="380" height="68" rx="6"/>
  <text class="n" x="22" y="338">供用</text>
  <text class="k" x="22" y="360">区域決定の公示と、供用開始の公示</text>
  <text class="h" x="378" y="338" text-anchor="end">道路法第18条</text>

  <rect class="danger" x="10" y="396" width="380" height="94" rx="8"/>
  <text class="n" x="22" y="420">認定の前は、まだ市町村道ではない</text>
  <text class="k" x="22" y="444">通行止めや修繕を求められたら、</text>
  <text class="k" x="22" y="464">認定と供用の公示があるかを先に確かめる</text>
</svg>
