<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="火山の現象と地形、最新の警戒範囲と規制、作業場所と経路を照合して、入場と退避の計画を更新する三つの確認">
  <defs><style>
    text { font-family: Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif; fill: #1a3a5c; }
    .h { font-size: 19px; font-weight: bold; } .b { font-size: 16px; }
    .a { fill: none; stroke: #2e6da4; stroke-width: 2; marker-end: url(#a); }
  </style><marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4" /></marker></defs>
  <rect width="400" height="500" fill="#ffffff" />
  <!-- All three checks are necessary; no general safe radius. -->
  <rect x="24" y="20" width="352" height="91" rx="8" fill="#e8f0fe" stroke="#2e6da4" />
  <text x="200" y="50" text-anchor="middle" class="h">現象と地形</text>
  <text x="200" y="76" text-anchor="middle" class="b">噴石・火砕流・泥流・降灰</text>
  <text x="200" y="100" text-anchor="middle" class="b">谷の上流と下流・風下も確認</text>
  <text x="200" y="137" text-anchor="middle" class="h">＋</text>
  <rect x="24" y="152" width="352" height="91" rx="8" fill="#fff3cd" stroke="#d4a017" />
  <text x="200" y="182" text-anchor="middle" class="h">最新の警戒範囲と規制</text>
  <text x="200" y="208" text-anchor="middle" class="b">火山別の警報・自治体等の情報</text>
  <text x="200" y="232" text-anchor="middle" class="b">レベルの数字だけで判断しない</text>
  <text x="200" y="269" text-anchor="middle" class="h">＋</text>
  <rect x="24" y="284" width="352" height="91" rx="8" fill="#e8f0fe" stroke="#2e6da4" />
  <text x="200" y="314" text-anchor="middle" class="h">現場と経路</text>
  <text x="200" y="340" text-anchor="middle" class="b">作業区画・資材置場・搬入路</text>
  <text x="200" y="364" text-anchor="middle" class="b">避難先まで連続して照合する</text>
  <path d="M200 380V414" class="a" />
  <rect x="24" y="422" width="352" height="62" rx="8" fill="#d0e8d0" stroke="#3a7d44" />
  <text x="200" y="449" text-anchor="middle" class="h">入場・退避の計画へ反映</text>
  <text x="200" y="473" text-anchor="middle" class="b">情報と工程が変われば更新</text>
</svg>
