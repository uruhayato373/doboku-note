<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="平面図の起点BP・交点IP・円曲線BC・EC・終点EPと、縦断図の地盤高・計画高、横断図の盛土断面を、同じ測点No.4で対応づけた概念図">
  <defs>
    <style>
      text { font-family: Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif; font-size: 11px; fill: #222; }
      .h { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .s { fill: #555; }
      .m { text-anchor: middle; }
      .pn { fill: #fff; stroke: #d7d7d7; stroke-width: 1.5; }
      .rt { fill: none; stroke: #2e6da4; stroke-width: 3; }
      .tg { fill: none; stroke: #8a8a8a; stroke-dasharray: 4 3; }
      .hl { stroke: #d4a017; stroke-width: 2.5; }
      .bx { fill: #fff3cd; stroke: #d4a017; }
    </style>
  </defs>
  <rect width="400" height="500" fill="#fff"/>
  <!-- panel frames: ink border -->
  <rect class="pn" x="10" y="10" width="380" height="176" rx="6"/>
  <rect class="pn" x="10" y="194" width="380" height="158" rx="6"/>
  <rect class="pn" x="10" y="360" width="380" height="132" rx="6"/>
  <!-- plan -->
  <text class="h" x="20" y="28">平面図</text>
  <path class="tg" d="M140 160H183.6L217.1 131.9"/>
  <path class="rt" d="M40 160H140A120 120 0 0 0 217.1 131.9L316.7 48.3"/>
  <circle cx="40" cy="160" r="4" fill="#2e6da4"/>
  <circle cx="316.7" cy="48.3" r="4" fill="#2e6da4"/>
  <circle cx="140" cy="160" r="3.5" fill="#fff" stroke="#2e6da4" stroke-width="2"/>
  <circle cx="217.1" cy="131.9" r="3.5" fill="#fff" stroke="#2e6da4" stroke-width="2"/>
  <circle cx="183.6" cy="160" r="4" fill="#fff" stroke="#b22234" stroke-width="2"/>
  <text x="22" y="178">BP 起点</text>
  <text class="m" x="140" y="149">BC</text>
  <text class="m" x="184" y="178">IP 交点</text>
  <text x="226" y="148">EC</text>
  <text class="s" x="150" y="126">円曲線</text>
  <text x="310" y="40" style="text-anchor:end">EP 終点</text>
  <path class="hl" d="M232.1 110.2L241.1 121"/>
  <rect class="bx" x="248" y="116" width="34" height="15" rx="3"/>
  <text class="m" x="265" y="127" style="font-weight:bold">No.4</text>
  <!-- profile -->
  <text class="h" x="20" y="212">縦断図</text>
  <path d="M40 282L92 270L143 252L195 262L207 268.5L195 270L143 276.7L92 283.3L40 290Z" fill="#fff3cd"/>
  <path d="M207 268.5L247 290L298 300L350 296V250L298 256.7L247 263.3Z" fill="#d0e8d0"/>
  <path class="tg" style="stroke:#555;stroke-width:1.5" d="M40 282L92 270L143 252L195 262L247 290L298 300L350 296"/>
  <path d="M40 290L350 250" fill="none" stroke="#2e6da4" stroke-width="2.5"/>
  <path d="M247 240V322" fill="none" stroke="#d4a017" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M244 263.3H250M244 290H250M247 263.3V290" fill="none" stroke="#b22234" stroke-width="2.5"/>
  <path d="M30 322H360" stroke="#8a8a8a"/>
  <path d="M40 322v4M92 322v4M143 322v4M195 322v4M247 322v4M298 322v4M350 322v4" stroke="#8a8a8a"/>
  <g class="m">
    <text x="40" y="338">No.0</text><text x="92" y="338">No.1</text><text x="143" y="338">No.2</text><text x="195" y="338">No.3</text><text x="298" y="338">No.5</text><text x="350" y="338">No.6</text>
  </g>
  <rect class="bx" x="229" y="327" width="36" height="15" rx="3"/>
  <text class="m" x="247" y="338" style="font-weight:bold">No.4</text>
  <path d="M252 207H272" stroke="#555" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="278" y="211">地盤高 GH</text>
  <path d="M252 223H272" stroke="#2e6da4" stroke-width="2.5"/>
  <text x="278" y="227">計画高 FH</text>
  <text class="m" x="143" y="268">切土</text>
  <text class="m" x="322" y="282">盛土</text>
  <text x="254" y="281">盛土高</text>
  <text class="m s" x="300" y="248" transform="rotate(-7.4 300 248)">縦断勾配</text>
  <!-- cross section -->
  <text class="h" x="20" y="378">横断図（No.4）</text>
  <path d="M20 450H380" stroke="#555" stroke-width="2"/>
  <path d="M80 450L140 410H260L320 450Z" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
  <path d="M200 396V462" stroke="#8a8a8a" stroke-dasharray="6 3 1 3"/>
  <text class="m s" x="200" y="392">CL</text>
  <text x="136" y="405" style="text-anchor:end">計画高 FH</text>
  <text x="22" y="444">地盤高 GH</text>
  <path d="M229 410H235M229 450H235M232 410V450" fill="none" stroke="#b22234" stroke-width="2.5"/>
  <text x="240" y="434">盛土高</text>
  <text class="m" x="165" y="436">断面積 A</text>
  <text x="306" y="420">のり勾配</text>
  <text x="306" y="434">1 : 1.5</text>
  <text class="m s" x="200" y="482">隣り合う断面積 A1・A2 から土量を求める</text>
</svg>
