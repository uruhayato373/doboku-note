<!-- authored 2026-10-15 doboku-note 自作。論点は、現場の条件から選ぶ特殊なコンクリートの対応（共通仕様書と土木学会示方書［施工編］の区分に沿う）。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="特殊なコンクリートを現場の条件から選ぶ対応図。先に、水を避ける、配筋を直す、時期を変えるで条件を動かせないかを見る。残った条件に応じて、日平均気温4℃以下は寒中、25℃超は暑中、打込み温度35℃超は35℃を超える暑中、水和熱が問題になる厚い部材はマス、水の中で打つは水中・水中不分離性、配筋が込み締固めが難しいは高流動・流動化、強度・軽さ・収縮補償は高強度・軽量骨材・膨張、型枠なしで面に付けるは吹付け・短繊維補強を選ぶ。条件が重なると対策が逆を向くので、解析か試験で示し承認を得る。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 13px; fill: #222; }
      .h1 { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .h2 { font-size: 12px; fill: #555; }
      .lb { font-size: 11px; fill: #555; }
      .cd { font-size: 13px; fill: #222; }
      .cs { font-size: 12px; fill: #222; }
      .tg { font-size: 11px; font-weight: bold; fill: #2e6da4; }
      .nt { font-size: 11px; fill: #555; }
      .sl { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .wn { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .card { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1.5; }
      .strip { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .sel { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .ar { stroke: #2e6da4; stroke-width: 2.5; fill: none; }
    </style>
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  </defs>

  <rect class="strip" x="10" y="10" width="380" height="52" rx="8"/>
  <text class="h1" x="22" y="32">先に、条件のほうを動かせないか</text>
  <text class="h2" x="22" y="51">行ごとに、先に動かせないか見る</text>
  <path class="ar" d="M40,62V80" marker-end="url(#ah)"/>
  <text class="lb" x="52" y="76">それでも残った条件だけ</text>
  <rect class="card" x="10" y="90" width="190" height="34" rx="8"/>
  <text class="tg" x="20" y="103">先に：打設時期を変える</text>
  <text class="cd" x="20" y="118">日平均気温が4℃以下</text>
  <path class="ar" d="M203,107H223" marker-end="url(#ah)"/>
  <rect class="sel" x="226" y="90" width="164" height="34" rx="8"/><text class="sl" x="236" y="112">寒中</text>
  <rect class="card" x="10" y="130" width="190" height="34" rx="8"/>
  <text class="tg" x="20" y="143">先に：打設時期を変える</text>
  <text class="cd" x="20" y="158">日平均気温が25℃超</text>
  <path class="ar" d="M203,147H223" marker-end="url(#ah)"/>
  <rect class="sel" x="226" y="130" width="164" height="34" rx="8"/><text class="sl" x="236" y="152">暑中</text>
  <rect class="card" x="28" y="170" width="172" height="34" rx="8"/>
  <text class="cd" x="38" y="192">打込み温度が35℃を超える</text>
  <path class="ar" d="M203,187H223" marker-end="url(#ah)"/>
  <rect class="sel" x="226" y="170" width="164" height="34" rx="8"/><text class="sl" x="236" y="192">35℃超の暑中（別章）</text>
  <rect class="card" x="10" y="210" width="190" height="34" rx="8"/>
  <text class="cs" x="20" y="232">水和熱が問題になる厚い部材</text>
  <path class="ar" d="M203,227H223" marker-end="url(#ah)"/>
  <rect class="sel" x="226" y="210" width="164" height="34" rx="8"/><text class="sl" x="236" y="232">マス</text>
  <rect class="card" x="10" y="250" width="190" height="34" rx="8"/>
  <text class="tg" x="20" y="263">先に：水を避ける</text>
  <text class="cd" x="20" y="278">水の中で打つ</text>
  <path class="ar" d="M203,267H223" marker-end="url(#ah)"/>
  <rect class="sel" x="226" y="250" width="164" height="34" rx="8"/><text class="sl" x="236" y="272">水中・水中不分離性</text>
  <rect class="card" x="10" y="290" width="190" height="34" rx="8"/>
  <text class="tg" x="20" y="303">先に：配筋を直す</text>
  <text class="cs" x="20" y="318">配筋が込み、締固めが難しい</text>
  <path class="ar" d="M203,307H223" marker-end="url(#ah)"/>
  <rect class="sel" x="226" y="290" width="164" height="34" rx="8"/><text class="sl" x="236" y="312">高流動・流動化</text>
  <rect class="card" x="10" y="330" width="190" height="34" rx="8"/>
  <text class="cd" x="20" y="352">強度・軽さ・収縮補償</text>
  <path class="ar" d="M203,347H223" marker-end="url(#ah)"/>
  <rect class="sel" x="226" y="330" width="164" height="34" rx="8"/><text class="sl" x="236" y="352">高強度・軽量骨材・膨張</text>
  <rect class="card" x="10" y="370" width="190" height="34" rx="8"/>
  <text class="cd" x="20" y="392">型枠なしで面に付ける</text>
  <path class="ar" d="M203,387H223" marker-end="url(#ah)"/>
  <rect class="sel" x="226" y="370" width="164" height="34" rx="8"/><text class="sl" x="236" y="392">吹付け・短繊維補強</text>
  <path d="M18,164 V187 H27" fill="none" stroke="#2e6da4" stroke-width="1.5"/>
  <rect class="warn" x="10" y="414" width="380" height="78" rx="8"/>
  <text class="wn" x="22" y="434">条件が重なると、対策が逆を向く</text>
  <text class="nt" x="22" y="452">冬×厚い部材：給熱・早強が最高温度を上げる</text>
  <text class="nt" x="22" y="468">厚い部材×高強度・高流動：結合材増で水和熱が増える</text>
  <text class="nt" x="22" y="484">寒冷地×軽量骨材：吸水が圧送と凍結融解に響く</text>
</svg>
