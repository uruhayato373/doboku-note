      .b-warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .b-dan { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .b-sur { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .b-wh { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1.5; }
      .a { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .ln { stroke: #8a8a8a; stroke-width: 1; fill: none; }
      .ld { stroke: #8a8a8a; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    </style>
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  </defs>
  <rect class="b-sur" x="10" y="10" width="380" height="22" rx="4"/>
  <text class="tb" x="18" y="25.5">適正回答率が高い3項目</text>
  <text class="tx" x="14" y="52">下請代金の支払期間</text>
  <rect class="b-pos" x="14" y="60" width="325.71" height="18" rx="3"/>
  <text class="tn" x="345.71" y="74">98.7％</text>
  <text class="tx" x="14" y="106">下請代金の決定方法</text>
  <rect class="b-pos" x="14" y="114" width="316.79999999999995" height="18" rx="3"/>
  <text class="tn" x="336.79999999999995" y="128">96.0％</text>
  <text class="tx" x="14" y="160">支払手段</text>
  <rect class="b-pos" x="14" y="168" width="306.57" height="18" rx="3"/>
  <text class="tn" x="326.57" y="182">92.9％</text>
  <rect class="b-sur" x="10" y="206" width="380" height="22" rx="4"/>
  <text class="tb" x="18" y="221.5">適正回答率が低い4項目</text>
  <text class="tx" x="14" y="248">契約締結方法</text>
  <text class="ts" x="94" y="248">請負契約書の相互交付か、約款の添付か</text>
  <rect class="b-warn" x="14" y="256" width="206.91" height="18" rx="3"/>
  <text class="tn" x="226.91" y="270">62.7％</text>
  <text class="tx" x="14" y="302">施工体制台帳の添付書類</text>
  <text class="ts" x="168" y="302">民間工事の台帳に必要書類を付けたか</text>
  <rect class="b-warn" x="14" y="310" width="160.71" height="18" rx="3"/>
  <text class="tn" x="180.71" y="324">48.7％</text>
