  <text class="ts" x="94" y="410">見積条件14項目のすべてを示したか</text>
  <rect class="b-warn" x="14" y="418" width="59.06999999999999" height="18" rx="3"/>
  <text class="tn" x="79.07" y="432">17.9％</text>
