<!-- authored 2026-10-16 doboku-note 自作。件数は国土交通省の令和7年度の活動結果の本文記載どおり -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="監督の入口の流れ。通報・申告と毎年の実態調査が端緒になる。令和7年度の疑義情報の受付は3,558件でうち駆け込みホットラインが1,946件、違反の疑いとして抽出されたのは612件。請負契約の締結状況の調査を経て、指導・助言、必要なら報告徴収・立入検査へ進み、立入検査等は1,152業者・1,318件。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 12px; fill: #222; }
      .tb { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .tx { font-size: 12px; fill: #222; }
      .ts { font-size: 11px; fill: #555; }
      .tn { font-size: 13px; font-weight: bold; fill: #222; }
      .b-brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .b-pos { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .b-warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .b-dan { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .b-sur { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .a { stroke: #2e6da4; stroke-width: 2; fill: none; }
    </style>
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  </defs>
  <rect class="b-brand" x="14" y="14" width="180" height="56" rx="6"/>
  <text class="tb" x="24" y="34">通報・申告</text>
  <text class="ts" x="24" y="50">駆け込みホットライン</text>
  <text class="ts" x="24" y="64">法第30条の申告</text>
  <rect class="b-brand" x="206" y="14" width="180" height="56" rx="6"/>
  <text class="tb" x="216" y="34">毎年の実態調査</text>
  <text class="ts" x="216" y="50">調査票の回答が端緒に</text>
  <line class="a" x1="104" y1="70" x2="104" y2="92" marker-end="url(#ah)"/>
  <line class="a" x1="296" y1="70" x2="296" y2="92" marker-end="url(#ah)"/>
  <rect class="b-pos" x="14" y="96" width="180" height="80" rx="6"/>
  <text class="tb" x="24" y="118">疑義情報の受付</text>
  <text class="tn" x="24" y="138">令和7年度 3,558件</text>
  <text class="ts" x="24" y="156">うち駆け込み</text>
  <text class="ts" x="24" y="170">ホットライン1,946件</text>
  <rect class="b-warn" x="206" y="96" width="180" height="80" rx="6"/>
  <text class="tb" x="216" y="118">違反の疑いとして抽出</text>
  <text class="tn" x="216" y="138">612件</text>
  <text class="ts" x="216" y="156">端緒情報のうち、技能者の</text>
  <text class="ts" x="216" y="170">処遇に影響しうるもの</text>
  <line class="a" x1="104" y1="176" x2="150" y2="206" marker-end="url(#ah)"/>
  <line class="a" x1="296" y1="176" x2="250" y2="206" marker-end="url(#ah)"/>
  <rect class="b-brand" x="14" y="210" width="372" height="60" rx="6"/>
  <text class="tb" x="26" y="234">請負契約の締結状況を調査</text>
  <text class="ts" x="26" y="254">法第40条の4。情報提供者とその取引相手が対象</text>
  <line class="a" x1="200" y1="270" x2="200" y2="296" marker-end="url(#ah)"/>
  <rect class="b-dan" x="14" y="300" width="372" height="84" rx="6"/>
  <text class="tb" x="26" y="324">指導・助言、必要なら報告徴収・立入検査</text>
  <text class="ts" x="26" y="344">法第31条</text>
  <text class="tn" x="26" y="366">令和7年度 1,152業者・1,318件</text>
  <rect class="b-sur" x="14" y="404" width="372" height="56" rx="6"/>
  <text class="ts" x="26" y="426">件数は令和7年度（国土交通省の活動結果）。</text>
  <text class="ts" x="26" y="442">立入検査等には、建設Gメンによる調査も含む。</text>
</svg>
