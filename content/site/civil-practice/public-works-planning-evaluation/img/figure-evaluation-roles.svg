<!-- authored 2026-10-15 doboku-note 自作。論点は補助事業等の新規事業採択時評価・再評価・事後評価の実施要領（令和7年9月18日施行）が定める、市（実施主体）と本省等の分担。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="補助事業の評価で市と国が分担する流れ図。新規採択は市が資料を作り本省等が対応方針を決める。再評価は市が資料を作り委員会の意見を聴いて対応方針を決め、本省等が補助金交付等の対応方針を決める。事後評価は市が行う。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 12px; fill: #555; }
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .x { font-size: 12px; fill: #222; }
      .s { font-size: 11px; fill: #555; }
      .sb { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .p { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .d { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .g { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .wh { fill: #fff; stroke: #8a8a8a; stroke-width: 1.5; }
      .dz { fill: #fff; stroke: #2e6da4; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .l { stroke: #d7d7d7; stroke-width: 1; fill: none; }
      .a { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .ar { stroke: #b22234; stroke-width: 2; fill: none; }
      .ag { stroke: #3a7d44; stroke-width: 2; fill: none; }
      .ax { stroke: #8a8a8a; stroke-width: 2; fill: none; }
    </style>
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
    <marker id="ahr" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#b22234"/></marker>
    <marker id="ahg" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#3a7d44"/></marker>
    <marker id="ahk" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#8a8a8a"/></marker>
  </defs>
  <text class="n" x="106" y="20" text-anchor="middle">市（事業主体）</text>
  <text class="n" x="306" y="20" text-anchor="middle">国（本省等）</text>
  <rect class="g" x="8" y="30" width="384" height="20" rx="4"/>
  <text class="sb" x="16" y="44" text-anchor="start">新規事業採択時評価</text>
  <rect class="b" x="14" y="58" width="184" height="56" rx="8"/>
  <text class="t" x="106.0" y="82.0" text-anchor="middle">評価の資料を作成</text>
  <text class="s" x="106.0" y="98.0" text-anchor="middle">費用便益比・計画の目標と指標</text>
  <path class="a" d="M198,86H228" marker-end="url(#ah)"/>
  <rect class="w" x="232" y="58" width="154" height="56" rx="8"/>
  <text class="t" x="309.0" y="75.0" text-anchor="middle">本省等が</text>
  <text class="s" x="309.0" y="90.0" text-anchor="middle">補助金交付等に係る</text>
  <text class="s" x="309.0" y="105.0" text-anchor="middle">対応方針を決定</text>
  <rect class="g" x="8" y="126" width="384" height="20" rx="4"/>
  <text class="sb" x="16" y="140" text-anchor="start">再評価</text>
  <rect class="b" x="14" y="154" width="184" height="44" rx="8"/>
  <text class="t" x="106.0" y="180.0" text-anchor="middle">評価の資料を作成</text>
  <path class="a" d="M106,198V212" marker-end="url(#ah)"/>
  <rect class="b" x="14" y="213" width="184" height="56" rx="8"/>
  <text class="t" x="106.0" y="237.0" text-anchor="middle">事業評価監視委員会の意見</text>
  <text class="s" x="106.0" y="253.0" text-anchor="middle">県の委員会に依頼も可</text>
  <path class="a" d="M106,269V283" marker-end="url(#ah)"/>
  <rect class="b" x="14" y="284" width="184" height="44" rx="8"/>
  <text class="t" x="106.0" y="310.0" text-anchor="middle">対応方針を決定</text>
  <path class="a" d="M198,306H228" marker-end="url(#ah)"/>
  <text class="s" x="213" y="298" text-anchor="middle">送付</text>
  <rect class="w" x="232" y="270" width="154" height="72" rx="8"/>
  <text class="t" x="309.0" y="295.0" text-anchor="middle">本省等が</text>
  <text class="s" x="309.0" y="310.0" text-anchor="middle">補助金交付等に係る</text>
  <text class="s" x="309.0" y="325.0" text-anchor="middle">対応方針を決定</text>
  <rect class="g" x="8" y="346" width="384" height="20" rx="4"/>
  <text class="sb" x="16" y="360" text-anchor="start">事後評価</text>
  <rect class="b" x="14" y="374" width="372" height="44" rx="8"/>
  <text class="t" x="200.0" y="400.0" text-anchor="middle">実施主体の市が行う（完了後5年以内）</text>
  <rect class="d" x="14" y="430" width="372" height="54" rx="8"/>
  <text class="t" x="200.0" y="452.0" text-anchor="middle">委員会の意見を聴くのは、再評価の手順</text>
  <text class="s" x="200.0" y="470.0" text-anchor="middle">新規採択の資料づくりと事後評価は、市が担う</text>
</svg>
