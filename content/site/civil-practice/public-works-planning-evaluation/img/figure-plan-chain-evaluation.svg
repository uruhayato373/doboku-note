<!-- authored 2026-10-15 doboku-note 自作。論点は国土形成計画・社会資本整備重点計画から市の個別施設計画までの計画の鎖と、国土交通省の事業評価（計画段階・新規採択時・再評価・事後）の段階。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="計画の鎖と評価の段階を並べた図。左は上から社会資本整備重点計画、国土形成計画、県の計画、市のマスタープランと市町村計画、個別施設計画、事業の順で、位置づけは事業から上へたどる。右は事業の評価で、計画段階評価、新規事業採択時評価、再評価、事後評価の順。計画段階評価は直轄等が対象で、評価は重点目標に照らす。">
  <defs>
  <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 11px; fill: #555; }
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t { font-size: 11px; fill: #1a3a5c; }
      .b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .ok { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .wn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .sf { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .a { stroke: #2e6da4; stroke-width: 2; fill: none; }
  </style>
  <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  </defs>

  <rect class="b" x="14" y="16" width="192" height="56" rx="8"/>
  <text class="n" x="110" y="40" text-anchor="middle">社会資本整備重点計画</text>
  <text class="t" x="110" y="59" text-anchor="middle">重点目標</text>
  <rect class="b" x="14" y="88" width="192" height="56" rx="8"/>
  <text class="n" x="110" y="112" text-anchor="middle">国土形成計画</text>
  <text class="t" x="110" y="131" text-anchor="middle">全国計画・広域地方計画</text>
  <rect class="b" x="14" y="160" width="192" height="56" rx="8"/>
  <text class="n" x="110" y="184" text-anchor="middle">県の計画</text>
  <text class="t" x="110" y="203" text-anchor="middle">都道府県計画</text>
  <rect class="b" x="14" y="232" width="192" height="56" rx="8"/>
  <text class="n" x="110" y="256" text-anchor="middle">市の計画</text>
  <text class="t" x="110" y="275" text-anchor="middle">マスタープラン・市町村計画</text>
  <rect class="b" x="14" y="304" width="192" height="56" rx="8"/>
  <text class="n" x="110" y="328" text-anchor="middle">個別施設計画</text>
  <text class="t" x="110" y="347" text-anchor="middle">事業の直接の根拠</text>
  <rect class="ok" x="14" y="376" width="192" height="56" rx="8"/>
  <text class="n" x="110" y="400" text-anchor="middle">事業</text>
  <text class="t" x="110" y="419" text-anchor="middle">補助事業</text>

  <path class="a" d="M110,376V361" marker-end="url(#ah)"/>
  <path class="a" d="M110,304V289" marker-end="url(#ah)"/>
  <path class="a" d="M110,232V217" marker-end="url(#ah)"/>
  <path class="a" d="M110,160V145" marker-end="url(#ah)"/>
  <path class="a" d="M110,88V73" marker-end="url(#ah)"/>

  <text class="n" x="309" y="182" text-anchor="middle">事業の評価</text>
  <rect class="sf" x="232" y="190" width="154" height="50" rx="8"/>
  <text class="n" x="309" y="212" text-anchor="middle">計画段階評価</text>
  <text class="t" x="309" y="229" text-anchor="middle">直轄等が対象</text>
  <rect class="b" x="232" y="254" width="154" height="50" rx="8"/>
  <text class="n" x="309" y="284" text-anchor="middle">新規事業採択時評価</text>
  <rect class="b" x="232" y="318" width="154" height="50" rx="8"/>
  <text class="n" x="309" y="348" text-anchor="middle">再評価</text>
  <rect class="b" x="232" y="382" width="154" height="50" rx="8"/>
  <text class="n" x="309" y="412" text-anchor="middle">事後評価</text>
  <path class="a" d="M309,240V253" marker-end="url(#ah)"/>
  <path class="a" d="M309,304V317" marker-end="url(#ah)"/>
  <path class="a" d="M309,368V381" marker-end="url(#ah)"/>

  <path d="M309,166V44H208" fill="none" style="stroke:#2e6da4;stroke-width:1.5;stroke-dasharray:4 3" marker-end="url(#ah)"/>
  <text x="318" y="106">重点目標に</text>
  <text x="318" y="120">照らす</text>

  <rect class="sf" x="14" y="450" width="372" height="40" rx="8"/>
  <text class="n" x="200" y="475" text-anchor="middle">位置づけの欄は、事業から上へたどる</text>
</svg>
