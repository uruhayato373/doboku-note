<!-- authored 2026-10-15 doboku-note 自作。論点は災害対策基本法第34条・第42条、水防法第7条・第33条の計画の階層。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="防災の計画と水防の計画の三階建ての図。国の防災基本計画に基づいて市町村地域防災計画を作り、都道府県地域防災計画に抵触しない。水防は都道府県の水防計画に、指定管理団体の水防計画をそろえる。市町村地域防災計画では事務の大綱、事項別の計画、整備の計画の欄を土木担当が確かめる。">
  <defs>
