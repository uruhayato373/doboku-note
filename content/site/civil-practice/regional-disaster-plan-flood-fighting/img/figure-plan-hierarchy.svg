  <text class="s" x="297" y="214" text-anchor="middle">知事が毎年検討</text>
  <rect class="b-b" x="10" y="276" width="185" height="196" rx="8"/>
  <text class="t" x="102" y="302" text-anchor="middle">市町村地域防災計画</text>
