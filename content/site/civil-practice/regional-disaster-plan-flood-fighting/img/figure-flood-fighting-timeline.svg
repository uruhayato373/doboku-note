<!-- authored 2026-10-15 doboku-note 自作。論点は水防法第9条・第10条・第16条・第17条・第24条の2・第28条と災害対策基本法第60条・第76条の6の時期ごとの受け持ち。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="水防の時期ごとの役割分担の帯図。平時、出水期前、警戒、切迫・発災の順に、河川管理者、水防管理者、土木担当、市町村長の受け持ちを並べる。出水期前は水防管理者が危険箇所を河川管理者へ連絡して合同巡視。警戒では河川管理者が洪水予報と水防警報を出して水防管理者が出動を準備。切迫・発災では氾濫の危険を通報し、土木担当が判断材料を渡して市町村長が避難指示を出す。">
