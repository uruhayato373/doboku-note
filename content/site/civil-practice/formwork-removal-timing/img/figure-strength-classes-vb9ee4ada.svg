<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="型枠取外しに必要な圧縮強度を部材面で3段階に分けた図。厚い部材の鉛直面3.5、薄い部材の鉛直面5.0、スラブ・はりの底面14.0 N/mm²で、上から順に外す">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; font-size: 12px; fill: #1a3a5c; }
      .h { font-size: 13px; font-weight: bold; }
      .s { font-size: 12px; fill: #222; }
      .n { font-size: 11px; fill: #555; }
      .lb { font-size: 11px; font-weight: bold; fill: #2e6da4; }
      .m { text-anchor: middle; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .positive { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .danger { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .surface { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .ar { stroke: #2e6da4; stroke-width: 2.5; fill: none; }
    </style>
    <!-- brand / positive / warn / danger / surface tokens -->
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  </defs>
  <rect width="400" height="500" fill="#ffffff" />
  <text class="n m" x="26" y="30">外す順</text>
  <path class="ar" d="M26,40 V398" marker-end="url(#ah)"/>
  <rect class="brand" x="50" y="46" width="340" height="112" rx="8"/>
  <text class="h" x="160" y="70">厚い部材の鉛直面</text>
  <text class="n" x="160" y="88">例：フーチング側面</text>
  <text class="s" x="160" y="106">構造的な負担はほぼなく、</text>
  <text class="s" x="160" y="122">角欠け・表面損傷の回避が目的</text>
  <text class="s" x="160" y="148" style="font-size:18px;font-weight:bold">3.5 N/mm²</text>
  <rect x="64" y="86" width="84" height="44" fill="#d7d7d7" stroke="#8a8a8a" stroke-width="1"/>
  <path d="M64,86 V130" stroke="#b22234" stroke-width="4" fill="none"/>
  <path d="M58,80 V136" stroke="#555" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
  <rect class="warn" x="50" y="164" width="340" height="112" rx="8"/>
  <text class="h" x="160" y="188">薄い部材の鉛直面</text>
  <text class="n" x="160" y="206">例：柱・壁・はり側面</text>
  <text class="s" x="160" y="224">45°より急な下面も</text>
  <text class="s" x="160" y="240">薄く、脱型の衝撃で欠けやすい</text>
  <text class="s" x="160" y="266" style="font-size:18px;font-weight:bold">5.0 N/mm²</text>
  <rect x="96" y="182" width="22" height="76" fill="#d7d7d7" stroke="#8a8a8a" stroke-width="1"/>
  <path d="M96,182 V258" stroke="#b22234" stroke-width="4" fill="none"/>
  <path d="M90,176 V264" stroke="#555" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
  <rect class="danger" x="50" y="282" width="340" height="112" rx="8"/>
  <text class="h" x="160" y="306">スラブ・はりの底面</text>
  <text class="n" x="160" y="324">例：橋梁スラブ、アーチ内面</text>
  <text class="s" x="160" y="342">45°より緩い下面も</text>
  <text class="s" x="160" y="358">自重を型枠なしで支える面</text>
  <text class="s" x="160" y="384" style="font-size:18px;font-weight:bold">14.0 N/mm²</text>
  <rect x="64" y="312" width="84" height="16" fill="#d7d7d7" stroke="#8a8a8a" stroke-width="1"/>
  <path d="M72,328 V378" stroke="#555" stroke-width="2" fill="none"/>
  <path d="M106,328 V378" stroke="#555" stroke-width="2" fill="none"/>
  <path d="M140,328 V378" stroke="#555" stroke-width="2" fill="none"/>
  <path d="M64,378 H148" stroke="#555" stroke-width="1.5" fill="none"/>
  <path d="M64,328 H148" stroke="#b22234" stroke-width="4" fill="none"/>
  <path d="M24,414 H44" stroke="#b22234" stroke-width="4" fill="none"/>
  <text class="n" x="52" y="418">太線は、型枠を外した面</text>
  <rect class="surface" x="10" y="426" width="380" height="66" rx="8"/>
  <text class="h" x="22" y="446">標準養生の供試体は判定に使わない</text>
  <text class="s" x="22" y="464">構造物と同じ状態で養生した供試体を使う</text>
  <text class="s" x="22" y="481">大きな部材は現場封かん、薄い部材は現場水中</text>
</svg>
