<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="現場の無線を運べる量で二段に分け、各無線の条件を並べた図。無線LANは見通しが要り、携帯網は圏内が前提。ZigBeeの中継は外部電源、Bluetoothは近くの機器と1対1">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; font-size: 12px; fill: #222; }
      .b { font-weight: bold; font-size: 13px; }
      .g { font-weight: bold; font-size: 13px; fill: #1a3a5c; }
      .s { font-size: 11px; fill: #555; }
      .low { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .high { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .tag { fill: #fff; stroke: #d7d7d7; stroke-width: 1.5; }
      .tagd { fill: #fff; stroke: #d4a017; stroke-width: 1.5; stroke-dasharray: 4 3; }
    </style>
  </defs>
  <text class="g" x="15" y="22">運べる量が大きい：映像・大量のデータ</text>
  <rect class="high" x="15" y="30" width="370" height="58" rx="8"/>
  <text class="b" x="27" y="54">無線LAN</text><text class="s" x="27" y="72">2.4・5・6GHz帯</text>
  <rect class="tag" x="150" y="38" width="226" height="20" rx="5"/><text x="158" y="53">見通しの取れる範囲で映像を送る</text>
  <rect class="tag" x="150" y="62" width="226" height="20" rx="5"/><text x="158" y="77">周波数が高く、遮蔽物に弱い</text>
  <rect class="high" x="15" y="94" width="370" height="58" rx="8"/>
  <text class="b" x="27" y="118">携帯網</text><text class="s" x="27" y="136">LTE・5G</text>
  <rect class="tag" x="150" y="102" width="226" height="20" rx="5"/><text x="158" y="117">広い範囲で映像を送る</text>
  <rect class="tag" x="150" y="126" width="226" height="20" rx="5"/><text x="158" y="141">契約と圏内であることが前提</text>
  <text class="g" x="15" y="180">運べる量が小さい：電池で動く端末</text>
  <rect class="low" x="15" y="188" width="370" height="58" rx="8"/>
  <text class="b" x="27" y="212">920MHz帯</text><text class="s" x="27" y="230">特定小電力無線</text>
  <rect class="tag" x="150" y="196" width="226" height="20" rx="5"/><text x="158" y="211">小さな値を広く集める</text>
  <rect class="tag" x="150" y="220" width="226" height="20" rx="5"/><text x="158" y="235">回り込みやすく省電力</text>
  <rect class="low" x="15" y="252" width="370" height="58" rx="8"/>
  <text class="b" x="27" y="276">ZigBee</text><text class="s" x="27" y="294">メッシュ</text>
  <rect class="tag" x="150" y="260" width="226" height="20" rx="5"/><text x="158" y="275">遮蔽物の多い範囲に端末を多数</text>
  <rect class="tagd" x="150" y="284" width="226" height="20" rx="5"/><text x="158" y="299">端末は電池、中継は外部電源</text>
  <rect class="low" x="15" y="316" width="370" height="58" rx="8"/>
  <text class="b" x="27" y="340">Bluetooth</text><text class="s" x="27" y="358">2.4GHz帯</text>
  <rect class="tag" x="150" y="324" width="226" height="20" rx="5"/><text x="158" y="339">近くの機器と1対1で接続</text>
  <rect class="tag" x="150" y="348" width="226" height="20" rx="5"/><text x="158" y="363">消費電力が非常に低い</text>
  <rect x="15" y="388" width="370" height="100" rx="8" style="fill:#fff3cd;stroke:#d4a017;stroke-width:1.5"/>
  <text x="27" y="414">映像・大量のデータ：無線LAN、携帯網</text>
  <text x="27" y="438">遠く・電池長持ち：920MHz帯、ZigBee</text>
  <text x="27" y="462">近くの機器と電池で：Bluetooth</text>
</svg>
