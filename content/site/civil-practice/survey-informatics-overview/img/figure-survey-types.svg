<!-- authored 2026-10-16 doboku-note 自作。論点は測量法の基本測量（第4条）・公共測量（第5条）・それ以外（第6条）を分ける問いと、基準・手続き（第32条・第33条・第48条）。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="測量法の測量の種類を分ける問いの図。国土地理院が行えば基本測量。国や公共団体が費用を負担・補助していれば公共測量。基本・公共の成果を使い許可や助成を受ける事業で国土交通大臣が指定したものも公共測量。基本・公共の成果を使うなら第6条の測量。">
  <defs>
  <style>
