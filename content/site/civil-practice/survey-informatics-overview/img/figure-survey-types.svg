  <text x="24" y="408">公共測量: 承認を受けた作業規程で実施（第33条）</text>
  <text x="24" y="426">公共測量: 既存の測量成果に基づく（第32条）</text>
  <text x="24" y="444">従事する技術者: 測量士・測量士補（第48条）</text>
