  <marker id="asg" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  </defs>
  <rect class="brand" x="12" y="8" width="230" height="40" rx="8"/>
  <text class="t12" x="127.0" y="32.0" text-anchor="middle">国土地理院が行う測量か</text>
  <rect class="brand" x="12" y="74" width="230" height="52" rx="8"/>
  <text class="t12" x="127.0" y="96.0" text-anchor="middle">国や公共団体が費用を</text>
  <text class="t12" x="127.0" y="112.0" text-anchor="middle">負担・補助しているか</text>
  <rect class="brand" x="12" y="152" width="230" height="66" rx="8"/>
  <text class="t12" x="127.0" y="173.0" text-anchor="middle">基本・公共の成果を使い、</text>
