<!-- authored 2026-10-16 doboku-note 自作。論点は測量法の基本測量（第4条）・公共測量（第5条）・それ以外（第6条）と、基準・手続き（第11条・第32条・第33条・第48条）。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="測量法の三つの測量を、誰が・何のために行うかと、基準・手続きの二つの軸で比べた図。基本測量は国土地理院が行い、公共測量は国や公共団体が費用を負担・補助し承認を受けた作業規程で行う。それ以外の測量は基本・公共の成果を使う場合に限られる。">
  <defs>
  <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 11px; fill: #222; }
      .b { font-weight: bold; fill: #1a3a5c; }
      .m { fill: #555; }
      .t12 { font-size: 12px; }
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .pos { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .sf { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .wh { fill: #fff; stroke: #2e6da4; stroke-width: 1.5; }
      .grid { stroke: #d7d7d7; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .ax { stroke: #555; stroke-width: 1.5; fill: none; }
      .ar { stroke: #2e6da4; stroke-width: 2.5; fill: none; }
  </style>
  <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  <marker id="ak" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  <marker id="as" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  </defs>
  <rect class="sf" x="98" y="8" width="138" height="28" rx="6"/><text class="b" x="167" y="26" text-anchor="middle">誰が・何のために</text>
  <rect class="sf" x="240" y="8" width="148" height="28" rx="6"/><text class="b" x="314" y="26" text-anchor="middle">基準・手続き</text>
  <rect class="brand" x="12" y="44" width="82" height="106" rx="8"/><text class="n" x="53" y="95" text-anchor="middle">基本測量</text><text class="m" x="53" y="113" text-anchor="middle">第4条</text>
  <rect class="wh" x="98" y="44" width="138" height="106" rx="8" style="stroke:#d7d7d7"/>
  <text class="t12" x="106" y="70">国土地理院が行う</text>
  <text class="t12" x="106" y="90">すべての測量の</text>
  <text class="t12" x="106" y="110">基礎になる</text>
  <rect class="wh" x="240" y="44" width="148" height="106" rx="8" style="stroke:#d7d7d7"/>
  <text class="t12" x="248" y="68">第11条の基準に従う</text>
  <rect class="pos" x="12" y="158" width="82" height="106" rx="8"/><text class="n" x="53" y="209" text-anchor="middle">公共測量</text><text class="m" x="53" y="227" text-anchor="middle">第5条</text>
  <rect class="wh" x="98" y="158" width="138" height="106" rx="8" style="stroke:#d7d7d7"/>
  <text class="t12" x="106" y="184">国や公共団体が</text>
  <text class="t12" x="106" y="204">費用を負担・補助</text>
  <text class="t12" x="106" y="224">する測量など</text>
  <rect class="wh" x="240" y="158" width="148" height="106" rx="8" style="stroke:#d7d7d7"/>
  <text class="t12" x="248" y="182">第11条の基準に従う</text>
  <text class="t12" x="248" y="200">作業規程の承認</text>
  <text class="t12 m" x="248" y="218">（第33条）</text>
  <text class="t12" x="248" y="236">既存の成果に基づく</text>
  <text class="t12 m" x="248" y="254">（第32条）</text>
  <rect class="sf" x="12" y="272" width="82" height="106" rx="8"/><text class="n" x="53" y="323" text-anchor="middle">それ以外</text><text class="m" x="53" y="341" text-anchor="middle">第6条</text>
  <rect class="wh" x="98" y="272" width="138" height="106" rx="8" style="stroke:#d7d7d7"/>
  <text class="t12" x="106" y="298">基本・公共の</text>
  <text class="t12" x="106" y="318">どちらでもない</text>
  <rect class="wh" x="240" y="272" width="148" height="106" rx="8" style="stroke:#d7d7d7"/>
  <text class="t12" x="248" y="296">基本・公共の成果を</text>
  <text class="t12" x="248" y="314">使う場合に限る</text>
  <rect class="warn" x="12" y="394" width="376" height="72" rx="8"/>
  <text class="b" x="24" y="420">基本測量・公共測量に従事する技術者</text>
  <text x="24" y="444">登録を受けた測量士・測量士補（第48条）</text>
</svg>
