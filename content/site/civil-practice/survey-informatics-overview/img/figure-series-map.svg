<!-- authored 2026-10-16 doboku-note 自作。論点は測量・情報化シリーズ（台帳 config/content-series.json の survey-informatics）の章と、仕事の流れ（測る・地図や台帳にする・設計と施工に使う・維持管理で記録を積む）の対応。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="測量・情報化シリーズの見取り図。横軸は仕事の流れ（測る、地図や台帳にする、設計・施工に使う、維持管理で記録を積む）、縦軸は位置・地図・3次元・センサ・データの五つの層。G-01からG-17の各章を、その位置に置いている。">
