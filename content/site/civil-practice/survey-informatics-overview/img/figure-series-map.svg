      .band { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1; }
      .head { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .chip { fill: #fff; stroke: #2e6da4; stroke-width: 1.5; }
      .sep { stroke: #d7d7d7; stroke-width: 1; stroke-dasharray: 3 3; }
