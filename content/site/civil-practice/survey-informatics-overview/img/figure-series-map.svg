<!-- authored 2026-10-16 doboku-note 自作。論点は測量・情報化シリーズの章と、仕事の流れ（測る・地図や台帳にする・設計と施工に使う・維持管理で記録を積む）の対応。特定の書籍図の複製ではない -->
