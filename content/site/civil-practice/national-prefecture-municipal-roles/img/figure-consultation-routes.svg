<!-- authored 2026-10-15 doboku-note 自作。根拠は地方自治法第245条の2・第245条の4、道路法第17条、河川法第16条の3。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="市町村の窓口が国や県と関わる四つの場面。国や県から求められたときは根拠を確かめる。迷えば助言を求める。国道・県道を管理するなら県の同意を得る。国や県の川の工事は河川管理者と協議する。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 12px; fill: #555; }
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .s { font-size: 11px; fill: #555; }
      .b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .p { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .d { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .g { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .wh { fill: #fff; stroke: #8a8a8a; stroke-width: 1.5; }
      .a { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .ar { stroke: #b22234; stroke-width: 2; fill: none; }
    </style>
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
    <marker id="ahr" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#b22234"/></marker>
  </defs>
  <rect class="b" x="10" y="8" width="380" height="40" rx="8"/>
  <text class="n" x="200" y="33" text-anchor="middle">市町村の窓口　上から順に確かめる</text>
  <rect class="g" x="10" y="58" width="380" height="100" rx="8"/>
  <circle class="d" cx="30" cy="80" r="11"/><text class="t" x="30" y="85" text-anchor="middle">1</text>
  <rect class="d" x="48" y="68" width="100" height="26" rx="13"/><text class="t" x="98" y="85" text-anchor="middle">根拠を確かめる</text>
  <text class="n" x="158" y="85" style="font-size:12px">国や県から求められたとき</text>
  <rect class="wh" x="28" y="104" width="76" height="26" rx="6"/><text class="s" x="66" y="121" text-anchor="middle">国・県</text>
  <rect class="wh" x="150" y="104" width="160" height="26" rx="6"/><text class="s" x="230" y="121" text-anchor="middle">窓口</text>
  <path class="ar" d="M144,117H108" marker-end="url(#ahr)"/>
  <text class="s" x="28" y="148">地方自治法 第245条の2（法律か政令に根拠があるか）</text>
  <rect class="g" x="10" y="166" width="380" height="100" rx="8"/>
  <circle class="b" cx="30" cy="188" r="11"/><text class="t" x="30" y="193" text-anchor="middle">2</text>
  <rect class="b" x="48" y="176" width="100" height="26" rx="13"/><text class="t" x="98" y="193" text-anchor="middle">助言を求める</text>
  <text class="n" x="158" y="193" style="font-size:12px">技術的に迷うとき</text>
  <rect class="wh" x="28" y="212" width="76" height="26" rx="6"/><text class="s" x="66" y="229" text-anchor="middle">窓口</text>
  <rect class="wh" x="150" y="212" width="160" height="26" rx="6"/><text class="s" x="230" y="229" text-anchor="middle">各大臣・都道府県知事</text>
  <path class="a" d="M108,225H144" marker-end="url(#ah)"/>
  <text class="s" x="28" y="256">地方自治法 第245条の4第3項</text>
  <rect class="g" x="10" y="274" width="380" height="100" rx="8"/>
  <circle class="p" cx="30" cy="296" r="11"/><text class="t" x="30" y="301" text-anchor="middle">3</text>
  <rect class="p" x="48" y="284" width="100" height="26" rx="13"/><text class="t" x="98" y="301" text-anchor="middle">同意を得る</text>
  <text class="n" x="158" y="301" style="font-size:12px">国道・県道を市が管理（道路）</text>
  <rect class="wh" x="28" y="320" width="76" height="26" rx="6"/><text class="s" x="66" y="337" text-anchor="middle">窓口</text>
  <rect class="wh" x="150" y="320" width="160" height="26" rx="6"/><text class="s" x="230" y="337" text-anchor="middle">都道府県</text>
  <path class="a" d="M108,333H144" marker-end="url(#ah)"/>
  <text class="s" x="28" y="364">道路法 第17条（協議のうえ同意）</text>
  <rect class="g" x="10" y="382" width="380" height="100" rx="8"/>
  <circle class="w" cx="30" cy="404" r="11"/><text class="t" x="30" y="409" text-anchor="middle">4</text>
  <rect class="w" x="48" y="392" width="100" height="26" rx="13"/><text class="t" x="98" y="409" text-anchor="middle">協議する</text>
  <text class="n" x="158" y="409" style="font-size:12px">国や県の川の工事・維持（河川）</text>
  <rect class="wh" x="28" y="428" width="76" height="26" rx="6"/><text class="s" x="66" y="445" text-anchor="middle">窓口</text>
  <rect class="wh" x="150" y="428" width="160" height="26" rx="6"/><text class="s" x="230" y="445" text-anchor="middle">河川管理者</text>
  <path class="a" d="M108,441H144" marker-end="url(#ah)"/>
  <text class="s" x="28" y="472">河川法 第16条の3</text>
</svg>
