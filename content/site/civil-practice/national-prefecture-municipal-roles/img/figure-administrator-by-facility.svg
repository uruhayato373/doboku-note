<!-- authored 2026-10-15 doboku-note 自作。管理者の区分は道路法第13・15・16・17条、河川法第9・10・100条、事務の区分は同第97条・第100条の3の定め。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="道路と河川を国・都道府県・市町村のどこが管理するかを根拠の条で示した一覧図。市町村道と準用河川は自治事務、指定区間外の国道と二級河川などは第一号法定受託事務。県の同意を得れば、市が指定区間外の国道と県道を管理できる。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 12px; fill: #555; }
