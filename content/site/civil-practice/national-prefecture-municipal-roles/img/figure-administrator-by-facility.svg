  <rect class="w" x="96" y="446" width="14" height="14" rx="3"/><text class="s" x="116" y="457">第一号法定受託事務</text>
  <rect class="g" x="236" y="446" width="14" height="14" rx="3"/><text class="s" x="256" y="457">区分は図に示さない</text>
  <rect class="dz" x="14" y="470" width="14" height="14" rx="3"/><text class="s" x="34" y="481">県の同意を得れば市が管理（道路法17条2項）</text>
