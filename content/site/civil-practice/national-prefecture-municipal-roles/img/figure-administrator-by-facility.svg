<!-- authored 2026-10-15 doboku-note 自作。管理者の区分は道路法第13・15・16条、河川法第9・10・100条の定め。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="道路と河川を、国・都道府県・市町村のどこが管理するかで並べた一覧図。高速自動車国道と指定区間の国道、一級河川の直轄区間は国。指定区間外の国道、都道府県道、二級河川は都道府県。市町村道と準用河川は市町村。一級河川の指定区間は大臣の権限の一部を知事が行う。">
