<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
     style="max-width:400px;width:100%"
     role="img"
     aria-label="鉄筋継手を千鳥配置にするときの隣り合う継手間の必要距離（継手の長さ＋鉄筋直径の25倍）を示す配置図">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-title { font-size: 14px; font-weight: bold; fill: #222; }
      .t-label { font-size: 12px; fill: #555; }
      .t-num   { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .box-brand   { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-danger  { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
    </style>
    <marker id="arrow4" markerWidth="8" markerHeight="6" refX="4" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#555"/>
    </marker>
  </defs>

  <!-- NG例: 同一断面に集中 -->
  <text class="t-label" x="20" y="30">同一断面に継手を集中させた場合</text>
  <line x1="20" y1="70" x2="380" y2="70" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="150" y1="55" x2="150" y2="120" stroke="#b22234" stroke-width="2" stroke-dasharray="3,2"/>
  <line x1="150" y1="55" x2="250" y2="55" stroke="#b22234" stroke-width="2" stroke-dasharray="3,2"/>

  <rect class="box-danger" x="30" y="90" width="340" height="10" rx="3"/>
  <rect class="box-danger" x="30" y="112" width="340" height="10" rx="3"/>
  <rect class="box-danger" x="30" y="134" width="340" height="10" rx="3"/>

  <rect fill="#b22234" x="140" y="88" width="20" height="14"/>
  <rect fill="#b22234" x="140" y="110" width="20" height="14"/>
  <rect fill="#b22234" x="140" y="132" width="20" height="14"/>

  <text class="t-label" x="200" y="160" text-anchor="middle" fill="#b22234">この断面が構造上の弱点になる</text>

  <line x1="15" y1="185" x2="385" y2="185" stroke="#d7d7d7" stroke-width="1"/>

  <!-- OK例: 千鳥配置 -->
  <text class="t-label" x="20" y="210">千鳥配置（軸方向にずらす）</text>

  <rect class="box-brand" x="30" y="230" width="340" height="10" rx="3"/>
  <rect fill="#2e6da4" x="70" y="228" width="20" height="14"/>

  <rect class="box-brand" x="30" y="252" width="340" height="10" rx="3"/>
  <rect fill="#2e6da4" x="200" y="250" width="20" height="14"/>

  <rect class="box-brand" x="30" y="274" width="340" height="10" rx="3"/>
  <rect fill="#2e6da4" x="320" y="272" width="20" height="14"/>

  <!-- 継手長さ＋25dの寸法線 -->
  <line x1="90" y1="300" x2="200" y2="300" stroke="#555" stroke-width="1" marker-end="url(#arrow4)"/>
  <line x1="80" y1="228" x2="80" y2="310" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="210" y1="250" x2="210" y2="310" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2,2"/>

  <text class="t-num" x="145" y="320" text-anchor="middle">継手の長さ + 25d 以上</text>
  <text class="t-label" x="145" y="338" text-anchor="middle">（d＝鉄筋直径）</text>

  <line x1="15" y1="365" x2="385" y2="365" stroke="#d7d7d7" stroke-width="1"/>

  <rect class="box-brand" x="20" y="380" width="360" height="100" rx="8"/>
  <text class="t-title" x="40" y="405">継手位置で確保すること</text>
  <text class="t-label" x="40" y="428">・隣り合う継手間は継手長さ＋25d以上</text>
  <text class="t-label" x="40" y="446">・引張応力の大きい断面は避ける</text>
  <text class="t-label" x="40" y="464">・継手部と隣接鉄筋のあきは粗骨材最大寸法以上</text>
</svg>
