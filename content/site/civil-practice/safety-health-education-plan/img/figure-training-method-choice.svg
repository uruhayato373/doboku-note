<g font-size="12" fill="#1a3a5c"><text x="30" y="92">全員に伝える基本事項</text><text x="30" y="110">法定教育の区分の説明</text><text x="30" y="128">入場時の共通ルール</text><text x="210" y="92">要点を口頭で問う</text><text x="210" y="110">短い確認問題を解く</text><text x="210" y="128">署名だけで済ませない</text><text x="30" y="250">事例の原因分析</text><text x="30" y="268">対策案づくり</text><text x="30" y="286">原因を4Mで分ける</text><text x="210" y="250">班の案を自分の</text><text x="210" y="268">言葉で説明する</text><text x="210" y="286">計画や手順へ反映</text><text x="30" y="408">機械の操作</text><text x="30" y="426">現場でしか見えない</text><text x="30" y="444">危険の見分け方</text><text x="210" y="408">指導者付きで観察</text><text x="210" y="426">単独作業へ移る</text><text x="210" y="444">基準を先に決める</text></g>
