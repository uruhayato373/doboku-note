<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="土砂災害の五つの動きを、来る速さの順に斜面の断面で並べた図。土石流と表層崩壊は速く来て、見てから逃げるのは難しい。深層崩壊と河道閉塞は長雨のあとに来て、雨の積み重なりと前兆で止める。地すべりはゆっくり動き、変状の変化を追って止める" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
  <defs>
    <marker id="da" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,3.5 0,7" fill="#b22234"/></marker>
  </defs>
  <rect width="400" height="500" fill="#ffffff"/>
  <!-- 来る速さの三区分 -->
  <g stroke="#d7d7d7" stroke-width="1" fill="none"><path d="M20 40 H380 M20 224 H380 M20 408 H380"/></g>
  <g font-size="12" font-weight="bold" fill="#1a3a5c">
    <text x="20" y="32">速く来る</text>
    <text x="20" y="216">長雨のあと</text>
    <text x="20" y="400">ゆっくり動く</text>
  </g>
  <g font-size="11" fill="#555" text-anchor="end">
    <text x="380" y="32">見てから逃げるのは難しい</text>
    <text x="380" y="216">雨の積み重なりと前兆で止める</text>
    <text x="380" y="400">変状の変化を追って止める</text>
  </g>
  <!-- 1 土石流 -->
  <rect x="48" y="50" width="100" height="60" rx="4" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <polygon points="48,68 98,80 123,100 148,100 148,110 48,110" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="1.5"/>
  <path d="M82 70 L128 92" stroke="#b22234" stroke-width="2.5" fill="none" marker-end="url(#da)"/>
  <circle cx="30" cy="80" r="10" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="30" y="84.5" font-size="12" font-weight="bold" fill="#1a3a5c" text-anchor="middle">1</text>
  <text x="164" y="68" font-size="13" font-weight="bold" fill="#222">土石流</text>
  <text x="164" y="87" font-size="12" fill="#555">谷を水と土砂が一体で流れ下る</text>
  <rect x="164" y="92" width="145" height="18" rx="9" fill="#f8d7da" stroke="#b22234" stroke-width="1.5"/>
  <text x="176" y="105" font-size="11" fill="#1a3a5c">渓流の濁り・流木で退避</text>
  <!-- 2 表層崩壊 -->
  <rect x="48" y="124" width="100" height="60" rx="4" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <polygon points="48,136 148,172 148,184 48,184" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="48,136 148,172 148,178 48,142" fill="#fff3cd"/>
  <path d="M78 153 L128 171" stroke="#b22234" stroke-width="2" stroke-dasharray="4 3" fill="none"/>
  <circle cx="30" cy="154" r="10" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="30" y="158.5" font-size="12" font-weight="bold" fill="#1a3a5c" text-anchor="middle">2</text>
  <text x="164" y="142" font-size="13" font-weight="bold" fill="#222">表層崩壊</text>
  <text x="164" y="161" font-size="12" fill="#555">厚さ0.5〜2.0m程度の表土が滑る</text>
  <rect x="164" y="166" width="189" height="18" rx="9" fill="#f8d7da" stroke="#b22234" stroke-width="1.5"/>
  <text x="176" y="179" font-size="11" fill="#1a3a5c">のり面の亀裂・湧水の増加で退避</text>
  <!-- 3 深層崩壊 -->
  <rect x="48" y="234" width="100" height="60" rx="4" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <polygon points="48,246 148,282 148,294 48,294" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="48,246 148,282 148,288 48,252" fill="#fff3cd"/>
  <path d="M76 256 C82 284 118 290 132 276" stroke="#b22234" stroke-width="2" stroke-dasharray="4 3" fill="none"/>
  <circle cx="30" cy="264" r="10" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="30" y="268.5" font-size="12" font-weight="bold" fill="#1a3a5c" text-anchor="middle">3</text>
  <text x="164" y="252" font-size="13" font-weight="bold" fill="#222">深層崩壊</text>
  <text x="164" y="271" font-size="12" fill="#555">表土から深層の地盤まで崩れる</text>
  <rect x="164" y="276" width="167" height="18" rx="9" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text x="176" y="289" font-size="11" fill="#1a3a5c">降り続いた雨と前兆で止める</text>
  <!-- 4 河道閉塞 -->
  <rect x="48" y="308" width="100" height="60" rx="4" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <polygon points="48,318 108,344 148,350 148,368 48,368" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="94,338 120,338 120,345.8 108,344" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <polygon points="120,345.8 120,336 136,336 142,349.1" fill="#f8d7da" stroke="#b22234" stroke-width="1.5"/>
  <circle cx="30" cy="338" r="10" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="30" y="342.5" font-size="12" font-weight="bold" fill="#1a3a5c" text-anchor="middle">4</text>
  <text x="164" y="326" font-size="13" font-weight="bold" fill="#222">河道閉塞</text>
  <text x="164" y="345" font-size="12" fill="#555">崩れた土砂が川をせき止める</text>
  <rect x="164" y="350" width="156" height="18" rx="9" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text x="176" y="363" font-size="11" fill="#1a3a5c">水位の急低下が最初の合図</text>
  <!-- 5 地すべり -->
  <rect x="48" y="418" width="100" height="60" rx="4" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <polygon points="48,438 148,452 148,478 48,478" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="1.5"/>
  <path d="M54 454 L142 462" stroke="#2e6da4" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <path d="M54 466 L142 473" stroke="#b22234" stroke-width="2" stroke-dasharray="4 3" fill="none"/>
  <circle cx="30" cy="448" r="10" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="30" y="452.5" font-size="12" font-weight="bold" fill="#1a3a5c" text-anchor="middle">5</text>
  <text x="164" y="436" font-size="13" font-weight="bold" fill="#222">地すべり</text>
  <text x="164" y="455" font-size="12" fill="#555">地下水の影響でゆっくり動く</text>
  <rect x="164" y="460" width="156" height="18" rx="9" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="176" y="473" font-size="11" fill="#1a3a5c">亀裂・湧水の変化で止める</text>
</svg>
