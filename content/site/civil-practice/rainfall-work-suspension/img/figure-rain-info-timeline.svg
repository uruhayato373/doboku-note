<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="雨の実況と予測の情報を時間軸に並べた図。解析雨量は実況、降水ナウキャストは1時間先まで、降水短時間予報は6時間先まで、7〜15時間先は5キロメートルメッシュ。アメダスの観測点は降水量約17キロ、風約21キロ間隔" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
  <defs>
    <marker id="tl" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,3.5 0,7" fill="#555"/></marker>
  </defs>
  <rect width="400" height="500" fill="#ffffff"/>
  <text x="20" y="24" font-size="12" fill="#555">実況から先へ、使う情報とその細かさ</text>
  <path d="M68 50 V378" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#tl)"/>
  <rect x="84" y="38" width="296" height="74" rx="6" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
  <circle cx="68" cy="75" r="5" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="56" y="79" font-size="12" font-weight="bold" fill="#1a3a5c" text-anchor="end">実況</text>
  <text x="98" y="62" font-size="13" font-weight="bold" fill="#1a3a5c">解析雨量</text>
  <text x="98" y="82" font-size="12" fill="#222">1km・30分ごと</text>
  <text x="98" y="100" font-size="11" fill="#555">速報版は10分ごと</text>
  <rect x="84" y="124" width="296" height="74" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <circle cx="68" cy="161" r="5" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="56" y="165" font-size="12" font-weight="bold" fill="#1a3a5c" text-anchor="end">〜1時間</text>
  <text x="98" y="148" font-size="13" font-weight="bold" fill="#1a3a5c">降水ナウキャスト</text>
  <text x="98" y="168" font-size="12" fill="#222">5分ごと・1時間先まで</text>
  <text x="98" y="186" font-size="11" fill="#555">1km四方。新しく生まれる雨域は反映できない</text>
  <rect x="84" y="210" width="296" height="74" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <circle cx="68" cy="247" r="5" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="56" y="251" font-size="12" font-weight="bold" fill="#1a3a5c" text-anchor="end">〜6時間</text>
  <text x="98" y="234" font-size="13" font-weight="bold" fill="#1a3a5c">降水短時間予報</text>
  <text x="98" y="254" font-size="12" fill="#222">1km・6時間先まで</text>
  <text x="98" y="272" font-size="11" fill="#555">10分ごとに発表</text>
  <rect x="84" y="296" width="296" height="74" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <circle cx="68" cy="333" r="5" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="56" y="337" font-size="12" font-weight="bold" fill="#1a3a5c" text-anchor="end">〜15時間</text>
  <text x="98" y="320" font-size="13" font-weight="bold" fill="#1a3a5c">降水短時間予報（7〜15時間先）</text>
  <text x="98" y="340" font-size="12" fill="#222">5km・1時間ごと</text>
  <text x="98" y="358" font-size="11" fill="#555">後半は数値予報を組み合わせる</text>
  <rect x="84" y="386" width="296" height="74" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="56" y="427" font-size="12" font-weight="bold" fill="#1a3a5c" text-anchor="end">観測点</text>
  <text x="98" y="410" font-size="13" font-weight="bold" fill="#1a3a5c">アメダス</text>
  <text x="98" y="430" font-size="12" fill="#222">降水量は約17km、風は約21km間隔</text>
  <text x="98" y="448" font-size="11" fill="#555">風速は観測前10分間の平均値</text>
</svg>
