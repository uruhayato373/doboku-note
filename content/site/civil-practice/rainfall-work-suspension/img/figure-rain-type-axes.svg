<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="大雨を降り続く時間と雨量の二軸で分けた図。局地的大雨は数十分で数十mm、集中豪雨は数時間で100〜数百mm、線状降水帯は集中豪雨をもたらす雨域の一つ" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
  <defs>
    <marker id="ax" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,3.5 0,7" fill="#555"/></marker>
  </defs>
  <rect width="400" height="500" fill="#ffffff"/>
  <!-- 軸: ink-body -->
  <g stroke="#555" stroke-width="1.5" fill="none">
    <path d="M84 330 V56" marker-end="url(#ax)"/>
    <path d="M84 330 H378" marker-end="url(#ax)"/>
  </g>
  <g font-size="11" fill="#555">
    <text x="20" y="46" font-size="12" font-weight="bold" fill="#222">雨量</text>
    <text x="378" y="372" font-size="12" font-weight="bold" fill="#222" text-anchor="end">降り続く時間</text>
    <g text-anchor="end">
      <text x="78" y="138">100〜数百mm</text>
      <text x="78" y="278">数十mm</text>
    </g>
    <g font-size="12" text-anchor="middle">
      <text x="148" y="352">数十分</text>
      <text x="294" y="352">数時間</text>
    </g>
  </g>
  <!-- 目盛り: ink-body -->
  <g stroke="#555" stroke-width="1.5">
    <path d="M84 134 h-5 M84 274 h-5 M148 330 v5 M294 330 v5"/>
  </g>
  <!-- 局地的大雨: brand -->
  <rect x="96" y="236" width="104" height="76" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#1a3a5c">
    <text x="148" y="260" font-size="13" font-weight="bold">局地的大雨</text>
    <g font-size="12" fill="#555">
      <text x="148" y="280">狭い範囲に</text>
      <text x="148" y="298">急に強く降る</text>
    </g>
  </g>
  <!-- 集中豪雨: warn / 線状降水帯: danger -->
  <rect x="216" y="62" width="156" height="144" rx="6" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#1a3a5c">
    <text x="294" y="84" font-size="13" font-weight="bold">集中豪雨</text>
    <g font-size="12" fill="#555">
      <text x="294" y="102">同じような場所で</text>
      <text x="294" y="118">数時間強く降る</text>
    </g>
  </g>
  <rect x="226" y="130" width="136" height="68" rx="6" fill="#f8d7da" stroke="#b22234" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#1a3a5c">
    <text x="294" y="150" font-size="12" font-weight="bold">線状降水帯</text>
    <g font-size="11">
      <text x="294" y="168">長さ50〜300km程度</text>
      <text x="294" y="184">幅20〜50km程度</text>
    </g>
  </g>
  <!-- 要約カード -->
  <rect x="20" y="394" width="172" height="90" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <rect x="208" y="394" width="172" height="90" rx="6" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#1a3a5c">
    <text x="106" y="418" font-size="13" font-weight="bold">短時間型</text>
    <text x="294" y="418" font-size="13" font-weight="bold">長時間型</text>
    <g font-size="12" fill="#555">
      <text x="106" y="440">予測しにくい</text>
      <text x="106" y="460">降り出す前の準備が勝負</text>
      <text x="294" y="440">雨量が積み上がる</text>
      <text x="294" y="460">経過時間と色の進みを追う</text>
    </g>
  </g>
</svg>
