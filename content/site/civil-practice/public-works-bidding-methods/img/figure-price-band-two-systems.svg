<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="予定価格を上限とし、その下に低入札価格調査制度と最低制限価格制度の二つの下限の仕組みを並べた図。調査基準価格を下回ると落札を保留して履行できるかを調査し、最低制限価格を下回ると失格になる。">
<defs>
<style>text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;font-size:12px;fill:#555}.h{font-size:14px;font-weight:bold;fill:#1a3a5c}.b{font-size:13px;font-weight:bold;fill:#1a3a5c}.s{fill:#1a3a5c}rect{stroke-width:1.5}</style>
</defs>
<!-- surface: 予定価格 / brand: 制度名 / positive: 契約へ / warn: 調査 / danger: 失格 -->
<rect x="14" y="14" width="352" height="52" rx="8" fill="#f5f5f5" stroke="#d7d7d7"/>
<text class="h" x="30" y="38" style="fill:#222">予定価格　＝　価格の上限</text>
<text x="30" y="56">これを超える入札は、落札者になれない</text>
<rect x="14" y="84" width="166" height="52" rx="8" fill="#e8f0fe" stroke="#2e6da4"/>
<text class="h" x="26" y="106">低入札価格調査</text>
<text x="26" y="124">国・地方公共団体など</text>
<rect x="200" y="84" width="166" height="52" rx="8" fill="#e8f0fe" stroke="#2e6da4"/>
<text class="h" x="212" y="106">最低制限価格</text>
<text x="212" y="124">地方公共団体など</text>
<rect x="14" y="152" width="166" height="104" rx="8" fill="#d0e8d0" stroke="#3a7d44"/>
<text class="b" x="26" y="176">調査基準価格以上</text>
<text class="s" x="26" y="198">最も安い入札者と契約</text>
<text class="s" x="26" y="218">総合評価では、</text>
<text class="s" x="26" y="238">評価値が最高の者</text>
<rect x="200" y="152" width="166" height="104" rx="8" fill="#d0e8d0" stroke="#3a7d44"/>
<text class="b" x="212" y="176">最低制限価格以上</text>
<text class="s" x="212" y="198">最も安い入札者と契約</text>
<text class="s" x="212" y="218">（総合評価落札方式</text>
<text class="s" x="212" y="238">では使えない）</text>
<rect x="14" y="272" width="166" height="104" rx="8" fill="#fff3cd" stroke="#d4a017"/>
<text class="b" x="26" y="296">基準価格を下回る</text>
<text class="s" x="26" y="318">落札を保留し、</text>
<text class="s" x="26" y="338">履行できるか調査</text>
<text class="s" x="26" y="358">認められれば契約</text>
<rect x="200" y="272" width="166" height="104" rx="8" fill="#f8d7da" stroke="#b22234"/>
<text class="b" x="212" y="296">下回ると失格</text>
<text class="s" x="212" y="318">調査はせずに、</text>
<text class="s" x="212" y="338">落札者から</text>
<text class="s" x="212" y="358">除かれる</text>
<rect x="14" y="394" width="352" height="94" rx="8" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
<text class="b" x="30" y="418" style="fill:#222">基準価格は、入札前に公表しない</text>
<text x="30" y="440">公表すると入札が基準価格の近くに集まり、</text>
<text x="30" y="458">同額の入札者の間でくじ引きになりやすい。</text>
<text x="30" y="476">国の適正化指針が、事前に出さない理由に挙げる。</text>
</svg>
