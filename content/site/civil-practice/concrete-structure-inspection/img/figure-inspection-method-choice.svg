<!-- authored 2026-10-15 doboku-note 自作（2026-10-16 改訂）。論点は、強度の確認の二つの流れ（国官技第61号の系統と強度測定要領の系統）と、配筋・かぶりは別の道具で測ること。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="強度の確認は二つの流れに分かれる。国官技第61号の系統はテストハンマー、周辺5カ所の再調査、コア、協議の順。強度測定要領の系統は超音波法または衝撃弾性波法、近傍の再試験、小径コア、協議の順。配筋とかぶりは強度とは別に電磁波レーダ法や電磁誘導法で測る。">
