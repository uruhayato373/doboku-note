<!-- authored 2026-10-15 doboku-note 自作。論点は道路法第24条・第32条、道路交通法第77条と、窓口の早見（承認・占用・使用許可）。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="窓口に来る相談ごとに、承認・占用の許可・使用許可のどれが要るかを示した早見表。歩道の切り下げと側溝の蓋は承認が要り、工事中に規制や作業が出るなら使用許可も要る。足場や囲いを道路に出す場合と、水道管のために道路を掘る場合は、占用の許可と使用許可が要る。">
