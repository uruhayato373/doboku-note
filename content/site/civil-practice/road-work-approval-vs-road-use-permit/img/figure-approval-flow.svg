<!-- authored 2026-10-15 doboku-note 自作。論点は道路法第24条・第57条・第87条、道路交通法第77条・第79条。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="承認工事の進め方の流れ。承認の申請、設計と実施計画の審査、条件付きの承認、使用許可・協議との調整、工事、完了の確認と施設の帰属の順に進む。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 12px; fill: #555; }  /* ink-body */
      .n { font-size: 14px; font-weight: bold; fill: #1a3a5c; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }  /* brand-fill / brand */
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }  /* warn-fill / warn */
      .pos { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }  /* positive-fill / positive */
      .sf { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }  /* surface */
      .a { stroke: #2e6da4; stroke-width: 2; fill: none; }
    </style>
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  </defs>
  <rect class="brand" x="10" y="10" width="380" height="60" rx="8"/>
  <text class="n" x="24" y="35">承認の申請</text>
  <text x="24" y="56">道路法第24条</text>
  <path class="a" d="M200,70V90" marker-end="url(#ah)"/>
  <rect class="brand" x="10" y="90" width="380" height="60" rx="8"/>
  <text class="n" x="24" y="115">審査</text>
  <text x="24" y="136">設計と実施計画を審査基準に当てはめる</text>
  <path class="a" d="M200,150V170" marker-end="url(#ah)"/>
  <rect class="brand" x="10" y="170" width="380" height="60" rx="8"/>
  <text class="n" x="24" y="195">条件付きの承認</text>
  <text x="24" y="216">構造の保全・交通の危険防止の条件（第87条）</text>
  <path class="a" d="M200,230V250" marker-end="url(#ah)"/>
  <rect class="warn" x="10" y="250" width="380" height="60" rx="8"/>
  <text class="n" x="24" y="275">使用許可・協議との調整</text>
  <text x="24" y="296">道交法の使用許可（第77条）・占用なら相互に協議</text>
  <path class="a" d="M200,310V330" marker-end="url(#ah)"/>
  <rect class="sf" x="10" y="330" width="380" height="60" rx="8"/>
  <text class="n" x="24" y="355">工事</text>
  <text x="24" y="376">費用は承認を受けた者が負担（第57条）</text>
  <path class="a" d="M200,390V410" marker-end="url(#ah)"/>
  <rect class="pos" x="10" y="410" width="380" height="60" rx="8"/>
  <text class="n" x="24" y="435">完了の確認・施設の帰属</text>
  <text x="24" y="456">確認の方法は要綱で決める。完成した施設は管理者へ</text>
</svg>
