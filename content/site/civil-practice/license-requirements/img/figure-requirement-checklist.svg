<!-- authored 2026-10-16 doboku-note 自作。論点は建設業法第7条・第15条と建設業許可事務ガイドラインの要件の点検の順。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="建設業許可の要件の点検表。営業所、経営体制、営業所技術者、誠実性と令3条使用人、財産的基礎、社会保険の六つについて、誰を見るか、どの営業所や時点で見るか、確認する資料を並べた図。法令は令和8年10月時点、ガイドラインは令和7年2月1日改正。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 12px; fill: #222; }
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .l { font-size: 11px; font-weight: bold; fill: #2e6da4; }
      .s { font-size: 11px; fill: #555; }
      .card { fill: #fff; stroke: #d7d7d7; stroke-width: 1.5; }
      .tag { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
    </style>
  </defs>
  <rect class="card" x="10" y="8" width="380" height="68" rx="8"/>
  <rect class="tag" x="18" y="16" width="84" height="52" rx="6"/>
  <text class="n" x="60" y="47" text-anchor="middle">営業所</text>
  <text class="l" x="112" y="28">誰を</text><text x="153" y="28">本店・支店・常時契約を結ぶ事務所</text>
  <text class="l" x="112" y="46">どこで</text><text x="153" y="46">先に営業所の数を確定する</text>
  <text class="l" x="112" y="64">確認</text><text x="153" y="64">外観・内部・標識の写真と所有の別</text>
  <rect class="card" x="10" y="82" width="380" height="68" rx="8"/>
  <rect class="tag" x="18" y="90" width="84" height="52" rx="6"/>
  <text class="n" x="60" y="121" text-anchor="middle">経営体制</text>
  <text class="l" x="112" y="102">誰を</text><text x="153" y="102">常勤役員等（イ・ロ・ハの型）</text>
  <text class="l" x="112" y="120">どこで</text><text x="153" y="120">本社や本店などで毎日所定の時間</text>
  <text class="l" x="112" y="138">確認</text><text x="153" y="138">標準報酬決定通知書、商業登記簿謄本</text>
  <rect class="card" x="10" y="156" width="380" height="68" rx="8"/>
  <rect class="tag" x="18" y="164" width="84" height="52" rx="6"/>
  <text class="n" x="60" y="195" text-anchor="middle">営業所技術者</text>
  <text class="l" x="112" y="176">誰を</text><text x="153" y="176">許可を受ける業種ごとの技術者</text>
  <text class="l" x="112" y="194">どこで</text><text x="153" y="194">営業所ごとに専任で置く</text>
  <text class="l" x="112" y="212">確認</text><text x="153" y="212">標準報酬決定通知書、雇用証明書の写し</text>
  <rect class="card" x="10" y="230" width="380" height="68" rx="8"/>
  <rect class="tag" x="18" y="238" width="84" height="52" rx="6"/>
  <text class="n" x="60" y="260" text-anchor="middle">誠実性と</text>
  <text class="n" x="60" y="274" text-anchor="middle">令3条使用人</text>
  <text class="l" x="112" y="250">誰を</text><text x="153" y="250">法人、役員等、令3条使用人</text>
  <text class="l" x="112" y="268">どこで</text><text x="153" y="268">支店・営業所の代表者の勤務の実態</text>
  <text class="l" x="112" y="286">確認</text><text x="153" y="286">取消処分から5年か、毎日の勤務</text>
  <rect class="card" x="10" y="304" width="380" height="68" rx="8"/>
  <rect class="tag" x="18" y="312" width="84" height="52" rx="6"/>
  <text class="n" x="60" y="343" text-anchor="middle">財産的基礎</text>
  <text class="l" x="112" y="324">誰を</text><text x="153" y="324">会社（一般と特定で基準が違う）</text>
  <text class="l" x="112" y="342">どこで</text><text x="153" y="342">申請直前の決算期の財務諸表</text>
  <text class="l" x="112" y="360">確認</text><text x="153" y="360">融資証明書、預金残高証明書</text>
  <rect class="card" x="10" y="378" width="380" height="68" rx="8"/>
  <rect class="tag" x="18" y="386" width="84" height="52" rx="6"/>
  <text class="n" x="60" y="417" text-anchor="middle">社会保険</text>
  <text class="l" x="112" y="398">誰を</text><text x="153" y="398">健康保険・厚生年金・雇用保険</text>
  <text class="l" x="112" y="416">どこで</text><text x="153" y="416">適用事業所の営業所ごと</text>
  <text class="l" x="112" y="434">確認</text><text x="153" y="434">届書の提出、非該当承認通知書の写し</text>
  <text class="s" x="200" y="468" text-anchor="middle">法令は令和8年（2026年）10月時点の条文</text>
  <text class="s" x="200" y="484" text-anchor="middle">運用は建設業許可事務ガイドライン（令和7年2月1日改正）</text>
</svg>
