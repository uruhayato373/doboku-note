<!-- authored 2026-10-16 doboku-note 自作。論点は建設業許可事務ガイドライン【第7条関係】4・【第15条関係】2の財産的基礎を見る時点と基準。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="財産的基礎を見る時点の時間軸。決算を並べ、直前の決算期末の財務諸表で判断し、申請日までの増資は資本金の基準にだけ効く。許可の後に基準を下回っても直ちに効力に影響しない。一般建設業は三つの基準のうち一つ、特定建設業はすべてを満たす。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 12px; fill: #222; }
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .s { font-size: 11px; fill: #555; }
      .card { fill: #fff; stroke: #d7d7d7; stroke-width: 1.5; }
      .b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .bw { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .bp { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .bd { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .line { stroke: #8a8a8a; stroke-width: 2; fill: none; }
      .tk { stroke: #8a8a8a; stroke-width: 2; }
      .dot { fill: #2e6da4; stroke: #fff; stroke-width: 2; }
    </style>
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#8a8a8a"/></marker>
  </defs>

  <path class="line" d="M20,70H390" marker-end="url(#ah)"/>
  <rect x="290" y="64" width="96" height="12" rx="3" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
  <path class="tk" d="M50,62V78M110,62V78"/>
  <circle class="dot" cx="170" cy="70" r="8"/>
  <circle cx="225" cy="70" r="7" fill="#fff3cd" stroke="#d4a017" stroke-width="2"/>
  <circle class="dot" cx="290" cy="70" r="8"/>
  <text class="s" x="50" y="52" text-anchor="middle">決算</text>
  <text class="s" x="110" y="52" text-anchor="middle">決算</text>
  <text class="n" x="170" y="52" text-anchor="middle">直前の決算</text>
  <text class="n" x="290" y="52" text-anchor="middle">申請日</text>
  <text class="n" x="338" y="100" text-anchor="middle">許可後</text>
  <text class="n" x="225" y="100" text-anchor="middle">増資</text>
  <path d="M248,95H282" stroke="#d4a017" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>

  <rect class="b" x="10" y="116" width="380" height="44" rx="6"/>
  <text class="n" x="22" y="134">直前の決算期末</text>
  <text x="22" y="151">財務諸表で判断する。新設の会社は創業時</text>
  <rect class="bw" x="10" y="166" width="380" height="44" rx="6"/>
  <text class="n" x="22" y="184">増資</text>
  <text x="22" y="201">効くのは資本金の基準だけ。申請日までに行えば数えられる</text>
  <rect class="bp" x="10" y="216" width="380" height="44" rx="6"/>
  <text class="n" x="22" y="234">許可後</text>
  <text x="22" y="251">下回っても、直ちに効力に影響しない</text>

  <rect class="card" x="10" y="274" width="185" height="216" rx="8"/>
  <text class="n" x="22" y="296">一般建設業</text>
  <rect class="b" x="22" y="304" width="161" height="26" rx="13"/>
  <text class="n" x="102" y="322" text-anchor="middle">三つのうち一つ</text>
  <text x="22" y="356">自己資本</text>
  <text x="22" y="372">500万円以上</text>
  <text x="22" y="396">資金調達能力</text>
  <text x="22" y="412">500万円以上</text>
  <text x="22" y="436">直前5年間、許可を</text>
  <text x="22" y="452">受けて継続して営業</text>

  <rect class="card" x="205" y="274" width="185" height="216" rx="8"/>
  <text class="n" x="217" y="296">特定建設業</text>
  <rect class="bd" x="217" y="304" width="161" height="26" rx="13"/>
  <text class="n" x="297" y="322" text-anchor="middle">すべてを満たす</text>
  <text x="217" y="356">欠損の額が資本金の</text>
  <text x="217" y="372">20%を超えない</text>
  <text x="217" y="396">流動比率75%以上</text>
  <rect class="bw" x="217" y="406" width="161" height="20" rx="10"/>
  <text class="s" x="297" y="420" text-anchor="middle" style="font-weight:bold;fill:#1a3a5c">資本金だけ、増資で届く</text>
  <text x="217" y="446">資本金2,000万円以上</text>
  <text x="217" y="462">かつ自己資本</text>
  <text x="217" y="478">4,000万円以上</text>
</svg>
