<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="仕上げと養生の開始を表面の状態で見分ける図。ブリーディング水がなくなれば木ゴテ、指で押してもへこまなくなれば金ゴテと湿潤養生の開始">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; font-size: 12px; fill: #1a3a5c; }
      .h { font-size: 13px; font-weight: bold; }
      .s { font-size: 12px; fill: #222; }
      .n { font-size: 11px; fill: #555; }
      .lb { font-size: 11px; font-weight: bold; fill: #2e6da4; }
      .m { text-anchor: middle; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .positive { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .danger { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .surface { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .ar { stroke: #2e6da4; stroke-width: 2.5; fill: none; }
    </style>
    <!-- brand / positive / warn / danger / surface tokens -->
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  </defs>
  <rect width="400" height="500" fill="#ffffff" />
  <rect class="brand" x="10" y="14" width="200" height="64" rx="8"/>
  <text class="s" x="22" y="36">ブリーディング水が</text>
  <text class="s" x="22" y="54">なくなる、または除去できた</text>
  <path class="ar" d="M210,46 L236,46" marker-end="url(#ah)"/>
  <rect class="positive" x="240" y="14" width="150" height="64" rx="8"/>
  <text class="h m" x="315" y="42">木ゴテ</text>
  <text class="n m" x="315" y="60">沈下が落ち着いた頃</text>
  <path class="ar" d="M110,78 L110,100" marker-end="url(#ah)"/>
  <text class="n" x="122" y="94">さらに進むと</text>
  <rect class="brand" x="10" y="102" width="200" height="64" rx="8"/>
  <text class="s" x="22" y="124">指で押しても</text>
  <text class="s" x="22" y="142">へこまなくなる（凝結の終結）</text>
  <path class="ar" d="M210,134 L236,134" marker-end="url(#ah)"/>
  <rect class="positive" x="240" y="102" width="150" height="64" rx="8"/>
  <text class="h m" x="315" y="130">金ゴテ</text>
  <text class="n m" x="315" y="148">湿潤養生の開始</text>
  <rect class="danger" x="10" y="184" width="380" height="82" rx="8"/>
  <text class="h" x="22" y="206">早すぎると、表面が荒れる</text>
  <text class="s" x="22" y="226">水が残ったまま押さえると、水を巻き込む</text>
  <text class="s" x="22" y="244">柔らかいうちに散水すると、表面付近の</text>
  <text class="s" x="22" y="260">水セメント比が局所的に上がる</text>
  <rect class="warn" x="10" y="278" width="380" height="82" rx="8"/>
  <text class="h" x="22" y="300">凝結の終結は、季節で数時間ずれる</text>
  <text class="s" x="22" y="320">夏は早まり、冬は遅れる</text>
  <text class="s" x="22" y="338">当日の段取りに余裕を持たせる</text>
  <rect class="surface" x="10" y="372" width="380" height="98" rx="8"/>
  <text class="h" x="22" y="394">判断の軸は、時計でなく表面</text>
  <text class="s" x="22" y="414">表面のブリーディング水がどうなっているか</text>
  <text class="s" x="22" y="432">指で押したときに跡がつくか</text>
  <text class="s" x="22" y="452">仕上げと養生の開始は別の判断として意識する</text>
</svg>
