  <rect class="brand" x="324" y="292" width="48" height="34" rx="6"/>
  <text class="h m" x="348" y="314">12</text>
  <text class="h" x="20" y="354">下層から最大100分に収まる</text>
  <rect class="surface" x="10" y="372" width="380" height="116" rx="8"/>
  <text class="h" x="22" y="394">番号は打つ順（1区画20分）の一例</text>
  <text class="s" x="22" y="414">18区画を3層に分け、各層6区画とした</text>
  <text class="s" x="22" y="432">Bは筒先の移動が増える代わりに、</text>
