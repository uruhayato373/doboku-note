<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="質問を出した日、回答期限の通知、回答が届いた日を時間軸に並べ、最初と最後の間を待ち日数として数える。待った日数は、工期末が動かなければ実働の日数が減って残りを詰めることになり、工期が延びれば完成が後ろへずれる。どちらの場合も待つ間の費用は出ていく">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 11px; fill: #555; }
      .h { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .s { font-size: 12px; fill: #222; }
      .bw { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .bd { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
    </style>
    <marker id="a" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#555"/></marker>
    <marker id="b" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto-start-reverse"><polygon points="0,0 8,3.5 0,7" fill="#b22234"/></marker>
  </defs>

  <text x="200" y="16" text-anchor="middle">回答待ちの日数は、工程の圧縮か完成の遅れになる</text>

  <line x1="40" y1="104" x2="366" y2="104" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="366" y="94" text-anchor="end">時間</text>
  <g fill="#2e6da4">
    <circle cx="70" cy="104" r="5"/>
    <circle cx="185" cy="104" r="5"/>
    <circle cx="310" cy="104" r="5"/>
  </g>
  <g text-anchor="middle">
    <text class="s" x="70" y="78">質問・協議書</text>
    <text class="s" x="185" y="78">回答期限の通知</text>
    <text class="s" x="310" y="78">回答が届く</text>
  </g>
  <g text-anchor="middle">
    <text x="70" y="126">日付を記録</text>
    <text x="185" y="126">日付を記録</text>
    <text x="310" y="126">日付を記録</text>
  </g>

  <g stroke="#d7d7d7" stroke-dasharray="3 3">
    <line x1="70" y1="134" x2="70" y2="162"/>
    <line x1="310" y1="134" x2="310" y2="162"/>
  </g>
  <line x1="70" y1="166" x2="310" y2="166" stroke="#b22234" stroke-width="1.5" marker-start="url(#b)" marker-end="url(#b)"/>
  <text class="s" x="190" y="188" text-anchor="middle">待ち日数（回答の日 − 質問の日）</text>

  <text class="s" x="200" y="222" text-anchor="middle">待った分は、次のどちらかで受けることになる</text>
  <g stroke="#555" stroke-width="1.5">
    <line x1="108" y1="230" x2="108" y2="248" marker-end="url(#a)"/>
    <line x1="292" y1="230" x2="292" y2="248" marker-end="url(#a)"/>
  </g>

  <rect class="bd" x="20" y="250" width="176" height="104" rx="6"/>
  <text class="h" x="32" y="274">工期末が動かない場合</text>
  <text class="s" x="32" y="298">止まった分、実働の日数が</text>
  <text class="s" x="32" y="316">減り、残りを詰める</text>
  <text class="s" x="32" y="338">品質の確保に響くおそれ</text>

  <rect class="bw" x="204" y="250" width="176" height="104" rx="6"/>
  <text class="h" x="216" y="274">工期が延びる場合</text>
  <text class="s" x="216" y="298">完成が後ろへずれる</text>
  <text class="s" x="216" y="316">延びた日数と費用の扱いは</text>
  <text class="s" x="216" y="334">協議して決める</text>

  <rect class="bw" x="20" y="384" width="360" height="64" rx="6"/>
  <text class="s" x="200" y="410" text-anchor="middle">どちらでも、待つ間の労務・機械・仮設の費用は出ていく</text>
  <text class="s" x="200" y="432" text-anchor="middle">回答期限を先に決めれば、止まる日数を数えられる</text>
</svg>
