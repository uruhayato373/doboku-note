<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
     style="max-width:400px;width:100%"
     role="img"
     aria-label="打込み・締固めの4つの管理値（打上がり高さ・自由落下高さ・バイブレーター挿入深さ・挿入間隔）の位置関係を示す断面図">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-label { font-size: 12px; fill: #555; }
      .t-num   { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .box-brand   { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-positive{ fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
    </style>
    <marker id="arrow2" markerWidth="8" markerHeight="6" refX="4" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#555"/>
    </marker>
  </defs>

  <!-- 打込み口・自由落下高さ -->
  <text class="t-label" x="20" y="30">吐出口</text>
  <rect x="150" y="35" width="30" height="14" fill="#555"/>
  <line x1="165" y1="49" x2="165" y2="110" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="3,2"/>

  <line x1="200" y1="49" x2="230" y2="49" stroke="#555" stroke-width="1" marker-end="url(#arrow2)"/>
  <line x1="200" y1="110" x2="230" y2="110" stroke="#555" stroke-width="1"/>
  <line x1="228" y1="49" x2="228" y2="110" stroke="#555" stroke-width="1" marker-end="url(#arrow2)"/>
  <text class="t-label" x="235" y="75">自由落下</text>
  <text class="t-num" x="235" y="92">1.5m以下</text>

  <!-- 打込み面（既存層） -->
  <rect class="box-brand" x="20" y="110" width="360" height="60" rx="4"/>
  <text class="t-label" x="55" y="145" font-size="11">下層（既に打込み済み）</text>

  <line x1="20" y1="110" x2="380" y2="110" stroke="#2e6da4" stroke-width="2"/>
  <line x1="20" y1="170" x2="380" y2="170" stroke="#2e6da4" stroke-width="2"/>
  <line x1="10" y1="110" x2="10" y2="170" stroke="#555" stroke-width="1"/>
  <line x1="10" y1="110" x2="16" y2="110" stroke="#555" stroke-width="1"/>
  <line x1="10" y1="170" x2="16" y2="170" stroke="#555" stroke-width="1"/>
  <text class="t-num" x="0" y="145" text-anchor="middle" font-size="12" transform="rotate(-90 0 145)">40〜50cm</text>

  <text class="t-label" x="200" y="128" text-anchor="middle">打上がり高さ</text>

  <!-- バイブレーター -->
  <rect x="255" y="80" width="10" height="150" rx="4" fill="#555"/>
  <line x1="260" y1="170" x2="260" y2="190" stroke="#b22234" stroke-width="2" stroke-dasharray="2,2"/>
  <text class="t-label" x="285" y="185">挿入深さ</text>
  <text class="t-num" x="285" y="200">下層へ10cm</text>

  <!-- 新層 -->
  <rect class="box-positive" x="20" y="170" width="360" height="50" rx="4"/>
  <text class="t-label" x="40" y="200" font-size="11">新しい層（打込み中）</text>

  <!-- 挿入間隔（平面イメージ） -->
  <line x1="20" y1="245" x2="380" y2="245" stroke="#d7d7d7" stroke-width="1"/>
  <text class="t-label" x="200" y="268" text-anchor="middle">バイブレーターの挿入間隔（平面）</text>

  <circle cx="90" cy="320" r="14" class="box-brand"/>
  <circle cx="200" cy="320" r="14" class="box-brand"/>
  <circle cx="310" cy="320" r="14" class="box-brand"/>
  <line x1="104" y1="320" x2="186" y2="320" stroke="#555" stroke-width="1" marker-end="url(#arrow2)"/>
  <line x1="214" y1="320" x2="296" y2="320" stroke="#555" stroke-width="1" marker-end="url(#arrow2)"/>
  <text class="t-num" x="145" y="312" text-anchor="middle" font-size="12">50cm以下</text>
  <text class="t-num" x="255" y="312" text-anchor="middle" font-size="12">50cm以下</text>

  <text class="t-label" x="200" y="355" text-anchor="middle">1か所あたりの振動時間 5〜15秒</text>

  <!-- 4つの数値がもたらすリスク -->
  <line x1="15" y1="385" x2="385" y2="385" stroke="#d7d7d7" stroke-width="1"/>
  <text class="t-label" x="200" y="407" text-anchor="middle">数値を守らないと起きること</text>

  <rect class="box-brand" x="20" y="420" width="170" height="35" rx="6"/>
  <text class="t-label" x="105" y="442" text-anchor="middle">打上がり超過 → 締固め不足</text>

  <rect class="box-brand" x="210" y="420" width="170" height="35" rx="6"/>
  <text class="t-label" x="295" y="442" text-anchor="middle">落下過大 → 材料分離</text>

  <rect class="box-brand" x="10" y="460" width="190" height="35" rx="6"/>
  <text class="t-label" x="105" y="482" text-anchor="middle" font-size="11">挿入不足 → コールドジョイント</text>

  <rect class="box-brand" x="210" y="460" width="170" height="35" rx="6"/>
  <text class="t-label" x="295" y="482" text-anchor="middle">間隔過大 → 締固めムラ</text>
</svg>
