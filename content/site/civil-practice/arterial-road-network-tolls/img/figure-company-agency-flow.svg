<!-- authored 2026-11-05 doboku-note 自作。論点は高速道路株式会社法第1条、機構法第4条・第13条、道路整備特別措置法第23条。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="高速道路会社と日本高速道路保有・債務返済機構の分担図。機構は道路資産を保有して会社に貸し付け、債務を返済する。会社は新設、改築、維持、修繕などの事業を行い、貸付料を支払う。利用者が料金を支払い、両者は協定で貸付料や料金の額、徴収期間を定める。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 12px; fill: #222; }  /* ink-strong */
      .h { font-size: 11px; fill: #8a8a8a; }  /* ink-muted */
      .s { font-size: 11px; fill: #555; }  /* ink-body */
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .b { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .c { text-anchor: middle; }
      .tag { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }  /* surface */
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }  /* brand-fill / brand */
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }  /* warn-fill / warn */
      .pos { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }  /* positive-fill / positive */
      .ln { stroke: #2e6da4; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#2e6da4"/>
    </marker>
  </defs>
  <rect class="pos" x="10" y="12" width="380" height="88" rx="8"/>
  <text class="n" x="22" y="34">日本高速道路保有・債務返済機構</text>
  <text x="22" y="54">道路資産の保有、会社への貸付け</text>
  <text x="22" y="72">債務の早期の確実な返済</text>
  <text class="h" x="22" y="90">機構法 第4条</text>

  <line class="ln" x1="70" y1="104" x2="70" y2="156" marker-end="url(#arrow)"/>
  <text x="80" y="134">道路資産を貸し付ける</text>
  <line class="ln" x1="330" y1="156" x2="330" y2="104" marker-end="url(#arrow)"/>
  <text x="320" y="134" text-anchor="end">貸付料を支払う</text>

  <rect class="brand" x="10" y="160" width="380" height="84" rx="8"/>
  <text class="n" x="22" y="182">高速道路会社</text>
  <text x="22" y="202">新設・改築・維持・修繕などの事業</text>
  <text x="22" y="220">全国路線網などの単位で機構と協定を結ぶ</text>
  <text class="h" x="22" y="237">高速道路株式会社法 第1条</text>

  <line class="ln" x1="200" y1="284" x2="200" y2="248" marker-end="url(#arrow)"/>
  <text x="212" y="270">料金を支払う</text>
  <rect class="tag" x="10" y="286" width="380" height="36" rx="8"/>
  <text class="n c" x="200" y="309">利用者</text>

  <rect class="warn" x="10" y="334" width="380" height="72" rx="8"/>
  <text class="b" x="22" y="356">両者をつなぐのは協定（機構法 第13条）</text>
  <text x="22" y="376">貸し付ける道路資産・貸付料・料金の額と徴収期間</text>
  <text class="s" x="22" y="394">徴収期間の満了日は、貸付期間の満了日と同じ</text>

  <rect class="brand" x="10" y="416" width="380" height="74" rx="8"/>
  <text class="b" x="22" y="440">料金は、貸付料と維持・修繕の費用を償う</text>
  <text x="22" y="460">徴収期間の満了日は、令和97年9月30日以前</text>
  <text class="s" x="22" y="478">橋やトンネルの更新費用を、料金で賄うための延長</text>
</svg>
