<!-- authored 2026-10-16 doboku-note 自作。論点は数値標高モデル（DEM）の種別ごとの標高精度（RMS誤差）の差と、10mメッシュを土量の算出に使う危険。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="数値標高モデルの種別ごとの標高精度を横棒で比べた図。DEM1Aと5Aは航空レーザ測量で0.3m以内、5Bは0.7m以内、5Cは1.4m以内、10Aは2.5m以内、10Bは5.0m以内。10mメッシュの値を土量の算出にそのまま使うのは危険。">
  <defs>
  <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 11px; fill: #222; }
      .b { font-weight: bold; fill: #1a3a5c; }
      .m { fill: #555; }
      .t12 { font-size: 12px; }
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .pos { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .dng { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .sf { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .wh { fill: #fff; stroke: #2e6da4; stroke-width: 1.5; }
      .dash { fill: #fff; stroke: #555; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .grid { stroke: #d7d7d7; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .ax { stroke: #555; stroke-width: 1.5; fill: none; }
      .ar { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .ark { stroke: #555; stroke-width: 2; fill: none; }
  </style>
  <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  <marker id="ak" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  <marker id="as" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  <marker id="asg" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  </defs>
  <text class="m" x="12" y="22">標高精度（RMS誤差）。短いほど細かく測れる</text>
  <text class="t12 b" x="12" y="54">DEM1A・5A</text>
  <text class="m" x="12" y="70">1m・5mメッシュ</text>
  <rect class="pos" x="112" y="40" width="11.4" height="24" rx="4"/>
  <text class="t12 b" x="129.4" y="57">0.3m以内</text>
  <text class="m" x="112" y="82">航空レーザ測量</text>
  <text class="t12 b" x="12" y="110">DEM5B</text>
  <text class="m" x="12" y="126">5mメッシュ</text>
  <rect class="brand" x="112" y="96" width="26.599999999999998" height="24" rx="4"/>
  <text class="t12 b" x="144.6" y="113">0.7m以内</text>
  <text class="m" x="112" y="138">20cm画素の写真</text>
  <text class="t12 b" x="12" y="166">DEM5C</text>
  <text class="m" x="12" y="182">5mメッシュ</text>
  <rect class="brand" x="112" y="152" width="53.199999999999996" height="24" rx="4"/>
  <text class="t12 b" x="171.2" y="169">1.4m以内</text>
  <text class="m" x="112" y="194">40cm画素の写真</text>
  <text class="t12 b" x="12" y="222">DEM10A</text>
  <text class="m" x="12" y="238">10mメッシュ</text>
  <rect class="warn" x="112" y="208" width="95.0" height="24" rx="4"/>
  <text class="t12 b" x="213.0" y="225">2.5m以内</text>
  <text class="m" x="112" y="250">火山基本図の等高線</text>
  <text class="t12 b" x="12" y="278">DEM10B</text>
  <text class="m" x="12" y="294">10mメッシュ</text>
  <rect class="warn" x="112" y="264" width="190.0" height="24" rx="4"/>
  <text class="t12 b" x="308.0" y="281">5.0m以内</text>
  <text class="m" x="112" y="306">25,000分の1地形図の等高線など</text>
  <rect class="dng" x="12" y="330" width="376" height="64" rx="8"/>
  <text class="t12 b" x="200.0" y="357.0" text-anchor="middle">10mメッシュの値を</text>
  <text class="t12 b" x="200.0" y="375.0" text-anchor="middle">土量の算出にそのまま使うのは危険</text>
  <rect class="warn" x="12" y="406" width="376" height="82" rx="8"/>
  <text class="t12 b" x="200.0" y="433.0" text-anchor="middle">DEM1Aと5Aでも、建物の下など</text>
  <text class="t12" x="200.0" y="451.0" text-anchor="middle">計測点のないメッシュは補間され</text>
  <text class="t12" x="200.0" y="469.0" text-anchor="middle">精度は2.0m以内にとどまる</text>
</svg>
