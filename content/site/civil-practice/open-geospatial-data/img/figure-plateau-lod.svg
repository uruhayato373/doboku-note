<!-- authored 2026-10-16 doboku-note 自作。論点はLOD1とLOD2の形・提供地域の差と、向く検討（どちらも設計の寸法には使えない）。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="同じ建物をLOD1とLOD2で表した比較図。LOD1は中央値の高さの箱型で、提供地域の全域で整い、日影・景観・避難の概形の検討に向く。LOD2は屋根や壁の形状まで表し、特定のエリアに限られ、屋根の形が効く検討に向く。破線は実際の建物の形。どちらも設計の寸法には使えない。">
  <defs>
