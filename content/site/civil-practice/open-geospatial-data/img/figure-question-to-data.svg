<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="知りたいことごとに、どの公開データを見るかを並べた図。道路・建物・境界の位置は基盤地図情報と地理院タイル、地形の高低は数値標高モデル、属性は国土数値情報、危険な場所はハザードマップポータルと国土数値情報、建物の形と高さはPLATEAU、国道の位置は全国道路基盤地図。出す機関と更新・版・条件を添える。">
  <defs>
  <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 11px; fill: #555; }
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .s { font-size: 11px; fill: #555; }
      .m { font-size: 11px; fill: #8a8a8a; }
      .p { fill: #fff; stroke: #d7d7d7; stroke-width: 1.5; }
      .bb { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .bp { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .bw { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .bd { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .bs { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .a { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .ln { stroke: #8a8a8a; stroke-width: 1; fill: none; }
  </style>
  <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  <marker id="at" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  </defs>
<text class="m" x="20" y="22">知りたいこと</text><text class="m" x="144" y="22">見るデータ（出す機関｜更新・版・条件）</text>
  <rect class="bb" x="10" y="34" width="120" height="98" rx="8"/>
  <text class="t" x="70" y="79" text-anchor="middle">道路・建物・</text>
  <text class="t" x="70" y="95" text-anchor="middle">境界の位置</text>
  <path class="a" d="M132,83H146" marker-end="url(#ah)"/>
  <rect class="p" x="148" y="34" width="242" height="98" rx="8"/>
  <text class="n" x="158" y="56">基盤地図情報</text>
  <text class="s" x="158" y="72">国土地理院｜年4回更新（1・4・7・10月）</text>
  <text class="n" x="158" y="104">地理院タイル</text>
  <text class="s" x="158" y="120">国土地理院｜種類ごとに利用条件が違う</text>
  <path class="ln" d="M158,83H380" style="stroke:#d7d7d7"/>
  <rect class="bb" x="10" y="140" width="120" height="54" rx="8"/>
  <text class="t" x="70" y="171" text-anchor="middle">地形の高低</text>
  <path class="a" d="M132,167H146" marker-end="url(#ah)"/>
  <rect class="p" x="148" y="140" width="242" height="54" rx="8"/>
  <text class="n" x="158" y="164">数値標高モデル（DEM）</text>
  <text class="s" x="158" y="180">国土地理院｜種別ごとに精度が違う</text>
  <rect class="bb" x="10" y="202" width="120" height="54" rx="8"/>
  <text class="t" x="70" y="225" text-anchor="middle">土地利用・行政</text>
  <text class="t" x="70" y="241" text-anchor="middle">区域などの属性</text>
  <path class="a" d="M132,229H146" marker-end="url(#ah)"/>
  <rect class="p" x="148" y="202" width="242" height="54" rx="8"/>
  <text class="n" x="158" y="226">国土数値情報</text>
  <text class="s" x="158" y="242">国土交通省｜データごとに年度版</text>
  <rect class="bb" x="10" y="264" width="120" height="98" rx="8"/>
  <text class="t" x="70" y="317" text-anchor="middle">どこが危ないか</text>
  <path class="a" d="M132,313H146" marker-end="url(#ah)"/>
  <rect class="p" x="148" y="264" width="242" height="98" rx="8"/>
  <text class="n" x="158" y="286">ハザードマップポータル</text>
  <text class="s" x="158" y="302">国土地理院｜内容は作成機関で確かめる</text>
  <text class="n" x="158" y="334">国土数値情報（洪水浸水想定区域）</text>
  <text class="s" x="158" y="350">国土交通省｜位置精度は約25m</text>
  <path class="ln" d="M158,313H380" style="stroke:#d7d7d7"/>
  <rect class="bb" x="10" y="370" width="120" height="54" rx="8"/>
  <text class="t" x="70" y="401" text-anchor="middle">建物の形と高さ</text>
  <path class="a" d="M132,397H146" marker-end="url(#ah)"/>
  <rect class="p" x="148" y="370" width="242" height="54" rx="8"/>
  <text class="n" x="158" y="394">PLATEAU（3D都市モデル）</text>
  <text class="s" x="158" y="410">国土交通省｜標準製品仕様書は第5.1版</text>
  <rect class="bb" x="10" y="432" width="120" height="54" rx="8"/>
  <text class="t" x="70" y="463" text-anchor="middle">国道の道路の位置</text>
  <path class="a" d="M132,459H146" marker-end="url(#ah)"/>
  <rect class="p" x="148" y="432" width="242" height="54" rx="8"/>
  <text class="n" x="158" y="456">全国道路基盤地図</text>
  <text class="s" x="158" y="472">国土交通省｜令和6年5月31日に公開</text>
</svg>
