<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="機械の据付け作業を業種に振り分ける図。運搬と荷下ろしだけなら建設工事に当たらない場合があり、クレーン等での揚重運搬配置とアンカー固定はとび・土工・コンクリート工事、現場での組立てや工作物への取付けは機械器具設置工事。電気・管などに当たる機械はその専門工事" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker></defs>
<rect width="400" height="500" fill="#ffffff"/>
<g fill="#555" font-size="12" text-anchor="middle"><text x="104" y="26">作業の中身</text><text x="298" y="26">許可業種での扱い</text></g>
<g stroke-width="1.5">
<rect x="18" y="40" width="172" height="88" rx="8" fill="#f5f5f5" stroke="#d7d7d7"/>
<rect x="220" y="40" width="162" height="88" rx="8" fill="#f5f5f5" stroke="#d7d7d7"/>
<line x1="191" y1="84" x2="219" y2="84" stroke="#2e6da4" marker-end="url(#ar)"/>
<rect x="18" y="146" width="172" height="88" rx="8" fill="#f5f5f5" stroke="#d7d7d7"/>
<rect x="220" y="146" width="162" height="88" rx="8" fill="#e8f0fe" stroke="#2e6da4"/>
<line x1="191" y1="190" x2="219" y2="190" stroke="#2e6da4" marker-end="url(#ar)"/>
<rect x="18" y="252" width="172" height="88" rx="8" fill="#f5f5f5" stroke="#d7d7d7"/>
<rect x="220" y="252" width="162" height="88" rx="8" fill="#e8f0fe" stroke="#2e6da4"/>
<line x1="191" y1="296" x2="219" y2="296" stroke="#2e6da4" marker-end="url(#ar)"/>
<rect x="18" y="358" width="172" height="88" rx="8" fill="#f5f5f5" stroke="#d7d7d7"/>
<rect x="220" y="358" width="162" height="88" rx="8" fill="#d0e8d0" stroke="#3a7d44"/>
<line x1="191" y1="402" x2="219" y2="402" stroke="#2e6da4" marker-end="url(#ar)"/>
</g>
<g fill="#222" font-size="12">
<text x="30" y="68">運搬と荷下ろしだけで、</text>
<text x="30" y="88">据付けや固定は</text>
<text x="30" y="108">伴わない</text>
<text x="30" y="174">クレーン等で重量物を</text>
<text x="30" y="194">所定の位置へ揚重し、</text>
<text x="30" y="214">運搬配置する</text>
<text x="30" y="280">あと施工アンカー等で</text>
<text x="30" y="300">躯体や基礎に</text>
<text x="30" y="320">固定する</text>
<text x="30" y="386">現場で組み立てるか、</text>
<text x="30" y="406">工作物に機械器具を</text>
<text x="30" y="426">取り付ける</text>
</g>
<g fill="#222" font-size="12" font-weight="700">
<text x="232" y="68">建設工事に</text>
<text x="232" y="88">当たらない場合</text>
<text x="232" y="174">とび・土工・</text>
<text x="232" y="194">コンクリート工事</text>
<text x="232" y="280">とび・土工・</text>
<text x="232" y="300">コンクリート工事</text>
<text x="232" y="386">機械器具設置工事</text>
</g>
<g fill="#555" font-size="11">
<text x="232" y="108">（運搬・積卸しのみ）</text>
<text x="232" y="214">（重量物の揚重運搬配置）</text>
<text x="232" y="320">（アンカー工事）</text>
<text x="232" y="408">（電気・管などに当たる</text><text x="232" y="424">機械は、その専門工事）</text>
</g>
<g fill="#555" font-size="11"><text x="20" y="472">機械の種類と契約の範囲で変わる。配管・配線の作業は</text><text x="20" y="488">管工事・電気工事に当たり得る。割れるときは行政庁へ</text></g>
</svg>
