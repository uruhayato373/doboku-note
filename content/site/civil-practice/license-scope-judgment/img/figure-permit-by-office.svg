<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="営業所の置き方による許可区分の違い。営業所が一つの県だけなら知事許可で他県の現場も施工でき、二つ以上の県に営業所があれば国土交通大臣の許可になる" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker></defs>
<rect width="400" height="500" fill="#ffffff"/>
<text x="20" y="30" font-size="13" font-weight="700" fill="#222">A社 — 営業所は甲県だけ</text>
<rect x="18" y="44" width="172" height="104" rx="8" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
<rect x="210" y="44" width="172" height="104" rx="8" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
<text x="30" y="64" font-size="12" fill="#555">甲県</text>
<text x="222" y="64" font-size="12" fill="#555">乙県</text>
<rect x="32" y="80" width="144" height="52" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<text x="104" y="102" font-size="12" font-weight="700" fill="#222" text-anchor="middle">A社の営業所</text>
<text x="104" y="119" font-size="11" fill="#555" text-anchor="middle">見積り・契約を行う</text>
<rect x="224" y="80" width="144" height="52" rx="6" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
<text x="296" y="102" font-size="12" font-weight="700" fill="#222" text-anchor="middle">A社の現場</text>
<text x="296" y="119" font-size="11" fill="#555" text-anchor="middle">施工する場所</text>
<line x1="177" y1="106" x2="223" y2="106" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="18" y="160" width="364" height="40" rx="8" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
<text x="200" y="185" font-size="13" font-weight="700" fill="#1a3a5c" text-anchor="middle">甲県知事の許可（乙県の現場も施工できる）</text>
<text x="20" y="240" font-size="13" font-weight="700" fill="#222">B社 — 営業所が甲県と乙県</text>
<rect x="18" y="254" width="172" height="104" rx="8" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
<rect x="210" y="254" width="172" height="104" rx="8" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
<text x="30" y="274" font-size="12" fill="#555">甲県</text>
<text x="222" y="274" font-size="12" fill="#555">乙県</text>
<rect x="32" y="290" width="144" height="52" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<text x="104" y="312" font-size="12" font-weight="700" fill="#222" text-anchor="middle">B社の本店</text>
<text x="104" y="329" font-size="11" fill="#555" text-anchor="middle">甲県</text>
<rect x="224" y="290" width="144" height="52" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<text x="296" y="312" font-size="12" font-weight="700" fill="#222" text-anchor="middle">B社の営業所</text>
<text x="296" y="329" font-size="11" fill="#555" text-anchor="middle">乙県で契約を行う</text>
<rect x="18" y="370" width="364" height="40" rx="8" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
<text x="200" y="395" font-size="13" font-weight="700" fill="#1a3a5c" text-anchor="middle">国土交通大臣の許可</text>
<g fill="#555" font-size="11"><text x="20" y="440">営業所とは、本店・支店と、常時請負契約を結ぶ事務所のこと</text><text x="20" y="456">見積り・入札・契約締結を行う事務所は、契約書の名義人が</text><text x="20" y="472">代表者でなくても営業所に当たる</text></g>
</svg>
