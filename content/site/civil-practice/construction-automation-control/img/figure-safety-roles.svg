<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="自動施工の安全に関わる四つの役割と、情報が渡る向き。製造者等が設計段階のリスクアセスメントを行い、残るリスクを使用上の情報として販売者等を通じて施工者等と使用者へ渡す。施工者等と使用者は、現場のリスクアセスメントを行う。">
  <defs>
  <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 12px; fill: #555; }
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .s { font-size: 11px; fill: #555; }
      .k { font-size: 12px; fill: #222; }
      .p { fill: #fff; stroke: #d7d7d7; stroke-width: 1.5; }
      .bb { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .bp { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .bw { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .bd { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .bs { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .ln { stroke: #2e6da4; stroke-width: 1.5; fill: none; stroke-linejoin: round; }
      .hd { stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 4 3; fill: none; }
      .ar { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .gy { stroke: #555; stroke-width: 1.5; fill: none; }
  </style>
  <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  <marker id="ag" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  <marker id="ags" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  </defs>
  <rect class="bb" x="30" y="14" width="210" height="70" rx="8"/>
  <text class="n" x="44" y="44">製造者等</text><text class="s" x="44" y="66">設計・製造し、使用上の情報を渡す</text>
  <rect class="bb" x="30" y="138" width="210" height="70" rx="8"/>
  <text class="n" x="44" y="168">販売者等</text><text class="s" x="44" y="190">標識や取扱説明書で情報を伝える</text>
  <rect class="bw" x="30" y="262" width="210" height="70" rx="8"/>
  <text class="n" x="44" y="292">施工者等</text><text class="s" x="44" y="314">導入を判断し、計画を管理する</text>
  <rect class="bb" x="30" y="358" width="210" height="70" rx="8"/>
  <text class="n" x="44" y="388">使用者</text><text class="s" x="44" y="410">提供された情報を確かめて使う</text>
  <rect x="162" y="274" width="68" height="20" rx="10" class="bw" style="fill:#fff"/><text class="t" x="196" y="288" text-anchor="middle" style="font-size:11px">計画の中心</text>
  <path class="ar" d="M135,84V134" marker-end="url(#ah)"/><text class="s" x="147" y="115">使用上の情報</text>
  <path class="ar" d="M135,208V258" marker-end="url(#ah)"/><text class="s" x="147" y="239">使用上の情報</text>
  <path class="ar" d="M70,208V234H20V393H26" marker-end="url(#ah)"/><text class="s" x="24" y="252">使用上の情報</text>
  <path d="M258,14H264V84H258" class="gy"/><text class="t" x="274" y="44" style="font-size:11px">設計段階の</text><text class="t" x="274" y="59" style="font-size:11px">リスクアセスメント</text>
  <path d="M258,262H264V428H258" class="gy"/><text class="t" x="274" y="337" style="font-size:11px">現場の</text><text class="t" x="274" y="352" style="font-size:11px">リスクアセスメント</text>
  <rect class="p" x="10" y="446" width="380" height="44" rx="8"/>
  <path class="ar" d="M26,462H66" marker-end="url(#ah)"/><text class="k" x="78" y="466">使用上の情報が渡る向き</text><text class="s" x="26" y="482">一つの者が複数の役割を兼ねる場合もある</text>

</svg>
