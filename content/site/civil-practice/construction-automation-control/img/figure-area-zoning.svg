<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="自動施工の区域を上から見た平面図。中央の無人エリアを立入制限エリアが囲み、その外側に有人エリアがある。境界には中継区域と、運搬機械の出入口がある。境界では、防護柵などで物理的に防ぎ、区域を監視し、対策を複数重ねる。">
