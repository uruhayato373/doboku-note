<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="運転の制御と安全関連システムを別の系統に分けた図。安全関連システムは入力部、論理処理部、出力部からなり、運転制御から独立させる。独立していない非常停止ボタンは高頻度の作動要求として扱う。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 12px; fill: #222; }
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .s { font-size: 11px; fill: #555; }
      .bb { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .bd { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .bw { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .bx { fill: #fff; stroke: #b22234; stroke-width: 1.5; }
      .a { fill: #b22234; }
    </style>
  </defs>
  <rect class="bb" x="15" y="14" width="370" height="70" rx="8"/>
  <text class="n" x="27" y="42">運転の制御</text>
  <text x="27" y="64">機械を動かすためのシステム</text>
  <path d="M15 106H385" stroke="#555" stroke-width="2" stroke-dasharray="7 4" fill="none"/>
  <text class="n" x="200" y="128" text-anchor="middle">別の系統に置く（独立）</text>
  <rect class="bd" x="15" y="144" width="370" height="206" rx="8"/>
  <text class="n" x="27" y="168">安全関連システム</text>
  <rect class="bx" x="35" y="180" width="330" height="40" rx="6"/>
  <text class="n" x="47" y="205">入力部</text><text x="140" y="205">センサなど</text>
  <path class="a" d="M194 222h12l-6 10z"/>
  <rect class="bx" x="35" y="234" width="330" height="40" rx="6"/>
  <text class="n" x="47" y="259">論理処理部</text><text x="140" y="259">入力を受けて処理する</text>
  <path class="a" d="M194 276h12l-6 10z"/>
  <rect class="bx" x="35" y="288" width="330" height="40" rx="6"/>
  <text class="n" x="47" y="313">出力部</text><text x="140" y="313">アクチュエータなど</text>
  <rect class="bw" x="15" y="366" width="370" height="122" rx="8"/>
  <text class="n" x="27" y="392">非常停止ボタンも同じ</text>
  <text x="27" y="416">運転用の制御から独立していなければ、</text>
  <text x="27" y="436">高頻度の作動要求として扱う</text>
  <text class="s" x="27" y="462">より厳しい安全度が求められる扱いになる</text>
</svg>
