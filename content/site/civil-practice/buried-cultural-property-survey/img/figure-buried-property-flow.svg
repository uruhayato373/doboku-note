<!-- authored 2026-10-15 doboku-note 自作。論点は文化庁次長通知（平成10年9月29日）と文化財保護法第94条・第95条・第97条。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="埋蔵文化財の調査の流れを示した図。事業計画のあと、教育委員会に照会し、周知の包蔵地かを確かめる（第95条）。自治体の事業は通知と協議を行い（第94条）、試掘・確認調査で範囲を押さえる。そのうえで現状保存か記録保存かを決め、現状保存なら計画を見直すか盛土で残し、記録保存なら本発掘を経て工事に進む。工事中の発見は第97条。">
