<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="暴風域に入る確率の時系列グラフで、立ち上がり・ピーク・終わりの時刻を読み、退避に必要な時間の合計と立ち上がりまでの残り時間を比べる" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,0 8,3.5 0,7" fill="#8a8a8a"/>
    </marker>
  </defs>
  <rect width="400" height="500" fill="#ffffff"/>
  <text x="20" y="30" font-size="12" fill="#555">暴風域に入る確率</text>
  <path d="M50,250 L50,40" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M50,250 L372,250" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M50,250 L62,250 L74,250 L86,250 L98,250 L110,249 L122,248 L134,245 L146,240 L158,231 L170,217 L182,198 L194,173 L206,145 L218,117 L230,95 L242,84 L254,85 L266,97 L278,117 L290,143 L302,169 L314,193 L326,212 L338,227 L350,237 L362,243 L362,250 L50,250 Z" fill="#e8f0fe"/>
  <path d="M50,250 L62,250 L74,250 L86,250 L98,250 L110,249 L122,248 L134,245 L146,240 L158,231 L170,217 L182,198 L194,173 L206,145 L218,117 L230,95 L242,84 L254,85 L266,97 L278,117 L290,143 L302,169 L314,193 L326,212 L338,227 L350,237 L362,243" fill="none" stroke="#2e6da4" stroke-width="2"/>
  <g stroke="#555" stroke-width="1" stroke-dasharray="4 3" fill="none">
    <path d="M146,240 L146,256"/>
    <path d="M242,84 L242,256"/>
    <path d="M338,227 L338,256"/>
    <path d="M146,344 L146,462"/>
  </g>
  <circle cx="146" cy="240" r="4" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <circle cx="242" cy="84" r="4" fill="#f8d7da" stroke="#b22234" stroke-width="1.5"/>
  <circle cx="338" cy="227" r="4" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#1a3a5c">
    <g font-size="13" font-weight="700">
      <text x="146" y="274">立ち上がり</text>
      <text x="242" y="274">ピーク</text>
      <text x="338" y="274">終わり</text>
    </g>
    <g font-size="12">
      <text x="146" y="292">早ければ</text>
      <text x="146" y="308">ここから入る</text>
      <text x="242" y="292">最も入っている</text>
      <text x="242" y="308">可能性が高い</text>
      <text x="338" y="292">遅ければ</text>
      <text x="338" y="308">ここまで</text>
    </g>
  </g>
  <text x="20" y="334" font-size="12" fill="#555">横軸は現在から先の時刻。退避に要する時間と比べる</text>
  <g stroke-width="1.5">
    <rect x="50" y="346" width="96" height="46" rx="3" fill="#f5f5f5" stroke="#d7d7d7"/>
    <rect x="50" y="406" width="60" height="46" rx="3" fill="#e8f0fe" stroke="#2e6da4"/>
    <rect x="110" y="406" width="40" height="46" rx="3" fill="#e8f0fe" stroke="#2e6da4"/>
    <rect x="150" y="406" width="40" height="46" rx="3" fill="#fff3cd" stroke="#d4a017"/>
    <path d="M146,464 L190,464" fill="none" stroke="#b22234" stroke-width="2"/>
  </g>
  <g font-size="13" font-weight="700" fill="#1a3a5c" text-anchor="middle">
    <text x="98" y="374">残り時間</text>
    <text x="80" y="434">撤収</text>
    <text x="130" y="434">移動</text>
    <text x="170" y="434">余裕</text>
  </g>
  <text x="156" y="374" font-size="12" fill="#555">現在から立ち上がりまで</text>
  <text x="200" y="429" font-size="12" fill="#555">必要な時間の合計</text>
  <text x="168" y="486" font-size="13" font-weight="700" fill="#1a3a5c" text-anchor="middle">超えた分だけ前倒し</text>
</svg>
