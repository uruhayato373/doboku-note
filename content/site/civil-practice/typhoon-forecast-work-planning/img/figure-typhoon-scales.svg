<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="台風の強さは最大風速、大きさは強風域の半径で別々に区分し、風速には10分間平均と3秒平均の瞬間風速の2種類がある" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
  <rect width="400" height="500" fill="#ffffff"/>
  <g font-size="12" fill="#555">
    <text x="20" y="30">強さ：中心付近の最大風速（10分間平均）</text>
    <text x="20" y="118">単位はm/s。最大風速がおよそ17m/s以上で台風と呼ぶ</text>
    <text x="20" y="152">大きさ：強風域（15m/s以上）の半径</text>
    <text x="20" y="262">風速の数字は、平均する時間で2種類ある</text>
    <text x="20" y="394">平均風速を1としたときの瞬間風速の目安</text>
    <text x="20" y="488">例：平均15m/sの予想なら、瞬間は約22〜45m/s</text>
  </g>
  <g stroke-width="1.5">
    <rect x="20" y="40" width="90" height="58" fill="#f5f5f5" stroke="#d7d7d7"/>
    <rect x="110" y="40" width="90" height="58" fill="#e8f0fe" stroke="#2e6da4"/>
    <rect x="200" y="40" width="90" height="58" fill="#fff3cd" stroke="#d4a017"/>
    <rect x="290" y="40" width="90" height="58" fill="#f8d7da" stroke="#b22234"/>
    <rect x="20" y="162" width="120" height="58" fill="#f5f5f5" stroke="#d7d7d7"/>
    <rect x="140" y="162" width="120" height="58" fill="#e8f0fe" stroke="#2e6da4"/>
    <rect x="260" y="162" width="120" height="58" fill="#fff3cd" stroke="#d4a017"/>
    <rect x="20" y="274" width="172" height="96" rx="6" fill="#e8f0fe" stroke="#2e6da4"/>
    <rect x="208" y="274" width="172" height="96" rx="6" fill="#fff3cd" stroke="#d4a017"/>
    <rect x="70" y="406" width="60" height="28" fill="#e8f0fe" stroke="#2e6da4"/>
    <rect x="70" y="444" width="90" height="28" fill="#fff3cd" stroke="#d4a017"/>
    <rect x="160" y="444" width="90" height="28" fill="#f5f5f5" stroke="#d4a017" stroke-dasharray="4 3"/>
  </g>
  <g text-anchor="middle" fill="#1a3a5c">
    <g font-size="13" font-weight="700">
      <text x="65" y="66">階級名なし</text>
      <text x="155" y="66">強い</text>
      <text x="245" y="66">非常に強い</text>
      <text x="335" y="66">猛烈な</text>
      <text x="80" y="188">階級名なし</text>
      <text x="200" y="188">大型</text>
      <text x="320" y="188">超大型</text>
      <text x="106" y="298">平均風速</text>
      <text x="294" y="298">瞬間風速</text>
    </g>
    <g font-size="12">
      <text x="65" y="86">33m/s未満</text>
      <text x="155" y="86">33〜44</text>
      <text x="245" y="86">44〜54</text>
      <text x="335" y="86">54以上</text>
      <text x="80" y="208">500km未満</text>
      <text x="200" y="208">500〜800km</text>
      <text x="320" y="208">800km以上</text>
      <text x="106" y="318">10分間の平均</text>
      <text x="106" y="337">階級・暴風域に使う</text>
      <text x="106" y="356">最大風速はその最大値</text>
      <text x="294" y="318">0.25秒値を3秒平均</text>
      <text x="294" y="337">一瞬の風の強さ</text>
      <text x="294" y="356">最大瞬間風速はその最大値</text>
      <text x="100" y="424">1倍</text>
      <text x="115" y="462">1.5倍</text>
      <text x="205" y="462">〜3倍</text>
    </g>
  </g>
  <g font-size="13" font-weight="700" fill="#1a3a5c">
    <text x="20" y="424">平均</text>
    <text x="20" y="462">瞬間</text>
  </g>
</svg>
