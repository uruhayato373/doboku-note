<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="建設業法第25条の28の三つの項と、ICT指針が示す事務と現場の取り組みを並べた図。特定建設業者の努力義務、下請の指導、国の指針公表、公共工事での読み替えを示す">
<defs><style>
text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN","Hiragino Sans",sans-serif;font-size:12px;fill:#222}
.h{font-size:14px;font-weight:bold;fill:#1a3a5c}
.k{font-size:13px;font-weight:bold;fill:#222}
.s{font-size:11px;fill:#555}
.c{text-anchor:middle}
.r{stroke-width:1.5}
.n{fill:#e8f0fe;stroke:#2e6da4}
.p{fill:#d0e8d0;stroke:#3a7d44}
.w{fill:#fff3cd;stroke:#d4a017}
.d{fill:#f8d7da;stroke:#b22234}
.g{fill:#f5f5f5;stroke:#d7d7d7}
.a{fill:#2e6da4}
</style></defs>
<text class="s" x="15" y="12">建設業法 第25条の28</text>
<rect class="r n" x="15" y="18" width="370" height="48" rx="8"/>
<text class="k" x="27" y="47">1項</text>
<text class="h" x="66" y="38">特定建設業者</text>
<text x="66" y="56">ICT活用の措置を講ずるよう努める</text>
<rect class="r n" x="15" y="72" width="370" height="48" rx="8"/>
<text class="k" x="27" y="101">2項</text>
<text class="h" x="66" y="92">発注者から直接請け負う特定建設業者</text>
<text x="66" y="110">下請の措置を指導するよう努める</text>
<rect class="r p" x="15" y="126" width="370" height="48" rx="8"/>
<text class="k" x="27" y="155">3項</text>
<text class="h" x="66" y="146">国土交通大臣</text>
<text x="66" y="164">指針を定めて公表する（ICT指針）</text>
<rect class="r w" x="15" y="184" width="370" height="46" rx="8"/>
<text x="27" y="204">公共工事は入札契約適正化法16条で「建設業者」に読み替え</text>
<text x="27" y="221">特定・一般を問わず対象になる</text>
<path class="a" d="M194 234 h12 l-6 10 z"/>
<text class="k" x="15" y="262">事務で進める</text><text class="k" x="207" y="262">現場で進める</text>
<rect class="r n" x="15" y="272" width="178" height="38" rx="8"/><text x="25" y="296">書類のやり取りの合理化</text>
<rect class="r n" x="15" y="316" width="178" height="38" rx="8"/><text x="25" y="340">CCUS・建退共電子申請方式</text>
<rect class="r n" x="15" y="360" width="178" height="38" rx="8"/><text x="25" y="384">電子契約の活用</text>
<rect class="r p" x="207" y="272" width="178" height="38" rx="8"/><text x="217" y="296">工種と精度に合う機器</text>
<rect class="r p" x="207" y="316" width="178" height="38" rx="8"/><text x="217" y="340">兼任制度との組み合わせ</text>
<rect class="r p" x="207" y="360" width="178" height="38" rx="8"/><text x="217" y="384">下請との連携・協働</text>
<rect class="r p" x="207" y="404" width="178" height="38" rx="8"/><text x="217" y="428">技術者・技能者の技能向上</text>
<rect class="r g" x="15" y="456" width="370" height="36" rx="8"/>
<text class="k c" x="200" y="479">機器の導入より、工種と精度に合う使い方</text>
</svg>
