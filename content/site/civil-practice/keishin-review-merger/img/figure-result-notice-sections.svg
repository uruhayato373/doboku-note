  <text class="n" x="303" y="61" text-anchor="middle">Z 元請完成工事高</text>
  <rect class="src" x="10" y="84" width="172" height="66" rx="8"/>
  <text class="n" x="22" y="122">決算書の数字</text>
  <path class="arr" d="M186,117H210" marker-end="url(#ah)"/>
  <rect x="216" y="92" width="174" height="24" rx="12" style="fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5"/>
