  <text class="n" x="22" y="189">技術職員名簿と</text>
  <text class="n" x="22" y="207">確認書類（業種ごと）</text>
  <path class="arr" d="M186,193H210" marker-end="url(#ah)"/>
  <rect x="216" y="181" width="174" height="24" rx="12" style="fill:#fff3cd;stroke:#d4a017;stroke-width:1.5"/>
  <text class="n" x="303" y="197" text-anchor="middle">Z 技術職員</text>
  <rect class="src" x="10" y="236" width="172" height="66" rx="8"/>
