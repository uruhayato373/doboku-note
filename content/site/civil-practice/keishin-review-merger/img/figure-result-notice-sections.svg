<!-- authored 2026-10-16 doboku-note 自作。論点は経営事項審査の結果通知書の区画と、区画を決める申請資料の対応（建設業法第27条の25・第27条の27・第27条の29）。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="経営事項審査の結果通知書の読み方。左の申請資料から右の区画が決まる。行政庁が通知する区画はX1、Z、W、X2で様式第25号の15、分析機関が通知する区画はYで様式第25号の13。Pはこの五つの区画を告示の算式で合わせた総合評定値。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 12px; fill: #222; }
      .n { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .nn { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .s { font-size: 11px; fill: #555; }
      .src { fill: #fff; stroke: #d7d7d7; stroke-width: 1.5; }
      .card { fill: #fff; stroke: #d7d7d7; stroke-width: 1.5; }
      .p { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .bp { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .bw { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .bg { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; }
      .arr { stroke: #8a8a8a; stroke-width: 1.5; fill: none; }
      .axis { stroke: #8a8a8a; stroke-width: 2; fill: none; }
      .dot { fill: #2e6da4; stroke: #fff; stroke-width: 2; }
    </style>
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#8a8a8a"/></marker>
  </defs>
  <rect x="190" y="8" width="200" height="212" rx="8" fill="#fff" stroke="#2e6da4" stroke-width="1.5"/>
  <text class="n" x="200" y="26">行政庁が通知</text><text class="s" x="200" y="40">様式第25号の15</text>
  <rect x="190" y="230" width="200" height="72" rx="8" fill="#fff" stroke="#3a7d44" stroke-width="1.5"/>
  <text class="n" x="200" y="248">分析機関が通知</text><text class="s" x="200" y="262">様式第25号の13</text>
  <rect class="b" x="200" y="50" width="180" height="30" rx="6"/>
  <text class="n" x="290" y="69" text-anchor="middle">X1</text>
  <rect class="bw" x="200" y="88" width="180" height="44" rx="6"/>
  <text class="n" x="290" y="105" text-anchor="middle">Z</text>
  <text x="290" y="122" text-anchor="middle">元請完成工事高・技術職員</text>
  <rect class="bg" x="200" y="140" width="180" height="30" rx="6"/>
  <text class="n" x="290" y="159" text-anchor="middle">W 社会性等</text>
  <rect class="b" x="200" y="178" width="180" height="30" rx="6"/>
  <text class="n" x="290" y="197" text-anchor="middle">X2</text>
  <rect class="bp" x="200" y="268" width="180" height="26" rx="6"/>
  <text class="n" x="290" y="285" text-anchor="middle">Y</text>
  <rect class="src" x="10" y="42" width="140" height="56" rx="8"/>
  <text class="n" x="20" y="60">工事ごとの完成</text>
  <text class="n" x="20" y="76">工事高</text><text class="n" x="20" y="90">（業種ごと）</text>
  <rect class="src" x="10" y="104" width="140" height="50" rx="8"/>
  <text class="n" x="20" y="125">技術職員名簿と</text>
  <text class="n" x="20" y="141">確認書類（業種ごと）</text>
  <rect class="src" x="10" y="164" width="140" height="50" rx="8"/>
  <text class="n" x="20" y="185">社会性等の項目ごとの</text>
  <text class="n" x="20" y="201">申請と確認書類</text>
  <rect class="src" x="10" y="224" width="140" height="50" rx="8"/>
  <text class="n" x="20" y="253">決算書の数字</text>
  <path class="arr" d="M150,66 L198,65" marker-end="url(#ah)"/>
  <path class="arr" d="M150,80 L198,106" marker-end="url(#ah)"/>
  <path class="arr" d="M150,129 L198,120" marker-end="url(#ah)"/>
  <path class="arr" d="M150,189 L198,155" marker-end="url(#ah)"/>
  <path class="arr" d="M150,241 L198,193" marker-end="url(#ah)"/>
  <path class="arr" d="M150,257 L198,281" marker-end="url(#ah)"/>
  <path class="arr" d="M200,310V318H380V310" style="stroke:#2e6da4"/>
  <path class="arr" d="M290,318V336" marker-end="url(#ah)"/>
  <rect class="p" x="10" y="340" width="380" height="64" rx="8"/>
  <text class="nn" x="22" y="366">P 総合評定値</text>
  <text x="22" y="388">X1・X2・Y・Z・W を、告示の算式で合わせる</text>
  <rect x="14" y="428" width="16" height="16" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
  <text class="s" x="38" y="441">分析機関が出す通知</text>
  <rect x="14" y="452" width="16" height="16" fill="#fff" stroke="#2e6da4" stroke-width="1.5"/>
  <text class="s" x="38" y="465">行政庁が出す通知</text>
  <text class="n" x="190" y="441">手元に残る通知書は二通</text>
  <text class="s" x="190" y="461">Y の分析結果と、評価と総合評定値</text>
</svg>
