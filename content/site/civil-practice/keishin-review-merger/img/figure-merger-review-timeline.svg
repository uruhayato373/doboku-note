<!-- authored 2026-10-16 doboku-note 自作。論点は建設業者の合併に係る経営事項審査の事務取扱い（国総建第309号）の審査基準日と合併直前の経審との関係。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="合併時の審査基準日の時間軸。横の時間軸に、合併直前の決算日、合併の日（吸収合併は合併期日・新設合併は合併登記の日）、合併後最初の決算日を置く。合併直前の経審は合併後の状態が評価されるまで有効で、合併時経審と重なる。両方を受けると合併時経審の結果が通知される。合併後最初の決算日の経審に合併の影響が残る項目は五つ。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 12px; fill: #222; }
      .n { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .nn { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .s { font-size: 11px; fill: #555; }
      .src { fill: #fff; stroke: #d7d7d7; stroke-width: 1.5; }
      .card { fill: #fff; stroke: #d7d7d7; stroke-width: 1.5; }
      .p { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .bp { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .bw { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .bg { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; }
      .arr { stroke: #8a8a8a; stroke-width: 1.5; fill: none; }
      .axis { stroke: #8a8a8a; stroke-width: 2; fill: none; }
      .dot { fill: #2e6da4; stroke: #fff; stroke-width: 2; }
    </style>
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#8a8a8a"/></marker>
  </defs>
  <rect class="b" x="60" y="18" width="240" height="30" rx="6"/>
  <text class="n" x="72" y="38">合併直前の経審（有効）</text>
  <rect class="bw" x="170" y="54" width="206" height="30" rx="6"/>
  <text class="n" x="182" y="74">合併時経審（全業種で受ける）</text>
  <path d="M170,96V102H300V96" stroke="#555" stroke-width="1.5" fill="none"/>
  <text class="s" x="235" y="118" text-anchor="middle">重なる期間</text>
  <path class="axis" d="M20,142H382" marker-end="url(#ah)"/>
  <circle class="dot" cx="60" cy="142" r="7"/>
  <circle class="dot" cx="170" cy="142" r="7"/>
  <circle class="dot" cx="300" cy="142" r="7"/>
  <text class="s" x="60" y="166" text-anchor="middle">合併直前の</text>
  <text class="s" x="60" y="180" text-anchor="middle">決算日</text>
  <text class="n" x="170" y="166" text-anchor="middle">吸収合併 合併期日</text>
  <text class="n" x="170" y="182" text-anchor="middle">新設合併 合併登記の日</text>
  <text class="s" x="300" y="166" text-anchor="middle">合併後最初の</text>
  <text class="s" x="300" y="180" text-anchor="middle">決算日</text>
  <rect class="card" x="10" y="200" width="380" height="84" rx="8"/>
  <text class="nn" x="22" y="224">両方を受けたとき</text>
  <text x="22" y="246">通知済みの発注者へ、合併時経審の結果が</text>
  <text x="22" y="266">通知される。合併時経審だけでもよい</text>
  <text class="nn" x="14" y="314">合併後最初の決算日の経審に残る五つ</text>
  <rect class="bp" x="14" y="326" width="180" height="32" rx="6"/>
  <text x="104" y="346" text-anchor="middle">完成工事高</text>
  <rect class="bp" x="206" y="326" width="180" height="32" rx="6"/>
  <text x="296" y="346" text-anchor="middle">技術職員の雇用関係</text>
  <rect class="bp" x="14" y="366" width="180" height="32" rx="6"/>
  <text x="104" y="386" text-anchor="middle">財務の前期の数値</text>
  <rect class="bp" x="206" y="366" width="180" height="32" rx="6"/>
  <text x="296" y="386" text-anchor="middle">営業年数</text>
  <rect class="bp" x="14" y="406" width="180" height="32" rx="6"/>
  <text x="104" y="426" text-anchor="middle">法令遵守</text>
</svg>
