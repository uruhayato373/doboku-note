<!-- authored 2026-10-15 doboku-note 自作。説明の順は国土交通省の公共事業の構想段階における計画策定プロセスガイドライン（概要）を参考にして再構成した。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="事業の説明を組み立てる順の流れ図。何を決めたいか、必要性と課題、複数の案、比較、選んだ理由、これから、の順に並べる。比較の段では図と数値で客観的に示し、選んだ理由の段では重視した観点とその理由を書き、最後に聴いた意見を整理して対応を返す。">
  <defs>
