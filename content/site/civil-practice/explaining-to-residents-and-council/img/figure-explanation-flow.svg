      .g { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .l { stroke: #d7d7d7; stroke-width: 1; fill: none; }
      .a { stroke: #2e6da4; stroke-width: 2; fill: none; }
    </style>
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
    <marker id="at" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  </defs>
  <rect class="b" x="20" y="12" width="360" height="66" rx="8"/>
  <circle cx="46" cy="45.0" r="12" fill="#fff" stroke="#2e6da4" stroke-width="1.5"/>
  <text class="t" x="46" y="50.0" text-anchor="middle">1</text>
  <text class="n" x="70" y="41.0">何を決めたいか</text>
  <text class="s" x="70" y="61.0">目的と、いま決めようとしていること</text>
  <path class="a" d="M200.0,80L200.0,92" marker-end="url(#ah)"/>
  <rect class="b" x="20" y="94" width="360" height="66" rx="8"/>
  <circle cx="46" cy="127.0" r="12" fill="#fff" stroke="#2e6da4" stroke-width="1.5"/>
  <text class="t" x="46" y="132.0" text-anchor="middle">2</text>
  <text class="n" x="70" y="123.0">必要性と課題</text>
  <text class="s" x="70" y="143.0">なぜ必要か、何が課題か</text>
  <path class="a" d="M200.0,162L200.0,174" marker-end="url(#ah)"/>
  <rect class="b" x="20" y="176" width="360" height="66" rx="8"/>
  <circle cx="46" cy="209.0" r="12" fill="#fff" stroke="#2e6da4" stroke-width="1.5"/>
  <text class="t" x="46" y="214.0" text-anchor="middle">3</text>
  <text class="n" x="70" y="205.0">複数の案</text>
  <text class="s" x="70" y="225.0">目的を達成できる案を並べる</text>
  <path class="a" d="M200.0,244L200.0,256" marker-end="url(#ah)"/>
  <rect class="b" x="20" y="258" width="360" height="66" rx="8"/>
  <circle cx="46" cy="291.0" r="12" fill="#fff" stroke="#2e6da4" stroke-width="1.5"/>
  <text class="t" x="46" y="296.0" text-anchor="middle">4</text>
  <text class="n" x="70" y="287.0">比較</text>
  <text class="s" x="70" y="307.0">図と数値で客観的に</text>
  <path class="a" d="M200.0,326L200.0,338" marker-end="url(#ah)"/>
  <rect class="w" x="20" y="340" width="360" height="66" rx="8"/>
  <circle cx="46" cy="373.0" r="12" fill="#fff" stroke="#2e6da4" stroke-width="1.5"/>
