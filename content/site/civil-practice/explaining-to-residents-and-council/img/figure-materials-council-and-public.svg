<!-- authored 2026-10-15 doboku-note 自作。資料の種類と根拠は地方自治法第96条・第179条・第180条・第211条・第233条、入札契約適正化法第7条・第8条による。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="市町村が議会に出す資料と、住民に公表する資料を二つの列に並べた対比図。議会には、契約の議案（第96条第1項第5号）、予算と説明書（第211条）、決算と成果説明書類（第233条）、専決処分の報告（第179条・第180条）を出す。住民には、発注の見通しと入札契約の結果（入札契約適正化法第7条・第8条）と決算の要領を公表する。">
