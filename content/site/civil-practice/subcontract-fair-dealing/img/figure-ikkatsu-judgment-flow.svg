<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="一括下請負かどうかを判断する順番。契約1件ごとに、他社に出した範囲、元請の実質的関与を確かめる。どちらも当たらなければ該当しない。該当すれば出す側も受ける側も禁止で、例外は公共工事なし、共同住宅の新築は承諾でも不可、その他の民間工事は発注者の事前の書面承諾。例外が使えれば違反でなく、使えなければ禁止で原則営業停止" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
<defs>
<style>
  text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 12px; fill: #222; }
  .t { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
  .s { font-size: 11px; fill: #555; }
  .sb { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
  .box-brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
  .box-positive { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
  .box-warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
  .box-danger { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
  .box-surface { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
  .arr { stroke: #555; stroke-width: 1.5; fill: none; }
</style>
<marker id="a" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#555"/></marker>
</defs>
<rect width="400" height="500" fill="#ffffff"/>
<rect class="box-brand" x="14" y="14" width="240" height="52" rx="8"/>
<text class="t" x="26" y="36">1　見る単位</text>
<text class="s" x="26" y="54">請負契約1件ごとに判断する</text>
<rect class="box-warn" x="14" y="84" width="240" height="62" rx="8"/>
<text class="t" x="26" y="106">2　他社に出した範囲</text>
<text class="s" x="26" y="124">全部、主たる部分、独立して</text>
<text class="s" x="26" y="138">機能する部分か</text>
<rect class="box-warn" x="14" y="164" width="240" height="62" rx="8"/>
<text class="t" x="26" y="186">3　元請の関与</text>
<text class="s" x="26" y="204">計画・工程・品質・安全・</text>
<text class="s" x="26" y="218">技術指導を自ら行うか</text>
<rect class="box-danger" x="14" y="244" width="240" height="62" rx="8"/>
<text class="t" x="26" y="266">一括下請負に当たる</text>
<text class="s" x="26" y="284">出す側と受ける側の、両方が禁止される</text>
<rect class="box-surface" x="14" y="324" width="240" height="76" rx="8"/>
<text class="t" x="26" y="346">4　例外が使えるか</text>
<text class="s" x="26" y="364">公共工事は、例外なし</text>
<text class="s" x="26" y="378">共同住宅の新築は、承諾しても不可</text>
<text class="s" x="26" y="392">その他の民間は、発注者の事前の書面承諾</text>
<line class="arr" x1="110" y1="66" x2="110" y2="82" marker-end="url(#a)"/>
<line class="arr" x1="110" y1="146" x2="110" y2="162" marker-end="url(#a)"/>
<line class="arr" x1="110" y1="226" x2="110" y2="242" marker-end="url(#a)"/>
<line class="arr" x1="110" y1="306" x2="110" y2="322" marker-end="url(#a)"/>
<line class="arr" x1="110" y1="400" x2="110" y2="414" marker-end="url(#a)"/>
<line class="arr" x1="254" y1="115" x2="270" y2="115" marker-end="url(#a)"/>
<rect class="box-positive" x="272" y="94" width="114" height="44" rx="6"/>
<text class="sb" x="329" y="113" text-anchor="middle">該当しない</text>
<text class="s" x="329" y="128" text-anchor="middle">どちらでもなければ</text>
<line class="arr" x1="254" y1="195" x2="270" y2="195" marker-end="url(#a)"/>
<rect class="box-positive" x="272" y="174" width="114" height="44" rx="6"/>
<text class="sb" x="329" y="193" text-anchor="middle">該当しない</text>
<text class="s" x="329" y="208" text-anchor="middle">自ら行っていれば</text>
<rect class="box-positive" x="14" y="416" width="180" height="52" rx="8"/>
<text class="sb" x="104" y="438" text-anchor="middle">例外が使える</text>
<text class="s" x="104" y="456" text-anchor="middle">違反ではない</text>
<rect class="box-danger" x="206" y="416" width="180" height="52" rx="8"/>
<text class="sb" x="296" y="438" text-anchor="middle">例外が使えない</text>
<text class="s" x="296" y="456" text-anchor="middle">禁止・原則として営業停止</text>
<text class="t" x="14" y="490" style="font-size:12px;fill:#222">承諾を得ても、技術者の配置は省けない</text>
</svg>
