<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="完成の通知から引渡し・支払までの時間軸。完成の通知を受けた日から20日以内に検査を終え、検査後に下請が申し出たら直ちに引渡しを受ける。引渡しの申出の日から50日以内が支払期日で、これは特定建設業者が注文者のとき。引渡しの特約があればその日が引渡しの日になる" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
<defs>
<style>
  text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 12px; fill: #222; }
  .t { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
  .s { font-size: 11px; fill: #555; }
  .sb { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
  .box-brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
  .box-positive { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
  .box-warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
  .box-danger { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
  .box-surface { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
  .arr { stroke: #555; stroke-width: 1.5; fill: none; }
</style>
<marker id="a" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#555"/></marker>
</defs>
<rect width="400" height="500" fill="#ffffff"/>
<text class="t" x="14" y="40">完成の通知から、支払期日までの順</text>
<text class="s" x="14" y="58">日数は、図の長さに比例しない</text>
<path d="M20,108H386" stroke="#8a8a8a" stroke-width="2" fill="none" marker-end="url(#a)"/>
<g fill="#2e6da4" stroke="#fff" stroke-width="2">
<circle cx="40" cy="108" r="7"/><circle cx="125" cy="108" r="7"/><circle cx="235" cy="108" r="7"/><circle cx="355" cy="108" r="7"/>
</g>
<text class="sb" x="40" y="88" text-anchor="middle" style="font-size:12px">完成の通知</text>
<text class="sb" x="125" y="88" text-anchor="middle" style="font-size:12px">検査を終える</text>
<text class="sb" x="235" y="88" text-anchor="middle" style="font-size:12px">引渡しの申出</text>
<text class="sb" x="355" y="88" text-anchor="middle" style="font-size:12px">支払期日</text>
<rect class="box-brand" x="40" y="124" width="85" height="26" rx="5"/>
<text class="sb" x="82" y="142" text-anchor="middle">20日以内</text>
<rect class="box-warn" x="235" y="124" width="120" height="26" rx="5"/>
<text class="sb" x="295" y="142" text-anchor="middle">50日以内</text>
<text class="s" x="82" y="170" text-anchor="middle">通知を受けた日から</text>
<text class="s" x="82" y="184" text-anchor="middle">できる限り短く</text>
<text class="s" x="295" y="170" text-anchor="middle">特定建設業者が注文者のとき</text>
<text class="s" x="295" y="184" text-anchor="middle">（下請が特定建設業者等なら除く）</text>
<text class="s" x="180" y="142" text-anchor="middle">直ちに引渡し</text>
<rect class="box-warn" x="14" y="214" width="372" height="104" rx="8"/>
<text class="t" x="26" y="238">引渡しの特約</text>
<text x="26" y="260">完成の時期から20日を経過した日</text>
<text x="26" y="280">以前の一定の日に引き渡す特約があれば、</text>
<text x="26" y="300">その日が引渡しの日になる</text>
<rect class="box-brand" x="14" y="334" width="372" height="112" rx="8"/>
<text class="t" x="26" y="358">通知は、書面で残す</text>
<text x="26" y="380">完成の通知・検査結果の通知・</text>
<text x="26" y="400">引渡しの申出は、標準下請契約約款で</text>
<text x="26" y="420">書面とされている（第27条）</text>
<text class="t" x="14" y="476" style="font-size:12px;fill:#222">引渡しを受けた年月日は、帳簿に記載する</text>
</svg>
