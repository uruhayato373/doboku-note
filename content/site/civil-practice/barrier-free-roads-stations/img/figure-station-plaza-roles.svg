  <rect class="w" x="250" y="296" width="134" height="48" rx="8"/>
  <text class="s" x="317.0" y="316.5" text-anchor="middle">信号機・横断歩道の標示</text>
  <text class="s" x="317.0" y="331.5" text-anchor="middle">（公安委員会）</text>
  <path d="M64,78V258" fill="none" stroke="#d4a017" stroke-width="5" stroke-dasharray="7 4"/>
  <path d="M64,262V356" fill="none" stroke="#b22234" stroke-width="2" stroke-dasharray="3 3"/>
  <text class="s" x="76" y="196" text-anchor="start">誘導用ブロック</text>
  <text class="s" x="110" y="326" text-anchor="start">エスコートゾーン中心線</text>
  <circle cx="64" cy="92" r="10" fill="#f8d7da" stroke="#b22234" stroke-width="1.5"/>
  <text class="t" x="64" y="96" text-anchor="middle">1</text>
  <circle cx="272" cy="172" r="10" fill="#f8d7da" stroke="#b22234" stroke-width="1.5"/>
  <text class="t" x="272" y="176" text-anchor="middle">2</text>
  <circle cx="64" cy="254" r="10" fill="#f8d7da" stroke="#b22234" stroke-width="1.5"/>
  <text class="t" x="64" y="258" text-anchor="middle">3</text>
  <rect class="wh" x="10" y="372" width="380" height="118" rx="8"/>
  <text class="t" x="34" y="394" text-anchor="start">境ごとに、そろえる点</text>
  <text class="x" x="34" y="416" text-anchor="start">駅の出入口と歩道の境：段差を出さない</text>
  <circle cx="22" cy="412" r="10" fill="#f8d7da" stroke="#b22234" stroke-width="1.5"/>
  <text class="t" x="22" y="416" text-anchor="middle">1</text>
  <text class="x" x="34" y="442" text-anchor="start">歩道とバス乗降場の境：段差を出さない</text>
  <circle cx="22" cy="438" r="10" fill="#f8d7da" stroke="#b22234" stroke-width="1.5"/>
  <text class="t" x="22" y="442" text-anchor="middle">2</text>
  <text class="x" x="34" y="468" text-anchor="start">横断歩道への接続：ブロックの線形と</text>
  <text class="x" x="34" y="484" text-anchor="start">エスコートゾーンの中心線をそろえる</text>
  <circle cx="22" cy="464" r="10" fill="#f8d7da" stroke="#b22234" stroke-width="1.5"/>
  <text class="t" x="22" y="468" text-anchor="middle">3</text>
</svg>
