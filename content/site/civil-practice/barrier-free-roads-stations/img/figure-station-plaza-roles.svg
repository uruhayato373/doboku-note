  <text class="s" x="283" y="146" text-anchor="start">道路管理者</text>
  <rect class="g" x="10" y="258" width="380" height="100" rx="0"/>
  <text class="s" x="330" y="276" text-anchor="start">車道</text>
  <rect x="30" y="266" width="68" height="10" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
