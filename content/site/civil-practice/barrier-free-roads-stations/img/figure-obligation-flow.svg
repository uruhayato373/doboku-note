<!-- authored 2026-10-16 doboku-note 自作。論点はバリアフリー法第10条第1項・第3項・第4項と施行令第2条の、特定道路の義務の分岐と基準の置き場。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="路線に義務がかかるかを判断する流れ図。特定道路か、新設・改築か既存かで分岐する。新設・改築は基準に適合させる義務、新設した特定道路は適合の維持、既存は努力義務。基準は国道が省令、それ以外は管理者の条例。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 12px; fill: #555; }
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .x { font-size: 12px; fill: #222; }
      .s { font-size: 11px; fill: #555; }
      .sb { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .p { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .d { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .g { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .wh { fill: #fff; stroke: #8a8a8a; stroke-width: 1.5; }
      .dz { fill: #fff; stroke: #2e6da4; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .l { stroke: #d7d7d7; stroke-width: 1; fill: none; }
      .ln { stroke: #8a8a8a; stroke-width: 1; fill: none; }
      .ld { stroke: #8a8a8a; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
      .a { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .ar { stroke: #b22234; stroke-width: 2; fill: none; }
      .ag { stroke: #3a7d44; stroke-width: 2; fill: none; }
      .ax { stroke: #8a8a8a; stroke-width: 2; fill: none; }
    </style>
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
    <marker id="ahr" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#b22234"/></marker>
    <marker id="ahg" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#3a7d44"/></marker>
    <marker id="ahk" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#8a8a8a"/></marker>
  </defs>
  <rect class="b" x="10" y="10" width="380" height="56" rx="8"/>
  <text class="t" x="200.0" y="33.0" text-anchor="middle">その路線は特定道路か</text>
  <text class="s" x="200.0" y="51.0" text-anchor="middle">国土交通大臣が路線と区間を指定（施行令第2条）</text>
  <path class="a" d="M100,66V92" marker-end="url(#ah)"/>
  <path class="a" d="M290,66V92" marker-end="url(#ah)"/>
  <text class="sb" x="108" y="84" text-anchor="start">いいえ</text>
  <text class="sb" x="298" y="84" text-anchor="start">はい</text>
  <rect class="g" x="10" y="94" width="180" height="68" rx="8"/>
  <text class="t" x="100.0" y="123.0" text-anchor="middle">適合の義務はない</text>
  <text class="s" x="100.0" y="141.0" text-anchor="middle">努力義務にとどまる</text>
  <rect class="b" x="200" y="94" width="190" height="68" rx="8"/>
  <text class="t" x="295.0" y="123.0" text-anchor="middle">新設・改築か、</text>
  <text class="t" x="295.0" y="141.0" text-anchor="middle">既存の道路か</text>
  <path class="a" d="M295,162V180" marker-end="url(#ah)"/>
  <rect class="d" x="200" y="182" width="190" height="62" rx="8"/>
  <text class="t" x="295.0" y="208.0" text-anchor="middle">新設・改築</text>
  <text class="s" x="295.0" y="226.0" text-anchor="middle">基準に適合させる義務（第1項）</text>
  <rect class="w" x="200" y="252" width="190" height="62" rx="8"/>
  <text class="t" x="295.0" y="278.0" text-anchor="middle">新設した特定道路</text>
  <text class="s" x="295.0" y="296.0" text-anchor="middle">適合した状態を維持する（第3項）</text>
  <rect class="p" x="200" y="322" width="190" height="62" rx="8"/>
  <text class="t" x="295.0" y="340.0" text-anchor="middle">既存の道路</text>
  <text class="s" x="295.0" y="357.0" text-anchor="middle">適合させる措置を講ずる</text>
  <text class="s" x="295.0" y="374.0" text-anchor="middle">努力義務（第4項）</text>
  <rect class="g" x="10" y="182" width="180" height="202" rx="8"/>
  <text class="t" x="100" y="206" text-anchor="middle">基準はどこにあるか</text>
  <rect class="wh" x="20" y="218" width="160" height="62" rx="8"/>
  <text class="t" x="100.0" y="244.0" text-anchor="middle">国道</text>
  <text class="x" x="100.0" y="262.0" text-anchor="middle">国土交通省令</text>
  <rect class="wh" x="20" y="290" width="160" height="84" rx="8"/>
  <text class="t" x="100.0" y="318.0" text-anchor="middle">それ以外の道路</text>
  <text class="x" x="100.0" y="336.0" text-anchor="middle">管理者の条例</text>
  <text class="s" x="100.0" y="354.0" text-anchor="middle">（省令を参酌して定める）</text>
  <rect class="w" x="10" y="396" width="380" height="52" rx="8"/>
  <text class="s" x="200.0" y="417.0" text-anchor="middle">参酌なので、自治体ごとに数値が異なる場合がある</text>
  <text class="s" x="200.0" y="435.0" text-anchor="middle">市町村道は、まず自団体の条例を開く</text>
</svg>
