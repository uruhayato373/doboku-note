      .tb { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .tx { font-size: 12px; fill: #222; }
      .ts { font-size: 11px; fill: #555; }
      .tn { font-size: 13px; font-weight: bold; fill: #222; }
      .b-brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .b-pos { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .b-warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .b-dan { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .b-sur { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .b-wh { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1.5; }
      .a { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .ln { stroke: #8a8a8a; stroke-width: 1; fill: none; }
      .ld { stroke: #8a8a8a; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    </style>
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  </defs>
  <rect class="b-brand" x="10" y="10" width="172" height="78" rx="6"/>
  <text class="tb" x="96.0" y="37.1" text-anchor="middle">移動等円滑化促進方針</text>
  <text class="tx" x="96.0" y="53.9" text-anchor="middle">促進地区のマスタープラン</text>
  <text class="ts" x="96.0" y="69.6" text-anchor="middle">第24条の2・努力義務</text>
  <rect class="b-brand" x="198" y="10" width="174" height="78" rx="6"/>
  <text class="tb" x="285.0" y="37.1" text-anchor="middle">基本構想</text>
  <text class="tx" x="285.0" y="53.9" text-anchor="middle">重点整備地区</text>
  <text class="ts" x="285.0" y="69.6" text-anchor="middle">第25条・努力義務</text>
  <line class="a" x1="96" y1="88" x2="96" y2="104" marker-end="url(#ah)"/>
  <line class="a" x1="285" y1="88" x2="285" y2="104" marker-end="url(#ah)"/>
  <rect class="b-sur" x="10" y="104" width="172" height="104" rx="6"/>
  <text class="tx" x="96.0" y="135.7" text-anchor="middle">促進地区で道路を</text>
  <text class="tx" x="96.0" y="152.5" text-anchor="middle">新設・改築・修繕するとき</text>
  <text class="tx" x="96.0" y="169.3" text-anchor="middle">着手の30日前までに</text>
  <text class="ts" x="96.0" y="185.0" text-anchor="middle">市町村へ届出（第24条の6）</text>
  <rect class="b-wh" x="198" y="104" width="174" height="104" rx="6"/>
  <text class="tb" x="285.0" y="127.3" text-anchor="middle">基本構想に定める事項</text>
  <text class="tx" x="285.0" y="144.1" text-anchor="middle">生活関連施設と</text>
  <text class="tx" x="285.0" y="160.9" text-anchor="middle">生活関連経路</text>
  <text class="tx" x="285.0" y="177.7" text-anchor="middle">特定事業</text>
  <text class="ts" x="285.0" y="193.5" text-anchor="middle">（第25条第2項）</text>
