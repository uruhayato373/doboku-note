<!-- authored 2026-10-16 doboku-note 自作。論点はバリアフリー法の促進方針・基本構想・道路特定事業計画の関係と、おおむね5年ごとの評価 -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="市町村が面で作るバリアフリーの計画の階層と流れを示した図。移動等円滑化促進方針と基本構想は市町村が作る。基本構想に生活関連経路と特定事業を定め、道路管理者が道路特定事業計画、公安委員会が交通安全特定事業計画を作って事業を実施し、おおむね5年ごとに評価して基本構想を見直す。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 12px; fill: #222; }
