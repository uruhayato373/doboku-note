  <text class="tx" x="96.0" y="275.9" text-anchor="middle">道路管理者が作る</text>
  <text class="ts" x="96.0" y="291.7" text-anchor="middle">第31条</text>
  <rect class="b-pos" x="198" y="236" width="174" height="70" rx="6"/>
  <text class="tb" x="285.0" y="259.1" text-anchor="middle">交通安全特定事業計画</text>
  <text class="tx" x="285.0" y="275.9" text-anchor="middle">公安委員会が作る</text>
  <text class="ts" x="285.0" y="291.7" text-anchor="middle">第36条</text>
  <line class="a" x1="96" y1="306" x2="96" y2="330" marker-end="url(#ah)"/>
  <line class="a" x1="285" y1="306" x2="285" y2="330" marker-end="url(#ah)"/>
  <rect class="b-pos" x="10" y="330" width="362" height="56" rx="6"/>
  <text class="tb" x="191.0" y="354.5" text-anchor="middle">事業の実施</text>
  <text class="ts" x="191.0" y="370.3" text-anchor="middle">歩道の工事と信号の工事は別の計画で動く</text>
  <line class="a" x1="191" y1="386" x2="191" y2="410" marker-end="url(#ah)"/>
  <rect class="b-warn" x="10" y="410" width="362" height="70" rx="6"/>
  <text class="tb" x="191.0" y="433.8" text-anchor="middle">おおむね5年ごとに評価</text>
  <text class="ts" x="191.0" y="449.6" text-anchor="middle">実施状況を調査・分析・評価し、</text>
  <text class="ts" x="191.0" y="464.9" text-anchor="middle">必要があれば基本構想を変更（第25条の2）</text>
  <path class="a" d="M372 445 H388 V49 H376" marker-end="url(#ah)"/>
