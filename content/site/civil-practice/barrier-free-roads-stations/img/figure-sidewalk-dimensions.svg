<!-- authored 2026-10-16 doboku-note 自作。数値は道路移動等円滑化基準と道路構造令第11条第3項の本文記載どおり。断面は高さを強調した略図で、縁石と歩道の取り合いは示さない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="歩道の断面の寸法図。有効幅員は歩行者の交通量が多い道路で3.5m以上、その他は2m以上。歩道等の高さは縁石を除き5cmを標準とする。横断勾配は1%以下。縁石の高さは車道等に対し15cm以上で別に示す。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 12px; fill: #555; }
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .x { font-size: 12px; fill: #222; }
      .s { font-size: 11px; fill: #555; }
      .sb { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .p { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .d { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .g { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .wh { fill: #fff; stroke: #8a8a8a; stroke-width: 1.5; }
      .dz { fill: #fff; stroke: #2e6da4; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .l { stroke: #d7d7d7; stroke-width: 1; fill: none; }
      .ln { stroke: #8a8a8a; stroke-width: 1; fill: none; }
      .ld { stroke: #8a8a8a; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
      .a { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .ar { stroke: #b22234; stroke-width: 2; fill: none; }
      .ag { stroke: #3a7d44; stroke-width: 2; fill: none; }
      .ax { stroke: #8a8a8a; stroke-width: 2; fill: none; }
    </style>
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
    <marker id="ahr" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#b22234"/></marker>
    <marker id="ahg" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#3a7d44"/></marker>
    <marker id="ahk" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#8a8a8a"/></marker>
  </defs>
  <rect class="wh" x="10" y="10" width="380" height="206" rx="8"/>
  <text class="s" x="18" y="27" text-anchor="start">断面（縁石は別の行の寸法）</text>
  <text class="t" x="237" y="44" text-anchor="middle">有効幅員（第4条）</text>
  <text class="s" x="237" y="58" text-anchor="middle">3.5m以上：歩行者の交通量が多い道路</text>
  <text class="s" x="237" y="71" text-anchor="middle">2m以上：その他</text>
  <path class="a" d="M237,84H112" marker-end="url(#ah)"/>
  <path class="a" d="M237,84H366" marker-end="url(#ah)"/>
  <path class="ld" d="M108,78V140"/>
  <path class="ld" d="M370,78V140"/>
  <rect class="g" x="14" y="155" width="94" height="61" rx="0"/>
  <rect class="b" x="108" y="140" width="262" height="76" rx="0"/>
  <text class="t" x="60" y="190" text-anchor="middle">車道</text>
  <text class="t" x="239" y="170" text-anchor="middle">歩道</text>
  <text class="s" x="239" y="190" text-anchor="middle">横断勾配 1%以下（やむを得ない場合2%）</text>
  <path class="ld" d="M60,155H160"/>
  <path class="a" d="M150,140V155"/>
  <path class="ln" d="M145,140H155"/>
  <path class="ln" d="M150,128V140"/>
  <text class="s" x="116" y="124" text-anchor="start">歩道等の高さ 5cm標準（縁石を除く・第8条）</text>
  <rect class="wh" x="10" y="228" width="380" height="112" rx="8"/>
  <text class="s" x="18" y="245" text-anchor="start">縁石の高さ（第7条）</text>
  <rect class="g" x="20" y="296" width="140" height="24" rx="0"/>
  <rect class="g" x="160" y="268" width="28" height="52" rx="0"/>
  <text class="t" x="90" y="312" text-anchor="middle">車道等</text>
  <text class="s" x="174" y="294" text-anchor="middle">縁石</text>
  <path class="a" d="M210,268V296" marker-end="url(#ahk)"/>
  <path class="ln" d="M190,268H214"/>
  <path class="ln" d="M190,296H214"/>
  <text class="t" x="222" y="276" text-anchor="start">15cm以上</text>
  <text class="s" x="222" y="292" text-anchor="start">車道等に対し</text>
  <text class="s" x="222" y="306" text-anchor="start">乗入れ部・横断歩道</text>
  <text class="s" x="222" y="320" text-anchor="start">接続部を除く</text>
  <rect class="w" x="10" y="350" width="380" height="44" rx="8"/>
  <text class="s" x="200.0" y="376.0" text-anchor="middle">やむを得ない場合：縦断勾配8%以下、横断勾配2%以下（第6条）</text>
  <rect class="d" x="10" y="402" width="380" height="44" rx="8"/>
  <text class="s" x="200.0" y="428.0" text-anchor="middle">経過措置（当分の間）：有効幅員を1.5m・1mまで縮小できる</text>
  <rect class="g" x="10" y="454" width="380" height="36" rx="8"/>
  <text class="s" x="200.0" y="476.0" text-anchor="middle">数値は国の省令の値。市町村道は自団体の条例で差を読む</text>
</svg>
