<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
     style="max-width:400px;width:100%"
     role="img"
     aria-label="埋設管に働く浮力3.77 kN/mと管の自重2.45 kN/mを比べ、差し引き約1.3 kN/mが上向きに残ることを示す図。地下水位以下で土被りが薄い状態を断面で描く">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-title { font-size: 13px; font-weight: bold; fill: #222; }
      .t-label { font-size: 12px; fill: #555; }
      .t-num   { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .box-brand   { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-surface { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-danger  { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
    </style>
    <marker id="arrow-up" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 9,4 0,8" fill="#2e6da4"/>
    </marker>
    <marker id="arrow-down" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 9,4 0,8" fill="#555"/>
    </marker>
  </defs>

  <!-- 地盤断面（埋戻し直後・土被りが薄い） -->
  <rect class="box-surface" x="20" y="14" width="360" height="200" rx="4"/>
  <path d="M20,44 H380" fill="none" stroke="#2e6da4" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="t-label" x="374" y="38" text-anchor="end">地下水位</text>
  <text class="t-label" x="30" y="66">土被りはまだ薄い</text>

  <!-- 管 -->
  <circle cx="200" cy="130" r="48" fill="#e8f0fe" stroke="#2e6da4" stroke-width="2"/>
  <circle cx="200" cy="130" r="30" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
  <text class="t-label" x="200" y="134" text-anchor="middle">管</text>

  <!-- 押さえる力（下向き） -->
  <line x1="165" y1="56" x2="165" y2="94" stroke="#555" stroke-width="2" marker-end="url(#arrow-down)"/>
  <line x1="235" y1="56" x2="235" y2="94" stroke="#555" stroke-width="2" marker-end="url(#arrow-down)"/>
  <text class="t-label" x="30" y="100">押さえる力：</text>
  <text class="t-label" x="30" y="116">自重＋埋戻し土</text>
  <text class="t-label" x="30" y="132">＋摩擦抵抗</text>

  <!-- 浮力（上向き） -->
  <line x1="200" y1="210" x2="200" y2="182" stroke="#2e6da4" stroke-width="2.5" marker-end="url(#arrow-up)"/>
  <text class="t-num" x="212" y="200" fill="#2e6da4">浮力 F<tspan dy="3" font-size="11">b</tspan><tspan dy="-3"> = γ</tspan><tspan dy="3" font-size="11">w</tspan><tspan dy="-3"> × V</tspan></text>

  <!-- 釣合い（kN/m） -->
  <text class="t-title" x="20" y="240">1mあたりの釣合い（kN）</text>
  <rect class="box-brand" x="20" y="250" width="300" height="26"/>
  <text class="t-num" x="30" y="268">浮力 3.77</text>
  <rect class="box-surface" x="20" y="284" width="195" height="26"/>
  <text class="t-num" x="30" y="302">管の自重 2.45</text>
  <rect class="box-danger" x="215" y="284" width="105" height="26" stroke-dasharray="4 3"/>
  <text class="t-num" x="267" y="302" text-anchor="middle">差 約1.3</text>
  <text class="t-title" x="20" y="334" fill="#b22234">差し引き約1.3 kN/mが上向きに残る</text>
  <text class="t-label" x="20" y="352">埋戻し土がまだ載らない間は、この差が管を持ち上げる</text>

  <rect class="box-brand" x="20" y="366" width="360" height="86" rx="8"/>
  <text class="t-label" x="34" y="388">外径0.70m・内径0.60mのコンクリート管（1mあたり）</text>
  <text class="t-label" x="34" y="408">浮力　9.8 × 0.385 ≈ 3.77 kN</text>
  <text class="t-label" x="34" y="428">自重　24 × 0.102 ≈ 2.45 kN</text>
  <text class="t-label" x="34" y="446">（コンクリートは24 kN/m³と仮定）</text>

  <text class="t-label" x="200" y="478" text-anchor="middle">設計では、安全率1.1〜1.2程度を見込む</text>
</svg>
