<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="着工直後の確認の順。測量の結果と設計図書の差、仮BMと引照点、用地の範囲、他機関の届出の四つを上から順に確かめる流れ">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #222; }
      .t-text { font-size: 13px; fill: #555; }
      .t-label { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .t-sum { font-size: 13px; fill: #1a3a5c; }
      .box-brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-positive { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .arrow { stroke: #2e6da4; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/>
    </marker>
  </defs>
  <rect class="box-brand" x="20" y="20" width="360" height="84" rx="8"/>
  <text class="t-label" x="36" y="42">STEP 1</text>
  <text class="t-title" x="36" y="66">測量の結果と設計図書の差</text>
  <text class="t-text" x="36" y="89">差があれば、速やかに提出させて指示する</text>
  <line class="arrow" x1="200" y1="104" x2="200" y2="132" marker-end="url(#arrow)"/>
  <rect class="box-brand" x="20" y="134" width="360" height="84" rx="8"/>
  <text class="t-label" x="36" y="156">STEP 2</text>
  <text class="t-title" x="36" y="180">仮BMと引照点</text>
  <text class="t-text" x="36" y="203">動いていないか。動いたら連絡と復元</text>
  <line class="arrow" x1="200" y1="218" x2="200" y2="246" marker-end="url(#arrow)"/>
  <rect class="box-brand" x="20" y="248" width="360" height="84" rx="8"/>
  <text class="t-label" x="36" y="270">STEP 3</text>
  <text class="t-title" x="36" y="294">用地の範囲</text>
  <text class="t-text" x="36" y="317">提供した範囲と、使い道を確かめる</text>
  <line class="arrow" x1="200" y1="332" x2="200" y2="360" marker-end="url(#arrow)"/>
  <rect class="box-brand" x="20" y="362" width="360" height="84" rx="8"/>
  <text class="t-label" x="36" y="384">STEP 4</text>
  <text class="t-title" x="36" y="408">他機関への届出</text>
  <text class="t-text" x="36" y="431">許可の書面を見せてもらい、条件を知る</text>
  <rect class="box-positive" x="20" y="458" width="360" height="30" rx="6"/>
  <text class="t-sum" x="200" y="478" text-anchor="middle">四つとも受注者が行い、監督職員が確かめる</text>
</svg>
