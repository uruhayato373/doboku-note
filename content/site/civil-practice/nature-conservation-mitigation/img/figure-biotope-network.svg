<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="市街地のビオトープを、周囲から孤立させた配置と、緑道や水路で公園・川につないだ配置とで比べた平面の概念図" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
  <rect x="0" y="0" width="400" height="500" fill="#ffffff"/>

  <!-- パネル（上端 y=16） -->
  <rect x="20" y="16" width="360" height="226" rx="6" fill="#ffffff" stroke="#b22234" stroke-width="1.5"/>
  <circle cx="40" cy="40" r="10" fill="#f8d7da" stroke="#b22234" stroke-width="1.5"/>
  <text x="40" y="44" font-size="12" font-weight="700" fill="#222" text-anchor="middle">×</text>
  <text x="58" y="45" font-size="14" font-weight="700" fill="#1a3a5c">孤立した配置</text>
  <text x="196" y="45" font-size="12" fill="#555">周りから切れ、行き来できない</text>
  <rect x="28" y="60" width="344" height="170" rx="4" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <!-- 川 -->
  <rect x="336" y="60" width="36" height="170" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="354" y="150" font-size="11" fill="#222" text-anchor="middle">川</text>
  <!-- 公園・緑地 -->
  <rect x="40" y="70" width="92" height="56" rx="6" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
  <text x="86" y="102" font-size="11" fill="#222" text-anchor="middle">公園・緑地</text>
  <!-- 建物 -->
  <rect x="148" y="70" width="62" height="36" rx="3" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <rect x="222" y="70" width="62" height="36" rx="3" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <rect x="40" y="142" width="76" height="34" rx="3" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <rect x="240" y="120" width="70" height="32" rx="3" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <text x="179" y="92" font-size="11" fill="#555" text-anchor="middle">建物</text>
  <text x="78" y="163" font-size="11" fill="#555" text-anchor="middle">建物</text>
  <rect x="60" y="192" width="100" height="28" rx="3" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <rect x="230" y="194" width="80" height="26" rx="3" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <!-- ビオトープ（池） -->
  <ellipse cx="186" cy="156" rx="42" ry="22" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="186" y="160" font-size="11" fill="#222" text-anchor="middle">ビオトープ</text>

  <!-- パネル（上端 y=254） -->
  <rect x="20" y="254" width="360" height="226" rx="6" fill="#ffffff" stroke="#3a7d44" stroke-width="1.5"/>
  <circle cx="40" cy="278" r="10" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
  <text x="40" y="282" font-size="12" font-weight="700" fill="#222" text-anchor="middle">○</text>
  <text x="58" y="283" font-size="14" font-weight="700" fill="#1a3a5c">つないだ配置</text>
  <text x="196" y="283" font-size="12" fill="#555">緑道・水路で公園や川とつなぐ</text>
  <rect x="28" y="298" width="344" height="170" rx="4" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <!-- 川 -->
  <rect x="336" y="298" width="36" height="170" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="354" y="388" font-size="11" fill="#222" text-anchor="middle">川</text>
  <!-- 公園・緑地 -->
  <rect x="40" y="308" width="92" height="56" rx="6" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
  <text x="86" y="340" font-size="11" fill="#222" text-anchor="middle">公園・緑地</text>
  <!-- 建物 -->
  <rect x="148" y="308" width="62" height="36" rx="3" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <rect x="222" y="308" width="62" height="36" rx="3" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <rect x="40" y="380" width="76" height="34" rx="3" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <rect x="240" y="358" width="70" height="32" rx="3" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <text x="179" y="330" font-size="11" fill="#555" text-anchor="middle">建物</text>
  <text x="78" y="401" font-size="11" fill="#555" text-anchor="middle">建物</text>
  <rect x="60" y="430" width="100" height="28" rx="3" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <rect x="230" y="432" width="80" height="26" rx="3" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <!-- 緑道・水路 -->
  <path d="M 146 394 L 130 394 L 130 366" fill="none" stroke="#3a7d44" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 226 402 L 236 412 L 334 412" fill="none" stroke="#3a7d44" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="246" y="405" font-size="11" fill="#222">緑道・水路</text>
  <!-- ビオトープ（池） -->
  <ellipse cx="186" cy="394" rx="42" ry="22" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="186" y="398" font-size="11" fill="#222" text-anchor="middle">ビオトープ</text>
</svg>
