<!-- authored 2026-10-15 doboku-note 自作。論点は海岸法第3条・第5条・第37条の3、港湾法第38条の2。海岸保全区域の幅は法の原則（50m）を模式化した図で縮尺は表さない。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="海岸保全区域は、陸地は満潮時の水際線から、水面は干潮時の水際線から、原則50mを超えない範囲を断面で示した模式図。あわせて区域ごとの管理者を並べる。海岸保全区域と一般公共海岸区域は海岸管理者で原則は知事、港湾区域・港湾隣接地域は港湾管理者、漁港区域は漁港管理者で、重なれば港・漁港の管理者が優先する。臨港地区は港湾管理者への届出の区域で、海岸の管理者を動かさない。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 12px; fill: #555; }  /* ink-body */
      .s { font-size: 11px; fill: #555; }
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .b { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .pn { fill: #fff; stroke: #d7d7d7; stroke-width: 1.5; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }  /* brand-fill / brand */
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }  /* warn-fill / warn */
      .sf { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; stroke-dasharray: 4 3; }  /* surface */
      .gd { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; }
      .wt { fill: #e8f0fe; stroke: none; }
      .lv { stroke: #2e6da4; stroke-width: 1; fill: none; stroke-dasharray: 4 3; }
      .gl { stroke: #8a8a8a; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
      .dm { stroke: #555; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="at" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="7" refX="1" refY="3.5" orient="auto-start-reverse"><polygon points="0,0 8,3.5 0,7" fill="#555"/></marker>
  </defs>
