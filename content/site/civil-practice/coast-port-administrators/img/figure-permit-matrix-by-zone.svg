<!-- authored 2026-10-15 doboku-note 自作。論点は海岸法第7条・第8条・第10条・第37条の4・第37条の5、港湾法第37条・第38条の2、漁港法第39条。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="区域ごとの許可の相手と根拠の条を、占用と、工作物・土石の採取・掘削などの行為で並べた表。海岸保全区域は海岸法第7条と第8条、一般公共海岸区域は第37条の4と第37条の5、港湾区域・港湾隣接地域は港湾法第37条、漁港区域は漁港法第39条。臨港地区は許可でなく港湾法第38条の2の届出。国・自治体は協議で足りる。港湾法の許可があれば、重なる範囲で海岸法の許可は要らない。">
