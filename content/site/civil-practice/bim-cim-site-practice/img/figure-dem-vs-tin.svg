<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="同じ法面を含む地形を、等間隔の格子と、折れ線に点を集めた三角網で表した比較。格子では法肩と法尻の線が近い格子点に寄って階段状になり、三角網は線に沿って辺が通る">
<defs><style>text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN","Hiragino Sans",sans-serif;font-size:12px;fill:#222}.h{font-size:13px;font-weight:bold}.s{font-size:11px;fill:#555}.sl{fill:#fff3cd}.g{stroke:#2e6da4;fill:none;stroke-width:1}.t{stroke:#3a7d44;fill:none;stroke-width:1}.e{stroke:#b22234;stroke-width:1.5;fill:none;stroke-dasharray:5 3}.r{stroke:#222;stroke-width:2.5;fill:none}</style></defs>
<rect width="400" height="500" fill="#fff"/>
<text class="h" x="20" y="24">格子（DEM）</text>
<rect x="20" y="36" width="360" height="150" fill="#f5f5f5" stroke="#d7d7d7"/>
<polygon class="sl" points="195,36 285,36 250,186 160,186"/>
<path class="g" d="M20 36V186M50 36V186M80 36V186M110 36V186M140 36V186M170 36V186M200 36V186M230 36V186M260 36V186M290 36V186M320 36V186M350 36V186M380 36V186M20 36H380M20 66H380M20 96H380M20 126H380M20 156H380M20 186H380"/>
<path class="e" d="M195 36L160 186M285 36L250 186"/>
<path class="r" d="M200 36V81H170V186M290 36V81H260V186"/>
<rect x="26" y="42" width="40" height="17" fill="#f5f5f5"/><text class="s" x="30" y="55">高い面</text>
<rect x="326" y="42" width="40" height="17" fill="#f5f5f5"/><text class="s" x="362" y="55" text-anchor="end">低い面</text>
<text class="s" x="20" y="206">等間隔の点。折れ線は近い格子点へ寄り、階段状になる</text>
<text class="h" x="20" y="238">三角網（TIN）</text>
