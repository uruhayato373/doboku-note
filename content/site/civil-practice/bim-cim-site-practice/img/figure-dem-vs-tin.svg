<text class="s" x="20" y="420">平らな所は大きく、折れ線のそばは細かい三角形になる</text>
<path class="e" d="M24 436H54"/><text class="s" x="62" y="440">法肩・法尻の折れ線</text>
<rect x="214" y="430" width="24" height="12" class="sl" stroke="#d4a017"/><text class="s" x="246" y="440">法面</text>
<path class="r" d="M24 452H54"/><text class="s" x="62" y="456">格子に寄せた線</text>
<rect x="20" y="464" width="360" height="30" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<text class="h" x="200" y="484" text-anchor="middle">差を取るなら格子、形を残すなら三角網</text>
</svg>