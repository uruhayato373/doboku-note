<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="新技術が登録され、事前審査、現場での活用、活用効果調査、事後評価を経て、評価情報が掲載され次の現場の選択材料になる流れを示した図" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
<defs>
<marker id="a" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#555"/></marker>
</defs>
<rect width="400" height="500" fill="#ffffff"/>
<g stroke-width="1.5">
<rect x="64" y="24" width="296" height="62" rx="6" fill="#e8f0fe" stroke="#2e6da4"/>
<rect x="64" y="114" width="296" height="62" rx="6" fill="#f5f5f5" stroke="#8a8a8a" stroke-dasharray="5 4"/>
<rect x="64" y="204" width="296" height="62" rx="6" fill="#d0e8d0" stroke="#3a7d44"/>
<rect x="64" y="294" width="296" height="62" rx="6" fill="#d0e8d0" stroke="#3a7d44"/>
<rect x="64" y="384" width="296" height="62" rx="6" fill="#e8f0fe" stroke="#2e6da4"/>
</g>
<g stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#a)">
<line x1="212" y1="86" x2="212" y2="112"/>
<line x1="212" y1="176" x2="212" y2="202"/>
<line x1="212" y1="266" x2="212" y2="292"/>
<line x1="212" y1="356" x2="212" y2="382"/>
<path d="M64 415 H30 V55 H62" stroke-dasharray="4 3"/>
</g>
<g fill="#1a3a5c" text-anchor="middle">
<g font-size="13" font-weight="700">
<text x="212" y="50">1 NETISへ登録</text>
<text x="212" y="140">2 事前審査（必要なとき）</text>
<text x="212" y="230">3 現場で活用</text>
<text x="212" y="320">4 活用効果調査</text>
<text x="212" y="410">5 事後評価と公表</text>
</g>
<g font-size="11" fill="#555">
<text x="212" y="70">技術開発者が申請し、窓口が確認する</text>
<text x="212" y="160">評価会議が成立性と妥当性を確かめる</text>
<text x="212" y="250">発注者の指定か、施工者の提案による</text>
<text x="212" y="340">発注事務所と施工者が従来技術と比べる</text>
<text x="212" y="430">評価会議が評価し、申請者へ通知する</text>
</g>
</g>
<text x="200" y="472" font-size="11" fill="#555" text-anchor="middle">評価情報がNETISに載り、次の現場の選択材料になる</text>
<text x="200" y="490" font-size="11" fill="#555" text-anchor="middle">点線は、改良や更新が1へ戻る流れ</text>
</svg>
