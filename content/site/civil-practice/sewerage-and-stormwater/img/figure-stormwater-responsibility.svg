<!-- authored 2026-10-15 doboku-note 自作。論点は下水道法第2条第3号・第3条、道路法、河川法、水防法第14条の2による汚水と雨水の担当の切り分け。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="汚水と雨水を、担当と根拠の法律で並べた関係図。汚水は下水道法に基づく公共下水道で、下水道管理者の市町村が担当する。雨水は、下水道管理者の雨水公共下水道、道路管理者が道路法で扱う道路の側溝、河川管理者が河川法で扱う放流先の河川、水防法で知事または市町村長が指定する雨水出水浸水想定区域に分かれる。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 11px; fill: #555; }
      .t { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .tb { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .s { font-size: 11px; fill: #555; }
      .k { font-size: 12px; fill: #222; }
      .b-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .b-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .b-p { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .b-d { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .b-g { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; }
      .b-x { fill: #fff; stroke: #8a8a8a; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .a { stroke: #2e6da4; stroke-width: 2.5; fill: none; }
      .l { stroke: #8a8a8a; stroke-width: 1.5; fill: none; }

    </style>
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  </defs>

  <rect class="b-w" x="120" y="12" width="130" height="38" rx="8"/>
  <text class="t" x="185" y="37" text-anchor="middle">汚水</text>
  <rect class="b-b" x="258" y="12" width="134" height="38" rx="8"/>
  <text class="t" x="325" y="37" text-anchor="middle">雨水</text>
  <rect class="b-g" x="8" y="62" width="104" height="88" rx="8"/>
  <text class="t" x="60" y="98" text-anchor="middle">下水道管理者</text>
  <text class="k" x="60" y="120" text-anchor="middle">下水道法</text>
  <rect class="b-w" x="120" y="62" width="130" height="88" rx="8"/>
  <text class="tb" x="185" y="91" text-anchor="middle">公共下水道（イ）</text>
  <text class="s" x="185" y="110" text-anchor="middle">市街地の下水を</text>
  <text class="s" x="185" y="129" text-anchor="middle">排除・処理する</text>
  <rect class="b-b" x="258" y="62" width="134" height="88" rx="8"/>
  <text class="tb" x="325" y="91" text-anchor="middle">雨水公共下水道（ロ）</text>
  <text class="s" x="325" y="110" text-anchor="middle">市街地の雨水のみを</text>
  <text class="s" x="325" y="129" text-anchor="middle">排除する</text>
  <rect class="b-g" x="8" y="162" width="104" height="88" rx="8"/>
  <text class="t" x="60" y="198" text-anchor="middle">道路管理者</text>
  <text class="k" x="60" y="220" text-anchor="middle">道路法</text>
  <path d="M130,206H240" stroke="#d7d7d7" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
  <rect class="b-b" x="258" y="162" width="134" height="88" rx="8"/>
  <text class="t" x="325" y="210" text-anchor="middle">道路の側溝</text>
  <rect class="b-g" x="8" y="262" width="104" height="88" rx="8"/>
  <text class="t" x="60" y="298" text-anchor="middle">河川管理者</text>
  <text class="k" x="60" y="320" text-anchor="middle">河川法</text>
  <path d="M130,306H240" stroke="#d7d7d7" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
  <rect class="b-b" x="258" y="262" width="134" height="88" rx="8"/>
  <text class="tb" x="325" y="300.5" text-anchor="middle">放流先の河川</text>
  <text class="s" x="325" y="319.5" text-anchor="middle">下水道から放流する</text>
  <rect class="b-g" x="8" y="362" width="104" height="88" rx="8"/>
  <text class="t" x="60" y="398" text-anchor="middle">知事・市町村長</text>
  <text class="k" x="60" y="420" text-anchor="middle">水防法</text>
  <path d="M130,406H240" stroke="#d7d7d7" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
  <rect class="b-x" x="258" y="362" width="134" height="88" rx="8"/>
  <text class="tb" x="325" y="392" text-anchor="middle">雨水出水浸水</text>
  <text class="tb" x="325" y="410" text-anchor="middle">想定区域の指定</text>
  <text class="s" x="325" y="430" text-anchor="middle">施設でなく指定</text>
  <rect class="b-g" x="8" y="458" width="384" height="36" rx="8"/>
  <text class="tb" x="16" y="473">費用</text>
  <text class="s" x="52" y="473">汚水は使用料が基本、雨水は公費が原則</text>
  <text class="s" x="52" y="488">（雨水公費・汚水私費。総務省の整理）</text>
</svg>
