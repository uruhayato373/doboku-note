  <text class="t" x="14" y="348">長期</text>
  <rect class="b-w" x="64" y="326" width="248" height="32" rx="4"/>
  <text class="k" x="72" y="347">概ね20年後</text>
  <text class="tb" x="14" y="392">点検と見直しの周期</text>
  <rect class="b-b" x="10" y="404" width="170" height="52" rx="8"/>
