<!-- authored 2026-10-15 doboku-note 自作。論点は国土交通省 全国特別重点調査の結果公表（令和8年4月21日）と事務連絡の緊急度の区分と対策の期限。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="全国特別重点調査の流れ図。管径2m以上で平成6年度以前に設置された管路を調査し、緊急度ⅠとⅡに判定する。緊急度Ⅰは原則1年以内、緊急度Ⅱは応急措置のうえ5年以内が対策の期限。緊急度Ⅰの箇所は道路管理者と情報を共有する。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 11px; fill: #555; }
      .t { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .tb { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .s { font-size: 11px; fill: #555; }
      .k { font-size: 12px; fill: #222; }
      .b-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .b-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .b-p { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .b-d { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .b-g { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; }
      .b-x { fill: #fff; stroke: #8a8a8a; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .a { stroke: #2e6da4; stroke-width: 2.5; fill: none; }
      .l { stroke: #8a8a8a; stroke-width: 1.5; fill: none; }

    </style>
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  </defs>

  <rect class="b-b" x="10" y="16" width="380" height="70" rx="8"/>
  <text class="t" x="200" y="46" text-anchor="middle">管路の調査</text>
  <text class="s" x="200" y="68" text-anchor="middle">管径2m以上・平成6年度以前に設置された管路</text>
  <path class="a" d="M200,87V118" marker-end="url(#ah)"/>
  <rect class="b-b" x="10" y="120" width="380" height="70" rx="8"/>
  <text class="t" x="200" y="150" text-anchor="middle">緊急度の判定</text>
  <text class="s" x="200" y="172" text-anchor="middle">ⅠとⅡに分ける</text>
  <path class="a" d="M200,191V206H102V232" marker-end="url(#ah)"/>
  <path class="a" d="M200,206H297V232" marker-end="url(#ah)"/>
  <rect class="b-d" x="10" y="234" width="185" height="104" rx="8"/>
  <text class="t" x="102" y="266" text-anchor="middle">緊急度Ⅰ</text>
  <text class="s" x="102" y="292" text-anchor="middle">対策の期限</text>
  <text class="t" x="102" y="314" text-anchor="middle">原則1年以内</text>
  <rect class="b-w" x="205" y="234" width="185" height="104" rx="8"/>
  <text class="t" x="297" y="266" text-anchor="middle">緊急度Ⅱ</text>
  <text class="s" x="297" y="292" text-anchor="middle">対策の期限</text>
  <text class="t" x="297" y="314" text-anchor="middle">応急措置のうえ5年以内</text>
  <path class="a" d="M102,339V380" marker-end="url(#ah)"/>
  <rect class="b-p" x="10" y="382" width="380" height="70" rx="8"/>
  <text class="t" x="200" y="412" text-anchor="middle">道路管理者との情報共有</text>
  <text class="s" x="200" y="434" text-anchor="middle">緊急度Ⅰの箇所</text>
</svg>
