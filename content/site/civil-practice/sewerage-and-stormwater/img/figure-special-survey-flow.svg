<!-- authored 2026-10-15 doboku-note 自作。論点は国土交通省 全国特別重点調査の結果公表（令和8年4月21日）と事務連絡の緊急度の区分と対策の期限。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="全国特別重点調査の流れ図。535団体・5,332kmの管路を調査し、緊急度ⅠとⅡに判定する。対策が必要な延長748kmのうちⅠが201km、Ⅱが547km。Ⅰは原則1年以内、Ⅱは応急措置のうえ5年以内。緊急度Ⅰの箇所は道路管理者と情報を共有する。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 12px; fill: #555; }
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .x { font-size: 12px; fill: #222; }
      .s { font-size: 11px; fill: #555; }
      .sb { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .p { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .d { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .g { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .wh { fill: #fff; stroke: #8a8a8a; stroke-width: 1.5; }
      .dz { fill: #fff; stroke: #2e6da4; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .l { stroke: #d7d7d7; stroke-width: 1; fill: none; }
      .a { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .ar { stroke: #b22234; stroke-width: 2; fill: none; }
      .ag { stroke: #3a7d44; stroke-width: 2; fill: none; }
      .ax { stroke: #8a8a8a; stroke-width: 2; fill: none; }
    </style>
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
    <marker id="ahr" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#b22234"/></marker>
    <marker id="ahg" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#3a7d44"/></marker>
    <marker id="ahk" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#8a8a8a"/></marker>
  </defs>
  <rect class="b" x="10" y="12" width="380" height="78" rx="8"/>
  <text class="n" x="200.0" y="36.0" text-anchor="middle">管路の調査</text>
  <text class="s" x="200.0" y="55.0" text-anchor="middle">管径2m以上・平成6年度以前に設置された管路</text>
  <text class="s" x="200.0" y="74.0" text-anchor="middle">対象535団体・5,332km（令和8年2月末時点）</text>
  <path class="a" d="M200,91V112" marker-end="url(#ah)"/>
  <rect class="b" x="10" y="114" width="380" height="66" rx="8"/>
  <text class="n" x="200.0" y="140.5" text-anchor="middle">緊急度の判定</text>
  <text class="s" x="200.0" y="161.5" text-anchor="middle">ⅠとⅡに分ける（対策が必要な延長は748km）</text>
  <path class="a" d="M200,181V198H59V224" marker-end="url(#ah)"/>
  <path class="a" d="M200,198H254V224" marker-end="url(#ah)"/>
  <rect class="d" x="10" y="226" width="99" height="116" rx="8"/>
  <text class="n" x="59.5" y="252.0" text-anchor="middle">緊急度Ⅰ</text>
  <text class="sb" x="59.5" y="276.0" text-anchor="middle">201km</text>
  <text class="s" x="59.5" y="300.0" text-anchor="middle">対策の期限</text>
  <text class="sb" x="59.5" y="324.0" text-anchor="middle">原則1年以内</text>
  <rect class="w" x="119" y="226" width="271" height="116" rx="8"/>
  <text class="n" x="254.5" y="252.0" text-anchor="middle">緊急度Ⅱ</text>
  <text class="sb" x="254.5" y="276.0" text-anchor="middle">547km</text>
  <text class="s" x="254.5" y="300.0" text-anchor="middle">対策の期限</text>
  <text class="sb" x="254.5" y="324.0" text-anchor="middle">応急措置のうえ5年以内</text>
  <path class="a" d="M59,343V372" marker-end="url(#ah)"/>
  <rect class="p" x="10" y="374" width="380" height="54" rx="8"/>
  <text class="n" x="200.0" y="395.5" text-anchor="middle">道路管理者との情報共有</text>
  <text class="s" x="200.0" y="414.5" text-anchor="middle">緊急度Ⅰの箇所</text>
  <text class="s" x="14" y="444" text-anchor="start">箱の幅は延長（201kmと547km）の比</text>
  <rect class="w" x="10" y="452" width="380" height="40" rx="8"/>
  <text class="t" x="200.0" y="476.0" text-anchor="middle">法律の義務ではなく、国の事務連絡による運用</text>
</svg>
