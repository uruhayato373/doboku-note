<!-- authored 2026-10-15 doboku-note 自作。論点は点検・評価要領（国管理版・中小河川版）が示す樋門・水門の点検部位（周辺の堤防と取付護岸、函体底版下の空洞、継手、胸壁・翼壁・門柱、函体内の土砂堆積）。特定の書籍図の複製ではない -->
