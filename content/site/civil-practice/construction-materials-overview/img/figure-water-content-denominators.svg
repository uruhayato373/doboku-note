<!-- authored 2026-10-15 doboku-note 自作。論点は含水比・吸水率・含水率・表面水率・木材の含水率で、水の質量を割る相手（分母）が違うこと。骨材の吸水・表面の水の区分は記事本文の表面水率の式 H=(Z-Q)/(1+Q/100) と整合する。帯の長さは縮尺ではない概念図 -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="水の割合を表す言葉で、水の質量を割る相手が違うことを示した図。土の含水比は炉乾燥した土の質量で割る。骨材の吸水率は絶乾質量で割り、含水率は乾燥後の試料の質量で割り、表面水率は表面乾燥飽水状態の質量で割る。木材の含水率は全乾質量で割り、100%を超えることもある。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 11px; fill: #555; }
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .h { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .sl { font-size: 11px; fill: #1a3a5c; }
      .bl { font-size: 11px; fill: #1a3a5c; }
      .sm { font-size: 11px; fill: #555; }
      .p { fill: #fff; stroke: #d7d7d7; stroke-width: 1.5; }
      .den { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; }
      .num { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .off { fill: #fff; stroke: #8a8a8a; stroke-width: 1.5; stroke-dasharray: 4 3; }
    </style>
  </defs>
  <rect class="den" x="14" y="12" width="14" height="14"/><text x="34" y="24">分母の質量</text><rect class="num" x="116" y="12" width="14" height="14"/><text x="136" y="24">分子の水</text><rect class="off" x="206" y="12" width="14" height="14"/><text x="226" y="24">使わない部分</text><rect class="p" x="10" y="36" width="380" height="100" rx="8"/><rect x="22" y="46" width="40" height="22" rx="11" style="fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5"/><text class="h" x="42" y="61" text-anchor="middle">土</text><rect class="den" x="24" y="78" width="140" height="20"/><text class="sl" x="94.0" y="92" text-anchor="middle">炉乾燥した土</text><rect class="num" x="164" y="78" width="44" height="20"/><text class="sl" x="186.0" y="92" text-anchor="middle">水</text><path d="M24,102V108H164V102" fill="none" stroke="#1a3a5c" stroke-width="2"/><text class="bl" x="94.0" y="124" text-anchor="middle">炉乾燥した土の質量</text><text class="n" x="272" y="93">含水比</text><rect class="p" x="10" y="144" width="380" height="230" rx="8"/><rect x="22" y="154" width="52" height="22" rx="11" style="fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5"/><text class="h" x="48" y="169" text-anchor="middle">骨材</text><rect class="den" x="24" y="190" width="150" height="20"/><text class="sl" x="99.0" y="204" text-anchor="middle">絶乾</text><rect class="num" x="174" y="190" width="44" height="20"/><text class="sl" x="196.0" y="204" text-anchor="middle">吸水</text><rect class="off" x="218" y="190" width="40" height="20"/><text class="sl" x="238.0" y="204" text-anchor="middle">表面</text><path d="M24,214V220H174V214" fill="none" stroke="#1a3a5c" stroke-width="2"/><text class="bl" x="99.0" y="236" text-anchor="middle">絶乾質量</text><text class="n" x="272" y="205">吸水率</text><rect class="den" x="24" y="254" width="150" height="20"/><text class="sl" x="99.0" y="268" text-anchor="middle">絶乾</text><rect class="num" x="174" y="254" width="44" height="20"/><text class="sl" x="196.0" y="268" text-anchor="middle">吸水</text><rect class="num" x="218" y="254" width="40" height="20"/><text class="sl" x="238.0" y="268" text-anchor="middle">表面</text><path d="M24,278V284H174V278" fill="none" stroke="#1a3a5c" stroke-width="2"/><text class="bl" x="99.0" y="300" text-anchor="middle">乾燥後の試料の質量</text><text class="n" x="272" y="269">含水率</text><rect class="den" x="24" y="318" width="150" height="20"/><text class="sl" x="99.0" y="332" text-anchor="middle">絶乾</text><rect class="den" x="174" y="318" width="44" height="20"/><text class="sl" x="196.0" y="332" text-anchor="middle">吸水</text><rect class="num" x="218" y="318" width="40" height="20"/><text class="sl" x="238.0" y="332" text-anchor="middle">表面</text><path d="M24,342V348H218V342" fill="none" stroke="#1a3a5c" stroke-width="2"/><text class="bl" x="121.0" y="364" text-anchor="middle">表面乾燥飽水状態の質量</text><text class="n" x="272" y="333">表面水率</text><rect class="p" x="10" y="382" width="380" height="100" rx="8"/><rect x="22" y="392" width="52" height="22" rx="11" style="fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5"/><text class="h" x="48" y="407" text-anchor="middle">木材</text><text class="n" x="272" y="439">含水率</text><rect class="den" x="24" y="424" width="96" height="20"/><text class="sl" x="72.0" y="438" text-anchor="middle">全乾</text><rect class="num" x="120" y="424" width="136" height="20"/><text class="sl" x="188.0" y="438" text-anchor="middle">水</text><path d="M24,448V454H120V448" fill="none" stroke="#1a3a5c" stroke-width="2"/><text class="bl" x="72.0" y="470" text-anchor="middle">全乾質量（105℃）</text><text class="sm" x="272" y="458">100%を超えることも</text>
</svg>
