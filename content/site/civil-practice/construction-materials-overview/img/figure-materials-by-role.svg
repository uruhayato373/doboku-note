<!-- authored 2026-10-15 doboku-note 自作。論点は道路の断面（盛土・路床、路盤、表層・基層、のり面、防護柵）と鉄道の断面（レール、まくらぎ、砕石の道床、路盤）を、支える土・荷重を渡す・走行面・守りの四役に対応づけること。構造と寸法は模式で縮尺はない。荷重を広げる破線は記事本文の説明に基づく -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="道路と鉄道の断面を、構造物の四つの役割に対応づけた図。役割は、支える土、荷重を渡す、走行面、守りの四つで、荷重を渡すのは橋。道路の断面では、盛土と路床は土、路盤は砕石、表層と基層はアスファルト混合物、のり面保護は植生やブロック、防護柵は附属物や二次製品。鉄道の断面では、レール、まくらぎ、砕石の道床が走行面で、その下の路盤が支える土。荷重は層を通って広がりながら下へ伝わる。">
