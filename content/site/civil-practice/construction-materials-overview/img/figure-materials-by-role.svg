  <rect class="ps" x="214" y="12" width="56" height="22" rx="11"/><text class="h" x="242" y="27" text-anchor="middle">走行面</text>
  <rect class="pg" x="278" y="12" width="46" height="22" rx="11"/><text class="h" x="301" y="27" text-anchor="middle">守り</text>

