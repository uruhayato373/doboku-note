<!-- authored 2026-10-15 doboku-note 自作（2026-10-16 改訂）。論点は道路の断面・鉄道の断面・橋と港湾の部位を、支える土・荷重を渡す・走行面・守りの四役と材料に対応づけること。構造と寸法は模式で縮尺はない。荷重を広げる破線は記事本文の説明に基づく -->
<svg role="img" xmlns="http://www.w3.org/2000/svg" aria-label="道路・鉄道・橋と港湾を、構造物の四つの役割と材料に対応づけた図。道路は盛土と路床が土、路盤が砕石、表層と基層がアスファルト混合物、のり面保護が植生やブロック、防護柵が附属物や二次製品。鉄道はレールが鋼、まくらぎがコンクリート、砕石の道床が走行面で、路盤が砕石。荷重を渡す橋の主桁は鋼、橋脚はコンクリート、港湾のケーソンはコンクリート、鋼管杭は鋼。" style="max-width:400px;width:100%" viewBox="0 0 400 500"><defs><marker id="ak" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="8" refY="4"><path fill="#555" d="m0 0 9 4-9 4z"/></marker><style>text{font-family:Inter,&quot;Noto Sans JP&quot;,&quot;Hiragino Kaku Gothic ProN&quot;,&quot;Hiragino Sans&quot;,sans-serif;font-size:11px;fill:#555}.h,.n,.t{fill:#1a3a5c}.n{font-size:13px;font-weight:700}.t{font-size:11px}.h{font-size:12px;font-weight:700}.p,.pb{fill:#fff;stroke:#d7d7d7;stroke-width:1.5}.pb{fill:#e8f0fe;stroke:#2e6da4}.lead{fill:none;stroke:#8a8a8a;stroke-width:1}.dot,.spread{fill:#1a3a5c;stroke:#fff;stroke-width:1.5}.spread{fill:none;stroke:#555;stroke-dasharray:4 3}</style></defs><rect width="68" height="22" x="14" y="12" rx="11" style="fill:#fff3cd;stroke:#d4a017;stroke-width:1.5"/><text x="48" y="27" class="h" text-anchor="middle">支える土</text><rect width="82" height="22" x="90" y="12" class="pb" rx="11"/><text x="131" y="27" class="h" text-anchor="middle">荷重を渡す</text><rect width="56" height="22" x="180" y="12" rx="11" style="fill:#d7d7d7;stroke:#8a8a8a;stroke-width:1.5"/><text x="208" y="27" class="h" text-anchor="middle">走行面</text><rect width="46" height="22" x="244" y="12" rx="11" style="fill:#d0e8d0;stroke:#3a7d44;stroke-width:1.5"/><text x="267" y="27" class="h" text-anchor="middle">守り</text><rect width="380" height="166" x="10" y="42" class="p" rx="8"/><text x="22" y="62" class="n">道路</text><path stroke="#555" stroke-dasharray="4 3" stroke-width="1.5" d="M22 194h20"/><text x="48" y="198">荷重の広がり</text><g transform="matrix(.75 0 0 .75 8.5 -23.5)"><path d="m18 268 42-118h108l42 118z" style="fill:#fff3cd;stroke:#d4a017;stroke-width:1.5"/><path d="M70 170h88v26H70z" style="fill:#fff;stroke:#