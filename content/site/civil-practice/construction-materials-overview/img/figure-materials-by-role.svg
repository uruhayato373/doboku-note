  <rect class="ps" x="232" y="116" width="64" height="18" rx="9"/><text class="h" x="264" y="129" text-anchor="middle">走行面</text>
  <text class="n" x="304" y="130">表層・基層</text><text class="t" x="232" y="152">アスファルト混合物</text>
  <rect class="pw" x="232" y="164" width="64" height="18" rx="9"/><text class="h" x="264" y="177" text-anchor="middle">支える土</text>
