    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 11px; fill: #555; }
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t { font-size: 12px; fill: #1a3a5c; }
      .h { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .p { fill: #fff; stroke: #d7d7d7; stroke-width: 1.5; }
      .pw { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .pb { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .pg { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .ps { fill: #d7d7d7; stroke: #8a8a8a; stroke-width: 1.5; }
      .lead { fill: none; stroke: #8a8a8a; stroke-width: 1; }
      .dot { fill: #1a3a5c; stroke: #fff; stroke-width: 1.5; }
      .spread { fill: none; stroke: #555; stroke-width: 1.5; stroke-dasharray: 4 3; }
    </style>
    <marker id="ak" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  </defs>

