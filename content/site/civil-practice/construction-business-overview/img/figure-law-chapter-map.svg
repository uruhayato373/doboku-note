<!-- authored 2026-10-16 doboku-note 自作。論点は建設業法の章立てを、会社の動く順に読み替えた五つの段階と、対応するシリーズの記事。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="会社の動く順と建設業法の章の地図。許可を取り保つは第2章、経審を受け入札に出るは第4章の2、下請と結び現場に人を置くは第3章と第4章、争いを解き監督に備えるは第3章の2と第5章、これからの仕事を整えるは法の章に収まらない課題。それぞれに対応する記事を並べた図。">
