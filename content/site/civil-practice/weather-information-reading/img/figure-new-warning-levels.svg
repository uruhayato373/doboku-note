<!-- authored 2026-10-16 doboku-note 自作。論点は令和8年5月29日からの防災気象情報の名前の付け方（レベル＋現象名＋情報の種類）。情報名は本文に挙げたものだけを使用。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="令和8年5月29日からの防災気象情報の名前の付け方の図。レベル1から5の情報の種類を縦に並べ、名前はレベルの数字、現象名、情報の種類の順に付く。例はレベル3大雨警報、レベル4土砂災害危険警報、レベル5氾濫特別警報。暴風などの警報や強風などの注意報はレベルが付かない。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 12px; fill: #555; }
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .x { font-size: 12px; fill: #222; }
      .s { font-size: 11px; fill: #555; }
      .sb { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .p { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .d { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .g { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .wh { fill: #fff; stroke: #8a8a8a; stroke-width: 1.5; }
      .dz { fill: #fff; stroke: #2e6da4; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .l { stroke: #d7d7d7; stroke-width: 1; fill: none; }
      .ln { stroke: #8a8a8a; stroke-width: 1; fill: none; }
      .ld { stroke: #8a8a8a; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
      .a { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .ar { stroke: #b22234; stroke-width: 2; fill: none; }
      .ag { stroke: #3a7d44; stroke-width: 2; fill: none; }
      .ax { stroke: #8a8a8a; stroke-width: 2; fill: none; }
    </style>
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
    <marker id="ahr" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#b22234"/></marker>
    <marker id="ahg" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#3a7d44"/></marker>
    <marker id="ahk" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#8a8a8a"/></marker>
  </defs>
  <text class="s" x="10" y="18" text-anchor="start">警戒レベル</text>
  <rect class="d" x="10" y="26" width="148" height="46" rx="8"/>
  <circle cx="34" cy="49" r="13" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text class="t" x="34" y="54" text-anchor="middle">5</text>
  <text class="t" x="56" y="54" text-anchor="start">特別警報</text>
  <rect class="d" x="10" y="80" width="148" height="46" rx="8"/>
  <circle cx="34" cy="103" r="13" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text class="t" x="34" y="108" text-anchor="middle">4</text>
  <text class="t" x="56" y="108" text-anchor="start">危険警報（新設）</text>
  <rect class="w" x="10" y="134" width="148" height="46" rx="8"/>
  <circle cx="34" cy="157" r="13" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text class="t" x="34" y="162" text-anchor="middle">3</text>
  <text class="t" x="56" y="162" text-anchor="start">警報</text>
  <rect class="b" x="10" y="188" width="148" height="46" rx="8"/>
  <circle cx="34" cy="211" r="13" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text class="t" x="34" y="216" text-anchor="middle">2</text>
  <text class="t" x="56" y="216" text-anchor="start">注意報</text>
  <rect class="g" x="10" y="242" width="148" height="46" rx="8"/>
  <circle cx="34" cy="265" r="13" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text class="t" x="34" y="270" text-anchor="middle">1</text>
  <text class="t" x="56" y="270" text-anchor="start">早期注意情報</text>
  <text class="s" x="172" y="18" text-anchor="start">名前の付け方</text>
  <rect class="b" x="170" y="24" width="66" height="34" rx="6"/>
  <text class="s" x="203.0" y="45.0" text-anchor="middle">レベル数字</text>
  <text class="t" x="242" y="46" text-anchor="middle">＋</text>
  <rect class="b" x="248" y="24" width="56" height="34" rx="6"/>
  <text class="s" x="276.0" y="45.0" text-anchor="middle">現象名</text>
  <text class="t" x="310" y="46" text-anchor="middle">＋</text>
  <rect class="b" x="316" y="24" width="74" height="34" rx="6"/>
  <text class="s" x="353.0" y="45.0" text-anchor="middle">情報の種類</text>
  <text class="s" x="170" y="76" text-anchor="start">現象：河川氾濫・大雨・土砂災害・高潮</text>
  <rect class="wh" x="170" y="86" width="220" height="126" rx="8"/>
  <text class="s" x="180" y="106" text-anchor="start">レベル3＋大雨＋警報</text>
  <text class="t" x="180" y="123" text-anchor="start">→ レベル3大雨警報</text>
  <text class="s" x="180" y="144" text-anchor="start">レベル4＋土砂災害＋危険警報</text>
  <text class="t" x="180" y="161" text-anchor="start">→ レベル4土砂災害危険警報</text>
  <text class="s" x="180" y="182" text-anchor="start">レベル5＋氾濫＋特別警報</text>
  <text class="t" x="180" y="199" text-anchor="start">→ レベル5氾濫特別警報</text>
  <rect class="w" x="170" y="222" width="220" height="66" rx="8"/>
  <text class="x" x="180" y="242" text-anchor="start">氾濫の情報は、洪水予報河川</text>
  <text class="x" x="180" y="258" text-anchor="start">（約400河川）だけが対象</text>
  <text class="s" x="180" y="274" text-anchor="start">市町村ごとの洪水警報は出ない</text>
  <rect class="g" x="10" y="304" width="380" height="104" rx="8" style="stroke-dasharray:5 4"/>
  <text class="t" x="20" y="326" text-anchor="start">警戒レベルに相当しない情報</text>
  <text class="s" x="20" y="346" text-anchor="start">暴風・波浪・大雪・暴風雪の特別警報・警報、</text>
  <text class="s" x="20" y="364" text-anchor="start">強風・雷・濃霧などの注意報はこれまでと変わらない</text>
  <text class="s" x="20" y="382" text-anchor="start">「暴風警報だからレベル3」とは読めない</text>
  <rect class="g" x="10" y="420" width="380" height="70" rx="8"/>
  <text class="t" x="200.0" y="449.0" text-anchor="middle">令和8年5月29日から運用開始</text>
  <text class="s" x="200.0" y="469.0" text-anchor="middle">出典：気象庁「防災気象情報の改善について」</text>
</svg>
