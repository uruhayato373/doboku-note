<!-- authored 2026-10-15 doboku-note 自作。論点は河川法第3条・第4条・第5条・第9条・第10条・第100条と河川法施行令第2条・第55条。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="管内の川の四区分を並べた図。一級河川は国土交通大臣が指定し国が管理する。二級河川は都道府県知事が指定し管理する。準用河川は市町村長が指定し管理し、二級河川の規定を準用する。普通河川は指定がなく河川法の適用外で、市町村が条例などで扱う。準用河川では、都道府県知事を市町村長、都道府県を市町村、国土交通大臣を都道府県知事と読み替える。">
