<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="材料の使用条件から必要性能を決め、証明書と現物を照合し、施工条件を確認して採用する四段階の流れ">
  <defs>
    <style>
      text { font-family: Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif; fill: #1a3a5c; }
      .heading { font-size: 19px; font-weight: bold; }
      .body { font-size: 16px; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .positive { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #2e6da4; stroke-width: 2; marker-end: url(#arrow); }
    </style>
    <!-- brand / warn / positive tokens -->
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4" /></marker>
  </defs>
  <rect width="400" height="500" fill="#ffffff" />
  <rect x="20" y="20" width="360" height="78" rx="8" class="brand" />
  <text x="200" y="52" text-anchor="middle" class="heading">使用条件</text>
  <text x="200" y="79" text-anchor="middle" class="body">荷重・温度・水分・接合</text>
  <path d="M200 102V133" class="arrow" />
  <rect x="20" y="142" width="360" height="78" rx="8" class="brand" />
  <text x="200" y="174" text-anchor="middle" class="heading">必要性能を決める</text>
  <text x="200" y="201" text-anchor="middle" class="body">強度・変形・耐久性・施工性</text>
  <path d="M200 224V255" class="arrow" />
  <rect x="20" y="264" width="360" height="78" rx="8" class="warn" />
  <text x="200" y="296" text-anchor="middle" class="heading">証明書と現物を照合</text>
  <text x="200" y="323" text-anchor="middle" class="body">材質・製造単位・寸法・状態</text>
  <path d="M200 346V377" class="arrow" />
  <rect x="20" y="386" width="360" height="94" rx="8" class="positive" />
  <text x="200" y="421" text-anchor="middle" class="heading">施工条件を確認して採用</text>
  <text x="200" y="451" text-anchor="middle" class="body">保管・計量・接合・養生を記録</text>
</svg>
