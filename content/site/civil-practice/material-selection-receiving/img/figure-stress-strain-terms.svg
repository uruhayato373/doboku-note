<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="延性材料と脆性材料の応力-ひずみ曲線に比例限度、弾性限度、降伏点を記し、縦に伸びると横に縮むポアソン比の関係を示した図">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; fill: #1a3a5c; font-size: 12px; }
      .h { font-size: 13px; font-weight: bold; }
      .s { font-size: 11px; fill: #555; }
      .e { text-anchor: end; }
      .axis { fill: none; stroke: #555; stroke-width: 1.5; }
      .duct { fill: none; stroke: #2e6da4; stroke-width: 2.5; stroke-linejoin: round; }
      .brit { fill: none; stroke: #8a8a8a; stroke-width: 2.5; }
      .lead { fill: none; stroke: #8a8a8a; stroke-width: 1; }
      .dot { fill: #ffffff; stroke: #b22234; stroke-width: 2; }
      .box { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="400" height="500" fill="#ffffff" />
  <path class="axis" d="M50,34 V270 H362" />
  <text x="58" y="40" class="s">応力</text>
  <text x="362" y="288" class="s e">ひずみ</text>
  <path class="duct" d="M50,270 L75,208 L82,192 L90,172 L96,166 L140,164 C190,160 240,110 285,96 C305,92 322,108 332,140" />
  <path class="brit" d="M50,270 L100,100" />
  <path d="M96,96 L104,104 M104,96 L96,104" stroke="#8a8a8a" stroke-width="2" fill="none" />
  <path d="M328,136 L336,144 M336,136 L328,144" stroke="#2e6da4" stroke-width="2" fill="none" />
  <text x="112" y="104" class="s">脆性：すぐ破断</text>
  <text x="258" y="170" class="s">延性：大きく伸びる</text>
  <circle class="dot" cx="75" cy="208" r="3.5" />
  <circle class="dot" cx="82" cy="192" r="3.5" />
  <circle class="dot" cx="96" cy="166" r="3.5" />
  <path class="lead" d="M78,211 L90,226 M85,195 L97,206" />
  <text x="92" y="236">比例限度</text>
  <text x="100" y="214">弾性限度</text>
  <text x="104" y="152">降伏点</text>
  <rect class="box" x="10" y="306" width="380" height="184" rx="6" />
  <rect x="30" y="360" width="80" height="44" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4 3" />
  <rect x="30" y="364" width="100" height="36" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5" />
  <text x="30" y="428" class="s">破線：元の形</text>
  <text x="30" y="446" class="s">実線：引張後</text>
  <text x="170" y="360" class="h">ポアソン比 ν</text>
  <text x="170" y="380">＝｜横ひずみ ÷ 縦ひずみ｜</text>
  <text x="170" y="410" class="h">せん断弾性係数 G</text>
  <text x="170" y="430">＝E ÷ {2(1＋ν)}</text>
  <text x="170" y="458" class="s">方向で性質が違う材料には使えない</text>
</svg>
