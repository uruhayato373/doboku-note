<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="木材の含水率と収縮の関係を接線・半径・繊維方向で比べた図と、板目板と柾目板の取り方と乾燥後の変形の違いを示す図">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; fill: #1a3a5c; font-size: 12px; }
      .h { font-size: 13px; font-weight: bold; }
      .s { font-size: 12px; fill: #555; }
      .m { text-anchor: middle; }
      .e { text-anchor: end; }
      .axis { fill: none; stroke: #555; stroke-width: 1.5; }
      .guide { fill: none; stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 4 3; }
      .t { fill: none; stroke: #b22234; stroke-width: 2.5; }
      .r { fill: none; stroke: #d4a017; stroke-width: 2.5; }
      .l { fill: none; stroke: #2e6da4; stroke-width: 2.5; }
      .log { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .ring { fill: none; stroke: #8a8a8a; stroke-width: 1; }
      .itame { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .masa { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="400" height="500" fill="#ffffff" />
  <text x="20" y="24" class="h">含水率と寸法</text>
  <path class="axis" d="M50,38 V200 H372" />
  <text x="370" y="218" class="s e">含水率</text>
  <text x="50" y="218" class="s m">0%</text>
  <path class="guide" d="M290,62 V200" />
  <text x="290" y="56" class="s m">繊維飽和点（約30%）</text>
  <path class="t" d="M50,190 L290,110 H360" />
  <path class="r" d="M50,190 L290,150 H360" />
  <path class="l" d="M50,190 L290,184 H360" />
  <text x="370" y="102" class="s e">接線方向</text>
  <text x="370" y="142" class="s e">半径方向</text>
  <text x="370" y="176" class="s e">繊維方向</text>
  <text x="58" y="84" class="s">結合水が減ると縮み、</text>
  <text x="58" y="100" class="s">強度は上がる</text>
  <text x="20" y="238" class="s">縮み方の比は 繊維：半径：接線 ≒ 0.5〜1：5：10</text>
  <text x="20" y="268" class="h">木取りと変形</text>
  <circle class="log" cx="90" cy="360" r="70" />
  <circle class="ring" cx="90" cy="360" r="14" />
  <circle class="ring" cx="90" cy="360" r="28" />
  <circle class="ring" cx="90" cy="360" r="42" />
  <circle class="ring" cx="90" cy="360" r="56" />
  <rect class="itame" x="58" y="308" width="64" height="12" />
  <rect class="masa" x="90" y="354" width="68" height="12" />
  <path class="guide" d="M205,312 V352 M325,312 V352" />
  <path d="M215,318 Q265,342 315,318 L315,330 Q265,354 215,330 Z" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5" />
  <text x="265" y="374" class="s m">板目：大きく縮み、反りやすい</text>
  <rect class="masa" x="218" y="400" width="94" height="10" />
  <text x="265" y="430" class="s m">柾目：縮みが小さく、反りにくい</text>
  <rect class="itame" x="20" y="452" width="14" height="10" />
  <text x="42" y="462" class="s">板目板：年輪に沿う面で幅を取る</text>
  <rect class="masa" x="20" y="474" width="14" height="10" />
  <text x="42" y="484" class="s">柾目板：半径方向に幅を取る</text>
</svg>
