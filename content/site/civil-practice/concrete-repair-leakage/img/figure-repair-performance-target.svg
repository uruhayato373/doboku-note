<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="補修は供用開始時までの力学的性能の回復を含み、補強は供用開始時を超える性能を目指す">
<defs><style>
text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#555}.body{font-size:13px}.head{font-size:15px;font-weight:bold;fill:#1a3a5c}.small{font-size:12px}.strong{font-size:13px;font-weight:bold;fill:#1a3a5c}
/* ink-body / ink-strong / brand-fill / brand / positive-fill / positive / warn-fill / warn / danger-fill / danger / surface / token-border */
.surface{fill:#f5f5f5;stroke:#d7d7d7;stroke-width:1.5}.brand{fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5}.positive{fill:#d0e8d0;stroke:#3a7d44;stroke-width:1.5}.warn{fill:#fff3cd;stroke:#d4a017;stroke-width:1.5}.danger{fill:#f8d7da;stroke:#b22234;stroke-width:1.5}.line{stroke:#555;stroke-width:1.5;fill:none}.blue{stroke:#2e6da4;stroke-width:2;fill:none}.red{stroke:#b22234;stroke-width:2;fill:none}.green{stroke:#3a7d44;stroke-width:3;fill:none}
</style><marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#2e6da4"/></marker><marker id="g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#3a7d44"/></marker></defs>
<text class="head" x="200" y="30" text-anchor="middle">力学的性能は、供用開始時の</text><text class="head" x="200" y="52" text-anchor="middle">水準を基準に分ける</text><line class="line" x1="52" y1="374" x2="52" y2="88" marker-end="url(#a)"/><text class="small" x="62" y="101" text-anchor="start">高い</text><line class="blue" x1="68" y1="229" x2="372" y2="229" stroke-dasharray="6 4"/><text class="strong" x="68" y="211" text-anchor="start">供用開始時の水準</text><line class="line" x1="68" y1="361" x2="372" y2="361" stroke-dasharray="4 4"/><text class="small" x="68" y="386" text-anchor="start">劣化して低下した性能</text><line class="blue" x1="151" y1="354" x2="151" y2="232" marker-end="url(#a)"/><text class="head" x="170" y="295" text-anchor="start">補修</text><text class="small" x="170" y="317" text-anchor="start">元の水準へ</text><line class="green" x1="274" y1="354" x2="274" y2="127" marker-end="url(#g)"/><text class="head" x="293" y="151" text-anchor="start">補強</text><text class="small" x="293" y="174">当初を超える</text><text class="small" x="293" y="192">水準へ</text><rect class="warn" x="24" y="416" width="352" height="63" rx="6"/><text class="small" x="200" y="441" text-anchor="middle">耐久性・外観の回復や第三者影響の除去も</text><text class="strong" x="200" y="463" text-anchor="middle">補修の目的に含まれる</text>
</svg>
