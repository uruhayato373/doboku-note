<!-- authored 2026-10-15 doboku-note 自作。論点は配属先ごとの読む順番。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="配属先ごとの読む順番の経路図。全員が最初に法令の読み方と国・県・市町村の役割分担を読み、そこから配属先ごとに三本ずつ読む。道路の窓口は道路法の骨格、道路占用許可の審査、承認工事と道路使用許可。河川の窓口は河川法の骨格、河川区域の許可、河川の工作物の技術審査。工事の発注は公共事業の流れと発注方式、工事検査の種類と役割、原価と設計変更。まちづくりは都市計画法の骨格、開発許可と公共施設の帰属、土地区画整理事業。災害対応は地域防災計画と水防、災害復旧と災害査定の二本。">
