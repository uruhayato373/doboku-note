<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="搬入の表と協力会社の表を業者コードでつなぐ。内部結合では一致しない行が消え、結合後の件数が減るので検算する" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
<rect width="400" height="500" fill="#ffffff"/>
<text x="20" y="34" font-size="12" font-weight="700" fill="#1a3a5c">搬入の表（多）</text><text x="220" y="34" font-size="12" font-weight="700" fill="#1a3a5c">協力会社の表（一）</text>
<rect x="20" y="44" width="160" height="26" fill="#e8f0fe" stroke="#2e6da4"/><g font-size="11" font-weight="700" fill="#1a3a5c"><text x="26" y="61">搬入番号</text><text x="96" y="61">業者コード</text></g><rect x="20" y="70" width="160" height="26" fill="#ffffff" stroke="#d7d7d7"/><g font-size="11" fill="#222"><text x="26" y="87">N001</text><text x="96" y="87">C01</text></g><rect x="20" y="96" width="160" height="26" fill="#ffffff" stroke="#d7d7d7"/><g font-size="11" fill="#222"><text x="26" y="113">N002</text><text x="96" y="113">C02</text></g><rect x="20" y="122" width="160" height="26" fill="#ffffff" stroke="#d7d7d7"/><g font-size="11" fill="#222"><text x="26" y="139">N003</text><text x="96" y="139">C09</text></g><rect x="220" y="44" width="160" height="26" fill="#e8f0fe" stroke="#2e6da4"/><g font-size="11" font-weight="700" fill="#1a3a5c"><text x="226" y="61">業者コード</text><text x="296" y="61">社名</text></g><rect x="220" y="70" width="160" height="26" fill="#ffffff" stroke="#d7d7d7"/><g font-size="11" fill="#222"><text x="226" y="87">C01</text><text x="296" y="87">A建材</text></g><rect x="220" y="96" width="160" height="26" fill="#ffffff" stroke="#d7d7d7"/><g font-size="11" fill="#222"><text x="226" y="113">C02</text><text x="296" y="113">B骨材</text></g><rect x="220" y="122" width="160" height="26" fill="#d0e8d0" stroke="#3a7d44"/><g font-size="11" fill="#222"><text x="226" y="139">C03</text><text x="296" y="139">C鋼材</text></g>
<path d="M180 83 H220 M180 109 H220" fill="none" stroke="#3a7d44" stroke-width="2.5"/><path d="M186 130 L196 140 M196 130 L186 140" fill="none" stroke="#b22234" stroke-width="2"/><text x="200" y="155" font-size="11" text-anchor="middle" fill="#b22234">相手なし</text><text x="300" y="161" font-size="11" text-anchor="middle" fill="#3a7d44">搬入なし</text>
<rect x="20" y="168" width="360" height="26" rx="6" fill="#fff3cd" stroke="#d4a017"/><text x="200" y="186" font-size="12" font-weight="700" text-anchor="middle" fill="#1a3a5c">結合キー＝業者コード（値が等しい行をつなぐ）</text>
<defs><marker id="ar" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker></defs>
<path d="M200 194 V212" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#ar)"/><text x="212" y="208" font-size="11" fill="#555">内部結合の結果</text>
<rect x="20" y="214" width="360" height="22" fill="#e8f0fe" stroke="#2e6da4"/><g font-size="11" font-weight="700" fill="#1a3a5c"><text x="26" y="229">搬入番号</text><text x="136" y="229">業者コード</text><text x="246" y="229">社名</text></g>
<rect x="20" y="236" width="360" height="22" fill="#ffffff" stroke="#d7d7d7"/><g font-size="11" fill="#222"><text x="26" y="251">N001</text><text x="136" y="251">C01</text><text x="246" y="251">A建材</text></g>
<rect x="20" y="258" width="360" height="22" fill="#ffffff" stroke="#d7d7d7"/><g font-size="11" fill="#222"><text x="26" y="273">N002</text><text x="136" y="273">C02</text><text x="246" y="273">B骨材</text></g>
<rect x="20" y="280" width="360" height="22" fill="#f8d7da" stroke="#b22234" stroke-dasharray="4 3"/><g font-size="11" fill="#222"><text x="26" y="295">N003</text><text x="136" y="295">C09</text><text x="246" y="295">結果に出ない</text></g>
<rect x="20" y="310" width="360" height="44" rx="6" fill="#f8d7da" stroke="#b22234"/><g font-size="12" fill="#222"><text x="32" y="328">検算：搬入の表は3行、結果は2行</text><text x="32" y="345">減った1行は、C09が協力会社の表に無い</text></g>
<rect x="20" y="362" width="360" height="62" rx="6" fill="#d0e8d0" stroke="#3a7d44"/><g font-size="12" fill="#222"><text x="32" y="381" font-weight="700">外部結合（搬入の表を基準）</text><text x="32" y="400">搬入の表の3行をすべて残す</text><text x="32" y="417">N003の社名は空欄になる</text></g>
<rect x="20" y="430" width="360" height="62" rx="6" fill="#d0e8d0" stroke="#3a7d44"/><g font-size="12" fill="#222"><text x="32" y="449" font-weight="700">外部結合（協力会社の表を基準）</text><text x="32" y="468">協力会社の表の3行をすべて残す</text><text x="32" y="485">C03は搬入側が空欄。搬入のない会社が探せる</text></g>
</svg>
