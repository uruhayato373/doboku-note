<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="協力会社、搬入、受入検査、材料の4表の関係。協力会社と搬入、搬入と受入検査、材料と受入検査がそれぞれ一対多で、主キーと外部キーでつながる" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
<rect width="400" height="500" fill="#ffffff"/>
<rect x="20" y="20" width="170" height="108" rx="6" fill="#ffffff" stroke="#2e6da4"/><rect x="20" y="20" width="170" height="26" rx="6" fill="#e8f0fe" stroke="#2e6da4"/><text x="30" y="38" font-size="12" font-weight="700" fill="#1a3a5c">協力会社</text><g font-size="11" fill="#222"><text x="30" y="62">業者コード</text><text x="180" y="62" text-anchor="end" fill="#2e6da4">主</text><text x="30" y="80">社名</text><text x="30" y="98">電話</text><text x="30" y="116">法人番号</text></g><rect x="20" y="160" width="170" height="90" rx="6" fill="#ffffff" stroke="#2e6da4"/><rect x="20" y="160" width="170" height="26" rx="6" fill="#e8f0fe" stroke="#2e6da4"/><text x="30" y="178" font-size="12" font-weight="700" fill="#1a3a5c">搬入</text><g font-size="11" fill="#222"><text x="30" y="202">搬入番号</text><text x="180" y="202" text-anchor="end" fill="#2e6da4">主</text><text x="30" y="220">搬入日</text><text x="30" y="238">業者コード</text><text x="180" y="238" text-anchor="end" fill="#2e6da4">外</text></g><rect x="20" y="282" width="170" height="108" rx="6" fill="#ffffff" stroke="#2e6da4"/><rect x="20" y="282" width="170" height="26" rx="6" fill="#e8f0fe" stroke="#2e6da4"/><text x="30" y="300" font-size="12" font-weight="700" fill="#1a3a5c">受入検査</text><g font-size="11" fill="#222"><text x="30" y="324">搬入番号</text><text x="180" y="324" text-anchor="end" fill="#2e6da4">主・外</text><text x="30" y="342">材料コード</text><text x="180" y="342" text-anchor="end" fill="#2e6da4">主・外</text><text x="30" y="360">数量</text><text x="30" y="378">結果</text></g><rect x="230" y="292" width="150" height="90" rx="6" fill="#ffffff" stroke="#2e6da4"/><rect x="230" y="292" width="150" height="26" rx="6" fill="#e8f0fe" stroke="#2e6da4"/><text x="240" y="310" font-size="12" font-weight="700" fill="#1a3a5c">材料</text><g font-size="11" fill="#222"><text x="240" y="334">材料コード</text><text x="370" y="334" text-anchor="end" fill="#2e6da4">主</text><text x="240" y="352">材料名</text><text x="240" y="370">単位</text></g>
<g fill="none" stroke="#2e6da4" stroke-width="1.5"><path d="M105 128 V160"/><path d="M105 250 V282"/><path d="M190 334 H230"/></g><g font-size="11" font-weight="700" fill="#1a3a5c"><text x="111" y="142">1</text><text x="111" y="156">多</text><text x="111" y="264">1</text><text x="111" y="278">多</text><text x="194" y="328">多</text><text x="216" y="328">1</text></g><circle cx="140" cy="144" r="9" fill="#fff3cd" stroke="#d4a017"/><text x="140" y="148" font-size="11" font-weight="700" text-anchor="middle" fill="#222">1</text><circle cx="140" cy="266" r="9" fill="#fff3cd" stroke="#d4a017"/><text x="140" y="270" font-size="11" font-weight="700" text-anchor="middle" fill="#222">2</text><circle cx="210" cy="354" r="9" fill="#fff3cd" stroke="#d4a017"/><text x="210" y="358" font-size="11" font-weight="700" text-anchor="middle" fill="#222">3</text>
<rect x="215" y="20" width="165" height="64" rx="6" fill="#f5f5f5" stroke="#d7d7d7"/><circle cx="233" cy="40" r="9" fill="#fff3cd" stroke="#d4a017"/><text x="233" y="44" font-size="11" font-weight="700" text-anchor="middle" fill="#222">1</text><g font-size="12" fill="#222"><text x="250" y="44">協力会社と搬入</text><text x="228" y="68">1社が何度も搬入する</text></g>
<rect x="215" y="96" width="165" height="64" rx="6" fill="#f5f5f5" stroke="#d7d7d7"/><circle cx="233" cy="116" r="9" fill="#fff3cd" stroke="#d4a017"/><text x="233" y="120" font-size="11" font-weight="700" text-anchor="middle" fill="#222">2</text><g font-size="12" fill="#222"><text x="250" y="120">搬入と受入検査</text><text x="228" y="144">1回の搬入に複数の材料</text></g>
<rect x="215" y="172" width="165" height="64" rx="6" fill="#f5f5f5" stroke="#d7d7d7"/><circle cx="233" cy="192" r="9" fill="#fff3cd" stroke="#d4a017"/><text x="233" y="196" font-size="11" font-weight="700" text-anchor="middle" fill="#222">3</text><g font-size="12" fill="#222"><text x="250" y="196">材料と受入検査</text><text x="228" y="220">1材料が何度も出てくる</text></g>
<rect x="20" y="420" width="360" height="62" rx="6" fill="#fff3cd" stroke="#d4a017"/><g font-size="12" fill="#222"><text x="32" y="442">主＝主キー　外＝外部キー　1／多＝一対多</text><text x="32" y="466">受入検査の主キーは搬入番号と材料コードの組</text></g>
</svg>
