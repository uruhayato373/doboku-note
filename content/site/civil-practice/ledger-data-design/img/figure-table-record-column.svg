<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="表は同じ種類の事実の集まりで、行が一件、列が一項目を表し、列ごとに型が決まる。写真は本体を入れる方法と、置き場所を入れる方法がある" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
<rect width="400" height="500" fill="#ffffff"/>
<defs><marker id="ar" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker></defs>
<text x="20" y="34" font-size="12" font-weight="700" fill="#1a3a5c">受入検査の表</text>
<rect x="20" y="44" width="360" height="26" fill="#e8f0fe" stroke="#2e6da4"/><g font-size="11" font-weight="700" fill="#1a3a5c"><text x="26" y="61">搬入番号</text><text x="92" y="61">材料</text><text x="150" y="61">数量</text><text x="198" y="61">結果</text><text x="260" y="61">写真ファイル名</text></g><rect x="20" y="70" width="360" height="22" fill="#f5f5f5" stroke="#d7d7d7"/><g font-size="11" fill="#555"><text x="26" y="85">文字</text><text x="92" y="85">文字</text><text x="150" y="85">数値</text><text x="198" y="85">文字</text><text x="260" y="85">文字</text></g><rect x="20" y="92" width="360" height="26" fill="#ffffff" stroke="#d7d7d7"/><g font-size="11" fill="#222"><text x="26" y="109">N001</text><text x="92" y="109">鉄筋</text><text x="150" y="109">12</text><text x="198" y="109">合格</text><text x="260" y="109">P0000001.JPG</text></g><rect x="20" y="118" width="360" height="26" fill="#fff3cd" stroke="#d4a017"/><g font-size="11" fill="#222"><text x="26" y="135">N001</text><text x="92" y="135">砕石</text><text x="150" y="135">30</text><text x="198" y="135">合格</text><text x="260" y="135">P0000002.JPG</text></g><rect x="20" y="144" width="360" height="26" fill="#ffffff" stroke="#d7d7d7"/><g font-size="11" fill="#222"><text x="26" y="161">N002</text><text x="92" y="161">鉄筋</text><text x="150" y="161">8</text><text x="198" y="161">不合格</text><text x="260" y="161">P0000003.JPG</text></g>
<rect x="20" y="180" width="14" height="14" fill="#e8f0fe" stroke="#2e6da4"/><g font-size="12" fill="#222"><text x="42" y="192">列（カラム）＝ 一つの項目。型が決まる</text></g><rect x="20" y="204" width="14" height="14" fill="#fff3cd" stroke="#d4a017"/><g font-size="12" fill="#222"><text x="42" y="216">行（レコード）＝ 一件の事実</text></g>
<rect x="20" y="256" width="172" height="116" rx="6" fill="#f5f5f5" stroke="#d7d7d7"/><rect x="208" y="256" width="172" height="116" rx="6" fill="#d0e8d0" stroke="#3a7d44"/><text x="32" y="280" font-size="12" font-weight="700" fill="#222">本体を列に入れる</text><g font-size="11" fill="#555"><text x="32" y="304">表と写真が一体で動く</text><text x="32" y="324">バックアップが大きくなる</text><text x="32" y="344">差し替えは行ごと</text></g><text x="220" y="280" font-size="12" font-weight="700" fill="#222">置き場所を列に入れる</text><g font-size="11" fill="#555"><text x="220" y="304">表が軽い</text><text x="220" y="324">写真だけ差し替えできる</text><text x="220" y="344">リンク切れの照合が要る</text></g>
