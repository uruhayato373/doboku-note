<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="1枚の台帳を、横の繰り返しを行にし、キーの一部で決まる列を出し、キー以外で決まる列を出して、協力会社、材料、搬入、受入検査の4表に分ける手順" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
<rect width="400" height="500" fill="#ffffff"/>
<defs><marker id="ar" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker></defs>
<rect x="20" y="14" width="360" height="74" rx="6" fill="#f8d7da" stroke="#b22234"/><text x="32" y="36" font-size="12" font-weight="700" fill="#222">1枚の台帳</text><g font-size="11" fill="#555"><text x="32" y="56">搬入番号・搬入日・社名・電話</text><text x="32" y="74">材料1〜3（それぞれに数量・結果）</text></g>
<path d="M200 88 V108" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="20" y="108" width="360" height="84" rx="6" fill="#e8f0fe" stroke="#2e6da4"/><text x="32" y="130" font-size="12" font-weight="700" fill="#1a3a5c">① 横に並ぶ繰り返しを行にする</text><text x="364" y="130" font-size="11" text-anchor="end" fill="#555">第1正規形</text><g font-size="11" fill="#555"><text x="32" y="150">問い：材料1、材料2のような列が並んでいないか</text></g><g font-size="11" font-weight="700" fill="#1a3a5c"><text x="32" y="170">→ 1搬入×1材料で1行にする</text><text x="32" y="186">　主キーは搬入番号と材料コードの組</text></g>
<path d="M200 192 V212" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="20" y="212" width="360" height="84" rx="6" fill="#e8f0fe" stroke="#2e6da4"/><text x="32" y="234" font-size="12" font-weight="700" fill="#1a3a5c">② キーの一部だけで決まる列を出す</text><text x="364" y="234" font-size="11" text-anchor="end" fill="#555">第2正規形</text><g font-size="11" fill="#555"><text x="32" y="254">問い：材料名や搬入日は、キーの片方だけで決まらないか</text></g><g font-size="11" font-weight="700" fill="#1a3a5c"><text x="32" y="274">→ 材料の表と、搬入の表（搬入日・業者）へ出す</text></g>
<path d="M200 296 V316" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="20" y="316" width="360" height="84" rx="6" fill="#e8f0fe" stroke="#2e6da4"/><text x="32" y="338" font-size="12" font-weight="700" fill="#1a3a5c">③ キー以外の列で決まる列を出す</text><text x="364" y="338" font-size="11" text-anchor="end" fill="#555">第3正規形</text><g font-size="11" fill="#555"><text x="32" y="358">問い：社名や電話は、業者コードで決まらないか</text></g><g font-size="11" font-weight="700" fill="#1a3a5c"><text x="32" y="378">→ 協力会社の表へ出す</text></g>
<path d="M200 400 V420" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="20" y="420" width="360" height="66" rx="6" fill="#d0e8d0" stroke="#3a7d44"/><text x="32" y="442" font-size="12" font-weight="700" fill="#222">4つの表：協力会社・材料・搬入・受入検査</text><text x="32" y="466" font-size="12" fill="#222">同じ情報は一箇所だけに持つ</text>
</svg>
