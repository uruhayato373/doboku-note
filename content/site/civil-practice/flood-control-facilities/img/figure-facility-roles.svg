<!-- authored 2026-10-09 doboku-note 自作。論点は河川砂防技術基準 施設配置等計画編の貯水池（ダム）・遊水地等・捷水路及び放水路の考え方。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="洪水のピークを下げる4つの施設の効き方を並べた図。ダムは谷をせき止めて深く貯める。遊水地は川の脇の低地へ越流堤から横に入れて貯める。地下調節池は市街地の地下に洪水の一部を取り込む。放水路は途中で分岐して海や他の川へ流す。">
