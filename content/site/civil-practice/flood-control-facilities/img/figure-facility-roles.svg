      .t { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .p { fill: #fff; stroke: #d7d7d7; stroke-width: 1.5; }
      .w { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .g { fill: #f5f5f5; }
      .d { fill: #d7d7d7; stroke: #8a8a8a; stroke-width: 1.5; }
      .a { stroke: #2e6da4; stroke-width: 2.5; fill: none; }
      .lv { stroke: #8a8a8a; stroke-width: 4; fill: none; }
      .ch { stroke-linecap: butt; fill: none; }
  </style>
  <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  <marker id="at" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  </defs>

  <rect class="p" x="10" y="8" width="380" height="116" rx="8"/>
  <polygon class="g" points="20,116 20,104 200,108 200,116"/>
  <polygon class="w" points="28,52 111,52 108,104 28,104"/>
  <polygon class="d" points="108,104 114,40 128,40 144,104"/>
  <path class="a" d="M68,56V102" stroke-width="1.5" marker-start="url(#at)" marker-end="url(#at)" style="stroke:#555"/>
