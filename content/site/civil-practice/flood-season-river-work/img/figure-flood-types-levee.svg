<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="堤防の断面で水のあふれ方を3通りに描き分けた図。川の水が堤防を越える外水氾濫、雨水が排水しきれない氾濫型の内水氾濫、川の水位が高く排水できずにたまる湛水型の内水氾濫" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 10,4 0,8" fill="#2e6da4"/></marker>
    <marker id="arr-red" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 10,4 0,8" fill="#b22234"/></marker>
  </defs>
  <rect x="0" y="0" width="400" height="500" fill="#ffffff"/>

  <g transform="translate(0,-30)">
  <!-- 川の水 : brand-fill -->
  <rect x="20" y="150" width="156" height="142" fill="#e8f0fe"/>
  <polygon points="176,150 198,156 216,166 228,184 244,212 260,240 272,262 280,266 280,270 272,270 216,176 176,176" fill="#e8f0fe"/>
  <polyline points="20,150 176,150 198,156 216,166 228,184 244,212 260,240 272,262 280,266" fill="none" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="24" y="143" font-size="11" fill="#555">洪水位</text>
  <text x="34" y="236" font-size="11" fill="#222">川（堤外地）</text>

  <!-- 地盤と堤防 : surface -->
  <polygon points="20,292 120,292 272,270 380,270 380,332 20,332" fill="#f5f5f5"/>
  <polygon points="120,292 176,176 216,176 272,270" fill="#f5f5f5"/>
  <polyline points="20,292 120,292 176,176 216,176 272,270 380,270" fill="none" stroke="#555" stroke-width="1.5"/>
  <text x="300" y="322" font-size="11" fill="#555">堤内地</text>
  <text x="198" y="214" font-size="11" fill="#555" text-anchor="middle">堤防</text>

  <!-- 外水 : 越水・漏水 -->
  <path d="M 184 160 L 206 160 Q 226 160 238 178 L 293 266" fill="none" stroke="#b22234" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="244" y="152" font-size="12" font-weight="700" fill="#222">越水</text>
  <line x1="138" y1="262" x2="280" y2="268" stroke="#b22234" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#arr-red)"/>
  <text x="190" y="252" font-size="12" font-weight="700" fill="#222">漏水</text>
  <circle cx="222" cy="144" r="9" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="222" y="148" font-size="12" font-weight="700" fill="#222" text-anchor="middle">1</text>

  <!-- 雨 -->
  <line x1="296" y1="92" x2="288" y2="110" stroke="#2e6da4" stroke-width="2"/>
  <line x1="320" y1="92" x2="312" y2="110" stroke="#2e6da4" stroke-width="2"/>
  <line x1="344" y1="92" x2="336" y2="110" stroke="#2e6da4" stroke-width="2"/>
  <line x1="368" y1="92" x2="360" y2="110" stroke="#2e6da4" stroke-width="2"/>
  <text x="296" y="84" font-size="11" fill="#555">雨</text>

  <!-- 堤内地の家と水たまり -->
  <polygon points="326,270 326,254 335,246 344,254 344,270" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <ellipse cx="309" cy="268" rx="11" ry="4" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <ellipse cx="362" cy="268" rx="12" ry="4" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <circle cx="309" cy="244" r="9" fill="#ffffff" stroke="#d4a017" stroke-width="1.5"/>
  <text x="309" y="248" font-size="12" font-weight="700" fill="#222" text-anchor="middle">3</text>
  <circle cx="362" cy="244" r="9" fill="#ffffff" stroke="#d4a017" stroke-width="1.5"/>
  <text x="362" y="248" font-size="12" font-weight="700" fill="#222" text-anchor="middle">2</text>
  </g>

  <!-- 説明カード -->
  <rect x="20" y="330" width="360" height="48" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <circle cx="40" cy="354" r="10" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="40" y="358" font-size="12" font-weight="700" fill="#222" text-anchor="middle">1</text>
  <text x="60" y="351" font-size="13" font-weight="700" fill="#222">外水氾濫</text>
  <text x="60" y="369" font-size="12" fill="#555">川の水が越水・漏水・決壊で堤内地に入る</text>

  <rect x="20" y="384" width="360" height="48" rx="6" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <circle cx="40" cy="408" r="10" fill="#ffffff" stroke="#d4a017" stroke-width="1.5"/>
  <text x="40" y="412" font-size="12" font-weight="700" fill="#222" text-anchor="middle">2</text>
  <text x="60" y="405" font-size="13" font-weight="700" fill="#222">内水氾濫（氾濫型）</text>
  <text x="60" y="423" font-size="12" fill="#555">排水が追いつかず、川から離れた所でも起きる</text>

  <rect x="20" y="438" width="360" height="48" rx="6" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <circle cx="40" cy="462" r="10" fill="#ffffff" stroke="#d4a017" stroke-width="1.5"/>
  <text x="40" y="466" font-size="12" font-weight="700" fill="#222" text-anchor="middle">3</text>
  <text x="60" y="459" font-size="13" font-weight="700" fill="#222">内水氾濫（湛水型）</text>
  <text x="60" y="477" font-size="12" fill="#555">川の水位が高く排水できず、堤防の近くにたまる</text>
</svg>
