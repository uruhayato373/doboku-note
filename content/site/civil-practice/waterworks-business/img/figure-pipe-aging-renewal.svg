<!-- authored 2026-10-16 doboku-note 自作。数値は記事本文に引いた令和7年度全国水道主管課長会議資料（令和4年度の値）だけを使用。独自の推計は含まない。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="水道管路の老朽化の読み方。令和4年度は総延長約74万kmのうち法定耐用年数40年を超えた管路が約17.6万kmで経年化率は23.6パーセント。更新率は実績が0.64パーセント、40年を超えた約17.6万kmを今後20年で更新するなら毎年約8,800kmで1.18パーセントが必要で、倍近い開きがある。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 11px; fill: #555; }
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .l { font-size: 12px; fill: #1a3a5c; }
      .p { fill: #fff; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
  </defs>

  <text x="14" y="24">令和4年度の全国の水道管路</text>

  <!-- 経年化率 -->
  <rect class="p" x="10" y="34" width="380" height="146" rx="8"/>
  <text class="t" x="20" y="56">経年化率：法定耐用年数40年を超えた管路 ÷ 総延長</text>
  <rect x="20" y="76" width="85" height="44" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <rect x="105" y="76" width="275" height="44" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text class="n" x="62" y="104" text-anchor="middle">23.6%</text>
  <text class="l" x="242" y="104" text-anchor="middle">それ以外</text>
  <text class="t" x="20" y="142">40年超 約17.6万km</text>
  <text class="t" x="380" y="160" text-anchor="end">総延長 約74万km</text>

  <!-- 更新率 -->
  <rect class="p" x="10" y="192" width="380" height="192" rx="8"/>
  <text class="t" x="20" y="214">更新率：その年度に更新した管路 ÷ 総延長</text>
  <text class="l" x="20" y="240">令和4年度の実績</text>
  <rect x="20" y="248" width="136" height="32" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text class="n" x="166" y="270">0.64%</text>
  <text class="l" x="20" y="304">20年で更新するなら（毎年約8,800km）</text>
  <rect x="20" y="312" width="250" height="32" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text class="n" x="280" y="334">1.18%</text>
  <text class="t" x="20" y="370">倍近い開きがある</text>

  <!-- 読み方 -->
  <rect x="10" y="396" width="380" height="96" rx="8" style="fill:#f5f5f5;stroke:#d7d7d7;stroke-width:1.5"/>
  <text class="t" x="20" y="416">読むときは、年度を添える</text>
  <text x="20" y="434">経年化率は管の量、更新率は入れ替えた量</text>
  <text x="20" y="452">40年は会計上の区切りで、使えなくなる年数ではない</text>
  <text x="20" y="470">出典：令和7年度 全国水道主管課長会議資料 p.31</text>
</svg>
