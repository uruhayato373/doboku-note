<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="舗装断面の各層と、層間に散布する乳剤・使う混合物の対応図" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
  <!-- 表層 : brand-fill / brand -->
  <rect x="20" y="20" width="360" height="92" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="34" y="46" font-size="14" font-weight="700" fill="#222">表層</text>
  <text x="34" y="68" font-size="13" fill="#1a3a5c">密粒度(13) 3〜5cm</text>
  <text x="34" y="88" font-size="11" fill="#555">排水性舗装はポーラス</text>
  <text x="34" y="104" font-size="11" fill="#555">バインダは改質H型</text>
  <!-- タックコート : warn -->
  <rect x="20" y="120" width="360" height="36" rx="6" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text x="34" y="143" font-size="13" font-weight="700" fill="#222">タックコート PK-4</text>
  <text x="250" y="143" font-size="11" fill="#555">排水性はPKR-T</text>
  <!-- 基層 -->
  <rect x="20" y="164" width="360" height="82" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="34" y="190" font-size="14" font-weight="700" fill="#222">基層</text>
  <text x="34" y="212" font-size="13" fill="#1a3a5c">粗粒度(20)・密粒度(20) 4〜6cm</text>
  <text x="34" y="232" font-size="11" fill="#555">一層の仕上がり厚は7cm以下</text>
  <!-- プライムコート : warn -->
  <rect x="20" y="254" width="360" height="36" rx="6" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text x="34" y="277" font-size="13" font-weight="700" fill="#222">プライムコート PK-3</text>
  <text x="215" y="277" font-size="11" fill="#555">瀝青安定処理を除く路盤の上</text>
  <!-- 上層路盤 : surface -->
  <rect x="20" y="298" width="360" height="82" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="34" y="324" font-size="14" font-weight="700" fill="#222">上層路盤</text>
  <text x="34" y="346" font-size="13" fill="#1a3a5c">粒度調整砕石など</text>
  <text x="34" y="366" font-size="11" fill="#555">加熱アスファルト安定処理層の上は通常タックコート</text>
  <!-- 下層路盤 -->
  <rect x="20" y="388" width="360" height="52" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="34" y="410" font-size="14" font-weight="700" fill="#222">下層路盤</text>
  <text x="34" y="428" font-size="11" fill="#555">粒状路盤など</text>
  <!-- 凡例 -->
  <rect x="20" y="458" width="18" height="14" rx="3" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text x="46" y="470" font-size="11" fill="#555">黄の帯は乳剤を散布する面</text>
  <text x="20" y="490" font-size="11" fill="#555">散布量・混合物の種類は設計図書による</text>
</svg>
