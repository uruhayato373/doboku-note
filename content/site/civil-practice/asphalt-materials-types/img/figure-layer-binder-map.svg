<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="舗装断面の各層と、層間に散布する乳剤・使う混合物を、通常と排水性舗装で並べた対応図" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
  <text x="107" y="36" font-size="13" font-weight="700" fill="#222" text-anchor="middle">通常</text>
  <text x="293" y="36" font-size="13" font-weight="700" fill="#222" text-anchor="middle">排水性舗装</text>
  <rect x="20" y="44" width="175" height="90" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/> <!-- brand-fill / brand -->
  <text x="32" y="68" font-size="14" font-weight="700" fill="#222">表層</text>
  <text x="32" y="92" font-size="13" fill="#1a3a5c">密粒度(13)</text>
  <text x="32" y="112" font-size="11" fill="#555">仕上り厚 3〜5cm</text>
  <rect x="205" y="44" width="175" height="90" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/> <!-- brand-fill / brand -->
  <text x="217" y="68" font-size="14" font-weight="700" fill="#222">表層</text>
  <text x="217" y="92" font-size="13" fill="#1a3a5c">ポーラス混合物</text>
  <text x="217" y="112" font-size="11" fill="#555">バインダは改質H型</text>
  <rect x="20" y="142" width="175" height="60" rx="6" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/> <!-- warn -->
  <text x="32" y="165" font-size="13" font-weight="700" fill="#222">タックコート PK-4</text>
  <text x="32" y="187" font-size="11" fill="#555">混合物どうしの層間を接着</text>
  <rect x="205" y="142" width="175" height="60" rx="6" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/> <!-- warn -->
  <text x="217" y="165" font-size="13" font-weight="700" fill="#222">タックコート PKR-T</text>
  <text x="217" y="187" font-size="11" fill="#555">ゴム入りで接着を高める</text>
  <rect x="20" y="210" width="360" height="80" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/> <!-- brand-fill / brand -->
  <text x="34" y="234" font-size="14" font-weight="700" fill="#222">基層</text>
  <text x="34" y="256" font-size="13" fill="#1a3a5c">粗粒度(20)・密粒度(20) 4〜6cm</text>
  <text x="34" y="276" font-size="11" fill="#555">一層の仕上り厚は7cm以下</text>
  <rect x="20" y="298" width="360" height="68" rx="6" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/> <!-- warn -->
  <text x="34" y="322" font-size="13" font-weight="700" fill="#222">プライムコート PK-3</text>
  <text x="34" y="344" font-size="11" fill="#555">路盤の表面を固め、上の層との接着を助ける</text>
  <text x="34" y="358" font-size="11" fill="#555">瀝青安定処理を除く路盤の上に散布</text>
  <rect x="20" y="374" width="360" height="70" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/> <!-- surface -->
  <text x="34" y="398" font-size="14" font-weight="700" fill="#222">上層路盤</text>
  <text x="34" y="420" font-size="13" fill="#1a3a5c">粒度調整砕石など</text>
  <text x="34" y="436" font-size="11" fill="#555">加熱アスファルト安定処理層の上は通常タックコート</text>
  <rect x="20" y="458" width="18" height="14" rx="3" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text x="46" y="470" font-size="11" fill="#555">黄の帯は乳剤を散布する面</text>
  <text x="20" y="490" font-size="11" fill="#555">散布量・混合物の種類は設計図書による</text>
</svg>
