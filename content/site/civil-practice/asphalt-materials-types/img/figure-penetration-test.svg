<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="針入度試験の模式図。25℃の試料に100gの針を5秒沈め、貫入深さを0.1mm単位で読む。硬い区分は浅く、軟らかい区分は深く沈む" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif" font-size="12" fill="#222">
  <!-- 上段の枠 : surface -->
  <g stroke-width="1.5">
    <rect x="20" y="20" width="360" height="228" rx="6" fill="#f5f5f5" stroke="#d7d7d7"/>
    <!-- 試料容器と針 -->
    <path d="M24 138V226H124V138" fill="none" stroke="#555"/>
    <rect x="25" y="150" width="98" height="75" fill="#d7d7d7"/>
    <rect x="62" y="48" width="24" height="30" rx="3" fill="#fff3cd" stroke="#d4a017"/>
  </g>
  <path d="M25 150H123" stroke="#555"/>
  <polygon points="72,78 76,78 76,170 74,178 72,170"/>
  <!-- 貫入深さの寸法 : brand -->
  <g stroke="#2e6da4">
    <path d="M124 150H146M80 178H146" stroke-dasharray="3 3"/>
    <path d="M140 157V171"/>
  </g>
  <g fill="#2e6da4">
    <polygon points="140,150 137,157 143,157"/>
    <polygon points="140,178 137,171 143,171"/>
  </g>
  <g font-size="11" fill="#555">
    <text x="96" y="68">おもり付きの針</text>
    <text x="30" y="214">アスファルト</text>
  </g>
  <text x="150" y="168">貫入深さ</text>
  <!-- 測定条件 : brand -->
  <text x="214" y="38" font-weight="700">測定の条件</text>
  <g fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5">
    <rect x="214" y="46" width="150" height="30" rx="6"/>
    <rect x="214" y="92" width="150" height="30" rx="6"/>
    <rect x="214" y="138" width="150" height="30" rx="6"/>
  </g>
  <g font-size="13" fill="#1a3a5c">
    <text x="226" y="66">試料温度 25℃</text>
    <text x="226" y="112">針の荷重 100g</text>
    <text x="226" y="158">沈める時間 5秒</text>
  </g>
  <!-- 読み取り : warn -->
  <rect x="214" y="184" width="150" height="52" rx="6" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text x="226" y="206" font-size="13" font-weight="700" fill="#1a3a5c">沈んだ深さを読む</text>
  <text x="226" y="226" fill="#1a3a5c">0.1mm ＝ 針入度1</text>
  <!-- 下段の枠 : surface -->
  <g stroke-width="1.5">
    <rect x="20" y="264" width="360" height="210" rx="6" fill="#f5f5f5" stroke="#d7d7d7"/>
    <path d="M36 322V410H126V322M220 322V410H310V322" fill="none" stroke="#555"/>
    <rect x="37" y="336" width="88" height="73" fill="#d7d7d7"/>
    <rect x="221" y="336" width="88" height="73" fill="#d7d7d7"/>
    <rect x="69" y="298" width="24" height="12" rx="3" fill="#fff3cd" stroke="#d4a017"/>
    <rect x="253" y="298" width="24" height="12" rx="3" fill="#fff3cd" stroke="#d4a017"/>
  </g>
  <text x="34" y="288" font-size="13" font-weight="700">同じ条件なら、軟らかいほど深く沈む</text>
  <g stroke="#555">
    <path d="M37 336H125M221 336H309"/>
  </g>
  <polygon points="79,310 83,310 83,354 81,360 79,354"/>
  <polygon points="263,310 267,310 267,382 265,388 263,382"/>
  <g stroke="#2e6da4">
    <path d="M126 336H148M86 360H148M310 336H332M270 388H332" stroke-dasharray="3 3"/>
    <path d="M142 343V353M326 343V381"/>
  </g>
  <g fill="#2e6da4">
    <polygon points="142,336 139,343 145,343"/>
    <polygon points="142,360 139,353 145,353"/>
    <polygon points="326,336 323,343 329,343"/>
    <polygon points="326,388 323,381 329,381"/>
  </g>
  <g font-size="13" font-weight="700">
    <text x="36" y="432">硬い区分 40〜60</text>
    <text x="220" y="432">軟らかい区分 100〜120</text>
  </g>
  <text x="36" y="452">沈む深さ 4〜6mm</text>
  <text x="220" y="452">沈む深さ 10〜12mm</text>
  <text x="20" y="494" font-size="11" fill="#555">針入度は25℃の一点の硬さ。軟化点・伸度とあわせて読む</text>
</svg>
