<!-- authored 2026-10-15 doboku-note 自作。論点は国土交通省の用地取得のあらましと土地収用法第16条・第20条・第36条・第39条・第116条。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="用地取得の流れと収用への分かれ道を示した図。左の本線は事業計画の説明、幅杭の設置、土地・物件の調査と調書、補償額の算定、補償説明と用地交渉、契約、登記・移転・引渡し、支払いの順。用地交渉で合意できない場合は右の分岐に進み、事業の認定、土地調書・物件調書、収用委員会への裁決申請へ進む。裁決申請の代わりに協議の確認もある。">
