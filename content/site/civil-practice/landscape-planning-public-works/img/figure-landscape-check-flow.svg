<!-- authored 2026-10-16 doboku-note 自作。本文の「担当するときの順番」と各節の条を事業の段階に並べ直した確認の流れ -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="景観の確認の流れを、計画、設計、発注前、着手前の4段階に並べた図。計画で景観行政団体・区域・文化財の種別を確かめる。設計で通知と協議。発注前は実務の目安。着手前に文化財の許可や届出、通知をする。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 12px; fill: #555; }
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .x { font-size: 12px; fill: #222; }
      .s { font-size: 11px; fill: #555; }
      .sb { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .p { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .d { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .g { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .wh { fill: #fff; stroke: #8a8a8a; stroke-width: 1.5; }
      .dz { fill: #fff; stroke: #2e6da4; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .l { stroke: #d7d7d7; stroke-width: 1; fill: none; }
      .a { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .ar { stroke: #b22234; stroke-width: 2; fill: none; }
      .ag { stroke: #3a7d44; stroke-width: 2; fill: none; }
      .ax { stroke: #8a8a8a; stroke-width: 2; fill: none; }
    </style>
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
    <marker id="ahr" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#b22234"/></marker>
    <marker id="ahg" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#3a7d44"/></marker>
    <marker id="ahk" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#8a8a8a"/></marker>
  </defs>
  <rect class="b" x="10" y="10" width="84" height="96" rx="8"/>
  <text class="n" x="52" y="46.0" text-anchor="middle">計画</text>
  <text class="s" x="52" y="62.0" text-anchor="middle">検討を</text>
  <text class="s" x="52" y="78.0" text-anchor="middle">始めたとき</text>
  <rect class="wh" x="102" y="10" width="288" height="96" rx="8"/>
  <text class="x" x="112" y="36.5" text-anchor="start">・景観行政団体か、県の事務か</text>
  <text class="x" x="112" y="53.5" text-anchor="start">・景観計画の区域か（告示・区域図）</text>
  <text class="x" x="112" y="70.5" text-anchor="start">・古い橋や堰は、文化財の種別を教育委員会へ</text>
  <text class="x" x="112" y="87.5" text-anchor="start">・歴史的風致維持向上計画の区域か</text>
  <path class="a" d="M52,107V121" marker-end="url(#ah)"/>
  <rect class="b" x="10" y="122" width="84" height="110" rx="8"/>
  <text class="n" x="52" y="165.0" text-anchor="middle">設計</text>
  <text class="s" x="52" y="181.0" text-anchor="middle">基本設計から</text>
  <text class="s" x="52" y="197.0" text-anchor="middle">実施設計へ</text>
  <rect class="wh" x="102" y="122" width="288" height="110" rx="8"/>
  <text class="x" x="112" y="147.0" text-anchor="start">・景観行政団体へ通知（第16条第5項）</text>
  <text class="x" x="112" y="164.0" text-anchor="start">・協議で、色彩・高さ・素材などの基準に</text>
  <text class="x" x="112" y="181.0" text-anchor="start">　設計を合わせる（第16条第6項）</text>
  <text class="x" x="112" y="198.0" text-anchor="start">・景観重要公共施設なら、整備の事項と</text>
  <text class="x" x="112" y="215.0" text-anchor="start">　占用の基準を設計と審査に反映</text>
  <path class="a" d="M52,233V247" marker-end="url(#ah)"/>
  <rect class="g" x="10" y="248" width="84" height="66" rx="8"/>
  <text class="n" x="52" y="277.0" text-anchor="middle">発注前</text>
  <text class="s" x="52" y="293.0" text-anchor="middle">実務の目安</text>
  <rect class="wh" x="102" y="248" width="288" height="66" rx="8" style="stroke-dasharray:4 3"/>
  <text class="x" x="112" y="268.0" text-anchor="start">・条文の手続ではなく、実務上の注意</text>
  <text class="x" x="112" y="285.0" text-anchor="start">・色や素材の変更は、積算や発注の前</text>
  <text class="x" x="112" y="302.0" text-anchor="start">　でないと直しにくい</text>
  <path class="a" d="M52,315V329" marker-end="url(#ah)"/>
  <rect class="w" x="10" y="330" width="84" height="104" rx="8"/>
  <text class="n" x="52" y="370.0" text-anchor="middle">着手前</text>
  <text class="s" x="52" y="386.0" text-anchor="middle">手続は</text>
  <text class="s" x="52" y="402.0" text-anchor="middle">着手前まで</text>
  <rect class="wh" x="102" y="330" width="288" height="104" rx="8"/>
  <text class="x" x="112" y="343.5" text-anchor="start">・重要文化財の現状変更は、許可を得てから</text>
  <text class="x" x="112" y="360.5" text-anchor="start">　（第43条）</text>
  <text class="x" x="112" y="377.5" text-anchor="start">・登録有形文化財は、現状を変更する日の</text>
  <text class="x" x="112" y="394.5" text-anchor="start">　30日前までに届出（第64条）</text>
  <text class="x" x="112" y="411.5" text-anchor="start">・歴史的風致形成建造物は、あらかじめ</text>
  <text class="x" x="112" y="428.5" text-anchor="start">　市町村長へ通知（第15条）</text>
  <rect class="g" x="10" y="446" width="380" height="46" rx="8"/>
  <text class="s" x="200.0" y="465.0" text-anchor="middle">景観整備方針を一枚にまとめ、</text>
  <text class="s" x="200.0" y="481.0" text-anchor="middle">色や素材の選定の理由を各段階へ引き継ぐ</text>
</svg>
