<!-- authored 2026-10-16 doboku-note 自作。文化財保護法・景観法・歴史まちづくり法の手続を種別ごとに対応させた図 -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="歴史的な橋や堰に関わる4つの種別を、根拠の法律と現状変更の手続で並べた対応図。重要文化財は文化庁長官の許可、登録有形文化財は30日前までの届出、景観重要建造物は景観法の手続、歴史的風致形成建造物は市町村長が指定し、自治体の工事は通知と協議になる。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 12px; fill: #555; }
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .x { font-size: 12px; fill: #222; }
      .s { font-size: 11px; fill: #555; }
      .sb { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .p { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .d { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .g { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .wh { fill: #fff; stroke: #8a8a8a; stroke-width: 1.5; }
      .dz { fill: #fff; stroke: #2e6da4; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .l { stroke: #d7d7d7; stroke-width: 1; fill: none; }
      .a { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .ar { stroke: #b22234; stroke-width: 2; fill: none; }
      .ag { stroke: #3a7d44; stroke-width: 2; fill: none; }
      .ax { stroke: #8a8a8a; stroke-width: 2; fill: none; }
    </style>
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
    <marker id="ahr" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#b22234"/></marker>
    <marker id="ahg" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#3a7d44"/></marker>
    <marker id="ahk" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#8a8a8a"/></marker>
  </defs>
  <text class="s" x="12" y="18" text-anchor="start">種別</text>
  <text class="s" x="162" y="18" text-anchor="start">現状変更の手続</text>
  <rect class="b" x="10" y="26" width="140" height="72" rx="6"/>
  <text class="t" x="18" y="46" text-anchor="start">重要文化財</text>
  <text class="s" x="18" y="62" text-anchor="start">文化財保護法</text>
  <text class="s" x="18" y="78" text-anchor="start">第43条</text>
  <rect class="wh" x="158" y="26" width="232" height="72" rx="6"/>
  <text class="t" x="168" y="46" text-anchor="start">文化庁長官の許可</text>
  <text class="x" x="168" y="62" text-anchor="start">（維持の措置・応急措置は</text>
  <text class="x" x="168" y="78" text-anchor="start">許可の例外）</text>
  <rect class="b" x="10" y="106" width="140" height="112" rx="6"/>
  <text class="t" x="18" y="126" text-anchor="start">登録有形文化財</text>
  <text class="s" x="18" y="142" text-anchor="start">文化財保護法</text>
  <text class="s" x="18" y="158" text-anchor="start">第64条</text>
  <text class="s" x="18" y="174" text-anchor="start">文化庁の登録基準</text>
  <rect class="wh" x="158" y="106" width="232" height="112" rx="6"/>
  <text class="t" x="168" y="126" text-anchor="start">現状を変更する日の30日前</text>
  <text class="t" x="168" y="142" text-anchor="start">までに文化庁長官へ届出</text>
  <text class="x" x="168" y="158" text-anchor="start">（維持の措置・非常災害の</text>
  <text class="x" x="168" y="174" text-anchor="start">応急措置は除く）</text>
  <text class="s" x="168" y="190" text-anchor="start">登録基準は原則建設後50年を経過</text>
  <rect class="p" x="10" y="226" width="140" height="72" rx="6"/>
  <text class="t" x="18" y="246" text-anchor="start">景観重要建造物</text>
  <text class="s" x="18" y="262" text-anchor="start">景観法第19条</text>
  <text class="s" x="18" y="278" text-anchor="start">計画に位置づけて指定</text>
  <rect class="wh" x="158" y="226" width="232" height="72" rx="6"/>
  <text class="t" x="168" y="246" text-anchor="start">景観法の手続が主</text>
  <text class="x" x="168" y="262" text-anchor="start">（国宝・重要文化財などに</text>
  <text class="x" x="168" y="278" text-anchor="start">指定済みのものは対象外）</text>
  <rect class="w" x="10" y="306" width="140" height="100" rx="6"/>
  <text class="t" x="18" y="326" text-anchor="start">歴史的風致形成建造物</text>
  <text class="s" x="18" y="342" text-anchor="start">地域における歴史的</text>
  <text class="s" x="18" y="358" text-anchor="start">風致の維持及び向上</text>
  <text class="s" x="18" y="374" text-anchor="start">に関する法律第12条・</text>
  <text class="s" x="18" y="390" text-anchor="start">第15条</text>
  <rect class="wh" x="158" y="306" width="232" height="100" rx="6"/>
  <text class="t" x="168" y="326" text-anchor="start">市町村長が指定</text>
  <text class="x" x="168" y="342" text-anchor="start">民間は30日前までに届出</text>
  <text class="x" x="168" y="358" text-anchor="start">国・自治体は届出でなく、</text>
  <text class="x" x="168" y="374" text-anchor="start">市町村長への通知と協議</text>
  <rect class="g" x="10" y="414" width="380" height="78" rx="8"/>
  <text class="s" x="200.0" y="441.0" text-anchor="middle">条例で指定した文化財の手続は、市の条例で確かめる</text>
  <text class="s" x="200.0" y="457.0" text-anchor="middle">所有者が市でも、重要文化財の許可と登録有形文化財の</text>
  <text class="s" x="200.0" y="473.0" text-anchor="middle">届出は省かれない</text>
</svg>
