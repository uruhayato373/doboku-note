<!-- authored 2026-10-16 doboku-note 自作。文化財保護法・景観法・歴史まちづくり法の手続を種別ごとに対応させた図 -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="歴史的な橋や堰に関わる4つの種別を、根拠の法律と現状変更の手続で並べた対応図。重要文化財は文化庁長官の許可、登録有形文化財は30日前までの届出、景観重要建造物は景観法の手続、歴史的風致形成建造物は市町村長が指定し、自治体の工事は届出でなく通知と協議になる。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 12px; fill: #222; }
      .tt { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .tb { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .tx { font-size: 12px; fill: #222; }
      .ts { font-size: 11px; fill: #555; }
      .tn { font-size: 13px; font-weight: bold; fill: #222; }
      .b-brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .b-pos { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .b-warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .b-dan { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .b-sur { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .b-wh { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1.5; }
      .a { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .ln { stroke: #8a8a8a; stroke-width: 1; fill: none; }
      .ld { stroke: #8a8a8a; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    </style>
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  </defs>
  <text class="ts" x="12" y="20">種別</text>
  <text class="ts" x="162" y="20">現状変更の手続</text>
  <rect class="b-brand" x="10" y="28" width="140" height="77" rx="6"/>
  <text class="tb" x="18" y="55.6">重要文化財</text>
  <text class="ts" x="18" y="72.6">文化財保護法</text>
  <text class="ts" x="18" y="88">第43条</text>
  <rect class="b-wh" x="158" y="28" width="232" height="77" rx="6"/>
  <text class="tb" x="168" y="53">文化庁長官の許可</text>
  <text class="tx" x="168" y="70">（維持の措置・応急措置は</text>
  <text class="tx" x="168" y="87">許可の例外）</text>
  <rect class="b-brand" x="10" y="115" width="140" height="94" rx="6"/>
  <text class="tb" x="18" y="151.1">登録有形文化財</text>
  <text class="ts" x="18" y="168.1">文化財保護法</text>
  <text class="ts" x="18" y="183.5">第64条</text>
  <rect class="b-wh" x="158" y="115" width="232" height="94" rx="6"/>
  <text class="tb" x="168" y="140">現状を変更する日の30日前</text>
  <text class="tx" x="168" y="157">までに文化庁長官へ届出</text>
  <text class="tx" x="168" y="174">（維持の措置・非常災害の</text>
  <text class="tx" x="168" y="191">応急措置は除く）</text>
  <rect class="b-pos" x="10" y="219" width="140" height="77" rx="6"/>
  <text class="tb" x="18" y="254.3">景観重要建造物</text>
  <text class="ts" x="18" y="271.3">景観法第19条</text>
  <rect class="b-wh" x="158" y="219" width="232" height="77" rx="6"/>
  <text class="tb" x="168" y="244">景観法の手続が主</text>
  <text class="tx" x="168" y="261">（国宝・重要文化財などに</text>
  <text class="tx" x="168" y="278">指定済みのものは対象外）</text>
  <rect class="b-warn" x="10" y="306" width="140" height="94" rx="6"/>
  <text class="tb" x="18" y="326.7">歴史的風致形成建造物</text>
  <text class="ts" x="18" y="343.7">地域における歴史的</text>
  <text class="ts" x="18" y="359.09999999999997">風致の維持及び向上</text>
  <text class="ts" x="18" y="374.5">に関する法律</text>
  <text class="ts" x="18" y="389.9">第12条・第15条</text>
  <rect class="b-wh" x="158" y="306" width="232" height="94" rx="6"/>
  <text class="tb" x="168" y="331">市町村長が指定</text>
  <text class="tx" x="168" y="348">民間は30日前までに届出</text>
  <text class="tx" x="168" y="365">国・自治体は届出でなく、</text>
  <text class="tx" x="168" y="382">市町村長への通知と協議</text>
  <rect class="b-sur" x="10" y="412" width="380" height="78" rx="6"/>
  <text class="ts" x="200.0" y="439.4" text-anchor="middle">条例で指定した文化財の手続は、市の条例で確かめる</text>
  <text class="ts" x="200.0" y="454.8" text-anchor="middle">所有者が市でも、重要文化財の許可と登録有形文化財の</text>
  <text class="ts" x="200.0" y="470.2" text-anchor="middle">届出は省かれない</text>
</svg>
