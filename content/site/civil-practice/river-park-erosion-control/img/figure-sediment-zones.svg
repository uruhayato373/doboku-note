<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="土砂災害に関わる区域を、根拠法・指定する者・制限の中身で比べた一覧図">
<defs><style>
text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;font-size:11px;fill:#555}
.b{font-size:13px;font-weight:bold;fill:#222}
.e{text-anchor:end;fill:#1a3a5c}
</style></defs>
<rect x="20" y="14" width="360" height="70" rx="8" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
<text class="b" x="34" y="36">土砂災害警戒区域（イエロー）</text>
<text x="34" y="56">土砂災害防止法 第7条｜指定: 都道府県知事</text>
<text x="34" y="74">警戒避難体制の整備が中心</text>
<rect x="20" y="90" width="360" height="70" rx="8" fill="#f8d7da" stroke="#b22234" stroke-width="1.5"/>
<text class="b" x="34" y="112">土砂災害特別警戒区域（レッド）</text>
<text x="34" y="132">土砂災害防止法 第9条｜指定: 都道府県知事</text>
<text x="34" y="150">特定開発行為の許可・構造規制・移転勧告</text>
<rect x="20" y="166" width="360" height="70" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<text class="b" x="34" y="188">砂防指定地</text>
<text class="e" x="366" y="188">砂防三法</text>
<text x="34" y="208">砂防法 第2条｜指定: 国土交通大臣</text>
<text x="34" y="226">行為の禁止・制限は都道府県知事（第4条）</text>
<rect x="20" y="242" width="360" height="70" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<text class="b" x="34" y="264">地すべり防止区域</text>
<text class="e" x="366" y="264">砂防三法</text>
<text x="34" y="284">地すべり等防止法 第3条｜指定: 主務大臣</text>
<text x="34" y="302">地下水・切土などは知事の許可（第18条）</text>
<rect x="20" y="318" width="360" height="70" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<text class="b" x="34" y="340">急傾斜地崩壊危険区域</text>
<text class="e" x="366" y="340">砂防三法</text>
<text x="34" y="360">急傾斜地法 第3条｜指定: 都道府県知事</text>
<text x="34" y="378">崩壊のおそれのある30度以上の斜面。行為は許可制</text>
<rect x="20" y="394" width="360" height="70" rx="8" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
<text class="b" x="34" y="416">山地災害危険地区</text>
<text x="34" y="436">林野庁の所管｜治山事業側の区分</text>
<text x="34" y="454">林野庁・都道府県が調査して公表する区分</text>
</svg>
