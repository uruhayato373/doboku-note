<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
     style="max-width:400px;width:100%"
     role="img"
     aria-label="河川の断面を構成する堤防・天端・法線・低水路・高水敷の位置関係を示す断面図">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-title { font-size: 13px; font-weight: bold; fill: #222; }
      .t-label { font-size: 11px; fill: #555; }
      .box-brand    { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-positive { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-surface  { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
  </defs>

  <text class="t-label" x="200" y="18" text-anchor="middle" font-size="12">河川の断面（片岸のみ）</text>

  <!-- 堤防（台形） -->
  <polygon points="20,150 90,40 150,40 130,150" class="box-surface"/>
  <text class="t-label" x="115" y="45" text-anchor="middle">天端</text>
  <line x1="90" y1="40" x2="150" y2="40" stroke="#222" stroke-width="2"/>

  <!-- 高水敷 -->
  <rect class="box-positive" x="150" y="120" width="90" height="30"/>

  <!-- 低水路 -->
  <rect class="box-brand" x="240" y="130" width="120" height="20"/>

  <line x1="20" y1="150" x2="360" y2="150" stroke="#222" stroke-width="2"/>

  <!-- 引き出し線とラベル -->
  <line x1="60" y1="150" x2="60" y2="175" stroke="#8a8a8a" stroke-width="1"/>
  <text class="t-label" x="60" y="188" text-anchor="middle">堤防</text>

  <line x1="195" y1="150" x2="195" y2="175" stroke="#8a8a8a" stroke-width="1"/>
  <text class="t-label" x="195" y="188" text-anchor="middle">高水敷</text>

  <line x1="300" y1="150" x2="300" y2="175" stroke="#8a8a8a" stroke-width="1"/>
  <text class="t-label" x="300" y="188" text-anchor="middle">低水路</text>

  <text class="t-label" x="200" y="210" text-anchor="middle">法線 ＝ 法肩（のり面の上端）を結んだ平面上の線</text>

  <line x1="15" y1="230" x2="385" y2="230" stroke="#d7d7d7" stroke-width="1"/>

  <!-- 定義カード -->
  <rect class="box-surface" x="20" y="245" width="360" height="55" rx="8"/>
  <text class="t-title" x="40" y="266">天端</text>
  <text class="t-label" x="40" y="285">堤防の最上部。巡視・水防活動の幅を確保</text>

  <rect class="box-positive" x="20" y="310" width="360" height="55" rx="8"/>
  <text class="t-title" x="40" y="331">高水敷</text>
  <text class="t-label" x="40" y="350">増水時に水が乗る部分。公園等でも河川区域内</text>

  <rect class="box-brand" x="20" y="375" width="360" height="55" rx="8"/>
  <text class="t-title" x="40" y="396">低水路</text>
  <text class="t-label" x="40" y="415">常時水が流れている部分</text>

  <rect class="box-surface" x="20" y="440" width="360" height="45" rx="8"/>
  <text class="t-title" x="40" y="459">小段</text>
  <text class="t-label" x="40" y="478">のり面途中の平坦部（図は省略）</text>
</svg>
