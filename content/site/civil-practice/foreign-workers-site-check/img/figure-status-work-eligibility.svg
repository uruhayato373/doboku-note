<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="現場で働けるかを在留資格の区分で整理した図。活動に制限がない身分は仕事の内容に制限なし。特定技能と技能実習は制度の条件つき。特定活動は指定書の活動だけ。原則就労不可の資格は許可欄の範囲だけ。専門的な業務の資格は作業員の仕事が範囲外" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
<rect width="400" height="500" fill="#ffffff"/>
<g stroke-width="1.5">
<rect x="18" y="14" width="364" height="78" rx="8" fill="#d0e8d0" stroke="#3a7d44"/>
<rect x="18" y="102" width="364" height="78" rx="8" fill="#e8f0fe" stroke="#2e6da4"/>
<rect x="18" y="190" width="364" height="78" rx="8" fill="#fff3cd" stroke="#d4a017"/>
<rect x="18" y="278" width="364" height="78" rx="8" fill="#fff3cd" stroke="#d4a017"/>
<rect x="18" y="366" width="364" height="78" rx="8" fill="#f8d7da" stroke="#b22234"/>
</g>
<g stroke="#8a8a8a" stroke-width="1">
<line x1="226" y1="24" x2="226" y2="82"/>
<line x1="226" y1="112" x2="226" y2="170"/>
<line x1="226" y1="200" x2="226" y2="258"/>
<line x1="226" y1="288" x2="226" y2="346"/>
<line x1="226" y1="376" x2="226" y2="434"/>
</g>
<g fill="#222" font-size="13" font-weight="700">
<text x="30" y="41">活動に制限がない身分</text>
<text x="238" y="41">現場作業に就ける</text>
<text x="30" y="129">制度で受け入れる</text>
<text x="238" y="129">制度の条件つき</text>
<text x="30" y="217">特定活動</text>
<text x="238" y="217">指定書の活動だけ</text>
<text x="30" y="305">原則就労不可の資格</text>
<text x="238" y="305">許可欄の範囲だけ</text>
<text x="30" y="393">専門的な業務の資格</text>
<text x="238" y="393">作業員は範囲外</text>
</g>
<g fill="#555" font-size="11">
<text x="30" y="62">永住者・日本人の配偶者等</text>
<text x="30" y="79">永住者の配偶者等・定住者</text>
<text x="238" y="62">仕事の内容に制限なし</text>
<text x="238" y="79">それでも確認は省かない</text>
<text x="30" y="150">特定技能・技能実習</text>
<text x="30" y="167">（令和9年4月から育成就労）</text>
<text x="238" y="150">受入れ会社が条件を満たし</text>
<text x="238" y="167">雇用して受け入れる</text>
<text x="30" y="238">ワーキングホリデーなど</text>
<text x="30" y="255">個々の許可で内容が決まる</text>
<text x="238" y="238">指定書で活動の内容を</text>
<text x="238" y="255">確かめる</text>
<text x="30" y="326">留学・家族滞在・文化活動</text>
<text x="30" y="343">短期滞在・研修</text>
<text x="238" y="326">許可がなければ雇えない</text>
<text x="238" y="343">許可は原則週28時間以内</text>
<text x="30" y="414">技術・人文知識・国際業務など</text>
<text x="30" y="431">業務の内容が資格の範囲か</text>
<text x="238" y="414">認められた活動の外に</text>
<text x="238" y="431">なる仕事は不法就労</text>
</g>
<g fill="#555" font-size="11">
<text x="20" y="468">まず在留カードの就労制限の表示と許可欄で区分を決め、</text>
<text x="20" y="485">次に、その仕事が区分の範囲に収まるかを確かめる</text>
</g>
</svg>
