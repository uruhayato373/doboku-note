<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
     style="max-width:400px;width:100%"
     role="img"
     aria-label="盛土の締固め管理で品質規定方式と工法規定方式を比較し、品質規定方式を選んだ場合の三つの管理方法と適する土質を示す図">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-summary { font-size: 11px; fill: #555; } /* ink-body */
      .t-heading { font-size: 14px; font-weight: bold; fill: #1a3a5c; } /* brand-text */
      .t-method { font-size: 13px; font-weight: bold; fill: #222; } /* ink-strong */
      .t-label { font-size: 11px; font-weight: bold; fill: #555; } /* ink-body */
      .t-text { font-size: 11px; fill: #222; } /* ink-strong */
      .t-strong { font-size: 12px; font-weight: bold; fill: #222; } /* ink-strong */
      .box-brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; } /* brand-fill / brand */
      .box-surface { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; } /* surface / token-border */
      .box-positive { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; } /* positive-fill / positive */
      .box-warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; } /* warn-fill / warn */
      .connector { fill: none; stroke: #2e6da4; stroke-width: 2; } /* brand */
      .arrow-brand { fill: #2e6da4; } /* brand */
    </style>
    <marker id="branch-arrow" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon class="arrow-brand" points="0,0 8,3.5 0,7"/>
    </marker>
  </defs>

  <text class="t-summary" x="20" y="18">数値は目安。仕様書の規格値・指定方式を優先する</text>

  <rect class="box-brand" x="15" y="31" width="178" height="142" rx="8"/>
  <text class="t-heading" x="104" y="54" text-anchor="middle">品質規定方式</text>
  <text class="t-label" x="28" y="77">規定するもの</text>
  <text class="t-strong" x="28" y="96">到達すべき品質の値</text>
  <text class="t-label" x="28" y="123">向く現場</text>
  <text class="t-strong" x="28" y="142">土質にばらつきがある</text>

  <rect class="box-surface" x="207" y="31" width="178" height="142" rx="8"/>
  <text class="t-heading" x="296" y="54" text-anchor="middle">工法規定方式</text>
  <text class="t-label" x="220" y="77">規定するもの</text>
  <text class="t-text" x="220" y="96">機械・まき出し厚さ・</text>
  <text class="t-strong" x="220" y="113">締固め回数</text>
  <text class="t-label" x="220" y="128">向く現場</text>
  <text class="t-text" x="220" y="145">土質が均質</text>
  <text class="t-text" x="220" y="161">試験施工で妥当性を確認</text>

  <line class="connector" x1="104" y1="174" x2="104" y2="198" marker-end="url(#branch-arrow)"/>
  <text class="t-label" x="124" y="192">品質規定方式を選んだ場合</text>

  <rect class="box-brand" x="15" y="206" width="370" height="82" rx="8"/>
  <text class="t-method" x="28" y="228">乾燥密度（締固め度 Dc）</text>
  <text class="t-text" x="28" y="247">目安｜管理単位の現場乾燥密度の平均値が</text>
  <text class="t-strong" x="61" y="264">最大乾燥密度の92%以上</text>
  <text class="t-text" x="28" y="281">適する土質｜自然含水比が低い砂質土</text>

  <rect class="box-warn" x="15" y="296" width="370" height="104" rx="8"/>
  <text class="t-method" x="28" y="318">空気間隙率・飽和度</text>
  <text class="t-text" x="28" y="337">目安｜砂質土：空気間隙率15%以下</text>
  <text class="t-text" x="61" y="354">粘性土：飽和度85〜95% または</text>
  <text class="t-strong" x="61" y="371">空気間隙率2〜10%</text>
  <text class="t-text" x="28" y="390">適する土質｜含水比が高いシルト・粘性土</text>

  <rect class="box-positive" x="15" y="408" width="370" height="80" rx="8"/>
  <text class="t-method" x="28" y="430">強度・変形特性</text>
  <text class="t-text" x="28" y="449">試験｜CBR試験・平板載荷試験・コーン貫入試験</text>
  <text class="t-text" x="61" y="465">プルーフローリング</text>
  <text class="t-text" x="28" y="482">適する土質｜密度評価がなじまない土質</text>
</svg>
