  <rect class="cw" x="108" y="313" width="40" height="20" rx="10"/><text class="t" x="128" y="327" text-anchor="middle">ASR</text>
  <text class="o" x="196" y="327">国官技第112号（直轄）</text>
  <path class="ar" d="M200,346V358" marker-end="url(#ah)"/>
  <rect class="zone" x="16" y="360" width="368" height="54" rx="8"/>
  <text class="n" x="28" y="380">平成14年9月以降に竣工（直轄）</text>
  <rect class="cd" x="28" y="388" width="36" height="18" rx="9"/><text class="t" x="46" y="401" text-anchor="middle">疑い</text>
  <text class="o" x="72" y="401">優先順位を下げるにとどめる（外さない）</text>
  <rect class="zone" x="16" y="428" width="368" height="62" rx="8"/>
  <rect class="cp" x="28" y="438" width="48" height="20" rx="10"/><text class="t" x="52" y="452" text-anchor="middle">かぶり</text>
  <text class="n" x="86" y="453">どの年代でも、規定値と実際は別</text>
  <text class="o" x="28" y="478">竣工年にかかわらず実測する</text>
