<!-- authored 2026-10-15 doboku-note 自作。論点は塩化物の規制・アルカリシリカ反応（ASR）対策・かぶりの主な基準の移り変わりを竣工年の帯に並べ、年代から構造物の弱点を読む整理。年は本文に出てくるものだけ。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="塩化物の規制、アルカリシリカ反応の対策、かぶりの主な基準を年代順に並べ、竣工年から構造物の弱点を読む図。昭和61年より前の竣工は内在塩とアルカリシリカ反応を疑い、昭和61年6月から平成14年8月の竣工は骨材が成績表の確認だけだった可能性があるアルカリシリカ反応を疑い、平成14年9月以降の直轄は優先順位を下げるにとどめて疑いは外さない。かぶりはどの年代でも規定値と実際が別なので実測する。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 12px; fill: #555; }
      .n { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .y { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .o { font-size: 12px; fill: #222; }
      .zone { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .row { fill: #fff; stroke: #d7d7d7; stroke-width: 1; }
      .cb { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; } /* brand-fill / brand */
      .cw { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; } /* warn-fill / warn */
      .cp { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; } /* positive-fill / positive */
      .cd { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; } /* danger-fill / danger */
      .ar { stroke: #2e6da4; stroke-width: 2; fill: none; }
    </style>
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
  </defs>

  <rect class="zone" x="16" y="10" width="368" height="144" rx="8"/>
