  <rect class="cd" x="28" y="196" width="36" height="18" rx="9"/><text class="t" x="46" y="209" text-anchor="middle">疑い</text>
  <text class="o" x="72" y="209">ASR：骨材は成績表の確認だけの可能性</text>
  <rect class="row" x="28" y="220" width="344" height="26" rx="5"/>
  <text class="y" x="38" y="237">昭和61年</text>
  <rect class="cb" x="108" y="223" width="38" height="20" rx="10"/><text class="t" x="127" y="237" text-anchor="middle">塩分</text>
  <rect class="cw" x="150" y="223" width="38" height="20" rx="10"/><text class="t" x="169" y="237" text-anchor="middle">ASR</text>
