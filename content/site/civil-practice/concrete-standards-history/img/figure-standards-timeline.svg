  <rect class="cp" x="108" y="283" width="48" height="20" rx="10"/><text class="t" x="132" y="297" text-anchor="middle">かぶり</text>
  <text class="o" x="196" y="297">国官技第61号（スペーサー）</text>
  <rect class="row" x="28" y="310" width="344" height="26" rx="5"/>
