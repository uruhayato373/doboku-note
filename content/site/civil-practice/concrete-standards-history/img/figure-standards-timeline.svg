  <text class="o" x="72" y="49">内在塩・ASR（反応性骨材を排除できない）</text>
  <rect class="row" x="28" y="60" width="344" height="26" rx="5"/>
  <text class="y" x="38" y="77">昭和47年</text>
  <rect class="cp" x="108" y="63" width="48" height="20" rx="10"/><text class="t" x="132" y="77" text-anchor="middle">かぶり</text>
  <text class="o" x="196" y="77">床版の最小かぶり30mm</text>
  <rect class="row" x="28" y="90" width="344" height="26" rx="5"/>
  <text class="y" x="38" y="107">昭和49年</text>
  <rect class="cb" x="108" y="93" width="40" height="20" rx="10"/><text class="t" x="128" y="107" text-anchor="middle">塩分</text>
  <text class="o" x="196" y="107">示方書：NaCl換算0.10%</text>
  <rect class="row" x="28" y="120" width="344" height="26" rx="5"/>
  <text class="y" x="38" y="137">昭和53年</text>
  <rect class="cb" x="108" y="123" width="40" height="20" rx="10"/><text class="t" x="128" y="137" text-anchor="middle">塩分</text>
  <text class="o" x="196" y="137">JIS A 5308に塩化物の規定</text>
  <path class="ar" d="M200,156V168" marker-end="url(#ah)"/>
  <rect class="zone" x="16" y="170" width="368" height="174" rx="8"/>
