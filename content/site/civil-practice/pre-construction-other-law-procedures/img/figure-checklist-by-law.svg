<!-- authored 2026-11-25 doboku-note 自作。論点は建設リサイクル法・景観法・文化財保護法・森林法・土壌汚染対策法・盛土規制法・自然公園法・航空法・都市計画法の、自治体が発注者のときの扱い。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="着工前に確かめる法令の確認表。左に法令と対象の目安、右に市町村が発注者のときの扱い。建設リサイクル法・景観法・文化財保護法は通知。森林法の林地開発は適用除外。保安林・土壌汚染対策法・自然公園法・都市計画法は許可か届出が要る。盛土規制法と航空法は要確認。">
