<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="セーフティ・アセスメントの流れ。基礎資料の収集、基本事項の対策確認、特有災害の危険度の格付け、危険度に見合う対策の検討の4段階のあと、評価後の措置を書面にする。指針は圧気・鋼橋・推進・PC橋・シールド・山岳トンネルの6種">
<style>text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }</style>
<rect x="44" y="10" width="344" height="54" rx="6" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
<text x="56" y="29" text-anchor="start" font-size="12" font-weight="bold" fill="#1a3a5c">基礎資料を集める</text>
<text x="56" y="44" text-anchor="start" font-size="11" fill="#222">地形・地質・設計図書・類似工事の記録</text>
<text x="56" y="59" text-anchor="start" font-size="11" fill="#222">災害情報・関係法令</text>
<circle cx="26" cy="37" r="12" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<text x="26" y="41" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">1</text>
<line x1="216" y1="65" x2="216" y2="72" stroke="#8a8a8a" stroke-width="1.5"/>
<path d="M211 71 L221 71 L216 78 Z" fill="#8a8a8a"/>
<rect x="44" y="79" width="344" height="54" rx="6" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
<text x="56" y="98" text-anchor="start" font-size="12" font-weight="bold" fill="#1a3a5c">基本事項の対策を確かめる</text>
<text x="56" y="113" text-anchor="start" font-size="11" fill="#222">施工管理体制・教育・設備などを評価表で確認</text>
<text x="56" y="128" text-anchor="start" font-size="11" fill="#222">足りなければ施工計画を変更</text>
<circle cx="26" cy="106" r="12" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<text x="26" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">2</text>
<line x1="216" y1="134" x2="216" y2="141" stroke="#8a8a8a" stroke-width="1.5"/>
<path d="M211 140 L221 140 L216 147 Z" fill="#8a8a8a"/>
<rect x="44" y="148" width="344" height="54" rx="6" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
<text x="56" y="167" text-anchor="start" font-size="12" font-weight="bold" fill="#1a3a5c">特有災害を格付けする</text>
<text x="56" y="182" text-anchor="start" font-size="11" fill="#222">ガス爆発・坑内火災・酸欠・有害ガス・異常出水</text>
<text x="56" y="197" text-anchor="start" font-size="11" fill="#222">地質・断面・延長・たて坑の深さなどでランクを付ける</text>
<circle cx="26" cy="175" r="12" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<text x="26" y="179" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">3</text>
<line x1="216" y1="203" x2="216" y2="210" stroke="#8a8a8a" stroke-width="1.5"/>
<path d="M211 209 L221 209 L216 216 Z" fill="#8a8a8a"/>
<rect x="44" y="217" width="344" height="54" rx="6" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
<text x="56" y="236" text-anchor="start" font-size="12" font-weight="bold" fill="#1a3a5c">危険度に見合う対策を検討する</text>
<text x="56" y="251" text-anchor="start" font-size="11" fill="#222">ランクごとの対策が施工計画書に入っているか確認</text>
<text x="56" y="266" text-anchor="start" font-size="11" fill="#222">足りない対策は施工計画へ反映する</text>
<circle cx="26" cy="244" r="12" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<text x="26" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">4</text>
<line x1="216" y1="272" x2="216" y2="279" stroke="#8a8a8a" stroke-width="1.5"/>
<path d="M211 278 L221 278 L216 285 Z" fill="#8a8a8a"/>
<rect x="44" y="286" width="344" height="54" rx="6" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
<text x="56" y="305" text-anchor="start" font-size="12" font-weight="bold" fill="#1a3a5c">評価後の措置を書面にする</text>
<text x="56" y="320" text-anchor="start" font-size="11" fill="#222">是正の時期・方法・確認方法を明らかにする</text>
<text x="56" y="335" text-anchor="start" font-size="11" fill="#222">施工中はチェックリストとして使う</text>
<text x="12" y="362" text-anchor="start" font-size="11" font-weight="bold" fill="#555">指針がある工事（工事の種類ごとに公表）</text>
<rect x="12" y="370" width="186" height="23" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
<text x="105" y="385.35" text-anchor="middle" font-size="11" fill="#222">圧気シールド・ケーソン</text>
<rect x="202" y="370" width="186" height="23" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
<text x="295" y="385.35" text-anchor="middle" font-size="11" fill="#222">鋼橋架設</text>
<rect x="12" y="397" width="186" height="23" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
<text x="105" y="412.35" text-anchor="middle" font-size="11" fill="#222">推進</text>
<rect x="202" y="397" width="186" height="23" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
<text x="295" y="412.35" text-anchor="middle" font-size="11" fill="#222">PC橋架設</text>
<rect x="12" y="424" width="186" height="23" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
<text x="105" y="439.35" text-anchor="middle" font-size="11" fill="#222">シールド</text>
<rect x="202" y="424" width="186" height="23" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
<text x="295" y="439.35" text-anchor="middle" font-size="11" fill="#222">山岳トンネル</text>
</svg>
