<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="作業主任者を選任する主な作業と資格区分。免許は高圧室内作業とガス溶接のみで、地山の掘削・土止め支保工・ずい道・型枠支保工・足場・橋の架設・コンクリート造の解体・酸欠作業などは技能講習修了者から選ぶ">
<style>text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }</style>
<rect x="12" y="10" width="240" height="36" rx="6" fill="#f8d7da" stroke="#b22234" stroke-width="1"/>
<text x="20" y="25.35" text-anchor="start" font-size="11" fill="#222">高圧室内作業</text>
<text x="20" y="38.35" text-anchor="start" font-size="11" fill="#222">圧気工法の作業室・シャフト内の作業</text>
<rect x="256" y="10" width="132" height="36" rx="6" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
<text x="322" y="25.35" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">免許</text>
<text x="322" y="38.35" text-anchor="middle" font-size="11" fill="#222">高圧室内作業主任者</text>
<rect x="12" y="50" width="240" height="36" rx="6" fill="#f8d7da" stroke="#b22234" stroke-width="1"/>
<text x="20" y="65.35" text-anchor="start" font-size="11" fill="#222">アセチレン溶接装置・ガス集合溶接</text>
<text x="20" y="78.35" text-anchor="start" font-size="11" fill="#222">装置を用いる溶接・溶断・加熱</text>
<rect x="256" y="50" width="132" height="36" rx="6" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
<text x="322" y="65.35" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">免許</text>
<text x="322" y="78.35" text-anchor="middle" font-size="11" fill="#222">ガス溶接作業主任者</text>
<rect x="12" y="90" width="240" height="49" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1"/>
<text x="20" y="105.35" text-anchor="start" font-size="11" fill="#222">地山の掘削：掘削面の高さ2m以上</text>
<text x="20" y="118.35" text-anchor="start" font-size="11" fill="#222">土止め支保工：切りばり・腹起こしの</text>
<text x="20" y="131.35" text-anchor="start" font-size="11" fill="#222">取付け・取外し</text>
<rect x="256" y="90" width="132" height="49" rx="6" fill="#ffffff" stroke="#2e6da4" stroke-width="1"/>
<text x="322" y="105.35" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">技能講習</text>
<text x="322" y="118.35" text-anchor="middle" font-size="11" fill="#222">地山の掘削及び</text>
<text x="322" y="131.35" text-anchor="middle" font-size="11" fill="#222">土止め支保工</text>
<rect x="12" y="143" width="240" height="49" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1"/>
<text x="20" y="158.35" text-anchor="start" font-size="11" fill="#222">ずい道等の掘削・ずり積み・支保工・</text>
<text x="20" y="171.35" text-anchor="start" font-size="11" fill="#222">吹付けと、覆工（型枠支保工の組立て・</text>
<text x="20" y="184.35" text-anchor="start" font-size="11" fill="#222">移動・解体、コンクリート打設）</text>
<rect x="256" y="143" width="132" height="49" rx="6" fill="#ffffff" stroke="#2e6da4" stroke-width="1"/>
<text x="322" y="158.35" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">技能講習</text>
<text x="322" y="171.35" text-anchor="middle" font-size="11" fill="#222">掘削等と覆工は</text>
<text x="322" y="184.35" text-anchor="middle" font-size="11" fill="#222">別々の講習</text>
<rect x="12" y="196" width="240" height="36" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1"/>
<text x="20" y="211.35" text-anchor="start" font-size="11" fill="#222">型枠支保工の組立て・解体</text>
<text x="20" y="224.35" text-anchor="start" font-size="11" fill="#222">高さの下限なし</text>
<rect x="256" y="196" width="132" height="36" rx="6" fill="#ffffff" stroke="#2e6da4" stroke-width="1"/>
<text x="322" y="211.35" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">技能講習</text>
<text x="322" y="224.35" text-anchor="middle" font-size="11" fill="#222">型枠支保工の組立て等</text>
<rect x="12" y="236" width="240" height="36" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1"/>
<text x="20" y="251.35" text-anchor="start" font-size="11" fill="#222">足場の組立て・解体・変更</text>
<text x="20" y="264.35" text-anchor="start" font-size="11" fill="#222">つり足場・張出し足場・高さ5m以上</text>
<rect x="256" y="236" width="132" height="36" rx="6" fill="#ffffff" stroke="#2e6da4" stroke-width="1"/>
<text x="322" y="251.35" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">技能講習</text>
<text x="322" y="264.35" text-anchor="middle" font-size="11" fill="#222">足場の組立て等</text>
<rect x="12" y="276" width="240" height="49" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1"/>
<text x="20" y="291.35" text-anchor="start" font-size="11" fill="#222">橋梁の上部構造の架設等</text>
<text x="20" y="304.35" text-anchor="start" font-size="11" fill="#222">高さ5m以上、または支間30m以上の部分</text>
<text x="20" y="317.35" text-anchor="start" font-size="11" fill="#222">解体は鋼橋のみが対象</text>
<rect x="256" y="276" width="132" height="49" rx="6" fill="#ffffff" stroke="#2e6da4" stroke-width="1"/>
<text x="322" y="291.35" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">技能講習</text>
<text x="322" y="304.35" text-anchor="middle" font-size="11" fill="#222">鋼橋架設等／</text>
<text x="322" y="317.35" text-anchor="middle" font-size="11" fill="#222">コンクリート橋架設等</text>
<rect x="12" y="329" width="240" height="36" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1"/>
<text x="20" y="344.35" text-anchor="start" font-size="11" fill="#222">コンクリート造の工作物の解体・破壊</text>
<text x="20" y="357.35" text-anchor="start" font-size="11" fill="#222">高さ5m以上</text>
<rect x="256" y="329" width="132" height="36" rx="6" fill="#ffffff" stroke="#2e6da4" stroke-width="1"/>
<text x="322" y="344.35" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">技能講習</text>
<text x="322" y="357.35" text-anchor="middle" font-size="11" fill="#222">コンクリート造解体等</text>
<rect x="12" y="369" width="240" height="36" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1"/>
<text x="20" y="390.85" text-anchor="start" font-size="11" fill="#222">コンクリート破砕器による破砕の作業</text>
<rect x="256" y="369" width="132" height="36" rx="6" fill="#ffffff" stroke="#2e6da4" stroke-width="1"/>
<text x="322" y="384.35" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">技能講習</text>
<text x="322" y="397.35" text-anchor="middle" font-size="11" fill="#222">コンクリート破砕器</text>
<rect x="12" y="409" width="240" height="36" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1"/>
<text x="20" y="424.35" text-anchor="start" font-size="11" fill="#222">酸素欠乏危険場所での作業</text>
<text x="20" y="437.35" text-anchor="start" font-size="11" fill="#222">第2種（硫化水素）は別の講習も</text>
<rect x="256" y="409" width="132" height="36" rx="6" fill="#ffffff" stroke="#2e6da4" stroke-width="1"/>
<text x="322" y="424.35" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">技能講習</text>
<text x="322" y="437.35" text-anchor="middle" font-size="11" fill="#222">酸素欠乏危険作業</text>
<rect x="12" y="453" width="14" height="14" rx="3" fill="#f8d7da" stroke="#b22234" stroke-width="1"/>
<text x="32" y="464" text-anchor="start" font-size="11" fill="#222">免許（法72条）</text>
<rect x="140" y="453" width="14" height="14" rx="3" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1"/>
<text x="160" y="464" text-anchor="start" font-size="11" fill="#222">技能講習（法76条）</text>
<text x="12" y="485" text-anchor="start" font-size="11" fill="#555">ほか：有機溶剤・石綿・木材加工用機械も技能講習</text>
</svg>
