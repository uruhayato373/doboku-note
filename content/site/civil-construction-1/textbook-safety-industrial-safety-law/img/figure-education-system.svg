<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="安全衛生教育を受ける時期で4つに分けた図。就くとき（雇入れ・特別教育・職長等教育・作業指揮者の指名）、おおむね5年ごと、年齢と年数の節目（45歳・取得から10年）、労働災害の後（法99条の2・3の講習）">
<style>text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }</style>
<rect x="12" y="10" width="376" height="118" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<text x="22" y="32" text-anchor="start" font-size="13" font-weight="bold" fill="#1a3a5c">就くとき・始めるとき</text>
<text x="166" y="32" text-anchor="start" font-size="11" fill="#555">はじめに受ける教育</text>
<text x="22" y="55" text-anchor="start" font-size="12" fill="#222">・雇入れ時、作業内容の変更時（法59条1・2項）</text>
<text x="22" y="74" text-anchor="start" font-size="12" fill="#222">・特別教育：業務に初めて就くとき（法59条3項）</text>
<text x="22" y="93" text-anchor="start" font-size="12" fill="#222">・職長等教育：初めて職長等に就くとき（法60条）</text>
<text x="22" y="112" text-anchor="start" font-size="12" fill="#222">・作業指揮者：初めて指名されたとき（要綱）</text>
<rect x="12" y="136" width="376" height="118" rx="6" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
<text x="22" y="158" text-anchor="start" font-size="13" font-weight="bold" fill="#1a3a5c">おおむね5年ごと</text>
<text x="140" y="158" text-anchor="start" font-size="11" fill="#555">能力向上・再教育</text>
<text x="22" y="181" text-anchor="start" font-size="12" fill="#222">・危険有害業務の従事者教育（法60条の2）</text>
<text x="22" y="200" text-anchor="start" font-size="12" fill="#222">・作業主任者・安全管理者の能力向上教育</text>
<text x="36" y="219" text-anchor="start" font-size="12" fill="#222">（法19条の2、要綱）</text>
<text x="22" y="238" text-anchor="start" font-size="12" fill="#222">・職長等・安全衛生責任者の再教育（通達）</text>
<rect x="12" y="262" width="376" height="99" rx="6" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
<text x="22" y="284" text-anchor="start" font-size="13" font-weight="bold" fill="#1a3a5c">年齢・年数の節目</text>
<text x="140" y="284" text-anchor="start" font-size="11" fill="#555">要綱が示す目安</text>
<text x="22" y="307" text-anchor="start" font-size="12" fill="#222">・高齢時教育：おおむね45歳に達したとき</text>
<text x="22" y="326" text-anchor="start" font-size="12" fill="#222">・危険再認識教育：免許取得・特別教育修了</text>
<text x="36" y="345" text-anchor="start" font-size="12" fill="#222">からおおむね10年以上</text>
<rect x="12" y="369" width="376" height="99" rx="6" fill="#f8d7da" stroke="#b22234" stroke-width="1.5"/>
<text x="22" y="391" text-anchor="start" font-size="13" font-weight="bold" fill="#1a3a5c">労働災害の後</text>
<text x="114" y="391" text-anchor="start" font-size="11" fill="#555">都道府県労働局長の指示</text>
<text x="22" y="414" text-anchor="start" font-size="12" fill="#222">・法99条の2：事業者に指示し、管理者らに講習</text>
<text x="36" y="433" text-anchor="start" font-size="12" fill="#222">を受けさせる</text>
<text x="22" y="452" text-anchor="start" font-size="12" fill="#222">・法99条の3：資格者本人に再発防止の講習を指示</text>
<text x="12" y="488" text-anchor="start" font-size="11" fill="#555">法＝条文　要綱＝安全衛生教育等推進要綱（通達）</text>
</svg>
