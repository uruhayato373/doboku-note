<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="プレキャストL型擁壁の施工手順（排水工は考慮しない）。準備工のあと、(1)床掘工、基礎砕石工、均しコンクリート工、敷きモルタル工、(2)据付工、(3)埋戻し・締固め工、路床工、後片付け工の順に進み、解答の工種ごとに機械と確認項目を答える">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-lab   { font-size: 12px; fill: #222; }
      .t-key   { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .t-pos   { font-size: 12px; font-weight: bold; fill: #3a7d44; }
      .t-note  { font-size: 11px; fill: #222; }
      .b-brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .b-pos   { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box     { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .arr     { stroke: #2e6da4; stroke-width: 1.5; fill: none; }
      .ln      { stroke: #8a8a8a; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="ar" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 9,4 0,8" fill="#2e6da4"/>
    </marker>
  </defs>

  <text class="t-title" x="200" y="28" text-anchor="middle">プレキャストL型擁壁の施工手順</text>
  <text class="t-lead" x="200" y="50" text-anchor="middle">排水工は考慮しない。緑の枠が設問(1)〜(3)の解答</text>

  <rect class="b-brand" x="16" y="64" width="160" height="26" rx="6"/><text class="t-lab" x="96" y="81" text-anchor="middle">準備工（丁張りなど）</text>
  <line class="arr" x1="96" y1="90" x2="96" y2="106" marker-end="url(#ar)"/>

  <rect class="b-pos" x="16" y="106" width="160" height="40" rx="6"/><text class="t-pos" x="96" y="130" text-anchor="middle">(1) 床掘工</text>
  <line class="ln" x1="176" y1="126" x2="188" y2="126"/>
  <rect class="box" x="188" y="106" width="196" height="40" rx="6"/>
  <text class="t-key" x="196" y="123">機械</text><text class="t-note" x="226" y="123">バックホウ</text>
  <text class="t-key" x="196" y="138">確認</text><text class="t-note" x="226" y="138">幅・深さ</text>
  <line class="arr" x1="96" y1="146" x2="96" y2="162" marker-end="url(#ar)"/>

  <rect class="b-brand" x="16" y="162" width="160" height="26" rx="6"/><text class="t-lab" x="96" y="179" text-anchor="middle">基礎砕石工</text>
  <line class="arr" x1="96" y1="188" x2="96" y2="204" marker-end="url(#ar)"/>

  <rect class="b-brand" x="16" y="204" width="160" height="40" rx="6"/><text class="t-lab" x="96" y="228" text-anchor="middle">均しコンクリート工</text>
  <line class="ln" x1="176" y1="224" x2="188" y2="224"/>
  <rect class="box" x="188" y="204" width="196" height="40" rx="6"/>
  <text class="t-note" x="196" y="221">型枠設置、コンクリート打込み、</text>
  <text class="t-note" x="196" y="236">養生、型枠脱型</text>
  <line class="arr" x1="96" y1="244" x2="96" y2="260" marker-end="url(#ar)"/>

  <rect class="b-brand" x="16" y="260" width="160" height="26" rx="6"/><text class="t-lab" x="96" y="277" text-anchor="middle">敷きモルタル工</text>
  <line class="arr" x1="96" y1="286" x2="96" y2="302" marker-end="url(#ar)"/>

  <rect class="b-pos" x="16" y="302" width="160" height="40" rx="6"/><text class="t-pos" x="96" y="326" text-anchor="middle">(2) 据付工（本体工）</text>
  <line class="ln" x1="176" y1="322" x2="188" y2="322"/>
  <rect class="box" x="188" y="302" width="196" height="40" rx="6"/>
  <text class="t-key" x="196" y="319">機械</text><text class="t-note" x="226" y="319">トラッククレーン</text>
  <text class="t-key" x="196" y="334">確認</text><text class="t-note" x="226" y="334">延長・高さ</text>
  <line class="arr" x1="96" y1="342" x2="96" y2="358" marker-end="url(#ar)"/>

  <rect class="b-pos" x="16" y="358" width="160" height="40" rx="6"/><text class="t-pos" x="96" y="382" text-anchor="middle">(3) 埋戻し・締固め工</text>
  <line class="ln" x1="176" y1="378" x2="188" y2="378"/>
  <rect class="box" x="188" y="358" width="196" height="40" rx="6"/>
  <text class="t-key" x="196" y="375">機械</text><text class="t-note" x="226" y="375">タンパ・振動ローラ</text>
  <text class="t-key" x="196" y="390">確認</text><text class="t-note" x="226" y="390">一層の仕上り厚・締固め度</text>
  <line class="arr" x1="96" y1="398" x2="96" y2="414" marker-end="url(#ar)"/>

  <rect class="b-brand" x="16" y="414" width="160" height="26" rx="6"/><text class="t-lab" x="96" y="431" text-anchor="middle">路床工</text>
  <line class="arr" x1="96" y1="440" x2="96" y2="456" marker-end="url(#ar)"/>

  <rect class="b-brand" x="16" y="456" width="160" height="26" rx="6"/><text class="t-lab" x="96" y="473" text-anchor="middle">後片付け工</text>
</svg>
