<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="切土の施工中に想定と違う地山が出たときの流れ。気づく、止める、調べる、見直すの4段階を順に進め、手順を飛ばして掘り進めない">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-name { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-line { font-size: 12px; fill: #555; }
      .t-small { font-size: 11px; fill: #555; }
      .t-num { font-size: 14px; font-weight: bold; fill: #1a3a5c; }
      .t-key { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .box-warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-danger { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .box-brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-positive { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-surface { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .num { fill: #ffffff; stroke-width: 1.5; }
      .flow { stroke: #555; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#555"/>
    </marker>
  </defs>

  <text class="t-lead" x="20" y="16">想定と違う地山が出てから、施工に戻るまでの順序</text>

  <rect class="box-warn" x="20" y="26" width="360" height="78" rx="6"/>
  <circle class="num" cx="48" cy="65" r="14" stroke="#d4a017"/>
  <text class="t-num" x="48" y="70" text-anchor="middle">1</text>
  <text class="t-name" x="76" y="51">気づく：掘削面が想定と違う</text>
  <text class="t-line" x="76" y="72">層境界のずれ・湧水・亀裂・はらみ・小崩壊</text>
  <text class="t-small" x="76" y="91">写真・位置・日時を残す</text>
  <line class="flow" x1="200" y1="106" x2="200" y2="129" marker-end="url(#arrow)"/>
  <rect class="box-danger" x="20" y="132" width="360" height="78" rx="6"/>
  <circle class="num" cx="48" cy="171" r="14" stroke="#b22234"/>
  <text class="t-num" x="48" y="176" text-anchor="middle">2</text>
  <text class="t-name" x="76" y="157">止める・伝える：安全の確保と通知</text>
  <text class="t-line" x="76" y="178">変状が進むなら作業を中断し、立入禁止・退避</text>
  <text class="t-small" x="76" y="197">監督員へ直ちに通知し、確認を請求する</text>
  <line class="flow" x1="200" y1="212" x2="200" y2="235" marker-end="url(#arrow)"/>
  <rect class="box-brand" x="20" y="238" width="360" height="78" rx="6"/>
  <circle class="num" cx="48" cy="277" r="14" stroke="#2e6da4"/>
  <text class="t-num" x="48" y="282" text-anchor="middle">3</text>
  <text class="t-name" x="76" y="263">調べる：原因を絞る</text>
  <text class="t-line" x="76" y="284">追加調査・計測で地質・水・手順を切り分ける</text>
  <text class="t-small" x="76" y="303">監督員の立会いで現地を確認する</text>
  <line class="flow" x1="200" y1="318" x2="200" y2="341" marker-end="url(#arrow)"/>
  <rect class="box-positive" x="20" y="344" width="360" height="78" rx="6"/>
  <circle class="num" cx="48" cy="383" r="14" stroke="#3a7d44"/>
  <text class="t-num" x="48" y="388" text-anchor="middle">4</text>
  <text class="t-name" x="76" y="369">見直す：対策を決めて設計変更</text>
  <text class="t-line" x="76" y="390">勾配・小段の位置・保護工・排水工を見直す</text>
  <text class="t-small" x="76" y="409">変更が確定してから施工に戻る</text>
  <rect class="box-surface" x="20" y="436" width="360" height="48" rx="6"/>
  <text class="t-key" x="200" y="456" text-anchor="middle">通知や手順を飛ばして、</text>
  <text class="t-key" x="200" y="474" text-anchor="middle">勾配を変えて掘り進めない</text>
</svg>
