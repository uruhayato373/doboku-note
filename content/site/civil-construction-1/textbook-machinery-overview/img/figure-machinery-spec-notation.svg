<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="建設機械の規格表示4種と機種例。作業装置の大きさはローダのバケット容量、作業能力はクローラクレーンのつり上げ荷重、質量はブルドーザの運転質量、原動機出力はバイブロハンマの出力で代表される。さらに走行装置・移動方式・動力伝達方式による形式区分がある">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-name { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-unit { font-size: 11px; font-weight: bold; fill: #2e6da4; }
      .t-ex   { font-size: 11px; fill: #555; }
      .t-num  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-sec  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-item { font-size: 11px; fill: #222; }
      .card { fill: #ffffff; stroke: #2e6da4; stroke-width: 1.5; }
      .dot  { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 2; }
      .box-surf { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .rule { stroke: #d7d7d7; stroke-width: 1; }
    </style>
  </defs>

  <text class="t-lead" x="200" y="18" text-anchor="middle">規格は次のいずれかの値で代表させることが多い</text>

  <rect class="card" x="20" y="30" width="360" height="68" rx="6"/>
  <circle class="dot" cx="52" cy="64" r="15"/>
  <text class="t-num" x="52" y="69" text-anchor="middle">1</text>
  <text class="t-name" x="80" y="58">作業装置の大きさ</text>
  <text class="t-unit" x="364" y="58" text-anchor="end">m・m³</text>
  <text class="t-ex" x="80" y="82">例：ローダ　バケット容量 1.3 m³</text>

  <rect class="card" x="20" y="106" width="360" height="68" rx="6"/>
  <circle class="dot" cx="52" cy="140" r="15"/>
  <text class="t-num" x="52" y="145" text-anchor="middle">2</text>
  <text class="t-name" x="80" y="134">作業能力</text>
  <text class="t-unit" x="364" y="134" text-anchor="end">t吊・m³/h・t積</text>
  <text class="t-ex" x="80" y="158">例：クローラクレーン　つり上げ荷重 25 t吊</text>

  <rect class="card" x="20" y="182" width="360" height="68" rx="6"/>
  <circle class="dot" cx="52" cy="216" r="15"/>
  <text class="t-num" x="52" y="221" text-anchor="middle">3</text>
  <text class="t-name" x="80" y="210">建設機械等の質量</text>
  <text class="t-unit" x="364" y="210" text-anchor="end">t（一般に運転質量）</text>
  <text class="t-ex" x="80" y="234">例：ブルドーザ　11 t</text>

  <rect class="card" x="20" y="258" width="360" height="68" rx="6"/>
  <circle class="dot" cx="52" cy="292" r="15"/>
  <text class="t-num" x="52" y="297" text-anchor="middle">4</text>
  <text class="t-name" x="80" y="286">原動機出力</text>
  <text class="t-unit" x="364" y="286" text-anchor="end">kW</text>
  <text class="t-ex" x="80" y="310">例：バイブロハンマ　40 kW</text>

  <rect class="box-surf" x="20" y="344" width="360" height="138" rx="6"/>
  <text class="t-sec" x="200" y="368" text-anchor="middle">さらに詳しい形式区分</text>
  <line class="rule" x1="36" y1="378" x2="364" y2="378"/>
  <text class="t-item" x="40" y="402">走行装置：クローラ式・ホイール式</text>
  <text class="t-item" x="40" y="430">移動方式：自走式・被けん引式・可搬式・定置式</text>
  <text class="t-item" x="40" y="458">動力伝達方式：機械式・油圧式・電気式・空気式</text>
</svg>
