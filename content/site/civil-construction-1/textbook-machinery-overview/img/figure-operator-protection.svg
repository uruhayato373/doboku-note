<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="オペレータ保護装置を守る対象別に整理した図。落下物に対してはヘッドガード・FOPS・OPG、転倒に対しては ROPS、横転に対しては TOPS が用いられ、ROPS は FOPS を兼ねる場合が多い。シートベルトは保護構造の装着有無にかかわらず併用する">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-risk { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-abbr { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-full { font-size: 11px; fill: #555; }
      .t-use  { font-size: 11px; fill: #555; }
      .t-note { font-size: 11px; fill: #222; }
      .t-sec  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .risk-fall { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .risk-roll { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .risk-tip  { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .card { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-surf { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .rule { stroke: #d7d7d7; stroke-width: 1; }
    </style>
  </defs>

  <text class="t-lead" x="200" y="18" text-anchor="middle">何から守る装置かで整理する</text>

  <!-- 落下物 -->
  <rect class="risk-fall" x="20" y="28" width="360" height="28" rx="6"/>
  <text class="t-risk" x="32" y="47">落下物から守る</text>

  <rect class="card" x="20" y="62" width="112" height="72" rx="6"/>
  <text class="t-abbr" x="76" y="88" text-anchor="middle">ヘッドガード</text>
  <line class="rule" x1="32" y1="98" x2="120" y2="98"/>
  <text class="t-use" x="76" y="117" text-anchor="middle">キャブに機能を</text>
  <text class="t-use" x="76" y="130" text-anchor="middle">持たせた例も</text>

  <rect class="card" x="144" y="62" width="112" height="72" rx="6"/>
  <text class="t-abbr" x="200" y="88" text-anchor="middle">FOPS</text>
  <line class="rule" x1="156" y1="98" x2="244" y2="98"/>
  <text class="t-full" x="200" y="117" text-anchor="middle">落下物</text>
  <text class="t-full" x="200" y="130" text-anchor="middle">保護構造</text>

  <rect class="card" x="268" y="62" width="112" height="72" rx="6"/>
  <text class="t-abbr" x="324" y="88" text-anchor="middle">OPG</text>
  <line class="rule" x1="280" y1="98" x2="368" y2="98"/>
  <text class="t-full" x="324" y="117" text-anchor="middle">運転員</text>
  <text class="t-full" x="324" y="130" text-anchor="middle">保護ガード</text>

  <!-- 転倒 -->
  <rect class="risk-roll" x="20" y="152" width="360" height="28" rx="6"/>
  <text class="t-risk" x="32" y="171">転倒から守る</text>

  <rect class="card" x="20" y="186" width="360" height="72" rx="6"/>
  <text class="t-abbr" x="200" y="212" text-anchor="middle">ROPS</text>
  <line class="rule" x1="32" y1="222" x2="368" y2="222"/>
  <text class="t-full" x="200" y="241" text-anchor="middle">転倒時保護構造。重ダンプトラックには標準装備</text>
  <text class="t-use" x="200" y="254" text-anchor="middle">FOPS を兼ねる場合が多い</text>

  <!-- 横転 -->
  <rect class="risk-tip" x="20" y="276" width="360" height="28" rx="6"/>
  <text class="t-risk" x="32" y="295">横転から守る</text>

  <rect class="card" x="20" y="310" width="360" height="62" rx="6"/>
  <text class="t-abbr" x="200" y="336" text-anchor="middle">TOPS</text>
  <line class="rule" x1="32" y1="346" x2="368" y2="346"/>
  <text class="t-full" x="200" y="365" text-anchor="middle">横転時保護構造。各種ミニショベルに普及</text>

  <!-- 併用 -->
  <rect class="box-surf" x="20" y="390" width="360" height="92" rx="6"/>
  <text class="t-sec" x="200" y="414" text-anchor="middle">これらと併用するもの</text>
  <line class="rule" x1="36" y1="424" x2="364" y2="424"/>
  <text class="t-note" x="200" y="446" text-anchor="middle">シートベルト（保護構造の装着有無にかかわらず標準装備）</text>
  <text class="t-note" x="200" y="468" text-anchor="middle">死角をカバーし周囲作業員を守る危険検知装置</text>
</svg>
