<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="廃棄物の処理の工程。排出のあと、分別、保管、収集運搬、中間処理、最終処分の順に進む。処理は分別から最終処分までの全体で、処分にあたるのは中間処理と最終処分だけ。下段に、処分へ進む前の優先順位として発生抑制、再使用、再生利用、熱回収を示す">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; fill: #222; } /* ink-strong */
      .t-sum   { font-size: 11px; fill: #555; }                       /* ink-body */
      .t-head  { font-size: 12px; font-weight: bold; }
      .t-head-b { font-size: 12px; font-weight: bold; fill: #1a3a5c; } /* brand text */
      .t-title { font-size: 13px; font-weight: bold; }
      .t-sub   { font-size: 11px; fill: #555; }                       /* ink-body */
      .t-body  { font-size: 12px; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#8a8a8a"/> <!-- ink-muted -->
    </marker>
  </defs>

  <text class="t-sum" x="200" y="18" text-anchor="middle">処理は工程の全体、処分は中間処理と最終処分だけ</text>

  <!-- 排出（起点） -->
  <rect x="140" y="28" width="120" height="26" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/> <!-- surface -->
  <text class="t-head" x="200" y="46" text-anchor="middle">排出（元請業者）</text>

  <!-- 処理（全体） -->
  <rect x="16" y="76" width="368" height="354" rx="8" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/> <!-- surface -->
  <text class="t-head" x="30" y="96">処理＝分別から最終処分までの全体</text>

  <!-- 処分（中間処理＋最終処分） -->
  <rect x="32" y="258" width="336" height="158" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/> <!-- brand-fill / brand -->
  <text class="t-head-b" x="46" y="278">処分＝中間処理＋最終処分</text>

  <!-- 工程の箱 -->
  <rect x="100" y="108" width="200" height="36" rx="6" fill="#ffffff" stroke="#d7d7d7" stroke-width="1.5"/>
  <text class="t-title" x="200" y="131" text-anchor="middle">分別</text>

  <rect x="100" y="160" width="200" height="36" rx="6" fill="#ffffff" stroke="#d7d7d7" stroke-width="1.5"/>
  <text class="t-title" x="200" y="183" text-anchor="middle">保管</text>

  <rect x="100" y="212" width="200" height="36" rx="6" fill="#ffffff" stroke="#d7d7d7" stroke-width="1.5"/>
  <text class="t-title" x="200" y="235" text-anchor="middle">収集・運搬</text>

  <rect x="100" y="290" width="200" height="50" rx="6" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
  <text class="t-title" x="200" y="311" text-anchor="middle">中間処理</text>
  <text class="t-sub" x="200" y="329" text-anchor="middle">再生・減量・無害化・埋立前処理</text>

  <rect x="100" y="356" width="200" height="50" rx="6" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
  <text class="t-title" x="200" y="377" text-anchor="middle">最終処分</text>
  <text class="t-sub" x="200" y="395" text-anchor="middle">埋立処分・海洋投入処分</text>

  <!-- 矢印 -->
  <line x1="200" y1="54" x2="200" y2="76" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="144" x2="200" y2="160" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="196" x2="200" y2="212" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="248" x2="200" y2="290" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="340" x2="200" y2="356" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 処分へ進む前の優先順位 -->
  <rect x="16" y="442" width="368" height="50" rx="6" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/> <!-- positive-fill / positive -->
  <text class="t-title" x="200" y="461" text-anchor="middle" style="fill:#1a3a5c">処分へ進む前の優先順位</text>
  <text class="t-body" x="200" y="480" text-anchor="middle">発生抑制→再使用→再生利用→熱回収→処分</text>
</svg>
