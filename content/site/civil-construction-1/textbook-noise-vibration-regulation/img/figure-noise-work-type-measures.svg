<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="工種別の騒音・振動低減策の整理。土留めは工法を替え、舗装版のとりこわしは機械を替え、舗設は編成を整え、ケーソンは設備で抑える">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-head { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-tag { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .t-key { font-size: 12px; font-weight: bold; fill: #555; }
      .t-line { font-size: 12px; fill: #222; }
      .t-note { font-size: 11px; fill: #555; }
    </style>
  </defs>

  <!-- 1 土留め -->
  <rect x="40" y="16" width="320" height="106" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/> <!-- brand-fill / brand -->
  <text class="t-head" x="56" y="42">土留めの鋼矢板・H形鋼</text>
  <rect x="270" y="26" width="74" height="22" rx="3" fill="#ffffff" stroke="#2e6da4" stroke-width="1"/>
  <text class="t-tag" x="307" y="41" text-anchor="middle">工法を替える</text>
  <text x="56" y="66"><tspan class="t-key">音</tspan><tspan class="t-line" dx="10">打撃・振動で地盤に入れる</tspan></text>
  <text x="56" y="88"><tspan class="t-key">策</tspan><tspan class="t-line" dx="10">油圧式圧入引抜きなどの静的工法</tspan></text>
  <text class="t-note" x="56" y="110">油圧ジャッキ式はH形鋼に不向き（反力架台の例もある）</text>

  <!-- 2 舗装版のとりこわし -->
  <rect x="40" y="136" width="320" height="106" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/> <!-- brand-fill / brand -->
  <text class="t-head" x="56" y="162">舗装版のとりこわし</text>
  <rect x="270" y="146" width="74" height="22" rx="3" fill="#ffffff" stroke="#2e6da4" stroke-width="1"/>
  <text class="t-tag" x="307" y="161" text-anchor="middle">機械を替える</text>
  <text x="56" y="186"><tspan class="t-key">音</tspan><tspan class="t-line" dx="10">破砕・切断の打撃音</tspan></text>
  <text x="56" y="208"><tspan class="t-key">策</tspan><tspan class="t-line" dx="10">油圧ジャッキ式の破砕機、低騒音型バックホウ</tspan></text>
  <text class="t-note" x="56" y="230">ブレーカー（手持式除く）は特定建設作業になり得る</text>

  <!-- 3 舗装の舗設 -->
  <rect x="40" y="256" width="320" height="106" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/> <!-- brand-fill / brand -->
  <text class="t-head" x="56" y="282">舗装の舗設</text>
  <rect x="270" y="266" width="74" height="22" rx="3" fill="#ffffff" stroke="#2e6da4" stroke-width="1"/>
  <text class="t-tag" x="307" y="281" text-anchor="middle">編成を整える</text>
  <text x="56" y="306"><tspan class="t-key">音</tspan><tspan class="t-line" dx="10">待ち時間の空ぶかし、締固め</tspan></text>
  <text x="56" y="328"><tspan class="t-key">策</tspan><tspan class="t-line" dx="10">低騒音型の締固め機械、段取り待ちを減らす</tspan></text>
  <text class="t-note" x="56" y="350">振動・衝撃で締め固める場合は時間帯にも留意</text>

  <!-- 4 ニューマチックケーソン -->
  <rect x="40" y="376" width="320" height="106" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/> <!-- brand-fill / brand -->
  <text class="t-head" x="56" y="402">ニューマチックケーソン</text>
  <rect x="270" y="386" width="74" height="22" rx="3" fill="#ffffff" stroke="#2e6da4" stroke-width="1"/>
  <text class="t-tag" x="307" y="401" text-anchor="middle">設備で抑える</text>
  <text x="56" y="426"><tspan class="t-key">音</tspan><tspan class="t-line" dx="10">空気圧縮機が連続運転、作業も昼夜連続</tspan></text>
  <text x="56" y="448"><tspan class="t-key">策</tspan><tspan class="t-line" dx="10">排気に消音器、合図はインターホン等</tspan></text>
  <text class="t-note" x="56" y="470">設備側の対策が欠かせない。定置式は人家から離す</text>
</svg>
