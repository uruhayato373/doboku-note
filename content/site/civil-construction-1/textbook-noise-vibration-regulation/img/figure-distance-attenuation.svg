<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="点音源の距離減衰。発生源から距離が2倍になるごとに、音のエネルギーが球面状に広がって薄まり、騒音レベルが約6デシベルずつ減衰する逆二乗則を、同心の半円と距離目盛りで示す">
  <text x="200" y="24" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1a3a5c">点音源の距離減衰：距離が2倍になるごとに約6dB減衰（逆二乗則）</text>

  <!-- 同心半円（音の広がり） -->
  <path d="M60 250 A 30 30 0 0 1 120 250" fill="none" stroke="#2e6da4" stroke-width="1.5"/>
  <path d="M60 250 A 90 90 0 0 1 240 250" fill="none" stroke="#2e6da4" stroke-width="1.5"/>
  <path d="M60 250 A 150 150 0 0 1 360 250" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="40" y1="250" x2="360" y2="250" stroke="#d7d7d7" stroke-width="1"/>

  <!-- 音源 -->
  <circle cx="60" cy="250" r="7" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="60" y="278" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1a3a5c">音源</text>

  <!-- 距離目盛り -->
  <line x1="120" y1="250" x2="120" y2="300" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="240" y1="250" x2="240" y2="300" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="360" y1="250" x2="360" y2="300" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="120" y="316" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">距離 r</text>
  <text x="240" y="316" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">2r</text>
  <text x="356" y="316" text-anchor="end" font-family="sans-serif" font-size="11" fill="#555">4r</text>

  <!-- レベルボックス -->
  <rect x="86" y="332" width="76" height="52" rx="5" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1"/>
  <text x="124" y="354" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222">基準</text>
  <text x="124" y="374" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1a3a5c">L</text>
  <rect x="202" y="332" width="76" height="52" rx="5" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1"/>
  <text x="240" y="354" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222">−6dB</text>
  <text x="240" y="374" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1a3a5c">L−6</text>
  <rect x="316" y="332" width="76" height="52" rx="5" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <text x="354" y="354" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222">−12dB</text>
  <text x="354" y="374" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222">L−12</text>

  <!-- 注記 -->
  <rect x="40" y="408" width="320" height="72" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="200" y="432" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">音源から離すほどエネルギーが球面に薄く広がる</text>
  <text x="200" y="452" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">発生源から距離をとることが受音点対策の基本</text>
  <text x="200" y="472" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8a8a">出典：建設工事に伴う騒音振動対策技術指針の考え方</text>
</svg>
