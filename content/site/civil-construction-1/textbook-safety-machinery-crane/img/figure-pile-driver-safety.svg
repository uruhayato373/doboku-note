<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="くい打機の安全規定を示す概念図。側面にやぐら・敷板・控え・巻上げワイヤロープ・杭の玉掛部、上から見た巻胴とみぞ車の距離（巻胴幅の15倍以上）と控え3本以上の配置を番号で示す">
<style>text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }</style>

<!-- 側面図の枠 -->
<rect x="20" y="12" width="360" height="222" rx="6" fill="#ffffff" stroke="#d7d7d7" stroke-width="1.5"/>
<rect x="21" y="206" width="358" height="27" fill="#f5f5f5"/>
<line x1="21" y1="206" x2="379" y2="206" stroke="#555" stroke-width="1.5"/>

<!-- 控え（後方へ2本を示す。3本目は上から見た図） -->
<line x1="158" y1="46" x2="330" y2="198" stroke="#555" stroke-width="1.5"/>
<line x1="158" y1="46" x2="360" y2="198" stroke="#555" stroke-width="1.5" stroke-dasharray="5 3"/>
<rect x="324" y="196" width="12" height="10" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
<rect x="354" y="196" width="12" height="10" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
<text x="322" y="224" font-size="11" fill="#555">控えぐい</text>

<!-- 敷板と架台 -->
<rect x="90" y="198" width="110" height="8" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
<rect x="100" y="184" width="90" height="14" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<text x="106" y="224" font-size="11" fill="#555">敷板・敷角</text>

<!-- やぐら -->
<rect x="148" y="48" width="16" height="136" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
<line x1="148" y1="48" x2="164" y2="88" stroke="#8a8a8a" stroke-width="1"/>
<line x1="164" y1="48" x2="148" y2="88" stroke="#8a8a8a" stroke-width="1"/>
<line x1="148" y1="88" x2="164" y2="128" stroke="#8a8a8a" stroke-width="1"/>
<line x1="164" y1="88" x2="148" y2="128" stroke="#8a8a8a" stroke-width="1"/>
<line x1="148" y1="128" x2="164" y2="168" stroke="#8a8a8a" stroke-width="1"/>
<line x1="164" y1="128" x2="148" y2="168" stroke="#8a8a8a" stroke-width="1"/>
<text x="173" y="152" font-size="11" fill="#555">やぐら</text>

<!-- ウインチと巻上げワイヤロープ -->
<rect x="232" y="190" width="24" height="16" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<circle cx="244" cy="178" r="12" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<text x="256" y="224" text-anchor="end" font-size="11" fill="#555">ウインチ</text>
<circle cx="171" cy="184" r="6" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
<circle cx="140" cy="40" r="9" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
<path d="M244,190 H171 A6,6 0 0 1 165,184 V31 H140 A9,9 0 0 0 131,40 V92" fill="none" stroke="#222" stroke-width="1.5"/>

<!-- 運転者（ウインチの運転位置） -->
<circle cx="272" cy="176" r="6" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
<line x1="272" y1="182" x2="272" y2="202" stroke="#2e6da4" stroke-width="1.5"/>
<line x1="272" y1="188" x2="263" y2="196" stroke="#2e6da4" stroke-width="1.5"/>
<line x1="272" y1="188" x2="281" y2="196" stroke="#2e6da4" stroke-width="1.5"/>
<line x1="272" y1="202" x2="266" y2="206" stroke="#2e6da4" stroke-width="1.5"/>
<line x1="272" y1="202" x2="278" y2="206" stroke="#2e6da4" stroke-width="1.5"/>
<text x="264" y="224" font-size="11" fill="#555">運転者</text>

<!-- 杭と玉掛部 -->
<rect x="127" y="98" width="8" height="106" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<rect x="125" y="92" width="12" height="8" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
<text x="120" y="156" text-anchor="end" font-size="11" fill="#555">杭</text>
<circle cx="84" cy="220" r="9" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
<text x="84" y="224" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">1</text>
<circle cx="232" cy="84" r="9" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
<text x="232" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">1</text>
<circle cx="208" cy="172" r="9" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
<text x="208" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">2</text>
<circle cx="188" cy="112" r="9" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
<text x="188" y="116" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">3</text>
<circle cx="100" cy="100" r="9" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
<text x="100" y="104" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">4</text>
<circle cx="300" cy="192" r="9" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
<text x="300" y="196" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">5</text>

<!-- 巻胴とみぞ車（上から） -->
<rect x="20" y="244" width="176" height="116" rx="6" fill="#ffffff" stroke="#d7d7d7" stroke-width="1.5"/>
<text x="30" y="262" font-size="11" fill="#555">巻胴とみぞ車（上から）</text>
<rect x="44" y="296" width="14" height="40" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<line x1="58" y1="316" x2="152" y2="316" stroke="#222" stroke-width="1.5"/>
<circle cx="160" cy="316" r="8" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
<line x1="36" y1="296" x2="36" y2="336" stroke="#2e6da4" stroke-width="1"/>
<line x1="32" y1="296" x2="40" y2="296" stroke="#2e6da4" stroke-width="1"/>
<line x1="32" y1="336" x2="40" y2="336" stroke="#2e6da4" stroke-width="1"/>
<text x="30" y="350" font-size="11" fill="#1a3a5c">巻胴（幅W）</text>
<text x="160" y="340" text-anchor="middle" font-size="11" fill="#1a3a5c">みぞ車</text>
<line x1="51" y1="286" x2="51" y2="296" stroke="#8a8a8a" stroke-width="1"/>
<line x1="160" y1="286" x2="160" y2="308" stroke="#8a8a8a" stroke-width="1"/>
<line x1="51" y1="290" x2="160" y2="290" stroke="#2e6da4" stroke-width="1"/>
<path d="M51 290 l7 -3 v6 z" fill="#2e6da4"/>
<path d="M160 290 l-7 -3 v6 z" fill="#2e6da4"/>
<line x1="102" y1="294" x2="108" y2="286" stroke="#2e6da4" stroke-width="1"/>
<line x1="108" y1="294" x2="114" y2="286" stroke="#2e6da4" stroke-width="1"/>
<text x="105" y="280" text-anchor="middle" font-size="11" fill="#1a3a5c">L ≥ 15 × W</text>

<!-- 控えの配置（上から） -->
<rect x="204" y="244" width="176" height="116" rx="6" fill="#ffffff" stroke="#d7d7d7" stroke-width="1.5"/>
<text x="214" y="262" font-size="11" fill="#555">控えの配置（上から）</text>
<line x1="292" y1="318" x2="292" y2="280" stroke="#555" stroke-width="1.5"/>
<line x1="292" y1="318" x2="325" y2="337" stroke="#555" stroke-width="1.5"/>
<line x1="292" y1="318" x2="259" y2="337" stroke="#555" stroke-width="1.5"/>
<rect x="288" y="272" width="8" height="8" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
<rect x="321" y="333" width="8" height="8" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
<rect x="255" y="333" width="8" height="8" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
<circle cx="292" cy="318" r="7" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<text x="304" y="282" font-size="11" fill="#1a3a5c">控え3本以上</text>
<text x="302" y="312" font-size="11" fill="#555">やぐら</text>

<!-- 凡例 -->
<rect x="20" y="370" width="360" height="120" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
<circle cx="40" cy="388" r="8" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
<text x="40" y="392" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">1</text>
<text x="58" y="392" font-size="12" fill="#222">敷板・敷角で沈下を防ぎ、控えは3本以上</text>
<circle cx="40" cy="410" r="8" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
<text x="40" y="414" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">2</text>
<text x="58" y="414" font-size="12" fill="#222">巻胴から第1みぞ車まで巻胴幅の15倍以上</text>
<circle cx="40" cy="432" r="8" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
<text x="40" y="436" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">3</text>
<text x="58" y="436" font-size="12" fill="#222">巻上げワイヤロープの安全係数は6以上</text>
<circle cx="40" cy="454" r="8" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
<text x="40" y="458" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">4</text>
<text x="58" y="458" font-size="12" fill="#222">杭の玉掛部はみぞ車の直下でつる</text>
<circle cx="40" cy="476" r="8" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
<text x="40" y="480" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">5</text>
<text x="58" y="480" font-size="12" fill="#222">荷重をかけたまま運転位置を離れない</text>
</svg>
