<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="ダンプトラックの運搬路と積込場・土捨場を上から見た平面図。路肩と制限速度、交差部と後進時の誘導員、歯止め、積卸し箇所の立入禁止、荷台に人を乗せない条件を番号で示す">
<style>text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }</style>
<defs>
<marker id="arw" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker>
</defs>

<!-- 平面図の枠 -->
<rect x="20" y="12" width="360" height="350" rx="6" fill="#ffffff" stroke="#d7d7d7" stroke-width="1.5"/>
<!-- 積込場 -->
<rect x="32" y="24" width="170" height="108" rx="4" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
