<text x="246" y="116" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">2</text>
<!-- 運搬路 -->
<text x="34" y="150" font-size="11" fill="#555">運搬路（一方通行）</text>
<rect x="32" y="156" width="336" height="48" fill="#f5f5f5"/>
<line x1="32" y1="156" x2="300" y2="156" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="344" y1="156" x2="368" y2="156" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="32" y1="204" x2="368" y2="204" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="256" y="204" width="44" height="22" fill="#f5f5f5"/>
<line x1="150" y1="180" x2="266" y2="180" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arw)"/>
<line x1="278" y1="190" x2="278" y2="218" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arw)"/>
<rect x="52" y="166" width="62" height="28" rx="2" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
<rect x="114" y="170" width="20" height="20" rx="2" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<circle cx="83" cy="180" r="8" fill="#ffffff" stroke="#b22234" stroke-width="1.5"/>
<line x1="77" y1="186" x2="89" y2="174" stroke="#b22234" stroke-width="1.5"/>
