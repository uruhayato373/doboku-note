<text x="178" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">3</text>
<!-- 一般道・出入口 -->
<rect x="214" y="24" width="154" height="24" fill="#f5f5f5"/>
<line x1="214" y1="24" x2="368" y2="24" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="6 4"/>
