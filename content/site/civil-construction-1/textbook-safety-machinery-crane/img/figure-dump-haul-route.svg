<rect x="150" y="278" width="34" height="32" rx="3" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<circle cx="102" cy="285" r="5" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
<line x1="102" y1="290" x2="102" y2="310" stroke="#2e6da4" stroke-width="1.5"/>
<line x1="102" y1="295" x2="93" y2="301" stroke="#2e6da4" stroke-width="1.5"/>
<line x1="102" y1="295" x2="111" y2="301" stroke="#2e6da4" stroke-width="1.5"/>
<rect x="56" y="302" width="92" height="8" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
<rect x="52" y="310" width="134" height="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
<circle cx="84" cy="322" r="7" fill="#555"/>
<circle cx="160" cy="322" r="7" fill="#555"/>
<line x1="40" y1="330" x2="204" y2="330" stroke="#555" stroke-width="1.5"/>
<text x="44" y="345" font-size="11" fill="#1a3a5c">あおりを閉じる・荷に歯止め</text>
<!-- 凡例 -->
<rect x="20" y="370" width="360" height="120" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
<circle cx="40" cy="388" r="8" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
<text x="40" y="392" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">1</text>
<text x="58" y="392" font-size="12" fill="#222">路肩と幅員を保ち、制限速度を示す</text>
<circle cx="40" cy="410" r="8" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
<text x="40" y="414" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">2</text>
<text x="58" y="414" font-size="12" fill="#222">交差部と後進は誘導員の合図で行う</text>
<circle cx="40" cy="432" r="8" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
<text x="40" y="436" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">3</text>
<text x="58" y="436" font-size="12" fill="#222">駐車ブレーキと歯止めで止める</text>
<circle cx="40" cy="454" r="8" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
<text x="40" y="458" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">4</text>
<text x="58" y="458" font-size="12" fill="#222">積卸しの箇所は関係者以外立入禁止</text>
<circle cx="40" cy="476" r="8" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
<text x="40" y="480" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">5</text>
<text x="58" y="480" font-size="12" fill="#222">荷台に人を乗せない（あおり付きは条件付き）</text>
</svg>
