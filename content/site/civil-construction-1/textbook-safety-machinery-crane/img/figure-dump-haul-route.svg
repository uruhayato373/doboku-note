<rect x="262" y="262" width="26" height="18" rx="2" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<rect x="258" y="280" width="34" height="46" rx="2" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
<line x1="275" y1="332" x2="275" y2="344" stroke="#2e6da4" stroke-width="1.5"/>
<circle cx="334" cy="296" r="5" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
<line x1="334" y1="301" x2="334" y2="318" stroke="#2e6da4" stroke-width="1.5"/>
<line x1="334" y1="306" x2="326" y2="296" stroke="#2e6da4" stroke-width="1.5"/>
<line x1="334" y1="306" x2="342" y2="312" stroke="#2e6da4" stroke-width="1.5"/>
<line x1="334" y1="318" x2="329" y2="326" stroke="#2e6da4" stroke-width="1.5"/>
<line x1="334" y1="318" x2="339" y2="326" stroke="#2e6da4" stroke-width="1.5"/>
<polygon points="326,296 314,291 314,299" fill="#fff3cd" stroke="#d4a017" stroke-width="1"/>
<text x="334" y="282" text-anchor="middle" font-size="11" fill="#555">誘導員</text>
<circle cx="306" cy="266" r="9" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
<text x="306" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">2</text>
<!-- 荷台に乗せる場合（側面） -->
<rect x="32" y="240" width="180" height="110" rx="4" fill="#ffffff" stroke="#d7d7d7" stroke-width="1.5"/>
