<text x="326" y="222" font-size="11" fill="#555">路肩</text>
<!-- 土捨場 -->
<rect x="222" y="232" width="146" height="118" rx="4" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
