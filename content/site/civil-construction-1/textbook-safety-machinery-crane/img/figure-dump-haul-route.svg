<text x="44" y="112" font-size="11" fill="#555">バックホウ</text>
<rect x="124" y="66" width="52" height="28" rx="2" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
<rect x="176" y="70" width="18" height="20" rx="2" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<rect x="130" y="62" width="14" height="4" fill="#555"/>
<rect x="130" y="94" width="14" height="4" fill="#555"/>
<rect x="156" y="62" width="14" height="4" fill="#555"/>
<rect x="156" y="94" width="14" height="4" fill="#555"/>
<polygon points="145,99 145,94 151,99" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
