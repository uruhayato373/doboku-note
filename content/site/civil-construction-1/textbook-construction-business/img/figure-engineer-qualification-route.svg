<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="一般建設業の営業所技術者になる4つの道筋。法第7条第2号のイ・ロ・ハの3類型を、技士補を分けて整理した。技術検定の第二次検定に合格した者（ハ）は実務経験不要、第一次検定のみの技士補（ハ）は1級が合格後3年と2級が合格後5年、指定学科卒（イ）は大学等3年と高校5年、いずれでもなければ実務経験10年（ロ）。指定建設業と電気通信工事業では技士補の短縮は使えない">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-h { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-s { font-size: 11px; fill: #222; }
      .t-m { font-size: 11px; fill: #555; }
      .bb { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .bp { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .bw { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .bd { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .bs { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .ln { stroke: #555; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="a" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#555"/></marker>
  </defs>

  <text class="t-lead" x="200" y="16" text-anchor="middle">営業所技術者になる4つの道筋（イ・ロ・ハを整理）</text>

  <rect class="bb" x="20" y="28" width="170" height="76" rx="6"/>
  <text class="t-h" x="105" y="58" text-anchor="middle">第二次検定に合格</text>
  <text class="t-m" x="105" y="78" text-anchor="middle">1級・2級の技士（ハ）</text>
  <line class="ln" x1="192" y1="66" x2="218" y2="66" marker-end="url(#a)"/>
  <rect class="bp" x="222" y="28" width="158" height="76" rx="6"/>
  <text class="t-h" x="301" y="58" text-anchor="middle">実務経験は不要</text>
  <text class="t-m" x="301" y="78" text-anchor="middle">資格だけで足りる</text>

  <rect class="bb" x="20" y="114" width="170" height="86" rx="6"/>
  <text class="t-h" x="105" y="144" text-anchor="middle">第一次検定のみ合格</text>
  <text class="t-m" x="105" y="164" text-anchor="middle">技士補（ハ）</text>
  <line class="ln" x1="192" y1="157" x2="218" y2="157" marker-end="url(#a)"/>
  <rect class="bw" x="222" y="114" width="158" height="86" rx="6"/>
  <text class="t-h" x="301" y="140" text-anchor="middle">1級は合格後3年</text>
  <text class="t-h" x="301" y="160" text-anchor="middle">2級は合格後5年</text>
  <text class="t-m" x="301" y="184" text-anchor="middle">指定建設業は除く</text>

  <rect class="bb" x="20" y="210" width="170" height="76" rx="6"/>
  <text class="t-h" x="105" y="240" text-anchor="middle">指定学科を修めた者</text>
  <text class="t-m" x="105" y="260" text-anchor="middle">土木工事業は土木工学等（イ）</text>
  <line class="ln" x1="192" y1="248" x2="218" y2="248" marker-end="url(#a)"/>
  <rect class="bw" x="222" y="210" width="158" height="76" rx="6"/>
  <text class="t-s" x="301" y="240" text-anchor="middle">大学・高専は卒業後3年</text>
  <text class="t-s" x="301" y="260" text-anchor="middle">高校は卒業後5年</text>

  <rect class="bb" x="20" y="296" width="170" height="64" rx="6"/>
  <text class="t-h" x="105" y="333" text-anchor="middle">上のどれにも当たらない</text>
  <line class="ln" x1="192" y1="328" x2="218" y2="328" marker-end="url(#a)"/>
  <rect class="bw" x="222" y="296" width="158" height="64" rx="6"/>
  <text class="t-h" x="301" y="324" text-anchor="middle">実務経験10年以上</text>
  <text class="t-m" x="301" y="344" text-anchor="middle">（ロ）</text>

  <rect class="bp" x="20" y="378" width="170" height="110" rx="6"/>
  <text class="t-h" x="105" y="402" text-anchor="middle">実務の経験に含む</text>
  <text class="t-s" x="105" y="426" text-anchor="middle">工事の施工</text>
  <text class="t-s" x="105" y="444" text-anchor="middle">発注者側の設計・監督</text>
  <text class="t-s" x="105" y="462" text-anchor="middle">土工とその見習い</text>

  <rect class="bd" x="210" y="378" width="170" height="110" rx="6"/>
  <text class="t-h" x="295" y="402" text-anchor="middle">含まない</text>
  <text class="t-s" x="295" y="428" text-anchor="middle">雑務のみの経験</text>
  <text class="t-m" x="295" y="454" text-anchor="middle">重なる期間は</text>
  <text class="t-m" x="295" y="470" text-anchor="middle">二重に数えない</text>
</svg>
