<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="特定建設業者が注文者となる下請契約の下請代金の支払期限。注文者から支払を受けた日から1か月以内と、下請の引渡し申出日から50日以内のうち早い方が期日になる。受領が早ければ1か月後、遅ければ50日目。下請が特定建設業者または資本金4000万円以上の法人なら50日の対象外">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-h { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-s { font-size: 11px; fill: #222; }
      .t-m { font-size: 11px; fill: #555; }
      .bs { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .bw { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .bd { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .ax { stroke: #555; stroke-width: 1.5; fill: none; }
      .mo { stroke: #2e6da4; stroke-width: 5; fill: none; }
    </style>
    <marker id="a" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#555"/></marker>
    <marker id="b" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#2e6da4"/></marker>
  </defs>

  <text class="t-lead" x="200" y="16" text-anchor="middle">特定建設業者が注文者のとき、期日は早い方</text>

  <rect class="bs" x="20" y="26" width="360" height="164" rx="6"/>
  <text class="t-h" x="200" y="50" text-anchor="middle">注文者からの支払が早いとき</text>
  <line class="ax" x1="36" y1="118" x2="366" y2="118" marker-end="url(#a)"/>
  <line class="mo" x1="98" y1="118" x2="278" y2="118"/>
  <circle cx="50" cy="118" r="5" fill="#8a8a8a"/>
  <circle cx="98" cy="118" r="5" fill="#2e6da4"/>
  <circle cx="278" cy="118" r="5" fill="#b22234"/>
  <circle cx="300" cy="118" r="5" fill="#8a8a8a"/>
  <text class="t-m" x="50" y="100" text-anchor="middle">申出日</text>
  <text class="t-m" x="98" y="100" text-anchor="middle">受領</text>
  <text class="t-m" x="300" y="100" text-anchor="middle">50日</text>
  <text class="t-s" x="188" y="144" text-anchor="middle">1か月</text>
  <rect class="bd" x="238" y="132" width="80" height="22" rx="4"/>
  <text class="t-s" x="278" y="147" text-anchor="middle">支払期日</text>
  <text class="t-m" x="200" y="176" text-anchor="middle">受領が早ければ、受領から1か月後が期日</text>

  <rect class="bs" x="20" y="204" width="360" height="164" rx="6"/>
  <text class="t-h" x="200" y="228" text-anchor="middle">注文者からの支払が遅いとき</text>
  <line class="ax" x1="36" y1="296" x2="366" y2="296" marker-end="url(#a)"/>
  <line class="mo" x1="194" y1="296" x2="350" y2="296" marker-end="url(#b)"/>
  <circle cx="50" cy="296" r="5" fill="#8a8a8a"/>
  <circle cx="194" cy="296" r="5" fill="#2e6da4"/>
  <circle cx="300" cy="296" r="5" fill="#b22234"/>
  <text class="t-m" x="50" y="278" text-anchor="middle">申出日</text>
  <text class="t-m" x="194" y="278" text-anchor="middle">受領</text>
  <text class="t-m" x="300" y="278" text-anchor="middle">50日</text>
  <text class="t-s" x="228" y="322" text-anchor="middle">1か月</text>
  <rect class="bd" x="262" y="310" width="76" height="22" rx="4"/>
  <text class="t-s" x="300" y="325" text-anchor="middle">支払期日</text>
  <text class="t-m" x="200" y="354" text-anchor="middle">受領が遅ければ、申出日から50日目が期日</text>

  <rect class="bw" x="20" y="382" width="360" height="106" rx="6"/>
  <text class="t-h" x="200" y="412" text-anchor="middle">50日の規定が及ばない相手</text>
  <text class="t-s" x="200" y="440" text-anchor="middle">下請が特定建設業者である場合</text>
  <text class="t-s" x="200" y="462" text-anchor="middle">下請が資本金4,000万円以上の法人である場合</text>
</svg>
