<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="建設業法の体系を5本柱で整理した図。許可制度は建設業者の資質の向上、技術者制度は施工技術の確保、請負契約の適正化は発注者や下請負人の保護、経営事項審査は公共工事の元請業者の一元評価、監督処分等は法令遵守の実効性の担保を担う">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-h { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-s { font-size: 11px; fill: #222; }
      .t-m { font-size: 11px; fill: #555; }
      .bb { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .bp { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .bw { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .bd { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .bs { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
  </defs>

  <text class="t-lead" x="200" y="16" text-anchor="middle">建設業法は、役割の違う5つの仕組みでできている</text>

  <rect class="bb" x="20" y="28" width="360" height="76" rx="6"/>
  <text class="t-h" x="36" y="52">許可制度</text>
  <text class="t-m" x="36" y="72">建設業者の資質を高める</text>
  <text class="t-s" x="36" y="92">業種別・一般と特定・営業所技術者・欠格要件</text>

  <rect class="bp" x="20" y="112" width="360" height="76" rx="6"/>
  <text class="t-h" x="36" y="136">技術者制度</text>
  <text class="t-m" x="36" y="156">施工技術を確保する</text>
  <text class="t-s" x="36" y="176">主任技術者・監理技術者・監理技術者補佐・専任</text>

  <rect class="bw" x="20" y="196" width="360" height="76" rx="6"/>
  <text class="t-h" x="36" y="220">請負契約の適正化</text>
  <text class="t-m" x="36" y="240">発注者と下請負人を守る</text>
  <text class="t-s" x="36" y="260">書面契約・元請の義務・施工体制台帳・一括下請負禁止</text>

  <rect class="bs" x="20" y="280" width="360" height="76" rx="6"/>
  <text class="t-h" x="36" y="304">経営事項審査</text>
  <text class="t-m" x="36" y="324">公共工事の元請を同じ物差しで評価する</text>
  <text class="t-s" x="36" y="344">経営状況・経営規模・技術力などを数値で審査</text>

  <rect class="bd" x="20" y="364" width="360" height="76" rx="6"/>
  <text class="t-h" x="36" y="388">監督処分等</text>
  <text class="t-m" x="36" y="408">法令遵守の実効性を担保する</text>
  <text class="t-s" x="36" y="428">指示・営業停止・許可の取消し、罰則</text>

  <text class="t-m" x="200" y="466" text-anchor="middle">請負契約のトラブルは、建設工事紛争審査会が</text>
  <text class="t-m" x="200" y="482" text-anchor="middle">あっせん・調停・仲裁で解決を図る</text>
</svg>
