<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="土構造物の分類。本体構造物は切土と盛土（陸上盛土・海上盛土）に分かれ、付帯構造物は法面工事（法面保護・擁壁・アンカー・補強土）に分かれる">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-sec  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-name { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-desc { font-size: 11px; fill: #555; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
    </style>
  </defs>

  <text class="t-lead" x="200" y="18" text-anchor="middle">本体構造物と付帯構造物の2つに大別される</text>

  <text class="t-sec" x="20" y="42">本体構造物</text>

  <rect class="box-b" x="20" y="48" width="360" height="56" rx="6"/>
  <text class="t-name" x="40" y="70">切土</text>
  <text class="t-desc" x="40" y="90">原地盤を切り取って造成する（掘削ともいう）</text>

  <rect class="box-b" x="20" y="112" width="360" height="72" rx="6"/>
  <text class="t-name" x="40" y="134">盛土</text>
  <text class="t-desc" x="40" y="154">原地盤上に土砂などを盛り立てて築造する</text>
  <text class="t-desc" x="40" y="172">陸上盛土のほか、造島埋立などの海上盛土も含む</text>

  <text class="t-sec" x="20" y="212">付帯構造物（法面工事）</text>

  <rect class="box-w" x="20" y="218" width="360" height="56" rx="6"/>
  <text class="t-name" x="40" y="240">法面保護</text>
  <text class="t-desc" x="40" y="260">切土・盛土の法面の崩壊を防ぐ植生工・構造物工</text>

  <rect class="box-w" x="20" y="282" width="360" height="56" rx="6"/>
  <text class="t-name" x="40" y="304">擁壁・アンカー・補強土</text>
  <text class="t-desc" x="40" y="324">本体構造物を維持・補強するための構造物</text>

  <text class="t-sec" x="20" y="366">用語の整理</text>

  <rect class="box-b" x="20" y="372" width="360" height="108" rx="6"/>
  <text class="t-desc" x="40" y="394">切土・盛土でできる傾斜面 → 法面</text>
  <text class="t-desc" x="40" y="414">法面の傾斜の程度 → 法勾配</text>
  <text class="t-desc" x="40" y="434">掘削箇所を土砂で埋める → 埋戻し</text>
  <text class="t-desc" x="40" y="454">余った掘削土を他所へ運んで処分 → 残土処理</text>
</svg>
