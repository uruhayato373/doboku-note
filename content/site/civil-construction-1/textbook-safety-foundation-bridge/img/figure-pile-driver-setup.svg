<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="杭打ち機と高圧線の離隔、監視人、地中のガス導管。リーダ頂部と高圧線の離隔は電圧で決まり、防護の措置が先で監視人は著しく困難なときだけ、地下のガス導管等は管理者に確かめる">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; fill: #222; }
      .t { font-size: 12px; fill: #222; }
      .s { font-size: 11px; fill: #555; }
      .n { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .sur { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .dot { fill: #ffffff; stroke: #b22234; stroke-width: 1.5; }
    </style>
    <marker id="ar" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#b22234"/>
    </marker>
  </defs>

  <!-- 地盤 -->
  <rect x="10" y="214" width="380" height="82" class="sur"/> <!-- surface -->

  <!-- 架空線と電柱 -->
  <line x1="18" y1="18" x2="18" y2="214" stroke="#555" stroke-width="3"/>
  <line x1="372" y1="20" x2="372" y2="214" stroke="#555" stroke-width="3"/>
  <path d="M18 18 Q195 32 372 20" fill="none" stroke="#b22234" stroke-width="2"/> <!-- danger -->
  <text x="270" y="13" class="s">高圧線</text>

  <!-- 杭打ち機（本体・リーダ・ハンマ・杭） -->
  <rect x="100" y="184" width="126" height="24" rx="4" class="brand"/> <!-- brand-fill / brand -->
  <text x="150" y="201" text-anchor="middle" class="t">杭打ち機</text>
  <rect x="148" y="60" width="14" height="124" class="brand"/>
  <rect x="145" y="108" width="20" height="16" class="warn"/> <!-- warn-fill / warn -->
  <rect x="151" y="126" width="8" height="56" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <circle cx="155" cy="60" r="5" fill="#ffffff" stroke="#555" stroke-width="1.5"/>

  <!-- 離隔の寸法線（リーダ頂部と高圧線） -->
  <line x1="155" y1="40" x2="155" y2="27" stroke="#b22234" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="155" y1="40" x2="155" y2="54" stroke="#b22234" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 監視人 -->
  <circle cx="300" cy="176" r="6" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
  <line x1="300" y1="182" x2="300" y2="200" stroke="#222" stroke-width="1.5"/>
  <line x1="292" y1="188" x2="308" y2="188" stroke="#222" stroke-width="1.5"/>
  <line x1="300" y1="200" x2="294" y2="212" stroke="#222" stroke-width="1.5"/>
  <line x1="300" y1="200" x2="306" y2="212" stroke="#222" stroke-width="1.5"/>
  <text x="300" y="164" text-anchor="middle" class="s">監視人</text>

  <!-- 地下のガス導管等 -->
  <rect x="60" y="256" width="190" height="18" rx="3" class="warn"/>
  <text x="155" y="269" text-anchor="middle" class="s">ガス導管等（地中）</text>

  <!-- 番号 -->
  <circle cx="182" cy="40" r="9" class="dot"/><text x="182" y="44" text-anchor="middle" class="n">1</text>
  <circle cx="328" cy="190" r="9" class="dot"/><text x="328" y="194" text-anchor="middle" class="n">2</text>
  <circle cx="272" cy="265" r="9" class="dot"/><text x="272" y="269" text-anchor="middle" class="n">3</text>

  <!-- 凡例 -->
  <circle cx="30" cy="336" r="9" class="dot"/><text x="30" y="340" text-anchor="middle" class="n">1</text>
  <text x="48" y="341" class="t">架空線との離隔は、電圧で決まる値以上に保つ</text>
  <text x="48" y="358" class="s">低圧・高圧・特別高圧で値が異なる</text>
  <circle cx="30" cy="384" r="9" class="dot"/><text x="30" y="388" text-anchor="middle" class="n">2</text>
  <text x="48" y="389" class="t">防護の措置が先。監視人は最後の手段</text>
  <text x="48" y="406" class="s">移設・囲い・絶縁用防護具が著しく困難なとき</text>
  <circle cx="30" cy="432" r="9" class="dot"/><text x="30" y="436" text-anchor="middle" class="n">3</text>
  <text x="48" y="437" class="t">地下のガス導管等は管理者に確かめる</text>
  <text x="48" y="454" class="s">有無と状態をあらかじめ調べ、措置を決める</text>
</svg>
