<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="営業所技術者等、現場の主任・監理技術者、経営事項審査の技術職員について、何を見るか、いつの時点で見るか、どの書類で確かめるかを役割ごとに並べた比較">
<defs><style>text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN","Hiragino Sans",sans-serif;font-size:12px;fill:#222}
.h{font-size:13px;font-weight:bold;fill:#1a3a5c}
.k{font-size:11px;font-weight:bold;fill:#1a3a5c}
.s{font-size:11px;fill:#555}
.bb{fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5}
.bp{fill:#d0e8d0;stroke:#3a7d44;stroke-width:1.5}
.bw{fill:#fff3cd;stroke:#d4a017;stroke-width:1.5}</style></defs>
<text class="s" x="200" y="18" text-anchor="middle">同じ「雇われている技術者」でも、物差しは役割ごとに違う</text>
<rect class="bb" x="12" y="30" width="376" height="138" rx="6"/>
<text class="h" x="24" y="52">営業所技術者等（許可の要件）</text>
<text class="k" x="24" y="78">見る点</text>
<text x="70" y="78">営業所に常勤し、専らその職務に従事（専任性）</text>
<text class="k" x="24" y="108">時点</text>
<text x="70" y="108">許可の申請や届出のとき</text>
<text class="k" x="24" y="138">書類</text>
<text x="70" y="138">標準報酬決定通知書、住民税特別徴収税額通知書、</text>
<text x="70" y="154">所属企業の雇用証明書の写しなど</text>
<rect class="bp" x="12" y="178" width="376" height="154" rx="6"/>
<text class="h" x="24" y="200">現場の主任・監理技術者</text>
<text class="k" x="24" y="226">見る点</text>
<text x="70" y="226">直接的かつ恒常的な雇用関係</text>
<text class="k" x="24" y="256">時点</text>
<text x="70" y="256">入札の申込日等以前に3か月以上の雇用</text>
<text x="70" y="272">（公共工事の元請の専任の場合）</text>
<text class="k" x="24" y="302">書類</text>
<text x="70" y="302">資格者証、標準報酬決定通知書、</text>
<text x="70" y="318">住民税特別徴収税額通知書、雇用証明書の写し</text>
<rect class="bw" x="12" y="342" width="376" height="138" rx="6"/>
<text class="h" x="24" y="364">経営事項審査の技術職員</text>
<text class="k" x="24" y="390">見る点</text>
<text x="70" y="390">雇用期間を限定しない常時雇用</text>
<text class="k" x="24" y="420">時点</text>
<text x="70" y="420">審査基準日以前に6か月を超える雇用</text>
<text class="k" x="24" y="450">書類</text>
<text x="70" y="450">標準報酬決定通知書（それ以外の場合は</text>
<text x="70" y="466">住民税特別徴収税額を通知する書面）</text>
</svg>
