<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="監理技術者資格者証の交付申請と監理技術者講習は別々の手続きで、どちらが先でもよい。両方が有効なとき、専任の監理技術者に選任できる">
<defs><style>text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN","Hiragino Sans",sans-serif;font-size:12px;fill:#222}
.h{font-size:13px;font-weight:bold;fill:#1a3a5c}
.k{font-size:11px;font-weight:bold;fill:#1a3a5c}
.s{font-size:11px;fill:#555}
.bb{fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5}
.bp{fill:#d0e8d0;stroke:#3a7d44;stroke-width:1.5}
.ln{stroke:#8a8a8a;stroke-width:1.5;fill:none}</style><marker id="a" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#8a8a8a"/></marker></defs>
<text class="s" x="200" y="18" text-anchor="middle">別々に取り、別々に有効期間を管理する</text>
<rect class="bb" x="12" y="30" width="183" height="324" rx="6"/>
<rect class="bp" x="205" y="30" width="183" height="324" rx="6"/>
<text class="h" x="24" y="54">資格者証の交付申請</text>
<text class="h" x="217" y="54">監理技術者講習</text>
<text class="k" x="24" y="82">窓口</text>
<text x="24" y="100">建設業技術者センター</text>
<text x="24" y="115">（指定資格者証交付機関）</text>
<text class="k" x="24" y="143">手数料</text>
<text x="24" y="161">7,600円（非課税）</text>
<text class="k" x="24" y="189">処理期間</text>
<text x="24" y="207">約10日〜30日</text>
<text x="24" y="222">（申込方法で異なる）</text>
<text class="k" x="24" y="250">有効</text>
<text x="24" y="268">交付日から5年間</text>
<text class="k" x="24" y="304">携帯</text>
<text x="24" y="322">請求されたら提示。</text>
<text x="24" y="337">職務中は常時携帯</text>
<text class="k" x="217" y="82">実施</text>
<text x="217" y="100">国土交通大臣の登録を</text>
<text x="217" y="115">受けた登録講習機関</text>
<text class="k" x="217" y="143">内容</text>
<text x="217" y="161">1日6時間</text>
<text x="217" y="176">法律制度 1.5時間</text>
<text x="217" y="191">技術上の管理 2.5時間</text>
<text x="217" y="206">最新の材料・資機材・</text>
<text x="217" y="221">施工方法 2.0時間</text>
<text class="k" x="217" y="247">有効</text>
<text x="217" y="265">受講年の翌年1月1日から</text>
<text x="217" y="280">5年後の12月31日まで</text>
<text class="k" x="217" y="304">履歴</text>
<text x="217" y="322">修了後のラベルを</text>
<text x="217" y="337">資格者証の裏面に貼る</text>
<path class="ln" d="M103 354 L103 380 L170 398" marker-end="url(#a)"/>
<path class="ln" d="M297 354 L297 380 L230 398" marker-end="url(#a)"/>
<text class="s" x="200" y="374" text-anchor="middle">どちらが先でもよい</text>
<rect class="bp" x="70" y="404" width="260" height="76" rx="6"/>
<text class="h" x="200" y="434" text-anchor="middle">専任の監理技術者に選任できる</text>
<text class="s" x="200" y="456" text-anchor="middle">（専任特例の場合を含む）</text>
</svg>
