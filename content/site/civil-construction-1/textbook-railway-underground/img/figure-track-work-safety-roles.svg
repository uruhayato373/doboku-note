<!-- authored 2026-09-12 doboku-note 自作。題材は1級土木 専門土木テキスト「鉄道・地下構造物」の論点。特定の書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="営業線近接工事の保安体制の配置図。工事管理者・線閉責任者・停電責任者・軌道作業責任者が工事区間を囲み、列車見張員は軌道の両端付近で列車接近を監視する役割分担">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-name { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-role { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-desc { font-size: 11px; fill: #555; }
      .t-tag  { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .box-frame { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-d { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .rail  { stroke: #8a8a8a; stroke-width: 1.5; }
      .tie   { stroke: #d7d7d7; stroke-width: 1; }
      .link  { stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3 2; }
    </style>
  </defs>

  <text class="t-lead" x="200" y="16" text-anchor="middle">工事区間を複数の責任者が分担し列車見張員が両端を監視する</text>

  <!-- 配置図 -->
  <rect class="box-frame" x="20" y="30" width="360" height="224" rx="6"/>
  <text class="t-name" x="35" y="50">営業線近接工事の配置と役割分担</text>

  <line class="rail" x1="45" y1="108" x2="355" y2="108"/>
  <line class="rail" x1="45" y1="112" x2="355" y2="112"/>
  <line class="tie" x1="60" y1="104" x2="60" y2="116"/>
  <line class="tie" x1="90" y1="104" x2="90" y2="116"/>
  <line class="tie" x1="120" y1="104" x2="120" y2="116"/>
  <line class="tie" x1="150" y1="104" x2="150" y2="116"/>
  <line class="tie" x1="250" y1="104" x2="250" y2="116"/>
  <line class="tie" x1="280" y1="104" x2="280" y2="116"/>
  <line class="tie" x1="310" y1="104" x2="310" y2="116"/>
  <line class="tie" x1="340" y1="104" x2="340" y2="116"/>

  <rect class="box-w" x="170" y="98" width="60" height="24" rx="4"/>
  <text class="t-tag" x="200" y="114" text-anchor="middle">工事区間</text>

  <circle class="box-d" cx="55" cy="110" r="5"/>
  <circle class="box-d" cx="345" cy="110" r="5"/>

  <text class="t-desc" x="200" y="134" text-anchor="middle">●＝列車見張員（軌道の両端付近に配置し列車接近を監視）</text>

  <line class="link" x1="112" y1="148" x2="150" y2="118"/>
  <rect class="box-b" x="35" y="148" width="155" height="44" rx="6"/>
  <text class="t-role" x="112" y="166" text-anchor="middle">工事管理者</text>
  <text class="t-desc" x="112" y="184" text-anchor="middle">現場全体を統括</text>

  <line class="link" x1="287" y1="148" x2="250" y2="118"/>
  <rect class="box-b" x="210" y="148" width="155" height="44" rx="6"/>
  <text class="t-role" x="287" y="166" text-anchor="middle">線閉責任者</text>
  <text class="t-desc" x="287" y="184" text-anchor="middle">線路閉鎖の手続き</text>

  <rect class="box-b" x="35" y="200" width="155" height="44" rx="6"/>
  <text class="t-role" x="112" y="218" text-anchor="middle">停電責任者</text>
  <text class="t-desc" x="112" y="236" text-anchor="middle">き電停止の手続き</text>

  <rect class="box-b" x="210" y="200" width="155" height="44" rx="6"/>
  <text class="t-role" x="287" y="218" text-anchor="middle">軌道作業責任者</text>
  <text class="t-desc" x="287" y="236" text-anchor="middle">現場での作業指揮</text>

  <!-- 手続きの担当 -->
  <rect class="box-frame" x="20" y="264" width="360" height="110" rx="6"/>
  <text class="t-name" x="35" y="284">手続きの担当</text>
  <text class="t-desc" x="35" y="300">き電停止の手続き＝停電責任者</text>
  <text class="t-desc" x="35" y="316">線路閉鎖・保守用車の手続き＝線閉責任者</text>
  <text class="t-desc" x="35" y="332">現場の作業指揮＝軌道作業責任者</text>
  <text class="t-desc" x="35" y="348">線閉責任者は10人以下・50m程度の作業なら兼務可</text>
  <text class="t-desc" x="35" y="364">列車見張員は前後50m程度を1人で担当する</text>

  <!-- 重要数値 -->
  <rect class="box-frame" x="20" y="384" width="360" height="106" rx="6"/>
  <text class="t-name" x="35" y="404">保安設備と離隔の基準</text>
  <text class="t-desc" x="35" y="422">可搬式特殊信号発光機：800m以上離れた位置に設置</text>
  <text class="t-desc" x="35" y="440">列車見張員の担当範囲：前後50m程度</text>
  <text class="t-desc" x="35" y="458">大型機械の留置：建築限界の外方1m以上</text>
  <text class="t-desc" x="35" y="476">精密作業の照度：150ルクス以上</text>
</svg>
