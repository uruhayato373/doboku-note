<!-- authored 2026-09-12 doboku-note 自作。題材は1級土木 専門土木テキスト「鉄道・地下構造物」の論点。特定の書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="シールド機の側面模式図。フード部・ガーダー部（推進ジャッキ）・テール部（セグメント組立）の3区分と、テール通過後に生じる隙間へ裏込め注入する位置。下段は土圧式と泥水式の切羽保持方式の違い">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-name { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-zone { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-sub  { font-size: 11px; fill: #1a3a5c; }
      .t-desc { font-size: 11px; fill: #555; }
      .t-tag  { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-p { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-frame { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1; }
    </style>
  </defs>

  <text class="t-lead" x="200" y="16" text-anchor="middle">シールド機はフード部・ガーダー部・テール部の3区分で構成される</text>

  <!-- Section 1: 機体3区分＋裏込め注入位置 -->
  <rect class="box-frame" x="20" y="26" width="360" height="190" rx="6"/>
  <text class="t-name" x="35" y="44">機体の3区分と裏込め注入の位置（側面模式図）</text>

  <text class="t-tag" x="302" y="58" text-anchor="middle">裏込め注入</text>
  <line x1="302" y1="62" x2="302" y2="74" stroke="#d4a017" stroke-width="2"/>
  <polygon points="297,74 307,74 302,82" fill="#d4a017"/>

  <rect class="box-b" x="45" y="88" width="95" height="64"/>
  <text class="t-zone" x="92" y="114" text-anchor="middle">フード部</text>
  <text class="t-sub" x="92" y="132" text-anchor="middle">（切削）</text>

  <rect class="box-b" x="140" y="88" width="95" height="64"/>
  <text class="t-zone" x="187" y="114" text-anchor="middle">ガーダー部</text>
  <text class="t-sub" x="187" y="132" text-anchor="middle">（ジャッキ）</text>

  <rect class="box-b" x="235" y="88" width="60" height="64"/>
  <text class="t-zone" x="265" y="114" text-anchor="middle">テール部</text>
  <text class="t-sub" x="265" y="132" text-anchor="middle">（組立）</text>

  <rect class="box-w" x="295" y="88" width="15" height="64"/>

  <rect class="box-p" x="310" y="88" width="45" height="64"/>
  <text class="t-zone" x="332" y="114" text-anchor="middle">完成部</text>

  <text class="t-desc" x="35" y="168">推進ジャッキはガーダー部にあり、フード部ではない</text>
  <text class="t-desc" x="35" y="186">裏込め注入はテール通過後すぐ、地山との隙間に充填する</text>

  <!-- Section 2: 土圧式・泥水式の違い -->
  <rect class="box-frame" x="20" y="226" width="360" height="140" rx="6"/>
  <text class="t-name" x="35" y="246">切羽保持方式：土圧式と泥水式の違い</text>

  <rect class="box-b" x="35" y="256" width="163" height="86" rx="6"/>
  <text class="t-zone" x="45" y="276">土圧式</text>
  <text class="t-desc" x="45" y="294">泥土圧で切羽を保持</text>
  <text class="t-desc" x="45" y="312">排土：スクリューコンベヤ</text>

  <rect class="box-b" x="202" y="256" width="163" height="86" rx="6"/>
  <text class="t-zone" x="212" y="276">泥水式</text>
  <text class="t-desc" x="212" y="294">泥水で切羽を保持</text>
  <text class="t-desc" x="212" y="312">排土：泥水で流体輸送</text>

  <text class="t-desc" x="35" y="358">違い：排土方法が異なる（コンベヤ／流体輸送）</text>

  <!-- Section 3: 各部の役割 -->
  <rect class="box-frame" x="20" y="376" width="360" height="114" rx="6"/>
  <text class="t-name" x="35" y="396">各部の役割</text>
  <text class="t-desc" x="35" y="414">フード部：カッターで地山を切削し、隔壁で切羽を保持</text>
  <text class="t-desc" x="35" y="432">ガーダー部：推進ジャッキがセグメントに反力をとり前進</text>
  <text class="t-desc" x="35" y="450">テール部：セグメントを組み立て、通過後に裏込め注入</text>
  <text class="t-desc" x="35" y="468">排土：土圧式はスクリューコンベヤ、泥水式は流体輸送</text>
</svg>
