<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="型枠支保工の支柱の種類別の措置の比較表。鋼管と木材は2m以内ごと、パイプサポートは3.5m超で2m以内ごと、鋼管枠は5層・5枠以内ごと、組立て鋼柱は4m超で4m以内ごとに水平つなぎを設ける">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-head { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-name { font-size: 13px; font-weight: bold; fill: #222; }
      .t-cell { font-size: 13px; fill: #222; }
      .t-sub { font-size: 11px; fill: #555; }
      .t-note { font-size: 12px; fill: #222; }
      .cell { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1; }
      .cell-alt { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1; }
      .cell-head { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- 見出し行 -->
  <rect class="cell-head" x="15" y="12" width="104" height="30"/> <!-- brand-fill / brand -->
  <rect class="cell-head" x="119" y="12" width="266" height="30"/>
  <text class="t-head" x="67" y="32" text-anchor="middle">支柱の種類</text>
  <text class="t-head" x="131" y="32">水平つなぎ・継ぎ方の要件</text>

  <!-- 鋼管 -->
  <rect class="cell" x="15" y="42" width="104" height="66"/>
  <rect class="cell" x="119" y="42" width="266" height="66"/>
  <text class="t-name" x="25" y="68">鋼管</text>
  <text class="t-sub" x="25" y="86">（サポート除く）</text>
  <text class="t-cell" x="131" y="63">高さ2m以内ごとに</text>
  <text class="t-cell" x="131" y="81">水平つなぎを2方向に設け、</text>
  <text class="t-cell" x="131" y="99">その変位を防止する</text>

  <!-- 木材 -->
  <rect class="cell-alt" x="15" y="108" width="104" height="66"/>
  <rect class="cell-alt" x="119" y="108" width="266" height="66"/>
  <text class="t-name" x="25" y="146">木材</text>
  <text class="t-cell" x="131" y="129">高さ2m以内ごとに</text>
  <text class="t-cell" x="131" y="147">水平つなぎを2方向に設ける</text>
  <text class="t-cell" x="131" y="165">継ぐときは添え物を2個以上</text>

  <!-- パイプサポート -->
  <rect class="cell" x="15" y="174" width="104" height="84"/>
  <rect class="cell" x="119" y="174" width="266" height="84"/>
  <text class="t-name" x="25" y="206">パイプ</text>
  <text class="t-name" x="25" y="224">サポート</text>
  <text class="t-cell" x="131" y="195">3本以上継いで使わない</text>
  <text class="t-cell" x="131" y="213">継ぐなら4つ以上のボルトか専用金具</text>
  <text class="t-cell" x="131" y="231">高さ3.5m超は、2m以内ごとに</text>
  <text class="t-cell" x="131" y="249">水平つなぎを2方向に設ける</text>

  <!-- 鋼管枠 -->
  <rect class="cell-alt" x="15" y="258" width="104" height="84"/>
  <rect class="cell-alt" x="119" y="258" width="266" height="84"/>
  <text class="t-name" x="25" y="304">鋼管枠</text>
  <text class="t-cell" x="131" y="279">枠と枠の間に交差筋かい</text>
  <text class="t-cell" x="131" y="297">最上層と5層以内ごとに、</text>
  <text class="t-cell" x="131" y="315">水平つなぎと布枠を</text>
  <text class="t-cell" x="131" y="333">5枠以内の間隔で設ける</text>

  <!-- 組立て鋼柱 -->
  <rect class="cell" x="15" y="342" width="104" height="66"/>
  <rect class="cell" x="119" y="342" width="266" height="66"/>
  <text class="t-name" x="25" y="370">組立て</text>
  <text class="t-name" x="25" y="388">鋼柱</text>
  <text class="t-cell" x="131" y="363">高さ4m超のとき、</text>
  <text class="t-cell" x="131" y="381">4m以内ごとに水平つなぎを</text>
  <text class="t-cell" x="131" y="399">2方向に設ける</text>

  <!-- 共通の措置 -->
  <rect class="box-warn" x="15" y="424" width="370" height="64" rx="6"/> <!-- warn-fill / warn -->
  <text class="t-note" x="200" y="446" text-anchor="middle">すべての支柱に共通（第242条）</text>
  <text class="t-sub" x="200" y="464" text-anchor="middle">沈下と滑動の防止・継手は突合せか差込み・鋼材は金具で緊結</text>
  <text class="t-sub" x="200" y="480" text-anchor="middle">重ね継手は認められない</text>
</svg>
