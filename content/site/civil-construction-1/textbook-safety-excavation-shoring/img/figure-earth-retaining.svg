<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="土止め支保工の構成。左右の土止め壁（親杭横矢板）を腹起しで受け、切りばりで突っ張り、隅部を火打ちで補強する断面図">
  <text x="200" y="24" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1a3a5c">土止め支保工の構成：土止め壁 ＋ 腹起し ＋ 切りばり（＋ 火打ち）</text>

  <!-- 地盤（左右の土） -->
  <rect x="24" y="110" width="52" height="320" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <rect x="324" y="110" width="52" height="320" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <!-- 掘削部（ピット） -->
  <rect x="76" y="110" width="248" height="320" fill="#ffffff"/>
  <line x1="24" y1="110" x2="376" y2="110" stroke="#8a8a8a" stroke-width="2"/>
  <text x="50" y="130" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8a8a">地山</text>
  <text x="350" y="130" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8a8a">地山</text>

  <!-- 土止め壁（親杭横矢板） -->
  <rect x="68" y="110" width="8" height="320" fill="#555"/>
  <rect x="324" y="110" width="8" height="320" fill="#555"/>

  <!-- 腹起し（内面の縦材） -->
  <rect x="76" y="190" width="9" height="140" fill="#1a3a5c"/>
  <rect x="315" y="190" width="9" height="140" fill="#1a3a5c"/>

  <!-- 切りばり（段） -->
  <rect x="85" y="204" width="230" height="9" fill="#2e6da4"/>
  <rect x="85" y="300" width="230" height="9" fill="#2e6da4"/>

  <!-- 火打ち（隅部の斜め） -->
  <polygon points="85,204 118,204 85,180" fill="none" stroke="#2e6da4" stroke-width="3"/>
  <polygon points="315,204 282,204 315,180" fill="none" stroke="#2e6da4" stroke-width="3"/>

  <!-- ラベル -->
  <line x1="72" y1="150" x2="150" y2="150" stroke="#8a8a8a" stroke-width="1"/>
  <text x="152" y="146" font-family="sans-serif" font-size="12" fill="#222">親杭横矢板</text>
  <text x="152" y="162" font-family="sans-serif" font-size="11" fill="#8a8a8a">（土止め壁）</text>

  <line x1="80" y1="260" x2="150" y2="260" stroke="#8a8a8a" stroke-width="1"/>
  <text x="152" y="264" font-family="sans-serif" font-size="12" fill="#222">腹起し</text>

  <line x1="200" y1="309" x2="200" y2="352" stroke="#8a8a8a" stroke-width="1"/>
  <text x="200" y="368" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">切りばり</text>

  <line x1="105" y1="192" x2="150" y2="192" stroke="#8a8a8a" stroke-width="1"/>
  <text x="152" y="196" font-family="sans-serif" font-size="12" fill="#222">火打ち</text>

  <!-- 補足 -->
  <rect x="24" y="392" width="352" height="88" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="200" y="414" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">組立図に基づき組立て（配置・寸法・材質・順序）第370条</text>
  <text x="200" y="434" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">作業主任者＝切りばり・腹起しの取付け／取外し 第374条</text>
  <text x="200" y="454" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">点検＝7日を超えない期間ごと・中震以上・大雨後 第373条</text>
  <text x="200" y="472" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8a8a">根拠：労働安全衛生規則</text>
</svg>
