<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="盛土の沈下とのり面勾配の変化。盛土が沈下するとのり面の勾配が変わり、計画の高さに戻すと天端の幅員が不足する。不足分は腹付け盛土で補い、あらかじめ沈下を見込んだ勾配で余裕幅を設けて施工する">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-lab   { font-size: 12px; fill: #222; }
      .t-key   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-warn  { font-size: 12px; font-weight: bold; fill: #b22234; }
      .t-note  { font-size: 11px; fill: #555; }
      .ground { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; }
      .body   { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 2; }
      .fill   { fill: #d0e8d0; stroke: none; }
      .plan   { stroke: #555; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
      .ext    { stroke: #8a8a8a; stroke-width: 1.5; fill: none; stroke-dasharray: 3 3; }
      .cl     { stroke: #8a8a8a; stroke-width: 1; fill: none; stroke-dasharray: 8 3 2 3; }
      .redl   { stroke: #b22234; stroke-width: 2; fill: none; }
      .box    { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
    <marker id="ar" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#b22234"/></marker>
  </defs>

  <text class="t-title" x="200" y="28" text-anchor="middle">盛土の沈下とのり面勾配の変化</text>
  <text class="t-lead" x="200" y="50" text-anchor="middle">沈下すると天端が狭くなる（断面の右半分）</text>

  <!-- 地盤 -->
  <rect class="ground" x="16" y="316" width="368" height="28"/>
  <!-- 腹付けで補う部分（計画断面と沈下後の差） -->
  <polygon class="fill" points="40,128 140,128 356,316 140,158 40,158"/>
  <!-- 沈下後の盛土 -->
  <path class="body" d="M 40,158 L 140,158 L 356,316 Q 200,338 40,332 Z"/>
  <!-- 計画断面 -->
  <path class="plan" d="M 40,128 L 140,128 L 356,316"/>
  <!-- 沈下後ののり面を計画の高さまで延ばした線 -->
  <line class="ext" x1="140" y1="158" x2="99" y2="128"/>
  <!-- 中心線 -->
  <line class="cl" x1="40" y1="116" x2="40" y2="340"/>
  <text class="t-note" x="40" y="108" text-anchor="middle">中心線</text>

  <!-- 沈下 -->
  <line class="redl" x1="68" y1="132" x2="68" y2="155" marker-end="url(#ar)"/>
  <text class="t-warn" x="78" y="148">沈下</text>

  <!-- 幅員不足 -->
  <line class="redl" x1="99" y1="116" x2="140" y2="116"/>
  <line class="redl" x1="99" y1="111" x2="99" y2="121"/>
  <line class="redl" x1="140" y1="111" x2="140" y2="121"/>
  <text class="t-warn" x="150" y="104" text-anchor="middle">幅員不足</text>

  <!-- 凡例 -->
  <line class="plan" x1="24" y1="371" x2="46" y2="371"/>
  <text class="t-note" x="52" y="375">計画の断面</text>
  <rect class="body" x="128" y="365" width="18" height="12" stroke-width="1.5"/>
  <text class="t-note" x="152" y="375">沈下後の盛土</text>
  <rect x="234" y="365" width="18" height="12" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
  <text class="t-note" x="258" y="375">腹付け盛土で補う部分</text>

  <!-- 要点 -->
  <rect class="box" x="16" y="392" width="368" height="98" rx="6"/>
  <text class="t-key" x="30" y="416">沈下</text>
  <text class="t-lab" x="104" y="416">のり面の勾配が変わり、天端の幅員が不足する</text>
  <text class="t-key" x="30" y="442">対策</text>
  <text class="t-lab" x="104" y="442">腹付け盛土で幅員を確保する</text>
  <text class="t-key" x="30" y="468">予防</text>
  <text class="t-lab" x="104" y="468">沈下を見込んだ勾配で仕上げ、余裕幅を設ける</text>
</svg>
