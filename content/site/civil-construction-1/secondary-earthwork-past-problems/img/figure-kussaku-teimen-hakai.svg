<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="掘削底面の破壊3現象。ヒービングは粘性土地盤で土留め壁背面の土が掘削面に回り込み底面が隆起する。ボイリングは砂質土地盤で水位差による浸透流により砂粒子が湧き上がる。盤ぶくれは被圧帯水層の水圧が上方地盤の抵抗力を超え底面が浮き上がる">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-lab   { font-size: 12px; fill: #222; }
      .t-key   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-note  { font-size: 11px; fill: #555; }
      .card   { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1.5; }
      .box    { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .sand   { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; }
      .clay   { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .aqui   { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .wall   { fill: #8a8a8a; stroke: #555; stroke-width: 1; }
      .redl   { stroke: #b22234; stroke-width: 2; fill: none; }
      .water  { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .wl     { stroke: #2e6da4; stroke-width: 1.5; fill: none; stroke-dasharray: 5 3; }
      .grain  { fill: #8a8a8a; stroke: none; }
    </style>
    <marker id="aw" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
    <marker id="ar" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#b22234"/></marker>
  </defs>

  <text class="t-title" x="200" y="28" text-anchor="middle">掘削底面の破壊3現象</text>
  <text class="t-lead" x="200" y="50" text-anchor="middle">土留め壁で囲った掘削の底面が壊れる、3つのしくみ</text>

  <!-- ヒービング -->
  <rect class="card" x="16" y="62" width="368" height="104" rx="6"/>
  <g transform="translate(26,72)">
    <polygon class="clay" points="0,6 70,6 70,30 144,30 144,84 0,84"/>
    <rect class="wall" x="64" y="6" width="6" height="52"/>
    <path class="redl" d="M 28,20 C 28,74 104,78 108,40" marker-end="url(#ar)"/>
    <path class="redl" d="M 74,30 Q 107,18 140,30"/>
  </g>
  <text class="t-key" x="184" y="88">ヒービング</text>
  <text class="t-note" x="184" y="106">粘性土地盤</text>
  <text class="t-lab" x="184" y="128">土留め壁背面の土が掘削面に</text>
  <text class="t-lab" x="184" y="148">回り込み、底面が隆起する</text>

  <!-- ボイリング -->
  <rect class="card" x="16" y="174" width="368" height="104" rx="6"/>
  <g transform="translate(26,184)">
    <polygon class="sand" points="0,6 70,6 70,30 144,30 144,84 0,84"/>
    <rect class="wall" x="64" y="6" width="6" height="52"/>
    <line class="wl" x1="0" y1="14" x2="62" y2="14"/>
    <line class="wl" x1="72" y1="30" x2="144" y2="30"/>
    <path class="water" d="M 22,22 C 22,78 118,78 118,42" marker-end="url(#aw)"/>
    <path class="water" d="M 44,22 C 44,64 94,64 94,42" marker-end="url(#aw)"/>
    <circle class="grain" cx="88" cy="22" r="2"/>
    <circle class="grain" cx="104" cy="16" r="2"/>
    <circle class="grain" cx="120" cy="22" r="2"/>
    <circle class="grain" cx="134" cy="15" r="2"/>
  </g>
  <text class="t-key" x="184" y="200">ボイリング</text>
  <text class="t-note" x="184" y="218">砂質土地盤</text>
  <text class="t-lab" x="184" y="240">水位差による浸透流で</text>
  <text class="t-lab" x="184" y="260">砂粒子が湧き上がる</text>

  <!-- 盤ぶくれ -->
  <rect class="card" x="16" y="286" width="368" height="104" rx="6"/>
  <g transform="translate(26,296)">
    <polygon class="sand" points="0,6 70,6 70,30 144,30 144,50 0,50"/>
    <rect class="aqui" x="0" y="50" width="144" height="34"/>
    <rect class="wall" x="64" y="6" width="6" height="40"/>
    <path class="redl" d="M 74,30 Q 107,18 140,30"/>
    <line class="redl" x1="90" y1="78" x2="90" y2="56" marker-end="url(#ar)"/>
    <line class="redl" x1="110" y1="78" x2="110" y2="56" marker-end="url(#ar)"/>
    <line class="redl" x1="130" y1="78" x2="130" y2="56" marker-end="url(#ar)"/>
    <text class="t-note" x="32" y="30" text-anchor="middle">上方地盤</text>
    <text class="t-note" x="32" y="72" text-anchor="middle">被圧帯水層</text>
  </g>
  <text class="t-key" x="184" y="312">盤ぶくれ</text>
  <text class="t-note" x="184" y="330">被圧帯水層の上の地盤</text>
  <text class="t-lab" x="184" y="352">水圧が上方地盤の抵抗力を</text>
  <text class="t-lab" x="184" y="372">超え、底面が浮き上がる</text>

  <!-- 要点 -->
  <rect class="box" x="16" y="402" width="368" height="88" rx="6"/>
  <text class="t-key" x="30" y="430">検討</text>
  <text class="t-lab" x="84" y="430">掘削底面の破壊に対する安定を検討する</text>
  <text class="t-key" x="30" y="462">改良</text>
  <text class="t-lab" x="84" y="462">背面側の地盤改良はヒービング・ボイリングに有効</text>
</svg>
