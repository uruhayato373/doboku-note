<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="盛土面の排水。盛土の上面が平らだと雨水がたまって浸透し、盛土が軟弱になる。上面に横断勾配をつけると、降った雨水は側方へ速やかに流れ、盛土の浸食と軟弱化を防げる">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-lab   { font-size: 12px; fill: #222; }
      .t-key   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-warn  { font-size: 12px; font-weight: bold; fill: #b22234; }
      .t-pos   { font-size: 12px; font-weight: bold; fill: #3a7d44; }
      .t-note  { font-size: 11px; fill: #555; }
      .ground { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; }
      .emb    { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 2; }
      .puddle { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .water  { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .rain   { stroke: #2e6da4; stroke-width: 1.5; fill: none; }
      .redl   { stroke: #b22234; stroke-width: 2; fill: none; }
      .gline  { stroke: #3a7d44; stroke-width: 2.5; fill: none; }
      .card   { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1.5; }
      .box    { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
    <marker id="aw" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#3a7d44"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#b22234"/></marker>
  </defs>

  <text class="t-title" x="200" y="28" text-anchor="middle">盛土面の排水</text>
  <text class="t-lead" x="200" y="50" text-anchor="middle">上面に横断勾配をつけ、雨水を側方へ流す</text>

  <!-- 上段：勾配なし -->
  <rect class="card" x="16" y="64" width="368" height="160" rx="6"/>
  <text class="t-warn" x="30" y="86">横断勾配がない</text>
  <text class="t-note" x="378" y="86" text-anchor="end">雨水がたまり、しみ込む</text>
  <line class="rain" x1="170" y1="100" x2="164" y2="114"/>
  <line class="rain" x1="200" y1="100" x2="194" y2="114"/>
  <line class="rain" x1="230" y1="100" x2="224" y2="114"/>
  <polygon class="emb" points="56,208 116,134 284,134 344,208"/>
  <rect class="puddle" x="150" y="128" width="100" height="6" rx="3"/>
  <line class="redl" x1="170" y1="146" x2="170" y2="184" marker-end="url(#ar)"/>
  <line class="redl" x1="200" y1="146" x2="200" y2="184" marker-end="url(#ar)"/>
  <line class="redl" x1="230" y1="146" x2="230" y2="184" marker-end="url(#ar)"/>
  <text class="t-note" x="100" y="200">盛土</text>

  <!-- 下段：勾配あり -->
  <rect class="card" x="16" y="232" width="368" height="160" rx="6"/>
  <text class="t-pos" x="30" y="254">横断勾配がある</text>
  <text class="t-note" x="378" y="254" text-anchor="end">雨水は側方へ速やかに流れる</text>
  <line class="rain" x1="170" y1="262" x2="164" y2="274"/>
  <line class="rain" x1="200" y1="262" x2="194" y2="274"/>
  <line class="rain" x1="230" y1="262" x2="224" y2="274"/>
  <polygon class="emb" points="56,376 116,308 200,286 284,308 344,376"/>
  <line class="gline" x1="194" y1="277" x2="122" y2="294" marker-end="url(#ag)"/>
  <line class="gline" x1="206" y1="277" x2="278" y2="294" marker-end="url(#ag)"/>
  <text class="t-pos" x="110" y="304" text-anchor="end">側方</text>
  <text class="t-pos" x="290" y="304">側方</text>
  <text class="t-note" x="200" y="344" text-anchor="middle">盛土</text>

  <!-- 要点 -->
  <rect class="box" x="16" y="402" width="368" height="88" rx="6"/>
  <text class="t-key" x="30" y="430">排水</text>
  <text class="t-lab" x="84" y="430">横断勾配で、雨水を側方へ速やかに排水する</text>
  <text class="t-key" x="30" y="462">目的</text>
  <text class="t-lab" x="84" y="462">雨水の浸透による盛土の浸食と軟弱化を防ぐ</text>
</svg>
