<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="ボックスカルバートの裏込めの施工。構造物の両側から同じ高さで薄層ずつ締め固めて偏土圧を避け、壁ぎわの狭い所は小型の締固め機械を使う">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-lab   { font-size: 12px; fill: #222; }
      .t-key   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-warn  { font-size: 12px; font-weight: bold; fill: #b22234; }
      .t-pos   { font-size: 12px; font-weight: bold; fill: #3a7d44; }
      .t-note  { font-size: 11px; fill: #555; }
      .ground { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; }   /* surface：地山・基礎地盤 */
      .soft   { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }   /* warn-fill：軟弱・高含水比 */
      .emb    { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 2; }     /* brand-fill：盛土 */
      .green  { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 2; }     /* positive-fill：対策・植生 */
      .bad    { fill: #f8d7da; stroke: #b22234; stroke-width: 2; }     /* danger-fill */
      .gline  { stroke: #3a7d44; stroke-width: 3; fill: none; }
      .gthin  { stroke: #3a7d44; stroke-width: 1.5; fill: none; }
      .water  { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .redl   { stroke: #b22234; stroke-width: 2; fill: none; }
      .redd   { stroke: #b22234; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
      .bluedd { stroke: #2e6da4; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
      .lead   { stroke: #555; stroke-width: 1; fill: none; }
      .card   { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1.5; }
      .box    { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .num    { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
    </style>
    <marker id="aw" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#3a7d44"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#b22234"/></marker>
  </defs>

  <text class="t-title" x="200" y="28" text-anchor="middle">ボックスカルバートの裏込め</text>
  <text class="t-lead" x="200" y="50" text-anchor="middle">薄層に分け、左右を同じ高さで締め固める</text>
  <rect class="ground" x="16" y="320" width="368" height="36"/>
  <text class="t-note" x="28" y="346">基礎地盤</text>
  <rect x="16" y="288" width="134" height="32" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <rect x="250" y="288" width="134" height="32" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text class="t-note" x="24" y="308">第1層</text>
  <rect x="16" y="256" width="134" height="32" fill="#f5f5f5" stroke="#2e6da4" stroke-width="1.5"/>
  <rect x="250" y="256" width="134" height="32" fill="#f5f5f5" stroke="#2e6da4" stroke-width="1.5"/>
  <text class="t-note" x="24" y="276">第2層</text>
  <rect x="16" y="224" width="134" height="32" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <rect x="250" y="224" width="134" height="32" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text class="t-note" x="24" y="244">第3層</text>
  <rect class="ground" x="150" y="224" width="100" height="96"/>
  <rect class="card" x="170" y="248" width="60" height="72"/>
  <text class="t-note" x="200" y="282" text-anchor="middle">カルバート</text>
  <rect class="card" x="104" y="206" width="36" height="18" rx="3"/>
  <text class="t-note" x="122" y="198" text-anchor="middle">小型の締固め機械</text>
  <line class="gthin" x1="188" y1="124" x2="40" y2="124" marker-end="url(#ag)"/>
  <line class="gthin" x1="212" y1="124" x2="360" y2="124" marker-end="url(#ag)"/>
  <text class="t-pos" x="200" y="128" text-anchor="middle">両側</text>
  <text class="t-note" x="200" y="146" text-anchor="middle">同じ高さで</text>

  <!-- 要点 -->
  <rect class="box" x="16" y="392" width="368" height="98" rx="6"/>
  <text class="t-key" x="30" y="416">順序</text>
  <text class="t-lab" x="104" y="416">薄層で、両側から均等に締め固める</text>
  <text class="t-key" x="30" y="442">狭い所</text>
  <text class="t-lab" x="104" y="442">小型の締固め機械で入念に</text>
  <text class="t-key" x="30" y="468">裏込め材</text>
  <text class="t-lab" x="104" y="468">圧縮性が小・透水性が良い・水浸に強い</text>
</svg>
