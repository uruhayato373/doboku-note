<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="構造物と盛土の接続部の段差対策。構造物の背面に良質な砂質土などの裏込め材を使い、薄い仕上り厚で各層を十分に締め固め、必要に応じて踏掛版を設けて、盛土の不同沈下による段差の影響を和らげる">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-lab   { font-size: 12px; fill: #222; }
      .t-key   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-warn  { font-size: 12px; font-weight: bold; fill: #b22234; }
      .t-note  { font-size: 11px; fill: #555; }
      .t-num   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .ground { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; }
      .struct { fill: #ffffff; stroke: #555; stroke-width: 1.5; }
      .back   { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .layer  { stroke: #2e6da4; stroke-width: 1; stroke-opacity: 0.5; fill: none; }
      .emb    { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; }
      .slab   { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 2; }
      .road   { stroke: #222; stroke-width: 2.5; fill: none; }
      .redl   { stroke: #b22234; stroke-width: 2; fill: none; }
      .thick  { stroke: #2e6da4; stroke-width: 1.5; fill: none; }
      .lead   { stroke: #555; stroke-width: 1; fill: none; }
      .num    { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box    { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
    <marker id="ar" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#b22234"/></marker>
    <marker id="aw2" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><polygon points="0,0 7,3.5 0,7" fill="#2e6da4"/></marker>
  </defs>

  <text class="t-title" x="200" y="28" text-anchor="middle">構造物と盛土の接続部</text>
  <text class="t-lead" x="200" y="50" text-anchor="middle">裏込め材・締固め・踏掛版で、不同沈下による段差を抑える</text>

  <!-- 地盤・構造物・裏込め部・盛土 -->
  <rect class="ground" x="16" y="328" width="368" height="26"/>
  <rect class="struct" x="20" y="136" width="110" height="192"/>
  <rect class="back" x="130" y="136" width="100" height="192"/>
  <line class="layer" x1="130" y1="160" x2="230" y2="160"/>
  <line class="layer" x1="130" y1="184" x2="230" y2="184"/>
  <line class="layer" x1="130" y1="208" x2="230" y2="208"/>
  <line class="layer" x1="130" y1="232" x2="230" y2="232"/>
  <line class="layer" x1="130" y1="256" x2="230" y2="256"/>
  <line class="layer" x1="130" y1="280" x2="230" y2="280"/>
  <line class="layer" x1="130" y1="304" x2="230" y2="304"/>
  <rect class="emb" x="230" y="136" width="154" height="192"/>
  <line class="road" x1="16" y1="136" x2="384" y2="136"/>

  <!-- 区分の名前 -->
  <text class="t-key" x="75" y="126" text-anchor="middle">構造物</text>
  <text class="t-key" x="165" y="126" text-anchor="middle">裏込め部</text>
  <text class="t-key" x="320" y="126" text-anchor="middle">盛土</text>
  <text class="t-note" x="75" y="236" text-anchor="middle">橋台・カルバート</text>

  <!-- 3 踏掛版 -->
  <rect class="slab" x="112" y="138" width="138" height="16"/>
  <line class="lead" x1="232" y1="107" x2="232" y2="138"/>
  <circle class="num" cx="232" cy="98" r="9"/>
  <text class="t-num" x="232" y="102" text-anchor="middle">3</text>

  <!-- 2 薄い仕上り厚 -->
  <line class="thick" x1="212" y1="233" x2="212" y2="255" marker-start="url(#aw2)" marker-end="url(#aw2)"/>
  <circle class="num" cx="170" cy="244" r="9"/>
  <text class="t-num" x="170" y="248" text-anchor="middle">2</text>

  <!-- 1 裏込め材 -->
  <circle class="num" cx="180" cy="316" r="9"/>
  <text class="t-num" x="180" y="320" text-anchor="middle">1</text>

  <!-- 不同沈下 -->
  <line class="redl" x1="268" y1="178" x2="268" y2="216" marker-end="url(#ar)"/>
  <line class="redl" x1="306" y1="178" x2="306" y2="216" marker-end="url(#ar)"/>
  <line class="redl" x1="344" y1="178" x2="344" y2="216" marker-end="url(#ar)"/>
  <text class="t-warn" x="307" y="250" text-anchor="middle">不同沈下</text>

  <!-- 要点 -->
  <rect class="box" x="16" y="392" width="368" height="98" rx="6"/>
  <circle class="num" cx="34" cy="412" r="9"/>
  <text class="t-num" x="34" y="416" text-anchor="middle">1</text>
  <text class="t-key" x="50" y="416">裏込め材</text>
  <text class="t-lab" x="108" y="416">良質な砂質土など、沈下の少ない材料</text>
  <circle class="num" cx="34" cy="438" r="9"/>
  <text class="t-num" x="34" y="442" text-anchor="middle">2</text>
  <text class="t-key" x="50" y="442">締固め</text>
  <text class="t-lab" x="108" y="442">薄い仕上り厚で、各層を十分に締め固める</text>
  <circle class="num" cx="34" cy="464" r="9"/>
  <text class="t-num" x="34" y="468" text-anchor="middle">3</text>
  <text class="t-key" x="50" y="468">踏掛版</text>
  <text class="t-lab" x="108" y="468">必要に応じて設け、段差の影響を和らげる</text>
</svg>
