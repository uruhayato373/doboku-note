<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="X̄-R管理図の作成手順。予備データの準備、平均値と範囲の計算、管理線の計算、記入と安定状態の判定、規格値との比較の順に進む。予備データを多数とれない建設現場では5-5-10-20-20方式を用いる">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-name { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-desc { font-size: 11px; fill: #555; }
      .t-num  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-sec  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-item { font-size: 11px; fill: #222; }
      .box-1 { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-2 { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-3 { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-surf { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .flow { stroke: #8a8a8a; stroke-width: 1.5; fill: none; }
      .rule { stroke: #d7d7d7; stroke-width: 1; }
    </style>
    <marker id="cc-a" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#8a8a8a"/>
    </marker>
  </defs>

  <text class="t-lead" x="200" y="18" text-anchor="middle">予備データから管理線を求め、判定して延長する</text>

  <rect class="box-1" x="20" y="28" width="360" height="62" rx="6"/>
  <text class="t-num" x="42" y="52">1</text>
  <text class="t-name" x="62" y="52">予備データの準備</text>
  <text class="t-desc" x="42" y="76">1群のデータ数（群の大きさ）は通常 3〜5 個</text>
  <line class="flow" x1="200" y1="90" x2="200" y2="100" marker-end="url(#cc-a)"/>

  <rect class="box-1" x="20" y="104" width="360" height="62" rx="6"/>
  <text class="t-num" x="42" y="128">2</text>
  <text class="t-name" x="62" y="128">平均値と範囲の計算</text>
  <text class="t-desc" x="42" y="152">各群の X̄ と R、さらに総平均と R の平均を求める</text>
  <line class="flow" x1="200" y1="166" x2="200" y2="176" marker-end="url(#cc-a)"/>

  <rect class="box-2" x="20" y="180" width="360" height="62" rx="6"/>
  <text class="t-num" x="42" y="204">3</text>
  <text class="t-name" x="62" y="204">管理線の計算</text>
  <text class="t-desc" x="42" y="228">X̄管理図と R管理図の中心線・上下の管理限界線を求める</text>
  <line class="flow" x1="200" y1="242" x2="200" y2="252" marker-end="url(#cc-a)"/>

  <rect class="box-2" x="20" y="256" width="360" height="62" rx="6"/>
  <text class="t-num" x="42" y="280">4</text>
  <text class="t-name" x="62" y="280">記入と安定状態の判定</text>
  <text class="t-desc" x="42" y="304">限界外の点は原因を調査・除去し、管理線を再計算する</text>
  <line class="flow" x1="200" y1="318" x2="200" y2="328" marker-end="url(#cc-a)"/>

  <rect class="box-3" x="20" y="332" width="360" height="62" rx="6"/>
  <text class="t-num" x="42" y="356">5</text>
  <text class="t-name" x="62" y="356">規格値との比較・限界線の決定</text>
  <text class="t-desc" x="42" y="380">ヒストグラムで規格と比較し、管理限界線を延長する</text>

  <rect class="box-surf" x="20" y="408" width="360" height="74" rx="6"/>
  <text class="t-sec" x="200" y="430" text-anchor="middle">5−5−10−20−20 方式</text>
  <line class="rule" x1="36" y1="439" x2="364" y2="439"/>
  <text class="t-item" x="200" y="460" text-anchor="middle">予備データを多数とれない建設現場では、最初の5群で</text>
  <text class="t-item" x="200" y="476" text-anchor="middle">次の5群を、10群で次の10群を…と順次管理する</text>
</svg>
