<!-- authored 2026-10-09 doboku-note 自作。題材は1級土木 専門土木テキスト「鋼構造物」の論点（橋の部位と長さの言葉）。特定の書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="3径間連続桁橋の側面図に、上部工・支承・下部工・基礎と、橋長・桁長・径間長・支間長・桁下高を書き込んだ模式図">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-dim  { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .t-in   { font-size: 11px; fill: #1a3a5c; }
      .t-sec  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-term { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-def  { font-size: 11px; fill: #555; }
      .up   { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .brg  { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .sub  { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; }
      .fnd  { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .pile { stroke: #3a7d44; stroke-width: 2.5; }
      .dim  { stroke: #555; stroke-width: 1.2; }
      .wit  { stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 2,2; }
      .ground { stroke: #8a8a8a; stroke-width: 1; }
      .sep  { stroke: #d7d7d7; stroke-width: 1; }
    </style>
  </defs>

  <text class="t-lead" x="200" y="14" text-anchor="middle">荷重の通り道：床版→主桁→支承→橋脚・橋台→基礎</text>

  <!-- ground -->
  <line class="ground" x1="10" y1="190" x2="382" y2="190"/>

  <!-- witness / center lines -->
  <line class="wit" x1="30" y1="50" x2="30" y2="108"/>
  <line class="wit" x1="340" y1="50" x2="340" y2="108"/>
  <line class="wit" x1="38" y1="68" x2="38" y2="108"/>
  <line class="wit" x1="332" y1="68" x2="332" y2="108"/>
  <line class="wit" x1="41" y1="86" x2="41" y2="108"/>
  <line class="wit" x1="329" y1="86" x2="329" y2="108"/>
  <line class="wit" x1="135" y1="86" x2="135" y2="146"/>
  <line class="wit" x1="235" y1="86" x2="235" y2="146"/>

  <!-- foundations (pile) -->
  <rect class="fnd" x="18" y="190" width="46" height="14"/>
  <rect class="fnd" x="109" y="190" width="52" height="14"/>
  <rect class="fnd" x="209" y="190" width="52" height="14"/>
  <rect class="fnd" x="306" y="190" width="46" height="14"/>
  <line class="pile" x1="26" y1="204" x2="26" y2="244"/>
  <line class="pile" x1="41" y1="204" x2="41" y2="244"/>
  <line class="pile" x1="56" y1="204" x2="56" y2="244"/>
  <line class="pile" x1="117" y1="204" x2="117" y2="244"/>
  <line class="pile" x1="135" y1="204" x2="135" y2="244"/>
  <line class="pile" x1="153" y1="204" x2="153" y2="244"/>
  <line class="pile" x1="217" y1="204" x2="217" y2="244"/>
  <line class="pile" x1="235" y1="204" x2="235" y2="244"/>
  <line class="pile" x1="253" y1="204" x2="253" y2="244"/>
  <line class="pile" x1="314" y1="204" x2="314" y2="244"/>
  <line class="pile" x1="329" y1="204" x2="329" y2="244"/>
  <line class="pile" x1="344" y1="204" x2="344" y2="244"/>

  <!-- substructure -->
  <path class="sub" d="M22,108 L30,108 L30,146 L60,146 L60,190 L22,190 Z"/>
  <path class="sub" d="M348,108 L340,108 L340,146 L310,146 L310,190 L348,190 Z"/>
  <rect class="sub" x="121" y="146" width="28" height="44"/>
  <rect class="sub" x="221" y="146" width="28" height="44"/>
  <text class="t-in" x="45" y="172" text-anchor="middle">橋台</text>
  <text class="t-in" x="325" y="172" text-anchor="middle">橋台</text>
  <text class="t-in" x="135" y="172" text-anchor="middle">橋脚</text>
  <text class="t-in" x="235" y="172" text-anchor="middle">橋脚</text>

  <!-- bearings -->
  <polygon class="brg" points="50,138 45,146 55,146"/>
  <polygon class="brg" points="135,138 130,146 140,146"/>
  <polygon class="brg" points="235,138 230,146 240,146"/>
  <polygon class="brg" points="320,138 315,146 325,146"/>
  <line class="dim" x1="238" y1="143" x2="252" y2="154"/>
  <text class="t-in" x="254" y="162">支承</text>

  <!-- superstructure -->
  <rect class="up" x="38" y="108" width="294" height="12"/>
  <rect class="up" x="38" y="120" width="294" height="18"/>
  <text class="t-in" x="185" y="117.5" text-anchor="middle">床版</text>
  <text class="t-in" x="185" y="133" text-anchor="middle">主桁</text>

  <!-- clearance under girder -->
  <line class="dim" x1="172" y1="138" x2="172" y2="190"/>
  <line class="dim" x1="167" y1="138" x2="177" y2="138"/>
  <line class="dim" x1="167" y1="190" x2="177" y2="190"/>
  <text class="t-dim" x="180" y="168">桁下高</text>

  <!-- dimension: bridge length -->
  <line class="dim" x1="30" y1="44" x2="340" y2="44"/>
  <line class="dim" x1="30" y1="38" x2="30" y2="50"/>
  <line class="dim" x1="340" y1="38" x2="340" y2="50"/>
  <text class="t-dim" x="185" y="40" text-anchor="middle">橋長</text>

  <!-- dimension: girder length -->
  <line class="dim" x1="38" y1="62" x2="332" y2="62"/>
  <line class="dim" x1="38" y1="56" x2="38" y2="68"/>
  <line class="dim" x1="332" y1="56" x2="332" y2="68"/>
  <text class="t-dim" x="185" y="58" text-anchor="middle">桁長</text>

  <!-- dimension: span between substructure centers -->
  <line class="dim" x1="41" y1="80" x2="329" y2="80"/>
  <line class="dim" x1="41" y1="74" x2="41" y2="86"/>
  <line class="dim" x1="135" y1="74" x2="135" y2="86"/>
  <line class="dim" x1="235" y1="74" x2="235" y2="86"/>
  <line class="dim" x1="329" y1="74" x2="329" y2="86"/>
  <text class="t-dim" x="88" y="76" text-anchor="middle">径間1</text>
  <text class="t-dim" x="185" y="76" text-anchor="middle">径間2</text>
  <text class="t-dim" x="282" y="76" text-anchor="middle">径間3</text>

  <!-- dimension: span between bearing centers -->
  <line class="dim" x1="50" y1="98" x2="320" y2="98"/>
  <line class="dim" x1="50" y1="92" x2="50" y2="104"/>
  <line class="dim" x1="135" y1="92" x2="135" y2="104"/>
  <line class="dim" x1="235" y1="92" x2="235" y2="104"/>
  <line class="dim" x1="320" y1="92" x2="320" y2="104"/>
  <text class="t-dim" x="185" y="94" text-anchor="middle">支間長</text>

  <text class="t-lead" x="135" y="258" text-anchor="middle">杭基礎の例</text>

  <!-- part chips -->
  <rect class="up"  x="20"  y="272" width="178" height="26" rx="6"/>
  <text class="t-sec" x="30"  y="289">上部工（床版・主桁）</text>
  <rect class="brg" x="202" y="272" width="178" height="26" rx="6"/>
  <text class="t-sec" x="212" y="289">支承（上下部の接続）</text>
  <rect class="sub" x="20"  y="302" width="178" height="26" rx="6"/>
  <text class="t-sec" x="30"  y="319">下部工（橋台・橋脚）</text>
  <rect class="fnd" x="202" y="302" width="178" height="26" rx="6"/>
  <text class="t-sec" x="212" y="319">基礎（杭・直接基礎）</text>

  <!-- length vocabulary -->
  <text class="t-sec" x="20" y="352">長さの言葉</text>

  <text class="t-term" x="26" y="374">橋長</text>
  <text class="t-def" x="86" y="374">橋台の胸壁（パラペット）前面間の距離</text>
  <line class="sep" x1="20" y1="383" x2="380" y2="383"/>
  <text class="t-term" x="26" y="401">桁長</text>
  <text class="t-def" x="86" y="401">桁の端から端までの長さ</text>
  <line class="sep" x1="20" y1="410" x2="380" y2="410"/>
  <text class="t-term" x="26" y="428">径間長</text>
  <text class="t-def" x="86" y="428">橋台・橋脚の中心間の距離</text>
  <line class="sep" x1="20" y1="437" x2="380" y2="437"/>
  <text class="t-term" x="26" y="455">支間長</text>
  <text class="t-def" x="86" y="455">支承の中心間の距離</text>
  <line class="sep" x1="20" y1="464" x2="380" y2="464"/>
  <text class="t-term" x="26" y="482">桁下高</text>
  <text class="t-def" x="86" y="482">桁の下面から地盤・路面・水面まで</text>
</svg>
