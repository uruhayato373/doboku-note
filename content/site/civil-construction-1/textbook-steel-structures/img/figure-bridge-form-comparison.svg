<!-- authored 2026-10-09 doboku-note 自作。題材は1級土木 専門土木テキスト「鋼構造物」の論点（橋の形式）。特定の書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="橋の6形式（桁橋・ラーメン橋・トラス橋・アーチ橋・斜張橋・吊橋）の側面を、力の受け方（曲げ・軸力・ケーブルの引張）と形式ごとの最大支間（ラーメン橋は目安）で比較する">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-name { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-desc { font-size: 11px; fill: #555; }
      .t-rec  { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-g { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .ln-b { stroke: #2e6da4; stroke-width: 2.5; fill: none; }
      .ln-w { stroke: #555; stroke-width: 2.5; fill: none; }
      .ln-g { stroke: #3a7d44; stroke-width: 2.5; fill: none; }
      .thin-b { stroke: #2e6da4; stroke-width: 1.2; fill: none; }
      .thin-w { stroke: #555; stroke-width: 1.2; fill: none; }
      .thin-g { stroke: #3a7d44; stroke-width: 1.2; fill: none; }
      .ground { stroke: #8a8a8a; stroke-width: 1; }
    </style>
    <marker id="bt-load" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0,0 7,3.5 0,7" fill="#555"/>
    </marker>
    <marker id="bt-thrust" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0,0 7,3.5 0,7" fill="#b22234"/>
    </marker>
  </defs>

  <text class="t-lead" x="200" y="14" text-anchor="middle">青＝曲げ　黄＝軸力　緑＝ケーブル引張</text>

  <!-- 1: ① 桁橋（I桁・箱桁） -->
  <rect class="box-b" x="20" y="24" width="360" height="72" rx="6"/>
  <line class="ground" x1="30" y1="86" x2="138" y2="86"/>
  <line class="ln-b" x1="46" y1="60" x2="46" y2="86"/>
  <line class="ln-b" x1="122" y1="60" x2="122" y2="86"/>
  <line class="ln-b" x1="34" y1="58" x2="134" y2="58" style="stroke-width:4"/>
  <path class="thin-b" d="M46,58 Q84,74 122,58" stroke-dasharray="3,2"/>
  <line x1="66" y1="34" x2="66" y2="50" stroke="#555" stroke-width="1.2" marker-end="url(#bt-load)"/>
  <line x1="84" y1="34" x2="84" y2="50" stroke="#555" stroke-width="1.2" marker-end="url(#bt-load)"/>
  <line x1="102" y1="34" x2="102" y2="50" stroke="#555" stroke-width="1.2" marker-end="url(#bt-load)"/>
  <text class="t-name" x="152" y="46">① 桁橋（I桁・箱桁）</text>
  <text class="t-desc" x="152" y="66">曲げとせん断で荷重を支点へ送る</text>
  <text class="t-rec" x="152" y="84">国内鋼橋の最大支間 250m</text>

  <!-- 2: ② ラーメン橋 -->
  <rect class="box-b" x="20" y="102" width="360" height="72" rx="6"/>
  <line class="ground" x1="30" y1="164" x2="138" y2="164"/>
  <line class="ln-b" x1="52" y1="136" x2="52" y2="164"/>
  <line class="ln-b" x1="116" y1="136" x2="116" y2="164"/>
  <line class="ln-b" x1="34" y1="136" x2="134" y2="136" style="stroke-width:4"/>
  <rect x="48" y="132" width="8" height="8" fill="#2e6da4"/>
  <rect x="112" y="132" width="8" height="8" fill="#2e6da4"/>
  <line x1="70" y1="112" x2="70" y2="128" stroke="#555" stroke-width="1.2" marker-end="url(#bt-load)"/>
  <line x1="84" y1="112" x2="84" y2="128" stroke="#555" stroke-width="1.2" marker-end="url(#bt-load)"/>
  <line x1="98" y1="112" x2="98" y2="128" stroke="#555" stroke-width="1.2" marker-end="url(#bt-load)"/>
  <text class="t-name" x="152" y="124">② ラーメン橋</text>
  <text class="t-desc" x="152" y="144">桁と橋脚を剛結し、曲げを分け合う</text>
  <text class="t-rec" x="152" y="162">公表値なし（目安は桁橋の範囲内）</text>

  <!-- 3: ③ トラス橋 -->
  <rect class="box-w" x="20" y="180" width="360" height="72" rx="6"/>
  <line class="ground" x1="30" y1="242" x2="138" y2="242"/>
  <line class="ln-w" x1="40" y1="234" x2="128" y2="234"/>
  <line class="ln-w" x1="54.5" y1="210" x2="113" y2="210"/>
  <path class="thin-w" style="stroke-width:2" d="M40,234 L54.5,210 L69,234 L83.5,210 L98,234 L113,210 L128,234"/>
  <line class="ln-w" x1="40" y1="234" x2="40" y2="242"/>
  <line class="ln-w" x1="128" y1="234" x2="128" y2="242"/>
  <text class="t-name" x="152" y="202">③ トラス橋</text>
  <text class="t-desc" x="152" y="222">三角形の骨組みで軸力に分解して受ける</text>
  <text class="t-rec" x="152" y="240">国内鋼橋の最大支間 510m</text>

  <!-- 4: ④ アーチ橋 -->
  <rect class="box-w" x="20" y="258" width="360" height="72" rx="6"/>
  <line class="ground" x1="30" y1="320" x2="142" y2="320"/>
  <line class="ln-w" x1="34" y1="288" x2="138" y2="288" style="stroke-width:4"/>
  <path class="ln-w" d="M40,320 Q86,256 132,320"/>
  <line class="thin-w" x1="49.2" y1="288" x2="49.2" y2="308.5"/>
  <line class="thin-w" x1="58.4" y1="288" x2="58.4" y2="299.5"/>
  <line class="thin-w" x1="67.6" y1="288" x2="67.6" y2="293.1"/>
  <line class="thin-w" x1="104.4" y1="288" x2="104.4" y2="293.1"/>
  <line class="thin-w" x1="113.6" y1="288" x2="113.6" y2="299.5"/>
  <line class="thin-w" x1="122.8" y1="288" x2="122.8" y2="308.5"/>
  <line x1="38" y1="316" x2="26" y2="316" stroke="#b22234" stroke-width="1.5" marker-end="url(#bt-thrust)"/>
  <line x1="134" y1="316" x2="146" y2="316" stroke="#b22234" stroke-width="1.5" marker-end="url(#bt-thrust)"/>
  <text class="t-name" x="152" y="280">④ アーチ橋</text>
  <text class="t-desc" x="152" y="300">圧縮で受け、脚部に水平スラスト</text>
  <text class="t-rec" x="152" y="318">国内鋼橋の最大支間 380m</text>

  <!-- 5: ⑤ 斜張橋 -->
  <rect class="box-g" x="20" y="336" width="360" height="72" rx="6"/>
  <line class="ground" x1="30" y1="398" x2="142" y2="398"/>
  <line class="ln-g" x1="86" y1="346" x2="86" y2="398" style="stroke-width:3.5"/>
  <line class="ln-g" x1="28" y1="386" x2="144" y2="386" style="stroke-width:4"/>
  <line class="ln-g" x1="34" y1="386" x2="34" y2="398"/>
  <line class="ln-g" x1="138" y1="386" x2="138" y2="398"/>
  <line class="thin-g" x1="86" y1="350" x2="44" y2="386"/>
  <line class="thin-g" x1="86" y1="350" x2="128" y2="386"/>
  <line class="thin-g" x1="86" y1="356" x2="60" y2="386"/>
  <line class="thin-g" x1="86" y1="356" x2="112" y2="386"/>
  <line class="thin-g" x1="86" y1="362" x2="74" y2="386"/>
  <line class="thin-g" x1="86" y1="362" x2="98" y2="386"/>
  <text class="t-name" x="152" y="358">⑤ 斜張橋</text>
  <text class="t-desc" x="152" y="378">塔から斜めのケーブルで桁を吊る</text>
  <text class="t-rec" x="152" y="396">国内鋼橋の最大支間 890m</text>

  <!-- 6: ⑥ 吊橋 -->
  <rect class="box-g" x="20" y="414" width="360" height="72" rx="6"/>
  <line class="ground" x1="20" y1="476" x2="150" y2="476"/>
  <line class="ln-g" x1="48" y1="426" x2="48" y2="476" style="stroke-width:3.5"/>
  <line class="ln-g" x1="124" y1="426" x2="124" y2="476" style="stroke-width:3.5"/>
  <line class="ln-g" x1="36" y1="464" x2="136" y2="464" style="stroke-width:4"/>
  <path class="thin-g" style="stroke-width:2" d="M30,460 L48,428 Q86,472 124,428 L142,460"/>
  <line class="thin-g" x1="60" y1="439.7" x2="60" y2="464"/>
  <line class="thin-g" x1="72" y1="447" x2="72" y2="464"/>
  <line class="thin-g" x1="86" y1="450" x2="86" y2="464"/>
  <line class="thin-g" x1="100" y1="447" x2="100" y2="464"/>
  <line class="thin-g" x1="112" y1="439.7" x2="112" y2="464"/>
  <rect x="22" y="458" width="10" height="16" fill="#ffffff" stroke="#3a7d44" stroke-width="1.5"/>
  <rect x="140" y="458" width="10" height="16" fill="#ffffff" stroke="#3a7d44" stroke-width="1.5"/>
  <text class="t-name" x="152" y="436">⑥ 吊橋</text>
  <text class="t-desc" x="152" y="456">主ケーブルの引張で桁を吊り、端で定着</text>
  <text class="t-rec" x="152" y="474">国内鋼橋の最大支間 1,991m</text>

</svg>
