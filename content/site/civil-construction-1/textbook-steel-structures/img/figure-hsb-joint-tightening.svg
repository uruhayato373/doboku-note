<!-- authored 2026-09-12 doboku-note 自作。題材は1級土木 専門土木テキスト「鋼構造物」の論点。特定の書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="高力ボルト摩擦接合部の断面（母材・連結板・ボルト・ナット・座金・摩擦面）と、中央から端部へ進める締付け順序を示す">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 11px; fill: #555; }
      .t-sec   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-legend{ font-size: 12px; fill: #222; }
      .t-desc  { font-size: 11px; fill: #555; }
      .t-num   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-s { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .ln { stroke: #222; stroke-width: 2; }
      .arrow { stroke: #2e6da4; stroke-width: 1.5; }
    </style>
    <marker id="hsb-arrow" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/>
    </marker>
  </defs>

  <text class="t-lead" x="200" y="16" text-anchor="middle">連結板と母材の摩擦力で応力を伝える接合</text>

  <text class="t-sec" x="20" y="36">断面構成（母材・連結板・ボルト）</text>

  <!-- bolt head + washer top -->
  <rect class="box-s" x="105" y="60" width="30" height="10" rx="2"/>
  <rect class="box-s" x="225" y="60" width="30" height="10" rx="2"/>
  <rect x="106" y="70" width="28" height="4" fill="#d7d7d7" stroke="#8a8a8a" stroke-width="1"/>
  <rect x="226" y="70" width="28" height="4" fill="#d7d7d7" stroke="#8a8a8a" stroke-width="1"/>

  <!-- splice plate top -->
  <rect class="box-w" x="70" y="74" width="260" height="20"/>

  <!-- main member (left / right with joint gap) -->
  <rect class="box-b" x="30" y="94" width="160" height="46"/>
  <rect class="box-b" x="210" y="94" width="160" height="46"/>
  <line class="ln" x1="190" y1="94" x2="190" y2="140" stroke="#8a8a8a" stroke-dasharray="3,3"/>
  <line class="ln" x1="210" y1="94" x2="210" y2="140" stroke="#8a8a8a" stroke-dasharray="3,3"/>

  <!-- splice plate bottom -->
  <rect class="box-w" x="70" y="140" width="260" height="20"/>

  <!-- washer + nut bottom -->
  <rect x="106" y="160" width="28" height="4" fill="#d7d7d7" stroke="#8a8a8a" stroke-width="1"/>
  <rect x="226" y="160" width="28" height="4" fill="#d7d7d7" stroke="#8a8a8a" stroke-width="1"/>
  <rect class="box-s" x="105" y="164" width="30" height="12" rx="2"/>
  <rect class="box-s" x="225" y="164" width="30" height="12" rx="2"/>

  <!-- bolt shafts through the stack -->
  <line class="ln" x1="120" y1="60" x2="120" y2="176"/>
  <line class="ln" x1="240" y1="60" x2="240" y2="176"/>

  <!-- friction surface markers -->
  <line x1="70" y1="94" x2="330" y2="94" stroke="#b22234" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="70" y1="140" x2="330" y2="140" stroke="#b22234" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- legend -->
  <rect x="26" y="192" width="14" height="14" class="box-b"/>
  <text class="t-legend" x="44" y="204">母材</text>
  <rect x="96" y="192" width="14" height="14" class="box-w"/>
  <text class="t-legend" x="114" y="204">連結板</text>
  <rect x="184" y="192" width="14" height="14" class="box-s"/>
  <text class="t-legend" x="202" y="204">ボルト・ナット・座金</text>

  <text class="t-desc" x="20" y="228">連結板が母材を両側から挟み込み、摩擦面の摩擦力で応力を伝える</text>
  <text class="t-desc" x="20" y="244">赤の破線が摩擦面、中央の隙間は母材どうしの継手（突合せ部）</text>

  <text class="t-sec" x="20" y="270">締付け順序：継手の中央から端部へ</text>

  <line x1="200" y1="284" x2="200" y2="336" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3,3"/>

  <circle cx="170" cy="310" r="14" class="box-b"/>
  <text class="t-num" x="170" y="314" text-anchor="middle">1</text>
  <circle cx="230" cy="310" r="14" class="box-b"/>
  <text class="t-num" x="230" y="314" text-anchor="middle">2</text>
  <circle cx="120" cy="310" r="14" class="box-b"/>
  <text class="t-num" x="120" y="314" text-anchor="middle">3</text>
  <circle cx="280" cy="310" r="14" class="box-b"/>
  <text class="t-num" x="280" y="314" text-anchor="middle">4</text>
  <circle cx="70" cy="310" r="14" class="box-b"/>
  <text class="t-num" x="70" y="314" text-anchor="middle">5</text>
  <circle cx="330" cy="310" r="14" class="box-b"/>
  <text class="t-num" x="330" y="314" text-anchor="middle">6</text>

  <line class="arrow" x1="156" y1="310" x2="134" y2="310" marker-end="url(#hsb-arrow)"/>
  <line class="arrow" x1="106" y1="310" x2="84" y2="310" marker-end="url(#hsb-arrow)"/>
  <line class="arrow" x1="244" y1="310" x2="266" y2="310" marker-end="url(#hsb-arrow)"/>
  <line class="arrow" x1="294" y1="310" x2="316" y2="310" marker-end="url(#hsb-arrow)"/>

  <text class="t-desc" x="200" y="352" text-anchor="middle">中央から外側へ締めないと連結板が浮き上がる</text>

  <rect class="box-w" x="20" y="374" width="360" height="96" rx="6"/>
  <text class="t-sec" x="40" y="402">検査方式の要点</text>
  <line class="ln" x1="40" y1="424" x2="90" y2="424" stroke="#d4a017"/>
  <line class="ln" x1="90" y1="424" x2="96" y2="418" stroke="#d4a017"/>
  <line class="ln" x1="96" y1="418" x2="102" y2="430" stroke="#d4a017"/>
  <line class="ln" x1="102" y1="430" x2="110" y2="424" stroke="#d4a017"/>
  <text class="t-desc" x="128" y="428">トルシア形は専用工具の締付けで</text>
  <text class="t-desc" x="128" y="450">ピンテールが破断したら完了と確認する</text>
</svg>
