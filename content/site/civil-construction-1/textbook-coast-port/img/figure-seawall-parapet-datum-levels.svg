<!-- authored 2026-10-08 doboku-note 自作。堤防・護岸・胸壁の断面と基準水位（HHWL・HWL・LWL）の関係を示す概念図。特定の書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="海岸堤防と護岸の断面と基準水位。堤防は裏法を持ち天端に胸壁（波返し）を載せる。護岸は裏法がなく天端が地盤とほぼ同じ高さ。水位は高い順に既往最高潮位HHWL（設計高潮位の候補の一つ）、朔望平均満潮位HWL、朔望平均干潮位LWL">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #8a8a8a; }
      .t-name { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-lv { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .t-desc { font-size: 11px; fill: #555; }
      .frame { fill: none; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-s { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .body { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .parapet { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .level { stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 4 3; }
      .leader { stroke: #8a8a8a; stroke-width: 1; }
    </style>
  </defs>

  <text class="t-lead" x="200" y="16" text-anchor="middle">胸壁を載せた堤防と護岸の断面、左側に基準水位</text>

  <!-- 上段：堤防＋胸壁 -->
  <rect class="frame" x="20" y="28" width="360" height="244" rx="6"/>
  <text class="t-desc" x="34" y="50">海</text>
  <text class="t-desc" x="346" y="50">陸</text>
  <rect x="30" y="240" width="340" height="12" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <polygon points="30,186 116.4,186 70,240 30,240" fill="#e8f0fe"/>
  <polygon class="body" points="70,240 180,112 250,112 330,240"/>
  <polygon class="parapet" points="190,112 190,84 178,84 171,92 180,94 180,112"/>
  <line class="level" x1="34" y1="140" x2="156" y2="140"/>
  <line x1="34" y1="186" x2="116" y2="186" stroke="#2e6da4" stroke-width="1.5"/>
  <line class="level" x1="34" y1="222" x2="86" y2="222"/>
  <text class="t-lv" x="36" y="134">HHWL</text>
  <text class="t-lv" x="36" y="180">HWL</text>
  <text class="t-lv" x="36" y="216">LWL</text>
  <text class="t-desc" x="96" y="72">胸壁（波返し）</text>
  <line class="leader" x1="170" y1="76" x2="176" y2="85"/>
  <text class="t-name" x="205" y="192" text-anchor="middle">堤防</text>
  <text class="t-desc" x="205" y="208" text-anchor="middle">裏法あり</text>
  <text class="t-desc" x="294" y="156">裏法</text>
  <line class="leader" x1="292" y1="153" x2="281" y2="160"/>

  <!-- 下段：護岸 -->
  <rect class="frame" x="20" y="282" width="360" height="110" rx="6"/>
  <polygon points="30,350 160.9,350 110,376 30,376" fill="#e8f0fe"/>
  <rect x="30" y="376" width="340" height="8" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <polygon points="110,376 200,330 370,330 370,376" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <line x1="110" y1="376" x2="200" y2="330" stroke="#3a7d44" stroke-width="5" stroke-linecap="round"/>
  <text class="t-name" x="290" y="356" text-anchor="middle">護岸</text>
  <text class="t-desc" x="290" y="372" text-anchor="middle">裏法なし</text>
  <text class="t-desc" x="120" y="322">天端は地盤とほぼ同じ高さ</text>

  <!-- 基準水位の意味 -->
  <rect class="box-s" x="20" y="400" width="360" height="82" rx="6"/>
  <text class="t-lv" x="36" y="420">HHWL</text>
  <text class="t-desc" x="78" y="420">既往最高潮位：観測最高の潮位。設計高潮位の候補</text>
  <text class="t-lv" x="36" y="442">HWL</text>
  <text class="t-desc" x="78" y="442">朔望平均満潮位：新月・満月ごろの満潮面の平均</text>
  <text class="t-lv" x="36" y="464">LWL</text>
  <text class="t-desc" x="78" y="464">朔望平均干潮位：新月・満月ごろの干潮面の平均</text>
</svg>
