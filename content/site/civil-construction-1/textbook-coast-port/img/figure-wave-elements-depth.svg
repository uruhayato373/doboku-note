<!-- authored 2026-10-08 doboku-note 自作。題材は1級土木 専門土木テキスト「海岸・港湾」の波の基本量。特定の書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="波の断面図。山と谷の高さの差が波高H、山から山までが波長L、静水面から海底までが水深h。波速はC=L/T。水深と波長の比で深海波・中間の波・浅海波に分ける">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #8a8a8a; }
      .t-name { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-dim { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-desc { font-size: 11px; fill: #555; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-p { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-s { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .wave { fill: none; stroke: #2e6da4; stroke-width: 2; }
      .guide { stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 4 3; }
      .dim { stroke: #555; stroke-width: 1.5; }
    </style>
    <marker id="arr" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#555"/>
    </marker>
  </defs>

  <text class="t-lead" x="200" y="16" text-anchor="middle">波は波高・波長・周期で表し、水深との比で性質が変わる</text>

  <!-- 海水（静水面より下）と海底 -->
  <path d="M10,140 C35.5,140 54.5,80 80,80 C105.5,80 124.5,140 150,140 C175.5,140 194.5,80 220,80 C245.5,80 264.5,140 290,140 L290,215 L10,215 Z" fill="#e8f0fe"/>
  <rect x="10" y="215" width="280" height="14" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <path class="wave" d="M10,140 C35.5,140 54.5,80 80,80 C105.5,80 124.5,140 150,140 C175.5,140 194.5,80 220,80 C245.5,80 264.5,140 290,140"/>
  <line class="guide" x1="10" y1="110" x2="310" y2="110"/>
  <text class="t-desc" x="14" y="104">静水面</text>
  <text class="t-desc" x="298" y="226">海底</text>

  <!-- 波長 L -->
  <line class="guide" x1="80" y1="54" x2="80" y2="78"/>
  <line class="guide" x1="220" y1="54" x2="220" y2="78"/>
  <line class="dim" x1="150" y1="58" x2="82" y2="58" marker-end="url(#arr)"/>
  <line class="dim" x1="150" y1="58" x2="218" y2="58" marker-end="url(#arr)"/>
  <text class="t-dim" x="150" y="50" text-anchor="middle">波長 L</text>

  <!-- 波高 H -->
  <line class="guide" x1="220" y1="80" x2="322" y2="80"/>
  <line class="guide" x1="290" y1="140" x2="322" y2="140"/>
  <line class="dim" x1="318" y1="110" x2="318" y2="82" marker-end="url(#arr)"/>
  <line class="dim" x1="318" y1="110" x2="318" y2="138" marker-end="url(#arr)"/>
  <text class="t-dim" x="326" y="114">波高 H</text>

  <!-- 水深 h -->
  <line class="dim" x1="30" y1="162" x2="30" y2="112" marker-end="url(#arr)"/>
  <line class="dim" x1="30" y1="162" x2="30" y2="213" marker-end="url(#arr)"/>
  <text class="t-dim" x="38" y="170">水深 h</text>

  <!-- 波速 -->
  <rect class="box-s" x="20" y="244" width="360" height="48" rx="6"/>
  <text class="t-name" x="36" y="265">波速 C ＝ 波長 L ÷ 周期 T</text>
  <text class="t-desc" x="36" y="282">周期 T：山が一つ通り過ぎる時間（浅くなっても不変）</text>

  <!-- 水深と波長の比による区分 -->
  <rect class="box-b" x="20" y="304" width="360" height="52" rx="6"/>
  <text class="t-name" x="36" y="326">深海波　h/L ＞ 1/2</text>
  <text class="t-desc" x="36" y="344">水底の影響なし　波速 C ≈ 1.56T（m/s）</text>

  <rect class="box-w" x="20" y="364" width="360" height="52" rx="6"/>
  <text class="t-name" x="36" y="386">中間の波　1/20 ＜ h/L ＜ 1/2</text>
  <text class="t-desc" x="36" y="404">水深と波長の両方で波速が決まる</text>

  <rect class="box-p" x="20" y="424" width="360" height="52" rx="6"/>
  <text class="t-name" x="36" y="446">浅海波（長波）　h/L ＜ 1/20</text>
  <text class="t-desc" x="36" y="464">波速は水深だけで決まる　C ＝ √(gh)</text>
</svg>
