<!-- authored 2026-10-08 doboku-note 自作。風浪とうねりの波形の違いと合成波高の考え方を示す概念図。特定の書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="有義波高は風浪とうねりの重なりとして読む。風浪はその場の風で発達中の波、うねりは遠くから減衰しながら伝わる波。合成波高はH_windとH_swellの二乗和の平方根で、風浪2.0mとうねり1.0mなら約2.2mで、単純な和の3.0mにはならない">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #8a8a8a; }
      .t-name { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-formula { font-size: 14px; font-weight: bold; fill: #1a3a5c; }
      .t-desc { font-size: 11px; fill: #555; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-p { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-s { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .wave-wind { fill: none; stroke: #2e6da4; stroke-width: 1.8; stroke-linejoin: round; }
      .wave-swell { fill: none; stroke: #3a7d44; stroke-width: 2; }
    </style>
  </defs>

  <text class="t-lead" x="200" y="16" text-anchor="middle">有義波高は、風浪とうねりの重なりとして読む</text>

  <!-- 風浪 -->
  <rect class="box-b" x="20" y="28" width="360" height="128" rx="6"/>
  <text class="t-name" x="36" y="50">風浪（その場の風で発達中）</text>
  <text class="t-desc" x="36" y="68">風速・吹送距離・吹続時間で発達。山が尖り不揃い</text>
  <polyline class="wave-wind" points="36,122 50,100 60,120 70,108 84,92 98,120 108,110 118,122 130,98 142,120 154,106 166,94 180,120 190,112 202,122 214,96 226,120 236,108 248,90 262,120 272,110 284,122 296,100 308,120 318,108 332,94 346,120 356,114 364,122"/>

  <!-- うねり -->
  <rect class="box-p" x="20" y="164" width="360" height="128" rx="6"/>
  <text class="t-name" x="36" y="186">うねり（遠くから伝わり減衰）</text>
  <text class="t-desc" x="36" y="204">風域を離れて残る。周期が長く、形は規則的で丸い</text>
  <path class="wave-swell" d="M44,236 C73.1,236 94.9,272 124,272 C153.1,272 174.9,236 204,236 C233.1,236 254.9,272 284,272 C313.1,272 334.9,236 364,236"/>

  <!-- 合成 -->
  <rect class="box-s" x="20" y="300" width="360" height="180" rx="6"/>
  <text class="t-name" x="36" y="322">合成波高（エネルギーで足す）</text>
  <text class="t-formula" x="36" y="346">H ＝ √（H<tspan dy="3" font-size="11">wind</tspan><tspan dy="-3">² ＋ H</tspan><tspan dy="3" font-size="11">swell</tspan><tspan dy="-3">²）</tspan></text>

  <text class="t-desc" x="36" y="373">風浪 2.0 m</text>
  <rect x="136" y="362" width="80" height="14" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text class="t-desc" x="36" y="395">うねり 1.0 m</text>
  <rect x="136" y="384" width="40" height="14" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
  <text class="t-desc" x="36" y="417">合成 約2.2 m</text>
  <rect x="136" y="406" width="88" height="14" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text class="t-desc" x="36" y="439">単純な和 3.0 m</text>
  <rect x="136" y="428" width="120" height="14" fill="none" stroke="#b22234" stroke-width="1.5" stroke-dasharray="4 3"/>

  <text class="t-desc" x="36" y="466">エネルギーが波高の2乗に比例するため、2乗して足す</text>
</svg>
