<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="補強土の考え方。盛土の中に補強材を層状に敷き、補強材と盛土材の摩擦で引抜きに抵抗させる。前に押し出そうとする土圧を補強材が引き留め、急な壁面でも盛土が立つ">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-lab   { font-size: 12px; fill: #222; }
      .t-key   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-note  { font-size: 11px; fill: #555; }
      .ground { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; }   /* surface */
      .wet    { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }   /* warn-fill：湿った土・帯水層 */
      .emb    { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 2; }     /* brand-fill：盛土・構造物 */
      .green  { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 2; }     /* positive-fill */
      .reinf  { stroke: #3a7d44; stroke-width: 3; }
      .water  { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .wl     { stroke: #2e6da4; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
      .push   { stroke: #b22234; stroke-width: 2.5; fill: none; }
      .lead   { stroke: #555; stroke-width: 1; fill: none; }
      .box    { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
    <marker id="aw" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#3a7d44"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#b22234"/></marker>
  </defs>
  <text class="t-title" x="200" y="28" text-anchor="middle">補強土工法の考え方</text>
  <text class="t-lead" x="200" y="50" text-anchor="middle">補強材と盛土材の摩擦で、土圧を引き留める</text>
  <rect class="ground" x="16" y="330" width="368" height="22"/>
  <polygon class="emb" points="96,330 96,96 384,96 384,330"/>
  <rect class="green" x="84" y="96" width="14" height="234"/>
  <text class="t-key" x="56" y="90" text-anchor="middle" style="fill:#3a7d44">壁面材</text>
  <line class="lead" x1="70" y1="94" x2="88" y2="110"/>
  <line class="reinf" x1="98" y1="130" x2="330" y2="130"/>
  <line class="reinf" x1="98" y1="170" x2="330" y2="170"/>
  <line class="reinf" x1="98" y1="210" x2="330" y2="210"/>
  <line class="reinf" x1="98" y1="250" x2="330" y2="250"/>
  <line class="reinf" x1="98" y1="290" x2="330" y2="290"/>
  <text class="t-key" x="214" y="122" text-anchor="middle" style="fill:#3a7d44">補強材（ジオテキスタイル・帯鋼など）</text>
  <line class="push" x1="190" y1="232" x2="112" y2="232" marker-end="url(#ar)"/>
  <text class="t-key" x="150" y="226" text-anchor="middle" style="fill:#b22234">土圧</text>
  <line class="reinf" x1="250" y1="236" x2="320" y2="236" marker-end="url(#ag)" style="stroke-width:2.5"/>
  <text class="t-key" x="290" y="226" text-anchor="middle" style="fill:#3a7d44">摩擦で引抜きに抵抗</text>
  <text class="t-lab" x="240" y="190" text-anchor="middle">盛土材</text>
  <rect class="box" x="16" y="392" width="368" height="92" rx="6"/>
  <text class="t-key" x="30" y="414">効果</text>
  <text class="t-lab" x="104" y="414">土圧を減らし、急勾配の盛土・壁を立てる</text>
  <text class="t-key" x="30" y="440">長所</text>
  <text class="t-lab" x="104" y="440">軽く、沈下に追随しやすく、施工が早い</text>
  <text class="t-key" x="30" y="466">使い道</text>
  <text class="t-lab" x="104" y="466">補強土壁・急勾配盛土・軟弱地盤上の盛土</text>
</svg>
