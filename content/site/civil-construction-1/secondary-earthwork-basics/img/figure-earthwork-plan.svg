<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="土工計画の検討の流れ。各種調査結果を踏まえ、土量の算定と配分、施工法と機械の選定を行い、最も経済的に施工できるかを評価して工事実施計画に進む。不経済なら見直す。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-lab   { font-size: 12px; fill: #222; }
      .t-key   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-warn  { font-size: 12px; font-weight: bold; fill: #b22234; }
      .t-pos   { font-size: 12px; font-weight: bold; fill: #3a7d44; }
      .t-note  { font-size: 11px; fill: #555; }
      .soil   { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }   /* warn-fill：土・地盤 */
      .brand  { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 2; }     /* brand-fill：構造物・機械 */
      .green  { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 2; }     /* positive-fill：改良部・杭 */
      .bad    { fill: #f8d7da; stroke: #b22234; stroke-width: 2; }     /* danger-fill */
      .weak   { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; }
      .card   { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1.5; }
      .water  { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .wl     { stroke: #2e6da4; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
      .lead   { stroke: #555; stroke-width: 1; fill: none; }
      .box    { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
    <marker id="figure-earthwork-plan-ab" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker>
    <marker id="figure-earthwork-plan-ag" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#3a7d44"/></marker>
    <marker id="figure-earthwork-plan-ar" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#b22234"/></marker>
    <marker id="figure-earthwork-plan-ak" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#555"/></marker>
  </defs>
  <text class="t-title" x="200" y="28" text-anchor="middle">土工計画の立て方</text>
  <text class="t-lead" x="200" y="50" text-anchor="middle">調査結果から、土量と施工法を決めて評価する</text>
  <rect class="brand" x="50" y="68" width="230" height="50" rx="6" style="stroke-width:1.5"/>
  <text class="t-key" x="165" y="90" text-anchor="middle">1 各種調査の結果を整理</text>
  <text class="t-note" x="165" y="108" text-anchor="middle">現場の条件と資料をそろえる</text>
  <rect class="brand" x="50" y="138" width="230" height="50" rx="6" style="stroke-width:1.5"/>
  <text class="t-key" x="165" y="160" text-anchor="middle">2 土量の算定と配分</text>
  <text class="t-note" x="165" y="178" text-anchor="middle">盛土材料は切土から転用が原則</text>
  <rect class="brand" x="50" y="208" width="230" height="50" rx="6" style="stroke-width:1.5"/>
  <text class="t-key" x="165" y="230" text-anchor="middle">3 施工法・機械の選定</text>
  <text class="t-note" x="165" y="248" text-anchor="middle">安全を含め、経済的な方法を検討</text>
  <rect class="brand" x="50" y="278" width="230" height="50" rx="6" style="stroke-width:1.5"/>
  <text class="t-key" x="165" y="300" text-anchor="middle">4 評価</text>
  <text class="t-note" x="165" y="318" text-anchor="middle">最も経済的に施工できるか</text>
  <rect class="green" x="50" y="350" width="230" height="30" rx="6" style="stroke-width:1.5"/>
  <text class="t-key" x="165" y="370" text-anchor="middle" style="fill:#3a7d44">工事実施計画</text>
  <line class="water" x1="165" y1="118" x2="165" y2="136" marker-end="url(#figure-earthwork-plan-ab)"/>
  <line class="water" x1="165" y1="188" x2="165" y2="206" marker-end="url(#figure-earthwork-plan-ab)"/>
  <line class="water" x1="165" y1="258" x2="165" y2="276" marker-end="url(#figure-earthwork-plan-ab)"/>
  <line class="water" x1="165" y1="328" x2="165" y2="348" marker-end="url(#figure-earthwork-plan-ag)" style="stroke:#3a7d44"/>
  <text class="t-note" x="176" y="342">よい</text>
  <path class="water" d="M 280 303 L 316 303 L 316 163 L 284 163" marker-end="url(#figure-earthwork-plan-ar)" style="stroke:#b22234"/>
  <text class="t-warn" x="324" y="236">見直し</text>
  <text class="t-note" x="324" y="252">不経済なら</text>
  <rect class="box" x="16" y="392" width="368" height="66" rx="6"/>
  <text class="t-key" x="30" y="414">目的</text>
  <text class="t-lab" x="104" y="414">工事の安全を含め、最も経済的な方法を決める</text>
  <text class="t-key" x="30" y="440">原則</text>
  <text class="t-lab" x="104" y="440">盛土の材料は切土から転用する</text>

</svg>
