<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="ウェルポイント工法。掘削箇所の両側および周辺を吸水装置のウェルポイントで取り囲み、先端の吸水部から地下水を真空ポンプで強制的に排水して地下水位を下げる。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-lab   { font-size: 12px; fill: #222; }
      .t-key   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-warn  { font-size: 12px; font-weight: bold; fill: #b22234; }
      .t-pos   { font-size: 12px; font-weight: bold; fill: #3a7d44; }
      .t-note  { font-size: 11px; fill: #555; }
      .soil   { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }   /* warn-fill：土・地盤 */
      .brand  { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 2; }     /* brand-fill：構造物・機械 */
      .green  { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 2; }     /* positive-fill：改良部・杭 */
      .bad    { fill: #f8d7da; stroke: #b22234; stroke-width: 2; }     /* danger-fill */
      .weak   { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; }
      .card   { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1.5; }
      .water  { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .wl     { stroke: #2e6da4; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
      .lead   { stroke: #555; stroke-width: 1; fill: none; }
      .box    { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
    <marker id="figure-wellpoint-ab" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker>
    <marker id="figure-wellpoint-ag" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#3a7d44"/></marker>
    <marker id="figure-wellpoint-ar" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#b22234"/></marker>
    <marker id="figure-wellpoint-ak" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#555"/></marker>
  </defs>
  <text class="t-title" x="200" y="28" text-anchor="middle">ウェルポイント工法</text>
  <text class="t-lead" x="200" y="50" text-anchor="middle">掘削箇所を吸水装置で囲み、真空ポンプで水位を下げる</text>
  <rect class="soil" x="16" y="130" width="368" height="220"/>
  <line class="wl" x1="16" y1="162" x2="384" y2="162"/>
  <polygon points="140,130 166,230 234,230 260,130" style="fill:#ffffff;stroke:#8a8a8a;stroke-width:1.5"/>
  <path d="M 16 172 Q 60 266 200 266 Q 340 266 384 172" style="fill:none;stroke:#2e6da4;stroke-width:2"/>
  <text class="t-note" x="24" y="156">もとの地下水位</text>
  <text class="t-key" x="200" y="296" text-anchor="middle">下げた地下水位</text>
  <rect class="brand" x="160" y="66" width="80" height="26" rx="4"/>
  <text class="t-key" x="200" y="84" text-anchor="middle">真空ポンプ</text>
  <text class="t-note" x="250" y="84">強制排水</text>
  <line x1="200" y1="92" x2="200" y2="110" style="stroke:#2e6da4;stroke-width:3"/>
  <line x1="60" y1="110" x2="340" y2="110" style="stroke:#2e6da4;stroke-width:3"/>
  <line x1="60" y1="110" x2="60" y2="276" style="stroke:#555;stroke-width:2"/>
  <rect class="green" x="55" y="276" width="10" height="26" rx="2"/>
  <line x1="90" y1="110" x2="90" y2="276" style="stroke:#555;stroke-width:2"/>
  <rect class="green" x="85" y="276" width="10" height="26" rx="2"/>
  <line x1="310" y1="110" x2="310" y2="276" style="stroke:#555;stroke-width:2"/>
  <rect class="green" x="305" y="276" width="10" height="26" rx="2"/>
  <line x1="340" y1="110" x2="340" y2="276" style="stroke:#555;stroke-width:2"/>
  <rect class="green" x="335" y="276" width="10" height="26" rx="2"/>
  <text class="t-pos" x="76" y="330" text-anchor="middle">ウェルポイント</text>
  <line class="lead" x1="70" y1="318" x2="62" y2="304"/>
  <text class="t-note" x="324" y="330" text-anchor="middle">吸水部</text>
  <line class="lead" x1="324" y1="318" x2="314" y2="304"/>
  <text class="t-key" x="200" y="196" text-anchor="middle">掘削箇所</text>
  <rect class="box" x="16" y="392" width="368" height="92" rx="6"/>
  <text class="t-key" x="30" y="414">揚水高さ</text>
  <text class="t-lab" x="104" y="414">約 10 m、実用は 5～6 m 程度が限度</text>
  <text class="t-key" x="30" y="440">深いとき</text>
  <text class="t-lab" x="104" y="440">多段式のウェルポイントが必要</text>
  <text class="t-warn" x="30" y="466">適さない</text>
  <text class="t-lab" x="104" y="466">細粒分の多い土、排水量の多い砂礫層</text>

</svg>
