<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="水平排水孔。湧水のあるのり面に、やや上向きの横孔をあけて穴あき管を挿し、地中の水を抜いて地下水位を下げる">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-lab   { font-size: 12px; fill: #222; }
      .t-key   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-note  { font-size: 11px; fill: #555; }
      .ground { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; }   /* surface */
      .wet    { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }   /* warn-fill：湿った土・帯水層 */
      .emb    { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 2; }     /* brand-fill：盛土・構造物 */
      .green  { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 2; }     /* positive-fill */
      .reinf  { stroke: #3a7d44; stroke-width: 3; }
      .water  { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .wl     { stroke: #2e6da4; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
      .push   { stroke: #b22234; stroke-width: 2.5; fill: none; }
      .lead   { stroke: #555; stroke-width: 1; fill: none; }
      .box    { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
    <marker id="aw" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#3a7d44"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#b22234"/></marker>
  </defs>
  <text class="t-title" x="200" y="28" text-anchor="middle">水平排水孔</text>
  <text class="t-lead" x="200" y="50" text-anchor="middle">のり面に横孔をあけ、穴あき管で地中の水を抜く</text>
  <polygon class="ground" points="16,330 60,330 290,110 384,110 384,352 16,352"/>
  <path class="wl" d="M 384 150 Q 260 180 120 300"/>
  <text class="t-note" x="378" y="144" text-anchor="end">抜く前の地下水位</text>
  <path d="M 384 230 Q 300 260 130 310" fill="none" stroke="#2e6da4" stroke-width="2"/>
  <text class="t-note" x="378" y="250" text-anchor="end">抜いた後</text>
  <line x1="132" y1="262" x2="282" y2="232" stroke="#3a7d44" stroke-width="5"/>
  <line x1="132" y1="262" x2="282" y2="232" stroke="#ffffff" stroke-width="2" stroke-dasharray="3 5"/>
  <line class="water" x1="138" y1="264" x2="110" y2="284" marker-end="url(#aw)"/>
  <line x1="190" y1="206" x2="340" y2="176" stroke="#3a7d44" stroke-width="5"/>
  <line x1="190" y1="206" x2="340" y2="176" stroke="#ffffff" stroke-width="2" stroke-dasharray="3 5"/>
  <line class="water" x1="196" y1="208" x2="168" y2="228" marker-end="url(#aw)"/>
  <text class="t-key" x="24" y="190" style="fill:#3a7d44">穴あき管（やや上向き）</text>
  <line class="lead" x1="160" y1="194" x2="230" y2="198"/>
  <text class="t-note" x="30" y="300">流れ出た水は</text>
  <text class="t-note" x="30" y="316">のり尻の溝へ</text>
  <rect class="box" x="16" y="392" width="368" height="92" rx="6"/>
  <text class="t-key" x="30" y="414">使う場面</text>
  <text class="t-lab" x="104" y="414">のり面から湧水があるとき</text>
  <text class="t-key" x="30" y="440">働き</text>
  <text class="t-lab" x="104" y="440">地中の水を抜き、地下水位を下げる</text>
  <text class="t-key" x="30" y="466">大規模</text>
  <text class="t-lab" x="104" y="466">集水井・排水トンネルを併用する</text>
</svg>
