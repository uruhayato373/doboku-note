<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="土積図の考え方。切土を正、盛土を負として土量を測点順に累加した曲線で、上りは切土、下りは盛土を表す。基線と交わる2点の間は切土と盛土が釣り合い、土量配分に使う。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-lab   { font-size: 12px; fill: #222; }
      .t-key   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-warn  { font-size: 12px; font-weight: bold; fill: #b22234; }
      .t-pos   { font-size: 12px; font-weight: bold; fill: #3a7d44; }
      .t-note  { font-size: 11px; fill: #555; }
      .soil   { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }   /* warn-fill：土・地盤 */
      .brand  { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 2; }     /* brand-fill：構造物・機械 */
      .green  { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 2; }     /* positive-fill：改良部・杭 */
      .bad    { fill: #f8d7da; stroke: #b22234; stroke-width: 2; }     /* danger-fill */
      .weak   { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; }
      .card   { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1.5; }
      .water  { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .wl     { stroke: #2e6da4; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
      .lead   { stroke: #555; stroke-width: 1; fill: none; }
      .box    { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
    <marker id="figure-mass-curve-ab" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker>
    <marker id="figure-mass-curve-ag" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#3a7d44"/></marker>
    <marker id="figure-mass-curve-ar" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#b22234"/></marker>
    <marker id="figure-mass-curve-ak" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#555"/></marker>
  </defs>
  <text class="t-title" x="200" y="28" text-anchor="middle">土積図の作成例</text>
  <text class="t-lead" x="200" y="50" text-anchor="middle">累加した土量を測点順に結び、土の行き先を読む</text>
  <line x1="30" y1="210" x2="384" y2="210" style="stroke:#8a8a8a;stroke-width:1.5;stroke-dasharray:6 4"/>
  <text class="t-note" x="378" y="204" text-anchor="end">基線</text>
  <text class="t-note" x="24" y="76">累加土量</text>
  <path d="M 40.0 250.0 L 43.0 249.8 L 46.0 249.1 L 49.0 248.1 L 52.0 246.6 L 55.0 244.7 L 58.0 242.4 L 61.0 239.7 L 64.0 236.6 L 67.0 233.2 L 70.0 229.5 L 73.0 225.5 L 76.0 221.1 L 79.0 216.6 L 82.0 211.8 L 85.0 206.8 L 88.0 201.6 L 91.0 196.3 L 94.0 191.0 L 97.0 185.5 L 100.0 180.0 L 103.0 174.5 L 106.0 169.0 L 109.0 163.7 L 112.0 158.4 L 115.0 153.2 L 118.0 148.2 L 121.0 143.4 L 124.0 138.9 L 127.0 134.5 L 130.0 130.5 L 133.0 126.8 L 136.0 123.4 L 139.0 120.3 L 142.0 117.6 L 145.0 115.3 L 148.0 113.4 L 151.0 111.9 L 154.0 110.9 L 157.0 110.2 L 160.0 110.0 L 163.0 110.3 L 166.0 111.1 L 169.0 112.5 L 172.0 114.4 L 175.0 116.8 L 178.0 119.8 L 181.0 123.2 L 184.0 127.2 L 187.0 131.6 L 190.0 136.4 L 193.0 141.7 L 196.0 147.3 L 199.0 153.3 L 202.0 159.6 L 205.0 166.2 L 208.0 173.1 L 211.0 180.1 L 214.0 187.4 L 217.0 194.8 L 220.0 202.3 L 223.0 209.9 L 226.0 217.5 L 229.0 225.1 L 232.0 232.7 L 235.0 240.1 L 238.0 247.4 L 241.0 254.6 L 244.0 261.5 L 247.0 268.2 L 250.0 274.6 L 253.0 280.7 L 256.0 286.5 L 259.0 291.9 L 262.0 296.9 L 265.0 301.4 L 268.0 305.5 L 271.0 309.1 L 274.0 312.2 L 277.0 314.9 L 280.0 316.9 L 283.0 318.5 L 286.0 319.5 L 289.0 320.0 L 292.0 319.9 L 295.0 319.3 L 298.0 318.1 L 301.0 316.4 L 304.0 314.2 L 307.0 311.6 L 310.0 308.5 L 313.0 305.0 L 316.0 301.2 L 319.0 297.1 L 322.0 292.7 L 325.0 288.0 L 328.0 283.3 L 331.0 278.4 L 334.0 273.6 L 337.0 268.7 L 340.0 264.0 L 343.0 259.3 L 346.0 254.9 L 349.0 250.8 L 352.0 247.0 L 355.0 243.5 L 358.0 240.4 L 361.0 237.8 L 364.0 235.6 L 367.0 233.9 L 370.0 232.7 L 373.0 232.1 L 375 232.0" style="fill:none;stroke:#2e6da4;stroke-width:3"/>
  <circle cx="83.1" cy="210" r="4" style="fill:#3a7d44"/>
  <circle cx="223.0" cy="210" r="4" style="fill:#3a7d44"/>
  <line x1="89.1" y1="238" x2="217.0" y2="238" style="stroke:#3a7d44;stroke-width:2.5" marker-end="url(#figure-mass-curve-ag)" marker-start="url(#figure-mass-curve-ag)"/>
  <line x1="83.1" y1="214" x2="83.1" y2="234" class="lead"/>
  <line x1="223.0" y1="214" x2="223.0" y2="234" class="lead"/>
  <text class="t-pos" x="153.1" y="258" text-anchor="middle">釣り合う区間</text>
  <text class="t-note" x="153.1" y="274" text-anchor="middle">（運搬距離）</text>
  <text class="t-key" x="160" y="98" text-anchor="middle">切土から盛土へ</text>
  <text class="t-key" x="290" y="342" text-anchor="middle">盛土から切土へ</text>
  <text class="t-warn" x="24" y="300" style="fill:#d4a017">上り：切土（＋）</text>
  <text class="t-key" x="378" y="150" text-anchor="end">下り：盛土（－）</text>
  <rect class="box" x="16" y="392" width="368" height="92" rx="6"/>
  <text class="t-key" x="30" y="414">作り方</text>
  <text class="t-lab" x="104" y="414">切土を＋、盛土を－として累加して結ぶ</text>
  <text class="t-key" x="30" y="440">読み方</text>
  <text class="t-lab" x="104" y="440">基線と交わる2点間は切土と盛土が釣り合う</text>
  <text class="t-key" x="30" y="466">使い方</text>
  <text class="t-lab" x="104" y="466">どの切土をどの盛土へ回すか決める</text>

</svg>
