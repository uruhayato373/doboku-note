<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="宅地造成など二次元的に広がる地区の土量計算方法。平均断面法、格状法、等高線法がある。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-lab   { font-size: 12px; fill: #222; }
      .t-key   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-warn  { font-size: 12px; font-weight: bold; fill: #b22234; }
      .t-pos   { font-size: 12px; font-weight: bold; fill: #3a7d44; }
      .t-note  { font-size: 11px; fill: #555; }
      .soil   { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }   /* warn-fill：土・地盤 */
      .brand  { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 2; }     /* brand-fill：構造物・機械 */
      .green  { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 2; }     /* positive-fill：改良部・杭 */
      .bad    { fill: #f8d7da; stroke: #b22234; stroke-width: 2; }     /* danger-fill */
      .weak   { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; }
      .card   { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1.5; }
      .water  { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .wl     { stroke: #2e6da4; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
      .lead   { stroke: #555; stroke-width: 1; fill: none; }
      .box    { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
    <marker id="figure-area-volume-methods-ab" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker>
    <marker id="figure-area-volume-methods-ag" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#3a7d44"/></marker>
    <marker id="figure-area-volume-methods-ar" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#b22234"/></marker>
    <marker id="figure-area-volume-methods-ak" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#555"/></marker>
  </defs>
  <text class="t-title" x="200" y="28" text-anchor="middle">土量計算の方法（宅地造成など）</text>
  <text class="t-lead" x="200" y="50" text-anchor="middle">広い造成地の土量は、断面・格子・等高線で求める</text>
  <rect class="card" x="16" y="64" width="368" height="100" rx="6"/>
  <rect class="soil" x="28" y="76" width="120" height="76" rx="2"/>
  <line x1="58" y1="76" x2="58" y2="152" style="stroke:#2e6da4;stroke-width:2;stroke-dasharray:5 3"/>
  <line x1="88" y1="76" x2="88" y2="152" style="stroke:#2e6da4;stroke-width:2;stroke-dasharray:5 3"/>
  <line x1="118" y1="76" x2="118" y2="152" style="stroke:#2e6da4;stroke-width:2;stroke-dasharray:5 3"/>
  <text class="t-key" x="170" y="98">平均断面法</text>
  <text class="t-lab" x="170" y="122">一定間隔で断面をとり、</text>
  <text class="t-lab" x="170" y="142">隣り合う断面積の平均×間隔</text>
  <rect class="card" x="16" y="170" width="368" height="100" rx="6"/>
  <rect class="soil" x="28" y="182" width="120" height="76" rx="2" style="stroke-width:1.5"/>
  <line x1="58" y1="182" x2="58" y2="258" style="stroke:#2e6da4;stroke-width:1.5"/>
  <line x1="88" y1="182" x2="88" y2="258" style="stroke:#2e6da4;stroke-width:1.5"/>
  <line x1="118" y1="182" x2="118" y2="258" style="stroke:#2e6da4;stroke-width:1.5"/>
  <line x1="28" y1="207" x2="148" y2="207" style="stroke:#2e6da4;stroke-width:1.5"/>
  <line x1="28" y1="232" x2="148" y2="232" style="stroke:#2e6da4;stroke-width:1.5"/>
  <text class="t-key" x="170" y="204">格状法</text>
  <text class="t-lab" x="170" y="228">区域を格子に分け、</text>
  <text class="t-lab" x="170" y="248">各格子の地盤高から土量を求める</text>
  <rect class="card" x="16" y="276" width="368" height="100" rx="6"/>
  <rect class="weak" x="28" y="288" width="120" height="76" rx="2" style="stroke-width:1"/>
  <ellipse cx="88" cy="326" rx="52" ry="30" style="fill:#fff3cd;stroke:#d4a017;stroke-width:1.5"/>
  <ellipse cx="88" cy="326" rx="34" ry="19" style="fill:#f8d7da;stroke:#b22234;stroke-width:1.5"/>
  <ellipse cx="88" cy="326" rx="14" ry="8" style="fill:#d0e8d0;stroke:#3a7d44;stroke-width:1.5"/>
  <text class="t-key" x="170" y="310">等高線法</text>
  <text class="t-lab" x="170" y="334">等高線で囲まれた面積に</text>
  <text class="t-lab" x="170" y="354">等高線の間隔を掛けて求める</text>
  <rect class="box" x="16" y="392" width="368" height="66" rx="6"/>
  <text class="t-key" x="30" y="414">対象</text>
  <text class="t-lab" x="104" y="414">二次元に広がる宅地造成地などの土量</text>
  <text class="t-key" x="30" y="440">使い方</text>
  <text class="t-lab" x="104" y="440">切土量と盛土量の均衡を確かめる</text>

</svg>
