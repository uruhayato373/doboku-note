<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="プレキャスト枠工。1:1.0 より緩いのり面に、プラスチック・鋼・コンクリートブロックなどの枠材を組み、枠の中を土・砂利や客土吹付けで詰める">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-lab   { font-size: 12px; fill: #222; }
      .t-key   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-note  { font-size: 11px; fill: #555; }
      .ground { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; }   /* surface：地山 */
      .rock   { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }   /* warn-fill：風化しやすい岩・土 */
      .layer  { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 2; }     /* brand-fill：保護工 */
      .frame  { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 2; }     /* positive-fill：枠材 */
      .fill   { fill: #fff3cd; stroke: #d4a017; stroke-width: 1; }     /* 中詰め */
      .lead   { stroke: #555; stroke-width: 1; fill: none; }
      .box    { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .pipe   { stroke: #2e6da4; stroke-width: 2.5; }
    </style>
  </defs>
  <text class="t-title" x="200" y="28" text-anchor="middle">プレキャスト枠工</text>
  <text class="t-lead" x="200" y="50" text-anchor="middle">工場でつくった枠材を、のり面で組み立てる</text>
  <polygon class="ground" points="16.0,320.0 60.0,320.0 300.0,110.0 384.0,110.0 384.0,360.0 16.0,360.0"/>
  <polygon class="frame" points="75.1,306.8 84.1,298.9 69.6,282.4 60.6,290.3"/>
  <polygon class="fill" points="84.1,298.9 120.2,267.3 111.0,256.8 74.9,288.4"/>
  <polygon class="frame" points="120.2,267.3 129.2,259.4 114.7,242.9 105.7,250.8"/>
  <polygon class="fill" points="129.2,259.4 165.4,227.8 156.1,217.3 120.0,248.9"/>
  <polygon class="frame" points="165.4,227.8 174.4,219.9 159.9,203.4 150.9,211.3"/>
  <polygon class="fill" points="174.4,219.9 210.5,188.3 201.3,177.8 165.2,209.4"/>
  <polygon class="frame" points="210.5,188.3 219.5,180.4 205.1,163.8 196.0,171.7"/>
  <polygon class="fill" points="219.5,180.4 255.7,148.8 246.5,138.3 210.3,169.9"/>
  <polygon class="frame" points="255.7,148.8 264.7,140.9 250.2,124.3 241.2,132.2"/>
  <polygon class="fill" points="264.7,140.9 300.8,109.3 291.6,98.7 255.5,130.4"/>
  <line class="lead" x1="24" y1="99" x2="48" y2="99"/>
  <line class="lead" x1="69.6" y1="282.4" x2="48" y2="99"/>
  <text class="t-lab" x="24" y="96">枠材</text>
  <line class="lead" x1="163.7" y1="210.7" x2="318" y2="263"/>
  <text class="t-lab" x="320" y="264">中詰め</text>
  <text class="t-note" x="250" y="300">地山</text>
  <rect class="box" x="16" y="380" width="368" height="98" rx="6"/>
  <text class="t-key" x="30" y="418">適用</text>
  <text class="t-lab" x="104" y="418">勾配が 1:1.0 より緩いのり面</text>
  <text class="t-key" x="30" y="444">中詰め</text>
  <text class="t-lab" x="104" y="444">土・砂利、またはくり石＋客土吹付け</text>
  <text class="t-key" x="30" y="470">目的</text>
  <text class="t-lab" x="104" y="470">中詰めの流出を防ぎ、緑化の土台にする</text>
</svg>
