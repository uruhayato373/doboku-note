<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="敷設材工法の挙動の比較。敷設材がないと荷重で地盤が局部的に沈み側方へ変形するが、ジオテキスタイルなどを敷くと引張強さで荷重が分散される">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-lab   { font-size: 12px; fill: #222; }
      .t-key   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-pos   { font-size: 12px; font-weight: bold; fill: #3a7d44; }
      .t-warn  { font-size: 12px; font-weight: bold; fill: #b22234; }
      .t-note  { font-size: 11px; fill: #555; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 2; }      /* brand-fill / brand：構造物・盛土 */
      .pos   { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 2; }      /* positive-fill / positive：補強・排水材 */
      .warn  { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }    /* warn-fill / warn：軟弱な土 */
      .gray  { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; }    /* surface：地盤・部材 */
      .white { fill: #ffffff; stroke: #8a8a8a; stroke-width: 1.5; }    /* 白抜き：溝・かご */
      .slip  { fill: none; stroke: #b22234; stroke-width: 2; stroke-dasharray: 6 4; }  /* danger：すべり面 */
      .aB { stroke: #2e6da4; stroke-width: 2.2; fill: none; }          /* brand：水・力の向き */
      .aP { stroke: #3a7d44; stroke-width: 2.2; fill: none; }          /* positive */
      .aD { stroke: #b22234; stroke-width: 2.5; fill: none; }          /* danger：滑動力・荷重 */
      .rP { stroke: #3a7d44; stroke-width: 3.5; fill: none; }          /* positive：補強材・ドレーン */
      .ln { stroke: #8a8a8a; stroke-width: 1.5; fill: none; }          /* 引出線・軸 */
      .dash { stroke: #8a8a8a; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
      .card  { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1.5; }
      .num   { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box   { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
    <marker id="sk-B" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker>
    <marker id="sk-P" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#3a7d44"/></marker>
    <marker id="sk-D" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#b22234"/></marker>
  </defs>

  <text class="t-title" x="200" y="28" text-anchor="middle">敷設材工法の挙動</text>
  <text class="t-lead" x="200" y="50" text-anchor="middle">敷設材の引張強さで、荷重を広く分散させる</text>

  <rect class="card" x="16" y="64" width="368" height="150" rx="6"/>
  <rect class="card" x="16" y="226" width="368" height="150" rx="6"/>
  <text class="t-warn" x="28" y="84">敷設材なし</text>
  <path d="M17,142 L70,142 Q92,130 112,142 Q200,176 288,142 Q308,130 330,142 L383,142 L383,213 L17,213 Z" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text class="t-lab" x="200" y="96" text-anchor="middle">盛土の荷重</text>
  <line class="aD" x1="160" y1="104" x2="160" y2="146" marker-end="url(#sk-D)"/>
  <line class="aD" x1="200" y1="104" x2="200" y2="146" marker-end="url(#sk-D)"/>
  <line class="aD" x1="240" y1="104" x2="240" y2="146" marker-end="url(#sk-D)"/>
  <text class="t-warn" x="200" y="196" text-anchor="middle">局部的な沈下・側方への変形</text>
  <text class="t-pos" x="28" y="246">敷設材あり</text>
  <rect class="warn" x="17" y="304" width="366" height="71"/>
  <line x1="30" y1="304" x2="370" y2="304" stroke="#3a7d44" stroke-width="4"/>
  <text class="t-lab" x="200" y="258" text-anchor="middle">盛土の荷重</text>
  <line class="aD" x1="160" y1="266" x2="160" y2="300" marker-end="url(#sk-D)"/>
  <line class="aD" x1="200" y1="266" x2="200" y2="300" marker-end="url(#sk-D)"/>
  <line class="aD" x1="240" y1="266" x2="240" y2="300" marker-end="url(#sk-D)"/>
  <line class="aB" x1="200" y1="310" x2="150" y2="342" marker-end="url(#sk-B)"/>
  <line class="aB" x1="200" y1="310" x2="250" y2="342" marker-end="url(#sk-B)"/>
  <text class="t-note" x="296" y="296" text-anchor="middle">敷設材</text>
  <text class="t-pos" x="200" y="364" text-anchor="middle">引張強さで荷重を分散</text>

  <!-- 要点 -->
  <rect class="box" x="16" y="392" width="368" height="92" rx="6"/>
  <text class="t-key" x="30" y="416">材料</text>
  <text class="t-lab" x="104" y="416">ジオテキスタイルなどを敷き広げる</text>
  <text class="t-key" x="30" y="442">効果</text>
  <text class="t-lab" x="104" y="442">局部沈下・側方変形を抑える</text>
  <text class="t-key" x="30" y="468">目的</text>
  <text class="t-lab" x="104" y="468">トラフィカビリティの確保</text>
</svg>
