<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="置換工法の 2 つの場合。軟弱層を全部掘って良質土に置き換える場合と、上の一部だけを置き換える場合。全部置き換えると沈下はほぼ残らず、一部だと残る軟弱層の沈下を見込む">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-sec   { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-lab   { font-size: 12px; fill: #222; }
      .t-note  { font-size: 11px; fill: #555; }
      .soft { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }   /* warn-fill / warn：軟弱層 */
      .base { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; }   /* surface：支持層 */
      .emb  { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 2; }     /* brand-fill / brand：盛土 */
      .good { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 2; }     /* positive-fill / positive：良質土 */
      .rule { stroke: #d7d7d7; stroke-width: 1; }
    </style>
  </defs>

  <text class="t-title" x="200" y="28" text-anchor="middle">置換工法（掘削置換）</text>
  <text class="t-lead" x="200" y="50" text-anchor="middle">軟弱な土を掘り出し、良質土に入れ替える</text>

  <!-- (a) 全部置換 -->
  <text class="t-sec" x="16" y="84">(a) 軟弱層を全部置き換える</text>
  <rect class="soft" x="16" y="160" width="368" height="56"/>
  <rect class="base" x="16" y="216" width="368" height="22"/>
  <polygon class="good" points="96,160 304,160 284,216 116,216"/>
  <polygon class="emb" points="96,160 150,100 250,100 304,160"/>
  <text class="t-lab" x="200" y="136" text-anchor="middle">盛土</text>
  <text class="t-lab" x="200" y="194" text-anchor="middle">良質土</text>
  <text class="t-note" x="40" y="194">軟弱層</text>
  <text class="t-note" x="40" y="232">支持層</text>
  <text class="t-note" x="200" y="256" text-anchor="middle">支持層まで入れ替える → 沈下はほぼ残らない</text>

  <line class="rule" x1="16" y1="276" x2="384" y2="276"/>

  <!-- (b) 一部置換 -->
  <text class="t-sec" x="16" y="306">(b) 上の一部だけ置き換える</text>
  <rect class="soft" x="16" y="382" width="368" height="56"/>
  <rect class="base" x="16" y="438" width="368" height="22"/>
  <polygon class="good" points="96,382 304,382 294,408 106,408"/>
  <polygon class="emb" points="96,382 150,322 250,322 304,382"/>
  <text class="t-lab" x="200" y="358" text-anchor="middle">盛土</text>
  <text class="t-lab" x="200" y="400" text-anchor="middle">良質土</text>
  <text class="t-note" x="40" y="428">残る軟弱層</text>
  <text class="t-note" x="40" y="454">支持層</text>
  <text class="t-note" x="200" y="484" text-anchor="middle">残る軟弱層の沈下を見込み、置換量を検討する</text>
</svg>
