<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="重錘落下締固め工法。クレーンで吊り下げた重錘を高い場所から自由落下させ、衝撃で地盤を締め固める。振動・騒音の問題から使用が限られる。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-lab   { font-size: 12px; fill: #222; }
      .t-key   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-warn  { font-size: 12px; font-weight: bold; fill: #b22234; }
      .t-pos   { font-size: 12px; font-weight: bold; fill: #3a7d44; }
      .t-note  { font-size: 11px; fill: #555; }
      .soil   { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }   /* warn-fill：土・地盤 */
      .brand  { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 2; }     /* brand-fill：構造物・機械 */
      .green  { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 2; }     /* positive-fill：改良部・杭 */
      .bad    { fill: #f8d7da; stroke: #b22234; stroke-width: 2; }     /* danger-fill */
      .weak   { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; }
      .card   { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1.5; }
      .water  { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .wl     { stroke: #2e6da4; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
      .lead   { stroke: #555; stroke-width: 1; fill: none; }
      .box    { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
    <marker id="figure-weight-drop-ab" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker>
    <marker id="figure-weight-drop-ag" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#3a7d44"/></marker>
    <marker id="figure-weight-drop-ar" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#b22234"/></marker>
    <marker id="figure-weight-drop-ak" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#555"/></marker>
  </defs>
  <text class="t-title" x="200" y="28" text-anchor="middle">重錘落下締固め工法</text>
  <text class="t-lead" x="200" y="50" text-anchor="middle">吊り上げた重錘を落とし、衝撃で地盤を締め固める</text>
  <rect class="soil" x="16" y="320" width="368" height="50"/>
  <rect class="brand" x="28" y="292" width="64" height="28" rx="3"/>
  <text class="t-key" x="60" y="312" text-anchor="middle">クレーン</text>
  <line x1="76" y1="292" x2="210" y2="96" style="stroke:#2e6da4;stroke-width:5"/>
  <line x1="210" y1="96" x2="210" y2="150" style="stroke:#555;stroke-width:1.5"/>
  <rect class="brand" x="190" y="150" width="40" height="34" rx="3"/>
  <text class="t-key" x="210" y="172" text-anchor="middle">重錘</text>
  <text class="t-note" x="246" y="130">高い場所から</text>
  <line class="water" x1="210" y1="192" x2="210" y2="268" style="stroke:#b22234" marker-end="url(#figure-weight-drop-ar)"/>
  <text class="t-warn" x="226" y="236">自由落下</text>
  <rect x="190" y="288" width="40" height="32" rx="3" style="fill:#f5f5f5;stroke:#8a8a8a;stroke-width:1.5;stroke-dasharray:4 3"/>
  <ellipse cx="210" cy="346" rx="86" ry="22" style="fill:#d0e8d0;stroke:#3a7d44;stroke-width:1.5;stroke-dasharray:5 4"/>
  <text class="t-pos" x="210" y="350" text-anchor="middle">締まる範囲</text>
  <text class="t-note" x="252" y="310">衝撃で振動・騒音</text>
  <rect class="box" x="16" y="392" width="368" height="92" rx="6"/>
  <text class="t-key" x="30" y="414">方法</text>
  <text class="t-lab" x="104" y="414">重錘を吊り上げ、高所から自由落下</text>
  <text class="t-key" x="30" y="440">効果</text>
  <text class="t-lab" x="104" y="440">落下の衝撃で地盤を締め固める</text>
  <text class="t-warn" x="30" y="466">注意</text>
  <text class="t-lab" x="104" y="466">振動・騒音の問題で使用が限られる</text>

</svg>
