<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="土積図による土量配分。基線を引いて切土と盛土が釣り合う区間を結ぶと、その長さが運搬距離を表す。運搬距離が最も短くなるように配分し、ショベル・ダンプトラック工法区とそれ以外の機械の採算的な運搬距離を比べて工区を分ける。">
