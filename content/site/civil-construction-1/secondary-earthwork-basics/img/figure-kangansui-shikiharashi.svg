<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="高含水比の盛土材料の敷均し。スクレーパやショベルダンプトラックは盛土の荷おろし箇所に直接入れないので、盛土上の運搬路付近から盛土箇所まで材料を二次運搬する。盛土内には水平排水層を設けて含水比を下げることもある">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-lab   { font-size: 12px; fill: #222; }
      .t-key   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-warn  { font-size: 12px; font-weight: bold; fill: #b22234; }
      .t-pos   { font-size: 12px; font-weight: bold; fill: #3a7d44; }
      .t-note  { font-size: 11px; fill: #555; }
      .ground { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; }   /* surface：地山・基礎地盤 */
      .soft   { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }   /* warn-fill：軟弱・高含水比 */
      .emb    { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 2; }     /* brand-fill：盛土 */
      .green  { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 2; }     /* positive-fill：対策・植生 */
      .bad    { fill: #f8d7da; stroke: #b22234; stroke-width: 2; }     /* danger-fill */
      .gline  { stroke: #3a7d44; stroke-width: 3; fill: none; }
      .water  { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .redl   { stroke: #b22234; stroke-width: 2; fill: none; }
      .redd   { stroke: #b22234; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
      .bluedd { stroke: #2e6da4; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
      .lead   { stroke: #555; stroke-width: 1; fill: none; }
      .card   { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1.5; }
      .box    { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .num    { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
    </style>
    <marker id="aw" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#3a7d44"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#b22234"/></marker>
  </defs>

  <text class="t-title" x="200" y="28" text-anchor="middle">高含水比の盛土材料の敷均し</text>
  <text class="t-lead" x="200" y="50" text-anchor="middle">荷おろし箇所に直接入れず、運搬路から二次運搬する</text>
  <rect class="ground" x="16" y="300" width="368" height="44"/>
  <text class="t-note" x="28" y="336">基礎地盤</text>
  <polygon class="emb" points="40,300 90,190 220,190 220,226 310,226 350,300"/>
  <line class="gline" x1="58" y1="266" x2="332" y2="266"/>
  <text class="t-pos" x="200" y="258" text-anchor="middle">水平排水層</text>
  <text class="t-lab" x="140" y="228" text-anchor="middle">盛土</text>
  <rect class="ground" x="90" y="180" width="130" height="10"/>
  <text class="t-note" x="155" y="172" text-anchor="middle">盛土上の運搬路</text>
  <text class="t-warn" x="232" y="158" text-anchor="end">荷おろし</text>
  <line class="lead" x1="222" y1="162" x2="218" y2="180"/>
  <rect class="soft" x="226" y="206" width="80" height="20"/>
  <text class="t-note" x="266" y="220" text-anchor="middle">高含水比土</text>
  <path class="redl" d="M 224 186 C 238 190, 250 196, 256 202" marker-end="url(#ar)"/>
  <text class="t-warn" x="276" y="190" text-anchor="start">二次運搬</text>
  <!-- 要点 -->
  <rect class="box" x="16" y="392" width="368" height="98" rx="6"/>
  <text class="t-key" x="30" y="416">避けたい</text>
  <text class="t-lab" x="104" y="416">わだち掘れとこね返しによる強度低下</text>
  <text class="t-key" x="30" y="442">ブルドーザ</text>
  <text class="t-lab" x="104" y="442">湿地ブルドーザを使えば特に変わらない</text>
  <text class="t-key" x="30" y="468">併用</text>
  <text class="t-lab" x="104" y="468">水平排水層で盛土内の含水比を下げる</text>
</svg>
