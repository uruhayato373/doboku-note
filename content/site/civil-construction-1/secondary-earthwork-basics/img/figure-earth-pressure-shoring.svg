<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="土留め壁に作用する土圧。断面計算には切ばり位置での多数の実測例から定められた経験値の土圧を用い、根入れ長さの安定計算にはランキン・レザールの土圧を多く用いる。標準的な地盤と掘削深さの場合の値なので、地盤の乱れや砂層と粘土層の互層に配慮する。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-lab   { font-size: 12px; fill: #222; }
      .t-key   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-warn  { font-size: 12px; font-weight: bold; fill: #b22234; }
      .t-pos   { font-size: 12px; font-weight: bold; fill: #3a7d44; }
      .t-note  { font-size: 11px; fill: #555; }
      .soil   { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }   /* warn-fill：土・地盤 */
      .brand  { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 2; }     /* brand-fill：構造物・機械 */
      .green  { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 2; }     /* positive-fill：改良部・杭 */
      .bad    { fill: #f8d7da; stroke: #b22234; stroke-width: 2; }     /* danger-fill */
      .weak   { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; }
      .card   { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1.5; }
      .water  { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .wl     { stroke: #2e6da4; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
      .lead   { stroke: #555; stroke-width: 1; fill: none; }
      .box    { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
    <marker id="figure-earth-pressure-shoring-ab" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker>
    <marker id="figure-earth-pressure-shoring-ag" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#3a7d44"/></marker>
    <marker id="figure-earth-pressure-shoring-ar" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#b22234"/></marker>
    <marker id="figure-earth-pressure-shoring-ak" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#555"/></marker>
  </defs>
  <text class="t-title" x="200" y="28" text-anchor="middle">土留めに作用する土圧（慣用計算法）</text>
  <text class="t-lead" x="200" y="50" text-anchor="middle">断面計算には、実測から定めた経験の土圧を使う</text>
  <rect class="soil" x="16" y="96" width="136" height="244"/>
  <rect class="soil" x="160" y="300" width="224" height="40"/>
  <rect class="brand" x="150" y="76" width="10" height="264"/>
  <line x1="16" y1="96" x2="150" y2="96" style="stroke:#8a8a8a;stroke-width:1.5"/>
  <text class="t-key" x="24" y="72">地盤側</text>
  <text class="t-key" x="170" y="320">掘削底面</text>
  <text class="t-note" x="165" y="68">土留め壁</text>
  <polygon points="150,96 150,184 58,184 150,96" style="fill:none"/>
  <polygon points="150,96 58,184 58,300 150,300" style="fill:#f8d7da;stroke:#b22234;stroke-width:1.5;fill-opacity:0.7"/>
  <line x1="112.4" y1="132" x2="146" y2="132" style="stroke:#b22234;stroke-width:2" marker-end="url(#figure-earth-pressure-shoring-ar)"/>
  <line x1="83.1" y1="160" x2="146" y2="160" style="stroke:#b22234;stroke-width:2" marker-end="url(#figure-earth-pressure-shoring-ar)"/>
  <line x1="58.0" y1="190" x2="146" y2="190" style="stroke:#b22234;stroke-width:2" marker-end="url(#figure-earth-pressure-shoring-ar)"/>
  <line x1="58.0" y1="220" x2="146" y2="220" style="stroke:#b22234;stroke-width:2" marker-end="url(#figure-earth-pressure-shoring-ar)"/>
  <line x1="58.0" y1="250" x2="146" y2="250" style="stroke:#b22234;stroke-width:2" marker-end="url(#figure-earth-pressure-shoring-ar)"/>
  <line x1="58.0" y1="280" x2="146" y2="280" style="stroke:#b22234;stroke-width:2" marker-end="url(#figure-earth-pressure-shoring-ar)"/>
  <line x1="160" y1="130" x2="280" y2="130" style="stroke:#2e6da4;stroke-width:4"/>
  <circle cx="155" cy="130" r="4" style="fill:#3a7d44"/>
  <line x1="160" y1="190" x2="280" y2="190" style="stroke:#2e6da4;stroke-width:4"/>
  <circle cx="155" cy="190" r="4" style="fill:#3a7d44"/>
  <line x1="160" y1="250" x2="280" y2="250" style="stroke:#2e6da4;stroke-width:4"/>
  <circle cx="155" cy="250" r="4" style="fill:#3a7d44"/>
  <text class="t-key" x="292" y="134" style="fill:#2e6da4">切ばり</text>
  <text class="t-note" x="292" y="152">位置の実測から</text>
  <text class="t-note" x="292" y="168">定めた経験値</text>
  
  
  <text class="t-note" x="84" y="334" text-anchor="middle">断面計算用の土圧</text>
  <rect class="box" x="16" y="392" width="368" height="92" rx="6"/>
  <text class="t-key" x="30" y="414">安定計算</text>
  <text class="t-lab" x="104" y="414">ランキン・レザールの土圧（根入れ長）</text>
  <text class="t-key" x="30" y="440">断面計算</text>
  <text class="t-lab" x="104" y="440">土木学会の土圧（切ばり位置の実測値）</text>
  <text class="t-warn" x="30" y="466">注意</text>
  <text class="t-lab" x="104" y="466">地盤の乱れ・砂粘土の互層に配慮</text>

</svg>
