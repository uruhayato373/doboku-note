<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="モルタル・コンクリート吹付工。風化しやすい岩ののり面に、モルタルは 8〜10cm、コンクリートは 10〜20cm を吹き付け、風化と剥落を防ぐ。水抜き孔で裏の水を逃がす">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-lab   { font-size: 12px; fill: #222; }
      .t-key   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-note  { font-size: 11px; fill: #555; }
      .ground { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; }   /* surface：地山 */
      .rock   { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }   /* warn-fill：風化しやすい岩・土 */
      .layer  { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 2; }     /* brand-fill：保護工 */
      .frame  { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 2; }     /* positive-fill：枠材 */
      .fill   { fill: #fff3cd; stroke: #d4a017; stroke-width: 1; }     /* 中詰め */
      .lead   { stroke: #555; stroke-width: 1; fill: none; }
      .box    { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .pipe   { stroke: #2e6da4; stroke-width: 2.5; }
    </style>
  </defs>
  <text class="t-title" x="200" y="28" text-anchor="middle">モルタル・コンクリート吹付工</text>
  <text class="t-lead" x="200" y="50" text-anchor="middle">風化しやすい岩の表面を、吹付けで覆う</text>
  <polygon class="rock" points="16.0,320.0 60.0,320.0 300.0,110.0 384.0,110.0 384.0,360.0 16.0,360.0"/>
  <polygon class="layer" points="60.0,320.0 300.0,110.0 290.8,99.5 50.8,309.5"/>
  <line class="pipe" x1="139.6" y1="274.3" x2="113.2" y2="244.2"/>
  <line class="pipe" x1="214.8" y1="208.4" x2="188.5" y2="178.3"/>
  <line class="lead" x1="24" y1="99" x2="144" y2="99"/>
  <line class="lead" x1="95.9" y1="270.0" x2="144" y2="99"/>
  <text class="t-lab" x="24" y="96">吹付け層（金網入り）</text>
  <line class="lead" x1="188.5" y1="178.3" x2="318" y2="253"/>
  <text class="t-lab" x="320" y="254">水抜き孔</text>
  <text class="t-note" x="240" y="300">風化しやすい岩</text>
  <rect class="box" x="16" y="380" width="368" height="98" rx="6"/>
  <text class="t-key" x="30" y="418">厚さ</text>
  <text class="t-lab" x="104" y="418">モルタル 8〜10cm／コンクリート 10〜20cm</text>
  <text class="t-key" x="30" y="444">目的</text>
  <text class="t-lab" x="104" y="444">風化・剥落・崩壊を防ぐ</text>
  <text class="t-key" x="30" y="470" style="fill:#b22234">注意</text>
  <text class="t-lab" x="104" y="470">裏の水を水抜き孔で逃がす</text>
</svg>
