<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="地下排水溝。地表に掘った溝に砂利や粗砂を詰めて土をかぶせ、浸透水を集める。溝はW形や矢はず形に配置し、穴あき管を入れると排水能力が増す">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-lab   { font-size: 12px; fill: #222; }
      .t-key   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-pos   { font-size: 12px; font-weight: bold; fill: #3a7d44; }
      .t-warn  { font-size: 12px; font-weight: bold; fill: #b22234; }
      .t-note  { font-size: 11px; fill: #555; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 2; }      /* brand-fill / brand：構造物・盛土 */
      .pos   { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 2; }      /* positive-fill / positive：補強・排水材 */
      .warn  { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }    /* warn-fill / warn：軟弱な土 */
      .gray  { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; }    /* surface：地盤・部材 */
      .white { fill: #ffffff; stroke: #8a8a8a; stroke-width: 1.5; }    /* 白抜き：溝・かご */
      .slip  { fill: none; stroke: #b22234; stroke-width: 2; stroke-dasharray: 6 4; }  /* danger：すべり面 */
      .aB { stroke: #2e6da4; stroke-width: 2.2; fill: none; }          /* brand：水・力の向き */
      .aP { stroke: #3a7d44; stroke-width: 2.2; fill: none; }          /* positive */
      .aD { stroke: #b22234; stroke-width: 2.5; fill: none; }          /* danger：滑動力・荷重 */
      .rP { stroke: #3a7d44; stroke-width: 3.5; fill: none; }          /* positive：補強材・ドレーン */
      .ln { stroke: #8a8a8a; stroke-width: 1.5; fill: none; }          /* 引出線・軸 */
      .dash { stroke: #8a8a8a; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
      .card  { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1.5; }
      .num   { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box   { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
    <marker id="ch-B" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker>
    <marker id="ch-P" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#3a7d44"/></marker>
    <marker id="ch-D" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#b22234"/></marker>
  </defs>

  <text class="t-title" x="200" y="28" text-anchor="middle">地下排水溝</text>
  <text class="t-lead" x="200" y="50" text-anchor="middle">のり面の浸透水を、地中の溝で集めて排除する</text>

  <rect class="card" x="16" y="62" width="176" height="130" rx="6"/>
  <rect class="card" x="208" y="62" width="176" height="130" rx="6"/>
  <path d="M32,74 L60,160 L104,100 L148,160 L176,74" fill="none" stroke="#2e6da4" stroke-width="4" stroke-linejoin="round"/>
  <line x1="296" y1="72" x2="296" y2="164" stroke="#2e6da4" stroke-width="4"/>
  <line x1="238" y1="74" x2="296" y2="92" stroke="#2e6da4" stroke-width="4"/>
  <line x1="354" y1="74" x2="296" y2="92" stroke="#2e6da4" stroke-width="4"/>
  <line x1="238" y1="98" x2="296" y2="116" stroke="#2e6da4" stroke-width="4"/>
  <line x1="354" y1="98" x2="296" y2="116" stroke="#2e6da4" stroke-width="4"/>
  <line x1="238" y1="122" x2="296" y2="140" stroke="#2e6da4" stroke-width="4"/>
  <line x1="354" y1="122" x2="296" y2="140" stroke="#2e6da4" stroke-width="4"/>
  <text class="t-key" x="104" y="184" text-anchor="middle">W形</text>
  <text class="t-key" x="296" y="184" text-anchor="middle">矢はず形</text>
  <text class="t-key" x="16" y="222">溝の断面</text>
  <rect class="warn" x="16" y="232" width="368" height="120"/>
  <rect class="gray" x="130" y="262" width="140" height="80"/>
  <circle cx="146" cy="330" r="3" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="160" cy="312" r="3" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="240" cy="318" r="3" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="256" cy="330" r="3" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="150" cy="282" r="3" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="256" cy="282" r="3" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="170" cy="300" r="3" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="236" cy="300" r="3" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="200" cy="334" r="3" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="224" cy="336" r="3" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
  <circle class="brand" cx="200" cy="316" r="11"/>
  <text class="t-lab" x="200" y="254" text-anchor="middle">土をかぶせる</text>
  <text class="t-note" x="24" y="300">地盤</text>
  <text class="t-note" x="278" y="330">砂利・粗砂</text>
  <text class="t-note" x="200" y="296" text-anchor="middle">有孔管</text>
  <line class="aB" x1="100" y1="290" x2="126" y2="300" marker-end="url(#ch-B)"/>
  <line class="aB" x1="300" y1="290" x2="274" y2="300" marker-end="url(#ch-B)"/>

  <!-- 要点 -->
  <rect class="box" x="16" y="392" width="368" height="92" rx="6"/>
  <text class="t-key" x="30" y="416">配置</text>
  <text class="t-lab" x="104" y="416">浸透水の状態に応じて W形・矢はず形</text>
  <text class="t-key" x="30" y="442">溝</text>
  <text class="t-lab" x="104" y="442">砂利・粗砂を詰め、土をかぶせる</text>
  <text class="t-key" x="30" y="468">併用</text>
  <text class="t-lab" x="104" y="468">じゃかごの埋め込み・有孔管</text>
</svg>
