  <text class="t-pos" x="304" y="132" text-anchor="start">芝の筋</text>
  <line class="lead" x1="300" y1="128" x2="292" y2="128"/>
  <text class="t-note" x="304" y="190" text-anchor="start">筋と筋の</text>
  <text class="t-note" x="304" y="206" text-anchor="start">間は土</text>
  <text class="t-note" x="304" y="282" text-anchor="start">下から順に</text>
  <text class="t-note" x="304" y="298" text-anchor="start">土羽打ち</text>
  <line class="gthin" x1="324" y1="262" x2="324" y2="242" marker-end="url(#ag)"/>
  <text class="t-warn" x="200" y="374" text-anchor="middle">野芝は生育が遅い</text>

  <!-- 要点 -->
  <rect class="box" x="16" y="392" width="368" height="98" rx="6"/>
  <text class="t-key" x="30" y="416">効果</text>
  <text class="t-lab" x="104" y="416">土羽打ちで転圧され、浸食を防ぐ</text>
  <text class="t-key" x="30" y="442">目的</text>
  <text class="t-lab" x="104" y="442">盛土のり面の浸食防止・部分植生</text>
  <text class="t-warn" x="30" y="468">施肥</text>
  <text class="t-lab" x="104" y="468">野芝の生育を促すため施肥をする</text>
