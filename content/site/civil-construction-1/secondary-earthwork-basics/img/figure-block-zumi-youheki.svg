<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="ブロック積擁壁工の断面。のり面の土を壁状のブロックで押さえ、背面に裏込め材を置き、水抜き孔から水を抜き、基礎で支える">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-lab   { font-size: 12px; fill: #222; }
      .t-key   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-pos   { font-size: 12px; font-weight: bold; fill: #3a7d44; }
      .t-warn  { font-size: 12px; font-weight: bold; fill: #b22234; }
      .t-note  { font-size: 11px; fill: #555; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 2; }      /* brand-fill / brand：構造物・盛土 */
      .pos   { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 2; }      /* positive-fill / positive：補強・排水材 */
      .warn  { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }    /* warn-fill / warn：軟弱な土 */
      .gray  { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; }    /* surface：地盤・部材 */
      .white { fill: #ffffff; stroke: #8a8a8a; stroke-width: 1.5; }    /* 白抜き：溝・かご */
      .slip  { fill: none; stroke: #b22234; stroke-width: 2; stroke-dasharray: 6 4; }  /* danger：すべり面 */
      .aB { stroke: #2e6da4; stroke-width: 2.2; fill: none; }          /* brand：水・力の向き */
      .aP { stroke: #3a7d44; stroke-width: 2.2; fill: none; }          /* positive */
      .aD { stroke: #b22234; stroke-width: 2.5; fill: none; }          /* danger：滑動力・荷重 */
      .rP { stroke: #3a7d44; stroke-width: 3.5; fill: none; }          /* positive：補強材・ドレーン */
      .ln { stroke: #8a8a8a; stroke-width: 1.5; fill: none; }          /* 引出線・軸 */
      .dash { stroke: #8a8a8a; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
      .card  { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1.5; }
      .num   { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box   { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
    <marker id="bk-B" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker>
    <marker id="bk-P" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#3a7d44"/></marker>
    <marker id="bk-D" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#b22234"/></marker>
  </defs>

  <text class="t-title" x="200" y="28" text-anchor="middle">ブロック積擁壁工</text>
  <text class="t-lead" x="200" y="50" text-anchor="middle">壁状の土留めで、のり面の土を支える</text>

  <polygon class="warn" points="16,150 204,150 224,330 224,352 16,352"/>
  <rect class="gray" x="16" y="352" width="368" height="20"/>
  <rect class="gray" x="320" y="330" width="64" height="22"/>
  <polygon class="gray" points="224,330 248,330 228,150 204,150" style="fill:#fff;stroke:#8a8a8a"/>
  <rect class="gray" x="226" y="330" width="94" height="22"/>
  <rect class="brand" x="248" y="300" width="52" height="30" style="stroke-width:1.5"/>
  <rect class="brand" x="244" y="270" width="52" height="30" style="stroke-width:1.5"/>
  <rect class="brand" x="240" y="240" width="52" height="30" style="stroke-width:1.5"/>
  <rect class="brand" x="236" y="210" width="52" height="30" style="stroke-width:1.5"/>
  <rect class="brand" x="232" y="180" width="52" height="30" style="stroke-width:1.5"/>
  <rect class="brand" x="228" y="150" width="52" height="30" style="stroke-width:1.5"/>
  <circle cx="222" cy="300" r="3" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="228" cy="262" r="3" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="236" cy="222" r="3" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="226" cy="196" r="3" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="231" cy="168" r="3" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="234" cy="312" r="3" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="240" cy="240" r="3" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
  <text class="t-lab" x="40" y="200">地山・盛土</text>
  <text class="t-lab" x="60" y="294">裏込め材</text>
  <line class="ln" x1="124" y1="290" x2="232" y2="290"/>
  <text class="t-lab" x="273" y="346" text-anchor="middle">基礎</text>
  <text class="t-lab" x="292" y="170">ブロック</text>
  <text class="t-note" x="306" y="276">水抜き孔</text>
  <line class="aB" x1="296" y1="285" x2="340" y2="285" marker-end="url(#bk-B)"/>

  <!-- 要点 -->
  <rect class="box" x="16" y="392" width="368" height="92" rx="6"/>
  <text class="t-key" x="30" y="416">構造</text>
  <text class="t-lab" x="104" y="416">ブロック＋裏込め材＋基礎</text>
  <text class="t-key" x="30" y="442">水</text>
  <text class="t-lab" x="104" y="442">水抜き孔から背面の水を抜く</text>
  <text class="t-key" x="30" y="468">設計</text>
  <text class="t-lab" x="104" y="468">高さ 5 m 超は安定計算で決める</text>
</svg>
