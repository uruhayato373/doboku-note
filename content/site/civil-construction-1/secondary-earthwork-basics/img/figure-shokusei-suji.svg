<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="植生筋工。種子と肥料を付けた帯状の材料を、盛土のり面を締め固めるときに水平に挟み込み、筋状に草を生やして浸食を防ぐ">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-lab   { font-size: 12px; fill: #222; }
      .t-key   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-note  { font-size: 11px; fill: #555; }
      .ground { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; }   /* surface */
      .wet    { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }   /* warn-fill：湿った土・帯水層 */
      .emb    { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 2; }     /* brand-fill：盛土・構造物 */
      .green  { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 2; }     /* positive-fill */
      .reinf  { stroke: #3a7d44; stroke-width: 3; }
      .water  { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .wl     { stroke: #2e6da4; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
      .push   { stroke: #b22234; stroke-width: 2.5; fill: none; }
      .lead   { stroke: #555; stroke-width: 1; fill: none; }
      .box    { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
    <marker id="aw" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#3a7d44"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#b22234"/></marker>
  </defs>
  <text class="t-title" x="200" y="28" text-anchor="middle">植生筋工</text>
  <text class="t-lead" x="200" y="50" text-anchor="middle">種子つきの帯を、のり面に水平の筋で入れる</text>
  <polygon class="ground" points="16,330 60,330 300,110 384,110 384,352 16,352"/>
  <line class="reinf" x1="60" y1="330" x2="94" y2="334"/>
  <path d="M 58 330 q 3 -10 6 0 q 3 -10 6 0" fill="none" stroke="#3a7d44" stroke-width="1.5"/>
  <line class="reinf" x1="100" y1="293.3" x2="134" y2="297.3"/>
  <path d="M 98 293.3 q 3 -10 6 0 q 3 -10 6 0" fill="none" stroke="#3a7d44" stroke-width="1.5"/>
  <line class="reinf" x1="140" y1="256.6" x2="174" y2="260.6"/>
  <path d="M 138 256.6 q 3 -10 6 0 q 3 -10 6 0" fill="none" stroke="#3a7d44" stroke-width="1.5"/>
  <line class="reinf" x1="180" y1="219.89999999999998" x2="214" y2="223.89999999999998"/>
  <path d="M 178 219.89999999999998 q 3 -10 6 0 q 3 -10 6 0" fill="none" stroke="#3a7d44" stroke-width="1.5"/>
  <line class="reinf" x1="220" y1="183.2" x2="254" y2="187.2"/>
  <path d="M 218 183.2 q 3 -10 6 0 q 3 -10 6 0" fill="none" stroke="#3a7d44" stroke-width="1.5"/>
  <line class="reinf" x1="260" y1="146.5" x2="294" y2="150.5"/>
  <path d="M 258 146.5 q 3 -10 6 0 q 3 -10 6 0" fill="none" stroke="#3a7d44" stroke-width="1.5"/>
  <text class="t-key" x="30" y="120" style="fill:#3a7d44">種子・肥料つきの帯（植生筋）</text>
  <line class="lead" x1="120" y1="126" x2="186" y2="206"/>
  <text class="t-note" x="250" y="300">盛土</text>
  <text class="t-note" x="372" y="280" text-anchor="end">帯と帯の間は土羽で締め固める</text>
  <rect class="box" x="16" y="392" width="368" height="92" rx="6"/>
  <text class="t-key" x="30" y="414">施工</text>
  <text class="t-lab" x="104" y="414">土羽打ちのとき、帯を水平に挟み込む</text>
  <text class="t-key" x="30" y="440">目的</text>
  <text class="t-lab" x="104" y="440">盛土のり面の浸食防止・部分的な緑化</text>
  <text class="t-key" x="30" y="466">同じ考え方</text>
  <text class="t-lab" x="104" y="466">筋芝（芝を筋状に入れる）</text>
</svg>
