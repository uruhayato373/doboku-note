<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="サンドマット工法の断面。軟弱地盤の上に厚さ0.5〜1.2m程度の砂層を敷き、重機の走行を支え、盛土の水を横へ逃がし、バーチカルドレーンと併用するときは排水層になる">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-lab   { font-size: 12px; fill: #222; }
      .t-key   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-pos   { font-size: 12px; font-weight: bold; fill: #3a7d44; }
      .t-warn  { font-size: 12px; font-weight: bold; fill: #b22234; }
      .t-note  { font-size: 11px; fill: #555; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 2; }      /* brand-fill / brand：構造物・盛土 */
      .pos   { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 2; }      /* positive-fill / positive：補強・排水材 */
      .warn  { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }    /* warn-fill / warn：軟弱な土 */
      .gray  { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; }    /* surface：地盤・部材 */
      .white { fill: #ffffff; stroke: #8a8a8a; stroke-width: 1.5; }    /* 白抜き：溝・かご */
      .slip  { fill: none; stroke: #b22234; stroke-width: 2; stroke-dasharray: 6 4; }  /* danger：すべり面 */
      .aB { stroke: #2e6da4; stroke-width: 2.2; fill: none; }          /* brand：水・力の向き */
      .aP { stroke: #3a7d44; stroke-width: 2.2; fill: none; }          /* positive */
      .aD { stroke: #b22234; stroke-width: 2.5; fill: none; }          /* danger：滑動力・荷重 */
      .rP { stroke: #3a7d44; stroke-width: 3.5; fill: none; }          /* positive：補強材・ドレーン */
      .ln { stroke: #8a8a8a; stroke-width: 1.5; fill: none; }          /* 引出線・軸 */
      .dash { stroke: #8a8a8a; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
      .card  { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1.5; }
      .num   { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box   { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
    <marker id="sm-B" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker>
    <marker id="sm-P" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#3a7d44"/></marker>
    <marker id="sm-D" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#b22234"/></marker>
  </defs>

  <text class="t-title" x="200" y="28" text-anchor="middle">サンドマット工法（敷砂工法）</text>
  <text class="t-lead" x="200" y="50" text-anchor="middle">軟弱地盤の上に砂の層を敷く</text>

  <rect class="warn" x="16" y="214" width="368" height="140"/>
  <polygon class="brand" points="110,190 150,110 250,110 290,190" style="stroke-width:1.5"/>
  <rect class="gray" x="16" y="190" width="368" height="24"/>
  <line class="rP" x1="150" y1="214" x2="150" y2="326"/>
  <line class="rP" x1="200" y1="214" x2="200" y2="326"/>
  <line class="rP" x1="250" y1="214" x2="250" y2="326"/>
  <line class="aB" x1="140" y1="202" x2="26" y2="202" marker-end="url(#sm-B)"/>
  <line class="aB" x1="260" y1="202" x2="374" y2="202" marker-end="url(#sm-B)"/>
  <text class="t-lab" x="200" y="150" text-anchor="middle">盛土</text>
  <text class="t-key" x="16" y="150">サンドマット</text>
  <text class="t-note" x="16" y="166">厚さ約0.5～1.2 m</text>
  <text class="t-note" x="24" y="300">軟弱地盤</text>
  <text class="t-note" x="262" y="326">ドレーン材</text>

  <!-- 要点 -->
  <rect class="box" x="16" y="392" width="368" height="92" rx="6"/>
  <text class="t-key" x="30" y="416">①</text>
  <text class="t-lab" x="104" y="416">施工機械のトラフィカビリティ確保</text>
  <text class="t-key" x="30" y="442">②</text>
  <text class="t-lab" x="104" y="442">盛土内の水の排水</text>
  <text class="t-key" x="30" y="468">③</text>
  <text class="t-lab" x="104" y="468">バーチカルドレーン併用時の排水層</text>
</svg>
