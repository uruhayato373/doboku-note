<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 275" style="max-width:500px;width:100%" role="img" aria-label="ネットワーク式工程表。イベント⓪〜⑨、作業A〜J。⓪→①がA（2日）、④→⑦がH（10日）、③→④はダミー。">
  <defs>
    <marker id="ar" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
  </defs>
  <style>
    .ti{font-family:Inter,'Noto Sans JP','Hiragino Sans',sans-serif;font-size:14px;fill:#555}
    .nn{font-family:Inter,'Noto Sans JP','Hiragino Sans',sans-serif;font-size:13px;fill:#1a3a5c;font-weight:600}
    .ac{font-family:Inter,'Noto Sans JP','Hiragino Sans',sans-serif;font-size:13px;fill:#222;font-weight:600}
    .du{font-family:Inter,'Noto Sans JP','Hiragino Sans',sans-serif;font-size:11px;fill:#555}
  </style>

  <text x="250" y="20" text-anchor="middle" class="ti">ネットワーク式工程表</text>

  <!-- ===== arrows ===== -->
  <line x1="55" y1="150" x2="95" y2="150" stroke="#222" stroke-width="2" marker-end="url(#ar)"/>
  <text x="75" y="143" text-anchor="middle" class="ac">A</text>
  <text x="75" y="164" text-anchor="middle" class="du">2</text>

  <line x1="125" y1="150" x2="160" y2="150" stroke="#222" stroke-width="2" marker-end="url(#ar)"/>
  <text x="142" y="143" text-anchor="middle" class="du">4</text>

  <line x1="190" y1="150" x2="235" y2="150" stroke="#222" stroke-width="2" marker-end="url(#ar)"/>
  <text x="212" y="143" text-anchor="middle" class="du">12</text>

  <line x1="265" y1="150" x2="320" y2="150" stroke="#222" stroke-width="2" marker-end="url(#ar)"/>
  <text x="292" y="143" text-anchor="middle" class="ac">H</text>
  <text x="292" y="164" text-anchor="middle" class="du">10</text>

  <line x1="350" y1="150" x2="390" y2="150" stroke="#222" stroke-width="2" marker-end="url(#ar)"/>
  <text x="370" y="143" text-anchor="middle" class="du">6</text>

  <line x1="420" y1="150" x2="450" y2="150" stroke="#222" stroke-width="2" marker-end="url(#ar)"/>
  <text x="435" y="143" text-anchor="middle" class="du">2</text>

  <line x1="118" y1="138" x2="196" y2="70" stroke="#222" stroke-width="2" marker-end="url(#ar)"/>
  <text x="150" y="100" text-anchor="middle" class="du">18</text>

  <line x1="214" y1="70" x2="245" y2="138" stroke="#222" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ar)"/>

  <line x1="216" y1="68" x2="392" y2="140" stroke="#222" stroke-width="2" marker-end="url(#ar)"/>
  <text x="320" y="92" text-anchor="middle" class="du">12</text>

  <line x1="118" y1="162" x2="151" y2="233" stroke="#222" stroke-width="2" marker-end="url(#ar)"/>
  <text x="123" y="205" text-anchor="middle" class="du">6</text>

  <line x1="175" y1="245" x2="240" y2="245" stroke="#222" stroke-width="2" marker-end="url(#ar)"/>
  <text x="207" y="238" text-anchor="middle" class="du">8</text>

  <line x1="263" y1="234" x2="322" y2="162" stroke="#222" stroke-width="2" marker-end="url(#ar)"/>
  <text x="307" y="205" text-anchor="middle" class="du">6</text>

  <!-- ===== nodes ===== -->
  <circle cx="40" cy="150" r="15" fill="#ffffff" stroke="#2e6da4" stroke-width="2"/><text x="40" y="155" text-anchor="middle" class="nn">0</text>
  <circle cx="110" cy="150" r="15" fill="#ffffff" stroke="#2e6da4" stroke-width="2"/><text x="110" y="155" text-anchor="middle" class="nn">1</text>
  <circle cx="175" cy="150" r="15" fill="#ffffff" stroke="#2e6da4" stroke-width="2"/><text x="175" y="155" text-anchor="middle" class="nn">2</text>
  <circle cx="205" cy="58" r="15" fill="#ffffff" stroke="#2e6da4" stroke-width="2"/><text x="205" y="63" text-anchor="middle" class="nn">3</text>
  <circle cx="250" cy="150" r="15" fill="#ffffff" stroke="#2e6da4" stroke-width="2"/><text x="250" y="155" text-anchor="middle" class="nn">4</text>
  <circle cx="160" cy="245" r="15" fill="#ffffff" stroke="#2e6da4" stroke-width="2"/><text x="160" y="250" text-anchor="middle" class="nn">5</text>
  <circle cx="255" cy="245" r="15" fill="#ffffff" stroke="#2e6da4" stroke-width="2"/><text x="255" y="250" text-anchor="middle" class="nn">6</text>
  <circle cx="335" cy="150" r="15" fill="#ffffff" stroke="#2e6da4" stroke-width="2"/><text x="335" y="155" text-anchor="middle" class="nn">7</text>
  <circle cx="405" cy="150" r="15" fill="#ffffff" stroke="#2e6da4" stroke-width="2"/><text x="405" y="155" text-anchor="middle" class="nn">8</text>
  <circle cx="465" cy="150" r="15" fill="#ffffff" stroke="#2e6da4" stroke-width="2"/><text x="465" y="155" text-anchor="middle" class="nn">9</text>
</svg>
