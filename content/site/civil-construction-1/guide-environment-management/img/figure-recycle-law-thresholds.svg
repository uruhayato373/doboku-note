<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="建設リサイクル法の対象工事の規模基準。床面積で判定するのは解体工事が 80 平方メートル以上、新築・増築工事が 500 平方メートル以上。請負代金で判定するのは修繕・模様替え工事が 1 億円以上、その他の工作物に関する工事が 500 万円以上">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-hd   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-work { font-size: 12px; font-weight: bold; fill: #222; }
      .t-val  { font-size: 12px; font-weight: bold; fill: #b22234; }
      .t-sec  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-item { font-size: 11px; fill: #222; }
      .hd1 { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .hd2 { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .cell { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-surf { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .rule { stroke: #d7d7d7; stroke-width: 1; }
    </style>
  </defs>

  <text class="t-lead" x="200" y="18" text-anchor="middle">判定の単位が工事種別で切り替わるのが罠</text>

  <rect class="hd1" x="20" y="32" width="360" height="24" rx="4"/>
  <text class="t-hd" x="200" y="49" text-anchor="middle">床面積で判定</text>
  <rect class="cell" x="20" y="60" width="360" height="76" rx="4"/>
  <text class="t-work" x="40" y="90">解体工事</text>
  <text class="t-val" x="364" y="90" text-anchor="end">80 ㎡以上</text>
  <text class="t-work" x="40" y="120">新築・増築工事</text>
  <text class="t-val" x="364" y="120" text-anchor="end">500 ㎡以上</text>

  <rect class="hd2" x="20" y="156" width="360" height="24" rx="4"/>
  <text class="t-hd" x="200" y="173" text-anchor="middle">請負代金で判定</text>
  <rect class="cell" x="20" y="184" width="360" height="76" rx="4"/>
  <text class="t-work" x="40" y="214">修繕・模様替え工事</text>
  <text class="t-val" x="364" y="214" text-anchor="end">1 億円以上</text>
  <text class="t-work" x="40" y="244">その他の工作物</text>
  <text class="t-val" x="364" y="244" text-anchor="end">500 万円以上</text>

  <rect class="box-surf" x="20" y="290" width="360" height="192" rx="6"/>
  <text class="t-sec" x="200" y="312" text-anchor="middle">読み取り方</text>
  <line class="rule" x1="36" y1="321" x2="364" y2="321"/>
  <text class="t-item" x="40" y="348">工事種別で判定の単位（面積・金額）が変わる</text>
  <text class="t-item" x="40" y="374">土木工事の大半は「その他の工作物」に該当する</text>
  <text class="t-item" x="40" y="400">対象工事では分別解体と再資源化が義務づけられる</text>
  <text class="t-item" x="40" y="426">解体には建設業許可または解体工事業の登録が必要</text>
  <text class="t-item" x="40" y="452">登録は 5 年ごとの更新、技術管理者の設置が必要</text>
</svg>
