<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="中央建設業審議会の役割。標準請負契約約款、工期に関する基準、労務費に関する基準、入札参加者の資格基準、予定価格の諸経費の基準を作成して実施を勧告する。経営事項審査の項目と基準、入札契約適正化指針については、決める前に意見を述べる。経営事項審査は国土交通大臣が、適正化指針は閣議決定で定める">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .l { font-size: 11px; fill: #555; }
      .h { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .k { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .s { font-size: 11px; fill: #222; }
      .t1 { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .t2 { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .t3 { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .c { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1.5; }
      .st { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .ln { stroke: #555; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <text class="l" x="200" y="16" text-anchor="middle">作る側と、意見を述べる側に分けて覚える</text>

  <rect class="t1" x="70" y="26" width="260" height="42" rx="6"/>
  <text class="h" x="200" y="51" text-anchor="middle">中央建設業審議会（建設業法第34条）</text>

  <line class="ln" x1="105" y1="68" x2="105" y2="92"/>
  <line class="ln" x1="295" y1="68" x2="295" y2="92"/>

  <rect class="t2" x="20" y="92" width="170" height="34" rx="6"/>
  <text class="k" x="105" y="114" text-anchor="middle">作成して実施を勧告</text>
  <rect class="t3" x="210" y="92" width="170" height="34" rx="6"/>
  <text class="k" x="295" y="114" text-anchor="middle">決める前に意見を述べる</text>

  <rect class="c" x="20" y="136" width="170" height="78" rx="6"/>
  <text class="h" x="105" y="168" text-anchor="middle">標準請負契約約款</text>
  <text class="s" x="105" y="190" text-anchor="middle">公共・民間・下請など</text>

  <rect class="c" x="20" y="224" width="170" height="78" rx="6"/>
  <text class="h" x="105" y="256" text-anchor="middle">工期に関する基準</text>
  <text class="s" x="105" y="278" text-anchor="middle">令和2年作成・令和6年改定</text>

  <rect class="c" x="20" y="312" width="170" height="78" rx="6"/>
  <text class="h" x="105" y="344" text-anchor="middle">労務費に関する基準</text>
  <text class="s" x="105" y="366" text-anchor="middle">令和7年12月に勧告</text>

  <rect class="c" x="20" y="400" width="170" height="78" rx="6"/>
  <text class="h" x="105" y="426" text-anchor="middle">ほか2つの基準</text>
  <text class="s" x="105" y="446" text-anchor="middle">入札参加者の資格基準</text>
  <text class="s" x="105" y="464" text-anchor="middle">予定価格の諸経費の基準</text>

  <rect class="c" x="210" y="136" width="170" height="78" rx="6"/>
  <text class="h" x="295" y="168" text-anchor="middle">経営事項審査</text>
  <text class="s" x="295" y="190" text-anchor="middle">項目と基準を定める前</text>

  <rect class="st" x="210" y="224" width="170" height="78" rx="6"/>
  <text class="s" x="295" y="258" text-anchor="middle">定めるのは</text>
  <text class="s" x="295" y="276" text-anchor="middle">国土交通大臣</text>

  <rect class="c" x="210" y="312" width="170" height="78" rx="6"/>
  <text class="h" x="295" y="344" text-anchor="middle">入札契約適正化指針</text>
  <text class="s" x="295" y="366" text-anchor="middle">案を作成する前</text>

  <rect class="st" x="210" y="400" width="170" height="78" rx="6"/>
  <text class="s" x="295" y="434" text-anchor="middle">定めるのは</text>
  <text class="s" x="295" y="452" text-anchor="middle">閣議決定</text>
</svg>
