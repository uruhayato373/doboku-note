<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="建設業法の罰則を重い順に並べた階段図。3年以下の拘禁刑または300万円以下の罰金は無許可営業など、6月以下の拘禁刑または100万円以下の罰金は許可申請書の虚偽記載など、100万円以下の罰金は技術者の不設置など、10万円以下の過料は届出や標識の不備など">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 11px; fill: #222; }
      .lead { fill: #555; }
      .h { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .sub { fill: #555; }
      .d { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .g { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
  </defs>

  <text class="lead" x="200" y="18" text-anchor="middle">重い順に並べると、対象行為と法人の扱いが見える</text>

  <rect class="d" x="20" y="28" width="360" height="118" rx="6"/>
  <text class="h" x="34" y="50">3年以下の拘禁刑 または 300万円以下の罰金</text>
  <text class="sub" x="34" y="68">併科もある。法人には1億円以下の罰金（両罰規定）</text>
  <text x="34" y="90">・無許可営業　・営業停止命令に違反した営業</text>
  <text x="34" y="108">・虚偽や不正の事実による許可の取得</text>
  <text x="34" y="126">・特定建設業の許可なしの下請契約（5,000万円以上）</text>

  <rect class="w" x="36" y="156" width="344" height="86" rx="6"/>
  <text class="h" x="50" y="178">6月以下の拘禁刑 または 100万円以下の罰金</text>
  <text x="50" y="200">・許可申請書への虚偽記載</text>
  <text x="50" y="218">・変更届出書類の不提出・虚偽記載</text>

  <rect class="b" x="52" y="252" width="328" height="96" rx="6"/>
  <text class="h" x="66" y="274">100万円以下の罰金</text>
  <text x="66" y="296">・主任技術者・監理技術者を置かない</text>
  <text x="66" y="314">・立入検査の拒否、虚偽の報告</text>
  <text x="66" y="332">・失効後に施工を続けるときの注文者への通知漏れ</text>

  <rect class="g" x="68" y="358" width="312" height="78" rx="6"/>
  <text class="h" x="82" y="380">10万円以下の過料（刑罰ではない）</text>
  <text x="82" y="402">・廃業等の届出を怠る　・標識を掲げない</text>
  <text x="82" y="420">・帳簿を備えない、保存しない</text>

  <text class="sub" x="20" y="456">建築工事業の下請契約は8,000万円以上が基準になる。</text>
  <text class="sub" x="20" y="472">拘禁刑以上、または建設業法違反などの罰金刑を受けると、</text>
  <text class="sub" x="20" y="488">執行後5年間は許可を受けられない（欠格要件）。</text>
</svg>
