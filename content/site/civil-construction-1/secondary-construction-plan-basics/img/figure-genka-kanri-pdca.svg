<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="原価管理の流れをPDCAで示す。実行予算を設定し、施工しながら実績原価を把握し、実行予算と対比して差額を分析し、是正して再び回す">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-lab   { font-size: 12px; fill: #222; }
      .t-key   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-sec   { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-warn  { font-size: 12px; font-weight: bold; fill: #b22234; }
      .t-pos   { font-size: 12px; font-weight: bold; fill: #3a7d44; }
      .t-note  { font-size: 11px; fill: #555; }
      .b-brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }   /* brand-fill / brand */
      .b-pos   { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }   /* positive-fill / positive */
      .b-warn  { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }   /* warn-fill / warn */
      .b-gray  { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; }   /* surface */
      .frame   { fill: none; stroke: #2e6da4; stroke-width: 1.5; stroke-dasharray: 6 4; }   /* brand dashed */
      .dash    { fill: none; stroke: #8a8a8a; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .arr     { stroke: #2e6da4; stroke-width: 2; fill: none; }   /* brand */
      .ln      { stroke: #8a8a8a; stroke-width: 1.5; fill: none; }
      .rule    { stroke: #d7d7d7; stroke-width: 1; }
      .box     { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
    <marker id="ar" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 9,4 0,8" fill="#2e6da4"/>
    </marker>
  </defs>

  <text class="t-title" x="200" y="28" text-anchor="middle">原価管理の業務の流れ</text>
  <text class="t-lead" x="200" y="50" text-anchor="middle">実行予算を作り、実績と比べ、是正して回す</text>
  <rect class="b-brand" x="16" y="70" width="172" height="120" rx="6"/>
  <text class="t-sec" x="30" y="100">Plan　予算設定</text>
  <text class="t-lab" x="30" y="132">工事見積りを再検討</text>
  <text class="t-lab" x="30" y="156">部分工事ごとに原価を配分</text>
  <rect class="b-pos" x="212" y="70" width="172" height="120" rx="6"/>
  <text class="t-sec" x="226" y="100">Do　実績の把握</text>
  <text class="t-lab" x="226" y="132">期間ごとに出来高を管理</text>
  <text class="t-lab" x="226" y="156">実績原価を集計・算定</text>
  <rect class="b-warn" x="212" y="214" width="172" height="120" rx="6"/>
  <text class="t-sec" x="226" y="244">Check　予算と対比</text>
  <text class="t-lab" x="226" y="276">定期的に比較し差額を分析</text>
  <text class="t-lab" x="226" y="300">差額の原因を明らかにする</text>
  <rect class="b-gray" x="16" y="214" width="172" height="120" rx="6"/>
  <text class="t-sec" x="30" y="244">Act　是正</text>
  <text class="t-lab" x="30" y="276">差額の原因に応じて是正</text>
  <text class="t-lab" x="30" y="300">施工方法・計画を修正</text>
  <line class="arr" x1="188" y1="130" x2="212" y2="130" marker-end="url(#ar)"/>
  <line class="arr" x1="298" y1="190" x2="298" y2="214" marker-end="url(#ar)"/>
  <line class="arr" x1="212" y1="274" x2="188" y2="274" marker-end="url(#ar)"/>
  <line class="arr" x1="102" y1="214" x2="102" y2="190" marker-end="url(#ar)"/>
  <rect class="box" x="16" y="366" width="368" height="92" rx="6"/><text class="t-key" x="30" y="394">目標</text><text class="t-lab" x="104" y="394">実行予算が原価目標。原価は請負金額以内</text><text class="t-key" x="30" y="418">差額の原因</text><text class="t-lab" x="104" y="418">工事量の増減・工法の変更・歩掛り</text><text class="t-lab" x="104" y="442">予期しない災害・資材・労務単価の変動</text>
</svg>
