<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="現場管理組織の考え方。現場代理人と主任技術者または監理技術者の下で、計画・調達・施工・管理の機能を分担する組織を編成し、役割と権限を明確にして管理サイクルで回す">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-lab   { font-size: 12px; fill: #222; }
      .t-key   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-sec   { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-warn  { font-size: 12px; font-weight: bold; fill: #b22234; }
      .t-pos   { font-size: 12px; font-weight: bold; fill: #3a7d44; }
      .t-note  { font-size: 11px; fill: #555; }
      .b-brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }   /* brand-fill / brand */
      .b-pos   { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }   /* positive-fill / positive */
      .b-warn  { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }   /* warn-fill / warn */
      .b-gray  { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; }   /* surface */
      .frame   { fill: none; stroke: #2e6da4; stroke-width: 1.5; stroke-dasharray: 6 4; }   /* brand dashed */
      .dash    { fill: none; stroke: #8a8a8a; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .arr     { stroke: #2e6da4; stroke-width: 2; fill: none; }   /* brand */
      .ln      { stroke: #8a8a8a; stroke-width: 1.5; fill: none; }
      .rule    { stroke: #d7d7d7; stroke-width: 1; }
      .box     { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
    <marker id="ar" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 9,4 0,8" fill="#2e6da4"/>
    </marker>
  </defs>

  <text class="t-title" x="200" y="28" text-anchor="middle">現場管理組織の例</text>
  <text class="t-lead" x="200" y="50" text-anchor="middle">計画・調達・施工・管理の機能を分担する</text>
  <rect class="b-brand" x="100" y="66" width="200" height="36" rx="6"/><text class="t-key" x="200" y="88" text-anchor="middle">現場代理人</text>
  <line class="arr" x1="200" y1="102" x2="200" y2="122" marker-end="url(#ar)"/>
  <rect class="b-brand" x="90" y="122" width="220" height="36" rx="6"/><text class="t-key" x="200" y="144" text-anchor="middle">主任技術者／監理技術者</text>
  <line class="arr" x1="200" y1="158" x2="200" y2="178" marker-end="url(#ar)"/>
  <rect class="frame" x="16" y="178" width="368" height="196" rx="6"/>
  <text class="t-key" x="30" y="198">機能を分担するフォーマルな組織</text>
  <rect class="b-pos" x="32" y="216" width="140" height="44" rx="6"/><text class="t-sec" x="102" y="242" text-anchor="middle">計画</text>
  <rect class="b-pos" x="228" y="216" width="140" height="44" rx="6"/><text class="t-sec" x="298" y="242" text-anchor="middle">調達</text>
  <rect class="b-pos" x="32" y="304" width="140" height="44" rx="6"/><text class="t-sec" x="102" y="330" text-anchor="middle">管理</text>
  <rect class="b-pos" x="228" y="304" width="140" height="44" rx="6"/><text class="t-sec" x="298" y="330" text-anchor="middle">施工</text>
  <line class="arr" x1="172" y1="238" x2="228" y2="238" marker-end="url(#ar)"/>
  <line class="arr" x1="298" y1="260" x2="298" y2="304" marker-end="url(#ar)"/>
  <line class="arr" x1="228" y1="326" x2="172" y2="326" marker-end="url(#ar)"/>
  <rect class="box" x="16" y="392" width="368" height="92" rx="6"/><text class="t-key" x="30" y="420">原則</text><text class="t-lab" x="104" y="420">役割と権限を明確にし、相互に理解する</text><text class="t-key" x="30" y="444">管理</text><text class="t-lab" x="104" y="444">管理者は仕事を調整し、P→D→C→Aで回す</text><text class="t-key" x="30" y="468">構成</text><text class="t-lab" x="104" y="468">資格・経験・技能・年齢構成のバランス</text>
</svg>
