<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="現場組織表の構成。現場代理人の下に監理技術者または主任技術者を置き、その下に担当技術者・専門技術者（置く工事のみ）と職長・作業員が続く。指揮命令系統と責任・権限、業務分担を明確に記載する">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-lab   { font-size: 12px; fill: #222; }
      .t-key   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-sec   { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-warn  { font-size: 12px; font-weight: bold; fill: #b22234; }
      .t-pos   { font-size: 12px; font-weight: bold; fill: #3a7d44; }
      .t-note  { font-size: 11px; fill: #555; }
      .b-brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }   /* brand-fill / brand */
      .b-pos   { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }   /* positive-fill / positive */
      .b-warn  { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }   /* warn-fill / warn */
      .b-gray  { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; }   /* surface */
      .frame   { fill: none; stroke: #2e6da4; stroke-width: 1.5; stroke-dasharray: 6 4; }   /* brand dashed */
      .dash    { fill: none; stroke: #8a8a8a; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .arr     { stroke: #2e6da4; stroke-width: 2; fill: none; }   /* brand */
      .ln      { stroke: #8a8a8a; stroke-width: 1.5; fill: none; }
      .rule    { stroke: #d7d7d7; stroke-width: 1; }
      .box     { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
    <marker id="ar" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 9,4 0,8" fill="#2e6da4"/>
    </marker>
  </defs>

  <text class="t-title" x="200" y="28" text-anchor="middle">現場組織表の例</text>
  <text class="t-lead" x="200" y="50" text-anchor="middle">役職と指揮命令の系統がわかるように書く</text>
  <rect class="b-brand" x="120" y="66" width="160" height="38" rx="6"/><text class="t-key" x="200" y="89" text-anchor="middle">現場代理人</text>
  <line class="arr" x1="200" y1="104" x2="200" y2="128" marker-end="url(#ar)"/>
  <rect class="b-brand" x="80" y="128" width="240" height="44" rx="6"/><text class="t-key" x="200" y="154" text-anchor="middle">監理技術者／主任技術者</text>
  <line class="ln" x1="200" y1="172" x2="200" y2="196"/>
  <line class="ln" x1="104" y1="196" x2="296" y2="196"/>
  <line class="arr" x1="104" y1="196" x2="104" y2="222" marker-end="url(#ar)"/>
  <line class="arr" x1="296" y1="196" x2="296" y2="222" marker-end="url(#ar)"/>
  <rect class="b-pos" x="16" y="222" width="176" height="56" rx="6"/><text class="t-key" x="104" y="246" text-anchor="middle">担当技術者</text><text class="t-note" x="104" y="262" text-anchor="middle">置く工事のみ記載</text>
  <rect class="b-pos" x="208" y="222" width="176" height="56" rx="6"/><text class="t-key" x="296" y="246" text-anchor="middle">専門技術者</text><text class="t-note" x="296" y="262" text-anchor="middle">置く工事のみ記載</text>
  <line class="ln" x1="104" y1="278" x2="104" y2="298"/>
  <line class="ln" x1="296" y1="278" x2="296" y2="298"/>
  <line class="ln" x1="104" y1="298" x2="296" y2="298"/>
  <line class="arr" x1="200" y1="298" x2="200" y2="320" marker-end="url(#ar)"/>
  <rect class="b-gray" x="80" y="320" width="240" height="40" rx="6"/><text class="t-lab" x="200" y="344" text-anchor="middle">職長・作業員</text>
  <rect class="box" x="16" y="392" width="368" height="68" rx="6"/><text class="t-key" x="30" y="420">明確に</text><text class="t-lab" x="104" y="420">責任と権限、指揮命令系統、業務分担</text><text class="t-key" x="30" y="444">注意</text><text class="t-lab" x="104" y="444">下請総額に応じて技術者を適切に選任</text>
</svg>
