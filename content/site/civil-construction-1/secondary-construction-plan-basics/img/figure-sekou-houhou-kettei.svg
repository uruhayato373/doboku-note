<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="施工方法と施工手順を決める流れ。設計図と事前調査の整理、複数案の選定、手順と機械の組合せの検討、工程・工費・安全性の総合評価を経て最適な方法と手順を決める">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-lab   { font-size: 12px; fill: #222; }
      .t-key   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-sec   { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-warn  { font-size: 12px; font-weight: bold; fill: #b22234; }
      .t-pos   { font-size: 12px; font-weight: bold; fill: #3a7d44; }
      .t-note  { font-size: 11px; fill: #555; }
      .b-brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }   /* brand-fill / brand */
      .b-pos   { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }   /* positive-fill / positive */
      .b-warn  { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }   /* warn-fill / warn */
      .b-gray  { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; }   /* surface */
      .frame   { fill: none; stroke: #2e6da4; stroke-width: 1.5; stroke-dasharray: 6 4; }   /* brand dashed */
      .dash    { fill: none; stroke: #8a8a8a; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .arr     { stroke: #2e6da4; stroke-width: 2; fill: none; }   /* brand */
      .ln      { stroke: #8a8a8a; stroke-width: 1.5; fill: none; }
      .rule    { stroke: #d7d7d7; stroke-width: 1; }
      .box     { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
    <marker id="ar" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 9,4 0,8" fill="#2e6da4"/>
    </marker>
  </defs>

  <text class="t-title" x="200" y="28" text-anchor="middle">施工方法・施工手順の決定手順</text>
  <text class="t-lead" x="200" y="50" text-anchor="middle">複数案を比べ、総合評価で絞り込む</text>
  <rect class="b-brand" x="16" y="66" width="190" height="40" rx="6"/><text class="t-lab" x="111" y="90" text-anchor="middle">設計図と事前調査を整理する</text>
  <line class="arr" x1="111" y1="106" x2="111" y2="130" marker-end="url(#ar)"/>
  <rect class="b-brand" x="56" y="130" width="190" height="40" rx="6"/><text class="t-lab" x="151" y="154" text-anchor="middle">複数の施工方法案を選ぶ</text>
  <line class="arr" x1="151" y1="170" x2="151" y2="194" marker-end="url(#ar)"/>
  <rect class="b-brand" x="96" y="194" width="190" height="40" rx="6"/><text class="t-lab" x="191" y="218" text-anchor="middle">手順と設備機械の組合せを検討</text>
  <line class="arr" x1="191" y1="234" x2="191" y2="258" marker-end="url(#ar)"/>
  <rect class="b-brand" x="136" y="258" width="190" height="40" rx="6"/><text class="t-lab" x="231" y="282" text-anchor="middle">工程・工費・安全性で総合評価</text>
  <line class="arr" x1="231" y1="298" x2="231" y2="322" marker-end="url(#ar)"/>
  <rect class="b-pos" x="176" y="322" width="190" height="40" rx="6"/><text class="t-pos" x="271" y="346" text-anchor="middle">最適な方法と手順を決定</text>
  <rect class="box" x="16" y="392" width="368" height="92" rx="6"/><text class="t-key" x="30" y="420">重点工種</text><text class="t-lab" x="104" y="420">数量・工費が大きい／高度な技術が要る</text><text class="t-lab" x="104" y="444">危険度が高い／環境への影響が予想される</text><text class="t-key" x="30" y="468">基本方針</text><text class="t-lab" x="104" y="468">影響の大きい工種を優先し、作業を平準化</text>
</svg>
