<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="スクレーパ3機種の適用運搬距離の比較。スクレープドーザは40から250メートル、被けん引式スクレーパは60から400メートル、モータスクレーパは200から1200メートルで、モータスクレーパが最も長距離に適する">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-name { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-rng  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-tick { font-size: 11px; fill: #555; }
      .t-axis { font-size: 11px; fill: #555; }
      .t-key  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-item { font-size: 11px; fill: #555; }
      .bar-1 { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .bar-2 { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .bar-3 { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .ax    { stroke: #8a8a8a; stroke-width: 1.5; }
      .box-surf { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
  </defs>

  <text class="t-lead" x="200" y="18" text-anchor="middle">運搬距離で使い分ける（範囲は重なり合う）</text>

  <text class="t-name" x="40" y="42">スクレープドーザ</text>
  <text class="t-rng" x="360" y="42" text-anchor="end">40〜250 m</text>
  <rect class="bar-1" x="70" y="50" width="55" height="22" rx="3"/>

  <text class="t-name" x="40" y="100">被けん引式スクレーパ</text>
  <text class="t-rng" x="360" y="100" text-anchor="end">60〜400 m</text>
  <rect class="bar-2" x="75" y="108" width="88" height="22" rx="3"/>

  <text class="t-name" x="40" y="158">モータスクレーパ</text>
  <text class="t-rng" x="360" y="158" text-anchor="end">200〜1,200 m</text>
  <rect class="bar-3" x="112" y="166" width="258" height="22" rx="3"/>

  <line class="ax" x1="60" y1="206" x2="370" y2="206"/>
  <line class="ax" x1="60" y1="206" x2="60" y2="212"/>
  <line class="ax" x1="163" y1="206" x2="163" y2="212"/>
  <line class="ax" x1="267" y1="206" x2="267" y2="212"/>
  <line class="ax" x1="370" y1="206" x2="370" y2="212"/>
  <text class="t-tick" x="60" y="226" text-anchor="middle">0</text>
  <text class="t-tick" x="163" y="226" text-anchor="middle">400</text>
  <text class="t-tick" x="267" y="226" text-anchor="middle">800</text>
  <text class="t-tick" x="370" y="226" text-anchor="middle">1,200</text>
  <text class="t-axis" x="215" y="246" text-anchor="middle">運搬距離（m）</text>

  <rect class="box-surf" x="20" y="262" width="360" height="220" rx="6"/>
  <text class="t-key" x="40" y="288">スクレープドーザ</text>
  <text class="t-item" x="40" y="306">スクレーパとブルドーザの組合せ。横向きで運転する</text>
  <text class="t-item" x="40" y="322">方向変換が不要でサイクルタイムを短縮できる</text>

  <text class="t-key" x="40" y="352">被けん引式スクレーパ</text>
  <text class="t-item" x="40" y="370">クローラ式トラクタでけん引し、動力装置を持たない</text>
  <text class="t-item" x="40" y="386">軟弱地・不整地・勾配地に適するが機動力は劣る</text>

  <text class="t-key" x="40" y="416">モータスクレーパ</text>
  <text class="t-item" x="40" y="434">ホイール式トラクタと一体構造で走行速度が速い</text>
  <text class="t-item" x="40" y="450">ツインエンジン式は前後輪駆動で悪条件に強い</text>
</svg>
