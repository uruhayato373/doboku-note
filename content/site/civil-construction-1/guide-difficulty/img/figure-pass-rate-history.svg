      .tick { font-size: 11px; fill: #555; }
      .band { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .val-a { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .val-b { font-size: 12px; font-weight: bold; fill: #222; }
      .leg { font-size: 12px; fill: #222; }
      .grid { stroke: #d7d7d7; stroke-width: 1; }
      .line-a { fill: none; stroke: #2e6da4; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
      .line-b { fill: none; stroke: #555; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
      .dot-a { fill: #2e6da4; stroke: #2e6da4; stroke-width: 2; }
      .dot-a-open { fill: #ffffff; stroke: #2e6da4; stroke-width: 2; }
      .sq-b { fill: #555; stroke: #555; stroke-width: 1; }
      .mark { stroke: #8a8a8a; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .legend-box { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
