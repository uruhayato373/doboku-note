<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="スペーサの用い方。せき板と鉄筋の間にスペーサを挟み、鉄筋の外面からコンクリート表面までの最短距離であるかぶりを確保する">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-sec   { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-lab   { font-size: 12px; fill: #222; }
      .t-key   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-warn  { font-size: 12px; font-weight: bold; fill: #b22234; }
      .t-pos   { font-size: 12px; font-weight: bold; fill: #3a7d44; }
      .t-note  { font-size: 11px; fill: #555; }
      .con  { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 2; }     /* brand-fill / brand：コンクリート */
      .old  { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 2; }     /* surface：旧コンクリート・型枠 */
      .good { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 2; }     /* positive-fill / positive */
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }   /* warn-fill / warn */
      .bad  { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }   /* danger-fill / danger */
      .bar  { fill: #1a3a5c; stroke: none; }                          /* 鉄筋断面 */
      .rod  { fill: none; stroke: #1a3a5c; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .dim  { fill: none; stroke: #555; stroke-width: 1.5; }
      .ext  { fill: none; stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3 3; }
      .crack{ fill: none; stroke: #b22234; stroke-width: 2; stroke-dasharray: 6 4; }
      .rule { stroke: #d7d7d7; stroke-width: 1; }
      .box  { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
    <marker id="sp-a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 9,4 0,8" fill="#555"/>
    </marker>
    <marker id="sp-r" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 9,4 0,8" fill="#b22234"/>
    </marker>
    <marker id="sp-s" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse">
      <polygon points="0,0 9,4 0,8" fill="#555"/>
    </marker>
  </defs>
  <text class="t-title" x="200" y="28" text-anchor="middle">スペーサとかぶり</text>
  <text class="t-lead" x="200" y="50" text-anchor="middle">せき板と鉄筋の間に挟んで保持する</text>
  <rect class="old" x="80" y="90" width="10" height="240"/>
  <rect class="old" x="290" y="90" width="10" height="240"/>
  <rect class="con" x="90" y="90" width="200" height="240"/>
  <rect class="good" x="90" y="140" width="32" height="20"/>
  <rect class="good" x="90" y="208" width="32" height="20"/>
  <rect class="good" x="90" y="276" width="32" height="20"/>
  <rect class="good" x="258" y="140" width="32" height="20"/>
  <rect class="good" x="258" y="208" width="32" height="20"/>
  <rect class="good" x="258" y="276" width="32" height="20"/>
  <circle class="bar" cx="130" cy="150" r="8"/><circle class="bar" cx="130" cy="218" r="8"/><circle class="bar" cx="130" cy="286" r="8"/>
  <circle class="bar" cx="250" cy="150" r="8"/><circle class="bar" cx="250" cy="218" r="8"/><circle class="bar" cx="250" cy="286" r="8"/>
  <text class="t-note" x="85" y="82" text-anchor="middle">せき板</text>
  <text class="t-note" x="295" y="82" text-anchor="middle">せき板</text>
  <text class="t-pos" x="16" y="186">スペーサ</text>
  <line class="rule" x1="64" y1="182" x2="106" y2="156"/>
  <line class="ext" x1="90" y1="296" x2="90" y2="352"/>
  <line class="ext" x1="122" y1="296" x2="122" y2="352"/>
  <line class="dim" x1="94" y1="344" x2="118" y2="344" marker-start="url(#sp-s)" marker-end="url(#sp-a)"/>
  <text class="t-warn" x="106" y="368" text-anchor="middle">かぶり</text>
  <rect class="box" x="16" y="392" width="368" height="92" rx="6"/>
  <text class="t-key" x="30" y="416">かぶり</text>
  <text class="t-lab" x="104" y="416">鉄筋外面からコンクリート表面の最短距離</text>
  <text class="t-key" x="30" y="442">確認</text>
  <text class="t-lab" x="104" y="442">施工前に配筋図で必要なかぶり厚さを確認</text>
  <text class="t-key" x="30" y="468">配置</text>
  <text class="t-lab" x="104" y="468">かぶりと組立精度を確認しながら使う</text>

</svg>
