<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="逆打ちコンクリートの打継目。新コンクリートは旧コンクリートの下面に打ち継がれ、ブリーディング水の上昇や沈下で打継目に隙間ができやすい">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-sec   { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-lab   { font-size: 12px; fill: #222; }
      .t-key   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-warn  { font-size: 12px; font-weight: bold; fill: #b22234; }
      .t-pos   { font-size: 12px; font-weight: bold; fill: #3a7d44; }
      .t-note  { font-size: 11px; fill: #555; }
      .con  { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 2; }     /* brand-fill / brand：コンクリート */
      .old  { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 2; }     /* surface：旧コンクリート・型枠 */
      .good { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 2; }     /* positive-fill / positive */
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }   /* warn-fill / warn */
      .bad  { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }   /* danger-fill / danger */
      .bar  { fill: #1a3a5c; stroke: none; }                          /* 鉄筋断面 */
      .rod  { fill: none; stroke: #1a3a5c; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .dim  { fill: none; stroke: #555; stroke-width: 1.5; }
      .ext  { fill: none; stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3 3; }
      .crack{ fill: none; stroke: #b22234; stroke-width: 2; stroke-dasharray: 6 4; }
      .rule { stroke: #d7d7d7; stroke-width: 1; }
      .box  { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
    <marker id="gy-a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 9,4 0,8" fill="#555"/>
    </marker>
    <marker id="gy-r" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 9,4 0,8" fill="#b22234"/>
    </marker>
    <marker id="gy-s" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse">
      <polygon points="0,0 9,4 0,8" fill="#555"/>
    </marker>
  </defs>
  <text class="t-title" x="200" y="28" text-anchor="middle">逆打ちコンクリートの打継目</text>
  <text class="t-lead" x="200" y="50" text-anchor="middle">旧コンクリートの下へ打ち継ぐため、隙間ができやすい</text>
  <rect class="old" x="90" y="76" width="220" height="104"/>
  <rect class="old" x="82" y="180" width="8" height="140"/>
  <rect class="old" x="310" y="180" width="8" height="140"/>
  <rect class="old" x="82" y="312" width="236" height="8"/>
  <rect class="con" x="90" y="196" width="220" height="116"/>
  <rect class="bad" x="90" y="180" width="220" height="16"/>
  <text class="t-lab" x="200" y="132" text-anchor="middle">旧コンクリート（先に打込み）</text>
  <text class="t-lab" x="200" y="296" text-anchor="middle">新コンクリート</text>
  <text class="t-warn" x="200" y="193" text-anchor="middle">隙間</text>
  <line class="dim" x1="112" y1="272" x2="112" y2="214" marker-end="url(#gy-a)"/>
  <text class="t-note" x="124" y="236">ブリーディング水</text>
  <text class="t-note" x="124" y="250">が上昇</text>
  <line class="dim" x1="288" y1="214" x2="288" y2="260" marker-end="url(#gy-a)"/>
  <text class="t-note" x="276" y="236" text-anchor="end">沈下</text>
  <rect class="box" x="16" y="392" width="368" height="66" rx="6"/>
  <text class="t-key" x="30" y="416">原因</text>
  <text class="t-lab" x="104" y="416">ブリーディング水や沈下で隙間ができる</text>
  <text class="t-key" x="30" y="442">対策</text>
  <text class="t-lab" x="104" y="442">各種の施工方法で打継目の一体化を図る</text>

</svg>
