<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="床組みの打継目の位置。スラブやはりの打継目は、圧縮力の作用方向と直角になるよう、せん断力の小さいスパン中央付近に設け、支点付近のせん断力が大きい位置には設けない。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-lab   { font-size: 12px; fill: #222; }
      .t-key   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-warn  { font-size: 12px; font-weight: bold; fill: #b22234; }
      .t-ok    { font-size: 12px; font-weight: bold; fill: #3a7d44; }
      .t-note  { font-size: 11px; fill: #555; }
      .card  { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1.5; }
      .box   { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .conc  { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 2; }       /* brand：コンクリート */
      .gray  { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; }     /* 既設・支持部材 */
      .warn  { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }     /* warn：注意の層・反応生成物 */
      .good  { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 2; }       /* positive */
      .bad   { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }     /* danger */
      .crack { fill: none; stroke: #b22234; stroke-width: 2.5; stroke-linejoin: round; }
      .dash  { fill: none; stroke: #8a8a8a; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .lead  { fill: none; stroke: #8a8a8a; stroke-width: 1; }
      .arb   { fill: none; stroke: #2e6da4; stroke-width: 2; }
      .arr   { fill: none; stroke: #b22234; stroke-width: 2; }
      .arg   { fill: none; stroke: #3a7d44; stroke-width: 2.5; }
      .bar   { fill: #8a8a8a; stroke: #555; stroke-width: 1; }
    </style>
    <marker id="mb" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker>
    <marker id="mr" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#b22234"/></marker>
    <marker id="mg" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#3a7d44"/></marker>
  </defs>

  <text class="t-title" x="200" y="28" text-anchor="middle">床組みの打継目の位置</text>
  <text class="t-lead" x="200" y="50" text-anchor="middle">せん断力の小さいスパン中央に、圧縮力と直角に</text>

  <rect class="card" x="16" y="64" width="368" height="306" rx="6"/>
    <text class="t-ok" x="200" y="106" text-anchor="middle">スパン中央付近に打継目を設ける</text>
  <rect class="gray" x="60" y="194" width="40" height="120"/>
  <rect class="gray" x="300" y="194" width="40" height="120"/>
  <rect class="conc" x="40" y="134" width="320" height="60"/>
  <rect class="bad" x="102" y="134" width="52" height="60"/>
  <rect class="bad" x="246" y="134" width="52" height="60"/>
  <text class="t-warn" x="128" y="170" text-anchor="middle">×</text>
  <text class="t-warn" x="272" y="170" text-anchor="middle">×</text>
  <text class="t-warn" x="128" y="216" text-anchor="middle">せん断力</text>
  <text class="t-warn" x="128" y="232" text-anchor="middle">大きい</text>
  <text class="t-warn" x="272" y="216" text-anchor="middle">せん断力</text>
  <text class="t-warn" x="272" y="232" text-anchor="middle">大きい</text>
  <line x1="200" y1="120" x2="200" y2="208" stroke="#3a7d44" stroke-width="4"/>
  <line class="arb" x1="164" y1="164" x2="192" y2="164" marker-end="url(#mb)"/>
  <line class="arb" x1="236" y1="164" x2="208" y2="164" marker-end="url(#mb)"/>
  <text class="t-note" x="200" y="228" text-anchor="middle">圧縮力と直角</text>
  <text class="t-note" x="80" y="332" text-anchor="middle">柱</text>
  <text class="t-note" x="320" y="332" text-anchor="middle">柱</text>
  <text class="t-note" x="200" y="270" text-anchor="middle">スラブ・はりを横から見た図</text>

  <!-- 要点 -->
  <rect class="box" x="16" y="392" width="368" height="92" rx="6"/>
  <text class="t-key" x="30" y="416">原則</text>
  <text class="t-lab" x="92" y="416">せん断力の小さな位置に設ける</text>
  <text class="t-key" x="30" y="442">柱・壁</text>
  <text class="t-lab" x="92" y="442">打継目は床組みとの境付近</text>
  <text class="t-key" x="30" y="468">ハンチ</text>
  <text class="t-lab" x="92" y="468">床組みと連続してコンクリートを打つ</text>

</svg>
