<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="ひび割れ誘発目地を検討する場面。水和熱による温度変化や乾燥収縮から生じる温度応力が引張強度を上回ると予想されるとき、誘発目地の設置を検討する">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-sec   { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-lab   { font-size: 12px; fill: #222; }
      .t-key   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-warn  { font-size: 12px; font-weight: bold; fill: #b22234; }
      .t-pos   { font-size: 12px; font-weight: bold; fill: #3a7d44; }
      .t-note  { font-size: 11px; fill: #555; }
      .con  { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 2; }     /* brand-fill / brand：コンクリート */
      .old  { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 2; }     /* surface：旧コンクリート・型枠 */
      .good { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 2; }     /* positive-fill / positive */
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }   /* warn-fill / warn */
      .bad  { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }   /* danger-fill / danger */
      .bar  { fill: #1a3a5c; stroke: none; }                          /* 鉄筋断面 */
      .rod  { fill: none; stroke: #1a3a5c; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .dim  { fill: none; stroke: #555; stroke-width: 1.5; }
      .ext  { fill: none; stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3 3; }
      .crack{ fill: none; stroke: #b22234; stroke-width: 2; stroke-dasharray: 6 4; }
      .rule { stroke: #d7d7d7; stroke-width: 1; }
      .box  { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
    <marker id="hk-a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 9,4 0,8" fill="#555"/>
    </marker>
    <marker id="hk-r" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 9,4 0,8" fill="#b22234"/>
    </marker>
    <marker id="hk-s" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse">
      <polygon points="0,0 9,4 0,8" fill="#555"/>
    </marker>
  </defs>
  <text class="t-title" x="200" y="28" text-anchor="middle">誘発目地を検討する場面</text>
  <text class="t-lead" x="200" y="50" text-anchor="middle">応力が引張強度を上回りそうなとき</text>
  <rect class="warn" x="16" y="70" width="176" height="50" rx="6"/>
  <rect class="warn" x="208" y="70" width="176" height="50" rx="6"/>
  <text class="t-lab" x="104" y="92" text-anchor="middle">セメントの水和熱</text>
  <text class="t-lab" x="104" y="108" text-anchor="middle">による温度変化</text>
  <text class="t-lab" x="296" y="100" text-anchor="middle">乾燥収縮 など</text>
  <path class="dim" d="M 104 120 V 134 H 190 V 146" marker-end="url(#hk-a)"/>
  <path class="dim" d="M 296 120 V 134 H 210 V 146" marker-end="url(#hk-a)"/>
  <rect class="box" x="130" y="150" width="140" height="32" rx="6"/>
  <text class="t-key" x="200" y="171" text-anchor="middle">温度応力</text>
  <text class="t-lab" x="16" y="226">引張強度</text>
  <rect class="con" x="100" y="210" width="160" height="22"/>
  <text class="t-lab" x="16" y="270">温度応力</text>
  <rect class="bad" x="100" y="254" width="240" height="22"/>
  <line class="ext" x1="260" y1="204" x2="260" y2="284"/>
  <text class="t-warn" x="272" y="246">上回る予想</text>
  <path class="dim" d="M 200 292 V 306" marker-end="url(#hk-a)"/>
  <rect class="good" x="90" y="310" width="220" height="38" rx="6"/>
  <text class="t-pos" x="200" y="334" text-anchor="middle">誘発目地の設置を検討</text>
  <text class="t-note" x="200" y="378" text-anchor="middle">ひび割れを定めた位置に集中させる方法</text>

</svg>
