<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="束ねて配置する鉄筋。複数本の鉄筋を束にして配置する。束ねた鉄筋でも、スペーサでかぶりを確保し、組み立て精度とあきを確認する">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-sec   { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-lab   { font-size: 12px; fill: #222; }
      .t-key   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-warn  { font-size: 12px; font-weight: bold; fill: #b22234; }
      .t-pos   { font-size: 12px; font-weight: bold; fill: #3a7d44; }
      .t-note  { font-size: 11px; fill: #555; }
      .con  { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 2; }     /* brand-fill / brand：コンクリート */
      .old  { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 2; }     /* surface：旧コンクリート・型枠 */
      .good { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 2; }     /* positive-fill / positive */
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }   /* warn-fill / warn */
      .bad  { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }   /* danger-fill / danger */
      .bar  { fill: #1a3a5c; stroke: none; }                          /* 鉄筋断面 */
      .rod  { fill: none; stroke: #1a3a5c; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .dim  { fill: none; stroke: #555; stroke-width: 1.5; }
      .ext  { fill: none; stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3 3; }
      .crack{ fill: none; stroke: #b22234; stroke-width: 2; stroke-dasharray: 6 4; }
      .rule { stroke: #d7d7d7; stroke-width: 1; }
      .box  { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
    <marker id="tb-a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 9,4 0,8" fill="#555"/>
    </marker>
    <marker id="tb-r" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 9,4 0,8" fill="#b22234"/>
    </marker>
    <marker id="tb-s" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse">
      <polygon points="0,0 9,4 0,8" fill="#555"/>
    </marker>
  </defs>
  <text class="t-title" x="200" y="28" text-anchor="middle">束ねて配置する鉄筋</text>
  <text class="t-lead" x="200" y="50" text-anchor="middle">複数本をまとめて 1 か所に置く</text>
  <text class="t-sec" x="16" y="80">束の例</text>
  <rect class="warn" x="88" y="88" width="64" height="40" rx="20"/>
  <circle class="bar" cx="110" cy="108" r="12"/><circle class="bar" cx="134" cy="108" r="12"/>
  <text class="t-note" x="120" y="150" text-anchor="middle">横に並べた束</text>
  <rect class="warn" x="248" y="82" width="56" height="62" rx="26"/>
  <circle class="bar" cx="264" cy="118" r="12"/><circle class="bar" cx="288" cy="118" r="12"/><circle class="bar" cx="276" cy="98" r="12"/>
  <text class="t-note" x="276" y="162" text-anchor="middle">三角に束ねた束</text>
  <line class="rule" x1="16" y1="176" x2="384" y2="176"/>
  <text class="t-sec" x="16" y="198">梁の断面での配置</text>
  <rect class="con" x="90" y="210" width="220" height="110"/>
  <rect class="warn" x="112" y="260" width="64" height="40" rx="20"/>
  <circle class="bar" cx="134" cy="280" r="12"/><circle class="bar" cx="158" cy="280" r="12"/>
  <rect class="warn" x="224" y="260" width="64" height="40" rx="20"/>
  <circle class="bar" cx="246" cy="280" r="12"/><circle class="bar" cx="270" cy="280" r="12"/>
  <line class="ext" x1="176" y1="280" x2="176" y2="348"/>
  <line class="ext" x1="224" y1="280" x2="224" y2="348"/>
  <line class="dim" x1="180" y1="342" x2="220" y2="342" marker-start="url(#tb-s)" marker-end="url(#tb-a)"/>
  <text class="t-warn" x="200" y="364" text-anchor="middle">あき</text>
  <line class="ext" x1="64" y1="292" x2="112" y2="292"/>
  <line class="ext" x1="64" y1="320" x2="90" y2="320"/>
  <line class="dim" x1="74" y1="296" x2="74" y2="316" marker-start="url(#tb-s)" marker-end="url(#tb-a)"/>
  <text class="t-warn" x="16" y="312">かぶり</text>
  <rect class="box" x="16" y="392" width="368" height="92" rx="6"/>
  <text class="t-key" x="30" y="416">束ねる</text>
  <text class="t-lab" x="104" y="416">複数本をまとめて配置する鉄筋</text>
  <text class="t-key" x="30" y="442">確認</text>
  <text class="t-lab" x="104" y="442">スペーサで鉄筋のかぶりを確保する</text>
  <text class="t-key" x="30" y="468">精度</text>
  <text class="t-lab" x="104" y="468">かぶりと組み立て精度を確認する</text>

</svg>
