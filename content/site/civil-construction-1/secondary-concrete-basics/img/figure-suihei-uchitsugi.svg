<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="水平打継目の施工断面。旧コンクリートの表面を粗にして吸水させ、本体と同等品質の敷モルタルを敷いてから新コンクリートを打ち継ぐ">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-sec   { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-lab   { font-size: 12px; fill: #222; }
      .t-key   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-warn  { font-size: 12px; font-weight: bold; fill: #b22234; }
      .t-pos   { font-size: 12px; font-weight: bold; fill: #3a7d44; }
      .t-note  { font-size: 11px; fill: #555; }
      .con  { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 2; }     /* brand-fill / brand：コンクリート */
      .old  { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 2; }     /* surface：旧コンクリート・型枠 */
      .good { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 2; }     /* positive-fill / positive */
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }   /* warn-fill / warn */
      .bad  { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }   /* danger-fill / danger */
      .bar  { fill: #1a3a5c; stroke: none; }                          /* 鉄筋断面 */
      .rod  { fill: none; stroke: #1a3a5c; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .dim  { fill: none; stroke: #555; stroke-width: 1.5; }
      .ext  { fill: none; stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3 3; }
      .crack{ fill: none; stroke: #b22234; stroke-width: 2; stroke-dasharray: 6 4; }
      .rule { stroke: #d7d7d7; stroke-width: 1; }
      .box  { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
    <marker id="sh-a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 9,4 0,8" fill="#555"/>
    </marker>
    <marker id="sh-r" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 9,4 0,8" fill="#b22234"/>
    </marker>
    <marker id="sh-s" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse">
      <polygon points="0,0 9,4 0,8" fill="#555"/>
    </marker>
  </defs>
  <text class="t-title" x="200" y="28" text-anchor="middle">水平打継目の施工</text>
  <text class="t-lead" x="200" y="50" text-anchor="middle">粗にして吸水させ、敷モルタルの上へ打ち継ぐ</text>
  <rect class="old" x="86" y="130" width="12" height="230"/>
  <rect class="old" x="302" y="130" width="12" height="230"/>
  <rect class="con" x="98" y="130" width="204" height="108"/>
  <rect class="good" x="98" y="238" width="204" height="10"/>
  <polygon class="old" points="98,360 98,252 98,248 108,254 118,248 128,254 138,248 148,254 158,248 168,254 178,248 188,254 198,248 208,254 218,248 228,254 238,248 248,254 258,248 268,254 278,248 288,254 298,248 302,252 302,360"/>
  <text class="t-lab" x="200" y="190" text-anchor="middle">新コンクリート</text>
  <text class="t-lab" x="200" y="316" text-anchor="middle">旧コンクリート</text>
  <text class="t-note" x="16" y="262">打継面</text>
  <text class="t-note" x="16" y="277">粗にする</text>
  <line class="rule" x1="62" y1="262" x2="94" y2="262"/>
  <text class="t-pos" x="324" y="236">敷モルタル</text>
  <line class="dim" x1="284" y1="243" x2="320" y2="234"/>
  <text class="t-note" x="324" y="188">型枠は</text>
  <text class="t-note" x="324" y="203">締め直す</text>
  <rect class="box" x="16" y="392" width="368" height="92" rx="6"/>
  <text class="t-key" x="30" y="416">処理</text>
  <text class="t-lab" x="104" y="416">グリーンカットで粗にして十分吸水</text>
  <text class="t-key" x="30" y="442">湿潤</text>
  <text class="t-lab" x="104" y="442">旧コンクリートを十分湿潤にして打継ぐ</text>
  <text class="t-key" x="30" y="468">敷き</text>
  <text class="t-lab" x="104" y="468">本体と同等品質。水セメント比は同以下</text>

</svg>
