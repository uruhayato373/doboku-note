<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="アルカリ骨材反応の進み方。骨材中のシリカ分がセメントなどのアルカリ性の水分と反応して骨材表面に膨張性の物質ができ、吸水して膨張し、コンクリートにひび割れが生じる。対策はアルカリ総量 3.0 kg/m³ 以下、抑制効果のあるセメント、無害と確認された骨材のうちどれか 1 つ。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-lab   { font-size: 12px; fill: #222; }
      .t-key   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-warn  { font-size: 12px; font-weight: bold; fill: #b22234; }
      .t-ok    { font-size: 12px; font-weight: bold; fill: #3a7d44; }
      .t-note  { font-size: 11px; fill: #555; }
      .card  { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1.5; }
      .box   { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .conc  { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 2; }       /* brand：コンクリート */
      .gray  { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; }     /* 既設・支持部材 */
      .warn  { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }     /* warn：注意の層・反応生成物 */
      .good  { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 2; }       /* positive */
      .bad   { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }     /* danger */
      .crack { fill: none; stroke: #b22234; stroke-width: 2.5; stroke-linejoin: round; }
      .dash  { fill: none; stroke: #8a8a8a; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .lead  { fill: none; stroke: #8a8a8a; stroke-width: 1; }
      .arb   { fill: none; stroke: #2e6da4; stroke-width: 2; }
      .arr   { fill: none; stroke: #b22234; stroke-width: 2; }
      .arg   { fill: none; stroke: #3a7d44; stroke-width: 2.5; }
      .bar   { fill: #8a8a8a; stroke: #555; stroke-width: 1; }
    </style>
    <marker id="mb" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker>
    <marker id="mr" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#b22234"/></marker>
    <marker id="mg" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#3a7d44"/></marker>
  </defs>

  <text class="t-title" x="200" y="28" text-anchor="middle">アルカリ骨材反応</text>
  <text class="t-lead" x="200" y="50" text-anchor="middle">シリカ分とアルカリ分が反応し、膨らんで割れる</text>

  <rect class="card" x="16" y="64" width="176" height="140" rx="6"/>
  <text class="t-key" x="28" y="86">1 骨材とアルカリ分</text>
  <rect class="conc" x="24" y="96" width="160" height="72"/>
  <circle class="gray" cx="104" cy="132" r="22"/>
  <text class="t-note" x="104" y="136" text-anchor="middle">骨材</text>
  <text class="t-note" x="104" y="188" text-anchor="middle">骨材＋アルカリ性の水分</text>

  <rect class="card" x="208" y="64" width="176" height="140" rx="6"/>
  <text class="t-key" x="220" y="86">2 表面に物質ができる</text>
  <rect class="conc" x="216" y="96" width="160" height="72"/>
  <circle class="warn" cx="296" cy="132" r="27"/>
  <circle class="gray" cx="296" cy="132" r="22"/>
  <text class="t-note" x="296" y="136" text-anchor="middle">骨材</text>
  <text class="t-note" x="296" y="188" text-anchor="middle">膨張性の物質が生成</text>

  <rect class="card" x="16" y="214" width="176" height="140" rx="6"/>
  <text class="t-key" x="28" y="236">3 水を吸って膨らむ</text>
  <rect class="conc" x="24" y="246" width="160" height="72"/>
  <circle class="warn" cx="104" cy="282" r="33"/>
  <circle class="gray" cx="104" cy="282" r="22"/>
  <text class="t-note" x="104" y="286" text-anchor="middle">骨材</text>
  <line class="arb" x1="64" y1="282" x2="48" y2="282" marker-end="url(#mb)"/>
  <line class="arb" x1="144" y1="282" x2="160" y2="282" marker-end="url(#mb)"/>
  <text class="t-note" x="104" y="338" text-anchor="middle">吸水して膨張する</text>

  <rect class="card" x="208" y="214" width="176" height="140" rx="6"/>
  <text class="t-key" x="220" y="236">4 ひび割れが生じる</text>
  <rect class="conc" x="216" y="246" width="160" height="72"/>
  <circle class="warn" cx="296" cy="282" r="34"/>
  <circle class="gray" cx="296" cy="282" r="22"/>
  <text class="t-note" x="296" y="286" text-anchor="middle">骨材</text>
  <path class="crack" d="M 262 274 L 240 264 L 230 246"/>
  <path class="crack" d="M 330 288 L 352 296 L 366 312"/>
  <text class="t-note" x="296" y="338" text-anchor="middle">コンクリートが割れる</text>

  <!-- 要点 -->
  <rect class="box" x="16" y="374" width="368" height="110" rx="6"/>
  <text class="t-warn" x="30" y="398">対策</text>
  <text class="t-lab" x="92" y="398">次のうち、どれか 1 つを講じる</text>
  <text class="t-key" x="30" y="422">①</text>
  <text class="t-lab" x="92" y="422">アルカリ総量を 3.0 kg/m³ 以下にする</text>
  <text class="t-key" x="30" y="446">②</text>
  <text class="t-lab" x="92" y="446">高炉・フライアッシュセメントの B・C 種を使う</text>
  <text class="t-key" x="30" y="470">③</text>
  <text class="t-lab" x="92" y="470">反応性試験で無害と確認された骨材を使う</text>

</svg>
