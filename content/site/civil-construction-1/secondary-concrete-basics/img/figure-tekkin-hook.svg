<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="鉄筋端部のフックの2形状。半円形フックと、スターラップや帯鉄筋に用いる鋭角フック。鋭角フックは折り曲げてから鉄筋直径の6倍以上で6cm以上まっすぐ延ばす">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-sec   { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-lab   { font-size: 12px; fill: #222; }
      .t-key   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-warn  { font-size: 12px; font-weight: bold; fill: #b22234; }
      .t-pos   { font-size: 12px; font-weight: bold; fill: #3a7d44; }
      .t-note  { font-size: 11px; fill: #555; }
      .con  { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 2; }     /* brand-fill / brand：コンクリート */
      .old  { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 2; }     /* surface：旧コンクリート・型枠 */
      .good { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 2; }     /* positive-fill / positive */
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }   /* warn-fill / warn */
      .bad  { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }   /* danger-fill / danger */
      .bar  { fill: #1a3a5c; stroke: none; }                          /* 鉄筋断面 */
      .rod  { fill: none; stroke: #1a3a5c; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .dim  { fill: none; stroke: #555; stroke-width: 1.5; }
      .ext  { fill: none; stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3 3; }
      .crack{ fill: none; stroke: #b22234; stroke-width: 2; stroke-dasharray: 6 4; }
      .rule { stroke: #d7d7d7; stroke-width: 1; }
      .box  { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
    <marker id="hk2-a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 9,4 0,8" fill="#555"/>
    </marker>
    <marker id="hk2-r" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 9,4 0,8" fill="#b22234"/>
    </marker>
    <marker id="hk2-s" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse">
      <polygon points="0,0 9,4 0,8" fill="#555"/>
    </marker>
  </defs>
  <text class="t-title" x="200" y="28" text-anchor="middle">鉄筋端部のフック</text>
  <text class="t-lead" x="200" y="50" text-anchor="middle">半円形と鋭角、曲げ内半径は鋼種で決まる</text>
  <text class="t-sec" x="16" y="82">(a) 半円形フック</text>
  <path class="rod" d="M 50 112 H 190 A 28 28 0 0 1 190 168 H 140"/>
  <circle cx="190" cy="140" r="3" fill="#b22234"/>
  <line class="dim" x1="190" y1="140" x2="213" y2="124" marker-end="url(#hk2-a)"/>
  <text class="t-warn" x="240" y="130">曲げ内半径 r</text>
  <text class="t-sec" x="16" y="212">(b) 鋭角フック（スターラップ・帯鉄筋）</text>
  <path class="rod" d="M 50 240 H 190 L 150 284"/>
  <text class="t-lab" x="204" y="268">折り曲げてから</text>
  <text class="t-key" x="204" y="286">6φ 以上、かつ 6cm 以上</text>
  <text class="t-lab" x="204" y="304">まっすぐ延ばす</text>
  <rect class="box" x="16" y="376" width="368" height="92" rx="6"/>
  <text class="t-key" x="30" y="400">r の値</text>
  <text class="t-lab" x="104" y="400">SD345：軸方向 2.5φ、スターラップ 2.0φ</text>
  <text class="t-key" x="30" y="426">例外</text>
  <text class="t-lab" x="104" y="426">φ ≤ 10mm のスターラップは 1.5φ</text>
  <text class="t-key" x="30" y="452">帯鉄筋</text>
  <text class="t-lab" x="104" y="452">原則、半円形か鋭角のフックを設ける</text>

</svg>
