<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="距離の求め方の分類。直接法は鋼巻尺、間接法は光波測距儀とTS。ずれの主因と向く場面を対比した図">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; fill: #222; }
      .t-node { font-size: 13px; font-weight: bold; fill: #222; }
      .t-head { font-size: 14px; font-weight: bold; fill: #1a3a5c; }
      .t-sub { font-size: 12px; fill: #555; }
      .t-lbl { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .t-val { font-size: 12px; fill: #222; }
      .t-sum { font-size: 12px; font-weight: bold; fill: #222; }
      .t-note { font-size: 11px; fill: #555; }
      .box-brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-positive { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-surface { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .link { fill: none; stroke: #555; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- ルート: surface -->
  <rect class="box-surface" x="120" y="14" width="160" height="36" rx="6"/>
  <text class="t-node" x="200" y="37" text-anchor="middle">距離を求める方法</text>

  <!-- 分岐線: ink-body -->
  <path class="link" d="M200 50 V70"/>
  <path class="link" d="M105 70 H295"/>
  <path class="link" d="M105 70 V92"/>
  <path class="link" d="M295 70 V92"/>

  <!-- 左: 直接法 brand -->
  <rect class="box-brand" x="15" y="92" width="180" height="300" rx="8"/>
  <text class="t-head" x="105" y="118" text-anchor="middle">直接法</text>
  <text class="t-sub" x="105" y="136" text-anchor="middle">尺を当てて読む</text>
  <line x1="27" y1="148" x2="183" y2="148" stroke="#2e6da4" stroke-width="1"/>

  <text class="t-lbl" x="27" y="168">使う器械</text>
  <text class="t-val" x="27" y="185">鋼巻尺</text>

  <text class="t-lbl" x="27" y="228">距離の出どころ</text>
  <text class="t-val" x="27" y="245">目盛を直接読む</text>

  <text class="t-lbl" x="27" y="288">ずれの主因</text>
  <text class="t-val" x="27" y="305">尺定数・温度・張力</text>
  <text class="t-val" x="27" y="321">傾斜・たるみ</text>

  <text class="t-lbl" x="27" y="348">向く場面</text>
  <text class="t-val" x="27" y="365">短い測線</text>
  <text class="t-val" x="27" y="381">偏心距離の測定</text>

  <!-- 右: 間接法 positive -->
  <rect class="box-positive" x="205" y="92" width="180" height="300" rx="8"/>
  <text class="t-head" x="295" y="118" text-anchor="middle">間接法</text>
  <text class="t-sub" x="295" y="136" text-anchor="middle">別の量から計算する</text>
  <line x1="217" y1="148" x2="373" y2="148" stroke="#3a7d44" stroke-width="1"/>

  <text class="t-lbl" x="217" y="168">使う器械</text>
  <text class="t-val" x="217" y="185">光波測距儀・TS</text>

  <text class="t-lbl" x="217" y="228">距離の出どころ</text>
  <text class="t-val" x="217" y="245">光の往復から計算</text>

  <text class="t-lbl" x="217" y="288">ずれの主因</text>
  <text class="t-val" x="217" y="305">気象（気温・気圧）</text>
  <text class="t-val" x="217" y="321">器械定数・反射鏡定数</text>

  <text class="t-lbl" x="217" y="348">向く場面</text>
  <text class="t-val" x="217" y="365">長い測線</text>
  <text class="t-val" x="217" y="381">見通しのよい点間</text>

  <!-- まとめ: surface -->
  <rect class="box-surface" x="15" y="408" width="370" height="78" rx="6"/>
  <text class="t-sum" x="200" y="432" text-anchor="middle">どちらも測った値に補正をかけ</text>
  <text class="t-sum" x="200" y="452" text-anchor="middle">基準面上の水平距離にしてから使う</text>
  <text class="t-note" x="200" y="472" text-anchor="middle">補正の中身は方法ごとに違う</text>
</svg>
