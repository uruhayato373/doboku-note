<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="TSの観測前から平均採用までの確認の順序。方式、気象、定数、受光量、測定、平均の6段階で、気象は距離に比例し定数は一定量ずれる">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; fill: #222; }
      .t-step { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-sub { font-size: 12px; fill: #555; }
      .t-num { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-tag { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .t-sum { font-size: 12px; font-weight: bold; fill: #222; }
      .t-note { font-size: 11px; fill: #555; }
      .box-brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-surface { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .num { fill: #ffffff; stroke: #2e6da4; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #555; stroke-width: 1.5; }
    </style>
    <marker id="arw" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#555"/>
    </marker>
  </defs>

  <!-- 1 方式を選ぶ -->
  <rect class="box-brand" x="20" y="12" width="246" height="56" rx="6"/>
  <circle class="num" cx="42" cy="40" r="11"/>
  <text class="t-num" x="42" y="44" text-anchor="middle">1</text>
  <text class="t-step" x="62" y="30">方式を選ぶ</text>
  <text class="t-sub" x="62" y="47">プリズム／ノンプリズム</text>
  <text class="t-sub" x="62" y="62">自動追尾の有無</text>
  <line class="arrow" x1="143" y1="69" x2="143" y2="83" marker-end="url(#arw)"/>

  <!-- 2 気象を入れる -->
  <rect class="box-brand" x="20" y="84" width="246" height="56" rx="6"/>
  <circle class="num" cx="42" cy="112" r="11"/>
  <text class="t-num" x="42" y="116" text-anchor="middle">2</text>
  <text class="t-step" x="62" y="102">気象を入れる</text>
  <text class="t-sub" x="62" y="119">気温・気圧を測って入力</text>
  <text class="t-sub" x="62" y="134">標高差400m以上は両端</text>
  <rect class="box-warn" x="284" y="84" width="82" height="56" rx="6"/>
  <text class="t-tag" x="325" y="108" text-anchor="middle">距離に比例</text>
  <text class="t-tag" x="325" y="124" text-anchor="middle">して効く</text>
  <line class="arrow" x1="143" y1="141" x2="143" y2="155" marker-end="url(#arw)"/>

  <!-- 3 定数を確かめる -->
  <rect class="box-brand" x="20" y="156" width="246" height="56" rx="6"/>
  <circle class="num" cx="42" cy="184" r="11"/>
  <text class="t-num" x="42" y="188" text-anchor="middle">3</text>
  <text class="t-step" x="62" y="174">定数を確かめる</text>
  <text class="t-sub" x="62" y="191">器械定数・反射鏡定数</text>
  <text class="t-sub" x="62" y="206">二重に入れていないか</text>
  <rect class="box-warn" x="284" y="156" width="82" height="56" rx="6"/>
  <text class="t-tag" x="325" y="180" text-anchor="middle">距離によらず</text>
  <text class="t-tag" x="325" y="196" text-anchor="middle">一定量ずれる</text>
  <line class="arrow" x1="143" y1="213" x2="143" y2="227" marker-end="url(#arw)"/>

  <!-- 4 受光量を見る -->
  <rect class="box-brand" x="20" y="228" width="246" height="56" rx="6"/>
  <circle class="num" cx="42" cy="256" r="11"/>
  <text class="t-num" x="42" y="260" text-anchor="middle">4</text>
  <text class="t-step" x="62" y="246">受光量を見る</text>
  <text class="t-sub" x="62" y="263">反射光が十分に返るか</text>
  <text class="t-sub" x="62" y="278">弱ければ視準し直す</text>
  <line class="arrow" x1="143" y1="285" x2="143" y2="299" marker-end="url(#arw)"/>

  <!-- 5 測る -->
  <rect class="box-brand" x="20" y="300" width="246" height="56" rx="6"/>
  <circle class="num" cx="42" cy="328" r="11"/>
  <text class="t-num" x="42" y="332" text-anchor="middle">5</text>
  <text class="t-step" x="62" y="318">測る</text>
  <text class="t-sub" x="62" y="335">1視準2読定を1セット</text>
  <text class="t-sub" x="62" y="350">基準点測量ではセット数2</text>
  <line class="arrow" x1="143" y1="357" x2="143" y2="371" marker-end="url(#arw)"/>

  <!-- 6 平均を採る -->
  <rect class="box-brand" x="20" y="372" width="246" height="56" rx="6"/>
  <circle class="num" cx="42" cy="400" r="11"/>
  <text class="t-num" x="42" y="404" text-anchor="middle">6</text>
  <text class="t-step" x="62" y="390">平均を採る</text>
  <text class="t-sub" x="62" y="407">得た値をすべて採用</text>
  <text class="t-sub" x="62" y="422">平均値を記録する</text>

  <!-- まとめ: surface -->
  <rect class="box-surface" x="20" y="444" width="346" height="44" rx="6"/>
  <text class="t-sum" x="193" y="463" text-anchor="middle">設定の誤りは平均しても消えない</text>
  <text class="t-note" x="193" y="479" text-anchor="middle">測る前に 1 から 4 までを確かめる</text>
</svg>
