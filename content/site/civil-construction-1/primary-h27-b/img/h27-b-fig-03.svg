<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 290" style="max-width:500px;width:100%" role="img" aria-label="ネットワーク式工程表。イベント⓪〜⑦、作業A〜K。③→⑤が作業E（9日）、②→③はダミー。各矢線に作業日数を付す。">
  <defs>
    <marker id="ar" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
  </defs>
  <style>
    .ti{font-family:Inter,'Noto Sans JP','Hiragino Sans',sans-serif;font-size:14px;fill:#555}
    .nn{font-family:Inter,'Noto Sans JP','Hiragino Sans',sans-serif;font-size:13px;fill:#1a3a5c;font-weight:600}
    .ac{font-family:Inter,'Noto Sans JP','Hiragino Sans',sans-serif;font-size:13px;fill:#222;font-weight:600}
    .du{font-family:Inter,'Noto Sans JP','Hiragino Sans',sans-serif;font-size:11px;fill:#555}
  </style>

  <text x="250" y="20" text-anchor="middle" class="ti">ネットワーク式工程表</text>

  <!-- ===== arrows ===== -->
  <line x1="52" y1="150" x2="108" y2="80" stroke="#222" stroke-width="2" marker-end="url(#ar)"/>
  <text x="68" y="108" text-anchor="middle" class="du">7</text>

  <line x1="135" y1="72" x2="322" y2="112" stroke="#222" stroke-width="2" marker-end="url(#ar)"/>
  <text x="225" y="86" text-anchor="middle" class="du">6</text>

  <line x1="54" y1="156" x2="192" y2="108" stroke="#222" stroke-width="2" marker-end="url(#ar)"/>
  <text x="120" y="125" text-anchor="middle" class="du">5</text>

  <line x1="220" y1="110" x2="322" y2="118" stroke="#222" stroke-width="2" marker-end="url(#ar)"/>
  <text x="270" y="104" text-anchor="middle" class="ac">E</text>
  <text x="270" y="118" text-anchor="middle" class="du">9</text>

  <line x1="128" y1="242" x2="200" y2="120" stroke="#222" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ar)"/>

  <line x1="135" y1="255" x2="198" y2="255" stroke="#222" stroke-width="2" marker-end="url(#ar)"/>
  <text x="166" y="248" text-anchor="middle" class="du">8</text>

  <line x1="230" y1="248" x2="428" y2="168" stroke="#222" stroke-width="2" marker-end="url(#ar)"/>
  <text x="330" y="222" text-anchor="middle" class="du">11</text>

  <line x1="52" y1="170" x2="108" y2="242" stroke="#222" stroke-width="2" marker-end="url(#ar)"/>
  <text x="68" y="212" text-anchor="middle" class="du">6</text>

  <line x1="133" y1="246" x2="205" y2="192" stroke="#222" stroke-width="2" marker-end="url(#ar)"/>
  <text x="180" y="232" text-anchor="middle" class="du">4</text>

  <line x1="228" y1="172" x2="322" y2="128" stroke="#222" stroke-width="2" marker-end="url(#ar)"/>
  <text x="262" y="142" text-anchor="middle" class="du">6</text>

  <line x1="348" y1="125" x2="432" y2="155" stroke="#222" stroke-width="2" marker-end="url(#ar)"/>
  <text x="392" y="128" text-anchor="middle" class="du">12</text>

  <!-- ===== nodes ===== -->
  <circle cx="40" cy="160" r="15" fill="#ffffff" stroke="#2e6da4" stroke-width="2"/><text x="40" y="165" text-anchor="middle" class="nn">0</text>
  <circle cx="120" cy="65" r="15" fill="#ffffff" stroke="#2e6da4" stroke-width="2"/><text x="120" y="70" text-anchor="middle" class="nn">1</text>
  <circle cx="120" cy="255" r="15" fill="#ffffff" stroke="#2e6da4" stroke-width="2"/><text x="120" y="260" text-anchor="middle" class="nn">2</text>
  <circle cx="205" cy="110" r="15" fill="#ffffff" stroke="#2e6da4" stroke-width="2"/><text x="205" y="115" text-anchor="middle" class="nn">3</text>
  <circle cx="215" cy="180" r="15" fill="#ffffff" stroke="#2e6da4" stroke-width="2"/><text x="215" y="185" text-anchor="middle" class="nn">4</text>
  <circle cx="335" cy="120" r="15" fill="#ffffff" stroke="#2e6da4" stroke-width="2"/><text x="335" y="125" text-anchor="middle" class="nn">5</text>
  <circle cx="215" cy="255" r="15" fill="#ffffff" stroke="#2e6da4" stroke-width="2"/><text x="215" y="260" text-anchor="middle" class="nn">6</text>
  <circle cx="445" cy="160" r="15" fill="#ffffff" stroke="#2e6da4" stroke-width="2"/><text x="445" y="165" text-anchor="middle" class="nn">7</text>
</svg>
