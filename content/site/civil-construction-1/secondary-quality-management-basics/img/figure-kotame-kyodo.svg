<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="乾燥密度は最適含水比で最大になるが、締固め直後の強度は最適含水比よりやや乾燥側で最大になる。乾燥側で締め固めた土は水に浸かると強度が落ち、上載荷重で沈下することもある">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-sec   { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-lab   { font-size: 12px; fill: #222; }
      .t-key   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-warn  { font-size: 12px; font-weight: bold; fill: #b22234; }
      .t-pos   { font-size: 12px; font-weight: bold; fill: #3a7d44; }
      .t-note  { font-size: 11px; fill: #555; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 2; }   /* brand-fill / brand */
      .pos   { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 2; }   /* positive-fill / positive */
      .wrn   { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; } /* warn-fill / warn */
      .dng   { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; } /* danger-fill / danger */
      .gry   { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; } /* surface */
      .card  { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1.5; }
      .box   { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .axis  { stroke: #555; stroke-width: 1.5; fill: none; }
      .thin  { stroke: #8a8a8a; stroke-width: 1; fill: none; }
      .dash  { stroke: #8a8a8a; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; }
      .c-brand { stroke: #2e6da4; stroke-width: 3; fill: none; }
      .c-pos   { stroke: #3a7d44; stroke-width: 3; fill: none; }
      .c-wrn   { stroke: #d4a017; stroke-width: 3; fill: none; }
      .c-dng   { stroke: #b22234; stroke-width: 3; fill: none; }
      .c-dngd  { stroke: #b22234; stroke-width: 2.5; stroke-dasharray: 6 4; fill: none; }
      .ar-b { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .ar-g { stroke: #3a7d44; stroke-width: 2; fill: none; }
      .ar-r { stroke: #b22234; stroke-width: 2; fill: none; }
      .ar-k { stroke: #555; stroke-width: 1.5; fill: none; }
      .dot-b { fill: #2e6da4; }
      .dot-g { fill: #3a7d44; }
      .dot-r { fill: #b22234; }
    </style>
    <marker id="ks-b" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
    <marker id="ks-g" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#3a7d44"/></marker>
    <marker id="ks-r" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#b22234"/></marker>
    <marker id="ks-k" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
    <marker id="ks-ks" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  </defs>
  <text class="t-title" x="200" y="28" text-anchor="middle">締固めと強度の関係</text>
  <text class="t-lead" x="200" y="50" text-anchor="middle">密度が最大の点と、強度が最大の点はずれる</text>
  <text class="t-note" x="58" y="76">乾燥密度 ρd</text>
  <line class="axis" x1="50" y1="160" x2="372" y2="160"/>
  <line class="axis" x1="50" y1="160" x2="50" y2="82"/>
  <path class="c-brand" d="M 70 150 C 110 148 160 80 205 80 C 250 80 295 128 345 146"/>
  <text class="t-note" x="58" y="196">強度</text>
  <line class="axis" x1="50" y1="340" x2="372" y2="340" marker-end="url(#ks-k)"/>
  <line class="axis" x1="50" y1="340" x2="50" y2="204"/>
  <text class="t-note" x="372" y="358" text-anchor="end">含水比 w</text>
  <line class="dash" x1="205" y1="80" x2="205" y2="340"/>
  <text class="t-key" x="205" y="358" text-anchor="middle">最適含水比</text>
  <path class="c-pos" d="M 70 262 C 100 250 125 224 160 224 C 190 224 196 250 215 290 C 228 322 270 322 345 332"/>
  <circle class="dot-g" cx="160" cy="224" r="5"/>
  <text class="t-pos" x="160" y="212" text-anchor="middle">直後の強度が最大</text>
  <path class="c-dngd" d="M 70 322 C 110 316 160 300 205 290"/>
  <line class="ar-r" x1="100" y1="248" x2="100" y2="306" marker-end="url(#ks-r)"/>
  <text class="t-warn" x="108" y="274">浸水で</text>
  <text class="t-warn" x="108" y="290">低下</text>
  <text class="t-note" x="290" y="300">実線：締固め直後</text>
  <text class="t-note" x="290" y="316">破線：浸水後</text>
  <rect class="box" x="16" y="392" width="368" height="68" rx="6"/>
  <text class="t-key" x="30" y="416">直後</text>
  <text class="t-lab" x="110" y="416">最適含水比よりやや低い側で強度が最大</text>
  <text class="t-key" x="30" y="442">乾燥側</text>
  <text class="t-lab" x="110" y="442">締固めが不十分だと浸水で強度が落ち沈下</text>

</svg>
