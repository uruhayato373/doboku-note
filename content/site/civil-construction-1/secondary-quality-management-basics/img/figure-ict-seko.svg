<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="盛土工の情報化施工。TSやGNSSで位置を測り、ブルドーザの敷均しはマシンガイダンス、締固めはローラの走行軌跡を面的に管理、出来形はTSやGNSSで測った3次元座標から幅員・のり長・高さを求める">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-sec   { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-lab   { font-size: 12px; fill: #222; }
      .t-key   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-warn  { font-size: 12px; font-weight: bold; fill: #b22234; }
      .t-pos   { font-size: 12px; font-weight: bold; fill: #3a7d44; }
      .t-note  { font-size: 11px; fill: #555; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 2; }   /* brand-fill / brand */
      .pos   { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 2; }   /* positive-fill / positive */
      .wrn   { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; } /* warn-fill / warn */
      .dng   { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; } /* danger-fill / danger */
      .gry   { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; } /* surface */
      .card  { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1.5; }
      .box   { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .axis  { stroke: #555; stroke-width: 1.5; fill: none; }
      .thin  { stroke: #8a8a8a; stroke-width: 1; fill: none; }
      .dash  { stroke: #8a8a8a; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; }
      .c-brand { stroke: #2e6da4; stroke-width: 3; fill: none; }
      .c-pos   { stroke: #3a7d44; stroke-width: 3; fill: none; }
      .c-wrn   { stroke: #d4a017; stroke-width: 3; fill: none; }
      .c-dng   { stroke: #b22234; stroke-width: 3; fill: none; }
      .c-dngd  { stroke: #b22234; stroke-width: 2.5; stroke-dasharray: 6 4; fill: none; }
      .ar-b { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .ar-g { stroke: #3a7d44; stroke-width: 2; fill: none; }
      .ar-r { stroke: #b22234; stroke-width: 2; fill: none; }
      .ar-k { stroke: #555; stroke-width: 1.5; fill: none; }
      .dot-b { fill: #2e6da4; }
      .dot-g { fill: #3a7d44; }
      .dot-r { fill: #b22234; }
    </style>
    <marker id="ict-b" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
    <marker id="ict-g" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#3a7d44"/></marker>
    <marker id="ict-r" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#b22234"/></marker>
    <marker id="ict-k" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
    <marker id="ict-ks" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  </defs>
  <text class="t-title" x="200" y="28" text-anchor="middle">ICT を用いた盛土の情報化施工</text>
  <text class="t-lead" x="200" y="50" text-anchor="middle">測る技術を、敷均し・締固め・出来形の3場面に使う</text>
  <rect class="brand" x="16" y="62" width="368" height="30" rx="6"/>
  <text class="t-key" x="200" y="82" text-anchor="middle">TS・GNSS で位置を測り、品質や出来形を迅速に取得</text>
  <rect class="card" x="16" y="102" width="368" height="86" rx="6"/>
  <polygon class="gry" points="30,172 30,156 106,146 106,172"/>
  <line class="dash" x1="30" y1="138" x2="106" y2="128"/>
  <rect class="brand" x="52" y="130" width="34" height="14" rx="3"/>
  <line class="c-brand" x1="88" y1="144" x2="96" y2="136"/>
  <text class="t-key" x="120" y="128">① 敷均し  マシンガイダンス</text>
  <text class="t-note" x="120" y="150">3次元設計データを入れて</text>
  <text class="t-note" x="120" y="166">丁張りなしに精度よく敷き均す</text>
  <rect class="card" x="16" y="196" width="368" height="86" rx="6"/>
  <rect class="pos" x="32" y="218" width="18" height="14"/>
  <rect class="pos" x="51" y="218" width="18" height="14"/>
  <rect class="pos" x="70" y="218" width="18" height="14"/>
  <rect class="pos" x="89" y="218" width="18" height="14"/>
  <rect class="pos" x="32" y="234" width="18" height="14"/>
  <rect class="pos" x="51" y="234" width="18" height="14"/>
  <rect class="pos" x="70" y="234" width="18" height="14"/>
  <rect class="gry" x="89" y="234" width="18" height="14"/>
  <rect class="gry" x="32" y="250" width="18" height="14"/>
  <rect class="gry" x="51" y="250" width="18" height="14"/>
  <rect class="gry" x="70" y="250" width="18" height="14"/>
  <rect class="gry" x="89" y="250" width="18" height="14"/>
  <text class="t-key" x="120" y="222">② 締固め  ローラ軌跡管理</text>
  <text class="t-note" x="120" y="244">走行軌跡を自動で追い</text>
  <text class="t-note" x="120" y="260">所定回数の転圧を面的に確認</text>
  <rect class="card" x="16" y="290" width="368" height="86" rx="6"/>
  <polygon class="brand" points="38,360 52,328 94,328 108,360"/>
  <line class="ar-k" x1="52" y1="318" x2="94" y2="318" marker-end="url(#ict-k)" marker-start="url(#ict-ks)"/>
  <line class="ar-k" x1="30" y1="328" x2="30" y2="360" marker-end="url(#ict-k)" marker-start="url(#ict-ks)"/>
  <circle class="dot-r" cx="52" cy="328" r="3"/><circle class="dot-r" cx="94" cy="328" r="3"/><circle class="dot-r" cx="38" cy="360" r="3"/>
  <text class="t-key" x="120" y="316">③ 出来形  TS・GNSS 計測</text>
  <text class="t-note" x="120" y="338">計測点の3次元座標から</text>
  <text class="t-note" x="120" y="354">幅員・のり長・高さを算出</text>

  <rect class="box" x="16" y="386" width="368" height="68" rx="6"/>
  <text class="t-key" x="30" y="410">留意点</text>
  <text class="t-lab" x="90" y="410">自動追尾 TS は視通が遮られると位置不明</text>
  <text class="t-key" x="30" y="436">対策</text>
  <text class="t-lab" x="90" y="436">TS を施工範囲全体が見渡せる高所に置く</text>

</svg>
