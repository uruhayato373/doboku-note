<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="締固め曲線の模式図。含水比に対して乾燥密度は山形になり、頂点が最大乾燥密度で、そのときの含水比が最適含水比。締固め度は現場の乾燥密度を室内試験の最大乾燥密度で割った百分率で、盛土の用途に応じて最適含水比かそのやや乾燥側で施工する">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-sec   { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-lab   { font-size: 12px; fill: #222; }
      .t-key   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-warn  { font-size: 12px; font-weight: bold; fill: #b22234; }
      .t-pos   { font-size: 12px; font-weight: bold; fill: #3a7d44; }
      .t-note  { font-size: 11px; fill: #555; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 2; }   /* brand-fill / brand */
      .pos   { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 2; }   /* positive-fill / positive */
      .wrn   { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; } /* warn-fill / warn */
      .dng   { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; } /* danger-fill / danger */
      .gry   { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; } /* surface */
      .card  { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1.5; }
      .box   { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .axis  { stroke: #555; stroke-width: 1.5; fill: none; }
      .thin  { stroke: #8a8a8a; stroke-width: 1; fill: none; }
      .dash  { stroke: #8a8a8a; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; }
      .c-brand { stroke: #2e6da4; stroke-width: 3; fill: none; }
      .c-pos   { stroke: #3a7d44; stroke-width: 3; fill: none; }
      .c-wrn   { stroke: #d4a017; stroke-width: 3; fill: none; }
      .c-dng   { stroke: #b22234; stroke-width: 3; fill: none; }
      .c-dngd  { stroke: #b22234; stroke-width: 2.5; stroke-dasharray: 6 4; fill: none; }
      .ar-b { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .ar-g { stroke: #3a7d44; stroke-width: 2; fill: none; }
      .ar-r { stroke: #b22234; stroke-width: 2; fill: none; }
      .ar-k { stroke: #555; stroke-width: 1.5; fill: none; }
      .dot-b { fill: #2e6da4; }
      .dot-g { fill: #3a7d44; }
      .dot-r { fill: #b22234; }
    </style>
    <marker id="kd-b" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
    <marker id="kd-g" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#3a7d44"/></marker>
    <marker id="kd-r" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#b22234"/></marker>
    <marker id="kd-k" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
    <marker id="kd-ks" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  </defs>
  <text class="t-title" x="200" y="28" text-anchor="middle">乾燥密度で規定する方法</text>
  <text class="t-lead" x="200" y="50" text-anchor="middle">締固め曲線の頂点を基準に、施工含水比を決める</text>
  <line class="axis" x1="50" y1="340" x2="372" y2="340" marker-end="url(#kd-k)"/>
  <line class="axis" x1="50" y1="340" x2="50" y2="72"/>
  <text class="t-note" x="58" y="76">乾燥密度 ρd</text>
  <text class="t-note" x="372" y="358" text-anchor="end">含水比 w</text>
  <path class="c-brand" d="M 60 312 C 110 300 140 108 210 108 C 280 108 310 240 346 292"/>
  <line class="dash" x1="50" y1="108" x2="210" y2="108"/>
  <line class="dash" x1="210" y1="108" x2="210" y2="340"/>
  <text class="t-note" x="58" y="102">最大乾燥密度</text>
  <text class="t-key" x="210" y="358" text-anchor="middle">最適含水比</text>
  <circle class="dot-g" cx="210" cy="108" r="5"/>
  <circle class="dot-r" cx="172" cy="128" r="5"/>
  <text class="t-warn" x="58" y="146">やや乾燥側</text>
  <line class="thin" x1="122" y1="141" x2="166" y2="130"/>
  <rect class="box" x="16" y="392" width="368" height="94" rx="6"/>
  <text class="t-key" x="30" y="416">締固め度</text>
  <text class="t-lab" x="110" y="416">現場の乾燥密度 ÷ 最大乾燥密度 × 100</text>
  <text class="t-key" x="30" y="442">乾燥側</text>
  <text class="t-lab" x="110" y="442">浸水のおそれが少なく高い強度を要する盛土</text>
  <text class="t-key" x="30" y="468">最適含水比</text>
  <text class="t-lab" x="110" y="468">水の浸入を受けても安定を期待する道路盛土</text>

</svg>
