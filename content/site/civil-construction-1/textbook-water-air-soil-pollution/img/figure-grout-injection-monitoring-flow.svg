<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="薬液注入の管理の流れ。着手前に調査と採水を1回行い、注入中は圧力と注入量を監視し、工事中と終了後は採水を続け、基準外またはそのおそれがあれば工事を中止する">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-title { font-size: 14px; font-weight: bold; fill: #1a3a5c; }
      .t-text { font-size: 12px; fill: #222; }
      .t-sub { font-size: 12px; fill: #555; }
      .box-brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-positive { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-danger { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .link { stroke: #555; stroke-width: 1.5; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#555"/>
    </marker>
  </defs>

  <!-- 1 着手前 -->
  <rect class="box-brand" x="40" y="20" width="320" height="84" rx="8"/>
  <text class="t-title" text-anchor="middle" x="200" y="45">着手前：調査と初期値</text>
  <text class="t-text" text-anchor="middle" x="200" y="67">土質・地下埋設物・井戸と水域を調査</text>
  <text class="t-sub" text-anchor="middle" x="200" y="88">採水1回で、pH 基準の起点を決める</text>
  <line class="link" x1="200" y1="104" x2="200" y2="124" marker-end="url(#arrow)"/>

  <!-- 2 注入中 -->
  <rect class="box-positive" x="40" y="126" width="320" height="84" rx="8"/>
  <text class="t-title" text-anchor="middle" x="200" y="151">注入中：圧力と注入量</text>
  <text class="t-text" text-anchor="middle" x="200" y="173">常時監視し、チャート紙に記録する</text>
  <text class="t-sub" text-anchor="middle" x="200" y="194">異常な変化は、直ちに注入を中止</text>
  <line class="link" x1="200" y1="210" x2="200" y2="230" marker-end="url(#arrow)"/>

  <!-- 3 工事中 -->
  <rect class="box-warn" x="40" y="232" width="320" height="84" rx="8"/>
  <text class="t-title" text-anchor="middle" x="200" y="257">工事中：観測井で採水</text>
  <text class="t-text" text-anchor="middle" x="200" y="279">注入箇所からおおむね10m以内に数箇所</text>
  <text class="t-sub" text-anchor="middle" x="200" y="300">毎日1回以上・基準値と照合</text>
  <line class="link" x1="200" y1="316" x2="200" y2="336" marker-end="url(#arrow)"/>

  <!-- 4 終了後 -->
  <rect class="box-brand" x="40" y="338" width="320" height="84" rx="8"/>
  <text class="t-title" text-anchor="middle" x="200" y="363">終了後：監視を続ける</text>
  <text class="t-text" text-anchor="middle" x="200" y="385">2週間は毎日1回以上</text>
  <text class="t-sub" text-anchor="middle" x="200" y="406">その後、半年までは月2回以上</text>
  <line class="link" x1="200" y1="422" x2="200" y2="440" marker-end="url(#arrow)"/>

  <!-- 異常時 -->
  <rect class="box-danger" x="40" y="442" width="320" height="48" rx="8"/>
  <text class="t-title" text-anchor="middle" x="200" y="463">工事中・終了後に基準外、またはそのおそれ</text>
  <text class="t-text" text-anchor="middle" x="200" y="481">直ちに工事を中止し、措置をとる</text>
</svg>
