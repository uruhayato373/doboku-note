<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="パイプサポートの部品構成と組立ての要点。外管に内管を差し込み、差しピンと調整ナットで高さを合わせ、上下に受け板と底板を持つ。組立てでは大引の中央に支柱を立て、脚部は敷角で沈下を防ぎ根がらみでつなぐ">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-sec  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }  /* brand text */
      .t-lab  { font-size: 11px; fill: #222; }                        /* ink-strong */
      .t-sub  { font-size: 11px; fill: #555; }                        /* ink-body */
      .pipe-in  { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; } /* brand */
      .pipe-out { fill: #f5f5f5; stroke: #555; stroke-width: 1.5; }    /* surface / ink-body */
      .nut      { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; } /* warn */
      .plate    { fill: #d7d7d7; stroke: #555; stroke-width: 1.5; }
      .hole     { fill: #ffffff; stroke: #2e6da4; stroke-width: 1; }
      .pin      { stroke: #222; stroke-width: 3; stroke-linecap: round; }
      .hidden   { stroke: #2e6da4; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .lead     { stroke: #8a8a8a; stroke-width: 1; fill: none; }
      .dot      { fill: #222; }
      .dim      { stroke: #2e6da4; stroke-width: 1.5; fill: none; }
      .rule     { stroke: #d7d7d7; stroke-width: 1; }
      .timber   { fill: #f5f5f5; stroke: #555; stroke-width: 1.5; }
      .tie      { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; } /* positive */
      .base     { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; }
      .load     { stroke: #b22234; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; } /* danger */
    </style>
    <marker id="pp-a" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/>
    </marker>
    <marker id="pp-r" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#b22234"/>
    </marker>
  </defs>

  <!-- 部品の構成 -->
  <text class="t-sec" x="16" y="22">部品の構成</text>

  <rect class="plate" x="102" y="40" width="56" height="7"/>
  <rect class="pipe-in" x="121" y="47" width="18" height="150"/>
  <circle class="hole" cx="130" cy="105" r="2.5"/>
  <circle class="hole" cx="130" cy="123" r="2.5"/>
  <circle class="hole" cx="130" cy="141" r="2.5"/>
  <circle class="hole" cx="130" cy="159" r="2.5"/>
  <circle class="hole" cx="130" cy="177" r="2.5"/>
  <rect class="pipe-out" x="117" y="194" width="26" height="100"/>
  <line class="hidden" x1="121" y1="194" x2="121" y2="256"/>
  <line class="hidden" x1="139" y1="194" x2="139" y2="256"/>
  <rect class="nut" x="111" y="180" width="38" height="14" rx="2"/>
  <line class="pin" x1="108" y1="177" x2="152" y2="177"/>
  <rect class="plate" x="102" y="294" width="56" height="7"/>

  <line class="dim" x1="66" y1="174" x2="66" y2="48" marker-end="url(#pp-a)"/>
  <line class="dim" x1="66" y1="174" x2="66" y2="300" marker-end="url(#pp-a)"/>
  <text class="t-sub" x="14" y="178">使う長さ</text>

  <line class="lead" x1="158" y1="43" x2="190" y2="43"/>
  <circle class="dot" cx="158" cy="43" r="2"/>
  <text class="t-lab" x="196" y="47">受け板</text>

  <line class="lead" x1="139" y1="110" x2="190" y2="110"/>
  <circle class="dot" cx="139" cy="110" r="2"/>
  <text class="t-lab" x="196" y="114">内管（上の管）</text>

  <line class="lead" x1="152" y1="173" x2="190" y2="173"/>
  <circle class="dot" cx="152" cy="173" r="2"/>
  <text class="t-lab" x="196" y="177">差しピン</text>

  <line class="lead" x1="149" y1="189" x2="190" y2="189"/>
  <circle class="dot" cx="149" cy="189" r="2"/>
  <text class="t-lab" x="196" y="193">調整ナット（ねじ）</text>

  <line class="lead" x1="143" y1="250" x2="190" y2="250"/>
  <circle class="dot" cx="143" cy="250" r="2"/>
  <text class="t-lab" x="196" y="254">外管（下の管）</text>

  <line class="lead" x1="158" y1="297" x2="190" y2="297"/>
  <circle class="dot" cx="158" cy="297" r="2"/>
  <text class="t-lab" x="196" y="301">底板</text>

  <line class="rule" x1="16" y1="318" x2="384" y2="318"/>

  <!-- 組立ての要点 -->
  <text class="t-sec" x="16" y="340">組立ての要点</text>

  <!-- 左の支柱 -->
  <line class="load" x1="130" y1="344" x2="130" y2="357" marker-end="url(#pp-r)"/>
  <rect class="timber" x="116" y="358" width="28" height="26"/>
  <rect class="plate" x="102" y="384" width="56" height="6"/>
  <rect class="pipe-in" x="122" y="390" width="16" height="60"/>
  <rect class="plate" x="102" y="450" width="56" height="6"/>
  <rect class="base" x="94" y="456" width="72" height="12"/>
  <line class="load" x1="130" y1="362" x2="130" y2="450"/>

  <!-- 右の支柱 -->
  <rect class="timber" x="256" y="358" width="28" height="26"/>
  <rect class="plate" x="242" y="384" width="56" height="6"/>
  <rect class="pipe-in" x="262" y="390" width="16" height="60"/>
  <rect class="plate" x="242" y="450" width="56" height="6"/>
  <rect class="base" x="234" y="456" width="72" height="12"/>

  <!-- 根がらみ -->
  <rect class="tie" x="138" y="429" width="124" height="6"/>
  <text class="t-lab" x="200" y="423" text-anchor="middle">根がらみ</text>

  <!-- 地盤 -->
  <line class="lead" x1="60" y1="468" x2="340" y2="468"/>

  <!-- ラベル -->
  <line class="lead" x1="284" y1="371" x2="300" y2="371"/>
  <circle class="dot" cx="284" cy="371" r="2"/>
  <text class="t-lab" x="306" y="375">大引</text>

  <line class="lead" x1="278" y1="415" x2="300" y2="415"/>
  <circle class="dot" cx="278" cy="415" r="2"/>
  <text class="t-lab" x="306" y="419">支柱</text>

  <line class="lead" x1="306" y1="462" x2="320" y2="462"/>
  <circle class="dot" cx="306" cy="462" r="2"/>
  <text class="t-lab" x="326" y="466">敷角</text>

  <text class="t-sub" x="138" y="351">荷重</text>
  <line class="load" x1="16" y1="486" x2="46" y2="486"/>
  <text class="t-sub" x="54" y="490">荷重の通る線</text>
</svg>
