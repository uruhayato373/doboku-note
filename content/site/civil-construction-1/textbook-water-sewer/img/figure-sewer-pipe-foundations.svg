<!-- authored 2026-09-12 doboku-note 自作。題材は1級土木 専門土木テキスト「上下水道」の論点。特定の書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="下水道管きょの基礎工4種（砂・砕石基礎、コンクリート基礎、はしご胴木基礎、鳥居基礎）の断面比較。地盤が軟弱になるほど砂・砕石からコンクリート、はしご胴木、鳥居基礎へと選定する">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-name { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-desc { font-size: 11px; fill: #555; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .pipe  { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .wall  { stroke: #d7d7d7; stroke-width: 1; }
      .sand  { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1; }
      .dot   { fill: #8a8a8a; }
      .conc  { fill: #f5f5f5; stroke: #222; stroke-width: 1.5; }
      .wood  { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
    </style>
  </defs>

  <text class="t-lead" x="200" y="16" text-anchor="middle">地盤の良否に応じて基礎工を4種から使い分ける</text>

  <!-- 砂・砕石基礎 -->
  <rect class="box-b" x="20" y="26" width="360" height="110" rx="6"/>
  <line class="wall" x1="35" y1="41" x2="35" y2="121"/>
  <line class="wall" x1="135" y1="41" x2="135" y2="121"/>
  <line class="wall" x1="35" y1="121" x2="135" y2="121"/>
  <rect class="sand" x="45" y="111" width="80" height="10"/>
  <circle class="dot" cx="58" cy="116" r="1.5"/>
  <circle class="dot" cx="75" cy="116" r="1.5"/>
  <circle class="dot" cx="92" cy="116" r="1.5"/>
  <circle class="dot" cx="109" cy="116" r="1.5"/>
  <circle class="pipe" cx="85" cy="97" r="14"/>
  <text class="t-name" x="160" y="56">砂・砕石基礎</text>
  <text class="t-desc" x="160" y="76">砂・砕石を密着させ締固め</text>
  <text class="t-desc" x="160" y="94">適用：比較的良好な地盤</text>

  <!-- コンクリート基礎 -->
  <rect class="box-b" x="20" y="145" width="360" height="110" rx="6"/>
  <line class="wall" x1="35" y1="160" x2="35" y2="240"/>
  <line class="wall" x1="135" y1="160" x2="135" y2="240"/>
  <line class="wall" x1="35" y1="240" x2="135" y2="240"/>
  <rect class="conc" x="50" y="220" width="70" height="20"/>
  <circle class="pipe" cx="85" cy="220" r="14"/>
  <text class="t-name" x="160" y="175">コンクリート基礎</text>
  <text class="t-desc" x="160" y="195">コンクリートで巻き立て</text>
  <text class="t-desc" x="160" y="213">適用：軟弱地盤・外圧大</text>

  <!-- はしご胴木基礎 -->
  <rect class="box-b" x="20" y="264" width="360" height="110" rx="6"/>
  <line class="wall" x1="35" y1="279" x2="35" y2="359"/>
  <line class="wall" x1="135" y1="279" x2="135" y2="359"/>
  <line class="wall" x1="35" y1="359" x2="135" y2="359"/>
  <rect class="wood" x="45" y="351" width="80" height="8"/>
  <rect class="wood" x="58" y="351" width="4" height="14"/>
  <rect class="wood" x="83" y="351" width="4" height="14"/>
  <rect class="wood" x="108" y="351" width="4" height="14"/>
  <circle class="pipe" cx="85" cy="337" r="14"/>
  <text class="t-name" x="160" y="294">はしご胴木基礎</text>
  <text class="t-desc" x="160" y="314">はしご状の縦木を並べる</text>
  <text class="t-desc" x="160" y="332">適用：軟弱・不均質な地盤</text>

  <!-- 鳥居基礎 -->
  <rect class="box-b" x="20" y="383" width="360" height="110" rx="6"/>
  <line class="wall" x1="35" y1="398" x2="35" y2="478"/>
  <line class="wall" x1="135" y1="398" x2="135" y2="478"/>
  <line class="wall" x1="35" y1="478" x2="135" y2="478"/>
  <rect class="wood" x="45" y="448" width="80" height="8"/>
  <rect class="wood" x="55" y="456" width="6" height="26"/>
  <rect class="wood" x="105" y="456" width="6" height="26"/>
  <circle class="pipe" cx="85" cy="434" r="14"/>
  <text class="t-name" x="160" y="413">鳥居基礎</text>
  <text class="t-desc" x="160" y="433">はしご胴木を杭で支持</text>
  <text class="t-desc" x="160" y="451">適用：極軟弱地盤（地耐力なし）</text>
</svg>
