<!-- authored 2026-10-09 doboku-note 自作。題材は1級土木 専門土木テキスト「上下水道」の論点（上水と下水の処理施設を、取り除く対象の順に対比）。特定の書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="上水と下水の処理施設を取り除く対象の順に対比した図。大きなごみと砂は取水・沈砂と沈砂池、浮遊する細かい粒は凝集沈殿とろ過と最初沈殿池、溶けている汚れは高度浄水処理と反応タンク、病原生物は塩素消毒と消毒設備、最後は給水栓と放流先で水質を管理する">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-head { font-size: 13px; font-weight: bold; fill: #222; }
      .t-band { font-size: 11px; font-weight: bold; fill: #555; }
      .t-name { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-desc { font-size: 11px; fill: #555; }
      .box-brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-opt { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .box-end { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .band { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1; }
      .arrow-line { stroke: #2e6da4; stroke-width: 2; fill: none; }
    </style>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#2e6da4"/>
    </marker>
  </defs>

  <!-- 列見出し -->
  <text class="t-head" x="102" y="20" text-anchor="middle">上水道</text>
  <text class="t-head" x="297" y="20" text-anchor="middle">下水道</text>
  <line x1="10" y1="27" x2="194" y2="27" stroke="#2e6da4" stroke-width="2"/> <!-- brand -->
  <line x1="206" y1="27" x2="390" y2="27" stroke="#2e6da4" stroke-width="2"/>

  <!-- 行1: 大きなごみ・砂 -->
  <rect class="band" x="10" y="36" width="380" height="18" rx="3"/>
  <text class="t-band" x="200" y="49" text-anchor="middle">大きなごみ・砂</text>
  <rect class="box-brand" x="10" y="58" width="184" height="50" rx="6"/>
  <text class="t-name" x="102" y="78" text-anchor="middle">取水・沈砂</text>
  <text class="t-desc" x="102" y="96" text-anchor="middle">スクリーンと砂の除去</text>
  <rect class="box-brand" x="206" y="58" width="184" height="50" rx="6"/>
  <text class="t-name" x="298" y="78" text-anchor="middle">沈砂池</text>
  <text class="t-desc" x="298" y="96" text-anchor="middle">ごみ・石・砂を沈める</text>

  <!-- 行2: 浮遊する細かい粒 -->
  <rect class="band" x="10" y="130" width="380" height="18" rx="3"/>
  <text class="t-band" x="200" y="143" text-anchor="middle">浮遊している細かい粒</text>
  <rect class="box-brand" x="10" y="152" width="184" height="50" rx="6"/>
  <text class="t-name" x="102" y="172" text-anchor="middle">凝集沈殿 → ろ過</text>
  <text class="t-desc" x="102" y="190" text-anchor="middle">薬品でフロックにして除く</text>
  <rect class="box-brand" x="206" y="152" width="184" height="50" rx="6"/>
  <text class="t-name" x="298" y="172" text-anchor="middle">最初沈殿池</text>
  <text class="t-desc" x="298" y="190" text-anchor="middle">沈む汚れを分ける</text>

  <!-- 行3: 溶けている汚れ -->
  <rect class="band" x="10" y="224" width="380" height="18" rx="3"/>
  <text class="t-band" x="200" y="237" text-anchor="middle">溶けている汚れ</text>
  <rect class="box-opt" x="10" y="246" width="184" height="50" rx="6"/>
  <text class="t-name" x="102" y="266" text-anchor="middle">高度浄水処理</text>
  <text class="t-desc" x="102" y="284" text-anchor="middle">オゾン・粒状活性炭（必要時）</text>
  <rect class="box-brand" x="206" y="246" width="184" height="50" rx="6"/>
  <text class="t-name" x="298" y="266" text-anchor="middle">反応タンク → 最終沈殿池</text>
  <text class="t-desc" x="298" y="284" text-anchor="middle">微生物が分解し、汚泥を分ける</text>

  <!-- 行4: 病原生物 -->
  <rect class="band" x="10" y="318" width="380" height="18" rx="3"/>
  <text class="t-band" x="200" y="331" text-anchor="middle">病原生物</text>
  <rect class="box-brand" x="10" y="340" width="184" height="50" rx="6"/>
  <text class="t-name" x="102" y="360" text-anchor="middle">塩素消毒</text>
  <text class="t-desc" x="102" y="378" text-anchor="middle">給水栓の遊離塩素0.1mg/L以上</text>
  <rect class="box-brand" x="206" y="340" width="184" height="50" rx="6"/>
  <text class="t-name" x="298" y="360" text-anchor="middle">消毒設備</text>
  <text class="t-desc" x="298" y="378" text-anchor="middle">塩素・紫外線など</text>

  <!-- 行5: 行き先と基準 -->
  <rect class="band" x="10" y="412" width="380" height="18" rx="3"/>
  <text class="t-band" x="200" y="425" text-anchor="middle">行き先と、水質を測る場所</text>
  <rect class="box-end" x="10" y="434" width="184" height="50" rx="6"/>
  <text class="t-name" x="102" y="454" text-anchor="middle">配水池 → 給水栓</text>
  <text class="t-desc" x="102" y="472" text-anchor="middle">水質基準で管理</text>
  <rect class="box-end" x="206" y="434" width="184" height="50" rx="6"/>
  <text class="t-name" x="298" y="454" text-anchor="middle">河川・海へ放流</text>
  <text class="t-desc" x="298" y="472" text-anchor="middle">放流水の基準で管理</text>

  <!-- 行間の矢印（帯の上に重ねる） -->
  <line class="arrow-line" x1="102" y1="108" x2="102" y2="148" marker-end="url(#arrow)"/>
  <line class="arrow-line" x1="298" y1="108" x2="298" y2="148" marker-end="url(#arrow)"/>
  <line class="arrow-line" x1="102" y1="202" x2="102" y2="242" marker-end="url(#arrow)"/>
  <line class="arrow-line" x1="298" y1="202" x2="298" y2="242" marker-end="url(#arrow)"/>
  <line class="arrow-line" x1="102" y1="296" x2="102" y2="336" marker-end="url(#arrow)"/>
  <line class="arrow-line" x1="298" y1="296" x2="298" y2="336" marker-end="url(#arrow)"/>
  <line class="arrow-line" x1="102" y1="390" x2="102" y2="430" marker-end="url(#arrow)"/>
  <line class="arrow-line" x1="298" y1="390" x2="298" y2="430" marker-end="url(#arrow)"/>
</svg>
