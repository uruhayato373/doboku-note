<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="建設副産物の扱いの優先順位。発生抑制、再使用、再生利用、熱回収、縮減してから適正処分の順。下段は、循環的な利用が再使用から熱回収まで、再資源化が再生利用と熱回収、再資源化等が再生利用から縮減までを指すことを示す帯図">
<style>text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }</style>
<rect x="14" y="12" width="372" height="46" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<circle cx="38" cy="35.0" r="13" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
<text x="38" y="39.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">1</text>
<text x="62" y="31" text-anchor="start" font-size="13" font-weight="bold" fill="#1a3a5c">発生を抑える</text>
<text x="62" y="48" text-anchor="start" font-size="11" fill="#222">工法や資材の選び方で、そもそも出さない</text>
<line x1="38" y1="58" x2="38" y2="64" stroke="#8a8a8a" stroke-width="1.5"/>
<path d="M33 63 L43 63 L38 70 Z" fill="#8a8a8a"/>
<rect x="14" y="70" width="372" height="46" rx="6" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
<circle cx="38" cy="93.0" r="13" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
<text x="38" y="97.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">2</text>
<text x="62" y="89" text-anchor="start" font-size="13" font-weight="bold" fill="#1a3a5c">再使用</text>
<text x="62" y="106" text-anchor="start" font-size="11" fill="#222">製品や部品としてそのまま使う（修理して使う場合も）</text>
<line x1="38" y1="116" x2="38" y2="122" stroke="#8a8a8a" stroke-width="1.5"/>
<path d="M33 121 L43 121 L38 128 Z" fill="#8a8a8a"/>
<rect x="14" y="128" width="372" height="46" rx="6" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
<circle cx="38" cy="151.0" r="13" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
<text x="38" y="155.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">3</text>
<text x="62" y="147" text-anchor="start" font-size="13" font-weight="bold" fill="#1a3a5c">再生利用</text>
<text x="62" y="164" text-anchor="start" font-size="11" fill="#222">資材や原材料として使う（破砕して路盤材にするなど）</text>
<line x1="38" y1="174" x2="38" y2="180" stroke="#8a8a8a" stroke-width="1.5"/>
<path d="M33 179 L43 179 L38 186 Z" fill="#8a8a8a"/>
<rect x="14" y="186" width="372" height="46" rx="6" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
<circle cx="38" cy="209.0" r="13" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
<text x="38" y="213.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">4</text>
<text x="62" y="205" text-anchor="start" font-size="13" font-weight="bold" fill="#1a3a5c">熱回収</text>
<text x="62" y="222" text-anchor="start" font-size="11" fill="#222">燃やせるものを、熱を得るために使う</text>
<line x1="38" y1="232" x2="38" y2="238" stroke="#8a8a8a" stroke-width="1.5"/>
<path d="M33 237 L43 237 L38 244 Z" fill="#8a8a8a"/>
<rect x="14" y="244" width="372" height="46" rx="6" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
<circle cx="38" cy="267.0" r="13" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
<text x="38" y="271.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">5</text>
<text x="62" y="263" text-anchor="start" font-size="13" font-weight="bold" fill="#1a3a5c">縮減してから適正処分</text>
<text x="62" y="280" text-anchor="start" font-size="11" fill="#222">焼却・脱水・圧縮で量を減らし、埋立などで処分する</text>
<text x="14" y="316" text-anchor="start" font-size="11" font-weight="bold" fill="#555">言葉の包含関係（帯が指す範囲）</text>
<rect x="14.0" y="324" width="74.4" height="22" rx="0" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
<text x="51.2" y="339" text-anchor="middle" font-size="11" fill="#222">発生抑制</text>
<rect x="88.4" y="324" width="74.4" height="22" rx="0" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
<text x="125.6" y="339" text-anchor="middle" font-size="11" fill="#222">再使用</text>
<rect x="162.8" y="324" width="74.4" height="22" rx="0" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
<text x="200.0" y="339" text-anchor="middle" font-size="11" fill="#222">再生利用</text>
<rect x="237.2" y="324" width="74.4" height="22" rx="0" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
<text x="274.4" y="339" text-anchor="middle" font-size="11" fill="#222">熱回収</text>
<rect x="311.6" y="324" width="74.4" height="22" rx="0" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
<text x="348.8" y="339" text-anchor="middle" font-size="11" fill="#222">縮減</text>
<rect x="88.4" y="356" width="223.2" height="26" rx="6" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
<text x="200.0" y="373" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">循環的な利用</text>
<rect x="162.8" y="390" width="148.8" height="26" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<text x="237.2" y="407" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">再資源化</text>
<rect x="162.8" y="424" width="223.2" height="26" rx="6" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
<text x="274.4" y="441" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">再資源化等（再資源化＋縮減）</text>
<text x="14" y="464" text-anchor="start" font-size="11" fill="#555">再資源化は、再生利用か熱回収ができる状態にする行為</text>
</svg>
