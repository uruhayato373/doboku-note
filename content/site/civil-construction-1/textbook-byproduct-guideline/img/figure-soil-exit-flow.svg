<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="建設発生土の流れ。現場内で使う、他の工事で使う、受入地や処分場へ搬入する、の順に出口を考え、搬出する出口（工事間利用と受入地）では、廃棄物の混入と汚染、搬出先の許可、受領書の保存を確かめる">
<style>text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }</style>
<rect x="14" y="12" width="372" height="72" rx="6" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
<text x="28" y="36" text-anchor="start" font-size="13" font-weight="bold" fill="#1a3a5c">① 現場内で使う</text>
<text x="28" y="56" text-anchor="start" font-size="11" fill="#222">工法の選択で発生を抑え、埋戻しや盛土に回す</text>
<text x="28" y="73" text-anchor="start" font-size="11" fill="#222">使い切れない分だけが搬出の対象になる</text>
<line x1="60" y1="84" x2="60" y2="106" stroke="#8a8a8a" stroke-width="1.5"/>
<path d="M55 105 L65 105 L60 112 Z" fill="#8a8a8a"/>
<text x="72" y="102" text-anchor="start" font-size="11" fill="#555">余った土</text>
<rect x="14" y="112" width="372" height="90" rx="6" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
<text x="28" y="136" text-anchor="start" font-size="13" font-weight="bold" fill="#1a3a5c">② 他の工事で使う（工事間利用）</text>
<text x="28" y="156" text-anchor="start" font-size="11" fill="#222">土質を確かめ、情報交換システムで需要先を探す</text>
<text x="28" y="173" text-anchor="start" font-size="11" fill="#222">ストックヤードや再資源化施設を経由させる</text>
<text x="28" y="190" text-anchor="start" font-size="11" fill="#222">必要なら土質改良をして使う</text>
<line x1="60" y1="202" x2="60" y2="224" stroke="#8a8a8a" stroke-width="1.5"/>
<path d="M55 223 L65 223 L60 230 Z" fill="#8a8a8a"/>
<text x="72" y="220" text-anchor="start" font-size="11" fill="#555">利用先がない分</text>
<rect x="14" y="230" width="372" height="72" rx="6" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
<text x="28" y="254" text-anchor="start" font-size="13" font-weight="bold" fill="#1a3a5c">③ 受入地・処分場へ搬入する</text>
<text x="28" y="274" text-anchor="start" font-size="11" fill="#222">埋立・盛土の安全を受入地の関係者と打合せる</text>
<text x="28" y="291" text-anchor="start" font-size="11" fill="#222">降雨での流出、地震での崩壊を防ぐ</text>
<text x="14" y="320" text-anchor="start" font-size="12" font-weight="bold" fill="#1a3a5c">搬出する出口（②③）で確かめる三点</text>
<rect x="14" y="330" width="372" height="38" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
<circle cx="38" cy="349" r="11" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<text x="38" y="353.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">1</text>
<text x="60" y="354" text-anchor="start" font-size="11" fill="#222">廃棄物が混ざっていないか。汚染土は別に扱う</text>
<rect x="14" y="376" width="372" height="38" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
<circle cx="38" cy="395" r="11" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<text x="38" y="399.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">2</text>
<text x="60" y="400" text-anchor="start" font-size="11" fill="#222">搬出先の許可と土壌汚染の手続を、搬出前に確認</text>
<rect x="14" y="422" width="372" height="38" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
<circle cx="38" cy="441" r="11" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<text x="38" y="445.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">3</text>
<text x="60" y="446" text-anchor="start" font-size="11" fill="#222">搬出先から受領書をもらい、写しを5年保存</text>
</svg>
