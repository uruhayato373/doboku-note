<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="アスファルト舗装を構成する表層、基層、上層路盤、下層路盤と、支持地盤である路床、路体。車輪荷重が下へ広がる模式図。"><defs><style>
text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; fill:#222; }
.name {font-size:15px;font-weight:bold;fill:#1a3a5c;} /* ink / brand-text */
.label {font-size:14px;fill:#555;} /* ink-body */
.note {font-size:12px;fill:#555;}
.panel {fill:#f5f5f5;stroke:#d7d7d7;stroke-width:1.5;} /* surface / border */
.soil {fill:#fff3cd;stroke:#d4a017;stroke-width:1.5;} /* warn-fill / warn */
.water {fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5;} /* brand-fill / brand */
.line {fill:none;stroke:#555;stroke-width:2;}
.flow {fill:none;stroke:#2e6da4;stroke-width:2;}
</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4"/></marker></defs>
<text class="label" x="200" y="25" text-anchor="middle">舗装が荷重を広げ、路床が受け止める</text>
<text class="name" x="239" y="54" text-anchor="middle">車輪荷重</text>
<path class="flow" d="M239 61 V92" marker-end="url(#arrow)"/><rect x="35" y="98" width="275" height="44" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/><text class="name" x="54" y="125">表層</text><rect x="35" y="142" width="275" height="48" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/><text class="name" x="54" y="171">基層</text><rect x="35" y="190" width="275" height="60" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/><text class="name" x="54" y="225">上層路盤</text><rect x="35" y="250" width="275" height="70" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/><text class="name" x="54" y="290">下層路盤</text><rect x="35" y="337" width="275" height="68" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/><text class="name" x="54" y="376">路床</text><rect x="35" y="405" width="275" height="60" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="1.5"/><text class="name" x="54" y="440">路体</text><path class="flow" d="M235 114 L218 176" marker-end="url(#arrow)"/>
<path class="flow" d="M245 114 L262 176" marker-end="url(#arrow)"/>
<path class="flow" d="M216 209 L189 304" marker-end="url(#arrow)"/>
<path class="flow" d="M265 209 L291 304" marker-end="url(#arrow)"/>
<path class="flow" d="M185 350 V390" marker-end="url(#arrow)"/><path class="flow" d="M237 350 V390" marker-end="url(#arrow)"/><path class="flow" d="M289 350 V390" marker-end="url(#arrow)"/>
<path class="line" d="M325 98 H337 V320 H325"/><text class="name" x="350" y="198">舗</text><text class="name" x="350" y="222">装</text>
<text class="note" x="200" y="332" text-anchor="middle">ここから下は、舗装を支える地盤</text>
<text class="note" x="200" y="488" text-anchor="middle">層の厚さ・荷重の広がりは模式表示</text>
</svg>
