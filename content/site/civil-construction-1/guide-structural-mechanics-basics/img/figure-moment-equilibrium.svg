<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="モーメントは力と腕の長さの積。てこの回転の中心から左に3m の位置に2kN、右に2m の位置に3kN が下向きに働くと、どちらも6kN·m で回らない。下段は水平の力・鉛直の力・回す力の和がそれぞれ0になるつり合い3条件を示す。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-h  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-b  { font-size: 12px; fill: #222; }
      .t-bb { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-s  { font-size: 11px; fill: #555; }
      .t-sd { font-size: 11px; fill: #222; }
      .t-r  { font-size: 12px; font-weight: bold; fill: #b22234; }
      .t-g  { font-size: 12px; font-weight: bold; fill: #3a7d44; }
      .t-bl { font-size: 12px; font-weight: bold; fill: #2e6da4; }
      .f-brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .f-pos   { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .f-warn  { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .f-neg   { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .f-surf  { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.2; }
      .cell    { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1.5; }
      .rule    { stroke: #d7d7d7; stroke-width: 1; fill: none; }
      .dim     { stroke: #8a8a8a; stroke-width: 1; fill: none; }
      .guide   { stroke: #8a8a8a; stroke-width: 1; fill: none; stroke-dasharray: 4 3; }
      .ln-ink  { stroke: #222; stroke-width: 2; fill: none; }
      .ln-brand{ stroke: #2e6da4; stroke-width: 2.5; fill: none; }
      .ln-pos  { stroke: #3a7d44; stroke-width: 2.5; fill: none; }
      .ln-neg  { stroke: #b22234; stroke-width: 3; fill: none; }
    </style>
    <marker id="ah-ink" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#222"/></marker>
    <marker id="ah-brand" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#2e6da4"/></marker>
    <marker id="ah-pos" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#3a7d44"/></marker>
    <marker id="ah-neg" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="11" refY="4.5" orient="auto"><polygon points="0,0 11,4.5 0,9" fill="#b22234"/></marker>
  </defs>
  <text class="t-h" x="20" y="24">モーメント = 力 × 腕の長さ</text>
  <rect class="f-surf" x="36" y="100" width="328" height="8" rx="1"/>
  <polygon class="f-brand" points="200,108 184,134 216,134"/>
  <line class="rule" x1="168" y1="134" x2="232" y2="134"/>
  <text class="t-s" x="200" y="150" text-anchor="middle">O (回転の中心)</text>
  <line class="ln-ink" x1="80" y1="56" x2="80" y2="97" marker-end="url(#ah-ink)"/>
  <line class="ln-ink" x1="280" y1="56" x2="280" y2="97" marker-end="url(#ah-ink)"/>
  <text class="t-bb" x="80" y="50" text-anchor="middle">2 kN</text>
  <text class="t-bb" x="280" y="50" text-anchor="middle">3 kN</text>
  <line class="guide" x1="80" y1="112" x2="80" y2="172"/>
  <line class="guide" x1="280" y1="112" x2="280" y2="172"/>
  <line class="dim" x1="200" y1="161" x2="200" y2="171"/>
  <line class="dim" x1="80" y1="161" x2="80" y2="171"/>
  <line class="dim" x1="280" y1="161" x2="280" y2="171"/>
  <line class="dim" x1="80" y1="166" x2="200" y2="166"/>
  <line class="dim" x1="200" y1="166" x2="280" y2="166"/>
  <text class="t-sd" x="140" y="184" text-anchor="middle">3 m</text>
  <text class="t-sd" x="240" y="184" text-anchor="middle">2 m</text>
  <text class="t-b" x="20" y="210">左の力: 2 × 3 = 6 kN·m (反時計回り)</text>
  <text class="t-b" x="20" y="228">右の力: 3 × 2 = 6 kN·m (時計回り)</text>
  <text class="t-s" x="20" y="246">回す効果が等しいので、てこは回らない</text>
  <line class="rule" x1="20" y1="260" x2="380" y2="260"/>
  <text class="t-h" x="20" y="280">つり合い3条件 (止まっている物体)</text>
  <rect class="cell" x="20" y="292" width="96" height="56" rx="6"/>
  <circle cx="68" cy="320" r="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <line class="ln-ink" x1="60" y1="320" x2="32" y2="320" marker-end="url(#ah-ink)"/>
  <line class="ln-ink" x1="76" y1="320" x2="104" y2="320" marker-end="url(#ah-ink)"/>
  <text class="t-bb" x="132" y="316">水平方向の力の和 = 0</text>
  <text class="t-b" x="132" y="336">ΣH = 0</text>
  <rect class="cell" x="20" y="358" width="96" height="56" rx="6"/>
  <circle cx="68" cy="386" r="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <line class="ln-ink" x1="68" y1="378" x2="68" y2="363" marker-end="url(#ah-ink)"/>
  <line class="ln-ink" x1="68" y1="394" x2="68" y2="409" marker-end="url(#ah-ink)"/>
  <text class="t-bb" x="132" y="382">鉛直方向の力の和 = 0</text>
  <text class="t-b" x="132" y="402">ΣV = 0</text>
  <rect class="cell" x="20" y="424" width="96" height="56" rx="6"/>
  <path class="ln-ink" d="M 34 452 A 12 12 0 1 1 46 464" marker-end="url(#ah-ink)"/>
  <path class="ln-ink" d="M 102 452 A 12 12 0 1 0 90 464" marker-end="url(#ah-ink)"/>
  <text class="t-bb" x="132" y="448">回す力 (モーメント) の和 = 0</text>
  <text class="t-b" x="132" y="468">ΣM = 0 (どの点まわりでも成り立つ)</text>
</svg>
