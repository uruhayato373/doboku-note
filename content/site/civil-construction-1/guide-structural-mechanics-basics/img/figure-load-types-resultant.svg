<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="同じ単純ばりに集中荷重・等分布荷重・等変分布荷重を載せて並べた図。集中荷重の合力はPそのもの。等分布荷重の合力は w×L で中央に、等変分布荷重の合力は q×L÷2 で大きい側から L/3 の位置に作用する。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-h  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-b  { font-size: 12px; fill: #222; }
      .t-bb { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-s  { font-size: 11px; fill: #555; }
      .t-sd { font-size: 11px; fill: #222; }
      .t-r  { font-size: 12px; font-weight: bold; fill: #b22234; }
      .t-g  { font-size: 12px; font-weight: bold; fill: #3a7d44; }
      .t-bl { font-size: 12px; font-weight: bold; fill: #2e6da4; }
      .f-brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .f-pos   { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .f-warn  { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .f-neg   { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .f-surf  { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.2; }
      .cell    { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1.5; }
      .rule    { stroke: #d7d7d7; stroke-width: 1; fill: none; }
      .dim     { stroke: #8a8a8a; stroke-width: 1; fill: none; }
      .guide   { stroke: #8a8a8a; stroke-width: 1; fill: none; stroke-dasharray: 4 3; }
      .ln-ink  { stroke: #222; stroke-width: 2; fill: none; }
      .ln-brand{ stroke: #2e6da4; stroke-width: 2.5; fill: none; }
      .ln-pos  { stroke: #3a7d44; stroke-width: 2.5; fill: none; }
      .ln-neg  { stroke: #b22234; stroke-width: 3; fill: none; }
    </style>
    <marker id="ah-ink" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#222"/></marker>
    <marker id="ah-brand" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#2e6da4"/></marker>
    <marker id="ah-pos" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#3a7d44"/></marker>
    <marker id="ah-neg" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="11" refY="4.5" orient="auto"><polygon points="0,0 11,4.5 0,9" fill="#b22234"/></marker>
  </defs>
  <text class="t-h" x="20" y="24">集中荷重 P (kN)</text>
  <rect class="f-surf" x="40" y="92" width="300" height="8"/>
  <polygon class="f-brand" points="60,100 48,118 72,118"/>
  <line class="ln-ink" x1="40" y1="118" x2="80" y2="118"/>
  <polygon class="f-brand" points="320,100 308,116 332,116"/>
  <circle cx="314" cy="120" r="3.5" fill="#ffffff" stroke="#222" stroke-width="1.2"/>
  <circle cx="326" cy="120" r="3.5" fill="#ffffff" stroke="#222" stroke-width="1.2"/>
  <line class="ln-ink" x1="300" y1="124" x2="340" y2="124"/>
  <line class="ln-ink" x1="150" y1="38" x2="150" y2="89" marker-end="url(#ah-ink)"/>
  <text class="t-bb" x="160" y="56">P</text>
  <text class="t-sd" x="20" y="154">合力は P そのもので、作用点も同じ</text>
  <line class="rule" x1="20" y1="160" x2="380" y2="160"/>
  <text class="t-h" x="20" y="180">等分布荷重 w (kN/m)</text>
  <rect class="f-brand" x="60" y="212" width="260" height="34"/>
  <line x1="60" y1="214" x2="60" y2="245" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#ah-brand)"/>
  <line x1="86" y1="214" x2="86" y2="245" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#ah-brand)"/>
  <line x1="112" y1="214" x2="112" y2="245" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#ah-brand)"/>
  <line x1="138" y1="214" x2="138" y2="245" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#ah-brand)"/>
  <line x1="164" y1="214" x2="164" y2="245" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#ah-brand)"/>
  <line x1="190" y1="214" x2="190" y2="245" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#ah-brand)"/>
  <line x1="216" y1="214" x2="216" y2="245" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#ah-brand)"/>
  <line x1="242" y1="214" x2="242" y2="245" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#ah-brand)"/>
  <line x1="268" y1="214" x2="268" y2="245" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#ah-brand)"/>
  <line x1="294" y1="214" x2="294" y2="245" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#ah-brand)"/>
  <line x1="320" y1="214" x2="320" y2="245" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#ah-brand)"/>
  <rect class="f-surf" x="40" y="248" width="300" height="8"/>
  <polygon class="f-brand" points="60,256 48,274 72,274"/>
  <line class="ln-ink" x1="40" y1="274" x2="80" y2="274"/>
  <polygon class="f-brand" points="320,256 308,272 332,272"/>
  <circle cx="314" cy="276" r="3.5" fill="#ffffff" stroke="#222" stroke-width="1.2"/>
  <circle cx="326" cy="276" r="3.5" fill="#ffffff" stroke="#222" stroke-width="1.2"/>
  <line class="ln-ink" x1="300" y1="280" x2="340" y2="280"/>
  <line class="ln-neg" x1="190" y1="190" x2="190" y2="246" marker-end="url(#ah-neg)"/>
  <text class="t-r" x="198" y="200">W = wL</text>
  <line class="dim" x1="60" y1="292" x2="105" y2="292"/>
  <line class="dim" x1="145" y1="292" x2="190" y2="292"/>
  <text class="t-s" x="125" y="296" text-anchor="middle">L/2</text>
  <line class="dim" x1="190" y1="292" x2="235" y2="292"/>
  <line class="dim" x1="275" y1="292" x2="320" y2="292"/>
  <text class="t-s" x="255" y="296" text-anchor="middle">L/2</text>
  <line class="dim" x1="60" y1="287" x2="60" y2="297"/>
  <line class="dim" x1="190" y1="287" x2="190" y2="297"/>
  <line class="dim" x1="320" y1="287" x2="320" y2="297"/>
  <text class="t-sd" x="20" y="312">W = wL (長方形の面積)、位置は中央</text>
  <line class="rule" x1="20" y1="318" x2="380" y2="318"/>
  <text class="t-h" x="20" y="336">等変分布荷重 (最大 q kN/m)</text>
  <polygon class="f-brand" points="60,402 320,402 320,362"/>
  <line x1="138" y1="392" x2="138" y2="401" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#ah-brand)"/>
  <line x1="164" y1="388" x2="164" y2="401" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#ah-brand)"/>
  <line x1="190" y1="384" x2="190" y2="401" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#ah-brand)"/>
  <line x1="216" y1="380" x2="216" y2="401" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#ah-brand)"/>
  <line x1="242" y1="376" x2="242" y2="401" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#ah-brand)"/>
  <line x1="268" y1="372" x2="268" y2="401" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#ah-brand)"/>
  <line x1="294" y1="368" x2="294" y2="401" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#ah-brand)"/>
  <line x1="320" y1="364" x2="320" y2="401" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#ah-brand)"/>
  <rect class="f-surf" x="40" y="404" width="300" height="8"/>
  <polygon class="f-brand" points="60,412 48,430 72,430"/>
  <line class="ln-ink" x1="40" y1="430" x2="80" y2="430"/>
  <polygon class="f-brand" points="320,412 308,428 332,428"/>
  <circle cx="314" cy="432" r="3.5" fill="#ffffff" stroke="#222" stroke-width="1.2"/>
  <circle cx="326" cy="432" r="3.5" fill="#ffffff" stroke="#222" stroke-width="1.2"/>
  <line class="ln-ink" x1="300" y1="436" x2="340" y2="436"/>
  <line class="ln-neg" x1="233.3" y1="344" x2="233.3" y2="402" marker-end="url(#ah-neg)"/>
  <text class="t-r" x="241.3" y="356">W = qL/2</text>
  <text class="t-bb" x="328" y="366">q</text>
  <line class="dim" x1="60" y1="448" x2="126.7" y2="448"/>
  <line class="dim" x1="166.7" y1="448" x2="233.3" y2="448"/>
  <text class="t-s" x="146.7" y="452" text-anchor="middle">2L/3</text>
  <line class="dim" x1="233.3" y1="448" x2="256.6" y2="448"/>
  <line class="dim" x1="296.6" y1="448" x2="320" y2="448"/>
  <text class="t-s" x="276.6" y="452" text-anchor="middle">L/3</text>
  <line class="dim" x1="60" y1="443" x2="60" y2="453"/>
  <line class="dim" x1="233.3" y1="443" x2="233.3" y2="453"/>
  <line class="dim" x1="320" y1="443" x2="320" y2="453"/>
  <text class="t-sd" x="20" y="468">W = qL/2 (三角形の面積)、位置は大きい側から L/3</text>
</svg>
