<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="スパン5m の単純ばりで、A から2m の点 C に集中荷重10kN が働く例。支点反力は A が6kN、B が4kN。せん断力図は A から C までが+6kN、C から B までが−4kN の階段状。曲げモーメント図は荷重点 C が頂点で最大12kN·m の三角形。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-h  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-b  { font-size: 12px; fill: #222; }
      .t-bb { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-s  { font-size: 11px; fill: #555; }
      .t-sd { font-size: 11px; fill: #222; }
      .t-r  { font-size: 12px; font-weight: bold; fill: #b22234; }
      .t-g  { font-size: 12px; font-weight: bold; fill: #3a7d44; }
      .t-bl { font-size: 12px; font-weight: bold; fill: #2e6da4; }
      .f-brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .f-pos   { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .f-warn  { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .f-neg   { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .f-surf  { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.2; }
      .cell    { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1.5; }
      .rule    { stroke: #d7d7d7; stroke-width: 1; fill: none; }
      .dim     { stroke: #8a8a8a; stroke-width: 1; fill: none; }
      .guide   { stroke: #8a8a8a; stroke-width: 1; fill: none; stroke-dasharray: 4 3; }
      .ln-ink  { stroke: #222; stroke-width: 2; fill: none; }
      .ln-brand{ stroke: #2e6da4; stroke-width: 2.5; fill: none; }
      .ln-pos  { stroke: #3a7d44; stroke-width: 2.5; fill: none; }
      .ln-neg  { stroke: #b22234; stroke-width: 3; fill: none; }
    </style>
    <marker id="ah-ink" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#222"/></marker>
    <marker id="ah-brand" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#2e6da4"/></marker>
    <marker id="ah-pos" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#3a7d44"/></marker>
    <marker id="ah-neg" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="11" refY="4.5" orient="auto"><polygon points="0,0 11,4.5 0,9" fill="#b22234"/></marker>
  </defs>
  <text class="t-bb" x="162" y="26" text-anchor="middle">P = 10 kN</text>
  <line class="ln-ink" x1="162" y1="34" x2="162" y2="68" marker-end="url(#ah-ink)"/>
  <rect class="f-surf" x="36" y="70" width="308" height="8"/>
  <polygon class="f-brand" points="50,78 38,98 62,98"/>
  <line class="ln-ink" x1="30" y1="98" x2="70" y2="98"/>
  <polygon class="f-brand" points="330,78 318,96 342,96"/>
  <circle cx="324" cy="100" r="4" fill="#ffffff" stroke="#222" stroke-width="1.2"/>
  <circle cx="336" cy="100" r="4" fill="#ffffff" stroke="#222" stroke-width="1.2"/>
  <line class="ln-ink" x1="310" y1="105" x2="350" y2="105"/>
  <text class="t-h" x="50" y="122" text-anchor="middle">A</text>
  <text class="t-h" x="162" y="96" text-anchor="middle">C</text>
  <text class="t-h" x="330" y="124" text-anchor="middle">B</text>
  <line class="dim" x1="50" y1="140" x2="162" y2="140"/>
  <line class="dim" x1="162" y1="140" x2="330" y2="140"/>
  <line class="dim" x1="50" y1="135" x2="50" y2="145"/>
  <line class="dim" x1="162" y1="135" x2="162" y2="145"/>
  <line class="dim" x1="330" y1="135" x2="330" y2="145"/>
  <text class="t-sd" x="106" y="158" text-anchor="middle">2 m</text>
  <text class="t-sd" x="246" y="158" text-anchor="middle">3 m</text>
  <text class="t-g" x="20" y="178">RA = 6 kN</text>
  <text class="t-g" x="366" y="178" text-anchor="end">RB = 4 kN</text>
  <line class="rule" x1="20" y1="188" x2="380" y2="188"/>
  <text class="t-h" x="20" y="206">せん断力図 S (kN、上向きを正)</text>
  <line class="guide" x1="50" y1="228" x2="50" y2="300"/>
  <line class="guide" x1="162" y1="228" x2="162" y2="300"/>
  <line class="guide" x1="330" y1="228" x2="330" y2="300"/>
  <polygon class="f-brand" points="50,266 50,230 162,230 162,266"/>
  <polygon class="f-warn" points="162,266 162,290 330,290 330,266"/>
  <line class="ln-ink" x1="36" y1="266" x2="344" y2="266"/>
  <text class="t-bb" x="106" y="224" text-anchor="middle">+6</text>
  <text class="t-bb" x="246" y="306" text-anchor="middle">−4</text>
  <line class="rule" x1="20" y1="314" x2="380" y2="314"/>
  <text class="t-h" x="20" y="332">曲げモーメント図 M (kN·m、正は下側)</text>
  <line class="guide" x1="50" y1="340" x2="50" y2="360"/>
  <line class="guide" x1="162" y1="340" x2="162" y2="426"/>
  <line class="guide" x1="330" y1="340" x2="330" y2="360"/>
  <polygon class="f-pos" points="50,356 162,420 330,356"/>
  <line class="ln-ink" x1="36" y1="356" x2="344" y2="356"/>
  <text class="t-sd" x="40" y="350" text-anchor="end">0</text>
  <text class="t-sd" x="340" y="350">0</text>
  <text class="t-g" x="162" y="440" text-anchor="middle">最大 12 kN·m</text>
  <text class="t-sd" x="20" y="460">S が + から − に変わる点 C で M が最大</text>
  <text class="t-sd" x="20" y="476">荷重点 C で S は荷重の大きさ 10 kN だけ下がる</text>
  <text class="t-sd" x="20" y="492">M は C が頂点で、支点 A・B では 0</text>
</svg>
