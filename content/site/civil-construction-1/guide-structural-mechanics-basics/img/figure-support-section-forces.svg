<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="上段は回転支点・可動支点・固定支点の違い。回転支点の反力は水平と鉛直の2つ、可動支点は鉛直の1つ、固定支点は水平・鉛直・モーメントの3つ。下段ははりを切ったときの切断面に現れる軸力・せん断力・曲げモーメントの3つの力を示す。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-h  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-b  { font-size: 12px; fill: #222; }
      .t-bb { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-s  { font-size: 11px; fill: #555; }
      .t-sd { font-size: 11px; fill: #222; }
      .t-r  { font-size: 12px; font-weight: bold; fill: #b22234; }
      .t-g  { font-size: 12px; font-weight: bold; fill: #3a7d44; }
      .t-bl { font-size: 12px; font-weight: bold; fill: #2e6da4; }
      .f-brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .f-pos   { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .f-warn  { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .f-neg   { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .f-surf  { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.2; }
      .cell    { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1.5; }
      .rule    { stroke: #d7d7d7; stroke-width: 1; fill: none; }
      .dim     { stroke: #8a8a8a; stroke-width: 1; fill: none; }
      .guide   { stroke: #8a8a8a; stroke-width: 1; fill: none; stroke-dasharray: 4 3; }
      .ln-ink  { stroke: #222; stroke-width: 2; fill: none; }
      .ln-brand{ stroke: #2e6da4; stroke-width: 2.5; fill: none; }
      .ln-pos  { stroke: #3a7d44; stroke-width: 2.5; fill: none; }
      .ln-neg  { stroke: #b22234; stroke-width: 3; fill: none; }
    </style>
    <marker id="ah-ink" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#222"/></marker>
    <marker id="ah-brand" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#2e6da4"/></marker>
    <marker id="ah-pos" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#3a7d44"/></marker>
    <marker id="ah-neg" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="11" refY="4.5" orient="auto"><polygon points="0,0 11,4.5 0,9" fill="#b22234"/></marker>
  </defs>
  <text class="t-h" x="20" y="24">支点の種類と、反力の数</text>
  <rect class="cell" x="6" y="32" width="112" height="180" rx="6"/>
  <rect class="cell" x="132" y="32" width="112" height="180" rx="6"/>
  <rect class="cell" x="256" y="32" width="112" height="180" rx="6"/>
  <rect class="f-surf" x="18" y="44" width="88" height="8"/>
  <polygon class="f-brand" points="62,52 49,76 75,76"/>
  <line class="ln-ink" x1="40" y1="76" x2="84" y2="76"/>
  <line class="dim" x1="44" y1="76" x2="39" y2="83"/>
  <line class="dim" x1="50" y1="76" x2="45" y2="83"/>
  <line class="dim" x1="56" y1="76" x2="51" y2="83"/>
  <line class="dim" x1="62" y1="76" x2="57" y2="83"/>
  <line class="dim" x1="68" y1="76" x2="63" y2="83"/>
  <line class="dim" x1="74" y1="76" x2="69" y2="83"/>
  <line class="dim" x1="80" y1="76" x2="75" y2="83"/>
  <line class="ln-neg" x1="12" y1="114" x2="38" y2="114" marker-end="url(#ah-neg)"/>
  <text class="t-r" x="42" y="118">H</text>
  <line class="ln-neg" x1="74" y1="130" x2="74" y2="100" marker-end="url(#ah-neg)"/>
  <text class="t-r" x="80" y="118">V</text>
  <text class="t-h" x="62" y="154" text-anchor="middle">回転支点</text>
  <text class="t-sd" x="62" y="171" text-anchor="middle">反力 2 つ</text>
  <text class="t-s" x="62" y="187" text-anchor="middle">(H・V)</text>
  <text class="t-s" x="62" y="203" text-anchor="middle">回転だけ自由</text>
  <rect class="f-surf" x="144" y="44" width="88" height="8"/>
  <polygon class="f-brand" points="188,52 175,72 201,72"/>
  <circle cx="181" cy="76" r="4" fill="#ffffff" stroke="#222" stroke-width="1.2"/>
  <circle cx="195" cy="76" r="4" fill="#ffffff" stroke="#222" stroke-width="1.2"/>
  <line class="ln-ink" x1="166" y1="81" x2="210" y2="81"/>
  <line class="ln-neg" x1="188" y1="130" x2="188" y2="100" marker-end="url(#ah-neg)"/>
  <text class="t-r" x="196" y="118">V</text>
  <text class="t-h" x="188" y="154" text-anchor="middle">可動支点</text>
  <text class="t-sd" x="188" y="171" text-anchor="middle">反力 1 つ</text>
  <text class="t-s" x="188" y="187" text-anchor="middle">(V のみ)</text>
  <text class="t-s" x="188" y="203" text-anchor="middle">移動・回転は自由</text>
  <rect class="f-surf" x="274" y="38" width="8" height="48"/>
  <line class="dim" x1="274" y1="44" x2="267" y2="51"/>
  <line class="dim" x1="274" y1="52" x2="267" y2="59"/>
  <line class="dim" x1="274" y1="60" x2="267" y2="67"/>
  <line class="dim" x1="274" y1="68" x2="267" y2="75"/>
  <line class="dim" x1="274" y1="76" x2="267" y2="83"/>
  <line class="dim" x1="274" y1="84" x2="267" y2="91"/>
  <rect class="f-surf" x="282" y="44" width="76" height="8"/>
  <line class="ln-neg" x1="262" y1="114" x2="284" y2="114" marker-end="url(#ah-neg)"/>
  <text class="t-r" x="288" y="118">H</text>
  <line class="ln-neg" x1="310" y1="130" x2="310" y2="100" marker-end="url(#ah-neg)"/>
  <text class="t-r" x="316" y="118">V</text>
  <path class="ln-neg" d="M 342 104 A 10 10 0 1 0 352 114" marker-end="url(#ah-neg)"/>
  <text class="t-r" x="355" y="118">M</text>
  <text class="t-h" x="312" y="154" text-anchor="middle">固定支点</text>
  <text class="t-sd" x="312" y="171" text-anchor="middle">反力 3 つ</text>
  <text class="t-s" x="312" y="187" text-anchor="middle">(H・V・M)</text>
  <text class="t-s" x="312" y="203" text-anchor="middle">動かず回らない</text>
  <line class="rule" x1="20" y1="226" x2="380" y2="226"/>
  <text class="t-h" x="20" y="246">切断面に現れる3つの力 (内力)</text>
  <text class="t-s" x="20" y="264">はりを切ると、左右の面に釣り合う力が現れる</text>
  <rect class="cell" x="6" y="282" width="112" height="198" rx="6"/>
  <rect class="cell" x="132" y="282" width="112" height="198" rx="6"/>
  <rect class="cell" x="256" y="282" width="112" height="198" rx="6"/>
  <rect class="f-brand" x="30" y="330" width="64" height="40"/>
  <line class="ln-ink" x1="28" y1="350" x2="8" y2="350" marker-end="url(#ah-ink)"/>
  <line class="ln-ink" x1="96" y1="350" x2="116" y2="350" marker-end="url(#ah-ink)"/>
  <text class="t-h" x="62" y="420" text-anchor="middle">軸力 N</text>
  <text class="t-sd" x="62" y="440" text-anchor="middle">材軸方向に</text>
  <text class="t-sd" x="62" y="458" text-anchor="middle">引く・押す力</text>
  <polygon class="f-brand" points="156,320 220,332 220,372 156,360"/>
  <line class="ln-ink" x1="148" y1="364" x2="148" y2="318" marker-end="url(#ah-ink)"/>
  <line class="ln-ink" x1="228" y1="328" x2="228" y2="374" marker-end="url(#ah-ink)"/>
  <text class="t-h" x="188" y="420" text-anchor="middle">せん断力 S</text>
  <text class="t-sd" x="188" y="440" text-anchor="middle">材軸と直角に</text>
  <text class="t-sd" x="188" y="458" text-anchor="middle">ずらす力</text>
  <path class="f-brand" d="M 280 322 Q 312 356 344 322 L 344 362 Q 312 396 280 362 Z"/>
  <path class="ln-ink" d="M 278 360 A 18 18 0 0 1 278 324" marker-end="url(#ah-ink)"/>
  <path class="ln-ink" d="M 346 360 A 18 18 0 0 0 346 324" marker-end="url(#ah-ink)"/>
  <text class="t-h" x="312" y="420" text-anchor="middle">曲げモーメント M</text>
  <text class="t-sd" x="312" y="440" text-anchor="middle">材を曲げる</text>
  <text class="t-sd" x="312" y="458" text-anchor="middle">回転の力</text>
</svg>
