<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="先行作業 B・C がすべて完了しないと、後続作業 D は開始できない">
  <defs>
    <marker markerUnits="userSpaceOnUse" id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <style>
    .label    { font-family: "Hiragino Sans","Yu Gothic",sans-serif; font-size: 18px; fill: #222; font-weight: 600; }
    .title    { font-family: "Hiragino Sans","Yu Gothic",sans-serif; font-size: 15px; fill: #222; font-weight: 600; }
    .note     { font-family: "Hiragino Sans","Yu Gothic",sans-serif; font-size: 13px; fill: #555; }
    .node-num { font-family: "Hiragino Sans","Yu Gothic",sans-serif; font-size: 18px; fill: #1a3a5c; font-weight: 600; }
    .emph     { font-family: "Hiragino Sans","Yu Gothic",sans-serif; font-size: 14px; fill: #b22234; font-weight: 600; }
    .annotation { font-family: "Hiragino Sans","Yu Gothic",sans-serif; font-size: 12px; fill: #2e6da4; }
  </style>

  <!-- Title -->
  <text x="200" y="44" text-anchor="middle" class="title">先行作業の完了依存（結合点の役割）</text>
  <text x="200" y="68" text-anchor="middle" class="note">B・C がすべて完了して初めて D が開始できる</text>

  <!-- start nodes on left -->
  <circle cx="70" cy="180" r="28" fill="#ffffff" stroke="#2e6da4" stroke-width="2.5"/>
  <text x="70" y="189" text-anchor="middle" class="node-num">①</text>

  <circle cx="70" cy="290" r="28" fill="#ffffff" stroke="#2e6da4" stroke-width="2.5"/>
  <text x="70" y="299" text-anchor="middle" class="node-num">②</text>

  <!-- center node (junction) — highlighted -->
  <circle cx="220" cy="235" r="32" fill="#fff3cd" stroke="#d4a017" stroke-width="2.5"/>
  <text x="220" y="244" text-anchor="middle" class="node-num">③</text>

  <!-- end node on right -->
  <circle cx="350" cy="235" r="28" fill="#ffffff" stroke="#2e6da4" stroke-width="2.5"/>
  <text x="350" y="244" text-anchor="middle" class="node-num">④</text>

  <!-- arrows in -->
  <line x1="97" y1="192" x2="190" y2="220" stroke="#222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="132" y="196" text-anchor="middle" class="label">B</text>

  <line x1="97" y1="278" x2="190" y2="250" stroke="#222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="132" y="278" text-anchor="middle" class="label">C</text>

  <!-- arrow out -->
  <line x1="252" y1="235" x2="322" y2="235" stroke="#222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="287" y="222" text-anchor="middle" class="label">D</text>

  <!-- junction annotation -->
  <line x1="220" y1="267" x2="220" y2="308" stroke="#d4a017" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="220" y="322" text-anchor="middle" class="annotation">すべての先行作業が</text>
  <text x="220" y="338" text-anchor="middle" class="annotation">合流する結合点</text>

  <!-- divider -->
  <line x1="30" y1="368" x2="370" y2="368" stroke="#d7d7d7" stroke-width="1"/>

  <!-- Rule summary -->
  <text x="200" y="396" text-anchor="middle" class="emph">B と C が両方完了 → D が開始できる</text>
  <text x="200" y="424" text-anchor="middle" class="note">結合点③はすべての先行矢線を待つ「合流点」</text>
  <text x="200" y="448" text-anchor="middle" class="note">どちらか一方が遅れると D 全体が遅れる</text>
  <text x="200" y="480" text-anchor="middle" class="note" font-size="11">クリティカルパス分析の基本となる依存関係</text>
</svg>
