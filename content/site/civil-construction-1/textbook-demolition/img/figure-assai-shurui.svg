<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="油圧圧砕機の種類。圧砕機には手持式の小型から、ベースマシンに搭載して使う大型まで多くの種類があり、いずれも油圧で圧砕アームを開閉する">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-sec   { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-lab   { font-size: 12px; fill: #222; }
      .t-key   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-warn  { font-size: 12px; font-weight: bold; fill: #b22234; }
      .t-pos   { font-size: 12px; font-weight: bold; fill: #3a7d44; }
      .t-note  { font-size: 11px; fill: #555; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 2; }   /* brand-fill / brand */
      .pos   { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 2; }   /* positive-fill / positive */
      .wrn   { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; } /* warn-fill / warn */
      .dng   { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; } /* danger-fill / danger */
      .gry   { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; } /* surface */
      .card  { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1.5; }
      .box   { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .axis  { stroke: #555; stroke-width: 1.5; fill: none; }
      .thin  { stroke: #8a8a8a; stroke-width: 1; fill: none; }
      .dash  { stroke: #8a8a8a; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; }
      .c-brand { stroke: #2e6da4; stroke-width: 3; fill: none; }
      .c-pos   { stroke: #3a7d44; stroke-width: 3; fill: none; }
      .c-wrn   { stroke: #d4a017; stroke-width: 3; fill: none; }
      .c-dng   { stroke: #b22234; stroke-width: 3; fill: none; }
      .c-dngd  { stroke: #b22234; stroke-width: 2.5; stroke-dasharray: 6 4; fill: none; }
      .ar-b { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .ar-g { stroke: #3a7d44; stroke-width: 2; fill: none; }
      .ar-r { stroke: #b22234; stroke-width: 2; fill: none; }
      .ar-k { stroke: #555; stroke-width: 1.5; fill: none; }
      .boom  { stroke: #8a8a8a; stroke-width: 8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .wire  { stroke: #2e6da4; stroke-width: 3; fill: none; }
      .dot-b { fill: #2e6da4; }
      .dot-g { fill: #3a7d44; }
      .dot-r { fill: #b22234; }
    </style>
    <marker id="as-b" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
    <marker id="as-g" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#3a7d44"/></marker>
    <marker id="as-r" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#b22234"/></marker>
    <marker id="as-k" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
    <marker id="as-ks" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  </defs>
  <text class="t-title" x="200" y="28" text-anchor="middle">油圧圧砕機の種類</text>
  <text class="t-lead" x="200" y="50" text-anchor="middle">手持式から大型まで、サイズの幅が広い</text>
  <rect class="card" x="16" y="62" width="368" height="112" rx="6"/>
    <g transform="translate(92,118) scale(0.55)"><polygon class="gry" points="-44,-12 -10,-12 -10,12 -44,12"/><polygon class="gry" points="-10,-12 10,-16 122,-44 122,-30 10,0"/><polygon class="gry" points="-10,12 10,16 122,44 122,30 10,0"/></g>
  <text class="t-key" x="240" y="112">手持式</text>
  <text class="t-note" x="240" y="132">小型の圧砕機</text>
  <rect class="card" x="16" y="184" width="368" height="196" rx="6"/>
    <g transform="translate(100,282) scale(1.25)"><polygon class="gry" points="-44,-12 -10,-12 -10,12 -44,12"/><polygon class="gry" points="-10,-12 10,-16 122,-44 122,-30 10,0"/><polygon class="gry" points="-10,12 10,16 122,44 122,30 10,0"/></g>
  <text class="t-key" x="270" y="270">大型</text>
  <text class="t-note" x="270" y="290">ベースマシンに</text>
  <text class="t-note" x="270" y="306">搭載して使う</text>
  <rect class="box" x="16" y="392" width="368" height="68" rx="6"/>
  <text class="t-key" x="30" y="416">共通</text>
  <text class="t-lab" x="90" y="416">油圧で圧砕アームを開閉して圧砕する</text>
  <text class="t-key" x="30" y="442">範囲</text>
  <text class="t-lab" x="90" y="442">手持式から大型まで多くの種類がある</text>

</svg>
