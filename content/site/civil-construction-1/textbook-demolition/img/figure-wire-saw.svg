<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="ワイヤソーイング工法。ダイアモンドビーズを埋め込んだワイヤを構造物に回し掛け、駆動装置で走らせてコンクリートを切断する。石切り用の装置を改良した工法">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-sec   { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-lab   { font-size: 12px; fill: #222; }
      .t-key   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-warn  { font-size: 12px; font-weight: bold; fill: #b22234; }
      .t-pos   { font-size: 12px; font-weight: bold; fill: #3a7d44; }
      .t-note  { font-size: 11px; fill: #555; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 2; }   /* brand-fill / brand */
      .pos   { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 2; }   /* positive-fill / positive */
      .wrn   { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; } /* warn-fill / warn */
      .dng   { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; } /* danger-fill / danger */
      .gry   { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; } /* surface */
      .card  { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1.5; }
      .box   { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .axis  { stroke: #555; stroke-width: 1.5; fill: none; }
      .thin  { stroke: #8a8a8a; stroke-width: 1; fill: none; }
      .dash  { stroke: #8a8a8a; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; }
      .c-brand { stroke: #2e6da4; stroke-width: 3; fill: none; }
      .c-pos   { stroke: #3a7d44; stroke-width: 3; fill: none; }
      .c-wrn   { stroke: #d4a017; stroke-width: 3; fill: none; }
      .c-dng   { stroke: #b22234; stroke-width: 3; fill: none; }
      .c-dngd  { stroke: #b22234; stroke-width: 2.5; stroke-dasharray: 6 4; fill: none; }
      .ar-b { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .ar-g { stroke: #3a7d44; stroke-width: 2; fill: none; }
      .ar-r { stroke: #b22234; stroke-width: 2; fill: none; }
      .ar-k { stroke: #555; stroke-width: 1.5; fill: none; }
      .boom  { stroke: #8a8a8a; stroke-width: 8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .wire  { stroke: #2e6da4; stroke-width: 3; fill: none; }
      .dot-b { fill: #2e6da4; }
      .dot-g { fill: #3a7d44; }
      .dot-r { fill: #b22234; }
    </style>
    <marker id="ws-b" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
    <marker id="ws-g" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#3a7d44"/></marker>
    <marker id="ws-r" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#b22234"/></marker>
    <marker id="ws-k" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
    <marker id="ws-ks" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  </defs>
  <text class="t-title" x="200" y="28" text-anchor="middle">ワイヤソーイング工法</text>
  <text class="t-lead" x="200" y="50" text-anchor="middle">ビーズ付きワイヤを走らせて切る</text>
  <g transform="translate(0,16)">
  <rect class="gry" x="100" y="132" width="100" height="56"/>
  <text class="t-lab" x="150" y="164" text-anchor="middle">コンクリート</text>
  <path class="wire" d="M 300 136 L 70 112 Q 40 160 70 208 L 300 184"/>
  <polygon class="dot-b" points="182,124 194,119 194,130"/>
  <polygon class="dot-b" points="198,196 186,191 186,201"/>
  <circle class="gry" cx="300" cy="160" r="26"/>
  <text class="t-lab" x="300" y="165" text-anchor="middle">駆動</text>
  <text class="t-key" x="130" y="92">ワイヤソー</text>
  <line class="thin" x1="150" y1="98" x2="150" y2="118"/>
  <text class="t-note" x="300" y="206" text-anchor="middle">矢印の向きに走らせる</text>
  </g>
  <text class="t-sec" x="16" y="292">ワイヤの拡大</text>
  <line class="wire" x1="30" y1="329" x2="370" y2="329"/>
  <rect class="brand" x="42" y="322" width="14" height="14" rx="3"/>
  <rect class="brand" x="66" y="322" width="14" height="14" rx="3"/>
  <rect class="brand" x="90" y="322" width="14" height="14" rx="3"/>
  <rect class="brand" x="114" y="322" width="14" height="14" rx="3"/>
  <rect class="brand" x="138" y="322" width="14" height="14" rx="3"/>
  <rect class="brand" x="162" y="322" width="14" height="14" rx="3"/>
  <rect class="brand" x="186" y="322" width="14" height="14" rx="3"/>
  <rect class="brand" x="210" y="322" width="14" height="14" rx="3"/>
  <rect class="brand" x="234" y="322" width="14" height="14" rx="3"/>
  <rect class="brand" x="258" y="322" width="14" height="14" rx="3"/>
  <rect class="brand" x="282" y="322" width="14" height="14" rx="3"/>
  <rect class="brand" x="306" y="322" width="14" height="14" rx="3"/>
  <rect class="brand" x="330" y="322" width="14" height="14" rx="3"/>
  <text class="t-note" x="200" y="360" text-anchor="middle">ダイアモンドビーズを埋め込んだワイヤソー</text>
  <rect class="box" x="16" y="392" width="368" height="94" rx="6"/>
  <text class="t-key" x="30" y="416">原理</text>
  <text class="t-lab" x="90" y="416">ビーズ付きワイヤで構造物を切断する</text>
  <text class="t-key" x="30" y="442">由来</text>
  <text class="t-lab" x="90" y="442">石切り用の装置を改良したもの</text>
  <text class="t-key" x="30" y="468">ほか</text>
  <text class="t-lab" x="90" y="468">カッタ・コアドリル・ウォータージェット</text>

</svg>
