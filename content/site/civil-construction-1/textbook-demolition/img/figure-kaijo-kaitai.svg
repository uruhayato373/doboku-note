<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="階上解体工法。クレーンで解体用機械を建物の屋上へ上げ、上から順に解体する。床版と梁に支保工を設置し、建物の周囲には足場を設ける。隣接構造物との離隔が小さい都市部で多く採用される">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-sec   { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-lab   { font-size: 12px; fill: #222; }
      .t-key   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-warn  { font-size: 12px; font-weight: bold; fill: #b22234; }
      .t-pos   { font-size: 12px; font-weight: bold; fill: #3a7d44; }
      .t-note  { font-size: 11px; fill: #555; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 2; }   /* brand-fill / brand */
      .pos   { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 2; }   /* positive-fill / positive */
      .wrn   { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; } /* warn-fill / warn */
      .dng   { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; } /* danger-fill / danger */
      .gry   { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; } /* surface */
      .card  { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1.5; }
      .box   { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .axis  { stroke: #555; stroke-width: 1.5; fill: none; }
      .thin  { stroke: #8a8a8a; stroke-width: 1; fill: none; }
      .dash  { stroke: #8a8a8a; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; }
      .c-brand { stroke: #2e6da4; stroke-width: 3; fill: none; }
      .c-pos   { stroke: #3a7d44; stroke-width: 3; fill: none; }
      .c-wrn   { stroke: #d4a017; stroke-width: 3; fill: none; }
      .c-dng   { stroke: #b22234; stroke-width: 3; fill: none; }
      .c-dngd  { stroke: #b22234; stroke-width: 2.5; stroke-dasharray: 6 4; fill: none; }
      .ar-b { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .ar-g { stroke: #3a7d44; stroke-width: 2; fill: none; }
      .ar-r { stroke: #b22234; stroke-width: 2; fill: none; }
      .ar-k { stroke: #555; stroke-width: 1.5; fill: none; }
      .boom  { stroke: #8a8a8a; stroke-width: 8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .wire  { stroke: #2e6da4; stroke-width: 3; fill: none; }
      .dot-b { fill: #2e6da4; }
      .dot-g { fill: #3a7d44; }
      .dot-r { fill: #b22234; }
    </style>
    <marker id="kj-b" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
    <marker id="kj-g" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#3a7d44"/></marker>
    <marker id="kj-r" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#b22234"/></marker>
    <marker id="kj-k" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
    <marker id="kj-ks" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><polygon points="0,0 9,4 0,8" fill="#555"/></marker>
  </defs>
  <text class="t-title" x="200" y="28" text-anchor="middle">階上解体工法</text>
  <text class="t-lead" x="200" y="50" text-anchor="middle">屋上に機械を上げて、上の階から順に解体</text>
  <g transform="translate(0,30)">
  <line class="axis" x1="16" y1="300" x2="384" y2="300"/>
  <rect class="gry" x="20" y="190" width="50" height="110"/>
  <text class="t-note" x="45" y="240" text-anchor="middle">隣接</text><text class="t-note" x="45" y="254" text-anchor="middle">構造物</text>
  <rect class="gry" x="330" y="210" width="50" height="90"/>
  <text class="t-note" x="355" y="250" text-anchor="middle">隣接</text><text class="t-note" x="355" y="264" text-anchor="middle">構造物</text>
  <rect class="card" x="92" y="100" width="12" height="200"/><rect class="card" x="296" y="100" width="12" height="200"/><line class="thin" x1="92" y1="100" x2="104" y2="100"/><line class="thin" x1="296" y1="100" x2="308" y2="100"/><line class="thin" x1="92" y1="114.3" x2="104" y2="114.3"/><line class="thin" x1="296" y1="114.3" x2="308" y2="114.3"/><line class="thin" x1="92" y1="128.6" x2="104" y2="128.6"/><line class="thin" x1="296" y1="128.6" x2="308" y2="128.6"/><line class="thin" x1="92" y1="142.9" x2="104" y2="142.9"/><line class="thin" x1="296" y1="142.9" x2="308" y2="142.9"/><line class="thin" x1="92" y1="157.2" x2="104" y2="157.2"/><line class="thin" x1="296" y1="157.2" x2="308" y2="157.2"/><line class="thin" x1="92" y1="171.5" x2="104" y2="171.5"/><line class="thin" x1="296" y1="171.5" x2="308" y2="171.5"/><line class="thin" x1="92" y1="185.8" x2="104" y2="185.8"/><line class="thin" x1="296" y1="185.8" x2="308" y2="185.8"/><line class="thin" x1="92" y1="200.10000000000002" x2="104" y2="200.10000000000002"/><line class="thin" x1="296" y1="200.10000000000002" x2="308" y2="200.10000000000002"/><line class="thin" x1="92" y1="214.4" x2="104" y2="214.4"/><line class="thin" x1="296" y1="214.4" x2="308" y2="214.4"/><line class="thin" x1="92" y1="228.70000000000002" x2="104" y2="228.70000000000002"/><line class="thin" x1="296" y1="228.70000000000002" x2="308" y2="228.70000000000002"/><line class="thin" x1="92" y1="243" x2="104" y2="243"/><line class="thin" x1="296" y1="243" x2="308" y2="243"/><line class="thin" x1="92" y1="257.3" x2="104" y2="257.3"/><line class="thin" x1="296" y1="257.3" x2="308" y2="257.3"/><line class="thin" x1="92" y1="271.6" x2="104" y2="271.6"/><line class="thin" x1="296" y1="271.6" x2="308" y2="271.6"/><line class="thin" x1="92" y1="285.9" x2="104" y2="285.9"/><line class="thin" x1="296" y1="285.9" x2="308" y2="285.9"/>
  <rect class="brand" x="112" y="116" width="6" height="184"/><rect class="brand" x="200" y="116" width="6" height="184"/><rect class="brand" x="288" y="116" width="6" height="184"/><rect class="brand" x="106" y="116" width="188" height="6"/><rect class="brand" x="106" y="162" width="188" height="6"/><rect class="brand" x="106" y="208" width="188" height="6"/><rect class="brand" x="106" y="254" width="188" height="6"/><rect class="pos" x="146" y="122" width="6" height="40"/><rect class="pos" x="146" y="168" width="6" height="40"/><rect class="pos" x="194" y="122" width="6" height="40"/><rect class="pos" x="194" y="168" width="6" height="40"/><rect class="pos" x="246" y="122" width="6" height="40"/><rect class="pos" x="246" y="168" width="6" height="40"/>
  <rect class="gry" x="166" y="108" width="52" height="8"/>
  <rect class="brand" x="170" y="86" width="44" height="22"/>
  <path class="boom" d="M 206 90 L 240 60 L 264 106"/>
  <polygon class="dng" points="258,102 272,104 268,116"/>
  <line class="boom" x1="192" y1="44" x2="384" y2="44"/>
  <line class="ar-b" x1="192" y1="44" x2="192" y2="84" marker-end="url(#kj-b)"/>
  <text class="t-key" x="330" y="36" text-anchor="middle">クレーン</text>
  <text class="t-note" x="184" y="68" text-anchor="end">屋上へ吊り上げ</text>
  <text class="t-pos" x="170" y="190" text-anchor="end">支保工</text>
  <line class="ar-k" x1="72" y1="282" x2="90" y2="282" marker-end="url(#kj-k)" marker-start="url(#kj-ks)"/>
  <text class="t-note" x="82" y="318" text-anchor="middle">離隔が小さい</text>
  </g>
  <rect class="box" x="16" y="392" width="368" height="94" rx="6"/>
  <text class="t-key" x="30" y="416">方法</text>
  <text class="t-lab" x="90" y="416">クレーンで機械を屋上へ上げ、上から解体</text>
  <text class="t-key" x="30" y="442">支保工</text>
  <text class="t-lab" x="90" y="442">床版と梁に支保工を設置して施工する</text>
  <text class="t-key" x="30" y="468">採用</text>
  <text class="t-lab" x="90" y="468">隣接構造物との離隔が小さい都市部</text>

</svg>
