<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="架設通路の設置基準。勾配は30度以下、15度を超える場合は踏さんを設け、墜落危険箇所には手すり85cm以上、高さ8m以上の登り桟橋は7m以内ごとに踊り場を設ける">
  <text x="200" y="22" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1a3a5c">架設通路：勾配30°以下・15°超で踏さん・手すり85cm</text>

  <!-- 地盤 -->
  <line x1="40" y1="392" x2="200" y2="392" stroke="#8a8a8a" stroke-width="2"/>
  <path d="M44 392 v8 M60 392 v8 M76 392 v8 M92 392 v8" stroke="#8a8a8a" stroke-width="1"/>

  <!-- 通路面（勾配30°） -->
  <polygon points="60,392 316,244 316,262 60,410" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>

  <!-- 踏さん（すべり止め） -->
  <path d="M96 383 l9 -6 M128 365 l9 -6 M160 346 l9 -6 M192 328 l9 -6 M224 309 l9 -6 M256 291 l9 -6 M288 272 l9 -6" stroke="#1a3a5c" stroke-width="2"/>

  <!-- 手すり 85cm（通路上） -->
  <line x1="66" y1="360" x2="322" y2="212" stroke="#2e6da4" stroke-width="2"/>
  <line x1="72" y1="388" x2="72" y2="362" stroke="#2e6da4" stroke-width="1.5"/>
  <line x1="180" y1="325" x2="180" y2="299" stroke="#2e6da4" stroke-width="1.5"/>
  <line x1="300" y1="256" x2="300" y2="230" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="232" y="250" font-family="sans-serif" font-size="12" fill="#222">手すり 85cm 以上</text>

  <!-- 角度マーク -->
  <path d="M108 392 A48 48 0 0 0 96 376" fill="none" stroke="#1a3a5c" stroke-width="1.5"/>
  <text x="128" y="384" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1a3a5c">30° 以下</text>

  <!-- 踏さん注記 -->
  <text x="150" y="430" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8a8a">勾配 15°超 → 踏さん（すべり止め）</text>

  <!-- 補足 -->
  <rect x="30" y="444" width="340" height="42" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="200" y="462" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">高さ 8m 以上の登り桟橋 → 7m 以内ごとに踊り場</text>
  <text x="200" y="479" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8a8a">根拠：労働安全衛生規則 第552条</text>
</svg>
