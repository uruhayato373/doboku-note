<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="作業構台の部材構成。支柱の上にはりと大引きと作業床を重ね、端に手すりと中桟、脚元に根入れと根がらみ、支柱間に筋かいを設ける">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
    </style>
  </defs>

  <!-- 地盤 -->
  <rect x="20" y="356" width="236" height="76" fill="#f5f5f5"/>
  <line x1="20" y1="356" x2="256" y2="356" stroke="#555" stroke-width="1.5"/>
  <text x="26" y="374" font-size="11" fill="#8a8a8a">地盤</text>

  <!-- 手すり・中桟 -->
  <rect x="54" y="34" width="4" height="60" fill="#8a8a8a"/>
  <rect x="148" y="34" width="4" height="60" fill="#8a8a8a"/>
  <rect x="242" y="34" width="4" height="60" fill="#8a8a8a"/>
  <rect x="54" y="34" width="192" height="5" fill="#2e6da4"/>
  <rect x="54" y="64" width="192" height="4" fill="#2e6da4"/>

  <!-- 作業床・大引き・はり -->
  <rect x="50" y="94" width="200" height="12" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <rect x="60" y="106" width="10" height="10" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
  <rect x="100" y="106" width="10" height="10" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
  <rect x="140" y="106" width="10" height="10" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
  <rect x="180" y="106" width="10" height="10" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
  <rect x="220" y="106" width="10" height="10" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
  <rect x="50" y="116" width="200" height="12" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>

  <!-- 支柱 -->
  <rect x="66" y="128" width="8" height="288" fill="#555"/>
  <rect x="146" y="128" width="8" height="288" fill="#555"/>
  <rect x="226" y="128" width="8" height="288" fill="#555"/>

  <!-- 水平つなぎ・筋かい -->
  <rect x="74" y="224" width="72" height="3" fill="#555"/>
  <rect x="154" y="224" width="72" height="3" fill="#555"/>
  <line x1="74" y1="227" x2="146" y2="326" stroke="#555" stroke-width="1.5"/>
  <line x1="146" y1="227" x2="74" y2="326" stroke="#555" stroke-width="1.5"/>
  <line x1="154" y1="227" x2="226" y2="326" stroke="#555" stroke-width="1.5"/>
  <line x1="226" y1="227" x2="154" y2="326" stroke="#555" stroke-width="1.5"/>

  <!-- 根がらみ -->
  <rect x="74" y="326" width="72" height="5" fill="#3a7d44"/>
  <rect x="154" y="326" width="72" height="5" fill="#3a7d44"/>

  <!-- 根入れ -->
  <line x1="246" y1="356" x2="246" y2="416" stroke="#2e6da4" stroke-width="1"/>
  <line x1="240" y1="356" x2="252" y2="356" stroke="#2e6da4" stroke-width="1"/>
  <line x1="240" y1="416" x2="252" y2="416" stroke="#2e6da4" stroke-width="1"/>

  <!-- ラベルと引き出し線 -->
  <line x1="246" y1="37" x2="262" y2="37" stroke="#8a8a8a" stroke-width="1"/>
  <text x="266" y="41" font-size="12" fill="#222">手すり85cm以上</text>
  <line x1="246" y1="66" x2="262" y2="66" stroke="#8a8a8a" stroke-width="1"/>
  <text x="266" y="70" font-size="12" fill="#222">中桟35〜50cm</text>
  <line x1="250" y1="98" x2="262" y2="88" stroke="#8a8a8a" stroke-width="1"/>
  <text x="266" y="92" font-size="12" fill="#222">作業床</text>
  <line x1="230" y1="110" x2="262" y2="112" stroke="#8a8a8a" stroke-width="1"/>
  <text x="266" y="116" font-size="12" fill="#222">大引き</text>
  <line x1="250" y1="122" x2="262" y2="138" stroke="#8a8a8a" stroke-width="1"/>
  <text x="266" y="142" font-size="12" fill="#222">はり</text>
  <line x1="234" y1="182" x2="262" y2="182" stroke="#8a8a8a" stroke-width="1"/>
  <text x="266" y="186" font-size="12" fill="#222">支柱</text>
  <line x1="226" y1="225" x2="262" y2="225" stroke="#8a8a8a" stroke-width="1"/>
  <text x="266" y="229" font-size="12" fill="#222">水平つなぎ</text>
  <line x1="190" y1="277" x2="262" y2="277" stroke="#8a8a8a" stroke-width="1"/>
  <text x="266" y="281" font-size="12" fill="#222">筋かい</text>
  <line x1="226" y1="329" x2="262" y2="329" stroke="#8a8a8a" stroke-width="1"/>
  <text x="266" y="333" font-size="12" fill="#222">根がらみ</text>
  <text x="266" y="390" font-size="12" fill="#222">根入れ</text>

  <!-- 補足 -->
  <rect x="24" y="440" width="352" height="30" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="200" y="459" text-anchor="middle" font-size="11" fill="#222">組立図には支柱・作業床・はり・大引きの配置と寸法を示す</text>
</svg>
