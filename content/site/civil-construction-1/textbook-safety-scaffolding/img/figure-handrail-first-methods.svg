<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="手すり先行工法の3方式。手すり据置き方式は手前の構面の全層に手すりを付け奥の構面に交さ筋かいを残す型もある、手すり先行専用足場方式は手すりの機能をもつ部材を足場に組み込む、手すり先送り方式は最上層の端へ手すりを上に送る">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/>
    </marker>
  </defs>

  <!-- ===== 1 手すり据置き方式 ===== -->
  <rect x="14" y="12" width="372" height="144" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <!-- 建わく・床 -->
  <rect x="50" y="26" width="4" height="118" fill="#555"/>
  <rect x="146" y="26" width="4" height="118" fill="#555"/>
  <rect x="50" y="122" width="100" height="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <rect x="50" y="78" width="100" height="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <rect x="50" y="34" width="100" height="6" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- 奥の構面：交さ筋かい（破線） -->
  <line x1="58" y1="88" x2="142" y2="120" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="142" y1="88" x2="58" y2="120" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- 手前の構面：全層に据置き手すり（実線） -->
  <rect x="54" y="20" width="92" height="4" fill="#2e6da4"/>
  <rect x="54" y="62" width="92" height="4" fill="#2e6da4"/>
  <rect x="54" y="106" width="92" height="4" fill="#2e6da4"/>
  <!-- 作業者 -->
  <circle cx="100" cy="58" r="5" fill="none" stroke="#222" stroke-width="1.5"/>
  <line x1="100" y1="63" x2="100" y2="78" stroke="#222" stroke-width="1.5"/>
  <line x1="100" y1="68" x2="88" y2="58" stroke="#222" stroke-width="1.5"/>
  <!-- 説明 -->
  <text x="186" y="40" font-size="13" font-weight="bold" fill="#1a3a5c">① 手すり据置き方式</text>
  <text x="186" y="66" font-size="12" fill="#222">据置型の手すりを取り付ける</text>
  <line x1="186" y1="84" x2="200" y2="84" stroke="#2e6da4" stroke-width="4"/>
  <text x="206" y="88" font-size="12" fill="#222">手前の構面：全層に手すり</text>
  <line x1="186" y1="106" x2="200" y2="106" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="206" y="110" font-size="12" fill="#222">奥の構面：交さ筋かいを</text>
  <text x="206" y="128" font-size="12" fill="#222">残す型もある</text>

  <!-- ===== 2 手すり先行専用足場方式 ===== -->
  <rect x="14" y="164" width="372" height="144" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <rect x="49" y="178" width="6" height="118" fill="#3a7d44"/>
  <rect x="145" y="178" width="6" height="118" fill="#3a7d44"/>
  <rect x="50" y="274" width="100" height="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <rect x="50" y="230" width="100" height="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <rect x="50" y="186" width="100" height="6" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- 手すり機能をもつ部材 -->
  <rect x="55" y="172" width="90" height="4" fill="#2e6da4"/>
  <rect x="55" y="214" width="90" height="4" fill="#2e6da4"/>
  <rect x="55" y="258" width="90" height="4" fill="#2e6da4"/>
  <!-- 作業者 -->
  <circle cx="100" cy="210" r="5" fill="none" stroke="#222" stroke-width="1.5"/>
  <line x1="100" y1="215" x2="100" y2="230" stroke="#222" stroke-width="1.5"/>
  <line x1="100" y1="220" x2="88" y2="210" stroke="#222" stroke-width="1.5"/>
  <!-- 説明 -->
  <text x="186" y="192" font-size="13" font-weight="bold" fill="#1a3a5c">② 手すり先行専用足場方式</text>
  <text x="186" y="218" font-size="12" fill="#222">手すりの機能をもつ</text>
  <text x="186" y="240" font-size="12" fill="#222">専用のシステム足場</text>
  <text x="186" y="262" font-size="12" fill="#222">最上層の床を外すとき</text>
  <text x="186" y="280" font-size="12" fill="#222">端の部材を残せる</text>

  <!-- ===== 3 手すり先送り方式 ===== -->
  <rect x="14" y="316" width="372" height="144" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <rect x="50" y="330" width="4" height="118" fill="#555"/>
  <rect x="146" y="330" width="4" height="118" fill="#555"/>
  <rect x="50" y="426" width="100" height="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <rect x="50" y="382" width="100" height="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <rect x="50" y="338" width="100" height="6" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- 手すり（最上層へ送る） -->
  <rect x="54" y="324" width="92" height="4" fill="#2e6da4"/>
  <rect x="54" y="366" width="92" height="3" fill="none" stroke="#2e6da4" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="130" y1="364" x2="130" y2="334" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- 作業者 -->
  <circle cx="90" cy="362" r="5" fill="none" stroke="#222" stroke-width="1.5"/>
  <line x1="90" y1="367" x2="90" y2="382" stroke="#222" stroke-width="1.5"/>
  <line x1="90" y1="372" x2="102" y2="362" stroke="#222" stroke-width="1.5"/>
  <!-- 説明 -->
  <text x="186" y="344" font-size="13" font-weight="bold" fill="#1a3a5c">③ 手すり先送り方式</text>
  <text x="186" y="370" font-size="12" fill="#222">脚柱に沿って上へ送る</text>
  <text x="186" y="392" font-size="12" fill="#222">手すりは最上層の端だけ</text>
  <text x="186" y="414" font-size="12" fill="#222">送る前に交さ筋かい・</text>
  <text x="186" y="432" font-size="12" fill="#222">下桟を先に付ける</text>

  <!-- 共通 -->
  <rect x="30" y="468" width="340" height="26" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="200" y="486" text-anchor="middle" font-size="12" fill="#1a3a5c">共通：乗る前に手すりを先行し、最後まで残す</text>
</svg>
