<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="作業床を上から見た図。床材間のすき間は3cm以下、床材と建地のすき間は12cm未満、作業床の幅は40cm以上">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
    </style>
  </defs>

  <g transform="translate(0 -28)">
    <!-- 床材間 3cm のラベル -->
    <text x="200" y="96" text-anchor="middle" font-size="12" fill="#222">床材どうしのすき間 3cm以下</text>
    <line x1="200" y1="104" x2="200" y2="146" stroke="#8a8a8a" stroke-width="1"/>
    <path d="M200 148 l-3 -6 h6 z" fill="#8a8a8a"/>

    <!-- 建地 -->
    <text x="45" y="140" text-anchor="middle" font-size="11" fill="#555">建地</text>
    <text x="355" y="140" text-anchor="middle" font-size="11" fill="#555">建地</text>
    <circle cx="45" cy="190" r="11" fill="#555"/>
    <circle cx="355" cy="190" r="11" fill="#555"/>

    <!-- 床材 -->
    <rect x="108" y="150" width="86" height="80" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
    <rect x="207" y="150" width="86" height="80" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
    <text x="151" y="195" text-anchor="middle" font-size="12" fill="#1a3a5c">床材</text>
    <text x="250" y="195" text-anchor="middle" font-size="12" fill="#1a3a5c">床材</text>

    <!-- 寸法の引き出し線 -->
    <line x1="56" y1="196" x2="56" y2="258" stroke="#8a8a8a" stroke-width="1"/>
    <line x1="108" y1="230" x2="108" y2="258" stroke="#8a8a8a" stroke-width="1"/>
    <line x1="293" y1="230" x2="293" y2="258" stroke="#8a8a8a" stroke-width="1"/>
    <line x1="344" y1="196" x2="344" y2="258" stroke="#8a8a8a" stroke-width="1"/>

    <!-- 床材と建地 12cm（左右） -->
    <line x1="56" y1="252" x2="108" y2="252" stroke="#2e6da4" stroke-width="1"/>
    <path d="M56 252 l6 -3 v6 z" fill="#2e6da4"/>
    <path d="M108 252 l-6 -3 v6 z" fill="#2e6da4"/>
    <text x="82" y="274" text-anchor="middle" font-size="12" fill="#222">12cm未満</text>
    <line x1="293" y1="252" x2="344" y2="252" stroke="#2e6da4" stroke-width="1"/>
    <path d="M293 252 l6 -3 v6 z" fill="#2e6da4"/>
    <path d="M344 252 l-6 -3 v6 z" fill="#2e6da4"/>
    <text x="318" y="274" text-anchor="middle" font-size="12" fill="#222">12cm未満</text>

    <!-- 幅 40cm -->
    <line x1="108" y1="294" x2="293" y2="294" stroke="#2e6da4" stroke-width="1"/>
    <path d="M108 294 l6 -3 v6 z" fill="#2e6da4"/>
    <path d="M293 294 l-6 -3 v6 z" fill="#2e6da4"/>
    <line x1="108" y1="286" x2="108" y2="302" stroke="#8a8a8a" stroke-width="1"/>
    <line x1="293" y1="286" x2="293" y2="302" stroke="#8a8a8a" stroke-width="1"/>
    <text x="200" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">作業床の幅 40cm以上</text>

    <!-- 境界の読み分け -->
    <rect x="24" y="346" width="172" height="100" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
    <text x="110" y="370" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3a5c">床材どうし</text>
    <text x="110" y="402" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a3a5c">3cm以下</text>
    <text x="110" y="430" text-anchor="middle" font-size="12" fill="#222">3cmちょうどは適合</text>

    <rect x="204" y="346" width="172" height="100" rx="6" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
    <text x="290" y="370" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3a5c">床材と建地</text>
    <text x="290" y="402" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a3a5c">12cm未満</text>
    <text x="290" y="430" text-anchor="middle" font-size="12" fill="#222">12cmちょうどは不適合</text>

    <text x="200" y="474" text-anchor="middle" font-size="11" fill="#555">つり足場は別の基準（作業床はすき間なし）</text>
  </g>
</svg>
