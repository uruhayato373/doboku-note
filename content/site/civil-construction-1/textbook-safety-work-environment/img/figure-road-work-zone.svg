<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="道路上の作業帯の平面図。予告標識、標示板と注意灯、保安灯、固定さくで区分した作業場、交通流の背面にある出入口、残る車線の幅員、さくで区分した歩行者用通路を番号で示した概念図">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; fill: #222; }
      .t { font-size: 12px; fill: #222; }
      .s { font-size: 11px; fill: #555; }
      .n { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .pos { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .sur { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .dot { fill: #ffffff; stroke: #b22234; stroke-width: 1.5; }
    </style>
    <marker id="ar" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker>
  </defs>

  <!-- 道路 -->
  <rect x="70" y="16" width="220" height="268" class="sur"/>

  <!-- 交通流 -->
  <text x="250" y="30" text-anchor="middle" class="s">交通流</text>
  <line x1="250" y1="38" x2="250" y2="100" stroke="#2e6da4" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 作業場 -->
  <rect x="70" y="130" width="110" height="132" class="brand"/>
  <text x="125" y="212" text-anchor="middle" class="t">作業場</text>
  <path d="M96 262 L70 262 L70 130 L180 130 L180 262 L136 262" fill="none" stroke="#555" stroke-width="3"/>

  <!-- 標示板と注意灯 -->
  <rect x="82" y="108" width="88" height="12" rx="2" class="warn"/>
  <circle cx="88" cy="98" r="5" fill="#f8d7da" stroke="#b22234" stroke-width="1.5"/>
  <circle cx="164" cy="98" r="5" fill="#f8d7da" stroke="#b22234" stroke-width="1.5"/>

  <!-- 保安灯 -->
  <circle cx="180" cy="138" r="3.5" fill="#d4a017"/>
  <circle cx="180" cy="170" r="3.5" fill="#d4a017"/>
  <circle cx="180" cy="202" r="3.5" fill="#d4a017"/>
  <circle cx="180" cy="234" r="3.5" fill="#d4a017"/>
  <circle cx="180" cy="258" r="3.5" fill="#d4a017"/>

  <!-- 予告標識 -->
  <rect x="34" y="40" width="30" height="20" rx="3" class="warn"/>

  <!-- 残る車線の幅 -->
  <line x1="184" y1="190" x2="288" y2="190" stroke="#555" stroke-width="1.5"/>
  <line x1="184" y1="184" x2="184" y2="196" stroke="#555" stroke-width="1.5"/>
  <line x1="288" y1="184" x2="288" y2="196" stroke="#555" stroke-width="1.5"/>
  <text x="236" y="182" text-anchor="middle" class="s">3m以上</text>

  <!-- 出入口（交通流の背面から） -->
  <path d="M216 232 L216 296 L116 296 L116 268" fill="none" stroke="#2e6da4" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 歩行者用通路と移動さく -->
  <line x1="298" y1="16" x2="298" y2="284" stroke="#555" stroke-width="2.5" stroke-dasharray="5 4"/>
  <rect x="308" y="16" width="40" height="268" class="pos"/>
  <line x1="328" y1="50" x2="328" y2="120" stroke="#2e6da4" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="328" y1="260" x2="328" y2="220" stroke="#2e6da4" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 番号 -->
  <circle cx="49" cy="80" r="10" class="dot"/><text x="49" y="84" text-anchor="middle" class="n">1</text>
  <circle cx="126" cy="80" r="10" class="dot"/><text x="126" y="84" text-anchor="middle" class="n">2</text>
  <circle cx="200" cy="154" r="10" class="dot"/><text x="200" y="158" text-anchor="middle" class="n">3</text>
  <circle cx="125" cy="166" r="10" class="dot"/><text x="125" y="170" text-anchor="middle" class="n">4</text>
  <circle cx="150" cy="274" r="10" class="dot"/><text x="150" y="278" text-anchor="middle" class="n">5</text>
  <circle cx="262" cy="218" r="10" class="dot"/><text x="262" y="222" text-anchor="middle" class="n">6</text>
  <circle cx="328" cy="170" r="10" class="dot"/><text x="328" y="174" text-anchor="middle" class="n">7</text>

  <!-- 凡例 -->
  <circle cx="44" cy="318" r="9" class="dot"/><text x="44" y="322" text-anchor="middle" class="n">1</text>
  <text x="62" y="323" class="t">予告標識・標示板：前方50〜500mに設置</text>
  <circle cx="44" cy="342" r="9" class="dot"/><text x="44" y="346" text-anchor="middle" class="n">2</text>
  <text x="62" y="347" class="t">標示板（内部照明式）と注意灯：200m前方から</text>
  <circle cx="44" cy="366" r="9" class="dot"/><text x="44" y="370" text-anchor="middle" class="n">3</text>
  <text x="62" y="371" class="t">保安灯：高さ1m程度、夜間150m前方から</text>
  <circle cx="44" cy="390" r="9" class="dot"/><text x="44" y="394" text-anchor="middle" class="n">4</text>
  <text x="62" y="395" class="t">作業場の区分：固定さく等で公衆の立入りを防ぐ</text>
  <circle cx="44" cy="414" r="9" class="dot"/><text x="44" y="418" text-anchor="middle" class="n">5</text>
  <text x="62" y="419" class="t">出入口：交通流の背面から。使わない間は閉鎖</text>
  <circle cx="44" cy="438" r="9" class="dot"/><text x="44" y="442" text-anchor="middle" class="n">6</text>
  <text x="62" y="443" class="t">残る車線：1車線3m以上、2車線は5.5m以上</text>
  <circle cx="44" cy="462" r="9" class="dot"/><text x="44" y="466" text-anchor="middle" class="n">7</text>
  <text x="62" y="467" class="t">歩行者用通路：幅0.90m以上、有効高さ2.1m以上</text>
  <text x="44" y="490" class="s">数値は令和元年改正の要綱（土木工事編）による</text>
</svg>
