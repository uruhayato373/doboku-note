<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="潜函工法の作業室、気こう室、シャフト、送気管、排気管の配置と、設備ごとの基準値を番号で対応させた概念図">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; fill: #222; }
      .t { font-size: 12px; fill: #222; }
      .s { font-size: 11px; fill: #555; }
      .n { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .sur { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .dot { fill: #ffffff; stroke: #b22234; stroke-width: 1.5; }
      .pipe { fill: none; stroke: #2e6da4; stroke-width: 3; }
      .pipe2 { fill: none; stroke: #555; stroke-width: 3; stroke-dasharray: 6 4; }
    </style>
    <marker id="ar" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker>
  </defs>

  <!-- 地盤 -->
  <rect x="20" y="96" width="360" height="196" class="sur"/>
  <line x1="20" y1="96" x2="380" y2="96" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="26" y="112" class="s">地表</text>

  <!-- 地上設備 -->
  <rect x="26" y="20" width="82" height="28" rx="4" class="brand"/>
  <text x="67" y="38" text-anchor="middle" class="t">空気圧縮機</text>
  <rect x="26" y="56" width="82" height="28" rx="4" class="brand"/>
  <text x="67" y="74" text-anchor="middle" class="t">空気清浄装置</text>
  <polygon points="62,49 72,49 67,55" fill="#2e6da4"/>

  <!-- 気こう室 -->
  <rect x="166" y="40" width="68" height="54" rx="4" class="warn"/>
  <text x="200" y="64" text-anchor="middle" class="t">気こう室</text>
  <text x="200" y="82" text-anchor="middle" class="s">圧力計</text>

  <!-- シャフト -->
  <rect x="190" y="94" width="20" height="150" fill="#ffffff" stroke="#555" stroke-width="1.5"/>

  <!-- 作業室 -->
  <rect x="120" y="244" width="160" height="40" rx="4" class="brand"/>
  <text x="200" y="269" text-anchor="middle" class="t">作業室</text>

  <!-- 送気管（シャフトの外を通す） -->
  <path d="M67 84 L67 264 L120 264" class="pipe"/>
  <polygon points="96,256 96,272 106,264" fill="#d4a017" stroke="#d4a017" stroke-width="1"/>
  <text x="76" y="250" class="s">逆止弁</text>

  <!-- 排気管（専用） -->
  <path d="M234 56 L330 56 L330 40" class="pipe2"/>

  <!-- 番号 -->
  <circle cx="300" cy="264" r="10" class="dot"/><text x="300" y="268" text-anchor="middle" class="n">1</text>
  <circle cx="250" cy="78" r="10" class="dot"/><text x="250" y="82" text-anchor="middle" class="n">2</text>
  <circle cx="44" cy="168" r="10" class="dot"/><text x="44" y="172" text-anchor="middle" class="n">3</text>
  <circle cx="330" cy="26" r="10" class="dot"/><text x="330" y="30" text-anchor="middle" class="n">4</text>
  <circle cx="148" cy="30" r="10" class="dot"/><text x="148" y="34" text-anchor="middle" class="n">5</text>
  <line x1="108" y1="34" x2="138" y2="31" stroke="#b22234" stroke-width="1.5"/>

  <!-- 凡例 -->
  <circle cx="44" cy="318" r="9" class="dot"/><text x="44" y="322" text-anchor="middle" class="n">1</text>
  <text x="62" y="323" class="t">作業室：1人につき気積4m³以上</text>
  <circle cx="44" cy="346" r="9" class="dot"/><text x="44" y="350" text-anchor="middle" class="n">2</text>
  <text x="62" y="351" class="t">気こう室：1人につき床面積0.3m²・気積0.6m³以上</text>
  <circle cx="44" cy="374" r="9" class="dot"/><text x="44" y="378" text-anchor="middle" class="n">3</text>
  <text x="62" y="379" class="t">送気管：シャフトの中を通さず、作業室近くに逆止弁</text>
  <circle cx="44" cy="402" r="9" class="dot"/><text x="44" y="406" text-anchor="middle" class="n">4</text>
  <text x="62" y="407" class="t">排気管：専用管。減圧用は内径53mm以下</text>
  <circle cx="44" cy="430" r="9" class="dot"/><text x="44" y="434" text-anchor="middle" class="n">5</text>
  <text x="62" y="435" class="t">空気圧縮機：吐出空気の温度異常を知らせる警報</text>
  <text x="44" y="466" class="s">圧力計は目盛0.02MPa以下。0.1MPa以上の業務では</text>
  <text x="44" y="482" class="s">気こう室に自記記録圧力計を設ける</text>
</svg>
