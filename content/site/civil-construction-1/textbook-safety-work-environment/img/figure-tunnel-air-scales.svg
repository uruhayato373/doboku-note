<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="坑内の空気と気温のものさし。酸素18%未満、炭酸ガス1.5%超、硫化水素10ppm超は立入禁止。気温は28℃を超えると半月以内ごとに測定し、上限は37℃">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; fill: #222; }
      .b { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t { font-size: 12px; fill: #222; }
      .s { font-size: 11px; fill: #555; }
      .pos { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1; }
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1; }
      .dng { fill: #f8d7da; stroke: #b22234; stroke-width: 1; }
      .sur { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .mk { stroke: #222; stroke-width: 2; }
    </style>
  </defs>

  <!-- 酸素濃度：0〜21%（1%=14.3px、左端x=50） -->
  <text x="30" y="30" class="b">酸素濃度</text>
  <rect x="50" y="44" width="257" height="18" class="dng"/>
  <rect x="307" y="44" width="43" height="18" class="pos"/>
  <line x1="307" y1="38" x2="307" y2="68" class="mk"/>
  <text x="307" y="34" text-anchor="middle" class="b">18%</text>
  <text x="50" y="80" class="s">0</text>
  <text x="350" y="80" text-anchor="end" class="s">21%</text>
  <text x="30" y="98" class="t">18%未満は関係者以外の立入りを禁止（第585条）</text>

  <!-- 炭酸ガス濃度：0〜3%（1%=100px） -->
  <text x="30" y="132" class="b">炭酸ガス濃度</text>
  <rect x="50" y="146" width="150" height="18" class="pos"/>
  <rect x="200" y="146" width="150" height="18" class="dng"/>
  <line x1="200" y1="140" x2="200" y2="170" class="mk"/>
  <text x="200" y="136" text-anchor="middle" class="b">1.5%</text>
  <text x="50" y="182" class="s">0</text>
  <text x="350" y="182" text-anchor="end" class="s">3%</text>
  <text x="30" y="200" class="t">坑内の作業場は1.5%以下。超える場所は立入禁止</text>
  <text x="30" y="216" class="s">停滞するおそれのある坑内は1月以内ごとに測定</text>

  <!-- 硫化水素濃度：0〜20ppm（1ppm=15px） -->
  <text x="30" y="250" class="b">硫化水素濃度</text>
  <rect x="50" y="264" width="150" height="18" class="pos"/>
  <rect x="200" y="264" width="150" height="18" class="dng"/>
  <line x1="200" y1="258" x2="200" y2="288" class="mk"/>
  <text x="200" y="254" text-anchor="middle" class="b">10ppm</text>
  <text x="50" y="300" class="s">0</text>
  <text x="350" y="300" text-anchor="end" class="s">20ppm</text>
  <text x="30" y="318" class="t">10ppmを超える場所は関係者以外の立入りを禁止</text>

  <!-- 気温：20〜40℃（1℃=15px） -->
  <text x="30" y="352" class="b">坑内の気温</text>
  <rect x="50" y="366" width="120" height="18" class="pos"/>
  <rect x="170" y="366" width="135" height="18" class="warn"/>
  <rect x="305" y="366" width="45" height="18" class="dng"/>
  <line x1="170" y1="360" x2="170" y2="390" class="mk"/>
  <line x1="305" y1="360" x2="305" y2="390" class="mk"/>
  <text x="170" y="356" text-anchor="middle" class="b">28℃</text>
  <text x="305" y="356" text-anchor="middle" class="b">37℃</text>
  <text x="50" y="402" class="s">20</text>
  <text x="350" y="402" text-anchor="end" class="s">40℃</text>
  <text x="30" y="420" class="t">28℃を超えるおそれがあれば半月以内ごとに測定</text>
  <text x="30" y="436" class="s">坑内の気温は37℃以下とする（第611条・第612条）</text>

  <rect x="30" y="452" width="340" height="34" rx="6" class="sur"/>
  <text x="44" y="474" class="t">通気設備のある坑内：通気量を半月以内ごとに測定</text>
</svg>
