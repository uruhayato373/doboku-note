<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="土石流危険河川での作業の流れ。作業前の調査と記録、規程の作成、降雨量の把握、監視、前兆を把握したときの規程の措置、急迫した危険での退避、警報と避難設備、避難訓練の順に整理したフロー図">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; fill: #222; }
      .b { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t { font-size: 12px; fill: #222; }
      .s { font-size: 11px; fill: #555; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .pos { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .dng { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
    </style>
    <marker id="ar" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker>
  </defs>

  <!-- 1 -->
  <rect x="30" y="14" width="340" height="46" rx="6" class="brand"/>
  <text x="44" y="33" class="b">1 作業前：上流の河川と周辺を調査し、記録</text>
  <text x="44" y="50" class="s">河川の形状・河床勾配・崩壊地の状況など（第575条の9）</text>
  <line x1="200" y1="60" x2="200" y2="72" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 2 -->
  <rect x="30" y="74" width="340" height="62" rx="6" class="brand"/>
  <text x="44" y="94" class="b">2 規程を定める（第575条の10）</text>
  <text x="44" y="112" class="s">雨量の把握方法／降雨・融雪・地震のときの措置／</text>
  <text x="44" y="128" class="s">前兆を把握したときの措置／警報と避難の方法／訓練</text>
  <line x1="200" y1="136" x2="200" y2="148" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 3 -->
  <rect x="30" y="150" width="340" height="46" rx="6" class="warn"/>
  <text x="44" y="169" class="b">3 日々：降雨量を把握して記録</text>
  <text x="44" y="186" class="s">作業開始前24時間、開始後は1時間ごと（第575条の11）</text>
  <line x1="200" y1="196" x2="200" y2="208" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 4 -->
  <rect x="30" y="210" width="340" height="46" rx="6" class="warn"/>
  <text x="44" y="229" class="b">4 降雨で発生のおそれ：監視人の配置など</text>
  <text x="44" y="246" class="s">土石流の発生を早期に把握する措置（第575条の12）</text>
  <line x1="200" y1="256" x2="200" y2="268" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 5 -->
  <rect x="30" y="270" width="340" height="62" rx="6" class="warn"/>
  <text x="44" y="290" class="b">5 前兆を把握：規程の措置をとる（第575条の10）</text>
  <text x="44" y="308" class="s">前兆の例：水が急に濁る、流木が混じる、山鳴りがする、</text>
  <text x="44" y="324" class="s">雨が続くのに水位が下がる、石がぶつかる音がする</text>
  <line x1="200" y1="332" x2="200" y2="344" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 6 -->
  <rect x="30" y="346" width="340" height="46" rx="6" class="dng"/>
  <text x="44" y="365" class="b">6 急迫した危険：直ちに退避（第575条の13）</text>
  <text x="44" y="382" class="t">作業を中止し、作業従事者を安全な場所へ退避させる</text>
  <line x1="200" y1="392" x2="200" y2="404" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 7 -->
  <rect x="30" y="406" width="340" height="78" rx="6" class="pos"/>
  <text x="44" y="425" class="b">7 平時の備え：設備と訓練（第575条の14〜16）</text>
  <text x="44" y="443" class="t">警報設備と避難設備を、常に使える状態にしておく</text>
  <text x="44" y="459" class="s">警報：サイレン・非常ベル　避難：登り桟橋・はしご</text>
  <text x="44" y="475" class="t">避難訓練：開始後遅滞なく1回、以後6か月以内ごと</text>
</svg>
