<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="酸素欠乏危険場所を第1種と第2種に仕分ける比較図。第1種は酸素欠乏だけ、第2種は硫化水素中毒も加わる。海水が滞留した設備、汚水や腐泥を入れた設備、大臣が定める場所が第2種">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; fill: #222; }
      .b { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t { font-size: 12px; fill: #222; }
      .s { font-size: 11px; fill: #555; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .dng { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .sur { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- 第1種 -->
  <rect x="30" y="16" width="340" height="162" rx="6" class="brand"/>
  <text x="44" y="38" class="b">第1種：酸素欠乏だけが問題</text>
  <text x="44" y="60" class="t">・地層に通じる井戸・立坑・ずい道・潜函の内部</text>
  <text x="44" y="80" class="t">・ケーブル・ガス管の暗きょ・マンホール・ピット</text>
  <text x="44" y="100" class="t">・雨水・河川水・湧水がたまった槽・暗きょ・ピット</text>
  <text x="44" y="120" class="t">・相当期間密閉された鋼製タンク、サイロ、発酵槽</text>
  <text x="44" y="140" class="t">・不活性ガスやドライアイスを使う設備</text>
  <text x="44" y="162" class="s">令別表第6のうち、第2種に当たる号以外</text>

  <!-- 分かれ目 -->
  <rect x="80" y="188" width="240" height="30" rx="15" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text x="200" y="208" text-anchor="middle" class="b">分かれ目：硫化水素が出るか</text>

  <!-- 第2種 -->
  <rect x="30" y="228" width="340" height="118" rx="6" class="dng"/>
  <text x="44" y="250" class="b">第2種：酸素欠乏＋硫化水素中毒</text>
  <text x="44" y="272" class="t">・海水がたまった管・暗きょ・ピット等（第3号の3）</text>
  <text x="44" y="292" class="t">・し尿・汚水・腐泥を入れた槽・管など（第9号）</text>
  <text x="44" y="312" class="t">・厚生労働大臣が定める場所（第12号）</text>
  <text x="44" y="334" class="s">令別表第6の第3号の3・第9号・第12号</text>

  <!-- 措置の違い -->
  <rect x="30" y="356" width="340" height="130" rx="6" class="sur"/>
  <text x="44" y="378" class="b">措置の違い</text>
  <text x="44" y="398" class="t">測定：第1種は酸素、第2種は酸素と硫化水素</text>
  <text x="44" y="418" class="t">換気：酸素18%以上（第2種は硫化水素10ppm以下も）</text>
  <text x="44" y="438" class="t">主任者の名称：両種とも酸素欠乏危険作業主任者</text>
  <text x="44" y="456" class="s">選ぶ技能講習：第1種はどちらの講習の修了者でも可、</text>
  <text x="44" y="472" class="s">第2種は酸素欠乏・硫化水素危険作業主任者技能講習のみ</text>
</svg>
