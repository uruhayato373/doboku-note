<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="鋼アーチ支保工を備えたトンネル断面。部材、緊圧、接続部、脚部の4か所を毎日と中震以上の地震後に点検する位置を番号で示した概念図">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; fill: #222; }
      .t { font-size: 12px; fill: #222; }
      .s { font-size: 11px; fill: #555; }
      .n { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .sur { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .dot { fill: #ffffff; stroke: #b22234; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- 地山 -->
  <rect x="30" y="20" width="340" height="286" rx="6" class="sur"/>
  <text x="44" y="42" class="s">地山</text>

  <!-- 坑内空間（馬蹄形の内空） -->
  <path d="M120 290 L120 175 A80 80 0 0 1 280 175 L280 290 Z" fill="#ffffff" stroke="none"/>

  <!-- 鋼アーチ支保工 -->
  <path d="M120 290 L120 175 A80 80 0 0 1 280 175 L280 290" fill="none" stroke="#2e6da4" stroke-width="7"/>

  <!-- 脚部の皿板 -->
  <rect x="103" y="290" width="34" height="9" rx="2" class="warn"/>
  <rect x="263" y="290" width="34" height="9" rx="2" class="warn"/>

  <!-- くさび（緊圧） -->
  <polygon points="-5,0 5,0 3,-14 -3,-14" transform="translate(141,117) rotate(-45)" fill="#d4a017"/>
  <polygon points="-5,0 5,0 3,-14 -3,-14" transform="translate(259,117) rotate(45)" fill="#d4a017"/>

  <!-- 接続部（継手） -->
  <circle cx="200" cy="95" r="5" fill="#ffffff" stroke="#2e6da4" stroke-width="2"/>
  <circle cx="120" cy="175" r="5" fill="#ffffff" stroke="#2e6da4" stroke-width="2"/>
  <circle cx="280" cy="175" r="5" fill="#ffffff" stroke="#2e6da4" stroke-width="2"/>

  <!-- 番号 -->
  <circle cx="98" cy="132" r="10" class="dot"/><text x="98" y="136" text-anchor="middle" class="n">1</text>
  <circle cx="132" cy="86" r="10" class="dot"/><text x="132" y="90" text-anchor="middle" class="n">2</text>
  <circle cx="200" cy="62" r="10" class="dot"/><text x="200" y="66" text-anchor="middle" class="n">3</text>
  <circle cx="326" cy="270" r="10" class="dot"/><text x="326" y="274" text-anchor="middle" class="n">4</text>
  <line x1="297" y1="293" x2="319" y2="277" stroke="#b22234" stroke-width="1.5"/>

  <text x="200" y="230" text-anchor="middle" class="s">坑内（内空）</text>

  <!-- 凡例 -->
  <circle cx="44" cy="322" r="9" class="dot"/><text x="44" y="326" text-anchor="middle" class="n">1</text>
  <text x="62" y="327" class="t">部材：損傷・変形・腐食・変位・脱落</text>
  <circle cx="44" cy="352" r="9" class="dot"/><text x="44" y="356" text-anchor="middle" class="n">2</text>
  <text x="62" y="357" class="t">緊圧：くさびなどの効き具合・ゆるみ</text>
  <circle cx="44" cy="382" r="9" class="dot"/><text x="44" y="386" text-anchor="middle" class="n">3</text>
  <text x="62" y="387" class="t">接続部・交さ部：継手、つなぎボルト、筋かい</text>
  <circle cx="44" cy="412" r="9" class="dot"/><text x="44" y="416" text-anchor="middle" class="n">4</text>
  <text x="62" y="417" class="t">脚部：皿板まわりの沈下</text>

  <rect x="30" y="434" width="340" height="52" rx="6" class="sur"/>
  <text x="44" y="455" class="t">点検の時期：設置後は毎日、中震以上の地震の後</text>
  <text x="44" y="474" class="s">異常を認めたら直ちに補強または補修する</text>
</svg>
