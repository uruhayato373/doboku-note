<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="地山100立方メートルがL1.2でほぐし120、C0.9で締固め90になる計算例。ほぐしから締固めへの係数はC割るL。"><defs><style>text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#1a3a5c}</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4"/></marker></defs><!-- brand / positive / warn fills; ink-strong text --><text x="200" y="26" font-size="16" font-weight="bold" text-anchor="middle">地山を基準に、求める状態へ換算</text><rect x="38" y="46" width="276" height="78" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/><text x="88" y="75" font-size="16" font-weight="bold" text-anchor="middle">地山</text><text x="176" y="105" font-size="27" font-weight="bold" text-anchor="middle">100 m³</text><path d="M176 125 L176 170" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/><text x="194" y="150" font-size="15" font-weight="normal" text-anchor="start">× L = 1.20</text><rect x="38" y="174" width="276" height="78" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/><text x="88" y="203" font-size="16" font-weight="bold" text-anchor="middle">ほぐし</text><text x="176" y="233" font-size="27" font-weight="bold" text-anchor="middle">120 m³</text><path d="M176 253 L176 298" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/><text x="194" y="278" font-size="15" font-weight="normal" text-anchor="start">× C/L = 0.75</text><rect x="38" y="302" width="276" height="78" rx="8" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/><text x="88" y="331" font-size="16" font-weight="bold" text-anchor="middle">締固め</text><text x="176" y="361" font-size="27" font-weight="bold" text-anchor="middle">90 m³</text><path d="M314 85 H350 V178 M350 244 V342 H318" fill="none" stroke="#3a7d44" stroke-width="1.5"/><text x="350" y="202" font-size="15" font-weight="bold" text-anchor="middle">× C</text><text x="350" y="226" font-size="14" font-weight="normal" text-anchor="middle">0.90</text><text x="200" y="428" font-size="18" font-weight="bold" text-anchor="middle">ほぐし → 締固めは「C/L」</text><text x="200" y="457" font-size="15" font-weight="normal" text-anchor="middle">この例：L = 1.20、C = 0.90</text><text x="200" y="481" font-size="14" font-weight="normal" text-anchor="middle">実際の変化率は土質・施工条件で確認</text></svg>
