<!-- authored 2026-10-09 doboku-note 自作。題材は1級土木 専門土木テキスト「河川工事」の論点。特定の書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="洪水のハイドログラフ。基本高水のピーク流量から、ダムや遊水地の洪水調節で減らす流量（ピークの低減分）を引くと河道の計画高水流量になり、その流量が河道を流れるときの水位が計画高水位になる">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-sec  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-part { font-size: 11px; fill: #555; }
      .t-red  { font-size: 11px; font-weight: bold; fill: #b22234; }
      .t-grn  { font-size: 11px; font-weight: bold; fill: #3a7d44; }
      .t-navy { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .t-box  { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-p { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
    </style>
    <marker id="ah" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#1a3a5c"/>
    </marker>
    <marker id="ax" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#555"/>
    </marker>
  </defs>

  <text class="t-lead" x="200" y="16" text-anchor="middle">基本高水を洪水調節施設と河道で分け合う</text>
  <text class="t-sec" x="20" y="38">洪水のハイドログラフ（流量の時間変化）</text>

  <!-- 軸 -->
  <line x1="50" y1="290" x2="50" y2="62" stroke="#555" stroke-width="1.5" marker-end="url(#ax)"/>
  <line x1="50" y1="290" x2="352" y2="290" stroke="#555" stroke-width="1.5" marker-end="url(#ax)"/>
  <text class="t-part" x="22" y="68">流量</text>
  <text class="t-part" x="352" y="308" text-anchor="end">時間</text>

  <!-- ピークの補助線 -->
  <line x1="50" y1="78" x2="258" y2="78" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="50" y1="150" x2="258" y2="150" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- 洪水調節で減らす部分 -->
  <polygon points="54,289.0 58,286.9 62,283.5 66,278.9 70,273.3 74,266.6 78,258.8 82,250.3 86,241.1 90,231.3 94,220.9 98,210.2 102,199.1 106,187.8 110,176.6 114,165.4 118,154.4 122,143.7 126,133.5 130,123.9 134,114.9 138,106.7 142,99.3 146,92.8 150,87.4 154,83.3 158,80.3 162,78.6 166,78.2 170,79.0 174,81.2 178,84.4 182,88.7 186,93.8 190,99.7 194,106.3 198,113.4 202,120.9 206,128.6 210,136.5 214,144.5 218,152.4 222,160.3 226,168.0 230,175.5 234,182.9 238,189.9 242,196.8 246,203.3 250,209.7 250,209.1 246,204.0 242,198.9 238,193.9 234,188.9 230,184.1 226,179.4 222,174.9 218,170.8 214,166.8 210,163.2 206,160.1 202,157.3 198,154.8 194,153.0 190,151.6 186,150.6 182,150.2 178,150.3 174,150.9 170,152.3 166,154.4 162,157.0 158,160.2 154,164.1 150,168.4 146,173.1 142,178.2 138,183.7 134,189.5 130,195.5 126,201.8 122,208.2 118,214.7 114,221.3 110,227.8 106,234.3 102,240.6 98,246.8 94,252.8 90,258.5 86,263.8 82,268.8 78,273.4 74,277.4 70,281.0 66,284.1 62,286.5 58,288.3 54,289.4" fill="#fff3cd"/>

  <!-- 基本高水と調節後 -->
  <path d="M50,290 C90,289 125,78 165,78 C205,78 235,262 345,288" fill="none" stroke="#b22234" stroke-width="2.5"/>
  <path d="M50,290 C95,289 135,150 180,150 C230,150 262,262 345,288" fill="none" stroke="#3a7d44" stroke-width="2.5"/>

  <!-- 洪水調節量の矢印 -->
  <line x1="252" y1="114" x2="252" y2="82" stroke="#1a3a5c" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="252" y1="114" x2="252" y2="146" stroke="#1a3a5c" stroke-width="1.5" marker-end="url(#ah)"/>

  <text class="t-red" x="264" y="72">基本高水の</text>
  <text class="t-red" x="264" y="85">ピーク流量</text>
  <text class="t-navy" x="264" y="106">洪水調節で</text>
  <text class="t-navy" x="264" y="119">減らす流量</text>
  <text class="t-part" x="264" y="132">（ピークの低減分）</text>
  <text class="t-grn" x="264" y="152">計画高水流量</text>
  <text class="t-part" x="264" y="165">（河道に配分）</text>

  <!-- 凡例 -->
  <line x1="264" y1="190" x2="284" y2="190" stroke="#b22234" stroke-width="2.5"/>
  <text class="t-part" x="290" y="194">基本高水</text>
  <line x1="264" y1="208" x2="284" y2="208" stroke="#3a7d44" stroke-width="2.5"/>
  <text class="t-part" x="290" y="212">調節後の流量</text>

  <!-- 関係式 -->
  <rect class="box-b" x="20" y="330" width="360" height="62" rx="8"/>
  <text class="t-box" x="200" y="356" text-anchor="middle">基本高水のピーク流量 − 洪水調節で減らす流量</text>
  <text class="t-box" x="200" y="378" text-anchor="middle">＝ 河道の計画高水流量</text>

  <rect class="box-p" x="20" y="408" width="360" height="58" rx="8"/>
  <text class="t-box" x="200" y="432" text-anchor="middle">その流量が河道を流れるときの水位</text>
  <text class="t-box" x="200" y="452" text-anchor="middle">＝ 計画高水位（H.W.L.）</text>

  <text class="t-lead" x="200" y="488" text-anchor="middle">この水位に余裕高を加えて堤防の高さを決める</text>
</svg>
