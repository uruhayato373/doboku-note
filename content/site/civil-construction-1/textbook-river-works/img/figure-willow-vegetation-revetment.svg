  <circle cx="206" cy="356" r="5" fill="none" stroke="#d4a017" stroke-width="1.5"/>
  <text class="t-grn" x="232" y="296">植生マット・ネット</text>
  <text class="t-part" x="232" y="309">芽生えるまで表面を覆う</text>
  <line x1="230" y1="300" x2="130" y2="322" stroke="#8a8a8a" stroke-width="1"/>
  <text class="t-navy" x="236" y="338">植生ロール</text>
  <text class="t-part" x="236" y="351">水際の土を留める</text>
  <text class="t-part" x="30" y="384">土（法面）</text>

  <rect class="box-b" x="20" y="418" width="360" height="56" rx="8"/>
  <text class="t-box" x="200" y="442" text-anchor="middle">根づくまでは護岸の役を果たせない</text>
  <text class="t-box" x="200" y="462" text-anchor="middle">流水に洗われない時期と位置を選ぶ</text>
</svg>
