<!-- authored 2026-09-12 doboku-note 自作。題材は1級土木 専門土木テキスト「河川工事」の論点。特定の書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="護岸の断面構成。高水敷から低水路へ続く法面に天端工・法覆工・基礎工・根固工・帯工を配置し、各部の役割を示す">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-sec  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-zone { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-part { font-size: 11px; fill: #555; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-p { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-d { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .ground { stroke: #8a8a8a; stroke-width: 1; }
    </style>
  </defs>

  <text class="t-lead" x="200" y="16" text-anchor="middle">高水敷から低水路へ続く法面を各工種が保護する</text>

  <text class="t-sec" x="20" y="36">断面構成（高水敷 → 法面 → 低水路）</text>

  <!-- 高水敷 -->
  <text class="t-zone" x="30" y="98">高水敷</text>
  <line class="ground" x1="20" y1="110" x2="170" y2="110" stroke-width="2"/>
  <line class="ground" x1="35" y1="110" x2="35" y2="118"/>
  <line class="ground" x1="60" y1="110" x2="60" y2="118"/>
  <line class="ground" x1="85" y1="110" x2="85" y2="118"/>
  <line class="ground" x1="110" y1="110" x2="110" y2="118"/>
  <line class="ground" x1="135" y1="110" x2="135" y2="118"/>

  <!-- 天端工 -->
  <rect class="box-w" x="150" y="100" width="34" height="10" rx="2"/>
  <text class="t-part" x="188" y="99">天端工</text>

  <!-- 法覆工（法面の帯） -->
  <line x1="170" y1="110" x2="280" y2="230" stroke="#2e6da4" stroke-width="14" stroke-linecap="round"/>
  <text class="t-part" x="220" y="150">法覆工</text>

  <!-- 帯工（縦帯工の目地） -->
  <line x1="199" y1="156" x2="213" y2="144" stroke="#1a3a5c" stroke-width="2"/>
  <line x1="236" y1="195" x2="249" y2="183" stroke="#1a3a5c" stroke-width="2"/>
  <text class="t-part" x="252" y="190">帯工</text>

  <!-- 基礎工 -->
  <rect class="box-p" x="258" y="224" width="44" height="16" rx="2"/>
  <text class="t-part" x="230" y="256">基礎工</text>

  <!-- 根固工（河床の護石） -->
  <circle class="box-d" cx="292" cy="246" r="7"/>
  <circle class="box-d" cx="306" cy="248" r="7"/>
  <circle class="box-d" cx="320" cy="246" r="7"/>
  <circle class="box-d" cx="334" cy="248" r="7"/>
  <circle class="box-d" cx="348" cy="246" r="7"/>
  <text class="t-part" x="290" y="272">根固工</text>

  <!-- 低水路（水面） -->
  <path d="M280,232 q10,-5 20,0 q10,5 20,0 q10,-5 20,0 q10,5 20,0" stroke="#2e6da4" stroke-width="1.5" fill="none"/>
  <line class="ground" x1="280" y1="254" x2="380" y2="254" stroke-width="2"/>
  <text class="t-zone" x="320" y="220">低水路</text>

  <text class="t-sec" x="20" y="300">各部の役割</text>

  <rect x="20" y="312" width="14" height="14" class="box-w"/>
  <text class="t-part" x="42" y="323">天端工：法肩を保護し洗掘に備える</text>

  <rect x="20" y="340" width="14" height="14" class="box-b"/>
  <text class="t-part" x="42" y="351">法覆工：法面を保護し洗掘を防ぐ被覆</text>

  <rect x="20" y="368" width="14" height="14" class="box-p"/>
  <text class="t-part" x="42" y="379">基礎工：法覆工を支持し洗掘から守る</text>

  <rect x="20" y="396" width="14" height="14" class="box-d"/>
  <text class="t-part" x="42" y="407">根固工：河床を覆い洗掘の進行を防ぐ</text>

  <rect x="20" y="424" width="14" height="14" fill="none" stroke="#1a3a5c" stroke-width="2"/>
  <text class="t-part" x="42" y="435">帯工：区切りを設け被害の波及を防ぐ</text>

  <text class="t-part" x="20" y="464">高水敷（陸側）から低水路（水面側）へ続く断面</text>
</svg>
