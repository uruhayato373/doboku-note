<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="施工計画と施工管理の関係。施工計画は工事着工の前に事前調査、施工方法の選定、機械の使用計画、原価管理・実行予算、品質管理の計画、工程計画、施工体制などを検討する。工事着工後の施工管理では品質管理、工程管理、安全管理を行い、計画と管理は視点が重なる">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-lab   { font-size: 12px; fill: #222; }
      .t-key   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-sec   { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-pos   { font-size: 12px; font-weight: bold; fill: #3a7d44; }
      .t-sub   { font-size: 11px; fill: #555; }
      .b-brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .b-pos   { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .b-gray  { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; }
      .box     { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .arr     { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .dash    { fill: none; stroke: #8a8a8a; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .rule    { stroke: #d7d7d7; stroke-width: 1; }
    </style>
    <marker id="ar" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto">
      <polygon points="0,0 10,4.5 0,9" fill="#2e6da4"/>
    </marker>
  </defs>

  <text class="t-title" x="200" y="28" text-anchor="middle">施工計画と施工管理の関係</text>
  <text class="t-lead" x="200" y="50" text-anchor="middle">施工計画は着手前の事前検討、施工管理は着工後の管理</text>

  <text class="t-sec" x="16" y="80">施工計画</text>
  <text class="t-sub" x="16" y="96">着手前に事前に検討する</text>
  <text class="t-sec" x="252" y="80">施工管理</text>
  <text class="t-sub" x="252" y="96">社会的責任のもとに行う</text>
  <line class="dash" x1="212" y1="92" x2="212" y2="380"/>
  <rect class="b-gray" x="182" y="66" width="60" height="26" rx="13"/><text class="t-key" x="212" y="83" text-anchor="middle">工事着工</text>

  <rect class="b-gray" x="16" y="108" width="160" height="28" rx="6"/><text class="t-lab" x="96" y="126" text-anchor="middle">事前調査</text>
  <rect class="b-gray" x="16" y="142" width="160" height="28" rx="6"/><text class="t-lab" x="96" y="160" text-anchor="middle">施工方法の選定</text>
  <rect class="b-gray" x="16" y="176" width="160" height="28" rx="6"/><text class="t-lab" x="96" y="194" text-anchor="middle">建設機械の使用計画</text>
  <rect class="b-gray" x="16" y="210" width="160" height="28" rx="6"/><text class="t-lab" x="96" y="228" text-anchor="middle">原価管理・実行予算</text>

  <line class="rule" x1="16" y1="250" x2="384" y2="250"/>
  <text class="t-sub" x="16" y="266">着工後の管理と重なる項目</text>

  <rect class="b-brand" x="16" y="276" width="160" height="28" rx="6"/><text class="t-lab" x="96" y="294" text-anchor="middle">品質管理の計画</text>
  <rect class="b-brand" x="16" y="312" width="160" height="28" rx="6"/><text class="t-lab" x="96" y="330" text-anchor="middle">工程計画</text>
  <rect class="b-brand" x="16" y="348" width="160" height="28" rx="6"/><text class="t-lab" x="96" y="366" text-anchor="middle">施工体制（仮設・安全等）</text>

  <line class="arr" x1="176" y1="290" x2="252" y2="290" marker-end="url(#ar)"/>
  <line class="arr" x1="176" y1="326" x2="252" y2="326" marker-end="url(#ar)"/>
  <line class="arr" x1="176" y1="362" x2="252" y2="362" marker-end="url(#ar)"/>

  <rect class="b-pos" x="252" y="276" width="132" height="28" rx="6"/><text class="t-pos" x="318" y="294" text-anchor="middle">品質管理</text>
  <rect class="b-pos" x="252" y="312" width="132" height="28" rx="6"/><text class="t-pos" x="318" y="330" text-anchor="middle">工程管理</text>
  <rect class="b-pos" x="252" y="348" width="132" height="28" rx="6"/><text class="t-pos" x="318" y="366" text-anchor="middle">安全管理</text>

  <rect class="box" x="16" y="396" width="368" height="92" rx="6"/>
  <text class="t-key" x="30" y="422">施工計画</text><text class="t-lab" x="104" y="422">着工前に、工事内容を事前に検討する</text>
  <text class="t-key" x="30" y="446">施工管理</text><text class="t-lab" x="104" y="446">着工後に、社会的責任のもとで管理する</text>
  <text class="t-key" x="30" y="470">関係</text><text class="t-lab" x="104" y="470">施工管理上の事前検討を含み、視点が重なる</text>
</svg>
