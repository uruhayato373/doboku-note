<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="状況と課題の三段書き。目的・概要、数値で書く状況、一つに絞った課題の順に組み、検討は理由を添えて結論で止める。"><defs><style>text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#1a3a5c}</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4"/></marker></defs><!-- brand: 段1-2 / warn: 課題 / surface: 検討 --><rect x="20" y="14" width="360" height="100" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/><text x="40" y="44" font-size="16" font-weight="bold" text-anchor="start">① 目的・概要</text><text x="40" y="72" font-size="13" font-weight="normal" text-anchor="start">何の工事の、どの部分の話かを示す</text><text x="40" y="94" font-size="12" font-weight="normal" text-anchor="start">対象部分の規模・工法・材料を挙げる</text><path d="M200 114 L200 135" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="20" y="138" width="360" height="100" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/><text x="40" y="168" font-size="16" font-weight="bold" text-anchor="start">② 状況</text><text x="40" y="196" font-size="13" font-weight="normal" text-anchor="start">課題の原因になった条件を数値で書く</text><text x="40" y="218" font-size="12" font-weight="normal" text-anchor="start">打込み温度・N値・作業床の高さなど</text><path d="M200 238 L200 259" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="20" y="262" width="360" height="100" rx="8" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/><text x="40" y="292" font-size="16" font-weight="bold" text-anchor="start">③ 課題</text><text x="40" y="320" font-size="13" font-weight="normal" text-anchor="start">状況の最後の一文を原因につなげる</text><text x="40" y="342" font-size="12" font-weight="normal" text-anchor="start">一つに絞り、対処策は書かない</text><path d="M200 362 L200 383" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="20" y="386" width="360" height="100" rx="8" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/><text x="40" y="416" font-size="16" font-weight="bold" text-anchor="start">④ 検討した項目</text><text x="40" y="444" font-size="13" font-weight="normal" text-anchor="start">項目ごとに目的・理由・長所と短所</text><text x="40" y="466" font-size="12" font-weight="normal" text-anchor="start">選んだ根拠まで書き、処置は次の区画へ</text></svg>
