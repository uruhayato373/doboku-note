<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="施工管理の実質があるかを三つの問いで確かめる判定フロー。一つでも「いいえ」なら実務経験に算入できない。"><defs><style>text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#1a3a5c}</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4"/></marker></defs><!-- brand: 問い / danger: 算入できない / positive: 算入できる --><rect x="20" y="14" width="360" height="46" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/><text x="200" y="43" font-size="16" font-weight="bold" text-anchor="middle">① 施工中の工事に関わる業務か</text><path d="M46 60 L46 145" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/><text x="54" y="128" font-size="13" font-weight="normal" text-anchor="start">はい</text><path d="M46 102 L97 102" fill="none" stroke="#b22234" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="100" y="72" width="280" height="60" rx="8" fill="#f8d7da" stroke="#b22234" stroke-width="1.5"/><text x="112" y="97" font-size="13" font-weight="bold" text-anchor="start">いいえ：設計のみ・調査・点検・保守</text><text x="112" y="119" font-size="12" font-weight="normal" text-anchor="start">例外：施工中の工事測量は算入できる</text><rect x="20" y="148" width="360" height="46" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/><text x="200" y="177" font-size="16" font-weight="bold" text-anchor="middle">② 工程・品質・安全の管理に直接かかわるか</text><path d="M46 194 L46 279" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/><text x="54" y="262" font-size="13" font-weight="normal" text-anchor="start">はい</text><path d="M46 236 L97 236" fill="none" stroke="#b22234" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="100" y="206" width="280" height="60" rx="8" fill="#f8d7da" stroke="#b22234" stroke-width="1.5"/><text x="112" y="231" font-size="13" font-weight="bold" text-anchor="start">いいえ：作業員・運転・単純労務のみ</text><text x="112" y="253" font-size="12" font-weight="normal" text-anchor="start">アルバイト作業員・雑役務のみも同じ</text><rect x="20" y="282" width="360" height="46" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/><text x="200" y="311" font-size="16" font-weight="bold" text-anchor="middle">③ 施工を管理・監督・監理する職務か</text><path d="M46 328 L46 413" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/><text x="54" y="396" font-size="13" font-weight="normal" text-anchor="start">はい</text><path d="M46 370 L97 370" fill="none" stroke="#b22234" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="100" y="340" width="280" height="60" rx="8" fill="#f8d7da" stroke="#b22234" stroke-width="1.5"/><text x="112" y="365" font-size="13" font-weight="bold" text-anchor="start">いいえ：営業・現場事務・研究・教育</text><text x="112" y="387" font-size="12" font-weight="normal" text-anchor="start">官公庁での行政・行政指導も外れる</text><rect x="20" y="416" width="360" height="72" rx="8" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/><text x="200" y="448" font-size="16" font-weight="bold" text-anchor="middle">三つとも「はい」なら算入できる</text><text x="200" y="470" font-size="13" font-weight="normal" text-anchor="middle">ただし工事自体が手引の対象であること</text></svg>
