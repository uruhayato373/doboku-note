<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="元請Bの発注者はA、一次下請Cの発注者はB、二次下請Dの発注者はC。発注機関に所属する場合は所属機関名を記入する。"><defs><style>text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#1a3a5c}</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4"/></marker></defs><!-- brand / positive / warn fills; ink-strong text --><text x="200" y="27" font-size="16" font-weight="bold" text-anchor="middle">自分の所属会社への注文者をたどる</text><rect x="34" y="44" width="332" height="57" rx="8" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/><text x="200" y="79" font-size="18" font-weight="bold" text-anchor="middle">A  工事の最初の注文者</text><path d="M78 102 L78 141" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/><text x="106" y="127" font-size="16" font-weight="normal" text-anchor="start">Bの発注者はA</text><rect x="34" y="144" width="332" height="57" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/><text x="200" y="179" font-size="18" font-weight="bold" text-anchor="middle">B  元請会社</text><path d="M78 202 L78 241" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/><text x="106" y="227" font-size="16" font-weight="normal" text-anchor="start">Cの発注者はB</text><rect x="34" y="244" width="332" height="57" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/><text x="200" y="279" font-size="18" font-weight="bold" text-anchor="middle">C  一次下請会社</text><path d="M78 302 L78 341" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/><text x="106" y="327" font-size="16" font-weight="normal" text-anchor="start">Dの発注者はC</text><rect x="34" y="344" width="332" height="57" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/><text x="200" y="379" font-size="18" font-weight="bold" text-anchor="middle">D  二次下請会社</text><text x="200" y="442" font-size="16" font-weight="normal" text-anchor="middle">発注機関に所属する場合は</text><text x="200" y="468" font-size="16" font-weight="bold" text-anchor="middle">所属する発注機関名を記入</text></svg>
