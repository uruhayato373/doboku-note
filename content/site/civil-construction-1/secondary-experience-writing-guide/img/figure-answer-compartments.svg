<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="1級土木の各テーマの答案は、現場状況・技術的課題・検討項目を（1）に、対応処置・評価を（2）に記述する。"><defs><style>text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#1a3a5c}</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4"/></marker></defs><!-- brand / positive / warn fills; ink-strong text --><text x="200" y="28" font-size="16" font-weight="bold" text-anchor="middle">同じ工事で、指定された2テーマを書く</text><rect x="18" y="48" width="364" height="248" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/><text x="42" y="77" font-size="16" font-weight="bold" text-anchor="start">（1）の区画</text><rect x="102" y="93" width="254" height="50" rx="8" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/><text x="229" y="124" font-size="18" font-weight="bold" text-anchor="middle">現場状況</text><path d="M229 143 L229 155" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="102" y="157" width="254" height="50" rx="8" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/><text x="229" y="188" font-size="18" font-weight="bold" text-anchor="middle">技術的課題</text><path d="M229 207 L229 219" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="102" y="221" width="254" height="50" rx="8" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/><text x="229" y="252" font-size="18" font-weight="bold" text-anchor="middle">検討した項目</text><path d="M229 297 L229 318" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="18" y="324" width="364" height="151" rx="8" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/><text x="42" y="353" font-size="16" font-weight="bold" text-anchor="start">（2）の区画</text><rect x="102" y="367" width="254" height="88" rx="8" fill="#ffffff" stroke="#3a7d44" stroke-width="1.5"/><text x="229" y="397" font-size="18" font-weight="bold" text-anchor="middle">対応処置</text><path d="M229 405 L229 421" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/><text x="229" y="444" font-size="18" font-weight="bold" text-anchor="middle">評価</text></svg>
