<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="建設業の事業場の規模別に置く担当者。10〜49人で推進者、50人以上で安全管理者と委員会、100人で総括、300人で専任の安全管理者" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/>
    </marker>
  </defs>
  <text x="20" y="24" font-size="11" font-weight="bold" fill="#555">常時使用する労働者の数（建設業）</text>
  <rect x="20" y="34" width="92" height="76" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="66" y="77" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3a5c">10〜49人</text>
  <rect x="120" y="34" width="260" height="76" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="134" y="60" font-size="13" font-weight="bold" fill="#1a3a5c">安全衛生推進者</text>
  <text x="134" y="80" font-size="11" fill="#555">法第12条の2（50人未満の事業場）</text>
  <text x="134" y="98" font-size="11" fill="#555">50人以上は管理者に切り替わる</text>
  <rect x="20" y="118" width="92" height="126" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="66" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3a5c">50人以上</text>
  <rect x="120" y="118" width="260" height="126" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="134" y="149" font-size="13" font-weight="bold" fill="#1a3a5c">安全管理者・衛生管理者</text>
  <text x="134" y="173" font-size="13" font-weight="bold" fill="#1a3a5c">産業医</text>
  <text x="134" y="197" font-size="13" font-weight="bold" fill="#1a3a5c">安全委員会・衛生委員会</text>
  <text x="134" y="221" font-size="11" fill="#555">令第3〜5条・第8条・第9条</text>
  <rect x="20" y="252" width="92" height="76" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="66" y="295" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3a5c">100人以上</text>
  <rect x="120" y="252" width="260" height="76" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="134" y="282" font-size="13" font-weight="bold" fill="#1a3a5c">総括安全衛生管理者</text>
  <text x="134" y="306" font-size="11" fill="#555">法第10条・令第2条</text>
  <rect x="20" y="336" width="92" height="96" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="66" y="389" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3a5c">300人以上</text>
  <rect x="120" y="336" width="260" height="96" rx="6" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text x="134" y="363" font-size="13" font-weight="bold" fill="#1a3a5c">専任の安全管理者</text>
  <text x="134" y="388" font-size="12" fill="#222">少なくとも1人を専任にする</text>
  <text x="134" y="413" font-size="11" fill="#555">則第4条</text>
  <text x="200" y="458" text-anchor="middle" font-size="11" fill="#8a8a8a">50人以上は積み上がる：300人の事業場には</text>
  <text x="200" y="476" text-anchor="middle" font-size="11" fill="#8a8a8a">安全管理者・衛生管理者・産業医・</text>
  <text x="200" y="494" text-anchor="middle" font-size="11" fill="#8a8a8a">委員会・総括がそろう</text>
</svg>
