<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="災害発生の基本モデル。間接原因を背景に、不安全な状態（物的）と不安全な行動（人的）が直接原因となって労働災害が発生する。不注意は結果であって原因ではない">
  <text x="200" y="24" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1a3a5c">災害発生モデル：間接原因 → 直接原因（状態＋行動）→ 災害</text>

  <!-- 間接原因 -->
  <rect x="40" y="42" width="320" height="60" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="200" y="66" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222">間接原因（背景・管理面の要因）</text>
  <text x="200" y="88" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8a8a">強度計算の誤り・組立手順の確認不足 等</text>

  <!-- 矢印 -->
  <line x1="200" y1="102" x2="200" y2="126" stroke="#8a8a8a" stroke-width="2"/>
  <path d="M200 132 l-6 -8 h12 z" fill="#8a8a8a"/>

  <!-- 直接原因 -->
  <rect x="40" y="132" width="320" height="118" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="200" y="152" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1a3a5c">直接原因</text>
  <rect x="54" y="162" width="140" height="76" rx="5" fill="#ffffff" stroke="#2e6da4" stroke-width="1"/>
  <text x="124" y="192" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">不安全な状態</text>
  <text x="124" y="212" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8a8a">（物的原因）</text>
  <text x="200" y="205" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1a3a5c">＋</text>
  <rect x="206" y="162" width="140" height="76" rx="5" fill="#ffffff" stroke="#2e6da4" stroke-width="1"/>
  <text x="276" y="192" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">不安全な行動</text>
  <text x="276" y="212" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8a8a">（人的原因）</text>

  <!-- 矢印 -->
  <line x1="200" y1="250" x2="200" y2="274" stroke="#8a8a8a" stroke-width="2"/>
  <path d="M200 280 l-6 -8 h12 z" fill="#8a8a8a"/>

  <!-- 労働災害 -->
  <rect x="110" y="280" width="180" height="52" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="200" y="312" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1a3a5c">労働災害</text>

  <!-- 注記 -->
  <rect x="40" y="360" width="320" height="96" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="200" y="386" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">「不注意」は災害の結果であって原因ではない</text>
  <text x="200" y="410" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">防止対策＝不安全な状態・行動と</text>
  <text x="200" y="428" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">その背景にある間接原因の除去</text>
  <text x="200" y="448" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8a8a">出典：労働安全衛生法の考え方</text>
</svg>
