<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="安全委員会の設置基準と委員の構成。建設業は50人以上、議長は統括管理者、議長以外の委員の半数は労働者側の推薦、毎月1回以上開催" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/>
    </marker>
  </defs>
  <text x="20" y="24" font-size="11" font-weight="bold" fill="#555">設置の基準（常時使用する労働者）</text>
  <rect x="20" y="34" width="360" height="34" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="34" y="56" font-size="13" font-weight="bold" fill="#1a3a5c">50人以上</text>
  <text x="116" y="56" font-size="13" fill="#222">建設業は安全委員会（令第8条）</text>
  <rect x="20" y="74" width="360" height="34" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="34" y="96" font-size="13" font-weight="bold" fill="#1a3a5c">50人以上</text>
  <text x="116" y="96" font-size="13" fill="#222">全業種で衛生委員会（令第9条）</text>
  <rect x="20" y="114" width="360" height="34" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="34" y="136" font-size="13" font-weight="bold" fill="#222">50人未満</text>
  <text x="116" y="136" font-size="12" fill="#222">意見を聴く機会を設ける（則第23条の2）</text>
  <text x="20" y="178" font-size="11" font-weight="bold" fill="#555">安全委員会の委員（法第17条）</text>
  <rect x="90" y="188" width="220" height="50" rx="6" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text x="200" y="209" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3a5c">議長（1人）</text>
  <text x="200" y="227" text-anchor="middle" font-size="12" fill="#222">総括安全衛生管理者など</text>
  <line x1="200" y1="238" x2="200" y2="254" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="106" y1="254" x2="294" y2="254" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="106" y1="254" x2="106" y2="266" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="294" y1="254" x2="294" y2="266" stroke="#8a8a8a" stroke-width="1.5"/>
  <rect x="20" y="266" width="172" height="58" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="106" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3a5c">安全管理者</text>
  <text x="106" y="309" text-anchor="middle" font-size="12" fill="#222">事業者が指名</text>
  <rect x="208" y="266" width="172" height="58" rx="6" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
  <text x="294" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3a5c">経験のある労働者</text>
  <text x="294" y="309" text-anchor="middle" font-size="12" fill="#222">事業者が指名</text>
  <rect x="20" y="336" width="360" height="54" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="200" y="358" text-anchor="middle" font-size="12" fill="#222">議長を除く委員の半数は、過半数組合</text>
  <text x="200" y="377" text-anchor="middle" font-size="12" fill="#222">（なければ過半数代表者）の推薦で指名</text>
  <text x="20" y="416" font-size="11" font-weight="bold" fill="#555">運営のルール（則第23条）</text>
  <rect x="20" y="426" width="360" height="56" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="34" y="446" font-size="12" fill="#222">毎月1回以上開き、議事の概要を周知する</text>
  <text x="34" y="468" font-size="12" fill="#222">意見と講じた措置などを記録し、3年間保存</text>
</svg>
