<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="令和2年度までの学科試験と実地試験が、令和3年度から第一次検定と第二次検定に置き換わり、第一次の合格で技士補、第二次の合格で技士となる対応図。">
<defs>
<style>text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#222}</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4"/></marker>
</defs>
<!-- brand / positive / surface fills; ink-strong text -->
<text x="94" y="30" font-size="13" font-weight="bold" text-anchor="middle" fill="#555">令和2年度まで</text>
<text x="286" y="30" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a3a5c">令和3年度から</text>

<rect x="14" y="42" width="160" height="50" rx="8" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
<text x="94" y="72" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">学科試験</text>
<path d="M176 67 L204 67" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="206" y="42" width="160" height="50" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<text x="286" y="72" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a3a5c">第一次検定</text>

<path d="M94 92 L94 180" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="104" y="132" font-size="11" fill="#555">学科だけでは</text>
<text x="104" y="147" font-size="11" fill="#555">称号なし</text>

<path d="M286 92 L286 110" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="206" y="112" width="160" height="50" rx="8" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
<text x="286" y="142" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a3a5c">1級技士補</text>
<path d="M286 162 L286 180" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="14" y="182" width="160" height="50" rx="8" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
<text x="94" y="212" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">実地試験</text>
<path d="M176 207 L204 207" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="206" y="182" width="160" height="50" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<text x="286" y="212" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a3a5c">第二次検定</text>

<path d="M94 232 L94 250" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M286 232 L286 250" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="14" y="252" width="160" height="50" rx="8" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
<text x="94" y="282" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">1級技士</text>
<path d="M176 277 L204 277" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="206" y="252" width="160" height="50" rx="8" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
<text x="286" y="282" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a3a5c">1級技士</text>

<rect x="24" y="324" width="352" height="66" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<text x="36" y="346" font-size="13" font-weight="bold" fill="#1a3a5c">第一次検定が判定するもの</text>
<text x="36" y="365" font-size="12" fill="#555">施工技術の基礎となる知識と能力</text>
<text x="36" y="381" font-size="12" fill="#555">（監理技術者補佐の立場・択一式）</text>

<rect x="24" y="406" width="352" height="66" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<text x="36" y="428" font-size="13" font-weight="bold" fill="#1a3a5c">第二次検定が判定するもの</text>
<text x="36" y="447" font-size="12" fill="#555">実務経験に基づく技術上の管理・指導監督の知識と能力</text>
<text x="36" y="463" font-size="12" fill="#555">（監理技術者の立場・記述式）</text>
</svg>
