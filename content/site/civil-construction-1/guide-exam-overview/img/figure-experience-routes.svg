<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="満19歳で第一次検定を受け、合格後に実務経験5年、特定実務経験を含む3年、監理技術者補佐1年のいずれかで第二次検定を受験できる時系列。">
<defs>
<style>text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#222}</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4"/></marker>
</defs>
<!-- brand / positive / warn fills; ink-strong text -->
<rect x="60" y="20" width="280" height="60" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<text x="200" y="46" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a3a5c">満19歳以上（受験年度末）</text>
<text x="200" y="66" font-size="12" text-anchor="middle" fill="#555">第一次検定を受験できる</text>
<path d="M200 80 L200 108" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="110" width="280" height="60" rx="8" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
<text x="200" y="136" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a3a5c">1級第一次検定に合格</text>
<text x="200" y="156" font-size="12" text-anchor="middle" fill="#555">合格発表の日以降の経験を数える</text>
<path d="M200 170 L200 198" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="24" y="226" font-size="14" font-weight="bold" fill="#1a3a5c">合格後の実務経験（いずれか一つ）</text>

<text x="24" y="262" font-size="13" fill="#222">実務経験のみ</text>
<rect x="24" y="272" width="260" height="30" rx="3" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<text x="154" y="292" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a3a5c">5年以上</text>
<text x="294" y="292" font-size="12" font-weight="bold" fill="#1a3a5c">→ 受験可</text>

<text x="24" y="342" font-size="13" fill="#222">特定実務経験を含む合計</text>
<rect x="24" y="352" width="52" height="30" rx="3" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
<text x="50" y="372" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a3a5c">特定1年</text>
<rect x="76" y="352" width="104" height="30" rx="3" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<text x="128" y="372" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a3a5c">合計3年以上</text>
<text x="190" y="372" font-size="12" font-weight="bold" fill="#1a3a5c">→ 受験可</text>

<text x="24" y="422" font-size="13" fill="#222">監理技術者補佐として</text>
<rect x="24" y="432" width="52" height="30" rx="3" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
<text x="50" y="452" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a3a5c">1年</text>
<text x="86" y="452" font-size="12" font-weight="bold" fill="#1a3a5c">→ 受験可</text>
</svg>
