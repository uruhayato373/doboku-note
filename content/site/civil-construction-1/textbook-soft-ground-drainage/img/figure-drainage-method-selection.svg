<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="掘削時の排水工法の選定。重力排水工法（釜場排水工法・深井戸排水工法）、強制排水工法（ウェルポイント工法・深井戸真空工法）、電気浸透工法を透水係数の大小に応じて使い分ける">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-sec  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-name { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-desc { font-size: 11px; fill: #555; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-s { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
  </defs>

  <text class="t-lead" x="200" y="16" text-anchor="middle">排水工法の選定（透水係数の目安）</text>

  <rect class="box-b" x="20" y="24" width="360" height="54" rx="6"/>
  <text class="t-name" x="40" y="44">重力排水工法：釜場排水工法</text>
  <text class="t-desc" x="40" y="62">集水場に水を集めポンプで排水。小規模掘削向け</text>

  <rect class="box-b" x="20" y="84" width="360" height="54" rx="6"/>
  <text class="t-name" x="40" y="104">重力排水工法：深井戸排水工法</text>
  <text class="t-desc" x="40" y="122">ディープウェル工法。広範囲・大量の排水に適する</text>

  <rect class="box-w" x="20" y="144" width="360" height="54" rx="6"/>
  <text class="t-name" x="40" y="164">強制排水工法：ウェルポイント工法</text>
  <text class="t-desc" x="40" y="182">真空ポンプで強制排水。揚水限界は実用上6〜7m程度</text>

  <rect class="box-w" x="20" y="204" width="360" height="54" rx="6"/>
  <text class="t-name" x="40" y="224">強制排水工法：深井戸真空工法</text>
  <text class="t-desc" x="40" y="242">井戸内に複数段のポンプを設置し、より深い揚水が可能</text>

  <rect class="box-s" x="20" y="264" width="360" height="54" rx="6"/>
  <text class="t-name" x="40" y="284">電気浸透工法</text>
  <text class="t-desc" x="40" y="302">直流で間隙水を移動させ排水。透水性の低い土に用いる</text>

  <text class="t-sec" x="20" y="342">透水係数による選定の目安</text>
  <rect class="box-b" x="20" y="348" width="360" height="90" rx="6"/>
  <text class="t-desc" x="40" y="370">透水係数が大きい粗粒土 → 重力排水工法</text>
  <text class="t-desc" x="40" y="388">中程度で重力排水が困難 → 強制排水工法</text>
  <text class="t-desc" x="40" y="406">透水係数が極めて小さい土 → 電気浸透工法</text>
  <text class="t-desc" x="40" y="424">数値は目安。土質・規模に応じ総合的に選定する</text>
</svg>
