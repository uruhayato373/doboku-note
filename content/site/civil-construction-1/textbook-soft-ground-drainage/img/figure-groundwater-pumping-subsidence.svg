<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="地下水の揚水前後の断面比較。帯水層の水位が下がると粘土層の水が帯水層へ出て粘土層が縮み、地表が下がって井戸の頭が抜け上がる">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-head { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-sm   { font-size: 11px; fill: #555; }
      .t-lay  { font-size: 11px; fill: #222; }
      .t-num  { font-size: 11px; font-weight: bold; fill: #222; }
      .t-leg  { font-size: 12px; fill: #222; }
      .t-sink { font-size: 11px; font-weight: bold; fill: #b22234; }
    </style>
    <marker id="arb" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#b22234"/>
    </marker>
    <marker id="arg" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#555"/>
    </marker>
  </defs>

  <text class="t-head" x="105" y="22" text-anchor="middle">揚水前</text>
  <text class="t-head" x="295" y="22" text-anchor="middle">揚水後</text>

  <!-- 左：揚水前（x=20〜190） -->
  <rect x="20" y="64" width="170" height="36" fill="#f5f5f5"/>
  <rect x="20" y="100" width="170" height="70" fill="#d7d7d7"/>
  <rect x="20" y="170" width="170" height="56" fill="#e8f0fe"/>
  <rect x="20" y="226" width="170" height="70" fill="#d7d7d7"/>
  <rect x="20" y="296" width="170" height="56" fill="#e8f0fe"/>
  <line x1="20" y1="64" x2="190" y2="64" stroke="#555" stroke-width="1.5"/>
  <line x1="20" y1="84" x2="190" y2="84" stroke="#2e6da4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="t-sm" x="24" y="80">水位</text>
  <text class="t-lay" x="24" y="139">粘土層</text>
  <text class="t-lay" x="24" y="194">砂れき層</text>
  <text class="t-lay" x="24" y="208">（帯水層）</text>
  <text class="t-lay" x="24" y="265">粘土層</text>
  <text class="t-lay" x="24" y="322">砂れき層</text>
  <rect x="91" y="46" width="8" height="284" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text class="t-sm" x="104" y="58">揚水</text>

  <!-- 右：揚水後（x=210〜380）粘土層が縮み、地表が32下がる -->
  <rect x="210" y="96" width="170" height="36" fill="#f5f5f5"/>
  <rect x="210" y="132" width="170" height="54" fill="#d7d7d7"/>
  <rect x="210" y="186" width="170" height="56" fill="#e8f0fe"/>
  <rect x="210" y="242" width="170" height="54" fill="#d7d7d7"/>
  <rect x="210" y="296" width="170" height="56" fill="#e8f0fe"/>
  <line x1="210" y1="64" x2="380" y2="64" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="210" y1="96" x2="380" y2="96" stroke="#555" stroke-width="1.5"/>
  <line x1="210" y1="206" x2="380" y2="206" stroke="#2e6da4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="t-sm" x="214" y="202">水位</text>
  <rect x="281" y="46" width="8" height="284" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text class="t-sm" x="294" y="58">揚水</text>
  <text class="t-sink" x="276" y="84" text-anchor="end">抜け上がり</text>
  <line x1="352" y1="66" x2="352" y2="94" stroke="#b22234" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="t-sink" x="344" y="84" text-anchor="end">地盤沈下</text>

  <!-- 粘土層から帯水層へ出る水 -->
  <line x1="336" y1="146" x2="336" y2="178" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arb)"/>
  <line x1="322" y1="284" x2="322" y2="250" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arb)"/>
  <line x1="352" y1="252" x2="352" y2="288" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arb)"/>

  <!-- 前後の矢印 -->
  <line x1="193" y1="200" x2="207" y2="200" stroke="#555" stroke-width="1.5" marker-end="url(#arg)"/>

  <!-- 手順 -->
  <rect x="20" y="372" width="360" height="118" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <circle cx="40" cy="398" r="9" fill="#ffffff" stroke="#222" stroke-width="1.2"/>
  <text class="t-num" x="40" y="402" text-anchor="middle">1</text>
  <text class="t-leg" x="58" y="402">揚水量が涵養量を上回り、帯水層の水位が下がる</text>
  <circle cx="40" cy="432" r="9" fill="#ffffff" stroke="#222" stroke-width="1.2"/>
  <text class="t-num" x="40" y="436" text-anchor="middle">2</text>
  <text class="t-leg" x="58" y="436">粘土層の水が帯水層へ出て、有効応力が増える</text>
  <circle cx="40" cy="466" r="9" fill="#ffffff" stroke="#222" stroke-width="1.2"/>
  <text class="t-num" x="40" y="470" text-anchor="middle">3</text>
  <text class="t-leg" x="58" y="470">粘土層が縮んで地表が下がり、井戸が抜け上がる</text>
</svg>
