<!-- authored 2026-09-30 doboku-note 自作。題材はコンクリート診断士教材の劣化診断のフロー。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%" role="img"
  aria-label="劣化診断のフロー。構造物の計画・設計・施工の履歴から維持管理計画を立て、点検、調査、診断（対策の要否の判定）を行う。要なら対策、不要なら記録として残し、いずれも記録が次回の点検へ引き継がれる">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 11px; fill: #555; }
      .t-label { font-size: 11px; fill: #1a3a5c; }
      .t-desc  { font-size: 11px; fill: #555; }
      .t-axis  { font-size: 11px; fill: #8a8a8a; }
      .line-main { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .line-dash { stroke: #2e6da4; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
      .line-neu { stroke: #8a8a8a; stroke-width: 1; fill: none; }
      .line-neu-d { stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .line-dng { stroke: #b22234; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
      .box { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-g { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-r { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .conc { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; }
    </style>
    <marker id="ah" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker>
    <marker id="ahr" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#b22234"/></marker>
    <marker id="ahg" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#8a8a8a"/></marker>
  </defs>
  <text class="t-lead" x="200" y="16" text-anchor="middle">劣化診断の流れ（数値なし・順序を示す）</text>
  <rect class="box" x="20" y="30" width="100" height="36" rx="6"/><text class="t-label" x="70" y="53" text-anchor="middle">計画</text>
  <rect class="box" x="150" y="30" width="100" height="36" rx="6"/><text class="t-label" x="200" y="53" text-anchor="middle">設計</text>
  <rect class="box" x="280" y="30" width="100" height="36" rx="6"/><text class="t-label" x="330" y="53" text-anchor="middle">施工</text>
  <line class="line-main" x1="120" y1="48" x2="148" y2="48" marker-end="url(#ah)"/>
  <line class="line-main" x1="250" y1="48" x2="278" y2="48" marker-end="url(#ah)"/>
  <path class="line-main" d="M330,66 L330,80 L200,80 L200,94" marker-end="url(#ah)"/>
  <rect class="box-g" x="110" y="96" width="180" height="34" rx="6"/><text class="t-label" x="200" y="118" text-anchor="middle">維持管理計画</text>
  <line class="line-main" x1="200" y1="130" x2="200" y2="150" marker-end="url(#ah)"/>
  <rect class="box-b" x="110" y="152" width="180" height="34" rx="6"/><text class="t-label" x="200" y="174" text-anchor="middle">点検（初期・定期）</text>
  <line class="line-main" x1="200" y1="186" x2="200" y2="206" marker-end="url(#ah)"/>
  <rect class="box-b" x="110" y="208" width="180" height="34" rx="6"/><text class="t-label" x="200" y="230" text-anchor="middle">調査（詳細調査）</text>
  <line class="line-main" x1="200" y1="242" x2="200" y2="262" marker-end="url(#ah)"/>
  <polygon points="200,264 290,292 200,320 110,292" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text class="t-label" x="200" y="289" text-anchor="middle">診断</text>
  <text class="t-label" x="200" y="304" text-anchor="middle">対策の要否</text>
  <line class="line-main" x1="200" y1="320" x2="200" y2="356" marker-end="url(#ah)"/>
  <text class="t-label" x="208" y="342">必要</text>
  <rect class="box-r" x="110" y="358" width="180" height="34" rx="6"/><text class="t-label" x="200" y="380" text-anchor="middle">対策（補修・補強など）</text>
  <line class="line-main" x1="200" y1="392" x2="200" y2="412" marker-end="url(#ah)"/>
  <rect class="box" x="110" y="414" width="180" height="34" rx="6"/><text class="t-label" x="200" y="436" text-anchor="middle">記録・保管</text>
  <path class="line-main" d="M290,292 L350,292 L350,431 L292,431" marker-end="url(#ah)"/>
  <text class="t-label" x="296" y="284">不要</text>
  <path class="line-neu-d" d="M110,431 L56,431 L56,169 L108,169" marker-end="url(#ahg)"/>
  <text class="t-desc" x="200" y="474" text-anchor="middle">記録は次回の点検へ引き継がれる（破線）</text>
</svg>
