<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="電子線照射で生じる特性X線から元素を分析し、点・線・面の情報で劣化反応の範囲を調べるEPMAの原理">
<defs><style>
text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;}
/* ink-body / ink-strong / brand */
.body{font-size:13px;fill:#555}.small{font-size:11px;fill:#555}.label{font-size:14px;font-weight:bold;fill:#1a3a5c}.em{font-size:16px;font-weight:bold;fill:#1a3a5c}
/* brand-fill / brand, positive-fill / positive, warn-fill / warn, danger-fill / danger, surface / token-border */
.brand{fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5}.positive{fill:#d0e8d0;stroke:#3a7d44;stroke-width:1.5}.warn{fill:#fff3cd;stroke:#d4a017;stroke-width:1.5}.danger{fill:#f8d7da;stroke:#b22234;stroke-width:1.5}.surface{fill:#f5f5f5;stroke:#d7d7d7;stroke-width:1.5}.line{stroke:#2e6da4;stroke-width:1.5;fill:none}
</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#2e6da4"/></marker></defs>
<text x="25" y="32" class="label" text-anchor="start">電子線を試料へ照射</text><line x1="200" y1="57" x2="200" y2="132" class="line" marker-end="url(#arrow)"/><rect x="60" y="147" width="280" height="68" rx="8" class="surface"/><text x="200" y="188" class="label" text-anchor="middle">試料</text><line x1="220" y1="147" x2="300" y2="80" class="line" marker-end="url(#arrow)"/><text x="275" y="62" class="label" text-anchor="start">特性X線</text><line x1="200" y1="215" x2="200" y2="247" class="line" marker-end="url(#arrow)"/><rect x="30" y="260" width="340" height="52" rx="8" class="brand"/><text x="200" y="291" class="label" text-anchor="middle">特性X線から元素の情報を得る</text><circle cx="75" cy="340" r="6" fill="#2e6da4"/><text x="130" y="345" class="body" text-anchor="start">点：局所の元素</text><line x1="52" y1="388" x2="100" y2="388" class="line"/><text x="130" y="393" class="body" text-anchor="start">線：位置による変化</text><rect x="52" y="424" width="48" height="24" class="brand"/><text x="130" y="441" class="body" text-anchor="start">面：元素の分布</text><text x="200" y="482" class="small" text-anchor="middle">深さ方向の分布や劣化反応の範囲を調べる</text>
</svg>
