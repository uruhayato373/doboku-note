<!-- Created by doboku-note, 2026-10-16. 本文に基づく独自構成。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="化学法の判定順序。Rcが700以上は判定せず、未満ではScが10未満か、ScがRc未満かで無害と無害でないを分ける">
<defs><style>
text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;}
/* ink-body / ink-strong / brand */
.body{font-size:13px;fill:#555}.small{font-size:11px;fill:#555}.label{font-size:14px;font-weight:bold;fill:#1a3a5c}.em{font-size:16px;font-weight:bold;fill:#1a3a5c}
/* brand-fill / brand, positive-fill / positive, warn-fill / warn, danger-fill / danger, surface / token-border */
.brand{fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5}.positive{fill:#d0e8d0;stroke:#3a7d44;stroke-width:1.5}.warn{fill:#fff3cd;stroke:#d4a017;stroke-width:1.5}.danger{fill:#f8d7da;stroke:#b22234;stroke-width:1.5}.surface{fill:#f5f5f5;stroke:#d7d7d7;stroke-width:1.5}.line{stroke:#2e6da4;stroke-width:1.5;fill:none}
</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#2e6da4"/></marker></defs>
<text x="20" y="30" class="body" text-anchor="start">Rc：アルカリ濃度減少量</text><text x="20" y="51" class="body" text-anchor="start">Sc：溶解シリカ量（ともに mmol/L）</text><rect x="20" y="77" width="160" height="60" rx="8" class="brand"/><text x="100" y="113" class="em" text-anchor="middle">Rc ≥ 700</text><line x1="180" y1="107" x2="220" y2="107" class="line" marker-end="url(#arrow)"/><rect x="220" y="77" width="160" height="60" rx="8" class="warn"/><text x="300" y="113" class="label" text-anchor="middle">判定しない</text><line x1="100" y1="137" x2="100" y2="176" class="line" marker-end="url(#arrow)"/><text x="113" y="162" class="small" text-anchor="start">Rc &lt; 700</text><rect x="20" y="176" width="160" height="60" rx="8" class="brand"/><text x="100" y="212" class="em" text-anchor="middle">Sc &lt; 10</text><line x1="180" y1="206" x2="220" y2="206" class="line" marker-end="url(#arrow)"/><rect x="220" y="176" width="160" height="60" rx="8" class="positive"/><text x="300" y="212" class="label" text-anchor="middle">無害</text><line x1="100" y1="236" x2="100" y2="275" class="line" marker-end="url(#arrow)"/><text x="113" y="261" class="small" text-anchor="start">Sc ≥ 10</text><rect x="20" y="275" width="160" height="60" rx="8" class="brand"/><text x="100" y="311" class="em" text-anchor="middle">Sc &lt; Rc</text><line x1="180" y1="305" x2="220" y2="305" class="line" marker-end="url(#arrow)"/><rect x="220" y="275" width="160" height="60" rx="8" class="positive"/><text x="300" y="311" class="label" text-anchor="middle">無害</text><line x1="100" y1="335" x2="100" y2="374" class="line" marker-end="url(#arrow)"/><text x="113" y="360" class="small" text-anchor="start">Sc ≥ Rc</text><rect x="20" y="374" width="160" height="50" rx="8" class="danger"/><text x="100" y="405" class="label" text-anchor="middle">無害でない</text><rect x="20" y="443" width="360" height="42" rx="8" class="surface"/><text x="200" y="461" class="small" text-anchor="middle">硬化コンクリートから取り出した骨材には</text><text x="200" y="478" class="small" text-anchor="middle">この判定を適用しない</text>
</svg>
