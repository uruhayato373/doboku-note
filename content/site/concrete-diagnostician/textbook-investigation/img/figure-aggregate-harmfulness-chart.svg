<!-- authored 2026-09-30 doboku-note 自作。題材はコンクリート診断士教材の骨材の化学法（JIS A 1145）判定図。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="化学法の判定図。横軸は溶解シリカ量Sc、縦軸はアルカリ濃度減少量Rc。境界線より上側が無害、下側が無害でないと判定する">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 11px; fill: #555; }
      .t-axis  { font-size: 11px; fill: #8a8a8a; }
      .t-label { font-size: 11px; fill: #1a3a5c; }
      .t-desc  { font-size: 11px; fill: #555; }
      .t-b     { font-size: 12px; fill: #1a3a5c; font-weight: 700; }
      .line-main { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .line-dark { stroke: #1a3a5c; stroke-width: 2; fill: none; }
      .line-dash { stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .line-ax { stroke: #555; stroke-width: 1.5; fill: none; }
      .line-arr { stroke: #1a3a5c; stroke-width: 1.5; fill: none; }
      .box { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-g { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-r { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .box-y { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
    </style>
    <marker id="arr" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#1a3a5c" /></marker>
  </defs>
  <text class="t-lead" x="200" y="16" text-anchor="middle">化学法の判定図（境界線の位置で判定・傾向を示す）</text>
  <path d="M60,40 L356,40 C352,100 340,170 318,205 C295,245 230,272 130,280 L60,280 Z" fill="#d0e8d0" />
  <path d="M130,280 C230,272 295,245 318,205 C340,170 352,100 356,40 L372,40 L372,280 Z" fill="#f8d7da" />
  <line class="line-ax" x1="60" y1="36" x2="60" y2="280" />
  <line class="line-ax" x1="60" y1="280" x2="372" y2="280" />
  <path class="line-dark" d="M130,280 C230,272 295,245 318,205 C340,170 352,100 356,40" />
  <text class="t-axis" x="64" y="32">アルカリ濃度減少量 R<tspan baseline-shift="sub" font-size="11">c</tspan>（mmol/L）</text>
  <text class="t-axis" x="56" y="284" text-anchor="end">0</text>
  <text class="t-axis" x="56" y="48" text-anchor="end">800</text>
  <text class="t-axis" x="60" y="296" text-anchor="middle">1</text>
  <text class="t-axis" x="163" y="296" text-anchor="middle">10</text>
  <text class="t-axis" x="266" y="296" text-anchor="middle">100</text>
  <text class="t-axis" x="369" y="296" text-anchor="middle">1000</text>
  <text class="t-axis" x="216" y="312" text-anchor="middle">溶解シリカ量 S<tspan baseline-shift="sub" font-size="11">c</tspan>（mmol/L）</text>
  <rect class="box-g" x="80" y="120" width="60" height="26" rx="4" />
  <text class="t-label" x="110" y="138" text-anchor="middle">無害</text>
  <rect class="box-r" x="262" y="246" width="96" height="26" rx="4" />
  <text class="t-label" x="310" y="264" text-anchor="middle">無害でない</text>
  <text class="t-label" x="250" y="110" text-anchor="end">判定境界</text>
  <line class="line-arr" x1="254" y1="108" x2="334" y2="108" marker-end="url(#arr)" />
  <rect class="box" x="20" y="330" width="360" height="156" rx="6" />
  <text class="t-b" x="34" y="350">化学法（JIS A 1145）の判定</text>
  <text class="t-desc" x="34" y="372">試験で得た Rc と Sc をこの図にプロットして判定</text>
  <text class="t-desc" x="34" y="392">境界線の上側が無害、下側が無害でない</text>
  <text class="t-desc" x="34" y="412"></text>
  <text class="t-desc" x="34" y="432">硬化コンクリートから取り出した骨材には適用外</text>
  <text class="t-desc" x="34" y="452">判定しにくい骨材はモルタルバー法と併用する</text>
</svg>
