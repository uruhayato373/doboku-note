<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="TGの質量減少とDTAの吸熱ピークを分けて示した模式図。水酸化カルシウムは約400〜600℃、炭酸カルシウムは約600〜800℃の反応域">
<defs><style>
text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;}
/* ink-body / ink-strong / brand */
.body{font-size:13px;fill:#555}.small{font-size:11px;fill:#555}.label{font-size:14px;font-weight:bold;fill:#1a3a5c}.em{font-size:16px;font-weight:bold;fill:#1a3a5c}
/* brand-fill / brand, positive-fill / positive, warn-fill / warn, danger-fill / danger, surface / token-border */
.brand{fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5}.positive{fill:#d0e8d0;stroke:#3a7d44;stroke-width:1.5}.warn{fill:#fff3cd;stroke:#d4a017;stroke-width:1.5}.danger{fill:#f8d7da;stroke:#b22234;stroke-width:1.5}.surface{fill:#f5f5f5;stroke:#d7d7d7;stroke-width:1.5}.line{stroke:#2e6da4;stroke-width:1.5;fill:none}
</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#2e6da4"/></marker></defs>
<text x="20" y="29" class="small" text-anchor="start">温度に対する変化（模式）</text><rect x="168" y="59" width="64" height="112" fill="#fff3cd"/><rect x="232" y="59" width="64" height="112" fill="#e8f0fe"/><line x1="40" y1="171" x2="365" y2="171" class="line"/><rect x="168" y="226" width="64" height="112" fill="#fff3cd"/><rect x="232" y="226" width="64" height="112" fill="#e8f0fe"/><line x1="40" y1="338" x2="365" y2="338" class="line"/><text x="40" y="50" class="label" text-anchor="start">TG：質量の減少</text><text x="40" y="215" class="label" text-anchor="start">DTA：吸熱ピーク</text><path d="M40 78 C95 78 145 80 166 82 C180 86 206 107 232 109 C252 115 274 147 298 150 L360 152" class="line"/><path d="M40 254 L166 254 C184 254 186 292 200 292 C216 292 217 254 232 254 C247 254 250 310 264 310 C280 310 281 254 298 254 L360 254" class="line"/><text x="325" y="278" class="small" text-anchor="start">吸熱</text><line x1="340" y1="284" x2="340" y2="315" class="line" marker-end="url(#arrow)"/><text x="168" y="358" class="small" text-anchor="middle">400</text><text x="232" y="358" class="small" text-anchor="middle">600</text><text x="296" y="358" class="small" text-anchor="middle">800</text><text x="361" y="378" class="small" text-anchor="end">温度（℃）</text><rect x="20" y="396" width="360" height="42" rx="8" class="warn"/><text x="200" y="421" class="body" text-anchor="middle">約400〜600℃：水酸化カルシウムの脱水</text><rect x="20" y="449" width="360" height="36" rx="8" class="brand"/><text x="200" y="472" class="body" text-anchor="middle">約600〜800℃：炭酸カルシウムの脱炭酸</text>
</svg>
