<!-- Created by doboku-note, 2026-10-16. 本文に基づく独自構成。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="測定に使った照合電極を確認し、電極の仕様に基づいてCSE基準へ換算してから腐食の可能性を評価する流れ">
<defs><style>
text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;}
/* ink-body / ink-strong / brand */
.body{font-size:13px;fill:#555}.small{font-size:11px;fill:#555}.label{font-size:14px;font-weight:bold;fill:#1a3a5c}.em{font-size:16px;font-weight:bold;fill:#1a3a5c}
/* brand-fill / brand, positive-fill / positive, warn-fill / warn, danger-fill / danger, surface / token-border */
.brand{fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5}.positive{fill:#d0e8d0;stroke:#3a7d44;stroke-width:1.5}.warn{fill:#fff3cd;stroke:#d4a017;stroke-width:1.5}.danger{fill:#f8d7da;stroke:#b22234;stroke-width:1.5}.surface{fill:#f5f5f5;stroke:#d7d7d7;stroke-width:1.5}.line{stroke:#2e6da4;stroke-width:1.5;fill:none}
</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#2e6da4"/></marker></defs>
<text x="200" y="32" class="small" text-anchor="middle">照合電極が変わると、電位の基準点も変わる</text><rect x="20" y="60" width="360" height="82" rx="8" class="brand"/><text x="200" y="93" class="label" text-anchor="middle">測定値と照合電極を組にする</text><text x="200" y="121" class="body" text-anchor="middle">CSE・SCE・銀／塩化銀電極など</text><line x1="200" y1="142" x2="200" y2="186" class="line" marker-end="url(#arrow)"/><rect x="20" y="186" width="360" height="82" rx="8" class="warn"/><text x="200" y="219" class="label" text-anchor="middle">電極の仕様から換算値を確認</text><text x="200" y="247" class="body" text-anchor="middle">電極間の電位差を補正する</text><line x1="200" y1="268" x2="200" y2="312" class="line" marker-end="url(#arrow)"/><rect x="20" y="312" width="360" height="82" rx="8" class="positive"/><text x="200" y="345" class="label" text-anchor="middle">CSE基準にそろえて評価</text><text x="200" y="373" class="body" text-anchor="middle">−350 mV より卑 → 腐食の可能性が高い</text><rect x="20" y="430" width="360" height="55" rx="8" class="surface"/><text x="200" y="452" class="label" text-anchor="middle">換算値を一律に決めない</text><text x="200" y="474" class="small" text-anchor="middle">測定時の電極仕様に基づいて比較する</text>
</svg>
