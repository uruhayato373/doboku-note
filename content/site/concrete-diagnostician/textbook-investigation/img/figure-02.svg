<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="コアドリルで構造物から円柱供試体を採取する模式図と、採取したコアから得られる試験項目">
  <defs>
    <marker id="cdi2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <text x="200" y="16" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">実物サンプルが得られる一方、構造物を必ず損傷する</text>

  <rect x="30" y="60" width="200" height="130" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
  <text x="40" y="182" font-family="sans-serif" font-size="11" fill="#8a8a8a">既設コンクリート</text>

  <line x1="30" y1="130" x2="230" y2="130" stroke="#8a8a8a" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="40" y="148" font-family="sans-serif" font-size="11" fill="#8a8a8a">鉄筋</text>

  <rect x="96" y="92" width="42" height="34" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <rect x="108" y="36" width="18" height="56" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="150" y="52" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2e6da4">コアドリル</text>
  <line x1="117" y1="126" x2="117" y2="150" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#cdi2)"/>

  <text x="248" y="92" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1a3a5c">採取の要点</text>
  <text x="248" y="110" font-family="sans-serif" font-size="11" fill="#555">径 φ50〜100 mm</text>
  <text x="248" y="126" font-family="sans-serif" font-size="11" fill="#555">径が大きいほど</text>
  <text x="248" y="142" font-family="sans-serif" font-size="11" fill="#555">代表性は高い</text>
  <text x="248" y="164" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b22234">鉄筋を切らない位置</text>

  <ellipse cx="70" cy="228" rx="26" ry="9" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <path d="M44 228 L44 300 A26 9 0 0 0 96 300 L96 228" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="70" y="322" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1a3a5c">コア供試体</text>

  <line x1="110" y1="264" x2="146" y2="264" stroke="#555" stroke-width="1.5" marker-end="url(#cdi2)"/>

  <rect x="152" y="220" width="228" height="34" rx="3" fill="#ffffff" stroke="#d7d7d7" stroke-width="1.2"/>
  <text x="164" y="242" font-family="sans-serif" font-size="11" fill="#555">圧縮強度試験</text>

  <rect x="152" y="262" width="228" height="34" rx="3" fill="#ffffff" stroke="#d7d7d7" stroke-width="1.2"/>
  <text x="164" y="284" font-family="sans-serif" font-size="11" fill="#555">中性化深さの測定</text>

  <rect x="152" y="304" width="228" height="34" rx="3" fill="#ffffff" stroke="#d7d7d7" stroke-width="1.2"/>
  <text x="164" y="326" font-family="sans-serif" font-size="11" fill="#555">塩化物イオン含有量試験</text>

  <rect x="20" y="356" width="360" height="126" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="200" y="376" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222">非破壊試験との使い分け</text>
  <text x="34" y="400" font-family="sans-serif" font-size="11" fill="#555">非破壊で 面的に あたりを付ける</text>
  <text x="34" y="422" font-family="sans-serif" font-size="11" fill="#555">→ 絞り込んだ箇所だけコアを採る</text>
  <text x="34" y="444" font-family="sans-serif" font-size="11" fill="#555">→ 実測値で非破壊の推定を較正する</text>
  <text x="34" y="468" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b22234">全項目を一律に実施しない</text>
</svg>
