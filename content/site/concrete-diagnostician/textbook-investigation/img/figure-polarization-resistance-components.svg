<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="直流法にはコンクリート抵抗が重なる。交流法はRsと、Rctおよび電気二重層容量の並列成分を分離して腐食速度を推定する">
<defs><style>
text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;}
/* ink-body / ink-strong / brand */
.body{font-size:13px;fill:#555}.small{font-size:11px;fill:#555}.label{font-size:14px;font-weight:bold;fill:#1a3a5c}.em{font-size:16px;font-weight:bold;fill:#1a3a5c}
/* brand-fill / brand, positive-fill / positive, warn-fill / warn, danger-fill / danger, surface / token-border */
.brand{fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5}.positive{fill:#d0e8d0;stroke:#3a7d44;stroke-width:1.5}.warn{fill:#fff3cd;stroke:#d4a017;stroke-width:1.5}.danger{fill:#f8d7da;stroke:#b22234;stroke-width:1.5}.surface{fill:#f5f5f5;stroke:#d7d7d7;stroke-width:1.5}.line{stroke:#2e6da4;stroke-width:1.5;fill:none}
</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#2e6da4"/></marker></defs>
<text x="20" y="32" class="label" text-anchor="start">直流法：読み値にコンクリート抵抗が重なる</text><rect x="20" y="52" width="170" height="58" rx="8" class="surface"/><text x="105" y="77" class="body" text-anchor="middle">コンクリートの抵抗</text><text x="105" y="97" class="label" text-anchor="middle">Rs</text><text x="200" y="87" class="label" text-anchor="middle">＋</text><rect x="210" y="52" width="170" height="58" rx="8" class="brand"/><text x="295" y="77" class="body" text-anchor="middle">鉄筋表面の反応抵抗</text><text x="295" y="97" class="label" text-anchor="middle">Rct</text><text x="20" y="155" class="label" text-anchor="start">交流法：周波数を変えて成分を分離</text><line x1="30" y1="249" x2="64" y2="249" class="line"/><path d="M64 249 L72 237 L84 261 L96 237 L108 261 L116 249 L145 249 M145 249 L145 202 L182 202 M145 249 L145 303 L211 303 M267 202 L310 202 L310 249 L370 249 M239 303 L310 303 L310 249" class="line"/><path d="M182 202 L190 190 L202 214 L214 190 L226 214 L238 190 L250 214 L258 202 L267 202 M211 288 L211 318 M239 288 L239 318" class="line"/><text x="91" y="285" class="label" text-anchor="middle">Rs</text><text x="223" y="181" class="label" text-anchor="middle">Rct</text><text x="225" y="346" class="body" text-anchor="middle">電気二重層容量</text><line x1="200" y1="360" x2="200" y2="385" class="line" marker-end="url(#arrow)"/><rect x="20" y="400" width="360" height="79" rx="8" class="positive"/><text x="200" y="427" class="label" text-anchor="middle">コンクリート抵抗の影響を分ける</text><text x="200" y="452" class="body" text-anchor="middle">Rct を分極抵抗として使い、</text><text x="200" y="471" class="body" text-anchor="middle">腐食速度を推定する</text>
</svg>
