<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="SEMは電子線を走査して反射電子・二次電子から微細な表面形態を観察し、EPMAの組成分析と組み合わせる">
<defs><style>
text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;}
/* ink-body / ink-strong / brand */
.body{font-size:13px;fill:#555}.small{font-size:11px;fill:#555}.label{font-size:14px;font-weight:bold;fill:#1a3a5c}.em{font-size:16px;font-weight:bold;fill:#1a3a5c}
/* brand-fill / brand, positive-fill / positive, warn-fill / warn, danger-fill / danger, surface / token-border */
.brand{fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5}.positive{fill:#d0e8d0;stroke:#3a7d44;stroke-width:1.5}.warn{fill:#fff3cd;stroke:#d4a017;stroke-width:1.5}.danger{fill:#f8d7da;stroke:#b22234;stroke-width:1.5}.surface{fill:#f5f5f5;stroke:#d7d7d7;stroke-width:1.5}.line{stroke:#2e6da4;stroke-width:1.5;fill:none}
</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#2e6da4"/></marker></defs>
<text x="200" y="35" class="label" text-anchor="middle">電子線を表面で走査</text><line x1="120" y1="55" x2="120" y2="122" class="line" marker-end="url(#arrow)"/><line x1="120" y1="77" x2="280" y2="77" class="line" marker-end="url(#arrow)"/><text x="285" y="83" class="small" text-anchor="start">走査</text><path d="M55 139 L90 128 L125 143 L160 125 L195 145 L230 127 L265 140 L305 125 L345 137 L345 201 L55 201Z" class="surface"/><text x="200" y="181" class="body" text-anchor="middle">試料表面</text><line x1="245" y1="139" x2="300" y2="102" class="line" marker-end="url(#arrow)"/><text x="25" y="232" class="body" text-anchor="start">表面からの反射電子・二次電子を検出</text><line x1="200" y1="244" x2="200" y2="276" class="line" marker-end="url(#arrow)"/><rect x="35" y="291" width="330" height="65" rx="8" class="brand"/><text x="200" y="318" class="label" text-anchor="middle">微細な表面形態を観察</text><text x="200" y="342" class="body" text-anchor="middle">ひび割れ・骨材界面・反応生成物</text><line x1="200" y1="356" x2="200" y2="388" class="line" marker-end="url(#arrow)"/><rect x="20" y="405" width="360" height="72" rx="8" class="positive"/><text x="200" y="433" class="label" text-anchor="middle">SEM の形態 ＋ EPMA の組成</text><text x="200" y="459" class="body" text-anchor="middle">場所・組成・形態を組合せて読む</text>
</svg>
