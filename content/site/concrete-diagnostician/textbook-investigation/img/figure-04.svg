<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="分極抵抗法の測定回路の模式図と、分極抵抗から腐食電流密度を求める関係および自然電位法との役割分担">
  <defs>
    <marker id="cdi4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <text x="200" y="16" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">微小電流を流し、電位の動きにくさから腐食速度を推定する</text>

  <rect x="30" y="96" width="340" height="104" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
  <text x="42" y="116" font-family="sans-serif" font-size="11" fill="#8a8a8a">コンクリート</text>

  <line x1="50" y1="168" x2="350" y2="168" stroke="#8a8a8a" stroke-width="4"/>
  <text x="300" y="190" font-family="sans-serif" font-size="11" fill="#8a8a8a">鉄筋</text>

  <rect x="140" y="72" width="30" height="24" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="176" y="82" font-family="sans-serif" font-size="11" fill="#2e6da4">照合電極</text>

  <rect x="224" y="72" width="52" height="24" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text x="282" y="88" font-family="sans-serif" font-size="11" fill="#d4a017">対極</text>

  <circle cx="66" cy="46" r="18" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
  <text x="66" y="51" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#222">A</text>
  <text x="90" y="82" font-family="sans-serif" font-size="11" fill="#555">測定器</text>

  <path d="M84 46 L155 46 L155 72" fill="none" stroke="#222" stroke-width="1.5"/>
  <path d="M84 56 L250 56 L250 72" fill="none" stroke="#d4a017" stroke-width="1.5"/>
  <path d="M52 62 L52 168" fill="none" stroke="#222" stroke-width="1.5"/>
  <circle cx="52" cy="168" r="4" fill="#222"/>

  <line x1="250" y1="100" x2="250" y2="160" stroke="#d4a017" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#cdi4)"/>
  <text x="258" y="134" font-family="sans-serif" font-size="11" fill="#d4a017">微小電流</text>

  <rect x="20" y="216" width="360" height="92" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="34" y="238" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1a3a5c">分極抵抗 と 腐食電流</text>
  <text x="34" y="260" font-family="sans-serif" font-size="11" fill="#555">分極抵抗 Rp ＝ 電位の変化量 ÷ 流した電流</text>
  <text x="34" y="282" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2e6da4">腐食電流密度 ＝ B ÷ Rp（B は定数）</text>
  <text x="34" y="300" font-family="sans-serif" font-size="11" fill="#8a8a8a">Rp が小さいほど腐食が速い</text>

  <rect x="20" y="322" width="360" height="160" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="200" y="342" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222">2 つの電気化学的手法の役割</text>

  <rect x="30" y="352" width="340" height="56" rx="3" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text x="42" y="372" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1a3a5c">自然電位法</text>
  <text x="42" y="392" font-family="sans-serif" font-size="11" fill="#555">腐食しているか（活動度）を面的に探す</text>

  <rect x="30" y="414" width="340" height="56" rx="3" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text x="42" y="434" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1a3a5c">分極抵抗法</text>
  <text x="42" y="454" font-family="sans-serif" font-size="11" fill="#555">どれだけ速く進むか（速度）を定量する</text>
</svg>
