<!-- authored 2026-09-30 doboku-note 自作。題材はコンクリート診断士教材の維持管理対策の実施フロー。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="維持管理対策の実施フロー。計画と区分を決め、点検・調査・診断で状況をつかみ、劣化の推定と予測、性能の評価で見通しを立て、対策の要否を判定する。不要なら無処置で終了、必要なら点検強化・補修・補強・供用制限・解体撤去から選んで実施する">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 11px; fill: #555; }
      .t-axis  { font-size: 11px; fill: #8a8a8a; }
      .t-label { font-size: 12px; fill: #1a3a5c; }
      .t-small { font-size: 11px; fill: #1a3a5c; }
      .t-desc  { font-size: 11px; fill: #555; }
      .t-strong { font-size: 12px; fill: #222; font-weight: 700; }
      .line-main { stroke: #2e6da4; stroke-width: 1.5; fill: none; }
      .line-dash { stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .line-warn { stroke: #b22234; stroke-width: 1.5; fill: none; }
      .box { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-g { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-r { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .chip { fill: #fff; stroke: #2e6da4; stroke-width: 1; }
    </style>
    <marker id="ab" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker>
    <marker id="am" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#8a8a8a"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#b22234"/></marker>
  </defs>
  <text class="t-lead" x="200" y="16" text-anchor="middle">維持管理対策の実施フロー</text>
  <rect class="box-b" x="24" y="28" width="352" height="60" rx="6" />
  <text class="t-label" x="200" y="48" text-anchor="middle">状況をつかむ</text>
  <text class="t-desc" x="200" y="66" text-anchor="middle">維持管理計画と管理区分を決める</text>
  <text class="t-desc" x="200" y="80" text-anchor="middle">点検・調査で劣化や変状を診断する</text>
  <line class="line-main" x1="200" y1="88" x2="200" y2="102" marker-end="url(#ab)" />
  <rect class="box-b" x="24" y="102" width="352" height="60" rx="6" />
  <text class="t-label" x="200" y="122" text-anchor="middle">見通しを立てる</text>
  <text class="t-desc" x="200" y="140" text-anchor="middle">劣化の原因を推定し、進行を予測する</text>
  <text class="t-desc" x="200" y="154" text-anchor="middle">構造物の性能を評価する</text>
  <line class="line-main" x1="200" y1="162" x2="200" y2="178" marker-end="url(#ab)" />
  <polygon class="box-w" points="200,178 290,208 200,238 110,208" />
  <text class="t-label" x="200" y="212" text-anchor="middle">対策は必要か</text>
  <line class="line-main" x1="200" y1="238" x2="105" y2="272" marker-end="url(#ab)" />
  <line class="line-main" x1="200" y1="238" x2="295" y2="272" marker-end="url(#ab)" />
  <text class="t-label" x="128" y="258" text-anchor="end">不要</text>
  <text class="t-label" x="262" y="258" text-anchor="start">必要</text>
  <rect class="box-g" x="24" y="272" width="160" height="44" rx="6" />
  <text class="t-label" x="104" y="290" text-anchor="middle">何もせず終了</text>
  <text class="t-label" x="104" y="306" text-anchor="middle">（無処置）</text>
  <rect class="box-b" x="200" y="272" width="176" height="136" rx="8" />
  <text class="t-label" x="288" y="292" text-anchor="middle">対策を選んで実施</text>
  <rect class="chip" x="208" y="304" width="72" height="26" rx="6" />
  <text class="t-small" x="244" y="321" text-anchor="middle">点検強化</text>
  <rect class="chip" x="288" y="304" width="72" height="26" rx="6" />
  <text class="t-small" x="324" y="321" text-anchor="middle">補修</text>
  <rect class="chip" x="208" y="336" width="72" height="26" rx="6" />
  <text class="t-small" x="244" y="353" text-anchor="middle">補強</text>
  <rect class="chip" x="288" y="336" width="72" height="26" rx="6" />
  <text class="t-small" x="324" y="353" text-anchor="middle">供用制限</text>
  <rect class="chip" x="248" y="368" width="72" height="26" rx="6" />
  <text class="t-small" x="284" y="385" text-anchor="middle">解体・撤去</text>
  <rect class="box" x="24" y="430" width="352" height="50" rx="6" />
  <text class="t-desc" x="200" y="451" text-anchor="middle">対策は緊急度と管理区分に応じて選ぶ</text>
  <text class="t-desc" x="200" y="468" text-anchor="middle">内容は応急・暫定・延命・恒久に分かれる</text>
</svg>
