<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="予防保全と事後保全における性能の推移と累積コストの比較、および介入回数と工法選択で結果が変わるという注意">
  <defs>
    <marker id="cdm1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <text x="200" y="16" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">性能の落とし方が、あとから効いてくる</text>

  <line x1="56" y1="150" x2="376" y2="150" stroke="#222" stroke-width="1.5" marker-end="url(#cdm1)"/>
  <line x1="56" y1="150" x2="56" y2="32" stroke="#222" stroke-width="1.5" marker-end="url(#cdm1)"/>
  <text x="62" y="44" font-family="sans-serif" font-size="11" fill="#222">性能</text>
  <text x="374" y="168" text-anchor="end" font-family="sans-serif" font-size="11" fill="#222">時間</text>

  <line x1="56" y1="118" x2="360" y2="118" stroke="#b22234" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="360" y="112" text-anchor="end" font-family="sans-serif" font-size="11" fill="#b22234">許容限界</text>

  <path d="M56 50 L110 74 L110 54 L164 78 L164 56 L218 80 L218 58 L272 82 L272 60 L330 84" fill="none" stroke="#3a7d44" stroke-width="2.2"/>
  <path d="M56 50 L150 116 L216 140 L216 56 L300 120 L350 142" fill="none" stroke="#b22234" stroke-width="2.2"/>
  <text x="120" y="48" font-family="sans-serif" font-size="11" font-weight="bold" fill="#3a7d44">予防保全</text>
  <text x="240" y="136" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b22234">事後保全</text>

  <line x1="56" y1="320" x2="376" y2="320" stroke="#222" stroke-width="1.5" marker-end="url(#cdm1)"/>
  <line x1="56" y1="320" x2="56" y2="196" stroke="#222" stroke-width="1.5" marker-end="url(#cdm1)"/>
  <text x="62" y="208" font-family="sans-serif" font-size="11" fill="#222">累積コスト</text>
  <text x="374" y="338" text-anchor="end" font-family="sans-serif" font-size="11" fill="#222">時間</text>

  <path d="M56 314 L110 314 L110 300 L164 300 L164 286 L218 286 L218 272 L272 272 L272 258 L330 258" fill="none" stroke="#3a7d44" stroke-width="2.2"/>
  <path d="M56 316 L150 316 L150 268 L216 268 L216 210 L350 210" fill="none" stroke="#b22234" stroke-width="2.2"/>
  <text x="250" y="252" font-family="sans-serif" font-size="11" font-weight="bold" fill="#3a7d44">小刻みに積み上がる</text>
  <text x="176" y="228" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b22234">大きく跳ねる</text>

  <rect x="20" y="350" width="360" height="132" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="34" y="372" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1a3a5c">事後保全</text>
  <text x="34" y="392" font-family="sans-serif" font-size="11" fill="#555">顕在化してから対処。損傷が急拡大し規模が大きい</text>
  <text x="34" y="420" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1a3a5c">予防保全</text>
  <text x="34" y="440" font-family="sans-serif" font-size="11" fill="#555">限界に達する前に計画的に介入する</text>
  <text x="34" y="468" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b22234">介入回数と工法選択しだいで総額は変わる</text>
</svg>
