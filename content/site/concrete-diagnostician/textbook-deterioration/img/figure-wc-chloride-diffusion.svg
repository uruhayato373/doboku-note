<!-- authored 2026-09-30 doboku-note 自作。題材はコンクリート診断士教材の塩化物イオンの拡散と水セメント比。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="水セメント比と塩化物イオン拡散係数の関係の概念グラフ。横軸は水セメント比0.3から0.8、縦軸は拡散係数の対数軸。普通ポルトランドセメントと高炉セメントB種のいずれも水セメント比が大きいほど拡散係数が大きくなる">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 11px; fill: #555; }
      .t-axis  { font-size: 11px; fill: #8a8a8a; }
      .t-label { font-size: 11px; fill: #1a3a5c; }
      .t-desc  { font-size: 11px; fill: #555; }
      .t-danger { font-size: 11px; fill: #b22234; }
      .line-main { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .line-red { stroke: #b22234; stroke-width: 2; fill: none; }
      .line-dash { stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .axis { stroke: #8a8a8a; stroke-width: 1.5; fill: none; }
      .box { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-r { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .box-g { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
    </style>
    <marker id="ar" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker>
    <marker id="arg" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#8a8a8a"/></marker>
  </defs>
  <text class="t-lead" x="200" y="18" text-anchor="middle">横軸＝水セメント比、縦軸＝拡散係数（対数・数値なし）</text>
  <line class="axis" x1="50" y1="270" x2="372" y2="270" />
  <line class="axis" x1="50" y1="36" x2="50" y2="270" />
  <text class="t-axis" x="54" y="34">塩化物イオンの拡散係数 D（対数軸）</text>
  <text class="t-axis" x="50" y="286" text-anchor="middle">0.3</text>
  <text class="t-axis" x="362" y="286" text-anchor="middle">0.8</text>
  <text class="t-axis" x="206" y="304" text-anchor="middle">水セメント比 W/C</text>
  <path class="line-main" d="M60,215 C 140,190 230,150 300,105 C 330,85 350,70 362,60" />
  <path class="line-red" d="M100,250 C 170,225 240,170 300,105 C 330,75 345,62 362,52" style="stroke-dasharray:5 3" />
  <text class="t-label" x="72" y="200">N：普通ポルトランドセメント</text>
  <text class="t-danger" x="200" y="250">BB：高炉セメントB種</text>
  <text class="t-lead" x="20" y="324">読み取り方</text>
  <rect class="box" x="20" y="330" width="360" height="116" rx="6" />
  <rect class="box-b" x="32" y="341" width="12" height="12" />
  <text class="t-desc" x="52" y="352">W/Cが大きいほど拡散係数が大きい（組織が粗い）</text>
  <rect class="box-b" x="32" y="365" width="12" height="12" />
  <text class="t-desc" x="52" y="376">拡散係数はセメント種類でも変わる</text>
  <rect class="box-b" x="32" y="389" width="12" height="12" />
  <text class="t-desc" x="52" y="400">低W/Cでは高炉セメントB種のほうが小さい傾向</text>
  <rect class="box-b" x="32" y="413" width="12" height="12" />
  <text class="t-desc" x="52" y="424">拡散係数が大きいほど塩化物が内部へ進みやすい</text>
</svg>
