<!-- doboku-note 自作。本文の論点を再構成した概念図。書籍図の複製・トレースではない。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="水セメント比が大きいほど塩化物イオンの拡散係数が大きくなる傾向を示す概念図。セメント種類などの条件で関係は変わる。">
<defs><style>
text{font-family:Inter,"Noto Sans JP","Hiragino Sans",sans-serif;fill:#555}
.title{font-size:16px;font-weight:bold;fill:#1a3a5c}.body{font-size:13px}.small{font-size:11px}.label{font-size:13px;font-weight:bold;fill:#1a3a5c}.red{font-size:13px;fill:#b22234}.blue{font-size:13px;fill:#2e6da4}
.axis{stroke:#555;stroke-width:1.5;fill:none}.dash{stroke:#8a8a8a;stroke-dasharray:4 4;fill:none}.line{stroke:#2e6da4;stroke-width:3;fill:none}
/* brand #e8f0fe/#2e6da4; danger #f8d7da/#b22234; warn #fff3cd; surface #f5f5f5 */
</style><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2e6da4"/></marker></defs>

<text x="200" y="30" class="title" text-anchor="middle">拡散のしやすさを配合と結び付ける</text>
<text x="45" y="80" class="label" text-anchor="start">塩化物イオンの拡散係数 D</text><path class="axis" d="M45 96V320H365"/>
<path class="line" d="M65 291C158 273 268 209 350 115"/>
<text x="60" y="344" class="small" text-anchor="start">小さい</text><text x="355" y="344" class="small" text-anchor="end">大きい</text><text x="200" y="370" class="label" text-anchor="middle">水セメント比 W/C</text>
<text x="75" y="240" class="blue" text-anchor="start">拡散しにくい</text><text x="243" y="100" class="blue" text-anchor="start">拡散しやすい</text>
<rect x="22" y="402" width="356" height="74" rx="8" fill="#e8f0fe" stroke="#2e6da4"/>
<text x="40" y="432" class="body" text-anchor="start">セメント種類などの条件でも変わる</text><text x="40" y="457" class="small" text-anchor="start">傾向を示す概念図。設計用の数値は読めない</text>
</svg>
