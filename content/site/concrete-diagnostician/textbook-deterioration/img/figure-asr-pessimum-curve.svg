<!-- doboku-note 自作。本文の論点を再構成した概念図。書籍図の複製・トレースではない。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="反応性骨材の混入率と膨張量の概念図。中間の混入率で膨張が最大となるペシマムを示す。">
<defs><style>
text{font-family:Inter,"Noto Sans JP","Hiragino Sans",sans-serif;fill:#555}
.title{font-size:16px;font-weight:bold;fill:#1a3a5c}.body{font-size:13px}.small{font-size:11px}.label{font-size:13px;font-weight:bold;fill:#1a3a5c}.red{font-size:13px;fill:#b22234}.blue{font-size:13px;fill:#2e6da4}
.axis{stroke:#555;stroke-width:1.5;fill:none}.dash{stroke:#8a8a8a;stroke-dasharray:4 4;fill:none}.line{stroke:#2e6da4;stroke-width:3;fill:none}
/* brand #e8f0fe/#2e6da4; danger #f8d7da/#b22234; warn #fff3cd; surface #f5f5f5 */
</style><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2e6da4"/></marker></defs>

<text x="200" y="30" class="title" text-anchor="middle">多いほど膨張するとは限らない</text>
<text x="45" y="84" class="label" text-anchor="start">膨張量</text><path class="axis" d="M45 100V310H365"/>
<path class="line" d="M45 303C95 299 127 285 154 198C171 140 184 120 204 120C248 120 255 260 365 285"/>
<line class="dash" x1="204" y1="120" x2="204" y2="310"/>
<circle cx="204" cy="120" r="5" fill="#b22234"/>
<text x="204" y="101" class="red" text-anchor="middle">膨張が最大</text><text x="45" y="332" class="small" text-anchor="start">少ない</text><text x="365" y="332" class="small" text-anchor="end">多い</text>
<text x="204" y="351" class="label" text-anchor="middle">反応性骨材の混入率</text>
<rect x="22" y="382" width="356" height="94" rx="8" fill="#fff3cd" stroke="#d4a017"/>
<text x="40" y="410" class="label" text-anchor="start">ペシマム＝最も膨張する混入率</text>
<text x="40" y="438" class="small" text-anchor="start">ピークの位置は骨材の種類や粒径で変わる</text>
<text x="40" y="460" class="small" text-anchor="start">定量値を表す曲線ではない</text>
</svg>
