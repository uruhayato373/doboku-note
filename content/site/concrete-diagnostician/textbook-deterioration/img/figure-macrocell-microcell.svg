<!-- authored 2026-09-12 doboku-note 自作。題材はコンクリート診断士テキスト「劣化機構」の論点。特定の書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="同一鉄筋上でアノード・カソードが微小に混在するミクロセル腐食と、断面修復の境界で未修復部がアノード・修復部がカソードになるマクロセル腐食に犠牲陽極材を配置する仕組み">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-sec  { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-desc { font-size: 11px; fill: #555; }
      .t-a { font-size: 11px; font-weight: bold; fill: #b22234; }
      .t-c { font-size: 11px; font-weight: bold; fill: #3a7d44; }
      .bar { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .anode { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .cathode { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .zinc { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
    </style>
    <marker id="arrB" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#3a7d44"/>
    </marker>
  </defs>

  <text class="t-lead" x="200" y="16" text-anchor="middle">アノード・カソードの距離で呼び名が変わる腐食電池</text>

  <!-- ミクロセル -->
  <text class="t-sec" x="20" y="42">① ミクロセル腐食（同一鉄筋上）</text>
  <rect class="bar" x="30" y="66" width="340" height="26" rx="13"/>
  <circle class="anode" cx="65" cy="79" r="10"/>
  <text class="t-a" x="65" y="83" text-anchor="middle">A</text>
  <circle class="cathode" cx="125" cy="79" r="10"/>
  <text class="t-c" x="125" y="83" text-anchor="middle">C</text>
  <circle class="anode" cx="185" cy="79" r="10"/>
  <text class="t-a" x="185" y="83" text-anchor="middle">A</text>
  <circle class="cathode" cx="245" cy="79" r="10"/>
  <text class="t-c" x="245" y="83" text-anchor="middle">C</text>
  <circle class="anode" cx="305" cy="79" r="10"/>
  <text class="t-a" x="305" y="83" text-anchor="middle">A</text>
  <circle class="cathode" cx="335" cy="79" r="10"/>
  <text class="t-c" x="335" y="83" text-anchor="middle">C</text>
  <path d="M65,66 Q95,50 125,66" fill="none" stroke="#2e6da4" stroke-width="1.2" marker-end="url(#arrB)"/>
  <path d="M185,66 Q215,50 245,66" fill="none" stroke="#2e6da4" stroke-width="1.2" marker-end="url(#arrB)"/>
  <path d="M305,66 Q320,55 335,66" fill="none" stroke="#2e6da4" stroke-width="1.2" marker-end="url(#arrB)"/>
  <text class="t-desc" x="20" y="118">極めて近い距離でアノードとカソードが混在し</text>
  <text class="t-desc" x="20" y="135">局所的に腐食が進行するのがミクロセル腐食</text>

  <line x1="20" y1="160" x2="380" y2="160" stroke="#d7d7d7" stroke-width="1"/>

  <!-- マクロセル -->
  <text class="t-sec" x="20" y="186">② マクロセル腐食（断面修復の境界）</text>

  <rect class="anode" x="30" y="205" width="180" height="46" rx="4"/>
  <text class="t-a" x="46" y="224">未修復部＝アノード</text>
  <text class="t-desc" x="46" y="242">中性化・塩害で電位が低い</text>

  <rect class="cathode" x="210" y="205" width="160" height="46" rx="4"/>
  <text class="t-c" x="226" y="224">修復部＝カソード</text>
  <text class="t-desc" x="226" y="242">新規打替えで電位が高い</text>

  <line x1="210" y1="205" x2="210" y2="295" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 3"/>

  <rect class="bar" x="30" y="263" width="340" height="18" rx="9"/>
  <path d="M60,272 L340,272" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrB)"/>
  <text class="t-desc" x="30" y="296">腐食電流（境界に集中しやすい）</text>

  <rect class="zinc" x="190" y="308" width="40" height="26" rx="4"/>
  <text x="210" y="325" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">亜鉛</text>
  <path d="M210,308 L210,282" fill="none" stroke="#3a7d44" stroke-width="1.5" marker-end="url(#arrP)"/>

  <text class="t-desc" x="20" y="368">境界の未修復部にアノードが集中するマクロセル</text>
  <text class="t-desc" x="20" y="385">腐食に対し、境界に犠牲陽極材（亜鉛）を置くと</text>
  <text class="t-desc" x="20" y="402">電流を横取りし、既設鋼材の腐食の進行を防ぐ</text>

  <rect x="20" y="425" width="360" height="55" rx="8" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text class="t-desc" x="36" y="447">凡例: 　A＝アノード（腐食が進む側）</text>
  <text class="t-desc" x="36" y="465">　　　 C＝カソード（腐食を免れる側）</text>
</svg>
