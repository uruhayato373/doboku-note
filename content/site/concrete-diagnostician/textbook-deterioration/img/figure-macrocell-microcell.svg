<!-- doboku-note 自作。本文の論点を再構成した概念図。書籍図の複製・トレースではない。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="ミクロセルはアノードとカソードが近接し、マクロセルは離れた位置に分かれる。鉄筋内の電子はアノードからカソードへ移動する。">
<defs><style>
text{font-family:Inter,"Noto Sans JP","Hiragino Sans",sans-serif;fill:#555}
.title{font-size:16px;font-weight:bold;fill:#1a3a5c}.body{font-size:13px}.small{font-size:11px}.label{font-size:13px;font-weight:bold;fill:#1a3a5c}.red{font-size:13px;fill:#b22234}.blue{font-size:13px;fill:#2e6da4}
.axis{stroke:#555;stroke-width:1.5;fill:none}.dash{stroke:#8a8a8a;stroke-dasharray:4 4;fill:none}.line{stroke:#2e6da4;stroke-width:3;fill:none}
/* brand #e8f0fe/#2e6da4; danger #f8d7da/#b22234; warn #fff3cd; surface #f5f5f5 */
</style><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2e6da4"/></marker></defs>

<text x="200" y="30" class="title" text-anchor="middle">腐食が進む場所と電子の移動</text>
<text x="25" y="73" class="label" text-anchor="start">ミクロセル：ごく近くに混在</text>
<rect x="30" y="112" width="340" height="32" rx="10" fill="#f5f5f5" stroke="#8a8a8a"/>
<circle cx="65" cy="128" r="12" fill="#f8d7da" stroke="#b22234"/><text x="65" y="133" class="red" text-anchor="middle">A</text><circle cx="113" cy="128" r="12" fill="#e8f0fe" stroke="#2e6da4"/><text x="113" y="133" class="blue" text-anchor="middle">C</text><path d="M65 115Q89 84 113 115" stroke="#2e6da4" fill="none" marker-end="url(#arr)"/><circle cx="175" cy="128" r="12" fill="#f8d7da" stroke="#b22234"/><text x="175" y="133" class="red" text-anchor="middle">A</text><circle cx="223" cy="128" r="12" fill="#e8f0fe" stroke="#2e6da4"/><text x="223" y="133" class="blue" text-anchor="middle">C</text><path d="M175 115Q199 84 223 115" stroke="#2e6da4" fill="none" marker-end="url(#arr)"/><circle cx="285" cy="128" r="12" fill="#f8d7da" stroke="#b22234"/><text x="285" y="133" class="red" text-anchor="middle">A</text><circle cx="333" cy="128" r="12" fill="#e8f0fe" stroke="#2e6da4"/><text x="333" y="133" class="blue" text-anchor="middle">C</text><path d="M285 115Q309 84 333 115" stroke="#2e6da4" fill="none" marker-end="url(#arr)"/>
<text x="200" y="178" class="body" text-anchor="middle">同じ鉄筋上の近接した位置で反応</text>
<line x1="25" y1="205" x2="375" y2="205" stroke="#d7d7d7"/>
<text x="25" y="243" class="label" text-anchor="start">マクロセル：離れた位置に分かれる</text>
<rect x="30" y="269" width="170" height="94" fill="#f8d7da" stroke="#b22234"/><rect x="200" y="269" width="170" height="94" fill="#e8f0fe" stroke="#2e6da4"/>
<text x="115" y="293" class="label" text-anchor="middle">未修復部</text><text x="285" y="293" class="label" text-anchor="middle">修復部</text>
<rect x="40" y="311" width="320" height="23" rx="8" fill="#f5f5f5" stroke="#8a8a8a"/>
<text x="70" y="328" class="red" text-anchor="start">A</text><text x="326" y="328" class="blue" text-anchor="start">C</text><path d="M103 322H307" stroke="#2e6da4" stroke-width="2" marker-end="url(#arr)"/>
<text x="200" y="379" class="small" text-anchor="middle">鉄筋内を電子が移動</text>
<text x="200" y="401" class="small" text-anchor="middle">修復境界の未修復部で腐食が進むことがある</text>
<rect x="22" y="418" width="356" height="60" rx="8" fill="#f5f5f5" stroke="#d7d7d7"/>
<text x="40" y="442" class="red" text-anchor="start">A：アノード（鉄が溶出する側）</text><text x="40" y="465" class="blue" text-anchor="start">C：カソード（酸素が電子を受け取る側）</text>
</svg>
