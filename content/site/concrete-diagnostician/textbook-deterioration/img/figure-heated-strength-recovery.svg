<!-- doboku-note 自作。本文の論点を再構成した概念図。書籍図の複製・トレースではない。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="受熱500℃以下での回復傾向の概念図。強度より弾性係数の回復は小さく遅い。500℃を超える部分は回復を前提にしない。">
<defs><style>
text{font-family:Inter,"Noto Sans JP","Hiragino Sans",sans-serif;fill:#555}
.title{font-size:16px;font-weight:bold;fill:#1a3a5c}.body{font-size:13px}.small{font-size:11px}.label{font-size:13px;font-weight:bold;fill:#1a3a5c}.red{font-size:13px;fill:#b22234}.blue{font-size:13px;fill:#2e6da4}
.axis{stroke:#555;stroke-width:1.5;fill:none}.dash{stroke:#8a8a8a;stroke-dasharray:4 4;fill:none}.line{stroke:#2e6da4;stroke-width:3;fill:none}
/* brand #e8f0fe/#2e6da4; danger #f8d7da/#b22234; warn #fff3cd; surface #f5f5f5 */
</style><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2e6da4"/></marker></defs>

<text x="200" y="30" class="title" text-anchor="middle">強度の回復だけで健全としない</text>
<text x="30" y="66" class="label" text-anchor="start">受熱がおおむね500℃以下：回復する場合</text>
<path class="axis" d="M45 100V300H368"/>
<text x="45" y="90" class="small" text-anchor="start">加熱前に対する性能（概念）</text>
<line class="dash" x1="45" y1="112" x2="365" y2="112"/><text x="360" y="105" class="small" text-anchor="end">加熱前</text>
<path class="line" d="M45 198C95 198 154 155 220 150S320 145 365 145"/>
<path d="M45 266C140 266 194 249 270 238C310 232 340 232 365 232" stroke="#b22234" stroke-width="3" fill="none"/>
<text x="260" y="175" class="blue" text-anchor="start">圧縮強度</text><text x="260" y="257" class="red" text-anchor="start">弾性係数</text>
<text x="45" y="322" class="small" text-anchor="start">冷却後</text><text x="365" y="322" class="small" text-anchor="end">時間の経過 →</text>
<text x="200" y="352" class="body" text-anchor="middle">弾性係数の戻りは小さく、時間もかかる</text>
<rect x="22" y="382" width="356" height="94" rx="8" fill="#f8d7da" stroke="#b22234"/>
<text x="40" y="410" class="label" text-anchor="start">500℃を超える部分</text><text x="40" y="438" class="small" text-anchor="start">回復を前提にせず、調査で補修・補強を判断</text><text x="40" y="460" class="small" text-anchor="start">曲線は傾向。回復率や所要期間を示さない</text>
</svg>
