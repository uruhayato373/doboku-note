<!-- authored 2026-09-30 doboku-note 自作。題材はコンクリート診断士教材の海洋環境の区分と塩化物供給。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="海洋環境の区分の断面模式図。上から海上大気部、飛沫部、干満部、海中部に分かれ、平均満潮面・平均水面・平均干潮面が境界を示す。塩化物と乾湿繰返しの条件が最も揃うのは飛沫部">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 11px; fill: #555; }
      .t-axis  { font-size: 11px; fill: #8a8a8a; }
      .t-label { font-size: 11px; fill: #1a3a5c; }
      .t-desc  { font-size: 11px; fill: #555; }
      .t-danger { font-size: 11px; fill: #b22234; }
      .line-main { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .line-red { stroke: #b22234; stroke-width: 2; fill: none; }
      .line-dash { stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .axis { stroke: #8a8a8a; stroke-width: 1.5; fill: none; }
      .box { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-r { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .box-g { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
    </style>
    <marker id="ar" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker>
    <marker id="arg" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#8a8a8a"/></marker>
  </defs>
  <text class="t-lead" x="200" y="18" text-anchor="middle">海洋コンクリート構造物の高さ方向の区分</text>
  <rect class="box" x="20" y="36" width="36" height="384" />
  <text class="t-axis" x="38" y="430" text-anchor="middle">躯体</text>
  <rect class="box" x="56" y="36" width="336" height="90" />
  <text class="t-label" x="66" y="58">海上大気部</text>
  <text class="t-desc" x="66" y="76">飛来塩分のみを受け</text>
  <text class="t-desc" x="66" y="91">供給は飛沫部より少ない</text>
  <rect class="box-r" x="56" y="126" width="336" height="80" />
  <text class="t-label" x="66" y="148">飛沫部</text>
  <text class="t-desc" x="66" y="166">塩分供給が多く乾湿の</text>
  <text class="t-desc" x="66" y="181">繰返しで濃縮：最も厳しい</text>
  <rect class="box-w" x="56" y="206" width="336" height="90" />
  <text class="t-label" x="66" y="228">干満部</text>
  <text class="t-desc" x="66" y="246">乾湿の繰返しがあり</text>
  <text class="t-desc" x="66" y="261">厳しいが頻度は低め</text>
  <rect class="box-b" x="56" y="296" width="336" height="124" />
  <text class="t-label" x="66" y="318">海中部</text>
  <text class="t-desc" x="66" y="336">塩化物は供給されるが</text>
  <text class="t-desc" x="66" y="351">鉄筋は腐食しにくい</text>
  <rect class="box" x="20" y="36" width="36" height="384" />
  <line class="line-dash" x1="56" y1="206" x2="392" y2="206" />
  <text class="t-axis" x="386" y="202" text-anchor="end">平均満潮面</text>
  <line class="line-dash" x1="56" y1="251" x2="392" y2="251" />
  <text class="t-axis" x="386" y="247" text-anchor="end">平均水面</text>
  <line class="line-dash" x1="56" y1="296" x2="392" y2="296" />
  <text class="t-axis" x="386" y="292" text-anchor="end">平均干潮面</text>
  <rect class="box-b" x="20" y="448" width="360" height="40" rx="6" />
  <text class="t-label" x="200" y="464" text-anchor="middle">塩化物・水分・酸素の3条件が最も揃いやすいのは</text>
  <text class="t-danger" x="200" y="480" text-anchor="middle">飛沫部</text>
</svg>
