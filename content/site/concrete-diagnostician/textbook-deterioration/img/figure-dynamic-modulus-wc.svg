<!-- authored 2026-09-30 doboku-note 自作。題材はコンクリート診断士教材の凍結融解試験と水セメント比。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="凍結融解サイクル数と相対動弾性係数の関係の概念図。水セメント比が小さい配合ほど低下しにくく、大きい配合ほど少ないサイクル数から低下する">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 11px; fill: #555; }
      .t-axis  { font-size: 11px; fill: #8a8a8a; }
      .t-label { font-size: 11px; fill: #1a3a5c; }
      .t-desc  { font-size: 11px; fill: #555; }
      .line-main { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .line-grn { stroke: #3a7d44; stroke-width: 2; fill: none; }
      .line-wrn { stroke: #d4a017; stroke-width: 2; fill: none; }
      .line-red { stroke: #b22234; stroke-width: 2; fill: none; }
      .line-gray { stroke: #555; stroke-width: 1.2; fill: none; }
      .line-dash { stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .box { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-g { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-r { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
    </style>
    <marker id="arr" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#555"/></marker>
  </defs>
  <text class="t-lead" x="200" y="16" text-anchor="middle">横軸＝サイクル数、縦軸＝相対動弾性係数（数値なし）</text>
  <line class="line-dash" x1="40" y1="290" x2="370" y2="290" />
  <line class="line-dash" x1="40" y1="40" x2="40" y2="290" />
  <text class="t-axis" x="44" y="36">相対動弾性係数（高い）</text>
  <text class="t-axis" x="370" y="306" text-anchor="end">凍結融解サイクル数 →</text>
  <path class="line-grn" d="M40,70 L370,74" />
  <path class="line-main" d="M40,70 C 160,72 240,90 320,190" />
  <path class="line-wrn" d="M40,70 C 110,72 170,110 240,230" />
  <path class="line-red" d="M40,70 C 70,90 90,140 120,250" />
  <circle cx="320" cy="190" r="3" fill="#2e6da4" />
  <circle cx="240" cy="230" r="3" fill="#d4a017" />
  <circle cx="120" cy="250" r="3" fill="#b22234" />
  <text class="t-label" x="370" y="62" text-anchor="end">W/C 小</text>
  <text class="t-label" x="314" y="212" text-anchor="end">W/C やや小</text>
  <text class="t-label" x="248" y="236">W/C やや大</text>
  <text class="t-label" x="128" y="266">W/C 大</text>
  <text class="t-lead" x="20" y="340">読み取り</text>
  <rect class="box" x="20" y="346" width="360" height="140" rx="6" />
  <rect class="box-g" x="34" y="360" width="14" height="14" />
  <text class="t-desc" x="54" y="372">W/Cが小さい：組織が緻密で、ほとんど低下しない</text>
  <rect class="box-r" x="34" y="388" width="14" height="14" />
  <text class="t-desc" x="54" y="400">W/Cが大きい：少ないサイクル数から低下する</text>
  <text class="t-desc" x="34" y="430">凍結する自由水の量が少ないほど、凍害の被害は</text>
  <text class="t-desc" x="34" y="446">小さくなる方向である</text>
  <text class="t-desc" x="34" y="470">→ 高強度コンクリートほど凍害に強い傾向</text>
</svg>
