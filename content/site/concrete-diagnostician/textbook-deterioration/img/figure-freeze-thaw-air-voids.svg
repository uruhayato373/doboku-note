<!-- authored 2026-09-12 doboku-note 自作。題材はコンクリート診断士テキスト「劣化機構」の論点。特定の書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="凍結時に毛細管の水が膨張して圧力が生じる断面と、近くの独立気泡が圧力の逃げ場になる様子を気泡間隔の広い場合・狭い場合で対比する図">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-col  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-desc { font-size: 11px; fill: #555; }
      .t-danger { font-size: 11px; font-weight: bold; fill: #b22234; }
      .t-positive { font-size: 11px; font-weight: bold; fill: #3a7d44; }
      .box-s { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .ice { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .void { fill: #ffffff; stroke: #8a8a8a; stroke-width: 1.3; }
    </style>
    <marker id="arrD" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0,0 7,3.5 0,7" fill="#b22234"/>
    </marker>
    <marker id="arrP2" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0,0 7,3.5 0,7" fill="#3a7d44"/>
    </marker>
  </defs>

  <text class="t-lead" x="200" y="16" text-anchor="middle">凍結の膨張圧は近くの気泡へ逃がすことで抑えられる</text>

  <!-- 左: 間隔が広い -->
  <rect class="box-s" x="20" y="30" width="175" height="230" rx="8"/>
  <text class="t-col" x="107" y="52" text-anchor="middle">気泡間隔が広い</text>
  <circle class="ice" cx="107" cy="110" r="20"/>
  <line x1="107" y1="90" x2="107" y2="70" stroke="#b22234" stroke-width="1.5" marker-end="url(#arrD)"/>
  <line x1="127" y1="110" x2="150" y2="110" stroke="#b22234" stroke-width="1.5" marker-end="url(#arrD)"/>
  <line x1="87" y1="110" x2="64" y2="110" stroke="#b22234" stroke-width="1.5" marker-end="url(#arrD)"/>
  <line x1="107" y1="130" x2="107" y2="152" stroke="#b22234" stroke-width="1.5" marker-end="url(#arrD)"/>
  <circle class="void" cx="165" cy="225" r="10"/>
  <circle class="void" cx="170" cy="60" r="10"/>
  <text class="t-danger" x="107" y="178" text-anchor="middle">圧力の逃げ場が遠い</text>
  <text class="t-desc" x="35" y="200">組織の内部に圧力が</text>
  <text class="t-desc" x="35" y="216">蓄積し破壊が進む</text>
  <text class="t-desc" x="35" y="238">気泡間隔＝広い</text>

  <!-- 右: 間隔が狭い -->
  <rect class="box-s" x="205" y="30" width="175" height="230" rx="8"/>
  <text class="t-col" x="292" y="52" text-anchor="middle">気泡間隔が狭い</text>
  <circle class="ice" cx="292" cy="110" r="20"/>
  <circle class="void" cx="255" cy="90" r="9"/>
  <circle class="void" cx="330" cy="95" r="9"/>
  <circle class="void" cx="270" cy="145" r="9"/>
  <circle class="void" cx="320" cy="140" r="9"/>
  <line x1="280" y1="98" x2="262" y2="94" stroke="#3a7d44" stroke-width="1.5" marker-end="url(#arrP2)"/>
  <line x1="308" y1="98" x2="323" y2="97" stroke="#3a7d44" stroke-width="1.5" marker-end="url(#arrP2)"/>
  <line x1="284" y1="128" x2="273" y2="140" stroke="#3a7d44" stroke-width="1.5" marker-end="url(#arrP2)"/>
  <text class="t-positive" x="292" y="178" text-anchor="middle">圧力が気泡へ逃げる</text>
  <text class="t-desc" x="220" y="200">気泡が緩衝材になり</text>
  <text class="t-desc" x="220" y="216">組織の破壊を防ぐ</text>
  <text class="t-desc" x="220" y="238">気泡間隔＝狭い</text>

  <text class="t-desc" x="20" y="288">気泡間隔係数（気泡どうしの平均距離）は</text>
  <text class="t-desc" x="20" y="306">おおむね250μm以下が耐凍害性確保の目安</text>

  <rect x="20" y="330" width="360" height="150" rx="8" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="36" y="352" font-size="12" font-weight="bold" fill="#1a3a5c">図の凡例</text>

  <circle class="ice" cx="52" cy="374" r="8"/>
  <text class="t-desc" x="68" y="378">凍結した毛細管水（膨張中）</text>

  <circle class="void" cx="52" cy="402" r="8"/>
  <text class="t-desc" x="68" y="406">独立気泡（連行空気・圧力の逃げ場）</text>

  <line x1="42" y1="430" x2="62" y2="430" stroke="#b22234" stroke-width="1.5" marker-end="url(#arrD)"/>
  <text class="t-desc" x="68" y="434">行き場のない膨張圧</text>

  <line x1="42" y1="458" x2="62" y2="458" stroke="#3a7d44" stroke-width="1.5" marker-end="url(#arrP2)"/>
  <text class="t-desc" x="68" y="462">気泡へ逃げる圧力</text>
</svg>
