<!-- authored 2026-09-30 doboku-note 自作。題材はコンクリート診断士教材の凍害の劣化進行過程。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="凍結融解回数に対する凍害劣化の進行過程。潜伏期・進展期・加速期・劣化期の4段階で、美観・景観に着目した場合は性能低下が早い段階から現れ、安全性に着目した場合は劣化期になって耐荷力・剛性の低下が現れることを上下2つの概念グラフで示す">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 11px; fill: #555; }
      .t-axis  { font-size: 11px; fill: #8a8a8a; }
      .t-label { font-size: 11px; fill: #1a3a5c; }
      .t-strong{ font-size: 12px; fill: #1a3a5c; font-weight: 700; }
      .t-desc  { font-size: 11px; fill: #555; }
      .t-red   { font-size: 11px; fill: #b22234; }
      .t-grn   { font-size: 11px; fill: #3a7d44; }
      .line-main { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .line-red { stroke: #b22234; stroke-width: 2; fill: none; }
      .line-grn { stroke: #3a7d44; stroke-width: 2; fill: none; }
      .line-dash { stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .line-ax { stroke: #8a8a8a; stroke-width: 1.5; fill: none; }
      .line-br { stroke: #1a3a5c; stroke-width: 1.5; fill: none; }
      .box { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-g { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-r { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
    </style>
    <marker id="ar" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#1a3a5c" /></marker>
    <marker id="ag" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#8a8a8a" /></marker>
  </defs>
  <text class="t-lead" x="200" y="14" text-anchor="middle">上向き＝コンクリートの劣化、下向き＝部材の性能低下（数値なし）</text>
  <text class="t-strong" x="30" y="34">美観・景観に着目した場合</text>
  <line class="line-ax" x1="30" y1="136" x2="392" y2="136" />
  <line class="line-ax" x1="30" y1="44" x2="30" y2="216" />
  <line class="line-dash" x1="120" y1="44" x2="120" y2="226" />
  <line class="line-dash" x1="210" y1="44" x2="210" y2="226" />
  <line class="line-dash" x1="300" y1="44" x2="300" y2="226" />
  <text class="t-axis" x="392" y="130" text-anchor="end">凍結融解回数</text>
  <path class="line-main" d="M30,136 C 80,136 100,132 120,131 C 160,128 185,124 210,118 C 250,108 270,96 300,81 C 330,66 360,56 388,51" />
  <line class="line-dash" x1="120" y1="92" x2="120" y2="128" marker-end="url(#ag)" />
  <line class="line-dash" x1="210" y1="74" x2="210" y2="114" marker-end="url(#ag)" />
  <line class="line-dash" x1="300" y1="56" x2="300" y2="78" marker-end="url(#ag)" />
  <text class="t-label" x="120" y="88" text-anchor="middle">スケーリング開始</text>
  <text class="t-label" x="210" y="70" text-anchor="middle">骨材の露出・剥落</text>
  <text class="t-label" x="300" y="52" text-anchor="middle">鋼材の露出・腐食</text>
  <path class="line-red" d="M30,136 C 80,138 120,142 160,148 C 210,156 250,168 300,184 C 330,194 360,202 388,208" />
  <text class="t-red" x="388" y="224" text-anchor="end">美観の低下</text>
  <text class="t-desc" x="75" y="240" text-anchor="middle">潜伏期</text>
  <text class="t-desc" x="165" y="240" text-anchor="middle">進展期</text>
  <text class="t-desc" x="255" y="240" text-anchor="middle">加速期</text>
  <text class="t-desc" x="346" y="240" text-anchor="middle">劣化期</text>
  <text class="t-strong" x="30" y="270">安全性に着目した場合</text>
  <line class="line-ax" x1="30" y1="372" x2="392" y2="372" />
  <line class="line-ax" x1="30" y1="280" x2="30" y2="452" />
  <line class="line-dash" x1="120" y1="280" x2="120" y2="462" />
  <line class="line-dash" x1="210" y1="280" x2="210" y2="462" />
  <line class="line-dash" x1="300" y1="280" x2="300" y2="462" />
  <text class="t-axis" x="392" y="366" text-anchor="end">凍結融解回数</text>
  <path class="line-main" d="M30,372 C 80,372 100,368 120,367 C 160,364 185,360 210,354 C 250,344 270,332 300,317 C 330,302 360,292 388,287" />
  <line class="line-dash" x1="120" y1="328" x2="120" y2="364" marker-end="url(#ag)" />
  <line class="line-dash" x1="210" y1="310" x2="210" y2="350" marker-end="url(#ag)" />
  <line class="line-dash" x1="300" y1="292" x2="300" y2="314" marker-end="url(#ag)" />
  <text class="t-label" x="120" y="324" text-anchor="middle">スケーリング開始</text>
  <text class="t-label" x="210" y="306" text-anchor="middle">骨材の露出・剥落</text>
  <text class="t-label" x="300" y="288" text-anchor="middle">鋼材の露出・腐食</text>
  <path class="line-red" d="M30,372 C 100,372 200,373 300,377 C 330,382 360,400 388,422" />
  <text class="t-red" x="388" y="440" text-anchor="end">耐荷力・剛性の低下</text>
  <text class="t-desc" x="75" y="476" text-anchor="middle">潜伏期</text>
  <text class="t-desc" x="165" y="476" text-anchor="middle">進展期</text>
  <text class="t-desc" x="255" y="476" text-anchor="middle">加速期</text>
  <text class="t-desc" x="346" y="476" text-anchor="middle">劣化期</text>

</svg>
