<!-- authored 2026-09-12 doboku-note 自作。題材はコンクリート診断士テキスト「評価」の論点。特定の書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="腐食発生限界塩化物イオン濃度は基準により異なり、一般値1.2kg/m3・現行示方書の算定式・港湾基準2.0kg/m3を比較し同じ測定値でも判定が変わることを示す図">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-sec  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-name { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-desc { font-size: 12px; fill: #555; }
      .t-ctx  { font-size: 11px; fill: #8a8a8a; }
      .t-sum  { font-size: 12px; fill: #222; }
      .box-surface { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-b       { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-w       { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
    </style>
  </defs>

  <text class="t-lead" x="200" y="16" text-anchor="middle">腐食発生限界濃度は基準によって値が異なる</text>

  <rect class="box-surface" x="20" y="30" width="360" height="90" rx="6"/>
  <text class="t-name" x="35" y="52">一般値（旧来の目安）</text>
  <text class="t-desc" x="35" y="74">腐食発生限界濃度　1.2 kg/m³</text>
  <text class="t-ctx" x="35" y="94">多くの基準で参照されてきた簡便な目安値</text>

  <rect class="box-b" x="20" y="135" width="360" height="105" rx="6"/>
  <text class="t-name" x="35" y="157">コンクリート標準示方書（現行）</text>
  <text class="t-desc" x="35" y="177">普通ポルトランドセメントの場合：</text>
  <text class="t-desc" x="35" y="197">Clim = -3.0×(W/C) + 3.4 [kg/m³]</text>
  <text class="t-ctx" x="35" y="219">水セメント比0.30〜0.55の範囲で算定</text>

  <rect class="box-w" x="20" y="255" width="360" height="90" rx="6"/>
  <text class="t-name" x="35" y="277">港湾の施設の技術上の基準</text>
  <text class="t-desc" x="35" y="299">腐食発生限界濃度　2.0 kg/m³</text>
  <text class="t-ctx" x="35" y="319">港湾構造物を対象とする基準値</text>

  <text class="t-sec" x="20" y="365">同じ測定値でも判定が変わる</text>
  <rect class="box-surface" x="20" y="372" width="360" height="90" rx="6"/>
  <text class="t-sum" x="200" y="394" text-anchor="middle">同じ塩化物イオン濃度の測定値でも、</text>
  <text class="t-sum" x="200" y="414" text-anchor="middle">参照する基準によって腐食発生の判定は変わる</text>
  <text class="t-sum" x="200" y="434" text-anchor="middle">対象構造物の管理者・所管基準を確認して選ぶ</text>
</svg>
