  <text class="t-desc" x="34" y="340">応力振幅：上限応力と下限応力の幅</text>
  <text class="t-desc" x="34" y="360">平均応力：上限と下限の中間の応力</text>
  <text class="t-desc" x="34" y="380">繰り返し 1 回：山から次の山まで（谷から谷も同じ）</text>
  <text class="t-label" x="34" y="410">マイナー則：累積損傷度 D ＝ Σ(n<tspan dy="3">i</tspan><tspan dy="-3"> </tspan>/ N<tspan dy="3">i</tspan><tspan dy="-3">)</tspan></text>
  <text class="t-desc" x="34" y="432">n<tspan dy="3">i</tspan><tspan dy="-3">：</tspan>応力の繰返し回数、N<tspan dy="3">i</tspan><tspan dy="-3">：</tspan>その応力での疲労寿命</text>
  <text class="t-desc" x="34" y="454">D が 1.0 以上で疲労破壊と判定する</text>
  <text class="t-desc" x="34" y="472">応力振幅が変動するときは回数のカウントが前提</text>
</svg>
