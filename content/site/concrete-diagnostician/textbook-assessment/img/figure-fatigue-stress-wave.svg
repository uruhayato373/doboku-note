<!-- authored 2026-09-30 doboku-note 自作。題材はコンクリート診断士教材の繰返し応力。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="時間に対する繰返し応力の正弦波。上限応力・下限応力・平均応力・応力振幅の位置と、波の山から次の山までが繰り返し回数 n=1 に当たることを示す">
  <defs>
