<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="断面修復工法の断面模式図と、はつりから養生までの施工手順および品質の急所">
  <defs>
    <marker id="cdr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <text x="200" y="16" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">劣化部を健全部まで確実に除いてから充填する</text>

  <rect x="30" y="34" width="150" height="110" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
  <path d="M60 34 L150 34 L140 78 L70 78 Z" fill="#f8d7da" stroke="#b22234" stroke-width="1.5"/>
  <line x1="40" y1="96" x2="170" y2="96" stroke="#8a8a8a" stroke-width="4"/>
  <circle cx="105" cy="96" r="9" fill="#b22234" opacity="0.6"/>
  <text x="105" y="162" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b22234">劣化部と腐食した鉄筋</text>

  <line x1="188" y1="90" x2="212" y2="90" stroke="#555" stroke-width="1.5" marker-end="url(#cdr2)"/>

  <rect x="220" y="34" width="150" height="110" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
  <path d="M250 34 L340 34 L330 78 L260 78 Z" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
  <line x1="230" y1="96" x2="360" y2="96" stroke="#8a8a8a" stroke-width="4"/>
  <text x="295" y="162" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#3a7d44">修復材で断面を回復</text>

  <rect x="20" y="178" width="360" height="188" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="200" y="198" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222">施工手順</text>

  <rect x="30" y="208" width="340" height="28" rx="3" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text x="42" y="227" font-family="sans-serif" font-size="11" fill="#555">1. 劣化部コンクリートの除去（はつり）</text>

  <rect x="30" y="240" width="340" height="28" rx="3" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text x="42" y="259" font-family="sans-serif" font-size="11" fill="#555">2. 鉄筋の錆落とし・防錆処理</text>

  <rect x="30" y="272" width="340" height="28" rx="3" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text x="42" y="291" font-family="sans-serif" font-size="11" fill="#555">3. 下地処理（プライマー・吸水調整）</text>

  <rect x="30" y="304" width="340" height="28" rx="3" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text x="42" y="323" font-family="sans-serif" font-size="11" fill="#555">4. 修復材の充填・塗付</text>

  <rect x="30" y="336" width="340" height="24" rx="3" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text x="42" y="353" font-family="sans-serif" font-size="11" fill="#555">5. 養生</text>

  <rect x="20" y="382" width="360" height="100" rx="6" fill="#f8d7da" stroke="#b22234" stroke-width="1.5"/>
  <text x="34" y="404" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1a3a5c">品質の急所</text>
  <text x="34" y="426" font-family="sans-serif" font-size="11" fill="#555">残った劣化部が付着界面の弱点になる</text>
  <text x="34" y="448" font-family="sans-serif" font-size="11" fill="#555">腐食生成物は物理的に除いてから防錆する</text>
  <text x="34" y="470" font-family="sans-serif" font-size="11" fill="#555">はつりは健全部まで到達させる</text>
</svg>
