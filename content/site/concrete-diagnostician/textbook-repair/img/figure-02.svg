<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="劣化部の除去、鉄筋の錆落としと防錆、下地処理後の充填と養生を示す断面図">
<defs><style>
text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#555}.body{font-size:13px}.head{font-size:15px;font-weight:bold;fill:#1a3a5c}.small{font-size:12px}.strong{font-size:13px;font-weight:bold;fill:#1a3a5c}
/* ink-body / ink-strong / brand-fill / brand / positive-fill / positive / warn-fill / warn / danger-fill / danger / surface / token-border */
.surface{fill:#f5f5f5;stroke:#d7d7d7;stroke-width:1.5}.brand{fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5}.positive{fill:#d0e8d0;stroke:#3a7d44;stroke-width:1.5}.warn{fill:#fff3cd;stroke:#d4a017;stroke-width:1.5}.danger{fill:#f8d7da;stroke:#b22234;stroke-width:1.5}.line{stroke:#555;stroke-width:1.5;fill:none}.blue{stroke:#2e6da4;stroke-width:2;fill:none}.red{stroke:#b22234;stroke-width:2;fill:none}.green{stroke:#3a7d44;stroke-width:3;fill:none}
</style><marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#2e6da4"/></marker><marker id="g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#3a7d44"/></marker></defs>
<text class="head" x="200" y="28" text-anchor="middle">鉄筋の処置と断面の回復を一続きで見る</text><rect class="surface" x="20" y="50" width="360" height="112" rx="6"/><text class="head" x="36" y="75" text-anchor="start">劣化部を除去する</text><rect class="surface" x="38" y="92" width="160" height="54" rx="0"/><path class="danger" d="M82 92H159V136H82Z"/><line class="red" x1="46" y1="122" x2="190" y2="122" stroke-width="4"/><text class="small" x="215" y="107" text-anchor="start">劣化範囲を確認</text><text class="small" x="215" y="129" text-anchor="start">健全部まで除去</text><line class="blue" x1="200" y1="166" x2="200" y2="182" marker-end="url(#a)"/><rect class="surface" x="20" y="187" width="360" height="112" rx="6"/><text class="head" x="36" y="212" text-anchor="start">鉄筋を処置する</text><rect class="surface" x="38" y="229" width="160" height="54" rx="0"/><path d="M82 229H159V273H82Z" fill="#fff" stroke="#555" stroke-width="1.5" stroke-dasharray="4 3"/><line class="blue" x1="46" y1="259" x2="190" y2="259" stroke-width="4"/><text class="small" x="215" y="244" text-anchor="start">錆落とし・防錆</text><text class="small" x="215" y="266" text-anchor="start">鉄筋周囲を処置</text><line class="blue" x1="200" y1="303" x2="200" y2="319" marker-end="url(#a)"/><rect class="surface" x="20" y="324" width="360" height="112" rx="6"/><text class="head" x="36" y="349" text-anchor="start">修復材で断面を戻す</text><rect class="surface" x="38" y="366" width="160" height="54" rx="0"/><rect class="positive" x="82" y="366" width="77" height="44" rx="0"/><line class="blue" x1="46" y1="396" x2="190" y2="396" stroke-width="4"/><text class="small" x="215" y="381" text-anchor="start">下地を整え</text><text class="small" x="215" y="403" text-anchor="start">充填して養生</text><text class="small" x="200" y="466" text-anchor="middle">残った劣化部や弱い界面が再劣化の起点になる</text>
</svg>
