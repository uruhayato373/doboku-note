<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="RC巻立て工法と増厚工法の断面模式図、および鋼板接着工法を含む断面を増やす補強の比較">
  <text x="200" y="16" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">断面を足して耐力・剛性を上げる。外形と施工空間が制約になる</text>

  <rect x="46" y="40" width="120" height="120" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <rect x="76" y="70" width="60" height="60" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
  <text x="106" y="105" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8a8a">既設</text>
  <circle cx="60" cy="54" r="3" fill="#2e6da4"/>
  <circle cx="152" cy="54" r="3" fill="#2e6da4"/>
  <circle cx="60" cy="146" r="3" fill="#2e6da4"/>
  <circle cx="152" cy="146" r="3" fill="#2e6da4"/>
  <text x="106" y="180" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1a3a5c">RC 巻立て</text>
  <text x="106" y="196" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">外周に新設 RC</text>

  <rect x="234" y="70" width="120" height="60" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
  <rect x="234" y="130" width="120" height="26" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
  <text x="294" y="104" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8a8a">既設スラブ・梁</text>
  <text x="294" y="180" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1a3a5c">増厚</text>
  <text x="294" y="196" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">下面・上面に打ち増し</text>

  <rect x="20" y="214" width="360" height="120" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="200" y="234" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222">選ぶときに効く条件</text>

  <rect x="30" y="244" width="340" height="38" rx="3" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text x="42" y="260" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1a3a5c">RC 巻立て</text>
  <text x="42" y="276" font-family="sans-serif" font-size="11" fill="#555">耐力とじん性を大きく上げるが外形が変わる</text>

  <rect x="30" y="286" width="340" height="38" rx="3" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text x="42" y="302" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1a3a5c">増厚</text>
  <text x="42" y="318" font-family="sans-serif" font-size="11" fill="#555">界面の付着確保が核心。目荒らし＋プライマー</text>

  <rect x="20" y="344" width="360" height="138" rx="6" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text x="34" y="366" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1a3a5c">薄く仕上げたいときの選択肢</text>
  <text x="34" y="390" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1a3a5c">鋼板接着</text>
  <text x="120" y="390" font-family="sans-serif" font-size="11" fill="#555">施工厚が小さく桁下に有利</text>
  <text x="34" y="412" font-family="sans-serif" font-size="11" fill="#555">樹脂接着＋ボルトで固定する</text>
  <text x="34" y="440" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b22234">鋼板自体が腐食する</text>
  <text x="34" y="462" font-family="sans-serif" font-size="11" fill="#555">→ 防食塗装の維持管理が前提になる</text>
</svg>
