<!-- authored 2026-09-30 doboku-note 自作。題材はコンクリート診断士教材の補強工法の分類。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="補強工法の区分。断面増強型（増厚・コンクリート巻立て・鋼板接着・FRP接着・鋼板巻立て・FRP巻立て）、部材追加型（縦桁増設）、支持点追加型（支持点増設）、その他（打換え・取替え、外ケーブル）に分かれる">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 11px; fill: #555; }
      .t-axis  { font-size: 11px; fill: #8a8a8a; }
      .t-label { font-size: 12px; fill: #1a3a5c; }
      .t-small { font-size: 11px; fill: #1a3a5c; }
      .t-desc  { font-size: 11px; fill: #555; }
      .t-strong { font-size: 12px; fill: #222; font-weight: 700; }
      .line-main { stroke: #2e6da4; stroke-width: 1.5; fill: none; }
      .line-dash { stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .line-warn { stroke: #b22234; stroke-width: 1.5; fill: none; }
      .box { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-g { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-r { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .chip { fill: #fff; stroke: #2e6da4; stroke-width: 1; }
    </style>
    <marker id="ab" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker>
    <marker id="am" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#8a8a8a"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#b22234"/></marker>
  </defs>
  <text class="t-lead" x="200" y="16" text-anchor="middle">補強工法を、耐力を上げるしくみで分けて見る</text>
  <rect class="box-b" x="20" y="28" width="360" height="100" rx="8" />
  <text class="t-strong" x="34" y="48" text-anchor="start">断面増強型（断面の増加＋補強材の追加）</text>
  <rect class="chip" x="34" y="58" width="105" height="26" rx="6" />
  <text class="t-small" x="86.5" y="75" text-anchor="middle">増厚</text>
  <rect class="chip" x="147" y="58" width="105" height="26" rx="6" />
  <text class="t-small" x="199.5" y="75" text-anchor="middle">コンクリート巻立て</text>
  <rect class="chip" x="260" y="58" width="105" height="26" rx="6" />
  <text class="t-small" x="312.5" y="75" text-anchor="middle">鋼板接着</text>
  <rect class="chip" x="34" y="90" width="105" height="26" rx="6" />
  <text class="t-small" x="86.5" y="107" text-anchor="middle">FRP接着</text>
  <rect class="chip" x="147" y="90" width="105" height="26" rx="6" />
  <text class="t-small" x="199.5" y="107" text-anchor="middle">鋼板巻立て</text>
  <rect class="chip" x="260" y="90" width="105" height="26" rx="6" />
  <text class="t-small" x="312.5" y="107" text-anchor="middle">FRP巻立て</text>
  <rect class="box-g" x="20" y="138" width="360" height="62" rx="8" />
  <text class="t-strong" x="34" y="158" text-anchor="start">部材追加型（新たな部材を加える）</text>
  <rect class="chip" x="34" y="168" width="110" height="26" rx="6" />
  <text class="t-small" x="89" y="185" text-anchor="middle">縦桁増設</text>
  <rect class="box-w" x="20" y="210" width="360" height="62" rx="8" />
  <text class="t-strong" x="34" y="230" text-anchor="start">支持点追加型（支持点を増やす）</text>
  <rect class="chip" x="34" y="240" width="110" height="26" rx="6" />
  <text class="t-small" x="89" y="257" text-anchor="middle">支持点増設</text>
  <rect class="box" x="20" y="282" width="360" height="62" rx="8" />
  <text class="t-strong" x="34" y="302" text-anchor="start">その他（部材の交換・プレストレス導入）</text>
  <rect class="chip" x="34" y="312" width="162" height="26" rx="6" />
  <text class="t-small" x="115" y="329" text-anchor="middle">打換え・取替え</text>
  <rect class="chip" x="204" y="312" width="162" height="26" rx="6" />
  <text class="t-small" x="285" y="329" text-anchor="middle">外ケーブル</text>
  <rect class="box" x="20" y="366" width="360" height="60" rx="6" />
  <text class="t-desc" x="34" y="388" text-anchor="start">断面増強型は、断面を増やす工法と補強材を足す工法の両方を含む</text>
  <text class="t-desc" x="34" y="408" text-anchor="start">土木構造物を対象とした工法の分類</text>
</svg>
