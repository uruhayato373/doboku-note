<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="断面増強、部材追加、支持点追加、部材の打換えと外ケーブルを、力の伝わり方から分類する">
<defs><style>
text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#555}.body{font-size:13px}.head{font-size:15px;font-weight:bold;fill:#1a3a5c}.small{font-size:12px}.strong{font-size:13px;font-weight:bold;fill:#1a3a5c}
/* ink-body / ink-strong / brand-fill / brand / positive-fill / positive / warn-fill / warn / danger-fill / danger / surface / token-border */
.surface{fill:#f5f5f5;stroke:#d7d7d7;stroke-width:1.5}.brand{fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5}.positive{fill:#d0e8d0;stroke:#3a7d44;stroke-width:1.5}.warn{fill:#fff3cd;stroke:#d4a017;stroke-width:1.5}.danger{fill:#f8d7da;stroke:#b22234;stroke-width:1.5}.line{stroke:#555;stroke-width:1.5;fill:none}.blue{stroke:#2e6da4;stroke-width:2;fill:none}.red{stroke:#b22234;stroke-width:2;fill:none}.green{stroke:#3a7d44;stroke-width:3;fill:none}
</style><marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#2e6da4"/></marker><marker id="g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#3a7d44"/></marker></defs>
<text class="head" x="200" y="28" text-anchor="middle">力の伝わり方を、どこで変えるか</text><rect class="brand" x="20" y="52" width="360" height="89" rx="6"/><text class="head" x="37" y="80" text-anchor="start">既存の断面を増強する</text><text class="body" x="37" y="107" text-anchor="start">増厚・RC巻立て・鋼板接着</text><text class="small" x="37" y="129" text-anchor="start">FRP接着・鋼板巻立て・FRP巻立て</text><rect class="positive" x="20" y="157" width="360" height="89" rx="6"/><text class="head" x="37" y="185" text-anchor="start">新しい部材を足す</text><text class="body" x="37" y="212" text-anchor="start">縦桁の増設で既存部材の負担を分散</text><rect class="warn" x="20" y="262" width="360" height="89" rx="6"/><text class="head" x="37" y="290" text-anchor="start">支持点を足す</text><text class="body" x="37" y="317" text-anchor="start">支間を短くし、曲げとたわみを減らす</text><rect class="surface" x="20" y="367" width="360" height="89" rx="6"/><text class="head" x="37" y="395" text-anchor="start">その他の系統</text><text class="body" x="37" y="422" text-anchor="start">部材の打換え・外ケーブルの緊張</text>
</svg>
