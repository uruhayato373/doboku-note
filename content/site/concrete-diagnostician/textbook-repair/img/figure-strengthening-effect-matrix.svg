<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="補強5工法と主に効く性能の対応。FRP接着と外ケーブルは剛性向上への寄与が小さい">
<defs><style>
text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#555}.body{font-size:13px}.head{font-size:15px;font-weight:bold;fill:#1a3a5c}.small{font-size:12px}.strong{font-size:13px;font-weight:bold;fill:#1a3a5c}
/* ink-body / ink-strong / brand-fill / brand / positive-fill / positive / warn-fill / warn / danger-fill / danger / surface / token-border */
.surface{fill:#f5f5f5;stroke:#d7d7d7;stroke-width:1.5}.brand{fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5}.positive{fill:#d0e8d0;stroke:#3a7d44;stroke-width:1.5}.warn{fill:#fff3cd;stroke:#d4a017;stroke-width:1.5}.danger{fill:#f8d7da;stroke:#b22234;stroke-width:1.5}.line{stroke:#555;stroke-width:1.5;fill:none}.blue{stroke:#2e6da4;stroke-width:2;fill:none}.red{stroke:#b22234;stroke-width:2;fill:none}.green{stroke:#3a7d44;stroke-width:3;fill:none}
</style><marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#2e6da4"/></marker><marker id="g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#3a7d44"/></marker></defs>
<text class="head" x="200" y="28" text-anchor="middle">狙う性能と、工法の働きを結ぶ</text><rect class="brand" x="20" y="52" width="360" height="54" rx="6"/><text class="strong" x="37" y="84" text-anchor="start">RC巻立て</text><line class="blue" x1="142" y1="79" x2="168" y2="79" marker-end="url(#a)"/><text class="body" x="183" y="84" text-anchor="start">曲げ・せん断・じん性</text><rect class="brand" x="20" y="120" width="360" height="54" rx="6"/><text class="strong" x="37" y="152" text-anchor="start">鋼板接着</text><line class="blue" x1="142" y1="147" x2="168" y2="147" marker-end="url(#a)"/><text class="body" x="183" y="152" text-anchor="start">曲げ・せん断</text><rect class="brand" x="20" y="188" width="360" height="54" rx="6"/><text class="strong" x="37" y="220" text-anchor="start">FRP接着</text><line class="blue" x1="142" y1="215" x2="168" y2="215" marker-end="url(#a)"/><text class="body" x="183" y="220" text-anchor="start">曲げ・せん断・じん性</text><rect class="positive" x="20" y="256" width="360" height="54" rx="6"/><text class="strong" x="37" y="288" text-anchor="start">増厚</text><line class="blue" x1="142" y1="283" x2="168" y2="283" marker-end="url(#a)"/><text class="body" x="183" y="288" text-anchor="start">曲げ・剛性</text><rect class="brand" x="20" y="324" width="360" height="54" rx="6"/><text class="strong" x="37" y="356" text-anchor="start">外ケーブル</text><line class="blue" x1="142" y1="351" x2="168" y2="351" marker-end="url(#a)"/><text class="body" x="183" y="356" text-anchor="start">曲げ</text><rect class="warn" x="20" y="413" width="360" height="68" rx="6"/><text class="strong" x="200" y="440" text-anchor="middle">FRP接着・外ケーブルは</text><text class="body" x="200" y="464" text-anchor="middle">剛性を大きく高める工法ではない</text>
</svg>
