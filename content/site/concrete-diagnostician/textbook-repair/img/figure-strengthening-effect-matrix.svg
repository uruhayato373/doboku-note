<!-- authored 2026-09-12 doboku-note 自作。題材はコンクリート診断士テキスト「対策」の論点。特定の書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="RC巻立て・鋼板接着・FRP接着・増厚・外ケーブルの5補強工法が曲げ耐力・せん断耐力・剛性・じん性にどの程度効くかを塗りの濃淡で示すマトリクス">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 11px; fill: #555; }
      .t-head  { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .t-name  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-desc  { font-size: 11px; fill: #555; }
      .cell    { fill: #2e6da4; stroke: #d7d7d7; stroke-width: 1; }
      .hdr     { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1; }
      .box-w   { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
    </style>
  </defs>

  <text class="t-lead" x="200" y="16" text-anchor="middle">工法ごとに効きやすい性能が異なる（塗りが濃いほど効果が大きい目安）</text>

  <!-- ヘッダー行 -->
  <rect class="hdr" x="20" y="40" width="100" height="40"/>
  <rect class="hdr" x="120" y="40" width="65" height="40"/>
  <text class="t-head" x="152" y="64" text-anchor="middle">曲げ耐力</text>
  <rect class="hdr" x="185" y="40" width="65" height="40"/>
  <text class="t-head" x="217" y="64" text-anchor="middle">せん断耐力</text>
  <rect class="hdr" x="250" y="40" width="65" height="40"/>
  <text class="t-head" x="282" y="64" text-anchor="middle">剛性</text>
  <rect class="hdr" x="315" y="40" width="65" height="40"/>
  <text class="t-head" x="347" y="64" text-anchor="middle">じん性</text>

  <!-- 行1: RC巻立て -->
  <rect class="hdr" x="20" y="80" width="100" height="56"/>
  <text class="t-name" x="28" y="112">RC巻立て</text>
  <rect class="cell" x="120" y="80" width="65" height="56" fill-opacity="0.8"/>
  <rect class="cell" x="185" y="80" width="65" height="56" fill-opacity="0.8"/>
  <rect class="cell" x="250" y="80" width="65" height="56" fill-opacity="0.45"/>
  <rect class="cell" x="315" y="80" width="65" height="56" fill-opacity="0.8"/>

  <!-- 行2: 鋼板接着 -->
  <rect class="hdr" x="20" y="136" width="100" height="56"/>
  <text class="t-name" x="28" y="168">鋼板接着</text>
  <rect class="cell" x="120" y="136" width="65" height="56" fill-opacity="0.8"/>
  <rect class="cell" x="185" y="136" width="65" height="56" fill-opacity="0.8"/>
  <rect class="cell" x="250" y="136" width="65" height="56" fill-opacity="0.45"/>
  <rect class="cell" x="315" y="136" width="65" height="56" fill-opacity="0.15"/>

  <!-- 行3: FRP接着 -->
  <rect class="hdr" x="20" y="192" width="100" height="56"/>
  <text class="t-name" x="28" y="224">FRP接着</text>
  <rect class="cell" x="120" y="192" width="65" height="56" fill-opacity="0.8"/>
  <rect class="cell" x="185" y="192" width="65" height="56" fill-opacity="0.8"/>
  <rect class="cell" x="250" y="192" width="65" height="56" fill-opacity="0.15"/>
  <rect class="cell" x="315" y="192" width="65" height="56" fill-opacity="0.8"/>

  <!-- 行4: 増厚 -->
  <rect class="hdr" x="20" y="248" width="100" height="56"/>
  <text class="t-name" x="28" y="280">増厚</text>
  <rect class="cell" x="120" y="248" width="65" height="56" fill-opacity="0.8"/>
  <rect class="cell" x="185" y="248" width="65" height="56" fill-opacity="0.45"/>
  <rect class="cell" x="250" y="248" width="65" height="56" fill-opacity="0.8"/>
  <rect class="cell" x="315" y="248" width="65" height="56" fill-opacity="0.15"/>

  <!-- 行5: 外ケーブル -->
  <rect class="hdr" x="20" y="304" width="100" height="56"/>
  <text class="t-name" x="28" y="336">外ケーブル</text>
  <rect class="cell" x="120" y="304" width="65" height="56" fill-opacity="0.8"/>
  <rect class="cell" x="185" y="304" width="65" height="56" fill-opacity="0.15"/>
  <rect class="cell" x="250" y="304" width="65" height="56" fill-opacity="0.15"/>
  <rect class="cell" x="315" y="304" width="65" height="56" fill-opacity="0.15"/>

  <!-- 凡例 -->
  <rect class="cell" x="30" y="374" width="16" height="16" fill-opacity="0.8"/>
  <text class="t-desc" x="52" y="386">効果大</text>
  <rect class="cell" x="170" y="374" width="16" height="16" fill-opacity="0.45"/>
  <text class="t-desc" x="192" y="386">効果中</text>
  <rect class="cell" x="280" y="374" width="16" height="16" fill-opacity="0.15"/>
  <text class="t-desc" x="302" y="386">効果小</text>

  <rect class="box-w" x="20" y="408" width="360" height="72" rx="6"/>
  <text class="t-name" x="40" y="430">剛性の列が薄い工法に注意</text>
  <text class="t-desc" x="40" y="448">FRP接着・外ケーブルは他工法より</text>
  <text class="t-desc" x="40" y="466">剛性向上への寄与が小さい</text>
</svg>
