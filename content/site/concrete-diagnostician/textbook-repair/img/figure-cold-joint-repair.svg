<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="コールドジョイントは軽微で漏水がない場合に表面処理、開きや通水がある場合に充填を選ぶ">
<defs><style>
text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#555}.body{font-size:13px}.head{font-size:15px;font-weight:bold;fill:#1a3a5c}.small{font-size:12px}.strong{font-size:13px;font-weight:bold;fill:#1a3a5c}
/* ink-body / ink-strong / brand-fill / brand / positive-fill / positive / warn-fill / warn / danger-fill / danger / surface / token-border */
.surface{fill:#f5f5f5;stroke:#d7d7d7;stroke-width:1.5}.brand{fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5}.positive{fill:#d0e8d0;stroke:#3a7d44;stroke-width:1.5}.warn{fill:#fff3cd;stroke:#d4a017;stroke-width:1.5}.danger{fill:#f8d7da;stroke:#b22234;stroke-width:1.5}.line{stroke:#555;stroke-width:1.5;fill:none}.blue{stroke:#2e6da4;stroke-width:2;fill:none}.red{stroke:#b22234;stroke-width:2;fill:none}.green{stroke:#3a7d44;stroke-width:3;fill:none}
</style><marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#2e6da4"/></marker><marker id="g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#3a7d44"/></marker></defs>
<text class="head" x="200" y="29" text-anchor="middle">継目の開きと通水を見て処置を選ぶ</text><rect class="brand" x="20" y="51" width="360" height="183" rx="6"/><text class="head" x="38" y="79" text-anchor="start">軽微で、漏水を伴わない</text><rect class="surface" x="40" y="104" width="135" height="88" rx="0"/><path class="red" d="M40 146L80 149L123 143L175 147"/><rect class="positive" x="35" y="129" width="10" height="36" rx="0"/><text class="strong" x="199" y="131" text-anchor="start">表面を処理</text><text class="small" x="199" y="155" text-anchor="start">両側へペースト</text><text class="body" x="200" y="214" text-anchor="middle">表面からの侵入を抑える</text><rect class="warn" x="20" y="256" width="360" height="183" rx="6"/><text class="head" x="38" y="284" text-anchor="start">開きがある・通水する</text><rect class="surface" x="40" y="309" width="135" height="88" rx="0"/><path class="red" d="M40 351L80 354L123 348L175 352"/><path class="positive" d="M40 325H77Q93 352 77 378H40Z"/><text class="strong" x="199" y="336" text-anchor="start">継目をはつる</text><text class="small" x="199" y="360" text-anchor="start">止水材を充填</text><text class="body" x="200" y="419" text-anchor="middle">水みちを断ち、開きを埋める</text><text class="small" x="200" y="478" text-anchor="middle">通水の有無を、外観と併せて確認する</text>
</svg>
