<!-- authored 2026-09-30 doboku-note 自作。題材はコンクリート診断士教材の補修（断面修復境界のマクロセル腐食）。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="断面修復の前後で鋼材電位を比較する模式図。修復前は腐食部で電位が低く、修復後は修復部の電位が高くなり、境界のすぐ外側の未修復部で電位が低いまま残ってアノードとなりマクロセル腐食が生じる">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 11px; fill: #555; }
      .t-axis  { font-size: 11px; fill: #8a8a8a; }
      .t-label { font-size: 11px; fill: #1a3a5c; }
      .t-desc  { font-size: 11px; fill: #555; }
      .t-head  { font-size: 12px; fill: #222; font-weight: 700; }
      .line-main { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .line-dash { stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .line-red { stroke: #b22234; stroke-width: 2; fill: none; }
      .conc { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-g { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-r { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
    </style>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="#555"/></marker>
  </defs>
  <text class="t-lead" x="200" y="16" text-anchor="middle">断面と電位の模式図（数値なし・傾向を示す）</text>
  <text class="t-head" x="105" y="40" text-anchor="middle">断面修復前</text>
  <text class="t-head" x="295" y="40" text-anchor="middle">断面修復後</text>

  <rect class="conc" x="20" y="50" width="170" height="90" />
  <line class="line-main" x1="20" y1="116" x2="190" y2="116" />
  <rect class="box-r" x="80" y="110" width="50" height="12" />
  <text class="t-label" x="105" y="98" text-anchor="middle">鋼材腐食部</text>

  <rect class="conc" x="210" y="50" width="170" height="90" />
  <rect class="box-b" x="255" y="62" width="80" height="62" />
  <line class="line-main" x1="210" y1="116" x2="380" y2="116" />
  <rect class="box-r" x="232" y="110" width="23" height="12" />
  <rect class="box-r" x="335" y="110" width="23" height="12" />
  <text class="t-label" x="295" y="90" text-anchor="middle">修復部</text>
  <text class="t-label" x="295" y="106" text-anchor="middle">（防錆処置）</text>

  <line class="line-dash" x1="20" y1="170" x2="20" y2="280" />
  <line class="line-dash" x1="20" y1="280" x2="190" y2="280" />
  <text class="t-axis" x="26" y="168">電位（高）</text>
  <text class="t-axis" x="190" y="296" text-anchor="end">位置</text>
  <path class="line-main" d="M26,200 C 60,200 75,250 105,255 C 135,250 150,200 184,200" />
  <line class="line-dash" x1="105" y1="140" x2="105" y2="280" />

  <line class="line-dash" x1="210" y1="170" x2="210" y2="280" />
  <line class="line-dash" x1="210" y1="280" x2="380" y2="280" />
  <text class="t-axis" x="216" y="168">電位（高）</text>
  <text class="t-axis" x="380" y="296" text-anchor="end">位置</text>
  <path class="line-main" d="M216,205 C 235,205 240,215 243,255 C 245,215 250,190 262,190 L 328,190 C 340,190 345,215 347,255 C 350,215 360,205 376,205" />
  <line class="line-dash" x1="243" y1="140" x2="243" y2="280" />
  <line class="line-dash" x1="347" y1="140" x2="347" y2="280" />

  <rect class="box" x="20" y="316" width="360" height="164" rx="6" />
  <rect class="box-b" x="34" y="330" width="14" height="14" />
  <text class="t-desc" x="54" y="342">修復部の鋼材：電位が高い（カソード・防食側）</text>
  <rect class="box-r" x="34" y="358" width="14" height="14" />
  <text class="t-desc" x="54" y="370">境界外側の未修復部：電位が低いまま（アノード）</text>
  <text class="t-desc" x="34" y="396">電位差で腐食電流が流れ、アノード側が腐食する</text>
  <text class="t-desc" x="34" y="414">＝マクロセル腐食。腐食が進むのは修復部の隣</text>
  <text class="t-desc" x="34" y="438">抑制策：境界付近に犠牲陽極材（亜鉛など）を置き、</text>
  <text class="t-desc" x="34" y="456">優先的に腐食させて鋼材を守る</text>
</svg>
