<!-- authored 2026-10-10 doboku-note 自作。電気化学的補修の施工の流れを再構成。特定の書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="電気化学的補修の施工の流れ。補修前調査、前処理と短絡箇所の補修、陽極と電解質の設置、通電、通電停止と復旧の順。電気防食は撤去せず通電を継続">
<defs><marker id="a" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#555"/></marker></defs>
<style>text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN","Hiragino Sans",sans-serif;font-size:12px;fill:#555;text-anchor:middle}.h{font-size:13px;font-weight:bold;fill:#1a3a5c}.s{font-size:11px}</style>
<rect x="60" y="20" width="280" height="56" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<text text-anchor="middle" class="h" x="200" y="44">1　補修前調査</text>
<text text-anchor="middle" class="s" x="200" y="63">中性化深さ・塩分・ASRの有無</text>
<line x1="200" y1="76" x2="200" y2="96" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="60" y="100" width="280" height="56" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
<text text-anchor="middle" class="h" x="200" y="124">2　前処理</text>
<text text-anchor="middle" class="s" x="200" y="143">欠陥の補修・短絡箇所の補修</text>
<line x1="200" y1="156" x2="200" y2="176" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="60" y="180" width="280" height="56" rx="6" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
<text text-anchor="middle" class="h" x="200" y="204">3　陽極と電解質の設置</text>
<text text-anchor="middle" class="s" x="200" y="223">照合電極・配線の導通も確認</text>
<line x1="200" y1="236" x2="200" y2="256" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="60" y="260" width="280" height="56" rx="6" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
<text text-anchor="middle" class="h" x="200" y="284">4　通電</text>
<text text-anchor="middle" class="s" x="200" y="303">条件と期間は工法ごとに管理</text>
<line x1="200" y1="316" x2="200" y2="336" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="60" y="340" width="280" height="72" rx="6" fill="#f8d7da" stroke="#b22234" stroke-width="1.5"/>
<text text-anchor="middle" class="h" x="200" y="362">5　通電停止と復旧（電気防食を除く）</text>
<text text-anchor="middle" class="s" x="200" y="381">脱塩・再アルカリ化は陽極を撤去し被覆</text>
<text text-anchor="middle" class="s" x="200" y="398">電気防食は撤去せず通電を継続</text>
<rect x="20" y="430" width="360" height="52" rx="6" fill="#f5f5f5" stroke="#d7d7d7"/>
<text text-anchor="middle" class="s" x="200" y="452">ASRがあれば電解液のアルカリで</text>
<text text-anchor="middle" class="s" x="200" y="470">反応が進む恐れがあり、調査で確かめる</text>
</svg>
