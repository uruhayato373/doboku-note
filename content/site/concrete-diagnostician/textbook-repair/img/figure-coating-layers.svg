<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="表面被覆は表面に塗膜を形成し、表面含浸は表層内部の細孔を充填・疎水化する">
<defs><style>
text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#555}.body{font-size:13px}.head{font-size:15px;font-weight:bold;fill:#1a3a5c}.small{font-size:12px}.strong{font-size:13px;font-weight:bold;fill:#1a3a5c}
/* ink-body / ink-strong / brand-fill / brand / positive-fill / positive / warn-fill / warn / danger-fill / danger / surface / token-border */
.surface{fill:#f5f5f5;stroke:#d7d7d7;stroke-width:1.5}.brand{fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5}.positive{fill:#d0e8d0;stroke:#3a7d44;stroke-width:1.5}.warn{fill:#fff3cd;stroke:#d4a017;stroke-width:1.5}.danger{fill:#f8d7da;stroke:#b22234;stroke-width:1.5}.line{stroke:#555;stroke-width:1.5;fill:none}.blue{stroke:#2e6da4;stroke-width:2;fill:none}.red{stroke:#b22234;stroke-width:2;fill:none}.green{stroke:#3a7d44;stroke-width:3;fill:none}
</style><marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#2e6da4"/></marker><marker id="g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#3a7d44"/></marker></defs>
<text class="head" x="200" y="29" text-anchor="middle">材料を置く場所が違う</text><rect class="brand" x="20" y="53" width="360" height="178" rx="6"/><text class="head" x="38" y="81" text-anchor="start">表面被覆：表面に塗膜</text><rect class="surface" x="42" y="126" width="151" height="71" rx="0"/><rect class="brand" x="42" y="118" width="151" height="9" rx="0"/><text class="strong" x="213" y="141" text-anchor="start">劣化因子を</text><text class="strong" x="213" y="164" text-anchor="start">表面で遮断</text><text class="small" x="200" y="215" text-anchor="middle">下地・塗り重ね・ピンホールを管理</text><rect class="positive" x="20" y="258" width="360" height="178" rx="6"/><text class="head" x="38" y="286" text-anchor="start">表面含浸：表層の中へ</text><rect class="surface" x="42" y="331" width="151" height="71" rx="0"/><rect class="positive" x="42" y="331" width="151" height="29" rx="0"/><line class="blue" x1="64" y1="319" x2="64" y2="354" marker-end="url(#a)"/><line class="blue" x1="116" y1="319" x2="116" y2="354" marker-end="url(#a)"/><line class="blue" x1="170" y1="319" x2="170" y2="354" marker-end="url(#a)"/><text class="strong" x="213" y="346" text-anchor="start">細孔の充填</text><text class="strong" x="213" y="369" text-anchor="start">・疎水化</text><text class="small" x="200" y="420" text-anchor="middle">外観を変えずに表層を保護</text><text class="small" x="200" y="478" text-anchor="middle">水を防ぐ性能と、水蒸気を逃がす性能を選び分ける</text>
</svg>
