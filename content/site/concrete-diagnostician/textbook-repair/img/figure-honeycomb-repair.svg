<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="豆板は内部の空隙範囲を調べ、表面のみなら脆弱部除去と表面処理、深い場合は除去と再充填を選ぶ">
<defs><style>
text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#555}.body{font-size:13px}.head{font-size:15px;font-weight:bold;fill:#1a3a5c}.small{font-size:12px}.strong{font-size:13px;font-weight:bold;fill:#1a3a5c}
/* ink-body / ink-strong / brand-fill / brand / positive-fill / positive / warn-fill / warn / danger-fill / danger / surface / token-border */
.surface{fill:#f5f5f5;stroke:#d7d7d7;stroke-width:1.5}.brand{fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5}.positive{fill:#d0e8d0;stroke:#3a7d44;stroke-width:1.5}.warn{fill:#fff3cd;stroke:#d4a017;stroke-width:1.5}.danger{fill:#f8d7da;stroke:#b22234;stroke-width:1.5}.line{stroke:#555;stroke-width:1.5;fill:none}.blue{stroke:#2e6da4;stroke-width:2;fill:none}.red{stroke:#b22234;stroke-width:2;fill:none}.green{stroke:#3a7d44;stroke-width:3;fill:none}
</style><marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#2e6da4"/></marker><marker id="g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#3a7d44"/></marker></defs>
<text class="head" x="200" y="29" text-anchor="middle">外から見える豆板だけで範囲を決めない</text><rect class="surface" x="30" y="55" width="340" height="145" rx="6"/><text class="head" x="48" y="81" text-anchor="start">表面に見える空隙</text><rect class="surface" x="57" y="100" width="286" height="74" rx="0"/><path class="danger" d="M147 100H245L260 130L245 156L210 146L170 153L155 130Z"/><text class="strong" x="200" y="196" text-anchor="middle">内部へ及ぶ範囲を非破壊試験で確定</text><line class="blue" x1="200" y1="212" x2="200" y2="240" marker-end="url(#a)"/><rect class="brand" x="24" y="255" width="168" height="147" rx="6"/><rect class="warn" x="208" y="255" width="168" height="147" rx="6"/><text class="head" x="108" y="283" text-anchor="middle">表面のみ・軽微</text><text class="head" x="292" y="283" text-anchor="middle">深い・広い</text><text class="body" x="108" y="321" text-anchor="middle">脆弱部を除去</text><text class="strong" x="108" y="348" text-anchor="middle">表面処理</text><text class="body" x="292" y="321" text-anchor="middle">健全部まではつる</text><text class="strong" x="292" y="348" text-anchor="middle">再充填</text><text class="small" x="292" y="378" text-anchor="middle">耐力に影響 → 打換え</text><text class="head" x="200" y="448" text-anchor="middle">補修後は、空隙を隠すだけにしない</text><text class="small" x="200" y="476" text-anchor="middle">範囲の確定と、健全部への付着が前提</text>
</svg>
