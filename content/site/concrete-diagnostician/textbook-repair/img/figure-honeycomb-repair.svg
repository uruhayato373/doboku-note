<!-- authored 2026-09-30 doboku-note 自作。題材はコンクリート診断士教材の豆板の補修。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="豆板の補修の断面模式図。対策前は表面付近に骨材が露出した空隙があり、対策後は不良部分を除去してポリマーセメントモルタルで断面修復する。軽度なら表面被覆、重度なら打ち直しもある">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 11px; fill: #555; }
      .t-axis  { font-size: 11px; fill: #8a8a8a; }
      .t-label { font-size: 12px; fill: #1a3a5c; }
      .t-small { font-size: 11px; fill: #1a3a5c; }
      .t-desc  { font-size: 11px; fill: #555; }
      .t-strong { font-size: 12px; fill: #222; font-weight: 700; }
      .t-red { font-size: 12px; fill: #b22234; font-weight: 700; }
      .line-main { stroke: #2e6da4; stroke-width: 1.5; fill: none; }
      .line-dash { stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .line-red { stroke: #b22234; stroke-width: 2; fill: none; }
      .box { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-g { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-r { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
    </style>
    <marker id="ar" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4" /></marker>
    <marker id="arr" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#b22234" /></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><line x1="0" y1="8" x2="8" y2="0" stroke="#2e6da4" stroke-width="1" /></pattern>
  </defs>
  <text class="t-lead" x="200" y="18" text-anchor="middle">豆板の補修（断面の模式図）</text>
  <rect class="box" x="40" y="50" width="140" height="200" />
  <line x1="40" y1="50" x2="40" y2="250" stroke="#555" stroke-width="3" />
  <circle cx="48" cy="228" r="7" fill="#fff" stroke="#8a8a8a" stroke-width="1.5" />
  <circle cx="62" cy="226" r="7" fill="#fff" stroke="#8a8a8a" stroke-width="1.5" />
  <circle cx="54" cy="212" r="7" fill="#fff" stroke="#8a8a8a" stroke-width="1.5" />
  <circle cx="68" cy="212" r="7" fill="#fff" stroke="#8a8a8a" stroke-width="1.5" />
  <circle cx="48" cy="196" r="7" fill="#fff" stroke="#8a8a8a" stroke-width="1.5" />
  <circle cx="62" cy="196" r="7" fill="#fff" stroke="#8a8a8a" stroke-width="1.5" />
  <circle cx="56" cy="180" r="7" fill="#fff" stroke="#8a8a8a" stroke-width="1.5" />
  <circle cx="70" cy="182" r="7" fill="#fff" stroke="#8a8a8a" stroke-width="1.5" />
  <circle cx="50" cy="166" r="7" fill="#fff" stroke="#8a8a8a" stroke-width="1.5" />
  <circle cx="64" cy="166" r="7" fill="#fff" stroke="#8a8a8a" stroke-width="1.5" />
  <circle cx="72" cy="198" r="7" fill="#fff" stroke="#8a8a8a" stroke-width="1.5" />
  <circle cx="74" cy="226" r="7" fill="#fff" stroke="#8a8a8a" stroke-width="1.5" />
  <text class="t-label" x="110" y="200" text-anchor="start">豆板</text>
  <text class="t-desc" x="110" y="218" text-anchor="start">（空隙が残る）</text>
  <rect class="box" x="230" y="50" width="140" height="200" />
  <line x1="230" y1="50" x2="230" y2="250" stroke="#555" stroke-width="3" />
  <polygon points="230,150 256,142 268,170 268,250 230,250" fill="url(#hatch)" stroke="#2e6da4" stroke-width="1.5" />
  <text class="t-label" x="236" y="84" text-anchor="start">ポリマーセメント</text>
  <text class="t-label" x="236" y="100" text-anchor="start">モルタル</text>
  <line class="line-main" x1="250" y1="106" x2="250" y2="190" marker-end="url(#ar)" />
  <text class="t-label" x="110" y="272" text-anchor="middle">対策前</text>
  <text class="t-label" x="300" y="272" text-anchor="middle">対策後（断面修復）</text>
  <text class="t-axis" x="40" y="42" text-anchor="start">表面</text>
  <text class="t-axis" x="230" y="42" text-anchor="start">表面</text>
  <rect class="box-r" x="30" y="300" width="150" height="36" rx="6" />
  <text class="t-label" x="105.0" y="322.0" text-anchor="middle">① 不良部分を除去</text>
  <line class="line-main" x1="180" y1="318" x2="220" y2="318" marker-end="url(#ar)" />
  <rect class="box-g" x="220" y="300" width="150" height="36" rx="6" />
  <text class="t-label" x="295.0" y="322.0" text-anchor="middle">② 断面修復</text>
  <text class="t-desc" x="200" y="364" text-anchor="middle">補修材はポリマーセメントモルタルなど</text>
  <text class="t-lead" x="200" y="392" text-anchor="middle">程度に応じた使い分け</text>
  <rect class="box-b" x="20" y="402" width="172" height="36" rx="6" />
  <text class="t-label" x="106.0" y="424.0" text-anchor="middle">ごく軽度：表面被覆など</text>
  <rect class="box-w" x="208" y="402" width="172" height="36" rx="6" />
  <text class="t-label" x="294.0" y="424.0" text-anchor="middle">重度：打ち直しもある</text>
  <text class="t-desc" x="200" y="470" text-anchor="middle">建築構造物では耐火性から非ポリマー系とする場合もある</text>

</svg>
