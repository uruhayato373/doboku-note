<!-- authored 2026-09-30 doboku-note 自作。題材はコンクリート診断士教材の補強設計の流れ。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="補強設計の進め方。方針と目標を固めて補強方法を選び、部材ごとに補強を設計する。全体構造の評価が要らなければ設計完了、必要なら補強後の全体性能を評価し、目標を満たせば完了、満たさなければ部材の設計に戻る">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 11px; fill: #555; }
      .t-axis  { font-size: 11px; fill: #8a8a8a; }
      .t-label { font-size: 12px; fill: #1a3a5c; }
      .t-small { font-size: 11px; fill: #1a3a5c; }
      .t-desc  { font-size: 11px; fill: #555; }
      .t-strong { font-size: 12px; fill: #222; font-weight: 700; }
      .line-main { stroke: #2e6da4; stroke-width: 1.5; fill: none; }
      .line-dash { stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .line-warn { stroke: #b22234; stroke-width: 1.5; fill: none; }
      .box { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-g { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-r { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .chip { fill: #fff; stroke: #2e6da4; stroke-width: 1; }
    </style>
    <marker id="ab" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker>
    <marker id="am" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#8a8a8a"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#b22234"/></marker>
  </defs>
  <text class="t-lead" x="200" y="16" text-anchor="middle">補強設計の進め方</text>
  <rect class="box-b" x="90" y="28" width="220" height="70" rx="6" />
  <text class="t-label" x="200" y="48" text-anchor="middle">方針と目標を固める</text>
  <text class="t-desc" x="200" y="66" text-anchor="middle">補強方針を決め、目標性能を設ける</text>
  <text class="t-desc" x="200" y="82" text-anchor="middle">それに合う補強方法を選ぶ</text>
  <line class="line-main" x1="200" y1="98" x2="200" y2="112" marker-end="url(#ab)" />
  <rect class="box-b" x="90" y="112" width="220" height="30" rx="6" />
  <text class="t-label" x="200" y="131" text-anchor="middle">部材ごとに補強を設計する</text>
  <line class="line-main" x1="200" y1="142" x2="200" y2="156" marker-end="url(#ab)" />
  <polygon class="box-w" points="200,156 292,194 200,232 108,194" />
  <text class="t-small" x="200" y="198" text-anchor="middle">全体構造の評価は要るか</text>
  <line class="line-main" x1="200" y1="232" x2="200" y2="252" marker-end="url(#ab)" />
  <text class="t-small" x="208" y="246" text-anchor="start">必要</text>
  <rect class="box-b" x="70" y="252" width="260" height="30" rx="6" />
  <text class="t-label" x="200" y="271" text-anchor="middle">補強後の全体性能を評価する</text>
  <line class="line-main" x1="200" y1="282" x2="200" y2="298" marker-end="url(#ab)" />
  <polygon class="box-w" points="200,298 280,336 200,374 120,336" />
  <text class="t-small" x="200" y="340" text-anchor="middle">目標を満たすか</text>
  <line class="line-main" x1="200" y1="374" x2="200" y2="410" marker-end="url(#ab)" />
  <text class="t-small" x="208" y="396" text-anchor="start">満たす</text>
  <rect class="box-g" x="140" y="410" width="120" height="30" rx="6" />
  <text class="t-label" x="200" y="429" text-anchor="middle">設計完了</text>
  <path class="line-main" d="M292,194 L360,194 L360,425 L260,425" marker-end="url(#ab)" />
  <text class="t-small" x="300" y="186" text-anchor="start">不要</text>
  <path class="line-main" d="M120,336 L34,336 L34,127 L90,127" marker-end="url(#ab)" />
  <text class="t-small" x="42" y="328" text-anchor="start">満たさない</text>
  <text class="t-desc" x="200" y="474" text-anchor="middle">目標に届かなければ、部材の設計に戻ってやり直す</text>
</svg>
