<!-- authored 2026-09-30 doboku-note 自作。題材はコンクリート診断士演習の塩化物イオンの固定化。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="塩化物イオンがモノサルフェート水和物と反応してフリーデル氏塩になり固定化され、中性化が進むと分解して再び遊離する流れの図">
  <defs>
    <marker id="ab" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#b22234"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#555"/></marker>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 11px; fill: #555; }
      .t-axis  { font-size: 11px; fill: #8a8a8a; }
      .t-label { font-size: 11px; fill: #1a3a5c; }
      .t-desc  { font-size: 11px; fill: #555; }
      .t-b { font-size: 12px; fill: #1a3a5c; font-weight: 700; }
      .line-main { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .line-red { stroke: #b22234; stroke-width: 2; fill: none; }
      .line-green { stroke: #3a7d44; stroke-width: 2; fill: none; }
      .line-dash { stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .line-thin { stroke: #555; stroke-width: 1; fill: none; }
      .box { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-g { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-d { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
    </style>
  </defs>
  <text class="t-lead" x="200" y="20" text-anchor="middle">塩化物イオンの固定化（化学反応の流れ）</text>
  <rect class="box-b" x="20" y="40" width="170" height="50" rx="6"/>
  <text class="t-label" x="105.0" y="60" text-anchor="middle">外部から浸入した</text>
  <text class="t-label" x="105.0" y="78" text-anchor="middle">塩化物イオン Cl⁻</text>
  <rect class="box-b" x="210" y="40" width="170" height="50" rx="6"/>
  <text class="t-label" x="295.0" y="60" text-anchor="middle">モノサルフェート水和物</text>
  <text class="t-label" x="295.0" y="78" text-anchor="middle">（アルミネート相由来）</text>
  <line class="line-main" x1="105" y1="92" x2="170" y2="130" marker-end="url(#ab)"/>
  <line class="line-main" x1="295" y1="92" x2="230" y2="130" marker-end="url(#ab)"/>
  <rect class="box-g" x="100" y="134" width="200" height="50" rx="6"/>
  <text class="t-label" x="200.0" y="154" text-anchor="middle">フリーデル氏塩</text>
  <text class="t-label" x="200.0" y="172" text-anchor="middle">（塩化物が固定化される）</text>
  <text class="t-desc" x="200" y="210" text-anchor="middle">この反応にはアルミネート相（C<tspan dy="3">3</tspan><tspan dy="-3">A）が関与</tspan></text>
  <text class="t-desc" x="200" y="228" text-anchor="middle">C<tspan dy="3">3</tspan><tspan dy="-3">A 量が多いセメントほど固定化されやすい</tspan></text>
  <line class="line-red" x1="200" y1="240" x2="200" y2="290" marker-end="url(#ar)"/>
  <text class="t-label" x="208" y="268">中性化が進む</text>
  <rect class="box-d" x="100" y="294" width="200" height="50" rx="6"/>
  <text class="t-label" x="200.0" y="314" text-anchor="middle">フリーデル氏塩が分解</text>
  <text class="t-label" x="200.0" y="332" text-anchor="middle">塩化物イオンが再び遊離</text>
  <text class="t-b" x="24" y="376">診断で見る量</text>
  <rect class="box" x="20" y="384" width="360" height="86" rx="6"/>
  <text class="t-desc" x="32" y="406">・鋼材の腐食に直接関わるのは自由塩化物イオン</text>
  <text class="t-desc" x="32" y="428">・固定化された分は腐食に寄与しないが、不可逆ではない</text>
  <text class="t-desc" x="32" y="450">・全塩化物イオン量だけで腐食リスクを判断しない</text>

</svg>
