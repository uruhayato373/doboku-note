<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" style="max-width:400px;width:100%" role="img" aria-label="PC3径間連続有ヒンジラーメン箱桁橋の側面模式図。中央径間の中央にヒンジがあり、その近傍が建設時の形状より下方へ垂れ下がっている">
  <defs>
    <marker id="cdq10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b22234"/>
    </marker>
    <pattern id="cdq10g" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#8a8a8a" stroke-width="1.2"/>
    </pattern>
  </defs>

  <text x="200" y="20" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">建設から 20 年後、中央ヒンジ部の近傍が垂れ下がった</text>

  <rect x="20" y="70" width="360" height="22" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>

  <rect x="30" y="92" width="22" height="120" fill="#f5f5f5" stroke="#2e6da4" stroke-width="1.5"/>
  <rect x="128" y="92" width="22" height="120" fill="#f5f5f5" stroke="#2e6da4" stroke-width="1.5"/>
  <rect x="250" y="92" width="22" height="120" fill="#f5f5f5" stroke="#2e6da4" stroke-width="1.5"/>
  <rect x="348" y="92" width="22" height="120" fill="#f5f5f5" stroke="#2e6da4" stroke-width="1.5"/>

  <rect x="10" y="212" width="380" height="12" fill="url(#cdq10g)" stroke="#8a8a8a" stroke-width="1.2"/>

  <line x1="150" y1="92" x2="250" y2="92" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="4 3"/>
  <path d="M150 92 L172 102 L200 116 L228 102 L250 92" fill="none" stroke="#b22234" stroke-width="2.5"/>
  <circle cx="200" cy="116" r="5" fill="#ffffff" stroke="#b22234" stroke-width="2"/>

  <line x1="200" y1="96" x2="200" y2="110" stroke="#b22234" stroke-width="1.4" marker-end="url(#cdq10)"/>
  <text x="262" y="120" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b22234">垂れ下がり</text>
  <text x="200" y="142" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b22234">中央ヒンジ</text>

  <text x="90" y="170" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8a8a">側径間</text>
  <text x="200" y="170" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8a8a">中央径間</text>
  <text x="310" y="170" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8a8a">側径間</text>

  <text x="20" y="252" font-family="sans-serif" font-size="11" fill="#555">破線は建設時の桁下面の位置</text>
  <text x="20" y="272" font-family="sans-serif" font-size="11" fill="#555">脚と桁が剛結された PC 箱桁の 3 径間連続ラーメン</text>
</svg>
