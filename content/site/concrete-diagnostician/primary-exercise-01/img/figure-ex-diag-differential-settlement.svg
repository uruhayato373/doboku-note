<!-- authored 2026-09-30 doboku-note 自作。題材はコンクリート診断士演習の不同沈下による上部構造の変形。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="杭基礎の建物で中央の杭だけが沈下したときの架構の変形。梁は中央が下がり、通常の鉛直荷重時とは逆向きの曲げが生じる">
  <defs>
    <marker id="ab" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#b22234"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#555"/></marker>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 11px; fill: #555; }
      .t-axis  { font-size: 11px; fill: #8a8a8a; }
      .t-label { font-size: 11px; fill: #1a3a5c; }
      .t-desc  { font-size: 11px; fill: #555; }
      .t-b { font-size: 12px; fill: #1a3a5c; font-weight: 700; }
      .line-main { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .line-red { stroke: #b22234; stroke-width: 2; fill: none; }
      .line-green { stroke: #3a7d44; stroke-width: 2; fill: none; }
      .line-dash { stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .line-thin { stroke: #555; stroke-width: 1; fill: none; }
      .box { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-g { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-d { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
    </style>
  </defs>
  <text class="t-lead" x="200" y="20" text-anchor="middle">建物の架構（中央の杭だけが沈下した場合の変形の向き）</text>
  <g transform="translate(0,-60)">
  <line class="line-thin" x1="20" y1="330" x2="380" y2="330"/>
  <rect class="box" x="60" y="330" width="26" height="60"/>
  <rect class="box-d" x="187" y="350" width="26" height="60"/>
  <rect class="box" x="314" y="330" width="26" height="60"/>
  <line class="line-dash" x1="60" y1="330" x2="340" y2="330"/>
  <text class="t-axis" x="73" y="408" text-anchor="middle">杭</text>
  <text class="t-label" x="200" y="428" text-anchor="middle">沈下した杭</text>
  <text class="t-axis" x="327" y="408" text-anchor="middle">杭</text>
  <line class="line-thin" x1="73" y1="330" x2="73" y2="170"/>
  <line class="line-thin" x1="327" y1="330" x2="327" y2="170"/>
  <line class="line-thin" x1="200" y1="350" x2="200" y2="190"/>
  <line class="line-dash" x1="73" y1="170" x2="327" y2="170"/>
  <path class="line-main" d="M73,170 C 120,170 150,190 200,190 C 250,190 280,170 327,170"/>
  <path class="line-main" d="M73,250 C 120,250 150,270 200,270 C 250,270 280,250 327,250"/>
  <line class="line-dash" x1="73" y1="250" x2="327" y2="250"/>
  <text class="t-desc" x="76" y="152">梁（破線＝沈下前の位置）</text>
  <line class="line-red" x1="200" y1="170" x2="200" y2="188" marker-end="url(#ar)"/>
  <text class="t-label" x="212" y="214">中央が下がる</text>
  </g>
  <rect class="box" x="20" y="392" width="360" height="74" rx="6"/>
  <text class="t-desc" x="200" y="418" text-anchor="middle">梁：通常の鉛直荷重時とは逆向きの曲げが作用する</text>
  <text class="t-label" x="200" y="448" text-anchor="middle">どこが沈下したかを読み取ることが原因推定の起点</text>
</svg>
