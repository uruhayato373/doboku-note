<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="変状の三つの系統（初期欠陥・劣化・構造的変状）ごとに、現れる変状とその主な原因の系統を対応づけた図">
