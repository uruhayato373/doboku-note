<!-- authored 2026-09-30 doboku-note 自作。題材はコンクリート診断士教材のエフロレッセンスの生成過程。書籍図の複製・トレースではない -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="エフロレッセンスの生成の流れ。内部の水が可溶性成分を溶かし、表面へ滲み出し、二酸化炭素と反応して炭酸カルシウムとして析出する。遊離石灰は原因物質で別のもの">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; font-size: 11px; fill: #555; }
      .h { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .hs { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .n { font-size: 11px; fill: #555; }
      .g { font-size: 11px; fill: #8a8a8a; }
      .m { text-anchor: middle; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .positive { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .danger { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .surface { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .row { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1; }
    </style>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="400" height="500" fill="#ffffff"/>
  <rect class="brand" x="20" y="14" width="360" height="44" rx="6"/>
  <text class="h" x="34" y="33">コンクリート内部の水が</text>
  <text class="n" x="34" y="50">水酸化カルシウム等の可溶性成分を溶かす</text>
  <line x1="200" y1="59" x2="200" y2="71" stroke="#555" stroke-width="1.5" marker-end="url(#a1)"/>
  <rect class="brand" x="20" y="72" width="360" height="44" rx="6"/>
  <text class="h" x="34" y="91">水とともに表面へ滲み出す</text>
  <text class="n" x="34" y="108">ひび割れ・打継ぎ面・施工目地が水の通り道</text>
  <line x1="200" y1="117" x2="200" y2="129" stroke="#555" stroke-width="1.5" marker-end="url(#a1)"/>
  <rect class="warn" x="20" y="130" width="360" height="44" rx="6"/>
  <text class="h" x="34" y="149">大気中のCO₂と反応する（炭酸化）</text>
  <text class="n" x="34" y="166">白色の炭酸カルシウムとして析出する</text>
  <line x1="200" y1="175" x2="200" y2="187" stroke="#555" stroke-width="1.5" marker-end="url(#a1)"/>
  <rect class="danger" x="20" y="188" width="360" height="44" rx="6"/>
  <text class="h" x="34" y="207">エフロレッセンス（白華）</text>
  <text class="n" x="34" y="224">析出した現象そのもの</text>
  <rect class="surface" x="20" y="250" width="360" height="62" rx="6"/>
  <text class="hs" x="34" y="270">遊離石灰＝未反応の水酸化カルシウム（原因物質）</text>
  <text class="n" x="34" y="288">エフロレッセンス＝析出した現象。</text>
  <text class="n" x="34" y="303">両者は別のもので、混同すると説明が循環する</text>
  <rect class="positive" x="20" y="324" width="360" height="164" rx="6"/>
  <text class="h" x="34" y="346">析出物は、水が動いているサイン</text>
  <text class="n" x="34" y="368">流れ筋は、水の移動経路をほぼたどる</text>
  <text class="n" x="34" y="388">広範囲・継続的なほど、水の供給が続いている</text>
  <text class="n" x="34" y="408">ゲル状の析出物を伴うと、ASRの疑いが高まる</text>
  <text class="n" x="34" y="428">塩分を含む水が入る環境では、塩化物イオンが</text>
  <text class="n" x="34" y="444">内部に蓄積している可能性がある</text>
  <text class="g" x="34" y="468">エフロレッセンス自体は直接の構造劣化ではない</text>
</svg>
