<!-- authored 2026-09-12 doboku-note 自作。題材はコンクリート診断士テキスト「変状の種類と原因」の論点。特定の書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="同じASR膨張が作用したときの無筋・RC・PCのひび割れの出方の違い。無筋は等方の亀甲状、RCは鉄筋方向に伸びた形状、PCは表面に出にくく内部に応力が蓄積する">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-sec  { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-desc { font-size: 11px; fill: #555; }
      .box-s { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .rebar { stroke: #8a8a8a; stroke-width: 3; }
      .crack { stroke: #b22234; stroke-width: 1.3; fill: none; }
    </style>
    <marker id="arrowIn" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/>
    </marker>
  </defs>

  <text class="t-lead" x="200" y="16" text-anchor="middle">同じASR膨張が作用したときのひび割れの出方の違い</text>

  <!-- 無筋 -->
  <rect class="box-s" x="20" y="28" width="360" height="145" rx="8"/>
  <text class="t-sec" x="36" y="50">① 無筋コンクリート</text>
  <rect class="box-b" x="50" y="58" width="300" height="55" rx="4"/>
  <path class="crack" d="M75,70 L110,100 L145,70 L180,105 L215,72 L250,102 L285,70 L320,100"/>
  <path class="crack" d="M95,63 L130,110 M165,63 L140,110 M205,63 L245,110 M285,63 L255,110"/>
  <text class="t-desc" x="36" y="130">骨材膨張がほぼ等方に働き</text>
  <text class="t-desc" x="36" y="147">亀甲状ひび割れが全面に明瞭に現れる</text>

  <!-- RC -->
  <rect class="box-s" x="20" y="185" width="360" height="145" rx="8"/>
  <text class="t-sec" x="36" y="207">② RC（鉄筋コンクリート）</text>
  <rect class="box-b" x="50" y="215" width="300" height="55" rx="4"/>
  <line class="rebar" x1="55" y1="255" x2="345" y2="255"/>
  <circle cx="90" cy="255" r="4" fill="#8a8a8a"/>
  <circle cx="150" cy="255" r="4" fill="#8a8a8a"/>
  <circle cx="210" cy="255" r="4" fill="#8a8a8a"/>
  <circle cx="270" cy="255" r="4" fill="#8a8a8a"/>
  <circle cx="330" cy="255" r="4" fill="#8a8a8a"/>
  <path class="crack" d="M65,238 L335,238"/>
  <path class="crack" d="M90,225 L90,238 M150,225 L150,238 M210,225 L210,238 M270,225 L270,238 M330,225 L330,238"/>
  <text class="t-desc" x="36" y="288">鉄筋方向の拘束がはたらき</text>
  <text class="t-desc" x="36" y="305">亀甲状パターンが鉄筋方向に伸びて現れる</text>

  <!-- PC -->
  <rect class="box-s" x="20" y="342" width="360" height="145" rx="8"/>
  <text class="t-sec" x="36" y="364">③ PC（プレストレストコンクリート）</text>
  <rect class="box-b" x="50" y="372" width="300" height="55" rx="4"/>
  <line x1="60" y1="399" x2="90" y2="399" stroke="#2e6da4" stroke-width="2" marker-end="url(#arrowIn)"/>
  <line x1="340" y1="399" x2="310" y2="399" stroke="#2e6da4" stroke-width="2" marker-end="url(#arrowIn)"/>
  <rect x="175" y="384" width="50" height="30" rx="3" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="200" y="403" text-anchor="middle" font-size="11" fill="#1a3a5c" font-weight="bold">応力蓄積</text>
  <text class="t-desc" x="36" y="445">プレストレスの拘束でひび割れが抑制され</text>
  <text class="t-desc" x="36" y="462">内部に応力が蓄積し、シース損傷等で現れる</text>
</svg>
