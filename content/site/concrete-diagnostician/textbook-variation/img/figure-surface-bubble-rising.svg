<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="表面気泡が下向きに傾いた型枠面の下に集まる断面図。気泡は浮力で上昇し、径が小さいほど浮上が遅く、凝結前に抜けきれないと型枠面に接したまま残る">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; font-size: 11px; fill: #555; }
      .h { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .hs { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .n { font-size: 11px; fill: #555; }
      .g { font-size: 11px; fill: #8a8a8a; }
      .m { text-anchor: middle; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .positive { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .danger { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .surface { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .row { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1; }
    </style>
    <marker id="ab" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="400" height="500" fill="#ffffff"/>
  <polygon points="30,120 370,70 370,214 30,214" class="brand"/>
  <path d="M30,120 L370,70" stroke="#555" stroke-width="5" fill="none"/>
  <text class="hs" x="40" y="150">太線：型枠（下向きに傾斜）</text>
  <circle cx="70" cy="185" r="4" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
  <line x1="70" y1="177" x2="70" y2="159" stroke="#2e6da4" stroke-width="2" marker-end="url(#ab)"/>
  <circle cx="130" cy="196" r="4" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
  <line x1="130" y1="188" x2="130" y2="170" stroke="#2e6da4" stroke-width="2" marker-end="url(#ab)"/>
  <circle cx="210" cy="168" r="4" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
  <line x1="210" y1="160" x2="210" y2="142" stroke="#2e6da4" stroke-width="2" marker-end="url(#ab)"/>
  <circle cx="290" cy="186" r="4" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
  <line x1="290" y1="178" x2="290" y2="160" stroke="#2e6da4" stroke-width="2" marker-end="url(#ab)"/>
  <circle cx="236" cy="96.7" r="5" fill="#ffffff" stroke="#b22234" stroke-width="1.5"/>
  <circle cx="252" cy="94.4" r="5" fill="#ffffff" stroke="#b22234" stroke-width="1.5"/>
  <circle cx="268" cy="92.0" r="5" fill="#ffffff" stroke="#b22234" stroke-width="1.5"/>
  <circle cx="284" cy="89.6" r="5" fill="#ffffff" stroke="#b22234" stroke-width="1.5"/>
  <circle cx="300" cy="87.3" r="5" fill="#ffffff" stroke="#b22234" stroke-width="1.5"/>
  <circle cx="316" cy="84.9" r="5" fill="#ffffff" stroke="#b22234" stroke-width="1.5"/>
  <circle cx="332" cy="82.6" r="5" fill="#ffffff" stroke="#b22234" stroke-width="1.5"/>
  <text class="hs" x="186" y="140">気泡が型枠面の下に集まる</text>
  <text class="n" x="150" y="208">気泡は浮力で上昇する</text>
  <rect class="brand" x="10" y="226" width="380" height="76" rx="6"/>
  <text class="h" x="22" y="248">浮上のしくみ</text>
  <text class="n" x="22" y="268">径が小さいほど、浮上が遅い</text>
  <text class="n" x="22" y="286">凝結が始まる前に抜けきれないと、型枠面に接したまま硬化する</text>
  <rect class="warn" x="10" y="312" width="380" height="96" rx="6"/>
  <text class="h" x="22" y="334">出やすい条件</text>
  <text class="n" x="22" y="354">粘性が高く浮上しにくい配合、高温で凝結が早い条件</text>
  <text class="n" x="22" y="372">締固め時間が短い場合</text>
  <text class="n" x="22" y="390">剥離剤の塗りすぎ（空気を留める要因とされる）</text>
  <rect class="surface" x="10" y="418" width="380" height="72" rx="6"/>
  <text class="h" x="22" y="440">診断では、個数より分布を見る</text>
  <text class="n" x="22" y="458">傾斜面や打込み区画に偏れば、施工条件の問題と読める</text>
  <text class="n" x="22" y="474">連続して水の通り道になっていないかで評価を分ける</text>
</svg>
