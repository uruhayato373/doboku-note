<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="コールドジョイントの原因と起きやすい場所。配合・製造運搬・環境・施工の条件が重なり、下層が凝結を始めた後に上層を打ち重ねると面が残る。到着間隔が開いた区画の境、配管の切替え、配筋が過密な部位に出やすい">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; font-size: 11px; fill: #555; }
      .h { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .hs { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .n { font-size: 11px; fill: #555; }
      .g { font-size: 11px; fill: #8a8a8a; }
      .m { text-anchor: middle; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .positive { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .danger { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .surface { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .row { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1; }
    </style>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="400" height="500" fill="#ffffff"/>
  <rect class="brand" x="20" y="12" width="176" height="52" rx="6"/>
  <text class="h" x="30" y="32">配合</text>
  <text class="n" x="30" y="50">W/C・ブリーディング・凝結</text>
  <rect class="brand" x="204" y="12" width="176" height="52" rx="6"/>
  <text class="h" x="214" y="32">製造・運搬</text>
  <text class="n" x="214" y="50">運搬の方法・距離・時間</text>
  <rect class="brand" x="20" y="70" width="176" height="52" rx="6"/>
  <text class="h" x="30" y="90">環境条件</text>
  <text class="n" x="30" y="108">温度・湿度・風・日射</text>
  <rect class="brand" x="204" y="70" width="176" height="52" rx="6"/>
  <text class="h" x="214" y="90">施工</text>
  <text class="n" x="214" y="108">打込み順序・速度、締固め</text>
  <line x1="200" y1="130" x2="200" y2="146" stroke="#555" stroke-width="1.5" marker-end="url(#a1)"/>
  <text class="n" x="212" y="142">重なり、許容時間を超える</text>
  <rect class="positive" x="20" y="150" width="360" height="46" rx="6"/>
  <text class="hs" x="34" y="176">上層（新しい層）</text>
  <rect class="brand" x="20" y="196" width="360" height="56" rx="6"/>
  <text class="hs" x="34" y="220">下層（初期凝結を始めている）</text>
  <path d="M20,196 H380" stroke="#b22234" stroke-width="3" stroke-dasharray="8 4" fill="none"/>
  <text class="n" x="34" y="242">打重ね面が一体に締固められず、面が残る</text>
  <rect class="warn" x="20" y="264" width="360" height="100" rx="6"/>
  <text class="h" x="34" y="286">起きやすい場所</text>
  <text class="n" x="34" y="306">・生コンの到着間隔が開いたときの区画の境</text>
  <text class="n" x="34" y="324">・ポンプ配管の切替え時</text>
  <text class="n" x="34" y="342">・配筋が過密で、締固めに手間取る部位</text>
  <rect class="surface" x="20" y="376" width="360" height="112" rx="6"/>
  <text class="h" x="34" y="398">診断では、施工記録の履歴を見る</text>
  <text class="n" x="34" y="418">打込みの開始・終了時刻、外気温、</text>
  <text class="n" x="34" y="434">生コンの到着間隔が残っていれば、</text>
  <text class="n" x="34" y="450">打重ね間隔の超過で説明できるか確かめる</text>
  <text class="g" x="34" y="472">外観は水平な線。波打つ曲線状もある</text>
</svg>
