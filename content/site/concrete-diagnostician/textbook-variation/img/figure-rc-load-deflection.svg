<!-- authored 2026-09-30 doboku-note 自作。題材はコンクリート診断士教材のRC部材の荷重とたわみの関係。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="荷重とたわみの関係の比較。無筋はA点の弾性状態から立ち上がって急に耐力を失うのに対し、有筋のRCはひび割れ発生、進展、降伏、最大荷重を経て終局に至り、途中でせん断破壊または圧壊に至る経路もある">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 11px; fill: #555; }
      .t-axis  { font-size: 11px; fill: #8a8a8a; }
      .t-label { font-size: 11px; fill: #1a3a5c; }
      .t-b { font-size: 12px; fill: #1a3a5c; font-weight: 700; }
      .t-desc  { font-size: 11px; fill: #555; }
      .line-main { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .line-thin { stroke: #2e6da4; stroke-width: 1.5; fill: none; }
      .line-dash { stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .line-red { stroke: #b22234; stroke-width: 1.5; fill: none; }
      .box { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-d { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .box-p { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
    </style>
    <marker id="ah" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4" /></marker>
    <marker id="ahr" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#b22234" /></marker>
  </defs>
  <text class="t-lead" x="200" y="16" text-anchor="middle">横軸＝たわみδ、縦軸＝荷重P（数値なし・挙動の形を示す）</text>
  <line class="line-dash" x1="50" y1="300" x2="50" y2="44" />
  <line class="line-dash" x1="50" y1="300" x2="375" y2="300" />
  <text class="t-axis" x="56" y="42">荷重 P</text>
  <text class="t-axis" x="330" y="318">たわみ δ</text>
  <path class="line-main" d="M50,300 L60,280 L78,240 L105,205 L135,150 L280,128 L325,168" />
  <path class="line-dash" d="M60,280 C 66,292 85,298 115,299" />
  <path class="line-thin" d="M50,300 L60,280 C 66,292 85,298 115,299" style="stroke:#8a8a8a" />
  <line class="line-red" x1="120" y1="176" x2="170" y2="214" marker-end="url(#ahr)" />
  <circle cx="60" cy="280" r="3.5" class="box-b" />
  <circle cx="78" cy="240" r="3.5" class="box-b" />
  <circle cx="105" cy="205" r="3.5" class="box-b" />
  <circle cx="135" cy="150" r="3.5" class="box-b" />
  <circle cx="280" cy="128" r="3.5" class="box-b" />
  <circle cx="325" cy="168" r="3.5" class="box-b" />
  <text class="t-label" x="44" y="281" text-anchor="end">A</text>
  <text class="t-label" x="70" y="236" text-anchor="end">B</text>
  <text class="t-label" x="97" y="203" text-anchor="end">C</text>
  <text class="t-label" x="128" y="146" text-anchor="end">D</text>
  <text class="t-label" x="280" y="120" text-anchor="middle">E</text>
  <text class="t-label" x="333" y="176">F</text>
  <text class="t-label" x="174" y="228">G</text>
  <text class="t-desc" x="122" y="292">無筋</text>
  <text class="t-b" x="200" y="82" text-anchor="middle">有筋（RC）</text>
  <rect class="box" x="20" y="332" width="360" height="156" rx="6" />
  <text class="t-b" x="34" y="352">A</text>
  <text class="t-label" x="54" y="352">弾性状態（ひび割れ発生前）</text>
  <text class="t-b" x="34" y="368">B</text>
  <text class="t-label" x="54" y="368">ひび割れ発生（ひび割れ荷重）</text>
  <text class="t-b" x="34" y="384">C</text>
  <text class="t-label" x="54" y="384">ひび割れ進展段階</text>
  <text class="t-b" x="34" y="400">D</text>
  <text class="t-label" x="54" y="400">降伏</text>
  <text class="t-b" x="34" y="416">E</text>
  <text class="t-label" x="54" y="416">最大荷重</text>
  <text class="t-b" x="34" y="432">F</text>
  <text class="t-label" x="54" y="432">終局</text>
  <text class="t-b" x="34" y="448">G</text>
  <text class="t-label" x="54" y="448">せん断破壊または圧壊</text>
  <text class="t-desc" x="34" y="476">無筋は弾性域から急に破壊、有筋は鉄筋が引張を分担してねばる</text>

</svg>
