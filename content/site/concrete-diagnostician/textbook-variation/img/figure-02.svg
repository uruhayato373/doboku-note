<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="収縮系ひび割れの型の見分け。乾燥収縮は壁の上端まで規則的に鉛直、外部拘束型は拘束体から立ち上がって貫通、内部拘束型は表面の浅いひび割れ">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; font-size: 11px; fill: #555; }
      .h { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .hs { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .n { font-size: 11px; fill: #555; }
      .g { font-size: 11px; fill: #8a8a8a; }
      .m { text-anchor: middle; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .positive { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .danger { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .surface { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .row { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1; }
    </style>
    <marker id="a2" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
    <pattern id="hat" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#8a8a8a" stroke-width="1.5"/></pattern>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="400" height="500" fill="#ffffff"/>
  <text class="g m" x="200" y="14">収縮が拘束されると、拘束方向と直交する向きに割れる</text>
  <rect x="20" y="26" width="170" height="110" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
  <rect x="14" y="136" width="182" height="24" fill="url(#hat)" stroke="#555" stroke-width="1.5"/>
  <path d="M65,28 l-3,18 l4,20 l-3,18 l3,20 l-2,32" fill="none" stroke="#b22234" stroke-width="2"/>
  <path d="M105,28 l-3,18 l4,20 l-3,18 l3,20 l-2,32" fill="none" stroke="#b22234" stroke-width="2"/>
  <path d="M145,28 l-3,18 l4,20 l-3,18 l3,20 l-2,32" fill="none" stroke="#b22234" stroke-width="2"/>
  <rect x="210" y="26" width="170" height="110" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
  <rect x="204" y="136" width="182" height="24" fill="url(#hat)" stroke="#555" stroke-width="1.5"/>
  <path d="M255,56 l-3,18 l4,20 l-3,18 l3,20 l-2,4" fill="none" stroke="#b22234" stroke-width="2"/>
  <path d="M295,56 l-3,18 l4,20 l-3,18 l3,20 l-2,4" fill="none" stroke="#b22234" stroke-width="2"/>
  <path d="M335,56 l-3,18 l4,20 l-3,18 l3,20 l-2,4" fill="none" stroke="#b22234" stroke-width="2"/>
  <line x1="26" y1="84" x2="42" y2="84" stroke="#2e6da4" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="184" y1="84" x2="168" y2="84" stroke="#2e6da4" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="216" y1="84" x2="232" y2="84" stroke="#2e6da4" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="374" y1="84" x2="358" y2="84" stroke="#2e6da4" stroke-width="2" marker-end="url(#a2)"/>
  <text class="n m" x="105" y="152">基礎・梁</text>
  <text class="n m" x="295" y="152">底版・既設部材</text>
  <text class="hs m" x="105" y="178">乾燥収縮</text>
  <text class="n m" x="105" y="193">上端まで規則的に鉛直</text>
  <text class="g m" x="105" y="206">硬化後（数か月以降）</text>
  <text class="hs m" x="295" y="178">温度（外部拘束型）</text>
  <text class="n m" x="295" y="193">拘束体から立ち上がって貫通</text>
  <text class="g m" x="295" y="206">温度降下が進んだ段階</text>
  <rect class="surface" x="20" y="222" width="360" height="118" rx="6"/>
  <text class="hs m" x="200" y="240">温度ひび割れ（内部拘束型）</text>
  <rect x="36" y="252" width="130" height="76" fill="#f8d7da" stroke="#555" stroke-width="1.5"/>
  <rect x="56" y="272" width="90" height="36" fill="#d4a017" fill-opacity="0.35"/>
  <path d="M52,252 l-1,10" stroke="#b22234" stroke-width="2" fill="none"/>
  <path d="M76,252 l-1,10" stroke="#b22234" stroke-width="2" fill="none"/>
  <path d="M100,252 l-1,10" stroke="#b22234" stroke-width="2" fill="none"/>
  <path d="M124,252 l-1,10" stroke="#b22234" stroke-width="2" fill="none"/>
  <path d="M148,252 l-1,10" stroke="#b22234" stroke-width="2" fill="none"/>
  <text class="n m" x="101" y="290">高温</text>
  <text class="n" x="180" y="268">内部と表面の温度差で</text>
  <text class="n" x="180" y="284">自己拘束される</text>
  <text class="hs" x="180" y="304">若材齢の表面ひび割れ</text>
  <text class="n" x="180" y="320">（貫通しない）</text>
  <rect class="warn" x="20" y="350" width="360" height="62" rx="6"/>
  <text class="h m" x="200" y="370">拘束は水平方向 → 割れは鉛直方向</text>
  <text class="n m" x="200" y="388">ひび割れの起点は、拘束体との位置関係</text>
  <text class="n m" x="200" y="403">で決まる</text>
  <rect class="brand" x="20" y="422" width="360" height="56" rx="6"/>
  <text class="h m" x="200" y="442">外部拘束と内部拘束は排他的ではない</text>
  <text class="n m" x="200" y="460">同一部材に重なって作用することが多い</text>
</svg>
