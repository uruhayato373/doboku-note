<!-- authored 2026-09-30 doboku-note 自作。題材はコンクリート診断士教材の浮き・剥離・剥落。書籍図の複製・トレースではない -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="かぶりコンクリートの断面で、浸透・腐食、腐食膨張、浮き、剥離、剥落の五段階を上から下へ示した図。剥落より規模が大きい脱落は別の用語">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; font-size: 11px; fill: #555; }
      .h { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .hs { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .n { font-size: 11px; fill: #555; }
      .g { font-size: 11px; fill: #8a8a8a; }
      .m { text-anchor: middle; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .positive { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .danger { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .surface { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .row { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1; }
    </style>
    <marker id="ar" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 9,4 0,8" fill="#2e6da4"/></marker>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="400" height="500" fill="#ffffff"/>
  <rect class="surface" x="20" y="22" width="360" height="62" rx="6"/>
  <rect class="brand" x="30" y="28" width="120" height="50" rx="2"/>
  <line x1="56" y1="30" x2="56" y2="46" stroke="#2e6da4" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="90" y1="30" x2="90" y2="46" stroke="#2e6da4" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="124" y1="30" x2="124" y2="46" stroke="#2e6da4" stroke-width="2" marker-end="url(#ar)"/>
  <circle class="warn" cx="90" cy="64" r="7"/>
  <circle class="brand" cx="168" cy="36" r="9"/>
  <text class="hs m" x="168" y="40">1</text>
  <text class="h" x="184" y="41">浸透・腐食</text>
  <text class="n" x="184" y="58">水や二酸化炭素がかぶりを通り</text>
  <text class="n" x="184" y="73">鋼材に届き、鋼材が腐食する</text>
  <line x1="90" y1="84" x2="90" y2="90" stroke="#2e6da4" stroke-width="2"/>
  <rect class="surface" x="20" y="90" width="360" height="62" rx="6"/>
  <rect class="brand" x="30" y="96" width="120" height="50" rx="2"/>
  <circle class="danger" cx="90" cy="132" r="9"/>
  <path d="M90,123 L86,112 L91,98" fill="none" stroke="#b22234" stroke-width="1.5"/>
  <path d="M81,132 L34,134" fill="none" stroke="#b22234" stroke-width="1.5"/>
  <circle class="brand" cx="168" cy="104" r="9"/>
  <text class="hs m" x="168" y="108">2</text>
  <text class="h" x="184" y="109">腐食膨張</text>
  <text class="n" x="184" y="126">鋼材が膨張し、かぶりが</text>
  <text class="n" x="184" y="141">ひび割れる。錆汁がにじむことも</text>
  <line x1="90" y1="152" x2="90" y2="158" stroke="#2e6da4" stroke-width="2"/>
  <rect class="surface" x="20" y="158" width="360" height="62" rx="6"/>
  <rect class="brand" x="30" y="164" width="120" height="50" rx="2"/>
  <rect class="warn" x="30" y="164" width="120" height="22" rx="2"/>
  <path d="M30,186 H150" stroke="#b22234" stroke-width="2"/>
  <circle class="danger" cx="90" cy="200" r="9"/>
  <circle class="brand" cx="168" cy="172" r="9"/>
  <text class="hs m" x="168" y="176">3</text>
  <text class="h" x="184" y="177">浮き</text>
  <text class="n" x="184" y="194">内部で分離しているが、まだ</text>
  <text class="n" x="184" y="209">脱落していない。打診で濁音</text>
  <line x1="90" y1="220" x2="90" y2="226" stroke="#2e6da4" stroke-width="2"/>
  <rect class="surface" x="20" y="226" width="360" height="62" rx="6"/>
  <rect class="brand" x="30" y="232" width="120" height="50" rx="2"/>
  <rect class="warn" x="30" y="232" width="70" height="22" rx="2"/>
  <polygon points="100,232 142,228 150,250 100,254" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <path d="M30,254 H100" stroke="#b22234" stroke-width="2"/>
  <circle class="danger" cx="90" cy="268" r="9"/>
  <circle class="brand" cx="168" cy="240" r="9"/>
  <text class="hs m" x="168" y="244">4</text>
  <text class="h" x="184" y="245">剥離</text>
  <text class="n" x="184" y="262">浮いた部分が</text>
  <text class="n" x="184" y="277">一部剥がれた状態</text>
  <line x1="90" y1="288" x2="90" y2="294" stroke="#2e6da4" stroke-width="2"/>
  <rect class="surface" x="20" y="294" width="360" height="62" rx="6"/>
  <rect class="brand" x="30" y="300" width="120" height="50" rx="2"/>
  <polygon points="90,300 150,300 150,322 100,322" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle class="danger" cx="90" cy="336" r="9"/>
  <circle class="brand" cx="168" cy="308" r="9"/>
  <text class="hs m" x="168" y="312">5</text>
  <text class="h" x="184" y="313">剥落</text>
  <text class="n" x="184" y="330">その部分が完全に脱落する</text>
  <text class="n" x="184" y="345">落下物となり、第三者被害の恐れ</text>
  <rect class="warn" x="20" y="368" width="360" height="56" rx="6"/>
  <text class="h" x="32" y="390">脱落は、剥落より規模の大きい喪失</text>
  <text class="n" x="32" y="408">部材そのものや添架物が、位置全体から外れて落下</text>
  <rect class="brand" x="20" y="434" width="360" height="56" rx="6"/>
  <text class="h" x="32" y="456">浮きは打診で確かめる</text>
  <text class="n" x="32" y="474">健全部は澄んだ高い音（清音）、浮きは濁った低い音</text>
</svg>
