<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="ひび割れの観察5項目の使い分け。幅・深さ・活動性は有害かと処置を決め、分布パターンと発生時期は原因群の推定に使う。分布パターン別の代表原因を添える">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; font-size: 11px; fill: #555; }
      .h { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .hs { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .n { font-size: 11px; fill: #555; }
      .g { font-size: 11px; fill: #8a8a8a; }
      .m { text-anchor: middle; }
      .brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .positive { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .danger { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .surface { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .row { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1; }
    </style>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="400" height="500" fill="#ffffff"/>
  <text class="g m" x="200" y="14">観察5項目：上の3つは「有害か・処置」、下の2つは「原因」</text>
  <rect class="brand" x="20" y="22" width="112" height="50" rx="6"/>
  <text class="hs" x="28" y="38">幅</text>
  <text class="n" x="28" y="53">0.2〜0.3 mm超で</text>
  <text class="n" x="28" y="66">抵抗性が低下</text>
  <rect class="brand" x="144" y="22" width="112" height="50" rx="6"/>
  <text class="hs" x="152" y="38">深さ・貫通性</text>
  <text class="n" x="152" y="53">表面か、断面を</text>
  <text class="n" x="152" y="66">貫通しているか</text>
  <rect class="brand" x="268" y="22" width="112" height="50" rx="6"/>
  <text class="hs" x="276" y="38">活動性</text>
  <text class="n" x="276" y="53">開閉を繰り返すか</text>
  <text class="n" x="276" y="66">安定しているか</text>
  <line x1="200" y1="74" x2="200" y2="88" stroke="#555" stroke-width="1.5" marker-end="url(#a1)"/>
  <rect class="warn" x="20" y="90" width="360" height="36" rx="6"/>
  <text class="h m" x="200" y="106">耐久性上有害か ／ どの処置にするか</text>
  <text class="n m" x="200" y="120">貫通性・活動性が高いと、幅が小さくても有害</text>
  <rect class="brand" x="20" y="138" width="172" height="50" rx="6"/>
  <text class="hs" x="28" y="154">分布パターン</text>
  <text class="n" x="28" y="169">一方向・網状・亀甲状</text>
  <text class="n" x="28" y="182">など平面の広がり方</text>
  <rect class="brand" x="208" y="138" width="172" height="50" rx="6"/>
  <text class="hs" x="216" y="154">発生時期</text>
  <text class="n" x="216" y="169">数時間以内・数日〜数週間</text>
  <text class="n" x="216" y="182">数年以上（供用後）</text>
  <line x1="200" y1="190" x2="200" y2="204" stroke="#555" stroke-width="1.5" marker-end="url(#a1)"/>
  <rect class="warn" x="20" y="206" width="115" height="48" rx="6"/>
  <text class="hs m" x="77" y="222">施工・初期</text>
  <text class="n m" x="77" y="236">沈下・打重ね不良</text>
  <text class="n m" x="77" y="249">温度・収縮</text>
  <rect class="brand" x="143" y="206" width="115" height="48" rx="6"/>
  <text class="hs m" x="200" y="222">荷重・変形</text>
  <text class="n m" x="200" y="236">曲げ・せん断</text>
  <text class="n m" x="200" y="249">不同沈下・地震</text>
  <rect class="danger" x="266" y="206" width="114" height="48" rx="6"/>
  <text class="hs m" x="323" y="222">材料・環境劣化</text>
  <text class="n m" x="323" y="236">ASR・鋼材腐食</text>
  <text class="n m" x="323" y="249">凍害・中性化</text>
  <rect class="surface" x="20" y="266" width="360" height="226" rx="6"/>
  <text class="h m" x="200" y="284">分布パターンと代表的な原因</text>
  <rect class="row" x="30" y="292" width="340" height="34" rx="3"/>
  <text class="hs" x="40" y="307">一方向・等間隔</text>
  <text class="g" x="40" y="320">拘束と直交する向き</text>
  <text class="n" x="215" y="313">乾燥収縮・温度変化</text>
  <rect class="row" x="30" y="330" width="340" height="34" rx="3"/>
  <text class="hs" x="40" y="345">鉄筋に沿う直線</text>
  <text class="g" x="40" y="358">錆汁・剥落を伴う</text>
  <text class="n" x="215" y="351">鋼材腐食（塩害・中性化）</text>
  <rect class="row" x="30" y="368" width="340" height="34" rx="3"/>
  <text class="hs" x="40" y="383">亀甲状・網状</text>
  <text class="g" x="40" y="396">ゲル状析出物を伴う</text>
  <text class="n" x="215" y="389">アルカリシリカ反応</text>
  <rect class="row" x="30" y="406" width="340" height="34" rx="3"/>
  <text class="hs" x="40" y="421">鉄筋直上・隅角部</text>
  <text class="g" x="40" y="434">打込み後 数時間以内</text>
  <text class="n" x="215" y="427">沈下（沈降）ひび割れ</text>
  <rect class="row" x="30" y="444" width="340" height="34" rx="3"/>
  <text class="hs" x="40" y="459">支点付近の斜め</text>
  <text class="n" x="215" y="465">せん断（主引張応力方向）</text>
</svg>
