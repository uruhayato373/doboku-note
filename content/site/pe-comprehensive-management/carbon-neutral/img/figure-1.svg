<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  width="400" height="500"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="カーボンニュートラル達成の3ステップと残存CO₂処理技術CCS・BECCS・DACCSを縦積みで示した図">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-main  { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-en    { font-size: 11px; fill: #555; }
      .t-note  { font-size: 11px; fill: #555; }
      .t-num   { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-card  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-desc  { font-size: 11px; fill: #555; }
      .t-tag-g { font-size: 11px; font-weight: bold; fill: #3a7d44; }
      .t-tag-s { font-size: 11px; font-weight: bold; fill: #555; }
      .t-foot  { font-size: 11px; fill: #8a8a8a; }
      .box-brand    { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .badge-brand  { fill: #ffffff; stroke: #2e6da4; stroke-width: 1.5; }
      .box-positive { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-surface  { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
    <marker markerUnits="userSpaceOnUse" id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 9,3.5 0,7" fill="#8a8a8a"/>
    </marker>
    <marker markerUnits="userSpaceOnUse" id="arrow-green" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 9,3.5 0,7" fill="#3a7d44"/>
    </marker>
    <marker markerUnits="userSpaceOnUse" id="arrow-gray" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 9,3.5 0,7" fill="#d7d7d7"/>
    </marker>
  </defs>

  <!-- STEP 1 省エネルギーの強化 (y=8, h=58) -->
  <rect class="box-brand" x="20" y="8" width="360" height="58" rx="8"/>
  <circle class="badge-brand" cx="46" cy="37" r="14"/>
  <text class="t-num" x="46" y="42" text-anchor="middle">1</text>
  <text class="t-main" x="70" y="30">省エネルギーの強化</text>
  <text class="t-en"   x="70" y="46">Energy Efficiency</text>
  <text class="t-note" x="374" y="40" text-anchor="end">需要側削減</text>

  <!-- 矢印 1→2 -->
  <line x1="200" y1="66" x2="200" y2="80" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STEP 2 非化石エネルギー導入拡大 (y=84, h=58) -->
  <rect class="box-brand" x="20" y="84" width="360" height="58" rx="8"/>
  <circle class="badge-brand" cx="46" cy="113" r="14"/>
  <text class="t-num" x="46" y="118" text-anchor="middle">2</text>
  <text class="t-main" x="70" y="106">非化石エネルギー導入拡大</text>
  <text class="t-en"   x="70" y="122">Decarbonization of Supply</text>
  <text class="t-note" x="374" y="116" text-anchor="end">再エネ等</text>

  <!-- 矢印 2→3 -->
  <line x1="200" y1="142" x2="200" y2="156" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STEP 3 残存CO₂の貯留・活用 (y=160, h=58) -->
  <rect class="box-brand" x="20" y="160" width="360" height="58" rx="8"/>
  <circle class="badge-brand" cx="46" cy="189" r="14"/>
  <text class="t-num" x="46" y="194" text-anchor="middle">3</text>
  <text class="t-main" x="70" y="182">残存CO₂の貯留・活用</text>
  <text class="t-en"   x="70" y="198">Carbon Removal Technologies</text>
  <text class="t-note" x="374" y="192" text-anchor="end">技術開発</text>

  <!-- 分岐ライン（STEP3から3カード縦積みへ） -->
  <line x1="200" y1="218" x2="200" y2="232" stroke="#8a8a8a" stroke-width="2"/>

  <!-- CCS カード (y=234, h=64) -->
  <line x1="200" y1="232" x2="200" y2="236" stroke="#d7d7d7" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <rect class="box-surface" x="40" y="238" width="320" height="60" rx="7"/>
  <text class="t-card" x="200" y="256" text-anchor="middle">CCS（Carbon dioxide Capture and Storage）</text>
  <text class="t-desc" x="200" y="272" text-anchor="middle">発電所・化学工場のCO₂を分離・地中深く貯留</text>
  <text class="t-tag-s" x="200" y="288" text-anchor="middle">排出ゼロ水準（マイナスにはならない）</text>

  <!-- CCS→BECCS 矢印 -->
  <line x1="200" y1="298" x2="200" y2="312" stroke="#3a7d44" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- BECCS カード (y=314, h=60) -->
  <rect class="box-positive" x="40" y="314" width="320" height="60" rx="7"/>
  <text class="t-card" x="200" y="332" text-anchor="middle">BECCS（Bioenergy with CCS）</text>
  <text class="t-desc" x="200" y="348" text-anchor="middle">バイオマス燃焼のCO₂を回収・地中貯留</text>
  <text class="t-tag-g" x="200" y="364" text-anchor="middle">カーボンネガティブ（排出量をマイナス化）</text>

  <!-- BECCS→DACCS 矢印 -->
  <line x1="200" y1="374" x2="200" y2="388" stroke="#3a7d44" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- DACCS カード (y=390, h=60) -->
  <rect class="box-positive" x="40" y="390" width="320" height="60" rx="7"/>
  <text class="t-card" x="200" y="408" text-anchor="middle">DACCS（Direct Air Capture + CCS）</text>
  <text class="t-desc" x="200" y="424" text-anchor="middle">大気中のCO₂を直接回収（DAC）＋地中貯留</text>
  <text class="t-tag-g" x="200" y="440" text-anchor="middle">カーボンネガティブ（排出量をマイナス化）</text>

  <!-- フッター -->
  <text class="t-foot" x="200" y="474" text-anchor="middle">CO₂分離回収法：吸収法 / 吸着分離法 / 膜分離法 / 深冷分離法</text>
</svg>
