<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="調達物流からサービスまでの主活動を人材・技術などの支援活動が横断的に支える構造" style="max-width:400px;width:100%"><defs><style>text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#222}.h{font-size:17px;font-weight:bold}.t{font-size:14px}.s{font-size:13px;fill:#555}.b{fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5}.g{fill:#d0e8d0;stroke:#3a7d44;stroke-width:1.5}.w{fill:#fff3cd;stroke:#d4a017;stroke-width:1.5}.n{fill:#f5f5f5;stroke:#d7d7d7;stroke-width:1}.a{fill:none;stroke:#2e6da4;stroke-width:2;marker-end:url(#arrow)}.l{fill:none;stroke:#555;stroke-width:1.5}</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4"/></marker></defs><rect x="20" y="20" width="165" height="375" rx="7" class="g"/><text x="102" y="75" class="h" text-anchor="middle">支援活動</text><text x="102" y="130" class="t" text-anchor="middle">全般管理</text><text x="102" y="170" class="t" text-anchor="middle">人事労務管理</text><text x="102" y="210" class="t" text-anchor="middle">技術開発</text><text x="102" y="250" class="t" text-anchor="middle">調達活動</text><text x="102" y="350" class="s" text-anchor="middle">主活動を横断して支援</text><rect x="215" y="20" width="165" height="63" rx="7" class="b"/><text x="297.5" y="48" class="h" text-anchor="middle">購買物流</text><path d="M185 50 H209" class="a"/><path d="M298 83 V92" class="a"/><rect x="215" y="98" width="165" height="63" rx="7" class="b"/><text x="297.5" y="126" class="h" text-anchor="middle">製造</text><path d="M185 128 H209" class="a"/><path d="M298 161 V170" class="a"/><rect x="215" y="176" width="165" height="63" rx="7" class="b"/><text x="297.5" y="204" class="h" text-anchor="middle">出荷物流</text><path d="M185 206 H209" class="a"/><path d="M298 239 V248" class="a"/><rect x="215" y="254" width="165" height="63" rx="7" class="b"/><text x="297.5" y="282" class="h" text-anchor="middle">販売</text><path d="M185 284 H209" class="a"/><path d="M298 317 V326" class="a"/><rect x="215" y="332" width="165" height="63" rx="7" class="b"/><text x="297.5" y="360" class="h" text-anchor="middle">サービス</text><path d="M185 362 H209" class="a"/><text x="200" y="445" class="h" text-anchor="middle">活動をつなぎ、顧客が得る価値へ</text></svg>
