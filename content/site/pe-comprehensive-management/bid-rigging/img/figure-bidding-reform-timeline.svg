<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="12">
<line x1="78" y1="30" x2="78" y2="440" stroke="#d7d7d7" stroke-width="2"/><!-- token-border -->
<circle cx="78" cy="65" r="6" fill="#2e6da4"/><text x="62" y="70" text-anchor="end" font-size="14" font-weight="700" fill="#222">1947</text>
<rect x="100" y="30" width="276" height="70" rx="8" fill="#e8f0fe" stroke="#2e6da4"/><text x="114" y="59" font-size="14" font-weight="700" fill="#1a3a5c">現行会計法・地方自治法</text><text x="114" y="82" font-size="12" fill="#555">公告して競う一般競争が建前</text>
<circle cx="78" cy="147" r="6" fill="#b22234"/><text x="62" y="152" text-anchor="end" font-size="14" font-weight="700" fill="#222">2000</text>
<rect x="100" y="112" width="276" height="70" rx="8" fill="#f8d7da" stroke="#b22234"/><text x="114" y="141" font-size="14" font-weight="700" fill="#1a3a5c">入札契約適正化法</text><text x="114" y="164" font-size="12" fill="#555">談合の排除を基本原則に（施行2001）</text>
<circle cx="78" cy="229" r="6" fill="#b22234"/><text x="62" y="234" text-anchor="end" font-size="14" font-weight="700" fill="#222">2002</text>
<rect x="100" y="194" width="276" height="70" rx="8" fill="#f8d7da" stroke="#b22234"/><text x="114" y="223" font-size="14" font-weight="700" fill="#1a3a5c">官製談合防止法</text><text x="114" y="246" font-size="12" fill="#555">職員の関与を規制（施行2003）</text>
<circle cx="78" cy="311" r="6" fill="#2e6da4"/><text x="62" y="316" text-anchor="end" font-size="14" font-weight="700" fill="#222">2005</text>
<rect x="100" y="276" width="276" height="70" rx="8" fill="#e8f0fe" stroke="#2e6da4"/><text x="114" y="305" font-size="14" font-weight="700" fill="#1a3a5c">公共工事品質確保法</text><text x="114" y="328" font-size="12" fill="#555">価格以外の要素も評価して選ぶ</text>
<circle cx="78" cy="393" r="6" fill="#b22234"/><text x="62" y="398" text-anchor="end" font-size="14" font-weight="700" fill="#222">2006</text>
<rect x="100" y="358" width="276" height="70" rx="8" fill="#f8d7da" stroke="#b22234"/><text x="114" y="387" font-size="14" font-weight="700" fill="#1a3a5c">官製談合防止法の改正</text><text x="114" y="410" font-size="12" fill="#555">職員の入札妨害を処罰（施行2007）</text>
<rect x="100" y="452" width="14" height="14" fill="#e8f0fe" stroke="#2e6da4"/><text x="120" y="464" font-size="12" fill="#555">方式・評価の法</text><rect x="228" y="452" width="14" height="14" fill="#f8d7da" stroke="#b22234"/><text x="248" y="464" font-size="12" fill="#555">談合の排除の法</text>
<text x="100" y="488" font-size="11" fill="#8a8a8a">年は制定・成立の年（施行年は括弧内）</text></svg>
