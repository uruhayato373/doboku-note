<svg viewBox="0 0 400 500" style="max-width:400px;width:100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="液状化被害の6形態を水平移動・支持力喪失・浮力の3系統に分けた図">
<defs>
