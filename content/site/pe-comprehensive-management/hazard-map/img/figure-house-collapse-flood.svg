<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="堤防決壊の氾濫流が家屋を押し倒す断面と、河岸侵食で家屋の足元の地盤が失われる断面を上下に並べた図">
<defs><style>
text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;font-size:12px;fill:#222;text-anchor:start}
.b{font-size:13px;font-weight:bold}
.s{font-size:11px;fill:#555}
.c{text-anchor:middle}
.e{text-anchor:end}
.w{fill:#e8f0fe}
.g{fill:#d7d7d7}
.h{fill:#fff;stroke:#555;stroke-width:1.5}
.a{fill:none;stroke-width:2}
.d{fill:none;stroke:#555}
</style>
<marker id="m1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4"/></marker>
<marker id="m2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#555"/></marker>
</defs>
<rect x="10" y="12" width="380" height="228" rx="8" fill="#f5f5f5"/>
<text class="b" x="20" y="32">A　氾濫流で押し倒される</text>
<polygon class="w" points="11,135 68,135 100,142 389,142 389,200 11,200"/>
<rect class="g" x="11" y="200" width="378" height="39"/>
<polygon class="g" points="68,200 68,118 84,118 100,200"/>
<polygon fill="none" stroke="#b22234" stroke-dasharray="4 3" points="84,118 124,118 148,200 100,200"/>
<text class="s c" x="116" y="108">堤防決壊</text>
<text class="s c" x="38" y="176">河川</text>
<line class="a" stroke="#2e6da4" x1="130" y1="184" x2="196" y2="184" marker-end="url(#m1)"/>
<text class="c" x="163" y="174">流速 u</text>
<g transform="rotate(10 205 200)"><rect class="h" x="205" y="150" width="60" height="50"/><polygon class="h" points="199,150 235,124 271,150"/></g>
<line x1="330" y1="170" x2="330" y2="143" class="d" stroke-width="1.5" marker-end="url(#m2)"/>
<line x1="330" y1="170" x2="330" y2="199" class="d" stroke-width="1.5" marker-end="url(#m2)"/>
<text class="e" x="323" y="174">水深 h</text>
<text class="c" x="200" y="224">流体力 ∝ 水深 h × 流速 u²</text>
<rect x="10" y="12" width="380" height="228" rx="8" fill="none" stroke="#d7d7d7" stroke-width="1.5"/>
<rect x="10" y="258" width="380" height="230" rx="8" fill="#f5f5f5"/>
<text class="b" x="20" y="278">B　足元の地盤を失って倒れる</text>
<polygon class="g" points="11,440 125,440 150,372 389,372 389,487 11,487"/>
<polygon class="w" points="11,395 139,395 125,440 11,440"/>
<polygon fill="#f8d7da" stroke="#b22234" stroke-dasharray="4 3" points="150,372 275,372 260,440 125,440"/>
<text class="s c" x="203" y="410">侵食で失われる地盤</text>
<text class="s c" x="85" y="428">河川</text>
<line class="d" stroke-width="1" stroke-dasharray="3 3" x1="60" y1="372" x2="150" y2="372"/>
<line x1="60" y1="406" x2="60" y2="373" class="d" stroke-width="1.5" marker-end="url(#m2)"/>
<line x1="60" y1="406" x2="60" y2="439" class="d" stroke-width="1.5" marker-end="url(#m2)"/>
<text class="e" x="53" y="410">河岸高</text>
<line x1="207" y1="394" x2="146" y2="394" class="d" stroke-width="1.5" marker-end="url(#m2)"/>
<line x1="207" y1="394" x2="268" y2="394" class="d" stroke-width="1.5" marker-end="url(#m2)"/>
<text class="c" x="180" y="388">侵食幅</text>
<g transform="rotate(-10 276 372)"><rect class="h" x="216" y="322" width="60" height="50"/><polygon class="h" points="210,322 246,296 282,322"/></g>
<text class="c" x="200" y="468">侵食幅 = 河岸高 × 係数（5〜35）</text>
<rect x="10" y="258" width="380" height="230" rx="8" fill="none" stroke="#d7d7d7" stroke-width="1.5"/>
</svg>
