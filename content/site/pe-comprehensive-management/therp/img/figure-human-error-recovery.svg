<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="操作の失敗確率pと失敗後の回復失敗条件付き確率qから最終失敗pqを求めるツリー" style="max-width:400px;width:100%"><defs><style>text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#222}.h{font-size:17px;font-weight:bold}.t{font-size:14px}.s{font-size:13px;fill:#555}.b{fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5}.g{fill:#d0e8d0;stroke:#3a7d44;stroke-width:1.5}.w{fill:#fff3cd;stroke:#d4a017;stroke-width:1.5}.n{fill:#f5f5f5;stroke:#d7d7d7;stroke-width:1}.a{fill:none;stroke:#2e6da4;stroke-width:2;marker-end:url(#arrow)}.l{fill:none;stroke:#555;stroke-width:1.5}</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4"/></marker></defs><rect x="100" y="20" width="200" height="60" rx="7" class="b"/><text x="200" y="48" class="h" text-anchor="middle">操作を行う</text><path d="M200 80 V112 H100 V149" class="a"/><path d="M200 112 H300 V149" class="a"/><rect x="42" y="117" width="95" height="20" fill="#ffffff"/><text x="90" y="133" class="t" text-anchor="middle">成功 1−p</text><rect x="270" y="117" width="81" height="20" fill="#ffffff"/><text x="310" y="133" class="t" text-anchor="middle">失敗 p</text><rect x="20" y="155" width="160" height="65" rx="7" class="g"/><text x="100" y="183" class="h" text-anchor="middle">操作成功</text><rect x="220" y="155" width="160" height="65" rx="7" class="w"/><text x="300" y="183" class="h" text-anchor="middle">回復を試みる</text><path d="M300 220 V258 H105 V305" class="a"/><path d="M300 258 V305" class="a"/><rect x="42" y="269" width="146" height="20" fill="#ffffff"/><text x="115" y="285" class="t" text-anchor="middle">回復成功 1−q</text><rect x="254" y="269" width="103" height="20" fill="#ffffff"/><text x="305" y="285" class="t" text-anchor="middle">回復失敗 q</text><rect x="20" y="311" width="170" height="74" rx="7" class="g"/><text x="105" y="339" class="h" text-anchor="middle">回復して成功</text><text x="105" y="363" class="t" text-anchor="middle">確率 p(1−q)</text><rect x="210" y="311" width="170" height="74" rx="7" class="w"/><text x="295" y="339" class="h" text-anchor="middle">最終的に失敗</text><text x="295" y="363" class="t" text-anchor="middle">確率 pq</text><text x="200" y="442" class="s" text-anchor="middle">q = P（回復失敗｜最初の操作が失敗）</text><text x="200" y="476" class="s" text-anchor="middle">成功側：1−p + p(1−q) = 1−pq</text></svg>
