<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="公共事業評価の流れ。計画段階評価、新規事業採択時評価、再評価、事後評価の順に、各時点で確かめることを示す。"><defs><style>text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#1a3a5c;text-anchor:middle}</style><marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4"/></marker></defs><!-- brand / warn / positive fills; ink text --><rect x="40" y="20" width="320" height="90" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/><text text-anchor="middle" x="200" y="50" font-size="16" font-weight="bold">計画段階評価</text><text text-anchor="middle" x="200" y="75" font-size="13">複数の案を比べ、絞り込む</text><text text-anchor="middle" x="200" y="96" font-size="12">構想・計画の段階で実施</text><path d="M200 112 V138" stroke="#2e6da4" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="140" width="320" height="90" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/><text text-anchor="middle" x="200" y="170" font-size="16" font-weight="bold">新規事業採択時評価</text><text text-anchor="middle" x="200" y="195" font-size="13">B/C など費用対効果で採択を判断</text><text text-anchor="middle" x="200" y="216" font-size="12">感度分析で結果の幅も示す</text><path d="M200 232 V258" stroke="#2e6da4" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="260" width="320" height="90" rx="8" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/><text text-anchor="middle" x="200" y="290" font-size="16" font-weight="bold">再評価</text><text text-anchor="middle" x="200" y="315" font-size="13">残事業の投資効率性で継続か中止か</text><text text-anchor="middle" x="200" y="336" font-size="12">事業全体の効率性も併せて見る</text><path d="M200 352 V378" stroke="#2e6da4" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="380" width="320" height="90" rx="8" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/><text text-anchor="middle" x="200" y="410" font-size="16" font-weight="bold">事後評価</text><text text-anchor="middle" x="200" y="435" font-size="13">完了後に効果と予測のずれを確認</text><text text-anchor="middle" x="200" y="456" font-size="12">結果を同種事業の見積りへ反映</text></svg>