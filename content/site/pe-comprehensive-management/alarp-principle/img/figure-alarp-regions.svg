<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="ALARPは許容不可能、合理的に実行可能な限り低減する中間、広く受け入れ可能の3領域。低リスクでも安全対策の維持と再評価を続ける。"><defs><style>text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#1a3a5c}</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4"/></marker></defs><!-- brand / positive / warn fills; ink-strong text --><text x="200" y="28" font-size="16" font-weight="bold" text-anchor="middle">リスクの大きさで、必要な対応を判断</text><path d="M34 407 V65" stroke="#2e6da4" stroke-width="2" marker-end="url(#arrow)"/><text x="34" y="51" font-size="14" font-weight="bold" text-anchor="middle">大</text><text x="34" y="431" font-size="14" font-weight="bold" text-anchor="middle">小</text><rect x="60" y="64" width="316" height="103" rx="8" fill="#f8d7da" stroke="#b22234" stroke-width="1.5"/><text x="218" y="93" font-size="18" font-weight="bold" text-anchor="middle">許容不可能な領域</text><text x="218" y="122" font-size="15" font-weight="normal" text-anchor="middle">許容できる水準まで低減</text><text x="218" y="147" font-size="14" font-weight="normal" text-anchor="middle">できなければ活動を停止</text><rect x="60" y="188" width="316" height="103" rx="8" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/><text x="218" y="217" font-size="18" font-weight="bold" text-anchor="middle">ALARP領域</text><text x="218" y="246" font-size="15" font-weight="normal" text-anchor="middle">合理的に実行可能な対策を実施</text><text x="218" y="271" font-size="14" font-weight="normal" text-anchor="middle">低減便益と費用・時間・労力を検討</text><rect x="60" y="312" width="316" height="103" rx="8" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/><text x="218" y="341" font-size="18" font-weight="bold" text-anchor="middle">広く受け入れ可能な領域</text><text x="218" y="370" font-size="15" font-weight="normal" text-anchor="middle">適切な安全対策を維持</text><text x="218" y="395" font-size="14" font-weight="normal" text-anchor="middle">状況の変化を監視・再評価</text><text x="200" y="454" font-size="15" font-weight="normal" text-anchor="middle">ALARP領域で対策を省略できるのは</text><text x="200" y="479" font-size="15" font-weight="bold" text-anchor="middle">負担が低減便益に著しく不均衡なとき</text></svg>
