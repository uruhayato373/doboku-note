<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="身近な主体で対応し、対応できない課題を広域の主体が補う補完性の関係" style="max-width:400px;width:100%"><defs><style>text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#222}.h{font-size:17px;font-weight:bold}.t{font-size:14px}.s{font-size:13px;fill:#555}.b{fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5}.g{fill:#d0e8d0;stroke:#3a7d44;stroke-width:1.5}.w{fill:#fff3cd;stroke:#d4a017;stroke-width:1.5}.n{fill:#f5f5f5;stroke:#d7d7d7;stroke-width:1}.a{fill:none;stroke:#2e6da4;stroke-width:2;marker-end:url(#arrow)}.l{fill:none;stroke:#555;stroke-width:1.5}</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4"/></marker></defs><rect x="40" y="330" width="320" height="82" rx="7" class="g"/><text x="200" y="358" class="h" text-anchor="middle">身近な主体</text><text x="200" y="382" class="t" text-anchor="middle">自ら対応できる課題を担う</text><rect x="65" y="185" width="270" height="82" rx="7" class="b"/><text x="200" y="213" class="h" text-anchor="middle">地域・広域の主体</text><text x="200" y="237" class="t" text-anchor="middle">単独で困難な課題を補う</text><rect x="90" y="40" width="220" height="82" rx="7" class="b"/><text x="200" y="68" class="h" text-anchor="middle">国・国際的な協力</text><text x="200" y="92" class="t" text-anchor="middle">広く及ぶ課題に対応</text><path d="M160 330 V273" class="a"/><path d="M160 185 V128" class="a"/><path d="M240 122 V179" class="a"/><path d="M240 267 V324" class="a"/><text x="80" y="291" class="s" text-anchor="middle">単独では</text><text x="80" y="309" class="s" text-anchor="middle">困難な課題</text><text x="314" y="300" class="s" text-anchor="middle">支援</text><text x="200" y="467" class="s" text-anchor="middle">役割の範囲は、課題の広がりと対応力で考える</text></svg>
