<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="七つの一般原則のうち真実性を到達点とし、他の六つを帳簿の確かさ・利益の計算・読み手の判断の三つの守る対象に分けた分類図" font-family='Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif'>
  <rect width="400" height="500" fill="#ffffff" stroke="#d7d7d7"/>

  <!-- 到達点：真実性 -->
  <rect x="12" y="14" width="376" height="58" rx="6" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
  <text x="24" y="38" font-size="14" font-weight="bold" fill="#1a3a5c">真実性</text>
  <text x="24" y="59" font-size="11" fill="#222">他の六つの原則が目指す到達点</text>

  <!-- 群1：帳簿の確かさ -->
  <rect x="12" y="86" width="376" height="28" rx="4" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="24" y="105" font-size="13" font-weight="bold" fill="#1a3a5c">帳簿の確かさを守る</text>

  <rect x="12" y="118" width="182" height="76" rx="6" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="24" y="142" font-size="13" font-weight="bold" fill="#1a3a5c">正規の簿記</text>
  <text x="24" y="163" font-size="11" fill="#555">すべての取引を</text>
  <text x="24" y="180" font-size="11" fill="#555">正確な帳簿に記録する</text>

  <rect x="206" y="118" width="182" height="76" rx="6" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="218" y="142" font-size="13" font-weight="bold" fill="#1a3a5c">単一性</text>
  <text x="218" y="163" font-size="11" fill="#555">形式は目的別でも</text>
  <text x="218" y="180" font-size="11" fill="#555">元の会計記録は一つ</text>

  <!-- 群2：利益の計算 -->
  <rect x="12" y="208" width="376" height="28" rx="4" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="24" y="227" font-size="13" font-weight="bold" fill="#1a3a5c">利益の計算を歪めない</text>

  <rect x="12" y="240" width="182" height="76" rx="6" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="24" y="264" font-size="13" font-weight="bold" fill="#1a3a5c">資本取引・損益取引区分</text>
  <text x="24" y="285" font-size="11" fill="#555">資本剰余金と利益剰余金</text>
  <text x="24" y="302" font-size="11" fill="#555">を混同しない</text>

  <rect x="206" y="240" width="182" height="76" rx="6" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="218" y="264" font-size="13" font-weight="bold" fill="#1a3a5c">保守主義</text>
  <text x="218" y="285" font-size="11" fill="#555">不利な可能性には備える</text>
  <text x="218" y="302" font-size="11" fill="#555">ただし過度には偏らない</text>

  <!-- 群3：読み手の判断 -->
  <rect x="12" y="330" width="376" height="28" rx="4" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="24" y="349" font-size="13" font-weight="bold" fill="#1a3a5c">読み手の判断を守る</text>

  <rect x="12" y="362" width="182" height="76" rx="6" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="24" y="386" font-size="13" font-weight="bold" fill="#1a3a5c">明瞭性</text>
  <text x="24" y="407" font-size="11" fill="#555">必要な会計事実を明瞭に</text>
  <text x="24" y="424" font-size="11" fill="#555">表示し、注記で補う</text>

  <rect x="206" y="362" width="182" height="76" rx="6" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="218" y="386" font-size="13" font-weight="bold" fill="#1a3a5c">継続性</text>
  <text x="218" y="407" font-size="11" fill="#555">選んだ処理方法を</text>
  <text x="218" y="424" font-size="11" fill="#555">毎期続けて適用する</text>

  <!-- 分類の軸 -->
  <rect x="12" y="454" width="376" height="34" rx="4" fill="#f5f5f5" stroke="#d7d7d7"/>
  <text x="200" y="476" text-anchor="middle" font-size="11" fill="#555">条文の順ではなく、守る対象で六つを束ねた分類</text>
</svg>
