<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="設備停止から作業開始までの通常手順と確認を省略した実際の経過を時間順に比べる図" style="max-width:400px;width:100%"><defs><style>text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#222}.h{font-size:17px;font-weight:bold}.t{font-size:14px}.s{font-size:13px;fill:#555}.b{fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5}.g{fill:#d0e8d0;stroke:#3a7d44;stroke-width:1.5}.w{fill:#fff3cd;stroke:#d4a017;stroke-width:1.5}.n{fill:#f5f5f5;stroke:#d7d7d7;stroke-width:1}.a{fill:none;stroke:#2e6da4;stroke-width:2;marker-end:url(#arrow)}.l{fill:none;stroke:#555;stroke-width:1.5}</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4"/></marker></defs><text x="109" y="35" class="h" text-anchor="middle">通常の手順</text><text x="300" y="35" class="h" text-anchor="middle">実際の経過</text><rect x="20" y="70" width="170" height="70" rx="7" class="b"/><text x="105" y="98" class="h" text-anchor="middle">設備を停止</text><rect x="210" y="70" width="170" height="70" rx="7" class="b"/><text x="295" y="98" class="h" text-anchor="middle">設備を停止</text><path d="M105 140 V180" class="a"/><path d="M295 140 V180" class="a"/><rect x="20" y="186" width="170" height="70" rx="7" class="g"/><text x="105" y="214" class="h" text-anchor="middle">停止を確認</text><rect x="210" y="186" width="170" height="70" rx="7" class="w"/><text x="295" y="214" class="h" text-anchor="middle">確認を省略</text><path d="M105 256 V296" class="a"/><path d="M295 256 V296" class="a"/><rect x="20" y="302" width="170" height="70" rx="7" class="b"/><text x="105" y="330" class="h" text-anchor="middle">作業を開始</text><rect x="210" y="302" width="170" height="70" rx="7" class="b"/><text x="295" y="330" class="h" text-anchor="middle">作業を開始</text><text x="200" y="430" class="h" text-anchor="middle">同じ時点の状態を比べ、逸脱を特定</text><text x="200" y="467" class="s" text-anchor="middle">下向きに時間が進む／説明用の架空例</text></svg>
