<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="一つの事業の目的と制約に対し、経済性・人的資源・情報・安全・社会環境の5管理を照らし、相互の影響とトレードオフを考える学習図。"><defs><style>text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#1a3a5c}</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4"/></marker></defs><!-- brand / positive / warn fills; ink-strong text --><text x="200" y="27" font-size="16" font-weight="bold" text-anchor="middle">同じ事業の判断を、5つの管理から点検</text><rect x="86" y="44" width="294" height="58" rx="8" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/><text x="233" y="70" font-size="18" font-weight="bold" text-anchor="middle">事業の目的・制約・選択肢</text><text x="233" y="92" font-size="14" font-weight="normal" text-anchor="middle">どの案が全体として妥当か</text><path d="M86 74 H38 V397" stroke="#2e6da4" stroke-width="1.5" fill="none"/><path d="M38 137 H82" stroke="#2e6da4" stroke-width="1.5"/><rect x="86" y="112" width="294" height="50" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/><text x="233" y="133" font-size="17" font-weight="bold" text-anchor="middle">経済性管理</text><text x="233" y="153" font-size="14" font-weight="normal" text-anchor="middle">品質・費用・工程</text><path d="M38 202 H82" stroke="#2e6da4" stroke-width="1.5"/><rect x="86" y="177" width="294" height="50" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/><text x="233" y="198" font-size="17" font-weight="bold" text-anchor="middle">人的資源管理</text><text x="233" y="218" font-size="14" font-weight="normal" text-anchor="middle">人員・能力・働き方</text><path d="M38 267 H82" stroke="#2e6da4" stroke-width="1.5"/><rect x="86" y="242" width="294" height="50" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/><text x="233" y="263" font-size="17" font-weight="bold" text-anchor="middle">情報管理</text><text x="233" y="283" font-size="14" font-weight="normal" text-anchor="middle">情報共有・信頼性</text><path d="M38 332 H82" stroke="#2e6da4" stroke-width="1.5"/><rect x="86" y="307" width="294" height="50" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/><text x="233" y="328" font-size="17" font-weight="bold" text-anchor="middle">安全管理</text><text x="233" y="348" font-size="14" font-weight="normal" text-anchor="middle">危険の把握・低減</text><path d="M38 397 H82" stroke="#2e6da4" stroke-width="1.5"/><rect x="86" y="372" width="294" height="50" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/><text x="233" y="393" font-size="17" font-weight="bold" text-anchor="middle">社会環境管理</text><text x="233" y="413" font-size="14" font-weight="normal" text-anchor="middle">環境負荷・周辺への影響</text><text x="200" y="455" font-size="16" font-weight="bold" text-anchor="middle">他の管理への影響・トレードオフを確認</text><text x="200" y="481" font-size="14" font-weight="normal" text-anchor="middle">個別の用語を学ぶ → 同じ事業に戻して考える</text></svg>
