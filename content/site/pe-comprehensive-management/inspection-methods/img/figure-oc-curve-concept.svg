<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="不良率が高いロットほど合格しにくくなる抜取検査のOC曲線の形" style="max-width:400px;width:100%"><defs><style>text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#222}.h{font-size:17px;font-weight:bold}.t{font-size:14px}.s{font-size:13px;fill:#555}.b{fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5}.g{fill:#d0e8d0;stroke:#3a7d44;stroke-width:1.5}.w{fill:#fff3cd;stroke:#d4a017;stroke-width:1.5}.n{fill:#f5f5f5;stroke:#d7d7d7;stroke-width:1}.a{fill:none;stroke:#2e6da4;stroke-width:2;marker-end:url(#arrow)}.l{fill:none;stroke:#555;stroke-width:1.5}</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4"/></marker></defs><text x="200" y="37" class="h" text-anchor="middle">ロットの不良率と合格確率の関係</text><path d="M65 360 L357 360" class="l"/><path d="M65 360 L65 82" class="l"/><text x="36" y="99" class="s" text-anchor="middle">1.0</text><text x="36" y="365" class="s" text-anchor="middle">0</text><text x="215" y="406" class="t" text-anchor="middle">ロットの不良率 →</text><text x="115" y="69" class="t" text-anchor="middle">合格確率</text><path d="M70 92 C120 92 150 115 183 205 S240 341 350 350" fill="none" stroke="#2e6da4" stroke-width="4"/><text x="127" y="168" class="s" text-anchor="middle">低不良率：合格しやすい</text><text x="260" y="305" class="s" text-anchor="middle">高不良率：合格しにくい</text><text x="200" y="467" class="s" text-anchor="middle">試料数・合格判定個数により曲線は変わる</text></svg>
