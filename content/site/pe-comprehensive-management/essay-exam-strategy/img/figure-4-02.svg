<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="前文分析で抽出すべき 4 要素（テーマ・設定条件・要求事項・評価項目）の関係図" font-family='Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif'>

  <!-- Center ellipse -->
  <ellipse cx="200" cy="200" rx="62" ry="44" fill="#1a3a5c"/>
  <text x="200" y="194" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">前文</text>
  <text x="200" y="212" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">の分析</text>

  <!-- Top: テーマ -->
  <rect x="120" y="20" width="160" height="60" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="200" y="46" text-anchor="middle" fill="#1a3a5c" font-size="13" font-weight="bold">テーマ</text>
  <text x="200" y="66" text-anchor="middle" fill="#1a3a5c" font-size="11">論文のキーワード</text>
  <line x1="200" y1="82" x2="200" y2="156" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Bottom: 評価項目 -->
  <rect x="120" y="322" width="160" height="60" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="200" y="348" text-anchor="middle" fill="#1a3a5c" font-size="13" font-weight="bold">評価項目</text>
  <text x="200" y="368" text-anchor="middle" fill="#1a3a5c" font-size="11">採点の基準となる観点</text>
  <line x1="200" y1="244" x2="200" y2="320" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Left: 設定条件 -->
  <rect x="10" y="168" width="140" height="64" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="80" y="194" text-anchor="middle" fill="#1a3a5c" font-size="13" font-weight="bold">設定条件</text>
  <text x="80" y="212" text-anchor="middle" fill="#1a3a5c" font-size="11">解答の前提・制約</text>
  <text x="80" y="226" text-anchor="middle" fill="#1a3a5c" font-size="11">となる事項</text>
  <line x1="152" y1="200" x2="138" y2="200" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Right: 要求事項 -->
  <rect x="250" y="168" width="140" height="64" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="320" y="194" text-anchor="middle" fill="#1a3a5c" font-size="13" font-weight="bold">要求事項</text>
  <text x="320" y="212" text-anchor="middle" fill="#1a3a5c" font-size="11">何を答えれば</text>
  <text x="320" y="226" text-anchor="middle" fill="#1a3a5c" font-size="11">よいか</text>
  <line x1="248" y1="200" x2="262" y2="200" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- 各要素の活用法（凡例） -->
  <rect x="10" y="408" width="380" height="80" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <text x="26" y="428" fill="#1a3a5c" font-size="11" font-weight="bold">前文分析の読み取り順序</text>
  <text x="26" y="447" fill="#555" font-size="11">① テーマ → 論文の中心概念を把握する</text>
  <text x="26" y="463" fill="#555" font-size="11">② 設定条件 → 解答の前提・制約を確認する</text>
  <text x="26" y="479" fill="#555" font-size="11">③ 要求事項 → 何を書くべきかを特定する</text>
</svg>
