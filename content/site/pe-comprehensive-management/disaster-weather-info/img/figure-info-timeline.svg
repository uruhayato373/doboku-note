<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" width="400" height="500" role="img" aria-label="防災気象情報を時間軸で並べた流れ図。5日先までの早期注意情報、明日までの気象解説情報と時系列情報、レベル2〜5の注意報から特別警報、キキクルと気象防災速報の順">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; font-size: 11px; fill: #555; }
      .t { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .l { font-size: 12px; font-weight: bold; fill: #1a3a5c; text-anchor: middle; }
      .ls { text-anchor: middle; }
      .gray { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .blue { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .red { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .ax { stroke: #8a8a8a; stroke-width: 1.5; fill: none; }
      .k { fill: #222; }
    </style>
    <marker id="arr" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#8a8a8a"/>
    </marker>
  </defs>

  <line class="ax" x1="86" y1="20" x2="86" y2="418" marker-end="url(#arr)"/>

  <text class="l" x="47" y="56">5日先まで</text>
  <text class="ls" x="47" y="74">心構え</text>
  <text class="l" x="47" y="158">明日まで</text>
  <text class="ls" x="47" y="176">事前の備え</text>
  <text class="l" x="47" y="260">災害が</text>
  <text class="ls" x="47" y="278">近づくと</text>
  <text class="l" x="47" y="362">直前</text>
  <text class="ls" x="47" y="380">避難の判断</text>

  <rect class="gray" x="100" y="20" width="286" height="84" rx="6"/>
  <text class="t" x="110" y="40">早期注意情報（警報級の可能性）</text>
  <g class="k" font-size="11">
    <text x="110" y="58">5日先までを［高］［中］の2段階で発表</text>
    <text x="110" y="74">毎日5・11・17時（3日先以降は11・17時）</text>
    <text x="110" y="90">大雨・土砂災害・高潮の［高］［中］＝レベル1</text>
  </g>

  <line class="ax" x1="243" y1="104" x2="243" y2="120" marker-end="url(#arr)"/>

  <rect class="blue" x="100" y="122" width="286" height="84" rx="6"/>
  <text class="t" x="110" y="142">気象解説情報と時系列情報</text>
  <g class="k" font-size="11">
    <text x="110" y="160">気象解説情報：全般・地方・府県の3単位で解説</text>
    <text x="110" y="176">時系列情報：05・11・17・23時の4回発表</text>
    <text x="110" y="192">明日までの見通しを3時間ごとなどで示す（新設）</text>
  </g>

  <line class="ax" x1="243" y1="206" x2="243" y2="222" marker-end="url(#arr)"/>

  <rect class="warn" x="100" y="224" width="286" height="84" rx="6"/>
  <text class="t" x="110" y="244">注意報→警報→危険警報→特別警報</text>
  <g class="k" font-size="11">
    <text x="110" y="262">氾濫・大雨・土砂災害・高潮はレベル2〜5</text>
    <text x="110" y="278">暴風・大雪などの警報等はレベルに相当しない</text>
    <text x="110" y="294">対応のトリガーとして使う</text>
  </g>

  <line class="ax" x1="243" y1="308" x2="243" y2="324" marker-end="url(#arr)"/>

  <rect class="red" x="100" y="326" width="286" height="84" rx="6"/>
  <text class="t" x="110" y="346">キキクルと気象防災速報</text>
  <g class="k" font-size="11">
    <text x="110" y="364">キキクル：黄・赤・紫・黒がレベル2〜5の危険度</text>
    <text x="110" y="380">気象防災速報：記録的短時間大雨など、</text>
    <text x="110" y="396">極端な現象を府県単位で速報</text>
  </g>

  <g font-size="11">
    <text x="14" y="442">旧「気象情報」は、令和8年度出水期から</text>
    <text x="14" y="458">気象解説情報と気象防災速報に整理された</text>
    <text x="14" y="482">キキクルの色：黄＝注意、赤＝警戒、</text>
    <text x="14" y="498">紫＝危険、黒＝災害切迫</text>
  </g>
</svg>
