<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500" style="max-width:400px;width:100%" role="img" aria-label="高度プロフェッショナル制度の図解。労働時間・休憩・休日・深夜割増・時間外割増の規定が適用除外される。適用5要件は、対象業務（成果と時間の相関が低い高度専門業務）・年収1075万円以上・本人同意・労使委員会の4/5以上の決議・労働基準監督署への届出。健康確保措置として年104日以上の休日確保と健康管理時間の把握が義務で、選択的措置のいずれか1つと医師の面接指導も求められる。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-sub  { font-size: 11px; fill: #8a8a8a; }
      .t-head { font-size: 16px; font-weight: bold; fill: #1a3a5c; }
      .b-t    { font-size: 12px; font-weight: bold; }
      .chip   { font-size: 11px; fill: #222; }
      .item   { font-size: 11px; fill: #222; }
      .num    { font-size: 11px; font-weight: bold; fill: #ffffff; }
    </style>
  </defs>

  <text class="t-head" x="200" y="38" text-anchor="middle">労働時間規制を「適用除外」する制度</text>

  <!-- Block1 適用除外 -->
  <rect x="10" y="48" width="380" height="104" rx="8" fill="#fff3cd" stroke="#d4a017" stroke-width="1.3"/>
  <text class="b-t" x="24" y="69" text-anchor="start" fill="#d4a017">適用されなくなる規定（労働時間規制から外れる）</text>
  <rect x="24"  y="80" width="86"  height="24" rx="6" fill="#ffffff" stroke="#d4a017" stroke-width="1"/>
  <text class="chip" x="67"  y="96" text-anchor="middle">労働時間</text>
  <rect x="116" y="80" width="64"  height="24" rx="6" fill="#ffffff" stroke="#d4a017" stroke-width="1"/>
  <text class="chip" x="148" y="96" text-anchor="middle">休憩</text>
  <rect x="186" y="80" width="64"  height="24" rx="6" fill="#ffffff" stroke="#d4a017" stroke-width="1"/>
  <text class="chip" x="218" y="96" text-anchor="middle">休日</text>
  <rect x="24"  y="112" width="100" height="24" rx="6" fill="#ffffff" stroke="#d4a017" stroke-width="1"/>
  <text class="chip" x="74"  y="128" text-anchor="middle">深夜割増賃金</text>
  <rect x="130" y="112" width="110" height="24" rx="6" fill="#ffffff" stroke="#d4a017" stroke-width="1"/>
  <text class="chip" x="185" y="128" text-anchor="middle">時間外割増賃金</text>

  <!-- Block2 適用5要件 -->
  <rect x="10" y="160" width="380" height="148" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.3"/>
  <text class="b-t" x="24" y="181" text-anchor="start" fill="#2e6da4">適用の5要件（すべて必要）</text>
  <circle cx="33" cy="201" r="9" fill="#2e6da4"/><text class="num" x="33" y="205" text-anchor="middle">1</text>
  <text class="item" x="50" y="205" text-anchor="start">対象業務（成果と労働時間の相関が低い高度専門）</text>
  <circle cx="33" cy="225" r="9" fill="#2e6da4"/><text class="num" x="33" y="229" text-anchor="middle">2</text>
  <text class="item" x="50" y="229" text-anchor="start">年収 1,075万円以上</text>
  <circle cx="33" cy="249" r="9" fill="#2e6da4"/><text class="num" x="33" y="253" text-anchor="middle">3</text>
  <text class="item" x="50" y="253" text-anchor="start">本人の同意（撤回も可能）</text>
  <circle cx="33" cy="273" r="9" fill="#2e6da4"/><text class="num" x="33" y="277" text-anchor="middle">4</text>
  <text class="item" x="50" y="277" text-anchor="start">労使委員会の 4/5 以上の決議</text>
  <circle cx="33" cy="297" r="9" fill="#2e6da4"/><text class="num" x="33" y="301" text-anchor="middle">5</text>
  <text class="item" x="50" y="301" text-anchor="start">労働基準監督署への届出</text>

  <!-- Block3 健康確保措置 -->
  <rect x="10" y="316" width="380" height="170" rx="8" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.3"/>
  <text class="b-t" x="24" y="337" text-anchor="start" fill="#3a7d44">健康確保措置（適用除外の代わりに義務化）</text>
  <text class="item" x="24" y="361" text-anchor="start">● 年104日以上の休日確保（4週4日以上・義務）</text>
  <text class="item" x="24" y="385" text-anchor="start">● 健康管理時間（在所＋事業場外労働）の把握</text>
  <text class="item" x="24" y="409" text-anchor="start">● 選択的措置をいずれか1つ（インターバル等）</text>
  <text class="item" x="24" y="433" text-anchor="start">● 基準超で医師の面接指導（義務）</text>
  <rect x="24" y="448" width="352" height="28" rx="6" fill="#ffffff" stroke="#3a7d44" stroke-width="1"/>
  <text class="item" x="200" y="466" text-anchor="middle">時間管理を本人に委ねる分、健康確保を法定で担保</text>
</svg>
