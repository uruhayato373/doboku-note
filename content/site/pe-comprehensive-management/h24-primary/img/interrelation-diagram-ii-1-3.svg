  <line x1="240" y1="60" x2="245" y2="128" stroke="#222" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- Top-right -->
  <rect x="355" y="40" width="90" height="40" fill="#e8f0fe" stroke="#2e6da4" rx="4"/>
  <text x="400" y="65" text-anchor="middle">一次要因C</text>
  <line x1="360" y1="68" x2="305" y2="135" stroke="#222" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- Left -->
