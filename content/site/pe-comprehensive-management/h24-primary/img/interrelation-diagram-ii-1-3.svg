  <text x="250" y="172" text-anchor="middle" font-size="10">（テーマ）</text>

  <!-- Surrounding causes -->
  <!-- Top-left -->
  <rect x="50" y="40" width="90" height="40" fill="#e8f0fe" stroke="#2e6da4" rx="4"/>
  <text x="95" y="65" text-anchor="middle">一次要因A</text>
  <line x1="138" y1="68" x2="196" y2="135" stroke="#222" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- Top -->
  <rect x="195" y="20" width="90" height="40" fill="#e8f0fe" stroke="#2e6da4" rx="4"/>
