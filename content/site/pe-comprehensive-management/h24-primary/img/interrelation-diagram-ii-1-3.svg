<svg width="500" height="320" viewBox="0 0 500 320" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="11" style="max-width:500px;width:100%" role="img" aria-label="連関図">
  <defs>
    <marker id="arr3" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#222"/>
