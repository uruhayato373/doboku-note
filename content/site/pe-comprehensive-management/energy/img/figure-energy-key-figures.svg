<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500" style="max-width:400px;width:100%" role="img" aria-label="エネルギー白書・エネルギー基本計画の主要数値。第6次エネルギー基本計画の2030年度電源構成目標は、再生可能エネルギー36〜38%、原子力20〜22%、LNG20%、石炭19%、石油等2%、水素・アンモニア1%で、火力（LNG＋石炭＋石油）の合計は約41%。日本のエネルギー自給率は2020年度で13.3%であり、1960年度の58.1%から大幅に低下した。化石エネルギー依存度は2020年で88.9%と高く、原油の中東依存度は約93%（うちサウジアラビア37%）。電源構成目標の再エネ比率は第5次（2018年）22〜24%、第6次（2021年）36〜38%、第7次（2025年）は2040年度に4割程度と引き上げが続く。">
  <rect width="400" height="500" fill="#ffffff"/>
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-head { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .b-lbl  { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .lg     { font-size: 11px; fill: #222; }
      .note   { font-size: 11px; fill: #555; }
      .big    { font-size: 26px; font-weight: bold; fill: #1a3a5c; }
      .sl     { font-size: 11px; fill: #555; }
      .f-head { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
    </style>
  </defs>

  <text class="t-head" x="200" y="36" text-anchor="middle">再エネ拡大も、自給率は低く化石依存は高い</text>

  <!-- Block A: 2030年度 電源構成 -->
  <rect x="10" y="48" width="380" height="186" rx="8" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.3"/>
  <text class="b-lbl" x="24" y="68" text-anchor="start">2030年度 電源構成目標（第6次エネルギー基本計画）</text>

  <!-- 積み上げバー（再エネ37/原子力21/LNG20/石炭19/石油2/水素1） -->
  <rect x="24" y="78" width="133" height="26" fill="#3a7d44"/>
  <rect x="157" y="78" width="76"  height="26" fill="#2e6da4"/>
  <rect x="233" y="78" width="72"  height="26" fill="#d4a017"/>
  <rect x="305" y="78" width="68"  height="26" fill="#555"/>
  <rect x="373" y="78" width="4"   height="26" fill="#8a8a8a"/>
  <rect x="377" y="78" width="3"   height="26" fill="#b22234"/>

  <!-- 凡例 -->
  <rect x="24"  y="120" width="11" height="11" fill="#3a7d44"/>
  <text class="lg" x="40"  y="130" text-anchor="start">再エネ 36〜38%</text>
  <rect x="210" y="120" width="11" height="11" fill="#2e6da4"/>
  <text class="lg" x="226" y="130" text-anchor="start">原子力 20〜22%</text>
  <rect x="24"  y="142" width="11" height="11" fill="#d4a017"/>
  <text class="lg" x="40"  y="152" text-anchor="start">LNG 20%</text>
  <rect x="210" y="142" width="11" height="11" fill="#555"/>
  <text class="lg" x="226" y="152" text-anchor="start">石炭 19%</text>
  <rect x="24"  y="164" width="11" height="11" fill="#8a8a8a"/>
  <text class="lg" x="40"  y="174" text-anchor="start">石油等 2%</text>
  <rect x="210" y="164" width="11" height="11" fill="#b22234"/>
  <text class="lg" x="226" y="174" text-anchor="start">水素・アンモニア 1%</text>

  <text class="note" x="24" y="202" text-anchor="start">火力（LNG＋石炭＋石油）合計 約41%</text>
  <text class="note" x="24" y="222" text-anchor="start">2050年カーボンニュートラルに向けた野心的目標</text>

  <!-- Block B: 自給率 / Block C: 化石依存度 -->
  <rect x="10"  y="242" width="185" height="106" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.3"/>
  <text class="big" x="102" y="284" text-anchor="middle">13.3%</text>
  <text class="sl"  x="102" y="306" text-anchor="middle">エネルギー自給率（2020年度）</text>
  <text class="sl"  x="102" y="326" text-anchor="middle">1960年度 58.1% から大幅低下</text>

  <rect x="205" y="242" width="185" height="106" rx="8" fill="#fff3cd" stroke="#d4a017" stroke-width="1.3"/>
  <text class="big" x="297" y="284" text-anchor="middle">88.9%</text>
  <text class="sl"  x="297" y="306" text-anchor="middle">化石エネルギー依存度（2020年）</text>
  <text class="sl"  x="297" y="326" text-anchor="middle">中東依存度 約93%（サウジ37%）</text>

  <!-- 計画推移 -->
  <rect x="10" y="356" width="380" height="130" rx="8" fill="#ffffff" stroke="#d7d7d7" stroke-width="1.3"/>
  <text class="f-head" x="24" y="378" text-anchor="start">電源構成目標（再エネ比率）の推移</text>
  <text class="note" x="24" y="402" text-anchor="start">第5次（2018年）… 再エネ 22〜24%</text>
  <text class="note" x="24" y="424" text-anchor="start">第6次（2021年）… 再エネ 36〜38%・原子力 20〜22%（2030年度）</text>
  <text class="note" x="24" y="446" text-anchor="start">第7次（2025年）… 2040年度に再エネ4割程度・原子力2割程度</text>
  <text class="note" x="24" y="470" text-anchor="start">再エネ比率の引き上げが計画ごとに続いている。</text>
</svg>
