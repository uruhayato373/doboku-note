<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500" style="max-width:400px;width:100%" role="img" aria-label="契機となった災害と整備された防災法制の対応表。カスリーン台風と水防法から、御嶽山の噴火と活動火山対策特別措置法の改正まで、年代順に10組を並べた">
<defs><style>
text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif}
.a{font-size:12px;fill:#222}.ab{font-size:12px;font-weight:bold;fill:#1a3a5c}.h{font-size:13px;font-weight:bold;fill:#1a3a5c}.s{font-size:11px;fill:#555}
.ac{font-size:12px;fill:#222;text-anchor:middle}.abc{font-size:12px;font-weight:bold;fill:#1a3a5c;text-anchor:middle}.hc{font-size:13px;font-weight:bold;fill:#1a3a5c;text-anchor:middle}.sc{font-size:11px;fill:#555;text-anchor:middle}.se{font-size:11px;fill:#555;text-anchor:end}
.bb{fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5}.bp{fill:#d0e8d0;stroke:#3a7d44;stroke-width:1.5}.bw{fill:#fff3cd;stroke:#d4a017;stroke-width:1.5}.bd{fill:#f8d7da;stroke:#b22234;stroke-width:1.5}
.bs{fill:#f5f5f5;stroke:#d7d7d7;stroke-width:1.5}.bx{fill:#fff;stroke:#2e6da4;stroke-width:1.5}
</style>
<marker id="ar" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 9,3.5 0,7" fill="#8a8a8a"/></marker></defs>
<text class="s" x="14" y="30">契機の年</text>
<text class="s" x="72" y="30">契機となった災害</text>
<text class="s" x="214" y="30">整備された法</text>
<line x1="14" y1="40" x2="386" y2="40" stroke="#d7d7d7" stroke-width="1"/>
<rect class="bb" x="14" y="54" width="48" height="24" rx="4"/>
<text class="abc" x="38" y="71">1947</text>
<text class="a" x="72" y="71">カスリーン台風</text>
<line x1="188" y1="67" x2="206" y2="67" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/>
<text class="ab" x="214" y="65">水防法</text>
<text class="s" x="214" y="81">1949年制定</text>
<line x1="14" y1="89" x2="386" y2="89" stroke="#d7d7d7" stroke-width="1"/>
<rect class="bb" x="14" y="97" width="48" height="24" rx="4"/>
<text class="abc" x="38" y="114">1953</text>
<text class="a" x="72" y="108">西日本豪雨（6月）</text>
<text class="s" x="72" y="124">台風13号（9月）</text>
<line x1="188" y1="110" x2="206" y2="110" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/>
<text class="ab" x="214" y="108">海岸法</text>
<text class="s" x="214" y="124">1956年制定</text>
<line x1="14" y1="132" x2="386" y2="132" stroke="#d7d7d7" stroke-width="1"/>
<rect class="bb" x="14" y="140" width="48" height="24" rx="4"/>
<text class="abc" x="38" y="157">1957</text>
<text class="a" x="72" y="151">西九州の豪雨</text>
<text class="s" x="72" y="167">地すべり災害</text>
<line x1="188" y1="153" x2="206" y2="153" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/>
<text class="ab" x="214" y="151">地すべり等防止法</text>
<text class="s" x="214" y="167">1958年制定</text>
<line x1="14" y1="175" x2="386" y2="175" stroke="#d7d7d7" stroke-width="1"/>
<rect class="bb" x="14" y="183" width="48" height="24" rx="4"/>
<text class="abc" x="38" y="200">1959</text>
<text class="a" x="72" y="194">伊勢湾台風</text>
<text class="s" x="72" y="210">高潮被害</text>
<line x1="188" y1="196" x2="206" y2="196" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/>
<text class="ab" x="214" y="194">災害対策基本法</text>
<text class="s" x="214" y="210">1961年制定</text>
<line x1="14" y1="218" x2="386" y2="218" stroke="#d7d7d7" stroke-width="1"/>
<rect class="bb" x="14" y="226" width="48" height="24" rx="4"/>
<text class="abc" x="38" y="243">1967</text>
<text class="a" x="72" y="237">西日本豪雨（7月）</text>
<text class="s" x="72" y="253">がけ崩れ災害</text>
<line x1="188" y1="239" x2="206" y2="239" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/>
<text class="ab" x="214" y="237">急傾斜地法</text>
<text class="s" x="214" y="253">1969年制定</text>
<line x1="14" y1="261" x2="386" y2="261" stroke="#d7d7d7" stroke-width="1"/>
<rect class="bb" x="14" y="269" width="48" height="24" rx="4"/>
<text class="abc" x="38" y="286">1972</text>
<text class="a" x="72" y="280">桜島の噴火</text>
<text class="s" x="72" y="296">活動の活発化</text>
<line x1="188" y1="282" x2="206" y2="282" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/>
<text class="ab" x="214" y="280">避難施設整備法</text>
<text class="s" x="214" y="296">1973年制定、1978年に改称</text>
<text class="s" x="214" y="310">→ 活動火山対策特別措置法</text>
<line x1="14" y1="318" x2="386" y2="318" stroke="#d7d7d7" stroke-width="1"/>
<rect class="bb" x="14" y="326" width="48" height="24" rx="4"/>
<text class="abc" x="38" y="343">1976</text>
<text class="a" x="72" y="337">東海地震説</text>
<text class="s" x="72" y="353">学会で発表</text>
<line x1="188" y1="339" x2="206" y2="339" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/>
<text class="ab" x="214" y="337">大規模地震対策特別措置法</text>
<text class="s" x="214" y="353">1978年制定</text>
<line x1="14" y1="361" x2="386" y2="361" stroke="#d7d7d7" stroke-width="1"/>
<rect class="bb" x="14" y="369" width="48" height="24" rx="4"/>
<text class="abc" x="38" y="386">1999</text>
<text class="a" x="72" y="380">広島豪雨災害</text>
<text class="s" x="72" y="396">6月の集中豪雨</text>
<line x1="188" y1="382" x2="206" y2="382" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/>
<text class="ab" x="214" y="380">土砂災害防止法</text>
<text class="s" x="214" y="396">2000年制定</text>
<line x1="14" y1="404" x2="386" y2="404" stroke="#d7d7d7" stroke-width="1"/>
<rect class="bb" x="14" y="412" width="48" height="24" rx="4"/>
<text class="abc" x="38" y="429">2011</text>
<text class="a" x="72" y="423">東日本大震災</text>
<text class="s" x="72" y="439">津波被害</text>
<line x1="188" y1="425" x2="206" y2="425" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/>
<text class="ab" x="214" y="423">津波防災地域づくり法</text>
<text class="s" x="214" y="439">2011年制定</text>
<line x1="14" y1="447" x2="386" y2="447" stroke="#d7d7d7" stroke-width="1"/>
<rect class="bb" x="14" y="455" width="48" height="24" rx="4"/>
<text class="abc" x="38" y="472">2014</text>
<text class="a" x="72" y="466">御嶽山の噴火</text>
<text class="s" x="72" y="482">登山者が被災</text>
<line x1="188" y1="468" x2="206" y2="468" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/>
<text class="ab" x="214" y="466">活動火山対策特別措置法</text>
<text class="s" x="214" y="482">2015年改正で登山者も対象</text>
</svg>
