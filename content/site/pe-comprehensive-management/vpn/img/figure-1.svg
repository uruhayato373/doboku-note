<svg width="400" height="500" viewBox="0 0 400 500"
     xmlns="http://www.w3.org/2000/svg"
     style="max-width:400px;width:100%"
     role="img"
     aria-label="VPN のトンネリングの概念図。拠点 A と拠点 B が、公衆ネットワークであるインターネット上に構築された暗号化トンネルを通じて安全に接続される。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-net   { font-size: 11px; fill: #8a8a8a; }
      .t-tunnel{ font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-end-s { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-end-b { font-size: 11px; fill: #555; }
      .t-cap   { font-size: 11px; fill: #555; }
      .t-sec   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-tag   { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .t-body  { font-size: 11px; fill: #555; }
      .box-net    { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-tunnel { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 2; }
      .box-end    { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-surf   { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-warn   { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
    </style>
    <marker id="vpn-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto">
      <polygon points="0,0 10,4.5 0,9" fill="#2e6da4"/>
    </marker>
  </defs>

  <!-- インターネット（公衆網） -->
  <rect class="box-net" x="72" y="32" width="256" height="170" rx="8"/>
  <text class="t-net" x="200" y="54" text-anchor="middle">インターネット（公衆ネットワーク）</text>
  <text class="t-net" x="200" y="74" text-anchor="middle">本来は盗聴・改ざんの危険がある経路</text>

  <!-- 暗号化トンネル -->
  <rect class="box-tunnel" x="58" y="108" width="284" height="52" rx="26"/>
  <text class="t-tunnel" x="200" y="139" text-anchor="middle">暗号化トンネル（VPN）</text>

  <!-- 拠点A -->
  <rect class="box-end" x="4" y="100" width="76" height="68" rx="7"/>
  <text class="t-end-s" x="42" y="128" text-anchor="middle">拠点 A</text>
  <text class="t-end-b" x="42" y="148" text-anchor="middle">端末・支社</text>

  <!-- 拠点B -->
  <rect class="box-end" x="320" y="100" width="76" height="68" rx="7"/>
  <text class="t-end-s" x="358" y="128" text-anchor="middle">拠点 B</text>
  <text class="t-end-b" x="358" y="148" text-anchor="middle">本社 LAN</text>

  <!-- キャプション -->
  <text class="t-cap" x="200" y="222" text-anchor="middle">トンネル内は暗号化され、第三者は通信内容を読めない</text>

  <!-- 凡例セクション -->
  <line x1="20" y1="244" x2="380" y2="244" stroke="#d7d7d7" stroke-width="1"/>
  <text class="t-sec" x="20" y="266">VPN の主な特性</text>

  <rect class="box-surf" x="16" y="274" width="368" height="40" rx="6"/>
  <text class="t-tag"  x="30" y="290">機密性</text>
  <text class="t-body" x="30" y="307">通信内容を暗号化し、盗聴・傍受から保護する</text>

  <rect class="box-surf" x="16" y="318" width="368" height="40" rx="6"/>
  <text class="t-tag"  x="30" y="334">完全性</text>
  <text class="t-body" x="30" y="351">改ざん検知により、データの完全性を保証する</text>

  <rect class="box-surf" x="16" y="362" width="368" height="40" rx="6"/>
  <text class="t-tag"  x="30" y="378">認証</text>
  <text class="t-body" x="30" y="395">接続先の正当性を検証し、なりすましを防ぐ</text>

  <rect class="box-warn" x="16" y="410" width="368" height="76" rx="6"/>
  <text class="t-tag"  x="30" y="428">ゼロトラスト時代の注意点</text>
  <text class="t-body" x="30" y="448">VPN は境界内を信頼領域とする設計のため、</text>
  <text class="t-body" x="30" y="465">内部不正・端末感染には対応が難しい。</text>
  <text class="t-body" x="30" y="482">ゼロトラストとの組み合わせが近年の標準。</text>
</svg>
