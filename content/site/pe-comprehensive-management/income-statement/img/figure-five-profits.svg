<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="損益計算書の5つの利益を収益と費用の加減で順に求める。各枠の幅は金額を表さない" font-family='Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif'>
  <rect width="400" height="500" fill="#ffffff" stroke="#d7d7d7"/>

  <text x="200" y="26" text-anchor="middle" font-size="11" fill="#555">収益・費用を段階ごとに加減して利益を求める</text>

  <!-- 売上高（出発点） -->
  <rect x="12" y="44" width="190" height="50" fill="#f5f5f5" stroke="#d7d7d7"/>
  <text x="24" y="75" font-size="13" font-weight="bold" fill="#222">売上高</text>

  <!-- 売上総利益 -->
  <rect x="12" y="106" width="190" height="50" fill="#e8f0fe" stroke="#2e6da4"/>
  <text x="24" y="137" font-size="13" font-weight="bold" fill="#1a3a5c">売上総利益（粗利）</text>
  <text x="218" y="137" font-size="11" fill="#222"><tspan fill="#b22234">−</tspan> 売上原価</text>

  <!-- 営業利益 -->
  <rect x="12" y="168" width="190" height="50" fill="#e8f0fe" stroke="#2e6da4"/>
  <text x="24" y="199" font-size="13" font-weight="bold" fill="#1a3a5c">営業利益</text>
  <text x="218" y="199" font-size="11" fill="#222"><tspan fill="#b22234">−</tspan> 販管費</text>

  <!-- 経常利益 -->
  <rect x="12" y="230" width="190" height="50" fill="#e8f0fe" stroke="#2e6da4"/>
  <text x="24" y="261" font-size="13" font-weight="bold" fill="#1a3a5c">経常利益</text>
  <text x="218" y="261" font-size="11" fill="#555">± 営業外損益</text>

  <!-- 税引前当期純利益 -->
  <rect x="12" y="292" width="190" height="50" fill="#e8f0fe" stroke="#2e6da4"/>
  <text x="24" y="323" font-size="12" font-weight="bold" fill="#1a3a5c">税引前当期純利益</text>
  <text x="218" y="323" font-size="11" fill="#555">± 特別損益</text>

  <!-- 当期純利益（最終・緑） -->
  <rect x="12" y="354" width="190" height="50" fill="#d0e8d0" stroke="#3a7d44"/>
  <text x="24" y="385" font-size="13" font-weight="bold" fill="#1a3a5c">当期純利益</text>
  <text x="218" y="385" font-size="11" fill="#222"><tspan fill="#b22234">−</tspan> 法人税等</text>

  <!-- summary -->
  <rect x="12" y="412" width="376" height="74" fill="#f5f5f5" stroke="#d7d7d7" rx="2"/>
  <text x="200" y="436" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">段階ごとに「何の利益か」が変わる</text>
  <text x="200" y="457" text-anchor="middle" font-size="11" fill="#555">営業＝本業の力／経常＝財務含む通常</text>
  <text x="200" y="475" text-anchor="middle" font-size="11" fill="#555">当期純＝株主に残る最終利益</text>
</svg>
