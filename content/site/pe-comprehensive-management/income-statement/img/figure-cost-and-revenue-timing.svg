<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="完成工事原価を材料費・労務費・外注費・経費の4費目で集計することと、同じ3年の工事でも収益の計上時期が一時点か期間にわたるかで変わることを示す" font-family='Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif' font-size="11" fill="#555">
  <rect width="400" height="500" fill="#ffffff" stroke="#d7d7d7"/>
  <text x="200" y="26" text-anchor="middle">原価は費目別に集める</text>
  <g font-size="13" font-weight="bold" fill="#1a3a5c">
    <rect x="12" y="36" width="120" height="34" fill="#e8f0fe" stroke="#2e6da4"/>
    <text x="24" y="58">材料費</text>
    <rect x="12" y="78" width="120" height="34" fill="#e8f0fe" stroke="#2e6da4"/>
    <text x="24" y="100">労務費</text>
    <rect x="12" y="120" width="120" height="34" fill="#e8f0fe" stroke="#2e6da4"/>
    <text x="24" y="142">外注費</text>
    <rect x="12" y="162" width="120" height="34" fill="#e8f0fe" stroke="#2e6da4"/>
    <text x="24" y="184">経費</text>
  </g>
  <g fill="#222">
    <text x="146" y="58">資材・購入した部材</text>
    <text x="146" y="100">作業員の労働への支払い</text>
    <text x="146" y="142">請負業者への代金</text>
    <text x="146" y="184">人件費・機械・動力ほか</text>
  </g>
  <rect x="12" y="204" width="376" height="30" fill="#fff3cd" stroke="#d4a017"/>
  <text x="200" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">合計が完成工事原価（本社の経費は含まない）</text>

  <text x="200" y="262" text-anchor="middle">同じ3年の工事でも、収益の出る時期が変わる</text>
  <g text-anchor="middle">
    <text x="71" y="284">1年目</text>
    <text x="200" y="284">2年目</text>
    <text x="329" y="284">3年目（引渡し）</text>
  </g>
  <text x="12" y="308" font-size="12" font-weight="bold" fill="#222">一時点で認識（引渡しで支配が移る）</text>
  <g text-anchor="middle" fill="#555">
    <rect x="12" y="316" width="118" height="36" fill="#f5f5f5" stroke="#d7d7d7" stroke-dasharray="4 3"/>
    <text x="71" y="339">計上なし</text>
    <rect x="141" y="316" width="118" height="36" fill="#f5f5f5" stroke="#d7d7d7" stroke-dasharray="4 3"/>
    <text x="200" y="339">計上なし</text>
    <rect x="270" y="316" width="118" height="36" fill="#e8f0fe" stroke="#2e6da4"/>
    <text x="329" y="339" font-size="13" font-weight="bold" fill="#1a3a5c">全額を計上</text>
  </g>
  <text x="12" y="374" font-size="12" font-weight="bold" fill="#222">期間にわたり認識（進捗度で按分）</text>
  <g text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3a5c">
    <rect x="12" y="382" width="118" height="36" fill="#d0e8d0" stroke="#3a7d44"/>
    <text x="71" y="405">進捗分</text>
    <rect x="141" y="382" width="118" height="36" fill="#d0e8d0" stroke="#3a7d44"/>
    <text x="200" y="405">進捗分</text>
    <rect x="270" y="382" width="118" height="36" fill="#d0e8d0" stroke="#3a7d44"/>
    <text x="329" y="405">残りの進捗分</text>
  </g>
  <rect x="12" y="434" width="376" height="54" fill="#f5f5f5" stroke="#d7d7d7" rx="2"/>
  <text x="200" y="456" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">進捗度＝発生原価 ÷ 見積総原価</text>
  <text x="200" y="476" text-anchor="middle">原価の集計と見積が、期間ごとの利益を左右する</text>
</svg>
