<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="損益分岐点図：縦軸に売上高・費用、横軸に売上高をとり、固定費と変動費の合計線と売上高線の交点で利益ゼロとなる位置を示す" font-family='Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif'>
  <rect width="400" height="260" fill="#ffffff" stroke="#d7d7d7"/>
  <text x="190" y="20" text-anchor="middle" font-size="13" font-weight="bold">損益分岐点図</text>
  <!-- Axes -->
  <line x1="50" y1="220" x2="350" y2="220" stroke="#222" stroke-width="1.5"/>
  <line x1="50" y1="20" x2="50" y2="225" stroke="#222" stroke-width="1.5"/>
  <text x="375" y="224" text-anchor="end" font-size="11">売上高</text>
  <text x="10" y="130" font-size="11" transform="rotate(-90,20,130)">金額</text>
  <!-- Fixed cost line -->
  <line x1="50" y1="160" x2="340" y2="160" stroke="#d4a017" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="343" y="158" font-size="10" fill="#d4a017">固定費</text>
  <!-- Total cost line -->
  <line x1="50" y1="160" x2="340" y2="80" stroke="#2e6da4" stroke-width="2"/>
  <text x="300" y="72" font-size="10" fill="#2e6da4">総費用</text>
  <!-- Revenue line -->
  <line x1="50" y1="220" x2="340" y2="60" stroke="#3a7d44" stroke-width="2"/>
  <text x="300" y="52" font-size="10" fill="#3a7d44">売上高</text>
  <!-- Breakeven point -->
  <circle cx="175" cy="138" r="5" fill="#b22234"/>
  <text x="178" y="128" font-size="11" fill="#b22234">損益分岐点</text>
  <!-- Vertical dashed at BEP -->
  <line x1="175" y1="138" x2="175" y2="220" stroke="#b22234" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="165" y="235" font-size="10" fill="#b22234">BEP</text>
  <!-- Labels for profit/loss areas -->
  <text x="230" y="180" font-size="10" fill="#3a7d44">利益</text>
  <text x="90" y="190" font-size="10" fill="#b22234">損失</text>

  <!-- 追加：損益分岐点の計算式 -->
  <rect x="10" y="272" width="360" height="60" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5" rx="6"/>
  <text x="190" y="292" text-anchor="middle" font-size="12" fill="#1a3a5c" font-weight="bold">損益分岐点の計算</text>
  <text x="190" y="310" text-anchor="middle" font-size="12" fill="#222">BEP = 固定費 ÷（1 − 変動費率）</text>
  <text x="190" y="326" text-anchor="middle" font-size="11" fill="#555">変動費率 = 変動費 ÷ 売上高</text>

  <rect x="10" y="344" width="172" height="54" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5" rx="6"/>
  <text x="96" y="362" text-anchor="middle" font-size="11" fill="#1a3a5c" font-weight="bold">安全余裕率</text>
  <text x="96" y="378" text-anchor="middle" font-size="11" fill="#222">（売上−BEP）÷ 売上</text>
  <text x="96" y="393" text-anchor="middle" font-size="11" fill="#555">高いほど経営安定</text>

  <rect x="196" y="344" width="172" height="54" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5" rx="6"/>
  <text x="282" y="362" text-anchor="middle" font-size="11" fill="#1a3a5c" font-weight="bold">経営改善策</text>
  <text x="282" y="378" text-anchor="middle" font-size="11" fill="#222">固定費削減・変動費率低下</text>
  <text x="282" y="393" text-anchor="middle" font-size="11" fill="#555">または売上高の増大</text>

  <!-- 総管理との関連 -->
  <rect x="10" y="410" width="360" height="40" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5" rx="6"/>
  <text x="190" y="428" text-anchor="middle" font-size="11" fill="#1a3a5c" font-weight="bold">経済性管理の重要指標</text>
  <text x="190" y="444" text-anchor="middle" font-size="11" fill="#555">損益分岐点分析はコスト構造把握の基本手法</text>

  <text x="190" y="468" text-anchor="middle" font-size="11" fill="#222">CVP 分析（コスト・売上・利益）の出発点</text>
  <text x="190" y="484" text-anchor="middle" font-size="11" fill="#3a7d44" font-weight="bold">総監：経済性管理と人的資源管理のトレードオフに活用</text>
</svg>
