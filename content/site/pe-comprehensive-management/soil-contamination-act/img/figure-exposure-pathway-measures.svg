<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="土壌汚染の2つの摂取経路と措置の対応。地下水等の摂取には封じ込めと水質測定、直接摂取には盛土等、どちらにも汚染を除く措置があり、搬出時は届出と管理票が要る">
<defs><marker id="a" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#555"/></marker></defs>
<g font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="12" fill="#222" text-anchor="middle">
<g stroke-width="1.5">
<rect x="20" y="16" width="360" height="58" rx="8" fill="#f5f5f5" stroke="#d7d7d7"/>
<rect x="20" y="104" width="170" height="76" rx="8" fill="#e8f0fe" stroke="#2e6da4"/>
<rect x="210" y="104" width="170" height="76" rx="8" fill="#fff3cd" stroke="#d4a017"/>
<rect x="20" y="212" width="170" height="104" rx="8" fill="#d0e8d0" stroke="#3a7d44"/>
<rect x="210" y="212" width="170" height="104" rx="8" fill="#d0e8d0" stroke="#3a7d44"/>
<rect x="20" y="364" width="360" height="72" rx="8" fill="#f8d7da" stroke="#b22234"/>
<rect x="20" y="448" width="360" height="40" rx="8" fill="#f5f5f5" stroke="#d7d7d7"/>
</g>
<g stroke="#555" stroke-width="1.5" marker-end="url(#a)">
<line x1="105" y1="74" x2="105" y2="100"/>
<line x1="295" y1="74" x2="295" y2="100"/>
<line x1="105" y1="180" x2="105" y2="208"/>
<line x1="295" y1="180" x2="295" y2="208"/>
</g>
<g font-weight="bold" font-size="14">
<text x="200" y="42">基準を超える汚染土壌</text>
<text x="105" y="130">地下水等の摂取</text>
<text x="295" y="130">直接摂取</text>
<text x="105" y="240">封じ込め</text>
<text x="295" y="240">盛土</text>
<text x="200" y="392">汚染そのものを除く</text>
</g>
<text x="200" y="62" font-size="11" fill="#555">特定有害物質の種類で、開く経路が変わる</text>
<g fill="#1a3a5c">
<text x="105" y="152">溶出量基準を超過</text>
<text x="105" y="168">周辺で地下水を飲用</text>
<text x="295" y="152">含有量基準を超過</text>
<text x="295" y="168">人が立ち入る土地</text>
<text x="105" y="262">原位置・遮水工・遮断工</text>
<text x="105" y="282">地下水の水質測定</text>
<text x="105" y="302" font-size="11">経路を断つ措置</text>
<text x="295" y="262">舗装・土壌入換えも</text>
<text x="295" y="282">同じ考え方</text>
<text x="295" y="302" font-size="11">経路を断つ措置</text>
<text x="200" y="414">掘削除去・原位置浄化</text>
<text x="200" y="430" font-size="11">どちらの経路にも効く。指示措置は限定的</text>
<text x="200" y="473">搬出は14日前の届出・管理票・処理業者へ</text>
</g>
<text x="200" y="348" font-size="11" fill="#555">断つ措置は汚染が残る → 形質変更時要届出区域</text>
</g>
</svg>
