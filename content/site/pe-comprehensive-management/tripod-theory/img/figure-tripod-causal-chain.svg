<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="組織の潜在的問題が局所的な条件と不安全行動を通じて事故へつながる関係" style="max-width:400px;width:100%"><defs><style>text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#222}.h{font-size:17px;font-weight:bold}.t{font-size:14px}.s{font-size:13px;fill:#555}.b{fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5}.g{fill:#d0e8d0;stroke:#3a7d44;stroke-width:1.5}.w{fill:#fff3cd;stroke:#d4a017;stroke-width:1.5}.n{fill:#f5f5f5;stroke:#d7d7d7;stroke-width:1}.a{fill:none;stroke:#2e6da4;stroke-width:2;marker-end:url(#arrow)}.l{fill:none;stroke:#555;stroke-width:1.5}</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4"/></marker></defs><rect x="35" y="25" width="330" height="76" rx="7" class="b"/><text x="200" y="53" class="h" text-anchor="middle">組織に潜む問題</text><text x="200" y="77" class="t" text-anchor="middle">資源・手順・管理の不足</text><path d="M200 101 V125" class="a"/><rect x="35" y="131" width="330" height="76" rx="7" class="b"/><text x="200" y="159" class="h" text-anchor="middle">作業場所の条件</text><text x="200" y="183" class="t" text-anchor="middle">無理な時間配分・情報不足</text><path d="M200 207 V231" class="a"/><rect x="35" y="237" width="330" height="76" rx="7" class="w"/><text x="200" y="265" class="h" text-anchor="middle">不安全な行動・防護の失敗</text><text x="200" y="289" class="t" text-anchor="middle">誤判断や確認漏れが生じる</text><path d="M200 313 V337" class="a"/><rect x="35" y="343" width="330" height="76" rx="7" class="g"/><text x="200" y="371" class="h" text-anchor="middle">事故・損失</text><text x="200" y="395" class="t" text-anchor="middle">上流の条件まで対策を戻す</text></svg>
