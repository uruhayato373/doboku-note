<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="KGIから成功要因を特定し、進捗を測るKPIを選ぶ関係" style="max-width:400px;width:100%"><defs><style>text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#222}.h{font-size:17px;font-weight:bold}.t{font-size:14px}.s{font-size:13px;fill:#555}.b{fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5}.g{fill:#d0e8d0;stroke:#3a7d44;stroke-width:1.5}.w{fill:#fff3cd;stroke:#d4a017;stroke-width:1.5}.n{fill:#f5f5f5;stroke:#d7d7d7;stroke-width:1}.a{fill:none;stroke:#2e6da4;stroke-width:2;marker-end:url(#arrow)}.l{fill:none;stroke:#555;stroke-width:1.5}</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4"/></marker></defs><rect x="35" y="25" width="330" height="76" rx="7" class="b"/><text x="200" y="53" class="h" text-anchor="middle">KGI：成果を測る指標</text><text x="200" y="77" class="t" text-anchor="middle">例：事故発生件数</text><path d="M200 101 V125" class="a"/><rect x="35" y="131" width="330" height="76" rx="7" class="b"/><text x="200" y="159" class="h" text-anchor="middle">KSF：成果を生む条件</text><text x="200" y="183" class="t" text-anchor="middle">例：危険箇所を確実に改善</text><path d="M200 207 V231" class="a"/><rect x="35" y="237" width="330" height="76" rx="7" class="w"/><text x="200" y="265" class="h" text-anchor="middle">KPI：途中で確かめる数値</text><text x="200" y="289" class="t" text-anchor="middle">例：対策の完了率</text><path d="M200 313 V337" class="a"/><rect x="35" y="343" width="330" height="76" rx="7" class="g"/><text x="200" y="371" class="h" text-anchor="middle">実績を見て仮説を検証</text><text x="200" y="395" class="t" text-anchor="middle">指標の増加だけで成功としない</text></svg>
