<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500" style="max-width:400px;width:100%" role="img" aria-label="裁量労働制の図解。実際の労働時間でなく労使協定や労使委員会の決議で定めた時間を働いたとみなす「みなし労働時間制」。専門業務型は労基法第38条の3・法定20業務（研究・SE・士業等）が対象で労使協定＋届出。企画業務型は第38条の4・企画立案調査分析業務が対象で労使委員会の4/5以上の決議＋届出。いずれも本人同意が必要。深夜・休日労働はみなしの対象外で実労働時間に基づく割増賃金が必要。2024年改正で専門業務型も本人同意・撤回手続が義務化。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-sub  { font-size: 11px; fill: #8a8a8a; }
      .t-head { font-size: 16px; font-weight: bold; fill: #1a3a5c; }
      .c-t    { font-size: 12px; font-weight: bold; fill: #2e6da4; }
      .c-d    { font-size: 11px; fill: #555; }
      .th     { font-size: 12px; font-weight: bold; }
      .lbl    { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .cell   { font-size: 11px; fill: #222; }
      .f-head { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .f-foot { font-size: 11px; fill: #555; }
    </style>
  </defs>

  <text class="t-head" x="200" y="38" text-anchor="middle">実時間でなく「みなし時間」で算定</text>

  <!-- みなし概念ボックス -->
  <rect x="10" y="50" width="380" height="56" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.3"/>
  <text class="c-t" x="200" y="72" text-anchor="middle">みなし労働時間制</text>
  <text class="c-d" x="200" y="92" text-anchor="middle">協定・決議で定めた時間を働いたとみなす（実時間で数えない）</text>

  <!-- ヘッダー行 -->
  <rect x="10"  y="116" width="70"  height="28" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <text class="th" x="45"  y="134" text-anchor="middle" fill="#1a3a5c">項目</text>
  <rect x="80"  y="116" width="155" height="28" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.3"/>
  <text class="th" x="157" y="134" text-anchor="middle" fill="#2e6da4">専門業務型</text>
  <rect x="235" y="116" width="155" height="28" fill="#fff3cd" stroke="#d4a017" stroke-width="1.3"/>
  <text class="th" x="312" y="134" text-anchor="middle" fill="#d4a017">企画業務型</text>

  <!-- 根拠 -->
  <rect x="10"  y="144" width="70"  height="44" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <text class="lbl" x="45" y="170" text-anchor="middle">根拠</text>
  <rect x="80"  y="144" width="155" height="44" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text class="cell" x="157" y="170" text-anchor="middle">労基法 第38条の3</text>
  <rect x="235" y="144" width="155" height="44" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text class="cell" x="312" y="170" text-anchor="middle">労基法 第38条の4</text>

  <!-- 対象業務 -->
  <rect x="10"  y="188" width="70"  height="58" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <text class="lbl" x="45" y="220" text-anchor="middle">対象業務</text>
  <rect x="80"  y="188" width="155" height="58" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text class="cell" x="157" y="212" text-anchor="middle">法定20業務</text>
  <text class="cell" x="157" y="229" text-anchor="middle">研究・SE・士業 等</text>
  <rect x="235" y="188" width="155" height="58" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text class="cell" x="312" y="212" text-anchor="middle">企画・立案・</text>
  <text class="cell" x="312" y="229" text-anchor="middle">調査・分析業務</text>

  <!-- 導入手続 -->
  <rect x="10"  y="246" width="70"  height="58" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <text class="lbl" x="45" y="278" text-anchor="middle">導入手続</text>
  <rect x="80"  y="246" width="155" height="58" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text class="cell" x="157" y="270" text-anchor="middle">労使協定</text>
  <text class="cell" x="157" y="287" text-anchor="middle">＋ 届出</text>
  <rect x="235" y="246" width="155" height="58" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text class="cell" x="312" y="270" text-anchor="middle">労使委員会</text>
  <text class="cell" x="312" y="287" text-anchor="middle">4/5決議 ＋ 届出</text>

  <!-- 本人同意 -->
  <rect x="10"  y="304" width="70"  height="40" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <text class="lbl" x="45" y="328" text-anchor="middle">本人同意</text>
  <rect x="80"  y="304" width="155" height="40" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text class="cell" x="157" y="328" text-anchor="middle">必要</text>
  <rect x="235" y="304" width="155" height="40" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text class="cell" x="312" y="328" text-anchor="middle">必要</text>

  <!-- フッタ -->
  <rect x="10" y="354" width="380" height="132" rx="8" fill="#ffffff" stroke="#d7d7d7" stroke-width="1.3"/>
  <text class="f-head" x="26" y="376" text-anchor="start">運用上の注意</text>
  <text class="f-foot" x="26" y="398" text-anchor="start">深夜・休日労働はみなしの対象外＝実時間で割増が必要</text>
  <text class="f-foot" x="26" y="420" text-anchor="start">みなし時間が実態とかけ離れると違法となりうる</text>
  <text class="f-foot" x="26" y="442" text-anchor="start">対象外の業務に適用すると制度自体が無効</text>
  <text class="f-foot" x="26" y="464" text-anchor="start">2024年改正：専門型も本人同意・撤回手続が義務化</text>
</svg>
