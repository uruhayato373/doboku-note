<svg width="400" height="500" viewBox="0 0 400 500"
     xmlns="http://www.w3.org/2000/svg"
     style="max-width:400px;width:100%"
     role="img"
     aria-label="ブロックチェーンの連結構造。各ブロックは前ブロックのハッシュ値・取引データ・ナンスを持ち、前ブロックのハッシュ値で時系列に連結される。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-head  { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-sub   { font-size: 11px; fill: #1a3a5c; }
      .t-subg  { font-size: 11px; fill: #555; }
      .t-link  { font-size: 11px; fill: #8a8a8a; }
      .t-note  { font-size: 11px; fill: #222; }
      .box-block { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-hash  { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-surf  { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-info  { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1; }
    </style>
    <marker id="bc-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto">
      <polygon points="0,0 10,4.5 0,9" fill="#2e6da4"/>
    </marker>
  </defs>

  <!-- ブロック1 -->
  <rect class="box-block" x="56" y="14" width="288" height="104" rx="8"/>
  <text class="t-head" x="70" y="32">ブロック 1</text>
  <rect class="box-hash" x="70" y="40" width="260" height="22" rx="4"/>
  <text class="t-sub" x="200" y="55" text-anchor="middle">前ブロックのハッシュ値</text>
  <rect class="box-surf" x="70" y="64" width="260" height="22" rx="4"/>
  <text class="t-subg" x="200" y="79" text-anchor="middle">取引データ（トランザクション）</text>
  <rect class="box-surf" x="70" y="88" width="260" height="22" rx="4"/>
  <text class="t-subg" x="200" y="103" text-anchor="middle">ナンス（採掘で調整する値）</text>

  <line x1="200" y1="118" x2="200" y2="146" stroke="#2e6da4" stroke-width="2" marker-end="url(#bc-arrow)"/>
  <text class="t-link" x="215" y="136">ハッシュ値で連結</text>

  <!-- ブロック2 -->
  <rect class="box-block" x="56" y="148" width="288" height="104" rx="8"/>
  <text class="t-head" x="70" y="166">ブロック 2</text>
  <rect class="box-hash" x="70" y="174" width="260" height="22" rx="4"/>
  <text class="t-sub" x="200" y="189" text-anchor="middle">前ブロックのハッシュ値</text>
  <rect class="box-surf" x="70" y="198" width="260" height="22" rx="4"/>
  <text class="t-subg" x="200" y="213" text-anchor="middle">取引データ（トランザクション）</text>
  <rect class="box-surf" x="70" y="222" width="260" height="22" rx="4"/>
  <text class="t-subg" x="200" y="237" text-anchor="middle">ナンス（採掘で調整する値）</text>

  <line x1="200" y1="252" x2="200" y2="280" stroke="#2e6da4" stroke-width="2" marker-end="url(#bc-arrow)"/>
  <text class="t-link" x="215" y="270">ハッシュ値で連結</text>

  <!-- ブロック3 -->
  <rect class="box-block" x="56" y="282" width="288" height="104" rx="8"/>
  <text class="t-head" x="70" y="300">ブロック 3</text>
  <rect class="box-hash" x="70" y="308" width="260" height="22" rx="4"/>
  <text class="t-sub" x="200" y="323" text-anchor="middle">前ブロックのハッシュ値</text>
  <rect class="box-surf" x="70" y="332" width="260" height="22" rx="4"/>
  <text class="t-subg" x="200" y="347" text-anchor="middle">取引データ（トランザクション）</text>
  <rect class="box-surf" x="70" y="356" width="260" height="22" rx="4"/>
  <text class="t-subg" x="200" y="371" text-anchor="middle">ナンス（採掘で調整する値）</text>

  <!-- 凡例・改ざん耐性の説明 -->
  <rect x="15" y="400" width="370" height="86" rx="6" class="box-info"/>
  <text x="200" y="420" font-size="12" fill="#1a3a5c" text-anchor="middle" font-weight="bold">改ざん耐性のしくみ</text>
  <line x1="15" y1="427" x2="385" y2="427" stroke="#d7d7d7" stroke-width="1"/>
  <text x="25" y="445" class="t-note">1ブロックを改ざん → そのハッシュ値が変わる</text>
  <text x="25" y="463" class="t-note">→ 後続ブロックの「前ブロックのハッシュ値」と不一致</text>
  <text x="25" y="481" class="t-note">→ 全ブロックの再計算が必要 ＝ 事実上不可能</text>
</svg>
