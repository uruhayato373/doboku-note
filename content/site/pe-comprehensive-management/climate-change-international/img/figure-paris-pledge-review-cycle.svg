<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="パリ協定の循環。気温目標を置き、各国がNDCを出して実施し、報告と点検を経て5年ごとの棚卸しで次のNDCへ戻る" style="max-width:400px;width:100%"><defs><style>text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#222}.h{font-size:16px;font-weight:bold}.s{font-size:13px;fill:#555}.b{fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5}.g{fill:#d0e8d0;stroke:#3a7d44;stroke-width:1.5}.w{fill:#fff3cd;stroke:#d4a017;stroke-width:1.5}.n{fill:#f5f5f5;stroke:#d7d7d7;stroke-width:1.5}.a{fill:none;stroke:#2e6da4;stroke-width:2;marker-end:url(#arrow)}.r{fill:none;stroke:#3a7d44;stroke-width:2;marker-end:url(#arrowg)}</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4"/></marker><marker id="arrowg" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#3a7d44"/></marker></defs><rect x="24" y="16" width="312" height="72" rx="8" class="b"/><text x="180" y="47" class="h" text-anchor="middle">ゴール：2℃を十分下回る・1.5℃努力</text><text x="180" y="71" class="s" text-anchor="middle">第2条・産業革命前からの気温上昇を抑える</text><path d="M180 88 V112" class="a"/><rect x="24" y="114" width="312" height="72" rx="8" class="w"/><text x="180" y="137" class="h" text-anchor="middle">各国がNDCを提出・更新</text><text x="180" y="158" class="s" text-anchor="middle">第4条1項・今世紀後半に排出と吸収を均衡</text><text x="180" y="176" class="s" text-anchor="middle">NDCは5年ごと・前回より前進</text><path d="M180 186 V210" class="a"/><rect x="24" y="212" width="312" height="72" rx="8" class="n"/><text x="180" y="243" class="h" text-anchor="middle">手段を使って実施</text><text x="180" y="267" class="s" text-anchor="middle">第6・7・9条・協力、適応、資金</text><path d="M180 284 V308" class="a"/><rect x="24" y="310" width="312" height="72" rx="8" class="b"/><text x="180" y="341" class="h" text-anchor="middle">共通様式で報告、専門家が点検</text><text x="180" y="365" class="s" text-anchor="middle">第13条・報告書は2年ごと</text><path d="M180 382 V406" class="a"/><rect x="24" y="408" width="312" height="72" rx="8" class="g"/><text x="180" y="439" class="h" text-anchor="middle">世界全体を5年ごとに棚卸し</text><text x="180" y="463" class="s" text-anchor="middle">第14条・結果を次のNDCの材料に</text><path d="M336 444 H360 V150 H340" class="r"/></svg>
