<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="IPCCが科学的知見を評価し、UNFCCCのCOPで各国が交渉し、国内で対策を実施する役割分担" style="max-width:400px;width:100%"><defs><style>text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#222}.h{font-size:17px;font-weight:bold}.t{font-size:14px}.s{font-size:13px;fill:#555}.b{fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5}.g{fill:#d0e8d0;stroke:#3a7d44;stroke-width:1.5}.w{fill:#fff3cd;stroke:#d4a017;stroke-width:1.5}.n{fill:#f5f5f5;stroke:#d7d7d7;stroke-width:1}.a{fill:none;stroke:#2e6da4;stroke-width:2;marker-end:url(#arrow)}.l{fill:none;stroke:#555;stroke-width:1.5}</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4"/></marker></defs><rect x="35" y="25" width="330" height="76" rx="7" class="b"/><text x="200" y="53" class="h" text-anchor="middle">IPCC：科学的知見を評価</text><text x="200" y="77" class="t" text-anchor="middle">既存研究を評価報告書へ集約</text><path d="M200 101 V125" class="a"/><rect x="35" y="131" width="330" height="76" rx="7" class="b"/><text x="200" y="159" class="h" text-anchor="middle">UNFCCC・COP：各国が交渉</text><text x="200" y="183" class="t" text-anchor="middle">科学的知見を政策判断の材料に</text><path d="M200 207 V231" class="a"/><rect x="35" y="237" width="330" height="76" rx="7" class="w"/><text x="200" y="265" class="h" text-anchor="middle">各国：目標と政策を具体化</text><text x="200" y="289" class="t" text-anchor="middle">国内の制度・投資・実施へ</text><path d="M200 313 V337" class="a"/><rect x="35" y="343" width="330" height="76" rx="7" class="g"/><text x="200" y="371" class="h" text-anchor="middle">観測・報告・検証を続ける</text><text x="200" y="395" class="t" text-anchor="middle">実績と新たな知見を次の判断へ</text></svg>
