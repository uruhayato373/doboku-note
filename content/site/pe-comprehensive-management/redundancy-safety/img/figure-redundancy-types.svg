<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" style="max-width:400px;width:100%" role="img" aria-label="冗長化の 3 種類：待機冗長は主系故障時に予備が切替、並列冗長は常時並列稼働で一方の故障でも機能維持、多数決冗長は複数出力を多数決で判定する">

  <text x="20" y="38" font-size="12" fill="#222" font-family="sans-serif" font-weight="bold">1. 待機冗長</text>
  <text x="120" y="38" font-size="11" fill="#555" font-family="sans-serif">UPS 等</text>

  <g>
    <rect x="40" y="48" width="60" height="36" fill="#e8f0fe" stroke="#2e6da4" stroke-width="2" rx="3"/>
    <text x="70" y="71" text-anchor="middle" font-size="11" fill="#1a3a5c" font-family="sans-serif">主系</text>
  </g>
  <g>
    <rect x="120" y="48" width="60" height="36" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="4,3" rx="3"/>
    <text x="150" y="71" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">予備</text>
  </g>
  <line x1="180" y1="66" x2="220" y2="66" stroke="#222" stroke-width="1.5"/>
  <polygon points="220,66 214,62 214,70" fill="#222"/>
  <text x="270" y="71" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">出力</text>
  <text x="40" y="100" font-size="11" fill="#3a7d44" font-family="sans-serif">主系故障時に予備が起動</text>

  <line x1="20" y1="116" x2="380" y2="116" stroke="#d7d7d7" stroke-width="1"/>

  <text x="20" y="136" font-size="12" fill="#222" font-family="sans-serif" font-weight="bold">2. 並列冗長</text>
  <text x="120" y="136" font-size="11" fill="#555" font-family="sans-serif">二重化センサー等</text>

  <g>
    <rect x="40" y="146" width="60" height="32" fill="#e8f0fe" stroke="#2e6da4" stroke-width="2" rx="3"/>
    <text x="70" y="167" text-anchor="middle" font-size="11" fill="#1a3a5c" font-family="sans-serif">系 A</text>
  </g>
  <g>
    <rect x="40" y="186" width="60" height="32" fill="#e8f0fe" stroke="#2e6da4" stroke-width="2" rx="3"/>
    <text x="70" y="207" text-anchor="middle" font-size="11" fill="#1a3a5c" font-family="sans-serif">系 B</text>
  </g>
  <line x1="100" y1="162" x2="180" y2="181" stroke="#222" stroke-width="1.5"/>
  <line x1="100" y1="202" x2="180" y2="183" stroke="#222" stroke-width="1.5"/>
  <polygon points="180,182 174,178 174,186" fill="#222"/>
  <text x="220" y="186" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">合成出力</text>
  <text x="40" y="234" font-size="11" fill="#3a7d44" font-family="sans-serif">常時並列稼働で一方故障でも機能維持</text>

  <line x1="20" y1="248" x2="380" y2="248" stroke="#d7d7d7" stroke-width="1"/>

  <text x="20" y="268" font-size="12" fill="#222" font-family="sans-serif" font-weight="bold">3. 多数決冗長</text>
  <text x="120" y="268" font-size="11" fill="#555" font-family="sans-serif">航空機 3 重化等</text>

  <g>
    <rect x="40" y="278" width="50" height="22" fill="#e8f0fe" stroke="#2e6da4" stroke-width="2" rx="3"/>
    <text x="65" y="293" text-anchor="middle" font-size="11" fill="#1a3a5c" font-family="sans-serif">系 1</text>
  </g>
  <g>
    <rect x="40" y="306" width="50" height="22" fill="#e8f0fe" stroke="#2e6da4" stroke-width="2" rx="3"/>
    <text x="65" y="321" text-anchor="middle" font-size="11" fill="#1a3a5c" font-family="sans-serif">系 2</text>
  </g>
  <g>
    <rect x="40" y="334" width="50" height="22" fill="#e8f0fe" stroke="#2e6da4" stroke-width="2" rx="3"/>
    <text x="65" y="349" text-anchor="middle" font-size="11" fill="#1a3a5c" font-family="sans-serif">系 3</text>
  </g>
  <g>
    <rect x="160" y="300" width="80" height="36" fill="#fff3cd" stroke="#d4a017" stroke-width="2" rx="3"/>
    <text x="200" y="316" text-anchor="middle" font-size="11" fill="#1a3a5c" font-family="sans-serif">多数決</text>
    <text x="200" y="330" text-anchor="middle" font-size="11" fill="#1a3a5c" font-family="sans-serif">判定</text>
  </g>
  <line x1="90" y1="289" x2="160" y2="312" stroke="#222" stroke-width="1.5"/>
  <line x1="90" y1="317" x2="160" y2="318" stroke="#222" stroke-width="1.5"/>
  <line x1="90" y1="345" x2="160" y2="324" stroke="#222" stroke-width="1.5"/>
  <line x1="240" y1="318" x2="280" y2="318" stroke="#222" stroke-width="1.5"/>
  <polygon points="280,318 274,314 274,322" fill="#222"/>
  <text x="320" y="322" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">出力</text>

  <!-- サマリー -->
  <line x1="20" y1="378" x2="380" y2="378" stroke="#d7d7d7" stroke-width="1"/>
  <text x="200" y="408" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3a5c" font-family="sans-serif">冗長化の目的と適用</text>
  <rect x="20" y="420" width="360" height="62" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="30" y="440" font-size="11" fill="#555" font-family="sans-serif">・待機冗長: コスト低・切替時に一時停止が生じる</text>
  <text x="30" y="458" font-size="11" fill="#555" font-family="sans-serif">・並列冗長: 無停止・コスト高（常時全系稼働）</text>
  <text x="30" y="476" font-size="11" fill="#555" font-family="sans-serif">・多数決冗長: 誤動作検知に優れる（航空・原子力）</text>
</svg>
