<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-label="アウトプットaからhは強い経済，iからnは豊かな生活環境，oからrは選ばれる地方へつながる" style="max-width:960px;width:100%"><defs><style>text{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif;fill:#1a3a5c}</style><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2e6da4"/></marker></defs><rect width="960" height="510" fill="#ffffff"/><text x="16" y="24" font-size="18">具体的な施策の成果（アウトプット）から3つの政策目標へ</text><rect x="16" y="38" width="300" height="118" rx="8" fill="#e8f0fe" stroke="#2e6da4"/><text x="30" y="66" font-size="23">1．強い経済</text><text x="30" y="93" font-size="18">自立的で持続的に成長する</text><text x="30" y="116" font-size="18">「稼げる」経済を創出し，</text><text x="30" y="139" font-size="18">新たな人を呼び込む</text><path d="M166,186 V163" stroke="#2e6da4" stroke-width="4" marker-end="url(#arrow)"/><rect x="332" y="38" width="300" height="118" rx="8" fill="#e8f0fe" stroke="#2e6da4"/><text x="346" y="66" font-size="23">2．豊かな生活環境</text><text x="346" y="93" font-size="18">生きがいをもって働き，</text><text x="346" y="116" font-size="18">安心して暮らし続けられる</text><text x="346" y="139" font-size="18">生活環境を構築する</text><path d="M482,186 V163" stroke="#2e6da4" stroke-width="4" marker-end="url(#arrow)"/><rect x="648" y="38" width="300" height="118" rx="8" fill="#e8f0fe" stroke="#2e6da4"/><text x="662" y="66" font-size="23">3．選ばれる地方</text><text x="662" y="93" font-size="18">若者や女性にも選ばれ，</text><text x="662" y="116" font-size="18">幸せを実感し，自己実現を</text><text x="662" y="139" font-size="18">図ることができる</text><path d="M798,186 V163" stroke="#2e6da4" stroke-width="4" marker-end="url(#arrow)"/><rect x="16" y="195" width="300" height="213" rx="8" fill="#e8f0fe" stroke="#2e6da4"/><text x="28" y="222" font-size="18">地域の高付加価値型産業を創出</text><text x="28" y="248" font-size="17">a．地域資源の活用促進</text><text x="28" y="272" font-size="17">b．GX・DXの推進</text><text x="28" y="296" font-size="17">c．産業の地方移転・産業立地促進</text><text x="28" y="320" font-size="17">d．中小企業等の稼ぐ力の強化</text><text x="28" y="344" font-size="17">e．スタートアップの創出促進</text><text x="28" y="368" font-size="17">f．地場産品の輸出促進</text><text x="28" y="392" font-size="17">g．インバウンド促進</text><rect x="16" y="425" width="300" height="69" rx="8" fill="#e8f0fe" stroke="#2e6da4"/><text x="28" y="452" font-size="18">地域の人材力強化</text><text x="28" y="478" font-size="17">h．人材育成・リスキリング促進</text><rect x="332" y="195" width="300" height="141" rx="8" fill="#e8f0fe" stroke="#2e6da4"/><text x="344" y="222" font-size="18">持続可能な生活インフラを実現</text><text x="344" y="248" font-size="17">i．公共交通の維持</text><text x="344" y="272" font-size="17">j．買物環境の維持</text><text x="344" y="296" font-size="17">k．インフラの維持</text><text x="344" y="320" font-size="17">l．災害対応の強化の促進</text><rect x="332" y="350" width="300" height="117" rx="8" fill="#e8f0fe" stroke="#2e6da4"/><text x="344" y="377" font-size="18">地域の暮らしの満足感向上</text><text x="344" y="403" font-size="17">m．満足できる子育て・医療・</text><text x="344" y="427" font-size="17">　 介護・福祉サービスの実現</text><text x="344" y="451" font-size="17">n．持続可能なまちづくり</text><rect x="648" y="195" width="300" height="141" rx="8" fill="#e8f0fe" stroke="#2e6da4"/><text x="660" y="222" font-size="18">魅力が感じられる地方を実現</text><text x="660" y="248" font-size="17">o．多様性に富んだ地方の実現</text><text x="660" y="272" font-size="17">p．教育環境整備の促進</text><text x="660" y="296" font-size="17">q．都市と地方の共生の実現</text><text x="660" y="320" font-size="17">r．地方への移住推進</text></svg>
