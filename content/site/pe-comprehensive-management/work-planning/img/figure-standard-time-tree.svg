<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" style="max-width:400px;width:100%" role="img" aria-label="標準時間の構成ツリー">
  <!-- scale 500 -> 400: 0.8 -->
  <g transform="scale(0.8 0.8)">
    <rect x="10" y="75" width="100" height="40" fill="none" stroke="#222" stroke-width="1.5"/>
    <text x="60" y="99" text-anchor="middle" font-size="13" fill="#222" font-family="sans-serif">標準時間</text>

    <line x1="110" y1="95" x2="150" y2="95" stroke="#222" stroke-width="1.5"/>
    <line x1="150" y1="52" x2="150" y2="138" stroke="#222" stroke-width="1.5"/>

    <line x1="150" y1="52" x2="190" y2="52" stroke="#222" stroke-width="1.5"/>
    <rect x="190" y="32" width="110" height="40" fill="none" stroke="#222" stroke-width="1.5"/>
    <text x="245" y="56" text-anchor="middle" font-size="12" fill="#222" font-family="sans-serif">主体作業時間</text>

    <line x1="300" y1="52" x2="320" y2="52" stroke="#222" stroke-width="1.5"/>
    <line x1="320" y1="30" x2="320" y2="74" stroke="#222" stroke-width="1.5"/>
    <line x1="320" y1="30" x2="330" y2="30" stroke="#222" stroke-width="1.5"/>
    <rect x="330" y="14" width="70" height="30" fill="none" stroke="#222" stroke-width="1"/>
    <text x="365" y="33" text-anchor="middle" font-size="11" fill="#222" font-family="sans-serif">正味時間</text>
    <line x1="320" y1="74" x2="330" y2="74" stroke="#222" stroke-width="1.5"/>
    <rect x="330" y="58" width="70" height="30" fill="none" stroke="#222" stroke-width="1"/>
    <text x="365" y="77" text-anchor="middle" font-size="11" fill="#222" font-family="sans-serif">余裕時間</text>

    <line x1="150" y1="138" x2="190" y2="138" stroke="#222" stroke-width="1.5"/>
    <rect x="190" y="118" width="110" height="40" fill="none" stroke="#222" stroke-width="1.5"/>
    <text x="245" y="142" text-anchor="middle" font-size="11" fill="#222" font-family="sans-serif">準備段取作業時間</text>

    <line x1="300" y1="138" x2="320" y2="138" stroke="#222" stroke-width="1.5"/>
    <line x1="320" y1="116" x2="320" y2="160" stroke="#222" stroke-width="1.5"/>
    <line x1="320" y1="116" x2="330" y2="116" stroke="#222" stroke-width="1.5"/>
    <rect x="330" y="100" width="70" height="30" fill="none" stroke="#222" stroke-width="1"/>
    <text x="365" y="119" text-anchor="middle" font-size="11" fill="#222" font-family="sans-serif">正味時間</text>
    <line x1="320" y1="160" x2="330" y2="160" stroke="#222" stroke-width="1.5"/>
    <rect x="330" y="144" width="70" height="30" fill="none" stroke="#222" stroke-width="1"/>
    <text x="365" y="163" text-anchor="middle" font-size="11" fill="#222" font-family="sans-serif">余裕時間</text>
  </g>

  <!-- サマリー（190 * 0.8 = 152 → 余白 348px） -->
  <line x1="20" y1="170" x2="380" y2="170" stroke="#d7d7d7" stroke-width="1"/>
  <text x="200" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3a5c" font-family="sans-serif">各要素の定義</text>

  <rect x="20" y="214" width="360" height="100" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="30" y="236" font-size="12" font-weight="bold" fill="#1a3a5c" font-family="sans-serif">標準時間の構成</text>
  <text x="30" y="256" font-size="11" fill="#555" font-family="sans-serif">・主体作業時間: 製品・成果物に直接付加価値を生む作業</text>
  <text x="30" y="274" font-size="11" fill="#555" font-family="sans-serif">　└ 正味時間: 純粋な作業時間</text>
  <text x="30" y="292" font-size="11" fill="#555" font-family="sans-serif">　└ 余裕時間: 疲労・個人的余裕などのロス時間</text>
  <text x="30" y="310" font-size="11" fill="#555" font-family="sans-serif">・準備段取時間: 前後の準備・片付け・ツール交換等</text>

  <rect x="20" y="328" width="360" height="80" rx="6" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text x="30" y="350" font-size="12" font-weight="bold" fill="#1a3a5c" font-family="sans-serif">WF（ワークファクター）と PTS 法</text>
  <text x="30" y="370" font-size="11" fill="#555" font-family="sans-serif">・WF 法：動作分類別の標準時間を積算</text>
  <text x="30" y="390" font-size="11" fill="#555" font-family="sans-serif">・PTS 法：あらかじめ設定された動作時間値を利用</text>

  <text x="200" y="436" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">標準時間は作業計画・工数見積もりの基礎データ</text>
  <text x="200" y="456" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">IE（インダストリアルエンジニアリング）の基本手法</text>
</svg>
