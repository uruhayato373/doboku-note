<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" style="max-width:400px;width:100%" role="img" aria-label="ABC の 2 段階配賦（資源 → 活動 → 製品）">
  <!-- 幅520→400 scaleX=400/520≈0.769 、要素を水平中央に再配置 -->
  <!-- 資源ボックス -->
  <rect x="10" y="170" width="110" height="50" fill="none" stroke="#222" stroke-width="1.5"/>
  <text x="65" y="192" text-anchor="middle" font-size="13" fill="#222" font-family="sans-serif">資源</text>
  <text x="65" y="210" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">人件費・設備費等</text>

  <!-- 活動ボックス -->
  <rect x="145" y="170" width="110" height="50" fill="none" stroke="#222" stroke-width="1.5"/>
  <text x="200" y="192" text-anchor="middle" font-size="13" fill="#222" font-family="sans-serif">活動</text>
  <text x="200" y="210" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">検査・段取・運搬</text>

  <!-- 製品ボックス -->
  <rect x="280" y="170" width="110" height="50" fill="none" stroke="#222" stroke-width="1.5"/>
  <text x="335" y="192" text-anchor="middle" font-size="13" fill="#222" font-family="sans-serif">製品</text>
  <text x="335" y="210" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">A・B・C 品番</text>

  <!-- 矢印1 -->
  <line x1="120" y1="195" x2="140" y2="195" stroke="#222" stroke-width="1.8"/>
  <polygon points="137,190 147,195 137,200" fill="#222"/>
  <text x="132" y="153" text-anchor="middle" font-size="11" fill="#222" font-family="sans-serif">① リソース</text>
  <text x="132" y="168" text-anchor="middle" font-size="11" fill="#222" font-family="sans-serif">ドライバー</text>

  <!-- 矢印2 -->
  <line x1="255" y1="195" x2="275" y2="195" stroke="#222" stroke-width="1.8"/>
  <polygon points="272,190 282,195 272,200" fill="#222"/>
  <text x="267" y="153" text-anchor="middle" font-size="11" fill="#222" font-family="sans-serif">② アクティビティ</text>
  <text x="267" y="168" text-anchor="middle" font-size="11" fill="#222" font-family="sans-serif">ドライバー</text>

  <!-- 補足テキスト -->
  <text x="132" y="245" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">各活動の資源消費量</text>
  <text x="132" y="260" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">（例: 人時・稼働時間）</text>
  <text x="267" y="245" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">各製品の活動利用量</text>
  <text x="267" y="275" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">（例: 検査回数・段取回数）</text>

  <!-- 下部サマリー -->
  <rect x="20" y="360" width="360" height="80" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1" rx="4"/>
  <text x="200" y="390" text-anchor="middle" font-size="13" fill="#222" font-family="sans-serif" font-weight="bold">2 段階配賦の目的</text>
  <text x="200" y="413" text-anchor="middle" font-size="12" fill="#555" font-family="sans-serif">間接費を実態に合わせて</text>
  <text x="200" y="430" text-anchor="middle" font-size="12" fill="#555" font-family="sans-serif">製品別原価に展開する</text>
</svg>
