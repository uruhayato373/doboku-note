<svg width="400" height="500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" font-family="sans-serif" style="max-width:400px;width:100%" role="img" aria-label="アーンスタインの梯子（参加の8段階）">
  <!-- scale: x*400/460≈0.870, y*500/510≈0.980  -->
  <!-- Title -->
  <text x="200" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a3a5c">アーンスタインの梯子（参加の8段階）</text>
  <text x="200" y="36" text-anchor="middle" font-size="10" fill="#555">下から上へ、市民の実質的な決定権が増える</text>

  <!-- Rung 8 -->
  <rect x="26" y="50" width="304" height="42" fill="#d0e8d0" stroke="#3a7d44" stroke-width="2" rx="5"/>
  <circle cx="50" cy="71" r="14" fill="#3a7d44"/>
  <text x="50" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">8</text>
  <text x="74" y="76" font-size="13" font-weight="bold" fill="#3a7d44">市民によるコントロール</text>

  <!-- Rung 7 -->
  <rect x="26" y="96" width="304" height="42" fill="#d0e8d0" stroke="#3a7d44" stroke-width="2" rx="5"/>
  <circle cx="50" cy="117" r="14" fill="#3a7d44"/>
  <text x="50" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">7</text>
  <text x="74" y="122" font-size="13" font-weight="bold" fill="#3a7d44">権限委譲</text>

  <!-- Rung 6 -->
  <rect x="26" y="142" width="304" height="42" fill="#d0e8d0" stroke="#3a7d44" stroke-width="2" rx="5"/>
  <circle cx="50" cy="163" r="14" fill="#3a7d44"/>
  <text x="50" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">6</text>
  <text x="74" y="168" font-size="13" font-weight="bold" fill="#3a7d44">パートナーシップ</text>

  <!-- Category label: 市民権力 -->
  <text x="358" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a7d44">市民</text>
  <text x="358" y="124" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a7d44">権力</text>

  <!-- Divider line -->
  <line x1="26" y1="192" x2="330" y2="192" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Rung 5 -->
  <rect x="26" y="198" width="304" height="42" fill="#fff3cd" stroke="#d4a017" stroke-width="2" rx="5"/>
  <circle cx="50" cy="219" r="14" fill="#d4a017"/>
  <text x="50" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">5</text>
  <text x="74" y="224" font-size="13" font-weight="bold" fill="#d4a017">懐柔</text>

  <!-- Rung 4 -->
  <rect x="26" y="244" width="304" height="42" fill="#fff3cd" stroke="#d4a017" stroke-width="2" rx="5"/>
  <circle cx="50" cy="265" r="14" fill="#d4a017"/>
  <text x="50" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">4</text>
  <text x="74" y="270" font-size="13" font-weight="bold" fill="#d4a017">協議</text>

  <!-- Rung 3 -->
  <rect x="26" y="290" width="304" height="42" fill="#fff3cd" stroke="#d4a017" stroke-width="2" rx="5"/>
  <circle cx="50" cy="311" r="14" fill="#d4a017"/>
  <text x="50" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">3</text>
  <text x="74" y="316" font-size="13" font-weight="bold" fill="#d4a017">情報提供</text>

  <!-- Category label: 形式的参加 -->
  <text x="358" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a017">形式的</text>
  <text x="358" y="272" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a017">参加</text>

  <!-- Divider line -->
  <line x1="26" y1="340" x2="330" y2="340" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Rung 2 -->
  <rect x="26" y="346" width="304" height="42" fill="#f8d7da" stroke="#b22234" stroke-width="2" rx="5"/>
  <circle cx="50" cy="367" r="14" fill="#b22234"/>
  <text x="50" y="372" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2</text>
  <text x="74" y="372" font-size="13" font-weight="bold" fill="#b22234">セラピー</text>

  <!-- Rung 1 -->
  <rect x="26" y="392" width="304" height="42" fill="#f8d7da" stroke="#b22234" stroke-width="2" rx="5"/>
  <circle cx="50" cy="413" r="14" fill="#b22234"/>
  <text x="50" y="418" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">1</text>
  <text x="74" y="418" font-size="13" font-weight="bold" fill="#b22234">操作</text>

  <!-- Category label: 非参加 -->
  <text x="358" y="386" text-anchor="middle" font-size="11" font-weight="bold" fill="#b22234">非</text>
  <text x="358" y="400" text-anchor="middle" font-size="11" font-weight="bold" fill="#b22234">参加</text>

  <!-- Source note -->
  <text x="200" y="488" text-anchor="middle" font-size="10" fill="#8a8a8a">Arnstein (1969) "A Ladder of Citizen Participation" より</text>
</svg>
