<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="派遣元と労働者の雇用関係、派遣先から労働者への指揮命令、企業間の派遣契約" style="max-width:400px;width:100%"><defs><style>text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#222}.h{font-size:17px;font-weight:bold}.t{font-size:14px}.s{font-size:13px;fill:#555}.b{fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5}.g{fill:#d0e8d0;stroke:#3a7d44;stroke-width:1.5}.w{fill:#fff3cd;stroke:#d4a017;stroke-width:1.5}.n{fill:#f5f5f5;stroke:#d7d7d7;stroke-width:1}.a{fill:none;stroke:#2e6da4;stroke-width:2;marker-end:url(#arrow)}.l{fill:none;stroke:#555;stroke-width:1.5}</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4"/></marker></defs><rect x="20" y="30" width="160" height="70" rx="7" class="b"/><text x="100" y="58" class="h" text-anchor="middle">派遣元</text><rect x="220" y="30" width="160" height="70" rx="7" class="b"/><text x="300" y="58" class="h" text-anchor="middle">派遣先</text><path d="M180 65 H214" class="a"/><text x="200" y="125" class="t" text-anchor="middle">企業間：派遣契約</text><rect x="90" y="310" width="220" height="75" rx="7" class="g"/><text x="200" y="338" class="h" text-anchor="middle">派遣労働者</text><path d="M100 100 V245 H170 V304" class="a"/><path d="M300 100 V245 H230 V304" class="a"/><text x="89" y="196" class="t" text-anchor="middle">雇用契約</text><text x="307" y="196" class="t" text-anchor="middle">指揮命令</text><text x="200" y="467" class="s" text-anchor="middle">雇用する会社と、仕事を指示する会社が異なる</text></svg>
