<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="原材料や製造工程を変えて発生を減らす源流対策と、排出前に処理する末端対策を比較" style="max-width:400px;width:100%"><defs><style>text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#222}.h{font-size:17px;font-weight:bold}.t{font-size:14px}.s{font-size:13px;fill:#555}.b{fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5}.g{fill:#d0e8d0;stroke:#3a7d44;stroke-width:1.5}.w{fill:#fff3cd;stroke:#d4a017;stroke-width:1.5}.n{fill:#f5f5f5;stroke:#d7d7d7;stroke-width:1}.a{fill:none;stroke:#2e6da4;stroke-width:2;marker-end:url(#arrow)}.l{fill:none;stroke:#555;stroke-width:1.5}</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4"/></marker></defs><rect x="30" y="25" width="340" height="68" rx="7" class="g"/><text x="200" y="53" class="h" text-anchor="middle">原材料の選択</text><text x="200" y="77" class="t" text-anchor="middle">有害な材料を代替する</text><path d="M200 93 V132" class="a"/><rect x="30" y="138" width="340" height="68" rx="7" class="g"/><text x="200" y="166" class="h" text-anchor="middle">製造工程</text><text x="200" y="190" class="t" text-anchor="middle">発生量を減らす工程へ</text><path d="M200 206 V247" class="a"/><rect x="30" y="253" width="340" height="68" rx="7" class="w"/><text x="200" y="281" class="h" text-anchor="middle">排出前の処理設備</text><text x="200" y="305" class="t" text-anchor="middle">発生した汚染物質を除去</text><path d="M200 321 V357" class="a"/><rect x="30" y="363" width="340" height="63" rx="7" class="b"/><text x="200" y="391" class="h" text-anchor="middle">環境への排出を減らす</text><text x="200" y="467" class="s" text-anchor="middle">上の2段：源流対策／処理設備：末端対策</text></svg>
