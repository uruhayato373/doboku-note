<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="人・機械・環境の状態を共有し、状況に応じた危険回避につなげる協調安全の関係" style="max-width:400px;width:100%"><defs><style>text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#222}.h{font-size:17px;font-weight:bold}.t{font-size:14px}.s{font-size:13px;fill:#555}.b{fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5}.g{fill:#d0e8d0;stroke:#3a7d44;stroke-width:1.5}.w{fill:#fff3cd;stroke:#d4a017;stroke-width:1.5}.n{fill:#f5f5f5;stroke:#d7d7d7;stroke-width:1}.a{fill:none;stroke:#2e6da4;stroke-width:2;marker-end:url(#arrow)}.l{fill:none;stroke:#555;stroke-width:1.5}</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4"/></marker></defs><rect x="20" y="25" width="160" height="75" rx="7" class="b"/><text x="100" y="53" class="h" text-anchor="middle">人</text><text x="100" y="77" class="t" text-anchor="middle">位置・行動</text><rect x="20" y="131" width="160" height="75" rx="7" class="b"/><text x="100" y="159" class="h" text-anchor="middle">機械</text><text x="100" y="183" class="t" text-anchor="middle">動作状態</text><rect x="20" y="237" width="160" height="75" rx="7" class="b"/><text x="100" y="265" class="h" text-anchor="middle">環境</text><text x="100" y="289" class="t" text-anchor="middle">周囲の状況</text><rect x="220" y="131" width="160" height="96" rx="7" class="w"/><text x="300" y="159" class="h" text-anchor="middle">共有・判断</text><text x="300" y="183" class="t" text-anchor="middle">接近・進入を検知</text><path d="M180 62 H201 V168 M180 274 H201 V168" class="l"/><path d="M180 168 H214" class="a"/><path d="M300 227 V351 H200 V384" class="a"/><rect x="25" y="390" width="350" height="75" rx="7" class="g"/><text x="200" y="418" class="h" text-anchor="middle">状況に応じて危険を回避</text><text x="200" y="442" class="t" text-anchor="middle">減速・停止・注意の通知</text><text x="282" y="300" class="s" text-anchor="middle">通信等の故障にも</text><text x="282" y="323" class="s" text-anchor="middle">安全側の設計が必要</text></svg>
