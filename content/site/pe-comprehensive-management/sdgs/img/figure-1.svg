<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500" style="max-width:400px;width:100%" role="img" aria-label="持続可能な開発 5つのP。People・Prosperity・Planet・Peace・Partnershipの各カードに日本語訳・意味・該当目標範囲を示し、上部帯で経済・社会・環境の三側面調和を表す">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-header   { font-size: 14px; font-weight: bold; fill: #1a3a5c; }
      .t-sub      { font-size: 11px; fill: #555; }
      .t-p-en     { font-size: 15px; font-weight: bold; }
      .t-p-ja     { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-p-desc   { font-size: 12px; fill: #555; }
      .t-p-goals  { font-size: 11px; fill: #8a8a8a; }
      .t-axis     { font-size: 11px; fill: #8a8a8a; font-style: italic; }
      /* band */
      .band-eco   { fill: #fff3cd; }
      .band-soc   { fill: #e8f0fe; }
      .band-env   { fill: #d0e8d0; }
      /* cards */
      .card-people      { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; } /* brand */
      .card-prosperity  { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; } /* warn */
      .card-planet      { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; } /* positive */
      .card-peace       { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; } /* surface */
      .card-partnership { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; } /* surface */
      /* badge colors — white bg + color stroke (淡色背景＋濃色文字に統一) */
      .badge-people      { fill: #ffffff; stroke: #2e6da4; stroke-width: 1.5; }
      .badge-prosperity  { fill: #ffffff; stroke: #d4a017; stroke-width: 1.5; }
      .badge-planet      { fill: #ffffff; stroke: #3a7d44; stroke-width: 1.5; }
      .badge-peace       { fill: #ffffff; stroke: #8a8a8a; stroke-width: 1.5; }
      .badge-partnership { fill: #ffffff; stroke: #8a8a8a; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- ===== 三側面帯（タイトル除去・帯はy=8へ） ===== -->
  <rect class="band-eco" x="18" y="8" width="117" height="20" rx="4"/>
  <text class="t-sub" x="76" y="22" text-anchor="middle" font-weight="bold" fill="#d4a017">経済</text>
  <rect class="band-soc" x="141" y="8" width="117" height="20" rx="4"/>
  <text class="t-sub" x="199" y="22" text-anchor="middle" font-weight="bold" fill="#2e6da4">社会</text>
  <rect class="band-env" x="264" y="8" width="117" height="20" rx="4"/>
  <text class="t-sub" x="322" y="22" text-anchor="middle" font-weight="bold" fill="#3a7d44">環境</text>
  <text class="t-axis" x="200" y="42" text-anchor="middle">三側面の統合・不可分な調和</text>

  <!-- ===== 1. People（人間）brand ===== -->
  <rect class="card-people" x="18" y="50" width="363" height="82" rx="8"/>
  <rect class="badge-people" x="28" y="63" width="52" height="22" rx="4"/>
  <text font-size="12" font-weight="bold" fill="#2e6da4" x="54" y="78" text-anchor="middle">People</text>
  <text class="t-p-ja" x="92" y="78">人間</text>
  <text class="t-p-goals" x="362" y="72" text-anchor="end">目標 1〜6</text>
  <text class="t-p-desc" x="28" y="101">貧困・飢餓ゼロ、健康、教育、</text>
  <text class="t-p-desc" x="28" y="118">ジェンダー平等、安全な水</text>
  <text class="t-p-goals" x="362" y="118" text-anchor="end">社会の基盤</text>

  <!-- ===== 2. Prosperity（繁栄）warn ===== -->
  <rect class="card-prosperity" x="18" y="140" width="363" height="82" rx="8"/>
  <rect class="badge-prosperity" x="28" y="153" width="76" height="22" rx="4"/>
  <text font-size="12" font-weight="bold" fill="#d4a017" x="66" y="168" text-anchor="middle">Prosperity</text>
  <text class="t-p-ja" x="116" y="168">繁栄</text>
  <text class="t-p-goals" x="362" y="162" text-anchor="end">目標 7〜11</text>
  <text class="t-p-desc" x="28" y="191">クリーンエネルギー、経済成長、</text>
  <text class="t-p-desc" x="28" y="208">産業・技術革新、不平等解消</text>
  <text class="t-p-goals" x="362" y="208" text-anchor="end">経済の成長</text>

  <!-- ===== 3. Planet（地球）positive ===== -->
  <rect class="card-planet" x="18" y="230" width="363" height="82" rx="8"/>
  <rect class="badge-planet" x="28" y="243" width="52" height="22" rx="4"/>
  <text font-size="12" font-weight="bold" fill="#3a7d44" x="54" y="258" text-anchor="middle">Planet</text>
  <text class="t-p-ja" x="92" y="258">地球</text>
  <text class="t-p-goals" x="362" y="252" text-anchor="end">目標 12〜15</text>
  <text class="t-p-desc" x="28" y="281">持続可能な消費・生産、気候変動、</text>
  <text class="t-p-desc" x="28" y="298">海と陸の豊かさを守る</text>
  <text class="t-p-goals" x="362" y="298" text-anchor="end">環境の保全</text>

  <!-- ===== 4. Peace（平和）surface ===== -->
  <rect class="card-peace" x="18" y="320" width="363" height="68" rx="8"/>
  <rect class="badge-peace" x="28" y="333" width="44" height="22" rx="4"/>
  <text font-size="12" font-weight="bold" fill="#555" x="50" y="348" text-anchor="middle">Peace</text>
  <text class="t-p-ja" x="84" y="348">平和</text>
  <text class="t-p-goals" x="362" y="342" text-anchor="end">目標 16</text>
  <text class="t-p-desc" x="28" y="372">平和・公正な社会と強い制度</text>

  <!-- ===== 5. Partnership（連携）surface ===== -->
  <rect class="card-partnership" x="18" y="396" width="363" height="76" rx="8"/>
  <rect class="badge-partnership" x="28" y="409" width="86" height="22" rx="4"/>
  <text font-size="12" font-weight="bold" fill="#555" x="71" y="424" text-anchor="middle">Partnership</text>
  <text class="t-p-ja" x="126" y="424">連携</text>
  <text class="t-p-goals" x="362" y="418" text-anchor="end">目標 17</text>
  <text class="t-p-desc" x="28" y="447">グローバル・パートナーシップで</text>
  <text class="t-p-desc" x="28" y="464">目標を達成する手段</text>

  <!-- ===== footer ===== -->
  <text class="t-axis" x="200" y="492" text-anchor="middle">SDGs 2030アジェンダ（2015年 国連サミット採択）</text>
</svg>
