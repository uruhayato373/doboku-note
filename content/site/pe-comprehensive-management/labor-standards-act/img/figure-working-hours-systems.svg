<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500" style="max-width:400px;width:100%" role="img" aria-label="労働時間制度5類型の比較。通常（固定）は実労働時間で使用者が固定（1日8時間・週40時間）。フレックスは実労働時間を清算期間で清算し労働者が始業・終業を決定。変形は実労働時間を使用者が繁閑に応じて事前特定。裁量労働制はみなし労働時間で遂行方法は労働者裁量（専門業務型・企画業務型）。高度プロフェッショナル制度は労働時間規制の対象外で適用除外（高年収要件）。割増賃金はフレックス・変形・裁量では必要（深夜・休日は裁量もみなし対象外）、高プロは適用除外。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-sub  { font-size: 11px; fill: #8a8a8a; }
      .t-head { font-size: 16px; font-weight: bold; fill: #1a3a5c; }
      .th     { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .lbl    { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .cell   { font-size: 11px; fill: #222; }
      .f-foot { font-size: 11px; fill: #555; }
      .f-head { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
    </style>
  </defs>

  <text class="t-head" x="200" y="38" text-anchor="middle">「時間の数え方」と「決定権」で分かれる</text>

  <!-- ヘッダー行 -->
  <rect x="10"  y="50" width="74"  height="28" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.2"/>
  <text class="th" x="47"  y="68" text-anchor="middle">制度</text>
  <rect x="84"  y="50" width="116" height="28" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.2"/>
  <text class="th" x="142" y="68" text-anchor="middle">時間の数え方</text>
  <rect x="200" y="50" width="190" height="28" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.2"/>
  <text class="th" x="295" y="68" text-anchor="middle">決定権・特徴</text>

  <!-- row1 通常 -->
  <rect x="10"  y="78" width="74"  height="62" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <text class="lbl" x="47" y="105" text-anchor="middle">通常</text>
  <text class="cell" x="47" y="122" text-anchor="middle">（固定）</text>
  <rect x="84"  y="78" width="116" height="62" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text class="cell" x="142" y="113" text-anchor="middle">実労働時間</text>
  <rect x="200" y="78" width="190" height="62" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text class="cell" x="210" y="106" text-anchor="start">使用者が固定</text>
  <text class="cell" x="210" y="123" text-anchor="start">（1日8h・週40h）</text>

  <!-- row2 フレックス -->
  <rect x="10"  y="140" width="74"  height="62" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <text class="lbl" x="47" y="175" text-anchor="middle">フレックス</text>
  <rect x="84"  y="140" width="116" height="62" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text class="cell" x="142" y="168" text-anchor="middle">実労働時間</text>
  <text class="cell" x="142" y="184" text-anchor="middle">（清算）</text>
  <rect x="200" y="140" width="190" height="62" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text class="cell" x="210" y="168" text-anchor="start">労働者が始業・</text>
  <text class="cell" x="210" y="185" text-anchor="start">終業時刻を決定</text>

  <!-- row3 変形 -->
  <rect x="10"  y="202" width="74"  height="62" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <text class="lbl" x="47" y="237" text-anchor="middle">変形</text>
  <rect x="84"  y="202" width="116" height="62" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text class="cell" x="142" y="230" text-anchor="middle">実労働時間</text>
  <text class="cell" x="142" y="246" text-anchor="middle">（事前配分）</text>
  <rect x="200" y="202" width="190" height="62" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text class="cell" x="210" y="230" text-anchor="start">使用者が繁閑で</text>
  <text class="cell" x="210" y="247" text-anchor="start">事前に特定</text>

  <!-- row4 裁量 -->
  <rect x="10"  y="264" width="74"  height="62" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <text class="lbl" x="47" y="299" text-anchor="middle">裁量</text>
  <rect x="84"  y="264" width="116" height="62" fill="#fff3cd" stroke="#d4a017" stroke-width="1.2"/>
  <text class="cell" x="142" y="299" text-anchor="middle">みなし時間</text>
  <rect x="200" y="264" width="190" height="62" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text class="cell" x="210" y="292" text-anchor="start">遂行は労働者裁量</text>
  <text class="cell" x="210" y="309" text-anchor="start">（専門型・企画型）</text>

  <!-- row5 高プロ -->
  <rect x="10"  y="326" width="74"  height="62" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <text class="lbl" x="47" y="354" text-anchor="middle">高プロ</text>
  <rect x="84"  y="326" width="116" height="62" fill="#f8d7da" stroke="#b22234" stroke-width="1.2"/>
  <text class="cell" x="142" y="354" text-anchor="middle">規制の</text>
  <text class="cell" x="142" y="370" text-anchor="middle">対象外</text>
  <rect x="200" y="326" width="190" height="62" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text class="cell" x="210" y="354" text-anchor="start">時間規制を適用除外</text>
  <text class="cell" x="210" y="371" text-anchor="start">（高年収要件）</text>

  <!-- フッタ -->
  <rect x="10" y="398" width="380" height="92" rx="8" fill="#ffffff" stroke="#d7d7d7" stroke-width="1.3"/>
  <text class="f-head" x="200" y="420" text-anchor="middle">割増賃金（深夜・休日）の扱い</text>
  <text class="f-foot" x="200" y="442" text-anchor="middle">フレックス・変形・裁量 … 実労働時間に基づき必要</text>
  <text class="f-foot" x="200" y="460" text-anchor="middle">（裁量も深夜・休日はみなしの対象外）</text>
  <text class="f-foot" x="200" y="480" text-anchor="middle">高プロ … 深夜割増を含め適用除外</text>
</svg>
