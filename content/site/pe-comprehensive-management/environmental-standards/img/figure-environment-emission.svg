<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="工場の排出口で規制する排出基準と、生活環境で確保を目指す環境基準の測定位置の違い" style="max-width:400px;width:100%"><defs><style>text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#222}.h{font-size:17px;font-weight:bold}.t{font-size:14px}.s{font-size:13px;fill:#555}.b{fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5}.g{fill:#d0e8d0;stroke:#3a7d44;stroke-width:1.5}.w{fill:#fff3cd;stroke:#d4a017;stroke-width:1.5}.n{fill:#f5f5f5;stroke:#d7d7d7;stroke-width:1}.a{fill:none;stroke:#2e6da4;stroke-width:2;marker-end:url(#arrow)}.l{fill:none;stroke:#555;stroke-width:1.5}</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4"/></marker></defs><rect x="25" y="25" width="350" height="65" rx="7" class="b"/><text x="200" y="53" class="h" text-anchor="middle">工場・事業場</text><path d="M200 90 V135" class="a"/><rect x="70" y="141" width="260" height="73" rx="7" class="w"/><text x="200" y="169" class="h" text-anchor="middle">排出口：排出基準</text><text x="200" y="193" class="t" text-anchor="middle">発生源に対する規制</text><path d="M200 214 V266" class="a"/><text x="200" y="247" class="s" text-anchor="middle">排出後に拡散・混合</text><rect x="25" y="272" width="350" height="85" rx="7" class="g"/><text x="200" y="300" class="h" text-anchor="middle">周辺の大気・河川</text><text x="200" y="324" class="t" text-anchor="middle">環境基準：維持が望ましい状態</text><path d="M200 357 V393" class="a"/><text x="200" y="428" class="h" text-anchor="middle">人の健康・生活環境を守る</text><text x="200" y="467" class="s" text-anchor="middle">測定場所・対象・制度上の役割を区別する</text></svg>
