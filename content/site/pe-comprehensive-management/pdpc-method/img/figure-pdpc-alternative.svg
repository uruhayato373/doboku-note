<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="通常の調達が遅れた場合に代替調達と順序変更を準備するPDPCの例" style="max-width:400px;width:100%"><defs><style>text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#222}.h{font-size:17px;font-weight:bold}.t{font-size:14px}.s{font-size:13px;fill:#555}.b{fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5}.g{fill:#d0e8d0;stroke:#3a7d44;stroke-width:1.5}.w{fill:#fff3cd;stroke:#d4a017;stroke-width:1.5}.n{fill:#f5f5f5;stroke:#d7d7d7;stroke-width:1}.a{fill:none;stroke:#2e6da4;stroke-width:2;marker-end:url(#arrow)}.l{fill:none;stroke:#555;stroke-width:1.5}</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4"/></marker></defs><rect x="100" y="20" width="200" height="65" rx="7" class="b"/><text x="200" y="48" class="h" text-anchor="middle">資材の調達を開始</text><path d="M200 85 V120 H100 V151" class="a"/><path d="M200 120 H300 V151" class="a"/><rect x="20" y="157" width="160" height="65" rx="7" class="b"/><text x="100" y="185" class="h" text-anchor="middle">予定どおり到着</text><rect x="220" y="157" width="160" height="65" rx="7" class="w"/><text x="300" y="185" class="h" text-anchor="middle">到着が遅延</text><path d="M300 222 V262" class="a"/><rect x="220" y="268" width="160" height="83" rx="7" class="w"/><text x="300" y="296" class="h" text-anchor="middle">代替手段を選ぶ</text><text x="300" y="320" class="t" text-anchor="middle">代替品／順序変更</text><path d="M100 222 V387 H200" class="l"/><path d="M300 351 V387 H200 V399" class="a"/><rect x="35" y="405" width="330" height="67" rx="7" class="g"/><text x="200" y="433" class="h" text-anchor="middle">要求品質・納期を満たす</text><text x="200" y="457" class="t" text-anchor="middle">変更案の条件を事前に確認</text></svg>
