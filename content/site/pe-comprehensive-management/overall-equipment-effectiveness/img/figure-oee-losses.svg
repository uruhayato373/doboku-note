<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="停止損失、速度損失、不良損失を順に除きOEEが72.9パーセントとなる例" style="max-width:400px;width:100%"><defs><style>text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#222}.h{font-size:17px;font-weight:bold}.t{font-size:14px}.s{font-size:13px;fill:#555}.b{fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5}.g{fill:#d0e8d0;stroke:#3a7d44;stroke-width:1.5}.w{fill:#fff3cd;stroke:#d4a017;stroke-width:1.5}.n{fill:#f5f5f5;stroke:#d7d7d7;stroke-width:1}.a{fill:none;stroke:#2e6da4;stroke-width:2;marker-end:url(#arrow)}.l{fill:none;stroke:#555;stroke-width:1.5}</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4"/></marker></defs><text x="200" y="35" class="h" text-anchor="middle">3つの効率は足さずに掛ける</text><text x="25" y="85" class="t" text-anchor="start">負荷時間</text><rect x="25" y="97" width="350" height="28" rx="7" class="n"/><rect x="25" y="97" width="350" height="28" rx="7" class="b"/><text x="370" y="86" class="t" text-anchor="end">100%</text><text x="25" y="169" class="t" text-anchor="start">停止を除く</text><rect x="25" y="181" width="350" height="28" rx="7" class="n"/><rect x="25" y="181" width="315" height="28" rx="7" class="b"/><text x="370" y="170" class="t" text-anchor="end">90%</text><text x="25" y="253" class="t" text-anchor="start">速度損失を除く</text><rect x="25" y="265" width="350" height="28" rx="7" class="n"/><rect x="25" y="265" width="283.5" height="28" rx="7" class="b"/><text x="370" y="254" class="t" text-anchor="end">81%</text><text x="25" y="337" class="t" text-anchor="start">不良損失を除く</text><rect x="25" y="349" width="350" height="28" rx="7" class="n"/><rect x="25" y="349" width="255.15" height="28" rx="7" class="g"/><text x="370" y="338" class="t" text-anchor="end">72.9%</text><text x="200" y="437" class="h" text-anchor="middle">0.9 × 0.9 × 0.9 = 0.729</text><text x="200" y="467" class="s" text-anchor="middle">棒の長さは最初の負荷時間を100%として換算</text></svg>
