<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="楽観2日、最頻5日、悲観14日の例でPERT期待値6日と三角平均7日を比較" style="max-width:400px;width:100%"><defs><style>text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#222}.h{font-size:17px;font-weight:bold}.t{font-size:14px}.s{font-size:13px;fill:#555}.b{fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5}.g{fill:#d0e8d0;stroke:#3a7d44;stroke-width:1.5}.w{fill:#fff3cd;stroke:#d4a017;stroke-width:1.5}.n{fill:#f5f5f5;stroke:#d7d7d7;stroke-width:1}.a{fill:none;stroke:#2e6da4;stroke-width:2;marker-end:url(#arrow)}.l{fill:none;stroke:#555;stroke-width:1.5}</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4"/></marker></defs><text x="200" y="40" class="h" text-anchor="middle">最も起こりやすい値 ≠ 平均</text><path d="M40 165 L360 165" class="l"/><circle cx="40" cy="165" r="6" class="b"/><text x="40" y="125" class="t" text-anchor="middle">楽観</text><text x="40" y="201" class="t" text-anchor="middle">2日</text><circle cx="115" cy="165" r="6" class="b"/><text x="115" y="125" class="t" text-anchor="middle">最頻</text><text x="115" y="201" class="t" text-anchor="middle">5日</text><circle cx="340" cy="165" r="6" class="b"/><text x="340" y="125" class="t" text-anchor="middle">悲観</text><text x="340" y="201" class="t" text-anchor="middle">14日</text><rect x="25" y="254" width="350" height="76" rx="7" class="g"/><text x="200" y="282" class="h" text-anchor="middle">PERT：最頻値を4倍で重視</text><text x="200" y="306" class="t" text-anchor="middle">(2 + 4 × 5 + 14) ÷ 6 = 6日</text><rect x="25" y="350" width="350" height="76" rx="7" class="b"/><text x="200" y="378" class="h" text-anchor="middle">三角分布：3点を同じ重みで平均</text><text x="200" y="402" class="t" text-anchor="middle">(2 + 5 + 14) ÷ 3 = 7日</text><text x="200" y="467" class="s" text-anchor="middle">数値は計算法を比較するための仮定</text></svg>
