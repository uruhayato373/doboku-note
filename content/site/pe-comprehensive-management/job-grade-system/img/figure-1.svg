<!-- viewBox幅=400: 3列比較マトリクスを400幅に収める -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
     style="max-width:400px;width:100%"
     width="400" height="500"
     role="img"
     aria-label="社員格付制度3類型の比較。職能資格制度・職務等級制度・役割等級制度を能力評価・降格・人件費・職務記述書・柔軟性の軸で比較したマトリクス表">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-head   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-axis   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-cell   { font-size: 12px; fill: #222; }
      .t-sub    { font-size: 11px; fill: #555; }
      /* brand: 職能資格制度 */
      .col-brand-head { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .col-brand-cell { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 0.8; }
      /* positive: 職務等級制度 */
      .col-pos-head   { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .col-pos-cell   { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 0.8; }
      /* warn: 役割等級制度 */
      .col-warn-head  { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .col-warn-cell  { fill: #fff3cd; stroke: #d4a017; stroke-width: 0.8; }
      /* 行見出し */
      .col-axis-head  { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .col-axis-cell  { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 0.8; }
    </style>
  </defs>

  <!-- ===== 列定義 =====
       軸列: x=4, w=82
       brand列: x=89, w=96
       positive列: x=188, w=96
       warn列: x=287, w=109
       行高: 56px  行Y基点: 10,66,122,178,234,290,346 -->

  <!-- ===== ヘッダー行 ===== -->
  <!-- 軸列ヘッダー -->
  <rect class="col-axis-head" x="4"   y="10" width="82" height="48" rx="4"/>
  <text class="t-axis" x="45" y="30" text-anchor="middle">評価軸</text>

  <!-- brand列ヘッダー: 職能資格制度 -->
  <rect class="col-brand-head" x="89"  y="10" width="96" height="48" rx="4"/>
  <text class="t-head" x="137" y="28" text-anchor="middle">職能資格制度</text>
  <text class="t-sub"  x="137" y="44" text-anchor="middle">（潜在能力型）</text>

  <!-- positive列ヘッダー: 職務等級制度 -->
  <rect class="col-pos-head"  x="188" y="10" width="96" height="48" rx="4"/>
  <text class="t-head" x="236" y="28" text-anchor="middle">職務等級制度</text>
  <text class="t-sub"  x="236" y="44" text-anchor="middle">（顕在能力型）</text>

  <!-- warn列ヘッダー: 役割等級制度 -->
  <rect class="col-warn-head" x="287" y="10" width="109" height="48" rx="4"/>
  <text class="t-head" x="341" y="28" text-anchor="middle">役割等級制度</text>
  <text class="t-sub"  x="341" y="44" text-anchor="middle">（折衷型）</text>

  <!-- ===== 行1: 能力評価対象 ===== -->
  <rect class="col-axis-cell"  x="4"   y="61" width="82" height="52" rx="3"/>
  <text class="t-axis" x="45"  y="82"  text-anchor="middle">能力</text>
  <text class="t-axis" x="45"  y="98"  text-anchor="middle">評価</text>

  <rect class="col-brand-cell" x="89"  y="61" width="96" height="52" rx="3"/>
  <text class="t-cell" x="137" y="76"  text-anchor="middle">潜在能力</text>
  <text class="t-sub"  x="137" y="90"  text-anchor="middle">（将来の</text>
  <text class="t-sub"  x="137" y="104" text-anchor="middle">伸びしろ）</text>

  <rect class="col-pos-cell"   x="188" y="61" width="96" height="52" rx="3"/>
  <text class="t-cell" x="236" y="76"  text-anchor="middle">顕在能力</text>
  <text class="t-sub"  x="236" y="90"  text-anchor="middle">（現在の</text>
  <text class="t-sub"  x="236" y="104"  text-anchor="middle">遂行力）</text>

  <rect class="col-warn-cell"  x="287" y="61" width="109" height="52" rx="3"/>
  <text class="t-cell" x="341" y="82"  text-anchor="middle">役割の大きさ</text>
  <text class="t-sub"  x="341" y="98"  text-anchor="middle">（難度＋期待度）</text>

  <!-- ===== 行2: 降格の有無 ===== -->
  <rect class="col-axis-cell"  x="4"   y="116" width="82" height="52" rx="3"/>
  <text class="t-axis" x="45"  y="137" text-anchor="middle">降格</text>
  <text class="t-axis" x="45"  y="153" text-anchor="middle">の有無</text>

  <rect class="col-brand-cell" x="89"  y="116" width="96" height="52" rx="3"/>
  <text class="t-cell" x="137" y="131" text-anchor="middle">基本なし</text>
  <text class="t-sub"  x="137" y="145" text-anchor="middle">（経験年数</text>
  <text class="t-sub"  x="137" y="159" text-anchor="middle">で昇格）</text>

  <rect class="col-pos-cell"   x="188" y="116" width="96" height="52" rx="3"/>
  <text class="t-cell" x="236" y="131" text-anchor="middle">あり</text>
  <text class="t-sub"  x="236" y="145"  text-anchor="middle">（職務変化</text>
  <text class="t-sub"  x="236" y="159"  text-anchor="middle">で変動）</text>

  <rect class="col-warn-cell"  x="287" y="116" width="109" height="52" rx="3"/>
  <text class="t-cell" x="341" y="137" text-anchor="middle">役割変化に</text>
  <text class="t-sub"  x="341" y="153" text-anchor="middle">応じて変動</text>

  <!-- ===== 行3: 人件費傾向 ===== -->
  <rect class="col-axis-cell"  x="4"   y="171" width="82" height="52" rx="3"/>
  <text class="t-axis" x="45"  y="192" text-anchor="middle">人件費</text>
  <text class="t-axis" x="45"  y="208" text-anchor="middle">傾向</text>

  <rect class="col-brand-cell" x="89"  y="171" width="96" height="52" rx="3"/>
  <text class="t-cell" x="137" y="192" text-anchor="middle">高くなる</text>
  <text class="t-sub"  x="137" y="208" text-anchor="middle">（年功積上）</text>

  <rect class="col-pos-cell"   x="188" y="171" width="96" height="52" rx="3"/>
  <text class="t-cell" x="236" y="186" text-anchor="middle">職務に連動</text>
  <text class="t-sub"  x="236" y="200" text-anchor="middle">（職務ランク</text>
  <text class="t-sub"  x="236" y="214" text-anchor="middle">固定）</text>

  <rect class="col-warn-cell"  x="287" y="171" width="109" height="52" rx="3"/>
  <text class="t-cell" x="341" y="190" text-anchor="middle">役割で決定</text>
  <text class="t-sub"  x="341" y="217" text-anchor="middle">（年齢・経験不問）</text>

  <!-- ===== 行4: 職務記述書 ===== -->
  <rect class="col-axis-cell"  x="4"   y="226" width="82" height="52" rx="3"/>
  <text class="t-axis" x="45"  y="247" text-anchor="middle">職務</text>
  <text class="t-axis" x="45"  y="263" text-anchor="middle">記述書</text>

  <rect class="col-brand-cell" x="89"  y="226" width="96" height="52" rx="3"/>
  <text class="t-cell" x="137" y="241" text-anchor="middle">不要</text>
  <text class="t-sub"  x="137" y="255" text-anchor="middle">（資格ランク</text>
  <text class="t-sub"  x="137" y="269" text-anchor="middle">基準）</text>

  <rect class="col-pos-cell"   x="188" y="226" width="96" height="52" rx="3"/>
  <text class="t-cell" x="236" y="241" text-anchor="middle">必須</text>
  <text class="t-sub"  x="236" y="255" text-anchor="middle">（等級・</text>
  <text class="t-sub"  x="236" y="269" text-anchor="middle">報酬連動）</text>

  <rect class="col-warn-cell"  x="287" y="226" width="109" height="52" rx="3"/>
  <text class="t-cell" x="341" y="247" text-anchor="middle">役割定義</text>
  <text class="t-sub"  x="341" y="263" text-anchor="middle">で代替</text>

  <!-- ===== 行5: 組織柔軟性 ===== -->
  <rect class="col-axis-cell"  x="4"   y="281" width="82" height="52" rx="3"/>
  <text class="t-axis" x="45"  y="302" text-anchor="middle">組織</text>
  <text class="t-axis" x="45"  y="318" text-anchor="middle">柔軟性</text>

  <rect class="col-brand-cell" x="89"  y="281" width="96" height="52" rx="3"/>
  <text class="t-cell" x="137" y="298" text-anchor="middle">高い</text>
  <text class="t-sub"  x="137" y="326" text-anchor="middle">（異動しやすい）</text>

  <rect class="col-pos-cell"   x="188" y="281" width="96" height="52" rx="3"/>
  <text class="t-cell" x="236" y="296" text-anchor="middle">低い</text>
  <text class="t-sub"  x="236" y="310" text-anchor="middle">（記述書</text>
  <text class="t-sub"  x="236" y="324" text-anchor="middle">再検討要）</text>

  <rect class="col-warn-cell"  x="287" y="281" width="109" height="52" rx="3"/>
  <text class="t-cell" x="341" y="298" text-anchor="middle">中程度</text>
  <text class="t-sub"  x="335" y="328" text-anchor="middle">（役割再定義で対応）</text>

  <!-- ===== 凡例 ===== -->
  <rect x="4"   y="346" width="14" height="14" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.2" rx="2"/>
  <text class="t-sub" x="22" y="358">職能資格制度</text>

  <rect x="118" y="346" width="14" height="14" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.2" rx="2"/>
  <text class="t-sub" x="136" y="358">職務等級制度</text>

  <rect x="236" y="346" width="14" height="14" fill="#fff3cd" stroke="#d4a017" stroke-width="1.2" rx="2"/>
  <text class="t-sub" x="254" y="358">役割等級制度</text>

  <!-- フッター -->
  <rect x="4" y="372" width="392" height="116" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <text font-size="11" font-weight="bold" fill="#1a3a5c" x="200" y="388" text-anchor="middle">各制度の特徴まとめ</text>
  <text class="t-sub" x="12" y="404">・職能資格制度：年功的・降格なし・日本企業に普及</text>
  <text class="t-sub" x="12" y="420">・職務等級制度：欧米型・職務記述書必須・コスト連動</text>
  <text class="t-sub" x="12" y="436">・役割等級制度：折衷型・成果と役割を重視・近年注目</text>
  <text class="t-sub" x="12" y="452">・同一役割・同一賃金が基本となる役割等級制度が</text>
  <text class="t-sub" x="12" y="468">　グローバル化・多様な働き方への対応として普及拡大</text>
</svg>
