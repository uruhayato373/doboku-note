<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500" style="max-width:400px;width:100%" role="img" aria-label="デジタルコミュニケーションツール5分類。テレビ会議・ファイル共有・ビジネスチャット・社内SNS・グループウェアの機能定義を縦に並べた図">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-sub   { font-size: 11px; fill: #8a8a8a; }
      .t-label { font-size: 14px; font-weight: bold; fill: #1a3a5c; }
      .t-def   { font-size: 12px; fill: #555; }
      .t-num   { font-size: 13px; font-weight: bold; fill: #2e6da4; }
      .t-foot  { font-size: 11px; fill: #8a8a8a; }
      /* surface背景 + brandアクセント */
      .box-surface { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .badge-brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- 1 テレビ会議 -->
  <rect class="box-surface" x="18" y="12" width="364" height="78" rx="8"/>
  <rect class="badge-brand" x="18" y="12" width="6" height="78" rx="3"/>
  <!-- 番号バッジ -->
  <circle class="badge-brand" cx="46" cy="51" r="15"/>
  <text class="t-num" x="46" y="56" text-anchor="middle">1</text>
  <!-- ラベル -->
  <text class="t-label" x="72" y="40">テレビ会議</text>
  <!-- 定義 -->
  <text class="t-def" x="72" y="60">映像・音声による双方向通信で</text>
  <text class="t-def" x="72" y="76">遠隔地間の会議を実現するシステム</text>

  <!-- 2 ファイル共有 -->
  <rect class="box-surface" x="18" y="106" width="364" height="78" rx="8"/>
  <rect class="badge-brand" x="18" y="106" width="6" height="78" rx="3"/>
  <circle class="badge-brand" cx="46" cy="145" r="15"/>
  <text class="t-num" x="46" y="150" text-anchor="middle">2</text>
  <text class="t-label" x="72" y="134">ファイル共有</text>
  <text class="t-def" x="72" y="154">電子ファイルをネットワーク経由で共有。</text>
  <text class="t-def" x="72" y="170">版管理・アクセス権限設定機能を持つものも</text>

  <!-- 3 ビジネスチャット -->
  <rect class="box-surface" x="18" y="200" width="364" height="78" rx="8"/>
  <rect class="badge-brand" x="18" y="200" width="6" height="78" rx="3"/>
  <circle class="badge-brand" cx="46" cy="239" r="15"/>
  <text class="t-num" x="46" y="244" text-anchor="middle">3</text>
  <text class="t-label" x="72" y="228">ビジネスチャット</text>
  <text class="t-def" x="72" y="248">ビジネス用途に特化した</text>
  <text class="t-def" x="72" y="264">リアルタイムメッセージングサービス</text>

  <!-- 4 社内SNS -->
  <rect class="box-surface" x="18" y="294" width="364" height="78" rx="8"/>
  <rect class="badge-brand" x="18" y="294" width="6" height="78" rx="3"/>
  <circle class="badge-brand" cx="46" cy="333" r="15"/>
  <text class="t-num" x="46" y="338" text-anchor="middle">4</text>
  <text class="t-label" x="72" y="322">社内SNS</text>
  <text class="t-def" x="72" y="342">組織内限定で情報共有できる</text>
  <text class="t-def" x="72" y="358">SNSを活用したシステム</text>

  <!-- 5 グループウェア -->
  <rect class="box-surface" x="18" y="388" width="364" height="78" rx="8"/>
  <rect class="badge-brand" x="18" y="388" width="6" height="78" rx="3"/>
  <circle class="badge-brand" cx="46" cy="427" r="15"/>
  <text class="t-num" x="46" y="432" text-anchor="middle">5</text>
  <text class="t-label" x="72" y="416">グループウェア</text>
  <text class="t-def" x="72" y="436">組織内のネットワーク活用型情報共有基盤。</text>
  <text class="t-def" x="72" y="452">スケジュール管理・設備予約等の複合機能</text>

  <!-- フッター -->
  <text class="t-foot" x="200" y="488" text-anchor="middle">1〜4は機能単体・5は複合基盤（上位包含関係）</text>
</svg>
