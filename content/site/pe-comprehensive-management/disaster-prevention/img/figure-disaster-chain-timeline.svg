<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="二次災害・複合災害・災害関連死を、原因と手を打つ先の組合せで見分ける図" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif" font-size="12">
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,0 8,3.5 0,7" fill="#555"/>
    </marker>
  </defs>
  <rect width="400" height="500" fill="#ffffff"/>
  <g stroke-width="1.5" text-anchor="middle">
    <!-- surface: 一次災害 -->
    <rect x="20" y="20" width="360" height="44" rx="6" fill="#f5f5f5" stroke="#d7d7d7"/>
    <text x="200" y="40" font-size="14" font-weight="700" fill="#222">一次災害</text>
    <text x="200" y="57" font-size="11" fill="#555">外力による直接の被害のあとに、何が起きているか</text>
    <path d="M200,66 L200,88" fill="none" stroke="#555" marker-end="url(#ah)"/>
    <!-- warn: 二次災害 -->
    <rect x="20" y="90" width="360" height="108" rx="6" fill="#fff3cd" stroke="#d4a017"/>
    <text x="200" y="114" font-size="14" font-weight="700" fill="#1a3a5c">二次災害</text>
    <g fill="#222">
      <text x="200" y="136">原因：先の災害が残した不安定な状態</text>
      <text x="200" y="156">例：緩んだ斜面・損傷した堤防</text>
    </g>
    <text x="200" y="180" font-weight="700" fill="#1a3a5c">手を打つ先：危険度の見極めと立入制限</text>
    <!-- brand: 複合災害 -->
    <rect x="20" y="206" width="360" height="108" rx="6" fill="#e8f0fe" stroke="#2e6da4"/>
    <text x="200" y="230" font-size="14" font-weight="700" fill="#1a3a5c">複合災害</text>
    <g fill="#222">
      <text x="200" y="252">原因：別の災害が同時または続けて重なる</text>
      <text x="200" y="272">例：高潮と河川洪水の同時発生</text>
    </g>
    <text x="200" y="296" font-weight="700" fill="#1a3a5c">手を打つ先：資源投入の計画と外部支援の要請</text>
    <!-- danger: 災害関連死 -->
    <rect x="20" y="322" width="360" height="108" rx="6" fill="#f8d7da" stroke="#b22234"/>
    <text x="200" y="346" font-size="14" font-weight="700" fill="#1a3a5c">災害関連死</text>
    <g fill="#222">
      <text x="200" y="368">原因：負傷の悪化や避難生活の負担</text>
      <text x="200" y="388">時間をかけて広がり、認定は発災後も続く</text>
    </g>
    <text x="200" y="412" font-weight="700" fill="#1a3a5c">手を打つ先：避難所・医療・復旧の早さ</text>
  </g>
</svg>
