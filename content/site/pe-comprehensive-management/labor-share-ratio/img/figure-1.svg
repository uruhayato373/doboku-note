<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500" style="max-width:400px;width:100%" role="img" aria-label="労働分配率の図解。付加価値額（売上高−外部購入費用）を人件費とその他（利益・賃借料・減価償却等）に分け、人件費が占める割合が労働分配率。算出式は人件費÷付加価値額×100。景気変動とは逆方向に動き、景気拡大期は付加価値の増加に人件費が追いつかず分配率は低下、景気後退期は付加価値が減り人件費は固定的なため分配率は上昇する。業種で適正水準は異なる。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-sub  { font-size: 11px; fill: #8a8a8a; }
      .t-head { font-size: 16px; font-weight: bold; fill: #1a3a5c; }
      .t-cap  { font-size: 11px; fill: #555; }
      .t-seg  { font-size: 13px; font-weight: bold; }
      .t-segs { font-size: 11px; fill: #555; }
      .t-brace{ font-size: 12px; font-weight: bold; fill: #2e6da4; }
      .t-form { font-size: 14px; font-weight: bold; fill: #1a3a5c; }
      .t-sech { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-ctit { font-size: 13px; font-weight: bold; }
      .t-cl   { font-size: 11px; fill: #555; }
      .t-cbig { font-size: 14px; font-weight: bold; }
      .t-foot { font-size: 11px; fill: #555; }
    </style>
  </defs>

  <text class="t-head" x="200" y="40" text-anchor="middle">付加価値に占める人件費の割合</text>

  <!-- 付加価値の構成バー -->
  <text class="t-cap" x="200" y="64" text-anchor="middle">付加価値額 ＝ 売上高 − 外部購入費用（原材料・外注費）</text>
  <rect x="40" y="76" width="178" height="48" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.3"/>
  <rect x="218" y="76" width="142" height="48" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.3"/>
  <text class="t-seg"  x="129" y="98" text-anchor="middle" fill="#1a3a5c">人件費</text>
  <text class="t-segs" x="129" y="114" text-anchor="middle">給与・賞与・法定福利等</text>
  <text class="t-seg"  x="289" y="98" text-anchor="middle" fill="#555">その他</text>
  <text class="t-segs" x="289" y="114" text-anchor="middle">利益・賃借料・減価償却</text>

  <!-- ブレース：人件費＝労働分配率 -->
  <line x1="40" y1="130" x2="40" y2="136" stroke="#2e6da4" stroke-width="1.3"/>
  <line x1="218" y1="130" x2="218" y2="136" stroke="#2e6da4" stroke-width="1.3"/>
  <line x1="40" y1="136" x2="218" y2="136" stroke="#2e6da4" stroke-width="1.3"/>
  <text class="t-brace" x="129" y="152" text-anchor="middle">この割合 ＝ 労働分配率</text>

  <!-- 算出式 -->
  <rect x="20" y="162" width="360" height="44" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.3"/>
  <text class="t-form" x="200" y="190" text-anchor="middle">労働分配率（％）＝ 人件費 ÷ 付加価値額 × 100</text>

  <!-- 景気との逆相関 -->
  <text class="t-sech" x="200" y="232" text-anchor="middle">景気変動とは逆方向に動く（逆相関）</text>

  <rect x="20" y="244" width="175" height="124" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.3"/>
  <text class="t-ctit" x="107" y="268" text-anchor="middle" fill="#2e6da4">景気拡大期</text>
  <text class="t-cl"   x="107" y="292" text-anchor="middle">付加価値が増加し</text>
  <text class="t-cl"   x="107" y="310" text-anchor="middle">人件費が追いつかない</text>
  <text class="t-cbig" x="107" y="346" text-anchor="middle" fill="#2e6da4">分配率 低下 ↓</text>

  <rect x="205" y="244" width="175" height="124" rx="8" fill="#fff3cd" stroke="#d4a017" stroke-width="1.3"/>
  <text class="t-ctit" x="292" y="268" text-anchor="middle" fill="#d4a017">景気後退期</text>
  <text class="t-cl"   x="292" y="292" text-anchor="middle">付加価値が減少し</text>
  <text class="t-cl"   x="292" y="310" text-anchor="middle">人件費は固定的</text>
  <text class="t-cbig" x="292" y="346" text-anchor="middle" fill="#d4a017">分配率 上昇 ↑</text>

  <!-- フッタ -->
  <rect x="20" y="384" width="360" height="102" rx="8" fill="#ffffff" stroke="#d7d7d7" stroke-width="1.3"/>
  <text class="t-foot" x="36" y="410">適正水準は業種別：製造業45〜55％／サービス業60〜70％</text>
  <text class="t-foot" x="36" y="434">高すぎ＝投資余力の低下／低すぎ＝人材流出・士気低下</text>
  <text class="t-foot" x="36" y="458">付加価値の算出：控除法（中小企業庁）・加算法（日銀方式）</text>
  <text class="t-foot" x="36" y="476" fill="#8a8a8a">同業他社・時系列での比較が重要</text>
</svg>
