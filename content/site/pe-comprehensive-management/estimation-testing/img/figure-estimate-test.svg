<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="推定は標本から母数の範囲を求め、検定は仮説と標本の整合を調べる対照図" style="max-width:400px;width:100%"><defs><style>text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#222}.h{font-size:17px;font-weight:bold}.t{font-size:14px}.s{font-size:13px;fill:#555}.b{fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5}.g{fill:#d0e8d0;stroke:#3a7d44;stroke-width:1.5}.w{fill:#fff3cd;stroke:#d4a017;stroke-width:1.5}.n{fill:#f5f5f5;stroke:#d7d7d7;stroke-width:1}.a{fill:none;stroke:#2e6da4;stroke-width:2;marker-end:url(#arrow)}.l{fill:none;stroke:#555;stroke-width:1.5}</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4"/></marker></defs><text x="105" y="35" class="h" text-anchor="middle">推定</text><text x="295" y="35" class="h" text-anchor="middle">検定</text><rect x="20" y="65" width="170" height="75" rx="7" class="b"/><text x="105" y="93" class="h" text-anchor="middle">得られた標本</text><text x="105" y="117" class="t" text-anchor="middle">平均・ばらつき</text><rect x="210" y="65" width="170" height="75" rx="7" class="b"/><text x="295" y="93" class="h" text-anchor="middle">帰無仮説</text><text x="295" y="117" class="t" text-anchor="middle">母平均は基準値か</text><path d="M105 140 V194" class="a"/><path d="M295 140 V194" class="a"/><rect x="20" y="200" width="170" height="88" rx="7" class="g"/><text x="105" y="228" class="h" text-anchor="middle">母数を推定</text><text x="105" y="252" class="t" text-anchor="middle">点推定・区間推定</text><rect x="210" y="200" width="170" height="88" rx="7" class="w"/><text x="295" y="228" class="h" text-anchor="middle">標本と照合</text><text x="295" y="252" class="t" text-anchor="middle">p値と有意水準</text><path d="M295 288 V330" class="a"/><rect x="210" y="336" width="170" height="77" rx="7" class="b"/><text x="295" y="364" class="h" text-anchor="middle">棄却するか判断</text><text x="295" y="388" class="t" text-anchor="middle">証明とは異なる</text><text x="102" y="352" class="t" text-anchor="middle">どの範囲か</text><text x="102" y="383" class="t" text-anchor="middle">不確かさも示す</text><text x="200" y="467" class="s" text-anchor="middle">どちらも標本の抽出方法と前提条件を確認</text></svg>
