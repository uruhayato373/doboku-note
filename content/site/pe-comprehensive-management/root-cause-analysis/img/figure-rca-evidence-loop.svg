<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="事故の事実から直接・組織的な原因の仮説を立て、証拠と照合する。合わなければ見直し、原因に対応した是正策の効果まで確かめる。"><defs><style>text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#1a3a5c}</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4"/></marker></defs><!-- brand / positive / warn fills; ink-strong text --><text x="200" y="27" font-size="16" font-weight="bold" text-anchor="middle">「人のミス」で止めず、根拠で確かめる</text><rect x="36" y="47" width="328" height="58" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/><text x="200" y="72" font-size="18" font-weight="bold" text-anchor="middle">事故・トラブルの事実</text><text x="200" y="93" font-size="14" font-weight="normal" text-anchor="middle">記録・時系列・現場の状況</text><path d="M200 106 L200 131" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="36" y="136" width="328" height="69" rx="8" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/><text x="200" y="165" font-size="18" font-weight="bold" text-anchor="middle">原因の仮説を広げる</text><text x="200" y="189" font-size="14" font-weight="normal" text-anchor="middle">直接の出来事 ＋ それを許した仕組み</text><path d="M200 207 L200 231" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="36" y="236" width="328" height="69" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/><text x="200" y="264" font-size="18" font-weight="bold" text-anchor="middle">証拠と照合する</text><text x="200" y="289" font-size="15" font-weight="normal" text-anchor="middle">手順・設備・教育・管理の実態</text><path d="M200 306 L200 331" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="36" y="336" width="328" height="69" rx="8" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/><text x="200" y="365" font-size="18" font-weight="bold" text-anchor="middle">是正策を実施・検証</text><text x="200" y="389" font-size="15" font-weight="normal" text-anchor="middle">原因へ効くか、再発を防げたか</text><path d="M365 270 H385 V170 H366" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/><text x="200" y="443" font-size="16" font-weight="bold" text-anchor="middle">合わない証拠があれば仮説を見直す</text><text x="200" y="476" font-size="14" font-weight="normal" text-anchor="middle">原因は複数あり、必ず3層で終わるとは限らない</text></svg>
