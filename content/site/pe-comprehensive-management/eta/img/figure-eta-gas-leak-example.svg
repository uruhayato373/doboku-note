<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="ガス漏れ発生後のイベントツリー。早期発見、計器発見、検査発見、着火しないの各分岐で、右へ進めば爆発を回避し、下の失敗経路をすべてたどると爆発に至る。この例の条件付き確率は0.0005。数値は説明用の仮定。">
<defs><marker id="eta-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#555"/></marker></defs>
<!-- brand / positive / danger / ink-body tokens -->
<g font-family="Inter, Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" fill="#1a3a5c">
<rect x="20" y="16" width="170" height="48" rx="6" fill="#e8f0fe" stroke="#2e6da4"/>
<text x="105" y="37" text-anchor="middle" font-size="15" font-weight="bold">ガス漏れ発生</text>
<text x="105" y="55" text-anchor="middle" font-size="12">ここからの進展を追う</text>
<text x="285" y="35" text-anchor="middle" font-size="12" fill="#555">数値は説明用の仮定</text>
<text x="285" y="54" text-anchor="middle" font-size="12" fill="#555">右：回避　下：次へ</text>
<path d="M105 64V84" fill="none" stroke="#555" marker-end="url(#eta-arr)"/>
<rect x="20" y="90" width="170" height="40" rx="5" fill="#f5f5f5" stroke="#d7d7d7"/><text x="105" y="115" text-anchor="middle" font-size="14" font-weight="bold">早期発見</text>
<path d="M190 110H284" fill="none" stroke="#555" marker-end="url(#eta-arr)"/><text x="238" y="102" text-anchor="middle" font-size="12">成功 0.9</text>
<rect x="290" y="93" width="92" height="34" rx="5" fill="#d0e8d0" stroke="#3a7d44"/><text x="336" y="115" text-anchor="middle" font-size="13">爆発回避</text>
<path d="M105 130V154" fill="none" stroke="#555" marker-end="url(#eta-arr)"/><text x="118" y="148" font-size="12" fill="#555">失敗 0.1</text>
<rect x="20" y="160" width="170" height="40" rx="5" fill="#f5f5f5" stroke="#d7d7d7"/><text x="105" y="185" text-anchor="middle" font-size="14" font-weight="bold">計器による発見</text>
<path d="M190 180H284" fill="none" stroke="#555" marker-end="url(#eta-arr)"/><text x="238" y="172" text-anchor="middle" font-size="12">成功 0.9</text>
<rect x="290" y="163" width="92" height="34" rx="5" fill="#d0e8d0" stroke="#3a7d44"/><text x="336" y="185" text-anchor="middle" font-size="13">爆発回避</text>
<path d="M105 200V224" fill="none" stroke="#555" marker-end="url(#eta-arr)"/><text x="118" y="218" font-size="12" fill="#555">失敗 0.1</text>
<rect x="20" y="230" width="170" height="40" rx="5" fill="#f5f5f5" stroke="#d7d7d7"/><text x="105" y="255" text-anchor="middle" font-size="14" font-weight="bold">検査による発見</text>
<path d="M190 250H284" fill="none" stroke="#555" marker-end="url(#eta-arr)"/><text x="238" y="242" text-anchor="middle" font-size="12">成功 0.9</text>
<rect x="290" y="233" width="92" height="34" rx="5" fill="#d0e8d0" stroke="#3a7d44"/><text x="336" y="255" text-anchor="middle" font-size="13">爆発回避</text>
<path d="M105 270V294" fill="none" stroke="#555" marker-end="url(#eta-arr)"/><text x="118" y="288" font-size="12" fill="#555">失敗 0.1</text>
<rect x="20" y="300" width="170" height="40" rx="5" fill="#f5f5f5" stroke="#d7d7d7"/><text x="105" y="325" text-anchor="middle" font-size="14" font-weight="bold">着火しない</text>
<path d="M190 320H284" fill="none" stroke="#555" marker-end="url(#eta-arr)"/><text x="238" y="312" text-anchor="middle" font-size="12">成功 0.5</text>
<rect x="290" y="303" width="92" height="34" rx="5" fill="#d0e8d0" stroke="#3a7d44"/><text x="336" y="325" text-anchor="middle" font-size="13">爆発回避</text>
<path d="M105 340V364" fill="none" stroke="#555" marker-end="url(#eta-arr)"/><text x="118" y="358" font-size="12" fill="#555">失敗 0.5</text>
<rect x="20" y="370" width="170" height="42" rx="6" fill="#f8d7da" stroke="#b22234"/><text x="105" y="397" text-anchor="middle" font-size="15" font-weight="bold">ガス爆発</text>
<text x="285" y="385" text-anchor="middle" font-size="12" fill="#555">分岐確率は、それ以前の</text><text x="285" y="402" text-anchor="middle" font-size="12" fill="#555">経路を条件に設定する</text>
<rect x="20" y="430" width="362" height="58" rx="6" fill="#e8f0fe" stroke="#2e6da4"/><text x="201" y="451" text-anchor="middle" font-size="13">ガス漏れ発生後に爆発へ至る確率</text><text x="201" y="475" text-anchor="middle" font-size="15" font-weight="bold">0.1 × 0.1 × 0.1 × 0.5 = 0.0005</text>
</g></svg>
