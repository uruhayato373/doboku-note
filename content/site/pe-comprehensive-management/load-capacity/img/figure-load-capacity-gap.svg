<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="同じ生産能力に対して負荷が超過する期間と余力が残る期間を比較" style="max-width:400px;width:100%"><defs><style>text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#222}.h{font-size:17px;font-weight:bold}.t{font-size:14px}.s{font-size:13px;fill:#555}.b{fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5}.g{fill:#d0e8d0;stroke:#3a7d44;stroke-width:1.5}.w{fill:#fff3cd;stroke:#d4a017;stroke-width:1.5}.n{fill:#f5f5f5;stroke:#d7d7d7;stroke-width:1}.a{fill:none;stroke:#2e6da4;stroke-width:2;marker-end:url(#arrow)}.l{fill:none;stroke:#555;stroke-width:1.5}</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4"/></marker></defs><text x="200" y="35" class="h" text-anchor="middle">同じ単位・同じ期間で比べる</text><path d="M50 365 L365 365" class="l"/><path d="M50 65 L50 365" class="l"/><text x="42" y="370" class="s" text-anchor="end">0</text><text x="42" y="255" class="s" text-anchor="end">50</text><text x="42" y="140.00000000000003" class="s" text-anchor="end">100</text><path d="M50 135 H365" class="l" stroke-dasharray="6 4"/><rect x="88" y="89" width="80" height="276" rx="7" class="w"/><rect x="230" y="204" width="80" height="161" rx="7" class="b"/><text x="128" y="80" class="h" text-anchor="middle">120人時</text><text x="270" y="195" class="h" text-anchor="middle">70人時</text><text x="128" y="398" class="t" text-anchor="middle">超過20人時</text><text x="270" y="398" class="t" text-anchor="middle">余力30人時</text><text x="282" y="122" class="s" text-anchor="middle">能力100人時</text><text x="200" y="467" class="s" text-anchor="middle">超過と余力の間で、負荷・能力を調整</text></svg>
