<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" width="400" height="500" role="img" aria-label="特許権と実用新案権の比較表。保護対象は発明と考案、方法の保護は特許のみ可、審査は実体審査と無審査登録、存続期間は出願から20年と10年、権利化は約14か月と約2〜4か月、権利行使は登録後すぐと技術評価書が必要、費用は高いと低いで対比">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .axis { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .val  { font-size: 12px; fill: #222; }
      .sub  { font-size: 10px; fill: #555; }
    </style>
  </defs>

  <!-- 列ヘッダー -->
  <rect x="108" y="14" width="136" height="34" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="176" y="36" text-anchor="middle" font-size="15" fill="#1a3a5c" font-weight="bold">特許権</text>
  <rect x="252" y="14" width="136" height="34" rx="6" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text x="320" y="36" text-anchor="middle" font-size="15" fill="#1a3a5c" font-weight="bold">実用新案権</text>

  <!-- 行1: 保護対象 -->
  <text class="axis" x="12" y="78">保護対象</text>
  <text class="val" x="176" y="72" text-anchor="middle">発明</text>
  <text class="sub" x="176" y="88" text-anchor="middle">高度な技術的思想</text>
  <text class="val" x="320" y="72" text-anchor="middle">考案</text>
  <text class="sub" x="320" y="88" text-anchor="middle">物品の形状・構造</text>
  <line x1="12" y1="100" x2="388" y2="100" stroke="#d7d7d7" stroke-width="1"/>

  <!-- 行2: 方法の保護 -->
  <text class="axis" x="12" y="130">方法の保護</text>
  <text x="176" y="128" text-anchor="middle" font-size="13" fill="#3a7d44" font-weight="bold">できる</text>
  <text x="320" y="128" text-anchor="middle" font-size="13" fill="#b22234" font-weight="bold">不可（物品のみ）</text>
  <line x1="12" y1="148" x2="388" y2="148" stroke="#d7d7d7" stroke-width="1"/>

  <!-- 行3: 審査 -->
  <text class="axis" x="12" y="178">審査制度</text>
  <text class="val" x="176" y="176" text-anchor="middle">実体審査あり</text>
  <text class="sub" x="176" y="192" text-anchor="middle">審査請求が必要</text>
  <text x="320" y="176" text-anchor="middle" font-size="12" fill="#d4a017" font-weight="bold">無審査登録</text>
  <text class="sub" x="320" y="192" text-anchor="middle">方式審査のみ</text>
  <line x1="12" y1="204" x2="388" y2="204" stroke="#d7d7d7" stroke-width="1"/>

  <!-- 行4: 存続期間 -->
  <text class="axis" x="12" y="234">存続期間</text>
  <text x="176" y="232" text-anchor="middle" font-size="15" fill="#1a3a5c" font-weight="bold">出願から20年</text>
  <text x="320" y="232" text-anchor="middle" font-size="15" fill="#1a3a5c" font-weight="bold">出願から10年</text>
  <line x1="12" y1="250" x2="388" y2="250" stroke="#d7d7d7" stroke-width="1"/>

  <!-- 行5: 権利化スピード -->
  <text class="axis" x="12" y="280">権利化まで</text>
  <text class="val" x="176" y="278" text-anchor="middle">平均 約14か月</text>
  <text x="320" y="278" text-anchor="middle" font-size="12" fill="#3a7d44" font-weight="bold">約2〜4か月（速い）</text>
  <line x1="12" y1="294" x2="388" y2="294" stroke="#d7d7d7" stroke-width="1"/>

  <!-- 行6: 権利行使 -->
  <text class="axis" x="12" y="324">権利行使</text>
  <text class="val" x="176" y="322" text-anchor="middle">登録後すぐ可能</text>
  <text x="320" y="316" text-anchor="middle" font-size="12" fill="#b22234" font-weight="bold">技術評価書が必要</text>
  <text class="sub" x="320" y="332" text-anchor="middle">提示・警告が前提</text>
  <line x1="12" y1="344" x2="388" y2="344" stroke="#d7d7d7" stroke-width="1"/>

  <!-- 行7: 費用 -->
  <text class="axis" x="12" y="372">費用</text>
  <text class="val" x="176" y="372" text-anchor="middle">比較的高い</text>
  <text x="320" y="372" text-anchor="middle" font-size="12" fill="#3a7d44" font-weight="bold">比較的低い</text>

  <!-- まとめ帯 -->
  <rect x="12" y="396" width="376" height="92" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <text x="200" y="418" text-anchor="middle" font-size="12" fill="#1a3a5c" font-weight="bold">ひとことで言うと</text>
  <text x="24" y="440" font-size="11" fill="#222">特許 ＝ 高度な発明を、審査を経てしっかり保護（強い）</text>
  <text x="24" y="460" font-size="11" fill="#222">実用新案 ＝ 物品の小さな工夫を、速く・安く保護</text>
  <text x="24" y="480" font-size="11" fill="#d4a017">ただし無審査ゆえ権利は不安定（評価書が必要）</text>
</svg>
