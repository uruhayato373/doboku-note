  <svg width="400" height="500" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" style="max-width:400px;width:100%" role="img" aria-label="バスタブカーブ">
    <defs>
      <marker id="a5" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5 z" fill="#222"/></marker>
    </defs>
    <!-- 軸 -->
    <line x1="50" y1="240" x2="375" y2="240" stroke="#222" stroke-width="2" marker-end="url(#a5)"/>
    <line x1="50" y1="240" x2="50" y2="40" stroke="#222" stroke-width="2" marker-end="url(#a5)"/>
    <text x="388" y="244" text-anchor="end" fill="#222" font-size="12">時間</text>
    <text x="28" y="36" fill="#222" font-size="12">故障率</text>
    <!-- バスタブカーブ -->
    <path d="M 54 70 C 70 70 90 225 130 228" stroke="#222" stroke-width="3" fill="none"/>
    <line x1="130" y1="228" x2="260" y2="228" stroke="#222" stroke-width="3"/>
    <path d="M 260 228 C 305 228 345 110 368 65" stroke="#222" stroke-width="3" fill="none"/>
    <!-- 区切り縦線 -->
    <line x1="130" y1="228" x2="130" y2="240" stroke="#555" stroke-width="1.2" stroke-dasharray="4,3"/>
    <line x1="260" y1="228" x2="260" y2="240" stroke="#555" stroke-width="1.2" stroke-dasharray="4,3"/>
    <!-- 期間ラベル（軸上） -->
    <text x="90" y="258" text-anchor="middle" fill="#222" font-size="12">A期間</text>
    <text x="195" y="258" text-anchor="middle" fill="#222" font-size="12">B期間</text>
    <text x="314" y="258" text-anchor="middle" fill="#222" font-size="12">C期間</text>
    <!-- 期間の説明 -->
    <text x="90" y="274" text-anchor="middle" fill="#555" font-size="11">初期故障期間</text>
    <text x="195" y="274" text-anchor="middle" fill="#555" font-size="11">偶発故障期間</text>
    <text x="314" y="274" text-anchor="middle" fill="#555" font-size="11">摩耗故障期間</text>
    <!-- 下部サマリー -->
    <rect x="20" y="360" width="360" height="120" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1" rx="4"/>
    <text x="200" y="388" text-anchor="middle" font-size="13" fill="#222" font-weight="bold">3 期間の特徴</text>
    <text x="35" y="412" font-size="12" fill="#555">A 初期故障：設計・製造上の欠陥が原因</text>
    <text x="35" y="434" font-size="12" fill="#555">B 偶発故障：予測困難・定率で発生</text>
    <text x="35" y="456" font-size="12" fill="#555">C 摩耗故障：経年劣化・予防保全が有効</text>
  </svg>