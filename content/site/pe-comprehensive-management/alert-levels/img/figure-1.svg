<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" width="400" height="500" role="img" aria-label="警戒レベル5段階と避難行動。レベル1心構えからレベル5緊急安全確保まで、切迫度に応じた住民行動と発令主体を示すラダー図">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-sub    { font-size: 11px; fill: #8a8a8a; }
      .t-num    { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-label  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-action { font-size: 11px; fill: #555; }
      .t-issuer { font-size: 11px; fill: #8a8a8a; }
      .t-axis   { font-size: 11px; font-weight: bold; fill: #8a8a8a; }
      .box-lv1  { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .badge-lv1 { fill: #ffffff; stroke: #3a7d44; stroke-width: 1.5; }
      .box-lv2  { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .badge-lv2 { fill: #ffffff; stroke: #2e6da4; stroke-width: 1.5; }
      .box-lv3  { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .badge-lv3 { fill: #ffffff; stroke: #d4a017; stroke-width: 1.5; }
      .box-lv4  { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .badge-lv4 { fill: #ffffff; stroke: #b22234; stroke-width: 1.5; }
      .box-lv5  { fill: #f8d7da; stroke: #b22234; stroke-width: 2; }
      .badge-lv5 { fill: #ffffff; stroke: #b22234; stroke-width: 2; }
      .t-num-lv5 { font-size: 15px; font-weight: bold; fill: #b22234; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 9,3.5 0,7" fill="#8a8a8a"/>
    </marker>
  </defs>

  <!-- サブ見出し -->
  <text class="t-sub" x="200" y="13" text-anchor="middle">2021年災害対策基本法改正後の体系</text>

  <!-- 切迫度軸 -->
  <text class="t-axis" x="20" y="32" text-anchor="middle">低</text>
  <line x1="20" y1="38" x2="20" y2="458" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="t-axis" x="20" y="476" text-anchor="middle">高</text>
  <text class="t-axis" x="20" y="260" text-anchor="middle" transform="rotate(-90,20,260)">切迫度</text>

  <!-- === Level 1 === -->
  <rect class="box-lv1" x="38" y="20" width="350" height="74" rx="8"/>
  <circle class="badge-lv1" cx="62" cy="57" r="15"/>
  <text class="t-num"    x="62" y="62" text-anchor="middle">1</text>
  <text class="t-label"  x="86" y="40">心構えを高める</text>
  <text class="t-issuer" x="86" y="56">発令主体：気象庁</text>
  <text class="t-action" x="86" y="72">最新の防災気象情報に注意し災害への心構えを高める</text>

  <!-- === Level 2 === -->
  <rect class="box-lv2" x="38" y="100" width="350" height="74" rx="8"/>
  <circle class="badge-lv2" cx="62" cy="137" r="15"/>
  <text class="t-num"    x="62" y="142" text-anchor="middle">2</text>
  <text class="t-label"  x="86" y="120">避難行動を確認する</text>
  <text class="t-issuer" x="86" y="136">発令主体：気象庁</text>
  <text class="t-action" x="86" y="152">ハザードマップで避難場所・経路・タイミングを再確認</text>

  <!-- === Level 3 === -->
  <rect class="box-lv3" x="38" y="180" width="350" height="74" rx="8"/>
  <circle class="badge-lv3" cx="62" cy="217" r="15"/>
  <text class="t-num"    x="62" y="222" text-anchor="middle">3</text>
  <text class="t-label"  x="86" y="200">高齢者等避難</text>
  <text class="t-issuer" x="86" y="216">発令主体：市町村長</text>
  <text class="t-action" x="86" y="232">避難に時間を要する高齢者・障がい者等は避難を開始</text>

  <!-- === Level 4 === -->
  <rect class="box-lv4" x="38" y="260" width="350" height="74" rx="8"/>
  <circle class="badge-lv4" cx="62" cy="297" r="15"/>
  <text class="t-num"    x="62" y="302" text-anchor="middle">4</text>
  <text class="t-label"  x="86" y="280">避難指示（全員避難）</text>
  <text class="t-issuer" x="86" y="296">発令主体：市町村長</text>
  <text class="t-action" x="86" y="312">危険な場所にいる全員が指定緊急避難場所等へ避難</text>

  <!-- === Level 5 === -->
  <rect class="box-lv5" x="38" y="340" width="350" height="88" rx="8"/>
  <circle class="badge-lv5" cx="62" cy="384" r="15"/>
  <text class="t-num-lv5" x="62" y="389" text-anchor="middle">5</text>
  <text class="t-label"  x="86" y="362">緊急安全確保（最終手段）</text>
  <text class="t-issuer" x="86" y="378">発令主体：市町村長（可能な範囲）</text>
  <text class="t-action" x="86" y="394">既に災害が発生・切迫。命を守る最善の行動をとる</text>
  <text class="t-action" x="86" y="411">※発令を待たず行動することが原則</text>

  <!-- footer -->
  <text class="t-sub" x="200" y="448" text-anchor="middle">レベル1〜2 気象庁発令｜レベル3〜5 市町村長発令</text>
  <text class="t-sub" x="200" y="463" text-anchor="middle">レベル4までに全員避難が基本（レベル5は発令できない状況が多い）</text>
  <text class="t-sub" x="200" y="489" text-anchor="middle">出典：内閣府 警戒レベルに関する説明資料</text>
</svg>
