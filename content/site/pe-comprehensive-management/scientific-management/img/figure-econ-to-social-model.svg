<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="経済人モデルから社会人モデルへの発展：科学的管理法は人を金銭で動く経済人とみなし作業の標準化と差別的出来高給で生産性を上げたが感情や社会的欲求を軽視した。ホーソン実験がその限界を指摘し、人間関係論は人を人間関係で動く社会人とみなす社会人モデルを示した" font-family='Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif'>
  <rect width="400" height="500" fill="#ffffff" stroke="#d7d7d7"/>

  <text x="200" y="26" text-anchor="middle" font-size="11" fill="#555">科学的管理法 から 人間関係論 への発展</text>

  <!-- Card A: 科学的管理法 -->
  <rect x="12" y="54" width="376" height="150" fill="#ffffff" stroke="#2e6da4"/>
  <rect x="12" y="54" width="376" height="32" fill="#e8f0fe" stroke="#2e6da4"/>
  <text x="200" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3a5c">科学的管理法（テイラー）</text>
  <text x="24" y="110" font-size="12" fill="#222"><tspan font-weight="bold" fill="#2e6da4">人間観</tspan>：経済人モデル（人は金銭で動く）</text>
  <text x="24" y="135" font-size="12" fill="#222"><tspan font-weight="bold" fill="#2e6da4">動機</tspan>：金銭的報酬・差別的出来高給</text>
  <text x="24" y="160" font-size="12" fill="#222"><tspan font-weight="bold" fill="#2e6da4">方法</tspan>：作業の標準化・課業管理</text>
  <text x="24" y="185" font-size="12" fill="#222"><tspan font-weight="bold" fill="#b22234">限界</tspan>：感情・社会的欲求を軽視</text>

  <!-- bridge -->
  <text x="200" y="228" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b22234">↓ ホーソン実験が「経済人モデル」の限界を指摘</text>

  <!-- Card B: 人間関係論 -->
  <rect x="12" y="244" width="376" height="150" fill="#ffffff" stroke="#3a7d44"/>
  <rect x="12" y="244" width="376" height="32" fill="#d0e8d0" stroke="#3a7d44"/>
  <text x="200" y="265" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3a5c">人間関係論（メイヨー／ホーソン実験）</text>
  <text x="24" y="300" font-size="12" fill="#222"><tspan font-weight="bold" fill="#3a7d44">人間観</tspan>：社会人モデル（人は人間関係で動く）</text>
  <text x="24" y="325" font-size="12" fill="#222"><tspan font-weight="bold" fill="#3a7d44">動機</tspan>：承認・所属・良好な人間関係</text>
  <text x="24" y="350" font-size="12" fill="#222"><tspan font-weight="bold" fill="#3a7d44">方法</tspan>：職場のモラール・人間関係の重視</text>
  <text x="24" y="375" font-size="12" fill="#222"><tspan font-weight="bold" fill="#3a7d44">発見</tspan>：心理・社会的要因が生産性を左右</text>

  <!-- bottom band -->
  <rect x="12" y="408" width="376" height="78" fill="#f5f5f5" stroke="#d7d7d7" rx="2"/>
  <text x="200" y="431" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">総監：両面からのマネジメントが必要</text>
  <text x="200" y="452" text-anchor="middle" font-size="11" fill="#555">物理的条件の最適化 ＋ 人間関係・心理への配慮</text>
  <text x="200" y="472" text-anchor="middle" font-size="11" fill="#555">両者は対立でなく補完の関係</text>
</svg>
