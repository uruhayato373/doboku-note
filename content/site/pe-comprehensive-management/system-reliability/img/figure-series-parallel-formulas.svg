  <svg width="400" height="500" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="12" style="max-width:400px;width:100%" role="img" aria-label="直列・並列信頼度の計算式">
    <!-- 直列 -->
    <rect x="10" y="20" width="180" height="130" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
    <text x="100" y="46" text-anchor="middle" fill="#1a3a5c" font-weight="bold" font-size="14">直列</text>
    <text x="100" y="72" text-anchor="middle" fill="#222" font-size="13">信頼度 = a₁ × a₂</text>
    <!-- 直列図 -->
    <rect x="20" y="84" width="50" height="30" rx="3" fill="#555" stroke="#222"/>
    <text x="45" y="103" text-anchor="middle" fill="#ffffff" font-size="12">a₁</text>
    <rect x="130" y="84" width="50" height="30" rx="3" fill="#555" stroke="#222"/>
    <text x="155" y="103" text-anchor="middle" fill="#ffffff" font-size="12">a₂</text>
    <line x1="10" y1="99" x2="20" y2="99" stroke="#555" stroke-width="1.5"/>
    <line x1="70" y1="99" x2="130" y2="99" stroke="#555" stroke-width="1.5"/>
    <line x1="180" y1="99" x2="190" y2="99" stroke="#555" stroke-width="1.5"/>
    <text x="100" y="140" text-anchor="middle" fill="#555" font-size="11">弱いリンクで決まる</text>

    <!-- 並列 -->
    <rect x="210" y="20" width="180" height="130" rx="6" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
    <text x="300" y="46" text-anchor="middle" fill="#1a3a5c" font-weight="bold" font-size="14">並列</text>
    <text x="300" y="68" text-anchor="middle" fill="#222" font-size="11">信頼度 = 1－(1－a₁)×(1－a₂)</text>
    <!-- 並列図 -->
    <line x1="218" y1="99" x2="240" y2="99" stroke="#555" stroke-width="1.5"/>
    <circle cx="240" cy="99" r="3" fill="#222"/>
    <line x1="240" y1="99" x2="240" y2="83" stroke="#555" stroke-width="1.2"/>
    <line x1="240" y1="83" x2="260" y2="83" stroke="#555" stroke-width="1.2"/>
    <rect x="260" y="75" width="40" height="18" rx="3" fill="#555" stroke="#555"/>
    <text x="280" y="87" text-anchor="middle" fill="#ffffff" font-size="10">a₁</text>
    <line x1="300" y1="83" x2="350" y2="83" stroke="#555" stroke-width="1.2"/>
    <line x1="240" y1="99" x2="240" y2="115" stroke="#555" stroke-width="1.2"/>
    <line x1="240" y1="115" x2="260" y2="115" stroke="#555" stroke-width="1.2"/>
    <rect x="260" y="107" width="40" height="18" rx="3" fill="#555" stroke="#555"/>
    <text x="280" y="119" text-anchor="middle" fill="#ffffff" font-size="10">a₂</text>
    <line x1="300" y1="115" x2="350" y2="115" stroke="#555" stroke-width="1.2"/>
    <line x1="350" y1="83" x2="350" y2="115" stroke="#555" stroke-width="1.2"/>
    <circle cx="350" cy="99" r="3" fill="#222"/>
    <line x1="350" y1="99" x2="388" y2="99" stroke="#555" stroke-width="1.5"/>
    <text x="300" y="140" text-anchor="middle" fill="#555" font-size="11">1 つ生きれば機能</text>

    <!-- 区切り -->
    <line x1="20" y1="168" x2="380" y2="168" stroke="#d7d7d7" stroke-width="1"/>

    <!-- 計算例 -->
    <text x="200" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3a5c">計算例（a₁ = a₂ = 0.9）</text>

    <rect x="20" y="210" width="170" height="80" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
    <text x="105" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">直列の場合</text>
    <text x="105" y="254" text-anchor="middle" font-size="12" fill="#222">0.9 × 0.9</text>
    <text x="105" y="274" text-anchor="middle" font-size="14" font-weight="bold" fill="#b22234">= 0.81</text>

    <rect x="210" y="210" width="170" height="80" rx="6" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
    <text x="295" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">並列の場合</text>
    <text x="295" y="254" text-anchor="middle" font-size="11" fill="#222">1 − (0.1 × 0.1)</text>
    <text x="295" y="274" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a7d44">= 0.99</text>

    <!-- 区切り -->
    <line x1="20" y1="308" x2="380" y2="308" stroke="#d7d7d7" stroke-width="1"/>

    <!-- ポイント -->
    <text x="200" y="336" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3a5c">直列 vs 並列の比較</text>
    <rect x="20" y="350" width="360" height="80" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
    <text x="30" y="372" font-size="11" fill="#555">・直列: 要素が増えるほど信頼度が低下（0.9ⁿ）</text>
    <text x="30" y="392" font-size="11" fill="#555">・並列: 要素が増えるほど信頼度が向上</text>
    <text x="30" y="412" font-size="11" fill="#555">・並列化がシステム全体の信頼性向上に有効</text>

    <text x="200" y="458" text-anchor="middle" font-size="11" fill="#555">冗長化とセットで総監「安全管理」頻出問題</text>
  </svg>
