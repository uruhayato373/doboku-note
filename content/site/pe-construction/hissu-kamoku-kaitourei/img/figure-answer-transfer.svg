<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="完成答案と設問を照合し、論点を骨子に圧縮する。別の設問で自分の答案へ展開し、条件と照合して修正する学習の流れ。"><defs><style>text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#1a3a5c}</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4"/></marker></defs><!-- brand / positive / warn fills; ink-strong text --><text x="200" y="28" font-size="17" font-weight="bold" text-anchor="middle">完成答案を、自分で使える骨子へ</text><rect x="28" y="48" width="312" height="80" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/><text x="184" y="80" font-size="18" font-weight="bold" text-anchor="middle">完成答案 ＋ 元の設問</text><text x="184" y="107" font-size="14" font-weight="normal" text-anchor="middle">どの問いに、どの段落が答えたか</text><path d="M184 129 L184 150" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="28" y="152" width="312" height="80" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/><text x="184" y="184" font-size="18" font-weight="bold" text-anchor="middle">観点・論点を抜き出す</text><text x="184" y="211" font-size="14" font-weight="normal" text-anchor="middle">文章を短い骨子へ圧縮</text><path d="M184 233 L184 254" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="28" y="256" width="312" height="80" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/><text x="184" y="288" font-size="18" font-weight="bold" text-anchor="middle">別の設問の条件で書く</text><text x="184" y="315" font-size="14" font-weight="normal" text-anchor="middle">根拠を確認できる事例・数値で展開</text><path d="M184 337 L184 358" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="28" y="360" width="312" height="80" rx="8" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/><text x="184" y="392" font-size="18" font-weight="bold" text-anchor="middle">新しい設問と照合する</text><text x="184" y="419" font-size="14" font-weight="normal" text-anchor="middle">条件・項目・論理の抜けを確認</text><path d="M342 400 H369 V296 H345" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/><text x="200" y="477" font-size="15" font-weight="bold" text-anchor="middle">ずれがあれば、骨子と根拠を見直す</text></svg>
