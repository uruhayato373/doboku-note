<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="720字を目的と立場、課題、提案と判断、成果と評価に配分した帯。提案と判断が最も厚い" style="max-width:400px;width:100%">
<defs><style>
text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#222} /* ink-strong */
.h{font-size:15px;font-weight:bold}.t{font-size:13px;fill:#555}.s{font-size:12px;fill:#555} /* ink-body */
.n{font-size:14px;font-weight:bold}
.f{fill:#f5f5f5;stroke:#d7d7d7;stroke-width:1.5} /* surface */
.b{fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5} /* brand */
.g{fill:#d0e8d0;stroke:#3a7d44;stroke-width:1.5} /* positive */
.w{fill:#fff3cd;stroke:#d4a017;stroke-width:1.5} /* warn */
.l{stroke:#d7d7d7;stroke-width:1;fill:none} /* token-border */
</style></defs>
<text x="24" y="30" class="s">上から書く順（目安の字数）</text>
<rect x="24" y="42" width="120" height="72" class="f"/>
<text x="84" y="84" text-anchor="middle" class="n">約130字</text>
<rect x="24" y="114" width="120" height="83" class="b"/>
<text x="84" y="160" text-anchor="middle" class="n">約150字</text>
<rect x="24" y="197" width="120" height="150" class="g"/>
<text x="84" y="277" text-anchor="middle" class="n">約270字</text>
<rect x="24" y="347" width="120" height="94" class="w"/>
<text x="84" y="398" text-anchor="middle" class="n">約170字</text>
<path d="M148 78 H160 M148 155 H160 M148 272 H160 M148 394 H160" class="l"/>
<text x="166" y="72" class="h">目的・立場と役割</text>
<text x="166" y="92" class="t">誰の立場で、何を決める役か</text>
<text x="166" y="149" class="h">課題</text>
<text x="166" y="169" class="t">なぜその課題を選んだか</text>
<text x="166" y="266" class="h">提案と判断</text>
<text x="166" y="286" class="t">比較した案と採用の理由</text>
<text x="166" y="382" class="h">成果と評価</text>
<text x="166" y="402" class="t">技術面を軸に確かめ、</text>
<text x="166" y="420" class="t">経済・社会環境面は一句</text>
<line x1="24" y1="458" x2="144" y2="458" class="l"/>
<text x="84" y="480" text-anchor="middle" class="n">合計 720字以内</text>
</svg>
