<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="中心拠点と地域拠点へ生活機能を集め、公共交通で接続するコンパクトプラスネットワークの概念" style="max-width:400px;width:100%"><defs><style>text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#222}.h{font-size:17px;font-weight:bold}.t{font-size:14px}.s{font-size:13px;fill:#555}.b{fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5}.g{fill:#d0e8d0;stroke:#3a7d44;stroke-width:1.5}.w{fill:#fff3cd;stroke:#d4a017;stroke-width:1.5}.n{fill:#f5f5f5;stroke:#d7d7d7;stroke-width:1}.a{fill:none;stroke:#2e6da4;stroke-width:2;marker-end:url(#arrow)}.l{fill:none;stroke:#555;stroke-width:1.5}</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4"/></marker></defs><path d="M200 160 L80 326" class="l"/><path d="M200 160 L320 326" class="l"/><path d="M80 326 L320 326" class="l"/><circle cx="200" cy="160" r="84" class="g"/><text x="200" y="147" class="h" text-anchor="middle">中心拠点</text><text x="200" y="177" class="t" text-anchor="middle">医療・商業・行政</text><circle cx="80" cy="326" r="62" class="b"/><circle cx="320" cy="326" r="62" class="b"/><text x="80" y="319" class="h" text-anchor="middle">地域拠点</text><text x="80" y="343" class="t" text-anchor="middle">生活サービス</text><text x="320" y="319" class="h" text-anchor="middle">地域拠点</text><text x="320" y="343" class="t" text-anchor="middle">生活サービス</text><text x="200" y="262" class="t" text-anchor="middle">公共交通で接続</text><text x="200" y="430" class="h" text-anchor="middle">集約と移動手段を一緒に設計</text><text x="200" y="467" class="s" text-anchor="middle">概念図：実際の拠点配置・路線は地域ごとに検討</text></svg>
