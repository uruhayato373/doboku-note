<svg width="400" height="500" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="建設工事の排出を上流の資材、現場の燃料と電力、下流の供用解体の順に区分し、スコープ1から3と発注者の関与を示す図">
<defs>
<style>
text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
.g { text-anchor: middle; fill: #222; font-size: 13px; }
.t { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
.s { font-size: 11px; fill: #555; }
.h { font-size: 12px; fill: #1a3a5c; }
.b1 { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
.b2 { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
.b3 { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
.ar { stroke: #555; stroke-width: 1.5; fill: none; }
</style>
<marker id="arrow" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#555"/></marker>
</defs>
<rect class="b1" x="20" y="20" width="360" height="130" rx="8"/>
<rect class="b2" x="20" y="190" width="360" height="130" rx="8"/>
<rect class="b3" x="20" y="360" width="360" height="130" rx="8"/>
<line class="ar" x1="200" y1="150" x2="200" y2="188" marker-end="url(#arrow)"/>
<line class="ar" x1="200" y1="320" x2="200" y2="358" marker-end="url(#arrow)"/>
<g class="g">
<text class="t" x="200" y="48">上流：スコープ3</text>
<text x="200" y="76">資材の製造・運搬</text>
<text class="s" x="200" y="98">セメント・鋼材・アスファルトなど</text>
<text class="s" x="200" y="116">カテゴリ1 購入した製品／カテゴリ4 上流の輸送</text>
<text class="h" x="200" y="138">発注者は低炭素資材の調達で間接的に促す</text>
<text class="t" x="200" y="218">現場：スコープ1・2</text>
<text x="200" y="246">建設機械の燃料の燃焼（スコープ1）</text>
<text x="200" y="270">仮設などの購入電力（スコープ2）</text>
<text class="s" x="200" y="292">電動化・燃費基準達成機械・次世代燃料が論点</text>
<text class="h" x="200" y="310">発注者は機械の調達選定で減らせる</text>
<text class="t" x="200" y="388">下流：スコープ3</text>
<text x="200" y="416">完成後の供用・解体時の排出</text>
<text class="s" x="200" y="438">設計と仕様の選択が長期の排出量に関わる</text>
<text class="s" x="200" y="456">維持管理のしやすさ・耐久性も関係する</text>
</g>
</svg>
