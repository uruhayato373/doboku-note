<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="ノズルが材料を一層ずつ積み重ねて造形する様子と、積層の過程が品質に影響する点" style="max-width:400px;width:100%">
<defs><style>
text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#222;font-size:13px} /* ink-strong */
.h{font-size:15px;font-weight:bold}.s{fill:#555} /* ink-body */
.b{fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5} /* brand */
.w{fill:#fff3cd;stroke:#d4a017;stroke-width:1.5} /* warn */
.m{fill:#f5f5f5;stroke:#d7d7d7;stroke-width:1.5} /* surface */
.l{fill:none;stroke:#555;stroke-width:1.5} /* ink-body */
.a{fill:none;stroke:#2e6da4;stroke-width:2;marker-end:url(#arrow)} /* brand */
</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4"/></marker></defs>
<rect x="60" y="410" width="180" height="30" rx="4" class="m"/>
<rect x="60" y="370" width="180" height="40" class="b"/>
<rect x="60" y="330" width="180" height="40" class="b"/>
<rect x="60" y="290" width="180" height="40" class="b"/>
<rect x="60" y="250" width="180" height="40" class="b"/>
<rect x="60" y="210" width="110" height="40" class="w"/>
<polygon points="145,130 185,130 173,205 157,205" class="m"/>
<text x="165" y="118" text-anchor="middle" class="h">ノズル</text>
<path d="M200 168 H250" class="a"/>
<text x="258" y="173" class="s">移動</text>
<path d="M35 400 V225" class="a"/>
<text x="12" y="198" class="s">積み上げ</text>
<text x="150" y="430" text-anchor="middle" class="s">土台</text>
<path d="M170 230 H250" class="l"/>
<text x="258" y="235" class="s">未硬化の層</text>
<path d="M240 330 H250" class="l"/>
<text x="258" y="326" class="h">層の継ぎ目</text>
<text x="258" y="346" class="s">強度に差が</text>
<text x="258" y="364" class="s">出ることも</text>
<path d="M240 390 H250" class="l"/>
<text x="258" y="388" class="s">表面に</text>
<text x="258" y="406" class="s">積層模様</text>
<text x="200" y="475" text-anchor="middle" class="h">一層ずつ積んで造形</text>
</svg>
