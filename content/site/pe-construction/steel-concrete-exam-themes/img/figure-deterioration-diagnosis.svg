<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="コンクリートの変状から原因の仮説を立て、調査で確かめて診断し、劣化程度と供用条件に応じた対策を選び、施工後も点検する。"><defs><style>text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#1a3a5c}</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4"/></marker></defs><!-- brand / positive / warn fills; ink-strong text --><text x="200" y="26" font-size="16" font-weight="bold" text-anchor="middle">ひび割れの見た目だけで原因を決めない</text><rect x="24" y="43" width="352" height="69" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/><text x="200" y="71" font-size="18" font-weight="bold" text-anchor="middle">変状を記録</text><text x="200" y="96" font-size="15" font-weight="normal" text-anchor="middle">位置・幅・範囲・進行の有無</text><path d="M200 113 L200 127" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="129" width="352" height="69" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/><text x="200" y="157" font-size="18" font-weight="bold" text-anchor="middle">原因の仮説を立てる</text><text x="200" y="182" font-size="15" font-weight="normal" text-anchor="middle">塩害／中性化／ASRなどを検討</text><path d="M200 199 L200 213" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="215" width="352" height="69" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/><text x="200" y="243" font-size="18" font-weight="bold" text-anchor="middle">必要な調査で確かめる</text><text x="200" y="268" font-size="15" font-weight="normal" text-anchor="middle">環境・材料・内部状態を照合</text><path d="M200 285 L200 299" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="301" width="352" height="69" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/><text x="200" y="329" font-size="18" font-weight="bold" text-anchor="middle">診断に合う対策を選ぶ</text><text x="200" y="354" font-size="15" font-weight="normal" text-anchor="middle">原因・劣化の程度・供用条件で判断</text><path d="M200 371 L200 385" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="387" width="352" height="69" rx="8" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/><text x="200" y="415" font-size="18" font-weight="bold" text-anchor="middle">施工後も再評価</text><text x="200" y="440" font-size="15" font-weight="normal" text-anchor="middle">効果と再劣化を点検</text><text x="200" y="485" font-size="14" font-weight="normal" text-anchor="middle">表面の補修だけで原因が除かれるとは限らない</text></svg>
