<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="予算が各省庁の見積から閣議決定、国会の議決、執行、会計検査院の検査、決算の国会提出まで進む流れを縦に並べた図">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t { font-size: 15px; font-weight: bold; fill: #1a3a5c; } /* brand text */
      .b { font-size: 12px; fill: #222; } /* ink-strong */
      .g { font-size: 11px; fill: #555; text-anchor: end; } /* ink-body */
      .r { stroke-width: 1.5; }
      .n { fill: #e8f0fe; stroke: #2e6da4; } /* brand */
      .w { fill: #fff3cd; stroke: #d4a017; } /* warn */
      .p { fill: #d0e8d0; stroke: #3a7d44; } /* positive */
      .s { fill: #f5f5f5; stroke: #d7d7d7; } /* surface */
      .a { fill: #2e6da4; } /* brand */
    </style>
  </defs>
  <rect class="r n" x="24" y="28" width="352" height="50" rx="8"/>
  <text class="t" x="36" y="50">各省庁</text>
  <text class="b" x="36" y="69">経費の見積書類を財務大臣へ送る</text>
  <text class="g" x="366" y="50">財政法17条</text>
  <line x1="200" y1="80" x2="200" y2="86" stroke="#2e6da4" stroke-width="1.5"/>
  <path class="a" d="M200 95 l-4 -8 h8 z"/>
  <rect class="r n" x="24" y="96" width="352" height="50" rx="8"/>
  <text class="t" x="36" y="118">財務省・内閣</text>
  <text class="b" x="36" y="137">調整して予算案を作り、閣議で決める</text>
  <text class="g" x="366" y="118">18・21条</text>
  <line x1="200" y1="148" x2="200" y2="154" stroke="#2e6da4" stroke-width="1.5"/>
  <path class="a" d="M200 163 l-4 -8 h8 z"/>
  <rect class="r w" x="24" y="164" width="352" height="50" rx="8"/>
  <text class="t" x="36" y="186">国会</text>
  <text class="b" x="36" y="205">前年度の1月中に提出され、議決する</text>
  <text class="g" x="366" y="186">27条</text>
  <line x1="200" y1="216" x2="200" y2="222" stroke="#2e6da4" stroke-width="1.5"/>
  <path class="a" d="M200 231 l-4 -8 h8 z"/>
  <rect class="r p" x="24" y="232" width="352" height="50" rx="8"/>
  <text class="t" x="36" y="254">各省庁</text>
  <text class="b" x="36" y="273">成立した予算を執行する（契約・支出）</text>
  <line x1="200" y1="284" x2="200" y2="290" stroke="#2e6da4" stroke-width="1.5"/>
  <path class="a" d="M200 299 l-4 -8 h8 z"/>
  <rect class="r n" x="24" y="300" width="352" height="50" rx="8"/>
  <text class="t" x="36" y="322">会計検査院</text>
  <text class="b" x="36" y="341">歳入歳出の決算を検査する</text>
  <line x1="200" y1="352" x2="200" y2="358" stroke="#2e6da4" stroke-width="1.5"/>
  <path class="a" d="M200 367 l-4 -8 h8 z"/>
  <rect class="r w" x="24" y="368" width="352" height="50" rx="8"/>
  <text class="t" x="36" y="390">内閣から国会へ</text>
  <text class="b" x="36" y="409">検査を経た決算を翌年度の常会に提出</text>
  <text class="g" x="366" y="390">40条</text>
  <rect class="r s" x="24" y="438" width="352" height="50" rx="8"/>
  <text class="t" x="36" y="460">年度の途中で変えるとき</text>
  <text class="b" x="36" y="479">補正予算（29条）・暫定予算（30条）</text>
</svg>
