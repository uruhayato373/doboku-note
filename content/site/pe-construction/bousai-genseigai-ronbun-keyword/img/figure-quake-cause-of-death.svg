<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="阪神・淡路大震災は建物倒壊などが83.3%、東日本大震災は溺死が90%以上を占めた死因の比較図">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t { font-size: 15px; font-weight: bold; fill: #1a3a5c; } /* brand text */
      .b { font-size: 13px; fill: #222; } /* ink-strong */
      .v { font-size: 13px; font-weight: bold; fill: #222; } /* ink-strong */
      .g { font-size: 11px; fill: #555; } /* ink-body */
      .r { stroke-width: 1.5; }
      .n { fill: #e8f0fe; stroke: #2e6da4; } /* brand */
      .d { fill: #f8d7da; stroke: #b22234; } /* danger */
      .w { fill: #fff3cd; stroke: #d4a017; } /* warn */
      .s { fill: #f5f5f5; stroke: #d7d7d7; } /* surface */
    </style>
  </defs>
  <rect class="r s" x="24" y="24" width="352" height="212" rx="8"/>
  <text class="t" x="40" y="50">阪神・淡路大震災（1995年）</text>
  <text class="g" x="40" y="68">神戸市内の検案による死因（兵庫県監察医）</text>
  <text class="b" x="40" y="98">建物の倒壊による損傷・窒息など</text>
  <rect class="r d" x="40" y="106" width="233" height="18" rx="3"/>
  <text class="v" x="281" y="120">83.3%</text>
  <text class="b" x="40" y="148">焼死</text>
  <rect class="r w" x="40" y="156" width="36" height="18" rx="3"/>
  <text class="v" x="84" y="170">12.8%</text>
  <text class="b" x="40" y="198">不詳</text>
  <rect class="r n" x="40" y="206" width="11" height="18" rx="3"/>
  <text class="v" x="59" y="220">3.9%</text>
  <rect class="r s" x="24" y="250" width="352" height="164" rx="8"/>
  <text class="t" x="40" y="276">東日本大震災（2011年）</text>
  <text class="g" x="40" y="294">岩手・宮城・福島の死因（4月11日時点）</text>
  <text class="b" x="40" y="324">溺死（津波）</text>
  <rect class="r d" x="40" y="332" width="252" height="18" rx="3"/>
  <text class="v" x="300" y="346">90%以上</text>
  <text class="b" x="40" y="374">溺死以外</text>
  <rect class="r n" x="40" y="382" width="28" height="18" rx="3"/>
  <text class="v" x="76" y="396">10%未満</text>
  <rect class="r s" x="24" y="428" width="352" height="60" rx="8"/>
  <text class="b" x="40" y="454">阪神・淡路：建物・構造物の耐震性</text>
  <text class="b" x="40" y="476">東日本：津波からの避難と土地利用</text>
</svg>
