<svg width="400" height="500" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="河川から新たに取水する水力では取水点と放流点の間に減水区間が生じ、既存の水利使用に従属する発電では減水区間が生じないことを比べた図">
<defs>
<style>
text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; fill: #222; font-size: 13px; }
.t { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
.s { font-size: 11px; fill: #555; }
.m { text-anchor: middle; }
.c { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
.w { stroke: #2e6da4; stroke-width: 4; fill: none; }
.d { stroke: #b22234; stroke-width: 4; fill: none; stroke-dasharray: 6 4; }
.p { stroke: #555; stroke-width: 4; fill: none; }
.ph { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
.wr { fill: #555; }
</style>
<marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker>
</defs>
<rect class="c" x="20" y="20" width="360" height="215" rx="8"/>
<path class="w" d="M30 140 H96"/>
<path class="d" d="M96 140 H302"/>
<path class="w" d="M302 140 H370" marker-end="url(#arrow)"/>
<rect class="wr" x="92" y="126" width="8" height="28"/>
<path class="p" d="M96 126 V96 H262"/>
<rect class="ph" x="262" y="80" width="44" height="32" rx="3"/>
<path class="p" d="M302 112 V138"/>
<text class="s m" x="284" y="100">発電所</text>
<text class="s m" x="96" y="172">取水堰</text>
<text class="s m" x="200" y="164" style="fill:#b22234">減水区間</text>
<text class="t" x="40" y="195">新たに取水する水力</text>
<text x="40" y="218">取水点と放流点の間に減水区間ができる</text>
<rect class="c" x="20" y="265" width="360" height="215" rx="8"/>
<text class="s" x="40" y="298">既存の水路・ダム放流・上下水道</text>
<path class="w" d="M30 360 H370" marker-end="url(#arrow)"/>
<rect class="ph" x="170" y="326" width="60" height="32" rx="3"/>
<text class="s m" x="200" y="346">発電所</text>
<text class="s m" x="200" y="388" style="fill:#3a7d44">減水区間は生じない</text>
<text class="t" x="40" y="425">既存の水利使用に従属する水力</text>
<text x="40" y="448">取水量を増やさず、流れの途中で発電する</text>
</svg>
