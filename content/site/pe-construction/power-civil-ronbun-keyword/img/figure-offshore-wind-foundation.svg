<svg width="400" height="500" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="着床式は基礎を海底に固定し、浮体式は浮体をチェーンで海底に係留する洋上風力の基礎形式を縦に並べて比べた図">
<defs>
<style>
text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; fill: #222; font-size: 13px; }
.t { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
.s { font-size: 11px; fill: #555; }
.c { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
.sea { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
.st { fill: #fff; stroke: #555; stroke-width: 1.5; }
.fl { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
.ln { stroke: #555; stroke-width: 1.5; fill: none; }
.bed { stroke: #8a8a8a; stroke-width: 3; }
.gr { fill: #d7d7d7; }
</style>
</defs>
<rect class="c" x="20" y="20" width="360" height="215" rx="8"/>
<rect class="sea" x="30" y="105" width="140" height="45"/>
<rect class="gr" x="30" y="150" width="140" height="60"/>
<line class="bed" x1="30" y1="150" x2="170" y2="150"/>
<rect class="st" x="94" y="102" width="12" height="70"/>
<rect class="st" x="96" y="52" width="8" height="50"/>
<rect class="st" x="90" y="44" width="20" height="8"/>
<line class="ln" x1="100" y1="48" x2="100" y2="28"/>
<line class="ln" x1="100" y1="48" x2="84" y2="58"/>
<line class="ln" x1="100" y1="48" x2="116" y2="58"/>
<text class="t" x="185" y="62">着床式</text>
<text x="185" y="90">基礎を海底に固定</text>
<text x="185" y="112">水深の浅い海域向き</text>
<text class="s" x="185" y="140">施工は作業台船が脚で</text>
<text class="s" x="185" y="156">船体を持ち上げて行う</text>
<rect class="c" x="20" y="265" width="360" height="215" rx="8"/>
<rect class="sea" x="30" y="340" width="140" height="125"/>
<rect class="gr" x="30" y="465" width="140" height="10"/>
<line class="bed" x1="30" y1="465" x2="170" y2="465"/>
<rect class="fl" x="82" y="334" width="36" height="28" rx="3"/>
<rect class="st" x="96" y="292" width="8" height="42"/>
<rect class="st" x="90" y="284" width="20" height="8"/>
<line class="ln" x1="100" y1="288" x2="100" y2="268"/>
<line class="ln" x1="100" y1="288" x2="84" y2="298"/>
<line class="ln" x1="100" y1="288" x2="116" y2="298"/>
<line class="ln" x1="86" y1="362" x2="52" y2="463"/>
<line class="ln" x1="114" y1="362" x2="148" y2="463"/>
<text class="t" x="185" y="312">浮体式</text>
<text x="185" y="340">浮体をチェーンで係留</text>
<text x="185" y="362">水深の深い海域も対象</text>
<text class="s" x="185" y="390">コスト低減が課題</text>
</svg>
