<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="頻度の高い津波は海岸保全施設で守り、最大クラスの津波はハードとソフトで被害を減らすという二つの水準と、守る主役が施設から避難とまちづくりへ移る流れを示した図">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t { font-size: 15px; font-weight: bold; fill: #1a3a5c; } /* brand text */
      .b { font-size: 12px; fill: #222; } /* ink-strong */
      .g { font-size: 11px; fill: #555; text-anchor: end; } /* ink-body */
      .r { stroke-width: 1.5; }
      .p { fill: #d0e8d0; stroke: #3a7d44; } /* positive */
      .n { fill: #e8f0fe; stroke: #2e6da4; } /* brand */
      .w { fill: #fff3cd; stroke: #d4a017; } /* warn */
      .d { fill: #f8d7da; stroke: #b22234; } /* danger */
      .a { fill: #2e6da4; } /* brand */
    </style>
  </defs>
  <rect class="r p" x="24" y="24" width="352" height="112" rx="8"/>
  <text class="t" x="36" y="52">頻度の高い津波</text>
  <text class="g" x="366" y="52">主役はハード</text>
  <text class="b" x="36" y="80">数十年〜百数十年に1回程度</text>
  <text class="b" x="36" y="108">海岸保全施設で背後地を守る</text>
  <line x1="200" y1="138" x2="200" y2="150" stroke="#2e6da4" stroke-width="1.5"/>
  <path class="a" d="M200 163 l-5 -11 h10 z"/>
  <rect class="r w" x="24" y="164" width="352" height="112" rx="8"/>
  <text class="t" x="36" y="192">最大クラスの津波</text>
  <text class="g" x="366" y="192">ハードとソフト</text>
  <text class="b" x="36" y="220">数百年〜千年に1回程度</text>
  <text class="b" x="36" y="248">施設で止めきれない前提で被害を減らす</text>
  <line x1="200" y1="278" x2="200" y2="290" stroke="#2e6da4" stroke-width="1.5"/>
  <path class="a" d="M200 303 l-5 -11 h10 z"/>
  <rect class="r n" x="24" y="304" width="352" height="112" rx="8"/>
  <text class="t" x="36" y="332">守る主役の移り方</text>
  <text class="b" x="36" y="360">施設で守る → 避難とまちづくりで受ける</text>
  <text class="b" x="36" y="388">超えた分は避難先・避難路と土地利用で受け持つ</text>
</svg>
