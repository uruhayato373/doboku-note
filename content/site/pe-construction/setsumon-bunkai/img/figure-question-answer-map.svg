<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="令和7年度必須I-1の条件を全設問に通し、3課題から最重要1課題、複数解決策、新たな懸念と対策、倫理と社会の持続性の要件へ結ぶ。"><defs><style>text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#1a3a5c}</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#2e6da4"/></marker></defs><!-- brand / positive / warn fills; ink-strong text --><rect x="24" y="18" width="352" height="69" rx="8" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/><text x="200" y="44" font-size="18" font-weight="bold" text-anchor="middle">テーマ・到達点・前提条件</text><text x="200" y="70" font-size="15" font-weight="normal" text-anchor="middle">全ての設問を通じて外さない</text><path d="M200 89 L200 107" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="111" width="352" height="72" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/><text x="200" y="141" font-size="17" font-weight="bold" text-anchor="middle">（1）観点 → 技術課題を3つ</text><text x="200" y="165" font-size="15" font-weight="normal" text-anchor="middle">観点を先に明記</text><path d="M200 185 L200 198" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="200" width="352" height="72" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/><text x="200" y="230" font-size="17" font-weight="bold" text-anchor="middle">（2）最重要課題を1つ選ぶ</text><text x="200" y="254" font-size="15" font-weight="normal" text-anchor="middle">選んだ課題に、複数の解決策</text><path d="M200 274 L200 287" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="289" width="352" height="72" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/><text x="200" y="319" font-size="17" font-weight="bold" text-anchor="middle">（3）解決策から生じる懸念</text><text x="200" y="343" font-size="15" font-weight="normal" text-anchor="middle">専門技術を踏まえた対策</text><path d="M200 363 L200 376" fill="none" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="378" width="352" height="72" rx="8" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/><text x="200" y="408" font-size="17" font-weight="bold" text-anchor="middle">（4）業務遂行の要件</text><text x="200" y="432" font-size="15" font-weight="normal" text-anchor="middle">技術者倫理 ＋ 社会の持続性</text><text x="200" y="481" font-size="14" font-weight="normal" text-anchor="middle">令和7年度 必須科目I-1の読み解き例</text></svg>
