<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="大深度地下の範囲を、地下40mと支持地盤上面から10mの二つの深さのうち深い方より下として示す断面の模式図。支持地盤が浅い場合と深い場合を並べる">
<defs><style>
text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;font-size:11px;fill:#555}
.b{font-size:12px;font-weight:bold;fill:#222}
.m{text-anchor:middle}
.d{stroke-dasharray:4 3;fill:none;stroke-width:1.5}
</style></defs>
<text class="b m" x="105" y="40">支持地盤が浅い場合</text>
<text class="b m" x="295" y="40">支持地盤が深い場合</text>
<rect x="20" y="70" width="170" height="330" fill="#f5f5f5" stroke="#d7d7d7"/>
<rect x="210" y="70" width="170" height="330" fill="#f5f5f5" stroke="#d7d7d7"/>
<rect x="20" y="190" width="170" height="210" fill="#fff3cd"/>
<rect x="210" y="250" width="170" height="150" fill="#fff3cd"/>
<line x1="20" y1="70" x2="190" y2="70" stroke="#222" stroke-width="2"/>
<line x1="210" y1="70" x2="380" y2="70" stroke="#222" stroke-width="2"/>
<text x="26" y="64">地表</text><text x="216" y="64">地表</text>
<line x1="20" y1="130" x2="190" y2="130" stroke="#2e6da4" stroke-width="1.5"/>
<line x1="20" y1="160" x2="190" y2="160" class="d" stroke="#2e6da4"/>
<line x1="20" y1="190" x2="190" y2="190" stroke="#b22234" stroke-width="2.5"/>
<text x="26" y="125" style="fill:#1a3a5c">支持地盤上面</text>
<text x="26" y="155" style="fill:#1a3a5c">上面から10m下</text>
<text x="26" y="185" style="fill:#b22234;font-weight:bold">地下40m</text>
<text class="b m" x="105" y="260">大深度地下</text>
<text class="m" x="105" y="278">40mが境界</text>
<line x1="210" y1="190" x2="380" y2="190" class="d" stroke="#555"/>
<line x1="210" y1="220" x2="380" y2="220" stroke="#2e6da4" stroke-width="1.5"/>
<line x1="210" y1="250" x2="380" y2="250" stroke="#b22234" stroke-width="2.5"/>
<text x="216" y="185">地下40m</text>
<text x="216" y="215" style="fill:#1a3a5c">支持地盤上面</text>
<text x="216" y="245" style="fill:#b22234;font-weight:bold">上面から10m下</text>
<text class="b m" x="295" y="310">大深度地下</text>
<text class="m" x="295" y="328">支持地盤が境界</text>
<text class="m" x="200" y="418">支持地盤の深さは例示</text>
</svg>
