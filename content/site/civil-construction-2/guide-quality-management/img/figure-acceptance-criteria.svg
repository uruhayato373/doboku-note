<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="主な受入検査4項目。荷卸し時にスランプ・空気量・塩化物イオン量を確認し、採取した供試体の圧縮強度は所定の材齢で確認する" style="max-width:400px;width:100%">
<defs><style>
text {font-family:Inter,'Noto Sans JP','Hiragino Sans',sans-serif}
.lead {font-size:14px;font-weight:700;fill:#1a3a5c}.name {font-size:16px;font-weight:700;fill:#1a3a5c}.body {font-size:14px;fill:#222}.note {font-size:14px;fill:#555}.card {fill:#f5f5f5;stroke:#d7d7d7;stroke-width:1.2}.range {fill:#d0e8d0;stroke:#3a7d44;stroke-width:1.2}.track {fill:#fff;stroke:#d7d7d7;stroke-width:1.2}
</style><marker id="acceptance-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2e6da4"/></marker></defs>
<text x="200" y="25" text-anchor="middle" class="lead">その場の判定と、後日の強度確認を分ける</text>
<rect x="18" y="42" width="364" height="83" rx="8" class="card"/>
<text x="30" y="66" class="name">スランプ</text><text x="194" y="66" class="body">指定値 ± 許容差</text>
<rect x="40" y="80" width="320" height="12" class="track"/><rect x="157" y="80" width="86" height="12" class="range"/><line x1="200" y1="76" x2="200" y2="96" stroke="#3a7d44" stroke-width="2"/>
<text x="200" y="113" text-anchor="middle" class="note">指定値の周りの範囲で判定</text>
<rect x="18" y="137" width="364" height="83" rx="8" class="card"/>
<text x="30" y="161" class="name">空気量</text><text x="155" y="161" class="body">普通：4.5 ± 1.5 %</text>
<rect x="40" y="175" width="320" height="12" class="track"/><rect x="142" y="175" width="116" height="12" class="range"/><line x1="200" y1="171" x2="200" y2="191" stroke="#3a7d44" stroke-width="2"/>
<text x="200" y="208" text-anchor="middle" class="note">少なすぎ・多すぎの両方を確認</text>
<rect x="18" y="232" width="364" height="83" rx="8" class="card"/>
<text x="30" y="256" class="name">塩化物イオン量</text><text x="317" y="256" class="body">上限</text>
<rect x="40" y="270" width="320" height="12" class="track"/><rect x="40" y="270" width="180" height="12" class="range"/><line x1="220" y1="266" x2="220" y2="286" stroke="#b22234" stroke-width="2.5"/>
<text x="200" y="303" text-anchor="middle" class="body">原則 0.30 kg/m³ 以下</text>
<rect x="18" y="327" width="364" height="91" rx="8" class="card"/>
<text x="30" y="351" class="name">圧縮強度</text><text x="184" y="351" class="body">所定の材齢で確認</text>
<path d="M65 374 H334" fill="none" stroke="#2e6da4" stroke-width="2" marker-end="url(#acceptance-arrow)"/>
<circle cx="65" cy="374" r="4" fill="#2e6da4"/><circle cx="200" cy="374" r="4" fill="#2e6da4"/><circle cx="324" cy="374" r="4" fill="#2e6da4"/>
<text x="65" y="400" text-anchor="middle" class="body">採取</text><text x="200" y="400" text-anchor="middle" class="body">養生</text><text x="324" y="400" text-anchor="middle" class="body">試験</text>
<text x="200" y="447" text-anchor="middle" class="lead">荷卸し時の3項目と、後日の強度を区別</text>
<text x="200" y="473" text-anchor="middle" class="note">指定値・許容差・試験条件は適用規格で確認</text>
</svg>
