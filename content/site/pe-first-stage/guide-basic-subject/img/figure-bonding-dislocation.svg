<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="イオン結合・金属結合・共有結合の原子の並びと、結晶中の刃状転位の模式図。結合の型と転位の動きやすさが、延性と脆さを分ける。"><defs><style>text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;fill:#1a3a5c}.h{font-size:14px;font-weight:bold}.c{font-size:12px;fill:#555}</style></defs><rect x="10" y="15" width="185" height="180" rx="6" fill="#f5f5f5" stroke="#d7d7d7"/><rect x="205" y="15" width="185" height="180" rx="6" fill="#f5f5f5" stroke="#d7d7d7"/><rect x="10" y="210" width="185" height="180" rx="6" fill="#f5f5f5" stroke="#d7d7d7"/><rect x="205" y="210" width="185" height="180" rx="6" fill="#f5f5f5" stroke="#d7d7d7"/><text text-anchor="middle" class="h" x="102.5" y="37">イオン結合</text><text text-anchor="middle" class="c" x="102.5" y="167">静電引力で結びつく</text><text text-anchor="middle" class="c" x="102.5" y="184">ずれると反発して割れる</text><g stroke-width="1.5"><circle cx="72.5" cy="69" r="12" fill="#e8f0fe" stroke="#2e6da4"/><circle cx="102.5" cy="69" r="12" fill="#f8d7da" stroke="#b22234"/><circle cx="132.5" cy="69" r="12" fill="#e8f0fe" stroke="#2e6da4"/><circle cx="72.5" cy="99" r="12" fill="#f8d7da" stroke="#b22234"/><circle cx="102.5" cy="99" r="12" fill="#e8f0fe" stroke="#2e6da4"/><circle cx="132.5" cy="99" r="12" fill="#f8d7da" stroke="#b22234"/><circle cx="72.5" cy="129" r="12" fill="#e8f0fe" stroke="#2e6da4"/><circle cx="102.5" cy="129" r="12" fill="#f8d7da" stroke="#b22234"/><circle cx="132.5" cy="129" r="12" fill="#e8f0fe" stroke="#2e6da4"/></g><g font-size="14" font-weight="bold"><text text-anchor="middle" x="72.5" y="74">+</text><text text-anchor="middle" x="102.5" y="74">−</text><text text-anchor="middle" x="132.5" y="74">+</text><text text-anchor="middle" x="72.5" y="104">−</text><text text-anchor="middle" x="102.5" y="104">+</text><text text-anchor="middle" x="132.5" y="104">−</text><text text-anchor="middle" x="72.5" y="134">+</text><text text-anchor="middle" x="102.5" y="134">−</text><text text-anchor="middle" x="132.5" y="134">+</text></g><text text-anchor="middle" class="h" x="297.5" y="37">金属結合</text><text text-anchor="middle" class="c" x="297.5" y="167">自由電子が全体を結ぶ</text><text text-anchor="middle" class="c" x="297.5" y="184">ずれても結合が保たれる</text><g fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"><circle cx="267.5" cy="69" r="9"/><circle cx="297.5" cy="69" r="9"/><circle cx="327.5" cy="69" r="9"/><circle cx="267.5" cy="99" r="9"/><circle cx="297.5" cy="99" r="9"/><circle cx="327.5" cy="99" r="9"/><circle cx="267.5" cy="129" r="9"/><circle cx="297.5" cy="129" r="9"/><circle cx="327.5" cy="129" r="9"/></g><g fill="#d4a017"><circle cx="282.5" cy="69" r="2.5"/><circle cx="312.5" cy="69" r="2.5"/><circle cx="282.5" cy="99" r="2.5"/><circle cx="312.5" cy="99" r="2.5"/><circle cx="282.5" cy="129" r="2.5"/><circle cx="312.5" cy="129" r="2.5"/><circle cx="282.5" cy="84" r="2.5"/><circle cx="312.5" cy="84" r="2.5"/><circle cx="282.5" cy="114" r="2.5"/><circle cx="312.5" cy="114" r="2.5"/></g><text text-anchor="middle" class="h" x="102.5" y="232">共有結合</text><text text-anchor="middle" class="c" x="102.5" y="362">電子対を共有して固定</text><text text-anchor="middle" class="c" x="102.5" y="379">硬いが変形しにくい</text><g stroke="#3a7d44" stroke-width="4"><line x1="72.5" y1="264" x2="102.5" y2="264"/><line x1="72.5" y1="264" x2="72.5" y2="294"/><line x1="102.5" y1="264" x2="132.5" y2="264"/><line x1="102.5" y1="264" x2="102.5" y2="294"/><line x1="132.5" y1="264" x2="132.5" y2="294"/><line x1="72.5" y1="294" x2="102.5" y2="294"/><line x1="72.5" y1="294" x2="72.5" y2="324"/><line x1="102.5" y1="294" x2="132.5" y2="294"/><line x1="102.5" y1="294" x2="102.5" y2="324"/><line x1="132.5" y1="294" x2="132.5" y2="324"/><line x1="72.5" y1="324" x2="102.5" y2="324"/><line x1="102.5" y1="324" x2="132.5" y2="324"/></g><g fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"><circle cx="72.5" cy="264" r="10"/><circle cx="102.5" cy="264" r="10"/><circle cx="132.5" cy="264" r="10"/><circle cx="72.5" cy="294" r="10"/><circle cx="102.5" cy="294" r="10"/><circle cx="132.5" cy="294" r="10"/><circle cx="72.5" cy="324" r="10"/><circle cx="102.5" cy="324" r="10"/><circle cx="132.5" cy="324" r="10"/></g><text text-anchor="middle" class="h" x="297.5" y="232">転位（刃状）</text><text text-anchor="middle" class="c" x="297.5" y="362">余分な原子面の端が</text><text text-anchor="middle" class="c" x="297.5" y="379">少しずつ動いて変形する</text><g fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"><circle cx="241.5" cy="260" r="7"/><circle cx="269.5" cy="260" r="7"/><circle cx="325.5" cy="260" r="7"/><circle cx="353.5" cy="260" r="7"/><circle cx="241.5" cy="284" r="7"/><circle cx="269.5" cy="284" r="7"/><circle cx="325.5" cy="284" r="7"/><circle cx="353.5" cy="284" r="7"/><circle cx="255.5" cy="310" r="7"/><circle cx="283.5" cy="310" r="7"/><circle cx="311.5" cy="310" r="7"/><circle cx="339.5" cy="310" r="7"/><circle cx="255.5" cy="334" r="7"/><circle cx="283.5" cy="334" r="7"/><circle cx="311.5" cy="334" r="7"/><circle cx="339.5" cy="334" r="7"/></g><g fill="#f8d7da" stroke="#b22234" stroke-width="1.5"><circle cx="297.5" cy="260" r="7"/><circle cx="297.5" cy="284" r="7"/></g><text text-anchor="middle" x="297.5" y="298" font-size="14" font-weight="bold" style="fill:#b22234">⊥</text><rect x="10" y="405" width="380" height="80" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/><text text-anchor="middle" class="h" x="200" y="432">結合の型 → 結晶の並び → 転位の動き</text><text text-anchor="middle" class="c" x="200" y="454" style="fill:#555">転位が動ける金属は延ばせる</text><text text-anchor="middle" class="c" x="200" y="472" style="fill:#555">動けないイオン・共有結合の固体は割れる</text></svg>