<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="ベクトルを投影方向の成分と直交する残りに分ける"><defs><style>text{font-family:Inter,'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif;fill:#1a3a5c}</style><marker id="arrow" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker></defs><text x="200" y="35" font-size="18" text-anchor="middle">向きへの成分と、直交する残り</text><path d="M55,310 L340,310" stroke="#2e6da4" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M55,310 L270,130" stroke="#2e6da4" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M55,310 L270,310" stroke="#3a7d44" stroke-width="2" fill="none"  /><path d="M270,310 L270,130" stroke="#d4a017" stroke-width="2" fill="none"  stroke-dasharray="6 4"/><path d="M254,310 V294 H270" stroke="#1a3a5c" fill="none" stroke-width="1.5"/><circle cx="55" cy="310" r="4" fill="#1a3a5c"/><circle cx="270" cy="130" r="4" fill="#1a3a5c"/><text x="47" y="335" font-size="16" text-anchor="middle">O</text><text x="271" y="111" font-size="23" text-anchor="middle">a</text><text x="340" y="285" font-size="16" text-anchor="end">bの方向</text><text x="162" y="336" font-size="19" text-anchor="middle">射影 p</text><text x="287" y="215" font-size="18" text-anchor="start">a − p</text><rect x="24" y="383" width="352" height="89" rx="10" fill="#e8f0fe"/><text x="200" y="411" font-size="22" text-anchor="middle">a = p + (a − p)</text><text x="200" y="440" font-size="17" text-anchor="middle">射影と残りは直交する</text><text x="200" y="463" font-size="14" text-anchor="middle">長さを聞かれたら、成分から計算</text></svg>
