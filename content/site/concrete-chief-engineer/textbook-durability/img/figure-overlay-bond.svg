<!-- authored 2026-10-10 doboku-note 自作。題材は主任技士テキスト「durability」の増厚の論点。特定の書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="増厚の断面模式。既設床版の上に鉄筋を入れた打ち増し層があり、境の目荒らし面とアンカーで一体化させる">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 12px; fill: #222; }
      .t-lead  { font-size: 11px; fill: #555; }
      .t-in    { font-size: 12px; fill: #1a3a5c; }
      .t-key   { font-size: 12px; font-weight: bold; }
      .t-note  { font-size: 11px; fill: #555; }
      .conc    { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; }
      .overlay { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .rough   { fill: none; stroke: #d4a017; stroke-width: 2.5; }
      .anchor  { stroke: #2e6da4; stroke-width: 3; }
      .bar     { fill: #555; }
      .row     { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- 打ち増し層 -->
  <rect class="overlay" x="40" y="44" width="320" height="64" />
  <circle class="bar" cx="70" cy="70" r="4" />
  <circle class="bar" cx="130" cy="70" r="4" />
  <circle class="bar" cx="190" cy="70" r="4" />
  <circle class="bar" cx="250" cy="70" r="4" />
  <circle class="bar" cx="310" cy="70" r="4" />
  <text class="t-in" x="200" y="98" text-anchor="middle">打ち増し層（鉄筋入り）</text>

  <!-- 既設床版 -->
  <rect class="conc" x="40" y="108" width="320" height="110" />
  <text class="t-in" x="200" y="196" text-anchor="middle">既設床版</text>

  <!-- 目荒らし面 -->
  <polyline class="rough" points="40,108 56,114 72,106 88,114 104,106 120,114 136,106 152,114 168,106 184,114 200,106 216,114 232,106 248,114 264,106 280,114 296,106 312,114 328,106 344,114 360,108" />

  <!-- アンカー -->
  <line class="anchor" x1="100" y1="90" x2="100" y2="160" />
  <line class="anchor" x1="300" y1="90" x2="300" y2="160" />
  <line class="anchor" x1="92" y1="90" x2="108" y2="90" />
  <line class="anchor" x1="292" y1="90" x2="308" y2="90" />

  <!-- 凡例 -->
  <rect class="row" x="20" y="244" width="360" height="62" rx="6" />
  <polyline class="rough" points="34,266 46,272 58,264 70,272 82,264" />
  <text class="t-key" x="96" y="264">目荒らし面</text>
  <text class="t-note" x="96" y="282">凹凸で打継面の付着とかみ合わせを確保</text>

  <rect class="row" x="20" y="318" width="360" height="62" rx="6" />
  <line class="anchor" x1="52" y1="334" x2="52" y2="364" />
  <line class="anchor" x1="44" y1="334" x2="60" y2="334" />
  <text class="t-key" x="96" y="346">アンカー</text>
  <text class="t-note" x="96" y="364">境を貫いて、ずれる力と剥がす力を受ける</text>

  <rect class="row" x="20" y="392" width="360" height="86" rx="6" />
  <text class="t-key" x="36" y="414" style="fill:#b22234">一体にならないと</text>
  <text class="t-note" x="36" y="434">層間で剥離し、増やした断面が働かない</text>
  <text class="t-note" x="36" y="452">打継面の処理は施工中に確認する</text>
</svg>
