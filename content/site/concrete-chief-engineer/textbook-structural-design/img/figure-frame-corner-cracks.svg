<!-- authored 2026-09-12 doboku-note 自作。題材は主任技士テキスト「コンクリート構造の設計」の論点。特定の書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="門形ラーメン隅角部の変形とひび割れの向き。水平荷重で開く場合は外側、突き上げ荷重で閉じる場合は内側が引張縁になり、柱脚の支持条件と荷重方向をあわせて示す図">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 11px; fill: #555; }
      .t-sec   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-desc  { font-size: 11px; fill: #555; }
      .t-label { font-size: 11px; fill: #8a8a8a; }
      .orig    { stroke: #8a8a8a; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
      .deform  { stroke: #2e6da4; stroke-width: 2.5; fill: none; }
      .tension { stroke: #b22234; stroke-width: 3; fill: none; }
      .crack   { stroke: #b22234; stroke-width: 1; }
      .ground  { stroke: #222; stroke-width: 1.5; }
    </style>
    <marker id="arrowBlue" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/>
    </marker>
  </defs>

  <text class="t-lead" x="200" y="16" text-anchor="middle">門形ラーメン隅角部の変形とひび割れの向き</text>

  <!-- パネル1：開く場合 -->
  <text class="t-sec" x="200" y="34" text-anchor="middle">水平荷重で外側の隅角部が開く</text>

  <line x1="90" y1="195" x2="330" y2="195" class="ground"/>
  <circle cx="120" cy="195" r="4" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <circle cx="280" cy="195" r="4" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text class="t-label" x="120" y="212" text-anchor="middle">支承：ピン</text>

  <!-- 変形前（破線） -->
  <path class="orig" d="M120,195 L120,75 L280,75 L280,195"/>

  <!-- 変形後（実線、上部が右へ移動） -->
  <path class="deform" d="M120,195 L160,75"/>
  <path class="deform" d="M280,195 L320,75"/>
  <path class="deform" d="M185,75 L320,75"/>

  <!-- 開く隅角部（左上・外側が引張） -->
  <path class="tension" d="M145,110 L160,75 L185,75"/>
  <line x1="148" y1="88" x2="156" y2="98" class="crack"/>
  <line x1="167" y1="70" x2="173" y2="80" class="crack"/>

  <!-- 荷重矢印 -->
  <line x1="95" y1="75" x2="118" y2="75" stroke="#2e6da4" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text class="t-label" x="90" y="66" text-anchor="start">水平荷重</text>

  <text class="t-desc" x="200" y="58" text-anchor="middle">外側に引張→ひび割れ</text>

  <!-- パネル2：閉じる場合 -->
  <text class="t-sec" x="200" y="240" text-anchor="middle">突き上げ荷重で内側の隅角部が閉じる</text>

  <line x1="90" y1="420" x2="330" y2="420" class="ground"/>
  <rect x="108" y="420" width="24" height="7" fill="#222"/>
  <rect x="268" y="420" width="24" height="7" fill="#222"/>
  <text class="t-label" x="120" y="440" text-anchor="middle">支承：固定</text>

  <!-- 変形前（破線） -->
  <path class="orig" d="M120,420 L120,320 L280,320 L280,420"/>

  <!-- 変形後（実線、梁が上に凸に変形） -->
  <path class="deform" d="M120,420 L132,322"/>
  <path class="deform" d="M280,420 L268,322"/>
  <path class="deform" d="M132,322 Q200,296 268,322"/>

  <!-- 閉じる隅角部（左右とも・内側が引張） -->
  <path class="tension" d="M124,340 L132,322 L160,318"/>
  <path class="tension" d="M276,340 L268,322 L240,318"/>
  <line x1="140" y1="316" x2="146" y2="326" class="crack"/>
  <line x1="252" y1="316" x2="258" y2="326" class="crack"/>

  <!-- 荷重矢印（突き上げ） -->
  <line x1="200" y1="345" x2="200" y2="305" stroke="#2e6da4" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text class="t-label" x="200" y="360" text-anchor="middle">突き上げ荷重</text>

  <text class="t-desc" x="200" y="300" text-anchor="middle">内側に引張→ひび割れ</text>

  <!-- 凡例 -->
  <line x1="30" y1="454" x2="55" y2="454" class="orig"/>
  <text class="t-desc" x="62" y="458">変形前</text>
  <line x1="150" y1="454" x2="175" y2="454" class="deform"/>
  <text class="t-desc" x="182" y="458">変形後（誇張）</text>
  <line x1="30" y1="472" x2="55" y2="472" class="tension"/>
  <text class="t-desc" x="62" y="476">引張縁（ひび割れ発生側）</text>
</svg>
