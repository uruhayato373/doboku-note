<!-- authored 2026-09-12 doboku-note 自作。題材は主任技士テキスト「コンクリート構造の設計」の論点。特定の書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="曲げ・せん断・付着割裂の3破壊形態を先に壊れてよい順に並べ、性格と先行させない手段、設計での耐力の相対的な大小（曲げ耐力が最も小さく、付着耐力が最も大きい）を対応づける図">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 11px; fill: #555; }
      .t-name  { font-size: 14px; font-weight: bold; fill: #1a3a5c; }
      .t-desc  { font-size: 11px; fill: #555; }
      .t-label { font-size: 11px; fill: #8a8a8a; }
      .box-p { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-d { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .bar-p { fill: #3a7d44; }
      .bar-w { fill: #d4a017; }
      .bar-d { fill: #b22234; }
    </style>
  </defs>

  <text class="t-lead" x="200" y="18" text-anchor="middle">先に壊れてよい順は曲げ、せん断、付着割裂</text>
  <text class="t-label" x="320" y="40" text-anchor="middle">耐力の大小（目盛なし）</text>

  <!-- 1: 曲げ破壊 -->
  <rect class="box-p" x="20" y="48" width="360" height="128" rx="8"/>
  <text class="t-name" x="35" y="72">① 曲げ破壊（最初）</text>
  <text class="t-desc" x="35" y="92">延性的（変形で予告して</text>
  <text class="t-desc" x="35" y="108">から壊れる）</text>
  <text class="t-desc" x="35" y="128">この破壊を最初に起こす</text>
  <text class="t-desc" x="35" y="144">設計方針（先行させる）</text>
  <text class="t-desc" x="250" y="92">曲げ耐力</text>
  <rect class="bar-p" x="250" y="102" width="40" height="18" rx="3"/>
  <text class="t-label" x="250" y="140">最も小さく設計する</text>

  <!-- 2: せん断破壊 -->
  <rect class="box-w" x="20" y="188" width="360" height="128" rx="8"/>
  <text class="t-name" x="35" y="212">② せん断破壊</text>
  <text class="t-desc" x="35" y="232">脆性的（前触れなく</text>
  <text class="t-desc" x="35" y="248">急激に壊れる）</text>
  <text class="t-desc" x="35" y="268">せん断補強筋を増やし</text>
  <text class="t-desc" x="35" y="284">先行させない</text>
  <text class="t-desc" x="250" y="232">せん断耐力</text>
  <rect class="bar-w" x="250" y="242" width="75" height="18" rx="3"/>
  <text class="t-label" x="250" y="280">曲げ耐力より大きく</text>

  <!-- 3: 付着割裂破壊 -->
  <rect class="box-d" x="20" y="328" width="360" height="128" rx="8"/>
  <text class="t-name" x="35" y="352">③ 付着割裂破壊（最後）</text>
  <text class="t-desc" x="35" y="372">鉄筋とコンクリートの力</text>
  <text class="t-desc" x="35" y="388">の伝達が断たれる</text>
  <text class="t-desc" x="35" y="408">定着長さ・フックを確保</text>
  <text class="t-desc" x="35" y="424">し先行させない</text>
  <text class="t-desc" x="250" y="372">付着耐力</text>
  <rect class="bar-d" x="250" y="382" width="110" height="18" rx="3"/>
  <text class="t-label" x="250" y="420">慎重に確保する</text>

  <text class="t-lead" x="200" y="478" text-anchor="middle">曲げ耐力＜せん断耐力＜付着耐力となるよう設計する</text>
</svg>
