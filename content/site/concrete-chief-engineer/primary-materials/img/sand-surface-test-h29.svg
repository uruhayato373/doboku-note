<!-- authored 2026-09-30 doboku-note 自作。題材は主任技士教材の骨材の表面水率試験（容器・天びん）。書籍図の複製・トレースではない -->
<svg viewBox="0 0 416 400" xmlns="http://www.w3.org/2000/svg"
  style="max-width:416px;width:100%"
  role="img"
  aria-label="表面水率試験の器具と測定の4コマ。（ア）目盛りのあるガラス容器、（イ）水を200ミリリットルはかり取る、（ウ）湿潤状態の砂を天びんで500.0グラムはかる、（エ）砂を加えた後の水面の目盛りを読む">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 11px; fill: #555; }
      .t-axis  { font-size: 11px; fill: #8a8a8a; }
      .t-label { font-size: 11px; fill: #1a3a5c; }
      .t-title { font-size: 12px; fill: #1a3a5c; font-weight: bold; }
      .line-main { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .line-sub  { stroke: #1a3a5c; stroke-width: 1.6; fill: none; stroke-dasharray: 5 3; }
      .line-dash { stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .axis { stroke: #555; stroke-width: 1.2; fill: none; }
      .box { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .bar { stroke: #1a3a5c; stroke-width: 2.4; fill: none; stroke-linecap: round; }
      .conc { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
    </style>
    <marker id="ar" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#1a3a5c"/></marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#8a8a8a" stroke-width="1.2"/></pattern>
  </defs>
<g transform="translate(8 8)">
  <text class="t-lead" x="200" y="16" text-anchor="middle">表面水率の試験：器具と測定の4コマ</text>
  <rect class="box" x="20" y="30" width="170" height="150" rx="6"/>
  <text class="t-title" x="105" y="174" text-anchor="middle">（ア）目盛りのある容器</text>
  <rect x="88" y="52" width="34" height="90" rx="3" fill="#fff" stroke="#1a3a5c" stroke-width="1.6"/>
  <line x1="88" y1="62" x2="102" y2="62" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="88" y1="73" x2="98" y2="73" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="88" y1="84" x2="102" y2="84" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="88" y1="95" x2="98" y2="95" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="88" y1="106" x2="102" y2="106" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="88" y1="117" x2="98" y2="117" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="88" y1="128" x2="102" y2="128" stroke="#8a8a8a" stroke-width="1"/>
  <text class="t-desc" x="105" y="158" text-anchor="middle" style="font-size:11px;fill:#555">ガラス製の測定容器</text>
  <rect class="box" x="210" y="30" width="170" height="150" rx="6"/>
  <text class="t-title" x="295" y="174" text-anchor="middle">（イ）水を200 mL</text>
  <rect x="278" y="52" width="34" height="90" rx="3" fill="#fff" stroke="#1a3a5c" stroke-width="1.6"/>
  <rect x="280" y="92" width="34" height="48" fill="#e8f0fe" stroke="none"/>
  <path d="M278,92 L312,92" stroke="#2e6da4" stroke-width="2"/>
  <line class="line-dash" x1="312" y1="92" x2="327" y2="92"/>
  <text class="t-label" x="330" y="96">200 mL</text>
  <text class="t-desc" x="295" y="158" text-anchor="middle" style="font-size:11px;fill:#555">水をはかり取る</text>
  <rect class="box" x="20" y="200" width="170" height="150" rx="6"/>
  <text class="t-title" x="105" y="344" text-anchor="middle">（ウ）湿潤状態の砂</text>
  <rect x="60" y="284" width="90" height="26" rx="4" fill="#d7d7d7" stroke="#555" stroke-width="1.4"/>
  <rect x="90" y="292" width="30" height="10" fill="#fff" stroke="#555" stroke-width="1"/>
  <path d="M67,258 Q105,296 143,258 Z" fill="#f5f5f5" stroke="#1a3a5c" stroke-width="1.6"/>
  <ellipse cx="105" cy="258" rx="38" ry="6" fill="#fff" stroke="#1a3a5c" stroke-width="1.6"/>
  <path d="M83,258 Q95,246 105,250 Q117,246 127,258 Z" fill="#8a8a8a"/>
  <text class="t-label" x="105" y="238" text-anchor="middle">500.0 g</text>
  <text class="t-desc" x="105" y="328" text-anchor="middle" style="font-size:11px;fill:#555">天びんで質量をはかる</text>
  <rect class="box" x="210" y="200" width="170" height="150" rx="6"/>
  <text class="t-title" x="295" y="344" text-anchor="middle">（エ）砂を加えた後</text>
  <rect x="278" y="222" width="34" height="90" rx="3" fill="#fff" stroke="#1a3a5c" stroke-width="1.6"/>
  <rect x="280" y="248" width="32" height="62" fill="#e8f0fe" stroke="none"/>
  <rect x="280" y="284" width="32" height="26" fill="#8a8a8a" stroke="none"/>
  <path d="M278,248 L312,248" stroke="#2e6da4" stroke-width="2"/>
  <line class="line-dash" x1="312" y1="248" x2="327" y2="248"/>
  <text class="t-label" x="330" y="252">402 mL</text>
  <text class="t-desc" x="295" y="328" text-anchor="middle" style="font-size:11px;fill:#555">水面の目盛りを読む</text>
  <line x1="192" y1="105" x2="207" y2="105" stroke="#1a3a5c" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="192" y1="275" x2="207" y2="275" stroke="#1a3a5c" stroke-width="1.6" marker-end="url(#ar)"/>
  <text class="t-lead" x="200" y="372" text-anchor="middle">（ア）→（イ）：水を入れる　（ウ）→（エ）：砂を加えて空気を追い出す</text>
</g>
</svg>
