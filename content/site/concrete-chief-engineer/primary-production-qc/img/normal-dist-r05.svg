<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" style="max-width:400px;width:100%" role="img" aria-label="正規分布の概念図。平均値μを頂点とする釣鐘型の曲線で、μ−kσより左の裾の面積を確率εとして網掛けで示す">
  <defs>
    <pattern id="ndhatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#8a8a8a" stroke-width="1"/>
    </pattern>
  </defs>

  <text x="330" y="26" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">平均値 μ</text>
  <text x="330" y="44" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">標準偏差 σ</text>

  <path d="M 40 200 Q 70 199 100 193 Q 130 184 155 162 Q 180 132 198 95 Q 208 72 220 60 Q 232 72 242 95 Q 260 132 285 162 Q 310 184 340 193 Q 370 199 400 200"
        fill="none" stroke="#222" stroke-width="2"/>

  <path d="M 40 200 Q 70 199 100 193 Q 122 187 138 172 L 138 200 Z"
        fill="url(#ndhatch)" stroke="none"/>
  <path d="M 40 200 Q 70 199 100 193 Q 122 187 138 172"
        fill="none" stroke="#555" stroke-width="1.2"/>

  <line x1="20" y1="200" x2="400" y2="200" stroke="#222" stroke-width="1.5"/>
  <line x1="220" y1="60" x2="220" y2="204" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="138" y1="172" x2="138" y2="204" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 3"/>

  <text x="90" y="152" text-anchor="middle" font-family="sans-serif" font-size="13" font-style="italic" fill="#222">ε</text>
  <path d="M100 174 L109 182 L101 190" fill="none" stroke="#555" stroke-width="1.2"/>

  <text x="138" y="220" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">μ − kσ</text>
  <text x="220" y="220" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">μ</text>

  <text x="220" y="248" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">正規分布</text>
  <text x="220" y="272" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">k および ε は右表による</text>
</svg>
