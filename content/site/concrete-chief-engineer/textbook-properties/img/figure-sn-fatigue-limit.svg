<!-- authored 2026-09-30 doboku-note 自作。題材は主任技士教材のS-N線図（金属の疲労限度とコンクリートの疲労強度）。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="S-N線図の模式図。横軸は繰返し数N（対数目盛）、縦軸は上限応力S。金属は右で水平になる疲労限度を持ち、コンクリートは明確な疲労限度を持たず右下がりの直線となる。200万回の位置の応力が200万回疲労強度">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 11px; fill: #555; }
      .t-axis  { font-size: 11px; fill: #8a8a8a; }
      .t-label { font-size: 11px; fill: #1a3a5c; }
      .t-desc  { font-size: 11px; fill: #555; }
      .line-main { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .line-sub  { stroke: #8a8a8a; stroke-width: 2; fill: none; }
      .line-dash { stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .box { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
  </defs>
<text class="t-lead" x="200" y="24" text-anchor="middle">繰返し回数が増えるほど疲労強度は低下する</text>
<path class="line-dash" d="M50 58V350H370"/>
<text class="t-axis" x="56" y="55">上限応力 S</text>
<text class="t-axis" x="370" y="398" text-anchor="end">繰返し数 N（対数目盛）</text>
<line class="line-dash" x1="50" y1="85" x2="123" y2="85"/>
<text class="t-axis" x="130" y="88">静的強度</text>
<path class="line-sub" d="M70 95C140 115 250 170 310 190H360"/>
<text class="t-desc" x="365" y="154" text-anchor="end">金属：疲労限度あり</text>
<line class="line-main" x1="70" y1="95" x2="360" y2="295"/>
<text class="t-label" x="365" y="319" text-anchor="end">コンクリート：</text>
<text class="t-label" x="365" y="335" text-anchor="end">明確な疲労限度なし</text>
<path class="line-dash" d="M250 60V350M50 219.14H250"/>
<circle cx="250" cy="219.14" r="3.5" fill="#2e6da4"/>
<text class="t-label" x="58" y="210">200万回疲労強度</text>
<text class="t-axis" x="250" y="375" text-anchor="middle">200万回</text>
<rect class="box" x="20" y="416" width="360" height="64" rx="6"/>
<text class="t-desc" x="34" y="442">気乾状態の200万回疲労強度は</text>
<text class="t-desc" x="34" y="466">静的圧縮強度の55〜65 %程度</text>
</svg>
