<!-- authored 2026-10-16 doboku-note 自作。題材は主任技士教材の静弾性係数の傾向。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="静弾性係数と圧縮強度の関係の模式図。圧縮強度が高いほど静弾性係数は大きく、同じ圧縮強度では単位容積質量が大きいほど静弾性係数が大きい">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 11px; fill: #555; }
      .t-axis  { font-size: 11px; fill: #8a8a8a; }
      .t-label { font-size: 12px; fill: #1a3a5c; }
      .t-desc  { font-size: 12px; fill: #555; }
      .line-main { stroke: #2e6da4; stroke-width: 2.5; fill: none; }
      .line-sub { stroke: #8a8a8a; stroke-width: 2; fill: none; }
      .line-dash { stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .box { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-d { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .box-p { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#555"/>
    </marker>
  </defs>
  <text class="t-lead" x="200" y="22" text-anchor="middle">同じ強度なら、単位容積質量が大きいほど硬い</text>
  <line class="line-dash" x1="50" y1="340" x2="370" y2="340" />
  <line class="line-dash" x1="50" y1="44" x2="50" y2="340" />
  <text class="t-axis" x="372" y="360" text-anchor="end">圧縮強度</text>
  <text class="t-axis" x="56" y="58">静弾性係数</text>

  <path d="M70,300 C 150,240 250,160 350,110" stroke="#2e6da4" stroke-width="2.5" fill="none" />
  <text class="t-label" x="340" y="96" text-anchor="end">単位容積質量 大</text>
  <path d="M70,318 C 150,280 250,230 350,192" stroke="#d4a017" stroke-width="2.5" fill="none" />
  <text class="t-label" x="340" y="265" text-anchor="end">単位容積質量 小</text>

  <rect class="box" x="20" y="384" width="360" height="92" rx="6" />
  <text class="t-desc" x="34" y="408">圧縮強度が高いほど、静弾性係数は大きい</text>
  <text class="t-desc" x="34" y="430">単位容積質量が大きいほど、静弾性係数は大きい</text>
  <text class="t-desc" x="34" y="452">どちらの向きも、増えるほど大きくなる傾向</text>
</svg>
