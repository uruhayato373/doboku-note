<!-- authored 2026-09-12 doboku-note 自作。題材は主任技士テキスト「properties」の論点。特定の書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="ブリーディングによる上端筋の付着低下を3段の断面模式図で示す。打込み直後→沈下・水の上昇→上端筋下面の水膜・空隙の順に進行する">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 11px; fill: #555; }
      .t-stage { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-desc  { font-size: 11px; fill: #555; }
      .t-label { font-size: 11px; fill: #1a3a5c; }
      .concrete { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .concrete-settled { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .void     { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .bar      { fill: #555; stroke: #222; stroke-width: 1; }
      .frame    { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .arrow    { stroke: #2e6da4; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arr" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#2e6da4" />
    </marker>
  </defs>

  <text class="t-lead" x="200" y="16" text-anchor="middle">部材断面を3段階で追う（上が上端筋、下が下端筋の位置）</text>

  <!-- Stage 1: 打込み直後（均質） -->
  <text class="t-stage" x="20" y="40">① 打込み直後（均質）</text>
  <rect class="frame" x="20" y="46" width="360" height="90" rx="6" />
  <rect class="concrete" x="40" y="58" width="320" height="66" />
  <rect class="bar" x="55" y="66" width="255" height="7" rx="3" />
  <text class="t-label" x="360" y="72" text-anchor="end">上端筋</text>
  <rect class="bar" x="55" y="107" width="255" height="7" rx="3" />
  <text class="t-label" x="360" y="120" text-anchor="end">下端筋</text>
  <text class="t-desc" x="200" y="90" text-anchor="middle">水・骨材・ペーストが均一に分布</text>

  <line class="arrow" x1="200" y1="140" x2="200" y2="160" marker-end="url(#arr)" />

  <!-- Stage 2: 沈下・ブリーディング -->
  <text class="t-stage" x="20" y="182">② 沈下・ブリーディング</text>
  <rect class="frame" x="20" y="188" width="360" height="100" rx="6" />
  <rect class="concrete-settled" x="40" y="200" width="320" height="76" />
  <rect class="void" x="40" y="200" width="320" height="14" opacity="0.7" />
  <text class="t-desc" x="200" y="211" text-anchor="middle">上昇した水が上部に集まる</text>
  <rect class="bar" x="55" y="222" width="255" height="7" rx="3" />
  <text class="t-label" x="360" y="228" text-anchor="end">上端筋</text>
  <rect class="bar" x="55" y="263" width="255" height="7" rx="3" />
  <text class="t-label" x="360" y="273" text-anchor="end">下端筋</text>
  <text class="t-desc" x="200" y="255" text-anchor="middle">骨材は沈み、水は上昇分離する</text>

  <line class="arrow" x1="200" y1="292" x2="200" y2="312" marker-end="url(#arr)" />

  <!-- Stage 3: 上端筋下面の水膜・空隙 -->
  <text class="t-stage" x="20" y="334">③ 上端筋下面に水膜・空隙が残る</text>
  <rect class="frame" x="20" y="340" width="360" height="100" rx="6" />
  <rect class="concrete-settled" x="40" y="352" width="320" height="76" />
  <rect class="bar" x="55" y="366" width="255" height="7" rx="3" />
  <text class="t-label" x="360" y="372" text-anchor="end">上端筋</text>
  <rect class="void" x="55" y="373" width="255" height="10" />
  <text class="t-desc" x="200" y="398" text-anchor="middle">下面に水膜・微細な空隙</text>
  <rect class="bar" x="55" y="415" width="255" height="7" rx="3" />
  <text class="t-label" x="360" y="425" text-anchor="end">下端筋</text>

  <rect class="frame" x="20" y="452" width="360" height="38" rx="6" />
  <text class="t-desc" x="200" y="467" text-anchor="middle">空隙の分だけ付着に有効な断面が減るため、</text>
  <text class="t-desc" x="200" y="482" text-anchor="middle">上端筋は下端筋より付着強度が小さくなる</text>
</svg>
