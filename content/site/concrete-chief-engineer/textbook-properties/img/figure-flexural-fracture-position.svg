<!-- authored 2026-10-16 doboku-note 自作。題材は主任技士教材の曲げ強度試験（3等分点載荷）。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="3等分点載荷の供試体を立面で示す。荷重点間の中央3分の1区間で破壊した場合は式が有効、載荷点より支点寄りで破壊した場合は結果が無効">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 11px; fill: #555; }
      .t-axis  { font-size: 11px; fill: #8a8a8a; }
      .t-label { font-size: 12px; fill: #1a3a5c; }
      .t-desc  { font-size: 12px; fill: #555; }
      .line-main { stroke: #2e6da4; stroke-width: 2.5; fill: none; }
      .line-sub { stroke: #8a8a8a; stroke-width: 2; fill: none; }
      .line-dash { stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .box { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-d { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .box-p { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#555"/>
    </marker>
  </defs>
  <text class="t-lead" x="200" y="22" text-anchor="middle">青い区間＝支点間を3等分した中央3分の1</text>

  <!-- beam -->
  <rect class="box" x="40" y="86" width="320" height="36" />
  <rect class="box-b" x="153" y="86" width="94" height="36" />
  <polygon points="60,122 48,142 72,142" fill="#f5f5f5" stroke="#555" stroke-width="1.5" />
  <polygon points="340,122 328,142 352,142" fill="#f5f5f5" stroke="#555" stroke-width="1.5" />
  <line x1="153" y1="50" x2="153" y2="84" stroke="#555" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="247" y1="50" x2="247" y2="84" stroke="#555" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M200,122 L196,110 L204,98 L200,86" stroke="#b22234" stroke-width="2.5" fill="none" />
  <text class="t-label" x="200" y="164" text-anchor="middle">中央3分の1の内側で破壊</text>
  <rect class="box-p" x="110" y="174" width="180" height="28" rx="6" />
  <text class="t-label" x="200" y="193" text-anchor="middle">式が有効</text>

  <!-- beam -->
  <rect class="box" x="40" y="286" width="320" height="36" />
  <rect class="box-b" x="153" y="286" width="94" height="36" />
  <polygon points="60,322 48,342 72,342" fill="#f5f5f5" stroke="#555" stroke-width="1.5" />
  <polygon points="340,322 328,342 352,342" fill="#f5f5f5" stroke="#555" stroke-width="1.5" />
  <line x1="153" y1="250" x2="153" y2="284" stroke="#555" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="247" y1="250" x2="247" y2="284" stroke="#555" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M110,322 L106,310 L114,298 L110,286" stroke="#b22234" stroke-width="2.5" fill="none" />
  <text class="t-label" x="200" y="364" text-anchor="middle">載荷点より支点寄りで破壊</text>
  <rect class="box-d" x="110" y="374" width="180" height="28" rx="6" />
  <text class="t-label" x="200" y="393" text-anchor="middle">結果は無効</text>
</svg>
