<!-- authored 2026-09-12 doboku-note 自作。題材は主任技士テキスト「properties」の論点。特定の書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="持続荷重下のひずみの時間推移。載荷時弾性ひずみ→クリープひずみの増加→除荷時の弾性回復→クリープ回復→非回復ひずみの順を折れ線で示す">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 11px; fill: #555; }
      .t-axis  { font-size: 11px; fill: #8a8a8a; }
      .t-label { font-size: 11px; fill: #1a3a5c; }
      .t-desc  { font-size: 11px; fill: #555; }
      .line-main { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .line-dash { stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .box { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
    </style>
  </defs>

  <text class="t-lead" x="200" y="16" text-anchor="middle">横軸＝時間、縦軸＝ひずみ（数値なし・挙動の形を示す）</text>

  <!-- axes -->
  <line class="line-dash" x1="40" y1="290" x2="370" y2="290" />
  <line class="line-dash" x1="40" y1="40" x2="40" y2="290" />
  <text class="t-axis" x="375" y="294">時間</text>
  <text class="t-axis" x="44" y="36">ひずみ</text>

  <!-- curve: 0(40,290) -> jump to elastic(40,220) -> creep rise to (200,150) -> unload jump down (200,220) -> creep recovery curve to (280,250) -> flat residual to (370,250) -->
  <line class="line-main" x1="40" y1="290" x2="40" y2="220" />
  <path class="line-main" d="M40,220 C 100,200 150,170 200,150" />
  <line class="line-main" x1="200" y1="150" x2="200" y2="220" />
  <path class="line-main" d="M200,220 C 230,235 260,245 280,250" />
  <line class="line-main" x1="280" y1="250" x2="370" y2="250" />

  <!-- markers -->
  <circle cx="40" cy="220" r="3" fill="#2e6da4" />
  <circle cx="200" cy="150" r="3" fill="#2e6da4" />
  <circle cx="200" cy="220" r="3" fill="#2e6da4" />
  <circle cx="280" cy="250" r="3" fill="#2e6da4" />

  <!-- labels along curve -->
  <text class="t-label" x="46" y="258">載荷時弾性ひずみ</text>
  <text class="t-label" x="60" y="192">クリープひずみの増加</text>
  <text class="t-label" x="207" y="185">除荷時の弾性回復</text>
  <text class="t-label" x="207" y="215">クリープ回復</text>
  <text class="t-label" x="325" y="270" text-anchor="middle">非回復ひずみ（残留）</text>

  <line class="line-dash" x1="200" y1="40" x2="200" y2="290" />
  <text class="t-axis" x="200" y="304" text-anchor="middle">除荷</text>

  <text class="t-lead" x="20" y="330">区間の対応</text>
  <rect class="box" x="20" y="336" width="360" height="150" rx="6" />

  <rect class="box-b" x="34" y="348" width="14" height="14" />
  <text class="t-desc" x="54" y="360">載荷の瞬間：弾性ひずみが即座に生じる</text>

  <rect class="box-b" x="34" y="372" width="14" height="14" />
  <text class="t-desc" x="54" y="384">載荷中：時間とともにクリープひずみが増加</text>

  <rect class="box-b" x="34" y="396" width="14" height="14" />
  <text class="t-desc" x="54" y="408">除荷の瞬間：弾性ひずみ分が即座に回復</text>

  <rect class="box-b" x="34" y="420" width="14" height="14" />
  <text class="t-desc" x="54" y="432">除荷後：時間をかけて緩やかに回復</text>
  <text class="t-desc" x="54" y="448">（クリープ回復）</text>

  <rect class="box-b" x="34" y="460" width="14" height="14" />
  <text class="t-desc" x="54" y="472">最終的に回復せず残る非回復ひずみがある</text>
</svg>
