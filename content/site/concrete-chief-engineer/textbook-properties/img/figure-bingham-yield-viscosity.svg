<!-- authored 2026-09-30 doboku-note 自作。題材は主任技士教材のビンガム流体モデル（降伏値と塑性粘度）。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="ビンガム流体モデルの模式図。横軸にせん断ひずみ速度、縦軸にせん断応力をとり、スランプ小は縦軸切片の降伏値が大きく、傾きが塑性粘度を表す">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 11px; fill: #555; }
      .t-axis  { font-size: 11px; fill: #8a8a8a; }
      .t-label { font-size: 12px; fill: #1a3a5c; }
      .t-warn  { font-size: 12px; fill: #1a3a5c; }
      .t-desc  { font-size: 12px; fill: #555; }
      .line-a { stroke: #b22234; stroke-width: 2.5; fill: none; }
      .line-b { stroke: #2e6da4; stroke-width: 2.5; fill: none; }
      .line-c { stroke: #d4a017; stroke-width: 2.5; fill: none; }
      .line-dash { stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .box { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
  </defs>

  <text class="t-lead" x="200" y="24" text-anchor="middle">縦軸の切片が降伏値、直線の傾きが塑性粘度</text>

  <!-- axes -->
  <line class="line-dash" x1="50" y1="360" x2="370" y2="360" />
  <line class="line-dash" x1="50" y1="44" x2="50" y2="360" />
  <text class="t-axis" x="370" y="380" text-anchor="end">せん断ひずみ速度（流動速度）</text>
  <text class="t-axis" x="56" y="58">せん断応力</text>

  <!-- A: slump small, intercept high -->
  <line class="line-a" x1="50" y1="230" x2="350" y2="110" />
  <circle cx="50" cy="230" r="3.5" fill="#b22234" />
  <text class="t-label" x="62" y="156">スランプ小：降伏値大</text>

  <!-- B: slump large, intercept low, same slope -->
  <line class="line-b" x1="50" y1="300" x2="350" y2="180" />
  <circle cx="50" cy="300" r="3.5" fill="#2e6da4" />
  <text class="t-label" x="62" y="328">スランプ大：降伏値小</text>

  <!-- C: same intercept as B, steeper -->
  <line class="line-c" x1="50" y1="300" x2="330" y2="76" />
  <text class="t-label" x="326" y="66" text-anchor="end">傾き大：塑性粘度大</text>

  <rect class="box" x="20" y="404" width="360" height="72" rx="6" />
  <text class="t-desc" x="34" y="426">切片が高い（赤）：降伏値大、スランプ小</text>
  <text class="t-desc" x="34" y="446">傾きが急（黄）：塑性粘度大、圧送負荷大</text>
  <text class="t-desc" x="34" y="466">赤と青は平行：傾き（塑性粘度）は同じ</text>
</svg>
