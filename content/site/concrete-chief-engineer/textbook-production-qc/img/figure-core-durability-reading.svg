<!-- authored 2026-10-10 doboku-note 自作。題材は主任技士テキスト「production-qc」のコアによる耐久性の読み取り。特定の書籍図の複製・トレースではない。数値は架空の算出例 -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="コアの見かけ密度を配合表の単位量の和と比べる算出例と、同じコアで続けて見る塩化物、中性化、ASR促進膨張の読み方を示す">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-main { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-sub { font-size: 11px; fill: #555; }
      .t-tag { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .b-base { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .b-brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .b-warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .b-pos { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .b-danger { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .row { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#2e6da4"/>
    </marker>
  </defs>

  <rect class="b-base" x="14" y="20" width="372" height="46" rx="6" />
  <text class="t-main" x="200" y="41" text-anchor="middle">配合表の単位量の和 2,275 kg/m³</text>
  <text class="t-sub" x="200" y="58" text-anchor="middle">水・セメント・骨材・混和材の合計</text>

  <line x1="200" y1="68" x2="200" y2="84" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)" />

  <rect class="b-brand" x="14" y="88" width="372" height="46" rx="6" />
  <text class="t-main" x="200" y="109" text-anchor="middle">コアの見かけ密度 2,210 kg/m³</text>
  <text class="t-sub" x="200" y="126" text-anchor="middle">表乾 3,480 g ÷ 体積 1,575 cm³</text>

  <line x1="200" y1="136" x2="200" y2="152" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)" />

  <rect class="b-warn" x="14" y="156" width="372" height="46" rx="6" />
  <text class="t-main" x="200" y="177" text-anchor="middle">実測 ÷ 配合値 ＝ 約97 %</text>
  <text class="t-sub" x="200" y="194" text-anchor="middle">差は空隙・空気量・骨材ロットに切り分ける</text>

  <rect class="row" x="14" y="222" width="372" height="62" rx="6" />
  <rect class="b-danger" x="14" y="222" width="92" height="62" rx="6" />
  <text class="t-tag" x="60" y="258" text-anchor="middle">塩化物</text>
  <text class="t-main" x="118" y="246">深さ別に切って塩化物イオン量</text>
  <text class="t-sub" x="118" y="266">鉄筋位置の濃度を目安と比べる</text>

  <rect class="row" x="14" y="294" width="372" height="62" rx="6" />
  <rect class="b-pos" x="14" y="294" width="92" height="62" rx="6" />
  <text class="t-tag" x="60" y="330" text-anchor="middle">中性化</text>
  <text class="t-main" x="118" y="318">フェノールフタレインで深さを測る</text>
  <text class="t-sub" x="118" y="338">仕上げの有無・種類をそろえて比べる</text>

  <rect class="row" x="14" y="366" width="372" height="62" rx="6" />
  <rect class="b-brand" x="14" y="366" width="92" height="62" rx="6" />
  <text class="t-tag" x="60" y="402" text-anchor="middle">ASR</text>
  <text class="t-main" x="118" y="390">20℃で解放 → 40℃で促進膨張</text>
  <text class="t-sub" x="118" y="410">湿度95 %以上・結果は参考値</text>

  <rect class="b-base" x="14" y="444" width="372" height="40" rx="6" />
  <text class="t-sub" x="200" y="468" text-anchor="middle">単独で判定せず、外観・環境・採取位置と合わせて読む</text>
</svg>
