<!-- authored 2026-09-12 doboku-note 自作。題材は主任技士テキスト「製造・品質管理」の論点。特定の書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="圧縮強度の受入検査の判定フロー。各回が呼び強度の85%以上という条件と、3回平均が呼び強度以上という条件の両方を満たすと合格、片方でも外れると不合格になる">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-name { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-desc { font-size: 11px; fill: #555; }
      .t-strong { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-big  { font-size: 14px; font-weight: bold; fill: #1a3a5c; }
      .t-note { font-size: 11px; fill: #8a8a8a; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-pos { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-dan { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .box-sur { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .arrow-line { stroke: #2e6da4; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arrowS" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/>
    </marker>
  </defs>

  <text class="t-lead" x="200" y="18" text-anchor="middle">圧縮強度の受入検査（3回の試験＝各回3供試体の平均）</text>

  <rect class="box-b" x="20" y="28" width="360" height="52" rx="8"/>
  <text class="t-name" x="200" y="50" text-anchor="middle">3回の試験結果</text>
  <text class="t-desc" x="200" y="68" text-anchor="middle">1回＝3供試体の平均値</text>

  <line class="arrow-line" x1="200" y1="80" x2="200" y2="100" marker-end="url(#arrowS)"/>

  <rect class="box-b" x="20" y="102" width="170" height="70" rx="6"/>
  <text class="t-strong" x="105" y="124" text-anchor="middle">条件①</text>
  <text class="t-desc" x="105" y="142" text-anchor="middle">各回が呼び強度の</text>
  <text class="t-desc" x="105" y="158" text-anchor="middle">85%以上</text>

  <rect class="box-b" x="210" y="102" width="170" height="70" rx="6"/>
  <text class="t-strong" x="295" y="124" text-anchor="middle">条件②</text>
  <text class="t-desc" x="295" y="142" text-anchor="middle">3回の平均が</text>
  <text class="t-desc" x="295" y="158" text-anchor="middle">呼び強度以上</text>

  <line class="arrow-line" x1="105" y1="172" x2="180" y2="192" marker-end="url(#arrowS)"/>
  <line class="arrow-line" x1="295" y1="172" x2="220" y2="192" marker-end="url(#arrowS)"/>

  <rect class="box-warn" x="100" y="194" width="200" height="44" rx="6"/>
  <text class="t-strong" x="200" y="220" text-anchor="middle">両方を満たすか</text>

  <line class="arrow-line" x1="150" y1="238" x2="110" y2="270" marker-end="url(#arrowS)"/>
  <line class="arrow-line" x1="250" y1="238" x2="290" y2="270" marker-end="url(#arrowS)"/>
  <text class="t-note" x="92" y="258">はい</text>
  <text class="t-note" x="290" y="258">いいえ</text>

  <rect class="box-pos" x="30" y="272" width="160" height="52" rx="6"/>
  <text class="t-big" x="110" y="294" text-anchor="middle">合格</text>
  <text class="t-desc" x="110" y="312" text-anchor="middle">二条件とも満たす</text>

  <rect class="box-dan" x="210" y="272" width="160" height="52" rx="6"/>
  <text class="t-big" x="290" y="294" text-anchor="middle">不合格</text>
  <text class="t-desc" x="290" y="312" text-anchor="middle">一方でも外れる</text>

  <rect class="box-sur" x="20" y="344" width="360" height="66" rx="6"/>
  <text class="t-name" x="200" y="368" text-anchor="middle">試験頻度</text>
  <text class="t-desc" x="200" y="388" text-anchor="middle">150 m³に1回（高強度は100 m³に1回）</text>

  <rect x="40" y="430" width="14" height="14" class="box-pos"/>
  <text class="t-desc" x="60" y="441">合格</text>
  <rect x="130" y="430" width="14" height="14" class="box-dan"/>
  <text class="t-desc" x="150" y="441">不合格</text>
  <rect x="230" y="430" width="14" height="14" class="box-warn"/>
  <text class="t-desc" x="250" y="441">判定</text>
  <rect x="310" y="430" width="14" height="14" class="box-b"/>
  <text class="t-desc" x="330" y="441">条件</text>
</svg>
