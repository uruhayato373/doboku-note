<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 300" style="max-width:430px;width:100%" role="img" aria-label="コンクリートの絶対容積構成図1。空気・水・セメント・細骨材・粗骨材の絶対容積を区画で示し、境界①〜④の移動を問う">
  <g transform="translate(30,0)">
  <rect x="20" y="20" width="360" height="220" fill="none" stroke="#222" stroke-width="1.5"/>
  <line x1="60" y1="20" x2="60" y2="240" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="110" y1="20" x2="110" y2="240" stroke="#222" stroke-width="1.5"/>
  <line x1="110" y1="140" x2="380" y2="140" stroke="#222" stroke-width="1.5"/>
  <line x1="200" y1="140" x2="200" y2="240" stroke="#222" stroke-width="1.5"/>
  <text x="85" y="60" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">水の</text>
  <text x="85" y="76" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">絶対容積</text>
  <text x="245" y="70" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">細骨材の絶対容積</text>
  <text x="290" y="190" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">粗骨材の絶対容積</text>
  <text x="155" y="190" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">セメントの</text>
  <text x="155" y="206" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">絶対容積</text>
  <text x="20" y="45" text-anchor="end" font-family="sans-serif" font-size="11" fill="#555">空気の</text>
  <text x="20" y="59" text-anchor="end" font-family="sans-serif" font-size="11" fill="#555">絶対容積</text>
  <path d="M20 55 L45 40" fill="none" stroke="#555" stroke-width="1"/>
  <circle cx="60" cy="90" r="3.5" fill="#222"/>
  <line x1="60" y1="90" x2="30" y2="90" stroke="#222" stroke-width="1.3"/>
  <text x="65" y="105" font-family="sans-serif" font-size="13" fill="#222">①</text>
  <circle cx="110" cy="170" r="3.5" fill="#222"/>
  <line x1="110" y1="170" x2="110" y2="195" stroke="#222" stroke-width="1.3"/>
  <text x="118" y="168" font-family="sans-serif" font-size="13" fill="#222">②</text>
  <circle cx="200" cy="110" r="3.5" fill="#222"/>
  <line x1="200" y1="110" x2="220" y2="110" stroke="#222" stroke-width="1.3"/>
  <text x="205" y="103" font-family="sans-serif" font-size="13" fill="#222">③</text>
  <circle cx="200" cy="190" r="3.5" fill="#222"/>
  <line x1="200" y1="190" x2="180" y2="190" stroke="#222" stroke-width="1.3"/>
  <text x="205" y="183" font-family="sans-serif" font-size="13" fill="#222">④</text>
  <text x="200" y="265" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">図1</text>
  </g>
</svg>
