<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 340" style="max-width:320px;width:100%" role="img" aria-label="コンクリートの絶対容積構成の模式図。境界線①〜④の移動とスランプの関係を問う図">
  <rect x="20" y="20" width="280" height="300" fill="none" stroke="#222" stroke-width="1.5"/>
  <line x1="160" y1="20" x2="160" y2="90" stroke="#222" stroke-width="1.5"/>
  <line x1="20" y1="90" x2="300" y2="90" stroke="#222" stroke-width="1.5"/>
  <line x1="100" y1="90" x2="100" y2="320" stroke="#222" stroke-width="1.5"/>
  <circle cx="130" cy="45" r="3.5" fill="#222"/>
  <line x1="130" y1="45" x2="70" y2="45" stroke="#222" stroke-width="1.3"/>
  <text x="140" y="42" font-family="sans-serif" font-size="13" fill="#222">②</text>
  <circle cx="80" cy="70" r="3.5" fill="#222"/>
  <line x1="80" y1="70" x2="80" y2="35" stroke="#222" stroke-width="1.3"/>
  <text x="60" y="30" text-anchor="end" font-family="sans-serif" font-size="13" fill="#222">①</text>
  <circle cx="60" cy="200" r="3.5" fill="#222"/>
  <line x1="60" y1="200" x2="60" y2="170" stroke="#222" stroke-width="1.3"/>
  <text x="30" y="165" font-family="sans-serif" font-size="13" fill="#222">③</text>
  <circle cx="180" cy="240" r="3.5" fill="#222"/>
  <line x1="180" y1="240" x2="180" y2="260" stroke="#222" stroke-width="1.3"/>
  <text x="190" y="270" font-family="sans-serif" font-size="13" fill="#222">④</text>
</svg>
