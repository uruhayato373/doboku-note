<!-- authored 2026-09-30 doboku-note 自作。題材は主任技士教材の絶対容積による配合の模式図。書籍図の複製・トレースではない -->
<svg viewBox="0 0 320 340" xmlns="http://www.w3.org/2000/svg" style="max-width:320px;width:100%" role="img" aria-label="コンクリートの絶対容積構成の模式図。境界線①〜④の移動とスランプの関係を問う図">
  <defs>
    <marker id="mv" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#1a3a5c"/></marker>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-label { font-size: 13px; fill: #1a3a5c; }
      .line-main { stroke: #2e6da4; stroke-width: 1.5; fill: none; }
      .line-move { stroke: #1a3a5c; stroke-width: 1.3; fill: none; }
      .dot { fill: #1a3a5c; }
    </style>
  </defs>
  <rect x="20" y="20" width="280" height="300" fill="none" stroke="#2e6da4" stroke-width="1.5"/>
  <line class="line-main" x1="196" y1="20" x2="196" y2="106"/>
  <line class="line-main" x1="20" y1="106" x2="300" y2="106"/>
  <line class="line-main" x1="146" y1="106" x2="146" y2="302"/>
  <line class="line-main" x1="20" y1="302" x2="300" y2="302"/>
  <circle class="dot" cx="196" cy="80" r="3.5"/>
  <line class="line-move" marker-end="url(#mv)" x1="196" y1="80" x2="172" y2="80"/>
  <text class="t-label" x="170" y="70">①</text>
  <circle class="dot" cx="94" cy="106" r="3.5"/>
  <line class="line-move" marker-end="url(#mv)" x1="94" y1="106" x2="94" y2="84"/>
  <text class="t-label" x="68" y="92">②</text>
  <circle class="dot" cx="146" cy="200" r="3.5"/>
  <line class="line-move" marker-end="url(#mv)" x1="146" y1="200" x2="170" y2="200"/>
  <text class="t-label" x="152" y="188">③</text>
  <circle class="dot" cx="204" cy="302" r="3.5"/>
  <line class="line-move" marker-end="url(#mv)" x1="204" y1="302" x2="204" y2="280"/>
  <text class="t-label" x="212" y="290">④</text>
</svg>
