<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 340" style="max-width:320px;width:100%" role="img" aria-label="コンクリートの絶対容積構成の模式図。境界線①〜④の移動とスランプの関係を問う図（上下双方向の矢印つき）">
  <rect x="20" y="20" width="280" height="300" fill="none" stroke="#222" stroke-width="1.5"/>
  <line x1="20" y1="110" x2="300" y2="110" stroke="#222" stroke-width="1.5"/>
  <line x1="180" y1="20" x2="180" y2="110" stroke="#222" stroke-width="1.5"/>
  <line x1="100" y1="110" x2="100" y2="320" stroke="#222" stroke-width="1.5"/>
  <circle cx="230" cy="55" r="3.5" fill="#222"/>
  <line x1="230" y1="40" x2="230" y2="70" stroke="#222" stroke-width="1.3"/>
  <text x="240" y="50" font-family="sans-serif" font-size="13" fill="#222">①</text>
  <circle cx="150" cy="65" r="3.5" fill="#222"/>
  <line x1="130" y1="65" x2="170" y2="65" stroke="#222" stroke-width="1.3"/>
  <text x="150" y="55" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222">②</text>
  <circle cx="55" cy="150" r="3.5" fill="#222"/>
  <line x1="55" y1="135" x2="55" y2="165" stroke="#222" stroke-width="1.3"/>
  <text x="30" y="155" font-family="sans-serif" font-size="13" fill="#222">③</text>
  <circle cx="150" cy="230" r="3.5" fill="#222"/>
  <line x1="130" y1="230" x2="170" y2="230" stroke="#222" stroke-width="1.3"/>
  <text x="150" y="250" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222">④</text>
</svg>
