<!-- authored 2026-10-10 doboku-note 自作。題材は主任技士テキスト「materials」の水和に必要な水量の論点。特定の書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="セメント質量を100としたときの水の内訳。結合水25とゲル水15の合計40が水和に使われ、水セメント比60%では残り20が余剰水となる">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 11px; fill: #555; }
      .sec { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .in { fill: #1a3a5c; text-anchor: middle; }
      .bound { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .gel { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .free { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .ax { stroke: #d7d7d7; stroke-width: 1; }
    </style>
  </defs>
  <text x="20" y="20">セメント質量を 100 としたときの水の量</text>
  <line class="ax" x1="40" y1="52" x2="340" y2="52" />
  <text x="40" y="46" text-anchor="middle">0</text>
  <text x="165" y="46" text-anchor="middle">25</text>
  <text x="240" y="46" text-anchor="middle">40</text>
  <text x="340" y="46" text-anchor="middle">60</text>
  <text class="sec" x="20" y="90">水セメント比 40 %</text>
  <rect class="bound" x="40" y="100" width="125" height="34" />
  <text class="in" x="102" y="121">結合水 25</text>
  <rect class="gel" x="165" y="100" width="75" height="34" />
  <text class="in" x="202" y="121">ゲル水 15</text>
  <text x="20" y="156">練混ぜ水がほぼ水和に使われる</text>
  <text class="sec" x="20" y="202">水セメント比 60 %</text>
  <rect class="bound" x="40" y="212" width="125" height="34" />
  <text class="in" x="102" y="233">結合水 25</text>
  <rect class="gel" x="165" y="212" width="75" height="34" />
  <text class="in" x="202" y="233">ゲル水 15</text>
  <rect class="free" x="240" y="212" width="100" height="34" />
  <text class="in" x="290" y="233">余剰水 20</text>
  <text x="20" y="268">余剰水は抜けて毛細管空隙になる</text>
  <rect class="box" x="20" y="302" width="360" height="94" rx="6" />
  <text class="sec" x="36" y="326">水の三つの行き先</text>
  <text x="36" y="348">結合水：水和物の一部になり、化学的に結合する</text>
  <text x="36" y="366">ゲル水：水和物の微細な空隙に吸着される</text>
  <text x="36" y="384">余剰水：水和に使われず、硬化後に空隙を残す</text>
  <text x="20" y="432">数値は一例（出典で約23／21とする整理もある）</text>
</svg>
