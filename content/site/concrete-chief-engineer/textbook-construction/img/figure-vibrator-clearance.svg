<!-- authored 2026-10-08 doboku-note 自作。題材は配筋平面における振動機の挿入空隙・配管・スペーサ。特定の書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="鉄筋の平面配置の概念図。鉄筋のあきが狭い格子には棒形振動機が入らず、あきを広げた位置には入る。配管は挿入空隙を狭め、スペーサは型枠との間に置く">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-desc { font-size: 12px; fill: #555; }
      .t-in   { font-size: 11px; fill: #1a3a5c; }
      .frame { fill: #f5f5f5; stroke: #555; stroke-width: 2; }
      .rebar { stroke: #8a8a8a; stroke-width: 3; fill: none; }
      .conduit { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .spacer { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .ok { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 2; }
      .ng { fill: none; stroke: #b22234; stroke-width: 2; stroke-dasharray: 5 3; }
      .ngx { stroke: #b22234; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect class="frame" x="40" y="20" width="320" height="344"/>

  <!-- 鉄筋（縦） -->
  <line class="rebar" x1="70" y1="20" x2="70" y2="364"/>
  <line class="rebar" x1="110" y1="20" x2="110" y2="364"/>
  <line class="rebar" x1="150" y1="20" x2="150" y2="364"/>
  <line class="rebar" x1="225" y1="20" x2="225" y2="364"/>
  <line class="rebar" x1="300" y1="20" x2="300" y2="364"/>
  <line class="rebar" x1="340" y1="20" x2="340" y2="364"/>
  <!-- 鉄筋（横） -->
  <line class="rebar" x1="40" y1="50" x2="360" y2="50"/>
  <line class="rebar" x1="40" y1="90" x2="360" y2="90"/>
  <line class="rebar" x1="40" y1="130" x2="360" y2="130"/>
  <line class="rebar" x1="40" y1="210" x2="360" y2="210"/>
  <line class="rebar" x1="40" y1="290" x2="360" y2="290"/>
  <line class="rebar" x1="40" y1="332" x2="360" y2="332"/>

  <!-- 配管 -->
  <rect class="conduit" x="40" y="238" width="320" height="16"/>

  <!-- スペーサ -->
  <rect class="spacer" x="42" y="68" width="12" height="12"/>
  <rect class="spacer" x="42" y="168" width="12" height="12"/>
  <rect class="spacer" x="42" y="308" width="12" height="12"/>

  <!-- 振動機 -->
  <circle class="ng" cx="130" cy="110" r="22"/>
  <line class="ngx" x1="120" y1="100" x2="140" y2="120"/>
  <line class="ngx" x1="140" y1="100" x2="120" y2="120"/>
  <circle class="ok" cx="262" cy="170" r="22"/>

  <!-- 凡例 -->
  <line class="rebar" x1="30" y1="382" x2="54" y2="382"/>
  <text class="t-desc" x="62" y="386">鉄筋</text>
  <rect class="frame" x="150" y="374" width="24" height="16"/>
  <text class="t-desc" x="182" y="386">型枠（外枠）</text>
  <circle class="ng" cx="42" cy="410" r="9"/>
  <text class="t-desc" x="62" y="414">あきが狭く振動機が入らない</text>
  <circle class="ok" cx="42" cy="434" r="9"/>
  <text class="t-desc" x="62" y="438">要所に確保する挿入空隙</text>
  <rect class="conduit" x="33" y="451" width="18" height="12"/>
  <text class="t-desc" x="62" y="462">配管（空隙を狭める）</text>
  <rect class="spacer" x="36" y="474" width="12" height="12"/>
  <text class="t-desc" x="62" y="485">スペーサ（かぶりを確保）</text>
</svg>
