<!-- authored 2026-10-10 doboku-note 自作。題材はスペーサの良い取付けと、浮き・変形・ドーナツ横掛けの不良。特定の書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="スペーサ取付けの断面概念図。型枠と鉄筋の間に密着して置いた良い例と、型枠にも鉄筋にも接しない浮いた例、つぶれて鉄筋が型枠側へ寄った変形の例、ドーナツ形を横に掛けて向きが定まらない例を並べる">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 11px; fill: #555; }
      .t-ok { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-ng { font-size: 13px; font-weight: bold; fill: #b22234; }
      .p-ok { fill: #f5f5f5; stroke: #3a7d44; stroke-width: 1.5; }
      .p-ng { fill: #f5f5f5; stroke: #b22234; stroke-width: 1.5; }
      .form { fill: #8a8a8a; }
      .bar { fill: #555; }
      .sp { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .sp-ng { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .dim { stroke: #555; stroke-width: 1; fill: none; }
      .gap { stroke: #b22234; stroke-width: 1.5; stroke-dasharray: 3 2; fill: none; }
    </style>
  </defs>

  <rect class="p-ok" x="20" y="24" width="170" height="190" rx="6"/>
  <rect class="form" x="30" y="40" width="10" height="120"/>
  <rect class="sp" x="40" y="88" width="40" height="24"/>
  <circle class="bar" cx="90" cy="100" r="10"/>
  <path class="dim" d="M40,128 L40,134 M40,131 L80,131 M80,128 L80,134"/>
  <text x="42" y="148">かぶり</text>
  <text class="t-ok" x="30" y="184">良い</text>
  <text x="30" y="202">型枠と鉄筋に密着</text>

  <rect class="p-ng" x="210" y="24" width="170" height="190" rx="6"/>
  <rect class="form" x="220" y="40" width="10" height="120"/>
  <rect class="sp-ng" x="238" y="88" width="40" height="24"/>
  <circle class="bar" cx="296" cy="100" r="10"/>
  <line class="gap" x1="230" y1="100" x2="238" y2="100"/>
  <line class="gap" x1="278" y1="100" x2="286" y2="100"/>
  <text class="t-ng" x="220" y="184">浮き</text>
  <text x="220" y="202">どちらにも接しない</text>

  <rect class="p-ng" x="20" y="236" width="170" height="190" rx="6"/>
  <rect class="form" x="30" y="252" width="10" height="120"/>
  <rect class="sp-ng" x="40" y="300" width="18" height="28"/>
  <circle class="bar" cx="68" cy="314" r="10"/>
  <path class="dim" d="M40,340 L40,346 M40,343 L58,343 M58,340 L58,346"/>
  <text x="42" y="360">かぶり不足</text>
  <text class="t-ng" x="30" y="396">変形</text>
  <text x="30" y="414">つぶれてかぶり不足</text>

  <rect class="p-ng" x="210" y="236" width="170" height="190" rx="6"/>
  <rect class="form" x="220" y="252" width="10" height="120"/>
  <ellipse class="sp-ng" cx="270" cy="314" rx="7" ry="18" transform="rotate(25 270 314)"/>
  <circle class="bar" cx="296" cy="314" r="10"/>
  <line class="gap" x1="230" y1="314" x2="252" y2="314"/>
  <text class="t-ng" x="220" y="396">ドーナツ横掛け</text>
  <text x="220" y="414">向きが定まらない</text>

  <text x="200" y="458" text-anchor="middle">浮き・変形したスペーサは、かぶりを保てないまま</text>
  <text x="200" y="476" text-anchor="middle">コンクリート中に残る異物になる</text>
</svg>
