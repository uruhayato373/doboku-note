<!-- authored 2026-10-08 doboku-note 自作。題材は打設計画書に書き込む区画・順序・打止め位置の平面。特定の書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="打設計画の平面概念図。床を4つの区画に分けて片押しで打ち進め、ポンプ車と生コン車の位置、雨天などで中止するときの打止め位置を書き込む。下に時間と人員と連絡の確認項目を示す">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-name { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-desc { font-size: 11px; fill: #555; }
      .t-num  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .box-b   { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-sur { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-pos { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .arrow { stroke: #555; stroke-width: 1.5; fill: none; }
      .stop { stroke: #b22234; stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
    </style>
    <marker id="ah" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#555"/>
    </marker>
  </defs>


  <!-- 床の平面 -->
  <rect class="box-sur" x="30" y="30" width="340" height="170" rx="4"/>
  <rect class="box-b" x="30" y="30" width="85" height="170"/>
  <rect class="box-sur" x="115" y="30" width="85" height="170"/>
  <rect class="box-b" x="200" y="30" width="85" height="170"/>
  <rect class="box-sur" x="285" y="30" width="85" height="170"/>
  <text class="t-name" x="72" y="52" text-anchor="middle">区画1</text>
  <text class="t-name" x="157" y="52" text-anchor="middle">区画2</text>
  <text class="t-name" x="242" y="52" text-anchor="middle">区画3</text>
  <text class="t-name" x="327" y="52" text-anchor="middle">区画4</text>
  <text class="t-desc" x="72" y="70" text-anchor="middle">1番目</text>
  <text class="t-desc" x="157" y="70" text-anchor="middle">2番目</text>
  <text class="t-desc" x="242" y="70" text-anchor="middle">3番目</text>
  <text class="t-desc" x="327" y="70" text-anchor="middle">4番目</text>

  <line class="arrow" x1="50" y1="150" x2="348" y2="150" marker-end="url(#ah)"/>
  <text class="t-desc" x="125" y="140" text-anchor="middle">片押しで打ち進む</text>

  <line class="stop" x1="200" y1="30" x2="200" y2="200"/>

  <!-- ポンプ車・生コン車 -->
  <rect class="box-pos" x="30" y="222" width="150" height="40" rx="6"/>
  <text class="t-name" x="105" y="246" text-anchor="middle">ポンプ車・配管</text>
  <rect class="box-warn" x="220" y="222" width="150" height="40" rx="6"/>
  <text class="t-name" x="295" y="246" text-anchor="middle">生コン車の搬入路</text>
  <line class="arrow" x1="218" y1="242" x2="182" y2="242" marker-end="url(#ah)"/>

  <line class="stop" x1="30" y1="282" x2="62" y2="282"/>
  <text class="t-desc" x="70" y="286">中止するときの打止め位置</text>
  <rect class="box-b" x="236" y="274" width="14" height="14"/>
  <text class="t-desc" x="258" y="286">交互の色分けは見分け用</text>

  <!-- 確認項目 -->
  <rect class="box-sur" x="20" y="306" width="360" height="52" rx="6"/>
  <text class="t-name" x="32" y="327">時間</text>
  <text class="t-desc" x="32" y="345">面積 × 層厚 ÷ 打込み能力 が許容打重ね時間内か</text>

  <rect class="box-sur" x="20" y="368" width="360" height="52" rx="6"/>
  <text class="t-name" x="32" y="389">人員・機器</text>
  <text class="t-desc" x="32" y="407">ポンプ操作・ホース・締固め・見張り</text>

  <rect class="box-sur" x="20" y="430" width="360" height="52" rx="6"/>
  <text class="t-name" x="32" y="451">連絡</text>
  <text class="t-desc" x="32" y="469">工場の出荷間隔・搬入経路・荷下ろし位置</text>
</svg>
