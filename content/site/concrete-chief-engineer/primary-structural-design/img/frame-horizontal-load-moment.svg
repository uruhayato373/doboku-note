  <circle cx="364" cy="124" r="9" fill="none" stroke="#1a3a5c" stroke-dasharray="3 3" />
  <text class="t-label" x="272" y="150">開く</text>
  <text class="t-label" x="352" y="150" text-anchor="end">閉じる</text>
