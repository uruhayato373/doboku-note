<!-- authored 2026-09-30 doboku-note 自作。題材は主任技士教材の平成27年度問題27（片持ち梁と断面）。書籍図の複製・トレースではない -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 270" style="max-width:412px;width:100%" role="img" aria-label="壁に固定された片持ち梁に荷重Pが作用する側面図と、梁断面(a)幅B・(b)幅B'=1.5Bの2種類の断面（主筋4本を四隅に配置）">
