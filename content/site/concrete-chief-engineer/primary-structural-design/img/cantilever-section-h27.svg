<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" style="max-width:400px;width:100%" role="img" aria-label="壁に固定された片持ち梁に荷重Pが作用する側面図と、梁断面(a)幅B・(b)幅B'=1.5Bの2種類の断面（主筋4本を四隅に配置）">
  <defs><marker id="csa" viewBox="0 0 10 10" refX="8" refY="8" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
  <pattern id="csw" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#8a8a8a" stroke-width="1.2"/></pattern></defs>
  <rect x="16" y="20" width="14" height="60" fill="url(#csw)" stroke="#222" stroke-width="1"/>
  <line x1="30" y1="35" x2="180" y2="35" stroke="#222" stroke-width="1.5"/>
  <line x1="30" y1="65" x2="180" y2="65" stroke="#222" stroke-width="1.5"/>
  <line x1="120" y1="10" x2="120" y2="33" stroke="#222" stroke-width="1.6" marker-end="url(#csa)"/>
  <text x="120" y="8" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222">P</text>
  <rect x="220" y="60" width="60" height="120" fill="none" stroke="#222" stroke-width="1.5"/>
  <circle cx="235" cy="75" r="4" fill="#222"/><circle cx="265" cy="75" r="4" fill="#222"/>
  <circle cx="235" cy="165" r="4" fill="#222"/><circle cx="265" cy="165" r="4" fill="#222"/>
  <line x1="220" y1="45" x2="280" y2="45" stroke="#222" stroke-width="1"/>
  <text x="250" y="38" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222">B</text>
  <text x="250" y="200" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222">(a)</text>
  <rect x="310" y="60" width="90" height="120" fill="none" stroke="#222" stroke-width="1.5"/>
  <circle cx="330" cy="75" r="4" fill="#222"/><circle cx="380" cy="75" r="4" fill="#222"/>
  <circle cx="330" cy="165" r="4" fill="#222"/><circle cx="380" cy="165" r="4" fill="#222"/>
  <line x1="310" y1="45" x2="400" y2="45" stroke="#222" stroke-width="1"/>
  <text x="355" y="38" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222">B'</text>
  <text x="355" y="200" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222">(b)</text>
  <line x1="220" y1="60" x2="400" y2="60" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="205" y1="60" x2="205" y2="180" stroke="#222" stroke-width="1"/>
  <text x="196" y="120" text-anchor="end" font-family="sans-serif" font-size="13" fill="#222">H</text>
  <text x="300" y="225" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">梁断面</text>
  <text x="300" y="243" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">（梁幅 B'=1.5 B）</text>
</svg>
