<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" style="max-width:480px;width:100%" role="img" aria-label="PC梁断面2種(a)(b)（黒丸はPC鋼材、それぞれ図心位置が異なる）と、単純支持された梁に荷重Pが作用する側面図">
  <rect x="40" y="30" width="90" height="150" fill="none" stroke="#222" stroke-width="1.5"/>
  <circle cx="85" cy="90" r="6" fill="#222"/>
  <rect x="150" y="30" width="90" height="150" fill="none" stroke="#222" stroke-width="1.5"/>
  <circle cx="195" cy="140" r="6" fill="#222"/>
  <text x="85" y="200" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222">(a)</text>
  <text x="195" y="200" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222">(b)</text>
  <text x="140" y="225" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">PC梁断面</text>
