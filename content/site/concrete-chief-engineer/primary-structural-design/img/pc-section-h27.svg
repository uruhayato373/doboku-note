  <text x="375" y="52" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222">P</text>
  <path d="M310 120 L300 135 L320 135 Z" fill="none" stroke="#222" stroke-width="1.5"/>
  <path d="M440 120 L430 135 L450 135 Z" fill="none" stroke="#222" stroke-width="1.5"/>
