<!-- authored 2026-09-30 doboku-note 自作。題材は主任技士教材の片持ち梁の曲げと主筋配置。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 332" xmlns="http://www.w3.org/2000/svg"
