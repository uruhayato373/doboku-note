<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" style="max-width:380px;width:100%" role="img" aria-label="ビンガム流体モデルのせん断応力とせん断ひずみ速度の関係を示す4本の直線A・B・C・D">
  <line x1="60.0" y1="240.0" x2="375.0" y2="240.0" stroke="#222" stroke-width="1.5"/>
  <line x1="60.0" y1="15.0" x2="60.0" y2="240.0" stroke="#222" stroke-width="1.5"/>
  <line x1="120.0" y1="240.0" x2="270.0" y2="30.0" stroke="#222" stroke-width="1.8"/>
  <text x="276.0" y="34.0" text-anchor="start" font-family="sans-serif" font-size="13" fill="#222" font-weight="bold">A</text>
  <line x1="155.0" y1="240.0" x2="285.0" y2="30.0" stroke="#222" stroke-width="1.8" stroke-dasharray="6 3"/>
  <text x="291.0" y="34.0" text-anchor="start" font-family="sans-serif" font-size="13" fill="#222" font-weight="bold">B</text>
  <line x1="160.0" y1="240.0" x2="300.0" y2="30.0" stroke="#222" stroke-width="1.8" stroke-dasharray="2 2"/>
  <text x="306.0" y="34.0" text-anchor="start" font-family="sans-serif" font-size="13" fill="#222" font-weight="bold">C</text>
  <line x1="200.0" y1="240.0" x2="315.0" y2="30.0" stroke="#222" stroke-width="1.8" stroke-dasharray="6 3 2 3"/>
  <text x="321.0" y="34.0" text-anchor="start" font-family="sans-serif" font-size="13" fill="#222" font-weight="bold">D</text>
  <text x="18.0" y="130.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222" transform="rotate(-90 18 130.0)">せん断ひずみ速度</text>
  <text x="210.0" y="262.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">せん断応力</text>
</svg>
