<!-- authored 2026-09-30 doboku-note 自作。題材は主任技士教材のクリープ（載荷・除荷と時間-ひずみ関係）。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="圧縮荷重を載荷し一定期間持続してから除荷したときの時間とひずみの関係。載荷直後のひずみは500×10のマイナス6乗、除荷直前は1500×10のマイナス6乗で、除荷後は緩やかに減少する曲線">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-axis  { font-size: 11px; fill: #8a8a8a; }
      .t-label { font-size: 11px; fill: #1a3a5c; }
      .line-main { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .line-dash { stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .axis { stroke: #555; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <line class="axis" x1="90" y1="200" x2="370" y2="200" />
  <line class="axis" x1="90" y1="24" x2="90" y2="200" />
  <text class="t-axis" x="94" y="20">ひずみ</text>
  <text class="t-axis" x="370" y="220" text-anchor="end">時間</text>

  <line class="line-main" x1="140" y1="200" x2="140" y2="130" />
  <path class="line-main" d="M140,130 C 185,92 240,74 290,68" />
  <line class="line-main" x1="290" y1="68" x2="290" y2="128" />
  <path class="line-main" d="M290,128 C 315,144 335,156 350,162" />

  <line class="line-dash" x1="90" y1="130" x2="140" y2="130" />
  <line class="line-dash" x1="90" y1="68" x2="290" y2="68" />
  <line class="line-dash" x1="290" y1="68" x2="290" y2="200" />

  <text class="t-label" x="84" y="134" text-anchor="end">500×10⁻⁶</text>
  <text class="t-label" x="84" y="72" text-anchor="end">1 500×10⁻⁶</text>
  <text class="t-label" x="140" y="220" text-anchor="middle">載荷</text>
  <text class="t-label" x="290" y="220" text-anchor="middle">除荷</text>
</svg>
