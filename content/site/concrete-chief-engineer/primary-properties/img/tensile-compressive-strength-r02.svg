<!-- authored 2026-09-30 doboku-note 自作。題材は主任技士教材の圧縮強度と引張強度の関係。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 430" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="圧縮強度と引張強度の傾向図。引張強度は圧縮強度とともに増えるが、比率が一定の直線より下に曲がり、高強度ほど比率が小さくなる">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 11px; fill: #555; }
      .t-axis  { font-size: 11px; fill: #8a8a8a; }
      .t-label { font-size: 11px; fill: #1a3a5c; }
      .t-desc  { font-size: 11px; fill: #555; }
      .line-main { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .line-sub { stroke: #1a3a5c; stroke-width: 2; fill: none; }
      .line-dash { stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .box { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
    </style>
  </defs>

  <text class="t-lead" x="200" y="16" text-anchor="middle">数値なし・傾向を示す（引張強度と圧縮強度の関係）</text>
  <line class="line-dash" x1="50" y1="270" x2="370" y2="270" />
  <line class="line-dash" x1="50" y1="50" x2="50" y2="270" />
  <text class="t-axis" x="370" y="286" text-anchor="end">圧縮強度 →</text>
  <text class="t-axis" x="54" y="44">引張強度</text>  <line class="line-dash" x1="50" y1="270" x2="330" y2="120" />
  <text class="t-axis" x="322" y="112" text-anchor="end">比率が一定と仮定した直線</text>
  <path class="line-main" d="M50,270 C 90,190 160,150 340,112" />
  <circle cx="340" cy="112" r="3" fill="#2e6da4" />
  <text class="t-label" x="120" y="170">実際の関係</text>
  <text class="t-lead" x="20" y="326">読み取り方</text>
  <rect class="box" x="20" y="332" width="360" height="88" rx="6" />
  <rect class="box-b" x="34" y="338" width="14" height="14" />
  <text class="t-desc" x="54" y="350">引張強度は圧縮強度とともに増える</text>
  <rect class="box-b" x="34" y="362" width="14" height="14" />
  <text class="t-desc" x="54" y="374">ただし増え方は緩やかで、高強度ほど</text>
  <rect class="box-b" x="34" y="386" width="14" height="14" />
  <text class="t-desc" x="54" y="398">（引張強度÷圧縮強度）の比率は小さくなる</text>

</svg>
