<!-- authored 2026-09-30 doboku-note 自作。題材は主任技士教材の鉄筋の位置・種類と付着強度。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 486" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="鉄筋の位置と付着強度の傾向図。丸鋼・異形鉄筋のいずれも、垂直筋、水平筋、下端筋、上端筋の順に付着強度が小さくなり、異形鉄筋は丸鋼より大きい">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 11px; fill: #555; }
      .t-axis  { font-size: 11px; fill: #8a8a8a; }
      .t-label { font-size: 11px; fill: #1a3a5c; }
      .t-desc  { font-size: 11px; fill: #555; }
      .line-main { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .line-sub { stroke: #1a3a5c; stroke-width: 2; fill: none; }
      .line-dash { stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .box { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
    </style>
  </defs>

  <text class="t-lead" x="200" y="16" text-anchor="middle">数値なし・傾向を示す（棒の長さは大小関係のイメージ）</text>
  <rect x="24" y="30" width="14" height="14" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="1.5" />
  <text class="t-desc" x="44" y="42">丸鋼</text>
  <rect x="100" y="30" width="14" height="14" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5" />
  <text class="t-desc" x="120" y="42">異形鉄筋</text>
  <line class="line-dash" x1="90" y1="56" x2="90" y2="290" />
  <text class="t-label" x="82" y="86" text-anchor="end">垂直筋</text>
  <rect x="90" y="64" width="84" height="16" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="1.5" />
  <rect x="90" y="84" width="211" height="16" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5" />
  <text class="t-label" x="82" y="142" text-anchor="end">水平筋</text>
  <rect x="90" y="120" width="24" height="16" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="1.5" />
  <rect x="90" y="140" width="115" height="16" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5" />
  <text class="t-label" x="82" y="198" text-anchor="end">下端筋</text>
  <rect x="90" y="176" width="18" height="16" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="1.5" />
  <rect x="90" y="196" width="96" height="16" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5" />
  <text class="t-label" x="82" y="254" text-anchor="end">上端筋</text>
  <rect x="90" y="232" width="7" height="16" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="1.5" />
  <rect x="90" y="252" width="48" height="16" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5" />
  <text class="t-axis" x="380" y="304" text-anchor="end">付着強度（大きい →）</text>
  <text class="t-lead" x="20" y="334">なぜ差が出るか</text>
  <rect class="box" x="20" y="340" width="360" height="126" rx="6" />
  <rect class="box-b" x="34" y="352" width="14" height="14" />
  <text class="t-desc" x="54" y="364">垂直筋：周囲のコンクリートが密に充填される</text>
  <rect class="box-b" x="34" y="378" width="14" height="14" />
  <text class="t-desc" x="54" y="390">水平筋・下端筋：ブリーディングで鉄筋下面に空隙</text>
  <rect class="box-b" x="34" y="404" width="14" height="14" />
  <text class="t-desc" x="54" y="416">上端筋：沈降・ブリーディングの影響が最も大きい</text>
  <rect class="box-b" x="34" y="430" width="14" height="14" />
  <text class="t-desc" x="54" y="442">異形鉄筋：リブがかみ合うため丸鋼より大きい</text>

</svg>
