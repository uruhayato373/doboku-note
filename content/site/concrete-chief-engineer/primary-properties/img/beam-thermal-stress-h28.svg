<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" style="max-width:400px;width:100%" role="img" aria-label="コンクリート梁の断面図。上下2段に配置された鉄筋と梁幅2mの寸法線、左右の支持壁を示す模式図">
  <pattern id="bthatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#8a8a8a" stroke-width="1.2"/></pattern>
  <line x1="20" y1="10" x2="20" y2="180" stroke="#222" stroke-width="6"/>
  <line x1="20" y1="10" x2="20" y2="180" stroke="url(#bthatch)" stroke-width="6"/>
  <line x1="380" y1="10" x2="380" y2="180" stroke="#222" stroke-width="6"/>
  <line x1="380" y1="10" x2="380" y2="180" stroke="url(#bthatch)" stroke-width="6"/>
  <rect x="20" y="60" width="360" height="80" fill="#f5f5f5" stroke="#222" stroke-width="1.5"/>
  <line x1="20" y1="75" x2="380" y2="75" stroke="#222" stroke-width="3"/>
  <line x1="20" y1="125" x2="380" y2="125" stroke="#222" stroke-width="3"/>
  <text x="200" y="115" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222">コンクリート</text>
  <line x1="20" y1="30" x2="380" y2="30" stroke="#222" stroke-width="1"/>
  <line x1="20" y1="24" x2="20" y2="36" stroke="#222" stroke-width="1"/>
  <line x1="380" y1="24" x2="380" y2="36" stroke="#222" stroke-width="1"/>
  <text x="200" y="20" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222">2 m</text>
  <path d="M100 175 L155 100" fill="none" stroke="#222" stroke-width="1" marker-end="url(#bta)"/>
  <path d="M170 175 L145 125" fill="none" stroke="#222" stroke-width="1" marker-end="url(#bta)"/>
  <defs><marker id="bta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
  <text x="100" y="195" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222">鉄筋</text>
</svg>
