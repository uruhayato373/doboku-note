  <path d="M50 150 C 100 60 200 35 320 30" fill="none" stroke="#222" stroke-width="1.8"/>
  <path d="M50 210 C 120 195 220 190 320 188" fill="none" stroke="#222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <line x1="320" y1="30" x2="320" y2="220" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="30" y1="30" x2="50" y2="30" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="30" y1="188" x2="50" y2="188" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 3"/>
