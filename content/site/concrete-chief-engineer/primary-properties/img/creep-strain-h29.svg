<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" style="max-width:400px;width:100%" role="img" aria-label="コンクリートのクリープひずみ概念図。載荷直後の弾性ひずみεeから1年後の合計ひずみεaへ漸増する曲線と、収縮ひずみεsの小さな曲線">
  <line x1="50" y1="220" x2="370" y2="220" stroke="#222" stroke-width="1.5"/>
