  <text x="36" y="38" font-family="sans-serif" font-size="9" fill="#222">a</text>
  <text x="30" y="192" text-anchor="end" font-family="sans-serif" font-size="13" fill="#222">ε</text>
  <text x="36" y="196" font-family="sans-serif" font-size="9" fill="#222">s</text>
  <text x="30" y="154" text-anchor="end" font-family="sans-serif" font-size="13" fill="#222">ε</text>
  <text x="36" y="158" font-family="sans-serif" font-size="9" fill="#222">e</text>
  <text x="18" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222" transform="rotate(-90 18 120)">ひずみ（ε）</text>
