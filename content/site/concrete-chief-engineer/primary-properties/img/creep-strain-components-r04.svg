<!-- authored 2026-09-30 doboku-note 自作。題材は主任技士教材のクリープひずみの構成（弾性ひずみ・クリープひずみ・回復・永久変形）。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 470" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="載荷から除荷までのひずみの内訳。載荷時の弾性ひずみ、増加するクリープひずみ、除荷時弾性ひずみ、回復クリープひずみ、除荷後に残る非回復クリープひずみを番号付きの区間で示す">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 11px; fill: #555; }
      .t-axis  { font-size: 11px; fill: #8a8a8a; }
      .t-label { font-size: 11px; fill: #1a3a5c; }
      .t-desc  { font-size: 11px; fill: #555; }
      .line-main { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .line-dash { stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .brk { stroke: #1a3a5c; stroke-width: 1.5; fill: none; }
      .box { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
  </defs>

  <text class="t-lead" x="200" y="16" text-anchor="middle">ひずみは5つの成分に分けて読む（数値なし）</text>

  <!-- axes -->
  <line class="line-dash" x1="40" y1="250" x2="372" y2="250" />
  <line class="line-dash" x1="40" y1="36" x2="40" y2="250" />
  <text class="t-axis" x="374" y="268" text-anchor="end">時間</text>
  <text class="t-axis" x="44" y="32">ひずみ</text>

  <!-- curve -->
  <line class="line-main" x1="100" y1="250" x2="100" y2="190" />
  <path class="line-main" d="M100,190 C 150,140 200,112 240,100" />
  <line class="line-main" x1="240" y1="100" x2="240" y2="160" />
  <path class="line-main" d="M240,160 C 270,186 300,200 336,206" />

  <!-- guides -->
  <line class="line-dash" x1="40" y1="190" x2="100" y2="190" />
  <line class="line-dash" x1="40" y1="100" x2="240" y2="100" />
  <line class="line-dash" x1="240" y1="40" x2="240" y2="250" />
  <line class="line-dash" x1="100" y1="40" x2="100" y2="250" />
  <text class="t-axis" x="100" y="268" text-anchor="middle">載荷</text>
  <text class="t-axis" x="240" y="268" text-anchor="middle">除荷</text>

  <!-- left brackets: 1, 2 -->
  <path class="brk" d="M78,250 L72,250 L72,190 L78,190" />
  <path class="brk" d="M78,190 L72,190 L72,100 L78,100" />
  <text class="t-label" x="60" y="224" text-anchor="middle">①</text>
  <text class="t-label" x="60" y="148" text-anchor="middle">②</text>

  <!-- right brackets: 3, 4, 5 -->
  <line class="line-dash" x1="240" y1="160" x2="352" y2="160" />
  <line class="line-dash" x1="336" y1="206" x2="352" y2="206" />
  <path class="brk" d="M346,100 L352,100 L352,160 L346,160" />
  <path class="brk" d="M346,160 L352,160 L352,206 L346,206" />
  <path class="brk" d="M346,206 L352,206 L352,250 L346,250" />
  <line class="line-dash" x1="240" y1="100" x2="352" y2="100" />
  <text class="t-label" x="366" y="134" text-anchor="middle">③</text>
  <text class="t-label" x="366" y="187" text-anchor="middle">④</text>
  <text class="t-label" x="366" y="232" text-anchor="middle">⑤</text>

  <text class="t-lead" x="20" y="300">区間の対応</text>
  <rect class="box" x="20" y="306" width="360" height="120" rx="6" />
  <text class="t-desc" x="34" y="326">① 弾性ひずみ ε₀：載荷の瞬間に生じる</text>
  <text class="t-desc" x="34" y="346">② クリープひずみ ε<tspan dy="3" font-size="9">c</tspan><tspan dy="-3">：</tspan>載荷中に増え続ける</text>
  <text class="t-desc" x="34" y="366">③ 除荷時弾性ひずみ：除荷の瞬間に戻る</text>
  <text class="t-desc" x="34" y="386">④ 回復クリープひずみ：除荷後に時間をかけて戻る</text>
  <text class="t-desc" x="34" y="406">⑤ 非回復クリープひずみ：戻らず残る（永久変形）</text>
  <text class="t-lead" x="200" y="456" text-anchor="middle">クリープ係数 φ ＝ ε<tspan dy="3" font-size="9">c</tspan><tspan dy="-3"> ÷ ε₀</tspan></text>
</svg>
