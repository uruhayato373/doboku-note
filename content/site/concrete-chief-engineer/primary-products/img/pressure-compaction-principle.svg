<!-- authored 2026-09-30 doboku-note 自作。題材は主任技士教材のコンクリート製品（加圧締固めによる矢板の製造）。書籍図（写真）の複製・トレースではない -->
<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="加圧締固めの模式断面図。型枠に投入したフレッシュコンクリートに蓋をして上から圧力を加え、余剰水が型枠外へ排出される">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 11px; fill: #555; }
      .t-axis  { font-size: 11px; fill: #8a8a8a; }
      .t-label { font-size: 11px; fill: #1a3a5c; }
      .t-desc  { font-size: 11px; fill: #555; }
      .line-main { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .line-frame { stroke: #555; stroke-width: 3; fill: none; }
      .line-dash { stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .mom { stroke: #2e6da4; stroke-width: 1.5; fill: #e8f0fe; fill-opacity: 0.8; }
      .box { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .fill-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .fill-g { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
    <marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e6da4"/></marker>
  </defs>
  <text class="t-lead" x="200" y="16" text-anchor="middle">加圧締固めの原理（模式図・寸法なし）</text>

  <line class="line-main" x1="200" y1="36" x2="200" y2="82" marker-end="url(#a3)" />
  <text class="t-label" x="212" y="60">圧力</text>

  <rect class="fill-g" x="100" y="86" width="200" height="16" rx="2" />
  <text class="t-label" x="200" y="98" text-anchor="middle">蓋（加圧板）</text>

  <rect class="fill-b" x="110" y="104" width="180" height="110" />
  <text class="t-label" x="200" y="164" text-anchor="middle">フレッシュコンクリート</text>

  <path class="line-frame" d="M100,104 V224 H300 V104" />
  <text class="t-label" x="200" y="244" text-anchor="middle">型枠</text>

  <line class="line-main" x1="104" y1="180" x2="60" y2="180" marker-end="url(#a3)" />
  <line class="line-main" x1="296" y1="180" x2="340" y2="180" marker-end="url(#a3)" />
  <text class="t-desc" x="20" y="200">余剰水</text>
  <text class="t-desc" x="322" y="200">余剰水</text>

  <rect class="box" x="20" y="262" width="360" height="44" rx="6" />
  <text class="t-desc" x="200" y="280" text-anchor="middle">加圧により脱水が進み、水セメント比が低下する</text>
  <text class="t-desc" x="200" y="296" text-anchor="middle">強度・耐久性が向上する（矢板・PC板など）</text>
</svg>
