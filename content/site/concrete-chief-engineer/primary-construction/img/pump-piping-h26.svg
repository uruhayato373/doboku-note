  <text x="72.0" y="398.0" text-anchor="end" font-family="sans-serif" font-size="9" fill="#222">0.005</text>
  <line x1="80.0" y1="350.0" x2="360.0" y2="350.0" stroke="#eee" stroke-width="1"/>
  <text x="72.0" y="353.0" text-anchor="end" font-family="sans-serif" font-size="9" fill="#222">0.010</text>
  <line x1="80.0" y1="305.0" x2="360.0" y2="305.0" stroke="#eee" stroke-width="1"/>
  <text x="72.0" y="308.0" text-anchor="end" font-family="sans-serif" font-size="9" fill="#222">0.015</text>
  <line x1="80.0" y1="260.0" x2="360.0" y2="260.0" stroke="#eee" stroke-width="1"/>
  <text x="72.0" y="263.0" text-anchor="end" font-family="sans-serif" font-size="9" fill="#222">0.020</text>
  <line x1="126.7" y1="323.0" x2="313.3" y2="269.0" stroke="#222" stroke-width="1.5" stroke-dasharray="6 3"/>
  <line x1="126.7" y1="377.0" x2="313.3" y2="323.0" stroke="#222" stroke-width="1.5"/>
  <text x="88.0" y="263.0" text-anchor="start" font-family="sans-serif" font-size="9" fill="#222">100A(4B)</text>
  <text x="88.0" y="337.0" text-anchor="start" font-family="sans-serif" font-size="9" fill="#222">125A(5B)</text>
  <text x="220.0" y="474.0" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#222">吐出量(m³/h)</text>
  <text x="44.0" y="350.0" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#222" transform="rotate(-90 44 350.0)">水平管1m当たりの管内圧力損失(N/mm²/m)</text>
  <text x="220.0" y="494.0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222">水平管1m当たりの管内圧力損失と吐出量の関係</text>
</svg>
