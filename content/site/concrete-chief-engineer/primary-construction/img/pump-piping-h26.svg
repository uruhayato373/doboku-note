<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" style="max-width:520px;width:100%" role="img" aria-label="コンクリートポンプの配管状況（水平管・垂直管・ベント管・テーパ管・フレキシブルホースの寸法）と、吐出量と管内圧力損失の関係を示す2系列(100A/125A)の折れ線グラフ">
  <rect x="20" y="150" width="40" height="22" fill="none" stroke="#222" stroke-width="1.3"/>
  <rect x="60" y="140" width="8" height="30" fill="none" stroke="#222" stroke-width="1.1"/>
  <circle cx="29" cy="176" r="5" fill="none" stroke="#222" stroke-width="1.2"/>
  <circle cx="50" cy="176" r="5" fill="none" stroke="#222" stroke-width="1.2"/>
  <text x="5.0" y="130.0" text-anchor="start" font-family="sans-serif" font-size="10" fill="#222">コンクリートポンプ</text>
  <line x1="68" y1="160" x2="220" y2="160" stroke="#222" stroke-width="2"/>
  <text x="144.0" y="152.0" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#222">水平管 30 m</text>
  <text x="144.0" y="178.0" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#222">125A</text>
  <text x="68.0" y="130.0" text-anchor="start" font-family="sans-serif" font-size="9" fill="#222">テーパ管</text>
  <text x="68.0" y="142.0" text-anchor="start" font-family="sans-serif" font-size="8" fill="#222">(150A→125A：1 m)</text>
  <line x1="220" y1="160" x2="220" y2="40" stroke="#222" stroke-width="2"/>
  <text x="212.0" y="100.0" text-anchor="end" font-family="sans-serif" font-size="9" fill="#222">垂直管 20m</text>
  <text x="212.0" y="114.0" text-anchor="end" font-family="sans-serif" font-size="9" fill="#222">125A</text>
  <text x="190.0" y="30.0" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#222">ベント管</text>
  <text x="190.0" y="42.0" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#222">(半径 1 m)</text>
  <line x1="220" y1="40" x2="400" y2="40" stroke="#222" stroke-width="2"/>
