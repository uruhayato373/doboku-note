  <line x1="220.0" y1="260.0" x2="220.0" y2="440.0" stroke="#eee" stroke-width="1"/>
  <text x="220.0" y="456.0" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#222">30</text>
  <line x1="266.7" y1="260.0" x2="266.7" y2="440.0" stroke="#eee" stroke-width="1"/>
