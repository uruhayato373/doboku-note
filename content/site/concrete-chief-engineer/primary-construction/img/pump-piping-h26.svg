  <text x="280.0" y="54.0" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#222">100A</text>
  <line x1="400" y1="40" x2="440" y2="40" stroke="#222" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="420.0" y="30.0" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#222">6 m</text>
  <text x="450.0" y="36.0" text-anchor="start" font-family="sans-serif" font-size="9" fill="#222">フレキシブルホース</text>
  <text x="210.0" y="16.0" text-anchor="end" font-family="sans-serif" font-size="9" fill="#222">テーパ管</text>
  <text x="210.0" y="28.0" text-anchor="end" font-family="sans-serif" font-size="8" fill="#222">(125A→100A：1 m)</text>
  <text x="260.0" y="0.0" text-anchor="start" font-family="sans-serif" font-size="9" fill="#222">ベント管</text>
  <text x="260.0" y="12.0" text-anchor="start" font-family="sans-serif" font-size="8" fill="#222">(半径 1 m)</text>
