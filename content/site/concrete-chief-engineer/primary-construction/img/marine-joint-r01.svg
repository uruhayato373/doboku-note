<!-- authored 2026-09-30 doboku-note 自作。題材は主任技士教材の海洋コンクリート（海中橋脚の打継目位置）。書籍図の複製・トレースではない。与条件（幅6.0m・奥行き4.0m・高さ10.0m、a〜dの高さ位置、H.W.L/L.W.Lの位置）は設問文どおり -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" style="max-width:480px;width:100%" role="img" aria-label="海中橋脚の側面図。橋脚幅6.0m、奥行き4.0m、高さ10.0m。橋脚天端から3.0m、4.0m、5.0m、7.0m下がりに打継目位置a〜d、H.W.LとL.W.Lの水位線、フーチングと地盤を示す寸法図">
