<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" style="max-width:480px;width:100%" role="img" aria-label="海中橋脚の側面図。橋脚幅6.0m×奥行き4.0m、干満位H.W.L/L.W.Lと海中に対する境界線a〜dの位置、フーチングと地盤を示す寸法図">
