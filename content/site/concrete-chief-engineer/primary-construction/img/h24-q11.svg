<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" style="max-width:400px;width:100%;font-family:sans-serif" role="img" aria-label="スラブと壁が一体となったL字形コンクリート部材の等角投影図">
  <!-- horizontal slab top face -->
  <path d="M60 140 L200 70 L340 140 L200 210 Z" fill="#f5f5f5" stroke="#222" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- slab front face -->
  <path d="M60 140 L200 210 L200 235 L60 165 Z" fill="#ffffff" stroke="#222" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- slab right face -->
  <path d="M200 210 L340 140 L340 165 L200 235 Z" fill="#e8e8e8" stroke="#222" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- vertical wall rising from left edge of slab -->
  <path d="M60 140 L60 40 L100 20 L100 120 Z" fill="#f5f5f5" stroke="#222" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M100 20 L200 70 L100 120 Z" fill="#e0e0e0" stroke="#222" stroke-width="1.6" stroke-linejoin="round"/>
</svg>
