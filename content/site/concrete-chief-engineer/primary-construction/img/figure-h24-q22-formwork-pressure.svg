<!-- authored 2026-09-30 doboku-note 自作。題材は主任技士教材の型枠側圧の経時変化。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="型枠最下部の側圧の経時変化。打込みとともに増え、下層コンクリートが凝結し始めると頭打ちから低下に転じる。柱状部材の側圧は壁状部材より大きい">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 11px; fill: #555; }
      .t-axis  { font-size: 11px; fill: #8a8a8a; }
      .t-label { font-size: 11px; fill: #1a3a5c; }
      .t-b     { font-size: 12px; fill: #1a3a5c; font-weight: 700; }
      .t-desc  { font-size: 11px; fill: #555; }
      .line-main { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .line-sub  { stroke: #1a3a5c; stroke-width: 1.5; fill: none; }
      .line-dash { stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .box { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
    </style>
  </defs>
<g transform="translate(0.0 50.0) scale(1.0000)">
  <text class="t-lead" x="200" y="16" text-anchor="middle">型枠最下部の側圧（数値なし・傾向を示す）</text>

  <line class="line-dash" x1="50" y1="250" x2="370" y2="250" />
  <line class="line-dash" x1="50" y1="34" x2="50" y2="250" />
  <text class="t-axis" x="370" y="268" text-anchor="end">経過時間</text>
  <text class="t-axis" x="56" y="46">側圧</text>
  <line class="line-dash" x1="320" y1="34" x2="320" y2="250" />
  <text class="t-axis" x="320" y="284" text-anchor="middle">打込み終了</text>

  <path class="line-main" d="M50,250 C 100,190 150,110 210,84 C 250,68 290,74 320,86" />
  <path d="M50,250 C 100,200 150,150 210,132 C 250,122 290,128 320,140" stroke="#1a3a5c" stroke-width="2" fill="none" stroke-dasharray="6 3" />
  <text class="t-label" x="214" y="72">柱状部材（実線）</text>
  <text class="t-label" x="214" y="150">壁状部材（破線）</text>

  <text class="t-desc" x="150" y="214">初期：打込み高さに</text>
  <text class="t-desc" x="150" y="230">ほぼ比例して増加</text>

  <rect class="box" x="16" y="300" width="368" height="90" rx="6" />
  <text class="t-desc" x="30" y="320">増加：打込みで積み上がる高さの分だけ側圧が増える</text>
  <text class="t-desc" x="30" y="340">頭打ち：下層が凝結し始めると増えなくなり低下に転じる</text>
  <text class="t-desc" x="30" y="360">大小：同じ打込み速度なら柱状の最大側圧のほうが大きい</text>
  <text class="t-desc" x="30" y="380">直線的に増え続ける形・打込み終了後も増える形は不自然</text>
</g>
</svg>
