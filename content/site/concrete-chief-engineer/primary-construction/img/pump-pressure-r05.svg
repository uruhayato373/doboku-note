<!-- authored 2026-09-30 doboku-note 自作。題材は主任技士教材のコンクリートポンプ圧送（吐出量と管内圧力損失）。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg"
