  <line x1="340.0" y1="160.0" x2="500.0" y2="125.0" stroke="#222" stroke-width="1.4" stroke-dasharray="2 2"/>
  <line x1="348" y1="20" x2="366" y2="20" stroke="#222" stroke-width="1.4" stroke-dasharray="2 2"/>
  <text x="372.0" y="24.0" text-anchor="start" font-family="sans-serif" font-size="9" fill="#222">スランプ 12 cm</text>
