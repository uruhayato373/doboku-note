  <line x1="340.0" y1="160.0" x2="500.0" y2="120.0" stroke="#222" stroke-width="1.4" stroke-dasharray="2 2 8 2"/>
  <line x1="348" y1="62" x2="366" y2="62" stroke="#222" stroke-width="1.4" stroke-dasharray="2 2 8 2"/>
