<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" style="max-width:560px;width:100%" role="img" aria-label="コンクリートポンプの配管状況（水平配管・垂直配管・ベント管・テーパ管・フレキシブルホース）と、スランプ12〜21cmの4系列における吐出量と管内圧力損失の関係を示す折れ線グラフ">
  <rect x="20" y="200" width="40" height="22" fill="none" stroke="#222" stroke-width="1.3"/>
  <rect x="60" y="188" width="8" height="34" fill="none" stroke="#222" stroke-width="1.1"/>
