<!-- authored 2026-09-30 doboku-note 自作。題材は主任技士教材の問題22の側圧分布（打上がり高さと側圧の関係）。書籍図の複製・トレースではない。既存SVGの幾何を保持し配色・フォントのみブランドに合わせた -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" style="max-width:400px;width:100%" role="img" aria-label="型枠最下部からの高さHと側圧Pの関係を示すL字型の折れ線グラフ。高さ0からH1まで側圧が急勾配で立ち上がり、H1から4.0mまでは緩やかな勾配で最大側圧Pmaxまで直線的に増加する。破線は原点からPmaxへの参考直線">
<defs><style>
text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
</style></defs>
  <line x1="60" y1="280" x2="60" y2="30" stroke="#2e6da4" stroke-width="1.5"/>
  <line x1="60" y1="280" x2="330" y2="280" stroke="#2e6da4" stroke-width="1.5"/>
  <line x1="60" y1="280" x2="220" y2="200" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="5 3"/>
  <line x1="60" y1="280" x2="60" y2="80" stroke="#2e6da4" stroke-width="1.8"/>
  <line x1="60" y1="80" x2="220" y2="200" stroke="#2e6da4" stroke-width="1.8"/>
  <line x1="220" y1="200" x2="220" y2="280" stroke="#2e6da4" stroke-width="1.8"/>
  <text x="52" y="84" text-anchor="end" font-size="13" fill="#1a3a5c">4.0</text>
  <text x="52" y="204" text-anchor="end" font-size="13" fill="#1a3a5c">H<tspan dy="3" font-size="9">1</tspan></text>
  <text x="60" y="298" text-anchor="middle" font-size="13" fill="#1a3a5c">0</text>
  <text x="220" y="298" text-anchor="middle" font-size="13" fill="#1a3a5c"><tspan font-style="italic">P</tspan><tspan dy="3" font-size="9">max</tspan></text>
  <text x="12" y="150" text-anchor="middle" font-size="12" fill="#1a3a5c" transform="rotate(-90 12 150)">型枠最下部からの高さH(m)</text>
  <text x="330" y="324" text-anchor="end" font-size="13" fill="#1a3a5c">側圧 P(kN/m²)</text>
  <line x1="200" y1="46" x2="218" y2="46" stroke="#2e6da4" stroke-width="1.8"/>
  <text x="224" y="50" font-size="11" fill="#1a3a5c">実線：打上がり4m到達時</text>
  <line x1="200" y1="68" x2="218" y2="68" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="224" y="72" font-size="11" fill="#1a3a5c">点線：最下部がPmaxに達する時</text>
</svg>
