<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" style="max-width:460px;width:100%" role="img" aria-label="型枠の打込み高さと最下部の側圧の関係を示す4本の折れ線グラフA・B・C・D。すべて打込み高さ約1.6mまでは同じ直線で立ち上がり、以降傾きが分岐する">
