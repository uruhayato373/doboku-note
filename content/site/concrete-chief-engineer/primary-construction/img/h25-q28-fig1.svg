  <text x="200" y="52" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222">15 m</text>
  <line x1="60" y1="45" x2="340" y2="45" stroke="#222" stroke-width="1"/>
  <text x="200" y="105" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222">コンクリート</text>
  <text x="200" y="195" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222">図1</text>
