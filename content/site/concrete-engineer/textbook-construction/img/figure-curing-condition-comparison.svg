<!-- authored 2026-10-10 doboku-note 自作。気中・封かん・標準養生の傾向を比べる概念図（棒の長さは傾向で数値ではない）。書籍図の複製ではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="気中養生、封かん養生、標準養生の比較。気中養生は水分が逃げて質量が減り強度の伸びが小さく、封かん養生は質量が減らないが標準養生より伸びが小さく、標準養生は質量が減らず強度が最も伸びる">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; font-size: 11px; fill: #555; }
      .h { font-size: 12px; font-weight: 700; fill: #1a3a5c; }
      .k { fill: #1a3a5c; }
    </style>
  </defs>
  <text class="h" x="200" y="24" text-anchor="middle">水が補われるかで、同じ配合の伸びが変わる</text>
  <rect x="20" y="40" width="360" height="120" rx="6" fill="#f8d7da" stroke="#b22234" stroke-width="1.5"/>
  <text class="h" x="34" y="66">気中養生</text>
  <text x="130" y="66">空気中へ水が蒸発する</text>
  <text x="34" y="102">質量の減少</text>
  <rect x="130" y="90" width="190" height="16" rx="3" fill="#f5f5f5" stroke="#b22234" stroke-width="1"/>
  <text class="k" x="138" y="102">水分が逃げて減る</text>
  <text x="34" y="138">強度の伸び</text>
  <rect x="130" y="126" width="80" height="16" rx="3" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1"/>
  <text class="k" x="138" y="138">早く頭打ち</text>
  <rect x="20" y="176" width="360" height="120" rx="6" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text class="h" x="34" y="202">封かん養生</text>
  <text x="130" y="202">水の出入りを断つ</text>
  <text x="34" y="238">質量の減少</text>
  <rect x="130" y="226" width="6" height="16" fill="#3a7d44"/>
  <text x="144" y="238">減らない</text>
  <text x="34" y="274">強度の伸び</text>
  <rect x="130" y="262" width="160" height="16" rx="3" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1"/>
  <text class="k" x="138" y="274">標準より小さい</text>
  <rect x="20" y="312" width="360" height="120" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text class="h" x="34" y="338">標準養生</text>
  <text x="130" y="338">水中などで水が補給される</text>
  <text x="34" y="374">質量の減少</text>
  <rect x="130" y="362" width="6" height="16" fill="#3a7d44"/>
  <text x="144" y="374">減らない</text>
  <text x="34" y="410">強度の伸び</text>
  <rect x="130" y="398" width="220" height="16" rx="3" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1"/>
  <text class="k" x="138" y="410">最もよく伸びる</text>
  <text class="h" x="200" y="466" text-anchor="middle">棒の長さは傾向を示す概念図で、数値ではない</text>
</svg>
