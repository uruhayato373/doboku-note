  <text class="t-label" x="200" y="440" text-anchor="middle">養生の目的は、水和に必要な水と温度を保つこと</text>
  <text class="t-desc" x="200" y="460" text-anchor="middle">（水和結晶＝セメントと水の反応でできる生成物）</text>

