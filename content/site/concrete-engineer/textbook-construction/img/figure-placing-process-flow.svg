  <text class="t-head" x="164" y="289" text-anchor="middle">受入試験</text>
  <line class="line-ar" x1="160" y1="302" x2="160" y2="324" marker-end="url(#ar)" />
  <rect class="box-b" x="60" y="324" width="200" height="36" rx="6" />
  <circle cx="84" cy="342" r="11" fill="#fff" stroke="#2e6da4" stroke-width="1.5" />
  <text class="t-label" x="84" y="346" text-anchor="middle">6</text>
  <text class="t-head" x="164" y="347" text-anchor="middle">打設</text>
  <line class="line-ar" x1="160" y1="360" x2="160" y2="382" marker-end="url(#ar)" />
  <rect class="box-b" x="60" y="382" width="200" height="36" rx="6" />
  <circle cx="84" cy="400" r="11" fill="#fff" stroke="#2e6da4" stroke-width="1.5" />
  <text class="t-label" x="84" y="404" text-anchor="middle">7</text>
  <text class="t-head" x="164" y="405" text-anchor="middle">養生</text>
  <text class="t-label" x="272" y="282">荷卸し直後に</text>
  <text class="t-label" x="272" y="298">品質を確認</text>
  <text class="t-desc" x="200" y="462" text-anchor="middle">受入試験に合格した生コンだけを打設する</text>

</svg>
