  <line class="line-ar" x1="160" y1="186" x2="160" y2="208" marker-end="url(#ar)" />
  <rect class="box-b" x="60" y="208" width="200" height="36" rx="6" />
  <circle cx="84" cy="226" r="11" fill="#fff" stroke="#2e6da4" stroke-width="1.5" />
  <text class="t-label" x="84" y="230" text-anchor="middle">4</text>
  <text class="t-head" x="164" y="231" text-anchor="middle">荷卸し</text>
  <line class="line-ar" x1="160" y1="244" x2="160" y2="266" marker-end="url(#ar)" />
  <rect class="box-w" x="60" y="266" width="200" height="36" rx="6" />
  <circle cx="84" cy="284" r="11" fill="#fff" stroke="#d4a017" stroke-width="1.5" />
