<!-- authored 2026-09-30 doboku-note 自作。題材はコンクリート技士教材の腰壁の充填。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="腰壁への生コン充填の3手順。窓の上から打つと固い生コンは流れにくく、窓枠の下から直接充填するのが望ましく、仮フタを怠ると生コンが噴き出すおそれがある">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 11px; fill: #555; }
      .t-title { font-size: 12px; fill: #1a3a5c; font-weight: bold; }
      .t-label { font-size: 11px; fill: #1a3a5c; }
      .t-desc  { font-size: 11px; fill: #555; }
      .t-ok    { font-size: 12px; fill: #3a7d44; font-weight: bold; }
      .t-ng    { font-size: 12px; fill: #b22234; font-weight: bold; }
      .box   { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .b-brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .b-ok  { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .b-warn{ fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .b-ng  { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .main  { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .ng    { stroke: #b22234; stroke-width: 2.5; fill: none; }
      .dash  { stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .ink   { stroke: #555; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="ar" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker>
    <marker id="arn" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#b22234"/></marker>
  </defs>
  <text class="t-lead" x="200" y="16" text-anchor="middle">腰壁の充填手順（断面の模式図）</text>
<g transform="translate(0,0)">
  <rect class="box" x="20" y="28" width="360" height="140" rx="6"/>
  <circle class="b-brand" cx="38" cy="48" r="11"/><text class="t-title" x="38" y="52" text-anchor="middle">1</text>
  <line class="ink" x1="58" y1="62" x2="250" y2="62"/><line class="ink" x1="58" y1="152" x2="250" y2="152"/>
  <rect fill="#fff" stroke="#2e6da4" stroke-width="1.5" x="130" y="82" width="90" height="50"/><text class="t-label" x="175" y="110" text-anchor="middle">窓</text>
  <path fill="#d7d7d7" stroke="#555" stroke-width="1.5" d="M58,152 V96 Q96,86 118,104 Q134,122 152,152 Z"/>
  <line class="ink" x1="92" y1="70" x2="92" y2="112"/><rect fill="#2e6da4" x="88" y="112" width="8" height="26" rx="4"/>
  <polygon class="b-warn" points="62,52 84,60 78,72 56,64"/>
  <line class="ng" x1="140" y1="142" x2="176" y2="142" marker-end="url(#arn)"/><text class="t-ng" x="182" y="146">流れにくい</text>
  <text class="t-desc" x="262" y="70">窓の上から打つと、</text>
  <text class="t-desc" x="262" y="88">固い生コンは窓の</text>
  <text class="t-desc" x="262" y="106">下へ流れにくい</text>
</g>
<g transform="translate(0,148)">
  <rect class="box" x="20" y="28" width="360" height="140" rx="6"/>
  <circle class="b-brand" cx="38" cy="48" r="11"/><text class="t-title" x="38" y="52" text-anchor="middle">2</text>
  <line class="ink" x1="58" y1="62" x2="250" y2="62"/><line class="ink" x1="58" y1="152" x2="250" y2="152"/>
  <rect fill="#fff" stroke="#2e6da4" stroke-width="1.5" x="130" y="82" width="90" height="50"/><text class="t-label" x="136" y="124">窓</text>
  <path fill="#d7d7d7" stroke="#555" stroke-width="1.5" d="M96,152 Q126,132 172,130 Q214,130 238,152 Z"/>
  <polygon class="b-warn" points="150,88 172,94 166,106 144,100"/>
  <line class="main" x1="160" y1="108" x2="160" y2="126" marker-end="url(#ar)"/>
  <line class="ink" x1="200" y1="100" x2="200" y2="126"/><rect fill="#2e6da4" x="196" y="126" width="8" height="20" rx="4"/>
  <text class="t-desc" x="262" y="70">窓枠の下から</text>
  <text class="t-desc" x="262" y="88">直接充填する</text>
  <text class="t-desc" x="262" y="106">（望ましい）</text>
</g>
<g transform="translate(0,296)">
  <rect class="box" x="20" y="28" width="360" height="140" rx="6"/>
  <circle class="b-brand" cx="38" cy="48" r="11"/><text class="t-title" x="38" y="52" text-anchor="middle">3</text>
  <line class="ink" x1="58" y1="62" x2="250" y2="62"/><line class="ink" x1="58" y1="152" x2="250" y2="152"/>
  <rect fill="#fff" stroke="#2e6da4" stroke-width="1.5" x="130" y="82" width="90" height="50"/><text class="t-label" x="142" y="98" text-anchor="middle">窓</text>
  <path fill="#d7d7d7" stroke="#555" stroke-width="1.5" d="M58,152 V96 Q96,86 118,104 Q136,122 170,122 Q214,120 244,152 Z"/>
  <line class="ink" x1="92" y1="70" x2="92" y2="112"/><rect fill="#2e6da4" x="88" y="112" width="8" height="26" rx="4"/>
  <polygon class="b-warn" points="62,52 84,60 78,72 56,64"/>
  <line class="ng" x1="150" y1="120" x2="166" y2="100" marker-end="url(#arn)"/><text class="t-ng" x="176" y="110">噴き出す</text>
  <text class="t-desc" x="262" y="70">充填後に上面を均し</text>
  <text class="t-desc" x="262" y="88">仮フタをしないと、</text>
  <text class="t-desc" x="262" y="106">生コンが噴き出す</text>
  <text class="t-desc" x="262" y="124">おそれがある</text>
</g>
</svg>
