<!-- authored 2026-10-16 doboku-note 自作。題材はコンクリート技士教材のクリープと除荷後の回復。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="クリープのひずみの時間変化の定性図。載荷で弾性ひずみが生じ、時間とともにクリープひずみが増える。除荷すると一部は瞬時に、残りはゆっくり回復し、元に戻らない成分が残る">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-title { font-size: 14px; font-weight: bold; fill: #222; }
      .t-head  { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-label { font-size: 12px; fill: #1a3a5c; }
      .t-desc  { font-size: 12px; fill: #555; }
      .t-axis  { font-size: 11px; fill: #555; }
      .t-warn  { font-size: 12px; fill: #b22234; font-weight: bold; }
      .box { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-p { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-d { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .ln { stroke: #555; stroke-width: 1; fill: none; }
      .arr { stroke: #2e6da4; stroke-width: 1.5; fill: none; marker-end: url(#ah); }
      .arr-d { stroke: #b22234; stroke-width: 1.5; fill: none; marker-end: url(#ahd); }
    </style>
    <marker id="ah" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker>
    <marker id="ahd" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#b22234"/></marker>
  </defs>
  <text class="t-lead" x="200" y="18" text-anchor="middle">クリープのひずみの時間変化（定性図・数値なし）</text>
  <line x1="50" y1="320" x2="372" y2="320" class="ln"/>
  <line x1="50" y1="44" x2="50" y2="320" class="ln"/>
  <text class="t-axis" x="54" y="40">ひずみ</text>
  <text class="t-axis" x="372" y="338" text-anchor="end">時間</text>
  <line x1="80" y1="320" x2="80" y2="326" class="ln"/>
  <text class="t-axis" x="80" y="342" text-anchor="middle">載荷</text>
  <line x1="230" y1="320" x2="230" y2="326" class="ln"/>
  <text class="t-axis" x="230" y="342" text-anchor="middle">除荷</text>
  <path d="M50,320 L80,320 L80,250 C100,215 150,188 230,172 L230,242 C250,262 290,276 362,282" fill="none" stroke="#2e6da4" stroke-width="2.5"/>
  <line x1="230" y1="320" x2="230" y2="172" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="260" y1="282" x2="366" y2="282" stroke="#b22234" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="366" y1="282" x2="366" y2="320" stroke="#b22234" stroke-width="2"/>
  <text class="t-label" x="88" y="308">① 弾性ひずみ</text>
  <text class="t-label" x="96" y="138">② クリープひずみ</text>
  <text class="t-desc" x="96" y="156">（時間とともに増加）</text>
  <text class="t-label" x="240" y="200">③ 瞬時の回復</text>
  <text class="t-label" x="250" y="238">④ ゆっくりの回復</text>
  <text class="t-warn" x="360" y="306" text-anchor="end">⑤ 元に戻らない成分</text>
  <rect class="box" x="20" y="356" width="360" height="128" rx="6"/>
  <text class="t-label" x="34" y="378">一定の応力でひずみが時間とともに増える</text>
  <text class="t-label" x="34" y="398">除荷：一部は瞬時に、残りはゆっくり回復する</text>
  <text class="t-label" x="34" y="418">完全には元に戻らない成分が残る</text>
  <text class="t-head" x="34" y="442">クリープが大きくなる条件</text>
  <text class="t-desc" x="34" y="460">載荷時材齢が若い・水セメント比が大きい</text>
  <text class="t-desc" x="34" y="477">乾燥しやすい・部材が薄い</text>
</svg>
