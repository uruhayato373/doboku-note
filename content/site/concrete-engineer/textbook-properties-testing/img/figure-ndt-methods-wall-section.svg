<!-- authored 2026-10-08 doboku-note 自作。題材は構造体コンクリートの非破壊試験（反発度法・超音波法・打音法・鉄筋探査）。壁断面で各方式が見る場所を示し、反発度の測定位置を併記。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="非破壊試験が壁のどこを見るかの断面図と、反発度の測定位置。反発度法は表層の硬さ、打音法は表層近くの浮き、電磁誘導法とレーダ法は鉄筋位置とかぶり、超音波法は壁を通過する伝播時間から空洞を見る。下段は壁の正面で、縁から50mm以上内側に、25から50mm間隔で9点を測る配置例">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-h  { font-size: 12px; font-weight: 700; fill: #1a3a5c; }
      .t-s  { font-size: 11px; fill: #555; }
      .t-m  { font-size: 11px; fill: #8a8a8a; }
      .t-d  { font-size: 11px; fill: #1a3a5c; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-d { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .box-s { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .ln-b  { stroke: #2e6da4; stroke-width: 1.5; fill: none; }
      .ln-bd { stroke: #2e6da4; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
      .ln-g  { stroke: #8a8a8a; stroke-width: 1; fill: none; }
      .ln-gd { stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
    </style>
  </defs>

  <!-- 壁断面 -->
  <text class="t-m" x="178" y="26">測定面</text>
  <text class="t-m" x="250" y="26" text-anchor="end">裏面</text>
  <rect x="178" y="36" width="72" height="226" fill="#f5f5f5" stroke="#555" stroke-width="1.5" />
  <rect x="178" y="36" width="14" height="226" fill="#fff3cd" stroke="none" />
  <line x1="178" y1="36" x2="178" y2="262" stroke="#555" stroke-width="1.5" />
  <!-- 鉄筋 -->
  <circle cx="210" cy="104" r="6" fill="#555" />
  <circle cx="210" cy="130" r="6" fill="#555" />
  <circle cx="210" cy="156" r="6" fill="#555" />
  <!-- 浮き -->
  <rect x="195" y="172" width="3" height="50" fill="#f8d7da" stroke="#b22234" stroke-width="1" />
  <!-- 空洞 -->
  <ellipse cx="222" cy="242" rx="12" ry="9" class="box-d" />

  <!-- 反発度法 -->
  <rect x="8" y="40" width="114" height="52" rx="6" class="box-b" />
  <text class="t-h" x="16" y="58">反発度法</text>
  <text class="t-d" x="16" y="73">表層の硬さ</text>
  <text class="t-d" x="16" y="86">→強度の目安</text>
  <line class="ln-g" x1="122" y1="54" x2="146" y2="54" />
  <rect x="146" y="46" width="20" height="16" rx="3" class="box-b" />
  <line class="ln-b" x1="166" y1="54" x2="177" y2="54" />

  <!-- 電磁誘導・レーダ -->
  <rect x="8" y="104" width="114" height="52" rx="6" class="box-b" />
  <text class="t-h" x="16" y="122">電磁誘導・レーダ</text>
  <text class="t-d" x="16" y="137">鉄筋の位置</text>
  <text class="t-d" x="16" y="150">かぶり厚さ</text>
  <line class="ln-g" x1="122" y1="130" x2="146" y2="130" />
  <rect x="146" y="120" width="30" height="20" rx="3" class="box-b" />
  <path class="ln-bd" d="M178 124 C190 120 198 120 204 124" />
  <path class="ln-bd" d="M178 130 L204 130" />
  <path class="ln-bd" d="M178 136 C190 140 198 140 204 136" />

  <!-- 打音法 -->
  <rect x="8" y="168" width="114" height="52" rx="6" class="box-b" />
  <text class="t-h" x="16" y="186">打音法</text>
  <text class="t-d" x="16" y="201">音の違い</text>
  <text class="t-d" x="16" y="214">→浮き・剥離</text>
  <line class="ln-g" x1="122" y1="197" x2="146" y2="197" />
  <rect x="146" y="189" width="20" height="16" rx="3" class="box-b" />
  <line class="ln-b" x1="166" y1="197" x2="177" y2="197" />

  <!-- 超音波法 -->
  <text class="t-m" x="163" y="226" text-anchor="middle">発信</text>
  <text class="t-m" x="261" y="226" text-anchor="middle">受信</text>
  <rect x="150" y="232" width="26" height="20" rx="3" class="box-b" />
  <rect x="252" y="232" width="18" height="20" rx="3" class="box-b" />
  <line class="ln-bd" x1="176" y1="242" x2="252" y2="242" />
  <rect x="276" y="214" width="116" height="56" rx="6" class="box-b" />
  <text class="t-h" x="284" y="232">超音波法</text>
  <text class="t-d" x="284" y="248">伝播時間→</text>
  <text class="t-d" x="284" y="262">均質性・空洞</text>
  <line class="ln-g" x1="270" y1="242" x2="276" y2="242" />

  <!-- 反発度の測定位置 -->
  <line class="ln-g" x1="20" y1="296" x2="380" y2="296" />
  <text class="t-m" x="20" y="320">測定位置（正面）</text>
  <text class="t-m" x="204" y="320">測定のきまり</text>
  <rect x="20" y="330" width="170" height="146" rx="4" class="box-s" />
  <text class="t-s" x="105" y="352" text-anchor="middle">点の間隔 25〜50 mm</text>
  <rect x="54" y="364" width="102" height="76" fill="none" class="ln-gd" />
  <circle cx="83" cy="380" r="3.5" fill="#2e6da4" />
  <circle cx="105" cy="380" r="3.5" fill="#2e6da4" />
  <circle cx="127" cy="380" r="3.5" fill="#2e6da4" />
  <circle cx="83" cy="402" r="3.5" fill="#2e6da4" />
  <circle cx="105" cy="402" r="3.5" fill="#2e6da4" />
  <circle cx="127" cy="402" r="3.5" fill="#2e6da4" />
  <circle cx="83" cy="424" r="3.5" fill="#2e6da4" />
  <circle cx="105" cy="424" r="3.5" fill="#2e6da4" />
  <circle cx="127" cy="424" r="3.5" fill="#2e6da4" />
  <text class="t-s" x="105" y="460" text-anchor="middle">破線の内側＝縁から50 mm以上</text>

  <text class="t-d" x="204" y="348">・1か所で9点を測る</text>
  <text class="t-d" x="204" y="366">・点の間隔は25〜50 mm</text>
  <text class="t-d" x="204" y="384">・縁から50 mm以上内側の</text>
  <text class="t-d" x="204" y="400">　平滑で均一な面を選ぶ</text>
  <text class="t-d" x="204" y="418">・平均から20%以上離れた</text>
  <text class="t-d" x="204" y="434">　値は採らず別の点で補う</text>
  <text class="t-d" x="204" y="452">・打撃は面に垂直に行う</text>
  <text class="t-d" x="204" y="470">・乾湿や仕上げの状態を記録</text>
</svg>
