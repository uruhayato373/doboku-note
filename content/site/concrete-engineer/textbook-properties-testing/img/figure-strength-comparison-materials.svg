<!-- authored 2026-10-16 doboku-note 自作。題材はコンクリート技士教材の強度の大小と脆性係数。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="コンクリートの強度の大小は圧縮、曲げ、引張の順。圧縮強度÷引張強度の脆性係数はコンクリートで大きく鋼材で小さい。引張側は鉄筋で補う">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-title { font-size: 14px; font-weight: bold; fill: #222; }
      .t-head  { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-label { font-size: 12px; fill: #1a3a5c; }
      .t-desc  { font-size: 12px; fill: #555; }
      .t-axis  { font-size: 11px; fill: #555; }
      .t-warn  { font-size: 12px; fill: #b22234; font-weight: bold; }
      .box { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-p { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-d { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .ln { stroke: #555; stroke-width: 1; fill: none; }
      .arr { stroke: #2e6da4; stroke-width: 1.5; fill: none; marker-end: url(#ah); }
      .arr-d { stroke: #b22234; stroke-width: 1.5; fill: none; marker-end: url(#ahd); }
    </style>
    <marker id="ah" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker>
    <marker id="ahd" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#b22234"/></marker>
  </defs>
  <text class="t-lead" x="200" y="18" text-anchor="middle">棒の長さは定性（数値なし）</text>
  <rect class="box" x="20" y="30" width="360" height="168" rx="6"/>
  <text class="t-head" x="34" y="54">コンクリートの強度の大小（圧縮が基準）</text>
  <text class="t-label" x="34" y="85">圧縮</text>
  <rect x="84" y="68" width="270" height="22" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text class="t-label" x="34" y="115">曲げ</text>
  <rect x="84" y="98" width="100" height="22" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text class="t-label" x="34" y="145">引張</text>
  <rect x="84" y="128" width="66" height="22" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text class="t-desc" x="34" y="182">圧縮 ＞ 曲げ ＞ 引張。引張が圧縮を上回ることはない</text>
  <rect class="box" x="20" y="208" width="360" height="196" rx="6"/>
  <text class="t-head" x="34" y="232">脆性係数 ＝ 圧縮強度 ÷ 引張強度</text>
  <text class="t-label" x="34" y="258">コンクリート：比が大きい（脆性的）</text>
  <rect x="34" y="266" width="250" height="14" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text class="t-axis" x="290" y="278">圧縮</text>
  <rect x="34" y="284" width="62" height="14" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text class="t-axis" x="102" y="296">引張</text>
  <text class="t-label" x="34" y="332">鋼材：比が小さい</text>
  <rect x="34" y="340" width="250" height="14" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text class="t-axis" x="290" y="352">圧縮</text>
  <rect x="34" y="358" width="220" height="14" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text class="t-axis" x="260" y="370">引張</text>
  <text class="t-axis" x="34" y="394">棒は各材料の中で圧縮と引張を比べた長さ</text>
  <rect class="box-w" x="20" y="416" width="360" height="66" rx="6"/>
  <text class="t-label" x="200" y="442" text-anchor="middle">コンクリートは引張に弱い</text>
  <text class="t-desc" x="200" y="464" text-anchor="middle">引張側は鉄筋で補う（鉄筋コンクリート）</text>
</svg>
