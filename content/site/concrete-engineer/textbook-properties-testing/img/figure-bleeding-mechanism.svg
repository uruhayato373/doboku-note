  <text class="t-label" x="252" y="64">上面の弱い層</text>
  <line class="dash" x1="240" y1="60" x2="248" y2="60"/>
  <text class="t-label" x="252" y="126">砂利</text><line class="dash" x1="226" y1="142" x2="248" y2="124"/>
  <text class="t-label" x="252" y="194">鉄筋</text><line class="dash" x1="161" y1="190" x2="248" y2="190"/>
  <text class="t-label" x="252" y="246">水のたまり</text><line class="dash" x1="196" y1="241" x2="248" y2="244"/>
  <text class="t-label" x="252" y="280">水みち</text><line class="dash" x1="220" y1="230" x2="248" y2="277"/>
  <rect class="b-brand" x="20" y="320" width="360" height="30" rx="6"/>
  <text class="t-desc" x="34" y="339">1 固体が沈み、練混ぜ水の一部が上昇する</text>
  <rect class="b-brand" x="20" y="358" width="360" height="30" rx="6"/>
  <text class="t-desc" x="34" y="377">2 水は水みちを通って上面へ向かう</text>
  <rect class="b-warn" x="20" y="396" width="360" height="30" rx="6"/>
  <text class="t-desc" x="34" y="415">3 砂利・鉄筋の下に水がたまり、付着が低下</text>
  <rect class="b-ng" x="20" y="434" width="360" height="30" rx="6"/>
  <text class="t-desc" x="34" y="453">4 水が通った跡は傷になり、上面が弱くなる</text>
</svg>
