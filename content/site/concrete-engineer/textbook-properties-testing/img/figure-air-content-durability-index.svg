<!-- authored 2026-10-16 doboku-note 自作。題材はコンクリート技士教材の空気量と耐凍害性・強度。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="空気量の3区間。少なすぎると凍結融解への抵抗性が不足し、標準4.5±1.5％で耐凍害性の目安は相対動弾性係数60％以上、多すぎると空隙が増えて圧縮強度の低下が大きくなる">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-title { font-size: 14px; font-weight: bold; fill: #222; }
      .t-head  { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-label { font-size: 12px; fill: #1a3a5c; }
      .t-desc  { font-size: 12px; fill: #555; }
      .t-axis  { font-size: 11px; fill: #555; }
      .t-warn  { font-size: 12px; fill: #b22234; font-weight: bold; }
      .box { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-p { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-d { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .ln { stroke: #555; stroke-width: 1; fill: none; }
      .arr { stroke: #2e6da4; stroke-width: 1.5; fill: none; marker-end: url(#ah); }
      .arr-d { stroke: #b22234; stroke-width: 1.5; fill: none; marker-end: url(#ahd); }
    </style>
    <marker id="ah" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker>
    <marker id="ahd" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#b22234"/></marker>
  </defs>
  <text class="t-lead" x="200" y="18" text-anchor="middle">空気量は多すぎても少なすぎても困る</text>
  <rect class="box-d" x="30" y="32" width="100" height="44" rx="0"/>
  <rect class="box-p" x="130" y="32" width="160" height="44" rx="0"/>
  <rect class="box-w" x="290" y="32" width="80" height="44" rx="0"/>
  <text class="t-label" x="80" y="59" text-anchor="middle">少なすぎる</text>
  <text class="t-label" x="210" y="59" text-anchor="middle">標準の範囲</text>
  <text class="t-label" x="330" y="59" text-anchor="middle">多すぎる</text>
  <line x1="30" y1="92" x2="366" y2="92" class="arr"/>
  <text class="t-axis" x="30" y="110">空気量 少</text>
  <text class="t-axis" x="370" y="110" text-anchor="end">多</text>
  <rect class="box-d" x="20" y="122" width="360" height="76" rx="6"/>
  <text class="t-title" x="34" y="146">少なすぎる</text>
  <text class="t-label" x="34" y="172">凍結融解への抵抗性が不足する</text>
  <rect class="box-p" x="20" y="206" width="360" height="112" rx="6"/>
  <text class="t-title" x="34" y="230">標準：4.5±1.5 %（JIS A 5308）</text>
  <text class="t-desc" x="34" y="254">レディーミクストコンクリートの空気量の標準</text>
  <text class="t-label" x="34" y="282">耐凍害性の目安（JIS A 6204）</text>
  <text class="t-label" x="34" y="302">凍結融解後の相対動弾性係数 60 %以上</text>
  <rect class="box-w" x="20" y="326" width="360" height="76" rx="6"/>
  <text class="t-title" x="34" y="350">多すぎる</text>
  <text class="t-label" x="34" y="376">空隙が増え、圧縮強度の低下が大きくなる</text>
  <rect class="box-d" x="20" y="418" width="360" height="64" rx="6"/>
  <text class="t-warn" x="200" y="444" text-anchor="middle">空気量を増やせば強度も上がる、は誤り</text>
  <text class="t-desc" x="200" y="466" text-anchor="middle">強度の面では空隙が増えることになる</text>
</svg>
