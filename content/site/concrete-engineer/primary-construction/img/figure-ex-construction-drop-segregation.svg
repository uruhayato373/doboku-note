<!-- authored 2026-09-30 doboku-note 自作。題材はコンクリート技士教材の施工の打込み・材料分離。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="打込み時の材料分離。高い位置からの自由落下と鉄筋への衝突で粗骨材が分離する例と、打込み位置の近くで落下高さを小さくする例を並べて示す">
<defs><style>
text{font-family:Inter,"Noto Sans JP","Hiragino Kaku Gothic ProN","Hiragino Sans",sans-serif}
.h{font-size:14px;font-weight:700;fill:#1a3a5c}.l{font-size:12px;fill:#1a3a5c}.s{font-size:11px;fill:#555}.m{font-size:11px;fill:#8a8a8a}
.bb{fill:#e8f0fe;stroke:#2e6da4;stroke-width:1.5}.bg{fill:#d0e8d0;stroke:#3a7d44;stroke-width:1.5}.bw{fill:#fff3cd;stroke:#d4a017;stroke-width:1.5}.br{fill:#f8d7da;stroke:#b22234;stroke-width:1.5}.bs{fill:#f5f5f5;stroke:#d7d7d7;stroke-width:1.5}
.ln{stroke:#2e6da4;stroke-width:2;fill:none}.lr{stroke:#b22234;stroke-width:2;fill:none}.lg{stroke:#3a7d44;stroke-width:2;fill:none}.ax{stroke:#8a8a8a;stroke-width:1;fill:none}.ar{stroke:#555;stroke-width:1.5;fill:none}
</style>
<marker id="a" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#555"/></marker>
</defs>

<text class="h" x="200" y="24" text-anchor="middle">打込み方法と材料分離</text>
<text class="s" x="200" y="42" text-anchor="middle">模式図（寸法なし・傾向を示す）</text>
<rect class="bs" x="20" y="60" width="170" height="290" rx="6"/><rect class="bs" x="210" y="60" width="170" height="290" rx="6"/>
<text class="l" x="105" y="80" text-anchor="middle">高い位置から落下</text><text class="l" x="295" y="80" text-anchor="middle">近くで低く打込み</text>
<!-- left -->
<rect class="bb" x="80" y="92" width="50" height="18" rx="3"/><text class="s" x="105" y="105" text-anchor="middle">排出口</text>
<line class="ar" x1="105" y1="112" x2="105" y2="168" marker-end="url(#a)"/>
<line class="ax" x1="60" y1="178" x2="150" y2="178"/><text class="s" x="66" y="194">鉄筋</text>
<line class="ar" x1="108" y1="182" x2="145" y2="232" marker-end="url(#a)"/>
<text class="s" x="28" y="150">落下高さ大</text>
<path d="M30 340 L30 290 L180 290 L180 340 Z" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
<circle cx="150" cy="312" r="6" fill="#d7d7d7" stroke="#8a8a8a"/><circle cx="162" cy="326" r="6" fill="#d7d7d7" stroke="#8a8a8a"/><circle cx="140" cy="328" r="5" fill="#d7d7d7" stroke="#8a8a8a"/>
<text class="s" x="105" y="283" text-anchor="middle">粗骨材が偏る</text>
<!-- right -->
<rect class="bb" x="270" y="200" width="50" height="18" rx="3"/><text class="s" x="295" y="213" text-anchor="middle">排出口</text>
<line class="ar" x1="295" y1="220" x2="295" y2="262" marker-end="url(#a)"/>
<text class="s" x="222" y="240">落下高さ小</text>
<path d="M220 340 L220 265 L370 265 L370 340 Z" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
<circle cx="250" cy="295" r="5" fill="#d7d7d7" stroke="#8a8a8a"/><circle cx="290" cy="310" r="5" fill="#d7d7d7" stroke="#8a8a8a"/><circle cx="335" cy="292" r="5" fill="#d7d7d7" stroke="#8a8a8a"/><circle cx="315" cy="325" r="5" fill="#d7d7d7" stroke="#8a8a8a"/><circle cx="265" cy="326" r="5" fill="#d7d7d7" stroke="#8a8a8a"/>
<text class="s" x="306" y="258">均等な層</text>
<rect class="bw" x="20" y="370" width="360" height="100" rx="6"/>
<text class="l" x="32" y="392">分離を抑える要点</text>
<text class="s" x="32" y="412">・自由落下と鉄筋への衝突を避ける</text>
<text class="s" x="32" y="430">・打込み位置の近くへ運び、横流しをしない</text>
<text class="s" x="32" y="448">・均等な層として打ち重ねる</text>
</svg>