<!-- authored 2026-10-16 doboku-note 自作。題材はコンクリート技士教材の受入試験の合否判定。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="受入試験の判定の形。スランプと空気量は範囲判定、塩化物は0.30 kg/m³以下の上限判定、強度は1回が呼び強度の85％以上かつ3回平均が呼び強度以上の二重の条件">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-title { font-size: 14px; font-weight: bold; fill: #222; }
      .t-head  { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-label { font-size: 12px; fill: #1a3a5c; }
      .t-desc  { font-size: 12px; fill: #555; }
      .t-axis  { font-size: 11px; fill: #555; }
      .t-warn  { font-size: 12px; fill: #b22234; font-weight: bold; }
      .box { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-p { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-d { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .ln { stroke: #555; stroke-width: 1; fill: none; }
      .arr { stroke: #2e6da4; stroke-width: 1.5; fill: none; marker-end: url(#ah); }
      .arr-d { stroke: #b22234; stroke-width: 1.5; fill: none; marker-end: url(#ahd); }
    </style>
    <marker id="ah" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker>
    <marker id="ahd" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#b22234"/></marker>
  </defs>
  <text class="t-lead" x="200" y="18" text-anchor="middle">受入試験は、項目ごとに判定の形が違う</text>
  <rect class="box" x="20" y="28" width="360" height="94" rx="6"/>
  <text class="t-head" x="34" y="50">スランプ：範囲判定</text>
  <text class="t-desc" x="34" y="70">許容差 8〜18 cm：±2.5 cm／21 cm：±1.5 cm</text>
  <rect x="110" y="82" width="180" height="16" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
  <line x1="200" y1="78" x2="200" y2="102" stroke="#222" stroke-width="1.5"/>
  <text class="t-axis" x="200" y="116" text-anchor="middle">指定値</text>
  <text class="t-axis" x="110" y="116" text-anchor="middle">−許容差</text>
  <text class="t-axis" x="290" y="116" text-anchor="middle">＋許容差</text>
  <rect class="box" x="20" y="130" width="360" height="94" rx="6"/>
  <text class="t-head" x="34" y="152">空気量：範囲判定</text>
  <text class="t-desc" x="34" y="172">4.5 %±1.5 %</text>
  <rect x="110" y="184" width="180" height="16" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
  <line x1="200" y1="180" x2="200" y2="204" stroke="#222" stroke-width="1.5"/>
  <text class="t-axis" x="200" y="218" text-anchor="middle">4.5 %</text>
  <text class="t-axis" x="110" y="218" text-anchor="middle">3.0 %</text>
  <text class="t-axis" x="290" y="218" text-anchor="middle">6.0 %</text>
  <rect class="box" x="20" y="232" width="360" height="94" rx="6"/>
  <text class="t-head" x="34" y="254">塩化物：上限判定</text>
  <text class="t-desc" x="34" y="274">個々の測定値を上限と比べる（平均しない）</text>
  <rect x="60" y="286" width="180" height="16" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
  <rect x="240" y="286" width="100" height="16" fill="#f8d7da" stroke="#b22234" stroke-width="1.5"/>
  <text class="t-axis" x="150" y="320" text-anchor="middle">0.30 kg/m³以下</text>
  <text class="t-axis" x="290" y="320" text-anchor="middle">超える</text>
  <rect class="box" x="20" y="334" width="360" height="100" rx="6"/>
  <text class="t-head" x="34" y="356">強度：二重の条件（両方満たす）</text>
  <rect class="box-p" x="34" y="368" width="150" height="52" rx="6"/>
  <text class="t-label" x="109" y="390" text-anchor="middle">1回の試験結果</text>
  <text class="t-label" x="109" y="408" text-anchor="middle">呼び強度の85 %以上</text>
  <text class="t-title" x="200" y="398" text-anchor="middle">かつ</text>
  <rect class="box-p" x="216" y="368" width="150" height="52" rx="6"/>
  <text class="t-label" x="291" y="390" text-anchor="middle">3回の平均値</text>
  <text class="t-label" x="291" y="408" text-anchor="middle">呼び強度以上</text>
  <rect class="box-d" x="20" y="444" width="360" height="44" rx="6"/>
  <text class="t-warn" x="200" y="471" text-anchor="middle">3回平均だけで合否を決めない</text>
</svg>
