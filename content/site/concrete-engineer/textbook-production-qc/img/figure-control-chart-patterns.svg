  <line x1="30" y1="230" x2="182" y2="230" stroke="#b22234" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="30" y1="290" x2="182" y2="290" stroke="#b22234" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="30" y1="260" x2="182" y2="260" stroke="#555" stroke-width="1.5"/>
  <polyline points="40,282 59,276 78,269 97,263 116,256 135,249 154,243 173,237" fill="none" stroke="#2e6da4" stroke-width="2"/>
  <circle cx="40" cy="282" r="3" fill="#2e6da4"/>
  <circle cx="59" cy="276" r="3" fill="#2e6da4"/>
  <circle cx="78" cy="269" r="3" fill="#2e6da4"/>
  <circle cx="97" cy="263" r="3" fill="#2e6da4"/>
  <circle cx="116" cy="256" r="3" fill="#2e6da4"/>
  <circle cx="135" cy="249" r="3" fill="#2e6da4"/>
  <circle cx="154" cy="243" r="3" fill="#2e6da4"/>
  <circle cx="173" cy="237" r="3" fill="#2e6da4"/>
  <rect class="box-w" x="208" y="178" width="172" height="138" rx="6"/>
  <text class="t-head" x="218" y="200">周期的に変動する</text>
  <line x1="218" y1="230" x2="370" y2="230" stroke="#b22234" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="218" y1="290" x2="370" y2="290" stroke="#b22234" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="218" y1="260" x2="370" y2="260" stroke="#555" stroke-width="1.5"/>
  <polyline points="228,260 247,242 266,234 285,242 304,260 323,278 342,286 361,278" fill="none" stroke="#2e6da4" stroke-width="2"/>
  <circle cx="228" cy="260" r="3" fill="#2e6da4"/>
  <circle cx="247" cy="242" r="3" fill="#2e6da4"/>
  <circle cx="266" cy="234" r="3" fill="#2e6da4"/>
  <circle cx="285" cy="242" r="3" fill="#2e6da4"/>
  <circle cx="304" cy="260" r="3" fill="#2e6da4"/>
  <circle cx="323" cy="278" r="3" fill="#2e6da4"/>
  <circle cx="342" cy="286" r="3" fill="#2e6da4"/>
  <circle cx="361" cy="278" r="3" fill="#2e6da4"/>
  <rect class="box" x="20" y="336" width="360" height="76" rx="6"/>
  <text class="t-head" x="34" y="360">点が限界内でも、並び方で異常が分かる</text>
  <text class="t-desc" x="34" y="382">異常が疑われたら、材料・設備・製造・運搬・</text>
  <text class="t-desc" x="34" y="400">試験の順に原因を確認する</text>
  <rect class="box-p" x="20" y="424" width="360" height="62" rx="6"/>
  <text class="t-label" x="200" y="448" text-anchor="middle">安定している ≠ 規格に適合している</text>
  <text class="t-desc" x="200" y="470" text-anchor="middle">平均値が規格を満たす位置かも別に確かめる</text>
</svg>
