<!-- authored 2026-09-30 doboku-note 自作。題材はコンクリート技士教材のばらつきの大小と正規分布。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="同じ平均値で標準偏差が小さい場合は山が高く鋭い分布、大きい場合は山が低くなだらかな分布になる。変動係数は標準偏差を平均値で割って百分率にしたもの">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
