<text class="t-axis" x="200" y="318" text-anchor="middle">平均値（品質水準の中心）</text>
<text class="t-label" x="214" y="110">ばらつき小</text><text class="t-desc" x="214" y="126">山が高く鋭い</text>
<text class="t-label" x="300" y="180" text-anchor="middle" style="fill:#555">ばらつき大</text><text class="t-desc" x="300" y="196" text-anchor="middle">山が低くなだらか</text><line class="dash" x1="300" y1="203" x2="300" y2="268"/>
<rect class="box" x="20" y="340" width="360" height="144" rx="6"/>
<text class="t-head" x="32" y="362">ばらつきの指標</text>
<text class="t-desc" x="32" y="384">平均値：品質水準の中心</text>
<text class="t-desc" x="32" y="404">標準偏差：試験値のばらつき</text>
<text class="t-label" x="32" y="430">変動係数 ＝ 標準偏差 ÷ 平均値 × 100（％）</text>
<text class="t-desc" x="32" y="452">標準偏差を平均値で割り、百分率で表す</text>
<text class="t-desc" x="32" y="472">相対的なばらつきを比べる指標</text>
</svg>
