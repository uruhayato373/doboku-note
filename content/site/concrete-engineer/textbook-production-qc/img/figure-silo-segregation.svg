      .t-label { font-size: 11px; fill: #1a3a5c; }
      .t-desc  { font-size: 11px; fill: #555; }
      .t-ok    { font-size: 12px; fill: #3a7d44; font-weight: bold; }
      .t-ng    { font-size: 12px; fill: #b22234; font-weight: bold; }
