  <rect class="b-warn" x="20" y="392" width="360" height="90" rx="6"/>
  <text class="t-desc" x="34" y="414">貯蔵量が少なくなると、</text>
  <text class="t-desc" x="34" y="432">大粒ばかりが極端に多く出ることがある。</text>
  <text class="t-label" x="34" y="460">粒径・種類別に区分して貯蔵し、分離を防ぐ</text>
