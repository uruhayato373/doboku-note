  <rect class="box" x="20" y="336" width="360" height="150" rx="6"/>
  <text class="t-head" x="32" y="358">ばらつきの指標</text>
  <text class="t-desc" x="32" y="380">平均値：品質水準の中心</text>
  <text class="t-desc" x="32" y="400">標準偏差：試験値のばらつき</text>
  <text class="t-label" x="32" y="426">変動係数 ＝ 標準偏差 ÷ 平均値 × 100（％）</text>
