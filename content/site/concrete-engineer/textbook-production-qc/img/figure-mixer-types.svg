<!-- authored 2026-09-30 doboku-note 自作。題材はコンクリート技士教材の練混ぜ設備。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="ミキサの3形式の構造比較。重力式（可傾式）はドラムごと回転して材料を落下させ、パン型強制式はアームと羽根で、パグミル型は水平な2軸の羽根で強制的に練り混ぜる">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 11px; fill: #555; }
      .t-title { font-size: 12px; fill: #1a3a5c; font-weight: bold; }
      .t-label { font-size: 11px; fill: #1a3a5c; }
      .t-desc  { font-size: 11px; fill: #555; }
      .t-ok    { font-size: 12px; fill: #3a7d44; font-weight: bold; }
      .t-ng    { font-size: 12px; fill: #b22234; font-weight: bold; }
      .box   { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .b-brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .b-ok  { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .b-warn{ fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .b-ng  { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .main  { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .ng    { stroke: #b22234; stroke-width: 2.5; fill: none; }
      .dash  { stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .ink   { stroke: #555; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="ar" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker>
    <marker id="arn" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#b22234"/></marker>
  </defs>
  <text class="t-lead" x="200" y="16" text-anchor="middle">断面を簡略化した模式図（練混ぜ機構の違い）</text>
  <rect class="box" x="20" y="28" width="360" height="140" rx="6"/>
  <text class="t-title" x="34" y="48">重力式（可傾式）ミキサ</text>
  <polygon class="box" points="92,126 128,126 140,154 80,154"/>
  <ellipse class="b-brand" cx="110" cy="100" rx="40" ry="26"/>
  <ellipse fill="#fff" stroke="#2e6da4" stroke-width="1.5" cx="138" cy="100" rx="9" ry="15"/>
  <circle cx="92" cy="96" r="3" fill="#8a8a8a"/><circle cx="104" cy="108" r="4" fill="#8a8a8a"/><circle cx="84" cy="106" r="2.5" fill="#8a8a8a"/><circle cx="110" cy="90" r="2.5" fill="#8a8a8a"/>
  <path class="main" d="M72,70 Q110,48 148,70" marker-end="url(#ar)"/>
  <text class="t-label" x="156" y="62">回転</text>
  <text class="t-desc" x="205" y="92">ドラム全体が回転し、</text>
  <text class="t-desc" x="205" y="110">材料が自重で落下して</text>
  <text class="t-desc" x="205" y="128">混ざり合う</text>

  <rect class="box" x="20" y="176" width="360" height="140" rx="6"/>
  <text class="t-title" x="34" y="196">パン型強制式ミキサ</text>
  <rect class="b-brand" x="50" y="262" width="120" height="36" rx="3"/>
  <line class="main" x1="110" y1="218" x2="110" y2="280"/>
  <line class="main" x1="76" y1="280" x2="144" y2="280"/>
  <rect fill="#2e6da4" x="72" y="270" width="7" height="20" rx="2"/>
  <rect fill="#2e6da4" x="141" y="270" width="7" height="20" rx="2"/>
  <path class="main" d="M76,232 Q110,214 144,232" marker-end="url(#ar)"/>
  <text class="t-label" x="152" y="226">回転</text>
  <text class="t-desc" x="205" y="250">アームと羽根が回転し、</text>
  <text class="t-desc" x="205" y="268">材料を強制的に</text>
  <text class="t-desc" x="205" y="286">かき混ぜる</text>

  <rect class="box" x="20" y="324" width="360" height="160" rx="6"/>
  <text class="t-title" x="34" y="344">パグミル型（二軸強制式）ミキサ</text>
  <circle class="b-brand" cx="88" cy="414" r="34"/>
  <circle class="b-brand" cx="152" cy="414" r="34"/>
  <g stroke="#2e6da4" stroke-width="4" stroke-linecap="round">
    <line x1="88" y1="414" x2="88" y2="386"/><line x1="88" y1="414" x2="64" y2="428"/><line x1="88" y1="414" x2="112" y2="428"/>
    <line x1="152" y1="414" x2="152" y2="442"/><line x1="152" y1="414" x2="128" y2="400"/><line x1="152" y1="414" x2="176" y2="400"/>
  </g>
  <circle cx="88" cy="414" r="4" fill="#1a3a5c"/><circle cx="152" cy="414" r="4" fill="#1a3a5c"/>
  <path class="main" d="M64,372 Q88,356 112,372" marker-end="url(#ar)"/>
  <path class="main" d="M128,458 Q152,472 176,458" marker-end="url(#ar)"/>
  <text class="t-desc" x="205" y="392">水平な2本の軸の羽根で</text>
  <text class="t-desc" x="205" y="410">強制的に練り混ぜる。</text>
  <text class="t-desc" x="205" y="428">練混ぜ効率が高く、</text>
  <text class="t-desc" x="205" y="446">均一性を確保しやすい</text>
</svg>
