<!-- authored 2026-09-30 doboku-note 自作。題材はコンクリート技士教材の水の密度と温度。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="水の密度と温度の関係を示す折れ線グラフ（縦軸は0.96付近から）。20℃から80℃で体積は約2.7％増える。0℃で1.000、20℃で0.998、40℃で0.992、60℃で0.983、80℃で0.972、100℃で0.958g/cm3へ低下する">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 11px; fill: #555; }
      .t-axis  { font-size: 11px; fill: #8a8a8a; }
      .t-label { font-size: 12px; fill: #1a3a5c; }
      .t-desc  { font-size: 11px; fill: #555; }
      .t-form  { font-size: 14px; fill: #1a3a5c; font-weight: 600; }
      .t-sub   { font-size: 11px; fill: #555; }
      .line-main { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .line-dash { stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .line-ax { stroke: #8a8a8a; stroke-width: 1; fill: none; }
      .line-arrow { stroke: #2e6da4; stroke-width: 1.5; fill: none; }
      .box { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-p { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-d { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
    </style>
  </defs>
  <text class="t-lead" x="200" y="18" text-anchor="middle">高温ほど水の密度は下がる</text>
  <line class="line-ax" x1="70" y1="290" x2="360" y2="290" />
  <line class="line-ax" x1="70" y1="50" x2="70" y2="290" />
  <line class="line-ax" x1="70" y1="290" x2="70" y2="294" />
  <text class="t-axis" x="70" y="308" text-anchor="middle">0</text>
  <line class="line-ax" x1="126" y1="290" x2="126" y2="294" />
  <text class="t-axis" x="126" y="308" text-anchor="middle">20</text>
  <line class="line-ax" x1="182" y1="290" x2="182" y2="294" />
  <text class="t-axis" x="182" y="308" text-anchor="middle">40</text>
  <line class="line-ax" x1="238" y1="290" x2="238" y2="294" />
  <text class="t-axis" x="238" y="308" text-anchor="middle">60</text>
  <line class="line-ax" x1="294" y1="290" x2="294" y2="294" />
  <text class="t-axis" x="294" y="308" text-anchor="middle">80</text>
  <line class="line-ax" x1="350" y1="290" x2="350" y2="294" />
  <text class="t-axis" x="350" y="308" text-anchor="middle">100</text>
  <line class="line-dash" x1="70" y1="267" x2="350" y2="267" />
  <text class="t-axis" x="64" y="271" text-anchor="end">0.96</text>
  <line class="line-dash" x1="70" y1="173" x2="350" y2="173" />
  <text class="t-axis" x="64" y="177" text-anchor="end">0.98</text>
  <line class="line-dash" x1="70" y1="79" x2="350" y2="79" />
  <text class="t-axis" x="64" y="83" text-anchor="end">1.00</text>
  <text class="t-axis" x="210" y="326" text-anchor="middle">水温（℃）</text>
  <text class="t-axis" x="20" y="42">密度（g/cm³）　※縦軸は0.96付近から始まる</text>
  <polyline class="line-main" points="70,79 126,89 182,117 238,159 294,210 350,276" />
  <circle cx="70" cy="79" r="3" fill="#2e6da4" />
  <text class="t-label" x="74" y="69">1.000</text>
  <circle cx="126" cy="89" r="6" fill="#fff3cd" stroke="#b22234" stroke-width="2" />
  <text class="t-label" x="116" y="93" text-anchor="end">0.998</text>
  <circle cx="182" cy="117" r="3" fill="#2e6da4" />
  <text class="t-label" x="172" y="121" text-anchor="end">0.992</text>
  <circle cx="238" cy="159" r="3" fill="#2e6da4" />
  <text class="t-label" x="228" y="163" text-anchor="end">0.983</text>
  <circle cx="294" cy="210" r="6" fill="#fff3cd" stroke="#b22234" stroke-width="2" />
  <text class="t-label" x="284" y="214" text-anchor="end">0.972</text>
  <circle cx="350" cy="276" r="3" fill="#2e6da4" />
  <text class="t-label" x="340" y="280" text-anchor="end">0.958</text>
  <text class="t-label" x="82" y="236" style="font-weight:bold">20℃→80℃で体積は約2.7％増える</text>
  <text class="t-axis" x="82" y="254">（密度 0.998 → 0.972 g/cm³）</text>
  <path d="M70,268 l-4,3 l8,3 l-4,3" stroke="#555" stroke-width="1.5" fill="none" />
  <rect class="box" x="20" y="345" width="360" height="80" rx="6" />
  <text class="t-desc" x="34" y="369">水は温度が上がると密度が下がる（体積がわずかに増える）</text>
  <text class="t-desc" x="34" y="391">練混ぜ水の温度はコンクリートの温度・スランプに影響</text>
  <text class="t-desc" x="34" y="413">暑中・寒中コンクリートでは水温も配合計画の管理対象</text>

</svg>
