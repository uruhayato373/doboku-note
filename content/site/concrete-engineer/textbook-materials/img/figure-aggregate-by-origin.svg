<!-- authored 2026-09-30 doboku-note 自作。題材はコンクリート技士教材の骨材の産地別分類。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="骨材の産地と種類の対応。山は山砂・山砂利、川の上流は砕石・砕砂、中下流は川砂利・川砂、河口は海砂、火山は軽量骨材、工場は高炉スラグ骨材、都市は解体コンクリート。種類は天然・人工・再生の3区分で、砕石・砕砂と軽量骨材は人工骨材">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 11px; fill: #555; }
      .t-axis  { font-size: 11px; fill: #8a8a8a; }
      .t-label { font-size: 11px; fill: #1a3a5c; }
      .t-desc  { font-size: 11px; fill: #555; }
      .t-form  { font-size: 14px; fill: #1a3a5c; font-weight: 600; }
      .t-sub   { font-size: 11px; fill: #555; }
      .line-main { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .line-dash { stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .line-ax { stroke: #8a8a8a; stroke-width: 1; fill: none; }
      .line-arrow { stroke: #2e6da4; stroke-width: 1.5; fill: none; }
      .box { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-p { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-d { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
    </style>
  </defs>
  <text class="t-lead" x="200" y="18" text-anchor="middle">産地（採取場所）と骨材の種類（点の色＝下の3区分）</text>
  <rect class="box-b" x="230" y="272" width="162" height="28" rx="6" />
  <text class="t-axis" x="311" y="291" text-anchor="middle">海</text>
  <polyline class="line-main" points="60,70 120,115 190,170 260,225 320,255" />
  <text class="t-axis" x="240" y="196">川</text>
  <circle cx="60" cy="70" r="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5" />
  <text class="t-label" x="72" y="74">山：山砂・山砂利</text>
  <circle cx="120" cy="115" r="6" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5" />
  <text class="t-label" x="132" y="119">上流：砕石・砕砂</text>
  <circle cx="190" cy="170" r="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5" />
  <text class="t-label" x="202" y="174">中下流：川砂利・川砂</text>
  <circle cx="320" cy="255" r="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5" />
  <text class="t-label" x="388" y="243" text-anchor="end">河口：海砂</text>
  <circle cx="340" cy="50" r="6" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5" />
  <text class="t-label" x="330" y="36" text-anchor="end">火山：火山れき（軽量骨材）</text>
  <circle cx="340" cy="140" r="6" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5" />
  <text class="t-label" x="330" y="144" text-anchor="end">工場：高炉スラグ骨材</text>
  <circle cx="50" cy="205" r="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5" />
  <text class="t-label" x="62" y="209">平地：陸砂・陸砂利</text>
  <circle cx="50" cy="250" r="6" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5" />
  <text class="t-label" x="62" y="254">都市：解体コンクリート</text>
  <text class="t-lead" x="200" y="314" text-anchor="middle">産地の違いで3種類に分かれる</text>
  <rect class="box-b" x="20" y="322" width="360" height="50" rx="6" />
  <circle cx="36" cy="338" r="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5" />
  <text class="t-label" x="50" y="342" style="font-weight:600">天然骨材</text>
  <text class="t-desc" x="34" y="362">川砂利・山砂利・陸砂利・海砂など</text>
  <rect class="box-w" x="20" y="380" width="360" height="50" rx="6" />
  <circle cx="36" cy="396" r="6" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5" />
  <text class="t-label" x="50" y="400" style="font-weight:600">人工骨材</text>
  <text class="t-desc" x="34" y="420">砕石・砕砂・軽量骨材・高炉スラグ骨材など</text>
  <rect class="box-p" x="20" y="438" width="360" height="50" rx="6" />
  <circle cx="36" cy="454" r="6" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5" />
  <text class="t-label" x="50" y="458" style="font-weight:600">再生骨材</text>
  <text class="t-desc" x="34" y="478">解体コンクリートを破砕・処理して製造</text>
</svg>
