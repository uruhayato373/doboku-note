<!-- authored 2026-10-16 doboku-note 自作。題材はコンクリート技士教材の骨材の産地別分類。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="骨材の3区分。天然骨材は川砂利・山砂利・陸砂利・海砂で天然軽量骨材は火山れき。人工骨材は砕石・砕砂・スラグ骨材など。再生骨材は解体コンクリートを処理したもの。密度では軽量・普通・重量に分ける">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-title { font-size: 14px; font-weight: bold; fill: #222; }
      .t-head  { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-label { font-size: 12px; fill: #1a3a5c; }
      .t-desc  { font-size: 12px; fill: #555; }
      .t-axis  { font-size: 11px; fill: #555; }
      .t-warn  { font-size: 12px; fill: #b22234; font-weight: bold; }
      .box { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-p { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-d { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .ln { stroke: #555; stroke-width: 1; fill: none; }
      .arr { stroke: #2e6da4; stroke-width: 1.5; fill: none; marker-end: url(#ah); }
      .arr-d { stroke: #b22234; stroke-width: 1.5; fill: none; marker-end: url(#ahd); }
    </style>
    <marker id="ah" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker>
    <marker id="ahd" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#b22234"/></marker>
  </defs>
  <text class="t-lead" x="200" y="18" text-anchor="middle">骨材は産地（出どころ）で3区分に分かれる</text>
  <rect class="box-b" x="20" y="30" width="360" height="104" rx="6"/>
  <text class="t-title" x="34" y="56">天然骨材</text>
  <text class="t-label" x="34" y="80">例　川砂利・山砂利・陸砂利・海砂</text>
  <text class="t-label" x="34" y="100">出どころ　自然の作用でできたもの</text>
  <text class="t-desc" x="34" y="120">天然軽量骨材は火山れき</text>
  <rect class="box-w" x="20" y="142" width="360" height="104" rx="6"/>
  <text class="t-title" x="34" y="168">人工骨材</text>
  <text class="t-label" x="34" y="192">例　砕石・砕砂・高炉スラグ骨材など</text>
  <text class="t-label" x="34" y="212">出どころ　岩石を砕く、または製造工程でつくる</text>
  <text class="t-desc" x="34" y="232">人工軽量骨材は膨張頁岩などを焼成</text>
  <rect class="box-p" x="20" y="254" width="360" height="104" rx="6"/>
  <text class="t-title" x="34" y="280">再生骨材</text>
  <text class="t-label" x="34" y="304">例　解体コンクリートを破砕・処理</text>
  <text class="t-label" x="34" y="324">出どころ　処理の程度で品質等級はH・M・L</text>
  <text class="t-desc" x="34" y="344">Hは高度な処理で通常の骨材に近い性能</text>
  <rect class="box" x="20" y="372" width="360" height="112" rx="6"/>
  <text class="t-head" x="34" y="396">別の軸：密度で分ける</text>
  <rect class="box-b" x="34" y="408" width="104" height="64" rx="6"/>
  <text class="t-label" x="86" y="432" text-anchor="middle">軽量</text>
  <text class="t-axis" x="86" y="454" text-anchor="middle">自重を軽くする</text>
  <rect class="box-b" x="149" y="408" width="104" height="64" rx="6"/>
  <text class="t-label" x="201" y="432" text-anchor="middle">普通</text>
  <text class="t-axis" x="201" y="454" text-anchor="middle">一般の骨材</text>
  <rect class="box-b" x="264" y="408" width="104" height="64" rx="6"/>
  <text class="t-label" x="316" y="432" text-anchor="middle">重量</text>
  <text class="t-axis" x="316" y="454" text-anchor="middle">放射線の遮へい</text>
</svg>
