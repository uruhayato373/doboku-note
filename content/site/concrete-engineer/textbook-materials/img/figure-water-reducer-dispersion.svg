<circle cx="150" cy="236" r="12" fill="#f5f5f5" stroke="#b22234" stroke-width="2.4"/>
<circle cx="178" cy="232" r="15" fill="none" stroke="#b22234" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="178" cy="232" r="12" fill="#f5f5f5" stroke="#b22234" stroke-width="2.4"/>
<circle cx="206" cy="238" r="15" fill="none" stroke="#b22234" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="206" cy="238" r="12" fill="#f5f5f5" stroke="#b22234" stroke-width="2.4"/>
<circle cx="164" cy="258" r="15" fill="none" stroke="#b22234" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="164" cy="258" r="12" fill="#f5f5f5" stroke="#b22234" stroke-width="2.4"/>
<circle cx="192" cy="258" r="15" fill="none" stroke="#b22234" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="192" cy="258" r="12" fill="#f5f5f5" stroke="#b22234" stroke-width="2.4"/>
<circle cx="220" cy="258" r="15" fill="none" stroke="#b22234" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="220" cy="258" r="12" fill="#f5f5f5" stroke="#b22234" stroke-width="2.4"/>
<circle cx="178" cy="210" r="15" fill="none" stroke="#b22234" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="178" cy="210" r="12" fill="#f5f5f5" stroke="#b22234" stroke-width="2.4"/>
<circle cx="206" cy="214" r="15" fill="none" stroke="#b22234" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="206" cy="214" r="12" fill="#f5f5f5" stroke="#b22234" stroke-width="2.4"/>
<text class="t-desc" x="26" y="292">表面が同じ電荷を帯びる</text>
<rect class="box-b" x="16" y="310" width="368" height="130" rx="6"/>
<text class="t-head" x="26" y="330">3　粒子が反発して分散</text>
<circle cx="100" cy="362" r="15" fill="none" stroke="#b22234" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="100" cy="362" r="12" fill="#f5f5f5" stroke="#b22234" stroke-width="2.4"/>
<circle cx="160" cy="388" r="15" fill="none" stroke="#b22234" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="160" cy="388" r="12" fill="#f5f5f5" stroke="#b22234" stroke-width="2.4"/>
<circle cx="220" cy="360" r="15" fill="none" stroke="#b22234" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="220" cy="360" r="12" fill="#f5f5f5" stroke="#b22234" stroke-width="2.4"/>
<circle cx="280" cy="380" r="15" fill="none" stroke="#b22234" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="280" cy="380" r="12" fill="#f5f5f5" stroke="#b22234" stroke-width="2.4"/>
<circle cx="130" cy="402" r="15" fill="none" stroke="#b22234" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="130" cy="402" r="12" fill="#f5f5f5" stroke="#b22234" stroke-width="2.4"/>
<circle cx="250" cy="402" r="15" fill="none" stroke="#b22234" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="250" cy="402" r="12" fill="#f5f5f5" stroke="#b22234" stroke-width="2.4"/>
<circle cx="190" cy="370" r="15" fill="none" stroke="#b22234" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="190" cy="370" r="12" fill="#f5f5f5" stroke="#b22234" stroke-width="2.4"/>
<circle cx="310" cy="356" r="15" fill="none" stroke="#b22234" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="310" cy="356" r="12" fill="#f5f5f5" stroke="#b22234" stroke-width="2.4"/>
<text class="t-desc" x="26" y="432">離れた粒子の間に水が行き渡る</text>
<line class="arr-d" x1="320" y1="200" x2="240" y2="224"/>
<line class="arr-d" x1="320" y1="200" x2="236" y2="246"/>
<text class="t-warn" x="370" y="196" text-anchor="end">減水剤</text>
<text class="t-label" x="200" y="458" text-anchor="middle">少ない水でも粒子が動けて施工性を保てる</text>
<text class="t-desc" x="200" y="475" text-anchor="middle">減水率の下限（JIS A6204）</text>
<text class="t-desc" x="200" y="492" text-anchor="middle">AE減水剤は10％以上、高性能AE減水剤は18％以上</text>
</svg>
