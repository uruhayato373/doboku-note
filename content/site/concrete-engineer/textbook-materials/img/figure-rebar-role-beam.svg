<!-- authored 2026-10-16 doboku-note 自作。題材はコンクリート技士教材の鉄筋の役割。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="鉄筋なしの梁は引張側が割れて破断し、鉄筋ありの梁は引張側の鉄筋が力を負担してひび割れても直ちには壊れない。両者は熱膨張係数が近く付着で一体になる">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-title { font-size: 14px; font-weight: bold; fill: #222; }
      .t-head  { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-label { font-size: 12px; fill: #1a3a5c; }
      .t-desc  { font-size: 12px; fill: #555; }
      .t-axis  { font-size: 11px; fill: #555; }
      .t-warn  { font-size: 12px; fill: #b22234; font-weight: bold; }
      .box { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-p { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-d { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .ln { stroke: #555; stroke-width: 1; fill: none; }
      .arr { stroke: #2e6da4; stroke-width: 1.5; fill: none; marker-end: url(#ah); }
      .arr-d { stroke: #b22234; stroke-width: 1.5; fill: none; marker-end: url(#ahd); }
    </style>
    <marker id="ah" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker>
    <marker id="ahd" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#b22234"/></marker>
  </defs>
  <text class="t-lead" x="200" y="18" text-anchor="middle">梁の側面図（荷重を受けた状態の模式図）</text>
  <rect class="box" x="20" y="28" width="360" height="196" rx="6"/>
  <text class="t-head" x="36" y="50">鉄筋なし</text>
  <line x1="200" y1="58" x2="200" y2="92" class="arr"/>
  <text class="t-desc" x="210" y="80">荷重</text>
  <rect class="box-b" x="50" y="98" width="300" height="60" rx="3"/>
  <text class="t-axis" x="60" y="118">圧縮側（上）</text>
  <text class="t-axis" x="60" y="148">引張側（下）</text>
  <polygon points="62,170 70,158 78,170" fill="#d7d7d7" stroke="#8a8a8a"/>
  <polygon points="322,170 330,158 338,170" fill="#d7d7d7" stroke="#8a8a8a"/>
  <path d="M200,158 L196,144 L204,134 L198,122 L200,100" stroke="#b22234" stroke-width="2" fill="none"/>
  <text class="t-label" x="200" y="196" text-anchor="middle">ひび割れが一気に進み、破断する</text>
  <text class="t-desc" x="200" y="214" text-anchor="middle">引張に弱いコンクリートだけでは耐えられない</text>
  <rect class="box" x="20" y="234" width="360" height="196" rx="6"/>
  <text class="t-head" x="36" y="256">鉄筋あり</text>
  <line x1="200" y1="264" x2="200" y2="298" class="arr"/>
  <text class="t-desc" x="210" y="286">荷重</text>
  <rect class="box-b" x="50" y="304" width="300" height="60" rx="3"/>
  <text class="t-axis" x="60" y="324">圧縮側（上）</text>
  <text class="t-axis" x="60" y="344">引張側（下）</text>
  <polygon points="62,376 70,364 78,376" fill="#d7d7d7" stroke="#8a8a8a"/>
  <polygon points="322,376 330,364 338,376" fill="#d7d7d7" stroke="#8a8a8a"/>
  <line x1="56" y1="358" x2="344" y2="358" stroke="#3a7d44" stroke-width="4"/>
  <path d="M110,366 L107,358 L112,350" stroke="#b22234" stroke-width="2" fill="none"/>
  <path d="M140,366 L137,358 L142,350" stroke="#b22234" stroke-width="2" fill="none"/>
  <path d="M260,366 L257,358 L262,350" stroke="#b22234" stroke-width="2" fill="none"/>
  <path d="M290,366 L287,358 L292,350" stroke="#b22234" stroke-width="2" fill="none"/>
  <text class="t-label" x="200" y="402" text-anchor="middle">引張側：鉄筋が負担（ひび割れは生じる）</text>
  <text class="t-desc" x="200" y="420" text-anchor="middle">ひび割れても直ちには壊れない</text>
  <rect class="box-p" x="20" y="440" width="360" height="48" rx="6"/>
  <text class="t-label" x="200" y="460" text-anchor="middle">熱膨張係数が近く、付着で一体になる</text>
  <text class="t-desc" x="200" y="478" text-anchor="middle">だから鉄筋とコンクリートは一緒に働ける</text>
</svg>
