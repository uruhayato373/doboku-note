    <circle cx="115" cy="193" r="13" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
    <circle cx="155" cy="193" r="13" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
