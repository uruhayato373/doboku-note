    <circle cx="314.5" cy="107" r="17" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
    <circle cx="347.5" cy="107" r="17" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
    <circle cx="232" cy="135" r="17" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
    <circle cx="265" cy="135" r="17" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
    <circle cx="298" cy="135" r="17" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
    <circle cx="331" cy="135" r="17" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
    <circle cx="248.5" cy="163" r="17" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
    <circle cx="281.5" cy="163" r="17" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
    <circle cx="314.5" cy="163" r="17" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
    <circle cx="347.5" cy="163" r="17" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
    <circle cx="232" cy="191" r="17" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
    <circle cx="265" cy="191" r="17" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
    <circle cx="298" cy="191" r="17" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
    <circle cx="331" cy="191" r="17" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
