  <text class="t-desc" x="110" y="234" text-anchor="middle">黄色の空隙が大きい</text>
  <text class="t-desc" x="290" y="234" text-anchor="middle">黄色の空隙が小さい</text>
  <rect class="box-d" x="20" y="248" width="172" height="52" rx="6"/>
  <text class="t-label" x="106" y="270" text-anchor="middle">実積率は小さい</text>
  <text class="t-desc" x="106" y="288" text-anchor="middle">埋めるモルタルが多く要る</text>
  <rect class="box-p" x="208" y="248" width="172" height="52" rx="6"/>
  <text class="t-label" x="294" y="270" text-anchor="middle">実積率は大きい</text>
  <text class="t-desc" x="294" y="288" text-anchor="middle">モルタルが少なくてすむ</text>
  <rect class="box" x="20" y="320" width="360" height="160" rx="6"/>
  <text class="t-title" x="200" y="348" text-anchor="middle">実積率 ＝ 単位容積質量 ÷ 密度 × 100（％）</text>
  <text class="t-desc" x="34" y="382">粒形・粒度が良い</text>
  <text class="t-desc" x="34" y="408">→ 骨材のかみ合いがよく、空隙が小さい</text>
  <text class="t-desc" x="34" y="434">→ 実積率が大きい</text>
  <text class="t-label" x="34" y="460">→ 空隙を埋めるモルタル量を少なくできる</text>
</svg>
