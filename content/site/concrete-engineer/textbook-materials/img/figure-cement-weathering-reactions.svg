<!-- authored 2026-09-30 doboku-note 自作。題材はコンクリート技士教材のセメントの風化。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="セメントの風化を示す2段階の化学反応。酸化カルシウムと水から水酸化カルシウム、続いて水酸化カルシウムと二酸化炭素から炭酸カルシウムと水が生じる">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 11px; fill: #555; }
      .t-axis  { font-size: 11px; fill: #8a8a8a; }
      .t-label { font-size: 11px; fill: #1a3a5c; }
      .t-desc  { font-size: 11px; fill: #555; }
      .t-form  { font-size: 14px; fill: #1a3a5c; font-weight: 600; }
      .t-sub   { font-size: 11px; fill: #555; }
      .line-main { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .line-dash { stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .line-ax { stroke: #8a8a8a; stroke-width: 1; fill: none; }
      .line-arrow { stroke: #2e6da4; stroke-width: 1.5; fill: none; }
      .box { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-p { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-d { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
    </style>
    <marker id="ah" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#2e6da4" />
    </marker>
  </defs>
  <text class="t-lead" x="200" y="18" text-anchor="middle">貯蔵中のセメントに起こる風化の2段階</text>
  <rect class="box" x="40" y="34" width="140" height="46" rx="6" />
  <text class="t-form" x="110.0" y="56" text-anchor="middle"><tspan>CaO</tspan></text>
  <text class="t-desc" x="110.0" y="73" text-anchor="middle">酸化カルシウム</text>
  <rect class="box-b" x="220" y="34" width="140" height="46" rx="6" />
  <text class="t-form" x="290.0" y="56" text-anchor="middle"><tspan>H</tspan><tspan dy="3" font-size="11">2</tspan><tspan dy="-3">O</tspan></text>
  <text class="t-desc" x="290.0" y="73" text-anchor="middle">水（湿気）</text>
  <text class="t-form" x="200" y="62" text-anchor="middle">＋</text>
  <line class="line-arrow" x1="200" y1="86" x2="200" y2="124" marker-end="url(#ah)" />
  <text class="t-label" x="212" y="110">水分と反応</text>
  <rect class="box-w" x="40" y="130" width="140" height="46" rx="6" />
  <text class="t-form" x="110.0" y="152" text-anchor="middle"><tspan>Ca(OH)</tspan><tspan dy="3" font-size="11">2</tspan></text>
  <text class="t-desc" x="110.0" y="169" text-anchor="middle">水酸化カルシウム</text>
  <rect class="box-b" x="220" y="130" width="140" height="46" rx="6" />
  <text class="t-form" x="290.0" y="152" text-anchor="middle"><tspan>CO</tspan><tspan dy="3" font-size="11">2</tspan></text>
  <text class="t-desc" x="290.0" y="169" text-anchor="middle">二酸化炭素</text>
  <text class="t-form" x="200" y="158" text-anchor="middle">＋</text>
  <line class="line-arrow" x1="200" y1="182" x2="200" y2="220" marker-end="url(#ah)" />
  <text class="t-label" x="212" y="206">CO₂と反応</text>
  <rect class="box-p" x="40" y="226" width="140" height="46" rx="6" />
  <text class="t-form" x="110.0" y="248" text-anchor="middle"><tspan>CaCO</tspan><tspan dy="3" font-size="11">3</tspan></text>
  <text class="t-desc" x="110.0" y="265" text-anchor="middle">炭酸カルシウム</text>
  <rect class="box" x="220" y="226" width="140" height="46" rx="6" />
  <text class="t-form" x="290.0" y="248" text-anchor="middle"><tspan>H</tspan><tspan dy="3" font-size="11">2</tspan><tspan dy="-3">O</tspan></text>
  <text class="t-desc" x="290.0" y="265" text-anchor="middle">水</text>
  <text class="t-form" x="200" y="254" text-anchor="middle">＋</text>
  <text class="t-label" x="200" y="296" text-anchor="middle">上段の生成物が中段の反応物になる</text>
  <rect class="box" x="20" y="318" width="360" height="80" rx="6" />
  <text class="t-desc" x="34" y="342">風化＝貯蔵中に空気中の水分・CO₂と反応して変質</text>
  <text class="t-desc" x="34" y="364">水和に有効な成分が減り、強度発現が鈍くなる</text>
  <text class="t-desc" x="34" y="386">風化が進むほど強熱減量は増える（品質判定の目安）</text>

</svg>
