<!-- authored 2026-10-16 doboku-note 自作。題材はコンクリート技士教材の細骨材率。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="細骨材率とスランプ、水セメント比の傾向図。スランプが大きいほど、また水セメント比が大きいほど細骨材率は高い側に並ぶ。数値なしの定性図">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-title { font-size: 14px; font-weight: bold; fill: #222; }
      .t-head  { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-label { font-size: 12px; fill: #1a3a5c; }
      .t-desc  { font-size: 12px; fill: #555; }
      .t-axis  { font-size: 11px; fill: #555; }
      .t-warn  { font-size: 12px; fill: #b22234; font-weight: bold; }
      .box { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-p { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-d { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .ln { stroke: #555; stroke-width: 1; fill: none; }
      .arr { stroke: #2e6da4; stroke-width: 1.5; fill: none; marker-end: url(#ah); }
      .arr-d { stroke: #b22234; stroke-width: 1.5; fill: none; marker-end: url(#ahd); }
    </style>
    <marker id="ah" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker>
    <marker id="ahd" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#b22234"/></marker>
  </defs>
  <text class="t-lead" x="200" y="18" text-anchor="middle">細骨材率の傾向（定性・数値なし）</text>
  <line x1="60" y1="300" x2="360" y2="300" class="ln"/>
  <line x1="60" y1="50" x2="60" y2="300" class="ln"/>
  <text class="t-axis" x="64" y="44">細骨材率（低 → 高）</text>
  <text class="t-axis" x="360" y="322" text-anchor="end">スランプ（小 → 大）</text>
  <line x1="90" y1="160" x2="330" y2="90" stroke="#2e6da4" stroke-width="2.5"/>
  <line x1="90" y1="220" x2="330" y2="150" stroke="#2e6da4" stroke-width="2.5"/>
  <line x1="90" y1="280" x2="330" y2="210" stroke="#2e6da4" stroke-width="2.5"/>
  <text class="t-label" x="336" y="84" text-anchor="start">W/C 大</text>
  <text class="t-label" x="336" y="144" text-anchor="start">W/C 中</text>
  <text class="t-label" x="336" y="204" text-anchor="start">W/C 小</text>
  <rect class="box-b" x="20" y="342" width="360" height="142" rx="6"/>
  <text class="t-head" x="34" y="366">読み取りの要点</text>
  <text class="t-desc" x="34" y="390">・W/Cが大きいほど、細骨材率は高い側に並ぶ</text>
  <text class="t-desc" x="34" y="412">・スランプが大きいほど、細骨材率は高くなる傾向</text>
  <text class="t-desc" x="34" y="438">・「常に大きくすればよい」わけではない。</text>
  <text class="t-desc" x="34" y="458">　骨材・空気量・混和剤などを踏まえて決める</text>
</svg>
