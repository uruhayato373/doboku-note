<!-- authored 2026-10-16 doboku-note 自作。題材はコンクリート技士教材の配合強度と割増し。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="呼び強度を中心にした分布（破線）と、割増しの分だけ同じ形で右へずらした配合強度の分布（実線）。右へずらすと呼び強度を下回る範囲が小さくなり、配合強度は呼び強度に割増しを加えた値になる">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-title { font-size: 14px; font-weight: bold; fill: #222; }
      .t-head  { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-label { font-size: 12px; fill: #1a3a5c; }
      .t-desc  { font-size: 12px; fill: #555; }
      .t-axis  { font-size: 11px; fill: #555; }
      .t-warn  { font-size: 12px; fill: #b22234; font-weight: bold; }
      .box { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-p { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-d { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .ln { stroke: #555; stroke-width: 1; fill: none; }
      .arr { stroke: #2e6da4; stroke-width: 1.5; fill: none; marker-end: url(#ah); }
      .arr-d { stroke: #b22234; stroke-width: 1.5; fill: none; marker-end: url(#ahd); }
    </style>
    <marker id="ah" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker>
    <marker id="ahd" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#b22234"/></marker>
  </defs>
  <text class="t-lead" x="200" y="18" text-anchor="middle">割増しは同じ形の分布を右へずらすだけ（数値なし）</text>
  <line x1="30" y1="250" x2="375" y2="250" class="ln"/>
  <text class="t-axis" x="375" y="240" text-anchor="end">強度</text>
  <path d="M60,249.3 L64,248.9 L68,248.4 L72,247.5 L76,246.3 L80,244.7 L84,242.5 L88,239.7 L92,236.0 L96,231.3 L100,225.6 L104,218.9 L108,211.0 L112,202.2 L116,192.6 L120,182.4 L124,172.0 L128,161.9 L132,152.4 L136,144.1 L140,137.4 L144,132.7 L148,130.3 L150,250 L60,250 Z" fill="#f8d7da" stroke="none"/>
  <path d="M141,248.7 L145,248.0 L149,247.0 L150,250 L141,250 Z" fill="#b22234" stroke="none"/>
  <polyline points="60,249.3 64,248.9 68,248.4 72,247.5 76,246.3 80,244.7 84,242.5 88,239.7 92,236.0 96,231.3 100,225.6 104,218.9 108,211.0 112,202.2 116,192.6 120,182.4 124,172.0 128,161.9 132,152.4 136,144.1 140,137.4 144,132.7 148,130.3 152,130.3 156,132.7 160,137.4 164,144.1 168,152.4 172,161.9 176,172.0 180,182.4 184,192.6 188,202.2 192,211.0 196,218.9 200,225.6 204,231.3 208,236.0 212,239.7 216,242.5 220,244.7 224,246.3 228,247.5 232,248.4 236,248.9 240,249.3" fill="none" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="4 3"/>
  <polyline points="141,248.7 145,248.0 149,247.0 153,245.6 157,243.7 161,241.2 165,237.9 169,233.8 173,228.6 177,222.4 181,215.1 185,206.7 189,197.5 193,187.5 197,177.2 201,166.9 205,157.0 209,148.1 213,140.5 217,134.8 221,131.2 225,130.0 229,131.2 233,134.8 237,140.5 241,148.1 245,157.0 249,166.9 253,177.2 257,187.5 261,197.5 265,206.7 269,215.1 273,222.4 277,228.6 281,233.8 285,237.9 289,241.2 293,243.7 297,245.6 301,247.0 305,248.0 309,248.7 313,249.1" fill="none" stroke="#2e6da4" stroke-width="2.5"/>
  <line x1="150" y1="84" x2="150" y2="250" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="225" y1="84" x2="225" y2="250" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="152" y1="76" x2="223" y2="76" class="arr"/>
  <text class="t-label" x="188" y="66" text-anchor="middle">割増し</text>
  <text class="t-label" x="150" y="272" text-anchor="middle">呼び強度</text>
  <text class="t-label" x="230" y="272" text-anchor="middle">配合強度</text>
  <text class="t-desc" x="20" y="104">破線：呼び強度を</text>
  <text class="t-desc" x="20" y="120">狙った場合</text>
  <text class="t-desc" x="380" y="104" text-anchor="end">実線：配合強度を</text>
  <text class="t-desc" x="380" y="120" text-anchor="end">狙った場合</text>
  <rect x="30" y="288" width="14" height="10" fill="#f8d7da"/>
  <text class="t-axis" x="50" y="297">呼び強度を下回る範囲（破線の分布では広い）</text>
  <rect x="30" y="304" width="14" height="10" fill="#b22234"/>
  <text class="t-axis" x="50" y="313">実線の分布では、下回る範囲がごくわずか</text>
  <rect class="box" x="20" y="330" width="360" height="150" rx="6"/>
  <rect class="box-b" x="34" y="344" width="332" height="34" rx="6"/>
  <text class="t-label" x="200" y="366" text-anchor="middle">配合強度 ＝ 呼び強度 ＋ 割増し</text>
  <text class="t-desc" x="34" y="402">・試験値は材料や練混ぜでばらつく</text>
  <text class="t-desc" x="34" y="424">・呼び強度を狙うだけでは、下回る試験値が出やすい</text>
  <text class="t-desc" x="34" y="446">・分布ごと右へずらし、下回る確率を小さく抑える</text>
  <text class="t-desc" x="34" y="468">・配合強度は常に呼び強度以上になる</text>
</svg>
