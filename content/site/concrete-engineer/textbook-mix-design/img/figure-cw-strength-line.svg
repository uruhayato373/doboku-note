<!-- authored 2026-09-30 doboku-note 自作。題材はコンクリート技士教材の配合設計の水セメント比と強度の関係。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="セメント水比C/W（1.5〜3.0、対応する水セメント比W/Cは70〜30％）と圧縮強度の関係。C/Wが大きいほど、つまり水セメント比が小さいほど、圧縮強度が右上がりに高くなる傾向を示す">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 11px; fill: #555; }
      .t-axis  { font-size: 11px; fill: #8a8a8a; }
      .t-label { font-size: 11px; fill: #1a3a5c; }
      .t-desc  { font-size: 11px; fill: #555; }
      .t-big   { font-size: 16px; font-weight: 700; fill: #1a3a5c; }
      .t-red   { font-size: 11px; fill: #b22234; }
      .line-main { stroke: #2e6da4; stroke-width: 2; fill: none; }
      .line-thin { stroke: #2e6da4; stroke-width: 1.5; fill: none; }
      .line-dash { stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .line-axis { stroke: #8a8a8a; stroke-width: 1; fill: none; }
      .line-grid { stroke: #d7d7d7; stroke-width: 1; fill: none; }
      .line-red  { stroke: #b22234; stroke-width: 1.5; fill: none; }
      .line-arrow{ stroke: #1a3a5c; stroke-width: 1.5; fill: none; }
      .box { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-d { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .box-p { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
    </style>
    <marker id="ah" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#1a3a5c" /></marker>
  </defs>

  <text class="t-lead" x="200" y="16" text-anchor="middle">軸の代表値のみ表示・直線は傾向を示す</text>
  <text class="t-axis" x="12" y="38">圧縮強度 (N/mm<tspan dy="-4">2</tspan><tspan dy="4">)</tspan></text>
  <line class="line-grid" x1="70" y1="300" x2="350" y2="300" />
  <text class="t-axis" x="62" y="304" text-anchor="end">0</text>
  <line class="line-grid" x1="70" y1="237.5" x2="350" y2="237.5" />
  <text class="t-axis" x="62" y="241.5" text-anchor="end">20</text>
  <line class="line-grid" x1="70" y1="175" x2="350" y2="175" />
  <text class="t-axis" x="62" y="179" text-anchor="end">40</text>
  <line class="line-grid" x1="70" y1="112.5" x2="350" y2="112.5" />
  <text class="t-axis" x="62" y="116.5" text-anchor="end">60</text>
  <line class="line-grid" x1="70" y1="50" x2="350" y2="50" />
  <text class="t-axis" x="62" y="54" text-anchor="end">80</text>
  <line class="line-grid" x1="96.7" y1="50" x2="96.7" y2="300" />
  <text class="t-axis" x="96.7" y="316" text-anchor="middle">1.5</text>
  <line class="line-grid" x1="163.3" y1="50" x2="163.3" y2="300" />
  <text class="t-axis" x="163.3" y="316" text-anchor="middle">2.0</text>
  <line class="line-grid" x1="230" y1="50" x2="230" y2="300" />
  <text class="t-axis" x="230" y="316" text-anchor="middle">2.5</text>
  <line class="line-grid" x1="296.7" y1="50" x2="296.7" y2="300" />
  <text class="t-axis" x="296.7" y="316" text-anchor="middle">3.0</text>
  <rect x="70" y="50" width="280" height="250" fill="none" class="line-axis" />
  <line class="line-main" x1="86" y1="231.3" x2="276.7" y2="106.3" />
  <circle cx="86" cy="231.3" r="3" fill="#2e6da4" />
  <circle cx="276.7" cy="106.3" r="3" fill="#2e6da4" />
  <text class="t-label" x="80" y="74">水セメント比が小さいほど</text>
  <text class="t-label" x="80" y="90">強度は大きくなる</text>
  <text class="t-lead" x="210" y="334" text-anchor="middle">セメント水比 C/W</text>
  <line class="line-axis" x1="87.1" y1="346" x2="341.1" y2="346" />
  <line class="line-axis" x1="87.1" y1="346" x2="87.1" y2="352" />
  <text class="t-axis" x="87.1" y="366" text-anchor="middle">70</text>
  <line class="line-axis" x1="118.9" y1="346" x2="118.9" y2="352" />
  <text class="t-axis" x="118.9" y="366" text-anchor="middle">60</text>
  <line class="line-axis" x1="163.3" y1="346" x2="163.3" y2="352" />
  <text class="t-axis" x="163.3" y="366" text-anchor="middle">50</text>
  <line class="line-axis" x1="230" y1="346" x2="230" y2="352" />
  <text class="t-axis" x="230" y="366" text-anchor="middle">40</text>
  <line class="line-axis" x1="341.1" y1="346" x2="341.1" y2="352" />
  <text class="t-axis" x="341.1" y="366" text-anchor="middle">30</text>
  <text class="t-lead" x="210" y="384" text-anchor="middle">水セメント比 W/C（%）</text>
  <rect class="box-b" x="20" y="402" width="360" height="82" rx="6" />
  <text class="t-label" x="34" y="424">C/W が大きい ＝ W/C が小さい ほど強度が高い</text>
  <text class="t-desc" x="34" y="446">水セメント比が小さいと毛細管空隙が減り、圧縮強度</text>
  <text class="t-desc" x="34" y="462">と物質移動抵抗性が高まる。逆に大きいと強度・耐久性</text>
  <text class="t-desc" x="34" y="478">が低下しやすい</text>
</svg>
