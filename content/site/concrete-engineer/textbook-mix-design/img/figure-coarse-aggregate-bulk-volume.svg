  <text class="t-lead" x="20" y="316">単位粗骨材かさ容積 ＝ 0.60 m³/m³</text>
  <rect class="box" x="20" y="326" width="360" height="158" rx="6" />
  <text class="t-label" x="34" y="350">コンクリート1 m³ に使う粗骨材の、</text>
  <text class="t-label" x="34" y="368">粒と粒間のすき間を含めたかさの容積</text>
  <text class="t-desc" x="34" y="394">・空の容器の6割まで詰めるという意味ではない</text>
  <text class="t-desc" x="34" y="412">・粒間のすき間にはモルタルが入る</text>
  <text class="t-label" x="34" y="440">絶対容積 ＝ かさ容積 × 実積率</text>
  <text class="t-desc" x="34" y="458">実積率：容器に詰めた粗骨材のうち</text>
  <text class="t-desc" x="34" y="474">粒そのものが占める割合</text>
