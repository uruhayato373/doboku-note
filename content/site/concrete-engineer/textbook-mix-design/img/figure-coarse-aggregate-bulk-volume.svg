<!-- authored 2026-09-30 doboku-note 自作。題材はコンクリート技士教材の配合設計の単位粗骨材かさ容積。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
