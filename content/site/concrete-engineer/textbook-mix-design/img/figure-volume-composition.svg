<!-- authored 2026-09-12 doboku-note 自作。題材はコンクリート技士テキスト「配合設計」の論点。特定の書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="5要素の絶対容積を1m³へ積み上げ、量の増減が性質に跳ね返る配合の基本形を、水・セメント・空気を増やしたときの変化とあわせて示す図">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-sec  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-name { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-desc { font-size: 11px; fill: #555; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-p { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-d { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .box-s { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
    <marker id="vc-arrow" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#d4a017"/>
    </marker>
  </defs>

  <text class="t-lead" x="200" y="16" text-anchor="middle">5要素の絶対容積を1m³へ積み上げ、量を変えると性質が動く</text>

  <rect class="box-s" x="20" y="24" width="360" height="24" rx="4"/>
  <text class="t-desc" x="200" y="40" text-anchor="middle">質量(kg) ÷ 密度(kg/L) ＝ 絶対容積(L)</text>

  <text class="t-sec" x="95" y="66" text-anchor="middle">内訳（5要素）</text>
  <text class="t-sec" x="282" y="66" text-anchor="middle">量を変えると起こること</text>

  <!-- 左：5要素の積み上げ　y=78-468 -->
  <rect class="box-d" x="20" y="78" width="150" height="25"/>
  <text class="t-name" x="95" y="95" text-anchor="middle">空気</text>

  <rect class="box-b" x="20" y="103" width="150" height="70"/>
  <text class="t-name" x="95" y="142" text-anchor="middle">水</text>

  <rect class="box-w" x="20" y="173" width="150" height="50"/>
  <text class="t-name" x="95" y="202" text-anchor="middle">セメント</text>

  <rect class="box-p" x="20" y="223" width="150" height="110"/>
  <text class="t-name" x="95" y="282" text-anchor="middle">細骨材</text>

  <rect class="box-s" x="20" y="333" width="150" height="135"/>
  <text class="t-name" x="95" y="404" text-anchor="middle">粗骨材</text>

  <!-- 右：3つの関係　y=78-468、3ボックス（高さ120・間隔15） -->
  <rect class="box-w" x="185" y="78" width="195" height="120" rx="6"/>
  <text class="t-name" x="200" y="102">水を増やすと</text>
  <line x1="200" y1="110" x2="200" y2="130" stroke="#d4a017" stroke-width="1.5" marker-end="url(#vc-arrow)"/>
  <text class="t-desc" x="200" y="152">スランプ↑</text>
  <text class="t-desc" x="200" y="170">強度↓</text>

  <rect class="box-w" x="185" y="213" width="195" height="120" rx="6"/>
  <text class="t-name" x="200" y="237">セメントを増やすと</text>
  <line x1="200" y1="245" x2="200" y2="265" stroke="#d4a017" stroke-width="1.5" marker-end="url(#vc-arrow)"/>
  <text class="t-desc" x="200" y="287">強度↑</text>
  <text class="t-desc" x="200" y="305">発熱↑</text>

  <rect class="box-w" x="185" y="348" width="195" height="120" rx="6"/>
  <text class="t-name" x="200" y="372">空気を増やすと</text>
  <line x1="200" y1="380" x2="200" y2="400" stroke="#d4a017" stroke-width="1.5" marker-end="url(#vc-arrow)"/>
  <text class="t-desc" x="200" y="422">耐凍害性↑</text>
  <text class="t-desc" x="200" y="440">強度↓</text>
</svg>
