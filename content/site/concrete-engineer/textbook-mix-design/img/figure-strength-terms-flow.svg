<!-- authored 2026-10-16 doboku-note 自作。題材はコンクリート技士教材の強度の語の読み分け。書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="土木の強度の語の流れ。設計者の設計基準強度、購入者の呼び強度、生産者の配合強度、受入れ検査の合否の条件、構造物での設計基準強度に対する確認">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead  { font-size: 12px; fill: #555; }
      .t-title { font-size: 14px; font-weight: bold; fill: #222; }
      .t-head  { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-label { font-size: 12px; fill: #1a3a5c; }
      .t-desc  { font-size: 12px; fill: #555; }
      .t-axis  { font-size: 11px; fill: #555; }
      .t-warn  { font-size: 12px; fill: #b22234; font-weight: bold; }
      .box { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-p { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-d { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .ln { stroke: #555; stroke-width: 1; fill: none; }
      .arr { stroke: #2e6da4; stroke-width: 1.5; fill: none; marker-end: url(#ah); }
      .arr-d { stroke: #b22234; stroke-width: 1.5; fill: none; marker-end: url(#ahd); }
    </style>
    <marker id="ah" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/></marker>
    <marker id="ahd" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#b22234"/></marker>
  </defs>
  <text class="t-lead" x="200" y="18" text-anchor="middle">強度の語は、誰のどの段階の値かで読み分ける</text>
  <rect class="box-b" x="20" y="28" width="360" height="74" rx="6"/>
  <text class="t-title" x="34" y="52">設計基準強度</text>
  <text class="t-desc" x="34" y="72">設計者が構造計算と耐久性から</text>
  <text class="t-desc" x="34" y="90">決め、図面に書く値</text>
  <line x1="200" y1="102" x2="200" y2="114" class="arr"/>
  <rect class="box-b" x="20" y="114" width="360" height="74" rx="6"/>
  <text class="t-title" x="34" y="138">呼び強度</text>
  <text class="t-desc" x="34" y="158">購入者が生産者へ注文する区分</text>
  <text class="t-desc" x="34" y="176">土木では設計基準強度と同じ値が通例</text>
  <line x1="200" y1="188" x2="200" y2="200" class="arr"/>
  <rect class="box-w" x="20" y="200" width="360" height="74" rx="6"/>
  <text class="t-title" x="34" y="224">配合強度</text>
  <text class="t-desc" x="34" y="244">生産者が、呼び強度を下回らないよう</text>
  <text class="t-desc" x="34" y="262">ばらつきを見込んで定める製造の目標</text>
  <line x1="200" y1="274" x2="200" y2="286" class="arr"/>
  <rect class="box-p" x="20" y="286" width="360" height="74" rx="6"/>
  <text class="t-title" x="34" y="310">受入れ検査（荷卸し地点）</text>
  <text class="t-desc" x="34" y="330">呼び強度に対し、1回の試験値が85 %以上</text>
  <text class="t-desc" x="34" y="348">かつ3回平均が呼び強度以上</text>
  <line x1="200" y1="360" x2="200" y2="372" class="arr"/>
  <rect class="box-p" x="20" y="372" width="360" height="74" rx="6"/>
  <text class="t-title" x="34" y="396">構造物の確認</text>
  <text class="t-desc" x="34" y="416">テストハンマーやコアで</text>
  <text class="t-desc" x="34" y="434">設計基準強度に対して確認</text>
  <rect class="box" x="20" y="452" width="360" height="36" rx="6"/>
  <text class="t-label" x="200" y="475" text-anchor="middle">選択肢の主語から、段階を判断する</text>
</svg>
