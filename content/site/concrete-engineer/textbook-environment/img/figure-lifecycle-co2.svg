<!-- authored 2026-09-12 doboku-note 自作。題材はコンクリート技士テキスト「環境」の論点。特定の書籍図の複製・トレースではない -->
<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="コンクリートのライフサイクル7段階の流れに、セメント製造のCO2発生源2種と削減の打ち手（混合セメント・長寿命化・再生骨材）を添えて示す">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-name { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-desc { font-size: 11px; fill: #555; }
      .box-b        { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-positive { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-danger   { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
    </style>
    <marker id="arrowFlow" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#222"/>
    </marker>
  </defs>

  <text class="t-lead" x="200" y="16" text-anchor="middle">ライフサイクル全体でCO2発生源と削減策をとらえる</text>

  <!-- 主要フロー 7段階 -->
  <rect class="box-b" x="20" y="40" width="150" height="44" rx="6"/>
  <text class="t-name" x="95" y="67" text-anchor="middle">原料採取</text>
  <line x1="95" y1="84" x2="95" y2="100" stroke="#222" stroke-width="2" marker-end="url(#arrowFlow)"/>

  <rect class="box-b" x="20" y="100" width="150" height="44" rx="6"/>
  <text class="t-name" x="95" y="127" text-anchor="middle">セメント製造</text>
  <line x1="95" y1="144" x2="95" y2="160" stroke="#222" stroke-width="2" marker-end="url(#arrowFlow)"/>

  <rect class="box-b" x="20" y="160" width="150" height="44" rx="6"/>
  <text class="t-name" x="95" y="187" text-anchor="middle">生コン製造</text>
  <line x1="95" y1="204" x2="95" y2="220" stroke="#222" stroke-width="2" marker-end="url(#arrowFlow)"/>

  <rect class="box-b" x="20" y="220" width="150" height="44" rx="6"/>
  <text class="t-name" x="95" y="247" text-anchor="middle">施工</text>
  <line x1="95" y1="264" x2="95" y2="280" stroke="#222" stroke-width="2" marker-end="url(#arrowFlow)"/>

  <rect class="box-b" x="20" y="280" width="150" height="44" rx="6"/>
  <text class="t-name" x="95" y="307" text-anchor="middle">供用</text>
  <line x1="95" y1="324" x2="95" y2="340" stroke="#222" stroke-width="2" marker-end="url(#arrowFlow)"/>

  <rect class="box-b" x="20" y="340" width="150" height="44" rx="6"/>
  <text class="t-name" x="95" y="367" text-anchor="middle">解体</text>
  <line x1="95" y1="384" x2="95" y2="400" stroke="#222" stroke-width="2" marker-end="url(#arrowFlow)"/>

  <rect class="box-positive" x="20" y="400" width="150" height="44" rx="6"/>
  <text class="t-name" x="95" y="427" text-anchor="middle">再資源化</text>

  <!-- 付帯情報: CO2発生源・削減の打ち手 -->
  <line x1="170" y1="122" x2="185" y2="122" stroke="#8a8a8a" stroke-width="1"/>
  <rect class="box-danger" x="185" y="90" width="195" height="74" rx="6"/>
  <text class="t-name" x="195" y="108">主なCO2発生源</text>
  <text class="t-desc" x="195" y="126">プロセス起源：石灰石の脱炭酸</text>
  <text class="t-desc" x="195" y="144">エネルギー起源：燃料の燃焼</text>

  <line x1="170" y1="182" x2="185" y2="182" stroke="#8a8a8a" stroke-width="1"/>
  <rect class="box-positive" x="185" y="176" width="195" height="54" rx="6"/>
  <text class="t-name" x="195" y="194">削減策1：混合セメント</text>
  <text class="t-desc" x="195" y="212">クリンカー使用量を抑える</text>

  <line x1="170" y1="302" x2="185" y2="302" stroke="#8a8a8a" stroke-width="1"/>
  <rect class="box-positive" x="185" y="266" width="195" height="54" rx="6"/>
  <text class="t-name" x="195" y="284">削減策2：長寿命化</text>
  <text class="t-desc" x="195" y="302">劣化を抑え更新回数を減らす</text>

  <line x1="170" y1="382" x2="185" y2="382" stroke="#8a8a8a" stroke-width="1"/>
  <rect class="box-positive" x="185" y="356" width="195" height="54" rx="6"/>
  <text class="t-name" x="195" y="374">削減策3：再生骨材</text>
  <text class="t-desc" x="195" y="392">解体コンクリートを再利用</text>

  <line x1="20" y1="452" x2="380" y2="452" stroke="#d7d7d7" stroke-width="1"/>
  <text class="t-desc" x="200" y="474" text-anchor="middle">混合セメント・長寿命化・再生骨材で削減する</text>
</svg>
