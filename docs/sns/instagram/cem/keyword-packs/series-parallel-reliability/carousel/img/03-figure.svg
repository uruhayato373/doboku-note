<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500" role="img" aria-label="R03 Ⅰ-1-30 信頼度計算 4ステップ解法">
  <defs><style>text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }</style></defs>
  <rect width="400" height="500" fill="#ffffff"/>

  <!-- ヘッダー -->
  <rect width="400" height="72" fill="#1a3a5c"/>
  <text x="200" y="28" text-anchor="middle" font-size="11" fill="#d4956a">技術士 総監 | R03 Ⅰ−1−30</text>
  <text x="200" y="56" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">計算手順 4ステップ</text>

  <!-- Step 1 -->
  <rect x="16" y="82" width="368" height="64" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <circle cx="44" cy="114" r="16" fill="#1a3a5c"/>
  <text x="44" y="119" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">1</text>
  <text x="70" y="101" font-size="12" font-weight="bold" fill="#1a3a5c">上段（直列）の信頼度を計算</text>
  <text x="70" y="119" font-size="13" fill="#1a3a5c">R上 = R₁ × R₂ = 0.9 × 0.9 = 0.81</text>
  <text x="70" y="137" font-size="11" fill="#888">※ 直列は積なので単独より低下する</text>

  <!-- Step 2 -->
  <rect x="16" y="156" width="368" height="64" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <circle cx="44" cy="188" r="16" fill="#1a3a5c"/>
  <text x="44" y="193" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">2</text>
  <text x="70" y="175" font-size="12" font-weight="bold" fill="#1a3a5c">下段（直列）の信頼度を立式</text>
  <text x="70" y="193" font-size="13" fill="#1a3a5c">R下 = R₃ × R₄ = 0.9 × R₄</text>
  <text x="70" y="211" font-size="11" fill="#888">※ R₄は未知数としてそのまま置く</text>

  <!-- Step 3 -->
  <rect x="16" y="230" width="368" height="78" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <circle cx="44" cy="269" r="16" fill="#1a3a5c"/>
  <text x="44" y="274" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">3</text>
  <text x="70" y="251" font-size="12" font-weight="bold" fill="#1a3a5c">並列合成でシステム全体を立式</text>
  <text x="70" y="269" font-size="12" fill="#1a3a5c">Rs = 1 − (1−0.81)(1−0.9R₄) ≥ 0.9</text>
  <text x="70" y="287" font-size="12" fill="#1a3a5c">→ 0.19 × (1−0.9R₄) ≤ 0.1</text>
  <text x="70" y="301" font-size="11" fill="#888">※ 不信頼度の積を1から引く形で整理</text>

  <!-- Step 4 -->
  <rect x="16" y="318" width="368" height="64" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <circle cx="44" cy="350" r="16" fill="#1a3a5c"/>
  <text x="44" y="355" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">4</text>
  <text x="70" y="337" font-size="12" font-weight="bold" fill="#1a3a5c">R₄の最小値を求める</text>
  <text x="70" y="355" font-size="12" fill="#1a3a5c">1 − 0.9R₄ ≤ 0.526… → R₄ ≥ 0.527</text>
  <text x="70" y="373" font-size="11" fill="#888">選択肢から条件を満たす最小値を選ぶ</text>

  <!-- 正答ボックス -->
  <rect x="16" y="396" width="368" height="48" rx="6" fill="#1a3a5c"/>
  <text x="200" y="415" text-anchor="middle" font-size="13" fill="#d4956a" font-weight="bold">正答 ② R₄ = 0.6</text>
  <text x="200" y="434" text-anchor="middle" font-size="11" fill="#b8d0e8">検証: 1−0.19×(1−0.54) = 0.913 ≥ 0.9 ✓</text>

  <!-- フッター -->
  <rect x="0" y="460" width="400" height="40" fill="#0f2035"/>
  <text x="200" y="485" text-anchor="middle" font-size="12" fill="#6a8faf">doboku-note.com</text>
</svg>
