<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500" role="img" aria-label="OSHMS 試験頻出ポイント3点">
  <defs><style>text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }</style></defs>
  <rect width="400" height="500" fill="#ffffff"/>

  <!-- ヘッダー帯 -->
  <rect x="0" y="0" width="400" height="52" fill="#1a3a5c"/>
  <text x="200" y="18" text-anchor="middle" font-size="10" fill="#a36b2c">技術士 総監 | 安全管理</text>
  <text x="200" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">OSHMS 試験頻出ポイント</text>

  <!-- Point 1 -->
  <circle cx="34" cy="92" r="16" fill="#1a3a5c"/>
  <text x="34" y="97" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">1</text>
  <text x="60" y="84" font-size="13" font-weight="bold" fill="#1a3a5c">法定管理体制は「最低基準」</text>
  <text x="60" y="102" font-size="12" fill="#555">労働安全衛生法が定める義務、</text>
  <text x="60" y="118" font-size="12" fill="#555">OSHMSはその上に積む自主的改善層</text>

  <line x1="20" y1="138" x2="380" y2="138" stroke="#e8f0fe" stroke-width="1"/>

  <!-- Point 2 -->
  <circle cx="34" cy="168" r="16" fill="#1a3a5c"/>
  <text x="34" y="173" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">2</text>
  <text x="60" y="160" font-size="13" font-weight="bold" fill="#1a3a5c">OSHMS指針とISO 45001は併存可</text>
  <text x="60" y="178" font-size="12" fill="#555">PDCAサイクルとリスクアセスメントの</text>
  <text x="60" y="194" font-size="12" fill="#555">考え方は両規格で共通</text>

  <line x1="20" y1="214" x2="380" y2="214" stroke="#e8f0fe" stroke-width="1"/>

  <!-- Point 3 -->
  <circle cx="34" cy="244" r="16" fill="#1a3a5c"/>
  <text x="34" y="249" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">3</text>
  <text x="60" y="236" font-size="13" font-weight="bold" fill="#1a3a5c">3管理が労働衛生の中核</text>
  <text x="60" y="254" font-size="12" fill="#555">作業環境管理・作業管理・健康管理の</text>
  <text x="60" y="270" font-size="12" fill="#555">3管理が伝統的な分類軸として現在も中核</text>

  <!-- 注意 Callout -->
  <rect x="20" y="296" width="360" height="86" rx="6" fill="#fce8d0"/>
  <rect x="20" y="296" width="5" height="86" rx="2" fill="#a36b2c"/>
  <text x="36" y="318" font-size="12" font-weight="bold" fill="#a36b2c">引っかけ注意</text>
  <text x="36" y="338" font-size="11" fill="#555">OSHMS指針（1999年・厚労省）は行政指針で</text>
  <text x="36" y="356" font-size="11" fill="#555">任意。ISO 45001（2018年・ISO）は国際規格</text>
  <text x="36" y="374" font-size="11" fill="#555">で第三者認証が可能。「同じもの」ではない。</text>

  <!-- フッター -->
  <rect x="0" y="460" width="400" height="40" fill="#1a3a5c"/>
  <text x="200" y="485" text-anchor="middle" font-size="12" fill="#6a8faf">doboku-note.com</text>
</svg>
