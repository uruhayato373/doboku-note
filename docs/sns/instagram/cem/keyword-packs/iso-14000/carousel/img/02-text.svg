<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500" role="img" aria-label="ISO 14001 試験頻出ポイント3点">
  <defs><style>text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }</style></defs>
  <rect width="400" height="500" fill="#ffffff"/>

  <!-- ヘッダー帯 -->
  <rect x="0" y="0" width="400" height="52" fill="#1a3a5c"/>
  <text x="200" y="18" text-anchor="middle" font-size="10" fill="#a36b2c">技術士 総監 | 社会環境管理</text>
  <text x="200" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">ISO 14001 試験頻出ポイント</text>

  <!-- Point 1 -->
  <circle cx="34" cy="92" r="16" fill="#1a3a5c"/>
  <text x="34" y="97" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">1</text>
  <text x="60" y="84" font-size="13" font-weight="bold" fill="#1a3a5c">法令義務ではなく自主的取組</text>
  <text x="60" y="102" font-size="12" fill="#555">ISO 14001は法令遵守手続き管理ではない</text>
  <text x="60" y="118" font-size="12" fill="#555">（R1・R6で繰り返し出題）</text>

  <line x1="20" y1="138" x2="380" y2="138" stroke="#e8f0fe" stroke-width="1"/>

  <!-- Point 2 -->
  <circle cx="34" cy="168" r="16" fill="#1a3a5c"/>
  <text x="34" y="173" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">2</text>
  <text x="60" y="160" font-size="13" font-weight="bold" fill="#1a3a5c">排出基準を定めない「枠組み規格」</text>
  <text x="60" y="178" font-size="12" fill="#555">具体的な数値目標は各組織が自ら設定。</text>
  <text x="60" y="194" font-size="12" fill="#555">ISO 9001・45001と同じ HLS 構造</text>

  <line x1="20" y1="214" x2="380" y2="214" stroke="#e8f0fe" stroke-width="1"/>

  <!-- Point 3 -->
  <circle cx="34" cy="244" r="16" fill="#1a3a5c"/>
  <text x="34" y="249" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">3</text>
  <text x="60" y="236" font-size="13" font-weight="bold" fill="#1a3a5c">ISO 26000は認証を伴わない</text>
  <text x="60" y="254" font-size="12" fill="#555">社会的責任のガイダンス規格。</text>
  <text x="60" y="270" font-size="12" fill="#555">JIS Z 26000（R2出題）</text>

  <!-- 注意 Callout -->
  <rect x="20" y="296" width="360" height="86" rx="6" fill="#fce8d0"/>
  <rect x="20" y="296" width="5" height="86" rx="2" fill="#a36b2c"/>
  <text x="36" y="318" font-size="12" font-weight="bold" fill="#a36b2c">引っかけ注意</text>
  <text x="36" y="338" font-size="11" fill="#555">「EMS＝法令遵守手続き管理」は誤り。</text>
  <text x="36" y="356" font-size="11" fill="#555">エコバランス（LCA）はISO/JIS化されておらず</text>
  <text x="36" y="374" font-size="11" fill="#555">エコアクション21は中小事業者向け（H28）。</text>

  <!-- フッター -->
  <rect x="0" y="460" width="400" height="40" fill="#1a3a5c"/>
  <text x="200" y="485" text-anchor="middle" font-size="12" fill="#6a8faf">doboku-note.com</text>
</svg>
