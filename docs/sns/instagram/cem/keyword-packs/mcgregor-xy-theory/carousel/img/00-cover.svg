<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500" role="img" aria-label="技術士総監 人的資源管理 X理論とY理論 表紙">
  <defs>
    <style>text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }</style>
  </defs>

  <!-- 背景 -->
  <rect width="400" height="500" fill="#1a3a5c"/>

  <!-- 上部アクセントライン -->
  <rect x="0" y="0" width="400" height="5" fill="#a36b2c"/>

  <!-- 資格バッジ（塗り） -->
  <rect x="24" y="20" width="110" height="26" rx="13" fill="#a36b2c"/>
  <text x="79" y="37" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">技術士 総監</text>

  <!-- 管理区分バッジ（枠） -->
  <rect x="144" y="20" width="124" height="26" rx="13" fill="none" stroke="#a36b2c" stroke-width="1.5"/>
  <text x="206" y="37" text-anchor="middle" font-size="11" fill="#d4956a">人的資源管理</text>

  <!-- メインタイトル X理論 -->
  <text x="200" y="162" text-anchor="middle" font-size="68" font-weight="bold" fill="#ffffff">X理論</text>

  <!-- vs 装飾ライン -->
  <line x1="72" y1="192" x2="152" y2="192" stroke="#a36b2c" stroke-width="1.5"/>
  <text x="200" y="200" text-anchor="middle" font-size="22" font-weight="bold" fill="#a36b2c">vs</text>
  <line x1="248" y1="192" x2="328" y2="192" stroke="#a36b2c" stroke-width="1.5"/>

  <!-- メインタイトル Y理論 -->
  <text x="200" y="274" text-anchor="middle" font-size="68" font-weight="bold" fill="#ffffff">Y理論</text>

  <!-- 区切り線 -->
  <rect x="40" y="300" width="320" height="1.5" fill="#a36b2c" opacity="0.5"/>

  <!-- サブコピー -->
  <text x="200" y="330" text-anchor="middle" font-size="13" fill="#b8d0e8">管理者の人間観が組織運営を決める</text>

  <!-- 頻出バッジ -->
  <rect x="104" y="356" width="192" height="40" rx="20" fill="#a36b2c"/>
  <text x="200" y="381" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">択一 頻出テーマ</text>

  <!-- スワイプ促進 -->
  <text x="200" y="428" text-anchor="middle" font-size="12" fill="#6a8faf">スワイプして図解を確認 ▶</text>

  <!-- フッター -->
  <rect x="0" y="460" width="400" height="40" fill="#0f2035"/>
  <text x="200" y="485" text-anchor="middle" font-size="12" fill="#6a8faf">doboku-note.com</text>
</svg>
