<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500" style="max-width:400px;width:100%" role="img" aria-label="労働災害の3統計指標の比較。度数率は死傷者数を延べ実労働時間で割り100万を乗じた発生頻度（時間ベース）、強度率は延べ労働損失日数を延べ実労働時間で割り1000を乗じた災害の重さ（時間ベース）、年千人率は年間死傷者数を平均労働者数で割り1000を乗じた発生率（人数ベース）。死亡時の労働損失日数は7500日で計算する。">
  <rect width="400" height="500" fill="#ffffff"/>
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-sub   { font-size: 11px; fill: #8a8a8a; }
      .t-head  { font-size: 16px; font-weight: bold; fill: #1a3a5c; }
      .t-name  { font-size: 16px; font-weight: bold; }
      .t-meas  { font-size: 12px; fill: #555; }
      .t-frac  { font-size: 12px; fill: #1a3a5c; }
      .t-mul   { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-pill  { font-size: 11px; font-weight: bold; }
      .t-foot  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-note  { font-size: 11px; fill: #8a8a8a; }
    </style>
  </defs>

  <text class="t-head" x="200" y="40" text-anchor="middle">労働災害の3統計指標</text>

  <!-- 度数率（brand=青・時間ベース） -->
  <rect x="16" y="56" width="368" height="116" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text class="t-name" x="34" y="88" fill="#2e6da4">度数率</text>
  <text class="t-meas" x="96" y="88">発生頻度</text>
  <rect x="296" y="68" width="80" height="24" rx="12" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
  <text class="t-pill" x="336" y="84" text-anchor="middle" fill="#2e6da4">時間ベース</text>
  <text class="t-frac" x="150" y="120" text-anchor="middle">死傷者数</text>
  <line x1="96" y1="128" x2="204" y2="128" stroke="#555" stroke-width="1"/>
  <text class="t-frac" x="150" y="146" text-anchor="middle">延べ実労働時間数</text>
  <text class="t-mul" x="216" y="133">× 1,000,000</text>

  <!-- 強度率（warn=黄・時間ベース） -->
  <rect x="16" y="176" width="368" height="116" rx="8" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text class="t-name" x="34" y="208" fill="#d4a017">強度率</text>
  <text class="t-meas" x="96" y="208">重さ（程度）</text>
  <rect x="296" y="188" width="80" height="24" rx="12" fill="#ffffff" stroke="#d4a017" stroke-width="1.5"/>
  <text class="t-pill" x="336" y="204" text-anchor="middle" fill="#d4a017">時間ベース</text>
  <text class="t-frac" x="150" y="240" text-anchor="middle">延べ労働損失日数</text>
  <line x1="96" y1="248" x2="204" y2="248" stroke="#555" stroke-width="1"/>
  <text class="t-frac" x="150" y="266" text-anchor="middle">延べ実労働時間数</text>
  <text class="t-mul" x="216" y="253">× 1,000</text>

  <!-- 年千人率（positive=緑・人数ベース） -->
  <rect x="16" y="296" width="368" height="116" rx="8" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
  <text class="t-name" x="34" y="328" fill="#3a7d44">年千人率</text>
  <text class="t-meas" x="104" y="328">発生率</text>
  <rect x="296" y="308" width="80" height="24" rx="12" fill="#ffffff" stroke="#3a7d44" stroke-width="1.5"/>
  <text class="t-pill" x="336" y="324" text-anchor="middle" fill="#3a7d44">人数ベース</text>
  <text class="t-frac" x="150" y="360" text-anchor="middle">年間死傷者数</text>
  <line x1="100" y1="368" x2="200" y2="368" stroke="#555" stroke-width="1"/>
  <text class="t-frac" x="150" y="386" text-anchor="middle">平均労働者数</text>
  <text class="t-mul" x="216" y="373">× 1,000</text>

  <!-- まとめ -->
  <rect x="16" y="418" width="368" height="68" rx="8" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text class="t-foot" x="200" y="444" text-anchor="middle">度数率・強度率＝労働時間ベース／年千人率＝労働者数ベース</text>
  <text class="t-note" x="200" y="468" text-anchor="middle">死亡時の労働損失日数は 7,500 日として計算する</text>
</svg>
