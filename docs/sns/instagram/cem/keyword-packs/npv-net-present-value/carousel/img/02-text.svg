<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500" role="img" aria-label="NPV 試験での出題ポイント">
  <defs><style>text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }</style></defs>
  <rect width="400" height="500" fill="#ffffff"/>
  <rect x="0" y="0" width="400" height="88" fill="#1a3a5c"/>
  <rect x="0" y="0" width="400" height="5" fill="#a36b2c"/>
  <text x="24" y="38" font-size="10" font-weight="bold" fill="#d4956a">技術士 総監 | 経済性管理</text>
  <text x="24" y="64" font-size="16" font-weight="bold" fill="#ffffff">試験での出題ポイント</text>

  <circle cx="44" cy="128" r="14" fill="#1a3a5c"/>
  <text x="44" y="133" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">1</text>
  <text x="72" y="123" font-size="14" font-weight="bold" fill="#1a3a5c">NPVの定義</text>
  <text x="72" y="142" font-size="11" fill="#4a5a6a">将来CFの現在価値合計 − 投資額。</text>
  <text x="72" y="158" font-size="11" fill="#4a5a6a">NPV&gt;0 なら投資価値あり。</text>
  <rect x="24" y="174" width="352" height="1" fill="#d8e0e8"/>

  <circle cx="44" cy="208" r="14" fill="#1a3a5c"/>
  <text x="44" y="213" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">2</text>
  <text x="72" y="203" font-size="14" font-weight="bold" fill="#1a3a5c">割引のしくみ</text>
  <text x="72" y="222" font-size="11" fill="#4a5a6a">先の年ほど 1/(1+r)^n で下がる。</text>
  <text x="72" y="238" font-size="11" fill="#4a5a6a">割引率が高いほどNPVは低下。</text>
  <rect x="24" y="254" width="352" height="1" fill="#d8e0e8"/>

  <circle cx="44" cy="288" r="14" fill="#1a3a5c"/>
  <text x="44" y="293" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">3</text>
  <text x="72" y="283" font-size="14" font-weight="bold" fill="#1a3a5c">追加投資の判断</text>
  <text x="72" y="302" font-size="11" fill="#4a5a6a">増分収益の現在価値 ≥</text>
  <text x="72" y="318" font-size="11" fill="#4a5a6a">追加投資の現在価値 なら可。</text>

  <rect x="24" y="338" width="352" height="76" rx="6" fill="#fce8d0"/>
  <rect x="24" y="338" width="5" height="76" rx="2.5" fill="#a36b2c"/>
  <text x="44" y="364" font-size="12" font-weight="bold" fill="#5e3d18">試験の注意ポイント</text>
  <text x="44" y="385" font-size="11" fill="#5e3d18">「○年目の年初」は前年の年末(t)</text>
  <text x="44" y="401" font-size="11" fill="#5e3d18">として割り引く。時点の取り違えに注意。</text>

  <rect x="0" y="460" width="400" height="40" fill="#0f2035"/>
  <text x="200" y="485" text-anchor="middle" font-size="12" fill="#6a8faf">doboku-note.com</text>
</svg>
