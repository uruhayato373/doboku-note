<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500" role="img" aria-label="環境アセス 頻出ポイント">
  <defs><style>text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }</style></defs>
  <rect width="400" height="500" fill="#ffffff"/>
  <rect x="0" y="0" width="400" height="52" fill="#1a3a5c"/>
  <text x="200" y="18" text-anchor="middle" font-size="10" fill="#a36b2c">技術士 総監 | 社会環境管理</text>
  <text x="200" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">環境アセスメント 頻出ポイント</text>
  <circle cx="34" cy="92" r="16" fill="#1a3a5c"/>
  <text x="34" y="97" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">1</text>
  <text x="60" y="84" font-size="13" font-weight="bold" fill="#1a3a5c">第一種＝規模問わず必須</text>
  <text x="60" y="102" font-size="12" fill="#555">高速自動車国道・新幹線・原子力発電所。</text>
  <text x="60" y="118" font-size="12" fill="#555">配慮書（計画段階の環境配慮）も義務</text>
  <line x1="20" y1="138" x2="380" y2="138" stroke="#e8f0fe" stroke-width="1"/>
  <circle cx="34" cy="168" r="16" fill="#1a3a5c"/>
  <text x="34" y="173" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">2</text>
  <text x="60" y="160" font-size="13" font-weight="bold" fill="#1a3a5c">第二種＝規模次第（スクリーニング）</text>
  <text x="60" y="178" font-size="12" fill="#555">規模に応じて実施要否を判定する。</text>
  <text x="60" y="194" font-size="12" fill="#555">例：林道・風力発電所</text>
  <line x1="20" y1="214" x2="380" y2="214" stroke="#e8f0fe" stroke-width="1"/>
  <circle cx="34" cy="244" r="16" fill="#1a3a5c"/>
  <text x="34" y="249" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">3</text>
  <text x="60" y="236" font-size="13" font-weight="bold" fill="#1a3a5c">対象外の事業もある</text>
  <text x="60" y="254" font-size="12" fill="#555">例：下水処理場・堤防・ゴルフ場は</text>
  <text x="60" y="270" font-size="12" fill="#555">環境影響評価の対象外</text>
  <rect x="20" y="296" width="360" height="86" rx="6" fill="#fce8d0"/>
  <rect x="20" y="296" width="5" height="86" rx="2" fill="#a36b2c"/>
  <text x="36" y="318" font-size="12" font-weight="bold" fill="#a36b2c">引っかけ注意（R3 Ⅰ-1-39）</text>
  <text x="36" y="338" font-size="11" fill="#555">太陽光発電は2020年以降アセス対象（対象外でない）。</text>
  <text x="36" y="356" font-size="11" fill="#555">放水路・廃棄物最終処分場は対象に含まれる。</text>
  <text x="36" y="374" font-size="11" fill="#555">スクリーニング（要否）とスコーピング（手法）を区別。</text>
  <rect x="0" y="460" width="400" height="40" fill="#1a3a5c"/>
  <text x="200" y="485" text-anchor="middle" font-size="12" fill="#6a8faf">doboku-note.com</text>
</svg>
