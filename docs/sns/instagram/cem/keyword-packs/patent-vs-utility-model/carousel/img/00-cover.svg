<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500" role="img" aria-label="技術士総監 情報管理 特許権と実用新案権の違い 表紙">
  <defs><style>text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }</style></defs>
  <rect width="400" height="500" fill="#1a3a5c"/>
  <rect x="0" y="0" width="400" height="5" fill="#a36b2c"/>

  <rect x="24" y="20" width="110" height="26" rx="13" fill="#a36b2c"/>
  <text x="79" y="37" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">技術士 総監</text>
  <rect x="144" y="20" width="124" height="26" rx="13" fill="none" stroke="#a36b2c" stroke-width="1.5"/>
  <text x="206" y="37" text-anchor="middle" font-size="11" fill="#d4956a">情報管理</text>

  <!-- メインタイトル（vs 型） -->
  <text x="200" y="160" text-anchor="middle" font-size="48" font-weight="bold" fill="#ffffff">特許権</text>
  <line x1="72" y1="192" x2="152" y2="192" stroke="#a36b2c" stroke-width="1.5"/>
  <text x="200" y="200" text-anchor="middle" font-size="22" font-weight="bold" fill="#a36b2c">vs</text>
  <line x1="248" y1="192" x2="328" y2="192" stroke="#a36b2c" stroke-width="1.5"/>
  <text x="200" y="256" text-anchor="middle" font-size="44" font-weight="bold" fill="#ffffff">実用新案権</text>

  <rect x="40" y="284" width="320" height="1.5" fill="#a36b2c" opacity="0.5"/>

  <text x="200" y="318" text-anchor="middle" font-size="14" fill="#b8d0e8">保護対象・審査・存続期間など</text>
  <text x="200" y="342" text-anchor="middle" font-size="14" fill="#b8d0e8">5つの軸で違いを整理</text>

  <rect x="104" y="368" width="192" height="40" rx="20" fill="#a36b2c"/>
  <text x="200" y="393" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">択一 頻出テーマ</text>

  <text x="200" y="438" text-anchor="middle" font-size="12" fill="#6a8faf">スワイプして図解を確認 ▶</text>

  <rect x="0" y="460" width="400" height="40" fill="#0f2035"/>
  <text x="200" y="485" text-anchor="middle" font-size="12" fill="#6a8faf">doboku-note.com</text>
</svg>
