<svg width="400" height="500" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
     style="max-width:400px;width:100%" role="img"
     aria-label="アジャイル開発の反復サイクル。計画・開発・テスト・レビューの短いイテレーションを繰り返し、反復ごとに動作するソフトウェアを提供する。">
  <rect width="400" height="500" fill="#ffffff"/>
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-node  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-ctr   { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-ctrs  { font-size: 11px; fill: #555; }
      .t-cap   { font-size: 11px; fill: #555; }
      .box-brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-note  { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1; }
    </style>
    <marker id="ag-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto">
      <polygon points="0,0 10,4.5 0,9" fill="#2e6da4"/>
    </marker>
  </defs>

  <!-- 循環矢印（中心200,160） -->
  <path d="M 260 70 C 308 80 338 102 352 134" fill="none" stroke="#2e6da4" stroke-width="2" marker-end="url(#ag-arrow)"/>
  <path d="M 352 190 C 338 220 308 242 266 252" fill="none" stroke="#2e6da4" stroke-width="2" marker-end="url(#ag-arrow)"/>
  <path d="M 136 254 C 94 244 64 222 48 190" fill="none" stroke="#2e6da4" stroke-width="2" marker-end="url(#ag-arrow)"/>
  <path d="M 48 134 C 64 102 94 80 140 70" fill="none" stroke="#2e6da4" stroke-width="2" marker-end="url(#ag-arrow)"/>

  <!-- 中央ラベル -->
  <text class="t-ctr"  x="200" y="150" text-anchor="middle">イテレーション</text>
  <text class="t-ctrs" x="200" y="170" text-anchor="middle">＝ スプリント</text>
  <text class="t-ctrs" x="200" y="189" text-anchor="middle">（1〜4 週間）</text>

  <!-- ノード（中心200,160） -->
  <rect class="box-brand" x="146" y="38" width="108" height="42" rx="8"/>
  <text class="t-node" x="200" y="64" text-anchor="middle">① 計画</text>

  <rect class="box-brand" x="272" y="134" width="110" height="42" rx="8"/>
  <text class="t-node" x="327" y="160" text-anchor="middle">② 開発・実装</text>

  <rect class="box-brand" x="146" y="230" width="108" height="42" rx="8"/>
  <text class="t-node" x="200" y="256" text-anchor="middle">③ テスト</text>

  <rect class="box-brand" x="18" y="134" width="110" height="42" rx="8"/>
  <text class="t-node" x="73" y="160" text-anchor="middle">④ レビュー</text>

  <!-- キャプション -->
  <text class="t-cap" x="200" y="298" text-anchor="middle">反復ごとに動作するソフトウェアを提供し、要件の変化に対応する</text>

  <!-- ウォーターフォールとの対比ボックス -->
  <rect x="15" y="312" width="370" height="156" rx="6" class="box-note"/>
  <text x="200" y="332" font-size="12" fill="#1a3a5c" text-anchor="middle" font-weight="bold">アジャイル vs ウォーターフォール</text>
  <line x1="15" y1="339" x2="385" y2="339" stroke="#d7d7d7" stroke-width="1"/>
  <!-- 列見出し -->
  <line x1="200" y1="339" x2="200" y2="466" stroke="#d7d7d7" stroke-width="1"/>
  <text x="107" y="358" font-size="11" fill="#555" text-anchor="middle">アジャイル</text>
  <text x="292" y="358" font-size="11" fill="#555" text-anchor="middle">ウォーターフォール</text>
  <line x1="15" y1="363" x2="385" y2="363" stroke="#d7d7d7" stroke-width="0.5"/>
  <!-- 行1 -->
  <text x="107" y="380" font-size="11" fill="#222" text-anchor="middle">短期反復で逐次改善</text>
  <text x="292" y="380" font-size="11" fill="#222" text-anchor="middle">工程を順次一括実施</text>
  <!-- 行2 -->
  <text x="107" y="400" font-size="11" fill="#222" text-anchor="middle">要件変更に柔軟対応</text>
  <text x="292" y="400" font-size="11" fill="#222" text-anchor="middle">要件を事前固定</text>
  <!-- 行3 -->
  <text x="107" y="420" font-size="11" fill="#222" text-anchor="middle">動くものを早期提供</text>
  <text x="292" y="420" font-size="11" fill="#222" text-anchor="middle">最終納品まで不可視</text>
  <!-- 行4 -->
  <text x="107" y="440" font-size="11" fill="#b22234" text-anchor="middle">不確実な要件に有効</text>
  <text x="292" y="440" font-size="11" fill="#555" text-anchor="middle">要件確定済みに有効</text>
  <line x1="15" y1="447" x2="385" y2="447" stroke="#d7d7d7" stroke-width="0.5"/>
  <text x="107" y="462" font-size="11" fill="#222" text-anchor="middle">現場主導・チーム権限</text>
  <text x="292" y="462" font-size="11" fill="#222" text-anchor="middle">計画主導・承認プロセス</text>
</svg>
