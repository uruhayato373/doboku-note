<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500" role="img" aria-label="エネルギー白書 頻出ポイント">
  <defs><style>text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }</style></defs>
  <rect width="400" height="500" fill="#ffffff"/>
  <rect x="0" y="0" width="400" height="52" fill="#1a3a5c"/>
  <text x="200" y="18" text-anchor="middle" font-size="10" fill="#a36b2c">技術士 総監 | 社会環境管理</text>
  <text x="200" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">エネルギー白書 頻出ポイント</text>
  <circle cx="34" cy="92" r="16" fill="#1a3a5c"/>
  <text x="34" y="97" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">1</text>
  <text x="60" y="84" font-size="13" font-weight="bold" fill="#1a3a5c">2030年度電源構成（第6次）</text>
  <text x="60" y="102" font-size="12" fill="#555">再エネ 36〜38%・原子力 20〜22%・</text>
  <text x="60" y="118" font-size="12" fill="#555">火力（LNG＋石炭＋石油）合計 約41%</text>
  <line x1="20" y1="138" x2="380" y2="138" stroke="#e8f0fe" stroke-width="1"/>
  <circle cx="34" cy="168" r="16" fill="#1a3a5c"/>
  <text x="34" y="173" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">2</text>
  <text x="60" y="160" font-size="13" font-weight="bold" fill="#1a3a5c">自給率は約13%、化石依存は高い</text>
  <text x="60" y="178" font-size="12" fill="#555">エネルギー自給率 13.3%（2020年度）／</text>
  <text x="60" y="194" font-size="12" fill="#555">化石依存度 88.9%・原油の中東依存 約93%</text>
  <line x1="20" y1="214" x2="380" y2="214" stroke="#e8f0fe" stroke-width="1"/>
  <circle cx="34" cy="244" r="16" fill="#1a3a5c"/>
  <text x="34" y="249" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">3</text>
  <text x="60" y="236" font-size="13" font-weight="bold" fill="#1a3a5c">計画ごとに再エネ比率↑</text>
  <text x="60" y="254" font-size="12" fill="#555">第5次 22〜24%→第6次 36〜38%→</text>
  <text x="60" y="270" font-size="12" fill="#555">第7次は2040年度に4割程度を目指す</text>
  <rect x="20" y="296" width="360" height="86" rx="6" fill="#fce8d0"/>
  <rect x="20" y="296" width="5" height="86" rx="2" fill="#a36b2c"/>
  <text x="36" y="318" font-size="12" font-weight="bold" fill="#a36b2c">引っかけ注意（R3・R5）</text>
  <text x="36" y="338" font-size="11" fill="#555">R5：2030年度の原子力「6%」は誤り（正20〜22%）。</text>
  <text x="36" y="356" font-size="11" fill="#555">R3：自給率は概ね1割（13.3%）。GDP当たり</text>
  <text x="36" y="374" font-size="11" fill="#555">エネ消費はOECD平均を下回る（省エネ進展）。</text>
  <rect x="0" y="460" width="400" height="40" fill="#1a3a5c"/>
  <text x="200" y="485" text-anchor="middle" font-size="12" fill="#6a8faf">doboku-note.com</text>
</svg>
