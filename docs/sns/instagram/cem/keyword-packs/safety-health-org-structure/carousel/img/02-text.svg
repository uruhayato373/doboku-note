<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500" role="img" aria-label="安全衛生管理体制 頻出ポイント">
  <defs><style>text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }</style></defs>
  <rect width="400" height="500" fill="#ffffff"/>
  <rect x="0" y="0" width="400" height="52" fill="#1a3a5c"/>
  <text x="200" y="18" text-anchor="middle" font-size="10" fill="#a36b2c">技術士 総監 | 安全管理</text>
  <text x="200" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">安全衛生管理体制 頻出ポイント</text>
  <circle cx="34" cy="92" r="16" fill="#1a3a5c"/>
  <text x="34" y="97" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">1</text>
  <text x="60" y="84" font-size="13" font-weight="bold" fill="#1a3a5c">50人以上で3管理者＋産業医</text>
  <text x="60" y="102" font-size="12" fill="#555">安全管理者（特定業種）・衛生管理者（全業種）・</text>
  <text x="60" y="118" font-size="12" fill="#555">産業医（全業種）を常時50人以上で選任</text>
  <line x1="20" y1="138" x2="380" y2="138" stroke="#e8f0fe" stroke-width="1"/>
  <circle cx="34" cy="168" r="16" fill="#1a3a5c"/>
  <text x="34" y="173" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">2</text>
  <text x="60" y="160" font-size="13" font-weight="bold" fill="#1a3a5c">規模で段階的に選任</text>
  <text x="60" y="178" font-size="12" fill="#555">100人〜（特定業種）で総括安全衛生管理者、</text>
  <text x="60" y="194" font-size="12" fill="#555">10〜49人は安全衛生推進者を選任</text>
  <line x1="20" y1="214" x2="380" y2="214" stroke="#e8f0fe" stroke-width="1"/>
  <circle cx="34" cy="244" r="16" fill="#1a3a5c"/>
  <text x="34" y="249" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">3</text>
  <text x="60" y="236" font-size="13" font-weight="bold" fill="#1a3a5c">建設業の元請は統括が必要</text>
  <text x="60" y="254" font-size="12" fill="#555">関係請負人を含め常時50人以上の現場で</text>
  <text x="60" y="270" font-size="12" fill="#555">統括安全衛生責任者を選任する</text>
  <rect x="20" y="296" width="360" height="86" rx="6" fill="#fce8d0"/>
  <rect x="20" y="296" width="5" height="86" rx="2" fill="#a36b2c"/>
  <text x="36" y="318" font-size="12" font-weight="bold" fill="#a36b2c">引っかけ注意（R3 Ⅰ-1-28）</text>
  <text x="36" y="338" font-size="11" fill="#555">衛生管理者・産業医は業種を問わず50人以上で選任。</text>
  <text x="36" y="356" font-size="11" fill="#555">安全管理者・総括は特定業種（建設・製造等）が対象。</text>
  <text x="36" y="374" font-size="11" fill="#555">「全業種か特定業種か」を取り違えないこと。</text>
  <rect x="0" y="460" width="400" height="40" fill="#1a3a5c"/>
  <text x="200" y="485" text-anchor="middle" font-size="12" fill="#6a8faf">doboku-note.com</text>
</svg>
