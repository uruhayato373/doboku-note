<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" width="400" height="500" role="img" aria-label="FIT・FIP制度の比較。FITは2012年導入・固定価格で全量買取・市場連動なし。FIPは2022年導入・市場価格＋プレミアム加算・市場連動あり。大規模電源はFIPへ移行。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-title { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-sec   { font-size: 11px; font-weight: bold; fill: #ffffff; }
      .t-hd    { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .t-cell  { font-size: 11px; fill: #555; }
      .t-sub   { font-size: 11px; fill: #555; }
      .t-foot  { font-size: 11px; fill: #8a8a8a; }
    </style>
  </defs>
  <rect width="400" height="500" fill="#ffffff"/>

  <!-- タイトル -->
  <text class="t-title" x="200" y="22" text-anchor="middle">FIT・FIP制度の比較</text>
  <line x1="20" y1="30" x2="380" y2="30" stroke="#d7d7d7" stroke-width="1"/>

  <!-- セクションバー -->
  <rect x="8" y="34" width="384" height="18" rx="3" fill="#d4a017"/>
  <text class="t-sec" x="200" y="47" text-anchor="middle">制度比較（固定価格買取 vs プレミアム）</text>

  <!-- ── 比較テーブル ── -->
  <!-- Header row (y=58-82, 24px) -->
  <rect x="8"   y="58" width="80"  height="24" fill="#2e6da4"/>
  <rect x="88"  y="58" width="152" height="24" fill="#2e6da4"/>
  <rect x="240" y="58" width="152" height="24" fill="#2e6da4"/>
  <text x="48"  y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">項目</text>
  <text x="164" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">FIT（固定価格買取）</text>
  <text x="316" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">FIP（プレミアム）</text>

  <!-- Row 1: 導入年 (y=82-120, 38px — 2行に分割) -->
  <rect x="8"   y="82" width="80"  height="38" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="0.5"/>
  <rect x="88"  y="82" width="152" height="38" fill="#ffffff"  stroke="#d7d7d7" stroke-width="0.5"/>
  <rect x="240" y="82" width="152" height="38" fill="#ffffff"  stroke="#d7d7d7" stroke-width="0.5"/>
  <text class="t-hd"   x="48"  y="105" text-anchor="middle">導入</text>
  <text class="t-cell" x="164" y="96"  text-anchor="middle">2012 年</text>
  <text class="t-cell" x="164" y="112" text-anchor="middle">（再エネ特措法施行）</text>
  <text class="t-cell" x="316" y="96"  text-anchor="middle">2022 年</text>
  <text class="t-cell" x="316" y="112" text-anchor="middle">（改正再エネ特措法）</text>

  <!-- Row 2: 買取方式 (y=120-164, 44px) -->
  <rect x="8"   y="120" width="80"  height="44" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="0.5"/>
  <rect x="88"  y="120" width="152" height="44" fill="#e8f0fe" stroke="#d7d7d7" stroke-width="0.5"/>
  <rect x="240" y="120" width="152" height="44" fill="#e8f0fe" stroke="#d7d7d7" stroke-width="0.5"/>
  <text class="t-hd"   x="48"  y="146" text-anchor="middle">方式</text>
  <text class="t-cell" x="164" y="134" text-anchor="middle">電力会社が</text>
  <text class="t-cell" x="164" y="150" text-anchor="middle">固定価格で全量買取</text>
  <text class="t-cell" x="316" y="134" text-anchor="middle">市場価格に</text>
  <text class="t-cell" x="316" y="150" text-anchor="middle">プレミアム（交付金）加算</text>

  <!-- Row 3: 価格 (y=164-202, 38px) -->
  <rect x="8"   y="164" width="80"  height="38" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="0.5"/>
  <rect x="88"  y="164" width="152" height="38" fill="#ffffff"  stroke="#d7d7d7" stroke-width="0.5"/>
  <rect x="240" y="164" width="152" height="38" fill="#ffffff"  stroke="#d7d7d7" stroke-width="0.5"/>
  <text class="t-hd"   x="48"  y="187" text-anchor="middle">価格</text>
  <text class="t-cell" x="164" y="178" text-anchor="middle">固定（需給に無関係）</text>
  <text class="t-cell" x="164" y="194" text-anchor="middle">予見性が高い</text>
  <text class="t-cell" x="316" y="178" text-anchor="middle">変動（市場連動）</text>
  <text class="t-cell" x="316" y="194" text-anchor="middle">需給状況に応じて変化</text>

  <!-- Row 4: 市場参加 (y=202-240, 38px) -->
  <rect x="8"   y="202" width="80"  height="38" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="0.5"/>
  <rect x="88"  y="202" width="152" height="38" fill="#e8f0fe" stroke="#d7d7d7" stroke-width="0.5"/>
  <rect x="240" y="202" width="152" height="38" fill="#e8f0fe" stroke="#d7d7d7" stroke-width="0.5"/>
  <text class="t-hd"   x="48"  y="225" text-anchor="middle">市場</text>
  <text class="t-cell" x="164" y="216" text-anchor="middle">市場参加不要</text>
  <text class="t-cell" x="164" y="232" text-anchor="middle">（電力会社が買取義務）</text>
  <text class="t-cell" x="316" y="216" text-anchor="middle">市場参加が必要</text>
  <text class="t-cell" x="316" y="232" text-anchor="middle">（事業者が自ら売電）</text>

  <!-- Row 5: 主な対象 (y=240-278, 38px) -->
  <rect x="8"   y="240" width="80"  height="38" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="0.5"/>
  <rect x="88"  y="240" width="152" height="38" fill="#ffffff"  stroke="#d7d7d7" stroke-width="0.5"/>
  <rect x="240" y="240" width="152" height="38" fill="#ffffff"  stroke="#d7d7d7" stroke-width="0.5"/>
  <text class="t-hd"   x="48"  y="263" text-anchor="middle">対象</text>
  <text class="t-cell" x="164" y="254" text-anchor="middle">小〜中規模電源</text>
  <text class="t-cell" x="164" y="270" text-anchor="middle">（住宅用太陽光等）</text>
  <text class="t-cell" x="316" y="254" text-anchor="middle">大規模電源</text>
  <text class="t-cell" x="316" y="270" text-anchor="middle">（大型風力・太陽光等）</text>

  <!-- ── 価格メカニズム図 ── -->
  <rect x="8" y="288" width="384" height="18" rx="3" fill="#2e6da4"/>
  <text class="t-sec" x="200" y="301" text-anchor="middle">価格メカニズムの違い</text>

  <!-- FIT (x=8, y=312, w=184, h=100) -->
  <rect x="8"   y="312" width="184" height="100" rx="5" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="100" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6da4">FIT</text>
  <rect x="24"  y="338" width="152" height="22" rx="3" fill="#2e6da4"/>
  <text x="100" y="353" text-anchor="middle" font-size="11" fill="#ffffff">固定買取価格（一定）</text>
  <text x="100" y="378" text-anchor="middle" font-size="11" fill="#555">需給に関係なく</text>
  <text x="100" y="395" text-anchor="middle" font-size="11" fill="#555">収入が安定・予見性高</text>

  <!-- FIP (x=208, y=312, w=184, h=100) -->
  <rect x="208" y="312" width="184" height="100" rx="5" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text x="300" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#d4a017">FIP</text>
  <!-- 2 bars with gap -->
  <rect x="216" y="338" width="102" height="22" rx="3" fill="#d7d7d7"/>
  <text x="267" y="353" text-anchor="middle" font-size="11" fill="#222">市場価格（変動）</text>
  <rect x="322" y="338" width="62"  height="22" rx="3" fill="#d4a017"/>
  <text x="353" y="353" text-anchor="middle" font-size="11" fill="#ffffff">＋P</text>
  <text x="300" y="378" text-anchor="middle" font-size="11" fill="#555">市場価格＋プレミアム</text>
  <text x="300" y="395" text-anchor="middle" font-size="11" fill="#555">（P）で収入を確保</text>

  <!-- ── 制度移行メモ ── -->
  <rect x="8" y="424" width="384" height="58" rx="5" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <text x="20" y="444" font-size="12" font-weight="bold" fill="#1a3a5c">制度移行の方向性</text>
  <text class="t-sub" x="20" y="462">大規模電源を FIT から FIP へ移行し、市場メカニズムを</text>
  <text class="t-sub" x="20" y="477">活用することで再エネの自立化・需給連動を促進する。</text>

  <!-- フッター -->
  <text class="t-foot" x="200" y="497" text-anchor="middle">FIT=Feed-in Tariff ／ FIP=Feed-in Premium ／ P=プレミアム</text>
</svg>
