<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500" role="img" aria-label="技術士総監 社会環境管理 FIT・FIP制度の仕組み 表紙">
  <defs><style>text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }</style></defs>
  <rect width="400" height="500" fill="#1a3a5c"/>
  <rect x="0" y="0" width="400" height="5" fill="#a36b2c"/>

  <!-- 資格バッジ + 管理区分バッジ -->
  <rect x="24" y="20" width="110" height="26" rx="13" fill="#a36b2c"/>
  <text x="79" y="37" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">技術士 総監</text>
  <rect x="144" y="20" width="140" height="26" rx="13" fill="none" stroke="#a36b2c" stroke-width="1.5"/>
  <text x="214" y="37" text-anchor="middle" font-size="11" fill="#d4956a">社会環境管理</text>

  <!-- メインタイトル -->
  <text x="200" y="160" text-anchor="middle" font-size="38" font-weight="bold" fill="#ffffff">FIT・FIP</text>
  <text x="200" y="210" text-anchor="middle" font-size="38" font-weight="bold" fill="#ffffff">制度の仕組み</text>

  <!-- 区切り線 -->
  <rect x="40" y="238" width="320" height="1.5" fill="#a36b2c" opacity="0.5"/>

  <!-- サブコピー -->
  <text x="200" y="272" text-anchor="middle" font-size="13" fill="#b8d0e8">再生可能エネルギー特別措置法</text>
  <text x="200" y="296" text-anchor="middle" font-size="13" fill="#b8d0e8">固定買取 vs プレミアム加算の違い</text>

  <!-- 頻出バッジ -->
  <rect x="104" y="322" width="192" height="40" rx="20" fill="#a36b2c"/>
  <text x="200" y="347" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">択一 頻出テーマ</text>

  <!-- スワイプ促進 -->
  <text x="200" y="416" text-anchor="middle" font-size="12" fill="#6a8faf">スワイプして図解を確認 ▶</text>

  <!-- フッター -->
  <rect x="0" y="460" width="400" height="40" fill="#0f2035"/>
  <text x="200" y="485" text-anchor="middle" font-size="12" fill="#6a8faf">doboku-note.com</text>
</svg>
