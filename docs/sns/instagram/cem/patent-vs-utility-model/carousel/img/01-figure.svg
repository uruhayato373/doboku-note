<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <rect width="400" height="500" fill="#ffffff"/>

  <!-- 列ヘッダー -->
  <rect x="108" y="14" width="136" height="34" rx="6" fill="#1a3a5c"/>
  <text x="176" y="36" text-anchor="middle" font-size="15" fill="#ffffff" font-family="sans-serif" font-weight="bold">特許権</text>
  <rect x="252" y="14" width="136" height="34" rx="6" fill="#a36b2c"/>
  <text x="320" y="36" text-anchor="middle" font-size="15" fill="#ffffff" font-family="sans-serif" font-weight="bold">実用新案権</text>

  <!-- 行1: 保護対象 -->
  <text x="12" y="78" font-size="12" fill="#1a3a5c" font-family="sans-serif" font-weight="bold">保護対象</text>
  <text x="176" y="72" text-anchor="middle" font-size="12" fill="#222" font-family="sans-serif">発明</text>
  <text x="176" y="88" text-anchor="middle" font-size="10" fill="#555" font-family="sans-serif">高度な技術的思想</text>
  <text x="320" y="72" text-anchor="middle" font-size="12" fill="#222" font-family="sans-serif">考案</text>
  <text x="320" y="88" text-anchor="middle" font-size="10" fill="#555" font-family="sans-serif">物品の形状・構造</text>
  <line x1="12" y1="100" x2="388" y2="100" stroke="#e0e0e0" stroke-width="1"/>

  <!-- 行2: 方法の保護 -->
  <text x="12" y="130" font-size="12" fill="#1a3a5c" font-family="sans-serif" font-weight="bold">方法の保護</text>
  <text x="176" y="128" text-anchor="middle" font-size="13" fill="#3a7d44" font-family="sans-serif" font-weight="bold">できる ○</text>
  <text x="320" y="128" text-anchor="middle" font-size="13" fill="#b22234" font-family="sans-serif" font-weight="bold">不可（物品のみ）</text>
  <line x1="12" y1="148" x2="388" y2="148" stroke="#e0e0e0" stroke-width="1"/>

  <!-- 行3: 審査 -->
  <text x="12" y="178" font-size="12" fill="#1a3a5c" font-family="sans-serif" font-weight="bold">審査制度</text>
  <text x="176" y="176" text-anchor="middle" font-size="12" fill="#222" font-family="sans-serif">実体審査あり</text>
  <text x="176" y="192" text-anchor="middle" font-size="10" fill="#555" font-family="sans-serif">審査請求が必要</text>
  <text x="320" y="176" text-anchor="middle" font-size="12" fill="#a36b2c" font-family="sans-serif" font-weight="bold">無審査登録</text>
  <text x="320" y="192" text-anchor="middle" font-size="10" fill="#555" font-family="sans-serif">方式審査のみ</text>
  <line x1="12" y1="204" x2="388" y2="204" stroke="#e0e0e0" stroke-width="1"/>

  <!-- 行4: 存続期間 -->
  <text x="12" y="234" font-size="12" fill="#1a3a5c" font-family="sans-serif" font-weight="bold">存続期間</text>
  <text x="176" y="232" text-anchor="middle" font-size="15" fill="#1a3a5c" font-family="sans-serif" font-weight="bold">出願から20年</text>
  <text x="320" y="232" text-anchor="middle" font-size="15" fill="#a36b2c" font-family="sans-serif" font-weight="bold">出願から10年</text>
  <line x1="12" y1="250" x2="388" y2="250" stroke="#e0e0e0" stroke-width="1"/>

  <!-- 行5: 権利化スピード -->
  <text x="12" y="280" font-size="12" fill="#1a3a5c" font-family="sans-serif" font-weight="bold">権利化まで</text>
  <text x="176" y="278" text-anchor="middle" font-size="12" fill="#222" font-family="sans-serif">平均 約14か月</text>
  <text x="320" y="278" text-anchor="middle" font-size="12" fill="#3a7d44" font-family="sans-serif" font-weight="bold">約2〜4か月（速い）</text>
  <line x1="12" y1="294" x2="388" y2="294" stroke="#e0e0e0" stroke-width="1"/>

  <!-- 行6: 権利行使 -->
  <text x="12" y="324" font-size="12" fill="#1a3a5c" font-family="sans-serif" font-weight="bold">権利行使</text>
  <text x="176" y="322" text-anchor="middle" font-size="12" fill="#222" font-family="sans-serif">登録後すぐ可能</text>
  <text x="320" y="316" text-anchor="middle" font-size="12" fill="#b22234" font-family="sans-serif" font-weight="bold">技術評価書が必要</text>
  <text x="320" y="332" text-anchor="middle" font-size="10" fill="#555" font-family="sans-serif">提示・警告が前提</text>
  <line x1="12" y1="344" x2="388" y2="344" stroke="#e0e0e0" stroke-width="1"/>

  <!-- 行7: 費用 -->
  <text x="12" y="372" font-size="12" fill="#1a3a5c" font-family="sans-serif" font-weight="bold">費用</text>
  <text x="176" y="372" text-anchor="middle" font-size="12" fill="#222" font-family="sans-serif">比較的高い</text>
  <text x="320" y="372" text-anchor="middle" font-size="12" fill="#3a7d44" font-family="sans-serif" font-weight="bold">比較的低い</text>

  <!-- まとめ帯 -->
  <rect x="12" y="396" width="376" height="92" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <text x="200" y="418" text-anchor="middle" font-size="12" fill="#1a3a5c" font-family="sans-serif" font-weight="bold">ひとことで言うと</text>
  <text x="24" y="440" font-size="11" fill="#444" font-family="sans-serif">特許 ＝ 高度な発明を、審査を経てしっかり保護（強い）</text>
  <text x="24" y="460" font-size="11" fill="#444" font-family="sans-serif">実用新案 ＝ 物品の小さな工夫を、速く・安く保護</text>
  <text x="24" y="480" font-size="11" fill="#a36b2c" font-family="sans-serif">ただし無審査ゆえ権利は不安定（評価書が必要）</text>
</svg>
