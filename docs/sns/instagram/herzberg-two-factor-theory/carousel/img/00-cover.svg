<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <!-- 背景 navy -->
  <rect width="400" height="500" fill="#1a3a5c"/>
  <!-- 上部 orange アクセントライン -->
  <rect x="0" y="0" width="400" height="5" fill="#a36b2c"/>

  <!-- 管理ラベル（右上） -->
  <text x="384" y="34" text-anchor="end" font-size="12" fill="#d4926a" font-family="sans-serif" font-weight="bold">人的資源管理</text>

  <!-- 試験種ラベル -->
  <text x="20" y="36" font-size="11" fill="#7aaed6" font-family="sans-serif">技術士 総監｜Section 3.1</text>

  <!-- キーワード名（中央・大） -->
  <text x="200" y="200" text-anchor="middle" font-size="36" fill="#ffffff" font-family="sans-serif" font-weight="bold">ハーズバーグの</text>
  <text x="200" y="248" text-anchor="middle" font-size="36" fill="#ffffff" font-family="sans-serif" font-weight="bold">二要因理論</text>

  <!-- サブタイトル -->
  <text x="200" y="296" text-anchor="middle" font-size="13" fill="#7aaed6" font-family="sans-serif">動機づけ要因 ≠ 衛生要因</text>

  <!-- 出題実績バッジ -->
  <rect x="100" y="318" width="200" height="32" rx="16" fill="#a36b2c"/>
  <text x="200" y="339" text-anchor="middle" font-size="13" fill="#ffffff" font-family="sans-serif" font-weight="bold">過去問 H21〜R06 計10回出題</text>

  <!-- 択一テーマバッジ -->
  <text x="200" y="390" text-anchor="middle" font-size="12" fill="#7aaed6" font-family="sans-serif">択一 頻出テーマ｜スワイプで要点を確認 →</text>

  <!-- フッター帯 -->
  <rect x="0" y="460" width="400" height="40" fill="#0f2035"/>
  <text x="200" y="485" text-anchor="middle" font-size="13" fill="#7aaed6" font-family="sans-serif">@doboku-note</text>
</svg>
