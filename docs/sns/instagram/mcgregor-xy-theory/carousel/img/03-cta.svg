<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500" role="img" aria-label="doboku-note.com で続きを学ぶ CTA">
  <defs>
    <style>text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }</style>
  </defs>

  <!-- 背景 -->
  <rect width="400" height="500" fill="#1a3a5c"/>

  <!-- 上部アクセントライン -->
  <rect x="0" y="0" width="400" height="5" fill="#a36b2c"/>

  <!-- 上部コピー -->
  <text x="200" y="78" text-anchor="middle" font-size="14" fill="#b8d0e8">もっと解きたい方へ</text>

  <!-- 本アイコン（幾何学） -->
  <rect x="164" y="104" width="72" height="84" rx="6" fill="none" stroke="#a36b2c" stroke-width="2"/>
  <line x1="180" y1="124" x2="220" y2="124" stroke="#a36b2c" stroke-width="1.5"/>
  <line x1="180" y1="140" x2="220" y2="140" stroke="#a36b2c" stroke-width="1.5"/>
  <line x1="180" y1="156" x2="220" y2="156" stroke="#a36b2c" stroke-width="1.5"/>
  <line x1="180" y1="172" x2="220" y2="172" stroke="#a36b2c" stroke-width="1.5"/>

  <!-- コンテンツ説明 -->
  <text x="200" y="240" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">過去問・キーワード解説</text>
  <text x="200" y="264" text-anchor="middle" font-size="13" fill="#b8d0e8">総監 択一 1次試験 全問対応</text>

  <!-- 区切り線 -->
  <rect x="80" y="288" width="240" height="1.5" fill="#a36b2c" opacity="0.5"/>

  <!-- URL ボタン -->
  <rect x="60" y="312" width="280" height="52" rx="26" fill="#a36b2c"/>
  <text x="200" y="344" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">doboku-note.com</text>

  <!-- フォロー促進 -->
  <text x="200" y="398" text-anchor="middle" font-size="13" fill="#b8d0e8">フォローで毎日1テーマ更新中</text>

  <!-- ハッシュタグ -->
  <text x="200" y="430" text-anchor="middle" font-size="10" fill="#4a6a8f">#技術士 #総監 #技術士試験 #人的資源管理</text>

  <!-- フッター -->
  <rect x="0" y="460" width="400" height="40" fill="#0f2035"/>
  <text x="200" y="485" text-anchor="middle" font-size="12" fill="#6a8faf">@doboku-note</text>
</svg>
