<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500" role="img" aria-label="新QC七つ道具 試験出題ポイント3点">
  <defs>
    <style>text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }</style>
  </defs>

  <!-- 背景 -->
  <rect width="400" height="500" fill="#ffffff"/>

  <!-- ヘッダー帯 -->
  <rect x="0" y="0" width="400" height="72" fill="#1a3a5c"/>
  <text x="200" y="24" text-anchor="middle" font-size="10" fill="#d4956a">技術士 総監 | 経済性管理</text>
  <text x="200" y="52" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">試験での出題ポイント</text>

  <!-- ポイント1 -->
  <circle cx="44" cy="112" r="16" fill="#1a3a5c"/>
  <text x="44" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">1</text>
  <text x="72" y="104" font-size="13" font-weight="bold" fill="#1a3a5c">旧QCとの違い</text>
  <text x="72" y="121" font-size="11" fill="#555">旧QC = 数値データの分析</text>
  <text x="72" y="137" font-size="11" fill="#555">新QC = 言語データ（意見・要因）</text>

  <!-- 区切り線 -->
  <line x1="24" y1="158" x2="376" y2="158" stroke="#e8e8e8" stroke-width="1"/>

  <!-- ポイント2 -->
  <circle cx="44" cy="196" r="16" fill="#1a3a5c"/>
  <text x="44" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">2</text>
  <text x="72" y="188" font-size="13" font-weight="bold" fill="#1a3a5c">7種を押さえる</text>
  <text x="72" y="205" font-size="11" fill="#555">親和・連関・系統・マトリックス</text>
  <text x="72" y="221" font-size="11" fill="#555">・同データ解析・アロー・PDPC</text>

  <!-- 区切り線 -->
  <line x1="24" y1="242" x2="376" y2="242" stroke="#e8e8e8" stroke-width="1"/>

  <!-- ポイント3 -->
  <circle cx="44" cy="280" r="16" fill="#1a3a5c"/>
  <text x="44" y="286" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">3</text>
  <text x="72" y="272" font-size="13" font-weight="bold" fill="#1a3a5c">形で覚える</text>
  <text x="72" y="289" font-size="11" fill="#555">系統図法 = ツリー（目的→手段）</text>
  <text x="72" y="305" font-size="11" fill="#555">連関図法 = 網目（因果の矢印）</text>

  <!-- 注意Callout -->
  <rect x="24" y="330" width="352" height="92" rx="8" fill="#fce8d0"/>
  <rect x="24" y="330" width="5" height="92" rx="4" fill="#a36b2c"/>
  <text x="44" y="354" font-size="11" font-weight="bold" fill="#5e3d18">試験の注意ポイント</text>
  <text x="44" y="372" font-size="11" fill="#5e3d18">「系統図法は要因を矢印でつなぎ因果</text>
  <text x="44" y="389" font-size="11" fill="#5e3d18">関係を表す」は誤り（それは連関図法）</text>
  <text x="44" y="409" font-size="11" fill="#5e3d18">マトリックスデータ解析・アローも新QC側</text>

  <!-- フッター -->
  <rect x="0" y="460" width="400" height="40" fill="#1a3a5c"/>
  <text x="200" y="485" text-anchor="middle" font-size="12" fill="#6a8faf">doboku-note.com</text>
</svg>
