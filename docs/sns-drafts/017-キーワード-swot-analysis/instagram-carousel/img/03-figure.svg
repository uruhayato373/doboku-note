  <rect x="80" y="1080" width="920" height="110" rx="16" fill="#e8f0fe" />
  <text x="540" y="1115" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif" font-size="30" font-weight="700" fill="#1a3a5c" text-anchor="middle">内部 × 外部、プラス × マイナス</text>
