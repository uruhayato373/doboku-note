  <text x="20" y="290" font-size="12" fill="#222" font-family="sans-serif" font-weight="bold" transform="rotate(-90 20 290)" text-anchor="middle">外部環境</text>

  <g>
    <rect x="40" y="74" width="160" height="100" fill="#d0e8d0" stroke="#3a7d44" stroke-width="2" rx="4"/>
