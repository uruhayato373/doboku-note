  <line x1="20" y1="266" x2="360" y2="266" stroke="#d7d7d7" stroke-width="1"/>

  <text x="20" y="286" font-size="12" fill="#222" font-family="sans-serif" font-weight="bold">3. 多数決冗長</text>
  <text x="120" y="286" font-size="11" fill="#555" font-family="sans-serif">航空機 3 重化等</text>

