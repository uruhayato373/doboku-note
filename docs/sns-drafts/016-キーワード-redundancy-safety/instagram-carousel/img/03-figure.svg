  <text x="40" y="118" font-size="11" fill="#3a7d44" font-family="sans-serif">主系故障時に予備が起動</text>

  <line x1="20" y1="135" x2="360" y2="135" stroke="#d7d7d7" stroke-width="1"/>

  <text x="20" y="155" font-size="12" fill="#222" font-family="sans-serif" font-weight="bold">2. 並列冗長</text>
  <text x="120" y="155" font-size="11" fill="#555" font-family="sans-serif">二重化センサー等</text>

  <g>
    <rect x="40" y="165" width="60" height="32" fill="#e8f0fe" stroke="#2e6da4" stroke-width="2" rx="3"/>
    <text x="70" y="186" text-anchor="middle" font-size="11" fill="#1a3a5c" font-family="sans-serif">系 A</text>
  </g>
  <g>
    <rect x="40" y="205" width="60" height="32" fill="#e8f0fe" stroke="#2e6da4" stroke-width="2" rx="3"/>
