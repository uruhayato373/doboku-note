    <text x="65" y="339" text-anchor="middle" font-size="11" fill="#1a3a5c" font-family="sans-serif">系 2</text>
  </g>
  <g>
    <rect x="40" y="352" width="50" height="22" fill="#e8f0fe" stroke="#2e6da4" stroke-width="2" rx="3"/>
    <text x="65" y="367" text-anchor="middle" font-size="11" fill="#1a3a5c" font-family="sans-serif">系 3</text>
  </g>
  <g>
    <rect x="160" y="318" width="80" height="36" fill="#fff3cd" stroke="#d4a017" stroke-width="2" rx="3"/>
    <text x="200" y="334" text-anchor="middle" font-size="11" fill="#1a3a5c" font-family="sans-serif">多数決</text>
    <text x="200" y="348" text-anchor="middle" font-size="11" fill="#1a3a5c" font-family="sans-serif">判定</text>
  </g>
  <line x1="90" y1="307" x2="160" y2="330" stroke="#222" stroke-width="1.5"/>
  <line x1="90" y1="335" x2="160" y2="336" stroke="#222" stroke-width="1.5"/>
  <line x1="90" y1="363" x2="160" y2="342" stroke="#222" stroke-width="1.5"/>
  <line x1="240" y1="336" x2="280" y2="336" stroke="#222" stroke-width="1.5"/>
  <polygon points="280,336 274,332 274,340" fill="#222"/>
  <text x="320" y="340" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">出力</text>
</g>
  <rect x="80" y="1080" width="920" height="110" rx="16" fill="#e8f0fe" />
  <text x="540" y="1115" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif" font-size="30" font-weight="700" fill="#1a3a5c" text-anchor="middle">待機・並列・多数決の動作差を視覚化</text>
  <text x="1040" y="1318" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif" font-size="24" font-weight="400" fill="#8a8a8a" text-anchor="end">doboku-note.com</text>
