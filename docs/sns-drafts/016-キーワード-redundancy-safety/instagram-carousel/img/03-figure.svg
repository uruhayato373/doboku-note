<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect x="0" y="0" width="1080" height="1350" rx="0" fill="#ffffff" />
<rect x="80" y="60" width="220" height="64" rx="32" fill="#3a7d44" />
  <text x="190" y="92" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">核心の図解</text>
  <g transform="translate(180, 270) scale(1.894736842105263)">
  <text x="190" y="22" text-anchor="middle" font-size="14" fill="#222" font-family="sans-serif" font-weight="bold">冗長化の 3 種類</text>

  <text x="20" y="58" font-size="12" fill="#222" font-family="sans-serif" font-weight="bold">1. 待機冗長</text>
  <text x="120" y="58" font-size="11" fill="#555" font-family="sans-serif">UPS 等</text>

  <g>
    <rect x="40" y="68" width="60" height="36" fill="#e8f0fe" stroke="#2e6da4" stroke-width="2" rx="3"/>
    <text x="70" y="91" text-anchor="middle" font-size="11" fill="#1a3a5c" font-family="sans-serif">主系</text>
  </g>
  <g>
    <rect x="120" y="68" width="60" height="36" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="4,3" rx="3"/>
    <text x="150" y="91" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">予備</text>
  </g>
