  <line x1="380" y1="80" x2="380" y2="225" stroke="#333" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="440" y1="80" x2="440" y2="225" stroke="#333" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- X axis -->
