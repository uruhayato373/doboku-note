<svg width="100%" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" width="400" height="300">
  <!-- 上向き矢印 -->
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <polygon points="0 8, 8 4, 0 0" fill="#333" />
    </marker>
  </defs>
  <line x1="30" y1="270" x2="30" y2="20" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- ピラミッド（台形を5段） -->
  <!-- 第1段（最下層）：生理的欲求 -->
  <polygon points="55,265 345,265 310,225 90,225" fill="#d0e8f0" stroke="#666" stroke-width="1"/>
  <text x="200" y="250" text-anchor="middle" font-size="13" fill="#333">生理的欲求</text>

  <!-- 第2段：安全・安定への欲求 -->
  <polygon points="90,225 310,225 278,185 122,185" fill="#b8d8ec" stroke="#666" stroke-width="1"/>
  <text x="200" y="210" text-anchor="middle" font-size="12" fill="#333">安全・安定への欲求</text>

  <!-- 第3段：社会的欲求 -->
  <polygon points="122,185 278,185 248,145 152,145" fill="#9ac8e8" stroke="#666" stroke-width="1"/>
  <text x="200" y="170" text-anchor="middle" font-size="12" fill="#333">社会的欲求</text>

  <!-- 第4段：尊厳欲求 -->
  <polygon points="152,145 248,145 220,105 180,105" fill="#7ab4dc" stroke="#666" stroke-width="1"/>
  <text x="200" y="130" text-anchor="middle" font-size="12" fill="#222">尊厳欲求</text>

  <!-- 第5段（頂点）：自己実現欲求 -->
  <polygon points="180,105 220,105 200,65" fill="#5a9fd0" stroke="#666" stroke-width="1"/>
  <text x="200" y="93" text-anchor="middle" font-size="10" fill="#fff">自己</text>
  <text x="200" y="105" text-anchor="middle" font-size="10" fill="#fff">実現</text>
  <text x="200" y="117" text-anchor="middle" font-size="10" fill="#fff">欲求</text>

  <!-- ラベル -->
  <text x="200" y="290" text-anchor="middle" font-size="12" fill="#333">図表2.1　マズローの欲求5段階説</text>
</svg>
