<svg width="100%" viewBox="0 0 500 290" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;width:100%;font-family:sans-serif;font-size:12px;">
  <rect x="0" y="0" width="120" height="30" fill="#d0d8e8" stroke="#555" stroke-width="1"/>
  <rect x="120" y="0" width="380" height="30" fill="#d0d8e8" stroke="#555" stroke-width="1"/>
  <text x="60" y="20" text-anchor="middle" font-weight="bold">項目</text>
  <text x="310" y="20" text-anchor="middle" font-weight="bold">事例</text>
  <!-- Row 1 -->
  <rect x="0" y="30" width="120" height="35" fill="#f0f4ff" stroke="#555" stroke-width="1"/>
  <rect x="120" y="30" width="380" height="35" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="60" y="52" text-anchor="middle">産業災害</text>
  <text x="130" y="52" text-anchor="start">事業所の火災・爆発、サービス施設等の人身事故、所有車等の事故</text>
  <!-- Row 2 -->
  <rect x="0" y="65" width="120" height="35" fill="#f0f4ff" stroke="#555" stroke-width="1"/>
  <rect x="120" y="65" width="380" height="35" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="60" y="87" text-anchor="middle">環境汚染</text>
  <text x="130" y="87" text-anchor="start">廃棄物処理、水質汚濁、大気汚染、騒音問題、化学物質漏出</text>
  <!-- Row 3 -->
  <rect x="0" y="100" width="120" height="35" fill="#f0f4ff" stroke="#555" stroke-width="1"/>
  <rect x="120" y="100" width="380" height="35" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="60" y="122" text-anchor="middle">製品・サービス事故</text>
  <text x="130" y="122" text-anchor="start">商品の欠陥、表示上の欠陥、異物混入、リコール隠し、食中毒</text>
  <!-- Row 4 -->
  <rect x="0" y="135" width="120" height="35" fill="#f0f4ff" stroke="#555" stroke-width="1"/>
  <rect x="120" y="135" width="380" height="35" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="60" y="157" text-anchor="middle">経営問題</text>
  <text x="130" y="157" text-anchor="start">財務問題、会計問題、贈収賄問題、脱税、労働争議、風説の流布、企業スキャンダル</text>
  <!-- Row 5 -->
  <rect x="0" y="170" width="120" height="35" fill="#f0f4ff" stroke="#555" stroke-width="1"/>
  <rect x="120" y="170" width="380" height="35" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="60" y="192" text-anchor="middle">企業内不祥事</text>
  <text x="130" y="192" text-anchor="start">インサイダー、情報漏洩、ハラスメント、人権問題、横領、過労死</text>
  <!-- Row 6 -->
  <rect x="0" y="205" width="120" height="35" fill="#f0f4ff" stroke="#555" stroke-width="1"/>
  <rect x="120" y="205" width="380" height="35" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="60" y="227" text-anchor="middle">自然災害</text>
  <text x="130" y="227" text-anchor="start">暴風、豪雨、豪雪、洪水、高潮、地震、津波、噴火等</text>
  <!-- Row 7 -->
  <rect x="0" y="240" width="120" height="25" fill="#f0f4ff" stroke="#555" stroke-width="1"/>
  <rect x="120" y="240" width="380" height="25" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="60" y="257" text-anchor="middle">社会犯罪等</text>
  <text x="130" y="257" text-anchor="start">テロリズム、国際的誘拐事件、サイバーセキュリティ</text>
  <!-- Row 8 -->
  <rect x="0" y="265" width="120" height="25" fill="#f0f4ff" stroke="#555" stroke-width="1"/>
  <rect x="120" y="265" width="380" height="25" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="60" y="282" text-anchor="middle">政治的問題</text>
  <text x="130" y="282" text-anchor="start">戦争、エネルギー危機、食料問題</text>
</svg>
