<svg width="100%" viewBox="0 0 400 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="労働安全衛生マネジメントシステムに関する指針の基本的な枠組み">
  <defs>
    <marker id="arr5" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#555"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Hiragino Sans", "Yu Gothic", sans-serif; fill: #1f2937; }
  </style>

  <!-- Top: 事業者による安全衛生方針の表明 -->
  <rect x="40" y="8" width="240" height="32" rx="4" fill="#d0e4f7" stroke="#3366aa" stroke-width="1.5"/>
  <text x="160" y="29" text-anchor="middle" font-size="13" font-weight="bold">事業者による安全衛生方針の表明</text>

  <!-- Arrow down -->
  <line x1="160" y1="40" x2="160" y2="58" stroke="#555" stroke-width="1.5" marker-end="url(#arr5)"/>

  <!-- PDCA cycle dashed box -->
  <rect x="15" y="60" width="290" height="340" rx="4" fill="none" stroke="#3366aa" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="30" y="78" font-size="11" font-weight="bold" fill="#3366aa">PDCAサイクル</text>

  <!-- 危険性又は有害性等の調査実施 (P) -->
  <rect x="30" y="88" width="260" height="30" rx="4" fill="#d8eaf8" stroke="#3366aa" stroke-width="1"/>
  <text x="160" y="108" text-anchor="middle" font-size="13">危険性又は有害性等の調査実施（P）</text>

  <!-- Arrow -->
  <line x1="160" y1="118" x2="160" y2="132" stroke="#555" stroke-width="1.5" marker-end="url(#arr5)"/>

  <!-- 安全衛生目標の設定 (P) -->
  <rect x="30" y="134" width="260" height="30" rx="4" fill="#d8eaf8" stroke="#3366aa" stroke-width="1"/>
  <text x="160" y="154" text-anchor="middle" font-size="13">安全衛生目標の設定（P）</text>

  <!-- Arrow -->
  <line x1="160" y1="164" x2="160" y2="178" stroke="#555" stroke-width="1.5" marker-end="url(#arr5)"/>

  <!-- 2 boxes side by side -->
  <rect x="30" y="180" width="125" height="36" rx="4" fill="#d8eaf8" stroke="#3366aa" stroke-width="1"/>
  <text x="92" y="202" text-anchor="middle" font-size="13">緊急事態への対応等（P）</text>

  <rect x="165" y="180" width="125" height="36" rx="4" fill="#d8eaf8" stroke="#3366aa" stroke-width="1"/>
  <text x="227" y="202" text-anchor="middle" font-size="13">安全衛生企画の作成（P）</text>

  <!-- Arrow -->
  <line x1="160" y1="216" x2="160" y2="230" stroke="#555" stroke-width="1.5" marker-end="url(#arr5)"/>

  <!-- 安全衛生計画の実施等 (D) -->
  <rect x="30" y="232" width="260" height="30" rx="4" fill="#d8eaf8" stroke="#3366aa" stroke-width="1"/>
  <text x="160" y="252" text-anchor="middle" font-size="13">安全衛生計画の実施等（D）</text>

  <!-- Arrow -->
  <line x1="160" y1="262" x2="160" y2="276" stroke="#555" stroke-width="1.5" marker-end="url(#arr5)"/>

  <!-- 日常的な点検、改善等 (C・A) / 労働災害発生原因の調査等 (C・A) -->
  <rect x="55" y="278" width="210" height="42" rx="4" fill="#d8eaf8" stroke="#3366aa" stroke-width="1"/>
  <text x="160" y="295" text-anchor="middle" font-size="11">日常的な点検、改善等（C・A）</text>
  <text x="160" y="312" text-anchor="middle" font-size="11">労働災害発生原因の調査等（C・A）</text>

  <!-- Arrow -->
  <line x1="160" y1="320" x2="160" y2="334" stroke="#555" stroke-width="1.5" marker-end="url(#arr5)"/>

  <!-- システム監査の実施 (C) / 改善 (A) side by side -->
  <rect x="30" y="336" width="170" height="30" rx="4" fill="#d8eaf8" stroke="#3366aa" stroke-width="1"/>
  <text x="115" y="356" text-anchor="middle" font-size="13">システム監査の実施（C）</text>

  <rect x="210" y="336" width="80" height="30" rx="4" fill="#d8eaf8" stroke="#3366aa" stroke-width="1"/>
  <text x="250" y="356" text-anchor="middle" font-size="13">改善（A）</text>

  <!-- Arrow down from PDCA box -->
  <line x1="160" y1="400" x2="160" y2="420" stroke="#555" stroke-width="1.5" marker-end="url(#arr5)"/>

  <!-- システムの見直し -->
  <rect x="60" y="422" width="200" height="32" rx="4" fill="#d0e4f7" stroke="#3366aa" stroke-width="1.5"/>
  <text x="160" y="443" text-anchor="middle" font-size="13" font-weight="bold">システムの見直し</text>

  <!-- Right side: 基本要素 -->
  <text x="340" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">基本要素</text>

  <rect x="315" y="92" width="70" height="50" rx="4" fill="#e8e8f8" stroke="#6633aa" stroke-width="1"/>
  <text x="350" y="115" text-anchor="middle" font-size="13">体制の</text>
  <text x="350" y="132" text-anchor="middle" font-size="13">整備</text>

  <rect x="315" y="158" width="70" height="50" rx="4" fill="#e8e8f8" stroke="#6633aa" stroke-width="1"/>
  <text x="350" y="178" text-anchor="middle" font-size="11">労働者の</text>
  <text x="350" y="195" text-anchor="middle" font-size="11">意見の反映</text>

  <rect x="315" y="224" width="70" height="50" rx="4" fill="#e8e8f8" stroke="#6633aa" stroke-width="1"/>
  <text x="350" y="254" text-anchor="middle" font-size="13">明文化</text>

  <rect x="315" y="290" width="70" height="50" rx="4" fill="#e8e8f8" stroke="#6633aa" stroke-width="1"/>
  <text x="350" y="320" text-anchor="middle" font-size="13">記録</text>

  <!-- Connecting lines from PDCA to 基本要素 -->
  <line x1="305" y1="117" x2="315" y2="117" stroke="#6633aa" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="305" y1="183" x2="315" y2="183" stroke="#6633aa" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="305" y1="249" x2="315" y2="249" stroke="#6633aa" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="305" y1="315" x2="315" y2="315" stroke="#6633aa" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Bottom caption -->
  <text x="200" y="490" text-anchor="middle" font-size="11" fill="#555">図表4.5　労働安全衛生マネジメントシステムに関する指針の基本的な枠組み</text>
</svg>
