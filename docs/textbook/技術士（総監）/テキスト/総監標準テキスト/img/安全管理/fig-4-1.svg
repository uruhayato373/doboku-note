<svg width="100%" viewBox="0 0 560 200" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;width:100%;font-family:sans-serif;font-size:13px;">
  <!-- Header row -->
  <rect x="0" y="0" width="140" height="40" fill="#d0d8e8" stroke="#555" stroke-width="1"/>
  <rect x="140" y="0" width="140" height="40" fill="#d0d8e8" stroke="#555" stroke-width="1"/>
  <rect x="280" y="0" width="140" height="40" fill="#d0d8e8" stroke="#555" stroke-width="1"/>
  <rect x="420" y="0" width="140" height="40" fill="#d0d8e8" stroke="#555" stroke-width="1"/>
  <text x="70" y="25" text-anchor="middle" font-weight="bold">買主の救済方法</text>
  <text x="210" y="18" text-anchor="middle" font-weight="bold">買主に帰責事由</text>
  <text x="210" y="35" text-anchor="middle" font-weight="bold">あり</text>
  <text x="350" y="18" text-anchor="middle" font-weight="bold">双方とも帰責事由</text>
  <text x="350" y="35" text-anchor="middle" font-weight="bold">なし</text>
  <text x="490" y="18" text-anchor="middle" font-weight="bold">売主に帰責事由</text>
  <text x="490" y="35" text-anchor="middle" font-weight="bold">あり</text>
  <!-- Row 1 -->
  <rect x="0" y="40" width="140" height="40" fill="#f0f4ff" stroke="#555" stroke-width="1"/>
  <rect x="140" y="40" width="140" height="40" fill="#fff" stroke="#555" stroke-width="1"/>
  <rect x="280" y="40" width="140" height="40" fill="#fff" stroke="#555" stroke-width="1"/>
  <rect x="420" y="40" width="140" height="40" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="70" y="65" text-anchor="middle">損害賠償</text>
  <text x="210" y="65" text-anchor="middle">できない</text>
  <text x="350" y="65" text-anchor="middle">できない</text>
  <text x="490" y="65" text-anchor="middle">できる</text>
  <!-- Row 2 -->
  <rect x="0" y="80" width="140" height="40" fill="#f0f4ff" stroke="#555" stroke-width="1"/>
  <rect x="140" y="80" width="140" height="40" fill="#fff" stroke="#555" stroke-width="1"/>
  <rect x="280" y="80" width="140" height="40" fill="#fff" stroke="#555" stroke-width="1"/>
  <rect x="420" y="80" width="140" height="40" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="70" y="105" text-anchor="middle">解除</text>
  <text x="210" y="105" text-anchor="middle">できない</text>
  <text x="350" y="105" text-anchor="middle">できる</text>
  <text x="490" y="105" text-anchor="middle">できる</text>
  <!-- Row 3 -->
  <rect x="0" y="120" width="140" height="40" fill="#f0f4ff" stroke="#555" stroke-width="1"/>
  <rect x="140" y="120" width="140" height="40" fill="#fff" stroke="#555" stroke-width="1"/>
  <rect x="280" y="120" width="140" height="40" fill="#fff" stroke="#555" stroke-width="1"/>
  <rect x="420" y="120" width="140" height="40" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="70" y="145" text-anchor="middle">追完請求</text>
  <text x="210" y="145" text-anchor="middle">できない</text>
  <text x="350" y="145" text-anchor="middle">できる</text>
  <text x="490" y="145" text-anchor="middle">できる</text>
  <!-- Row 4 -->
  <rect x="0" y="160" width="140" height="40" fill="#f0f4ff" stroke="#555" stroke-width="1"/>
  <rect x="140" y="160" width="140" height="40" fill="#fff" stroke="#555" stroke-width="1"/>
  <rect x="280" y="160" width="140" height="40" fill="#fff" stroke="#555" stroke-width="1"/>
  <rect x="420" y="160" width="140" height="40" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="70" y="185" text-anchor="middle">代金減額</text>
  <text x="210" y="185" text-anchor="middle">できない</text>
  <text x="350" y="185" text-anchor="middle">できる</text>
  <text x="490" y="185" text-anchor="middle">できる</text>
</svg>
