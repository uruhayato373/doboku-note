<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>doboku-note · プライバシーポリシー 設計案</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@400;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: {
      sans: ['Inter', 'Noto Sans JP', 'Hiragino Sans', 'system-ui', 'sans-serif'],
      serif: ['"Noto Serif JP"', '"Hiragino Mincho ProN"', '"Yu Mincho"', 'Georgia', 'serif'],
      mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Consolas', '"Roboto Mono"', 'monospace'],
    } } } };
  </script>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .font-serif-jp { font-family: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", YuMincho, Georgia, serif; }
    body { font-family: Inter, "Noto Sans JP", "Hiragino Sans", system-ui, sans-serif; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="privacy-shared.jsx"></script>
  <script type="text/babel" src="privacy-option-a.jsx"></script>
  <script type="text/babel" src="privacy-option-b.jsx"></script>
  <script type="text/babel" src="privacy-option-c.jsx"></script>
  <script type="text/babel" src="privacy-option-d.jsx"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="env,react">
    const { useState, useEffect } = React;
    function App() {
      const [ready, setReady] = useState(false);
      useEffect(() => {
        let tries = 0;
        const t = setInterval(() => {
          tries++;
          if (window.PrivacyOptionA && window.PrivacyOptionB && window.PrivacyOptionC && window.PrivacyOptionD && window.DesignCanvas) {
            setReady(true); clearInterval(t);
          } else if (tries > 100) { clearInterval(t); }
        }, 50);
        return () => clearInterval(t);
      }, []);
      if (!ready) {
        return <div style={{ height: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: "#888", fontFamily: "monospace" }}>Loading designs…</div>;
      }
      const { DesignCanvas, DCSection, DCArtboard } = window;
      return (
        <DesignCanvas
          title="doboku-note · プライバシーポリシー 設計案"
          subtitle="トラスト最優先・モネタイズなし 4方向 — 個人情報保護法・GDPR 対応"
        >
          <DCSection id="privacy" title="4 directions">
            <DCArtboard id="p-opt-a" label="案A — Editorial Long-form（編集記事スタイル・番号付きTOC・PDF 配布）" width={1280} height={3800}>
              <PrivacyOptionA />
            </DCArtboard>
            <DCArtboard id="p-opt-b" label="案B — Transparency Dashboard（Cookie 設定 UI・データフロー図・操作可能）" width={1280} height={3800}>
              <PrivacyOptionB />
            </DCArtboard>
            <DCArtboard id="p-opt-c" label="案C — Specification Sheet（仕様書スタイル・データ目録 DC-XX・GDPR 条文紐付け）" width={1280} height={3400}>
              <PrivacyOptionC />
            </DCArtboard>
            <DCArtboard id="p-opt-d" label="案D — Reading + Trust Sidebar（編集者からの一文・変更履歴・多言語版）" width={1280} height={3600}>
              <PrivacyOptionD />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
