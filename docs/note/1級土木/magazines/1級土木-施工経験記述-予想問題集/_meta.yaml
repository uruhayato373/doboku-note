title: "1級土木 施工経験記述｜予想問題集（令和6年度 新方向対応）"
description: |
  1級土木施工管理技士 第2次検定 問題1（施工経験記述）の予想問題集。令和6年度の
  検定見直しで現れた新方向に特化し、テーマ別完成答案集（5管理）ではカバーしきれない
  出題パターンを予想問題＋模範答案で対策する。監理技術者レベル。

  収録テーマ:
  - 条件提示型（夏季・冬季・雨季・山間部など施工条件が与えられる新パターン）
  - 日常業務記述（事前調査・施工計画書・品質/出来形記録・安全活動の記録）
  - 予想2テーマ組合せ（R06安全×施工計画・R07品質×環境を踏まえた次の組合せ予想）

  各記事は予想問題本文＋出題予想根拠＋模範答案（記述例）＋採点者視点で構成。
  予想は確率的で的中保証なし。記述例は別工種・現場設定で書き下ろし。
