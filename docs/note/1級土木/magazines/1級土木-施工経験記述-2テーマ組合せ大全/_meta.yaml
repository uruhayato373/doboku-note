title: "1級土木 施工経験記述｜2テーマ組合せ大全（5管理 全10組合せ）"
description: |
  1級土木施工管理技士 第2次検定 問題1（施工経験記述）の2テーマ組合せ大全。
  令和6年度以降の現行形式（5管理から2テーマが選ばれ、同一工事で設問1・設問2に
  書き分ける・同一内容不可）に対し、5管理の2テーマ全組合せ C(5,2)=10通りを網羅。

  各組合せに想定工事①②③（別現場・別工種）のフル模範答案（監理技術者レベル）を
  収録し、設問1＝テーマA・設問2＝テーマBを評価軸の異なる論点に分離して書き分ける。
  どの2テーマの組合せが出ても、自分の経験工事に当てはめて書けるようにする全網羅型。

  投機的な「予想」ではなく現行出題形式そのものの全網羅（的中・不的中の概念がない）。
  記述例はすべて運営者（1級土木施工管理技士・元自治体土木職）の実務経験に基づく
  独自表現で、過去問模範答案集・完成答案集とは別の工種・現場設定で書き下ろし。
  丸写しは失格につながるため、必ず自分が経験した工事に置き換えて使用する前提の教材。

  10組合せ: 品質×安全 / 品質×工程 / 品質×施工計画 / 品質×環境 / 安全×工程 /
  安全×施工計画 / 安全×環境 / 工程×施工計画 / 工程×環境 / 施工計画×環境。

