title: "技術士 総監｜全記事パック 2026年版（択一・記述式・模範論文 全21マガジン全部入り）"
description: |
  技術士総合技術監理部門の合格に必要な note 教材を、これ1つに束ねた全記事パック 2026年版。
  択一対策（精読ガイド）・記述式の型（クロス・トレードオフ）・設問(3)の弾薬（国家施策バンク）・
  予想演習（R8予想問題集）・全17ペルソナのフル模範論文を、全21マガジン全部入りでカバーする。

  令和8年から受験料は ¥20,500（32年ぶりの値上げ）。不合格でもう一度受ければ受験料だけで
  ¥20,500。本パックは ¥9,800 ＝ 受験料1回ぶんより安く、合格に必要な全教材がそろう。

  収録（単品合計¥50,080相当 → 約80%OFF）:
  - 精読ガイド（5管理の体系学習・択一/論点）
  - 5管理クロス・トレードオフ（記述式の型・解決フレーム・答案ひな型）
  - 設問(3)国家施策バンク（将来課題11テーマ×国家施策68案）
  - R8予想問題集（令和8年度版・6テーマ フル論述演習）
  - 模範論文 全17ペルソナ（ゼネコン/河川コンサル/道路橋梁コンサル/都市計画コンサル＋
    自治体13分野・R03〜R07 フル実演）

  2026年版。R8予想は令和8年度試験向け。翌年は R9 予想へ差し替え、旧年度予想はアーカイブ
  する（年次更新）。案内（序章）は無料で、パック全体像・使い方・既購入者フォローを解説する。

