title: "技術士 総監｜記述式 模範論文（自治体 上水道担当・R3-R7 + R8予想）"
description: |
  市区町村・上水道担当（発注者）の立場で書いた令和3〜7年度 過去問 + R8 予想問題集セット。
  過去問5年分は老朽管路更新版と浄水場改修版のA案/B案2バージョン併記。
  R8予想は気候変動適応・資源循環を予想問題ごとに2記事化（各A案/B案）、計7記事。
  5管理間トレードオフを論じた3,000字級フル論文＋採点者視点の詳細解説を収録。各記事に印刷用PDF付き。
