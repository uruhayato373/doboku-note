title: "技術士 総監｜記述式 模範論文（自治体 都市計画担当・R3-R7 + R8予想）"
description: |
  地方公共団体・都市計画担当（発注者）の立場で書いた
  令和3〜7年度 過去問 + R8 予想問題集セット。

  R3（データ利活用）・R4（DX推進）・R5（SWOT）・
  R6（カーボンニュートラル）・R7（少子高齢化）の
  過去問 5 年分は、いずれも立地適正化計画・コンパクトシティ版と
  市街地再開発・駅前整備版の A 案／B 案 2 バージョン
  併記。R8 予想は気候変動適応・資源循環を予想問題ごとに2記事化（各 A 案／B 案 併記）。
  各記事に解答対象の設問全文を再掲し、5 管理間トレードオフを
  論じた 3,000 字級フル論文 + 採点者視点の詳細解説を収録。

appealPoint: |
  地方公共団体・都市計画担当（発注者）の立場で書いた、令和3〜7年度 過去問＋R8予想問題
  のセットです。都市及び地方計画分野の合格者が、実際の行政経験を活かして執筆しています。

  過去問5年分は、立地適正化計画（制度運用）版と市街地再開発（事業整備）版の
  A案／B案2バージョンを併記。発注者・行政官ならどちらの設定でも自分の業務に
  重ねやすくしています。各記事に設問全文を再掲し、5管理間トレードオフを論じた
  3,000字級フル論文＋採点者視点の詳細解説を収録。
  R8予想は気候変動適応・資源循環を予想問題ごと2記事（各A/B案）で収録、計7記事です。

