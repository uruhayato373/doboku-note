title: "技術士 総監｜記述式 模範論文（自治体 道路担当・R3-R7 + R8予想）"
description: |
  地方公共団体・道路担当（発注者）の立場で書いた
  令和3〜7年度 過去問 + R8 予想問題集セット。

  R3（データ利活用）・R4（DX推進）・R5（SWOT）・
  R6（カーボンニュートラル）・R7（少子高齢化）の
  過去問 5 年分は、いずれも橋梁長寿命化（維持管理）版と
