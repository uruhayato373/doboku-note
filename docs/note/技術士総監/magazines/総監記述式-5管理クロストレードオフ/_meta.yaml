title: "技術士 総監｜記述式 5管理クロス・トレードオフ全網羅（20セル・白書連動）"
description: |
  技術士総合技術監理部門の記述式は、5管理（経済性・人的資源・情報・安全・
  社会環境）が衝突する局面で全体最適を導けるかを問う。本マガジンは、主役と
  なる管理ごとに「その管理 × 他4管理」のトレードオフを 20 セルすべて網羅し、
  各セルを《核 vs 核 → 典型場面 → 白書事例 → 解決策（総監的アプローチ）→
  関連過去問 → 答案ひな型》の6要素で統一して整理する。

  国土交通白書 R7・交通政策白書 R7 の具体事例（八潮市下水道陥没・名古屋港
  サイバー攻撃・成瀬ダム自動施工・群マネ・ウォーターPPP 等）を各セルに紐づけ、
  「どんなお題が来ても、覚えた20セルから対立構造と解決策を引き出せる」状態を
  つくることを狙う。

  5記事構成（安全 / 経済性 / 情報 / 人的資源 / 社会環境 を主役とする各4セル）。
  トレードオフ思考の土台（5管理の核・解決フレーム辞書・残余リスク締めの定型・
  20セル俯瞰マトリクス）は無料の序章で解説する。

