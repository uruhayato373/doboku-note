  <text x="188" y="808" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Yu Gothic, Noto Sans JP, sans-serif" font-size="28" fill="#f0c040" text-anchor="middle">&#9733;</text>
  <!-- 行 5: 右カード（やること） -->
  <rect x="352" y="788" width="800" height="136" rx="8" fill="#1a3a5c" stroke="#1a3a5c" stroke-width="2"/>
