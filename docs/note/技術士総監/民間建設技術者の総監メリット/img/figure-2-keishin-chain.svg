<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <rect width="1200" height="560" fill="#f8fafc"/>

  <text x="600" y="64" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Yu Gothic, Noto Sans JP, sans-serif" font-size="34" font-weight="800" fill="#222222" text-anchor="middle">経審Z点が「手当の財源」になる連鎖</text>
  <text x="600" y="104" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Yu Gothic, Noto Sans JP, sans-serif" font-size="22" font-weight="400" fill="#555555" text-anchor="middle">総監（建設）の加点が、入札ランク → 受注 → 手当へとつながる</text>

  <rect x="32" y="178" width="263" height="300" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="2"/>
  <rect x="32" y="178" width="263" height="56" rx="8" fill="#2e6da4"/>
  <rect x="32" y="226" width="263" height="8" fill="#2e6da4"/>
  <text x="163.5" y="215" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Yu Gothic, Noto Sans JP, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">① 総監（建設）保有</text>
  <text x="163.5" y="310" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Yu Gothic, Noto Sans JP, sans-serif" font-size="27" font-weight="800" fill="#1a3a5c" text-anchor="middle">Z点 +5点</text>
  <line x1="54" y1="340" x2="273" y2="340" stroke="#2e6da4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="163.5" y="383" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Yu Gothic, Noto Sans JP, sans-serif" font-size="20" font-weight="400" fill="#555555" text-anchor="middle">監理技術者講習修了で6点</text>
  <text x="163.5" y="423" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Yu Gothic, Noto Sans JP, sans-serif" font-size="22" font-weight="800" fill="#1a3a5c" text-anchor="middle">最高評価区分の加点</text>

  <line x1="296" y1="328" x2="314" y2="328" stroke="#222222" stroke-width="4" stroke-linecap="round"/>
  <polygon points="323,328 309, 315 309,341" fill="#222222"/>
  <rect x="323" y="178" width="263" height="300" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="2"/>
  <rect x="323" y="178" width="263" height="56" rx="8" fill="#2e6da4"/>
  <rect x="323" y="226" width="263" height="8" fill="#2e6da4"/>
  <text x="454.5" y="215" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Yu Gothic, Noto Sans JP, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">② P点アップ</text>
  <text x="454.5" y="310" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Yu Gothic, Noto Sans JP, sans-serif" font-size="27" font-weight="800" fill="#1a3a5c" text-anchor="middle">入札ランク↑</text>
  <line x1="345" y1="340" x2="564" y2="340" stroke="#2e6da4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="454.5" y="383" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Yu Gothic, Noto Sans JP, sans-serif" font-size="20" font-weight="400" fill="#555555" text-anchor="middle">Z点はP点の約25%</text>
  <text x="454.5" y="423" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Yu Gothic, Noto Sans JP, sans-serif" font-size="22" font-weight="800" fill="#1a3a5c" text-anchor="middle">参加できる工事が拡大</text>

  <line x1="587" y1="328" x2="605" y2="328" stroke="#222222" stroke-width="4" stroke-linecap="round"/>
  <polygon points="614,328 600, 315 600,341" fill="#222222"/>
  <rect x="614" y="178" width="263" height="300" rx="8" fill="#e6f1e8" stroke="#3a7d44" stroke-width="2"/>
