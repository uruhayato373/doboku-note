  <text x="1036.5" y="310" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Yu Gothic, Noto Sans JP, sans-serif" font-size="27" font-weight="800" fill="#8c5a14" text-anchor="middle">手当の原資</text>
  <line x1="927" y1="340" x2="1146" y2="340" stroke="#c87e1e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="1036.5" y="383" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Yu Gothic, Noto Sans JP, sans-serif" font-size="20" font-weight="400" fill="#555555" text-anchor="middle">受注増が会社の利益に</text>
  <text x="1036.5" y="423" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Yu Gothic, Noto Sans JP, sans-serif" font-size="22" font-weight="800" fill="#8c5a14" text-anchor="middle">資格手当を払える</text>

    <text x="1172" y="538" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Yu Gothic, Noto Sans JP, sans-serif" font-size="18" font-weight="500" fill="#8a8a8a" text-anchor="end">doboku-note.com</text>
