  <rect x="614" y="226" width="263" height="8" fill="#3a7d44"/>
  <text x="745.5" y="215" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Yu Gothic, Noto Sans JP, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">③ 受注規模の拡大</text>
  <text x="745.5" y="310" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Yu Gothic, Noto Sans JP, sans-serif" font-size="27" font-weight="800" fill="#1a5c2e" text-anchor="middle">大型工事に参加</text>
  <line x1="636" y1="340" x2="855" y2="340" stroke="#3a7d44" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="745.5" y="383" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Yu Gothic, Noto Sans JP, sans-serif" font-size="20" font-weight="400" fill="#555555" text-anchor="middle">監理技術者の専任配置も充足</text>
  <text x="745.5" y="423" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Yu Gothic, Noto Sans JP, sans-serif" font-size="22" font-weight="800" fill="#1a5c2e" text-anchor="middle">受注機会が増える</text>

  <line x1="878" y1="328" x2="896" y2="328" stroke="#222222" stroke-width="4" stroke-linecap="round"/>
  <polygon points="905,328 891, 315 891,341" fill="#222222"/>
  <rect x="905" y="178" width="263" height="300" rx="8" fill="#fdf2e0" stroke="#c87e1e" stroke-width="2"/>
