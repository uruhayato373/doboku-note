<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="638" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Yu Gothic, Noto Sans JP, sans-serif">
  
  <text x="40" y="60" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Yu Gothic, Noto Sans JP, sans-serif" font-size="32" font-weight="800" fill="#222222">知的財産権 存続期間比較</text>
  <text x="40" y="96" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Yu Gothic, Noto Sans JP, sans-serif" font-size="22" fill="#555555">産業財産権4法 + 著作権</text>
  
    <text x="384" y="159" text-anchor="end" font-size="22" font-weight="700" fill="#222222">特許権</text>
    <rect x="400" y="130" width="211.42857142857142" height="42" rx="6" fill="#2e6da4"/>
    <text x="623.4285714285714" y="159" font-size="20" font-weight="600" fill="#2e6da4">出願から20年</text>
    <text x="400" y="190" font-size="18" fill="#8a8a8a">医薬品等は5年延長可</text>
    <text x="384" y="233" text-anchor="end" font-size="22" font-weight="700" fill="#222222">実用新案権</text>
    <rect x="400" y="204" width="105.71428571428571" height="42" rx="6" fill="#3a7d44"/>
    <text x="517.7142857142858" y="233" font-size="20" font-weight="600" fill="#3a7d44">出願から10年</text>
    <text x="400" y="264" font-size="18" fill="#8a8a8a">無審査主義（早期登録）</text>
    <text x="384" y="307" text-anchor="end" font-size="22" font-weight="700" fill="#222222">意匠権</text>
    <rect x="400" y="278" width="264.2857142857143" height="42" rx="6" fill="#d4a017"/>
    <text x="676.2857142857142" y="307" font-size="20" font-weight="600" fill="#d4a017">出願から25年</text>
    <text x="400" y="338" font-size="18" fill="#8a8a8a">2020年改正。秘密意匠制度あり</text>
    <text x="384" y="381" text-anchor="end" font-size="22" font-weight="700" fill="#222222">商標権</text>
    <rect x="400" y="352" width="105.71428571428571" height="42" rx="6" fill="#b22234"/>
    <text x="517.7142857142858" y="381" font-size="20" font-weight="600" fill="#b22234">登録から10年</text>
    <text x="400" y="412" font-size="18" fill="#8a8a8a">更新登録で実質無期限</text>
    <text x="384" y="455" text-anchor="end" font-size="22" font-weight="700" fill="#222222">著作権</text>
    <rect x="400" y="426" width="740" height="42" rx="6" fill="#1a3a5c"/>
    <text x="1190" text-anchor="end" y="455" font-size="20" font-weight="600" fill="#ffffff">死後70年</text>
    <text x="400" y="486" font-size="18" fill="#8a8a8a">創作時に自動発生（登録不要）</text>
  <text x="40" y="530" font-size="18" fill="#555555">産業財産権（特許・実用新案・意匠・商標）は登録が必要。著作権は登録不要で創作時に自動発生。</text>
  <text x="40" y="558" font-size="18" fill="#b22234">商標権は更新登録により実質的に無期限。唯一の更新可能な産業財産権。</text>
  
</svg>