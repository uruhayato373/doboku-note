title: "技術士 総監｜記述式 模範論文（道路発注者・R5-R7 + R8予想）"
description: |
  地方公共団体・道路発注者の立場で書いた
  令和5〜7年度 過去問 + R8 予想問題集セット。

  R7（少子高齢化）・R6（カーボンニュートラル）は
  橋梁長寿命化版とバイパス整備版の 2 バージョン併記、
  R5（SWOT）は道路維持管理組織版、
  R8 予想は気候変動適応 + 資源循環の 2 本フル解答の
  合計 7 本フル論文。各年度に A 案 vs B 案 の試験本番
  選択判断表を併設。5 管理間トレードオフを論じた
  3,000 字級フル論文 + 採点者視点の詳細解説 +
  試験当日の管理対象選択フロー。

