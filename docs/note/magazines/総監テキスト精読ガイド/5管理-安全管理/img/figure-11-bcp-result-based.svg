  <text x="80" y="706" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Yu Gothic, Noto Sans JP, sans-serif" font-size="22" font-weight="600" fill="#222222">BCM の本質：原因より結果に着目すれば、原因を問わず汎用的に対応できる。R5 Ⅰ-1-31 の核心。</text>

