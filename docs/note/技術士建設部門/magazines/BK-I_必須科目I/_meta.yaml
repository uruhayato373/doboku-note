description: |
  技術士第二次試験 建設部門 必須科目I の令和3〜7年度 過去問 5 年分を、
  元公務員（発注者）視点でフル解答したセット。必須科目I は専門分野に依存せず
  全受験者が解答する最重要科目。各年度に設問全文（出典明記）を再掲し、
  設問構成と論述方針・約1,500〜1,650字のフル模範解答・採点者が見るポイントを収録。
appealPoint: |
  技術士第二次試験 建設部門で全受験者必須の「必須科目I」を、令和3〜7年度の
  5年分まとめたセットです。元・地方自治体の土木職（発注者）として全分野の
  工事発注・監督・積算審査に携わった筆者が、受注者側に偏りがちな論述へ
  「発注者視点の採点軸（安全・品質・コスト・環境の統合判断、住民対応、行政責任）」
  を補います。各年度に設問全文を再掲し、設問の問い分解 → 多面的な論点の絞り込み
  →「現状→課題→解決策→効果・リスク」の骨格で組み立てたフル模範解答を収録。
  1年あたり約396円（5年分セット）。
