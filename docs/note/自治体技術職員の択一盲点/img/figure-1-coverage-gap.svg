  <!-- テーブルデータ行 -->
  <!-- 行 1: 経済性管理 -->
  <rect x="40" y="218" width="1120" height="90" fill="#fbe6e9"/>
  <line x1="226" y1="218" x2="226" y2="308" stroke="#dde1e7" stroke-width="1"/>
  <line x1="614" y1="218" x2="614" y2="308" stroke="#dde1e7" stroke-width="1"/>
  <line x1="786" y1="218" x2="786" y2="308" stroke="#dde1e7" stroke-width="1"/>
