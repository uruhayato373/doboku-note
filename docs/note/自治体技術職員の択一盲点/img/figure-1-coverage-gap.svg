  <line x1="226" y1="578" x2="226" y2="668" stroke="#dde1e7" stroke-width="1"/>
  <line x1="614" y1="578" x2="614" y2="668" stroke="#dde1e7" stroke-width="1"/>
  <line x1="786" y1="578" x2="786" y2="668" stroke="#dde1e7" stroke-width="1"/>
