  <text x="976" y="632" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Yu Gothic, Noto Sans JP, sans-serif" font-size="22" font-weight="400" fill="#8a8a8a" text-anchor="middle">—</text>
