  <!-- 凡例 -->
  <rect x="40" y="696" width="18" height="18" rx="3" fill="#fbe6e9" stroke="#b22234" stroke-width="1.5"/>
  <text x="66" y="710" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Yu Gothic, Noto Sans JP, sans-serif" font-size="20" font-weight="400" fill="#8a8a8a" text-anchor="start">= 発注者の盲点（実務から遠い分野）</text>

    <text x="1172" y="726" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Yu Gothic, Noto Sans JP, sans-serif" font-size="18" font-weight="500" fill="#8a8a8a" text-anchor="end">doboku-note.com</text>
