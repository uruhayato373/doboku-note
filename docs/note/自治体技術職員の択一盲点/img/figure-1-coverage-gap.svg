  <text x="700" y="362" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Yu Gothic, Noto Sans JP, sans-serif" font-size="26" font-weight="700" fill="#2e6da4" text-anchor="middle">8問</text>
