<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect x="0" y="0" width="1080" height="1350" rx="0" fill="#ffffff" />
<rect x="80" y="60" width="220" height="64" rx="32" fill="#3a7d44" />
  <text x="190" y="92" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">核心の図解</text>
  <g transform="translate(180, 270) scale(1.894736842105263)">
  <text x="190" y="22" text-anchor="middle" font-size="14" fill="#222" font-family="sans-serif" font-weight="bold">フロントローディングの本質</text>
  <text x="190" y="40" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">投入リソースを上流に前倒しする</text>

  <g>
    <rect x="20" y="60" width="14" height="14" fill="#8a8a8a"/>
