  </g>

  <text x="200" y="312" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">← 上流（自由度・低コスト）　　下流（拘束・高コスト）→</text>

  <g>
    <rect x="40" y="328" width="320" height="44" fill="none" stroke="#3a7d44" stroke-width="1.5" stroke-dasharray="6,3" rx="4"/>
    <text x="200" y="346" text-anchor="middle" font-size="12" fill="#3a7d44" font-family="sans-serif" font-weight="bold">前倒し投入で後工程の手戻りコストを削減</text>
    <text x="200" y="364" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">設計段階で品質・コストの 8 割が決まる（ものづくり白書 2020）</text>
  </g>
</g>
  <rect x="80" y="1080" width="920" height="110" rx="16" fill="#e8f0fe" />
  <text x="540" y="1115" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif" font-size="30" font-weight="700" fill="#1a3a5c" text-anchor="middle">上流投入で下流の手戻り削減</text>
  <text x="1040" y="1318" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif" font-size="24" font-weight="400" fill="#8a8a8a" text-anchor="end">doboku-note.com</text>
