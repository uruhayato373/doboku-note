    <text x="370" y="286" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">製造・品質・保全・調達などが参加し、設計の妥当性を確認</text>
  </g>

  <text x="360" y="316" text-anchor="middle" font-size="10" fill="#555" font-family="sans-serif">抽象 ─────────────── 設計の具体度 ─────────────── 具体</text>
</g>
  <rect x="80" y="1080" width="920" height="110" rx="16" fill="#e8f0fe" />
  <text x="540" y="1115" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif" font-size="30" font-weight="700" fill="#1a3a5c" text-anchor="middle">DR0 → DR4 で抽象から具体へ</text>
  <text x="1040" y="1318" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif" font-size="24" font-weight="400" fill="#8a8a8a" text-anchor="end">doboku-note.com</text>
