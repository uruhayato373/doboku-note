    <text x="370" y="125" text-anchor="middle" font-size="14" fill="#1a3a5c" font-family="sans-serif" font-weight="bold">DR2</text>
    <text x="370" y="146" text-anchor="middle" font-size="12" fill="#222" font-family="sans-serif">詳細設計</text>
