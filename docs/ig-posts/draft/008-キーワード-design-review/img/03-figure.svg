<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect x="0" y="0" width="1080" height="1350" rx="0" fill="#ffffff" />
<rect x="80" y="60" width="220" height="64" rx="32" fill="#3a7d44" />
  <text x="190" y="92" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">核心の図解</text>
  <g transform="translate(80.00000000000006, 425.55555555555554) scale(1.2777777777777777)">
  <text x="360" y="24" text-anchor="middle" font-size="14" fill="#222" font-family="sans-serif" font-weight="bold">デザインレビューの実施段階（DR0 〜 DR4）</text>

