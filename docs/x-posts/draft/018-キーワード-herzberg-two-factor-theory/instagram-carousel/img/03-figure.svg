<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect x="0" y="0" width="1080" height="1350" rx="0" fill="#ffffff" />
<rect x="80" y="60" width="220" height="64" rx="32" fill="#3a7d44" />
  <text x="190" y="92" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">核心の図解</text>
  <g transform="translate(180, 270) scale(1.894736842105263)">
  <text x="190" y="22" text-anchor="middle" font-size="14" fill="#222" font-family="sans-serif" font-weight="bold">ハーズバーグの二要因理論</text>
  <text x="190" y="40" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">満足と不満足は別々の要因で生じる</text>

  <g>
    <rect x="20" y="58" width="160" height="280" fill="#d0e8d0" stroke="#3a7d44" stroke-width="2" rx="6"/>
    <text x="100" y="82" text-anchor="middle" font-size="13" fill="#1a3a5c" font-family="sans-serif" font-weight="bold">動機づけ要因</text>
    <text x="100" y="100" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">（仕事の内容）</text>

    <line x1="40" y1="112" x2="160" y2="112" stroke="#3a7d44" stroke-width="1"/>

    <text x="100" y="132" text-anchor="middle" font-size="11" fill="#222" font-family="sans-serif">達成感</text>
    <text x="100" y="150" text-anchor="middle" font-size="11" fill="#222" font-family="sans-serif">承認</text>
    <text x="100" y="168" text-anchor="middle" font-size="11" fill="#222" font-family="sans-serif">仕事そのもの</text>
    <text x="100" y="186" text-anchor="middle" font-size="11" fill="#222" font-family="sans-serif">責任</text>
    <text x="100" y="204" text-anchor="middle" font-size="11" fill="#222" font-family="sans-serif">成長・昇進</text>

    <line x1="40" y1="220" x2="160" y2="220" stroke="#3a7d44" stroke-width="1" stroke-dasharray="3,3"/>

    <text x="100" y="240" text-anchor="middle" font-size="11" fill="#3a7d44" font-family="sans-serif" font-weight="bold">充足 → 積極的満足</text>
    <text x="100" y="262" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">不足でも</text>
    <text x="100" y="276" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">強い不満は出ない</text>

    <line x1="40" y1="294" x2="160" y2="294" stroke="#3a7d44" stroke-width="1" stroke-dasharray="3,3"/>

    <text x="100" y="314" text-anchor="middle" font-size="11" fill="#222" font-family="sans-serif">マズロー対応:</text>
    <text x="100" y="330" text-anchor="middle" font-size="11" fill="#1a3a5c" font-family="sans-serif">自己実現・承認</text>
  </g>

  <g>
    <rect x="200" y="58" width="160" height="280" fill="#fff3cd" stroke="#d4a017" stroke-width="2" rx="6"/>
    <text x="280" y="82" text-anchor="middle" font-size="13" fill="#1a3a5c" font-family="sans-serif" font-weight="bold">衛生要因</text>
    <text x="280" y="100" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">（仕事の環境・条件）</text>

    <line x1="220" y1="112" x2="340" y2="112" stroke="#d4a017" stroke-width="1"/>

    <text x="280" y="132" text-anchor="middle" font-size="11" fill="#222" font-family="sans-serif">会社方針・管理</text>
    <text x="280" y="150" text-anchor="middle" font-size="11" fill="#222" font-family="sans-serif">監督</text>
    <text x="280" y="168" text-anchor="middle" font-size="11" fill="#222" font-family="sans-serif">給与</text>
    <text x="280" y="186" text-anchor="middle" font-size="11" fill="#222" font-family="sans-serif">人間関係</text>
    <text x="280" y="204" text-anchor="middle" font-size="11" fill="#222" font-family="sans-serif">作業条件</text>

    <line x1="220" y1="220" x2="340" y2="220" stroke="#d4a017" stroke-width="1" stroke-dasharray="3,3"/>

    <text x="280" y="240" text-anchor="middle" font-size="11" fill="#d4a017" font-family="sans-serif" font-weight="bold">充足 → 不満解消</text>
    <text x="280" y="262" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">不足すると</text>
    <text x="280" y="276" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">強い不満</text>

    <line x1="220" y1="294" x2="340" y2="294" stroke="#d4a017" stroke-width="1" stroke-dasharray="3,3"/>

    <text x="280" y="314" text-anchor="middle" font-size="11" fill="#222" font-family="sans-serif">マズロー対応:</text>
    <text x="280" y="330" text-anchor="middle" font-size="11" fill="#1a3a5c" font-family="sans-serif">社会・安全・生理</text>
  </g>

  <text x="190" y="358" text-anchor="middle" font-size="11" fill="#3a7d44" font-family="sans-serif" font-weight="bold">職務充実（job enrichment）で動機づけを強化</text>
  <text x="190" y="372" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">衛生要因の改善は不満解消にとどまる</text>
</g>
  <rect x="80" y="1080" width="920" height="110" rx="16" fill="#e8f0fe" />
  <text x="540" y="1115" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif" font-size="30" font-weight="700" fill="#1a3a5c" text-anchor="middle">動機づけ要因 vs 衛生要因の対比</text>
  <text x="1040" y="1318" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif" font-size="24" font-weight="400" fill="#8a8a8a" text-anchor="end">doboku-note.com</text>
</svg>