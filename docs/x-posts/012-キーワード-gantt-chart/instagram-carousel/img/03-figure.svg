<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect x="0" y="0" width="1080" height="1350" rx="0" fill="#ffffff" />
<rect x="80" y="60" width="220" height="64" rx="32" fill="#3a7d44" />
  <text x="190" y="92" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">核心の図解</text>
  <g transform="translate(112.5, 270) scale(2.25)">
  <text x="190" y="22" text-anchor="middle" font-size="14" fill="#222" font-family="sans-serif" font-weight="bold">ガントチャートの構成</text>
  <text x="190" y="40" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">横軸=時間 / 縦軸=作業項目 / バー=期間と進捗</text>

  <line x1="100" y1="60" x2="360" y2="60" stroke="#222" stroke-width="1.5"/>
  <text x="100" y="55" text-anchor="middle" font-size="11" fill="#222" font-family="sans-serif">第1週</text>
  <text x="165" y="55" text-anchor="middle" font-size="11" fill="#222" font-family="sans-serif">第2週</text>
  <text x="230" y="55" text-anchor="middle" font-size="11" fill="#222" font-family="sans-serif">第3週</text>
  <text x="295" y="55" text-anchor="middle" font-size="11" fill="#222" font-family="sans-serif">第4週</text>
  <text x="360" y="55" text-anchor="end" font-size="11" fill="#222" font-family="sans-serif">第5週</text>

  <line x1="100" y1="60" x2="100" y2="270" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="165" y1="60" x2="165" y2="270" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="230" y1="60" x2="230" y2="270" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="295" y1="60" x2="295" y2="270" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="360" y1="60" x2="360" y2="270" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="20" y="90" font-size="11" fill="#222" font-family="sans-serif">設計</text>
  <rect x="100" y="80" width="100" height="14" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="0.5"/>
  <rect x="100" y="80" width="100" height="14" fill="#2e6da4"/>

  <text x="20" y="120" font-size="11" fill="#222" font-family="sans-serif">調達</text>
  <rect x="135" y="110" width="100" height="14" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="0.5"/>
  <rect x="135" y="110" width="80" height="14" fill="#2e6da4"/>

  <text x="20" y="150" font-size="11" fill="#222" font-family="sans-serif">試作</text>
  <rect x="200" y="140" width="100" height="14" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="0.5"/>
  <rect x="200" y="140" width="40" height="14" fill="#2e6da4"/>

  <text x="20" y="180" font-size="11" fill="#222" font-family="sans-serif">評価</text>
  <rect x="265" y="170" width="65" height="14" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="0.5"/>

  <text x="20" y="210" font-size="11" fill="#222" font-family="sans-serif">出荷</text>
  <rect x="330" y="200" width="30" height="14" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="0.5"/>

  <polygon points="240,225 234,235 246,235" fill="#d4a017" stroke="#222" stroke-width="0.5"/>
  <text x="240" y="246" text-anchor="middle" font-size="11" fill="#d4a017" font-family="sans-serif" font-weight="bold">マイルストーン</text>

  <line x1="240" y1="60" x2="240" y2="220" stroke="#b22234" stroke-width="2"/>
  <text x="252" y="220" font-size="11" fill="#b22234" font-family="sans-serif" font-weight="bold">現在</text>

  <g>
    <rect x="20" y="270" width="80" height="14" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="0.5"/>
    <text x="105" y="281" font-size="11" fill="#222" font-family="sans-serif">計画</text>
    <rect x="140" y="270" width="80" height="14" fill="#2e6da4"/>
    <text x="225" y="281" font-size="11" fill="#222" font-family="sans-serif">実績（進捗）</text>
  </g>

  <text x="190" y="310" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">作業間の先行・後続関係は表現しにくい</text>
</g>
  <rect x="80" y="1080" width="920" height="110" rx="16" fill="#e8f0fe" />
  <text x="540" y="1115" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif" font-size="30" font-weight="700" fill="#1a3a5c" text-anchor="middle">計画 vs 実績を同じ時間軸で並べる</text>
  <text x="1040" y="1318" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif" font-size="24" font-weight="400" fill="#8a8a8a" text-anchor="end">doboku-note.com</text>
</svg>