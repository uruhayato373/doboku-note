      <text x="432.8752214814998" y="199.8284447890657" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Yu Gothic, Noto Sans JP, sans-serif" font-size="19" fill="#555555" text-anchor="middle">地域・発注者との</text><text x="432.8752214814998" y="225.8284447890657" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Yu Gothic, Noto Sans JP, sans-serif" font-size="19" fill="#555555" text-anchor="middle">工程合意・説明責任</text>
    

