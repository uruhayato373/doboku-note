<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200">
  <!-- 保全活動 (root) -->
  <rect x="10" y="80" width="70" height="36" rx="3" fill="none" stroke="#333" stroke-width="1.2"/>
  <text x="45" y="103" text-anchor="middle" font-size="11" fill="#333" font-family="sans-serif">保全活動</text>

  <!-- Branch from root -->
  <line x1="80" y1="98" x2="110" y2="98" stroke="#333" stroke-width="1.2"/>
  <line x1="110" y1="55" x2="110" y2="140" stroke="#333" stroke-width="1.2"/>

  <!-- 維持活動 -->
  <line x1="110" y1="55" x2="150" y2="55" stroke="#333" stroke-width="1.2"/>
  <rect x="150" y="38" width="70" height="36" rx="3" fill="none" stroke="#333" stroke-width="1.2"/>
  <text x="185" y="61" text-anchor="middle" font-size="11" fill="#333" font-family="sans-serif">維持活動</text>

  <!-- from 維持活動 -->
  <line x1="220" y1="56" x2="250" y2="56" stroke="#333" stroke-width="1.2"/>
  <line x1="250" y1="30" x2="250" y2="82" stroke="#333" stroke-width="1.2"/>

  <!-- ①予防保全 -->
  <line x1="250" y1="30" x2="290" y2="30" stroke="#333" stroke-width="1.2"/>
  <rect x="290" y="15" width="70" height="26" rx="2" fill="none" stroke="#333" stroke-width="1"/>
  <text x="325" y="32" text-anchor="middle" font-size="10" fill="#333" font-family="sans-serif">①予防保全</text>
  <!-- from ①予防保全 -->
  <line x1="360" y1="28" x2="390" y2="28" stroke="#333" stroke-width="1"/>
  <line x1="390" y1="14" x2="390" y2="42" stroke="#333" stroke-width="1"/>
  <line x1="390" y1="14" x2="420" y2="14" stroke="#333" stroke-width="1"/>
  <rect x="420" y="4" width="50" height="20" rx="2" fill="none" stroke="#888" stroke-width="0.8"/>
  <text x="445" y="18" text-anchor="middle" font-size="9" fill="#333" font-family="sans-serif">③定期保全</text>
  <line x1="390" y1="42" x2="420" y2="42" stroke="#333" stroke-width="1"/>
  <rect x="420" y="32" width="50" height="20" rx="2" fill="none" stroke="#888" stroke-width="0.8"/>
  <text x="445" y="46" text-anchor="middle" font-size="9" fill="#333" font-family="sans-serif">④予知保全</text>

  <!-- ②事後保全 -->
  <line x1="250" y1="82" x2="290" y2="82" stroke="#333" stroke-width="1.2"/>
  <rect x="290" y="68" width="70" height="26" rx="2" fill="none" stroke="#333" stroke-width="1"/>
  <text x="325" y="85" text-anchor="middle" font-size="10" fill="#333" font-family="sans-serif">②事後保全</text>

  <!-- 改善活動 -->
  <line x1="110" y1="140" x2="150" y2="140" stroke="#333" stroke-width="1.2"/>
  <rect x="150" y="123" width="70" height="36" rx="3" fill="none" stroke="#333" stroke-width="1.2"/>
  <text x="185" y="146" text-anchor="middle" font-size="11" fill="#333" font-family="sans-serif">改善活動</text>

  <!-- from 改善活動 -->
  <line x1="220" y1="141" x2="250" y2="141" stroke="#333" stroke-width="1.2"/>
  <line x1="250" y1="121" x2="250" y2="161" stroke="#333" stroke-width="1.2"/>

  <!-- ⑤改良保全 -->
  <line x1="250" y1="121" x2="290" y2="121" stroke="#333" stroke-width="1.2"/>
  <rect x="290" y="108" width="70" height="26" rx="2" fill="none" stroke="#333" stroke-width="1"/>
  <text x="325" y="125" text-anchor="middle" font-size="10" fill="#333" font-family="sans-serif">⑤改良保全</text>

  <!-- ⑥保全予防 -->
  <line x1="250" y1="161" x2="290" y2="161" stroke="#333" stroke-width="1.2"/>
  <rect x="290" y="148" width="70" height="26" rx="2" fill="none" stroke="#333" stroke-width="1"/>
  <text x="325" y="165" text-anchor="middle" font-size="10" fill="#333" font-family="sans-serif">⑥保全予防</text>
</svg>
