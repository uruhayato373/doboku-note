<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <!-- Axes -->
  <line x1="40" y1="180" x2="380" y2="180" stroke="#333" stroke-width="1.5"/>
  <line x1="40" y1="20" x2="40" y2="180" stroke="#333" stroke-width="1.5"/>
  <text x="210" y="200" text-anchor="middle" font-size="11" fill="#333" font-family="sans-serif">時間</text>
  <text x="20" y="100" text-anchor="middle" font-size="11" fill="#333" font-family="sans-serif" transform="rotate(-90,20,100)">故障率</text>

  <!-- Bathtub curve -->
  <path d="M 40 40 Q 60 140 100 155 Q 160 165 220 158 Q 270 155 320 120 Q 350 90 375 50" fill="none" stroke="#333" stroke-width="2"/>

  <!-- Vertical dashed dividers -->
  <line x1="130" y1="30" x2="130" y2="180" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="290" y1="30" x2="290" y2="180" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Section labels -->
  <text x="85" y="195" text-anchor="middle" font-size="10" fill="#333" font-family="sans-serif">初期</text>
  <text x="85" y="208" text-anchor="middle" font-size="10" fill="#333" font-family="sans-serif">故障期</text>
  <text x="210" y="195" text-anchor="middle" font-size="10" fill="#333" font-family="sans-serif">偶発故障期</text>
  <text x="335" y="195" text-anchor="middle" font-size="10" fill="#333" font-family="sans-serif">摩耗故障期</text>
</svg>
