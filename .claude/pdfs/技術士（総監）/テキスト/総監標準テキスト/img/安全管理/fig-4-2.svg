<svg viewBox="0 0 380 220" xmlns="http://www.w3.org/2000/svg" style="max-width:380px;width:100%;font-family:sans-serif;font-size:13px;">
  <!-- Title row: 影響度 -->
  <rect x="80" y="0" width="300" height="30" fill="#d0d8e8" stroke="#555" stroke-width="1"/>
  <text x="230" y="20" text-anchor="middle" font-weight="bold">影響度</text>
  <!-- Sub-header: 小、中、大 -->
  <rect x="80" y="30" width="100" height="30" fill="#e8ecf8" stroke="#555" stroke-width="1"/>
  <rect x="180" y="30" width="100" height="30" fill="#e8ecf8" stroke="#555" stroke-width="1"/>
  <rect x="280" y="30" width="100" height="30" fill="#e8ecf8" stroke="#555" stroke-width="1"/>
  <text x="130" y="50" text-anchor="middle">小</text>
  <text x="230" y="50" text-anchor="middle">中</text>
  <text x="330" y="50" text-anchor="middle">大</text>
  <!-- Left column: 生起確率 -->
  <rect x="0" y="0" width="80" height="60" fill="#d0d8e8" stroke="#555" stroke-width="1"/>
  <text x="40" y="25" text-anchor="middle" font-weight="bold">生起</text>
  <text x="40" y="42" text-anchor="middle" font-weight="bold">確率</text>
  <!-- Row 高 -->
  <rect x="0" y="60" width="80" height="50" fill="#e8ecf8" stroke="#555" stroke-width="1"/>
  <text x="40" y="90" text-anchor="middle">高</text>
  <rect x="80" y="60" width="100" height="50" fill="#fffbe6" stroke="#555" stroke-width="1"/>
  <text x="130" y="90" text-anchor="middle">中 or 低</text>
  <rect x="180" y="60" width="100" height="50" fill="#ffd6d6" stroke="#555" stroke-width="1"/>
  <text x="230" y="90" text-anchor="middle">高</text>
  <rect x="280" y="60" width="100" height="50" fill="#ffd6d6" stroke="#555" stroke-width="1"/>
  <text x="330" y="90" text-anchor="middle">高</text>
  <!-- Row 中 -->
  <rect x="0" y="110" width="80" height="50" fill="#e8ecf8" stroke="#555" stroke-width="1"/>
  <text x="40" y="140" text-anchor="middle">中</text>
  <rect x="80" y="110" width="100" height="50" fill="#e8f8e8" stroke="#555" stroke-width="1"/>
  <text x="130" y="140" text-anchor="middle">低</text>
  <rect x="180" y="110" width="100" height="50" fill="#fffbe6" stroke="#555" stroke-width="1"/>
  <text x="230" y="140" text-anchor="middle">高 or 中</text>
  <rect x="280" y="110" width="100" height="50" fill="#ffd6d6" stroke="#555" stroke-width="1"/>
  <text x="330" y="140" text-anchor="middle">高</text>
  <!-- Row 低 -->
  <rect x="0" y="160" width="80" height="50" fill="#e8ecf8" stroke="#555" stroke-width="1"/>
  <text x="40" y="190" text-anchor="middle">低</text>
  <rect x="80" y="160" width="100" height="50" fill="#e8f8e8" stroke="#555" stroke-width="1"/>
  <text x="130" y="190" text-anchor="middle">低</text>
  <rect x="180" y="160" width="100" height="50" fill="#fffbe6" stroke="#555" stroke-width="1"/>
  <text x="230" y="190" text-anchor="middle">中 or 低</text>
  <rect x="280" y="160" width="100" height="50" fill="#fffbe6" stroke="#555" stroke-width="1"/>
  <text x="330" y="190" text-anchor="middle">高 or 中</text>
</svg>
