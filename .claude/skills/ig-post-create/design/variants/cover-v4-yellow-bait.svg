<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img" aria-label="cover v4 yellow clickbait">
  <style>text{font-family:'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif;}</style>
  <rect width="1080" height="1350" fill="#d4a017"/>
  <text x="1000" y="64" text-anchor="end" font-size="22" font-weight="600" fill="#1a3a5c">1 / 7</text>

  <!-- 大フック「9割」 -->
  <text x="80" y="475" font-size="56" font-weight="700" fill="#1a3a5c">技術士受験生の</text>
  <g>
    <text x="80" y="625" font-size="320" font-weight="900" fill="#b22234" letter-spacing="-8">9割</text>
    <text x="430" y="625" font-size="56" font-weight="700" fill="#1a3a5c">が混同する</text>
  </g>

  <!-- 副題 -->
  <text x="80" y="795" font-size="84" font-weight="900" fill="#1a3a5c" letter-spacing="-2">フォロワーシップ</text>
  <text x="80" y="875" font-size="46" font-weight="700" fill="#1a3a5c">5類型を完全整理</text>

  <!-- 矢印アクセント -->
  <text x="80" y="995" font-size="44" font-weight="700" fill="#b22234">→ スワイプして解説</text>

  <text x="80" y="1262" font-size="30" font-weight="800" fill="#1a3a5c">doboku-note</text>
  <text x="80" y="1298" font-size="20" fill="#1a3a5c">技術士総監キーワード集 2026</text>
</svg>