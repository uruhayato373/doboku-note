  <text x="80" y="1160" font-size="30" font-weight="500" fill="#222">・ 提唱者と背景</text>
  <text x="80" y="1200" font-size="30" font-weight="500" fill="#222">・ 2軸モデルの定義</text>
  <text x="80" y="1240" font-size="30" font-weight="500" fill="#222">・ 5類型と判別ポイント</text>

  <text x="80" y="1298" font-size="22" font-weight="700" fill="#2e6da4">doboku-note</text>
</svg>