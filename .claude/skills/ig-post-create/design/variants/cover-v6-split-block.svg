<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img" aria-label="cover v6 split block">
  <style>text{font-family:'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif;}</style>
  <rect width="1080" height="675" fill="#2e6da4"/>
  <rect y="675" width="1080" height="675" fill="#ffffff"/>
  <text x="1000" y="64" text-anchor="end" font-size="22" fill="#cfdef0">1 / 7</text>

  <!-- 上半分: 大数字 -->
  <text x="80" y="180" font-size="28" font-weight="700" fill="#cfdef0" letter-spacing="3">KEYWORD #31</text>
  <text x="540" y="645" text-anchor="middle" font-size="200" font-weight="900" fill="#ffffff" letter-spacing="-4">5類型</text>

  <!-- 中央オーバーラップカード -->
  <rect x="80" y="585" width="920" height="180" rx="16" fill="#ffffff" stroke="#2e6da4" stroke-width="3"/>
  <text x="540" y="685" text-anchor="middle" font-size="64" font-weight="900" fill="#222">フォロワーシップ</text>
