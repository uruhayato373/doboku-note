<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img" aria-label="cta v3 action">
  <style>text{font-family:'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif;}</style>
  <rect width="1080" height="1350" fill="#1a3a5c"/>
  <text x="1000" y="64" text-anchor="end" font-size="22" fill="#a8c4dc">7 / 7</text>

  <!-- 上部: 価値提示 -->
  <text x="540" y="200" text-anchor="middle" font-size="36" font-weight="700" fill="#d4a017" letter-spacing="3">受験者限定プレゼント</text>

  <text x="540" y="320" text-anchor="middle" font-size="76" font-weight="900" fill="#ffffff">5類型まとめ</text>
  <text x="540" y="400" text-anchor="middle" font-size="76" font-weight="900" fill="#ffffff">PDF を無料配布</text>

  <!-- DM CTA -->
  <rect x="80" y="500" width="920" height="180" rx="20" fill="#d4a017"/>
  <text x="540" y="565" text-anchor="middle" font-size="32" font-weight="700" fill="#1a3a5c">DM で「総監」と送信</text>
  <text x="540" y="615" text-anchor="middle" font-size="44" font-weight="900" fill="#1a3a5c">→ 自動返信で受け取り</text>
  <text x="540" y="660" text-anchor="middle" font-size="22" fill="#1a3a5c">所要 10 秒・登録不要</text>

  <!-- フォロー誘導 -->
  <text x="540" y="800" text-anchor="middle" font-size="36" font-weight="700" fill="#ffffff">＋ プロフから 680 問へ</text>
  <text x="540" y="850" text-anchor="middle" font-size="28" fill="#cfdef0">毎週月曜に新規 5 問追加</text>

  <!-- 3 アクション順序 -->
  <g transform="translate(80, 940)">
    <text x="0" y="0" font-size="26" fill="#a8c4dc" letter-spacing="2">NEXT STEPS</text>
    <text x="0" y="50" font-size="32" fill="#ffffff">1. SAVE  保存して試験前日に</text>
    <text x="0" y="100" font-size="32" fill="#ffffff">2. LIKE  応援を伝える</text>
    <text x="0" y="150" font-size="32" fill="#ffffff">3. DM   「総監」と送信</text>
  </g>

  <text x="80" y="1298" font-size="24" font-weight="700" fill="#d4a017">@doboku.note</text>
</svg>