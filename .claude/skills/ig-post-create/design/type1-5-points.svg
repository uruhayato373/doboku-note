  <rect width="1080" height="1350" fill="#ffffff"/>

  
  <text x="1000" y="64" text-anchor="end" font-size="22" font-weight="500" fill="#8a8a8a">5 / 7</text>
  
  <text x="80" y="120" font-size="26" font-weight="700" fill="#2e6da4" letter-spacing="2">5 TYPES</text>
  <line x1="80" y1="144" x2="160" y2="144" stroke="#2e6da4" stroke-width="3"/>

  <text x="80" y="236" font-size="60" font-weight="800" fill="#222">5つの類型</text>

  
    <g transform="translate(80, 336)">
