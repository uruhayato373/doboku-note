<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img" aria-label="quiz answer">
  <style>
    text { font-family: 'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif; }
  </style>
  <rect width="1080" height="1350" fill="#ffffff"/>

  
  <text x="1000" y="64" text-anchor="end" font-size="22" font-weight="500" fill="#8a8a8a">4 / 5</text>
  
  <text x="80" y="120" font-size="26" font-weight="700" fill="#2e6da4" letter-spacing="2">ANSWER</text>
  <line x1="80" y1="144" x2="160" y2="144" stroke="#2e6da4" stroke-width="3"/>

  <text x="80" y="236" font-size="60" font-weight="800" fill="#222">正解</text>

  <!-- 答え box -->
  <g transform="translate(80, 316)">
    <rect width="920" height="220" rx="16" fill="#d0e8d0" stroke="#3a7d44" stroke-width="3"/>
    <circle cx="100" cy="110" r="60" fill="#3a7d44"/>
    <text x="100" y="130" text-anchor="middle" font-size="64" font-weight="900" fill="#ffffff">B</text>
    <text x="200" y="100" font-size="56" font-weight="800" fill="#222">ロバート・ケリー</text>
    <text x="200" y="160" font-size="30" font-weight="500" fill="#555">Robert E. Kelley（米国・経営学者）</text>
  </g>

  <!-- 解説 -->
  <text x="80" y="636" font-size="32" font-weight="700" fill="#2e6da4" letter-spacing="2">EXPLANATION</text>
  <line x1="80" y1="656" x2="280" y2="656" stroke="#2e6da4" stroke-width="3"/>

  <text x="80" y="716" font-size="34" font-weight="600" fill="#222">1992年の著書『The Power of </text>
  <text x="80" y="768.7" font-size="34" font-weight="600" fill="#222">Followership』で、独自のクリティ</text>
  <text x="80" y="821.4" font-size="34" font-weight="600" fill="#222">カルシンキング × 積極的関与の2軸で5類型</text>
  <text x="80" y="874.1" font-size="34" font-weight="600" fill="#222">を定義した。</text>
</svg>