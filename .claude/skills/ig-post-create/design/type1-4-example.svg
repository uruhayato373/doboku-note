<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img" aria-label="example: ケリーの2軸モデル">
  <style>
    text { font-family: 'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif; }
  </style>
  <rect width="1080" height="1350" fill="#ffffff"/>

  
  <text x="1000" y="64" text-anchor="end" font-size="22" font-weight="500" fill="#8a8a8a">4 / 7</text>
  
  <text x="80" y="120" font-size="26" font-weight="700" fill="#2e6da4" letter-spacing="2">MODEL</text>
  <line x1="80" y1="144" x2="160" y2="144" stroke="#2e6da4" stroke-width="3"/>

  <text x="80" y="236" font-size="60" font-weight="800" fill="#222">ケリーの2軸モデル</text>

  <!-- 軸1 -->
  <g transform="translate(80, 336)">
    <circle cx="40" cy="40" r="36" fill="#2e6da4"/>
    <text x="40" y="55" text-anchor="middle" font-size="40" font-weight="800" fill="#ffffff">1</text>
    <text x="100" y="36" font-size="40" font-weight="700" fill="#222">独自のクリティカル</text>
    <text x="100" y="80" font-size="40" font-weight="700" fill="#222">シンキング</text>
    <text x="100" y="124" font-size="26" font-weight="400" fill="#555">自分の頭で考え、建設的な批判ができるか</text>
  </g>

  <!-- 軸2 -->
  <g transform="translate(80, 576)">
    <circle cx="40" cy="40" r="36" fill="#2e6da4"/>
    <text x="40" y="55" text-anchor="middle" font-size="40" font-weight="800" fill="#ffffff">2</text>
    <text x="100" y="36" font-size="40" font-weight="700" fill="#222">積極的関与</text>
    <text x="100" y="80" font-size="40" font-weight="700" fill="#222">（エンゲージメント）</text>
    <text x="100" y="124" font-size="26" font-weight="400" fill="#555">組織活動に自発的に参加するか</text>
  </g>

  <!-- 補足 -->
  <rect x="80" y="1094" width="920" height="100" rx="8" fill="#f5f5f5"/>
  <text x="112" y="1154" font-size="28" font-weight="600" fill="#222">この2軸の組合せで5類型が定義される →</text>
</svg>