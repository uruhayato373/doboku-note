<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img" aria-label="cover: フォロワーシップ">
  <style>
    text { font-family: 'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif; }
  </style>
  <rect width="1080" height="1350" fill="#ffffff"/>

  
  <text x="1000" y="64" text-anchor="end" font-size="22" font-weight="500" fill="#8a8a8a">1 / 7</text>

  <!-- カテゴリラベル -->
  <text x="80" y="156" font-size="28" font-weight="700" fill="#2e6da4" letter-spacing="3">技術士総監キーワード</text>

  <!-- メインタイトル（中央寄せ） -->
  <text x="540" y="645" text-anchor="middle" font-size="120" font-weight="900" fill="#222" letter-spacing="2">フォロワーシップ</text>

  <!-- サブタイトル -->
  <text x="540" y="735" text-anchor="middle" font-size="40" font-weight="400" fill="#555">ケリーの2軸 × 5類型を3分で整理</text>

  <!-- アクセントブロック -->
  <rect x="460" y="805" width="160" height="6" fill="#2e6da4"/>

  <!-- セクションタグ -->
  <rect x="80" y="1054" width="280" height="56" rx="6" fill="#e8f0fe"/>
  <text x="104" y="1092" font-size="26" font-weight="600" fill="#1a3a5c">3.1 人的資源管理</text>

  
  <text x="80" y="1262" font-size="34" font-weight="800" fill="#2e6da4" letter-spacing="1">doboku-note</text>
  <text x="80" y="1298" font-size="22" font-weight="400" fill="#8a8a8a">doboku-note.com</text>
</svg>