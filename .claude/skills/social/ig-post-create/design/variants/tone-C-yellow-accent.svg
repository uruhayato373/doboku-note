<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img" aria-label="tone C accent yellow">
  <style>text{font-family:'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif;}</style>
  <rect width="1080" height="1350" fill="#ffffff"/>
  <text x="1000" y="64" text-anchor="end" font-size="22" fill="#8a8a8a">2 / 7</text>

  <!-- 黄色ラベル -->
  <rect x="80" y="92" width="240" height="56" fill="#d4a017"/>
  <text x="200" y="130" text-anchor="middle" font-size="26" font-weight="800" fill="#1a3a5c" letter-spacing="2">DEFINITION</text>

  <text x="80" y="240" font-size="64" font-weight="800" fill="#222">とは</text>

  <!-- ハイライト箇所を黄色マーカー風 -->
  <rect x="76" y="305" width="690" height="50" fill="#fff3cd"/>
