  <text x="112" y="1070" font-size="28" fill="#222">ロバート・ケリー（1992）</text>
  <text x="112" y="1110" font-size="28" fill="#222">『The Power of</text>
  <text x="112" y="1150" font-size="28" fill="#222">Followership』で体系化</text>
