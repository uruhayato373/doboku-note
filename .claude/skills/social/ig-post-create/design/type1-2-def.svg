<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img" aria-label="def: フォロワーシップとは">
  <style>
    text { font-family: 'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif; }
  </style>
  <rect width="1080" height="1350" fill="#ffffff"/>

  
  <text x="1000" y="64" text-anchor="end" font-size="22" font-weight="500" fill="#8a8a8a">2 / 7</text>
  
  <text x="80" y="120" font-size="26" font-weight="700" fill="#2e6da4" letter-spacing="2">DEFINITION</text>
  <line x1="80" y1="144" x2="160" y2="144" stroke="#2e6da4" stroke-width="3"/>

  <!-- 大見出し -->
  <text x="80" y="236" font-size="64" font-weight="800" fill="#222">とは</text>

  <!-- 本文 -->
  <text x="80" y="336" font-size="52" font-weight="700" fill="#222">部下側の視点からリーダーシップを捉え</text>
  <text x="80" y="414" font-size="52" font-weight="700" fill="#222">るアプローチ。</text>

  <!-- 補足 callout -->
  <rect x="80" y="974" width="920" height="200" rx="8" fill="#e8f0fe"/>
  <rect x="80" y="974" width="6" height="200" fill="#2e6da4"/>
  <text x="112" y="1024" font-size="24" font-weight="700" fill="#2e6da4" letter-spacing="2">提唱者</text>
  <text x="112" y="1074" font-size="28" font-weight="400" fill="#1a3a5c">ロバート・ケリー（1992）が著書『The </text>
  <text x="112" y="1118.8" font-size="28" font-weight="400" fill="#1a3a5c">Power of Followership』</text>
  <text x="112" y="1163.6" font-size="28" font-weight="400" fill="#1a3a5c">で体系化した。</text>
</svg>