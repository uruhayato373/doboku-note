<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>X投稿カレンダー | doboku-note</title>
<style>
:root{color-scheme:light;--ink:#152c44;--muted:#697989;--paper:#f5f4ef;--line:#dfe4e8;--blue:#165a9d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Yu Gothic",Meiryo,sans-serif;font-size:14px}header{background:#142c44;color:white;padding:34px max(24px,calc((100vw - 1180px)/2)) 30px}.eyebrow{font-size:12px;letter-spacing:.16em;color:#9fbdce}h1{font-size:30px;margin:10px 0 6px;letter-spacing:.03em}header p{color:#bdcedb;line-height:1.8;margin:4px 0}.stats{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}.stat{border:1px solid #496176;border-radius:10px;padding:10px 20px;min-width:135px}.stat b{font-size:26px;margin-right:6px}.stat span{display:block;color:#bdcedb;font-size:12px}.wrap{max-width:1228px;margin:auto;padding:22px 24px 60px}.notice{border-left:3px solid #c7a449;background:#fffdf5;padding:13px 16px;line-height:1.8;font-size:13px}.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:22px 0;position:sticky;top:0;background:var(--paper);z-index:2}select,input,button{font:inherit;color:var(--ink);border:1px solid #ccd5dd;background:white;border-radius:8px;padding:10px 12px}input{flex:1;min-width:180px}button{cursor:pointer}button:hover{border-color:var(--blue)}#count{color:var(--muted);font-size:12px;margin-left:auto}.day{margin-bottom:28px}.day h2{font-size:16px;display:flex;align-items:center;gap:10px}.day h2:after{content:"";height:1px;background:var(--line);flex:1}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 3px 12px #172b4410}.meta{padding:13px 15px;display:flex;justify-content:space-between;align-items:center;gap:8px}.time{font-weight:800;font-size:17px}.badge{font-size:11px;padding:4px 8px;border-radius:5px;background:#e9f0f7;color:#174a7b}.badge.queued{background:#eff0f2;color:#53606d}.badge.note{background:#e2f3e9;color:#246346}.image-button{display:block;padding:0;border:0;width:100%;border-radius:0;background:#e8edf0}.image-button img{width:100%;height:auto;display:block}.no-image{aspect-ratio:16/9;display:grid;place-items:center;background:#edf0f2;color:var(--muted);font-size:12px;padding:20px}.content{padding:16px}.text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.95;font-size:13px;margin:0}.text a{color:var(--blue)}.foot{border-top:1px solid var(--line);padding:12px 15px;display:flex;justify-content:space-between;align-items:center;gap:8px}.foot a{font-size:12px;color:#217748;font-weight:bold;text-decoration:none}.foot small{color:var(--muted);font-size:11px}.issues{background:#fff6df;padding:10px 15px;font-size:12px;color:#7c5c14}.copy{font-size:11px;padding:5px 9px}dialog{padding:0;border:0;border-radius:12px;max-width:min(1240px,95vw);width:95vw;background:#fff;color:var(--ink)}dialog::backdrop{background:#081628bb}dialog img{display:block;width:100%}.dialog-foot{padding:14px 20px;display:flex;justify-content:space-between;align-items:center}.empty{padding:45px;text-align:center;color:var(--muted)}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.grid{grid-template-columns:1fr}h1{font-size:24px}.wrap{padding:16px}.stat{min-width:110px;padding:9px 12px}.filters{position:static}header{padding:28px 20px}.text{font-size:14px}}
</style></head><body><header><div class="eyebrow">DOBOKU-NOTE / X POST PLANNER</div><h1>先生と学ぶ、秋の資格対策</h1><p id="period">投稿予定を読み込んでいます</p><div class="stats" id="stats"></div></header><main class="wrap"><div class="notice">ここでは原稿・画像・導線を確認できます。「予約用原稿」はXへの登録前です。「台帳上の投入済み」は既存の記録で、今回のX実画面での照合結果ではありません。画像を押すと拡大できます。</div><div class="filters"><select id="kind" aria-label="投稿の種類"><option value="all">すべての投稿</option><option value="new">今回の画像付き原稿</option><option value="note">noteへの案内</option><option value="queued">台帳上の投入済み</option><option value="attention">別企画・確認待ち</option></select><select id="week" aria-label="期間"><option value="all">全期間</option></select><input id="search" placeholder="本文・資格・テーマを検索" aria-label="投稿検索"><span id="count"></span></div><div id="posts"></div></main><dialog id="zoom"><img id="zoomImage" alt=""><div class="dialog-foot"><span id="zoomTitle"></span><button id="close">閉じる</button></div></dialog>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data;
const $=s=>document.querySelector(s);
function body(text){return esc(text).replace(/https?:\/\/[^\s]+/g,u=>'<a target="_blank" rel="noopener noreferrer" href="'+u+'">'+(u.startsWith('https://note.com/')?'note.com｜収録内容を見る ↗':'リンク先の解説を読む ↗')+'</a>')}
function render(){const kind=$('#kind').value,week=$('#week').value.split(','),q=$('#search').value.toLowerCase();const rows=data.rows.filter(r=>(kind==='all'||kind==='new'&&r.newCard||kind==='note'&&r.funnel==='note'||kind==='queued'&&r.status==='queued'||kind==='attention'&&r.issues.length)&&(week[0]==='all'||r.date>=week[0]&&r.date<=week[1])&&(!q||(r.title+r.text+r.exam).toLowerCase().includes(q)));$('#count').textContent=rows.length+'件';const days=[...new Set(rows.map(r=>r.date))];$('#posts').innerHTML=days.map(day=>'<section class="day"><h2>'+esc(new Date(day+'T12:00:00+09:00').toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'short',timeZone:'Asia/Tokyo'}))+'</h2><div class="grid">'+rows.filter(r=>r.date===day).map(r=>'<article class="card"><div class="meta"><span class="time">'+esc(r.time)+'</span><span class="badge '+(r.status==='queued'?'queued':'')+'">'+(r.status==='posted'?'台帳上の投稿済み':r.status==='queued'?'台帳上の投入済み':r.newCard?'予約用原稿':'別企画の予定')+'</span></div>'+(r.imagePath?'<button class="image-button" data-image="'+esc(r.id)+'" aria-label="'+esc(r.title)+'を拡大"><img loading="lazy" width="1200" height="675" src="/image?id='+encodeURIComponent(r.id)+'" alt="'+esc(r.alt)+'"></button>':'<div class="no-image">'+(r.issues.length?'別企画の公開手順で確認する投稿':'この端末に既存画像はありません')+'</div>')+'<div class="content"><p class="text">'+body(r.text)+'</p></div>'+(r.issues.length?'<div class="issues">'+r.issues.map(esc).join(' / ')+'</div>':'')+'<div class="foot">'+(r.url?'<a target="_blank" rel="noopener noreferrer" href="'+esc(r.url)+'">'+(r.funnel==='note'?'noteの収録内容を見る ↗':'リンク先を確認 ↗')+'</a>':'<small>リンクなし・投稿内で学べる内容</small>')+'<button class="copy" data-copy="'+esc(r.id)+'">本文をコピー</button></div></article>').join('')+'</div></section>').join('')||'<p class="empty">該当する投稿はありません。</p>'}
fetch('/data').then(r=>{if(!r.ok)throw Error('read');return r.json()}).then(d=>{data=d;for(let start=new Date(d.from+'T00:00:00Z');start<=new Date(d.to+'T00:00:00Z');start.setUTCDate(start.getUTCDate()+7)){const end=new Date(Math.min(start.getTime()+6*86400000,new Date(d.to+'T00:00:00Z').getTime()));const from=start.toISOString().slice(0,10),to=end.toISOString().slice(0,10);const opt=document.createElement('option');opt.value=from+','+to;opt.textContent=from.slice(5).replace('-','/')+'〜'+to.slice(5).replace('-','/');$('#week').append(opt)}$('#period').textContent=d.from.replaceAll('-','/')+' — '+d.to.replaceAll('-','/')+' ｜ 日本時間・日ごとの投稿予定';const c=d.counts;$('#stats').innerHTML=[[c.all,'件','予定枠'],[c.newCards,'件','今回の画像付き原稿'],[c.note,'件','新原稿のnote導線'],[c.retainedQueued,'件','台帳上の投入済み']].map(([n,u,label])=>'<div class="stat"><b>'+n+'</b>'+u+'<span>'+label+'</span></div>').join('');render()}).catch(()=>{$('#posts').textContent='確認データを読み込めませんでした。サーバーのログを確認してください。'});
for(const id of ['kind','week','search'])$('#'+id).addEventListener(id==='search'?'input':'change',render);
document.addEventListener('click',async e=>{const image=e.target.closest('[data-image]'),copy=e.target.closest('[data-copy]');if(image){const r=data.rows.find(r=>r.id===image.dataset.image);$('#zoomImage').src='/image?id='+encodeURIComponent(r.id);$('#zoomImage').alt=r.alt;$('#zoomTitle').textContent=r.date+' '+r.time+' · '+r.title;$('#zoom').showModal()}if(copy){const r=data.rows.find(r=>r.id===copy.dataset.copy);await navigator.clipboard.writeText(r.text);copy.textContent='コピー済み'}});$('#close').onclick=()=>$('#zoom').close();$('#zoom').onclick=e=>{if(e.target===$('#zoom'))$('#zoom').close()};
</script></body></html>
