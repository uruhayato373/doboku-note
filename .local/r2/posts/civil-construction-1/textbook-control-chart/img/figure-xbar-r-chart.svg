<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="X̄-R管理図。上段の平均値X̄管理図と下段の範囲R管理図をUCL・CL・LCLの3本の管理線で管理し、点が限界内でクセがなければ工程は安定と判断する">
  <text x="200" y="22" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1a3a5c">X̄-R管理図：上段X̄・下段R、UCL/CL/LCLで管理</text>

  <!-- 上段 X̄管理図 -->
  <text x="210" y="44" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1a3a5c">X̄ 管理図（平均値）</text>
  <line x1="58" y1="58" x2="58" y2="252" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="58" y1="252" x2="366" y2="252" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="58" y1="82" x2="366" y2="82" stroke="#2e6da4" stroke-width="1.3" stroke-dasharray="6 4"/>
  <line x1="58" y1="152" x2="366" y2="152" stroke="#2e6da4" stroke-width="1.6"/>
  <line x1="58" y1="222" x2="366" y2="222" stroke="#2e6da4" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="54" y="86" text-anchor="end" font-family="sans-serif" font-size="11" fill="#1a3a5c">UCL</text>
  <text x="54" y="156" text-anchor="end" font-family="sans-serif" font-size="11" fill="#1a3a5c">CL</text>
  <text x="54" y="226" text-anchor="end" font-family="sans-serif" font-size="11" fill="#1a3a5c">LCL</text>
  <text x="362" y="76" text-anchor="end" font-family="sans-serif" font-size="11" fill="#8a8a8a">＋A₂×平均R</text>
  <text x="362" y="238" text-anchor="end" font-family="sans-serif" font-size="11" fill="#8a8a8a">−A₂×平均R</text>
  <polyline points="80,168 118,128 156,172 194,112 232,158 270,126 308,186 344,140" fill="none" stroke="#1a3a5c" stroke-width="1.5"/>
  <circle cx="80" cy="168" r="3" fill="#1a3a5c"/><circle cx="118" cy="128" r="3" fill="#1a3a5c"/><circle cx="156" cy="172" r="3" fill="#1a3a5c"/><circle cx="194" cy="112" r="3" fill="#1a3a5c"/><circle cx="232" cy="158" r="3" fill="#1a3a5c"/><circle cx="270" cy="126" r="3" fill="#1a3a5c"/><circle cx="308" cy="186" r="3" fill="#1a3a5c"/><circle cx="344" cy="140" r="3" fill="#1a3a5c"/>

  <!-- 下段 R管理図 -->
  <text x="210" y="290" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1a3a5c">R 管理図（範囲）</text>
  <line x1="58" y1="302" x2="58" y2="438" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="58" y1="438" x2="366" y2="438" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="58" y1="316" x2="366" y2="316" stroke="#2e6da4" stroke-width="1.3" stroke-dasharray="6 4"/>
  <line x1="58" y1="382" x2="366" y2="382" stroke="#2e6da4" stroke-width="1.6"/>
  <text x="54" y="320" text-anchor="end" font-family="sans-serif" font-size="11" fill="#1a3a5c">UCL</text>
  <text x="54" y="386" text-anchor="end" font-family="sans-serif" font-size="11" fill="#1a3a5c">CL</text>
  <text x="362" y="310" text-anchor="end" font-family="sans-serif" font-size="11" fill="#8a8a8a">D₄×平均R</text>
  <polyline points="80,398 118,360 156,406 194,346 232,392 270,362 308,404 344,372" fill="none" stroke="#1a3a5c" stroke-width="1.5"/>
  <circle cx="80" cy="398" r="3" fill="#1a3a5c"/><circle cx="118" cy="360" r="3" fill="#1a3a5c"/><circle cx="156" cy="406" r="3" fill="#1a3a5c"/><circle cx="194" cy="346" r="3" fill="#1a3a5c"/><circle cx="232" cy="392" r="3" fill="#1a3a5c"/><circle cx="270" cy="362" r="3" fill="#1a3a5c"/><circle cx="308" cy="404" r="3" fill="#1a3a5c"/><circle cx="344" cy="372" r="3" fill="#1a3a5c"/>

  <text x="200" y="458" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8a8a">点が限界内でクセがなければ工程は安定</text>
  <text x="200" y="476" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8a8a">R管理図の LCL＝D₃×平均R（n≦6 は考えない）</text>
</svg>
