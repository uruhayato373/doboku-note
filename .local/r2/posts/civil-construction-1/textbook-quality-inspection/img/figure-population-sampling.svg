<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="母集団とサンプリングの関係。調べようとする集団全体が母集団で、その中で検査のためひとまとまりにしたグループがロット。ロットから抜き取った一部がサンプルで、サンプルから得られた品質特性の測定値がデータである。母集団を正しく代表するよう無作為抽出する">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-name { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-desc { font-size: 11px; fill: #555; }
      .t-arw  { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .t-sec  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-item { font-size: 11px; fill: #222; }
      .pop  { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; }
      .lot  { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .smp  { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .dat  { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .unit { fill: #ffffff; stroke: #555; stroke-width: 1; }
      .unitS{ fill: #ffffff; stroke: #3a7d44; stroke-width: 1.5; }
      .flow { stroke: #8a8a8a; stroke-width: 1.5; fill: none; }
      .box-surf { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .rule { stroke: #d7d7d7; stroke-width: 1; }
    </style>
    <marker id="qs-a" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#8a8a8a"/>
    </marker>
  </defs>

  <text class="t-lead" x="200" y="18" text-anchor="middle">母集団から一部を取り出して全体を推測する</text>

  <rect class="pop" x="20" y="32" width="360" height="130" rx="6"/>
  <text class="t-name" x="40" y="56">母集団</text>
  <text class="t-desc" x="40" y="74">調べようとする集団の全体</text>

  <rect class="lot" x="36" y="86" width="328" height="66" rx="6"/>
  <text class="t-name" x="52" y="108">ロット</text>
  <text class="t-desc" x="120" y="108">検査のためひとまとまりにしたグループ</text>
  <circle class="unit" cx="64" cy="134" r="6"/>
  <circle class="unit" cx="102" cy="134" r="6"/>
  <circle class="unit" cx="140" cy="134" r="6"/>
  <circle class="unit" cx="178" cy="134" r="6"/>
  <circle class="unit" cx="216" cy="134" r="6"/>
  <circle class="unit" cx="254" cy="134" r="6"/>
  <circle class="unit" cx="292" cy="134" r="6"/>
  <circle class="unit" cx="330" cy="134" r="6"/>

  <line class="flow" x1="110" y1="162" x2="110" y2="182" marker-end="url(#qs-a)"/>
  <text class="t-arw" x="126" y="177">サンプリング（試料抽出）</text>

  <rect class="smp" x="20" y="190" width="360" height="76" rx="6"/>
  <text class="t-name" x="40" y="214">サンプル（試料）</text>
  <text class="t-desc" x="40" y="232">ロットから抜き取った一部</text>
  <circle class="unitS" cx="64" cy="250" r="6"/>
  <circle class="unitS" cx="102" cy="250" r="6"/>
  <circle class="unitS" cx="140" cy="250" r="6"/>

  <line class="flow" x1="110" y1="266" x2="110" y2="286" marker-end="url(#qs-a)"/>

  <rect class="dat" x="20" y="294" width="360" height="62" rx="6"/>
  <text class="t-name" x="40" y="318">データ</text>
  <text class="t-desc" x="40" y="338">サンプルから得られた品質特性の測定値</text>

  <rect class="box-surf" x="20" y="370" width="360" height="112" rx="6"/>
  <text class="t-sec" x="200" y="394" text-anchor="middle">サンプリングの原則</text>
  <line class="rule" x1="36" y1="403" x2="364" y2="403"/>
  <text class="t-item" x="40" y="426">母集団を正しく代表するようにサンプリングする</text>
  <text class="t-item" x="40" y="450">JISは乱数表を用いるなど無作為抽出を定めている</text>
  <text class="t-item" x="40" y="472">抜取検査はサンプル中の不適合の数などで合否を判定</text>
</svg>
