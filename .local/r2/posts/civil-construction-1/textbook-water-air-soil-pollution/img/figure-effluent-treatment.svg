<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="建設工事の湧水処理フロー。湧水を集水後、pHをアルカリ性なら炭酸ガス等で中和し、凝集剤で浮遊物質SSをフロック化して沈殿分離し、排水基準の範囲内で公共用水域へ放流する">
  <text x="200" y="24" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1a3a5c">湧水処理：集水 → pH中和 → 凝集沈殿 → 放流</text>

  <!-- 集水 -->
  <rect x="90" y="40" width="220" height="46" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="200" y="60" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222">湧水・濁水を集水</text>
  <text x="200" y="78" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8a8a">SS（浮遊物質）・pH が問題</text>

  <line x1="200" y1="86" x2="200" y2="106" stroke="#8a8a8a" stroke-width="2"/>
  <path d="M200 112 l-6 -8 h12 z" fill="#8a8a8a"/>

  <!-- pH中和 -->
  <rect x="70" y="112" width="260" height="70" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="200" y="134" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1a3a5c">pH の中和処理</text>
  <text x="200" y="154" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222">アルカリ性排水を排水基準の範囲へ</text>
  <text x="200" y="172" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">中和剤：炭酸ガス方式 等</text>

  <line x1="200" y1="182" x2="200" y2="202" stroke="#8a8a8a" stroke-width="2"/>
  <path d="M200 208 l-6 -8 h12 z" fill="#8a8a8a"/>

  <!-- 凝集沈殿 -->
  <rect x="70" y="208" width="260" height="90" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="200" y="230" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1a3a5c">凝集沈殿（SS 除去）</text>
  <text x="200" y="250" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222">凝集剤で微粒子をフロック化</text>
  <text x="200" y="268" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222">沈降を早めて上澄みと分離</text>
  <text x="200" y="288" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">無機凝集剤（PAC 等）＋高分子凝集剤</text>

  <line x1="200" y1="298" x2="200" y2="318" stroke="#8a8a8a" stroke-width="2"/>
  <path d="M200 324 l-6 -8 h12 z" fill="#8a8a8a"/>

  <!-- 放流 -->
  <rect x="90" y="324" width="220" height="52" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="200" y="348" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222">公共用水域へ放流</text>
  <text x="200" y="366" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8a8a">排水基準の範囲内で放流</text>

  <!-- 注記 -->
  <rect x="40" y="396" width="320" height="80" rx="6" fill="#ffffff" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="200" y="420" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">SS は沈降・凝集、pH は中和で調整する</text>
  <text x="200" y="440" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">河川内工事では汚濁防止膜（幕）で</text>
  <text x="200" y="458" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">拡散を抑えたうえで処理する</text>
</svg>
