<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="排水先による適用法令の分岐。工事排水を河川・湖沼・海域など公共用水域に出す場合は水質汚濁防止法が適用され、公共下水道に出す場合は下水道法が適用される">
  <text x="200" y="24" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1a3a5c">排水先で適用法令が変わる：公共用水域か公共下水道か</text>

  <!-- 起点：工事排水 -->
  <rect x="120" y="42" width="160" height="50" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="200" y="66" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222">工事からの排水</text>
  <text x="200" y="84" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8a8a">どこへ放流するか</text>

  <!-- 分岐線 -->
  <line x1="200" y1="92" x2="200" y2="108" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="110" y1="108" x2="290" y2="108" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="110" y1="108" x2="110" y2="128" stroke="#8a8a8a" stroke-width="2"/>
  <path d="M110 134 l-6 -8 h12 z" fill="#8a8a8a"/>
  <line x1="290" y1="108" x2="290" y2="128" stroke="#8a8a8a" stroke-width="2"/>
  <path d="M290 134 l-6 -8 h12 z" fill="#8a8a8a"/>

  <!-- 左：公共用水域 -->
  <rect x="30" y="134" width="160" height="70" rx="6" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="110" y="158" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1a3a5c">公共用水域</text>
  <text x="110" y="178" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222">河川・湖沼・海域</text>
  <text x="110" y="196" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8a8a">など</text>

  <!-- 右：公共下水道 -->
  <rect x="210" y="134" width="160" height="70" rx="6" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="290" y="158" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1a3a5c">公共下水道</text>
  <text x="290" y="178" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222">下水道へ接続</text>
  <text x="290" y="196" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8a8a">して排出</text>

  <line x1="110" y1="204" x2="110" y2="224" stroke="#8a8a8a" stroke-width="2"/>
  <path d="M110 230 l-6 -8 h12 z" fill="#8a8a8a"/>
  <line x1="290" y1="204" x2="290" y2="224" stroke="#8a8a8a" stroke-width="2"/>
  <path d="M290 230 l-6 -8 h12 z" fill="#8a8a8a"/>

  <!-- 左：適用法令 -->
  <rect x="30" y="230" width="160" height="64" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="110" y="256" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1a3a5c">水質汚濁防止法</text>
  <text x="110" y="278" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222">一律・上乗せ排水基準</text>

  <!-- 右：適用法令 -->
  <rect x="210" y="230" width="160" height="64" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="290" y="256" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1a3a5c">下水道法</text>
  <text x="290" y="278" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222">下水道への排除基準</text>

  <!-- 注記 -->
  <rect x="40" y="320" width="320" height="96" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="200" y="346" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">同じ工事排水でも、放流先が違えば</text>
  <text x="200" y="366" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">従う法令が変わる点が問われる</text>
  <text x="200" y="390" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8a8a">公共用水域＝水質汚濁防止法</text>
  <text x="200" y="408" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8a8a">公共下水道＝下水道法</text>
</svg>
