<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 330" style="max-width:500px;width:100%" role="img" aria-label="平成27年度後期 No.13 ネットワーク式工程表。イベント0から7。クリティカルパスは0→2→4→5→7で工期28日。作業E（3→5）に3日遅延すると経路0→2→3→5→7が30日となり工期は2日遅れる。">
  <defs>
    <marker id="ar" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="arcp" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b22234"/></marker>
  </defs>
  <style>
    .ti{font-family:Inter,'Noto Sans JP','Hiragino Sans',sans-serif;font-size:14px;fill:#555}
    .nn{font-family:Inter,'Noto Sans JP','Hiragino Sans',sans-serif;font-size:13px;fill:#1a3a5c;font-weight:600}
    .nc{font-family:Inter,'Noto Sans JP','Hiragino Sans',sans-serif;font-size:13px;fill:#b22234;font-weight:700}
    .ac{font-family:Inter,'Noto Sans JP','Hiragino Sans',sans-serif;font-size:13px;fill:#222;font-weight:600}
    .du{font-family:Inter,'Noto Sans JP','Hiragino Sans',sans-serif;font-size:11px;fill:#555}
    .sub{font-family:Inter,'Noto Sans JP','Hiragino Sans',sans-serif;font-size:11px;fill:#555}
    .cl{font-family:Inter,'Noto Sans JP','Hiragino Sans',sans-serif;font-size:12px;fill:#b22234;font-weight:700}
  </style>

  <text x="250" y="20" text-anchor="middle" class="ti">ネットワーク式工程表（クリティカルパスを赤で強調）</text>

  <!-- ===== 非CP arrows (thin) ===== -->
  <!-- 0->1 (7) -->
  <line x1="52" y1="150" x2="108" y2="80" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="68" y="108" text-anchor="middle" class="du">7</text>
  <!-- 1->5 (6) -->
  <line x1="135" y1="72" x2="322" y2="112" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="225" y="86" text-anchor="middle" class="du">6</text>
  <!-- 0->3 (5) -->
  <line x1="54" y1="156" x2="192" y2="108" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="120" y="125" text-anchor="middle" class="du">5</text>
  <!-- 3->5 E,9 -->
  <line x1="220" y1="110" x2="322" y2="118" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="270" y="104" text-anchor="middle" class="ac">E</text>
  <text x="270" y="118" text-anchor="middle" class="du">9</text>
  <!-- 2->3 dummy -->
  <line x1="128" y1="242" x2="200" y2="120" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <!-- 2->6 (8) -->
  <line x1="135" y1="255" x2="198" y2="255" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="166" y="248" text-anchor="middle" class="du">8</text>
  <!-- 6->7 (11) -->
  <line x1="230" y1="248" x2="428" y2="168" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="330" y="222" text-anchor="middle" class="du">11</text>

  <!-- ===== CP arrows (bold red) 0-2-4-5-7 ===== -->
  <!-- 0->2 (6) -->
  <line x1="52" y1="170" x2="108" y2="242" stroke="#b22234" stroke-width="3.5" marker-end="url(#arcp)"/>
  <text x="68" y="212" text-anchor="middle" class="du">6</text>
  <!-- 2->4 (4) -->
  <line x1="133" y1="246" x2="205" y2="192" stroke="#b22234" stroke-width="3.5" marker-end="url(#arcp)"/>
  <text x="180" y="232" text-anchor="middle" class="du">4</text>
  <!-- 4->5 (6) -->
  <line x1="228" y1="172" x2="322" y2="128" stroke="#b22234" stroke-width="3.5" marker-end="url(#arcp)"/>
  <text x="262" y="142" text-anchor="middle" class="du">6</text>
  <!-- 5->7 (12) -->
  <line x1="348" y1="125" x2="432" y2="155" stroke="#b22234" stroke-width="3.5" marker-end="url(#arcp)"/>
  <text x="392" y="128" text-anchor="middle" class="du">12</text>

  <!-- ===== nodes ===== -->
  <circle cx="40" cy="160" r="15" fill="#f8d7da" stroke="#b22234" stroke-width="2.5"/><text x="40" y="165" text-anchor="middle" class="nc">0</text>
  <circle cx="120" cy="65" r="15" fill="#ffffff" stroke="#2e6da4" stroke-width="2"/><text x="120" y="70" text-anchor="middle" class="nn">1</text>
  <circle cx="120" cy="255" r="15" fill="#f8d7da" stroke="#b22234" stroke-width="2.5"/><text x="120" y="260" text-anchor="middle" class="nc">2</text>
  <circle cx="205" cy="110" r="15" fill="#ffffff" stroke="#2e6da4" stroke-width="2"/><text x="205" y="115" text-anchor="middle" class="nn">3</text>
  <circle cx="215" cy="180" r="15" fill="#f8d7da" stroke="#b22234" stroke-width="2.5"/><text x="215" y="185" text-anchor="middle" class="nc">4</text>
  <circle cx="335" cy="120" r="15" fill="#f8d7da" stroke="#b22234" stroke-width="2.5"/><text x="335" y="125" text-anchor="middle" class="nc">5</text>
  <circle cx="215" cy="255" r="15" fill="#ffffff" stroke="#2e6da4" stroke-width="2"/><text x="215" y="260" text-anchor="middle" class="nn">6</text>
  <circle cx="445" cy="160" r="15" fill="#f8d7da" stroke="#b22234" stroke-width="2.5"/><text x="445" y="165" text-anchor="middle" class="nc">7</text>

  <!-- ===== summary ===== -->
  <rect x="20" y="285" width="460" height="38" rx="6" fill="#e8f0fe" stroke="#d7d7d7"/>
  <text x="32" y="303" class="cl">クリティカルパス：0→2→4→5→7（6+4+6+12 = 28 日）</text>
  <text x="32" y="318" class="sub">作業 E（3→5）に 3 日遅延 → 経路 0→2→3→5→7 が 30 日となり工期は 2 日遅れる</text>
</svg>
