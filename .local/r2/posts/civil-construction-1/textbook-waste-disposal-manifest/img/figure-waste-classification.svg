<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="廃棄物の分類。廃棄物は一般廃棄物と産業廃棄物に大別され、それぞれ人の健康被害のおそれがあるものは特別管理一般廃棄物・特別管理産業廃棄物となる。建設工事で生じる建設廃棄物は原則として産業廃棄物にあたる">
  <text x="200" y="24" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1a3a5c">廃棄物は一般／産業に大別、有害性の高いものは特別管理へ</text>

  <!-- 廃棄物 -->
  <rect x="120" y="40" width="160" height="44" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="200" y="60" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1a3a5c">廃棄物</text>
  <text x="200" y="77" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">固形状・液状の汚物・不要物</text>

  <!-- 分岐線 -->
  <line x1="200" y1="84" x2="200" y2="98" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="110" y1="98" x2="290" y2="98" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="110" y1="98" x2="110" y2="112" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="290" y1="98" x2="290" y2="112" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- 一般廃棄物 -->
  <rect x="30" y="112" width="160" height="52" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="110" y="133" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222">一般廃棄物</text>
  <text x="110" y="152" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">産業廃棄物以外／市町村が処理</text>

  <!-- 産業廃棄物 -->
  <rect x="210" y="112" width="160" height="52" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="290" y="133" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1a3a5c">産業廃棄物</text>
  <text x="290" y="152" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">事業活動に伴う／事業者が処理</text>

  <!-- 一般廃棄物 → 特別管理 -->
  <line x1="110" y1="164" x2="110" y2="188" stroke="#8a8a8a" stroke-width="1.5"/>
  <path d="M110 194 l-6 -8 h12 z" fill="#8a8a8a"/>
  <rect x="30" y="194" width="160" height="56" rx="6" fill="#ffffff" stroke="#2e6da4" stroke-width="1"/>
  <text x="110" y="214" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1a3a5c">特別管理一般廃棄物</text>
  <text x="110" y="233" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">爆発性・毒性・感染性など</text>

  <!-- 産業廃棄物 → 特別管理 -->
  <line x1="290" y1="164" x2="290" y2="188" stroke="#8a8a8a" stroke-width="1.5"/>
  <path d="M290 194 l-6 -8 h12 z" fill="#8a8a8a"/>
  <rect x="210" y="194" width="160" height="56" rx="6" fill="#ffffff" stroke="#2e6da4" stroke-width="1"/>
  <text x="290" y="214" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1a3a5c">特別管理産業廃棄物</text>
  <text x="290" y="233" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">爆発性・毒性・感染性など</text>

  <!-- 建設廃棄物の位置づけ -->
  <rect x="30" y="284" width="340" height="86" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="200" y="306" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1a3a5c">建設廃棄物の位置づけ</text>
  <text x="200" y="328" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">建設副産物から建設発生土・有価物を</text>
  <text x="200" y="346" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">除いたものが建設廃棄物であり、</text>
  <text x="200" y="364" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">原則として産業廃棄物にあたる</text>

  <!-- 注記 -->
  <rect x="30" y="384" width="340" height="70" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="200" y="406" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">土砂・浚渫土砂は廃棄物処理法上の</text>
  <text x="200" y="424" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">廃棄物にあたらない</text>
  <text x="200" y="445" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8a8a">出典：廃棄物処理法第2条・同施行令第2条</text>
</svg>
