<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="凍害の主な劣化形態3種。スケーリングはコンクリート表面がフレーク状にはがれる現象、微細ひび割れは凍結融解の繰返しにより内部に生じるひび割れ、ポップアウトは骨材の凍結膨張により表面が円錐状に剥離する現象">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-name { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-desc { font-size: 11px; fill: #555; }
      .t-sec  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-item { font-size: 11px; fill: #222; }
      .row  { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1.5; }
      .conc { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; }
      .flake{ fill: #d7d7d7; stroke: #8a8a8a; stroke-width: 1.2; }
      .crk  { stroke: #b22234; stroke-width: 1.4; fill: none; }
      .void { fill: #ffffff; stroke: #b22234; stroke-width: 1.4; }
      .agg  { fill: #d7d7d7; stroke: #555; stroke-width: 1.2; }
      .box-surf { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .rule { stroke: #d7d7d7; stroke-width: 1; }
    </style>
  </defs>

  <text class="t-lead" x="200" y="18" text-anchor="middle">水の凍結膨張がどこを壊すかで形が変わる</text>

  <rect class="row" x="20" y="32" width="360" height="84" rx="4"/>
  <text class="t-name" x="30" y="62">スケーリング</text>
  <text class="t-desc" x="30" y="84">表面がフレーク状にはがれる</text>
  <rect class="conc" x="190" y="54" width="160" height="44"/>
  <polygon class="flake" points="200,52 226,52 222,44 196,44"/>
  <polygon class="flake" points="242,52 268,52 264,42 238,42"/>
  <polygon class="flake" points="292,52 318,52 314,45 288,45"/>

  <rect class="row" x="20" y="124" width="360" height="84" rx="4"/>
  <text class="t-name" x="30" y="154">微細ひび割れ</text>
  <text class="t-desc" x="30" y="176">繰返しで内部に生じるひび割れ</text>
  <rect class="conc" x="190" y="146" width="160" height="44"/>
  <line class="crk" x1="205" y1="152" x2="212" y2="182"/>
  <line class="crk" x1="232" y1="150" x2="226" y2="184"/>
  <line class="crk" x1="258" y1="155" x2="266" y2="184"/>
  <line class="crk" x1="288" y1="149" x2="282" y2="178"/>
  <line class="crk" x1="315" y1="153" x2="322" y2="183"/>

  <rect class="row" x="20" y="216" width="360" height="84" rx="4"/>
  <text class="t-name" x="30" y="246">ポップアウト</text>
  <text class="t-desc" x="30" y="268">骨材の膨張で円錐状に剥離</text>
  <rect class="conc" x="190" y="238" width="160" height="44"/>
  <polygon class="void" points="248,238 292,238 272,262"/>
  <circle class="agg" cx="271" cy="268" r="7"/>

  <rect class="box-surf" x="20" y="340" width="360" height="142" rx="6"/>
  <text class="t-sec" x="200" y="362" text-anchor="middle">読み取り方</text>
  <line class="rule" x1="36" y1="371" x2="364" y2="371"/>
  <text class="t-item" x="40" y="396">いずれも水の凍結膨張に伴う水圧が原因</text>
  <text class="t-item" x="40" y="420">耐凍害性の大きな骨材を用いる</text>
  <text class="t-item" x="40" y="444">水セメント比を小さくして密実なコンクリートとする</text>
</svg>
