<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="ローダのV形積込み方式。ダンプトラックを掘削対象物に対して60度程度斜めに停止させ、ローダが対象物をすくい込んだ後、後退と前進によりダンプトラックの荷台へ積み込む。ローダの動線がV字を描く">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-lbl  { font-size: 11px; fill: #222; }
      .t-step { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .t-band { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-sec  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-item { font-size: 11px; fill: #222; }
      .mound  { fill: #f5f5f5; stroke: #8a8a8a; stroke-width: 1.5; }
      .truck  { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .loader { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .pathA  { stroke: #2e6da4; stroke-width: 2.5; fill: none; }
      .pathB  { stroke: #3a7d44; stroke-width: 2.5; fill: none; }
      .band   { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-surf { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .rule   { stroke: #d7d7d7; stroke-width: 1; }
    </style>
    <marker id="ld-a" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0,0 9,3.5 0,7" fill="#2e6da4"/>
    </marker>
    <marker id="ld-b" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0,0 9,3.5 0,7" fill="#3a7d44"/>
    </marker>
  </defs>

  <text class="t-lead" x="200" y="18" text-anchor="middle">ローダの動線がV字を描く積込み方式</text>

  <!-- 掘削対象物 -->
  <polygon class="mound" points="44,150 68,96 124,92 148,150"/>
  <text class="t-lbl" x="96" y="84" text-anchor="middle">掘削対象物</text>

  <!-- ダンプトラック（斜めに停止） -->
  <g transform="rotate(-32 292 122)">
    <rect class="truck" x="246" y="104" width="92" height="36" rx="3"/>
    <rect class="truck" x="246" y="104" width="26" height="36" rx="3"/>
  </g>
  <text class="t-lbl" x="322" y="84" text-anchor="middle">ダンプトラック</text>

  <!-- ローダ -->
  <rect class="loader" x="172" y="212" width="46" height="26" rx="3"/>
  <text class="t-lbl" x="195" y="256" text-anchor="middle">ローダ</text>

  <!-- V字の動線 -->
  <path class="pathA" d="M 182 210 L 116 162" marker-end="url(#ld-a)"/>
  <path class="pathB" d="M 210 210 L 272 164" marker-end="url(#ld-b)"/>
  <text class="t-step" x="112" y="200" text-anchor="middle">すくい込み</text>
  <text class="t-step" x="280" y="200" text-anchor="middle">積込み</text>

  <rect class="band" x="20" y="274" width="360" height="34" rx="6"/>
  <text class="t-band" x="200" y="296" text-anchor="middle">ダンプは掘削対象物に対して60°程度斜めに停止させる</text>

  <rect class="box-surf" x="20" y="318" width="360" height="76" rx="6"/>
  <text class="t-sec" x="200" y="340" text-anchor="middle">V形方式の手順</text>
  <line class="rule" x1="36" y1="349" x2="364" y2="349"/>
  <text class="t-item" x="200" y="370" text-anchor="middle">対象物をすくい込む → 後退する → 前進して</text>
  <text class="t-item" x="200" y="386" text-anchor="middle">ダンプトラックの荷台に積み込む</text>

  <rect class="box-surf" x="20" y="404" width="360" height="78" rx="6"/>
  <text class="t-item" x="200" y="426" text-anchor="middle">操向角度を小さくすると操作性がよく動きも短くなる</text>
  <text class="t-item" x="200" y="448" text-anchor="middle">ローダとダンプのサイクルタイムに差が出ないよう台数を調整</text>
  <text class="t-item" x="200" y="470" text-anchor="middle">V形とI形で作業能力に大差はなく計画段階では区別しない</text>
</svg>
