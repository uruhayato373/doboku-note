<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="ローダの走行装置による分類。クローラ式は不整地走行に優れ掘削力が大きく、普通土の掘削積込みやルーズな破砕岩の積込みに使う。ホイール式は掘削力は小さいが機動性に優れ大形バケットでルーズな材料の積込み能力が大きい。バケット容量は山積容量で表す">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-head { font-size: 14px; font-weight: bold; fill: #1a3a5c; }
      .t-axis { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .t-cell { font-size: 11px; fill: #222; }
      .t-sec  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-item { font-size: 11px; fill: #222; }
      .head-c { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .head-w { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .cell-c { fill: #ffffff; stroke: #2e6da4; stroke-width: 1.5; }
      .cell-w { fill: #ffffff; stroke: #3a7d44; stroke-width: 1.5; }
      .box-surf { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .rule { stroke: #d7d7d7; stroke-width: 1; }
    </style>
  </defs>

  <text class="t-lead" x="200" y="18" text-anchor="middle">走行装置の形式で掘削力と機動性が入れ替わる</text>

  <rect class="head-c" x="20" y="28" width="172" height="36" rx="6"/>
  <text class="t-head" x="106" y="52" text-anchor="middle">クローラ式</text>
  <rect class="head-w" x="208" y="28" width="172" height="36" rx="6"/>
  <text class="t-head" x="294" y="52" text-anchor="middle">ホイール式</text>

  <text class="t-axis" x="200" y="84" text-anchor="middle">掘削力</text>
  <rect class="cell-c" x="20" y="92" width="172" height="42" rx="6"/>
  <text class="t-cell" x="106" y="118" text-anchor="middle">大きい</text>
  <rect class="cell-w" x="208" y="92" width="172" height="42" rx="6"/>
  <text class="t-cell" x="294" y="118" text-anchor="middle">小さい</text>

  <text class="t-axis" x="200" y="156" text-anchor="middle">得意な場面</text>
  <rect class="cell-c" x="20" y="164" width="172" height="76" rx="6"/>
  <text class="t-cell" x="106" y="190" text-anchor="middle">不整地での走行</text>
  <text class="t-cell" x="106" y="210" text-anchor="middle">普通土の掘削・積込み</text>
  <text class="t-cell" x="106" y="230" text-anchor="middle">ルーズな破砕岩の積込み</text>
  <rect class="cell-w" x="208" y="164" width="172" height="76" rx="6"/>
  <text class="t-cell" x="294" y="190" text-anchor="middle">優れた機動性</text>
  <text class="t-cell" x="294" y="210" text-anchor="middle">大形バケットにより</text>
  <text class="t-cell" x="294" y="230" text-anchor="middle">積込み能力が大きい</text>

  <text class="t-axis" x="200" y="262" text-anchor="middle">足廻り係数 m</text>
  <rect class="cell-c" x="20" y="270" width="172" height="42" rx="6"/>
  <text class="t-cell" x="106" y="296" text-anchor="middle">2.0 sec/m</text>
  <rect class="cell-w" x="208" y="270" width="172" height="42" rx="6"/>
  <text class="t-cell" x="294" y="296" text-anchor="middle">1.8 sec/m</text>

  <rect class="box-surf" x="20" y="332" width="360" height="150" rx="6"/>
  <text class="t-sec" x="200" y="356" text-anchor="middle">バケットと容量の表し方</text>
  <line class="rule" x1="36" y1="365" x2="364" y2="365"/>
  <text class="t-item" x="40" y="390">刃先の形状は平型と山型があり、それぞれに爪付きと爪なし</text>
  <text class="t-item" x="40" y="416">容量は JIS により山積容量で表す</text>
  <text class="t-item" x="40" y="442">山積容量 ＝ 平積容量 ＋ 安息角を1：2とした山盛り容量</text>
  <text class="t-item" x="40" y="468">算定上のバケット容量はほぐした土量として扱う</text>
</svg>
