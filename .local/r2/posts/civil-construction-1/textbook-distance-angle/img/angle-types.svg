<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" style="max-width:400px;width:100%" role="img" aria-label="水平角と鉛直角">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <!-- Title -->
  <text x="200" y="22" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222">水平角 と 鉛直角</text>

  <!-- Station point -->
  <circle cx="100" cy="175" r="5" fill="#2e6da4"/>
  <text x="85" y="192" font-family="sans-serif" font-size="13" fill="#222">器械点 O</text>

  <!-- Horizontal plane -->
  <ellipse cx="220" cy="175" rx="145" ry="20" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="360" y="170" font-family="sans-serif" font-size="11" fill="#8a8a8a">水平面</text>

  <!-- Two horizontal sight lines (for 水平角) -->
  <line x1="100" y1="175" x2="290" y2="165" stroke="#2e6da4" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="100" y1="175" x2="260" y2="195" stroke="#2e6da4" stroke-width="2" marker-end="url(#a2)"/>
  <text x="295" y="163" font-family="sans-serif" font-size="12" fill="#2e6da4">A'</text>
  <text x="265" y="210" font-family="sans-serif" font-size="12" fill="#2e6da4">B'</text>
  <!-- Horizontal angle arc -->
  <path d="M 140 180 A 40 40 0 0 0 135 173" fill="none" stroke="#b22234" stroke-width="1.8"/>
  <text x="155" y="195" font-family="sans-serif" font-size="13" font-weight="bold" fill="#b22234">水平角 α</text>

  <!-- Vertical sight line up (仰角) -->
  <line x1="100" y1="175" x2="310" y2="70" stroke="#3a7d44" stroke-width="2" marker-end="url(#a2)"/>
  <text x="320" y="68" font-family="sans-serif" font-size="13" fill="#3a7d44">A（仰角 +）</text>
  <!-- Vertical angle arc (+) -->
  <path d="M 148 152 A 54 54 0 0 0 142 164" fill="none" stroke="#d4a017" stroke-width="1.8"/>
  <text x="158" y="152" font-family="sans-serif" font-size="13" font-weight="bold" fill="#d4a017">+β</text>

  <!-- Vertical sight line down (俯角) -->
  <line x1="100" y1="175" x2="290" y2="235" stroke="#3a7d44" stroke-width="2" marker-end="url(#a2)" opacity="0.75"/>
  <text x="296" y="240" font-family="sans-serif" font-size="13" fill="#3a7d44">B（俯角 −）</text>
  <!-- Vertical angle arc (-) -->
  <path d="M 145 188 A 48 48 0 0 1 142 198" fill="none" stroke="#d4a017" stroke-width="1.8"/>
  <text x="155" y="206" font-family="sans-serif" font-size="13" font-weight="bold" fill="#d4a017">−β</text>

  <!-- Legend -->
  <text x="20" y="245" font-family="sans-serif" font-size="11" fill="#555">水平角 = 2 方向の鉛直面がなす角</text>
  <text x="20" y="257" font-family="sans-serif" font-size="11" fill="#555">鉛直角 = 水平面と視準方向のなす角</text>
</svg>
