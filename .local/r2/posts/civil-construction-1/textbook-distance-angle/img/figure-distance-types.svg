<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="水平距離と斜距離の関係">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <!-- Title -->
  <text x="200" y="22" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222">水平距離 と 斜距離</text>

  <!-- Ground baseline (horizontal) -->
  <line x1="40" y1="200" x2="360" y2="200" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="200" y="228" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">水平面（投影面）</text>

  <!-- Point A on left -->
  <circle cx="60" cy="200" r="5" fill="#2e6da4"/>
  <text x="60" y="190" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222">A</text>

  <!-- Point B on slope (upper right) -->
  <circle cx="330" cy="80" r="5" fill="#2e6da4"/>
  <text x="342" y="78" font-family="sans-serif" font-size="14" fill="#222">B</text>

  <!-- B projected onto horizontal (B') -->
  <circle cx="330" cy="200" r="4" fill="#8a8a8a"/>
  <text x="330" y="218" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">B'</text>

  <!-- Slant distance S (A→B) -->
  <line x1="60" y1="200" x2="330" y2="80" stroke="#b22234" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="195" y="125" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b22234">斜距離 S</text>

  <!-- Horizontal distance D (A→B') -->
  <line x1="60" y1="200" x2="326" y2="200" stroke="#2e6da4" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="175" y="192" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2e6da4">水平距離 D</text>

  <!-- Height h (B→B') -->
  <line x1="330" y1="80" x2="330" y2="198" stroke="#3a7d44" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="340" y="145" font-family="sans-serif" font-size="13" fill="#3a7d44">高低差 h</text>

  <!-- Angle indicator at A -->
  <path d="M 92 200 A 32 32 0 0 0 86 188" fill="none" stroke="#d4a017" stroke-width="1.5"/>
  <text x="100" y="184" font-family="sans-serif" font-size="13" fill="#d4a017">θ</text>

  <!-- 関係式ボックス -->
  <rect x="20" y="248" width="360" height="110" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="200" y="268" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222">距離の関係式</text>

  <rect x="30" y="276" width="340" height="26" rx="3" fill="#f8d7da" stroke="#b22234" stroke-width="1"/>
  <text x="200" y="294" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">D = S · cos θ　（斜距離×cosθ = 水平距離）</text>

  <rect x="30" y="306" width="340" height="26" rx="3" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1"/>
  <text x="200" y="324" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">h = S · sin θ　（斜距離×sinθ = 高低差）</text>

  <rect x="30" y="336" width="340" height="16" rx="3" fill="#fff3cd" stroke="#d4a017" stroke-width="1"/>
  <text x="200" y="349" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">S² = D² + h²　（ピタゴラスの関係）</text>

  <!-- 測量での使い分けまとめ -->
  <rect x="20" y="372" width="360" height="112" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="200" y="392" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1a3a5c">測量での使い分け</text>

  <text x="35" y="412" font-family="sans-serif" font-size="11" fill="#555">斜距離 S：光波測距儀（EDM）で直接計測</text>
  <text x="35" y="430" font-family="sans-serif" font-size="11" fill="#555">水平距離 D：地形図・面積計算・設計に使用</text>
  <text x="35" y="448" font-family="sans-serif" font-size="11" fill="#555">高低差 h：縦断測量・盛土・切土量の算出</text>
  <text x="35" y="466" font-family="sans-serif" font-size="11" fill="#8a8a8a">※ D・h は S と θ から換算して求める</text>
</svg>
