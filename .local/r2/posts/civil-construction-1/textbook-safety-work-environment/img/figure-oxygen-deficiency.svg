<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="酸素欠乏危険場所の換気と測定。作業開始前に酸素濃度18パーセント以上・硫化水素10ppm以下を測定で確認し、換気しながら作業、異常時は退避する">
  <text x="200" y="22" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1a3a5c">酸欠危険場所：酸素18%以上・硫化水素10ppm以下を確認（酸欠則）</text>

  <!-- 地表ライン -->
  <line x1="20" y1="70" x2="380" y2="70" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="26" y="64" font-family="sans-serif" font-size="11" fill="#8a8a8a">地表</text>

  <!-- 縦坑・ピット（淡塗り） -->
  <rect x="120" y="70" width="160" height="330" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="200" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">深い立坑・ピット・</text>
  <text x="200" y="138" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">暗きょ・タンク内部</text>

  <!-- 換気（送気）ダクト -->
  <rect x="60" y="70" width="18" height="300" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <path d="M69 366 l-6 -10 h12 z" fill="#2e6da4"/>
  <text x="52" y="220" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222" transform="rotate(-90 52 220)">換気（送気）</text>

  <!-- 測定器・測定点 -->
  <rect x="150" y="250" width="100" height="26" rx="4" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="200" y="267" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1a3a5c">測定点（測定器）</text>

  <!-- 測定基準ボックス -->
  <rect x="130" y="300" width="140" height="60" rx="6" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="200" y="322" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1a3a5c">酸素 18% 以上</text>
  <text x="200" y="342" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1a3a5c">硫化水素 10ppm 以下</text>

  <!-- 退避（上向き矢印） -->
  <line x1="300" y1="390" x2="300" y2="100" stroke="#2e6da4" stroke-width="2"/>
  <path d="M300 100 l-6 12 h12 z" fill="#2e6da4"/>
  <text x="320" y="250" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222" transform="rotate(-90 320 250)">異常時は退避</text>

  <!-- 補足 -->
  <rect x="30" y="416" width="340" height="66" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="200" y="437" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">作業開始前に測定・作業中は換気で濃度を保持</text>
  <text x="200" y="456" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">主任者が測定・指揮（第2種＝酸素+硫化水素）</text>
  <text x="200" y="475" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8a8a">根拠：酸欠則 第2条・第3条・第5条</text>
</svg>
