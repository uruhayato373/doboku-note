<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" style="max-width:400px;width:100%" role="img" aria-label="油圧バックホゥの作業装置構成。ブーム・アーム・バケットとブームシリンダ・アームシリンダ・バケットシリンダの配置、および本体（旋回台）との接続を示す側面図">
  <style>
    text { font-family: "Hiragino Sans", "Yu Gothic", sans-serif; }
    .body { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
    .boom { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
    .arm { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
    .bucket { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
    .cylinder { fill: #ffffff; stroke: #222; stroke-width: 1.2; }
    .piston { fill: #8a8a8a; stroke: #222; stroke-width: 1; }
    .pin { fill: #222; }
    .label { font-size: 11px; fill: #1a3a5c; }
    .annot { font-size: 10px; fill: #555; }
  </style>

  <!-- Ground -->
  <line x1="10" y1="295" x2="390" y2="295" stroke="#222" stroke-width="1"/>
  <g stroke="#8a8a8a" stroke-width="0.8">
    <line x1="30" y1="295" x2="20" y2="305"/>
    <line x1="60" y1="295" x2="50" y2="305"/>
    <line x1="90" y1="295" x2="80" y2="305"/>
    <line x1="120" y1="295" x2="110" y2="305"/>
    <line x1="150" y1="295" x2="140" y2="305"/>
    <line x1="180" y1="295" x2="170" y2="305"/>
    <line x1="210" y1="295" x2="200" y2="305"/>
    <line x1="240" y1="295" x2="230" y2="305"/>
    <line x1="270" y1="295" x2="260" y2="305"/>
    <line x1="300" y1="295" x2="290" y2="305"/>
    <line x1="330" y1="295" x2="320" y2="305"/>
    <line x1="360" y1="295" x2="350" y2="305"/>
  </g>

  <!-- Body (旋回台 + クローラ) -->
  <rect x="280" y="220" width="90" height="50" rx="6" class="body"/>
  <text x="325" y="252" class="label" text-anchor="middle">本体（旋回台）</text>
  <!-- クローラ -->
  <rect x="265" y="270" width="120" height="18" rx="9" class="body"/>
  <circle cx="280" cy="279" r="5" fill="#3a7d44"/>
  <circle cx="370" cy="279" r="5" fill="#3a7d44"/>

  <!-- Boom (上向きの腕, from 旋回台 up to 中央) -->
  <polygon points="280,225 190,130 175,145 275,250" class="boom"/>
  <text x="235" y="185" class="label">ブーム</text>

  <!-- Boom cylinder: 本体から Boom へ -->
  <rect x="260" y="205" width="35" height="10" rx="2" class="cylinder"/>
  <rect x="220" y="195" width="50" height="10" rx="2" class="piston"/>
  <circle cx="220" cy="200" r="2" class="pin"/>
  <circle cx="285" cy="210" r="2" class="pin"/>
  <text x="263" y="193" class="annot">ブームシリンダ</text>

  <!-- Arm (下向き, Boom 先端から下) -->
  <polygon points="195,130 170,140 135,235 160,245" class="arm"/>
  <text x="145" y="190" class="label">アーム</text>

  <!-- Arm cylinder: Boom 上 から Arm へ -->
  <rect x="215" y="155" width="30" height="8" rx="2" class="cylinder"/>
  <rect x="180" y="151" width="40" height="8" rx="2" class="piston"/>
  <circle cx="180" cy="155" r="2" class="pin"/>
  <circle cx="240" cy="159" r="2" class="pin"/>
  <text x="208" y="148" class="annot">アームシリンダ</text>

  <!-- Bucket (at Arm 先端) -->
  <path d="M 135 235 L 160 245 L 155 270 Q 130 280 115 268 L 125 240 Z" class="bucket"/>
  <text x="138" y="260" class="label">バケット</text>
  <!-- ツメ -->
  <polygon points="115,268 110,275 122,275" class="bucket"/>
  <polygon points="130,275 125,282 137,282" class="bucket"/>

  <!-- Bucket cylinder: Arm から Bucket へ -->
  <rect x="148" y="215" width="25" height="7" rx="2" class="cylinder"/>
  <rect x="125" y="211" width="28" height="7" rx="2" class="piston"/>
  <circle cx="125" cy="214" r="2" class="pin"/>
  <circle cx="170" cy="218" r="2" class="pin"/>
  <text x="100" y="206" class="annot">バケットシリンダ</text>

  <!-- Title -->
  <text x="200" y="25" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">油圧バックホゥの作業装置構成</text>

  <!-- Legend -->
  <g transform="translate(15,320)">
    <rect x="0" y="-8" width="12" height="8" class="boom"/>
    <text x="17" y="0" class="annot">ブーム</text>
    <rect x="55" y="-8" width="12" height="8" class="arm"/>
    <text x="72" y="0" class="annot">アーム</text>
    <rect x="110" y="-8" width="12" height="8" class="bucket"/>
    <text x="127" y="0" class="annot">バケット</text>
    <rect x="170" y="-8" width="12" height="8" class="cylinder"/>
    <text x="187" y="0" class="annot">シリンダ</text>
    <rect x="230" y="-8" width="12" height="8" class="body"/>
    <text x="247" y="0" class="annot">本体</text>
  </g>
</svg>
