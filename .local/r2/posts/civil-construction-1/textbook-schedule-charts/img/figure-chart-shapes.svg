<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="主な工程図表の形状比較。バーチャートは作業ごとの横棒、ガントチャートは達成度の横棒、出来高累計曲線はS字、工程管理曲線はバナナ形">
  <text x="200" y="24" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1a3a5c">工程図表の形状：バー／ガント／Sカーブ／バナナ曲線</text>

  <!-- パネル1 バーチャート -->
  <rect x="14" y="40" width="182" height="200" rx="6" fill="#ffffff" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="105" y="60" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1a3a5c">バーチャート</text>
  <line x1="40" y1="76" x2="40" y2="215" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="40" y1="215" x2="182" y2="215" stroke="#8a8a8a" stroke-width="1.2"/>
  <rect x="55" y="90" width="70" height="11" fill="#2e6da4"/>
  <rect x="80" y="112" width="85" height="11" fill="#2e6da4"/>
  <rect x="48" y="134" width="60" height="11" fill="#2e6da4"/>
  <rect x="100" y="156" width="72" height="11" fill="#2e6da4"/>
  <rect x="70" y="178" width="55" height="11" fill="#2e6da4"/>
  <text x="105" y="232" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8a8a">縦=作業／横=工期・日数が判明</text>

  <!-- パネル2 ガントチャート -->
  <rect x="204" y="40" width="182" height="200" rx="6" fill="#ffffff" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="295" y="60" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1a3a5c">ガントチャート</text>
  <line x1="230" y1="76" x2="230" y2="215" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="230" y1="215" x2="372" y2="215" stroke="#8a8a8a" stroke-width="1.2"/>
  <rect x="230" y="90" width="120" height="11" fill="#2e6da4"/>
  <rect x="230" y="112" width="70" height="11" fill="#2e6da4"/>
  <rect x="230" y="134" width="100" height="11" fill="#2e6da4"/>
  <rect x="230" y="156" width="45" height="11" fill="#2e6da4"/>
  <rect x="230" y="178" width="90" height="11" fill="#2e6da4"/>
  <text x="295" y="232" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8a8a">横=達成度%・進捗が判明</text>

  <!-- パネル3 Sカーブ -->
  <rect x="14" y="260" width="182" height="200" rx="6" fill="#ffffff" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="105" y="280" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1a3a5c">出来高累計曲線（Sカーブ）</text>
  <line x1="40" y1="296" x2="40" y2="435" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="40" y1="435" x2="182" y2="435" stroke="#8a8a8a" stroke-width="1.2"/>
  <path d="M40 435 C 80 432 90 400 105 366 C 120 332 135 302 180 300" fill="none" stroke="#2e6da4" stroke-width="2.5"/>
  <text x="52" y="312" font-family="sans-serif" font-size="11" fill="#8a8a8a">出来高%</text>
  <text x="110" y="452" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8a8a">初期・終期は緩、中期は急</text>

  <!-- パネル4 バナナ曲線 -->
  <rect x="204" y="260" width="182" height="200" rx="6" fill="#ffffff" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="295" y="280" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1a3a5c">工程管理曲線（バナナ曲線）</text>
  <line x1="230" y1="296" x2="230" y2="435" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="230" y1="435" x2="372" y2="435" stroke="#8a8a8a" stroke-width="1.2"/>
  <path d="M230 435 C 250 410 255 360 285 330 C 315 300 340 300 366 300" fill="none" stroke="#2e6da4" stroke-width="2"/>
  <path d="M230 435 C 256 425 300 400 320 372 C 345 336 350 312 366 300" fill="none" stroke="#2e6da4" stroke-width="2"/>
  <path d="M230 435 C 255 418 290 384 300 352 C 320 316 345 306 366 300" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="295" y="452" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8a8a">上方・下方限界の間に収める</text>
</svg>
