<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="安全施工サイクル。毎作業日・毎週・毎月・随時の安全活動をサイクルとして繰り返す">
  <text x="200" y="24" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1a3a5c">安全施工サイクル：毎作業日・毎週・毎月・随時を繰り返す</text>

  <!-- 毎作業日 -->
  <rect x="36" y="44" width="292" height="98" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="52" y="66" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1a3a5c">毎作業日</text>
  <text x="52" y="88" font-family="sans-serif" font-size="11" fill="#222">安全朝礼・危険予知（KY）・作業開始前点検</text>
  <text x="52" y="108" font-family="sans-serif" font-size="11" fill="#222">現場巡視・作業中の指導・安全工程打合せ</text>
  <text x="52" y="128" font-family="sans-serif" font-size="11" fill="#222">片付け・終了の確認</text>

  <!-- 毎週 -->
  <rect x="36" y="150" width="292" height="48" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="52" y="170" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1a3a5c">毎週</text>
  <text x="52" y="190" font-family="sans-serif" font-size="11" fill="#222">週間工程打合せ・週間点検・一斉片付け</text>

  <!-- 毎月 -->
  <rect x="36" y="206" width="292" height="70" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="52" y="226" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1a3a5c">毎月</text>
  <text x="52" y="248" font-family="sans-serif" font-size="11" fill="#222">安全衛生協議会・定期点検・自主検査</text>
  <text x="52" y="268" font-family="sans-serif" font-size="11" fill="#222">安全衛生教育・職長会・安全大会</text>

  <!-- 随時 -->
  <rect x="36" y="284" width="292" height="48" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="52" y="304" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222">随時</text>
  <text x="52" y="324" font-family="sans-serif" font-size="11" fill="#8a8a8a">新規入場者教育・持込機械の届出 等</text>

  <!-- 繰り返し矢印 -->
  <path d="M340 300 C 372 300 372 60 344 60" fill="none" stroke="#2e6da4" stroke-width="2"/>
  <path d="M344 60 l10 -4 v8 z" fill="#2e6da4"/>
  <text x="368" y="185" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8a8a" transform="rotate(90 368 185)">繰り返す</text>

  <text x="200" y="358" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8a8a">活動を定着させ、危険への感受性を高める</text>
</svg>
