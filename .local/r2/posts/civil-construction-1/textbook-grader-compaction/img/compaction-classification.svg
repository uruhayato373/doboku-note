<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" style="max-width:420px;width:100%" role="img" aria-label="締固め機械の分類と適用土質">
  <text x="210" y="22" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222">締固め機械の分類と適用土質</text>

  <!-- 中心 -->
  <rect x="140" y="40" width="140" height="40" fill="#2e6da4" rx="6"/>
  <text x="210" y="65" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">締固め機械</text>

  <!-- 左分岐：静的締固め -->
  <line x1="175" y1="80" x2="100" y2="115" stroke="#2e6da4" stroke-width="1.5"/>
  <rect x="20" y="115" width="160" height="30" fill="#b22234" rx="5"/>
  <text x="100" y="135" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">静的締固め</text>

  <!-- 左の機械リスト -->
  <g transform="translate(20,155)">
    <rect x="0" y="0" width="160" height="190" fill="#ffffff" stroke="#b22234" stroke-width="1" rx="4"/>
    <text x="10" y="18" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222">ロードローラ</text>
    <text x="10" y="35" font-family="sans-serif" font-size="11" fill="#555">• マカダム: 砕石・初期転圧</text>
    <text x="10" y="50" font-family="sans-serif" font-size="11" fill="#555">• タンデム: アスファルト仕上</text>
    <text x="10" y="72" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222">タイヤローラ</text>
    <text x="10" y="89" font-family="sans-serif" font-size="11" fill="#555">• 接地圧 0.1〜0.7 MPa 可変</text>
    <text x="10" y="104" font-family="sans-serif" font-size="11" fill="#555">• バラスト・空気圧調整</text>
    <text x="10" y="126" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222">タンピングローラ</text>
    <text x="10" y="143" font-family="sans-serif" font-size="11" fill="#555">• シープスフート等の突起</text>
    <text x="10" y="158" font-family="sans-serif" font-size="11" fill="#555">• 重転圧・岩塊破砕</text>
    <text x="10" y="180" font-family="sans-serif" font-size="10" fill="#b22234" font-weight="bold">適用: 砂礫・粘性土・大規模盛土</text>
  </g>

  <!-- 右分岐：動的締固め -->
  <line x1="245" y1="80" x2="320" y2="115" stroke="#2e6da4" stroke-width="1.5"/>
  <rect x="240" y="115" width="160" height="30" fill="#3a7d44" rx="5"/>
  <text x="320" y="135" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">動的締固め（振動・衝撃）</text>

  <!-- 右の機械リスト -->
  <g transform="translate(240,155)">
    <rect x="0" y="0" width="160" height="190" fill="#ffffff" stroke="#3a7d44" stroke-width="1" rx="4"/>
    <text x="10" y="18" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222">振動ローラ</text>
    <text x="10" y="35" font-family="sans-serif" font-size="11" fill="#555">• 起振力 = 自重の 1〜5 倍</text>
    <text x="10" y="50" font-family="sans-serif" font-size="11" fill="#555">• 層厚 20〜40 cm で深層到達</text>
    <text x="10" y="72" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222">振動コンパクタ</text>
    <text x="10" y="89" font-family="sans-serif" font-size="11" fill="#555">• 小型・狭あい地向け</text>
    <text x="10" y="104" font-family="sans-serif" font-size="11" fill="#555">• 手押し・自走</text>
    <text x="10" y="126" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222">ランマ（タンパ）</text>
    <text x="10" y="143" font-family="sans-serif" font-size="11" fill="#555">• 衝撃打撃式</text>
    <text x="10" y="158" font-family="sans-serif" font-size="11" fill="#555">• 狭所の局部転圧</text>
    <text x="10" y="180" font-family="sans-serif" font-size="10" fill="#3a7d44" font-weight="bold">適用: 砂・砂礫・埋戻し・狭所</text>
  </g>

  <!-- 注釈 -->
  <text x="210" y="370" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">※ モータグレーダはブレードで整形、締固めは別機械</text>
</svg>
