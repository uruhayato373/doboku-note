<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="タイヤローラの締固め力は2つの手段で調整する。タイヤ空気圧を変えると接地圧が変わり表面付近の締固め効果に効き、バラストの積込み量を変えると輪荷重が変わり深さ方向の締固め力に効く。砕石は接地圧を高く、粘性土は低くする">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-name { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-cap  { font-size: 11px; fill: #555; }
      .t-val  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-sec  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-item { font-size: 11px; fill: #222; }
      .t-key  { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .box-a { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-b { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-surf { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .rule { stroke: #d7d7d7; stroke-width: 1; }
    </style>
  </defs>

  <text class="t-lead" x="200" y="18" text-anchor="middle">2つの手段で締固め力を変えられる</text>

  <rect class="box-a" x="20" y="28" width="172" height="132" rx="6"/>
  <text class="t-name" x="106" y="54" text-anchor="middle">接地圧</text>
  <line class="rule" x1="32" y1="63" x2="180" y2="63"/>
  <text class="t-cap" x="106" y="84" text-anchor="middle">調整するもの</text>
  <text class="t-val" x="106" y="104" text-anchor="middle">タイヤ空気圧</text>
  <text class="t-cap" x="106" y="128" text-anchor="middle">効くところ</text>
  <text class="t-val" x="106" y="148" text-anchor="middle">表面付近・上層</text>

  <rect class="box-b" x="208" y="28" width="172" height="132" rx="6"/>
  <text class="t-name" x="294" y="54" text-anchor="middle">輪荷重</text>
  <line class="rule" x1="220" y1="63" x2="368" y2="63"/>
  <text class="t-cap" x="294" y="84" text-anchor="middle">調整するもの</text>
  <text class="t-val" x="294" y="104" text-anchor="middle">バラスト積込み量</text>
  <text class="t-cap" x="294" y="128" text-anchor="middle">効くところ</text>
  <text class="t-val" x="294" y="148" text-anchor="middle">深さ方向・下層</text>

  <rect class="box-w" x="20" y="176" width="360" height="130" rx="6"/>
  <text class="t-sec" x="200" y="200" text-anchor="middle">土質による接地圧の使い分け</text>
  <line class="rule" x1="36" y1="209" x2="364" y2="209"/>
  <text class="t-key" x="40" y="234">砕石など</text>
  <text class="t-item" x="150" y="234">接地圧を高くする</text>
  <text class="t-key" x="40" y="258">粘性土</text>
  <text class="t-item" x="150" y="258">接地圧を低くする</text>
  <text class="t-item" x="40" y="282">接地圧は約 0.1〜0.7 MPa の範囲で変えられる</text>
  <text class="t-item" x="40" y="300">土の支持力の 2〜8 割増し程度で締め固めるとよい</text>

  <rect class="box-surf" x="20" y="322" width="360" height="160" rx="6"/>
  <text class="t-sec" x="200" y="346" text-anchor="middle">締固めの進み方に応じた運用</text>
  <line class="rule" x1="36" y1="355" x2="364" y2="355"/>
  <text class="t-key" x="40" y="380">初転圧・支持力が弱い粘土</text>
  <text class="t-item" x="40" y="398">バラストなしで空気圧を低くする</text>
  <text class="t-key" x="40" y="424">締固めが進み支持力が増したら</text>
  <text class="t-item" x="40" y="442">バラストを多く積み、空気圧を上げる</text>
  <text class="t-item" x="40" y="468">バラストを減らすと接地面積が減り、及ぶ深さが変わる</text>
</svg>
