<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" style="max-width:400px;width:100%" role="img" aria-label="3種類の余裕時間（トータルフロート・フリーフロート・インターフェアリングフロート）を1つのタイムラインで比較">
  <style>
    .title { font-family: "Hiragino Sans","Yu Gothic",sans-serif; font-size: 13px; fill: #555; }
    .row-label { font-family: "Hiragino Sans","Yu Gothic",sans-serif; font-size: 12px; fill: #222; font-weight: 600; }
    .axis-label { font-family: "Hiragino Sans","Yu Gothic",sans-serif; font-size: 11px; fill: #555; }
    .float-tf { font-family: "Hiragino Sans","Yu Gothic",sans-serif; font-size: 12px; fill: #d4a017; font-weight: 700; }
    .float-ff { font-family: "Hiragino Sans","Yu Gothic",sans-serif; font-size: 12px; fill: #3a7d44; font-weight: 700; }
    .float-if { font-family: "Hiragino Sans","Yu Gothic",sans-serif; font-size: 12px; fill: #b22234; font-weight: 700; }
    .sub { font-family: "Hiragino Sans","Yu Gothic",sans-serif; font-size: 11px; fill: #555; }
  </style>

  <text x="200" y="20" text-anchor="middle" class="title">余裕時間の3種類（TF=5日, FF=3日, IF=2日 の例）</text>

  <!-- timeline axis -->
  <line x1="60" y1="290" x2="380" y2="290" stroke="#222" stroke-width="1.5"/>
  <text x="60" y="310" text-anchor="middle" class="axis-label">0</text>
  <text x="140" y="310" text-anchor="middle" class="axis-label">4</text>
  <text x="220" y="310" text-anchor="middle" class="axis-label">8</text>
  <text x="300" y="310" text-anchor="middle" class="axis-label">12</text>
  <text x="380" y="310" text-anchor="middle" class="axis-label">(日)</text>

  <!-- tick marks -->
  <line x1="60" y1="288" x2="60" y2="293" stroke="#222"/>
  <line x1="140" y1="288" x2="140" y2="293" stroke="#222"/>
  <line x1="220" y1="288" x2="220" y2="293" stroke="#222"/>
  <line x1="300" y1="288" x2="300" y2="293" stroke="#222"/>

  <!-- Row 1: Activity at EST (earliest start) -->
  <text x="10" y="70" class="row-label">EST で開始</text>
  <rect x="120" y="58" width="80" height="22" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="160" y="74" text-anchor="middle" class="sub">作業（4日）</text>
  <text x="120" y="50" class="axis-label">3日</text>
  <text x="200" y="50" class="axis-label">7日（EFT）</text>

  <!-- Row 2: Successor activity at its EST -->
  <text x="10" y="120" class="row-label">後続作業</text>
  <rect x="260" y="108" width="80" height="22" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
  <text x="300" y="124" text-anchor="middle" class="sub">次の作業</text>
  <text x="260" y="100" class="axis-label">10日（後続EST）</text>

  <!-- FF bracket -->
  <line x1="200" y1="140" x2="260" y2="140" stroke="#3a7d44" stroke-width="2"/>
  <line x1="200" y1="135" x2="200" y2="145" stroke="#3a7d44" stroke-width="2"/>
  <line x1="260" y1="135" x2="260" y2="145" stroke="#3a7d44" stroke-width="2"/>
  <text x="230" y="158" text-anchor="middle" class="float-ff">FF = 3日</text>

  <!-- Row 3: Activity at LST (latest start) -->
  <text x="10" y="195" class="row-label">LST で開始</text>
  <rect x="220" y="183" width="80" height="22" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text x="260" y="199" text-anchor="middle" class="sub">作業（4日）</text>
  <text x="300" y="225" class="axis-label">12日（LFT）</text>

  <!-- TF bracket -->
  <line x1="120" y1="228" x2="220" y2="228" stroke="#d4a017" stroke-width="2"/>
  <line x1="120" y1="223" x2="120" y2="233" stroke="#d4a017" stroke-width="2"/>
  <line x1="220" y1="223" x2="220" y2="233" stroke="#d4a017" stroke-width="2"/>
  <text x="170" y="246" text-anchor="middle" class="float-tf">TF = 5日</text>

  <!-- IF bracket -->
  <line x1="200" y1="260" x2="220" y2="260" stroke="#b22234" stroke-width="2"/>
  <line x1="200" y1="255" x2="200" y2="265" stroke="#b22234" stroke-width="2"/>
  <line x1="220" y1="255" x2="220" y2="265" stroke="#b22234" stroke-width="2"/>
  <text x="180" y="278" text-anchor="middle" class="float-if">IF = 2日</text>
</svg>
