<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="最遅完了時刻（LFT）の計算例：右から左に所要時間を減算し、複数経路がある場合は最小値を採る">
  <defs>
    <marker markerUnits="userSpaceOnUse" id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <style>
    .title { font-family: "Hiragino Sans","Yu Gothic",sans-serif; font-size: 13px; fill: #555; }
    .node-num { font-family: "Hiragino Sans","Yu Gothic",sans-serif; font-size: 14px; fill: #1a3a5c; font-weight: 600; }
    .activity { font-family: "Hiragino Sans","Yu Gothic",sans-serif; font-size: 13px; fill: #222; font-weight: 600; }
    .duration { font-family: "Hiragino Sans","Yu Gothic",sans-serif; font-size: 12px; fill: #555; }
    .lft-box { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
    .lft-num { font-family: "Hiragino Sans","Yu Gothic",sans-serif; font-size: 12px; fill: #d4a017; font-weight: 700; }
    .sub { font-family: "Hiragino Sans","Yu Gothic",sans-serif; font-size: 11px; fill: #555; }
    .rule-title { font-family: "Hiragino Sans","Yu Gothic",sans-serif; font-size: 12px; fill: #1a3a5c; font-weight: 700; }
    .rule-body { font-family: "Hiragino Sans","Yu Gothic",sans-serif; font-size: 11px; fill: #222; }
  </style>

  <text x="200" y="14" text-anchor="middle" class="title">最遅完了時刻（LFT）：右→左に減算</text>
  <text x="200" y="28" text-anchor="middle" class="title">合流は最小値（□で表記）</text>

  <!-- nodes with LFT boxes -->
  <circle cx="40" cy="175" r="20" fill="#ffffff" stroke="#2e6da4" stroke-width="2"/>
  <text x="40" y="181" text-anchor="middle" class="node-num">①</text>
  <rect x="26" y="138" width="28" height="18" rx="2" class="lft-box"/>
  <text x="40" y="151" text-anchor="middle" class="lft-num">0</text>

  <circle cx="155" cy="175" r="20" fill="#ffffff" stroke="#2e6da4" stroke-width="2"/>
  <text x="155" y="181" text-anchor="middle" class="node-num">②</text>
  <rect x="141" y="138" width="28" height="18" rx="2" class="lft-box"/>
  <text x="155" y="151" text-anchor="middle" class="lft-num">5</text>

  <circle cx="265" cy="90" r="20" fill="#ffffff" stroke="#2e6da4" stroke-width="2"/>
  <text x="265" y="96" text-anchor="middle" class="node-num">③</text>
  <rect x="251" y="53" width="28" height="18" rx="2" class="lft-box"/>
  <text x="265" y="66" text-anchor="middle" class="lft-num">16</text>

  <circle cx="370" cy="175" r="20" fill="#ffffff" stroke="#2e6da4" stroke-width="2"/>
  <text x="370" y="181" text-anchor="middle" class="node-num">④</text>
  <rect x="356" y="138" width="28" height="18" rx="2" class="lft-box"/>
  <text x="370" y="151" text-anchor="middle" class="lft-num">22</text>

  <!-- arrows -->
  <line x1="60" y1="175" x2="135" y2="175" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="98" y="167" text-anchor="middle" class="activity">A</text>
  <text x="98" y="191" text-anchor="middle" class="duration">5</text>

  <line x1="168" y1="160" x2="252" y2="104" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="197" y="120" class="activity">B</text>
  <text x="214" y="143" class="duration">7</text>

  <line x1="175" y1="175" x2="350" y2="175" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="262" y="167" text-anchor="middle" class="activity">D</text>
  <text x="262" y="191" text-anchor="middle" class="duration">17</text>

  <line x1="278" y1="104" x2="356" y2="161" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="121" class="activity">C</text>
  <text x="312" y="145" class="duration">6</text>

  <!-- calculation block -->
  <rect x="20" y="218" width="360" height="60" rx="4" fill="#fff3cd" stroke="#d4a017" stroke-width="1.2"/>
  <text x="32" y="238" class="rule-title">分岐点（ノード②）のLFT計算</text>
  <text x="32" y="256" class="rule-body">経路1: LFT④ - D = 22-17 = 5日</text>
  <text x="32" y="272" class="rule-body">経路2: LFT③ - B = 16-7 = 9日　→ 最小値 5日を採用</text>

  <!-- rule table -->
  <rect x="20" y="295" width="360" height="185" rx="4" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.2"/>
  <text x="32" y="316" class="rule-title">LFT 計算ルール</text>

  <line x1="20" y1="323" x2="380" y2="323" stroke="#2e6da4" stroke-width="0.8"/>

  <text x="32" y="336" class="rule-body">手順1: 終了イベントの LFT =</text>
  <text x="32" y="350" class="rule-body">　　　プロジェクト工期（= EST の最大値）</text>
  <text x="32" y="358" class="rule-body">手順2: 各アクティビティの LFT から所要時間を減算（右→左）</text>
  <text x="32" y="376" class="rule-body">手順3: 複数経路が分岐する場合は最小値を採用</text>
  <text x="32" y="394" class="rule-body">手順4: すべてのアクティビティを右から左に処理</text>

  <line x1="20" y1="408" x2="380" y2="408" stroke="#2e6da4" stroke-width="0.8"/>

  <text x="32" y="425" class="rule-body">最小値を採る理由：後続作業の中で最も余裕のない経路に</text>
  <text x="32" y="443" class="rule-body">合わせないと、全体工期を超過してしまうため</text>
  <text x="32" y="461" class="rule-body">LFT は □（黄色枠）で表記（EST の緑数字と区別）</text>

  <text x="200" y="492" text-anchor="middle" class="sub">LFT = Latest Finish Time（最遅完了時刻）</text>
</svg>
