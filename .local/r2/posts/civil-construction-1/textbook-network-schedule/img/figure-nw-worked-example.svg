<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="ネットワーク計算の演習例。4結合点・5作業のネットワークで、各結合点の最早/最遅時刻を求め、全体工期11日、クリティカルパスは①→②→③→④（作業A→E→D）となる">
  <defs>
    <marker id="nwarr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#555"/></marker>
  </defs>
  <text x="200" y="22" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1a3a5c">ネットワーク計算例：全体工期11日・CP＝①→②→③→④</text>

  <!-- 作業（矢線）-->
  <line x1="87" y1="180" x2="181" y2="121" stroke="#2e6da4" stroke-width="2.6" marker-end="url(#nwarr)"/>
  <text x="120" y="142" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1a3a5c">A=4</text>
  <line x1="86" y1="202" x2="182" y2="277" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#nwarr)"/>
  <text x="120" y="256" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">B=3</text>
  <line x1="200" y1="132" x2="200" y2="268" stroke="#2e6da4" stroke-width="2.6" marker-end="url(#nwarr)"/>
  <text x="214" y="204" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1a3a5c">E=2</text>
  <line x1="217" y1="121" x2="312" y2="179" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#nwarr)"/>
  <text x="280" y="142" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">C=6</text>
  <line x1="216" y1="278" x2="313" y2="202" stroke="#2e6da4" stroke-width="2.6" marker-end="url(#nwarr)"/>
  <text x="280" y="256" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1a3a5c">D=5</text>

  <!-- 結合点 -->
  <circle cx="70" cy="190" r="20" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.6"/>
  <text x="70" y="196" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a3a5c">1</text>
  <text x="70" y="236" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222">0 / 0</text>
  <circle cx="200" cy="110" r="20" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.6"/>
  <text x="200" y="116" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a3a5c">2</text>
  <text x="200" y="84" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222">4 / 4</text>
  <circle cx="200" cy="290" r="20" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.6"/>
  <text x="200" y="296" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a3a5c">3</text>
  <text x="200" y="326" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222">6 / 6</text>
  <circle cx="330" cy="190" r="20" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.6"/>
  <text x="330" y="196" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a3a5c">4</text>
  <text x="330" y="236" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222">11 / 11</text>

  <text x="330" y="118" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8a8a">数字＝最早/最遅</text>

  <!-- 結果 -->
  <rect x="24" y="356" width="352" height="128" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="40" y="378" font-family="sans-serif" font-size="12" fill="#222">全体工期＝最長経路＝11日</text>
  <text x="40" y="399" font-family="sans-serif" font-size="12" fill="#222">CP（余裕0）＝①→②→③→④（A→E→D）</text>
  <text x="40" y="424" font-family="sans-serif" font-size="12" fill="#1a3a5c">非CP作業の余裕</text>
  <text x="40" y="444" font-family="sans-serif" font-size="12" fill="#222">B（①→③）：TF＝6−0−3＝3、FF＝3</text>
  <text x="40" y="464" font-family="sans-serif" font-size="12" fill="#222">C（②→④）：TF＝11−4−6＝1、FF＝1</text>
</svg>
