<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="ダミー（疑似作業）は点線矢印で表記し、所要時間ゼロの疑似作業として起終点イベントを区別する">
  <defs>
    <marker markerUnits="userSpaceOnUse" id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker markerUnits="userSpaceOnUse" id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>
  <style>
    .label       { font-family: "Hiragino Sans","Yu Gothic",sans-serif; font-size: 16px; fill: #222; font-weight: 600; }
    .label-dummy { font-family: "Hiragino Sans","Yu Gothic",sans-serif; font-size: 13px; fill: #8a8a8a; }
    .title       { font-family: "Hiragino Sans","Yu Gothic",sans-serif; font-size: 15px; fill: #222; font-weight: 600; }
    .note        { font-family: "Hiragino Sans","Yu Gothic",sans-serif; font-size: 13px; fill: #555; }
    .node-num    { font-family: "Hiragino Sans","Yu Gothic",sans-serif; font-size: 18px; fill: #1a3a5c; font-weight: 600; }
  </style>

  <!-- Title -->
  <text x="200" y="44" text-anchor="middle" class="title">ダミー（疑似作業）の記法</text>
  <text x="200" y="68" text-anchor="middle" class="note">点線矢印：所要時間ゼロの論理的依存関係</text>

  <!-- node 1 -->
  <circle cx="70" cy="220" r="28" fill="#ffffff" stroke="#2e6da4" stroke-width="2.5"/>
  <text x="70" y="229" text-anchor="middle" class="node-num">①</text>

  <!-- node 2 -->
  <circle cx="220" cy="150" r="28" fill="#ffffff" stroke="#2e6da4" stroke-width="2.5"/>
  <text x="220" y="159" text-anchor="middle" class="node-num">②</text>

  <!-- node 3 -->
  <circle cx="220" cy="290" r="28" fill="#ffffff" stroke="#2e6da4" stroke-width="2.5"/>
  <text x="220" y="299" text-anchor="middle" class="node-num">③</text>

  <!-- node 4 -->
  <circle cx="340" cy="220" r="28" fill="#ffffff" stroke="#2e6da4" stroke-width="2.5"/>
  <text x="340" y="229" text-anchor="middle" class="node-num">④</text>

  <!-- activity arrows -->
  <line x1="96" y1="207" x2="194" y2="163" stroke="#222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="135" y="179" text-anchor="middle" class="label">A</text>

  <line x1="96" y1="233" x2="194" y2="277" stroke="#222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="135" y="266" text-anchor="middle" class="label">B</text>

  <line x1="248" y1="163" x2="314" y2="207" stroke="#222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="290" y="178" text-anchor="middle" class="label">C</text>

  <!-- dummy (dashed) -->
  <line x1="220" y1="178" x2="220" y2="262" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-dash)"/>
  <text x="234" y="225" class="label-dummy">ダミー</text>
  <text x="234" y="242" class="label-dummy">（0日）</text>

  <!-- divider -->
  <line x1="30" y1="352" x2="370" y2="352" stroke="#d7d7d7" stroke-width="1"/>

  <!-- Explanation -->
  <text x="200" y="384" text-anchor="middle" class="note">A と B は同じ①を起点とする別作業</text>
  <text x="200" y="408" text-anchor="middle" class="note">②と③を区別するためダミーで②→③を接続</text>
  <text x="200" y="432" text-anchor="middle" class="note">C は②が完了後に開始（ダミー経由で③も待つ）</text>
  <text x="200" y="472" text-anchor="middle" class="note" font-size="11">ダミーは所要時間ゼロ・コストゼロの論理矢線</text>
</svg>
