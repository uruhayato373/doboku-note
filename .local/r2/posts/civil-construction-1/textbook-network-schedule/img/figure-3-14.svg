<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="イベント（結合点）は○で示し、中にイベント番号を書き込む">
  <defs>
    <marker markerUnits="userSpaceOnUse" id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <style>
    .label      { font-family: "Hiragino Sans","Yu Gothic",sans-serif; font-size: 15px; fill: #555; }
    .title      { font-family: "Hiragino Sans","Yu Gothic",sans-serif; font-size: 15px; fill: #222; font-weight: 600; }
    .note       { font-family: "Hiragino Sans","Yu Gothic",sans-serif; font-size: 13px; fill: #555; }
    .node-num   { font-family: "Hiragino Sans","Yu Gothic",sans-serif; font-size: 22px; fill: #1a3a5c; font-weight: 600; }
    .annotation { font-family: "Hiragino Sans","Yu Gothic",sans-serif; font-size: 12px; fill: #2e6da4; }
  </style>

  <!-- Title -->
  <text x="200" y="48" text-anchor="middle" class="title">イベント（結合点）の記法</text>

  <!-- left node -->
  <circle cx="110" cy="230" r="36" fill="#e8f0fe" stroke="#2e6da4" stroke-width="2.5"/>
  <text x="110" y="240" text-anchor="middle" class="node-num">1</text>

  <!-- arrow -->
  <line x1="148" y1="230" x2="252" y2="230" stroke="#222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="200" y="218" text-anchor="middle" class="label">作業</text>

  <!-- right node -->
  <circle cx="290" cy="230" r="36" fill="#e8f0fe" stroke="#2e6da4" stroke-width="2.5"/>
  <text x="290" y="240" text-anchor="middle" class="node-num">2</text>

  <!-- annotation lines -->
  <line x1="110" y1="266" x2="110" y2="308" stroke="#2e6da4" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="110" y="322" text-anchor="middle" class="annotation">イベント番号</text>
  <text x="110" y="338" text-anchor="middle" class="annotation">（結合点番号）</text>

  <line x1="290" y1="266" x2="290" y2="308" stroke="#2e6da4" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="290" y="322" text-anchor="middle" class="annotation">イベント番号</text>
  <text x="290" y="338" text-anchor="middle" class="annotation">（結合点番号）</text>

  <!-- divider -->
  <line x1="30" y1="368" x2="370" y2="368" stroke="#d7d7d7" stroke-width="1"/>

  <!-- Rule summary -->
  <text x="200" y="400" text-anchor="middle" class="note">○はイベント（結合点）= 作業の開始・終了点</text>
  <text x="200" y="424" text-anchor="middle" class="note">番号は左から右へ昇順に付ける</text>
  <text x="200" y="448" text-anchor="middle" class="note">塗りつぶし（#e8f0fe）で視認性を確保する</text>
  <text x="200" y="480" text-anchor="middle" class="note" font-size="11">イベント番号はネットワーク図全体で一意</text>
</svg>
