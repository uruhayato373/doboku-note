<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="土量変化率 L と C の関係。地山の土量を基準として、ほぐした土量は地山の L 倍で L は 1 より大きく、締固め土量は地山の C 倍で C は一般に 1 より小さい。締固め土量に L 割る C を掛けるとほぐした土量が得られる">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-bar  { font-size: 12px; font-weight: bold; fill: #222; }
      .t-op   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-sec  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-item { font-size: 11px; fill: #222; }
      .bar-l { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .bar-n { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .bar-c { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .op { stroke: #1a3a5c; stroke-width: 1.5; fill: none; }
      .box-surf { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .rule { stroke: #d7d7d7; stroke-width: 1; }
    </style>
    <marker id="sv-a" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#1a3a5c"/>
    </marker>
  </defs>

  <text class="t-lead" x="200" y="18" text-anchor="middle">同じ土でも状態が変われば体積が変わる</text>

  <rect class="bar-l" x="40" y="34" width="225" height="46" rx="4"/>
  <text class="t-bar" x="52" y="62">ほぐした土量　L ＞ 1</text>

  <line class="op" x1="110" y1="118" x2="110" y2="84" marker-end="url(#sv-a)"/>
  <text class="t-op" x="120" y="105">× L</text>

  <rect class="bar-n" x="40" y="122" width="180" height="46" rx="4"/>
  <text class="t-bar" x="52" y="150">地山の土量　基準 ＝ 1</text>

  <line class="op" x1="110" y1="172" x2="110" y2="206" marker-end="url(#sv-a)"/>
  <text class="t-op" x="120" y="193">× C</text>

  <rect class="bar-c" x="40" y="210" width="162" height="46" rx="4"/>
  <text class="t-bar" x="52" y="238">締固め土量　C ＜ 1</text>

  <polyline class="op" points="206,233 285,233 285,57 269,57" marker-end="url(#sv-a)"/>
  <text class="t-op" x="293" y="148">× L/C</text>

  <rect class="box-surf" x="20" y="300" width="360" height="182" rx="6"/>
  <text class="t-sec" x="200" y="322" text-anchor="middle">読み取り方</text>
  <line class="rule" x1="36" y1="331" x2="364" y2="331"/>
  <text class="t-item" x="40" y="356">地山の土量＝掘削すべき土量（基準）</text>
  <text class="t-item" x="40" y="380">ほぐした土量＝運搬すべき土量</text>
  <text class="t-item" x="40" y="404">締固め土量＝できあがりの盛土量</text>
  <text class="t-item" x="40" y="428">岩や固結した礫質土では C ＞ 1 となることがある</text>
  <text class="t-item" x="40" y="452">L は運搬計画、C は土量配分計画に使う</text>
</svg>
