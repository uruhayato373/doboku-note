<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="標準貫入試験の模式図。63.5キログラムのハンマーを75センチメートルの高さから落下させ、サンプラーを30センチメートル貫入させるのに要する打撃回数がN値である。N値は大きいほど堅硬な地盤を示す">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-lbl  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-gr   { font-size: 11px; fill: #555; }
      .t-band { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-sec  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-n    { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-st   { font-size: 11px; fill: #222; }
      .t-jd   { font-size: 11px; fill: #555; }
      .hammer { fill: #8a8a8a; stroke: #555; stroke-width: 1.5; }
      .anvil  { fill: #d7d7d7; stroke: #555; stroke-width: 1.5; }
      .rod    { stroke: #555; stroke-width: 4; }
      .sampler{ fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .ground { stroke: #8a8a8a; stroke-width: 1.5; }
      .dim    { stroke: #2e6da4; stroke-width: 1; }
      .band   { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-surf { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .rule   { stroke: #d7d7d7; stroke-width: 1; }
    </style>
    <marker id="sp-a" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0,0 7,3.5 0,7" fill="#2e6da4"/>
    </marker>
  </defs>

  <text class="t-lead" x="200" y="18" text-anchor="middle">地盤の支持力や土質を判定する代表的な原位置試験</text>

  <!-- ハンマー -->
  <rect class="hammer" x="145" y="58" width="50" height="34" rx="3"/>
  <text class="t-lbl" x="205" y="80">ハンマー 63.5 kg</text>

  <!-- 落下高さ -->
  <line class="dim" x1="120" y1="92" x2="120" y2="158" marker-start="url(#sp-a)" marker-end="url(#sp-a)"/>
  <text class="t-lbl" x="112" y="129" text-anchor="end">落下高さ 75 cm</text>

  <!-- アンビルとロッド -->
  <rect class="anvil" x="148" y="158" width="44" height="14" rx="2"/>
  <line class="rod" x1="170" y1="172" x2="170" y2="212"/>

  <!-- 地盤 -->
  <line class="ground" x1="40" y1="212" x2="320" y2="212"/>
  <text class="t-gr" x="64" y="206">地盤</text>

  <!-- サンプラー -->
  <rect class="sampler" x="160" y="212" width="20" height="58"/>

  <!-- 貫入量 -->
  <line class="dim" x1="206" y1="212" x2="206" y2="270" marker-start="url(#sp-a)" marker-end="url(#sp-a)"/>
  <text class="t-lbl" x="214" y="246">30 cm 貫入</text>

  <rect class="band" x="20" y="286" width="360" height="44" rx="6"/>
  <text class="t-band" x="200" y="313" text-anchor="middle">30 cm 貫入させるのに要する打撃回数 ＝ N 値</text>

  <rect class="box-surf" x="20" y="342" width="360" height="140" rx="6"/>
  <text class="t-sec" x="200" y="366" text-anchor="middle">N 値と地盤の状態（大きいほど堅硬）</text>
  <line class="rule" x1="36" y1="375" x2="364" y2="375"/>

  <text class="t-n" x="40" y="400">0〜4</text>
  <text class="t-st" x="200" y="400" text-anchor="middle">軟弱粘土</text>
  <text class="t-jd" x="360" y="400" text-anchor="end">地盤改良が必要</text>

  <text class="t-n" x="40" y="424">5〜10</text>
  <text class="t-st" x="200" y="424" text-anchor="middle">やや軟弱</text>
  <text class="t-jd" x="360" y="424" text-anchor="end">慎重な設計が必要</text>

  <text class="t-n" x="40" y="448">11〜30</text>
  <text class="t-st" x="200" y="448" text-anchor="middle">堅硬土</text>
  <text class="t-jd" x="360" y="448" text-anchor="end">通常の基礎設計が可</text>

  <text class="t-n" x="40" y="472">31 以上</text>
  <text class="t-st" x="200" y="472" text-anchor="middle">極めて堅硬</text>
  <text class="t-jd" x="360" y="472" text-anchor="end">良好な支持地盤</text>
</svg>
