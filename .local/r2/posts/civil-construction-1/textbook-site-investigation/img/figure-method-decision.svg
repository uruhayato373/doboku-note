<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="施工方法と施工手順の決定。重点的に検討する工種は数量・工費の大きいもの、高度な技術を要するもの、危険度の高いもの、環境に影響するもの。基本方針は影響の大きい工種を優先し、作業の平準化と繰返しによる習熟を図ること。決定内容は施工図面等にまとめる">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-sec  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-item { font-size: 11px; fill: #222; }
      .t-num  { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .box-a { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-b { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-c { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .rule { stroke: #d7d7d7; stroke-width: 1; }
    </style>
  </defs>

  <text class="t-lead" x="200" y="18" text-anchor="middle">設計図書と事前調査をもとに決定する</text>

  <rect class="box-a" x="20" y="28" width="360" height="142" rx="6"/>
  <text class="t-sec" x="200" y="52" text-anchor="middle">重点的に検討する工種</text>
  <line class="rule" x1="36" y1="61" x2="364" y2="61"/>
  <text class="t-num" x="42" y="86">1</text>
  <text class="t-item" x="60" y="86">数量・工費の大きい工種</text>
  <text class="t-num" x="42" y="110">2</text>
  <text class="t-item" x="60" y="110">高度の技術が要求される工種</text>
  <text class="t-num" x="42" y="134">3</text>
  <text class="t-item" x="60" y="134">安全面での危険度の高い工種</text>
  <text class="t-num" x="42" y="158">4</text>
  <text class="t-item" x="60" y="158">環境に影響を及ぼすことが予想される工種</text>

  <rect class="box-b" x="20" y="182" width="360" height="142" rx="6"/>
  <text class="t-sec" x="200" y="206" text-anchor="middle">施工手順の基本方針</text>
  <line class="rule" x1="36" y1="215" x2="364" y2="215"/>
  <text class="t-num" x="42" y="240">1</text>
  <text class="t-item" x="60" y="240">全体工期・全体工費への影響が大きい工種を優先</text>
  <text class="t-num" x="42" y="264">2</text>
  <text class="t-item" x="60" y="264">制約条件を考慮し機械・資材・労働力の回転を図る</text>
  <text class="t-num" x="42" y="288">3</text>
  <text class="t-item" x="60" y="288">作業の過度な集中を避ける（作業の平準化）</text>
  <text class="t-num" x="42" y="312">4</text>
  <text class="t-item" x="60" y="312">繰返し作業を増して習熟を図り効率を高める</text>

  <rect class="box-c" x="20" y="336" width="360" height="146" rx="6"/>
  <text class="t-sec" x="200" y="360" text-anchor="middle">施工図面等にまとめる内容</text>
  <line class="rule" x1="36" y1="369" x2="364" y2="369"/>
  <text class="t-num" x="42" y="394">1</text>
  <text class="t-item" x="60" y="394">施工手順フロー図・主要工種の施工手順図</text>
  <text class="t-num" x="42" y="418">2</text>
  <text class="t-item" x="60" y="418">仮設備の配置図・仕様・規格・能力・数量</text>
  <text class="t-num" x="42" y="442">3</text>
  <text class="t-item" x="60" y="442">主要工種の機械設備配置図・仕様・能力・台数</text>
  <text class="t-num" x="42" y="466">4</text>
  <text class="t-item" x="60" y="466">重要仮設物に関する構造設計計算書</text>
</svg>
