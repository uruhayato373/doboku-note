<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="入出港および停泊に関する規制。特定港への入出港と修繕けい船は港長への届出、停泊区域はトン数または積荷の種類で定まり、修繕中の船舶は港長の指定する場所に停泊する。港内では埠頭や狭い水路の入口付近にみだりにびょう泊してはならない">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-name { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-tag  { font-size: 11px; font-weight: bold; fill: #2e6da4; }
      .t-desc { font-size: 11px; fill: #555; }
      .t-sec  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-item { font-size: 11px; fill: #222; }
      .t-note { font-size: 11px; fill: #555; }
      .box-a { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-b { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-d { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .rule { stroke: #d7d7d7; stroke-width: 1; }
    </style>
  </defs>

  <text class="t-lead" x="200" y="18" text-anchor="middle">届出が要るもの、場所が定まるものを分けて覚える</text>

  <rect class="box-a" x="20" y="28" width="360" height="76" rx="6"/>
  <text class="t-name" x="40" y="52">入出港</text>
  <text class="t-tag" x="364" y="52" text-anchor="end">港長へ届出</text>
  <text class="t-desc" x="40" y="74">特定港に入出港しようとする船舶は港長に届け出る</text>
  <text class="t-desc" x="40" y="94">工事着手時に事前の許可を受けていれば都度の届出は不要</text>

  <rect class="box-b" x="20" y="114" width="360" height="58" rx="6"/>
  <text class="t-name" x="40" y="138">停泊区域</text>
  <text class="t-tag" x="364" y="138" text-anchor="end">区域が定まる</text>
  <text class="t-desc" x="40" y="160">トン数または積荷の種類によって定められた区域に停泊</text>

  <rect class="box-a" x="20" y="182" width="360" height="76" rx="6"/>
  <text class="t-name" x="40" y="206">修繕・けい船</text>
  <text class="t-tag" x="364" y="206" text-anchor="end">届出＋場所の指定</text>
  <text class="t-desc" x="40" y="228">特定港内で修繕・けい船をする者は港長に届け出る</text>
  <text class="t-desc" x="40" y="248">修繕中・けい船中の船舶は港長の指定する場所に停泊</text>

  <rect class="box-b" x="20" y="268" width="360" height="76" rx="6"/>
  <text class="t-name" x="40" y="292">けい留等の制限</text>
  <text class="t-tag" x="364" y="292" text-anchor="end">港内一般</text>
  <text class="t-desc" x="40" y="314">汽艇等・いかだはみだりにけい船浮標や他船にけい留しない</text>
  <text class="t-desc" x="40" y="334">交通の妨げとなるおそれのある場所に停泊・停留しない</text>

  <rect class="box-d" x="20" y="356" width="360" height="126" rx="6"/>
  <text class="t-sec" x="200" y="380" text-anchor="middle">みだりにびょう泊・停留してはならない場所</text>
  <line class="rule" x1="36" y1="389" x2="364" y2="389"/>
  <text class="t-item" x="40" y="414">埠頭・桟橋・岸壁・けい船浮標およびドックの付近</text>
  <text class="t-item" x="40" y="440">河川・運河その他狭い水路および船だまりの入口付近</text>
  <text class="t-note" x="40" y="466">港内であれば特定港に限らず適用される</text>
</svg>
