<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="工程能力図: 品質特性値が規格中心付近で時間的に変動する様子を折れ線で示す。上限規格値・規格中心・下限規格値の 3 本の線とデータ点を配置">
  <style>
    text { font-family: "Hiragino Sans", "Yu Gothic", sans-serif; }
  </style>

  <!-- Title -->
  <text x="200" y="30" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">工程能力図</text>  <!-- ink-strong -->

  <!-- Y-axis label (vertical stacked "品質特性値") -->
  <text x="22" y="130" font-size="13" fill="#222" text-anchor="middle">品</text>  <!-- ink-strong -->
  <text x="22" y="148" font-size="13" fill="#222" text-anchor="middle">質</text>
  <text x="22" y="166" font-size="13" fill="#222" text-anchor="middle">特</text>
  <text x="22" y="184" font-size="13" fill="#222" text-anchor="middle">性</text>
  <text x="22" y="202" font-size="13" fill="#222" text-anchor="middle">値</text>

  <!-- Y-axis line -->
  <line x1="45" y1="50" x2="45" y2="370" stroke="#222" stroke-width="1.5"/>
  <!-- X-axis line -->
  <line x1="45" y1="370" x2="320" y2="370" stroke="#222" stroke-width="1.5"/>

  <!-- Upper spec limit (dashed) -->
  <line x1="45" y1="90" x2="320" y2="90" stroke="#555" stroke-width="1" stroke-dasharray="5,3"/>  <!-- ink-body -->
  <!-- Center line (solid) -->
  <line x1="45" y1="210" x2="320" y2="210" stroke="#222" stroke-width="1"/>  <!-- ink-strong -->
  <!-- Lower spec limit (dashed) -->
  <line x1="45" y1="330" x2="320" y2="330" stroke="#555" stroke-width="1" stroke-dasharray="5,3"/>

  <!-- Right-side labels -->
  <text x="325" y="94" font-size="13" fill="#222">上限規格値</text>
  <text x="325" y="214" font-size="13" fill="#222">規格中心</text>
  <text x="325" y="334" font-size="13" fill="#222">下限規格値</text>

  <!-- Data polyline (brand) -->
  <!-- Original relative positions preserved; mapped to new Y range 90-330 (center=210) -->
  <!-- Original: y range ~88-132 on 55-175 span(120px), center=115 -->
  <!-- Scale factor: 240/120 = 2.0; new_y = 210 + (orig_y - 115) * 2.0 -->
  <polyline points="70,164 90,224 110,244 130,190 150,220 170,200 190,156 210,196 230,180 250,164 270,230 290,244 310,176"
    fill="none" stroke="#2e6da4" stroke-width="2"/>  <!-- brand -->

  <!-- Data points -->
  <g fill="#2e6da4">
    <circle cx="70" cy="164" r="5"/>
    <circle cx="90" cy="224" r="5"/>
    <circle cx="110" cy="244" r="5"/>
    <circle cx="130" cy="190" r="5"/>
    <circle cx="150" cy="220" r="5"/>
    <circle cx="170" cy="200" r="5"/>
    <circle cx="190" cy="156" r="5"/>
    <circle cx="210" cy="196" r="5"/>
    <circle cx="230" cy="180" r="5"/>
    <circle cx="250" cy="164" r="5"/>
    <circle cx="270" cy="230" r="5"/>
    <circle cx="290" cy="244" r="5"/>
    <circle cx="310" cy="176" r="5"/>
  </g>

  <!-- X-axis label -->
  <text x="182" y="400" font-size="13" fill="#222" text-anchor="middle">測定 No. または月日</text>

  <!-- Legend -->
  <g transform="translate(50,430)">
    <text x="0" y="0" font-size="13" font-weight="bold" fill="#222">凡例</text>
    <!-- Brand line -->
    <line x1="0" y1="18" x2="30" y2="18" stroke="#2e6da4" stroke-width="2"/>
    <circle cx="15" cy="18" r="4" fill="#2e6da4"/>
    <text x="36" y="22" font-size="12" fill="#555">品質特性値（測定値）</text>
    <!-- Center line -->
    <line x1="160" y1="18" x2="190" y2="18" stroke="#222" stroke-width="1"/>
    <text x="196" y="22" font-size="12" fill="#555">規格中心</text>
    <!-- Spec dashed -->
    <line x1="0" y1="40" x2="30" y2="40" stroke="#555" stroke-width="1" stroke-dasharray="5,3"/>
    <text x="36" y="44" font-size="12" fill="#555">上限・下限規格値（破線）</text>
  </g>
</svg>
