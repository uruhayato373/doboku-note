<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" style="max-width:400px;width:100%" role="img" aria-label="工程能力図: 品質特性値が規格中心付近で時間的に変動する様子を折れ線で示す。上限規格値・規格中心・下限規格値の 3 本の線とデータ点を配置">
  <style>
    text { font-family: "Hiragino Sans", "Yu Gothic", sans-serif; }
  </style>

  <!-- Y-axis label (vertical stacked "品質特性値") -->
  <text x="20" y="80" font-size="13" fill="#222" text-anchor="middle">品</text>  <!-- ink-strong -->
  <text x="20" y="98" font-size="13" fill="#222" text-anchor="middle">質</text>
  <text x="20" y="116" font-size="13" fill="#222" text-anchor="middle">特</text>
  <text x="20" y="134" font-size="13" fill="#222" text-anchor="middle">性</text>
  <text x="20" y="152" font-size="13" fill="#222" text-anchor="middle">値</text>

  <!-- Y-axis line -->
  <line x1="45" y1="30" x2="45" y2="200" stroke="#222" stroke-width="1.5"/>
  <!-- X-axis line -->
  <line x1="45" y1="200" x2="315" y2="200" stroke="#222" stroke-width="1.5"/>

  <!-- Upper spec limit (dashed) -->
  <line x1="45" y1="55" x2="315" y2="55" stroke="#555" stroke-width="1" stroke-dasharray="5,3"/>  <!-- ink-body -->
  <!-- Center line (solid) -->
  <line x1="45" y1="115" x2="315" y2="115" stroke="#222" stroke-width="1"/>  <!-- ink-strong -->
  <!-- Lower spec limit (dashed) -->
  <line x1="45" y1="175" x2="315" y2="175" stroke="#555" stroke-width="1" stroke-dasharray="5,3"/>

  <!-- Right-side labels -->
  <text x="320" y="59" font-size="13" fill="#222">上限規格値</text>
  <text x="320" y="119" font-size="13" fill="#222">規格中心</text>
  <text x="320" y="179" font-size="13" fill="#222">下限規格値</text>

  <!-- Data polyline (brand) -->
  <polyline points="65,92 85,122 105,132 125,105 145,120 165,110 185,88 205,108 225,100 245,92 265,125 285,132 305,98"
    fill="none" stroke="#2e6da4" stroke-width="1.5"/>  <!-- brand -->

  <!-- Data points -->
  <g fill="#2e6da4">
    <circle cx="65" cy="92" r="3"/>
    <circle cx="85" cy="122" r="3"/>
    <circle cx="105" cy="132" r="3"/>
    <circle cx="125" cy="105" r="3"/>
    <circle cx="145" cy="120" r="3"/>
    <circle cx="165" cy="110" r="3"/>
    <circle cx="185" cy="88" r="3"/>
    <circle cx="205" cy="108" r="3"/>
    <circle cx="225" cy="100" r="3"/>
    <circle cx="245" cy="92" r="3"/>
    <circle cx="265" cy="125" r="3"/>
    <circle cx="285" cy="132" r="3"/>
    <circle cx="305" cy="98" r="3"/>
  </g>

  <!-- X-axis label -->
  <text x="180" y="240" font-size="13" fill="#222" text-anchor="middle">測定 No. または月日</text>
</svg>
