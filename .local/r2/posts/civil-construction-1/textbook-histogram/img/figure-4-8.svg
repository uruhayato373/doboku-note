<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" style="max-width:400px;width:100%" role="img" aria-label="演習データ（n=44）のヒストグラム完成例。代表値 19.5〜27.5、度数 1、17、22、3、1 の 5 本のバーと下限規格値の注記">
  <style>
    text { font-family: "Hiragino Sans", "Yu Gothic", sans-serif; }
  </style>

  <!-- Y-axis label (vertical "度数") -->
  <text x="45" y="130" font-size="13" fill="#222" text-anchor="middle">度</text>
  <text x="45" y="150" font-size="13" fill="#222" text-anchor="middle">数</text>

  <!-- Y-axis line -->
  <line x1="75" y1="50" x2="75" y2="240" stroke="#222" stroke-width="1.5"/>
  <!-- X-axis line -->
  <line x1="75" y1="240" x2="355" y2="240" stroke="#222" stroke-width="1.5"/>

  <!-- Y-axis tick marks and labels (0, 5, 10, 15, 20, 25; 25 = 180px; 5 = 36px each) -->
  <g font-size="12" fill="#222" text-anchor="end">
    <text x="68" y="244">0</text>
    <text x="68" y="208">5</text>
    <text x="68" y="172">10</text>
    <text x="68" y="136">15</text>
    <text x="68" y="100">20</text>
    <text x="68" y="64">25</text>
  </g>
  <!-- Y-axis ticks -->
  <g stroke="#222" stroke-width="1">
    <line x1="71" y1="240" x2="75" y2="240"/>
    <line x1="71" y1="204" x2="75" y2="204"/>
    <line x1="71" y1="168" x2="75" y2="168"/>
    <line x1="71" y1="132" x2="75" y2="132"/>
    <line x1="71" y1="96" x2="75" y2="96"/>
    <line x1="71" y1="60" x2="75" y2="60"/>
  </g>

  <!-- Lower spec limit line (dashed, placed left of bars since S_L=17 < 18.5) -->
  <line x1="95" y1="60" x2="95" y2="240" stroke="#555" stroke-width="1" stroke-dasharray="5,3"/>

  <!-- Lower spec limit vertical label -->
  <text x="105" y="130" font-size="11" fill="#222">下</text>
  <text x="105" y="144" font-size="11" fill="#222">限</text>
  <text x="105" y="158" font-size="11" fill="#222">規</text>
  <text x="105" y="172" font-size="11" fill="#222">格</text>
  <text x="105" y="186" font-size="11" fill="#222">値</text>
  <text x="90" y="205" font-size="11" fill="#222">S_L=17</text>
  <text x="90" y="75" font-size="12" fill="#222">n=44</text>

  <!-- Histogram bars (5 bars centered at 19.5, 21.5, 23.5, 25.5, 27.5) -->
  <!-- 25 units = 180px → 1 unit = 7.2px; baseline y=240 -->
  <!-- heights: 1→7.2, 17→122.4, 22→158.4, 3→21.6, 1→7.2 -->
  <g fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.2">
    <rect x="140" y="232.8" width="40" height="7.2"/>
    <rect x="180" y="117.6" width="40" height="122.4"/>
    <rect x="220" y="81.6" width="40" height="158.4"/>
    <rect x="260" y="218.4" width="40" height="21.6"/>
    <rect x="300" y="232.8" width="40" height="7.2"/>
  </g>

  <!-- Bar-top count labels -->
  <g font-size="12" fill="#222" text-anchor="middle">
    <text x="160" y="226">1</text>
    <text x="200" y="111">17</text>
    <text x="240" y="75">22</text>
    <text x="280" y="212">3</text>
    <text x="320" y="226">1</text>
  </g>

  <!-- X-axis class representative value labels -->
  <g font-size="12" fill="#222" text-anchor="middle">
    <text x="160" y="258">19.5</text>
    <text x="200" y="258">21.5</text>
    <text x="240" y="258">23.5</text>
    <text x="280" y="258">25.5</text>
    <text x="320" y="258">27.5</text>
  </g>

  <!-- X-axis label -->
  <text x="215" y="285" font-size="13" fill="#222" text-anchor="middle">品質特性値</text>
</svg>
