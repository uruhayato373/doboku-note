<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="演習データ（n=44）のヒストグラム完成例。代表値 19.5〜27.5、度数 1、17、22、3、1 の 5 本のバーと下限規格値の注記">
  <style>
    text { font-family: "Hiragino Sans", "Yu Gothic", sans-serif; }
  </style>

  <!-- Title -->
  <text x="200" y="36" font-size="15" fill="#222" text-anchor="middle" font-weight="600">演習データのヒストグラム（n=44）</text>

  <!-- Y-axis label (vertical "度数") -->
  <text x="42" y="255" font-size="13" fill="#222" text-anchor="middle">度</text>
  <text x="42" y="273" font-size="13" fill="#222" text-anchor="middle">数</text>

  <!-- Y-axis line -->
  <line x1="75" y1="100" x2="75" y2="410" stroke="#222" stroke-width="1.5"/>
  <!-- X-axis line -->
  <line x1="75" y1="410" x2="355" y2="410" stroke="#222" stroke-width="1.5"/>

  <!-- Y-axis tick marks and labels (0, 5, 10, 15, 20, 25; 25 = 300px → 1 unit = 12px each) -->
  <!-- baseline y=410; step=60px per 5 units -->
  <g font-size="12" fill="#222" text-anchor="end">
    <text x="68" y="414">0</text>
    <text x="68" y="354">5</text>
    <text x="68" y="294">10</text>
    <text x="68" y="234">15</text>
    <text x="68" y="174">20</text>
    <text x="68" y="114">25</text>
  </g>
  <!-- Y-axis ticks -->
  <g stroke="#222" stroke-width="1">
    <line x1="71" y1="410" x2="75" y2="410"/>
    <line x1="71" y1="350" x2="75" y2="350"/>
    <line x1="71" y1="290" x2="75" y2="290"/>
    <line x1="71" y1="230" x2="75" y2="230"/>
    <line x1="71" y1="170" x2="75" y2="170"/>
    <line x1="71" y1="110" x2="75" y2="110"/>
  </g>

  <!-- Lower spec limit line (dashed, placed left of bars since S_L=17 < 18.5) -->
  <line x1="95" y1="110" x2="95" y2="410" stroke="#555" stroke-width="1" stroke-dasharray="5,3"/>

  <!-- Lower spec limit vertical label -->
  <text x="105" y="255" font-size="11" fill="#222">下</text>
  <text x="105" y="269" font-size="11" fill="#222">限</text>
  <text x="105" y="283" font-size="11" fill="#222">規</text>
  <text x="105" y="297" font-size="11" fill="#222">格</text>
  <text x="105" y="311" font-size="11" fill="#222">値</text>
  <text x="87" y="332" font-size="11" fill="#222">S_L=17</text>
  <text x="87" y="130" font-size="12" fill="#222">n=44</text>

  <!-- Histogram bars (5 bars centered at 19.5, 21.5, 23.5, 25.5, 27.5) -->
  <!-- 25 units = 300px → 1 unit = 12px; baseline y=410 -->
  <!-- heights: 1→12, 17→204, 22→264, 3→36, 1→12 -->
  <g fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.2">
    <rect x="140" y="398" width="40" height="12"/>
    <rect x="180" y="206" width="40" height="204"/>
    <rect x="220" y="146" width="40" height="264"/>
    <rect x="260" y="374" width="40" height="36"/>
    <rect x="300" y="398" width="40" height="12"/>
  </g>

  <!-- Bar-top count labels -->
  <g font-size="12" fill="#222" text-anchor="middle">
    <text x="160" y="392">1</text>
    <text x="200" y="200">17</text>
    <text x="240" y="140">22</text>
    <text x="280" y="368">3</text>
    <text x="320" y="392">1</text>
  </g>

  <!-- X-axis class representative value labels -->
  <g font-size="12" fill="#222" text-anchor="middle">
    <text x="160" y="428">19.5</text>
    <text x="200" y="428">21.5</text>
    <text x="240" y="428">23.5</text>
    <text x="280" y="428">25.5</text>
    <text x="320" y="428">27.5</text>
  </g>

  <!-- X-axis label -->
  <text x="215" y="452" font-size="13" fill="#222" text-anchor="middle">品質特性値</text>

  <!-- Summary -->
  <text x="200" y="482" font-size="12" fill="#555" text-anchor="middle">最頻値 23.5・下限規格値 S_L=17 を左に外れて適合</text>
</svg>
