<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="安全衛生管理組織の2系統。事業場ごとに自社の労働者数で選任するのが総括安全衛生管理者・安全管理者・衛生管理者。元請と下請が混在する現場では合計人数で統括安全衛生責任者を選任し、元請側に元方安全衛生管理者、下請側に安全衛生責任者を置く">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-hd   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-role { font-size: 12px; font-weight: bold; fill: #222; }
      .t-num  { font-size: 11px; fill: #555; }
      .t-side { font-size: 11px; fill: #555; }
      .t-sub  { font-size: 11px; fill: #222; }
      .t-note { font-size: 11px; fill: #555; }
      .t-sec  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-item { font-size: 11px; fill: #222; }
      .hd1 { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .hd2 { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .cell { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .link { stroke: #8a8a8a; stroke-width: 1.5; fill: none; }
      .box-surf { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .rule { stroke: #d7d7d7; stroke-width: 1; }
    </style>
    <marker id="so-a" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#8a8a8a"/>
    </marker>
  </defs>

  <text class="t-lead" x="200" y="18" text-anchor="middle">「総括」は事業場、「統括」は混在現場</text>

  <rect class="hd1" x="20" y="32" width="360" height="24" rx="4"/>
  <text class="t-hd" x="200" y="49" text-anchor="middle">事業場ごと（自社の労働者数）</text>
  <rect class="cell" x="20" y="60" width="360" height="90" rx="4"/>
  <text class="t-role" x="40" y="84">総括安全衛生管理者</text>
  <text class="t-num" x="364" y="84" text-anchor="end">常時 100 人以上</text>
  <text class="t-role" x="40" y="110">安全管理者</text>
  <text class="t-num" x="364" y="110" text-anchor="end">常時 50 人以上</text>
  <text class="t-role" x="40" y="136">衛生管理者</text>
  <text class="t-num" x="364" y="136" text-anchor="end">常時 50 人以上</text>

  <rect class="hd2" x="20" y="170" width="360" height="24" rx="4"/>
  <text class="t-hd" x="200" y="187" text-anchor="middle">混在現場ごと（元請＋下請の合計）</text>

  <rect class="cell" x="20" y="200" width="170" height="82" rx="4"/>
  <text class="t-side" x="105" y="220" text-anchor="middle">元請（特定元方事業者）</text>
  <text class="t-role" x="105" y="242" text-anchor="middle">統括安全衛生責任者</text>
  <line class="link" x1="105" y1="248" x2="105" y2="258" marker-end="url(#so-a)"/>
  <text class="t-sub" x="105" y="274" text-anchor="middle">元方安全衛生管理者</text>

  <line class="link" x1="190" y1="241" x2="210" y2="241"/>

  <rect class="cell" x="210" y="200" width="170" height="82" rx="4"/>
  <text class="t-side" x="295" y="220" text-anchor="middle">下請（関係請負人）</text>
  <text class="t-role" x="295" y="242" text-anchor="middle">安全衛生責任者</text>

  <text class="t-note" x="200" y="302" text-anchor="middle">合計 50 人以上（ずい道・橋梁・圧気は 30 人以上）</text>

  <rect class="box-surf" x="20" y="320" width="360" height="162" rx="6"/>
  <text class="t-sec" x="200" y="342" text-anchor="middle">読み取り方</text>
  <line class="rule" x1="36" y1="351" x2="364" y2="351"/>
  <text class="t-item" x="40" y="376">「総括」は事業場単位、「統括」は混在現場単位</text>
  <text class="t-item" x="40" y="400">統括を選任したら元方安全衛生管理者も置く（専属）</text>
  <text class="t-item" x="40" y="424">安全衛生責任者は統括を選任すべき事業者以外が選任</text>
  <text class="t-item" x="40" y="448">ずい道・橋梁・圧気工法は 30 人以上で統括が必要</text>
</svg>
