<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="道路占用工事の遵守事項を目的別に整理した図。掘削の方法、交通の確保、安全措置、埋戻しと復旧の4つに分けて、えぐり掘の禁止、一方の側の通行確保、夜間の赤色灯・黄色灯、埋設物の試掘確認と協議、各層ごとの締固めなどを示す">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-sec  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-item { font-size: 11px; fill: #222; }
      .box-b { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-w { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-d { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .box-p { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .rule { stroke: #d7d7d7; stroke-width: 1; }
    </style>
  </defs>

  <text class="t-lead" x="200" y="18" text-anchor="middle">占用許可を得て道路を掘削するときの遵守事項</text>

  <rect class="box-b" x="20" y="28" width="360" height="104" rx="6"/>
  <text class="t-sec" x="36" y="50">掘削の方法</text>
  <line class="rule" x1="36" y1="58" x2="364" y2="58"/>
  <text class="t-item" x="40" y="80">溝掘・つぼ掘・推進工法により、えぐり掘は行わない</text>
  <text class="t-item" x="40" y="100">舗装の切断はのみ・切断機で直線かつ路面に垂直に</text>
  <text class="t-item" x="40" y="120">掘削面積は当日中に復旧可能な範囲とする</text>

  <rect class="box-w" x="20" y="142" width="360" height="104" rx="6"/>
  <text class="t-sec" x="36" y="164">交通の確保</text>
  <line class="rule" x1="36" y1="172" x2="364" y2="172"/>
  <text class="t-item" x="40" y="194">道路の一方の側は常に通行できるようにする</text>
  <text class="t-item" x="40" y="214">横断掘削は支障の少ない部分から片側ずつ行う</text>
  <text class="t-item" x="40" y="234">掘削土砂を近接部にたい積せず余地を設ける</text>

  <rect class="box-d" x="20" y="256" width="360" height="104" rx="6"/>
  <text class="t-sec" x="36" y="278">安全措置</text>
  <line class="rule" x1="36" y1="286" x2="364" y2="286"/>
  <text class="t-item" x="40" y="308">柵または覆いを設け、夜間は赤色灯・黄色灯を点灯</text>
  <text class="t-item" x="40" y="328">予想される埋設物は試掘で確認し管理者と協議する</text>
  <text class="t-item" x="40" y="348">ガス管・石油管等の可燃性配管付近で火気を使わない</text>

  <rect class="box-p" x="20" y="370" width="360" height="104" rx="6"/>
  <text class="t-sec" x="36" y="392">埋戻しと復旧</text>
  <line class="rule" x1="36" y1="400" x2="364" y2="400"/>
  <text class="t-item" x="40" y="422">各層ごとにランマ等で確実に締め固める</text>
  <text class="t-item" x="40" y="442">杭・矢板は下部を埋戻して徐々に引き抜く</text>
  <text class="t-item" x="40" y="462">占用期間の終了時は物件を除去し原状に回復する</text>
</svg>
