<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="建設機械の選定の3観点と組合せ計画の原則。工事現場への適合性・経済性・建設機械の組合せの3つから検討し、組合せでは主機械を明確にして従機械の能力を主機械と同等か若干上回らせ、最大施工速度は各分割工程のうち最小の施工速度で決まる">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-num  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-name { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-desc { font-size: 11px; fill: #555; }
      .t-sec  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-item { font-size: 11px; fill: #222; }
      .t-ex   { font-size: 11px; fill: #8a8a8a; }
      .card { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-surf { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .rule { stroke: #d7d7d7; stroke-width: 1; }
    </style>
  </defs>

  <text class="t-lead" x="200" y="18" text-anchor="middle">建設機械は次の3つの観点から具体的に検討する</text>

  <rect class="card" x="20" y="28" width="360" height="64" rx="6"/>
  <text class="t-num" x="40" y="52">1</text>
  <text class="t-name" x="58" y="52">工事現場への適合性</text>
  <text class="t-desc" x="58" y="74">土質・地下水、工事量・掘削深さ・運搬距離、作業の自由度</text>

  <rect class="card" x="20" y="98" width="360" height="64" rx="6"/>
  <text class="t-num" x="40" y="122">2</text>
  <text class="t-name" x="58" y="122">経済性</text>
  <text class="t-desc" x="58" y="144">工事単価、施工速度、機械損料・運転経費、納期、普及度</text>

  <rect class="card" x="20" y="168" width="360" height="64" rx="6"/>
  <text class="t-num" x="40" y="192">3</text>
  <text class="t-name" x="58" y="192">建設機械の組合せ</text>
  <text class="t-desc" x="58" y="214">主作業を明確にし、分割工程の所要時間を一定化する</text>

  <rect class="box-surf" x="20" y="248" width="360" height="234" rx="6"/>
  <text class="t-sec" x="200" y="272" text-anchor="middle">組合せ計画の原則</text>
  <line class="rule" x1="36" y1="281" x2="364" y2="281"/>
  <text class="t-item" x="40" y="306">組合せ作業の主作業（主機械）を明確に選定する</text>
  <text class="t-item" x="40" y="332">従機械は主機械と同等か若干上回る能力とする</text>
  <text class="t-ex" x="40" y="354">例：1日500 m³を運搬するなら積込み機は500 m³以上</text>
  <text class="t-item" x="40" y="386">流れ作業の施工効率は単独作業の場合より低下する</text>
  <text class="t-item" x="40" y="412">最大施工速度は各分割工程のうち最小の施工速度で決まる</text>
  <text class="t-item" x="40" y="444">機械故障等による全体の作業休止を防ぎ、主機械の能力を</text>
  <text class="t-item" x="40" y="464">最大限に発揮させるよう作業全体の効率化を図る</text>
</svg>
