<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 330" style="max-width:500px;width:100%" role="img" aria-label="平成29年度後期 No.12 ネットワーク式工程表。イベント0から9、作業AからK。クリティカルパスは0→1→2→3→5→9で工期29日。作業Kの最早開始は23日。">
  <defs>
    <marker id="ar" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="arcp" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b22234"/></marker>
  </defs>
  <style>
    .ti{font-family:Inter,'Noto Sans JP','Hiragino Sans',sans-serif;font-size:14px;fill:#555}
    .nn{font-family:Inter,'Noto Sans JP','Hiragino Sans',sans-serif;font-size:13px;fill:#1a3a5c;font-weight:600}
    .nc{font-family:Inter,'Noto Sans JP','Hiragino Sans',sans-serif;font-size:13px;fill:#b22234;font-weight:700}
    .ac{font-family:Inter,'Noto Sans JP','Hiragino Sans',sans-serif;font-size:13px;fill:#222;font-weight:600}
    .du{font-family:Inter,'Noto Sans JP','Hiragino Sans',sans-serif;font-size:11px;fill:#555}
    .sub{font-family:Inter,'Noto Sans JP','Hiragino Sans',sans-serif;font-size:11px;fill:#555}
    .cl{font-family:Inter,'Noto Sans JP','Hiragino Sans',sans-serif;font-size:12px;fill:#b22234;font-weight:700}
  </style>

  <text x="250" y="20" text-anchor="middle" class="ti">ネットワーク式工程表（クリティカルパスを赤で強調）</text>

  <!-- ===== 非CP arrows (thin) ===== -->
  <!-- 2->4 E -->
  <line x1="200" y1="150" x2="255" y2="150" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="227" y="143" text-anchor="middle" class="ac">E</text>
  <text x="227" y="164" text-anchor="middle" class="du">6</text>
  <!-- 4->5 F -->
  <line x1="285" y1="150" x2="335" y2="150" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="310" y="143" text-anchor="middle" class="ac">F</text>
  <text x="310" y="164" text-anchor="middle" class="du">5</text>
  <!-- 1->6 G -->
  <line x1="118" y1="162" x2="176" y2="233" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="132" y="205" text-anchor="middle" class="ac">G</text>
  <text x="148" y="205" text-anchor="middle" class="du">2</text>
  <!-- 6->7 H -->
  <line x1="200" y1="245" x2="265" y2="245" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="232" y="238" text-anchor="middle" class="ac">H</text>
  <text x="232" y="259" text-anchor="middle" class="du">7</text>
  <!-- 7->8 I -->
  <line x1="295" y1="245" x2="365" y2="245" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="330" y="238" text-anchor="middle" class="ac">I</text>
  <text x="330" y="259" text-anchor="middle" class="du">7</text>
  <!-- 8->9 K -->
  <line x1="390" y1="234" x2="448" y2="162" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="432" y="205" text-anchor="middle" class="ac">K</text>
  <text x="416" y="205" text-anchor="middle" class="du">4</text>
  <!-- 5->8 dummy -->
  <line x1="355" y1="164" x2="378" y2="231" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar)"/>

  <!-- ===== CP arrows (bold red) 0-1-2-3-5-9 ===== -->
  <!-- 0->1 A -->
  <line x1="55" y1="150" x2="95" y2="150" stroke="#b22234" stroke-width="3.5" marker-end="url(#arcp)"/>
  <text x="75" y="143" text-anchor="middle" class="ac">A</text>
  <text x="75" y="164" text-anchor="middle" class="du">5</text>
  <!-- 1->2 B -->
  <line x1="125" y1="150" x2="170" y2="150" stroke="#b22234" stroke-width="3.5" marker-end="url(#arcp)"/>
  <text x="147" y="143" text-anchor="middle" class="ac">B</text>
  <text x="147" y="164" text-anchor="middle" class="du">5</text>
  <!-- 2->3 C -->
  <line x1="196" y1="139" x2="261" y2="72" stroke="#b22234" stroke-width="3.5" marker-end="url(#arcp)"/>
  <text x="215" y="98" text-anchor="middle" class="ac">C</text>
  <text x="232" y="110" text-anchor="middle" class="du">7</text>
  <!-- 3->5 D -->
  <line x1="280" y1="72" x2="340" y2="139" stroke="#b22234" stroke-width="3.5" marker-end="url(#arcp)"/>
  <text x="328" y="98" text-anchor="middle" class="ac">D</text>
  <text x="311" y="110" text-anchor="middle" class="du">6</text>
  <!-- 5->9 J -->
  <line x1="365" y1="150" x2="445" y2="150" stroke="#b22234" stroke-width="3.5" marker-end="url(#arcp)"/>
  <text x="405" y="143" text-anchor="middle" class="ac">J</text>
  <text x="405" y="164" text-anchor="middle" class="du">6</text>

  <!-- ===== nodes ===== -->
  <circle cx="40" cy="150" r="15" fill="#f8d7da" stroke="#b22234" stroke-width="2.5"/><text x="40" y="155" text-anchor="middle" class="nc">0</text>
  <circle cx="110" cy="150" r="15" fill="#f8d7da" stroke="#b22234" stroke-width="2.5"/><text x="110" y="155" text-anchor="middle" class="nc">1</text>
  <circle cx="185" cy="150" r="15" fill="#f8d7da" stroke="#b22234" stroke-width="2.5"/><text x="185" y="155" text-anchor="middle" class="nc">2</text>
  <circle cx="270" cy="60" r="15" fill="#f8d7da" stroke="#b22234" stroke-width="2.5"/><text x="270" y="65" text-anchor="middle" class="nc">3</text>
  <circle cx="270" cy="150" r="15" fill="#ffffff" stroke="#2e6da4" stroke-width="2"/><text x="270" y="155" text-anchor="middle" class="nn">4</text>
  <circle cx="350" cy="150" r="15" fill="#f8d7da" stroke="#b22234" stroke-width="2.5"/><text x="350" y="155" text-anchor="middle" class="nc">5</text>
  <circle cx="185" cy="245" r="15" fill="#ffffff" stroke="#2e6da4" stroke-width="2"/><text x="185" y="250" text-anchor="middle" class="nn">6</text>
  <circle cx="280" cy="245" r="15" fill="#ffffff" stroke="#2e6da4" stroke-width="2"/><text x="280" y="250" text-anchor="middle" class="nn">7</text>
  <circle cx="380" cy="245" r="15" fill="#ffffff" stroke="#2e6da4" stroke-width="2"/><text x="380" y="250" text-anchor="middle" class="nn">8</text>
  <circle cx="460" cy="150" r="15" fill="#f8d7da" stroke="#b22234" stroke-width="2.5"/><text x="460" y="155" text-anchor="middle" class="nc">9</text>

  <!-- ===== summary ===== -->
  <rect x="20" y="285" width="460" height="38" rx="6" fill="#e8f0fe" stroke="#d7d7d7"/>
  <text x="32" y="303" class="cl">クリティカルパス：0→1→2→3→5→9（A+B+C+D+J = 5+5+7+6+6 = 29 日）</text>
  <text x="32" y="318" class="sub">作業 K の最早開始 23 日（結合点 8 まで最長経路 b：5+5+7+6+0 = 23 日）</text>
</svg>
