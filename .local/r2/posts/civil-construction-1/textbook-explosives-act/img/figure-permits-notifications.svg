<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="火薬類取締法における許可と届出の相手先。火薬庫の設置・消費・輸入・廃棄は都道府県知事の許可、保安責任者の選任と輸入後の報告は都道府県知事への届出、陸上運搬は都道府県公安委員会への届出、喪失または盗取は警察官または海上保安官への届出">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-sec  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-item { font-size: 11px; fill: #222; }
      .t-sub  { font-size: 11px; fill: #555; }
      .t-note { font-size: 11px; fill: #222; }
      .box-kyoka { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .box-todoke { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-koan { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-keisatsu { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-surf { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .rule { stroke: #d7d7d7; stroke-width: 1; }
    </style>
  </defs>

  <text class="t-lead" x="200" y="18" text-anchor="middle">「誰に」「許可か届出か」を対で覚える</text>

  <rect class="box-kyoka" x="20" y="28" width="360" height="138" rx="6"/>
  <text class="t-sec" x="200" y="52" text-anchor="middle">都道府県知事の許可</text>
  <line class="rule" x1="36" y1="61" x2="364" y2="61"/>
  <text class="t-item" x="40" y="86">火薬庫の設置・移転・構造もしくは設備の変更</text>
  <text class="t-item" x="40" y="110">火薬類の消費（爆発または燃焼させる）</text>
  <text class="t-item" x="40" y="134">火薬類の輸入</text>
  <text class="t-item" x="40" y="158">火薬類の廃棄</text>

  <rect class="box-todoke" x="20" y="176" width="360" height="86" rx="6"/>
  <text class="t-sec" x="200" y="200" text-anchor="middle">都道府県知事への届出</text>
  <line class="rule" x1="36" y1="209" x2="364" y2="209"/>
  <text class="t-item" x="40" y="234">火薬類取扱保安責任者・副保安責任者の選任</text>
  <text class="t-item" x="40" y="254">火薬類を輸入したとき（遅滞なく）</text>

  <rect class="box-koan" x="20" y="272" width="360" height="86" rx="6"/>
  <text class="t-sec" x="200" y="296" text-anchor="middle">都道府県公安委員会への届出</text>
  <line class="rule" x1="36" y1="305" x2="364" y2="305"/>
  <text class="t-item" x="40" y="330">火薬類の陸上運搬（少量の場合を除く）</text>
  <text class="t-sub" x="40" y="350">運搬証明書の交付を受けて携帯する</text>

  <rect class="box-keisatsu" x="20" y="368" width="360" height="72" rx="6"/>
  <text class="t-sec" x="200" y="392" text-anchor="middle">警察官または海上保安官への届出</text>
  <line class="rule" x1="36" y1="401" x2="364" y2="401"/>
  <text class="t-item" x="40" y="426">火薬類・譲渡許可証・運搬証明書の喪失または盗取</text>

  <rect class="box-surf" x="20" y="450" width="360" height="32" rx="6"/>
  <text class="t-note" x="200" y="471" text-anchor="middle">火薬庫は知事の完成検査に合格した後でなければ使用できない</text>
</svg>
