<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="施工計画作成の一般的な手順。事前調査の実施、基本計画の作成、詳細計画の作成、管理計画の作成の4段階を順に進める。詳細計画では機械や人員の決定・仮設備・工種別詳細工程・調達使用計画・工事費の積算を行う">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-step { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-desc { font-size: 11px; fill: #555; }
      .t-item { font-size: 11px; fill: #222; }
      .t-num  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-note { font-size: 11px; fill: #222; }
      .box-1 { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-2 { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-3 { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-4 { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-surf { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .dot-1 { fill: #ffffff; stroke: #2e6da4; stroke-width: 2; }
      .dot-3 { fill: #ffffff; stroke: #d4a017; stroke-width: 2; }
      .dot-4 { fill: #ffffff; stroke: #3a7d44; stroke-width: 2; }
      .flow { stroke: #8a8a8a; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="af" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#8a8a8a"/>
    </marker>
  </defs>

  <text class="t-lead" x="200" y="18" text-anchor="middle">前段の結果を受けて順に具体化していく</text>

  <rect class="box-1" x="20" y="28" width="360" height="58" rx="6"/>
  <circle class="dot-1" cx="50" cy="57" r="15"/>
  <text class="t-num" x="50" y="62" text-anchor="middle">1</text>
  <text class="t-step" x="78" y="52">事前調査の実施</text>
  <text class="t-desc" x="78" y="72">契約条件と現場の諸条件を十分に把握する</text>
  <line class="flow" x1="200" y1="86" x2="200" y2="96" marker-end="url(#af)"/>

  <rect class="box-2" x="20" y="99" width="360" height="58" rx="6"/>
  <circle class="dot-1" cx="50" cy="128" r="15"/>
  <text class="t-num" x="50" y="133" text-anchor="middle">2</text>
  <text class="t-step" x="78" y="123">基本計画の作成</text>
  <text class="t-desc" x="78" y="143">主要工種の施工方法・手順と経済性を比較検討</text>
  <line class="flow" x1="200" y1="157" x2="200" y2="167" marker-end="url(#af)"/>

  <rect class="box-3" x="20" y="170" width="360" height="152" rx="6"/>
  <circle class="dot-3" cx="50" cy="194" r="15"/>
  <text class="t-num" x="50" y="199" text-anchor="middle">3</text>
  <text class="t-step" x="78" y="199">詳細計画の作成</text>
  <text class="t-item" x="40" y="226">機械の選定・人員配置・各工種の作業順序の決定</text>
  <text class="t-item" x="40" y="248">サイクルタイムと1日の作業量の決定</text>
  <text class="t-item" x="40" y="270">仮設備の規模・配置の決定</text>
  <text class="t-item" x="40" y="292">工種別詳細工程の立案と調達・使用計画</text>
  <text class="t-item" x="40" y="314">工事費の積算</text>
  <line class="flow" x1="200" y1="322" x2="200" y2="332" marker-end="url(#af)"/>

  <rect class="box-4" x="20" y="335" width="360" height="98" rx="6"/>
  <circle class="dot-4" cx="50" cy="359" r="15"/>
  <text class="t-num" x="50" y="364" text-anchor="middle">4</text>
  <text class="t-step" x="78" y="364">管理計画の作成</text>
  <text class="t-item" x="40" y="391">諸計画を確実に実施するための工事管理の計画</text>
  <text class="t-item" x="40" y="413">現場組織と配員計画・資金計画・安全衛生計画・実行予算</text>

  <rect class="box-surf" x="20" y="446" width="360" height="36" rx="6"/>
  <text class="t-note" x="200" y="469" text-anchor="middle">事前調査は施工計画検討全体の前提条件となる</text>
</svg>
