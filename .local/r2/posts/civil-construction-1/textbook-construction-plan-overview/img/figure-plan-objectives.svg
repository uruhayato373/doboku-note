<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="施工計画の目的と検討課題。安全性を前提として品質・経済性・工期の3条件の調和を保つ。作成にあたり特に念入りに確認・調査する事項は契約条件、現場の工事条件、全体工程表、施工法と施工順序、施工用機械設備の選定、仮設備の設計と配置計画の6つ">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-cond { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-sub  { font-size: 11px; fill: #555; }
      .t-base { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-sec  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-item { font-size: 11px; fill: #222; }
      .t-num  { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .t-note { font-size: 11px; fill: #555; }
      .card { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .base { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-surf { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .rule { stroke: #d7d7d7; stroke-width: 1; }
    </style>
  </defs>

  <text class="t-lead" x="200" y="18" text-anchor="middle">3条件の調和を保ちながら生産手段を選定する</text>

  <rect class="card" x="20" y="28" width="112" height="76" rx="6"/>
  <text class="t-cond" x="76" y="58" text-anchor="middle">品質</text>
  <text class="t-sub" x="76" y="80" text-anchor="middle">発注者の</text>
  <text class="t-sub" x="76" y="95" text-anchor="middle">要求品質</text>

  <rect class="card" x="144" y="28" width="112" height="76" rx="6"/>
  <text class="t-cond" x="200" y="58" text-anchor="middle">経済性</text>
  <text class="t-sub" x="200" y="80" text-anchor="middle">最小の価格</text>
  <text class="t-sub" x="200" y="95" text-anchor="middle">で完成</text>

  <rect class="card" x="268" y="28" width="112" height="76" rx="6"/>
  <text class="t-cond" x="324" y="58" text-anchor="middle">工期</text>
  <text class="t-sub" x="324" y="80" text-anchor="middle">契約工期内</text>
  <text class="t-sub" x="324" y="95" text-anchor="middle">に完成</text>

  <rect class="base" x="20" y="112" width="360" height="40" rx="6"/>
  <text class="t-base" x="200" y="137" text-anchor="middle">安全性 — すべての前提</text>

  <rect class="box-surf" x="20" y="164" width="360" height="70" rx="6"/>
  <text class="t-note" x="200" y="188" text-anchor="middle">設計図書に基づき施工手段を効率的に組み合わせ、環境保全を</text>
  <text class="t-note" x="200" y="208" text-anchor="middle">図りつつ最小の価格で工期内に安全に完成させることが</text>
  <text class="t-note" x="200" y="228" text-anchor="middle">施工計画の目的である</text>

  <rect class="box-surf" x="20" y="250" width="360" height="232" rx="6"/>
  <text class="t-sec" x="200" y="274" text-anchor="middle">特に念入りに確認・調査する6項目</text>
  <line class="rule" x1="36" y1="283" x2="364" y2="283"/>
  <text class="t-num" x="42" y="308">1</text>
  <text class="t-item" x="60" y="308">契約条件（契約書・設計図書など）</text>
  <text class="t-num" x="42" y="336">2</text>
  <text class="t-item" x="60" y="336">現場の工事条件</text>
  <text class="t-num" x="42" y="364">3</text>
  <text class="t-item" x="60" y="364">全体工程表</text>
  <text class="t-num" x="42" y="392">4</text>
  <text class="t-item" x="60" y="392">施工法と施工順序</text>
  <text class="t-num" x="42" y="420">5</text>
  <text class="t-item" x="60" y="420">施工用機械設備の選定</text>
  <text class="t-num" x="42" y="448">6</text>
  <text class="t-item" x="60" y="448">仮設備の設計と配置計画</text>
  <text class="t-note" x="200" y="472" text-anchor="middle">1・2 の事前調査は検討全体の前提条件</text>
</svg>
