<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="工程能力指数 Cp と Cpk の違い。Cp は規格幅を 6 シグマで割った値で、ばらつきの大きさだけで決まる。Cpk は平均値から規格上限までと規格下限までのうち近い側で決まるため、平均値が規格中心からずれると小さくなる">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-spec { font-size: 11px; font-weight: bold; fill: #b22234; }
      .t-mu   { font-size: 11px; font-weight: bold; fill: #b22234; }
      .t-ctr  { font-size: 11px; fill: #555; }
      .t-dim  { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .t-sec  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-item { font-size: 11px; fill: #222; }
      .spec { stroke: #b22234; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
      .ctr  { stroke: #8a8a8a; stroke-width: 1.2; stroke-dasharray: 3 3; fill: none; }
      .mu   { stroke: #b22234; stroke-width: 2; fill: none; }
      .dist { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 2.5; }
      .base { stroke: #222; stroke-width: 1.5; fill: none; }
      .dim  { stroke: #1a3a5c; stroke-width: 1.5; fill: none; }
      .box-surf { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .rule { stroke: #d7d7d7; stroke-width: 1; }
    </style>
    <marker id="cp-a" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#1a3a5c"/>
    </marker>
  </defs>

  <text class="t-lead" x="200" y="18" text-anchor="middle">Cp は幅だけ、Cpk は中心のずれも見る</text>

  <text class="t-spec" x="90" y="42" text-anchor="middle">規格下限</text>
  <text class="t-spec" x="330" y="42" text-anchor="middle">規格上限</text>
  <line class="spec" x1="90" y1="50" x2="90" y2="214"/>
  <line class="spec" x1="330" y1="50" x2="330" y2="214"/>
  <line class="ctr" x1="210" y1="60" x2="210" y2="210"/>

  <path class="dist" d="M 162,208.7 L 174,204.7 L 186,193.8 L 198,171 L 210,137.2 L 222,104.1 L 234,90 L 246,104.1 L 258,137.2 L 270,171 L 282,193.8 L 294,204.7 L 306,208.7 L 306,210 L 162,210 Z"/>
  <line class="mu" x1="234" y1="90" x2="234" y2="210"/>
  <line class="base" x1="70" y1="210" x2="350" y2="210"/>

  <text class="t-ctr" x="196" y="232" text-anchor="end">規格中心</text>
  <text class="t-mu" x="240" y="232">μ</text>

  <line class="dim" x1="210" y1="254" x2="94" y2="254" marker-end="url(#cp-a)"/>
  <line class="dim" x1="210" y1="254" x2="326" y2="254" marker-end="url(#cp-a)"/>
  <text class="t-dim" x="210" y="272" text-anchor="middle">Cp ＝ 規格幅 ÷ 6σ</text>

  <line class="dim" x1="282" y1="294" x2="238" y2="294" marker-end="url(#cp-a)"/>
  <line class="dim" x1="282" y1="294" x2="326" y2="294" marker-end="url(#cp-a)"/>
  <text class="t-dim" x="160" y="298" text-anchor="middle">Cpk は近い側で決まる</text>

  <rect class="box-surf" x="20" y="320" width="360" height="162" rx="6"/>
  <text class="t-sec" x="200" y="342" text-anchor="middle">読み取り方</text>
  <line class="rule" x1="36" y1="351" x2="364" y2="351"/>
  <text class="t-item" x="40" y="376">Cp は規格幅とばらつきだけで決まる</text>
  <text class="t-item" x="40" y="400">Cpk は平均値が規格中心からずれると小さくなる</text>
  <text class="t-item" x="40" y="424">Cp が十分でも Cpk が低いのは中心がずれた状態</text>
  <text class="t-item" x="40" y="448">1.33 以上が十分、1.00 未満は直ちに改善</text>
</svg>
