<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="施工管理の体系。目的は品質をより良く、価格をより安く、工期をより早くの3要素であり、これに対応するのが品質管理・原価管理・工程管理の三大管理。さらに社会的制約に基づく管理として安全管理・労務管理・環境保全管理があり、内部検査が継続的改善を支える">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-sec  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-name { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-sub  { font-size: 11px; fill: #555; }
      .t-item { font-size: 11px; fill: #222; }
      .box-a { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-b { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-c { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-surf { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .rule { stroke: #d7d7d7; stroke-width: 1; }
    </style>
  </defs>

  <text class="t-lead" x="200" y="18" text-anchor="middle">目的の3要素に三大管理が対応する</text>

  <rect class="box-a" x="20" y="28" width="360" height="104" rx="6"/>
  <text class="t-sec" x="200" y="52" text-anchor="middle">施工管理の目的（3要素）</text>
  <line class="rule" x1="36" y1="62" x2="364" y2="62"/>
  <text class="t-name" x="106" y="92" text-anchor="middle">品質</text>
  <text class="t-sub" x="106" y="116" text-anchor="middle">より良く</text>
  <text class="t-name" x="200" y="92" text-anchor="middle">価格</text>
  <text class="t-sub" x="200" y="116" text-anchor="middle">より安く</text>
  <text class="t-name" x="294" y="92" text-anchor="middle">工期</text>
  <text class="t-sub" x="294" y="116" text-anchor="middle">より早く</text>

  <rect class="box-b" x="20" y="148" width="360" height="96" rx="6"/>
  <text class="t-sec" x="200" y="172" text-anchor="middle">三大管理</text>
  <line class="rule" x1="36" y1="182" x2="364" y2="182"/>
  <text class="t-name" x="106" y="214" text-anchor="middle">品質管理</text>
  <text class="t-name" x="200" y="214" text-anchor="middle">原価管理</text>
  <text class="t-name" x="294" y="214" text-anchor="middle">工程管理</text>
  <text class="t-sub" x="200" y="238" text-anchor="middle">3要素にそれぞれ対応する</text>

  <rect class="box-c" x="20" y="260" width="360" height="96" rx="6"/>
  <text class="t-sec" x="200" y="284" text-anchor="middle">社会的制約に基づく管理</text>
  <line class="rule" x1="36" y1="294" x2="364" y2="294"/>
  <text class="t-name" x="106" y="326" text-anchor="middle">安全管理</text>
  <text class="t-name" x="200" y="326" text-anchor="middle">労務管理</text>
  <text class="t-name" x="294" y="326" text-anchor="middle">環境保全管理</text>
  <text class="t-sub" x="200" y="350" text-anchor="middle">近年はとくに安全管理が重要視される</text>

  <rect class="box-surf" x="20" y="372" width="360" height="110" rx="6"/>
  <text class="t-sec" x="200" y="396" text-anchor="middle">内部検査によるフィードバック</text>
  <line class="rule" x1="36" y1="406" x2="364" y2="406"/>
  <text class="t-item" x="200" y="432" text-anchor="middle">品質・価格・工期の3要素に問題があれば</text>
  <text class="t-item" x="200" y="454" text-anchor="middle">原因を追求し、見直し・改善を行う</text>
  <text class="t-sub" x="200" y="474" text-anchor="middle">この機能が施工管理の継続的改善を支える</text>
</svg>
