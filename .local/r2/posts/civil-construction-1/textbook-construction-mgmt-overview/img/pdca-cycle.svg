<svg width="400" height="400" viewBox="0 0 400 400"
     xmlns="http://www.w3.org/2000/svg"
     style="max-width:400px;width:100%"
     role="img"
     aria-label="施工管理の PDCA サイクル：Plan（計画）→ Do（実施）→ Check（検討）→ Act（処置）の循環。P・D は統制機能、C・A は改善機能">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-page-title { font-size: 15px; font-weight: bold; fill: #222; }     /* ink-strong */
      .t-letter     { font-size: 22px; font-weight: bold; fill: #1a3a5c; }  /* brand-text */
      .t-name       { font-size: 13px; font-weight: bold; fill: #1a3a5c; } /* brand-text */
      .t-center     { font-size: 13px; font-weight: bold; fill: #1a3a5c; } /* brand-text */
      .t-center-en  { font-size: 12px; fill: #555; }                       /* ink-body */
      .t-caption    { font-size: 11px; fill: #555; }                       /* ink-body */
      .ring         { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 2; }   /* brand */
      .box-positive { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; } /* positive */
      .box-brand    { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; } /* brand */
      .box-warn     { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; } /* warn */
      .box-danger   { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; } /* danger */
      .arc          { stroke: #1a3a5c; stroke-width: 2.5; fill: none; }    /* brand-text */
    </style>
    <marker id="pdcaArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a3a5c"/>
    </marker>
  </defs>

  <text class="t-page-title" x="200" y="24" text-anchor="middle">施工管理の PDCA サイクル</text>

  <!-- 中心：継続的改善 -->
  <circle class="ring" cx="200" cy="210" r="50"/>
  <text class="t-center"    x="200" y="207" text-anchor="middle">継続的改善</text>
  <text class="t-center-en" x="200" y="225" text-anchor="middle">Continuous</text>

  <!-- P：上（positive＝計画策定の前向き行為） -->
  <rect class="box-positive" x="150" y="60" width="100" height="70" rx="8"/>
  <text class="t-letter" x="200" y="92"  text-anchor="middle">P</text>
  <text class="t-name"   x="200" y="114" text-anchor="middle">Plan（計画）</text>

  <!-- D：右（brand＝中立的な実行） -->
  <rect class="box-brand" x="295" y="175" width="95" height="70" rx="8"/>
  <text class="t-letter" x="342" y="207" text-anchor="middle">D</text>
  <text class="t-name"   x="342" y="229" text-anchor="middle">Do（実施）</text>

  <!-- C：下（warn＝注意・点検） -->
  <rect class="box-warn" x="150" y="290" width="100" height="70" rx="8"/>
  <text class="t-letter" x="200" y="322" text-anchor="middle">C</text>
  <text class="t-name"   x="200" y="344" text-anchor="middle">Check（検討）</text>

  <!-- A：左（danger＝是正・処置） -->
  <rect class="box-danger" x="10" y="175" width="95" height="70" rx="8"/>
  <text class="t-letter" x="57" y="207" text-anchor="middle">A</text>
  <text class="t-name"   x="57" y="229" text-anchor="middle">Act（処置）</text>

  <!-- 循環矢印 -->
  <path class="arc" d="M 250 120 Q 350 130 340 175" marker-end="url(#pdcaArr)"/>
  <path class="arc" d="M 340 245 Q 350 300 250 320" marker-end="url(#pdcaArr)"/>
  <path class="arc" d="M 150 320 Q 50 310 60 245" marker-end="url(#pdcaArr)"/>
  <path class="arc" d="M 60 175 Q 50 120 150 110" marker-end="url(#pdcaArr)"/>

  <!-- 注釈 -->
  <text class="t-caption" x="200" y="385" text-anchor="middle">機能分類：P・D = 統制機能 ／ C・A = 改善機能</text>
</svg>
