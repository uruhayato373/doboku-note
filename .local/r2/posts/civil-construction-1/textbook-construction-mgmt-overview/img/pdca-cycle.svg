<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" style="max-width:400px;width:100%" role="img" aria-label="施工管理の PDCA サイクル：計画・実施・検討・処置">
  <defs>
    <marker id="pdcaArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a3a5c"/>
    </marker>
  </defs>
  <text x="200" y="25" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222">施工管理の PDCA サイクル</text>

  <!-- Center -->
  <circle cx="200" cy="210" r="50" fill="#e8f0fe" stroke="#2e6da4" stroke-width="2"/>
  <text x="200" y="208" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1a3a5c">継続的改善</text>
  <text x="200" y="228" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1a3a5c">Continuous</text>

  <!-- P: 上 -->
  <rect x="150" y="60" width="100" height="70" fill="#3a7d44" rx="8"/>
  <text x="200" y="90" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">P</text>
  <text x="200" y="112" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ffffff">Plan（計画）</text>

  <!-- D: 右 -->
  <rect x="310" y="175" width="80" height="70" fill="#2e6da4" rx="8"/>
  <text x="350" y="205" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">D</text>
  <text x="350" y="227" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ffffff">Do（実施）</text>

  <!-- C: 下 -->
  <rect x="150" y="290" width="100" height="70" fill="#d4a017" rx="8"/>
  <text x="200" y="320" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">C</text>
  <text x="200" y="342" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ffffff">Check（検討）</text>

  <!-- A: 左 -->
  <rect x="10" y="175" width="80" height="70" fill="#b22234" rx="8"/>
  <text x="50" y="205" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">A</text>
  <text x="50" y="227" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ffffff">Act（処置）</text>

  <!-- Arrows around the circle -->
  <!-- P→D (右上カーブ) -->
  <path d="M 250 120 Q 350 130 340 175" fill="none" stroke="#1a3a5c" stroke-width="2.5" marker-end="url(#pdcaArr)"/>
  <!-- D→C (右下カーブ) -->
  <path d="M 340 245 Q 350 300 250 320" fill="none" stroke="#1a3a5c" stroke-width="2.5" marker-end="url(#pdcaArr)"/>
  <!-- C→A (左下カーブ) -->
  <path d="M 150 320 Q 50 310 60 245" fill="none" stroke="#1a3a5c" stroke-width="2.5" marker-end="url(#pdcaArr)"/>
  <!-- A→P (左上カーブ) -->
  <path d="M 60 175 Q 50 120 150 110" fill="none" stroke="#1a3a5c" stroke-width="2.5" marker-end="url(#pdcaArr)"/>

  <!-- 注釈 -->
  <text x="200" y="385" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">機能分類: P・D = 統制機能 ／ C・A = 改善機能</text>
</svg>
