<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="請負関係と措置義務の帰属。発注者から特定元方事業者（元請）、一次下請、二次下請への請負の連鎖。混在作業の統括安全措置義務は特定元方事業者が負い、建設物等の注文者措置は数次の注文者が2以上のとき最も先次の注文者のみが負う">
  <text x="200" y="24" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1a3a5c">措置義務の帰属：統括は特定元方・注文者措置は最先次</text>

  <!-- 発注者 -->
  <rect x="120" y="40" width="160" height="46" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="200" y="62" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222">発注者</text>
  <text x="200" y="79" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8a8a">注文者に含まれる場合あり</text>

  <line x1="200" y1="86" x2="200" y2="102" stroke="#8a8a8a" stroke-width="1.5"/>
  <path d="M200 102 l-5 -7 h10 z" fill="#8a8a8a"/>

  <!-- 特定元方事業者 -->
  <rect x="60" y="102" width="280" height="60" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="200" y="124" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1a3a5c">特定元方事業者（元請）</text>
  <text x="200" y="143" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222">混在作業の統括安全措置義務</text>
  <text x="200" y="157" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8a8a">協議組織・連絡調整（第30条）</text>

  <line x1="200" y1="162" x2="200" y2="178" stroke="#8a8a8a" stroke-width="1.5"/>
  <path d="M200 178 l-5 -7 h10 z" fill="#8a8a8a"/>

  <!-- 一次下請 -->
  <rect x="80" y="178" width="240" height="52" rx="6" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="200" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1a3a5c">一次下請（関係請負人）</text>
  <text x="200" y="219" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8a8a">自社労働者の安全確保義務</text>

  <line x1="200" y1="230" x2="200" y2="246" stroke="#8a8a8a" stroke-width="1.5"/>
  <path d="M200 246 l-5 -7 h10 z" fill="#8a8a8a"/>

  <!-- 二次下請 -->
  <rect x="80" y="246" width="240" height="46" rx="6" fill="#ffffff" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="200" y="268" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1a3a5c">二次下請（関係請負人）</text>
  <text x="200" y="285" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8a8a">自社労働者の安全確保義務</text>

  <!-- 注記1：注文者措置 -->
  <rect x="40" y="308" width="320" height="76" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="200" y="330" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1a3a5c">注文者の措置（第31条）</text>
  <text x="200" y="350" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222">建設物・設備等を請負人に使わせるとき</text>
  <text x="200" y="368" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222">注文者が2以上なら最も先次の者のみ義務</text>

  <!-- 注記2：整理 -->
  <rect x="40" y="396" width="320" height="80" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="200" y="418" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222">統括義務＝特定元方事業者（元請）が負う</text>
  <text x="200" y="438" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222">下請は自社労働者の安全を確保する</text>
  <text x="200" y="458" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8a8a">特定元方が未選任なら監督署長が指名</text>
</svg>
