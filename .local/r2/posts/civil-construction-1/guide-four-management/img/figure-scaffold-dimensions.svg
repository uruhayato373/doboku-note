<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="足場の寸法規定。作業床の幅は 40cm 以上、手すりの高さは作業床から 85cm 以上、中さんは 35cm 以上 50cm 以下の高さに設ける。床材の隙間は 3cm 以下、長手方向に重ねる部分の長さは 20cm 以上">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-part { font-size: 11px; fill: #555; }
      .t-dim  { font-size: 11px; font-weight: bold; fill: #b22234; }
      .t-sec  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-item { font-size: 11px; fill: #222; }
      .post { fill: #d7d7d7; stroke: #555; stroke-width: 1.5; }
      .deck { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .rail { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .dim  { stroke: #b22234; stroke-width: 1.5; fill: none; }
      .box-surf { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .rule { stroke: #d7d7d7; stroke-width: 1; }
    </style>
    <marker id="sc-a" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#b22234"/>
    </marker>
  </defs>

  <text class="t-lead" x="200" y="18" text-anchor="middle">高さは作業床から測る</text>

  <rect class="post" x="170" y="54" width="8" height="214"/>
  <rect class="post" x="241" y="54" width="8" height="214"/>
  <text class="t-part" x="174" y="46" text-anchor="middle">建地</text>

  <rect class="rail" x="170" y="94" width="79" height="8"/>
  <text class="t-part" x="300" y="102">手すり</text>
  <rect class="rail" x="170" y="160" width="79" height="8"/>
  <text class="t-part" x="300" y="168">中さん</text>

  <rect class="deck" x="170" y="232" width="79" height="12"/>
  <text class="t-part" x="209" y="226" text-anchor="middle">作業床</text>

  <line class="dim" x1="140" y1="165" x2="140" y2="99" marker-end="url(#sc-a)"/>
  <line class="dim" x1="140" y1="165" x2="140" y2="231" marker-end="url(#sc-a)"/>
  <text class="t-dim" x="100" y="165" text-anchor="middle">85cm 以上</text>

  <line class="dim" x1="280" y1="200" x2="280" y2="169" marker-end="url(#sc-a)"/>
  <line class="dim" x1="280" y1="200" x2="280" y2="231" marker-end="url(#sc-a)"/>
  <text class="t-dim" x="324" y="204" text-anchor="middle">35〜50cm</text>

  <line class="dim" x1="209" y1="256" x2="181" y2="256" marker-end="url(#sc-a)"/>
  <line class="dim" x1="209" y1="256" x2="237" y2="256" marker-end="url(#sc-a)"/>
  <text class="t-dim" x="209" y="290" text-anchor="middle">幅 40cm 以上</text>

  <rect class="box-surf" x="20" y="320" width="360" height="162" rx="6"/>
  <text class="t-sec" x="200" y="342" text-anchor="middle">覚える数値</text>
  <line class="rule" x1="36" y1="351" x2="364" y2="351"/>
  <text class="t-item" x="40" y="376">作業床の幅は 40cm 以上</text>
  <text class="t-item" x="40" y="400">床材の隙間は 3cm 以下、重なりは 20cm 以上</text>
  <text class="t-item" x="40" y="424">手すりの高さは 85cm 以上</text>
  <text class="t-item" x="40" y="448">中さんは高さ 35cm 以上 50cm 以下</text>
</svg>
