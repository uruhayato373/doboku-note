<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="施工出来高と工事総原価：固定原価と変動原価からなる原価線と収入線の交点が損益分岐点となり、それ以上の施工出来高が採算速度の領域となる">
  <defs>
    <marker id="bepArr" markerUnits="userSpaceOnUse" viewBox="0 0 8 7" refX="8" refY="3.5" markerWidth="8" markerHeight="7" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#222"/>
    </marker>
    <marker id="bepArrB" markerUnits="userSpaceOnUse" viewBox="0 0 8 7" refX="8" refY="3.5" markerWidth="8" markerHeight="7" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#2e6da4"/>
    </marker>
    <style>
      .f { font-family: Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif; }
    </style>
  </defs>

  <text class="f" x="200" y="18" text-anchor="middle" font-size="11" fill="#8a8a8a">工事総原価 y ＝ 固定原価 F ＋ 変動原価 ux</text>

  <!-- 領域（損失・利益） -->
  <polygon points="70,300 70,230 210,160" fill="#f8d7da"/>
  <polygon points="210,160 330,40 330,100" fill="#d0e8d0"/>

  <!-- 固定原価の水準（切片） -->
  <line x1="70" y1="230" x2="370" y2="230" stroke="#d7d7d7" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- 軸 -->
  <line x1="70" y1="300" x2="378" y2="300" stroke="#222" stroke-width="1.5" marker-end="url(#bepArr)"/>
  <line x1="70" y1="300" x2="70" y2="36" stroke="#222" stroke-width="1.5" marker-end="url(#bepArr)"/>
  <text class="f" x="62" y="50" text-anchor="end" font-size="12" font-weight="bold" fill="#222">金額</text>

  <!-- 収入線 -->
  <line x1="70" y1="300" x2="330" y2="40" stroke="#3a7d44" stroke-width="2.5"/>
  <!-- 原価線 -->
  <line x1="70" y1="230" x2="370" y2="80" stroke="#b22234" stroke-width="2.5"/>
  <circle cx="70" cy="230" r="4.5" fill="#b22234"/>

  <!-- 凡例 -->
  <rect x="84" y="46" width="164" height="52" rx="6" fill="#ffffff" stroke="#d7d7d7" stroke-width="1.5"/>
  <line x1="94" y1="64" x2="116" y2="64" stroke="#3a7d44" stroke-width="2.5"/>
  <text class="f" x="124" y="68" font-size="11" font-weight="bold" fill="#3a7d44">収入</text>
  <line x1="94" y1="84" x2="116" y2="84" stroke="#b22234" stroke-width="2.5"/>
  <text class="f" x="124" y="88" font-size="11" font-weight="bold" fill="#b22234">工事総原価</text>

  <!-- 固定原価 F -->
  <text class="f" x="368" y="222" text-anchor="end" font-size="11" font-weight="bold" fill="#b22234">固定原価 F</text>
  <text class="f" x="368" y="246" text-anchor="end" font-size="11" fill="#555">出来高ゼロでも発生する</text>

  <!-- 損益分岐点 -->
  <line x1="210" y1="160" x2="210" y2="300" stroke="#2e6da4" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="210" cy="160" r="6" fill="#2e6da4"/>

  <!-- 領域ラベル -->
  <text class="f" x="115" y="232" text-anchor="middle" font-size="11" font-weight="bold" fill="#b22234">損失</text>
  <text class="f" x="306" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a7d44">利益</text>

  <!-- 採算速度の領域 -->
  <text class="f" x="286" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">採算速度</text>
  <line x1="214" y1="288" x2="356" y2="288" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#bepArrB)"/>

  <!-- 軸下ラベル -->
  <text class="f" x="210" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">損益分岐点</text>
  <text class="f" x="374" y="318" text-anchor="end" font-size="12" font-weight="bold" fill="#222">施工出来高</text>

  <!-- 用語まとめ -->
  <rect x="18" y="332" width="364" height="152" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>

  <rect x="28" y="340" width="96" height="32" rx="3" fill="#f8d7da" stroke="#b22234" stroke-width="1"/>
  <text class="f" x="76" y="360" text-anchor="middle" font-size="11" font-weight="bold" fill="#b22234">固定原価 F</text>
  <text class="f" x="134" y="360" font-size="11" fill="#555">施工量の増減に関係なく一定</text>

  <rect x="28" y="376" width="96" height="32" rx="3" fill="#fff3cd" stroke="#d4a017" stroke-width="1"/>
  <text class="f" x="76" y="396" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a017">変動原価 ux</text>
  <text class="f" x="134" y="396" font-size="11" fill="#555">施工量に比例して増大する</text>

  <rect x="28" y="412" width="96" height="32" rx="3" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1"/>
  <text class="f" x="76" y="432" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">損益分岐点</text>
  <text class="f" x="134" y="432" font-size="11" fill="#555">収入と支出が等しくなる点</text>

  <rect x="28" y="448" width="96" height="32" rx="3" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1"/>
  <text class="f" x="76" y="468" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a7d44">採算速度</text>
  <text class="f" x="134" y="468" font-size="11" fill="#555">損益分岐点以上をあげる速度</text>
</svg>
