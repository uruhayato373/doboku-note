<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" style="max-width:420px;width:100%" role="img" aria-label="工事費曲線：直接費・間接費・総建設費と最適工期">
  <defs>
    <marker id="axArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <text x="210" y="22" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222">工事費曲線と最適工期</text>

  <!-- 軸 -->
  <line x1="60" y1="280" x2="400" y2="280" stroke="#222" stroke-width="1.5" marker-end="url(#axArr)"/>
  <line x1="60" y1="280" x2="60" y2="50" stroke="#222" stroke-width="1.5" marker-end="url(#axArr)"/>
  <text x="415" y="285" text-anchor="end" font-family="sans-serif" font-size="13" fill="#222">工期</text>
  <text x="40" y="45" font-family="sans-serif" font-size="13" fill="#222">費用</text>
  <text x="60" y="298" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">短</text>
  <text x="380" y="298" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">長</text>

  <!-- 直接費（右下がり、急→緩） -->
  <path d="M 90 80 Q 160 130 250 200 Q 320 240 380 260" fill="none" stroke="#b22234" stroke-width="2.5"/>
  <text x="145" y="110" font-family="sans-serif" font-size="13" font-weight="bold" fill="#b22234">直接費</text>
  <text x="145" y="125" font-family="sans-serif" font-size="11" fill="#b22234">（工期短縮で急増）</text>

  <!-- 間接費（右上がり、ほぼ直線） -->
  <line x1="90" y1="250" x2="380" y2="150" stroke="#d4a017" stroke-width="2.5"/>
  <text x="320" y="175" font-family="sans-serif" font-size="13" font-weight="bold" fill="#d4a017">間接費</text>
  <text x="280" y="195" font-family="sans-serif" font-size="11" fill="#d4a017">（工期延長で増加）</text>

  <!-- 総建設費（U 字） -->
  <path d="M 90 55 Q 160 95 220 100 Q 280 95 380 140" fill="none" stroke="#2e6da4" stroke-width="3"/>
  <text x="100" y="75" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2e6da4">総建設費</text>

  <!-- 最適工期の M 点 -->
  <circle cx="220" cy="100" r="6" fill="#3a7d44"/>
  <text x="228" y="95" font-family="sans-serif" font-size="14" font-weight="bold" fill="#3a7d44">M</text>
  <line x1="220" y1="100" x2="220" y2="280" stroke="#3a7d44" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="220" y="305" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#3a7d44">最適工期</text>

  <!-- 底の注釈 -->
  <text x="210" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3a7d44">（直接＋間接の合計 最小）</text>
</svg>
