<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="測量の分類。測量法では基本測量・公共測量・それ以外の測量・測量法の適用を受けない測量の4つに区分される。方法による区分には三角測量・多角測量・距離測量・水準測量・トータルステーションによる測量・GNSS測量がある">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-sec  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-key  { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .t-item { font-size: 11px; fill: #555; }
      .t-note { font-size: 11px; fill: #222; }
      .box-a { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-b { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-surf { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .rule { stroke: #d7d7d7; stroke-width: 1; }
    </style>
  </defs>

  <text class="t-lead" x="200" y="18" text-anchor="middle">法による区分と方法による区分の2通りがある</text>

  <rect class="box-a" x="20" y="28" width="360" height="182" rx="6"/>
  <text class="t-sec" x="200" y="52" text-anchor="middle">測量法に定める区分</text>
  <line class="rule" x1="36" y1="61" x2="364" y2="61"/>
  <text class="t-key" x="40" y="84">基本測量</text>
  <text class="t-item" x="40" y="102">国土地理院が行う、すべての測量の基礎となるもの</text>
  <text class="t-key" x="40" y="126">公共測量</text>
  <text class="t-item" x="40" y="144">国・公共団体が費用を負担または補助して行うもの</text>
  <text class="t-key" x="40" y="168">上記以外の測量</text>
  <text class="t-item" x="40" y="186">測量法の一部が適用される</text>
  <text class="t-item" x="40" y="204">適用を受けない測量＝局地的・高精度を要しないもの</text>

  <rect class="box-b" x="20" y="224" width="360" height="188" rx="6"/>
  <text class="t-sec" x="200" y="248" text-anchor="middle">測量の方法による区分</text>
  <line class="rule" x1="36" y1="257" x2="364" y2="257"/>
  <text class="t-key" x="40" y="282">三角測量</text>
  <text class="t-item" x="164" y="282">三角形の網で角度を測る</text>
  <text class="t-key" x="40" y="304">多角測量</text>
  <text class="t-item" x="164" y="304">測点を折線で結び距離と角度</text>
  <text class="t-key" x="40" y="326">距離測量</text>
  <text class="t-item" x="164" y="326">2点間の距離を測る</text>
  <text class="t-key" x="40" y="348">水準測量</text>
  <text class="t-item" x="164" y="348">地点間の高低差を測る</text>
  <text class="t-key" x="40" y="370">トータルステーション</text>
  <text class="t-item" x="164" y="370">距離と角度を同時に測る</text>
  <text class="t-key" x="40" y="392">GNSS測量</text>
  <text class="t-item" x="164" y="392">人工衛星の電波で位置を求める</text>

  <rect class="box-surf" x="20" y="426" width="360" height="56" rx="6"/>
  <text class="t-note" x="200" y="450" text-anchor="middle">骨組測量（広い範囲を粗い精度）から細部測量へ進めることで</text>
  <text class="t-note" x="200" y="470" text-anchor="middle">誤差の累積を防ぎ全体の精度を確保する</text>
</svg>
