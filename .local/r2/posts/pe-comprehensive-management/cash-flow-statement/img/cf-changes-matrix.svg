<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" style="max-width:480px;width:100%">
  <rect width="480" height="320" fill="white" stroke="#d7d7d7"/>
  <!-- Title -->
  <text x="240" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">キャッシュ・フローの増減（3区分マトリクス）</text>

  <!-- Column headers (brand-fill) -->
  <rect x="65" y="36" width="130" height="22" fill="#e8f0fe" stroke="#2e6da4"/>
  <text x="130" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">営業CF</text>

  <rect x="200" y="36" width="130" height="22" fill="#e8f0fe" stroke="#2e6da4"/>
  <text x="265" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">投資CF</text>

  <rect x="335" y="36" width="130" height="22" fill="#e8f0fe" stroke="#2e6da4"/>
  <text x="400" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">財務CF</text>

  <!-- (+) Row label (positive-fill) -->
  <rect x="10" y="62" width="50" height="120" fill="#d0e8d0" stroke="#3a7d44"/>
  <text x="35" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a7d44">CF増</text>
  <text x="35" y="133" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a7d44">(+)</text>

  <!-- (+) Cells -->
  <rect x="65" y="62" width="130" height="120" fill="white" stroke="#d7d7d7"/>
  <text x="73" y="82" font-size="11" fill="#222">・売上債権 減少</text>
  <text x="73" y="102" font-size="11" fill="#222">・棚卸資産 減少</text>
  <text x="73" y="122" font-size="11" fill="#222">・購入債務 増加</text>

  <rect x="200" y="62" width="130" height="120" fill="white" stroke="#d7d7d7"/>
  <text x="208" y="82" font-size="11" fill="#222">・固定資産 売却</text>
  <text x="208" y="102" font-size="11" fill="#222">・有価証券 売却</text>
  <text x="208" y="122" font-size="11" fill="#222">・貸付金 回収</text>

  <rect x="335" y="62" width="130" height="120" fill="white" stroke="#d7d7d7"/>
  <text x="343" y="82" font-size="11" fill="#222">・借入金 増加</text>
  <text x="343" y="102" font-size="11" fill="#222">・社債 発行</text>
  <text x="343" y="122" font-size="11" fill="#222">・株式発行（増資）</text>

  <!-- (−) Row label (danger-fill) -->
  <rect x="10" y="186" width="50" height="120" fill="#f8d7da" stroke="#b22234"/>
  <text x="35" y="239" text-anchor="middle" font-size="13" font-weight="bold" fill="#b22234">CF減</text>
  <text x="35" y="257" text-anchor="middle" font-size="13" font-weight="bold" fill="#b22234">(−)</text>

  <!-- (−) Cells -->
  <rect x="65" y="186" width="130" height="120" fill="white" stroke="#d7d7d7"/>
  <text x="73" y="206" font-size="11" fill="#222">・売上債権 増加</text>
  <text x="73" y="226" font-size="11" fill="#222">・棚卸資産 増加</text>
  <text x="73" y="246" font-size="11" fill="#222">・購入債務 減少</text>

  <rect x="200" y="186" width="130" height="120" fill="white" stroke="#d7d7d7"/>
  <text x="208" y="206" font-size="11" fill="#222">・固定資産 取得</text>
  <text x="208" y="226" font-size="11" fill="#222">・有価証券 取得</text>
  <text x="208" y="246" font-size="11" fill="#222">・貸付金 実行</text>

  <rect x="335" y="186" width="130" height="120" fill="white" stroke="#d7d7d7"/>
  <text x="343" y="206" font-size="11" fill="#222">・借入金 返済</text>
  <text x="343" y="226" font-size="11" fill="#222">・社債 償還</text>
  <text x="343" y="246" font-size="11" fill="#222">・自社株買い</text>
  <text x="343" y="266" font-size="11" fill="#222">・配当金 支払</text>
</svg>
