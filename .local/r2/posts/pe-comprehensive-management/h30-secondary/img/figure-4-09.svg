<svg xmlns="http://www.w3.org/2000/svg" width="560" height="480" viewBox="0 0 560 480" style="max-width:560px;width:100%" role="img" aria-label="figure 4 09" font-family='Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif'>
  <defs>
    <marker id="arr3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1a3a5c"/>
    </marker>
  </defs>
  <!-- Header row -->
  <rect x="10" y="10" width="540" height="32" rx="4" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="150" y="30" text-anchor="middle" fill="#1a3a5c" font-size="12" font-weight="bold">設問</text>
  <text x="370" y="30" text-anchor="middle" fill="#1a3a5c" font-size="12" font-weight="bold">論文骨子の内容</text>
  <line x1="240" y1="10" x2="240" y2="478" stroke="#1a3a5c" stroke-width="1"/>
  <!-- Row 1: 設問1 -->
  <rect x="10" y="44" width="228" height="128" rx="0" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1"/>
  <text x="124" y="68" text-anchor="middle" fill="#1a3a5c" font-size="12" font-weight="bold">設問(1)</text>
  <text x="124" y="90" text-anchor="middle" fill="#1a3a5c" font-size="11">取り上げる</text>
  <text x="124" y="107" text-anchor="middle" fill="#1a3a5c" font-size="11">事業・プロジェクト等の</text>
  <text x="124" y="124" text-anchor="middle" fill="#1a3a5c" font-size="11">名称及び概要</text>
  <rect x="240" y="44" width="310" height="128" rx="0" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1"/>
  <text x="260" y="66" fill="#222" font-size="11">① 事業・プロジェクト等の名称</text>
  <text x="260" y="84" fill="#222" font-size="11">② この事業の目的</text>
  <text x="260" y="102" fill="#222" font-size="11">③ 創出している成果物（製品・サービス等）</text>
  <text x="260" y="120" fill="#222" font-size="11">④ 過去と比較して働き方が変化した事象</text>
  <text x="270" y="138" fill="#555" font-size="10">a) 事例の内容　b) 変化　c) 働き方の変化</text>
  <text x="260" y="162" fill="#222" font-size="11">（設問(2)と合わせて答案用紙3枚以内）</text>
  <!-- Row 2: 設問2 -->
  <rect x="10" y="174" width="228" height="148" rx="0" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1"/>
  <text x="124" y="200" text-anchor="middle" fill="#1a3a5c" font-size="12" font-weight="bold">設問(2)</text>
  <text x="124" y="222" text-anchor="middle" fill="#1a3a5c" font-size="11">働き方改革に</text>
  <text x="124" y="239" text-anchor="middle" fill="#1a3a5c" font-size="11">関係する</text>
  <text x="124" y="256" text-anchor="middle" fill="#1a3a5c" font-size="11">現在の課題を</text>
  <text x="124" y="273" text-anchor="middle" fill="#1a3a5c" font-size="11">2つ取り上げる</text>
  <text x="124" y="292" text-anchor="middle" fill="#555" font-size="10">（答案用紙3枚以内）</text>
  <rect x="240" y="174" width="310" height="148" rx="0" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1"/>
  <text x="260" y="196" fill="#222" font-size="11">① 課題1</text>
  <text x="275" y="214" fill="#555" font-size="10">a) 背景　b) 背景の具体的な影響　c) 背景</text>
  <text x="260" y="234" fill="#222" font-size="11">② 課題2</text>
  <text x="275" y="252" fill="#555" font-size="10">a) 背景　b) 背景の具体的な影響　c) 背景</text>
  <rect x="248" y="262" width="294" height="52" rx="4" fill="#fff3cd" stroke="#d4a017" stroke-width="1"/>
  <text x="395" y="280" text-anchor="middle" fill="#d4a017" font-size="11" font-weight="bold">課題2つは「5つの管理」の</text>
  <text x="395" y="298" text-anchor="middle" fill="#d4a017" font-size="11" font-weight="bold">異なる観点から選ぶこと</text>
  <!-- Row 3: 設問3 -->
  <rect x="10" y="324" width="228" height="154" rx="0" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1"/>
  <text x="124" y="350" text-anchor="middle" fill="#1a3a5c" font-size="12" font-weight="bold">設問(3)</text>
  <text x="124" y="372" text-anchor="middle" fill="#1a3a5c" font-size="11">課題を解決するための</text>
  <text x="124" y="389" text-anchor="middle" fill="#1a3a5c" font-size="11">技術や方策について</text>
  <text x="124" y="406" text-anchor="middle" fill="#1a3a5c" font-size="11">（答案用紙2枚以内）</text>
  <rect x="240" y="324" width="310" height="154" rx="0" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1"/>
  <text x="260" y="346" fill="#222" font-size="11">課題1について</text>
  <text x="270" y="364" fill="#555" font-size="10">a) 具体的な技術や方策</text>
  <text x="270" y="380" fill="#555" font-size="10">b) 実現するために乗り越えなければならない障害</text>
  <text x="270" y="396" fill="#555" font-size="10">c) 実現した場合の働き方への具体的な効果</text>
  <text x="270" y="412" fill="#555" font-size="10">d) 付随して生じる留意すべき影響</text>
  <text x="260" y="432" fill="#222" font-size="11">課題2について（同様）</text>
  <text x="260" y="452" fill="#555" font-size="10">→ 答案用紙2枚以内にまとめること</text>
</svg>