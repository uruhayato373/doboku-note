<svg viewBox="0 0 500 480" xmlns="http://www.w3.org/2000/svg" style="max-width:500px;width:100%" role="img" aria-label="マグレガーのX理論とY理論の2カラム比較。X理論は仕事嫌い・強制命令・責任回避・安全志向、Y理論は自律・目標で率先・自ら責任を特徴とする">
  <!-- viewBox width=500: 2カラム比較図のため横幅500を使用（400では各カラムが過密になるため） -->
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-title   { font-size: 16px; font-weight: bold; fill: #1a3a5c; }
      .t-sub     { font-size: 12px; fill: #555; }
      .t-head    { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-label   { font-size: 13px; fill: #222; }
      .t-note    { font-size: 12px; fill: #555; }
      .t-axis    { font-size: 11px; font-weight: bold; fill: #8a8a8a; }
      .t-foot    { font-size: 11px; fill: #555; }
      /* warn寄り = X理論 */
      .box-warn  { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; } /* warn bg / warn stroke */
      .hdr-warn  { fill: #d4a017; }                                      /* warn stroke = header fill */
      .hdr-warn-text { font-size: 15px; font-weight: bold; fill: #ffffff; }
      .item-warn { fill: #ffffff; stroke: #d4a017; stroke-width: 1; }   /* white fill + warn stroke */
      .num-warn  { font-size: 13px; font-weight: bold; fill: #d4a017; } /* warn stroke = badge text */
      /* positive寄り = Y理論 */
      .box-pos   { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; } /* positive bg / stroke */
      .hdr-pos   { fill: #3a7d44; }                                      /* positive stroke = header fill */
      .hdr-pos-text { font-size: 15px; font-weight: bold; fill: #ffffff; }
      .item-pos  { fill: #ffffff; stroke: #3a7d44; stroke-width: 1; }   /* white fill + positive stroke */
      .num-pos   { font-size: 13px; font-weight: bold; fill: #3a7d44; } /* positive stroke = badge text */
    </style>
  </defs>

  <!-- タイトル -->
  <text class="t-title" x="250" y="30" text-anchor="middle">マグレガーのX理論とY理論</text>
  <text class="t-sub" x="250" y="50" text-anchor="middle">人間資源的アプローチ（実践論的理論）による労働者タイプの分類</text>

  <!-- 区切り線 -->
  <line x1="30" y1="60" x2="470" y2="60" stroke="#d7d7d7" stroke-width="1"/>

  <!-- ===== X理論カラム（左） ===== -->
  <!-- カラム背景 warn -->
  <rect class="box-warn" x="28" y="72" width="210" height="374" rx="10"/>

  <!-- ヘッダー warn -->
  <rect class="hdr-warn" x="28" y="72" width="210" height="46" rx="10"/>
  <rect class="hdr-warn" x="28" y="100" width="210" height="18"/>
  <text class="hdr-warn-text" x="133" y="102" text-anchor="middle">X理論</text>
  <text style="font-size:11px;fill:#ffffff;" x="133" y="116" text-anchor="middle">強制・管理型の人間観</text>

  <!-- X理論 アイテム1 -->
  <rect class="item-warn" x="44" y="130" width="178" height="72" rx="6"/>
  <circle class="item-warn" cx="64" cy="152" r="13"/>
  <text class="num-warn" x="64" y="157" text-anchor="middle">1</text>
  <text class="t-label" x="84" y="150">仕事嫌い</text>
  <text class="t-note" x="84" y="167">本質的に仕事を避けようと</text>
  <text class="t-note" x="84" y="181">する傾向がある</text>

  <!-- X理論 アイテム2 -->
  <rect class="item-warn" x="44" y="212" width="178" height="72" rx="6"/>
  <circle class="item-warn" cx="64" cy="234" r="13"/>
  <text class="num-warn" x="64" y="239" text-anchor="middle">2</text>
  <text class="t-label" x="84" y="232">強制・命令</text>
  <text class="t-note" x="84" y="249">強制や命令を常に行わなければ</text>
  <text class="t-note" x="84" y="263">十分な力を発揮できない</text>

  <!-- X理論 アイテム3 -->
  <rect class="item-warn" x="44" y="294" width="178" height="72" rx="6"/>
  <circle class="item-warn" cx="64" cy="316" r="13"/>
  <text class="num-warn" x="64" y="321" text-anchor="middle">3</text>
  <text class="t-label" x="84" y="314">責任回避</text>
  <text class="t-note" x="84" y="331">責任を回避しがちで</text>
  <text class="t-note" x="84" y="345">野心は低い</text>

  <!-- X理論 アイテム4 -->
  <rect class="item-warn" x="44" y="376" width="178" height="56" rx="6"/>
  <circle class="item-warn" cx="64" cy="400" r="13"/>
  <text class="num-warn" x="64" y="405" text-anchor="middle">4</text>
  <text class="t-label" x="84" y="398">安全志向</text>
  <text class="t-note" x="84" y="415">野心より自身の安全を</text>
  <text class="t-note" x="84" y="429">より強く求める</text>

  <!-- ===== Y理論カラム（右） ===== -->
  <!-- カラム背景 positive -->
  <rect class="box-pos" x="262" y="72" width="210" height="374" rx="10"/>

  <!-- ヘッダー positive -->
  <rect class="hdr-pos" x="262" y="72" width="210" height="46" rx="10"/>
  <rect class="hdr-pos" x="262" y="100" width="210" height="18"/>
  <text class="hdr-pos-text" x="367" y="102" text-anchor="middle">Y理論</text>
  <text style="font-size:11px;fill:#ffffff;" x="367" y="116" text-anchor="middle">自律・参加型の人間観</text>

  <!-- Y理論 アイテム1 -->
  <rect class="item-pos" x="278" y="130" width="178" height="72" rx="6"/>
  <circle class="item-pos" cx="298" cy="152" r="13"/>
  <text class="num-pos" x="298" y="157" text-anchor="middle">1</text>
  <text class="t-label" x="318" y="150">本来勤勉</text>
  <text class="t-note" x="318" y="167">人間は本来勤勉であり</text>
  <text class="t-note" x="318" y="181">仕事への意欲を持つ</text>

  <!-- Y理論 アイテム2 -->
  <rect class="item-pos" x="278" y="212" width="178" height="72" rx="6"/>
  <circle class="item-pos" cx="298" cy="234" r="13"/>
  <text class="num-pos" x="298" y="239" text-anchor="middle">2</text>
  <text class="t-label" x="318" y="232">目標で率先</text>
  <text class="t-note" x="318" y="249">納得できる目標や興味ある</text>
  <text class="t-note" x="318" y="263">仕事には自ら率先して努力</text>

  <!-- Y理論 アイテム3 -->
  <rect class="item-pos" x="278" y="294" width="178" height="72" rx="6"/>
  <circle class="item-pos" cx="298" cy="316" r="13"/>
  <text class="num-pos" x="298" y="321" text-anchor="middle">3</text>
  <text class="t-label" x="318" y="314">自ら責任</text>
  <text class="t-note" x="318" y="331">自分で責任を持とうとする</text>
  <text class="t-note" x="318" y="345">意欲がある</text>

  <!-- 管理アプローチ比較フッター -->
  <rect x="28" y="456" width="444" height="16" rx="4" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <text class="t-foot" x="250" y="468" text-anchor="middle">X理論→命令・統制による管理　　Y理論→参加・自律を促す管理</text>

</svg>
