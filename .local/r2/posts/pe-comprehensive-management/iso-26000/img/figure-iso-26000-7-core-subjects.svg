<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="ISO 26000 の 7 つの中核主題のホイール図：組織統治を中心に、人権・労働慣行・環境・公正な事業慣行・消費者課題・コミュニティへの参画が取り囲む" font-family='Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif'>
  <rect width="400" height="500" fill="#ffffff"/>

  <!-- Title -->
  <text x="200" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">ISO 26000 の 7 つの中核主題</text>

  <!-- Connecting lines (drawn first, behind circles) -->
  <g stroke="#d7d7d7" stroke-width="1.2">
    <line x1="200" y1="260" x2="200" y2="120"/>
    <line x1="200" y1="260" x2="310" y2="188"/>
    <line x1="200" y1="260" x2="310" y2="332"/>
    <line x1="200" y1="260" x2="200" y2="400"/>
    <line x1="200" y1="260" x2="90" y2="332"/>
    <line x1="200" y1="260" x2="90" y2="188"/>
  </g>

  <!-- Central: 組織統治 -->
  <circle cx="200" cy="260" r="58" fill="#2e6da4" stroke="#1a3a5c" stroke-width="2"/>
  <text x="200" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">組織統治</text>
  <text x="200" y="273" text-anchor="middle" font-size="9" fill="#e8f0fe">Organizational</text>
  <text x="200" y="285" text-anchor="middle" font-size="9" fill="#e8f0fe">Governance</text>

  <!-- Top: 人権 -->
  <circle cx="200" cy="120" r="46" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text x="200" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#d4a017">人権</text>
  <text x="200" y="133" text-anchor="middle" font-size="9" fill="#555">Human Rights</text>

  <!-- Top-right: 労働慣行 -->
  <circle cx="310" cy="188" r="46" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text x="310" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="#d4a017">労働慣行</text>
  <text x="310" y="200" text-anchor="middle" font-size="9" fill="#555">Labour Practices</text>

  <!-- Bottom-right: 環境 -->
  <circle cx="310" cy="332" r="46" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
  <text x="310" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a7d44">環境</text>
  <text x="310" y="344" text-anchor="middle" font-size="9" fill="#555">Environment</text>

  <!-- Bottom: 公正な事業慣行 -->
  <circle cx="200" cy="400" r="46" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="200" y="393" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6da4">公正な</text>
  <text x="200" y="408" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6da4">事業慣行</text>
  <text x="200" y="422" text-anchor="middle" font-size="9" fill="#555">Fair Operating</text>

  <!-- Bottom-left: 消費者課題 -->
  <circle cx="90" cy="332" r="46" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="90" y="328" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6da4">消費者課題</text>
  <text x="90" y="344" text-anchor="middle" font-size="9" fill="#555">Consumer Issues</text>

  <!-- Top-left: コミュニティ -->
  <circle cx="90" cy="188" r="46" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text x="90" y="181" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a017">コミュニティ</text>
  <text x="90" y="196" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a017">への参画</text>
  <text x="90" y="210" text-anchor="middle" font-size="9" fill="#555">Community</text>

  <!-- Legend / summary -->
  <text x="200" y="464" text-anchor="middle" font-size="11" fill="#555">組織統治（中心）が他の 6 主題を統合的に支える構造</text>
  <text x="200" y="482" text-anchor="middle" font-size="11" fill="#1a3a5c" font-weight="bold">CSR の国際規格：2010 年発行・全業種対象</text>
</svg>
