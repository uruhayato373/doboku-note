<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" width="400" height="500" role="img" aria-label="OSHMS指針とISO 45001の比較。左：OSHMS=厚労省・国内行政指針・認証任意・リスクアセスメント重視。右：ISO 45001=ISO・国際規格・第三者認証可・OHSAS 18001後継。共通：PDCA・継続的改善・安全衛生方針。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-title { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-sec   { font-size: 11px; font-weight: bold; fill: #ffffff; }
      .t-hd    { font-size: 12px; font-weight: bold; }
      .t-cell  { font-size: 11px; fill: #555; }
      .t-foot  { font-size: 11px; fill: #8a8a8a; }
    </style>
  </defs>
  <rect width="400" height="500" fill="#ffffff"/>

  <!-- タイトル -->
  <text class="t-title" x="200" y="22" text-anchor="middle">OSHMS指針 と ISO 45001 の比較</text>
  <line x1="20" y1="30" x2="380" y2="30" stroke="#d7d7d7" stroke-width="1"/>

  <!-- セクションバー -->
  <rect x="8" y="34" width="384" height="18" rx="3" fill="#2e6da4"/>
  <text class="t-sec" x="200" y="47" text-anchor="middle">労働安全衛生マネジメントシステム（2種）</text>

  <!-- ── ヘッダー行 ── -->
  <rect x="8"   y="58" width="80"  height="24" fill="#2e6da4"/>
  <rect x="90"  y="58" width="148" height="24" fill="#2e6da4"/>
  <rect x="244" y="58" width="148" height="24" fill="#2e6da4"/>
  <text x="48"  y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">項目</text>
  <text x="164" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">OSHMS 指針</text>
  <text x="318" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">ISO 45001</text>

  <!-- Row 1: 策定主体 -->
  <rect x="8"   y="82" width="80"  height="36" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="0.5"/>
  <rect x="90"  y="82" width="148" height="36" fill="#e8f0fe" stroke="#d7d7d7" stroke-width="0.5"/>
  <rect x="244" y="82" width="148" height="36" fill="#fff3cd" stroke="#d7d7d7" stroke-width="0.5"/>
  <text class="t-hd" x="48"  y="104" text-anchor="middle" fill="#1a3a5c">策定</text>
  <text class="t-cell" x="164" y="97"  text-anchor="middle">厚生労働省</text>
  <text class="t-cell" x="164" y="112" text-anchor="middle">（国内行政指針）</text>
  <text class="t-cell" x="318" y="97"  text-anchor="middle">ISO</text>
  <text class="t-cell" x="318" y="112" text-anchor="middle">（国際標準化機構）</text>

  <!-- Row 2: 性格 -->
  <rect x="8"   y="118" width="80"  height="36" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="0.5"/>
  <rect x="90"  y="118" width="148" height="36" fill="#e8f0fe" stroke="#d7d7d7" stroke-width="0.5"/>
  <rect x="244" y="118" width="148" height="36" fill="#fff3cd" stroke="#d7d7d7" stroke-width="0.5"/>
  <text class="t-hd" x="48"  y="140" text-anchor="middle" fill="#1a3a5c">性格</text>
  <text class="t-cell" x="164" y="133" text-anchor="middle">行政指導に基づく</text>
  <text class="t-cell" x="164" y="149" text-anchor="middle">自主的取組</text>
  <text class="t-cell" x="318" y="133" text-anchor="middle">国際規格に基づく</text>
  <text class="t-cell" x="318" y="149" text-anchor="middle">自主的取組</text>

  <!-- Row 3: 認証 -->
  <rect x="8"   y="154" width="80"  height="36" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="0.5"/>
  <rect x="90"  y="154" width="148" height="36" fill="#e8f0fe" stroke="#d7d7d7" stroke-width="0.5"/>
  <rect x="244" y="154" width="148" height="36" fill="#fff3cd" stroke="#d7d7d7" stroke-width="0.5"/>
  <text class="t-hd" x="48"  y="176" text-anchor="middle" fill="#1a3a5c">認証</text>
  <text class="t-cell" x="164" y="169" text-anchor="middle">第三者認証なし</text>
  <text class="t-cell" x="164" y="185" text-anchor="middle">（自己適合宣言）</text>
  <text class="t-cell" x="318" y="169" text-anchor="middle">第三者認証が可能</text>
  <text class="t-cell" x="318" y="185" text-anchor="middle">（グローバル通用性あり）</text>

  <!-- Row 4: 特徴 -->
  <rect x="8"   y="190" width="80"  height="36" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="0.5"/>
  <rect x="90"  y="190" width="148" height="36" fill="#e8f0fe" stroke="#d7d7d7" stroke-width="0.5"/>
  <rect x="244" y="190" width="148" height="36" fill="#fff3cd" stroke="#d7d7d7" stroke-width="0.5"/>
  <text class="t-hd" x="48"  y="212" text-anchor="middle" fill="#1a3a5c">特徴</text>
  <text class="t-cell" x="164" y="205" text-anchor="middle">リスクアセスメント</text>
  <text class="t-cell" x="164" y="221" text-anchor="middle">を明示的に規定</text>
  <text class="t-cell" x="318" y="205" text-anchor="middle">OHSAS 18001 の</text>
  <text class="t-cell" x="318" y="221" text-anchor="middle">後継国際規格（2018年）</text>

  <!-- Row 5: 対象 -->
  <rect x="8"   y="226" width="80"  height="36" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="0.5"/>
  <rect x="90"  y="226" width="148" height="36" fill="#e8f0fe" stroke="#d7d7d7" stroke-width="0.5"/>
  <rect x="244" y="226" width="148" height="36" fill="#fff3cd" stroke="#d7d7d7" stroke-width="0.5"/>
  <text class="t-hd" x="48"  y="248" text-anchor="middle" fill="#1a3a5c">対象</text>
  <text class="t-cell" x="164" y="241" text-anchor="middle">国内事業場</text>
  <text class="t-cell" x="164" y="257" text-anchor="middle">（国内導入実績が豊富）</text>
  <text class="t-cell" x="318" y="241" text-anchor="middle">グローバル事業体</text>
  <text class="t-cell" x="318" y="257" text-anchor="middle">（海外拠点にも適用可）</text>

  <!-- ── 共通要素ゾーン ── -->
  <rect x="8" y="272" width="384" height="18" rx="3" fill="#3a7d44"/>
  <text class="t-sec" x="200" y="285" text-anchor="middle">両制度に共通する基本構造</text>

  <!-- 共通3ボックス -->
  <rect x="8"   y="296" width="118" height="56" rx="5" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
  <text x="67"  y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">PDCA</text>
  <text x="67"  y="336" text-anchor="middle" font-size="11" fill="#555">Plan→Do→</text>
  <text x="67"  y="350" text-anchor="middle" font-size="11" fill="#555">Check→Act</text>

  <rect x="141" y="296" width="118" height="56" rx="5" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
  <text x="200" y="314" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">継続的改善</text>
  <text x="200" y="330" text-anchor="middle" font-size="11" fill="#555">毎サイクルで</text>
  <text x="200" y="346" text-anchor="middle" font-size="11" fill="#555">安全水準を向上</text>

  <rect x="274" y="296" width="118" height="56" rx="5" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
  <text x="333" y="314" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">トップ関与</text>
  <text x="333" y="330" text-anchor="middle" font-size="11" fill="#555">安全衛生方針は</text>
  <text x="333" y="346" text-anchor="middle" font-size="11" fill="#555">トップが表明</text>

  <!-- ── 試験ポイント ── -->
  <rect x="8" y="364" width="384" height="18" rx="3" fill="#d4a017"/>
  <text class="t-sec" x="200" y="377" text-anchor="middle">試験頻出ポイント（H25 · R03 出題）</text>

  <rect x="8" y="388" width="384" height="96" rx="5" fill="#fff3cd" stroke="#d4a017" stroke-width="1"/>
  <text x="20" y="408" font-size="11" font-weight="bold" fill="#1a3a5c">① 両制度とも法的義務ではなく自主的取組</text>
  <text x="20" y="426" font-size="11" fill="#555">② ISO 45001 は OHSAS 18001 の後継規格（2018年・H25出題）</text>
  <text x="20" y="444" font-size="11" fill="#555">③ Plan：リスクアセスメント→目標設定→計画（R03出題）</text>
  <text x="20" y="462" font-size="11" fill="#555">④ システム監査は C フェーズを補完する外部検証機能</text>

  <!-- フッター -->
  <text class="t-foot" x="200" y="497" text-anchor="middle">OSHMS指針（厚労省）／ISO 45001（2018年制定）</text>
</svg>
