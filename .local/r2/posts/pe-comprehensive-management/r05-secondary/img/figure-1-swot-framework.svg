<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="図1 SWOT分析の枠組み。強み(S)・弱み(W)の列は内部環境、機会(O)・脅威(T)の行は外部環境。両者を掛け合わせる2×2マトリクスで、強み×機会＝パターンA（拡大・進出戦略）、弱み×機会＝パターンB（改善・補強・提携戦略）、強み×脅威＝パターンC（差別化戦略）、弱み×脅威＝パターンD（撤退・縮小戦略）。" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
  <rect width="400" height="500" fill="#ffffff" stroke="#d7d7d7"/>

  <!-- 内部環境 (S/W 列) -->
  <rect x="88" y="10" width="304" height="18" fill="#ffffff" stroke="#222" stroke-width="1"/>
  <text x="240" y="23" text-anchor="middle" font-size="11" fill="#222">内部環境</text>

  <!-- 外部環境 (O/T 行) -->
  <rect x="8" y="80" width="18" height="248" fill="#ffffff" stroke="#222" stroke-width="1"/>
  <text x="17" y="204" text-anchor="middle" font-size="11" fill="#222" transform="rotate(-90 17 204)">外部環境</text>

  <!-- column headers -->
  <rect x="88" y="28" width="152" height="52" fill="#ffffff" stroke="#222" stroke-width="1"/>
  <text x="164" y="50" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">強み（S）</text>
  <text x="164" y="68" text-anchor="middle" font-size="11" fill="#555">項目 S1，項目 S2</text>
  <rect x="240" y="28" width="152" height="52" fill="#ffffff" stroke="#222" stroke-width="1"/>
  <text x="316" y="50" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">弱み（W）</text>
  <text x="316" y="68" text-anchor="middle" font-size="11" fill="#555">項目 W1，項目 W2</text>

  <!-- row headers -->
  <rect x="26" y="80" width="62" height="124" fill="#ffffff" stroke="#222" stroke-width="1"/>
  <text x="57" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">機会（O）</text>
  <text x="57" y="148" text-anchor="middle" font-size="11" fill="#555">項目</text>
  <text x="57" y="163" text-anchor="middle" font-size="11" fill="#555">O1，O2</text>
  <rect x="26" y="204" width="62" height="124" fill="#ffffff" stroke="#222" stroke-width="1"/>
  <text x="57" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">脅威（T）</text>
  <text x="57" y="272" text-anchor="middle" font-size="11" fill="#555">項目</text>
  <text x="57" y="287" text-anchor="middle" font-size="11" fill="#555">T1，T2</text>

  <!-- cell A: S×O -->
  <rect x="88" y="80" width="152" height="124" fill="#e8f0fe" stroke="#222" stroke-width="1"/>
  <text x="164" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">パターンA</text>
  <text x="164" y="137" text-anchor="middle" font-size="11" fill="#555">（強み × 機会）</text>
  <text x="164" y="162" text-anchor="middle" font-size="11" fill="#222">拡大戦略，進出戦略 など</text>

  <!-- cell B: W×O -->
  <rect x="240" y="80" width="152" height="124" fill="#d0e8d0" stroke="#222" stroke-width="1"/>
  <text x="316" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">パターンB</text>
  <text x="316" y="130" text-anchor="middle" font-size="11" fill="#555">（弱み × 機会）</text>
  <text x="316" y="152" text-anchor="middle" font-size="11" fill="#222">改善戦略，補強戦略，</text>
  <text x="316" y="168" text-anchor="middle" font-size="11" fill="#222">提携戦略 など</text>

  <!-- cell C: S×T -->
  <rect x="88" y="204" width="152" height="124" fill="#fff3cd" stroke="#222" stroke-width="1"/>
  <text x="164" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">パターンC</text>
  <text x="164" y="261" text-anchor="middle" font-size="11" fill="#555">（強み × 脅威）</text>
  <text x="164" y="286" text-anchor="middle" font-size="11" fill="#222">差別化戦略 など</text>

  <!-- cell D: W×T -->
  <rect x="240" y="204" width="152" height="124" fill="#f8d7da" stroke="#222" stroke-width="1"/>
  <text x="316" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">パターンD</text>
  <text x="316" y="261" text-anchor="middle" font-size="11" fill="#555">（弱み × 脅威）</text>
  <text x="316" y="286" text-anchor="middle" font-size="11" fill="#222">撤退戦略，縮小戦略 など</text>

  <!-- 下部：4パターン戦略方向サマリー -->
  <rect x="8" y="342" width="384" height="148" rx="8" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="1"/>
  <text x="200" y="365" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">4パターンの戦略方向</text>
  <line x1="18" y1="371" x2="382" y2="371" stroke="#d7d7d7" stroke-width="1"/>

  <rect x="18" y="380" width="12" height="12" rx="2" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1"/>
  <text x="36" y="391" font-size="11" fill="#222">A（S×O）: 強みを活かして機会に乗る — 積極攻勢</text>

  <rect x="18" y="401" width="12" height="12" rx="2" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1"/>
  <text x="36" y="412" font-size="11" fill="#222">B（W×O）: 弱みを補強し機会を活用 — 段階的前進</text>

  <rect x="18" y="422" width="12" height="12" rx="2" fill="#fff3cd" stroke="#d4a017" stroke-width="1"/>
  <text x="36" y="433" font-size="11" fill="#222">C（S×T）: 強みで脅威に対抗 — 差別化・回避</text>

  <rect x="18" y="443" width="12" height="12" rx="2" fill="#f8d7da" stroke="#b22234" stroke-width="1"/>
  <text x="36" y="454" font-size="11" fill="#222">D（W×T）: 損失を最小化 — 撤退・縮小・転換</text>

  <text x="18" y="478" font-size="11" fill="#555">※ 試験では A〜D を全パターン検討し優先度付けが問われる</text>
</svg>
