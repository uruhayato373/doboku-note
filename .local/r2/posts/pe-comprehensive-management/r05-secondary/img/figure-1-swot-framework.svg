<svg xmlns="http://www.w3.org/2000/svg" width="400" height="308" viewBox="0 0 400 308" style="max-width:400px;width:100%" role="img" aria-label="図1 SWOT分析の枠組み。強み(S)・弱み(W)の列は組織が変えうる内部環境、機会(O)・脅威(T)の行は変えにくい外部環境。両者を掛け合わせる2×2マトリクスで、強み×機会＝パターンA（拡大・進出戦略）、弱み×機会＝パターンB（改善・補強・提携戦略）、強み×脅威＝パターンC（差別化戦略）、弱み×脅威＝パターンD（撤退・縮小戦略）。" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
  <rect width="400" height="308" fill="#ffffff" stroke="#d7d7d7"/>
  <text x="200" y="23" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">図1　SWOT 分析の枠組み</text>

  <!-- 内部環境 band (covers S/W columns) -->
  <rect x="88" y="34" width="304" height="18" fill="#e8f0fe" stroke="#2e6da4"/>
  <text x="240" y="47" text-anchor="middle" font-size="11" fill="#1a3a5c">内部環境（組織が変えうる要因）</text>

  <!-- 外部環境 band (covers O/T rows) -->
  <rect x="8" y="98" width="18" height="206" fill="#e8f0fe" stroke="#2e6da4"/>
  <text x="17" y="201" text-anchor="middle" font-size="11" fill="#1a3a5c" transform="rotate(-90 17 201)">外部環境（変えにくい要因）</text>

  <!-- column headers -->
  <rect x="88" y="52" width="152" height="46" fill="#f5f5f5" stroke="#2e6da4"/>
  <text x="164" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">強み（S）</text>
  <text x="164" y="91" text-anchor="middle" font-size="11" fill="#555">項目 S1，項目 S2</text>
  <rect x="240" y="52" width="152" height="46" fill="#f5f5f5" stroke="#2e6da4"/>
  <text x="316" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">弱み（W）</text>
  <text x="316" y="91" text-anchor="middle" font-size="11" fill="#555">項目 W1，項目 W2</text>

  <!-- row headers -->
  <rect x="26" y="98" width="62" height="103" fill="#f5f5f5" stroke="#2e6da4"/>
  <text x="57" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">機会（O）</text>
  <text x="57" y="159" text-anchor="middle" font-size="11" fill="#555">項目</text>
  <text x="57" y="173" text-anchor="middle" font-size="11" fill="#555">O1，O2</text>
  <rect x="26" y="201" width="62" height="103" fill="#f5f5f5" stroke="#2e6da4"/>
  <text x="57" y="243" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">脅威（T）</text>
  <text x="57" y="262" text-anchor="middle" font-size="11" fill="#555">項目</text>
  <text x="57" y="276" text-anchor="middle" font-size="11" fill="#555">T1，T2</text>

  <!-- cell A: S×O -->
  <rect x="88" y="98" width="152" height="103" fill="#d0e8d0" stroke="#3a7d44"/>
  <text x="164" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">パターンA</text>
  <text x="164" y="150" text-anchor="middle" font-size="11" fill="#1a3a5c">（強み × 機会）</text>
  <text x="164" y="176" text-anchor="middle" font-size="11" fill="#222">拡大戦略，進出戦略 など</text>

  <!-- cell B: W×O -->
  <rect x="240" y="98" width="152" height="103" fill="#fff3cd" stroke="#d4a017"/>
  <text x="316" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">パターンB</text>
  <text x="316" y="143" text-anchor="middle" font-size="11" fill="#1a3a5c">（弱み × 機会）</text>
  <text x="316" y="166" text-anchor="middle" font-size="11" fill="#222">改善戦略，補強戦略，</text>
  <text x="316" y="183" text-anchor="middle" font-size="11" fill="#222">提携戦略 など</text>

  <!-- cell C: S×T -->
  <rect x="88" y="201" width="152" height="103" fill="#fff3cd" stroke="#d4a017"/>
  <text x="164" y="233" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">パターンC</text>
  <text x="164" y="253" text-anchor="middle" font-size="11" fill="#1a3a5c">（強み × 脅威）</text>
  <text x="164" y="279" text-anchor="middle" font-size="11" fill="#222">差別化戦略 など</text>

  <!-- cell D: W×T -->
  <rect x="240" y="201" width="152" height="103" fill="#f8d7da" stroke="#b22234"/>
  <text x="316" y="233" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">パターンD</text>
  <text x="316" y="253" text-anchor="middle" font-size="11" fill="#1a3a5c">（弱み × 脅威）</text>
  <text x="316" y="279" text-anchor="middle" font-size="11" fill="#222">撤退戦略，縮小戦略 など</text>
</svg>
