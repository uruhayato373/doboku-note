<svg xmlns="http://www.w3.org/2000/svg" width="400" height="292" viewBox="0 0 400 292" style="max-width:400px;width:100%" role="img" aria-label="図1 SWOT分析の枠組み。強み(S)・弱み(W)を列、機会(O)・脅威(T)を行とする2×2マトリクス。強み×機会＝パターンA（拡大・進出戦略）、弱み×機会＝パターンB（改善・補強・提携戦略）、強み×脅威＝パターンC（差別化戦略）、弱み×脅威＝パターンD（撤退・縮小戦略）。" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
  <rect width="400" height="292" fill="#ffffff" stroke="#d7d7d7"/>
  <text x="200" y="23" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">図1　SWOT 分析の枠組み</text>

  <!-- column headers -->
  <rect x="78" y="36" width="157" height="46" fill="#f5f5f5" stroke="#2e6da4"/>
  <text x="156" y="58" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">強み（S）</text>
  <text x="156" y="75" text-anchor="middle" font-size="11" fill="#555">項目 S1，項目 S2</text>
  <rect x="235" y="36" width="157" height="46" fill="#f5f5f5" stroke="#2e6da4"/>
  <text x="313" y="58" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">弱み（W）</text>
  <text x="313" y="75" text-anchor="middle" font-size="11" fill="#555">項目 W1，項目 W2</text>

  <!-- row headers -->
  <rect x="8" y="82" width="70" height="104" fill="#f5f5f5" stroke="#2e6da4"/>
  <text x="43" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">機会（O）</text>
  <text x="43" y="146" text-anchor="middle" font-size="11" fill="#555">項目</text>
  <text x="43" y="161" text-anchor="middle" font-size="11" fill="#555">O1，O2</text>
  <rect x="8" y="186" width="70" height="104" fill="#f5f5f5" stroke="#2e6da4"/>
  <text x="43" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">脅威（T）</text>
  <text x="43" y="250" text-anchor="middle" font-size="11" fill="#555">項目</text>
  <text x="43" y="265" text-anchor="middle" font-size="11" fill="#555">T1，T2</text>

  <!-- cell A: S×O -->
  <rect x="78" y="82" width="157" height="104" fill="#d0e8d0" stroke="#3a7d44"/>
  <text x="156" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">パターンA</text>
  <text x="156" y="136" text-anchor="middle" font-size="11" fill="#1a3a5c">（強み × 機会）</text>
  <text x="156" y="161" text-anchor="middle" font-size="11" fill="#222">拡大戦略，進出戦略 など</text>

  <!-- cell B: W×O -->
  <rect x="235" y="82" width="157" height="104" fill="#fff3cd" stroke="#d4a017"/>
  <text x="313" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">パターンB</text>
  <text x="313" y="129" text-anchor="middle" font-size="11" fill="#1a3a5c">（弱み × 機会）</text>
  <text x="313" y="152" text-anchor="middle" font-size="11" fill="#222">改善戦略，補強戦略，</text>
  <text x="313" y="169" text-anchor="middle" font-size="11" fill="#222">提携戦略 など</text>

  <!-- cell C: S×T -->
  <rect x="78" y="186" width="157" height="104" fill="#fff3cd" stroke="#d4a017"/>
  <text x="156" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">パターンC</text>
  <text x="156" y="240" text-anchor="middle" font-size="11" fill="#1a3a5c">（強み × 脅威）</text>
  <text x="156" y="265" text-anchor="middle" font-size="11" fill="#222">差別化戦略 など</text>

  <!-- cell D: W×T -->
  <rect x="235" y="186" width="157" height="104" fill="#f8d7da" stroke="#b22234"/>
  <text x="313" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">パターンD</text>
  <text x="313" y="240" text-anchor="middle" font-size="11" fill="#1a3a5c">（弱み × 脅威）</text>
  <text x="313" y="265" text-anchor="middle" font-size="11" fill="#222">撤退戦略，縮小戦略 など</text>
</svg>
