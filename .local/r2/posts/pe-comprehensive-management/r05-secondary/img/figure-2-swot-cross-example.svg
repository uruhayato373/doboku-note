<svg xmlns="http://www.w3.org/2000/svg" width="400" height="424" viewBox="0 0 400 424" style="max-width:400px;width:100%" role="img" aria-label="図2 SWOT項目の組合せを選定した例。強み(S)はS1=知名度が高い・S2=従業員の技術力が高い、弱み(W)はW1=販売コストが高い・W2=人材確保が困難、機会(O)はO1=地域の急激な発展・O2=特定分野のニーズの増大、脅威(T)はT1=競合他社の出現・T2=特定素材の価格高騰。パターンAは例としてS2×O1、パターンBはW2×O2、パターンCはS1×T1、パターンDはW1・W2×T1の組合せをベースにした戦略。" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
  <rect width="400" height="424" fill="#ffffff" stroke="#d7d7d7"/>
  <text x="200" y="23" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">図2　SWOT 項目の組合せ選定例</text>

  <!-- column headers -->
  <rect x="100" y="34" width="146" height="94" fill="#ffffff" stroke="#222" stroke-width="1"/>
  <text x="173" y="54" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">強み（S）</text>
  <text x="173" y="73" text-anchor="middle" font-size="11" fill="#555">S1：（例）</text>
  <text x="173" y="88" text-anchor="middle" font-size="11" fill="#555">知名度が高い</text>
  <text x="173" y="107" text-anchor="middle" font-size="11" fill="#555">S2：（例）</text>
  <text x="173" y="122" text-anchor="middle" font-size="11" fill="#555">従業員の技術力が高い</text>
  <rect x="246" y="34" width="146" height="94" fill="#ffffff" stroke="#222" stroke-width="1"/>
  <text x="319" y="54" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">弱み（W）</text>
  <text x="319" y="73" text-anchor="middle" font-size="11" fill="#555">W1：（例）</text>
  <text x="319" y="88" text-anchor="middle" font-size="11" fill="#555">販売コストが高い</text>
  <text x="319" y="107" text-anchor="middle" font-size="11" fill="#555">W2：（例）</text>
  <text x="319" y="122" text-anchor="middle" font-size="11" fill="#555">人材確保が困難</text>

  <!-- row header O -->
  <rect x="8" y="128" width="92" height="148" fill="#ffffff" stroke="#222" stroke-width="1"/>
  <text x="54" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">機会（O）</text>
  <text x="54" y="182" text-anchor="middle" font-size="11" fill="#555">O1：（例）</text>
  <text x="54" y="197" text-anchor="middle" font-size="11" fill="#555">地域の急激な発展</text>
  <text x="54" y="222" text-anchor="middle" font-size="11" fill="#555">O2：（例）</text>
  <text x="54" y="237" text-anchor="middle" font-size="11" fill="#555">特定分野の</text>
  <text x="54" y="252" text-anchor="middle" font-size="11" fill="#555">ニーズの増大</text>

  <!-- row header T -->
  <rect x="8" y="276" width="92" height="148" fill="#ffffff" stroke="#222" stroke-width="1"/>
  <text x="54" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">脅威（T）</text>
  <text x="54" y="330" text-anchor="middle" font-size="11" fill="#555">T1：（例）</text>
  <text x="54" y="345" text-anchor="middle" font-size="11" fill="#555">競合他社の出現</text>
  <text x="54" y="370" text-anchor="middle" font-size="11" fill="#555">T2：（例）</text>
  <text x="54" y="385" text-anchor="middle" font-size="11" fill="#555">特定素材の</text>
  <text x="54" y="400" text-anchor="middle" font-size="11" fill="#555">価格高騰</text>

  <!-- cell A: S×O -->
  <rect x="100" y="128" width="146" height="148" fill="#ffffff" stroke="#222" stroke-width="1"/>
  <text x="173" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">パターンA</text>
  <text x="173" y="190" text-anchor="middle" font-size="11" fill="#555">（強み × 機会）</text>
  <text x="173" y="218" text-anchor="middle" font-size="11" fill="#222">例：S2 × O1 を</text>
  <text x="173" y="236" text-anchor="middle" font-size="11" fill="#222">ベースにした戦略</text>

  <!-- cell B: W×O -->
  <rect x="246" y="128" width="146" height="148" fill="#ffffff" stroke="#222" stroke-width="1"/>
  <text x="319" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">パターンB</text>
  <text x="319" y="190" text-anchor="middle" font-size="11" fill="#555">（弱み × 機会）</text>
  <text x="319" y="218" text-anchor="middle" font-size="11" fill="#222">例：W2 × O2 を</text>
  <text x="319" y="236" text-anchor="middle" font-size="11" fill="#222">ベースにした戦略</text>

  <!-- cell C: S×T -->
  <rect x="100" y="276" width="146" height="148" fill="#ffffff" stroke="#222" stroke-width="1"/>
  <text x="173" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">パターンC</text>
  <text x="173" y="338" text-anchor="middle" font-size="11" fill="#555">（強み × 脅威）</text>
  <text x="173" y="366" text-anchor="middle" font-size="11" fill="#222">例：S1 × T1 を</text>
  <text x="173" y="384" text-anchor="middle" font-size="11" fill="#222">ベースにした戦略</text>

  <!-- cell D: W×T -->
  <rect x="246" y="276" width="146" height="148" fill="#ffffff" stroke="#222" stroke-width="1"/>
  <text x="319" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">パターンD</text>
  <text x="319" y="338" text-anchor="middle" font-size="11" fill="#555">（弱み × 脅威）</text>
  <text x="319" y="366" text-anchor="middle" font-size="11" fill="#222">例：W1・W2 × T1 を</text>
  <text x="319" y="384" text-anchor="middle" font-size="11" fill="#222">ベースにした戦略</text>
</svg>
