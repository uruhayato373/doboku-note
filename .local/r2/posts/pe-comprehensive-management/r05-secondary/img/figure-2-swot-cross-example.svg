<svg xmlns="http://www.w3.org/2000/svg" width="560" height="396" viewBox="0 0 560 396" style="max-width:560px;width:100%" role="img" aria-label="図2 SWOT項目の組合せを選定した例。強み(S)はS1=知名度が高い・S2=従業員の技術力が高い、弱み(W)はW1=販売コストが高い・W2=人材確保が困難、機会(O)はO1=地域の急激な発展・O2=特定分野のニーズの増大、脅威(T)はT1=競合他社の出現・T2=特定素材の価格高騰。パターンAは例としてS2×O1、パターンBはW2×O2、パターンCはS1×T1、パターンDはW1・W2×T1の組合せをベースにした戦略を示す。" font-family='Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif'>
  <rect width="560" height="396" fill="#ffffff" stroke="#d7d7d7"/>
  <text x="280" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">図2　SWOT 項目の組合せを選定した例</text>

  <!-- column headers -->
  <rect x="136" y="36" width="212" height="60" fill="#f5f5f5" stroke="#2e6da4"/>
  <text x="242" y="56" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">強み（S）</text>
  <text x="242" y="74" text-anchor="middle" font-size="9.5" fill="#555">S1：（例）知名度が高い</text>
  <text x="242" y="89" text-anchor="middle" font-size="9.5" fill="#555">S2：（例）従業員の技術力が高い</text>
  <rect x="348" y="36" width="212" height="60" fill="#f5f5f5" stroke="#2e6da4"/>
  <text x="454" y="56" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">弱み（W）</text>
  <text x="454" y="74" text-anchor="middle" font-size="9.5" fill="#555">W1：（例）販売コストが高い</text>
  <text x="454" y="89" text-anchor="middle" font-size="9.5" fill="#555">W2：（例）人材確保が困難</text>

  <!-- row headers -->
  <rect x="12" y="96" width="124" height="150" fill="#f5f5f5" stroke="#2e6da4"/>
  <text x="74" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">機会（O）</text>
  <text x="74" y="154" text-anchor="middle" font-size="9" fill="#555">O1：（例）地域の</text>
  <text x="74" y="166" text-anchor="middle" font-size="9" fill="#555">急激な発展</text>
  <text x="74" y="192" text-anchor="middle" font-size="9" fill="#555">O2：（例）特定分野</text>
  <text x="74" y="204" text-anchor="middle" font-size="9" fill="#555">のニーズの増大</text>
  <rect x="12" y="246" width="124" height="150" fill="#f5f5f5" stroke="#2e6da4"/>
  <text x="74" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">脅威（T）</text>
  <text x="74" y="304" text-anchor="middle" font-size="9" fill="#555">T1：（例）競合他社</text>
  <text x="74" y="316" text-anchor="middle" font-size="9" fill="#555">の出現</text>
  <text x="74" y="342" text-anchor="middle" font-size="9" fill="#555">T2：（例）特定素材</text>
  <text x="74" y="354" text-anchor="middle" font-size="9" fill="#555">の価格高騰</text>

  <!-- cell A: S×O -->
  <rect x="136" y="96" width="212" height="150" fill="#d0e8d0" stroke="#3a7d44"/>
  <text x="242" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e4d27">パターンA（強み × 機会）</text>
  <text x="242" y="180" text-anchor="middle" font-size="11" fill="#222">例：S2 × O1 を</text>
  <text x="242" y="198" text-anchor="middle" font-size="11" fill="#222">ベースにした戦略</text>

  <!-- cell B: W×O -->
  <rect x="348" y="96" width="212" height="150" fill="#fff3cd" stroke="#d4a017"/>
  <text x="454" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b5015">パターンB（弱み × 機会）</text>
  <text x="454" y="180" text-anchor="middle" font-size="11" fill="#222">例：W2 × O2 を</text>
  <text x="454" y="198" text-anchor="middle" font-size="11" fill="#222">ベースにした戦略</text>

  <!-- cell C: S×T -->
  <rect x="136" y="246" width="212" height="150" fill="#fff3cd" stroke="#d4a017"/>
  <text x="242" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b5015">パターンC（強み × 脅威）</text>
  <text x="242" y="330" text-anchor="middle" font-size="11" fill="#222">例：S1 × T1 を</text>
  <text x="242" y="348" text-anchor="middle" font-size="11" fill="#222">ベースにした戦略</text>

  <!-- cell D: W×T -->
  <rect x="348" y="246" width="212" height="150" fill="#f8d7da" stroke="#b22234"/>
  <text x="454" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a1620">パターンD（弱み × 脅威）</text>
  <text x="454" y="330" text-anchor="middle" font-size="11" fill="#222">例：W1・W2 × T1 を</text>
  <text x="454" y="348" text-anchor="middle" font-size="11" fill="#222">ベースにした戦略</text>
</svg>
