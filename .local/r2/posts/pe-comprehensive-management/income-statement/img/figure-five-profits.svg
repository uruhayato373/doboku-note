<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="損益計算書の5つの利益の段階：売上高から売上原価・販管費・営業外損益・特別損益・法人税等を順に加減して、売上総利益・営業利益・経常利益・税引前当期純利益・当期純利益を算出する流れ" font-family='Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif'>
  <rect width="400" height="500" fill="#ffffff" stroke="#d7d7d7"/>

  <text x="200" y="26" text-anchor="middle" font-size="11" fill="#555">売上高から段階的に費用を引いて算出する</text>

  <!-- box1 売上高 -->
  <rect x="12" y="56" width="376" height="36" fill="#f5f5f5" stroke="#d7d7d7"/>
  <text x="24" y="79" font-size="13" font-weight="bold" fill="#222">売上高</text>
  <text x="380" y="79" text-anchor="end" font-size="11" fill="#555">商品・サービスの売上（出発点）</text>
  <!-- op1 -->
  <rect x="100" y="95" width="200" height="20" rx="10" fill="#f5f5f5" stroke="#d7d7d7"/>
  <text x="200" y="109" text-anchor="middle" font-size="11" fill="#222"><tspan fill="#b22234">−</tspan> 売上原価</text>

  <!-- box2 売上総利益 -->
  <rect x="12" y="120" width="376" height="36" fill="#e8f0fe" stroke="#2e6da4"/>
  <text x="24" y="143" font-size="13" font-weight="bold" fill="#1a3a5c">売上総利益（粗利）</text>
  <text x="380" y="143" text-anchor="end" font-size="11" fill="#555">本業の利幅</text>
  <!-- op2 -->
  <rect x="100" y="159" width="200" height="20" rx="10" fill="#f5f5f5" stroke="#d7d7d7"/>
  <text x="200" y="173" text-anchor="middle" font-size="11" fill="#222"><tspan fill="#b22234">−</tspan> 販売費及び一般管理費</text>

  <!-- box3 営業利益 -->
  <rect x="12" y="184" width="376" height="36" fill="#e8f0fe" stroke="#2e6da4"/>
  <text x="24" y="207" font-size="13" font-weight="bold" fill="#1a3a5c">営業利益</text>
  <text x="380" y="207" text-anchor="end" font-size="11" fill="#555">本業の収益力</text>
  <!-- op3 -->
  <rect x="92" y="223" width="216" height="20" rx="10" fill="#f5f5f5" stroke="#d7d7d7"/>
  <text x="200" y="237" text-anchor="middle" font-size="11" fill="#222"><tspan fill="#3a7d44">＋</tspan>営業外収益　<tspan fill="#b22234">−</tspan>営業外費用</text>

  <!-- box4 経常利益 -->
  <rect x="12" y="248" width="376" height="36" fill="#e8f0fe" stroke="#2e6da4"/>
  <text x="24" y="271" font-size="13" font-weight="bold" fill="#1a3a5c">経常利益</text>
  <text x="380" y="271" text-anchor="end" font-size="11" fill="#555">財務を含む通常の収益力</text>
  <!-- op4 -->
  <rect x="92" y="287" width="216" height="20" rx="10" fill="#f5f5f5" stroke="#d7d7d7"/>
  <text x="200" y="301" text-anchor="middle" font-size="11" fill="#222"><tspan fill="#3a7d44">＋</tspan>特別利益　<tspan fill="#b22234">−</tspan>特別損失</text>

  <!-- box5 税引前当期純利益 -->
  <rect x="12" y="312" width="376" height="36" fill="#e8f0fe" stroke="#2e6da4"/>
  <text x="24" y="335" font-size="13" font-weight="bold" fill="#1a3a5c">税引前当期純利益</text>
  <text x="380" y="335" text-anchor="end" font-size="11" fill="#555">臨時損益まで反映</text>
  <!-- op5 -->
  <rect x="100" y="351" width="200" height="20" rx="10" fill="#f5f5f5" stroke="#d7d7d7"/>
  <text x="200" y="365" text-anchor="middle" font-size="11" fill="#222"><tspan fill="#b22234">−</tspan> 法人税等</text>

  <!-- box6 当期純利益 -->
  <rect x="12" y="376" width="376" height="36" fill="#d0e8d0" stroke="#3a7d44"/>
  <text x="24" y="399" font-size="13" font-weight="bold" fill="#1a3a5c">当期純利益</text>
  <text x="380" y="399" text-anchor="end" font-size="11" fill="#555">株主に残る最終利益</text>

  <!-- summary -->
  <rect x="12" y="424" width="376" height="58" fill="#f5f5f5" stroke="#d7d7d7" rx="2"/>
  <text x="200" y="447" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">段階ごとに「何の利益か」が変わる</text>
  <text x="200" y="468" text-anchor="middle" font-size="11" fill="#555">営業＝本業／経常＝財務含む通常／当期純＝最終</text>
</svg>
