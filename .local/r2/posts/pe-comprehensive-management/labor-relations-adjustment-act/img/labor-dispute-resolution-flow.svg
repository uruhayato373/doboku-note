  <svg width="520" height="310" viewBox="0 0 520 310" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="11" style="max-width:520px;width:100%">
    <!-- ===あっせん=== -->
    <text x="88" y="20" text-anchor="middle" fill="#fff" font-weight="bold" font-size="13"/>
    <rect x="10" y="8" width="156" height="24" rx="4" fill="#444"/>
    <text x="88" y="24" text-anchor="middle" fill="white" font-weight="bold" font-size="13">あっせん</text>

    <!-- あっせん 開始 -->
    <rect x="10" y="40" width="156" height="46" rx="3" fill="#dde" stroke="#99b"/>
    <text x="88" y="55" text-anchor="middle" fill="#222" font-size="10" font-weight="bold">開　始</text>
    <text x="88" y="67" text-anchor="middle" fill="#333" font-size="9">①労使いずれかの申請</text>
    <text x="88" y="79" text-anchor="middle" fill="#333" font-size="9">②労使双方からの申請</text>

    <line x1="88" y1="86" x2="88" y2="100" stroke="#555" stroke-width="1.5" marker-end="url(#arrL)"/>

    <!-- あっせん 調査 -->
    <rect x="10" y="100" width="156" height="40" rx="3" fill="#cce" stroke="#99b"/>
    <text x="88" y="115" text-anchor="middle" fill="#222" font-size="10" font-weight="bold">調　査</text>
    <text x="88" y="128" text-anchor="middle" fill="#333" font-size="9">事情や経緯などの実情を調査する</text>

    <line x1="88" y1="140" x2="88" y2="154" stroke="#555" stroke-width="1.5" marker-end="url(#arrL)"/>

    <!-- あっせん 調整 -->
    <rect x="10" y="154" width="156" height="50" rx="3" fill="#bbd" stroke="#99b"/>
    <text x="88" y="169" text-anchor="middle" fill="#222" font-size="10" font-weight="bold">調整の方法</text>
    <text x="88" y="181" text-anchor="middle" fill="#333" font-size="9">あっせん員が、あっせん案を</text>
    <text x="88" y="192" text-anchor="middle" fill="#333" font-size="9">提示し、自主的解決をあっせん</text>

    <line x1="88" y1="204" x2="88" y2="218" stroke="#555" stroke-width="1.5" marker-end="url(#arrL)"/>

    <!-- あっせん 終結 -->
    <rect x="10" y="218" width="156" height="30" rx="3" fill="#aac" stroke="#99b"/>
    <text x="88" y="237" text-anchor="middle" fill="#222" font-size="10">終結：解決・打切り・取下げ</text>

    <!-- ===調停=== -->
    <rect x="182" y="8" width="156" height="24" rx="4" fill="#555"/>
    <text x="260" y="24" text-anchor="middle" fill="white" font-weight="bold" font-size="13">調　停</text>

    <!-- 調停 開始 -->
    <rect x="182" y="40" width="156" height="56" rx="3" fill="#eed" stroke="#bb9"/>
    <text x="260" y="55" text-anchor="middle" fill="#222" font-size="10" font-weight="bold">開　始</text>
    <text x="260" y="67" text-anchor="middle" fill="#333" font-size="9">①労使いずれかの申請</text>
    <text x="260" y="79" text-anchor="middle" fill="#333" font-size="9">②労使双方からの申請</text>
    <text x="260" y="91" text-anchor="middle" fill="#333" font-size="9">・公益委員にかかわる場合</text>

    <line x1="260" y1="96" x2="260" y2="110" stroke="#555" stroke-width="1.5" marker-end="url(#arrL)"/>

    <!-- 調停 調査 -->
    <rect x="182" y="110" width="156" height="40" rx="3" fill="#ddc" stroke="#bb9"/>
    <text x="260" y="125" text-anchor="middle" fill="#222" font-size="10" font-weight="bold">調　査</text>
    <text x="260" y="138" text-anchor="middle" fill="#333" font-size="9">非常勤職員が実情を調査</text>

    <line x1="260" y1="150" x2="260" y2="164" stroke="#555" stroke-width="1.5" marker-end="url(#arrL)"/>

    <!-- 調停 調停委員会 -->
    <rect x="182" y="164" width="156" height="50" rx="3" fill="#ccb" stroke="#bb9"/>
    <text x="260" y="179" text-anchor="middle" fill="#222" font-size="10" font-weight="bold">調停委員会</text>
    <text x="260" y="191" text-anchor="middle" fill="#333" font-size="9">（労・公・使 各1名）</text>
    <text x="260" y="203" text-anchor="middle" fill="#333" font-size="9">両者から意見を聴取できる</text>

    <line x1="260" y1="214" x2="260" y2="228" stroke="#555" stroke-width="1.5" marker-end="url(#arrL)"/>

    <!-- 調停 終結 -->
    <rect x="182" y="228" width="156" height="30" rx="3" fill="#bba" stroke="#bb9"/>
    <text x="260" y="247" text-anchor="middle" fill="#222" font-size="10">終結：解決・打切り・取下げ</text>

    <!-- ===仲裁=== -->
    <rect x="354" y="8" width="156" height="24" rx="4" fill="#666"/>
    <text x="432" y="24" text-anchor="middle" fill="white" font-weight="bold" font-size="13">仲　裁</text>

    <!-- 仲裁 開始 -->
    <rect x="354" y="40" width="156" height="56" rx="3" fill="#edd" stroke="#b99"/>
    <text x="432" y="55" text-anchor="middle" fill="#222" font-size="10" font-weight="bold">開　始</text>
    <text x="432" y="67" text-anchor="middle" fill="#333" font-size="9">①労使双方からの申請</text>
    <text x="432" y="79" text-anchor="middle" fill="#333" font-size="9">②労働協約に定めのある場合</text>

    <line x1="432" y1="96" x2="432" y2="110" stroke="#555" stroke-width="1.5" marker-end="url(#arrL)"/>

    <!-- 仲裁 審問 -->
    <rect x="354" y="110" width="156" height="50" rx="3" fill="#dcc" stroke="#b99"/>
    <text x="432" y="125" text-anchor="middle" fill="#222" font-size="10" font-weight="bold">審　問</text>
    <text x="432" y="137" text-anchor="middle" fill="#333" font-size="9">仲裁委員会（公益委員3人が</text>
    <text x="432" y="149" text-anchor="middle" fill="#333" font-size="9">両者から意見を聴取）</text>

    <line x1="432" y1="160" x2="432" y2="174" stroke="#555" stroke-width="1.5" marker-end="url(#arrL)"/>

    <!-- 仲裁 仲裁裁定 -->
    <rect x="354" y="174" width="156" height="40" rx="3" fill="#cbb" stroke="#b99"/>
    <text x="432" y="189" text-anchor="middle" fill="#222" font-size="10" font-weight="bold">仲裁裁定</text>
    <text x="432" y="201" text-anchor="middle" fill="#333" font-size="9">受け入れなければならない</text>

    <line x1="432" y1="214" x2="432" y2="228" stroke="#555" stroke-width="1.5" marker-end="url(#arrL)"/>

    <!-- 仲裁 終結 -->
    <rect x="354" y="228" width="156" height="30" rx="3" fill="#baa" stroke="#b99"/>
    <text x="432" y="247" text-anchor="middle" fill="#222" font-size="10">終結：解決・打切り・取下げ</text>

    <!-- 注記 -->
    <text x="260" y="288" text-anchor="middle" fill="#666" font-size="10">出典：広島県労働委員会ホームページ</text>

    <!-- defs -->
    <defs>
      <marker id="arrL" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5 z" fill="#555"/></marker>
    </defs>
  </svg>