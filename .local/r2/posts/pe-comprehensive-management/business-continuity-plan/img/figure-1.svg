<svg viewBox="0 0 480 430" xmlns="http://www.w3.org/2000/svg" style="max-width:480px;width:100%" role="img" aria-label="従来の防災活動とBCM（事業継続マネジメント）の比較。目的・対象・主体・時間軸の4観点で対比した2カラム表">
  <!-- viewBox幅480: 観点列+2カラム比較で400では各セルが狭く文字がはみ出るため例外 -->
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-title  { font-size: 14px; font-weight: bold; fill: #1a3a5c; }
      .t-head   { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-label  { font-size: 12px; font-weight: bold; fill: #8a8a8a; }
      .t-cell   { font-size: 12px; fill: #333; }
      .t-plus   { font-size: 12px; font-weight: bold; fill: #3a7d44; }
      .t-note   { font-size: 11px; fill: #555; }
      .box-surface  { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1; }
      .box-left     { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1; }
      .box-brand    { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-positive { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .head-left    { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1; }
      .head-brand   { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 2; }
    </style>
  </defs>

  <!-- タイトル -->
  <text class="t-title" x="240" y="22" text-anchor="middle">防災活動 vs 事業継続マネジメント（BCM）</text>

  <!-- 列定義: ラベルx=10 w=76, 左x=90 w=176, 右x=270 w=202 -->

  <!-- ヘッダ行 h=40 -->
  <rect class="box-surface" x="10" y="32" width="76" height="40" rx="4"/>
  <text class="t-label" x="48" y="57" text-anchor="middle">観点</text>

  <rect class="head-left" x="90" y="32" width="176" height="40" rx="4"/>
  <text class="t-head" x="178" y="57" text-anchor="middle">従来の防災活動</text>

  <rect class="head-brand" x="270" y="32" width="202" height="40" rx="4"/>
  <text class="t-head" x="371" y="52" text-anchor="middle">事業継続マネジメント</text>
  <text class="t-note" x="371" y="67" text-anchor="middle">（BCM）</text>

  <!-- 行1: 目的 h=72 -->
  <rect class="box-surface" x="10" y="76" width="76" height="72" rx="4"/>
  <text class="t-label" x="48" y="116" text-anchor="middle">目的</text>

  <rect class="box-left" x="90" y="76" width="176" height="72" rx="4"/>
  <text class="t-cell" x="178" y="106" text-anchor="middle">人命・物的被害の</text>
  <text class="t-cell" x="178" y="124" text-anchor="middle">軽減・最小化</text>

  <rect class="box-positive" x="270" y="76" width="202" height="72" rx="4"/>
  <text class="t-plus" x="371" y="100" text-anchor="middle">重要事業の継続・</text>
  <text class="t-plus" x="371" y="118" text-anchor="middle">早期復旧の確保</text>
  <text class="t-note" x="371" y="136" text-anchor="middle">（経営戦略レベル）</text>

  <!-- 行2: 対象 h=72 -->
  <rect class="box-surface" x="10" y="152" width="76" height="72" rx="4"/>
  <text class="t-label" x="48" y="192" text-anchor="middle">対象</text>

  <rect class="box-left" x="90" y="152" width="176" height="72" rx="4"/>
  <text class="t-cell" x="178" y="182" text-anchor="middle">施設・設備・人命</text>
  <text class="t-note" x="178" y="200" text-anchor="middle">（物理的被害への対処）</text>

  <rect class="box-brand" x="270" y="152" width="202" height="72" rx="4"/>
  <text class="t-cell" x="371" y="178" text-anchor="middle">重要業務プロセス・</text>
  <text class="t-cell" x="371" y="196" text-anchor="middle">サプライチェーン等</text>

  <!-- 行3: 主体 h=72 -->
  <rect class="box-surface" x="10" y="228" width="76" height="72" rx="4"/>
  <text class="t-label" x="48" y="268" text-anchor="middle">主体</text>

  <rect class="box-left" x="90" y="228" width="176" height="72" rx="4"/>
  <text class="t-cell" x="178" y="258" text-anchor="middle">防災担当部門・</text>
  <text class="t-cell" x="178" y="276" text-anchor="middle">現場担当者</text>

  <rect class="box-positive" x="270" y="228" width="202" height="72" rx="4"/>
  <text class="t-plus" x="371" y="256" text-anchor="middle">経営トップが主導</text>
  <text class="t-note" x="371" y="276" text-anchor="middle">全社横断・ISO 22301対応</text>

  <!-- 行4: 時間軸 h=72 -->
  <rect class="box-surface" x="10" y="304" width="76" height="72" rx="4"/>
  <text class="t-label" x="48" y="334" text-anchor="middle">時間軸</text>
  <text class="t-label" x="48" y="350" text-anchor="middle">・重点</text>

  <rect class="box-left" x="90" y="304" width="176" height="72" rx="4"/>
  <text class="t-cell" x="178" y="330" text-anchor="middle">発災後の応急対応・</text>
  <text class="t-cell" x="178" y="348" text-anchor="middle">復旧に重点</text>

  <rect class="box-brand" x="270" y="304" width="202" height="72" rx="4"/>
  <text class="t-cell" x="371" y="328" text-anchor="middle">平常時の計画・訓練から</text>
  <text class="t-cell" x="371" y="346" text-anchor="middle">復旧まで一貫（PDCA）</text>

  <!-- フッター -->
  <text class="t-note" x="240" y="398" text-anchor="middle">BCM = BCP策定・維持・更新・教育訓練・継続改善を含む経営レベルの活動</text>
  <text class="t-note" x="240" y="414" text-anchor="middle">防災活動を内包しつつ、事業継続の視点を経営戦略に組み込む</text>
</svg>
