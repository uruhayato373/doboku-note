<svg width="380" height="430" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 430" role="img" aria-label="日常業務での5管理マッピングフロー" style="max-width:380px;width:100%">
  <defs>
    <marker id="arrow1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#2e6da4"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Hiragino Sans", "Yu Gothic", sans-serif; fill: #1a3a5c; }
  </style>

  <!-- Step 1 -->
  <text x="15" y="18" font-size="11" fill="#8a8a8a">STEP 1</text>
  <rect x="15" y="25" width="350" height="70" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="190" y="55" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a3a5c">日常業務の課題</text>
  <text x="190" y="78" text-anchor="middle" font-size="13" fill="#555">橋梁補修、施工計画、DX推進 など</text>

  <!-- Arrow 1→2 -->
  <line x1="190" y1="95" x2="190" y2="115" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow1)"/>

  <!-- Step 2 -->
  <text x="15" y="128" font-size="11" fill="#8a8a8a">STEP 2</text>
  <rect x="15" y="135" width="350" height="70" rx="8" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text x="190" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a3a5c">キーワード集の用語に置き換え</text>
  <text x="190" y="188" text-anchor="middle" font-size="13" fill="#555">「この課題は何管理に該当するか？」</text>

  <!-- Arrow 2→3 -->
  <line x1="190" y1="205" x2="190" y2="225" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow1)"/>

  <!-- Step 3 -->
  <text x="15" y="238" font-size="11" fill="#8a8a8a">STEP 3</text>
  <rect x="15" y="245" width="350" height="70" rx="8" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
  <text x="190" y="275" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a3a5c">トレードオフを特定</text>
  <text x="190" y="298" text-anchor="middle" font-size="13" fill="#555">管理間の対立構造を発見する</text>

  <!-- Arrow 3→4 -->
  <line x1="190" y1="315" x2="190" y2="335" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow1)"/>

  <!-- Step 4 -->
  <text x="15" y="348" font-size="11" fill="#8a8a8a">STEP 4</text>
  <rect x="15" y="355" width="350" height="70" rx="8" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
  <text x="190" y="385" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a3a5c">俯瞰的な解決策</text>
  <text x="190" y="408" text-anchor="middle" font-size="13" fill="#555">第三の管理を活用し全体最適を導く</text>

</svg>
