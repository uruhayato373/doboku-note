<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="4フェーズ学習計画">
  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#2e6da4"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Hiragino Sans", "Yu Gothic", sans-serif; fill: #1f2937; }
  </style>

  <!-- Phase 1 -->
  <rect x="10" y="30" width="170" height="260" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <rect x="10" y="30" width="170" height="36" rx="8" fill="#2e6da4"/>
  <text x="95" y="53" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">フェーズ1</text>
  <text x="95" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">前提知識習得</text>
  <text x="95" y="105" text-anchor="middle" font-size="11" fill="#888">1〜3月</text>
  <line x1="30" y1="118" x2="160" y2="118" stroke="#ccc" stroke-width="0.5"/>
  <text x="25" y="140" font-size="11" fill="#555">・キーワード集の通読</text>
  <text x="25" y="160" font-size="11" fill="#555">・過去問5年分を解く</text>
  <text x="25" y="180" font-size="11" fill="#555">　（傾向把握が目的）</text>
  <line x1="30" y1="198" x2="160" y2="198" stroke="#ccc" stroke-width="0.5"/>
  <text x="95" y="218" text-anchor="middle" font-size="10" fill="#2e6da4" font-weight="bold">到達目標</text>
  <text x="25" y="238" font-size="11" fill="#555">総監の全体像を</text>
  <text x="25" y="256" font-size="11" fill="#555">把握する</text>

  <!-- Arrow 1→2 -->
  <line x1="180" y1="160" x2="195" y2="160" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Phase 2 -->
  <rect x="197" y="30" width="170" height="260" rx="8" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <rect x="197" y="30" width="170" height="36" rx="8" fill="#d4a017"/>
  <text x="282" y="53" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">フェーズ2</text>
  <text x="282" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">筆記試験対策</text>
  <text x="282" y="105" text-anchor="middle" font-size="11" fill="#888">4〜6月</text>
  <line x1="217" y1="118" x2="347" y2="118" stroke="#ccc" stroke-width="0.5"/>
  <text x="212" y="140" font-size="11" fill="#555">・受験申込書の作成</text>
  <text x="212" y="160" font-size="11" fill="#555">・択一式の分野別演習</text>
  <text x="212" y="180" font-size="11" fill="#555">・記述式の骨子練習</text>
  <line x1="217" y1="198" x2="347" y2="198" stroke="#ccc" stroke-width="0.5"/>
  <text x="282" y="218" text-anchor="middle" font-size="10" fill="#d4a017" font-weight="bold">到達目標</text>
  <text x="212" y="238" font-size="11" fill="#555">択一60%・記述の</text>
  <text x="212" y="256" font-size="11" fill="#555">型を身につける</text>

  <!-- Arrow 2→3 -->
  <line x1="367" y1="160" x2="382" y2="160" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Phase 3 -->
  <rect x="384" y="30" width="170" height="260" rx="8" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
  <rect x="384" y="30" width="170" height="36" rx="8" fill="#3a7d44"/>
  <text x="469" y="53" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">フェーズ3</text>
  <text x="469" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">最終対策</text>
  <text x="469" y="105" text-anchor="middle" font-size="11" fill="#888">6〜7月</text>
  <line x1="404" y1="118" x2="534" y2="118" stroke="#ccc" stroke-width="0.5"/>
  <text x="399" y="140" font-size="11" fill="#555">・模擬試験で時間配分</text>
  <text x="399" y="160" font-size="11" fill="#555">・弱点分野の補強</text>
  <text x="399" y="180" font-size="11" fill="#555">・申込書を再確認</text>
  <line x1="404" y1="198" x2="534" y2="198" stroke="#ccc" stroke-width="0.5"/>
  <text x="469" y="218" text-anchor="middle" font-size="10" fill="#3a7d44" font-weight="bold">到達目標</text>
  <text x="399" y="238" font-size="11" fill="#555">本番と同じ条件で</text>
  <text x="399" y="256" font-size="11" fill="#555">合格水準に達する</text>

  <!-- Arrow 3→4 -->
  <line x1="554" y1="160" x2="569" y2="160" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Phase 4 -->
  <rect x="571" y="30" width="175" height="260" rx="8" fill="#f8d7da" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="571" y="30" width="175" height="36" rx="8" fill="#c0392b"/>
  <text x="658" y="53" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">フェーズ4</text>
  <text x="658" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">口頭試験対策</text>
  <text x="658" y="105" text-anchor="middle" font-size="11" fill="#888">10〜12月</text>
  <line x1="591" y1="118" x2="726" y2="118" stroke="#ccc" stroke-width="0.5"/>
  <text x="586" y="140" font-size="11" fill="#555">・業務経歴の総監視点</text>
  <text x="586" y="160" font-size="11" fill="#555">　での整理</text>
  <text x="586" y="180" font-size="11" fill="#555">・口頭試験の模擬練習</text>
  <line x1="591" y1="198" x2="726" y2="198" stroke="#ccc" stroke-width="0.5"/>
  <text x="658" y="218" text-anchor="middle" font-size="10" fill="#c0392b" font-weight="bold">到達目標</text>
  <text x="586" y="238" font-size="11" fill="#555">2〜3分で経歴を</text>
  <text x="586" y="256" font-size="11" fill="#555">総監視点で説明できる</text>
</svg>
