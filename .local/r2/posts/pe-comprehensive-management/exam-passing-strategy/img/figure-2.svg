<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 920" role="img" aria-label="4フェーズ学習計画">
  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#2e6da4"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Hiragino Sans", "Yu Gothic", sans-serif; fill: #1f2937; }
  </style>

  <!-- Phase 1 -->
  <rect x="15" y="10" width="350" height="190" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <rect x="15" y="10" width="350" height="36" rx="8" fill="#2e6da4"/>
  <text x="190" y="33" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">フェーズ1: 前提知識習得</text>
  <text x="190" y="68" text-anchor="middle" font-size="13" fill="#888">1〜3月</text>
  <line x1="35" y1="80" x2="345" y2="80" stroke="#ccc" stroke-width="1"/>
  <text x="30" y="100" font-size="13" fill="#555">・キーワード集の通読</text>
  <text x="30" y="120" font-size="13" fill="#555">・過去問5年分を解く（傾向把握が目的）</text>
  <line x1="35" y1="138" x2="345" y2="138" stroke="#ccc" stroke-width="1"/>
  <text x="190" y="158" text-anchor="middle" font-size="11" fill="#2e6da4" font-weight="bold">到達目標</text>
  <text x="190" y="178" text-anchor="middle" font-size="13" fill="#555">総監の全体像を把握する</text>

  <!-- Arrow -->
  <line x1="190" y1="200" x2="190" y2="220" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Phase 2 -->
  <rect x="15" y="222" width="350" height="190" rx="8" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <rect x="15" y="222" width="350" height="36" rx="8" fill="#d4a017"/>
  <text x="190" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">フェーズ2: 筆記試験対策</text>
  <text x="190" y="280" text-anchor="middle" font-size="13" fill="#888">4〜6月</text>
  <line x1="35" y1="292" x2="345" y2="292" stroke="#ccc" stroke-width="1"/>
  <text x="30" y="312" font-size="13" fill="#555">・受験申込書の作成</text>
  <text x="30" y="332" font-size="13" fill="#555">・択一式の分野別演習</text>
  <text x="30" y="352" font-size="13" fill="#555">・記述式の骨子練習</text>
  <line x1="35" y1="366" x2="345" y2="366" stroke="#ccc" stroke-width="1"/>
  <text x="190" y="386" text-anchor="middle" font-size="11" fill="#d4a017" font-weight="bold">到達目標</text>
  <text x="190" y="404" text-anchor="middle" font-size="13" fill="#555">択一60%・記述の型を身につける</text>

  <!-- Arrow -->
  <line x1="190" y1="412" x2="190" y2="432" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Phase 3 -->
  <rect x="15" y="434" width="350" height="190" rx="8" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
  <rect x="15" y="434" width="350" height="36" rx="8" fill="#3a7d44"/>
  <text x="190" y="457" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">フェーズ3: 最終対策</text>
  <text x="190" y="492" text-anchor="middle" font-size="13" fill="#888">6〜7月</text>
  <line x1="35" y1="504" x2="345" y2="504" stroke="#ccc" stroke-width="1"/>
  <text x="30" y="524" font-size="13" fill="#555">・模擬試験で時間配分を確認</text>
  <text x="30" y="544" font-size="13" fill="#555">・弱点分野の補強</text>
  <text x="30" y="564" font-size="13" fill="#555">・申込書を再確認（口頭試験に備える）</text>
  <line x1="35" y1="578" x2="345" y2="578" stroke="#ccc" stroke-width="1"/>
  <text x="190" y="598" text-anchor="middle" font-size="11" fill="#3a7d44" font-weight="bold">到達目標</text>
  <text x="190" y="616" text-anchor="middle" font-size="13" fill="#555">本番と同じ条件で合格水準に達する</text>

  <!-- Arrow -->
  <line x1="190" y1="624" x2="190" y2="644" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Phase 4 -->
  <rect x="15" y="646" width="350" height="210" rx="8" fill="#f8d7da" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="15" y="646" width="350" height="36" rx="8" fill="#c0392b"/>
  <text x="190" y="669" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">フェーズ4: 口頭試験対策</text>
  <text x="190" y="704" text-anchor="middle" font-size="13" fill="#888">10〜12月（筆記合格者のみ）</text>
  <line x1="35" y1="716" x2="345" y2="716" stroke="#ccc" stroke-width="1"/>
  <text x="30" y="736" font-size="13" fill="#555">・業務経歴を総監視点で整理</text>
  <text x="30" y="756" font-size="13" fill="#555">・5管理の適用事例を3〜5件準備</text>
  <text x="30" y="776" font-size="13" fill="#555">・口頭試験の模擬練習</text>
  <line x1="35" y1="794" x2="345" y2="794" stroke="#ccc" stroke-width="1"/>
  <text x="190" y="814" text-anchor="middle" font-size="11" fill="#c0392b" font-weight="bold">到達目標</text>
  <text x="190" y="834" text-anchor="middle" font-size="13" fill="#555">2〜3分で経歴を総監視点で説明できる</text>

  <!-- Bottom note -->
  <text x="190" y="895" text-anchor="middle" font-size="11" fill="#888">各フェーズの到達目標を意識し、メリハリをつけて学習する</text>
</svg>
