<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 780" role="img" aria-label="再受験対策フロー">
  <defs>
    <marker id="arrow3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#2e6da4"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Hiragino Sans", "Yu Gothic", sans-serif; fill: #1f2937; }
  </style>

  <!-- Top: 不合格要因の把握 -->
  <rect x="15" y="10" width="350" height="40" rx="8" fill="#1a3a5c"/>
  <text x="190" y="35" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">前回不合格の要因・課題の把握</text>

  <!-- Arrow down -->
  <line x1="190" y1="50" x2="190" y2="70" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <!-- Branch 1: 択一式 -->
  <rect x="15" y="72" width="350" height="36" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="190" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a3a5c">択一式が不十分</text>

  <rect x="15" y="118" width="350" height="120" rx="6" fill="#f9fafb" stroke="#ddd" stroke-width="1"/>
  <text x="30" y="142" font-size="13" fill="#555">・分野別正答率を自己採点</text>
  <text x="30" y="162" font-size="13" fill="#555">・弱点分野を特定しキーワード集を再通読</text>
  <text x="30" y="182" font-size="13" fill="#555">・計算問題の反復演習</text>
  <text x="30" y="202" font-size="13" fill="#555">・社会動向への関心を高める</text>
  <text x="30" y="226" font-size="11" fill="#888">（法改正・新技術に日常的に触れる）</text>

  <!-- Arrow down -->
  <line x1="190" y1="248" x2="190" y2="268" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <!-- Branch 2: 記述式 -->
  <rect x="15" y="270" width="350" height="36" rx="6" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text x="190" y="293" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a3a5c">記述式が不十分</text>

  <rect x="15" y="316" width="350" height="190" rx="6" fill="#f9fafb" stroke="#ddd" stroke-width="1"/>
  <text x="30" y="340" font-size="13" font-weight="bold" fill="#d4a017">B判定（惜しい不合格）</text>
  <text x="30" y="362" font-size="13" fill="#555">・トレードオフの掘り下げが浅い</text>
  <text x="30" y="382" font-size="13" fill="#555">・解決フレーム（ALARP等）の適用練習</text>
  <line x1="35" y1="398" x2="345" y2="398" stroke="#ccc" stroke-width="1"/>
  <text x="30" y="420" font-size="13" font-weight="bold" fill="#c0392b">C判定（大幅な不足）</text>
  <text x="30" y="442" font-size="13" fill="#555">・5管理フレーム自体の再習得が必要</text>
  <text x="30" y="462" font-size="13" fill="#555">・キーワード集を再通読</text>
  <text x="30" y="482" font-size="13" fill="#555">・「この課題は何管理？」のマッピング練習</text>

  <!-- Arrow down -->
  <line x1="190" y1="516" x2="190" y2="536" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <!-- Branch 3: 口頭試験 -->
  <rect x="15" y="538" width="350" height="36" rx="6" fill="#f8d7da" stroke="#c0392b" stroke-width="1.5"/>
  <text x="190" y="561" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a3a5c">口頭試験で不合格</text>

  <rect x="15" y="584" width="350" height="120" rx="6" fill="#f9fafb" stroke="#ddd" stroke-width="1"/>
  <text x="30" y="608" font-size="13" fill="#555">・業務経歴を総監視点で整備し直す</text>
  <text x="30" y="628" font-size="13" fill="#555">・5管理の適用事例を3〜5件準備</text>
  <text x="30" y="648" font-size="13" fill="#555">・模擬口頭試験で回答を磨く</text>
  <text x="30" y="668" font-size="13" fill="#555">・第三者からフィードバックを受ける</text>
  <text x="30" y="692" font-size="11" fill="#888">（想定質問への対応力を高める）</text>

  <!-- Arrow down to 合格 -->
  <line x1="190" y1="714" x2="190" y2="734" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <!-- 合格 -->
  <rect x="115" y="736" width="150" height="36" rx="8" fill="#3a7d44"/>
  <text x="190" y="759" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">合格</text>
</svg>
