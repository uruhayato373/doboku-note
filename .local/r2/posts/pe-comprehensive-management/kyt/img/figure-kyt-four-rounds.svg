<svg width="400" height="500" viewBox="0 0 400 500"
     xmlns="http://www.w3.org/2000/svg"
     style="max-width:400px;width:100%"
     role="img"
     aria-label="KYT 4 ラウンド法：現状把握・本質追究・対策樹立・目標設定の 4 段階と各ラウンドで問う質問">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-head    { font-size: 12px; font-weight: bold; fill: #1a3a5c; }   /* brand-text */
      .t-round   { font-size: 12px; font-weight: bold; fill: #222; }      /* ink-strong */
      .t-phase   { font-size: 11px; fill: #555; }                         /* ink-body */
      .t-cell    { font-size: 12px; fill: #222; }                         /* ink-strong */
      .t-cell-em { font-size: 12px; font-weight: bold; fill: #1a3a5c; }   /* brand-text */
      .head-cell { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 2.5; }   /* brand (ヘッダー強調) */
      .row-brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }   /* brand (1R-2R = 観察フェーズ) */
      .row-warn  { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }   /* warn  (3R = 計画フェーズ) */
      .row-em    { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }   /* positive (4R = 合意フェーズ) */
    </style>
  </defs>

  <!-- ヘッダー行 -->
  <rect class="head-cell" x="10" y="10" width="70"  height="28" rx="4"/>
  <text class="t-head"    x="45" y="29" text-anchor="middle">ラウンド</text>
  <rect class="head-cell" x="84" y="10" width="100" height="28" rx="4"/>
  <text class="t-head"    x="134" y="29" text-anchor="middle">手順の名称</text>
  <rect class="head-cell" x="188" y="10" width="202" height="28" rx="4"/>
  <text class="t-head"    x="289" y="29" text-anchor="middle">問う質問</text>

  <!-- 1ラウンド（観察フェーズ） -->
  <rect class="row-brand" x="10" y="42" width="70"  height="28" rx="4"/>
  <text class="t-round"   x="45" y="61" text-anchor="middle">1R</text>
  <rect class="row-brand" x="84" y="42" width="100" height="28" rx="4"/>
  <text class="t-cell"    x="134" y="61" text-anchor="middle">現状把握</text>
  <rect class="row-brand" x="188" y="42" width="202" height="28" rx="4"/>
  <text class="t-cell"    x="289" y="61" text-anchor="middle">どんな危険が潜んでいるか</text>

  <!-- 2ラウンド（観察フェーズ） -->
  <rect class="row-brand" x="10" y="74" width="70"  height="28" rx="4"/>
  <text class="t-round"   x="45" y="93" text-anchor="middle">2R</text>
  <rect class="row-brand" x="84" y="74" width="100" height="28" rx="4"/>
  <text class="t-cell"    x="134" y="93" text-anchor="middle">本質追究</text>
  <rect class="row-brand" x="188" y="74" width="202" height="28" rx="4"/>
  <text class="t-cell"    x="289" y="93" text-anchor="middle">これが危険のポイントだ</text>

  <!-- 3ラウンド（計画フェーズ） -->
  <rect class="row-warn" x="10" y="106" width="70"  height="28" rx="4"/>
  <text class="t-round"  x="45" y="125" text-anchor="middle">3R</text>
  <rect class="row-warn" x="84" y="106" width="100" height="28" rx="4"/>
  <text class="t-cell"   x="134" y="125" text-anchor="middle">対策樹立</text>
  <rect class="row-warn" x="188" y="106" width="202" height="28" rx="4"/>
  <text class="t-cell"   x="289" y="125" text-anchor="middle">あなたならどうする</text>

  <!-- 4ラウンド（合意・行動目標） -->
  <rect class="row-em"  x="10" y="138" width="70"  height="32" rx="4"/>
  <text class="t-cell-em" x="45" y="158" text-anchor="middle">4R</text>
  <rect class="row-em"  x="84" y="138" width="100" height="32" rx="4"/>
  <text class="t-cell-em" x="134" y="158" text-anchor="middle">目標設定</text>
  <rect class="row-em"  x="188" y="138" width="202" height="32" rx="4"/>
  <text class="t-cell-em" x="289" y="158" text-anchor="middle">私たちはこうする</text>

  <!-- 追加：KYTの活用方法と特徴 -->
  <rect x="10" y="190" width="380" height="54" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5" rx="6"/>
  <text x="200" y="210" text-anchor="middle" font-size="13" fill="#1a3a5c" font-weight="bold" font-family="Inter, sans-serif">KYT（危険予知トレーニング）の目的</text>
  <text x="200" y="228" text-anchor="middle" font-size="11" fill="#222" font-family="Inter, sans-serif">作業前に危険要因を先取りし、事故を未然防止</text>
  <text x="200" y="242" text-anchor="middle" font-size="11" fill="#555" font-family="Inter, sans-serif">ヒヤリハット（ハインリッヒの法則）の顕在化手段</text>

  <rect x="10" y="256" width="185" height="66" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5" rx="6"/>
  <text x="103" y="275" text-anchor="middle" font-size="11" fill="#1a3a5c" font-weight="bold" font-family="Inter, sans-serif">実施形態</text>
  <text x="103" y="291" text-anchor="middle" font-size="11" fill="#222" font-family="Inter, sans-serif">TBM-KY（ツールボックス</text>
  <text x="103" y="305" text-anchor="middle" font-size="11" fill="#222" font-family="Inter, sans-serif">ミーティング）として</text>
  <text x="103" y="319" text-anchor="middle" font-size="11" fill="#555" font-family="Inter, sans-serif">作業開始前に実施</text>

  <rect x="205" y="256" width="185" height="66" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5" rx="6"/>
  <text x="297" y="275" text-anchor="middle" font-size="11" fill="#1a3a5c" font-weight="bold" font-family="Inter, sans-serif">派生手法</text>
  <text x="297" y="291" text-anchor="middle" font-size="11" fill="#222" font-family="Inter, sans-serif">指差呼称・ゼロ指差</text>
  <text x="297" y="307" text-anchor="middle" font-size="11" fill="#222" font-family="Inter, sans-serif">確認・ながら KYT</text>
  <text x="297" y="321" text-anchor="middle" font-size="11" fill="#555" font-family="Inter, sans-serif">一人 KYT（個人版）</text>

  <!-- 総監・安全管理との関連 -->
  <rect x="10" y="334" width="380" height="40" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5" rx="6"/>
  <text x="200" y="352" text-anchor="middle" font-size="11" fill="#1a3a5c" font-weight="bold" font-family="Inter, sans-serif">安全管理の実践ツール：OSHMS との連携</text>
  <text x="200" y="368" text-anchor="middle" font-size="11" fill="#555" font-family="Inter, sans-serif">リスクアセスメント（RA）の補完として現場第一線で活用</text>

  <rect x="10" y="386" width="380" height="40" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5" rx="6"/>
  <text x="200" y="404" text-anchor="middle" font-size="11" fill="#1a3a5c" font-weight="bold" font-family="Inter, sans-serif">4E 対策における位置づけ</text>
  <text x="200" y="420" text-anchor="middle" font-size="11" fill="#555" font-family="Inter, sans-serif">Education（教育）+ Enforcement（徹底）の組み合わせ</text>

  <text x="200" y="450" text-anchor="middle" font-size="11" fill="#222" font-family="Inter, sans-serif">建設・製造・医療など幅広い産業で採用</text>
  <text x="200" y="468" text-anchor="middle" font-size="11" fill="#555" font-family="Inter, sans-serif">チームで実施することで安全意識の共有・向上を促進</text>
  <text x="200" y="486" text-anchor="middle" font-size="11" fill="#3a7d44" font-weight="bold" font-family="Inter, sans-serif">危険に気づく感受性 × チームの安全文化を醸成</text>
</svg>
