<svg viewBox="0 0 400 460" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="事故の4M要因分析。Man・Machine・Media・Managementの4視点で事故原因を分類する手法の概念図">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-title  { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-sub    { font-size: 11px; fill: #555; }
      .t-head   { font-size: 14px; font-weight: bold; fill: #1a3a5c; }
      .t-en     { font-size: 11px; fill: #555; }
      .t-note   { font-size: 12px; fill: #555; }
      .t-foot   { font-size: 11px; fill: #8a8a8a; }
      /* brand: Man */
      .box-brand  { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .badge-brand { fill: #ffffff; stroke: #2e6da4; stroke-width: 1.5; }
      /* surface: Machine */
      .box-surf   { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .badge-surf  { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1.5; }
      /* warn: Media */
      .box-warn   { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .badge-warn  { fill: #ffffff; stroke: #d4a017; stroke-width: 1.5; }
      /* positive: Management */
      .box-pos    { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .badge-pos   { fill: #ffffff; stroke: #3a7d44; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- タイトル -->
  <text class="t-title" x="200" y="26" text-anchor="middle">事故の4M要因分析</text>
  <text class="t-sub" x="200" y="44" text-anchor="middle">4つの視点から事故・災害の原因を抽出する手法</text>

  <!-- 2×2 グリッド：左上=Man / 右上=Machine / 左下=Media / 右下=Management -->
  <!-- カード寸法: 幅178 高さ168, ガター12 -->
  <!-- 行1 y=58, 行2 y=238 / 列1 x=12, 列2 x=202 -->

  <!-- Man（人） brand -->
  <rect class="box-brand" x="12" y="58" width="178" height="168" rx="10"/>
  <circle class="badge-brand" cx="38" cy="84" r="16"/>
  <text class="t-head" x="38" y="89" text-anchor="middle" fill="#2e6da4">M</text>
  <text class="t-head" x="105" y="84">Man</text>
  <text class="t-en"   x="64" y="104">人</text>
  <text class="t-note" x="24" y="132">心理的・生理的・</text>
  <text class="t-note" x="24" y="150">職場的要因</text>
  <text class="t-note" x="24" y="172" fill="#8a8a8a">例：不注意・疲労・</text>
  <text class="t-note" x="24" y="190" fill="#8a8a8a">　　コミュニケーション不足</text>
  <text class="t-note" x="24" y="210" fill="#8a8a8a">　　（職場的要因）</text>

  <!-- Machine（設備） surface -->
  <rect class="box-surf" x="202" y="58" width="178" height="168" rx="10"/>
  <circle class="badge-surf" cx="228" cy="84" r="16"/>
  <text class="t-head" x="228" y="89" text-anchor="middle" fill="#555">M</text>
  <text class="t-head" x="252" y="84">Machine</text>
  <text class="t-en"   x="254" y="104">設備</text>
  <text class="t-note" x="214" y="132">機械・設備等の</text>
  <text class="t-note" x="214" y="150">ハードウェア要因</text>
  <text class="t-note" x="214" y="172" fill="#8a8a8a">例：欠陥・整備不良・</text>
  <text class="t-note" x="214" y="190" fill="#8a8a8a">　　設計ミス</text>

  <!-- Media（作業環境） warn -->
  <rect class="box-warn" x="12" y="238" width="178" height="168" rx="10"/>
  <circle class="badge-warn" cx="38" cy="264" r="16"/>
  <text class="t-head" x="38" y="269" text-anchor="middle" fill="#d4a017">M</text>
  <text class="t-head" x="64" y="264">Media</text>
  <text class="t-en"   x="64" y="284">作業環境</text>
  <text class="t-note" x="24" y="312">Man と Machine を</text>
  <text class="t-note" x="24" y="330">つなぐ媒体の要因</text>
  <text class="t-note" x="24" y="352" fill="#8a8a8a">例：作業環境・マニュアル・</text>
  <text class="t-note" x="24" y="370" fill="#8a8a8a">　　不適切手順設定</text>

  <!-- Management（管理） positive -->
  <rect class="box-pos" x="202" y="238" width="178" height="168" rx="10"/>
  <circle class="badge-pos" cx="228" cy="264" r="16"/>
  <text class="t-head" x="228" y="269" text-anchor="middle" fill="#3a7d44">M</text>
  <text class="t-head" x="254" y="264">Mgmt</text>
  <text class="t-en"   x="254" y="284">管理</text>
  <text class="t-note" x="214" y="312">管理システムに</text>
  <text class="t-note" x="214" y="330">関する要因</text>
  <text class="t-note" x="214" y="352" fill="#8a8a8a">例：規定・教育訓練・</text>
  <text class="t-note" x="214" y="370" fill="#8a8a8a">　　監理・監督</text>

  <!-- フッター -->
  <text class="t-foot" x="200" y="448" text-anchor="middle">4視点で要因を漏れなく抽出し、対策（4E対策）へ展開する</text>
</svg>
