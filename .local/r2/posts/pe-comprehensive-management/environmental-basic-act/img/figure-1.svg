<svg viewBox="0 0 400 620" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="環境保全の基本7原則。EPR・PPPの経済系2原則、予防的措置・順応的取組の予防系2原則、源流対策・協働・補完性の実施系3原則をカード縦並びで示した図">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      /* heading */
      .t-title  { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-sub    { font-size: 11px; fill: #8a8a8a; }
      /* card heading */
      .t-label  { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-en     { font-size: 11px; fill: #555; }
      /* card body */
      .t-def    { font-size: 12px; fill: #555; }
      /* group label */
      .t-group  { font-size:11px; font-weight: bold; fill: #8a8a8a; letter-spacing: 0.5px; }
      /* oecd badge */
      .t-badge  { font-size:11px; fill: #d4a017; font-weight: bold; }
      /* card fills — warn = 経済系, positive = 予防・順応, brand = 実施系 */
      .box-warn     { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.2; }  /* 経済系 */
      .box-positive { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.2; }  /* 予防・順応 */
      .box-brand    { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.2; }  /* 源流・協働・補完 */
      /* group bar */
      .bar-warn     { fill: #d4a017; }
      .bar-positive { fill: #3a7d44; }
      .bar-brand    { fill: #2e6da4; }
      /* divider */
      .divider { stroke: #d7d7d7; stroke-width: 1; }
    </style>
  </defs>

  <!-- title -->
  <text class="t-title" x="200" y="26" text-anchor="middle">環境保全の基本原則</text>
  <text class="t-sub"   x="200" y="44" text-anchor="middle">5原則 ＋ PPP / EPR（OECD提唱）</text>

  <!-- ===== グループ1: 経済系 (warn) ===== -->
  <text class="t-group" x="16" y="64">経済系 / OECD提唱</text>

  <!-- Card 1: EPR -->
  <rect class="box-warn" x="12" y="70" width="376" height="70" rx="6"/>
  <!-- accent bar -->
  <rect class="bar-warn" x="12" y="70" width="4" height="70" rx="2"/>
  <text class="t-label" x="26" y="90">拡大生産者責任</text>
  <text class="t-en"    x="26" y="106">EPR : Extended Producer Responsibilities</text>
  <text class="t-def"   x="26" y="124">製品の廃棄・リサイクル費用まで生産者が負担</text>
  <!-- OECD badge -->
  <text class="t-badge" x="381" y="90" text-anchor="end">OECD</text>

  <!-- Card 2: PPP -->
  <rect class="box-warn" x="12" y="148" width="376" height="70" rx="6"/>
  <rect class="bar-warn" x="12" y="148" width="4" height="70" rx="2"/>
  <text class="t-label" x="26" y="168">汚染者負担原則</text>
  <text class="t-en"    x="26" y="184">PPP : Polluter Pays Principle  (1972年)</text>
  <text class="t-def"   x="26" y="202">汚染者が環境劣化への対処費用を負担する</text>
  <text class="t-badge" x="381" y="168" text-anchor="end">OECD</text>

  <!-- ===== グループ2: 予防・順応 (positive) ===== -->
  <line class="divider" x1="12" y1="232" x2="388" y2="232"/>
  <text class="t-group" x="16" y="248">予防・順応</text>

  <!-- Card 3: 予防的措置 -->
  <rect class="box-positive" x="12" y="254" width="376" height="70" rx="6"/>
  <rect class="bar-positive" x="12" y="254" width="4" height="70" rx="2"/>
  <text class="t-label" x="26" y="274">予防的措置</text>
  <text class="t-en"    x="26" y="290">Precautionary Approach</text>
  <text class="t-def"   x="26" y="308">科学的不確実性があっても重大・不可逆的影響を規制</text>

  <!-- Card 4: 順応的取組 -->
  <rect class="box-positive" x="12" y="332" width="376" height="70" rx="6"/>
  <rect class="bar-positive" x="12" y="332" width="4" height="70" rx="2"/>
  <text class="t-label" x="26" y="352">順応的取組</text>
  <text class="t-en"    x="26" y="368">Adaptive Management</text>
  <text class="t-def"   x="26" y="386">想定外事態を管理システムに取込み柔軟対応</text>

  <!-- ===== グループ3: 実施系 (brand) ===== -->
  <line class="divider" x1="12" y1="416" x2="388" y2="416"/>
  <text class="t-group" x="16" y="432">実施系</text>

  <!-- Card 5: 源流対策 -->
  <rect class="box-brand" x="12" y="438" width="376" height="58" rx="6"/>
  <rect class="bar-brand" x="12" y="438" width="4" height="58" rx="2"/>
  <text class="t-label" x="26" y="458">源流対策原則</text>
  <text class="t-def"   x="26" y="476">汚染物質を排出口ではなく設計・製法で根絶する</text>

  <!-- Card 6: 協働 -->
  <rect class="box-brand" x="12" y="502" width="376" height="58" rx="6"/>
  <rect class="bar-brand" x="12" y="502" width="4" height="58" rx="2"/>
  <text class="t-label" x="26" y="522">協働原則</text>
  <text class="t-def"   x="26" y="540">政策の企画・立案・実行に民間各主体が参加する</text>

  <!-- Card 7: 補完性 -->
  <rect class="box-brand" x="12" y="566" width="376" height="48" rx="6"/>
  <rect class="bar-brand" x="12" y="566" width="4" height="48" rx="2"/>
  <text class="t-label" x="26" y="585">補完性原則</text>
  <text class="t-def"   x="26" y="603">基礎的行政単位が処理し、広域単位は補完のみ</text>
</svg>
