<?xml version="1.0" encoding="UTF-8"?>
<svg width="380" height="420" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 420" role="img" aria-label="国土交通白書R7主要テーマと総監5管理の対応マップ" style="max-width:380px;width:100%">
  <title>白書R7主要テーマ × 総監5管理マップ</title>
  <desc>国土交通白書 令和7年版の3大課題（担い手不足・インフラ老朽化・激甚化災害）と7テーマ別記事を、総監の5管理（経済性/人的資源/情報/安全/社会環境）にマッピングした全体図。</desc>
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-main { font-size: 14px; font-weight: bold; fill: #1a3a5c; }
      .t-pillar { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-theme { font-size: 11px; fill: #1a3a5c; }
      .t-num { font-size: 10px; fill: #b22234; font-weight: bold; }
      .box-pillar { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; rx: 6; ry: 6; }
      .box-theme { fill: #fff3cd; stroke: #d4a017; stroke-width: 1; rx: 4; ry: 4; }
      .box-num { fill: #f8d7da; stroke: #b22234; stroke-width: 1; rx: 4; ry: 4; }
      .conn { stroke: #d7d7d7; stroke-width: 0.8; fill: none; }
    </style>
  </defs>

  <!-- タイトル -->
  <text class="t-main" x="190" y="22" text-anchor="middle">国土交通白書R7 × 総監5管理マップ</text>

  <!-- 5管理ピラー (左列) -->
  <rect class="box-pillar" x="10" y="40" width="100" height="40"/>
  <text class="t-pillar" x="60" y="65" text-anchor="middle">経済性管理</text>

  <rect class="box-pillar" x="10" y="90" width="100" height="40"/>
  <text class="t-pillar" x="60" y="115" text-anchor="middle">人的資源管理</text>

  <rect class="box-pillar" x="10" y="140" width="100" height="40"/>
  <text class="t-pillar" x="60" y="165" text-anchor="middle">情報管理</text>

  <rect class="box-pillar" x="10" y="190" width="100" height="40"/>
  <text class="t-pillar" x="60" y="215" text-anchor="middle">安全管理</text>

  <rect class="box-pillar" x="10" y="240" width="100" height="40"/>
  <text class="t-pillar" x="60" y="265" text-anchor="middle">社会環境管理</text>

  <!-- 7テーマ (中央) -->
  <rect class="box-theme" x="135" y="40" width="120" height="32"/>
  <text class="t-theme" x="195" y="60" text-anchor="middle">老朽化×総監</text>

  <rect class="box-theme" x="135" y="78" width="120" height="32"/>
  <text class="t-theme" x="195" y="98" text-anchor="middle">2024年問題×総監</text>

  <rect class="box-theme" x="135" y="116" width="120" height="32"/>
  <text class="t-theme" x="195" y="136" text-anchor="middle">i-Con 2.0×総監</text>

  <rect class="box-theme" x="135" y="154" width="120" height="32"/>
  <text class="t-theme" x="195" y="174" text-anchor="middle">流域治水×総監</text>

  <rect class="box-theme" x="135" y="192" width="120" height="32"/>
  <text class="t-theme" x="195" y="212" text-anchor="middle">GX/CN×総監</text>

  <rect class="box-theme" x="135" y="230" width="120" height="32"/>
  <text class="t-theme" x="195" y="250" text-anchor="middle">群マネ×総監</text>

  <rect class="box-theme" x="135" y="268" width="120" height="32"/>
  <text class="t-theme" x="195" y="288" text-anchor="middle">外国人材×総監</text>

  <!-- 主要白書数字 (右列) -->
  <rect class="box-num" x="275" y="40" width="95" height="32"/>
  <text class="t-num" x="322" y="60" text-anchor="middle">30年で3割縮減</text>

  <rect class="box-num" x="275" y="78" width="95" height="32"/>
  <text class="t-num" x="322" y="98" text-anchor="middle">55歳以上36.7%</text>

  <rect class="box-num" x="275" y="116" width="95" height="32"/>
  <text class="t-num" x="322" y="136" text-anchor="middle">省人化3割目標</text>

  <rect class="box-num" x="275" y="154" width="95" height="32"/>
  <text class="t-num" x="322" y="174" text-anchor="middle">警戒レベル統一</text>

  <rect class="box-num" x="275" y="192" width="95" height="32"/>
  <text class="t-num" x="322" y="212" text-anchor="middle">2050ネットゼロ</text>

  <rect class="box-num" x="275" y="230" width="95" height="32"/>
  <text class="t-num" x="322" y="250" text-anchor="middle">11件40自治体</text>

  <rect class="box-num" x="275" y="268" width="95" height="32"/>
  <text class="t-num" x="322" y="288" text-anchor="middle">5年18.1万人</text>

  <!-- 凡例 -->
  <rect class="box-pillar" x="10" y="320" width="20" height="16"/>
  <text class="t-theme" x="36" y="333">5管理 (総監キーワード集)</text>

  <rect class="box-theme" x="10" y="345" width="20" height="16"/>
  <text class="t-theme" x="36" y="358">テーマ別記事 (本サイト)</text>

  <rect class="box-num" x="10" y="370" width="20" height="16"/>
  <text class="t-theme" x="36" y="383">白書R7主要数字</text>

  <!-- フッター -->
  <text class="t-theme" x="190" y="410" text-anchor="middle">出典: 国土交通白書 令和7年版</text>
</svg>
