<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" style="max-width:520px;width:100%" role="img" aria-label="フォールトツリー図（電源システムの停電確率）">
  <rect width="520" height="380" fill="#ffffff"/>
  <style>
    text { font-family: sans-serif; }
    .event { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
    .gate-and { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
    .gate-or { fill: #f8d7da; stroke: #633; stroke-width: 1.5; }
    .basic { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
    .line { stroke: #222; stroke-width: 1.5; fill: none; }
    .label { font-size: 11px; fill: #222; }
    .prob { font-size: 10px; fill: #b22234; font-weight: bold; }
    .gate-label { font-size: 9px; fill: #555; font-weight: bold; }
    .title { font-size: 13px; font-weight: bold; fill: #222; }
    .result { font-size: 11px; fill: #2e6da4; font-weight: bold; }
  </style>

  <!-- Title -->
  <text class="title" x="260" y="20" text-anchor="middle">フォールトツリー図（電源システムの停電確率）</text>

  <!-- Top event: 停電 -->
  <rect class="event" x="190" y="35" width="140" height="35" rx="6"/>
  <text class="label" x="260" y="57" text-anchor="middle">停電の発生</text>

  <!-- Line to AND gate -->
  <line class="line" x1="260" y1="70" x2="260" y2="95"/>

  <!-- AND gate (top) -->
  <rect class="gate-and" x="220" y="95" width="80" height="28" rx="4"/>
  <text class="gate-label" x="260" y="113" text-anchor="middle">AND</text>

  <!-- Branches from AND -->
  <line class="line" x1="240" y1="123" x2="130" y2="160"/>
  <line class="line" x1="280" y1="123" x2="390" y2="160"/>

  <!-- Left: OR gate (電源喪失) -->
  <rect class="gate-or" x="70" y="160" width="120" height="28" rx="4"/>
  <text class="gate-label" x="130" y="178" text-anchor="middle">OR</text>
  <text class="label" x="130" y="155" text-anchor="middle">交流電源の喪失</text>

  <!-- Right: AND gate (発電機全台故障) -->
  <rect class="gate-and" x="330" y="160" width="120" height="28" rx="4"/>
  <text class="gate-label" x="390" y="178" text-anchor="middle">AND</text>
  <text class="label" x="390" y="155" text-anchor="middle">予備電源3台全故障</text>

  <!-- OR gate branches -->
  <line class="line" x1="100" y1="188" x2="60" y2="225"/>
  <line class="line" x1="160" y1="188" x2="200" y2="225"/>

  <!-- Basic event: 系統喪失 -->
  <circle class="basic" cx="60" cy="245" r="20"/>
  <text class="label" x="60" y="241" text-anchor="middle">系統</text>
  <text class="label" x="60" y="253" text-anchor="middle">喪失</text>
  <text class="prob" x="60" y="278" text-anchor="middle">0.03</text>

  <!-- Basic event: 自社事故 -->
  <circle class="basic" cx="200" cy="245" r="20"/>
  <text class="label" x="200" y="241" text-anchor="middle">自社</text>
  <text class="label" x="200" y="253" text-anchor="middle">遮断</text>
  <text class="prob" x="200" y="278" text-anchor="middle">0.10</text>

  <!-- AND gate branches (3 generators) -->
  <line class="line" x1="360" y1="188" x2="310" y2="225"/>
  <line class="line" x1="390" y1="188" x2="390" y2="225"/>
  <line class="line" x1="420" y1="188" x2="470" y2="225"/>

  <!-- Basic event: Generator 1 -->
  <circle class="basic" cx="310" cy="245" r="20"/>
  <text class="label" x="310" y="243" text-anchor="middle">1号機</text>
  <text class="prob" x="310" y="278" text-anchor="middle">0.05</text>

  <!-- Basic event: Generator 2 -->
  <circle class="basic" cx="390" cy="245" r="20"/>
  <text class="label" x="390" y="243" text-anchor="middle">2号機</text>
  <text class="prob" x="390" y="278" text-anchor="middle">0.05</text>

  <!-- Basic event: Generator 3 -->
  <circle class="basic" cx="470" cy="245" r="20"/>
  <text class="label" x="470" y="243" text-anchor="middle">3号機</text>
  <text class="prob" x="470" y="278" text-anchor="middle">0.05</text>

  <!-- Calculation summary -->
  <rect x="30" y="300" width="460" height="70" rx="6" fill="#f5f5f5" stroke="#d7d7d7"/>
  <text class="label" x="40" y="318">電源喪失: P = 1-(1-0.03)(1-0.10) = 0.127</text>
  <text class="label" x="40" y="336">全台故障: P = 0.05 x 0.05 x 0.05 = 1.25 x 10&#x207B;&#x2074;</text>
  <text class="result" x="40" y="358">停電確率: P = 0.127 × 1.25 × 10⁻⁴ ≈ 1.6 × 10⁻⁵</text>
</svg>
