  <svg width="400" height="500" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="11" style="max-width:400px;width:100%" role="img" aria-label="相関散布図パターン">
    <defs>
      <marker id="arrC" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#222"/></marker>
    </defs>

    <!-- ===正の相関=== -->
    <text x="66" y="20" text-anchor="middle" fill="#222" font-weight="bold" font-size="12">正の相関</text>
    <line x1="14" y1="148" x2="118" y2="148" stroke="#222" stroke-width="1.5" marker-end="url(#arrC)"/>
    <line x1="14" y1="148" x2="14" y2="22" stroke="#222" stroke-width="1.5" marker-end="url(#arrC)"/>
    <circle cx="24" cy="138" r="3.5" fill="#555"/>
    <circle cx="33" cy="128" r="3.5" fill="#555"/>
    <circle cx="42" cy="115" r="3.5" fill="#555"/>
    <circle cx="50" cy="105" r="3.5" fill="#555"/>
    <circle cx="59" cy="98" r="3.5" fill="#555"/>
    <circle cx="68" cy="85" r="3.5" fill="#555"/>
    <circle cx="77" cy="75" r="3.5" fill="#555"/>
    <circle cx="87" cy="62" r="3.5" fill="#555"/>
    <circle cx="96" cy="52" r="3.5" fill="#555"/>
    <circle cx="105" cy="45" r="3.5" fill="#555"/>
    <text x="66" y="164" text-anchor="middle" fill="#555" font-size="10">相関係数 ≈ 1 に近い</text>

    <!-- ===相関なし=== -->
    <text x="200" y="20" text-anchor="middle" fill="#222" font-weight="bold" font-size="12">相関なし</text>
    <line x1="148" y1="148" x2="252" y2="148" stroke="#222" stroke-width="1.5" marker-end="url(#arrC)"/>
    <line x1="148" y1="148" x2="148" y2="22" stroke="#222" stroke-width="1.5" marker-end="url(#arrC)"/>
    <circle cx="162" cy="70"  r="3.5" fill="#555"/>
    <circle cx="171" cy="120" r="3.5" fill="#555"/>
    <circle cx="180" cy="50"  r="3.5" fill="#555"/>
    <circle cx="188" cy="130" r="3.5" fill="#555"/>
    <circle cx="197" cy="85"  r="3.5" fill="#555"/>
    <circle cx="206" cy="40"  r="3.5" fill="#555"/>
    <circle cx="215" cy="110" r="3.5" fill="#555"/>
    <circle cx="224" cy="65"  r="3.5" fill="#555"/>
    <circle cx="233" cy="135" r="3.5" fill="#555"/>
    <circle cx="242" cy="55"  r="3.5" fill="#555"/>
    <text x="200" y="164" text-anchor="middle" fill="#555" font-size="10">相関係数 ≈ 0</text>

    <!-- ===負の相関=== -->
    <text x="334" y="20" text-anchor="middle" fill="#222" font-weight="bold" font-size="12">負の相関</text>
    <line x1="282" y1="148" x2="386" y2="148" stroke="#222" stroke-width="1.5" marker-end="url(#arrC)"/>
    <line x1="282" y1="148" x2="282" y2="22" stroke="#222" stroke-width="1.5" marker-end="url(#arrC)"/>
    <circle cx="292" cy="35"  r="3.5" fill="#555"/>
    <circle cx="301" cy="47"  r="3.5" fill="#555"/>
    <circle cx="310" cy="57"  r="3.5" fill="#555"/>
    <circle cx="319" cy="70"  r="3.5" fill="#555"/>
    <circle cx="328" cy="80"  r="3.5" fill="#555"/>
    <circle cx="337" cy="90" r="3.5" fill="#555"/>
    <circle cx="346" cy="102" r="3.5" fill="#555"/>
    <circle cx="355" cy="115" r="3.5" fill="#555"/>
    <circle cx="364" cy="125" r="3.5" fill="#555"/>
    <circle cx="373" cy="138" r="3.5" fill="#555"/>
    <text x="334" y="164" text-anchor="middle" fill="#555" font-size="10">相関係数 ≈ −1 に近い</text>

    <!-- 下部サマリー -->
    <rect x="20" y="310" width="360" height="170" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1" rx="4"/>
    <text x="200" y="338" text-anchor="middle" font-size="13" fill="#222" font-weight="bold">相関係数（ピアソン r）の解釈</text>
    <text x="35" y="365" font-size="12" fill="#555">r ≈ +1：強い正の相関（X↑ なら Y↑）</text>
    <text x="35" y="390" font-size="12" fill="#555">r ≈ 0 ：相関なし（X と Y が独立）</text>
    <text x="35" y="415" font-size="12" fill="#555">r ≈ −1：強い負の相関（X↑ なら Y↓）</text>
    <text x="35" y="440" font-size="12" fill="#555">|r| ≥ 0.7 が「強い相関」の目安</text>
    <text x="35" y="465" font-size="11" fill="#8a8a8a">相関は因果関係を示すものではない（擬似相関に注意）</text>
  </svg>
