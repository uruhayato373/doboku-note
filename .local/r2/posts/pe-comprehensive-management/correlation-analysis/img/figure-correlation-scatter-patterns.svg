  <svg width="500" height="185" viewBox="0 0 500 185" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="11" style="max-width:500px;width:100%" role="img" aria-label="相関散布図パターン">
    <defs>
      <marker id="arrC" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#222"/></marker>
    </defs>
    <!-- ===正の相関=== -->
    <text x="83" y="14" text-anchor="middle" fill="#222" font-weight="bold" font-size="12">正の相関</text>
    <!-- 軸 -->
    <line x1="18" y1="160" x2="148" y2="160" stroke="#222" stroke-width="1.5" marker-end="url(#arrC)"/>
    <line x1="18" y1="160" x2="18" y2="22" stroke="#222" stroke-width="1.5" marker-end="url(#arrC)"/>
    <!-- 右上がりの点群 -->
    <circle cx="30" cy="148" r="3.5" fill="#555"/>
    <circle cx="40" cy="138" r="3.5" fill="#555"/>
    <circle cx="50" cy="125" r="3.5" fill="#555"/>
    <circle cx="58" cy="115" r="3.5" fill="#555"/>
    <circle cx="68" cy="108" r="3.5" fill="#555"/>
    <circle cx="78" cy="95" r="3.5" fill="#555"/>
    <circle cx="88" cy="85" r="3.5" fill="#555"/>
    <circle cx="100" cy="72" r="3.5" fill="#555"/>
    <circle cx="110" cy="62" r="3.5" fill="#555"/>
    <circle cx="120" cy="55" r="3.5" fill="#555"/>
    <circle cx="130" cy="42" r="3.5" fill="#555"/>
    <text x="143" y="155" fill="#555" font-size="9">右肩上がり</text>
    <!-- 相関係数ラベル -->
    <text x="83" y="176" text-anchor="middle" fill="#555" font-size="10">相関係数 ≈ 1 に近い</text>

    <!-- ===相関なし=== -->
    <text x="250" y="14" text-anchor="middle" fill="#222" font-weight="bold" font-size="12">相関なし</text>
    <line x1="185" y1="160" x2="315" y2="160" stroke="#222" stroke-width="1.5" marker-end="url(#arrC)"/>
    <line x1="185" y1="160" x2="185" y2="22" stroke="#222" stroke-width="1.5" marker-end="url(#arrC)"/>
    <!-- ランダムな点群 -->
    <circle cx="200" cy="80"  r="3.5" fill="#555"/>
    <circle cx="210" cy="130" r="3.5" fill="#555"/>
    <circle cx="220" cy="60"  r="3.5" fill="#555"/>
    <circle cx="228" cy="140" r="3.5" fill="#555"/>
    <circle cx="238" cy="95"  r="3.5" fill="#555"/>
    <circle cx="248" cy="50"  r="3.5" fill="#555"/>
    <circle cx="258" cy="120" r="3.5" fill="#555"/>
    <circle cx="268" cy="75"  r="3.5" fill="#555"/>
    <circle cx="278" cy="145" r="3.5" fill="#555"/>
    <circle cx="288" cy="65"  r="3.5" fill="#555"/>
    <circle cx="298" cy="110" r="3.5" fill="#555"/>
    <text x="250" y="176" text-anchor="middle" fill="#555" font-size="10">相関係数 ≈ 0</text>

    <!-- ===負の相関=== -->
    <text x="420" y="14" text-anchor="middle" fill="#222" font-weight="bold" font-size="12">負の相関</text>
    <line x1="352" y1="160" x2="482" y2="160" stroke="#222" stroke-width="1.5" marker-end="url(#arrC)"/>
    <line x1="352" y1="160" x2="352" y2="22" stroke="#222" stroke-width="1.5" marker-end="url(#arrC)"/>
    <!-- 右下がりの点群 -->
    <circle cx="364" cy="42"  r="3.5" fill="#555"/>
    <circle cx="374" cy="55"  r="3.5" fill="#555"/>
    <circle cx="384" cy="65"  r="3.5" fill="#555"/>
    <circle cx="394" cy="78"  r="3.5" fill="#555"/>
    <circle cx="404" cy="88"  r="3.5" fill="#555"/>
    <circle cx="414" cy="100" r="3.5" fill="#555"/>
    <circle cx="424" cy="112" r="3.5" fill="#555"/>
    <circle cx="434" cy="125" r="3.5" fill="#555"/>
    <circle cx="444" cy="135" r="3.5" fill="#555"/>
    <circle cx="454" cy="148" r="3.5" fill="#555"/>
    <text x="495" y="155" text-anchor="end" fill="#555" font-size="9">右肩下がり</text>
    <text x="420" y="176" text-anchor="middle" fill="#555" font-size="10">相関係数 ≈ −1 に近い</text>

    <!-- 相関係数ブラケット -->
    <text x="250" y="14" text-anchor="middle" fill="#222" font-size="9"/>
  </svg>