  <svg width="400" height="500" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="11" style="max-width:400px;width:100%" role="img" aria-label="回帰直線のイメージ">
    <defs>
      <marker id="arrR" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#222"/></marker>
    </defs>
    <!-- 軸 -->
    <line x1="50" y1="280" x2="380" y2="280" stroke="#222" stroke-width="1.5" marker-end="url(#arrR)"/>
    <line x1="50" y1="280" x2="50" y2="40" stroke="#222" stroke-width="1.5" marker-end="url(#arrR)"/>
    <text x="388" y="283" fill="#222" font-size="13">x</text>
    <text x="38" y="36" fill="#222" font-size="13">y</text>
    <!-- 回帰直線 -->
    <line x1="70" y1="260" x2="360" y2="65" stroke="#222" stroke-width="2"/>
    <text x="365" y="62" fill="#222" font-size="12">f(x)</text>
    <!-- データ点と残差 -->
    <circle cx="90"  cy="242" r="5" fill="#555"/>
    <circle cx="120" cy="215" r="5" fill="#555"/>
    <circle cx="150" cy="205" r="5" fill="#555"/>
    <circle cx="180" cy="188" r="5" fill="#555"/>
    <circle cx="210" cy="168" r="5" fill="#555"/>
    <circle cx="240" cy="155" r="5" fill="#555"/>
    <circle cx="270" cy="133" r="5" fill="#555"/>
    <circle cx="300" cy="128" r="5" fill="#555"/>
    <circle cx="330" cy="112" r="5" fill="#555"/>
    <!-- 残差矢印 (u) -->
    <line x1="150" y1="205" x2="150" y2="222" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="240" y1="155" x2="240" y2="170" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="162" y="216" fill="#555" font-size="11">u（残差）</text>

    <!-- 下部サマリー -->
    <rect x="20" y="350" width="360" height="130" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1" rx="4"/>
    <text x="200" y="378" text-anchor="middle" font-size="13" fill="#222" font-weight="bold">最小二乗法による回帰直線</text>
    <text x="35" y="405" font-size="12" fill="#555">プロットとモデル関数 f(x) との</text>
    <text x="35" y="428" font-size="12" fill="#555">残差の二乗和を最小化して直線を決定</text>
    <text x="35" y="453" font-size="12" fill="#555">f(x) = a + bx  （a：切片、b：回帰係数）</text>
    <text x="35" y="470" font-size="11" fill="#8a8a8a">b の符号が正なら正の相関、負なら負の相関</text>
  </svg>
