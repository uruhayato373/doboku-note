  <svg width="280" height="200" viewBox="0 0 280 200" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="11" style="max-width:280px;width:100%">
    <defs>
      <marker id="arrR" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#333"/></marker>
    </defs>
    <!-- 軸 -->
    <line x1="30" y1="175" x2="260" y2="175" stroke="#333" stroke-width="1.5" marker-end="url(#arrR)"/>
    <line x1="30" y1="175" x2="30"  y2="18"  stroke="#333" stroke-width="1.5" marker-end="url(#arrR)"/>
    <text x="265" y="178" fill="#333" font-size="11">x</text>
    <text x="20"  y="14"  fill="#333" font-size="11">y</text>
    <!-- 回帰直線 -->
    <line x1="40" y1="162" x2="240" y2="40" stroke="#333" stroke-width="2"/>
    <text x="242" y="38" fill="#333" font-size="11">f(x)</text>
    <!-- データ点と残差 -->
    <circle cx="60"  cy="145" r="4" fill="#666"/>
    <circle cx="80"  cy="120" r="4" fill="#666"/>
    <circle cx="100" cy="115" r="4" fill="#666"/>
    <circle cx="120" cy="100" r="4" fill="#666"/>
    <circle cx="140" cy="85"  r="4" fill="#666"/>
    <circle cx="160" cy="80"  r="4" fill="#666"/>
    <circle cx="180" cy="65"  r="4" fill="#666"/>
    <circle cx="200" cy="65"  r="4" fill="#666"/>
    <circle cx="220" cy="55"  r="4" fill="#666"/>
    <!-- 残差矢印 (u) -->
    <line x1="100" y1="115" x2="100" y2="127" stroke="#999" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="160" y1="80"  x2="160" y2="93"  stroke="#999" stroke-width="1" stroke-dasharray="3,2"/>
    <!-- ラベル -->
    <text x="110" y="122" fill="#777" font-size="9">u</text>
    <text x="60"  y="188" text-anchor="middle" fill="#555" font-size="9">プロットとモデル関数の</text>
    <text x="150" y="188" text-anchor="middle" fill="#555" font-size="9">二乗の和を最小にする</text>
    <text x="220" y="188" text-anchor="middle" fill="#555" font-size="9">f(x)を求める</text>
    <text x="145" y="197" text-anchor="middle" fill="#555" font-size="9">← 回帰直線 →</text>
  </svg>