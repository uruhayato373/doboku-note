  <text x="430" y="60" text-anchor="middle" fill="#1a3a5c" font-size="12" font-weight="bold">チェック観点</text>
  <line x1="20" y1="66" x2="540" y2="66" stroke="#ddd" stroke-width="1"/>
  <!-- Rows -->
  <g font-size="11">
    <text x="30" y="84" fill="#333" font-weight="bold">必要性</text>
    <text x="310" y="84" fill="#666">　記述されているか</text>
    <line x1="20" y1="92" x2="540" y2="92" stroke="#eee" stroke-width="1"/>
    <text x="30" y="110" fill="#333" font-weight="bold">具体的な方策</text>
    <text x="310" y="110" fill="#666">　具体的か</text>
    <line x1="20" y1="118" x2="540" y2="118" stroke="#eee" stroke-width="1"/>
    <text x="30" y="136" fill="#333" font-weight="bold">経済性管理</text>
    <text x="310" y="136" fill="#666">　観点が含まれているか</text>
    <line x1="20" y1="144" x2="540" y2="144" stroke="#eee" stroke-width="1"/>
    <text x="30" y="162" fill="#333" font-weight="bold">安全管理</text>
    <text x="310" y="162" fill="#666">　観点が含まれているか</text>
    <line x1="20" y1="170" x2="540" y2="170" stroke="#eee" stroke-width="1"/>
    <text x="30" y="188" fill="#333" font-weight="bold">情報管理</text>
    <text x="310" y="188" fill="#666">　観点が含まれているか</text>
    <line x1="20" y1="196" x2="540" y2="196" stroke="#eee" stroke-width="1"/>
    <text x="30" y="214" fill="#333" font-weight="bold">人的資源管理</text>
    <text x="310" y="214" fill="#666">　観点が含まれているか</text>
    <line x1="20" y1="222" x2="540" y2="222" stroke="#eee" stroke-width="1"/>
    <text x="30" y="240" fill="#333" font-weight="bold">社会環境管理</text>
    <text x="310" y="240" fill="#666">　観点が含まれているか</text>
    <line x1="20" y1="248" x2="540" y2="248" stroke="#eee" stroke-width="1"/>
    <text x="30" y="266" fill="#333" font-weight="bold">トレードオフへの対応</text>
    <text x="310" y="266" fill="#666">　管理間の対立と対処が書かれているか</text>
    <line x1="20" y1="274" x2="540" y2="274" stroke="#eee" stroke-width="1"/>
    <rect x="20" y="280" width="520" height="22" rx="3" fill="#fff8e0"/>
    <text x="30" y="295" fill="#c0872a" font-weight="bold">論文全体のまとまり ★</text>
    <text x="310" y="295" fill="#c0872a">　ストーリーが一貫しているか（★最重要）</text>
