<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" style="max-width:560px;width:100%">
  <rect x="10" y="10" width="540" height="300" rx="6" fill="#f9f9f9" stroke="#1a3a5c" stroke-width="2"/>
  <!-- Header -->
  <rect x="10" y="10" width="540" height="32" rx="4" fill="#1a3a5c"/>
  <text x="280" y="30" text-anchor="middle" fill="white" font-size="13" font-weight="bold">論文評価基準の確認項目</text>
  <!-- Columns -->
  <line x1="300" y1="44" x2="300" y2="308" stroke="#ccc" stroke-width="1"/>
