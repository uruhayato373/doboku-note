<svg xmlns="http://www.w3.org/2000/svg" width="560" height="200" viewBox="0 0 560 200">
  <!-- Title box -->
  <rect x="10" y="10" width="200" height="40" rx="6" fill="#1a3a5c"/>
  <text x="110" y="30" text-anchor="middle" fill="white" font-size="13" font-weight="bold">働き方改革実行計画</text>
  <text x="110" y="45" text-anchor="middle" fill="white" font-size="11">（平成29年3月　内閣総理大臣決定）</text>
  <!-- Arrow -->
  <line x1="212" y1="30" x2="240" y2="30" stroke="#1a3a5c" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Background box -->
  <rect x="242" y="10" width="308" height="180" rx="6" fill="#f0f4fa" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="396" y="35" text-anchor="middle" fill="#1a3a5c" font-size="13" font-weight="bold">の背景</text>
  <text x="258" y="58" fill="#333" font-size="12">・就業者数の減少</text>
  <text x="258" y="78" fill="#333" font-size="12">・年平均労働時間の長さ</text>
  <text x="258" y="98" fill="#333" font-size="12">・パートタイム労働者の賃金水準の低さ</text>
  <text x="258" y="118" fill="#333" font-size="12">・長時間労働の抑制</text>
  <text x="258" y="138" fill="#333" font-size="12">・非正規雇用の処遇改善</text>
  <text x="258" y="158" fill="#333" font-size="12">・同一労働同一賃金の実現</text>
</svg>