<svg xmlns="http://www.w3.org/2000/svg" width="560" height="420" viewBox="0 0 560 420" style="max-width:560px;width:100%" role="img" aria-label="figure 4 22" font-family='Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif'>
  <!-- Header -->
  <rect x="10" y="10" width="540" height="32" rx="4" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="280" y="30" text-anchor="middle" fill="#1a3a5c" font-size="13" font-weight="bold">事例：「大規模農場でのキュウリ生産プロジェクト」</text>
  <!-- 設問1 -->
  <rect x="10" y="52" width="80" height="100" rx="4" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="50" y="90" text-anchor="middle" fill="#1a3a5c" font-size="12" font-weight="bold" writing-mode="tb">設問(1)</text>
  <text x="50" y="118" text-anchor="middle" fill="#1a3a5c" font-size="10">概要</text>
  <rect x="100" y="52" width="450" height="100" rx="4" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1"/>
  <text x="120" y="74" fill="#222" font-size="11">■ 企業参入で生産と販売を2年で安定化、3年目で黒字化</text>
  <text x="120" y="92" fill="#222" font-size="11">■ 目的：生産者が減少するキュウリ生産の下支え</text>
  <text x="120" y="110" fill="#222" font-size="11">■ 成果物：年間1,000トン規模のキュウリ生産・販売</text>
  <text x="120" y="128" fill="#222" font-size="11">■ 変化：IoT活用で栽培管理・安全衛生・分散化を実現</text>
  <text x="120" y="144" fill="#555" font-size="10">（過去）人海戦術 →（現在）機械化・ICT →（将来）自動化</text>
  <!-- 設問2 -->
  <rect x="10" y="162" width="80" height="140" rx="4" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="50" y="220" text-anchor="middle" fill="#1a3a5c" font-size="12" font-weight="bold" writing-mode="tb">設問(2)</text>
  <text x="50" y="248" text-anchor="middle" fill="#1a3a5c" font-size="10">課題</text>
  <rect x="100" y="162" width="450" height="140" rx="4" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1"/>
  <text x="120" y="184" fill="#1a3a5c" font-size="12" font-weight="bold">【課題1】管理者の農場業務分担と管理のDX化</text>
  <text x="130" y="202" fill="#555" font-size="10">背景：短時間労働の概略、労務管理担当者の負担増</text>
  <text x="130" y="218" fill="#555" font-size="10">影響：複数農場を管理し、分散化・固定費削減が必要</text>
  <line x1="110" y1="228" x2="540" y2="228" stroke="#d7d7d7" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="120" y="248" fill="#1a3a5c" font-size="12" font-weight="bold">【課題2】管理者の増加と管理農場の複数担当</text>
  <text x="130" y="266" fill="#555" font-size="10">背景：管理者不足と農場担当の広域化</text>
  <text x="130" y="282" fill="#555" font-size="10">影響：移動時間の増加と接触時間の短縮（経済性・安全管理）</text>
  <text x="120" y="298" fill="#8a8a8a" font-size="10">（課題1と課題2は異なる管理の視点から選定）</text>
  <!-- 設問3 -->
  <rect x="10" y="312" width="80" height="100" rx="4" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="50" y="355" text-anchor="middle" fill="#1a3a5c" font-size="12" font-weight="bold" writing-mode="tb">設問(3)</text>
  <text x="50" y="378" text-anchor="middle" fill="#1a3a5c" font-size="10">方策</text>
  <rect x="100" y="312" width="450" height="100" rx="4" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1"/>
  <text x="120" y="332" fill="#1a3a5c" font-size="11" font-weight="bold">課題1方策：シフト調整の細分化・ICT化（情報管理）</text>
  <text x="130" y="350" fill="#555" font-size="10">効果：農場管理の効率化、障害：システム導入コスト</text>
  <text x="130" y="366" fill="#555" font-size="10">留意：パート従業員モチベーション（経済性管理）← トレードオフ</text>
  <line x1="110" y1="376" x2="540" y2="376" stroke="#d7d7d7" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="120" y="396" fill="#1a3a5c" font-size="11" font-weight="bold">課題2方策：グループウェア導入・農場業務分担（安全管理）</text>
  <text x="130" y="410" fill="#555" font-size="10">効果：複数農場の安全確保、障害：マニュアル整備の負担</text>
</svg>