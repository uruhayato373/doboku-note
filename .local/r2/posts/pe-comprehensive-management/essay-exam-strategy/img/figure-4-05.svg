<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" style="max-width:560px;width:100%" role="img" aria-label="figure 4 05" font-family='Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif'>
  <rect x="10" y="10" width="540" height="280" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="280" y="38" text-anchor="middle" fill="#1a3a5c" font-size="14" font-weight="bold">働き方に変化を及ぼした具体的な事象</text>
  <line x1="20" y1="48" x2="540" y2="48" stroke="#2e6da4" stroke-width="1"/>
  <text x="30" y="72" fill="#222" font-size="12">● 建設現場や工場における危険作業の機械化による安全性の向上</text>
  <text x="30" y="96" fill="#222" font-size="12">● コンピュータの発達による設計作業や事務作業の効率化</text>
  <text x="30" y="120" fill="#222" font-size="12">● 交通網の発達に伴う地域間の協働や交流の活性化</text>
  <text x="30" y="144" fill="#222" font-size="12">● 情報通信技術の普及に伴う地域間の協働と遠距離での勤務</text>
  <text x="30" y="168" fill="#222" font-size="12">● 場所の多様化</text>
  <text x="30" y="192" fill="#222" font-size="12">● 社会環境意識の高まりに伴う従来型雇用制度の見直し</text>
  <text x="30" y="216" fill="#222" font-size="12">● 熟練労働者の減少と社会的に就労機会向上による女性の社会進出</text>
  <text x="30" y="240" fill="#222" font-size="12">● いわゆる男女雇用機会均等法による女性の社会進出加速</text>
  <text x="30" y="264" fill="#222" font-size="12">● 社会的、政策的な変化</text>
</svg>