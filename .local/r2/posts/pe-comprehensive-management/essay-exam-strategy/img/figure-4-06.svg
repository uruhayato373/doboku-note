<svg xmlns="http://www.w3.org/2000/svg" width="560" height="200" viewBox="0 0 560 200">
  <rect x="10" y="10" width="220" height="80" rx="8" fill="#1a3a5c"/>
  <text x="120" y="42" text-anchor="middle" fill="white" font-size="13" font-weight="bold">働き方改革について</text>
  <text x="120" y="60" text-anchor="middle" fill="white" font-size="13" font-weight="bold">考えていくべきこと</text>
  <text x="120" y="82" text-anchor="middle" fill="white" font-size="11">（必要性、具体的な方策、</text>
  <text x="120" y="96" text-anchor="middle" fill="white" font-size="11">　その影響等）</text>
  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1a3a5c"/>
    </marker>
  </defs>
  <line x1="232" y1="50" x2="258" y2="50" stroke="#1a3a5c" stroke-width="2" marker-end="url(#arr2)"/>
  <rect x="260" y="10" width="290" height="180" rx="8" fill="#e8f4e8" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="405" y="35" text-anchor="middle" fill="#1a3a5c" font-size="13" font-weight="bold">5つの管理の視点から記述</text>
  <line x1="272" y1="44" x2="540" y2="44" stroke="#2e6da4" stroke-width="1"/>
  <text x="278" y="66" fill="#333" font-size="12">① 経済性管理の視点</text>
  <text x="278" y="88" fill="#333" font-size="12">② 安全管理の視点</text>
  <text x="278" y="110" fill="#333" font-size="12">③ 情報管理の視点</text>
  <text x="278" y="132" fill="#333" font-size="12">④ 人的資源管理の視点</text>
  <text x="278" y="154" fill="#333" font-size="12">⑤ 社会環境管理の視点</text>
  <text x="278" y="176" fill="#666" font-size="11">＋　トレードオフへの対応</text>
</svg>