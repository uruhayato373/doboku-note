<svg xmlns="http://www.w3.org/2000/svg" width="560" height="600" viewBox="0 0 560 600" style="max-width:560px;width:100%" role="img" aria-label="総監論文の三層構造：Ⅰ管理対象と前提条件→Ⅱ施策（効果＋トレードオフ）→Ⅲ将来展望と最大リスク（管理行為で克服）の因果連鎖" font-family='Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif'>
  <!-- title -->
  <text x="280" y="22" text-anchor="middle" fill="#1a3a5c" font-size="13" font-weight="bold">総監論文の三層構造（因果構造）</text>

  <!-- Layer 1: Ⅰ -->
  <rect x="20" y="40" width="520" height="135" fill="#e8f0fe" stroke="#2e6da4" stroke-width="2" rx="6"/>
  <text x="40" y="65" fill="#1a3a5c" font-size="14" font-weight="bold">Ⅰ　管理対象と前提条件の設定</text>
  <text x="40" y="85" fill="#555" font-size="11">論文全体の設計図 — 後段で扱う課題が成立する条件を意図的に仕込む</text>
  <line x1="40" y1="96" x2="520" y2="96" stroke="#2e6da4" stroke-width="0.5" stroke-dasharray="3,2"/>
  <text x="40" y="118" fill="#222" font-size="12" font-weight="bold">・管理対象を明確にする（自社の○○事業部 等）</text>
  <text x="40" y="138" fill="#222" font-size="12" font-weight="bold">・立場・役割を明示する（PM／部門長／経営層）</text>
  <text x="40" y="158" fill="#222" font-size="12" font-weight="bold">・前提条件を置く（人手不足／予算制約／工期 等）</text>

  <!-- Arrow 1 -->
  <line x1="280" y1="180" x2="280" y2="208" stroke="#2e6da4" stroke-width="2"/>
  <polygon points="275,206 285,206 280,218" fill="#2e6da4"/>
  <text x="295" y="195" fill="#555" font-size="11">Ⅰ の条件があるから</text>
  <text x="295" y="210" fill="#555" font-size="11">Ⅱ の施策が成立する</text>

  <!-- Layer 2: Ⅱ -->
  <rect x="20" y="225" width="520" height="170" fill="#e8f0fe" stroke="#2e6da4" stroke-width="2" rx="6"/>
  <text x="40" y="250" fill="#1a3a5c" font-size="14" font-weight="bold">Ⅱ　現実的な施策・方策の提示</text>
  <text x="40" y="270" fill="#555" font-size="11">Ⅰ の条件下で総監技術者として取れる具体策 — 最も点差がつく</text>
  <line x1="40" y1="281" x2="520" y2="281" stroke="#2e6da4" stroke-width="0.5" stroke-dasharray="3,2"/>
  <text x="40" y="303" fill="#222" font-size="12" font-weight="bold">・近い将来導入可能 / 自分の権限で動かせる</text>
  <text x="40" y="323" fill="#222" font-size="12" font-weight="bold">・効果（どの管理分野にどう影響するか）</text>
  <text x="40" y="350" fill="#d4a017" font-size="12" font-weight="bold">＋ トレードオフ（管理間の衝突）を必ずセットで書く</text>
  <text x="60" y="370" fill="#555" font-size="11">典型: 経済性↔人的資源 ／ 情報↔安全 ／ 効率化↔品質・安全</text>
  <text x="60" y="385" fill="#555" font-size="11">問題点は「施策の否定」でなく「管理すべき対象」として書く</text>

  <!-- Arrow 2 -->
  <line x1="280" y1="400" x2="280" y2="428" stroke="#2e6da4" stroke-width="2"/>
  <polygon points="275,426 285,426 280,438" fill="#2e6da4"/>
  <text x="295" y="415" fill="#555" font-size="11">Ⅱ を進めた結果として</text>
  <text x="295" y="430" fill="#555" font-size="11">将来課題が自然に顕在化</text>

  <!-- Layer 3: Ⅲ -->
  <rect x="20" y="445" width="520" height="140" fill="#e8f0fe" stroke="#2e6da4" stroke-width="2" rx="6"/>
  <text x="40" y="470" fill="#1a3a5c" font-size="14" font-weight="bold">Ⅲ　将来展望と最大のリスク</text>
  <text x="40" y="490" fill="#555" font-size="11">Ⅱ を進めた先に顕在化する構造的課題 — リスクは 1 つに絞る</text>
  <line x1="40" y1="501" x2="520" y2="501" stroke="#2e6da4" stroke-width="0.5" stroke-dasharray="3,2"/>
  <text x="40" y="523" fill="#d4a017" font-size="12" font-weight="bold">・最大リスク 1 点（トレードオフ最大／組織弱点／規模拡大破綻）</text>
  <text x="40" y="545" fill="#222" font-size="12" font-weight="bold">・克服策 ＝ 管理行為（管理方法見直し・体制再設計・ルール整備）</text>
  <text x="40" y="568" fill="#555" font-size="11">→ 新技術導入で解決しない。これが「総合技術監理」の行為そのもの</text>
</svg>
