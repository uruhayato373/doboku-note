<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" style="max-width:560px;width:100%">
  <!-- Answer sheet border -->
  <rect x="10" y="10" width="540" height="300" rx="4" fill="white" stroke="#333" stroke-width="2"/>
  <!-- Header row -->
  <rect x="10" y="10" width="540" height="50" rx="0" fill="#eee" stroke="#333" stroke-width="1"/>
  <text x="30" y="28" fill="#333" font-size="10">受験番号</text>
  <rect x="80" y="16" width="120" height="18" rx="2" fill="white" stroke="#999" stroke-width="1"/>
  <text x="230" y="28" fill="#333" font-size="10">問題番号</text>
  <rect x="280" y="16" width="80" height="18" rx="2" fill="white" stroke="#999" stroke-width="1"/>
  <text x="380" y="28" fill="#333" font-size="10">答案用紙</text>
  <rect x="430" y="16" width="40" height="18" rx="2" fill="white" stroke="#999" stroke-width="1"/>
  <text x="478" y="28" fill="#333" font-size="10">枚中</text>
  <rect x="498" y="16" width="40" height="18" rx="2" fill="white" stroke="#999" stroke-width="1"/>
  <text x="555" y="28" text-anchor="end" fill="#333" font-size="10">枚目</text>
  <text x="30" y="52" fill="#333" font-size="9">取り上げる業務の内容：</text>
  <!-- Columns header -->
  <line x1="10" y1="60" x2="550" y2="60" stroke="#333" stroke-width="1"/>
  <rect x="10" y="60" width="60" height="250" fill="#e8eef5" stroke="#333" stroke-width="1"/>
  <!-- 大項目 label rotated -->
  <text x="40" y="160" text-anchor="middle" fill="#1a3a5c" font-size="12" font-weight="bold" transform="rotate(-90, 40, 160)">大項目</text>
  <!-- 中項目 -->
  <rect x="70" y="60" width="60" height="250" fill="#f0f5ff" stroke="#333" stroke-width="1"/>
  <text x="100" y="180" text-anchor="middle" fill="#1a3a5c" font-size="11" transform="rotate(-90, 100, 180)">中項目</text>
  <!-- 小項目 -->
  <rect x="130" y="60" width="60" height="250" fill="#f8f9ff" stroke="#333" stroke-width="1"/>
  <text x="160" y="180" text-anchor="middle" fill="#1a3a5c" font-size="11" transform="rotate(-90, 160, 180)">小項目</text>
  <!-- Writing area with grid -->
  <rect x="190" y="60" width="360" height="250" fill="white" stroke="#333" stroke-width="1"/>
  <!-- Grid lines -->
  <g stroke="#ddd" stroke-width="0.5">
    <line x1="190" y1="80" x2="550" y2="80"/>
    <line x1="190" y1="100" x2="550" y2="100"/>
    <line x1="190" y1="120" x2="550" y2="120"/>
    <line x1="190" y1="140" x2="550" y2="140"/>
    <line x1="190" y1="160" x2="550" y2="160"/>
    <line x1="190" y1="180" x2="550" y2="180"/>
    <line x1="190" y1="200" x2="550" y2="200"/>
    <line x1="190" y1="220" x2="550" y2="220"/>
    <line x1="190" y1="240" x2="550" y2="240"/>
    <line x1="190" y1="260" x2="550" y2="260"/>
    <line x1="190" y1="280" x2="550" y2="280"/>
    <line x1="190" y1="300" x2="550" y2="300"/>
  </g>
  <!-- Arrows indicating structure -->
  <defs>
    <marker id="arr7" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#c0392b"/>
    </marker>
  </defs>
  <line x1="40" y1="312" x2="40" y2="320" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr7)"/>
  <line x1="100" y1="312" x2="100" y2="320" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr7)"/>
  <line x1="160" y1="312" x2="160" y2="320" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr7)"/>
  <text x="280" y="314" text-anchor="middle" fill="#666" font-size="10">本文記述エリア（方眼状）</text>
</svg>