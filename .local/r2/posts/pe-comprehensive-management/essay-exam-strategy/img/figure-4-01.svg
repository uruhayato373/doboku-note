<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200" style="max-width:600px;width:100%">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1a3a5c"/>
    </marker>
  </defs>
  <!-- Steps -->
  <g>
    <!-- Step 1 -->
    <rect x="10" y="70" width="95" height="60" rx="6" fill="#1a3a5c"/>
    <text x="57" y="94" text-anchor="middle" fill="white" font-size="11" font-weight="bold">ステップ1</text>
    <text x="57" y="112" text-anchor="middle" fill="white" font-size="10">前文の</text>
    <text x="57" y="125" text-anchor="middle" fill="white" font-size="10">分析</text>
    <!-- Arrow -->
    <line x1="107" y1="100" x2="118" y2="100" stroke="#1a3a5c" stroke-width="2" marker-end="url(#arr)"/>
    <!-- Step 2 -->
    <rect x="120" y="70" width="95" height="60" rx="6" fill="#2e6da4"/>
    <text x="167" y="94" text-anchor="middle" fill="white" font-size="11" font-weight="bold">ステップ2</text>
    <text x="167" y="112" text-anchor="middle" fill="white" font-size="10">論文骨子の</text>
    <text x="167" y="125" text-anchor="middle" fill="white" font-size="10">構成</text>
    <!-- Arrow -->
    <line x1="217" y1="100" x2="228" y2="100" stroke="#1a3a5c" stroke-width="2" marker-end="url(#arr)"/>
    <!-- Step 3 -->
    <rect x="230" y="70" width="95" height="60" rx="6" fill="#2e6da4"/>
    <text x="277" y="94" text-anchor="middle" fill="white" font-size="11" font-weight="bold">ステップ3</text>
    <text x="277" y="108" text-anchor="middle" fill="white" font-size="10">準備題材の</text>
    <text x="277" y="121" text-anchor="middle" fill="white" font-size="10">活用と</text>
    <text x="277" y="134" text-anchor="middle" fill="white" font-size="10">骨子の肉付け</text>
    <!-- Arrow -->
    <line x1="327" y1="100" x2="338" y2="100" stroke="#1a3a5c" stroke-width="2" marker-end="url(#arr)"/>
    <!-- Step 4 -->
    <rect x="340" y="70" width="95" height="60" rx="6" fill="#2e6da4"/>
    <text x="387" y="94" text-anchor="middle" fill="white" font-size="11" font-weight="bold">ステップ4</text>
    <text x="387" y="112" text-anchor="middle" fill="white" font-size="10">論文評価</text>
    <text x="387" y="125" text-anchor="middle" fill="white" font-size="10">基準の確認</text>
    <!-- Arrow -->
    <line x1="437" y1="100" x2="448" y2="100" stroke="#1a3a5c" stroke-width="2" marker-end="url(#arr)"/>
    <!-- Step 5 -->
    <rect x="450" y="70" width="95" height="60" rx="6" fill="#c0392b"/>
    <text x="497" y="94" text-anchor="middle" fill="white" font-size="11" font-weight="bold">ステップ5</text>
    <text x="497" y="112" text-anchor="middle" fill="white" font-size="10">いざ</text>
    <text x="497" y="125" text-anchor="middle" fill="white" font-size="10">執筆！</text>
  </g>
</svg>