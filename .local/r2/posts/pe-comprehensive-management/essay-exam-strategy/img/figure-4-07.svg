<svg xmlns="http://www.w3.org/2000/svg" width="500" height="340" viewBox="0 0 500 340" style="max-width:500px;width:100%">
  <!-- Center ellipse -->
  <ellipse cx="250" cy="170" rx="80" ry="55" fill="#1a3a5c"/>
  <text x="250" y="158" text-anchor="middle" fill="white" font-size="13" font-weight="bold">働き方改革</text>
  <text x="250" y="175" text-anchor="middle" fill="white" font-size="13" font-weight="bold">についての</text>
  <text x="250" y="192" text-anchor="middle" fill="white" font-size="12">総監の視点</text>
  <!-- Top: 安全管理 -->
  <rect x="175" y="10" width="150" height="42" rx="6" fill="#2e6da4"/>
  <text x="250" y="32" text-anchor="middle" fill="white" font-size="13" font-weight="bold">安全管理</text>
  <text x="250" y="47" text-anchor="middle" fill="white" font-size="11">機械化等による安全性の向上</text>
  <line x1="250" y1="54" x2="250" y2="115" stroke="#2e6da4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Bottom: 社会環境管理 -->
  <rect x="165" y="290" width="170" height="42" rx="6" fill="#2e6da4"/>
  <text x="250" y="312" text-anchor="middle" fill="white" font-size="13" font-weight="bold">社会環境管理</text>
  <text x="250" y="327" text-anchor="middle" fill="white" font-size="11">男女均等・多様な働き方</text>
  <line x1="250" y1="228" x2="250" y2="288" stroke="#2e6da4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Left top: 経済性管理 -->
  <rect x="10" y="70" width="140" height="42" rx="6" fill="#2e6da4"/>
  <text x="80" y="90" text-anchor="middle" fill="white" font-size="13" font-weight="bold">経済性管理</text>
  <text x="80" y="106" text-anchor="middle" fill="white" font-size="11">労働生産性の向上</text>
  <line x1="152" y1="94" x2="172" y2="145" stroke="#2e6da4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Left bottom: 情報管理 -->
  <rect x="10" y="225" width="140" height="42" rx="6" fill="#2e6da4"/>
  <text x="80" y="245" text-anchor="middle" fill="white" font-size="13" font-weight="bold">情報管理</text>
  <text x="80" y="261" text-anchor="middle" fill="white" font-size="11">ICT・デジタル活用</text>
  <line x1="152" y1="247" x2="172" y2="205" stroke="#2e6da4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Right: 人的資源管理 -->
  <rect x="350" y="148" width="140" height="44" rx="6" fill="#2e6da4"/>
  <text x="420" y="168" text-anchor="middle" fill="white" font-size="13" font-weight="bold">人的資源管理</text>
  <text x="420" y="184" text-anchor="middle" fill="white" font-size="11">多様な人材の活用</text>
  <line x1="350" y1="170" x2="332" y2="170" stroke="#2e6da4" stroke-width="1.5" stroke-dasharray="4,3"/>
</svg>