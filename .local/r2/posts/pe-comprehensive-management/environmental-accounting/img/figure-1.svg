<!-- viewBox=480 理由: 顕示選好3手法 vs 表明選好2手法の2カラム比較図。各カラムに3行ラベルを横並びに配置するため幅480が最小必要。高さ505で4:5比に近い -->
<svg viewBox="0 0 480 505" xmlns="http://www.w3.org/2000/svg" style="max-width:480px;width:100%" role="img" aria-label="環境の経済価値評価5手法。顕示選好型（代替法・トラベルコスト法・ヘドニック法）と表明選好型（仮想評価法CVM・コンジョイント分析）を2カラムで対比した図">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      /* 見出し帯テキスト */
      .t-header  { font-size: 14px; font-weight: bold; fill: #1a3a5c; }
      /* 手法名 */
      .t-method  { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      /* 根拠ラベル（補足） */
      .t-basis   { font-size: 11px; fill: #555; }
      /* タイトル */
      .t-title   { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      /* フッター */
      .t-foot    { font-size: 11px; fill: #8a8a8a; }
      /* カラムヘッダ背景: brand=顕示選好 */
      .hdr-brand   { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; } /* brand系 */
      /* カラムヘッダ背景: positive=表明選好 */
      .hdr-positive { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; } /* positive系 */
      /* 手法カード: brand */
      .card-brand   { fill: #f4f7fe; stroke: #2e6da4; stroke-width: 1; }
      /* 手法カード: positive */
      .card-positive { fill: #f0f8f0; stroke: #3a7d44; stroke-width: 1; }
      /* 仕切り線 */
      .divider { stroke: #d7d7d7; stroke-width: 1; }
    </style>
  </defs>

  <!-- ===== タイトル ===== -->
  <text class="t-title" x="240" y="28" text-anchor="middle">環境の経済価値評価5手法</text>
  <text class="t-basis" x="240" y="46" text-anchor="middle">総監テキスト §3-(3)　図表5.11</text>

  <!-- ===== 列見出し帯 ===== -->
  <!-- 顕示選好型 -->
  <rect class="hdr-brand" x="16" y="60" width="216" height="40" rx="6"/>
  <text class="t-header" x="124" y="78" text-anchor="middle">顕示選好型評価</text>
  <text class="t-basis"  x="124" y="93" text-anchor="middle">実消費行動データを間接利用</text>

  <!-- 表明選好型 -->
  <rect class="hdr-positive" x="248" y="60" width="216" height="40" rx="6"/>
  <text class="t-header" x="356" y="78" text-anchor="middle">表明選好型評価</text>
  <text class="t-basis"  x="356" y="93" text-anchor="middle">アンケートで直接評価</text>

  <!-- ===== 中央仕切り ===== -->
  <line class="divider" x1="240" y1="58" x2="240" y2="470"/>

  <!-- ===== 顕示選好型 3手法 ===== -->

  <!-- 手法1: 代替法 -->
  <rect class="card-brand" x="24" y="116" width="200" height="84" rx="6"/>
  <text class="t-method" x="124" y="139" text-anchor="middle">代替法</text>
  <line class="divider" x1="40" y1="147" x2="208" y2="147"/>
  <text class="t-basis" x="124" y="163" text-anchor="middle">環境財を市場財に置換した</text>
  <text class="t-basis" x="124" y="178" text-anchor="middle">費用で評価</text>
  <text class="t-basis" x="124" y="194" text-anchor="middle">例: 干潟 → 水質浄化装置費</text>

  <!-- 手法2: トラベルコスト法 -->
  <rect class="card-brand" x="24" y="212" width="200" height="84" rx="6"/>
  <text class="t-method" x="124" y="235" text-anchor="middle">トラベルコスト法</text>
  <line class="divider" x1="40" y1="243" x2="208" y2="243"/>
  <text class="t-basis" x="124" y="259" text-anchor="middle">目的地への旅行費用を</text>
  <text class="t-basis" x="124" y="274" text-anchor="middle">もとに訪問価値を評価</text>
  <text class="t-basis" x="124" y="290" text-anchor="middle">例: 自然公園の利用価値</text>

  <!-- 手法3: ヘドニック法 -->
  <rect class="card-brand" x="24" y="308" width="200" height="84" rx="6"/>
  <text class="t-method" x="124" y="331" text-anchor="middle">ヘドニック法</text>
  <line class="divider" x1="40" y1="339" x2="208" y2="339"/>
  <text class="t-basis" x="124" y="355" text-anchor="middle">地代・賃金など市場データ</text>
  <text class="t-basis" x="124" y="370" text-anchor="middle">（地価）をもとに評価</text>
  <text class="t-basis" x="124" y="386" text-anchor="middle">例: 騒音が地価に与える影響</text>

  <!-- ===== 表明選好型 2手法 ===== -->

  <!-- 手法4: 仮想評価法(CVM) -->
  <rect class="card-positive" x="256" y="116" width="200" height="84" rx="6"/>
  <text class="t-method" x="356" y="135" text-anchor="middle">仮想評価法（CVM）</text>
  <line class="divider" x1="272" y1="143" x2="440" y2="143"/>
  <text class="t-basis" x="356" y="159" text-anchor="middle">支払意志額・受入補償額を</text>
  <text class="t-basis" x="356" y="174" text-anchor="middle">アンケートで直接評価</text>
  <text class="t-basis" x="356" y="190" text-anchor="middle">例: 生物多様性・干潟の価値</text>

  <!-- 手法5: コンジョイント分析 -->
  <rect class="card-positive" x="256" y="212" width="200" height="84" rx="6"/>
  <text class="t-method" x="356" y="231" text-anchor="middle">コンジョイント分析</text>
  <line class="divider" x1="272" y1="239" x2="440" y2="239"/>
  <text class="t-basis" x="356" y="255" text-anchor="middle">複数の代替案の属性を</text>
  <text class="t-basis" x="356" y="270" text-anchor="middle">アンケートで比較・評価</text>
  <text class="t-basis" x="356" y="286" text-anchor="middle">例: 海洋汚染防止・森林整備</text>

  <!-- ===== 共通特性ボックス ===== -->
  <!-- 顕示選好: 共通特性 -->
  <rect x="24" y="404" width="200" height="48" rx="5" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/><!-- surface -->
  <text class="t-basis" x="124" y="423" text-anchor="middle" font-weight="bold" fill="#1a3a5c">共通の特徴</text>
  <text class="t-basis" x="124" y="440" text-anchor="middle">情報入手コストが小さい</text>
  <text class="t-basis" x="124" y="454" text-anchor="middle">適用範囲が限定される</text>

  <!-- 表明選好: 共通特性 -->
  <rect x="256" y="404" width="200" height="48" rx="5" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/><!-- surface -->
  <text class="t-basis" x="356" y="423" text-anchor="middle" font-weight="bold" fill="#1a3a5c">共通の特徴</text>
  <text class="t-basis" x="356" y="440" text-anchor="middle">適用範囲が広い（非利用価値も）</text>
  <text class="t-basis" x="356" y="454" text-anchor="middle">情報入手コストが大きい</text>

  <!-- ===== フッター ===== -->
</svg>
