<svg width="400" height="188" viewBox="0 0 400 188"
     xmlns="http://www.w3.org/2000/svg"
     style="max-width:400px;width:100%"
     role="img"
     aria-label="ERP による業務統合。財務会計・管理会計・人事・販売・購買・生産の各業務モジュールが、単一の統合データベースを共有して部門横断でデータを一元管理する。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-mod   { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .t-code  { font-size: 11px; fill: #8a8a8a; }
      .t-db    { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-cap   { font-size: 11px; fill: #555; }
      .box-mod { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-db  { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .conn    { stroke: #3a7d44; stroke-width: 1.5; }
    </style>
  </defs>

  <text class="t-title" x="200" y="24" text-anchor="middle">ERP による業務統合</text>

  <!-- 業務モジュール -->
  <g>
    <rect class="box-mod" x="16"  y="40" width="58" height="46" rx="6"/>
    <text class="t-mod"  x="45"  y="62" text-anchor="middle">財務会計</text>
    <text class="t-code" x="45"  y="78" text-anchor="middle">FI</text>
    <rect class="box-mod" x="78"  y="40" width="58" height="46" rx="6"/>
    <text class="t-mod"  x="107" y="62" text-anchor="middle">管理会計</text>
    <text class="t-code" x="107" y="78" text-anchor="middle">CO</text>
    <rect class="box-mod" x="140" y="40" width="58" height="46" rx="6"/>
    <text class="t-mod"  x="169" y="62" text-anchor="middle">人事管理</text>
    <text class="t-code" x="169" y="78" text-anchor="middle">HR</text>
    <rect class="box-mod" x="202" y="40" width="58" height="46" rx="6"/>
    <text class="t-mod"  x="231" y="62" text-anchor="middle">販売管理</text>
    <text class="t-code" x="231" y="78" text-anchor="middle">SD</text>
    <rect class="box-mod" x="264" y="40" width="58" height="46" rx="6"/>
    <text class="t-mod"  x="293" y="62" text-anchor="middle">購買管理</text>
    <text class="t-code" x="293" y="78" text-anchor="middle">MM</text>
    <rect class="box-mod" x="326" y="40" width="58" height="46" rx="6"/>
    <text class="t-mod"  x="355" y="62" text-anchor="middle">生産管理</text>
    <text class="t-code" x="355" y="78" text-anchor="middle">PP</text>
  </g>

  <!-- 接続線 -->
  <line class="conn" x1="45"  y1="86" x2="45"  y2="104"/>
  <line class="conn" x1="107" y1="86" x2="107" y2="104"/>
  <line class="conn" x1="169" y1="86" x2="169" y2="104"/>
  <line class="conn" x1="231" y1="86" x2="231" y2="104"/>
  <line class="conn" x1="293" y1="86" x2="293" y2="104"/>
  <line class="conn" x1="355" y1="86" x2="355" y2="104"/>

  <!-- 統合データベース -->
  <rect class="box-db" x="16" y="104" width="368" height="44" rx="8"/>
  <text class="t-db" x="200" y="131" text-anchor="middle">ERP：統合データベース（経営資源を一元管理）</text>

  <!-- キャプション -->
  <text class="t-cap" x="200" y="172" text-anchor="middle">各モジュールが単一のデータベースを共有し、部門横断で連携する</text>
</svg>
