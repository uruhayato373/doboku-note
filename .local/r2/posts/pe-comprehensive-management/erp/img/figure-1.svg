<svg width="400" height="500" viewBox="0 0 400 500"
     xmlns="http://www.w3.org/2000/svg"
     style="max-width:400px;width:100%"
     role="img"
     aria-label="ERP による業務統合。財務会計・管理会計・人事・販売・購買・生産の各業務モジュールが、単一の統合データベースを共有して部門横断でデータを一元管理する。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-mod   { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-code  { font-size: 11px; fill: #8a8a8a; }
      .t-db    { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-cap   { font-size: 11px; fill: #555; }
      .t-leg   { font-size: 11px; fill: #555; }
      .box-mod { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-db  { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-surface { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1; }
      .conn    { stroke: #3a7d44; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- 業務モジュール 上段（3つ） -->
  <rect class="box-mod" x="20"  y="20" width="108" height="70" rx="6"/>
  <text class="t-mod"  x="74"  y="53" text-anchor="middle">財務会計</text>
  <text class="t-code" x="74"  y="72" text-anchor="middle">FI</text>

  <rect class="box-mod" x="146" y="20" width="108" height="70" rx="6"/>
  <text class="t-mod"  x="200" y="53" text-anchor="middle">管理会計</text>
  <text class="t-code" x="200" y="72" text-anchor="middle">CO</text>

  <rect class="box-mod" x="272" y="20" width="108" height="70" rx="6"/>
  <text class="t-mod"  x="326" y="53" text-anchor="middle">人事管理</text>
  <text class="t-code" x="326" y="72" text-anchor="middle">HR</text>

  <!-- 業務モジュール 下段（3つ） -->
  <rect class="box-mod" x="20"  y="108" width="108" height="70" rx="6"/>
  <text class="t-mod"  x="74"  y="141" text-anchor="middle">販売管理</text>
  <text class="t-code" x="74"  y="160" text-anchor="middle">SD</text>

  <rect class="box-mod" x="146" y="108" width="108" height="70" rx="6"/>
  <text class="t-mod"  x="200" y="141" text-anchor="middle">購買管理</text>
  <text class="t-code" x="200" y="160" text-anchor="middle">MM</text>

  <rect class="box-mod" x="272" y="108" width="108" height="70" rx="6"/>
  <text class="t-mod"  x="326" y="141" text-anchor="middle">生産管理</text>
  <text class="t-code" x="326" y="160" text-anchor="middle">PP</text>

  <!-- 接続線（上段 → DB） -->
  <line class="conn" x1="74"  y1="90"  x2="74"  y2="260"/>
  <line class="conn" x1="200" y1="90"  x2="200" y2="260"/>
  <line class="conn" x1="326" y1="90"  x2="326" y2="260"/>

  <!-- 接続線（下段 → DB） -->
  <line class="conn" x1="74"  y1="178" x2="74"  y2="260"/>
  <line class="conn" x1="200" y1="178" x2="200" y2="260"/>
  <line class="conn" x1="326" y1="178" x2="326" y2="260"/>

  <!-- 統合データベース -->
  <rect class="box-db" x="20" y="260" width="360" height="60" rx="8"/>
  <text class="t-db" x="200" y="291" text-anchor="middle">ERP：統合データベース</text>
  <text class="t-cap" x="200" y="310" text-anchor="middle">経営資源を一元管理</text>

  <!-- 比較表（従来 vs ERP） -->
  <rect class="box-surface" x="20" y="344" width="360" height="138" rx="6"/>
  <text class="t-leg" x="36" y="364" font-weight="bold" fill="#1a3a5c">従来システム vs ERP の違い</text>
  <!-- ヘッダー行 -->
  <line x1="20" y1="372" x2="380" y2="372" stroke="#d7d7d7" stroke-width="1"/>
  <text class="t-leg" x="36"  y="388" font-weight="bold" fill="#555">項目</text>
  <text class="t-leg" x="150" y="388" font-weight="bold" fill="#555">従来（部門別）</text>
  <text class="t-leg" x="280" y="388" font-weight="bold" fill="#555">ERP</text>
  <line x1="20" y1="396" x2="380" y2="396" stroke="#d7d7d7" stroke-width="1"/>
  <!-- 行1 -->
  <text class="t-leg" x="36"  y="414">データ管理</text>
  <text class="t-leg" x="150" y="414">部門ごとに分散</text>
  <text class="t-leg" x="280" y="414">一元管理</text>
  <!-- 行2 -->
  <text class="t-leg" x="36"  y="432">情報共有</text>
  <text class="t-leg" x="150" y="432">手動連携・遅延</text>
  <text class="t-leg" x="280" y="432">リアルタイム</text>
  <!-- 行3 -->
  <text class="t-leg" x="36"  y="450">経営判断</text>
  <text class="t-leg" x="150" y="450">データ収集に時間</text>
  <text class="t-leg" x="280" y="450">即時把握</text>
  <!-- 行4 -->
  <text class="t-leg" x="36"  y="470">整合性</text>
  <text class="t-leg" x="150" y="470">矛盾が生じやすい</text>
  <text class="t-leg" x="280" y="470">常に一貫</text>
</svg>
