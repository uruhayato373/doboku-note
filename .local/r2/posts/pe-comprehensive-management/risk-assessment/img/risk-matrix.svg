<svg width="400" height="280" viewBox="0 0 400 280"
     xmlns="http://www.w3.org/2000/svg"
     style="max-width:400px;width:100%"
     role="img"
     aria-label="リスクマトリクス：縦軸が生起確率（低・中・高）、横軸が影響度（小・中・大）の 3×3 マトリクス。右上ほどリスクが高く（赤）、左下ほど低い（緑）。点線矢印は右上から左下へのリスク低減方向を示す">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-title { font-size: 14px; font-weight: bold; fill: #1a3a5c; }
      .t-axis { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-mark { font-size: 12px; fill: #1a3a5c; }
      .t-cell { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-arrow-label { font-size: 11px; fill: #555; }
      .grid { stroke: #1a3a5c; stroke-width: 1; }
      .h-cell { fill: #f8d7da; }
      .m-cell { fill: #fff3cd; }
      .l-cell { fill: #d0e8d0; }
    </style>
    <marker id="arr-rm" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="#555" />
    </marker>
  </defs>

  <!-- タイトル -->
  <text x="200" y="20" class="t-title" text-anchor="middle">リスクマトリクス（生起確率 × 影響度）</text>

  <!-- 影響度ヘッダー（横軸） -->
  <rect x="100" y="40" width="270" height="26" fill="#e8f0fe" class="grid" />
  <text x="235" y="58" class="t-axis" text-anchor="middle">影響度</text>

  <!-- 影響度サブ：小・中・大 -->
  <rect x="100" y="66" width="90" height="24" fill="#e8f0fe" class="grid" />
  <rect x="190" y="66" width="90" height="24" fill="#e8f0fe" class="grid" />
  <rect x="280" y="66" width="90" height="24" fill="#e8f0fe" class="grid" />
  <text x="145" y="83" class="t-mark" text-anchor="middle">小</text>
  <text x="235" y="83" class="t-mark" text-anchor="middle">中</text>
  <text x="325" y="83" class="t-mark" text-anchor="middle">大</text>

  <!-- 生起確率ヘッダー（縦軸） -->
  <rect x="20" y="40" width="80" height="50" fill="#e8f0fe" class="grid" />
  <text x="60" y="62" class="t-axis" text-anchor="middle">生起</text>
  <text x="60" y="78" class="t-axis" text-anchor="middle">確率</text>

  <!-- 行：高（最上段） -->
  <rect x="20" y="90" width="80" height="50" fill="#e8f0fe" class="grid" />
  <text x="60" y="120" class="t-mark" text-anchor="middle">高</text>
  <rect x="100" y="90" width="90" height="50" class="m-cell grid" />
  <text x="145" y="120" class="t-cell" text-anchor="middle">中</text>
  <rect x="190" y="90" width="90" height="50" class="h-cell grid" />
  <text x="235" y="120" class="t-cell" text-anchor="middle">高</text>
  <rect x="280" y="90" width="90" height="50" class="h-cell grid" />
  <text x="325" y="120" class="t-cell" text-anchor="middle">高</text>

  <!-- 行：中 -->
  <rect x="20" y="140" width="80" height="50" fill="#e8f0fe" class="grid" />
  <text x="60" y="170" class="t-mark" text-anchor="middle">中</text>
  <rect x="100" y="140" width="90" height="50" class="l-cell grid" />
  <text x="145" y="170" class="t-cell" text-anchor="middle">低</text>
  <rect x="190" y="140" width="90" height="50" class="m-cell grid" />
  <text x="235" y="170" class="t-cell" text-anchor="middle">中</text>
  <rect x="280" y="140" width="90" height="50" class="h-cell grid" />
  <text x="325" y="170" class="t-cell" text-anchor="middle">高</text>

  <!-- 行：低（最下段） -->
  <rect x="20" y="190" width="80" height="50" fill="#e8f0fe" class="grid" />
  <text x="60" y="220" class="t-mark" text-anchor="middle">低</text>
  <rect x="100" y="190" width="90" height="50" class="l-cell grid" />
  <text x="145" y="220" class="t-cell" text-anchor="middle">低</text>
  <rect x="190" y="190" width="90" height="50" class="l-cell grid" />
  <text x="235" y="220" class="t-cell" text-anchor="middle">低</text>
  <rect x="280" y="190" width="90" height="50" class="m-cell grid" />
  <text x="325" y="220" class="t-cell" text-anchor="middle">中</text>

  <!-- 低減方向の矢印（右上 → 左下） -->
  <line x1="350" y1="100" x2="135" y2="225" stroke="#555" stroke-width="1.8" stroke-dasharray="6,3" marker-end="url(#arr-rm)" />
  <text x="200" y="265" class="t-arrow-label" text-anchor="middle">→ リスク低減方向（右上：高リスク／左下：低リスク）</text>
</svg>
