  <svg viewBox="0 0 440 200" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="11" style="max-width:440px;width:100%">
    <defs>
      <marker id="arrN" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5 z" fill="#333"/></marker>
    </defs>
    <!-- 軸 -->
    <line x1="20" y1="170" x2="420" y2="170" stroke="#333" stroke-width="1.5" marker-end="url(#arrN)"/>
    <line x1="220" y1="175" x2="220" y2="18" stroke="#333" stroke-width="1.5" marker-end="url(#arrN)"/>
    <!-- 正規分布曲線 -->
    <path d="M 30 168 C 60 168 80 165 100 148 C 120 128 140 85 160 50 C 175 28 195 18 220 16 C 245 18 265 28 280 50 C 300 85 320 128 340 148 C 360 165 380 168 410 168" stroke="#333" stroke-width="2.5" fill="none"/>
    <!-- 区切り縦線 -->
    <line x1="100" y1="148" x2="100" y2="170" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="160" y1="50" x2="160" y2="170" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="280" y1="50" x2="280" y2="170" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="340" y1="148" x2="340" y2="170" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
    <!-- 上側ラベル（寸法規格を消さない範囲） -->
    <text x="20" y="185" text-anchor="middle" fill="#555" font-size="10">−3σ</text>
    <text x="100" y="185" text-anchor="middle" fill="#555" font-size="10">−2σ</text>
    <text x="160" y="185" text-anchor="middle" fill="#555" font-size="10">−σ</text>
    <text x="220" y="185" text-anchor="middle" fill="#555" font-size="10">0</text>
    <text x="280" y="185" text-anchor="middle" fill="#555" font-size="10">σ</text>
    <text x="340" y="185" text-anchor="middle" fill="#555" font-size="10">2σ</text>
    <text x="415" y="185" text-anchor="middle" fill="#555" font-size="10">3σ</text>
    <!-- %ラベル -->
    <text x="220" y="120" text-anchor="middle" fill="#222" font-size="10">68.3%</text>
    <text x="220" y="135" text-anchor="middle" fill="#222" font-size="10">95.4%</text>
    <text x="220" y="150" text-anchor="middle" fill="#222" font-size="10">99.7%</text>
    <!-- ブラケット（水平線） -->
    <line x1="160" y1="118" x2="280" y2="118" stroke="#666" stroke-width="1"/>
    <line x1="100" y1="133" x2="340" y2="133" stroke="#666" stroke-width="1"/>
    <line x1="22"  y1="148" x2="408" y2="148" stroke="#666" stroke-width="1"/>
    <!-- タイトル -->
    <text x="220" y="12" text-anchor="middle" fill="#333" font-weight="bold" font-size="12">図　正規分布図</text>
    <!-- 寸法規格ラベル -->
    <text x="40" y="158" fill="#888" font-size="9">寸法規格を</text>
    <text x="40" y="167" fill="#888" font-size="9">満さない範囲</text>
  </svg>