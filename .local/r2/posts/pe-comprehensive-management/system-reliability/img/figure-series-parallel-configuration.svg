  <svg width="400" height="500" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="12" style="max-width:400px;width:100%" role="img" aria-label="システム構成図（直列・並列）">
    <defs>
      <marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5 z" fill="#555"/></marker>
    </defs>
    <!-- scale 420 -> 400: 400/420 = 0.9524, shift cx 0, content orig height 180 * 0.9524 = 171 -->
    <g transform="scale(0.9524 0.9524) translate(0 0)">
      <!-- 入力線 -->
      <line x1="10" y1="90" x2="60" y2="90" stroke="#555" stroke-width="2"/>
      <!-- 分岐点 -->
      <circle cx="60" cy="90" r="4" fill="#222"/>
      <!-- 上段線（ユニット1 → ユニット2） -->
      <line x1="60" y1="90" x2="60" y2="45" stroke="#555" stroke-width="1.5"/>
      <line x1="60" y1="45" x2="100" y2="45" stroke="#555" stroke-width="1.5"/>
      <rect x="100" y="28" width="90" height="34" rx="4" fill="#555" stroke="#222"/>
      <text x="145" y="43" text-anchor="middle" fill="#ffffff" font-size="11">ユニット1</text>
      <text x="145" y="56" text-anchor="middle" fill="#d7d7d7" font-size="10">（信頼度 R₁）</text>
      <line x1="190" y1="45" x2="230" y2="45" stroke="#555" stroke-width="1.5"/>
      <rect x="230" y="28" width="90" height="34" rx="4" fill="#555" stroke="#222"/>
      <text x="275" y="43" text-anchor="middle" fill="#ffffff" font-size="11">ユニット2</text>
      <text x="275" y="56" text-anchor="middle" fill="#d7d7d7" font-size="10">（信頼度 R₂）</text>
      <line x1="320" y1="45" x2="360" y2="45" stroke="#555" stroke-width="1.5"/>
      <line x1="360" y1="45" x2="360" y2="90" stroke="#555" stroke-width="1.5"/>
      <!-- 下段線（ユニット3 → ユニット4） -->
      <line x1="60" y1="90" x2="60" y2="135" stroke="#555" stroke-width="1.5"/>
      <line x1="60" y1="135" x2="100" y2="135" stroke="#555" stroke-width="1.5"/>
      <rect x="100" y="118" width="90" height="34" rx="4" fill="#555" stroke="#222"/>
      <text x="145" y="133" text-anchor="middle" fill="#ffffff" font-size="11">ユニット3</text>
      <text x="145" y="146" text-anchor="middle" fill="#d7d7d7" font-size="10">（信頼度 R₃）</text>
      <line x1="190" y1="135" x2="230" y2="135" stroke="#555" stroke-width="1.5"/>
      <rect x="230" y="118" width="90" height="34" rx="4" fill="#555" stroke="#222"/>
      <text x="275" y="133" text-anchor="middle" fill="#ffffff" font-size="11">ユニット4</text>
      <text x="275" y="146" text-anchor="middle" fill="#d7d7d7" font-size="10">（信頼度 R₄）</text>
      <line x1="320" y1="135" x2="360" y2="135" stroke="#555" stroke-width="1.5"/>
      <line x1="360" y1="135" x2="360" y2="90" stroke="#555" stroke-width="1.5"/>
      <!-- 合流点 -->
      <circle cx="360" cy="90" r="4" fill="#222"/>
      <line x1="360" y1="90" x2="395" y2="90" stroke="#555" stroke-width="2" marker-end="url(#ar)"/>
      <!-- ラベル -->
      <text x="8" y="82" fill="#555" font-size="10">入力</text>
      <text x="362" y="78" fill="#555" font-size="10">出力</text>
    </g>

    <!-- サマリー（180 * 0.9524 = 171.4 → 余白 328px） -->
    <line x1="20" y1="186" x2="380" y2="186" stroke="#d7d7d7" stroke-width="1"/>
    <text x="200" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3a5c" font-family="sans-serif">上下並列 × 左右直列の複合構成</text>

    <rect x="20" y="230" width="360" height="80" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
    <text x="30" y="252" font-size="11" fill="#1a3a5c" font-family="sans-serif" font-weight="bold">直列接続（上段 / 下段それぞれ）</text>
    <text x="30" y="272" font-size="11" fill="#555" font-family="sans-serif">・信頼度 = R₁ × R₂（上段）または R₃ × R₄（下段）</text>
    <text x="30" y="292" font-size="11" fill="#555" font-family="sans-serif">・1 ユニット故障でその経路が断絶する</text>

    <rect x="20" y="324" width="360" height="80" rx="6" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
    <text x="30" y="346" font-size="11" fill="#1a3a5c" font-family="sans-serif" font-weight="bold">並列接続（上段・下段の組み合わせ）</text>
    <text x="30" y="366" font-size="11" fill="#555" font-family="sans-serif">・信頼度 = 1 − (1−R上段) × (1−R下段)</text>
    <text x="30" y="386" font-size="11" fill="#555" font-family="sans-serif">・一方の経路が生きていれば出力が得られる</text>

    <text x="200" y="430" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">並列化で冗長性を確保し、直列数を減らすほど信頼度が向上</text>
    <text x="200" y="450" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">総監「安全管理」分野での頻出図表</text>
  </svg>
