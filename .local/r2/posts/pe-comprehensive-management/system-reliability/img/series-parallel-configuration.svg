  <svg width="420" height="180" viewBox="0 0 420 180" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="12" style="max-width:420px;width:100%">
    <defs>
      <marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5 z" fill="#555"/></marker>
    </defs>
    <!-- 入力線 -->
    <line x1="10" y1="90" x2="60" y2="90" stroke="#555" stroke-width="2"/>
    <!-- 分岐点 -->
    <circle cx="60" cy="90" r="4" fill="#444"/>
    <!-- 上段線（ユニット1 → ユニット2） -->
    <line x1="60" y1="90" x2="60" y2="45" stroke="#555" stroke-width="1.5"/>
    <line x1="60" y1="45" x2="100" y2="45" stroke="#555" stroke-width="1.5"/>
    <rect x="100" y="28" width="90" height="34" rx="4" fill="#555" stroke="#333"/>
    <text x="145" y="43" text-anchor="middle" fill="white" font-size="11">ユニット1</text>
    <text x="145" y="56" text-anchor="middle" fill="#ddd" font-size="10">（信頼度 R₁）</text>
    <line x1="190" y1="45" x2="230" y2="45" stroke="#555" stroke-width="1.5"/>
    <rect x="230" y="28" width="90" height="34" rx="4" fill="#555" stroke="#333"/>
    <text x="275" y="43" text-anchor="middle" fill="white" font-size="11">ユニット2</text>
    <text x="275" y="56" text-anchor="middle" fill="#ddd" font-size="10">（信頼度 R₂）</text>
    <line x1="320" y1="45" x2="360" y2="45" stroke="#555" stroke-width="1.5"/>
    <line x1="360" y1="45" x2="360" y2="90" stroke="#555" stroke-width="1.5"/>
    <!-- 下段線（ユニット3 → ユニット4） -->
    <line x1="60" y1="90" x2="60" y2="135" stroke="#555" stroke-width="1.5"/>
    <line x1="60" y1="135" x2="100" y2="135" stroke="#555" stroke-width="1.5"/>
    <rect x="100" y="118" width="90" height="34" rx="4" fill="#666" stroke="#444"/>
    <text x="145" y="133" text-anchor="middle" fill="white" font-size="11">ユニット3</text>
    <text x="145" y="146" text-anchor="middle" fill="#ddd" font-size="10">（信頼度 R₃）</text>
    <line x1="190" y1="135" x2="230" y2="135" stroke="#555" stroke-width="1.5"/>
    <rect x="230" y="118" width="90" height="34" rx="4" fill="#666" stroke="#444"/>
    <text x="275" y="133" text-anchor="middle" fill="white" font-size="11">ユニット4</text>
    <text x="275" y="146" text-anchor="middle" fill="#ddd" font-size="10">（信頼度 R₄）</text>
    <line x1="320" y1="135" x2="360" y2="135" stroke="#555" stroke-width="1.5"/>
    <line x1="360" y1="135" x2="360" y2="90" stroke="#555" stroke-width="1.5"/>
    <!-- 合流点 -->
    <circle cx="360" cy="90" r="4" fill="#444"/>
    <line x1="360" y1="90" x2="410" y2="90" stroke="#555" stroke-width="2" marker-end="url(#ar)"/>
    <!-- ラベル -->
    <text x="8" y="82" fill="#555" font-size="10">入力</text>
    <text x="390" y="82" fill="#555" font-size="10">出力</text>
  </svg>