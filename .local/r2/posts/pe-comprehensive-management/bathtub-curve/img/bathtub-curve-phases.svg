  <svg viewBox="0 0 420 240" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" style="max-width:420px;width:100%">
    <defs>
      <marker id="a5" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5 z" fill="#333"/></marker>
    </defs>
    <!-- 軸 -->
    <line x1="50" y1="195" x2="395" y2="195" stroke="#333" stroke-width="2" marker-end="url(#a5)"/>
    <line x1="50" y1="195" x2="50" y2="18" stroke="#333" stroke-width="2" marker-end="url(#a5)"/>
    <text x="400" y="199" fill="#333" font-size="12">時間</text>
    <text x="28" y="14" fill="#333" font-size="12">故障率</text>
    <!-- バスタブカーブ -->
    <!-- A期間（初期故障：右下がり） -->
    <path d="M 54 45 C 70 45 90 180 140 183" stroke="#333" stroke-width="3" fill="none"/>
    <!-- B期間（偶発故障：水平） -->
    <line x1="140" y1="183" x2="270" y2="183" stroke="#333" stroke-width="3"/>
    <!-- C期間（摩耗故障：右上がり） -->
    <path d="M 270 183 C 320 183 360 80 385 40" stroke="#333" stroke-width="3" fill="none"/>
    <!-- 区切り縦線 -->
    <line x1="140" y1="183" x2="140" y2="195" stroke="#666" stroke-width="1.2" stroke-dasharray="4,3"/>
    <line x1="270" y1="183" x2="270" y2="195" stroke="#666" stroke-width="1.2" stroke-dasharray="4,3"/>
    <!-- 期間ラベル（軸上） -->
    <text x="95" y="212" text-anchor="middle" fill="#333" font-size="12">A期間</text>
    <text x="205" y="212" text-anchor="middle" fill="#333" font-size="12">B期間</text>
    <text x="328" y="212" text-anchor="middle" fill="#333" font-size="12">C期間</text>
    <!-- 期間の説明（下部） -->
    <text x="95" y="228" text-anchor="middle" fill="#666" font-size="9">初期故障期間</text>
    <text x="205" y="228" text-anchor="middle" fill="#666" font-size="9">偶発故障期間</text>
    <text x="328" y="228" text-anchor="middle" fill="#666" font-size="9">摩耗故障期間</text>
  </svg>