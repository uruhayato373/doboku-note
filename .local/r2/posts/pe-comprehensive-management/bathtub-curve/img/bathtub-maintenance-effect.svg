  <svg width="440" height="220" viewBox="0 0 440 220" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="10" style="max-width:440px;width:100%">
    <defs>
      <marker id="a6" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5 z" fill="#333"/></marker>
    </defs>
    <!-- 軸 -->
    <line x1="48" y1="180" x2="420" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#a6)"/>
    <line x1="48" y1="180" x2="48" y2="18" stroke="#333" stroke-width="1.5" marker-end="url(#a6)"/>
    <text x="435" y="184" text-anchor="end" fill="#333" font-size="10">設置</text>
    <text x="22" y="14" fill="#333" font-size="10">故障率</text>
    <!-- バスタブ（初期） -->
    <path d="M 52 42 C 68 42 80 162 110 166" stroke="#555" stroke-width="2.5" fill="none"/>
    <line x1="110" y1="166" x2="175" y2="166" stroke="#555" stroke-width="2.5"/>
