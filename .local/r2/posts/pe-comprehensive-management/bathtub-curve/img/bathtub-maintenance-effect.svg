    <text x="79" y="195" text-anchor="middle" fill="#333" font-size="9">初期故障期間</text>
    <text x="143" y="195" text-anchor="middle" fill="#333" font-size="9">偶発故障期間</text>
    <text x="215" y="195" text-anchor="middle" fill="#333" font-size="9">摩耗故障期間</text>
    <!-- 注釈ラベル -->
    <text x="255" y="50" text-anchor="middle" fill="#444" font-size="9">部品交換</text>
    <text x="360" y="195" text-anchor="middle" fill="#444" font-size="9">部分更新</text>
    <text x="418" y="82" fill="#444" font-size="9">更新</text>
    <!-- 右側注釈 -->
    <text x="278" y="130" fill="#666" font-size="8">部品交換による</text>
    <text x="278" y="140" fill="#666" font-size="8">故障率の低減・</text>
    <text x="278" y="150" fill="#666" font-size="8">耐用年数の延長</text>
