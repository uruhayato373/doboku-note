    <!-- 部品交換後の低減カーブ（点線） -->
    <path d="M 255 62 C 270 130 285 162 310 164" stroke="#333" stroke-width="1.8" fill="none" stroke-dasharray="5,3"/>
    <line x1="310" y1="164" x2="360" y2="164" stroke="#333" stroke-width="1.8" stroke-dasharray="5,3"/>
    <path d="M 360 164 C 382 164 400 120 415 85" stroke="#333" stroke-width="1.8" fill="none" stroke-dasharray="5,3"/>
    <!-- 区切り縦線 -->
    <line x1="110" y1="166" x2="110" y2="180" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="175" y1="166" x2="175" y2="180" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="255" y1="180" x2="255" y2="62" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="360" y1="164" x2="360" y2="180" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
