<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500" style="max-width:400px;width:100%" role="img" aria-label="MTBF・MTTR・稼働率の関係。時間軸上で稼働（運転）と故障・修理が交互に繰り返され、MTBFは稼働区間の平均（実績稼働時間÷故障件数）、MTTRは修理区間の平均、稼働率はMTBF÷（MTBF＋MTTR）で求まる。実績稼働時間は総稼働時間から総修理時間を除いた正味の稼働時間である。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-sub  { font-size: 11px; fill: #8a8a8a; }
      .t-head { font-size: 16px; font-weight: bold; fill: #1a3a5c; }
      .t-seg  { font-size: 12px; fill: #1a3a5c; }
      .t-anno { font-size: 12px; font-weight: bold; }
      .t-leg  { font-size: 11px; fill: #555; }
      .t-card { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-ttl  { font-size: 12px; font-weight: bold; fill: #8a8a8a; }
      .t-note { font-size: 11px; fill: #555; }
      .up   { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.2; }
      .rep  { fill: #f8d7da; stroke: #b22234; stroke-width: 1.2; }
    </style>
  </defs>

  <text class="t-sub"  x="200" y="14" text-anchor="middle">信頼性・保全性（経済性管理／情報管理）</text>
  <text class="t-head" x="200" y="40" text-anchor="middle">MTBF・MTTR・稼働率の関係</text>

  <!-- MTBF ブラケット（稼働2区間の上・帯に接続） -->
  <text class="t-anno" x="171" y="72" text-anchor="middle" fill="#2e6da4">MTBF（平均故障間隔）</text>
  <line x1="136" y1="80" x2="206" y2="80" stroke="#2e6da4" stroke-width="1.3"/>
  <line x1="136" y1="80" x2="136" y2="104" stroke="#2e6da4" stroke-width="1.3"/>
  <line x1="206" y1="80" x2="206" y2="104" stroke="#2e6da4" stroke-width="1.3"/>

  <!-- 故障マーカー（稼働→修理の境界） -->
  <text class="t-anno" x="110" y="92" text-anchor="middle" fill="#b22234" font-size="11">故障</text>
  <polygon points="104,96 116,96 110,104" fill="#b22234"/>
  <polygon points="200,96 212,96 206,104" fill="#b22234"/>

  <!-- タイムライン帯 -->
  <rect class="up"  x="40"  y="104" width="70" height="30"/>
  <rect class="rep" x="110" y="104" width="26" height="30"/>
  <rect class="up"  x="136" y="104" width="70" height="30"/>
  <rect class="rep" x="206" y="104" width="26" height="30"/>
  <rect class="up"  x="232" y="104" width="70" height="30"/>
  <text class="t-seg" x="75"  y="123" text-anchor="middle">稼働</text>
  <text class="t-seg" x="171" y="123" text-anchor="middle">稼働</text>
  <text class="t-seg" x="267" y="123" text-anchor="middle">稼働</text>
  <line x1="40" y1="134" x2="338" y2="134" stroke="#8a8a8a" stroke-width="1"/>
  <text class="t-sub" x="344" y="123">時間</text>

  <!-- MTTR ブラケット（修理2区間の下・帯に接続＋引出線） -->
  <line x1="206" y1="146" x2="232" y2="146" stroke="#d4a017" stroke-width="1.3"/>
  <line x1="206" y1="134" x2="206" y2="146" stroke="#d4a017" stroke-width="1.3"/>
  <line x1="232" y1="134" x2="232" y2="146" stroke="#d4a017" stroke-width="1.3"/>
  <line x1="219" y1="146" x2="244" y2="160" stroke="#d4a017" stroke-width="1.3"/>
  <text class="t-anno" x="248" y="164" fill="#d4a017">MTTR（平均修理時間）</text>

  <!-- 凡例 -->
  <rect class="up"  x="70"  y="180" width="14" height="12"/>
  <text class="t-leg" x="90" y="190">稼働（運転）</text>
  <rect class="rep" x="210" y="180" width="14" height="12"/>
  <text class="t-leg" x="230" y="190">故障・修理（MTTR）</text>

  <!-- 計算式カード -->
  <rect x="16" y="204" width="368" height="40" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text class="t-card" x="200" y="229" text-anchor="middle">MTBF ＝ 実績稼働時間 ÷ 故障件数</text>

  <rect x="16" y="252" width="368" height="40" rx="8" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text class="t-card" x="200" y="277" text-anchor="middle">MTTR ＝ 総修理時間 ÷ 故障件数</text>

  <rect x="16" y="300" width="368" height="40" rx="8" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
  <text class="t-card" x="200" y="325" text-anchor="middle">稼働率 ＝ MTBF ÷（MTBF ＋ MTTR）</text>

  <!-- ポイント -->
  <rect x="16" y="356" width="368" height="128" rx="8" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text class="t-ttl"  x="32" y="380">ポイント</text>
  <text class="t-note" x="32" y="404">・稼働率は信頼性（MTBF）と保全性（MTTR）の両方で決まる</text>
  <text class="t-note" x="32" y="428">・MTBF が長い・MTTR が短いほど稼働率は高い</text>
  <text class="t-note" x="32" y="452">・実績稼働時間＝総稼働時間−総修理時間（修理中を除く正味）</text>
  <text class="t-note" x="32" y="476">・MTBF の分母は故障件数（稼働時間ではない）</text>
</svg>
