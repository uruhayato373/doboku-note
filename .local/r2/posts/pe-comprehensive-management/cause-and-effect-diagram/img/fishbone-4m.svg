<svg width="460" height="280" viewBox="0 0 460 280" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans JP', sans-serif" style="max-width:460px;width:100%" role="img" aria-label="特性要因図（4M）">

  <!-- 背骨 -->
  <line x1="30" y1="140" x2="365" y2="140" stroke="#222" stroke-width="2.5"/>
  <polygon points="365,134 365,146 375,140" fill="#222"/>

  <!-- 頭（特性） -->
  <rect x="375" y="108" width="76" height="64" rx="5" fill="#f5f5f5" stroke="#222" stroke-width="1.5"/>
  <text x="413" y="136" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">特性</text>
  <text x="413" y="155" text-anchor="middle" fill="#555" font-size="11">（結果）</text>

  <!-- ===== 大骨: Man（上左）===== -->
  <line x1="140" y1="140" x2="72" y2="38" stroke="#2e6da4" stroke-width="2"/>
  <text x="68" y="28" fill="#2e6da4" font-size="13" font-weight="bold" text-anchor="middle">Man（人）</text>
  <!-- 中骨 -->
  <line x1="118" y1="106" x2="75" y2="106" stroke="#2e6da4" stroke-width="1"/>
  <text x="72" y="101" text-anchor="end" fill="#555" font-size="10">技能・経験</text>
  <line x1="96" y1="72" x2="53" y2="72" stroke="#2e6da4" stroke-width="1"/>
  <text x="50" y="67" text-anchor="end" fill="#555" font-size="10">教育</text>

  <!-- ===== 大骨: Method（上右）===== -->
  <line x1="270" y1="140" x2="202" y2="38" stroke="#3a7d44" stroke-width="2"/>
  <text x="198" y="28" fill="#3a7d44" font-size="13" font-weight="bold" text-anchor="middle">Method（方法）</text>
  <!-- 中骨 -->
  <line x1="248" y1="106" x2="205" y2="106" stroke="#3a7d44" stroke-width="1"/>
  <text x="202" y="101" text-anchor="end" fill="#555" font-size="10">作業手順</text>
  <line x1="226" y1="72" x2="183" y2="72" stroke="#3a7d44" stroke-width="1"/>
  <text x="180" y="67" text-anchor="end" fill="#555" font-size="10">工程設計</text>

  <!-- ===== 大骨: Machine（下左）===== -->
  <line x1="140" y1="140" x2="72" y2="242" stroke="#d4a017" stroke-width="2"/>
  <text x="68" y="262" fill="#d4a017" font-size="13" font-weight="bold" text-anchor="middle">Machine（機械）</text>
  <!-- 中骨 -->
  <line x1="118" y1="174" x2="75" y2="174" stroke="#d4a017" stroke-width="1"/>
  <text x="72" y="169" text-anchor="end" fill="#555" font-size="10">保守状況</text>
  <line x1="96" y1="208" x2="53" y2="208" stroke="#d4a017" stroke-width="1"/>
  <text x="50" y="203" text-anchor="end" fill="#555" font-size="10">経年劣化</text>

  <!-- ===== 大骨: Material（下右）===== -->
  <line x1="270" y1="140" x2="202" y2="242" stroke="#b22234" stroke-width="2"/>
  <text x="198" y="262" fill="#b22234" font-size="13" font-weight="bold" text-anchor="middle">Material（材料）</text>
  <!-- 中骨 -->
  <line x1="248" y1="174" x2="205" y2="174" stroke="#b22234" stroke-width="1"/>
  <text x="202" y="169" text-anchor="end" fill="#555" font-size="10">品質</text>
  <line x1="226" y1="208" x2="183" y2="208" stroke="#b22234" stroke-width="1"/>
  <text x="180" y="203" text-anchor="end" fill="#555" font-size="10">規格</text>

</svg>
