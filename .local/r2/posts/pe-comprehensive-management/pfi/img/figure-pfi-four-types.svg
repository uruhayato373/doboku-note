<svg width="400" height="500" viewBox="0 0 400 500"
     xmlns="http://www.w3.org/2000/svg"
     style="max-width:400px;width:100%"
     role="img"
     aria-label="PFI 事業の 4 つの方式：BOO（建設→所有→運営）、BTO（建設→移転→運営）、BOT（建設→運営→移転）、RO（改修→運営）。所有権の移転タイミングが各方式の違い">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-method-title { font-size: 13px; font-weight: bold; fill: #1a3a5c; } /* brand-text */
      .t-step-en      { font-size: 12px; font-weight: bold; fill: #1a3a5c; } /* brand-text */
      .t-step-jp      { font-size: 11px; fill: #555; }                       /* ink-body */
      .t-note         { font-size: 11px; fill: #555; }                       /* ink-body */
      .box-build    { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; } /* brand（建設） */
      .box-own      { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; } /* warn（所有） */
      .box-operate  { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; } /* positive（運営） */
      .box-transfer { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; } /* danger（移転） */
      .box-rehab    { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; } /* surface（改修） */
      .arrow        { stroke: #555; stroke-width: 1.5; fill: none; }       /* ink-body */
    </style>
    <marker markerUnits="userSpaceOnUse" id="pfi-arr" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 7,3 0,6" fill="#555"/>
    </marker>
  </defs>

  <!-- BOO 方式 -->
  <text class="t-method-title" x="10" y="22">B → O → O 方式</text>
  <rect class="box-build"   x="10"  y="30" width="100" height="46" rx="5"/>
  <text class="t-step-en"   x="60"  y="50" text-anchor="middle">Build</text>
  <text class="t-step-jp"   x="60"  y="68" text-anchor="middle">建てて</text>
  <line class="arrow" x1="112" y1="53" x2="125" y2="53" marker-end="url(#pfi-arr)"/>
  <rect class="box-own"     x="127" y="30" width="100" height="46" rx="5"/>
  <text class="t-step-en"   x="177" y="50" text-anchor="middle">Own</text>
  <text class="t-step-jp"   x="177" y="68" text-anchor="middle">所有して</text>
  <line class="arrow" x1="229" y1="53" x2="242" y2="53" marker-end="url(#pfi-arr)"/>
  <rect class="box-operate" x="244" y="30" width="100" height="46" rx="5"/>
  <text class="t-step-en"   x="294" y="50" text-anchor="middle">Operate</text>
  <text class="t-step-jp"   x="294" y="68" text-anchor="middle">運営する</text>

  <!-- BTO 方式 -->
  <text class="t-method-title" x="10" y="100">B → T → O 方式（公共所有）</text>
  <rect class="box-build"    x="10"  y="108" width="100" height="46" rx="5"/>
  <text class="t-step-en"    x="60"  y="128" text-anchor="middle">Build</text>
  <text class="t-step-jp"    x="60"  y="146" text-anchor="middle">建てて</text>
  <line class="arrow" x1="112" y1="131" x2="125" y2="131" marker-end="url(#pfi-arr)"/>
  <rect class="box-transfer" x="127" y="108" width="100" height="46" rx="5"/>
  <text class="t-step-en"    x="177" y="128" text-anchor="middle">Transfer</text>
  <text class="t-step-jp"    x="177" y="146" text-anchor="middle">所有権移転</text>
  <line class="arrow" x1="229" y1="131" x2="242" y2="131" marker-end="url(#pfi-arr)"/>
  <rect class="box-operate"  x="244" y="108" width="100" height="46" rx="5"/>
  <text class="t-step-en"    x="294" y="128" text-anchor="middle">Operate</text>
  <text class="t-step-jp"    x="294" y="146" text-anchor="middle">運営する</text>

  <!-- BOT 方式 -->
  <text class="t-method-title" x="10" y="178">B → O → T 方式</text>
  <rect class="box-build"    x="10"  y="186" width="100" height="46" rx="5"/>
  <text class="t-step-en"    x="60"  y="206" text-anchor="middle">Build</text>
  <text class="t-step-jp"    x="60"  y="224" text-anchor="middle">建てて</text>
  <line class="arrow" x1="112" y1="209" x2="125" y2="209" marker-end="url(#pfi-arr)"/>
  <rect class="box-operate"  x="127" y="186" width="100" height="46" rx="5"/>
  <text class="t-step-en"    x="177" y="206" text-anchor="middle">Operate</text>
  <text class="t-step-jp"    x="177" y="224" text-anchor="middle">運営して</text>
  <line class="arrow" x1="229" y1="209" x2="242" y2="209" marker-end="url(#pfi-arr)"/>
  <rect class="box-transfer" x="244" y="186" width="100" height="46" rx="5"/>
  <text class="t-step-en"    x="294" y="206" text-anchor="middle">Transfer</text>
  <text class="t-step-jp"    x="294" y="224" text-anchor="middle">移転</text>

  <!-- RO 方式 -->
  <text class="t-method-title" x="10" y="256">R → O 方式（改修型）</text>
  <rect class="box-rehab"   x="10"  y="264" width="100" height="46" rx="5"/>
  <text class="t-step-en"   x="60"  y="284" text-anchor="middle">Rehabilitate</text>
  <text class="t-step-jp"   x="60"  y="302" text-anchor="middle">改修して</text>
  <line class="arrow" x1="112" y1="287" x2="125" y2="287" marker-end="url(#pfi-arr)"/>
  <rect class="box-operate" x="127" y="264" width="100" height="46" rx="5"/>
  <text class="t-step-en"   x="177" y="284" text-anchor="middle">Operate</text>
  <text class="t-step-jp"   x="177" y="302" text-anchor="middle">運営する</text>
  <text class="t-note"      x="244" y="290">既存施設の</text>
  <text class="t-note"      x="244" y="305">運営委託</text>

  <!-- サマリー -->
  <line stroke="#d7d7d7" stroke-width="1" x1="10" y1="328" x2="390" y2="328"/>
  <text font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="13" font-weight="bold" fill="#1a3a5c" x="200" y="356" text-anchor="middle">各方式の所有権と運営権の関係</text>
  <rect fill="#e8f0fe" stroke="#2e6da4" stroke-width="1" x="10" y="368" width="380" height="60" rx="6"/>
  <text font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" fill="#555" x="20" y="388">・BOO: 民間が所有・運営を継続（公共に戻さない）</text>
  <text font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" fill="#555" x="20" y="406">・BTO: 建設後すぐ公共に移転、民間が指定管理者として運営</text>
  <text font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" fill="#555" x="20" y="424">・BOT: 民間が運営期間中は所有、終了時に公共へ移転</text>
  <text font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" fill="#555" x="20" y="452">・RO（改修型）: 既存施設を改修して民間が運営</text>
  <text font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" fill="#555" x="20" y="472">日本では BTO が最も多く採用されている</text>
</svg>
