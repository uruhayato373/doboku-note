  <svg width="480" height="230" viewBox="0 0 480 230" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="11" style="max-width:480px;width:100%">
    <!-- B→O→O方式 -->
    <text x="140" y="18" text-anchor="middle" fill="#222" font-weight="bold" font-size="12">B→O→O 方式</text>
    <rect x="10" y="24" width="90" height="36" rx="3" fill="#555" stroke="#333"/><text x="55" y="39" text-anchor="middle" fill="white" font-size="11">Build</text><text x="55" y="52" text-anchor="middle" fill="white" font-size="10">（建てて）</text>
    <rect x="105" y="24" width="90" height="36" rx="3" fill="#555" stroke="#333"/><text x="150" y="39" text-anchor="middle" fill="white" font-size="11">Own</text><text x="150" y="52" text-anchor="middle" fill="white" font-size="10">（所有して）</text>
    <rect x="200" y="24" width="90" height="36" rx="3" fill="#555" stroke="#333"/><text x="245" y="39" text-anchor="middle" fill="white" font-size="11">Operate</text><text x="245" y="52" text-anchor="middle" fill="white" font-size="10">（管理・運営する）</text>

    <!-- R→O方式 -->
    <text x="400" y="18" text-anchor="middle" fill="#222" font-weight="bold" font-size="12">R→O 方式</text>
    <rect x="310" y="24" width="80" height="36" rx="3" fill="#777" stroke="#444"/><text x="350" y="39" text-anchor="middle" fill="white" font-size="10">Rehabilitate</text><text x="350" y="52" text-anchor="middle" fill="white" font-size="10">（改修して）</text>
    <rect x="395" y="24" width="80" height="36" rx="3" fill="#777" stroke="#444"/><text x="435" y="39" text-anchor="middle" fill="white" font-size="11">Operate</text><text x="435" y="52" text-anchor="middle" fill="white" font-size="10">（管理・運営する）</text>

    <!-- B→T→O方式 -->
    <text x="140" y="88" text-anchor="middle" fill="#222" font-weight="bold" font-size="12">B→T→O 方式</text>
    <rect x="10" y="94" width="90" height="36" rx="3" fill="#444" stroke="#222"/><text x="55" y="109" text-anchor="middle" fill="white" font-size="11">Build</text><text x="55" y="122" text-anchor="middle" fill="white" font-size="10">（建てて）</text>
    <rect x="105" y="94" width="90" height="36" rx="3" fill="#444" stroke="#222"/><text x="150" y="109" text-anchor="middle" fill="white" font-size="11">Transfer</text><text x="150" y="122" text-anchor="middle" fill="white" font-size="10">（移転する）</text>
    <rect x="200" y="94" width="90" height="36" rx="3" fill="#444" stroke="#222"/><text x="245" y="109" text-anchor="middle" fill="white" font-size="11">Operate</text><text x="245" y="122" text-anchor="middle" fill="white" font-size="10">（管理・運営する）</text>

    <!-- B→O→T方式 -->
    <text x="140" y="158" text-anchor="middle" fill="#222" font-weight="bold" font-size="12">B→O→T 方式</text>
    <rect x="10" y="164" width="90" height="36" rx="3" fill="#666" stroke="#333"/><text x="55" y="179" text-anchor="middle" fill="white" font-size="11">Build</text><text x="55" y="192" text-anchor="middle" fill="white" font-size="10">（建てて）</text>
    <rect x="105" y="164" width="90" height="36" rx="3" fill="#666" stroke="#333"/><text x="150" y="179" text-anchor="middle" fill="white" font-size="11">Operate</text><text x="150" y="192" text-anchor="middle" fill="white" font-size="10">（管理・運営する）</text>
    <rect x="200" y="164" width="90" height="36" rx="3" fill="#666" stroke="#333"/><text x="245" y="179" text-anchor="middle" fill="white" font-size="11">Transfer</text><text x="245" y="192" text-anchor="middle" fill="white" font-size="10">（移転する）</text>
  </svg>