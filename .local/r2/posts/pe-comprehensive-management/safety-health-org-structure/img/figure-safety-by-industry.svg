<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500" style="max-width:400px;width:100%" role="img" aria-label="安全衛生管理体制の業種による選任義務の違い。衛生管理者・産業医・衛生委員会は全業種で常時50人以上なら必要で、業種を問わず規模だけで判断する。安全管理者・安全委員会は特定業種（林業・鉱業・建設・運送・清掃・製造・電気・ガス・商業等の屋外的/工業的業種）でのみ常時50人以上で必要となり、金融・保険・医療・教育等は対象外。総括安全衛生管理者は業種で規模が異なり、林業・鉱業・建設・運送・清掃は100人以上、製造・電気・ガス・商業等は300人以上、その他の業種は1000人以上で選任する。10〜49人の小規模では特定業種は安全衛生推進者、その他は衛生推進者を選任する。">
  <rect width="400" height="500" fill="#ffffff"/>
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-head { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .c-t    { font-size: 13px; font-weight: bold; }
      .c-d    { font-size: 11px; fill: #222; }
      .nt     { font-size: 11px; fill: #555; }
      .f-head { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
    </style>
  </defs>

  <text class="t-head" x="200" y="36" text-anchor="middle">全業種か、特定業種だけか</text>

  <!-- 全業種 -->
  <rect x="10" y="48" width="380" height="92" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.3"/>
  <text class="c-t" x="24" y="68" text-anchor="start" fill="#2e6da4">全業種で必要（常時50人以上）</text>
  <text class="c-d" x="24" y="90" text-anchor="start">衛生管理者・産業医・衛生委員会</text>
  <text class="nt" x="24" y="112" text-anchor="start">業種を問わず、規模だけで選任を判断する。</text>
  <text class="nt" x="24" y="130" text-anchor="start">（健康・衛生は全ての職場に共通するため）</text>

  <!-- 特定業種のみ -->
  <rect x="10" y="148" width="380" height="104" rx="8" fill="#fff3cd" stroke="#d4a017" stroke-width="1.3"/>
  <text class="c-t" x="24" y="168" text-anchor="start" fill="#d4a017">特定業種でのみ必要（常時50人以上）</text>
  <text class="c-d" x="24" y="190" text-anchor="start">安全管理者・安全委員会</text>
  <text class="nt" x="24" y="212" text-anchor="start">対象：林業・鉱業・建設・運送・清掃・製造・</text>
  <text class="nt" x="24" y="228" text-anchor="start">　　　電気・ガス・商業 等（屋外/工業的業種）</text>
  <text class="nt" x="24" y="246" text-anchor="start">金融・保険・医療・教育等は対象外。</text>

  <!-- 総括（業種で規模差） -->
  <rect x="10" y="260" width="380" height="136" rx="8" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.3"/>
  <text class="c-t" x="24" y="280" text-anchor="start" fill="#1a3a5c">総括安全衛生管理者は業種で規模が異なる</text>
  <text class="c-d" x="24" y="304" text-anchor="start">林業・鉱業・建設・運送・清掃 … 100人〜</text>
  <text class="c-d" x="24" y="326" text-anchor="start">製造・電気・ガス・商業 等 … 300人〜</text>
  <text class="c-d" x="24" y="348" text-anchor="start">その他の業種 … 1000人〜</text>
  <text class="nt" x="24" y="372" text-anchor="start">事業の実施を実質的に統括管理する者を充てる。</text>

  <!-- 小規模 -->
  <rect x="10" y="404" width="380" height="82" rx="8" fill="#ffffff" stroke="#d7d7d7" stroke-width="1.3"/>
  <text class="f-head" x="24" y="426" text-anchor="start">10〜49人の小規模事業場</text>
  <text class="nt" x="24" y="448" text-anchor="start">特定業種 … 安全衛生推進者／その他 … 衛生推進者</text>
  <text class="nt" x="24" y="468" text-anchor="start">（管理者ではなく「推進者」を選任する）</text>
</svg>
