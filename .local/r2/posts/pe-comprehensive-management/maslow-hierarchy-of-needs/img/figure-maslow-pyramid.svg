<svg width="400" height="500" viewBox="0 0 400 500"
     xmlns="http://www.w3.org/2000/svg"
     style="max-width:400px;width:100%"
     role="img"
     aria-label="マズローの欲求 5 段階説のピラミッド図。底辺から順に生理的欲求・安全欲求・社会的欲求・尊厳欲求（承認欲求）・自己実現欲求が積み上がり、低次欲求が満たされると高次欲求が動機づけの源泉となることを示す">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-title { font-size: 14px; font-weight: bold; fill: #1a3a5c; }
      .t-level { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-level-top { font-size: 12px; font-weight: bold; fill: #ffffff; }
      .t-axis { font-size: 11px; fill: #555; }
      .arrow-line { stroke: #555; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arrow-up" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <polygon points="0 8, 8 4, 0 0" fill="#555" />
    </marker>
  </defs>

  <!-- 縦軸（低次→高次の方向） -->
  <line x1="20" y1="290" x2="20" y2="40" class="arrow-line" marker-end="url(#arrow-up)" />
  <text x="14" y="170" class="t-axis" transform="rotate(-90,14,170)" text-anchor="middle">低次 → 高次</text>

  <!-- 第1段（底辺）：生理的欲求 -->
  <polygon points="72,230 328,230 360,280 40,280" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5" />
  <text x="200" y="260" class="t-level" text-anchor="middle">生理的欲求</text>

  <!-- 第2段：安全・安定欲求（brand 30% opacity） -->
  <polygon points="104,180 296,180 328,230 72,230" fill="#2e6da4" fill-opacity="0.3" stroke="#2e6da4" stroke-width="1.5" />
  <text x="200" y="210" class="t-level" text-anchor="middle">安全・安定欲求</text>

  <!-- 第3段：社会的欲求（brand 55% opacity） -->
  <polygon points="136,130 264,130 296,180 104,180" fill="#2e6da4" fill-opacity="0.55" stroke="#2e6da4" stroke-width="1.5" />
  <text x="200" y="160" class="t-level" text-anchor="middle">社会的欲求</text>

  <!-- 第4段：尊厳欲求（brand 80% opacity） -->
  <polygon points="168,80 232,80 264,130 136,130" fill="#2e6da4" fill-opacity="0.8" stroke="#2e6da4" stroke-width="1.5" />
  <text x="200" y="110" class="t-level-top" text-anchor="middle">尊厳欲求</text>

  <!-- 第5段（頂点）：自己実現欲求 -->
  <polygon points="200,30 232,80 168,80" fill="#2e6da4" stroke="#1a3a5c" stroke-width="1.5" />
  <text x="200" y="65" class="t-level-top" text-anchor="middle" font-size="11">自己実現</text>

  <!-- 区分ラベル -->
  <text x="375" y="240" class="t-axis" text-anchor="end">欠乏欲求</text>
  <line x1="378" y1="80" x2="378" y2="280" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="3,2" />
  <text x="375" y="55" class="t-axis" text-anchor="end">成長欲求</text>

  <!-- タイトル -->
  <text x="200" y="320" class="t-title" text-anchor="middle">マズローの欲求 5 段階説</text>

  <!-- 追加：ハーズバーグとの対応 -->
  <rect x="10" y="338" width="380" height="52" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5" rx="6"/>
  <text class="t-title" x="200" y="358" text-anchor="middle">ハーズバーグとの対応関係</text>
  <text class="t-axis" x="200" y="374" text-anchor="middle">動機づけ要因 ↔ 自己実現・承認（第4〜5段）</text>
  <text class="t-axis" x="200" y="388" text-anchor="middle">衛生要因 ↔ 社会・安全・生理（第1〜3段）</text>

  <rect x="10" y="402" width="185" height="54" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5" rx="6"/>
  <text class="t-title" x="103" y="421" text-anchor="middle">人的資源管理の応用</text>
  <text class="t-axis" x="103" y="437" text-anchor="middle">低次欲求が未充足では</text>
  <text class="t-axis" x="103" y="451" text-anchor="middle">高次欲求は動機づけにならない</text>

  <rect x="205" y="402" width="185" height="54" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5" rx="6"/>
  <text class="t-title" x="297" y="421" text-anchor="middle">欲求段階と施策例</text>
  <text class="t-axis" x="297" y="437" text-anchor="middle">給与・福利（低次）</text>
  <text class="t-axis" x="297" y="451" text-anchor="middle">権限委譲・表彰（高次）</text>

  <text class="t-label" x="200" y="474" text-anchor="middle">自己実現欲求は充足されても更なる成長を求める</text>
  <text class="t-cap" x="200" y="490" text-anchor="middle">1943 年提唱・人的資源管理理論の古典的基盤</text>
</svg>
