<svg width="400" height="500" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" style="max-width:400px;width:100%" role="img" aria-label="EVM の基本グラフ — PV・EV・AC と SV・CV の関係">
  <!-- scale 460 -> 400: 400/460 = 0.8696 -->
  <g transform="scale(0.8696 0.8696)">
    <!-- Axes -->
    <line x1="60" y1="240" x2="435" y2="240" stroke="#222" stroke-width="1.5"/>
    <line x1="60" y1="40" x2="60" y2="240" stroke="#222" stroke-width="1.5"/>

    <!-- Axis labels -->
    <text x="22" y="140" font-size="11" fill="#222" transform="rotate(-90 22 140)" text-anchor="middle">コスト</text>
    <text x="245" y="280" text-anchor="middle" font-size="11" fill="#222">時間</text>
    <text x="60" y="258" text-anchor="middle" font-size="10" fill="#555">着工</text>
    <text x="368" y="258" text-anchor="middle" font-size="10" fill="#555">完了予定</text>

    <!-- Current time vertical dashed line -->
    <line x1="260" y1="50" x2="260" y2="240" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="260" y="258" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">現在</text>

    <!-- PV (Planned Value) - #2e6da4, full span -->
    <path d="M 60 240 C 170 225 265 155 425 70" fill="none" stroke="#2e6da4" stroke-width="2.5"/>
    <text x="355" y="105" font-size="11" fill="#2e6da4" font-weight="bold">PV</text>
    <text x="355" y="120" font-size="9" fill="#2e6da4">(計画値)</text>

    <!-- AC (Actual Cost) - #b22234, only to current -->
    <path d="M 60 240 C 130 232 200 175 260 140" fill="none" stroke="#b22234" stroke-width="2.5"/>
    <text x="125" y="170" font-size="11" fill="#b22234" font-weight="bold">AC</text>
    <text x="125" y="185" font-size="9" fill="#b22234">(実コスト)</text>

    <!-- EV (Earned Value) - #3a7d44, only to current -->
    <path d="M 60 240 C 140 235 210 215 260 200" fill="none" stroke="#3a7d44" stroke-width="2.5"/>
    <text x="185" y="232" font-size="11" fill="#3a7d44" font-weight="bold">EV</text>
    <text x="185" y="247" font-size="9" fill="#3a7d44">(出来高)</text>

    <!-- Data points at current time -->
    <circle cx="260" cy="178" r="3.5" fill="#2e6da4"/>
    <circle cx="260" cy="140" r="3.5" fill="#b22234"/>
    <circle cx="260" cy="200" r="3.5" fill="#3a7d44"/>

    <!-- SV bracket (PV to EV) on right side -->
    <line x1="278" y1="178" x2="278" y2="200" stroke="#555" stroke-width="1"/>
    <line x1="275" y1="178" x2="281" y2="178" stroke="#555" stroke-width="1"/>
    <line x1="275" y1="200" x2="281" y2="200" stroke="#555" stroke-width="1"/>
    <text x="285" y="193" font-size="10" fill="#222" font-weight="bold">SV</text>
    <text x="305" y="193" font-size="9" fill="#555">(&lt; 0: 遅延)</text>

    <!-- CV bracket (AC to EV) on right side -->
    <line x1="278" y1="140" x2="278" y2="200" stroke="#555" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="285" y="155" font-size="10" fill="#222" font-weight="bold">CV</text>
    <text x="305" y="155" font-size="9" fill="#555">(&lt; 0: 超過)</text>

    <!-- Formula box (bottom) -->
    <rect x="60" y="275" width="375" height="28" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="0.8" rx="2"/>
    <text x="75" y="293" font-size="10" fill="#222">SV = EV − PV</text>
    <text x="160" y="293" font-size="10" fill="#222">CV = EV − AC</text>
    <text x="245" y="293" font-size="10" fill="#222">SPI = EV / PV</text>
    <text x="325" y="304" font-size="10" fill="#222">CPI=EV/AC</text>
  </g>

  <!-- サマリー（310 * 0.8696 = 269.6 → 余白 230px） -->
  <line x1="20" y1="286" x2="380" y2="286" stroke="#d7d7d7" stroke-width="1"/>
  <text x="200" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3a5c" font-family="sans-serif">EVM 指標の判定基準</text>
  <rect x="20" y="330" width="360" height="80" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="30" y="352" font-size="11" fill="#555" font-family="sans-serif">・SPI（スケジュール効率指数）= EV / PV</text>
  <text x="30" y="370" font-size="11" fill="#555" font-family="sans-serif">  → 1.0 以上: 進捗順調 ／ 1.0 未満: 遅延</text>
  <text x="30" y="390" font-size="11" fill="#555" font-family="sans-serif">・CPI（コスト効率指数）= EV / AC</text>
  <text x="30" y="408" font-size="11" fill="#555" font-family="sans-serif">  → 1.0 以上: 予算内 ／ 1.0 未満: コスト超過</text>
  <text x="200" y="446" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">出来高（EV）が判断の基点となる点が重要</text>
  <text x="200" y="466" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">PMBOK で標準化されたプロジェクト進捗管理手法</text>
</svg>
