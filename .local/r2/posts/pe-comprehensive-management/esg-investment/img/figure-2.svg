<svg viewBox="0 0 400 460" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="TCFD提言の4要求項目。ガバナンス・戦略・リスク管理・指標と目標の2×2マトリクスと、移行リスク・物理的リスクの2分類補足帯">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-title  { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-sub    { font-size: 11px; fill: #555; }
      .t-head   { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-body   { font-size: 12px; fill: #555; }
      .t-badge  { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .t-axis   { font-size: 11px; font-weight: bold; fill: #8a8a8a; }
      .t-risk   { font-size: 12px; fill: #555; }
      .t-risk-h { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      /* brand: #e8f0fe / #2e6da4 */
      .box-brand  { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      /* warn: #fff3cd / #d4a017 — 戦略(シナリオ分析)を強調 */
      .box-warn   { fill: #fff3cd; stroke: #d4a017; stroke-width: 2; }
      /* surface: #f5f5f5 / #d7d7d7 */
      .box-surface { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      /* badge circles */
      .badge-brand   { fill: #2e6da4; }
      .badge-warn    { fill: #d4a017; }
      .badge-surface { fill: #8a8a8a; }
      .badge-text    { font-size: 11px; font-weight: bold; fill: #ffffff; }
      /* risk band */
      .band-left  { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1; }
      .band-right { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1; }
    </style>
  </defs>

  <!-- ===== タイトル ===== -->
  <text class="t-title" x="200" y="26" text-anchor="middle">TCFD 提言の4要求項目</text>
  <text class="t-sub" x="200" y="44" text-anchor="middle">気候関連財務情報開示タスクフォース（TCFD）</text>

  <!-- ===== 2×2 グリッド ===== -->
  <!-- row labels -->
  <text class="t-axis" x="200" y="65" text-anchor="middle">開示の4項目</text>

  <!-- --- 左上: ガバナンス (brand) --- -->
  <rect class="box-brand" x="22" y="72" width="174" height="110" rx="8"/>
  <!-- badge -->
  <circle class="badge-brand" cx="48" cy="92" r="14"/>
  <text class="badge-text" x="48" y="97" text-anchor="middle">1</text>
  <!-- heading -->
  <text class="t-head" x="70" y="92">ガバナンス</text>
  <!-- body text -->
  <text class="t-body" x="34" y="116">経営陣の関与</text>
  <text class="t-body" x="34" y="134">・監督体制の開示</text>
  <text class="t-body" x="34" y="152">・経営者の役割の開示</text>
  <text class="t-body" x="34" y="170">・経営戦略への反映</text>

  <!-- --- 右上: 戦略 (warn — 強調) --- -->
  <rect class="box-warn" x="204" y="72" width="174" height="110" rx="8"/>
  <!-- badge -->
  <circle class="badge-warn" cx="230" cy="92" r="14"/>
  <text class="badge-text" x="230" y="97" text-anchor="middle">2</text>
  <!-- heading -->
  <text class="t-head" x="252" y="92">戦略</text>
  <!-- body text -->
  <text class="t-body" x="216" y="116">シナリオ分析（特徴）</text>
  <text class="t-body" x="216" y="134">・気候変動の影響を</text>
  <text class="t-body" x="216" y="152">　複数シナリオで評価</text>
  <text class="t-body" x="216" y="170">・従来制度との相違点</text>

  <!-- --- 左下: リスク管理 (brand) --- -->
  <rect class="box-brand" x="22" y="194" width="174" height="110" rx="8"/>
  <!-- badge -->
  <circle class="badge-brand" cx="48" cy="214" r="14"/>
  <text class="badge-text" x="48" y="219" text-anchor="middle">3</text>
  <!-- heading -->
  <text class="t-head" x="70" y="214">リスク管理</text>
  <!-- body text -->
  <text class="t-body" x="34" y="238">気候関連リスクの</text>
  <text class="t-body" x="34" y="256">識別・評価プロセス</text>
  <text class="t-body" x="34" y="274">・全社リスク管理との</text>
  <text class="t-body" x="34" y="292">　統合</text>

  <!-- --- 右下: 指標と目標 (surface) --- -->
  <rect class="box-surface" x="204" y="194" width="174" height="110" rx="8"/>
  <!-- badge -->
  <circle class="badge-surface" cx="230" cy="214" r="14"/>
  <text class="badge-text" x="230" y="219" text-anchor="middle">4</text>
  <!-- heading -->
  <text class="t-head" x="252" y="214">指標と目標</text>
  <!-- body text -->
  <text class="t-body" x="216" y="238">GHG 排出量等の</text>
  <text class="t-body" x="216" y="256">定量的指標・目標値</text>
  <text class="t-body" x="216" y="274">・Scope 1/2/3 等</text>
  <text class="t-body" x="216" y="292">・進捗モニタリング</text>

  <!-- ===== 気候関連リスク 2分類 補足帯 ===== -->
  <text class="t-axis" x="200" y="328" text-anchor="middle">気候関連リスクの 2 分類（戦略・リスク管理で分析）</text>

  <!-- 移行リスク -->
  <rect class="band-left" x="22" y="336" width="174" height="68" rx="6"/>
  <text class="t-risk-h" x="109" y="356" text-anchor="middle">移行リスク</text>
  <text class="t-risk" x="109" y="374" text-anchor="middle">低炭素経済への</text>
  <text class="t-risk" x="109" y="392" text-anchor="middle">移行に関するリスク</text>

  <!-- 物理的リスク -->
  <rect class="band-right" x="204" y="336" width="174" height="68" rx="6"/>
  <text class="t-risk-h" x="291" y="356" text-anchor="middle">物理的リスク</text>
  <text class="t-risk" x="291" y="374" text-anchor="middle">気候変動による</text>
  <text class="t-risk" x="291" y="392" text-anchor="middle">物理的変化のリスク</text>

  <!-- ===== 注記フッター ===== -->
  <text class="t-sub" x="200" y="430" text-anchor="middle">戦略「シナリオ分析」が従来の情報開示制度との最大の差異</text>
  <text class="t-sub" x="200" y="448" text-anchor="middle">日本の賛同機関数：1,342機関（2023年5月時点、世界最多）</text>
</svg>
