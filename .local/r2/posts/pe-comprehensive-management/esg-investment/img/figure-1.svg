<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500" style="max-width:400px;width:100%" role="img" aria-label="ISO26000 社会的責任の7原則。説明責任・透明性・倫理的な行動・ステークホルダーの利害の尊重・法の支配の尊重・国際行動規範の尊重・人権の尊重をカード縦並びで示した図">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-title  { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-sub    { font-size: 11px; fill: #8a8a8a; }
      .t-num    { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-main   { font-size: 14px; font-weight: bold; fill: #1a3a5c; }
      .t-desc   { font-size: 12px; fill: #555; }
      /* brand: #e8f0fe / #2e6da4 */
      .box-brand    { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .badge-brand  { fill: #ffffff; stroke: #2e6da4; stroke-width: 1.5; }
      /* positive: #d0e8d0 / #3a7d44 — 倫理・人権アクセント */
      .box-pos      { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .badge-pos    { fill: #ffffff; stroke: #3a7d44; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- サブタイトル（タイトル除去） -->
  <text class="t-sub" x="200" y="14" text-anchor="middle">JIS Z 26000 に規格化。持続可能な発展への貢献が目的</text>

  <!-- 凡例 -->
  <rect fill="#d0e8d0" stroke="#3a7d44" stroke-width="1" x="52" y="22" width="10" height="10" rx="2"/>
  <text class="t-sub" x="66" y="32">倫理・人権系</text>
  <rect fill="#e8f0fe" stroke="#2e6da4" stroke-width="1" x="160" y="22" width="10" height="10" rx="2"/>
  <text class="t-sub" x="174" y="32">その他の原則</text>

  <!-- カード1: 説明責任 -->
  <rect class="box-brand" x="32" y="40" width="336" height="56" rx="7"/>
  <circle class="badge-brand" cx="58" cy="68" r="14"/>
  <text class="t-num" x="58" y="73" text-anchor="middle">1</text>
  <text class="t-main" x="80" y="58">説明責任</text>
  <text class="t-desc" x="80" y="72">社会・経済・環境への影響について</text>
  <text class="t-desc" x="80" y="86">説明責任を負う</text>

  <!-- カード2: 透明性 -->
  <rect class="box-brand" x="32" y="102" width="336" height="56" rx="7"/>
  <circle class="badge-brand" cx="58" cy="130" r="14"/>
  <text class="t-num" x="58" y="135" text-anchor="middle">2</text>
  <text class="t-main" x="80" y="120">透明性</text>
  <text class="t-desc" x="80" y="134">決定・活動が社会・環境に与える影響を</text>
  <text class="t-desc" x="80" y="148">透明に開示</text>

  <!-- カード3: 倫理的な行動 -->
  <rect class="box-pos" x="32" y="164" width="336" height="56" rx="7"/>
  <circle class="badge-pos" cx="58" cy="192" r="14"/>
  <text class="t-num" x="58" y="197" text-anchor="middle" fill="#3a7d44">3</text>
  <text class="t-main" x="80" y="182" fill="#1a3a5c">倫理的な行動</text>
  <text class="t-desc" x="80" y="196">誠実さ・公平さ・生命への配慮等の</text>
  <text class="t-desc" x="80" y="210">倫理規範に従う</text>

  <!-- カード4: ステークホルダーの利害の尊重 -->
  <rect class="box-brand" x="32" y="226" width="336" height="56" rx="7"/>
  <circle class="badge-brand" cx="58" cy="254" r="14"/>
  <text class="t-num" x="58" y="259" text-anchor="middle">4</text>
  <text class="t-main" x="80" y="244">ステークホルダーの利害の尊重</text>
  <text class="t-desc" x="80" y="258">利害関係者の利益を尊重し、</text>
  <text class="t-desc" x="80" y="272">よく考慮して対応する</text>

  <!-- カード5: 法の支配の尊重 -->
  <rect class="box-brand" x="32" y="288" width="336" height="56" rx="7"/>
  <circle class="badge-brand" cx="58" cy="316" r="14"/>
  <text class="t-num" x="58" y="321" text-anchor="middle">5</text>
  <text class="t-main" x="80" y="306">法の支配の尊重</text>
  <text class="t-desc" x="80" y="320">法の支配を尊重することを義務と</text>
  <text class="t-desc" x="80" y="334">認識して行動する</text>

  <!-- カード6: 国際行動規範の尊重 -->
  <rect class="box-brand" x="32" y="350" width="336" height="56" rx="7"/>
  <circle class="badge-brand" cx="58" cy="378" r="14"/>
  <text class="t-num" x="58" y="383" text-anchor="middle">6</text>
  <text class="t-main" x="80" y="372">国際行動規範の尊重</text>
  <text class="t-desc" x="80" y="391">法の支配の尊重と共に国際行動規範も尊重する</text>

  <!-- カード7: 人権の尊重 -->
  <rect class="box-pos" x="32" y="412" width="336" height="56" rx="7"/>
  <circle class="badge-pos" cx="58" cy="440" r="14"/>
  <text class="t-num" x="58" y="445" text-anchor="middle" fill="#3a7d44">7</text>
  <text class="t-main" x="80" y="434" fill="#1a3a5c">人権の尊重</text>
  <text class="t-desc" x="80" y="453">人権の重要性・普遍性の両方を認識し尊重する</text>

  <!-- フッター -->
  <text class="t-sub" x="200" y="490" text-anchor="middle">3・7（倫理・人権）は green アクセント、他は brand</text>
</svg>
