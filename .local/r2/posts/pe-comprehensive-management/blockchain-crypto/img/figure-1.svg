<svg width="380" height="420" viewBox="0 0 380 420"
     xmlns="http://www.w3.org/2000/svg"
     style="max-width:380px;width:100%"
     role="img"
     aria-label="ブロックチェーンの連結構造。各ブロックは前ブロックのハッシュ値・取引データ・ナンスを持ち、前ブロックのハッシュ値で時系列に連結される。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-head  { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-sub   { font-size: 11px; fill: #1a3a5c; }
      .t-subg  { font-size: 11px; fill: #555; }
      .t-link  { font-size: 11px; fill: #8a8a8a; }
      .box-block { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-hash  { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-surf  { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
    </style>
    <marker id="bc-arrow" markerWidth="9" markerHeight="8" refX="4.5" refY="7" orient="auto">
      <polygon points="0,0 9,0 4.5,8" fill="#2e6da4"/>
    </marker>
  </defs>

  <text class="t-title" x="190" y="24" text-anchor="middle">ブロックチェーンの連結構造</text>

  <!-- ブロック1 -->
  <rect class="box-block" x="46" y="34" width="288" height="104" rx="8"/>
  <text class="t-head" x="60" y="52">ブロック 1</text>
  <rect class="box-hash" x="60" y="60" width="260" height="22" rx="4"/>
  <text class="t-sub" x="190" y="75" text-anchor="middle">前ブロックのハッシュ値</text>
  <rect class="box-surf" x="60" y="84" width="260" height="22" rx="4"/>
  <text class="t-subg" x="190" y="99" text-anchor="middle">取引データ（トランザクション）</text>
  <rect class="box-surf" x="60" y="108" width="260" height="22" rx="4"/>
  <text class="t-subg" x="190" y="123" text-anchor="middle">ナンス（採掘で調整する値）</text>

  <line x1="190" y1="138" x2="190" y2="166" stroke="#2e6da4" stroke-width="2" marker-end="url(#bc-arrow)"/>
  <text class="t-link" x="205" y="156">ハッシュ値で連結</text>

  <!-- ブロック2 -->
  <rect class="box-block" x="46" y="168" width="288" height="104" rx="8"/>
  <text class="t-head" x="60" y="186">ブロック 2</text>
  <rect class="box-hash" x="60" y="194" width="260" height="22" rx="4"/>
  <text class="t-sub" x="190" y="209" text-anchor="middle">前ブロックのハッシュ値</text>
  <rect class="box-surf" x="60" y="218" width="260" height="22" rx="4"/>
  <text class="t-subg" x="190" y="233" text-anchor="middle">取引データ（トランザクション）</text>
  <rect class="box-surf" x="60" y="242" width="260" height="22" rx="4"/>
  <text class="t-subg" x="190" y="257" text-anchor="middle">ナンス（採掘で調整する値）</text>

  <line x1="190" y1="272" x2="190" y2="300" stroke="#2e6da4" stroke-width="2" marker-end="url(#bc-arrow)"/>
  <text class="t-link" x="205" y="290">ハッシュ値で連結</text>

  <!-- ブロック3 -->
  <rect class="box-block" x="46" y="302" width="288" height="104" rx="8"/>
  <text class="t-head" x="60" y="320">ブロック 3</text>
  <rect class="box-hash" x="60" y="328" width="260" height="22" rx="4"/>
  <text class="t-sub" x="190" y="343" text-anchor="middle">前ブロックのハッシュ値</text>
  <rect class="box-surf" x="60" y="352" width="260" height="22" rx="4"/>
  <text class="t-subg" x="190" y="367" text-anchor="middle">取引データ（トランザクション）</text>
  <rect class="box-surf" x="60" y="376" width="260" height="22" rx="4"/>
  <text class="t-subg" x="190" y="391" text-anchor="middle">ナンス（採掘で調整する値）</text>
</svg>
