<svg width="400" height="500" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans JP', sans-serif" style="max-width:400px;width:100%" role="img" aria-label="線形計画法の図解法">
  <defs>
    <marker id="lp-ax" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#222"/>
    </marker>
    <marker id="lp-zdir" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#b22234"/>
    </marker>
  </defs>

  <!-- 座標系: 原点(60,270), x方向+56px/unit, y方向-50px/unit -->

  <!-- 実行可能領域 -->
  <polygon points="60,270 228,270 172,120 60,70"
           fill="#2e6da4" fill-opacity="0.12" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="120" y="205" fill="#2e6da4" font-size="11" font-weight="bold">実行可能</text>
  <text x="125" y="220" fill="#2e6da4" font-size="11" font-weight="bold">領域</text>

  <!-- 軸 -->
  <line x1="60" y1="270" x2="345" y2="270" stroke="#222" stroke-width="1.5" marker-end="url(#lp-ax)"/>
  <line x1="60" y1="270" x2="60" y2="12" stroke="#222" stroke-width="1.5" marker-end="url(#lp-ax)"/>
  <text x="350" y="290" text-anchor="end" fill="#555" font-size="13" font-style="italic">x₁</text>
  <text x="40" y="20" text-anchor="middle" fill="#555" font-size="13" font-style="italic">x₂</text>
  <text x="48" y="283" fill="#555" font-size="10">O</text>

  <!-- 目盛り x軸 -->
  <line x1="116" y1="270" x2="116" y2="275" stroke="#555" stroke-width="1"/>
  <text x="116" y="288" text-anchor="middle" fill="#555" font-size="10">1</text>
  <line x1="172" y1="270" x2="172" y2="275" stroke="#555" stroke-width="1"/>
  <text x="172" y="288" text-anchor="middle" fill="#555" font-size="10">2</text>
  <line x1="228" y1="270" x2="228" y2="275" stroke="#555" stroke-width="1"/>
  <text x="228" y="288" text-anchor="middle" fill="#555" font-size="10">3</text>
  <line x1="284" y1="270" x2="284" y2="275" stroke="#555" stroke-width="1"/>
  <text x="284" y="288" text-anchor="middle" fill="#555" font-size="10">4</text>

  <!-- 目盛り y軸 -->
  <line x1="60" y1="220" x2="55" y2="220" stroke="#555" stroke-width="1"/>
  <text x="48" y="224" text-anchor="end" fill="#555" font-size="10">1</text>
  <line x1="60" y1="170" x2="55" y2="170" stroke="#555" stroke-width="1"/>
  <text x="48" y="174" text-anchor="end" fill="#555" font-size="10">2</text>
  <line x1="60" y1="120" x2="55" y2="120" stroke="#555" stroke-width="1"/>
  <text x="48" y="124" text-anchor="end" fill="#555" font-size="10">3</text>
  <line x1="60" y1="70" x2="55" y2="70" stroke="#555" stroke-width="1"/>
  <text x="48" y="74" text-anchor="end" fill="#555" font-size="10">4</text>
  <line x1="60" y1="20" x2="55" y2="20" stroke="#555" stroke-width="1"/>
  <text x="48" y="30" text-anchor="end" fill="#555" font-size="10">5</text>

  <!-- 制約線1: 3x₁ + x₂ = 9  (0,9)→(3,0) clipped -->
  <line x1="135" y1="20" x2="228" y2="270" stroke="#d4a017" stroke-width="1.8"/>
  <text x="240" y="258" fill="#d4a017" font-size="10">3x₁+x₂=9</text>

  <!-- 制約線2: x₁ + 2x₂ = 8  (0,4)→(8,0) clipped -->
  <line x1="60" y1="70" x2="330" y2="195" stroke="#3a7d44" stroke-width="1.8"/>
  <text x="280" y="213" fill="#3a7d44" font-size="10">x₁+2x₂=8</text>

  <!-- 等利益線 z=6 (破線, 薄め) -->
  <line x1="60" y1="120" x2="172" y2="270" stroke="#b22234" stroke-width="1" stroke-dasharray="5,4" opacity="0.5"/>
  <text x="68" y="115" fill="#b22234" font-size="9" opacity="0.6">z=6</text>

  <!-- 等利益線 z=12 (破線, 最適解を通過) -->
  <line x1="97" y1="20" x2="284" y2="270" stroke="#b22234" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="260" y="230" fill="#b22234" font-size="10" font-weight="bold">z=12</text>

  <!-- z増加方向の矢印 -->
  <line x1="115" y1="210" x2="145" y2="185" stroke="#b22234" stroke-width="1.5" marker-end="url(#lp-zdir)"/>
  <text x="148" y="182" fill="#b22234" font-size="9">z 増加</text>

  <!-- 頂点マーカー -->
  <circle cx="228" cy="270" r="3" fill="#222"/>
  <text x="218" y="262" fill="#222" font-size="9" text-anchor="end">(3, 0)</text>

  <circle cx="60" cy="70" r="3" fill="#222"/>
  <text x="68" y="62" fill="#222" font-size="9">(0, 4)</text>

  <!-- 最適解マーカー -->
  <circle cx="172" cy="120" r="6" fill="#fff" stroke="#b22234" stroke-width="2.5"/>
  <text x="182" y="110" fill="#b22234" font-size="11" font-weight="bold">最適解</text>
  <text x="182" y="125" fill="#b22234" font-size="10">(2, 3)</text>

  <!-- 追加：手順と特徴 -->
  <rect x="10" y="354" width="380" height="54" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5" rx="6"/>
  <text x="200" y="374" text-anchor="middle" font-size="12" fill="#1a3a5c" font-weight="bold">図解法の手順</text>
  <text x="200" y="390" text-anchor="middle" font-size="11" fill="#222">① 制約条件を直線で描画 → ② 実行可能領域を特定</text>
  <text x="200" y="404" text-anchor="middle" font-size="11" fill="#555">③ 等利益線を z 増加方向に平行移動 → ④ 頂点で最適解</text>

  <rect x="10" y="420" width="185" height="54" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5" rx="6"/>
  <text x="103" y="438" text-anchor="middle" font-size="11" fill="#1a3a5c" font-weight="bold">適用例（経済性管理）</text>
  <text x="103" y="454" text-anchor="middle" font-size="11" fill="#222">資源配分・生産計画</text>
  <text x="103" y="468" text-anchor="middle" font-size="11" fill="#555">人員・設備の最適化</text>

  <rect x="205" y="420" width="185" height="54" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5" rx="6"/>
  <text x="297" y="438" text-anchor="middle" font-size="11" fill="#1a3a5c" font-weight="bold">シンプレックス法</text>
  <text x="297" y="454" text-anchor="middle" font-size="11" fill="#222">多変数・多制約条件</text>
  <text x="297" y="468" text-anchor="middle" font-size="11" fill="#555">コンピュータで計算</text>
</svg>
