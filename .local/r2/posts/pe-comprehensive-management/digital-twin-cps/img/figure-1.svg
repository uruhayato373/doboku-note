<svg width="400" height="264" viewBox="0 0 400 264"
     xmlns="http://www.w3.org/2000/svg"
     style="max-width:400px;width:100%"
     role="img"
     aria-label="サイバーフィジカルシステムの双方向ループ。フィジカル空間のデータを IoT センサーでサイバー空間へ収集し、サイバー空間での分析・予測の結果をフィジカル空間へフィードバックする。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-name  { font-size: 14px; font-weight: bold; fill: #1a3a5c; }
      .t-sub   { font-size: 12px; fill: #1a3a5c; }
      .t-body  { font-size: 11px; fill: #555; }
      .t-flow  { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .box-phys  { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-cyber { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
    </style>
    <marker id="dt-arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 9,4 0,8" fill="#2e6da4"/>
    </marker>
  </defs>

  <text class="t-title" x="200" y="24" text-anchor="middle">サイバーフィジカルシステムの双方向ループ</text>

  <!-- 上の矢印：データ収集 -->
  <text class="t-flow" x="200" y="44" text-anchor="middle">① IoT センサーでデータを収集</text>
  <path d="M 150 78 C 150 52 250 52 250 78" fill="none" stroke="#2e6da4" stroke-width="2" marker-end="url(#dt-arrow)"/>

  <!-- フィジカル空間 -->
  <rect class="box-phys" x="24" y="78" width="164" height="124" rx="8"/>
  <text class="t-name" x="106" y="108" text-anchor="middle">フィジカル空間</text>
  <text class="t-sub"  x="106" y="127" text-anchor="middle">（現実世界）</text>
  <text class="t-body" x="106" y="157" text-anchor="middle">設備・建物・都市・</text>
  <text class="t-body" x="106" y="173" text-anchor="middle">人体などの実体</text>

  <!-- サイバー空間 -->
  <rect class="box-cyber" x="212" y="78" width="164" height="124" rx="8"/>
  <text class="t-name" x="294" y="106" text-anchor="middle">サイバー空間</text>
  <text class="t-sub"  x="294" y="124" text-anchor="middle">（仮想世界）</text>
  <text class="t-body" x="294" y="150" text-anchor="middle">デジタルツイン＝</text>
  <text class="t-body" x="294" y="166" text-anchor="middle">物理対象の仮想モデル</text>
  <text class="t-body" x="294" y="188" text-anchor="middle">AI が分析・予測・最適化</text>

  <!-- 下の矢印：フィードバック -->
  <path d="M 250 202 C 250 228 150 228 150 202" fill="none" stroke="#2e6da4" stroke-width="2" marker-end="url(#dt-arrow)"/>
  <text class="t-flow" x="200" y="252" text-anchor="middle">② 分析・予測の結果をフィードバック（制御・最適化）</text>
</svg>
