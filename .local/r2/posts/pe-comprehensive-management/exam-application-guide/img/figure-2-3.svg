<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" font-family="sans-serif">
  <!-- Title -->
  <text x="300" y="25" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">図表2.3　業務経歴における成長ストーリーのイメージ</text>

  <!-- Left arrow label: キャリア初期 → 現在 -->
  <text x="14" y="235" text-anchor="middle" font-size="11" fill="#555" transform="rotate(-90,14,235)">キャリア初期 → 現在（総監の視点）</text>

  <!-- Arrow on left side -->
  <line x1="28" y1="365" x2="28" y2="55" stroke="#888" stroke-width="1.5" marker-end="url(#arrup)"/>
  <defs>
    <marker id="arrup" markerWidth="8" markerHeight="8" refX="3" refY="0" orient="auto">
      <path d="M0,8 L3,0 L6,8 z" fill="#888"/>
    </marker>
  </defs>

  <!-- Layer 1 (bottom): 経済性管理 -->
  <rect x="45" y="330" width="430" height="50" rx="4" fill="#5b9bd5" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="260" y="352" text-anchor="middle" font-size="14" fill="white" font-weight="bold">経済性管理</text>
  <text x="260" y="370" text-anchor="middle" font-size="11" fill="white">（品質・工程・原価管理）</text>

  <!-- Layer 2: 人的資源管理 -->
  <rect x="75" y="270" width="370" height="50" rx="4" fill="#ed7d31" stroke="#b0592a" stroke-width="1.5"/>
  <text x="260" y="292" text-anchor="middle" font-size="14" fill="white" font-weight="bold">人的資源管理</text>
  <text x="260" y="310" text-anchor="middle" font-size="11" fill="white">（OJT・リーダーシップ）</text>

  <!-- Layer 3: 情報管理 -->
  <rect x="105" y="210" width="310" height="50" rx="4" fill="#a9d18e" stroke="#5a8a3c" stroke-width="1.5"/>
  <text x="260" y="232" text-anchor="middle" font-size="14" fill="#1a3a0a" font-weight="bold">情報管理</text>
  <text x="260" y="250" text-anchor="middle" font-size="11" fill="#1a3a0a">（ナレッジマネジメント・意思決定）</text>

  <!-- Layer 4: 安全管理 -->
  <rect x="135" y="150" width="250" height="50" rx="4" fill="#ffc000" stroke="#b08000" stroke-width="1.5"/>
  <text x="260" y="172" text-anchor="middle" font-size="14" fill="#3a2800" font-weight="bold">安全管理</text>
  <text x="260" y="190" text-anchor="middle" font-size="11" fill="#3a2800">（リスクマネジメント）</text>

  <!-- Layer 5 (top): 社会環境管理 -->
  <rect x="165" y="90" width="190" height="50" rx="4" fill="#c00000" stroke="#7a0000" stroke-width="1.5"/>
  <text x="260" y="112" text-anchor="middle" font-size="14" fill="white" font-weight="bold">社会環境管理</text>
  <text x="260" y="130" text-anchor="middle" font-size="11" fill="white">（環境保全・法令遵守）</text>

  <!-- Top label: 総合技術監理 -->
  <rect x="195" y="46" width="130" height="32" rx="4" fill="#7030a0" stroke="#4a1a6a" stroke-width="1.5"/>
  <text x="260" y="68" text-anchor="middle" font-size="13" fill="white" font-weight="bold">総合技術監理</text>

  <!-- Right brace and label -->
  <line x1="490" y1="90" x2="490" y2="380" stroke="#666" stroke-width="1.5"/>
  <line x1="490" y1="90" x2="483" y2="90" stroke="#666" stroke-width="1.5"/>
  <line x1="490" y1="380" x2="483" y2="380" stroke="#666" stroke-width="1.5"/>
  <line x1="490" y1="235" x2="497" y2="235" stroke="#666" stroke-width="1.5"/>
  <text x="510" y="220" font-size="12" fill="#333">5つの管理を</text>
  <text x="510" y="238" font-size="12" fill="#333">俯瞰的に統合</text>
  <text x="510" y="256" font-size="12" fill="#333">（業務1→5で深化）</text>

  <!-- Right annotations for career progression -->
  <text x="500" y="350" font-size="10" fill="#2e6da4">業務1-2: 上司の指導下で基本管理</text>
  <text x="500" y="285" font-size="10" fill="#b0592a">業務3: 主体的に部下育成・調整</text>
  <text x="500" y="165" font-size="10" fill="#b08000">業務4-5: 全体俯瞰・トレードオフ調整</text>

  <!-- Bottom note -->
  <text x="300" y="410" text-anchor="middle" font-size="11" fill="#555">※ 業務1→5にかけて、扱う管理の範囲が広がり、総監の視点が深化するストーリーを構成する</text>
</svg>
