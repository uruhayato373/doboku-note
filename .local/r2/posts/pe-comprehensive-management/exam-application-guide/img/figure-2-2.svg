<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 430" role="img" aria-label="業務経歴作成の5ステップ">
  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#2e6da4"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Hiragino Sans", "Yu Gothic", sans-serif; fill: #1f2937; }
  </style>

  <!-- Step 1 -->
  <rect x="15" y="10" width="350" height="55" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="190" y="33" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a3a5c">Step 1: 経験業務の書き出し</text>
  <text x="190" y="52" text-anchor="middle" font-size="13" fill="#555">網羅的に書き出す（絞り込まない）</text>

  <!-- Arrow -->
  <line x1="190" y1="65" x2="190" y2="85" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- Step 2 -->
  <rect x="15" y="87" width="350" height="55" rx="8" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="190" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a3a5c">Step 2: 5管理の視点で整理</text>
  <text x="190" y="129" text-anchor="middle" font-size="13" fill="#555">各業務を5管理に分類する</text>

  <!-- Arrow -->
  <line x1="190" y1="142" x2="190" y2="162" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- Step 3 -->
  <rect x="15" y="164" width="350" height="55" rx="8" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text x="190" y="187" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a3a5c">Step 3: 最重点管理項目の特定</text>
  <text x="190" y="206" text-anchor="middle" font-size="13" fill="#555">各業務で最も重視した管理分野を選ぶ</text>

  <!-- Arrow -->
  <line x1="190" y1="219" x2="190" y2="239" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- Step 4 -->
  <rect x="15" y="241" width="350" height="55" rx="8" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text x="190" y="264" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a3a5c">Step 4: トレードオフの描出</text>
  <text x="190" y="283" text-anchor="middle" font-size="13" fill="#555">異なる管理間の対立を整理する</text>

  <!-- Arrow -->
  <line x1="190" y1="296" x2="190" y2="316" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- Step 5 -->
  <rect x="15" y="318" width="350" height="55" rx="8" fill="#1a3a5c" stroke="#1a3a5c" stroke-width="1.5"/>
  <text x="190" y="341" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Step 5: 5つの業務に絞り込み</text>
  <text x="190" y="360" text-anchor="middle" font-size="13" fill="#e8f0fe">バランスと成長ストーリーを意識</text>

</svg>
