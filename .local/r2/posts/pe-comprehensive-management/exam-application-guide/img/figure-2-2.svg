<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 360" width="740" height="360" font-family="sans-serif">
  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4a6fa5"/>
    </marker>
    <marker id="arr2d" markerWidth="8" markerHeight="8" refX="3" refY="6" orient="auto">
      <path d="M0,0 L6,0 L3,8 z" fill="#4a6fa5"/>
    </marker>
  </defs>

  <!-- Step 1 -->
  <rect x="10" y="40" width="130" height="55" rx="6" fill="#4a6fa5" stroke="#2c3e6b" stroke-width="1.5"/>
  <text x="75" y="62" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Step 1</text>
  <text x="75" y="82" text-anchor="middle" font-size="11" fill="white">経験業務の書き出し</text>

  <!-- Arrow 1→2 -->
  <line x1="140" y1="67" x2="158" y2="67" stroke="#4a6fa5" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- Step 2 -->
  <rect x="160" y="30" width="150" height="75" rx="6" fill="#4a6fa5" stroke="#2c3e6b" stroke-width="1.5"/>
  <text x="235" y="52" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Step 2</text>
  <text x="235" y="70" text-anchor="middle" font-size="11" fill="white">各業務を5つの管理の</text>
  <text x="235" y="86" text-anchor="middle" font-size="11" fill="white">視点で整理</text>

  <!-- Arrow 2→3 -->
  <line x1="310" y1="67" x2="328" y2="67" stroke="#4a6fa5" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- Step 3 -->
  <rect x="330" y="20" width="160" height="95" rx="6" fill="#4a6fa5" stroke="#2c3e6b" stroke-width="1.5"/>
  <text x="410" y="42" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Step 3</text>
  <text x="410" y="62" text-anchor="middle" font-size="11" fill="white">管理技術の書き出し</text>
  <text x="410" y="78" text-anchor="middle" font-size="11" fill="white">最重点管理項目の</text>
  <text x="410" y="94" text-anchor="middle" font-size="11" fill="white">特定</text>

  <!-- Arrow down from Step 3 -->
  <line x1="410" y1="115" x2="410" y2="143" stroke="#4a6fa5" stroke-width="2" marker-end="url(#arr2d)"/>

  <!-- Step 4 -->
  <rect x="330" y="145" width="160" height="65" rx="6" fill="#4a6fa5" stroke="#2c3e6b" stroke-width="1.5"/>
  <text x="410" y="170" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Step 4</text>
  <text x="410" y="190" text-anchor="middle" font-size="11" fill="white">トレードオフの描出</text>

  <!-- Arrow down from Step 4 -->
  <line x1="410" y1="210" x2="410" y2="238" stroke="#4a6fa5" stroke-width="2" marker-end="url(#arr2d)"/>

  <!-- Step 5 -->
  <rect x="330" y="240" width="160" height="55" rx="6" fill="#c0392b" stroke="#922b21" stroke-width="1.5"/>
  <text x="410" y="262" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Step 5</text>
  <text x="410" y="280" text-anchor="middle" font-size="11" fill="white">5つの業務への絞り込み</text>

  <!-- Right side annotations -->
  <rect x="530" y="25" width="195" height="85" rx="4" fill="#f0f4f8" stroke="#ccc" stroke-width="1"/>
  <text x="627" y="48" text-anchor="middle" font-size="11" fill="#333">経験してきた業務を</text>
  <text x="627" y="65" text-anchor="middle" font-size="11" fill="#333">時系列的にどんどん</text>
  <text x="627" y="82" text-anchor="middle" font-size="11" fill="#333">書き出す段階。</text>
  <text x="627" y="99" text-anchor="middle" font-size="11" fill="#555">この段階では絞り込まない</text>

  <rect x="530" y="145" width="195" height="65" rx="4" fill="#f0f4f8" stroke="#ccc" stroke-width="1"/>
  <text x="627" y="168" text-anchor="middle" font-size="11" fill="#333">各管理間のトレードオフを</text>
  <text x="627" y="185" text-anchor="middle" font-size="11" fill="#333">体系的に整理する</text>
  <text x="627" y="200" text-anchor="middle" font-size="11" fill="#555">経済性管理同士は除外</text>

  <rect x="530" y="240" width="195" height="55" rx="4" fill="#fdf0f0" stroke="#c0392b" stroke-width="1"/>
  <text x="627" y="262" text-anchor="middle" font-size="11" fill="#922b21" font-weight="bold">バランスと成長ストーリーを</text>
  <text x="627" y="280" text-anchor="middle" font-size="11" fill="#922b21" font-weight="bold">意識して5つに絞り込む</text>

  <!-- Bottom label -->
  <text x="370" y="340" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">図表2.2　業務経歴作成のステップ</text>
</svg>
