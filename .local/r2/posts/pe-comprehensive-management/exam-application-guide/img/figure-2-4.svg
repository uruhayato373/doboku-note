<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500"
     style="max-width:400px;width:100%"
     role="img" aria-label="業務内容の詳細の記載項目（総監背景・最重点管理項目→管理間のトレードオフ→改善案→成果）の縦フロー図">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-title { font-size: 14px; font-weight: bold; fill: #1a3a5c; }
      .t-desc  { font-size: 12px; fill: #555; }
      .t-warn-title { font-size: 14px; font-weight: bold; fill: #1a3a5c; }
      .t-warn-desc  { font-size: 12px; fill: #555; }
      .box-brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-warn  { fill: #fff3cd; stroke: #d4a017; stroke-width: 2; }
    </style>
    <marker id="arr4" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#2e6da4"/>
    </marker>
  </defs>

  <!-- Row 1: 2-column - 業務内容 / 最重点管理項目 -->
  <rect class="box-brand" x="20" y="20" width="170" height="76" rx="8"/>
  <text class="t-title" x="105" y="48" text-anchor="middle">総監背景を踏まえた</text>
  <text class="t-title" x="105" y="66" text-anchor="middle">業務内容</text>
  <text class="t-desc" x="105" y="84" text-anchor="middle">5管理の視点で記述</text>

  <rect class="box-brand" x="210" y="20" width="170" height="76" rx="8"/>
  <text class="t-title" x="295" y="48" text-anchor="middle">最重点管理項目</text>
  <text class="t-desc" x="295" y="68" text-anchor="middle">5管理の中で最も</text>
  <text class="t-desc" x="295" y="84" text-anchor="middle">重視した管理</text>

  <!-- Arrows merging to row 2 -->
  <line x1="105" y1="96" x2="180" y2="130" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arr4)"/>
  <line x1="295" y1="96" x2="220" y2="130" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arr4)"/>

  <!-- Row 2: 管理間のトレードオフ -->
  <rect class="box-brand" x="20" y="140" width="360" height="72" rx="8"/>
  <text class="t-title" x="200" y="167" text-anchor="middle">管理間のトレードオフ</text>
  <text class="t-desc" x="200" y="187" text-anchor="middle">5管理のうち2つの管理間の対立・調整</text>
  <text class="t-desc" x="200" y="203" text-anchor="middle">（経済性管理同士は除外）</text>

  <line x1="200" y1="212" x2="200" y2="240" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arr4)"/>

  <!-- Row 3: 改善案・解決策 -->
  <rect class="box-brand" x="20" y="250" width="360" height="72" rx="8"/>
  <text class="t-title" x="200" y="277" text-anchor="middle">改善案・解決策</text>
  <text class="t-desc" x="200" y="297" text-anchor="middle">トレードオフの調整方法</text>
  <text class="t-desc" x="200" y="313" text-anchor="middle">管理技術の適用</text>

  <line x1="200" y1="322" x2="200" y2="355" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arr4)"/>

  <!-- Row 4: 成果 (highlighted - warn) -->
  <rect class="box-warn" x="20" y="365" width="360" height="115" rx="8"/>
  <text class="t-warn-title" x="200" y="400" text-anchor="middle">成果</text>
  <text class="t-warn-desc" x="200" y="428" text-anchor="middle">プロジェクト完遂・効果的な仕組みの構築</text>
  <text class="t-warn-desc" x="200" y="452" text-anchor="middle">担当技術者のスキル向上 等</text>
</svg>
