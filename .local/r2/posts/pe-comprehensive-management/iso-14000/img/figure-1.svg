<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" width="400" height="500" role="img" aria-label="ISO 14001 環境マネジメントシステムのPDCAサイクル。P計画：環境方針・目標・計画。D実施：実施と運用。C点検：監視・測定・内部監査。A見直し：是正・予防・マネジメントレビュー。中心：継続的改善。EMS は法令遵守手続きではなく自主的な枠組み。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-title { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-sec   { font-size: 11px; font-weight: bold; fill: #ffffff; }
      .t-hd    { font-size: 13px; font-weight: bold; }
      .t-sub   { font-size: 11px; fill: #555; }
      .t-foot  { font-size: 11px; fill: #8a8a8a; }
    </style>
  </defs>
  <rect width="400" height="500" fill="#ffffff"/>

  <!-- タイトル -->
  <text class="t-title" x="200" y="22" text-anchor="middle">ISO 14001 — EMS の PDCA サイクル</text>
  <line x1="20" y1="30" x2="380" y2="30" stroke="#d7d7d7" stroke-width="1"/>

  <!-- セクションバー -->
  <rect x="8" y="34" width="384" height="18" rx="3" fill="#3a7d44"/>
  <text class="t-sec" x="200" y="47" text-anchor="middle">環境マネジメントシステム（EMS）の仕組み</text>

  <!-- ── PDCA 四象限レイアウト ── -->
  <!-- P（左上）: x=8, y=58, w=184, h=120 -->
  <rect x="8"   y="58" width="184" height="120" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="2"/>
  <rect x="8"   y="58" width="184" height="28"  rx="6" fill="#2e6da4"/>
  <rect x="8"   y="72"  width="184" height="14" fill="#2e6da4"/>
  <text x="100" y="78"  text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">P　計画</text>
  <text x="100" y="103" text-anchor="middle" font-size="11" fill="#1a3a5c" font-weight="bold">環境方針の設定</text>
  <text x="100" y="120" text-anchor="middle" font-size="11" fill="#555">環境側面・法規制の特定</text>
  <text x="100" y="136" text-anchor="middle" font-size="11" fill="#555">目標・実施計画の策定</text>
  <text x="100" y="152" text-anchor="middle" font-size="11" fill="#555">リスク機会の分析</text>
  <text x="100" y="168" text-anchor="middle" font-size="11" fill="#555">（トップが方針表明）</text>

  <!-- D（右上）: x=208, y=58, w=184, h=120 -->
  <rect x="208" y="58"  width="184" height="120" rx="6" fill="#d0e8d0" stroke="#3a7d44" stroke-width="2"/>
  <rect x="208" y="58"  width="184" height="28"  rx="6" fill="#3a7d44"/>
  <rect x="208" y="72"  width="184" height="14" fill="#3a7d44"/>
  <text x="300" y="78"  text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">D　実施</text>
  <text x="300" y="103" text-anchor="middle" font-size="11" fill="#1a3a5c" font-weight="bold">体制・責任の明確化</text>
  <text x="300" y="120" text-anchor="middle" font-size="11" fill="#555">教育訓練・意識向上</text>
  <text x="300" y="136" text-anchor="middle" font-size="11" fill="#555">コミュニケーション</text>
  <text x="300" y="152" text-anchor="middle" font-size="11" fill="#555">文書管理・運用管理</text>
  <text x="300" y="168" text-anchor="middle" font-size="11" fill="#555">緊急事態への対応</text>

  <!-- 中央：継続的改善 楕円 -->
  <ellipse cx="200" cy="200" rx="56" ry="38" fill="#ffffff" stroke="#3a7d44" stroke-width="2"/>
  <text x="200" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a7d44">継続的</text>
  <text x="200" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a7d44">改善</text>

  <!-- A（左下）: x=8, y=202, w=184, h=110 -->
  <rect x="8"   y="202" width="184" height="110" rx="6" fill="#fff3cd" stroke="#d4a017" stroke-width="2"/>
  <rect x="8"   y="202" width="184" height="28"  rx="6" fill="#d4a017"/>
  <rect x="8"   y="216" width="184" height="14" fill="#d4a017"/>
  <text x="100" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">A　見直し</text>
  <text x="100" y="247" text-anchor="middle" font-size="11" fill="#1a3a5c" font-weight="bold">是正処置・予防処置</text>
  <text x="100" y="264" text-anchor="middle" font-size="11" fill="#555">不適合の是正</text>
  <text x="100" y="280" text-anchor="middle" font-size="11" fill="#555">マネジメントレビュー</text>
  <text x="100" y="296" text-anchor="middle" font-size="11" fill="#555">（トップによる見直し）</text>

  <!-- C（右下）: x=208, y=202, w=184, h=110 -->
  <rect x="208" y="202" width="184" height="110" rx="6" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="2"/>
  <rect x="208" y="202" width="184" height="28"  rx="6" fill="#8a8a8a"/>
  <rect x="208" y="216" width="184" height="14" fill="#8a8a8a"/>
  <text x="300" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">C　点検</text>
  <text x="300" y="247" text-anchor="middle" font-size="11" fill="#1a3a5c" font-weight="bold">監視・測定・評価</text>
  <text x="300" y="264" text-anchor="middle" font-size="11" fill="#555">法令遵守の評価</text>
  <text x="300" y="280" text-anchor="middle" font-size="11" fill="#555">内部監査の実施</text>
  <text x="300" y="296" text-anchor="middle" font-size="11" fill="#555">是正処置の決定</text>

  <!-- 循環矢印（時計回り） -->
  <!-- P→D（上） -->
  <path d="M192,68 Q200,56 208,68" fill="none" stroke="#3a7d44" stroke-width="2"/>
  <polygon points="0,0 5,4 0,8" transform="translate(205,65) rotate(50)" fill="#3a7d44"/>
  <!-- D→C（右） -->
  <path d="M392,118 Q404,200 392,240" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <polygon points="0,0 5,4 0,8" transform="translate(392,237) rotate(100)" fill="#8a8a8a"/>
  <!-- C→A（下） -->
  <path d="M208,312 Q200,324 192,312" fill="none" stroke="#d4a017" stroke-width="2"/>
  <polygon points="0,0 5,4 0,8" transform="translate(192,310) rotate(230)" fill="#d4a017"/>
  <!-- A→P（左） -->
  <path d="M8,240 Q-4,200 8,118" fill="none" stroke="#2e6da4" stroke-width="2"/>
  <polygon points="0,0 5,4 0,8" transform="translate(8,121) rotate(-80)" fill="#2e6da4"/>

  <!-- ── 引っかけポイント注記 ── -->
  <rect x="8" y="326" width="384" height="18" rx="3" fill="#d4a017"/>
  <text class="t-sec" x="200" y="339" text-anchor="middle">頻出の引っかけ論点（R1・R6 繰り返し出題）</text>

  <rect x="8" y="350" width="384" height="78" rx="5" fill="#fff3cd" stroke="#d4a017" stroke-width="1"/>
  <text x="20" y="370" font-size="12" font-weight="bold" fill="#1a3a5c">EMS は「法令遵守の手続き管理システム」ではない</text>
  <text x="20" y="390" font-size="11" fill="#555">ISO 14001 は自主的な PDCA の枠組みであり、</text>
  <text x="20" y="408" font-size="11" fill="#555">環境関連法令で定められた義務の手続きを網羅するものではない。</text>
  <text x="20" y="420" font-size="11" fill="#555">法令遵守はあくまで最低条件。EMS はその上位層。</text>

  <!-- ── EMS が対象とする環境の範囲 ── -->
  <rect x="8" y="438" width="384" height="46" rx="5" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <text x="20" y="456" font-size="11" font-weight="bold" fill="#1a3a5c">「環境」の定義：大気・水質・土地・天然資源・植物・動物・人</text>
  <text x="20" y="473" font-size="11" fill="#555">単一媒体に閉じず生態系全体と人間の相互作用を包括的に対象とする</text>

  <!-- フッター -->
  <text class="t-foot" x="200" y="497" text-anchor="middle">ISO 14001（1996年制定・2004年・2015年改訂）</text>
</svg>
