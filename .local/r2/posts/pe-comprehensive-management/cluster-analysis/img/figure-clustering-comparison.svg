<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
     style="max-width:400px;width:100%"
     role="img"
     aria-label="階層的クラスター分析（デンドログラムで近いもの同士を段階的に併合し、切る高さでクラスタ数を決める）と非階層的クラスター分析（k-meansでkを先に指定し各点を最寄りの重心へ反復割当する）の違いを対比した図。k-meansは非階層的手法。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #222; }   /* ink-strong */
      .t-sub   { font-size: 12px; fill: #555; }                      /* ink-body */
      .t-panel { font-size: 13px; font-weight: bold; fill: #1a3a5c; }/* ink-strong */
      .t-cap   { font-size: 11px; fill: #555; }                      /* ink-body */
      .t-note  { font-size: 11px; fill: #8a8a8a; }                   /* ink-muted */
      .t-cut   { font-size: 11px; font-weight: bold; fill: #b22234; }/* danger */
      .box-brand    { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-positive { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .den   { stroke: #2e6da4; stroke-width: 1.3; fill: none; }     /* brand */
      .cut   { stroke: #b22234; stroke-width: 1.3; stroke-dasharray: 4,3; fill: none; } /* danger */
      .grp   { stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3,2; fill: none; }   /* ink-muted */
    </style>
  </defs>

  <!-- タイトル -->
  <text class="t-title" x="200" y="28" text-anchor="middle">階層的 と 非階層的クラスター分析</text>
  <text class="t-sub" x="200" y="48" text-anchor="middle">k-means は非階層的（階層的ではない）</text>

  <!-- ===== パネルA：階層的 ===== -->
  <rect class="box-brand" x="20" y="62" width="12" height="12" rx="2"/>
  <text class="t-panel" x="38" y="72">階層的クラスター分析</text>

  <!-- デンドログラム（左） -->
  <!-- 葉（下端） -->
  <circle cx="34"  cy="252" r="3" fill="#2e6da4"/>
  <circle cx="58"  cy="252" r="3" fill="#2e6da4"/>
  <circle cx="82"  cy="252" r="3" fill="#2e6da4"/>
  <circle cx="120" cy="252" r="3" fill="#2e6da4"/>
  <circle cx="150" cy="252" r="3" fill="#2e6da4"/>
  <!-- m1: 34+58 -> y228 -->
  <path class="den" d="M34 252 V228 H58 V252"/>
  <!-- m2: m1(46)+82 -> y206 -->
  <path class="den" d="M46 228 V206 H82 V252"/>
  <!-- m3: 120+150 -> y230 -->
  <path class="den" d="M120 252 V230 H150 V252"/>
  <!-- root: m2(64)+m3(135) -> y186 -->
  <path class="den" d="M64 206 V186 H135 V230"/>
  <!-- 切る高さ -->
  <line class="cut" x1="20" y1="196" x2="172" y2="196"/>
  <text class="t-cut" x="96" y="192" text-anchor="middle">切る高さ → 2クラスタ</text>

  <!-- キャプション（右） -->
  <text class="t-cap" x="192" y="120">近いもの同士を</text>
  <text class="t-cap" x="192" y="138">段階的に併合する</text>
  <text class="t-cap" x="192" y="156">デンドログラムで</text>
  <text class="t-cap" x="192" y="174">可視化</text>
  <text class="t-cap" x="192" y="200">クラスタ数は後で</text>
  <text class="t-cap" x="192" y="218">決める／小〜中規模</text>
  <text class="t-note" x="192" y="244">代表：ウォード法・最短距離法</text>

  <line x1="20" y1="280" x2="380" y2="280" stroke="#d7d7d7" stroke-width="1"/>

  <!-- ===== パネルB：非階層的（k-means） ===== -->
  <rect class="box-positive" x="20" y="292" width="12" height="12" rx="2"/>
  <text class="t-panel" x="38" y="302">非階層的クラスター分析（k-means）</text>

  <!-- 散布図（左）：3グループ＋重心× -->
  <!-- グループ1（青） -->
  <ellipse class="grp" cx="52" cy="346" rx="20" ry="16"/>
  <circle cx="42" cy="338" r="3" fill="#2e6da4"/>
  <circle cx="58" cy="340" r="3" fill="#2e6da4"/>
  <circle cx="48" cy="356" r="3" fill="#2e6da4"/>
  <circle cx="62" cy="352" r="3" fill="#2e6da4"/>
  <path class="den" d="M47 341 L57 351 M57 341 L47 351" stroke="#1a3a5c" stroke-width="2"/>
  <!-- グループ2（緑） -->
  <ellipse class="grp" cx="128" cy="340" rx="20" ry="16"/>
  <circle cx="118" cy="332" r="3" fill="#3a7d44"/>
  <circle cx="136" cy="336" r="3" fill="#3a7d44"/>
  <circle cx="124" cy="350" r="3" fill="#3a7d44"/>
  <circle cx="140" cy="346" r="3" fill="#3a7d44"/>
  <path class="den" d="M124 335 L134 345 M134 335 L124 345" stroke="#1a3a5c" stroke-width="2"/>
  <!-- グループ3（赤） -->
  <ellipse class="grp" cx="84" cy="412" rx="20" ry="16"/>
  <circle cx="74" cy="404" r="3" fill="#b22234"/>
  <circle cx="92" cy="408" r="3" fill="#b22234"/>
  <circle cx="80" cy="422" r="3" fill="#b22234"/>
  <circle cx="98" cy="418" r="3" fill="#b22234"/>
  <path class="den" d="M80 408 L90 418 M90 408 L80 418" stroke="#1a3a5c" stroke-width="2"/>
  <text class="t-note" x="20" y="452">× ＝ 重心（セントロイド）</text>

  <!-- キャプション（右） -->
  <text class="t-cap" x="192" y="332">k を先に指定する</text>
  <text class="t-cap" x="192" y="350">各点を最寄りの</text>
  <text class="t-cap" x="192" y="368">重心へ割当てる</text>
  <text class="t-cap" x="192" y="386">→ 重心再計算を反復</text>
  <text class="t-cap" x="192" y="412">大規模データ向き</text>
  <text class="t-note" x="192" y="436">代表：k-means法</text>
</svg>
