<svg viewBox="0 0 460 480" xmlns="http://www.w3.org/2000/svg" style="max-width:460px;width:100%" role="img" aria-label="システムの高信頼化6方策。左=フォールトアボイダンス（故障させない）、右=フォルトトレランス・フェールソフト・フェールセーフ・フールプルーフ・インターロック（故障や誤操作を前提に安全側へ制御）">
  <!-- viewBox幅460: 2カラム比較で各列200px+余白20pxを確保するために500未満の最小値を選択 -->
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-col   { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-en    { font-size: 11px; fill: #8a8a8a; }
      .t-main  { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-note  { font-size: 12px; fill: #555; }
      .col-brand { fill: #c5d8f8; stroke: #2e6da4; stroke-width: 1.5; }
      .col-pos   { fill: #b2d9b2; stroke: #3a7d44; stroke-width: 1.5; }
      .box-brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-pos   { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .badge-brand { fill: #ffffff; stroke: #2e6da4; stroke-width: 1.5; }
      .badge-pos   { fill: #ffffff; stroke: #3a7d44; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- ===== タイトル ===== -->
  <text class="t-title" x="230" y="26" text-anchor="middle">システムの高信頼化 6方策</text>

  <!-- ===== 列見出し ===== -->
  <rect class="col-brand" x="18" y="38" width="200" height="46" rx="7"/>
  <text class="t-col" x="118" y="59" text-anchor="middle">故障回避系</text>
  <text class="t-en"  x="118" y="76" text-anchor="middle">Fault Avoidance</text>

  <rect class="col-pos" x="242" y="38" width="200" height="46" rx="7"/>
  <text class="t-col" x="342" y="59" text-anchor="middle">故障・誤操作許容系</text>
  <text class="t-en"  x="342" y="76" text-anchor="middle">Fault Tolerance &amp; Fail-Safe</text>

  <!-- ===== 中央分割線 ===== -->
  <line x1="230" y1="38" x2="230" y2="460" stroke="#d7d7d7" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ===== 左列: フォールトアボイダンス（1項目・縦を大きく取る） ===== -->
  <rect class="box-brand" x="18" y="96" width="200" height="100" rx="8"/>
  <circle class="badge-brand" cx="42" cy="122" r="13"/>
  <text style="font-size:11px;font-weight:bold;fill:#2e6da4" x="42" y="127" text-anchor="middle">FA</text>
  <text class="t-main" x="62" y="119">フォールトアボイダンス</text>
  <text class="t-en"   x="62" y="135">Fault Avoidance</text>
  <text class="t-note" x="28" y="156">部品品質・予防措置を徹底し</text>
  <text class="t-note" x="28" y="172">故障確率そのものを低減する</text>
  <text class="t-note" x="28" y="188">= 「故障させない」アプローチ</text>

  <!-- ===== 右列: 5項目（各セル高72px） ===== -->

  <!-- 1. フォルトトレランス (y=96) -->
  <rect class="box-pos" x="242" y="96" width="200" height="72" rx="8"/>
  <circle class="badge-pos" cx="266" cy="120" r="13"/>
  <text style="font-size:11px;font-weight:bold;fill:#3a7d44" x="266" y="125" text-anchor="middle">FT</text>
  <text class="t-main" x="286" y="117">フォルトトレランス</text>
  <text class="t-en"   x="286" y="133">Fault Tolerance</text>
  <text class="t-note" x="252" y="154">故障が起きても全体機能を維持</text>

  <!-- 2. フェールソフト (y=176) -->
  <rect class="box-pos" x="242" y="176" width="200" height="72" rx="8"/>
  <circle class="badge-pos" cx="266" cy="200" r="13"/>
  <text style="font-size:11px;font-weight:bold;fill:#3a7d44" x="266" y="205" text-anchor="middle">FSo</text>
  <text class="t-main" x="286" y="197">フェールソフト</text>
  <text class="t-en"   x="286" y="213">Fail Soft</text>
  <text class="t-note" x="252" y="234">故障時に機能を縮退させ部分継続</text>

  <!-- 3. フェールセーフ (y=256) -->
  <rect class="box-pos" x="242" y="256" width="200" height="72" rx="8"/>
  <circle class="badge-pos" cx="266" cy="280" r="13"/>
  <text style="font-size:11px;font-weight:bold;fill:#3a7d44" x="266" y="285" text-anchor="middle">FS</text>
  <text class="t-main" x="286" y="277">フェールセーフ</text>
  <text class="t-en"   x="286" y="293">Fail Safe</text>
  <text class="t-note" x="252" y="314">故障時に必ず安全な方向へ制御</text>

  <!-- 4. フールプルーフ (y=336) -->
  <rect class="box-pos" x="242" y="336" width="200" height="72" rx="8"/>
  <circle class="badge-pos" cx="266" cy="360" r="13"/>
  <text style="font-size:11px;font-weight:bold;fill:#3a7d44" x="266" y="365" text-anchor="middle">FP</text>
  <text class="t-main" x="286" y="357">フールプルーフ</text>
  <text class="t-en"   x="286" y="373">Foolproof</text>
  <text class="t-note" x="252" y="394">誤操作しても危険が生じない設計</text>

  <!-- 5. インターロック (y=416) -->
  <rect class="box-pos" x="242" y="416" width="200" height="44" rx="8"/>
  <circle class="badge-pos" cx="266" cy="438" r="13"/>
  <text style="font-size:11px;font-weight:bold;fill:#3a7d44" x="266" y="443" text-anchor="middle">IL</text>
  <text class="t-main" x="286" y="434">インターロック</text>
  <text class="t-note" x="286" y="452">条件不成立で動作させない機構</text>

</svg>
