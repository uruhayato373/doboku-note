<svg width="400" height="500" viewBox="0 0 400 500"
     xmlns="http://www.w3.org/2000/svg"
     style="max-width:400px;width:100%"
     role="img"
     aria-label="アジャイル開発の反復サイクル。計画・開発・テスト・レビューの短いイテレーションを繰り返し、反復ごとに動作するソフトウェアを提供する。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-node  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-ctr   { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-ctrs  { font-size: 11px; fill: #555; }
      .t-cap   { font-size: 11px; fill: #555; }
      .box-brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-note  { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1; }
    </style>
    <marker id="ag-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto">
      <polygon points="0,0 10,4.5 0,9" fill="#2e6da4"/>
    </marker>
  </defs>

  <text class="t-title" x="200" y="28" text-anchor="middle">アジャイル開発の反復サイクル</text>

  <!-- 循環矢印（中心を200,178に移動・拡大） -->
  <path d="M 260 88 C 308 98 338 120 352 152" fill="none" stroke="#2e6da4" stroke-width="2" marker-end="url(#ag-arrow)"/>
  <path d="M 352 208 C 338 238 308 260 266 270" fill="none" stroke="#2e6da4" stroke-width="2" marker-end="url(#ag-arrow)"/>
  <path d="M 136 272 C 94 262 64 240 48 208" fill="none" stroke="#2e6da4" stroke-width="2" marker-end="url(#ag-arrow)"/>
  <path d="M 48 152 C 64 120 94 98 140 88" fill="none" stroke="#2e6da4" stroke-width="2" marker-end="url(#ag-arrow)"/>

  <!-- 中央ラベル -->
  <text class="t-ctr"  x="200" y="168" text-anchor="middle">イテレーション</text>
  <text class="t-ctrs" x="200" y="188" text-anchor="middle">＝ スプリント</text>
  <text class="t-ctrs" x="200" y="207" text-anchor="middle">（1〜4 週間）</text>

  <!-- ノード（中心200,178、半径約110） -->
  <rect class="box-brand" x="146" y="56" width="108" height="42" rx="8"/>
  <text class="t-node" x="200" y="82" text-anchor="middle">① 計画</text>

  <rect class="box-brand" x="272" y="152" width="110" height="42" rx="8"/>
  <text class="t-node" x="327" y="178" text-anchor="middle">② 開発・実装</text>

  <rect class="box-brand" x="146" y="248" width="108" height="42" rx="8"/>
  <text class="t-node" x="200" y="274" text-anchor="middle">③ テスト</text>

  <rect class="box-brand" x="18" y="152" width="110" height="42" rx="8"/>
  <text class="t-node" x="73" y="178" text-anchor="middle">④ レビュー</text>

  <!-- キャプション -->
  <text class="t-cap" x="200" y="316" text-anchor="middle">反復ごとに動作するソフトウェアを提供し、要件の変化に対応する</text>

  <!-- ウォーターフォールとの対比ボックス -->
  <rect x="15" y="332" width="370" height="148" rx="6" class="box-note"/>
  <text x="200" y="352" font-size="12" fill="#1a3a5c" text-anchor="middle" font-weight="bold">アジャイル vs ウォーターフォール</text>
  <line x1="15" y1="359" x2="385" y2="359" stroke="#d7d7d7" stroke-width="1"/>
  <!-- 列見出し -->
  <line x1="200" y1="359" x2="200" y2="478" stroke="#d7d7d7" stroke-width="1"/>
  <text x="107" y="378" font-size="11" fill="#555" text-anchor="middle">アジャイル</text>
  <text x="292" y="378" font-size="11" fill="#555" text-anchor="middle">ウォーターフォール</text>
  <line x1="15" y1="383" x2="385" y2="383" stroke="#d7d7d7" stroke-width="0.5"/>
  <!-- 行1 -->
  <text x="107" y="400" font-size="11" fill="#222" text-anchor="middle">短期反復で逐次改善</text>
  <text x="292" y="400" font-size="11" fill="#222" text-anchor="middle">工程を順次一括実施</text>
  <!-- 行2 -->
  <text x="107" y="420" font-size="11" fill="#222" text-anchor="middle">要件変更に柔軟対応</text>
  <text x="292" y="420" font-size="11" fill="#222" text-anchor="middle">要件を事前固定</text>
  <!-- 行3 -->
  <text x="107" y="440" font-size="11" fill="#222" text-anchor="middle">動くものを早期提供</text>
  <text x="292" y="440" font-size="11" fill="#222" text-anchor="middle">最終納品まで不可視</text>
  <!-- 行4 -->
  <text x="107" y="460" font-size="11" fill="#b22234" text-anchor="middle">不確実な要件に有効</text>
  <text x="292" y="460" font-size="11" fill="#555" text-anchor="middle">要件確定済みに有効</text>

  <!-- フッターサマリー -->
  <text x="200" y="490" font-size="11" fill="#8a8a8a" text-anchor="middle">総監：変化対応力（人的資源・情報管理）の観点で頻出</text>
</svg>
