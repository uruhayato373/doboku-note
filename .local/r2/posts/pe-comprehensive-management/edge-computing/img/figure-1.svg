<svg width="380" height="368" viewBox="0 0 380 368"
     xmlns="http://www.w3.org/2000/svg"
     style="max-width:380px;width:100%"
     role="img"
     aria-label="エッジコンピューティングの階層構造。IoT デバイスが取得した全データをエッジが現場近傍でリアルタイム処理し、必要なデータのみをクラウドへ送信して帯域を節約する。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-name  { font-size: 14px; font-weight: bold; fill: #1a3a5c; }
      .t-role  { font-size: 12px; fill: #555; }
      .t-attr  { font-size: 11px; fill: #8a8a8a; }
      .t-flow  { font-size: 11px; fill: #8a8a8a; }
      .box-brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
    </style>
    <marker id="ec-arrow" markerWidth="9" markerHeight="8" refX="4.5" refY="1" orient="auto">
      <polygon points="0,8 4.5,0 9,8" fill="#2e6da4"/>
    </marker>
  </defs>

  <text class="t-title" x="190" y="24" text-anchor="middle">エッジコンピューティングの階層</text>

  <!-- クラウド -->
  <rect class="box-brand" x="30" y="38" width="320" height="78" rx="8"/>
  <text class="t-name" x="46" y="64">クラウド（データセンター）</text>
  <text class="t-role" x="46" y="83">大規模なデータ分析・機械学習・長期保存</text>
  <text class="t-attr" x="46" y="101">通信遅延：数十〜数百ミリ秒</text>

  <line x1="190" y1="156" x2="190" y2="120" stroke="#2e6da4" stroke-width="2" marker-end="url(#ec-arrow)"/>
  <text class="t-flow" x="205" y="132">必要なデータのみ送信</text>
  <text class="t-flow" x="205" y="147">（通信帯域を節約）</text>

  <!-- エッジ -->
  <rect class="box-brand" x="30" y="156" width="320" height="78" rx="8"/>
  <text class="t-name" x="46" y="182">エッジ（データ発生源の近く）</text>
  <text class="t-role" x="46" y="201">リアルタイム処理・前処理・フィルタリング</text>
  <text class="t-attr" x="46" y="219">通信遅延：数ミリ秒以下</text>

  <line x1="190" y1="274" x2="190" y2="238" stroke="#2e6da4" stroke-width="2" marker-end="url(#ec-arrow)"/>
  <text class="t-flow" x="205" y="259">現場で発生する全データ</text>

  <!-- IoTデバイス -->
  <rect class="box-brand" x="30" y="274" width="320" height="78" rx="8"/>
  <text class="t-name" x="46" y="306">IoT デバイス（データ発生源）</text>
  <text class="t-role" x="46" y="326">センサーで現実世界のデータを取得</text>
</svg>
