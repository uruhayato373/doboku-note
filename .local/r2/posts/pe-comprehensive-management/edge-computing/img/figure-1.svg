<svg width="400" height="500" viewBox="0 0 400 500"
     xmlns="http://www.w3.org/2000/svg"
     style="max-width:400px;width:100%"
     role="img"
     aria-label="エッジコンピューティングの階層構造。IoT デバイスが取得した全データをエッジが現場近傍でリアルタイム処理し、必要なデータのみをクラウドへ送信して帯域を節約する。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-name  { font-size: 14px; font-weight: bold; fill: #1a3a5c; }
      .t-role  { font-size: 12px; fill: #555; }
      .t-attr  { font-size: 11px; fill: #8a8a8a; }
      .t-flow  { font-size: 11px; fill: #8a8a8a; }
      .t-leg   { font-size: 11px; fill: #555; }
      .box-brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-surface { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1; }
    </style>
    <marker id="ec-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto">
      <polygon points="0,0 10,4.5 0,9" fill="#2e6da4"/>
    </marker>
  </defs>

  <!-- クラウド -->
  <rect class="box-brand" x="20" y="20" width="360" height="90" rx="8"/>
  <text class="t-name" x="36" y="48">クラウド（データセンター）</text>
  <text class="t-role" x="36" y="68">大規模なデータ分析・機械学習・長期保存</text>
  <text class="t-attr" x="36" y="88">通信遅延：数十〜数百ミリ秒</text>

  <line x1="200" y1="170" x2="200" y2="114" stroke="#2e6da4" stroke-width="2" marker-end="url(#ec-arrow)"/>
  <text class="t-flow" x="212" y="135">必要なデータのみ送信</text>
  <text class="t-flow" x="212" y="150">（通信帯域を節約）</text>

  <!-- エッジ -->
  <rect class="box-brand" x="20" y="170" width="360" height="90" rx="8"/>
  <text class="t-name" x="36" y="198">エッジ（データ発生源の近く）</text>
  <text class="t-role" x="36" y="218">リアルタイム処理・前処理・フィルタリング</text>
  <text class="t-attr" x="36" y="238">通信遅延：数ミリ秒以下</text>

  <line x1="200" y1="310" x2="200" y2="264" stroke="#2e6da4" stroke-width="2" marker-end="url(#ec-arrow)"/>
  <text class="t-flow" x="212" y="292">現場で発生する全データ</text>

  <!-- IoTデバイス -->
  <rect class="box-brand" x="20" y="310" width="360" height="90" rx="8"/>
  <text class="t-name" x="36" y="344">IoT デバイス（データ発生源）</text>
  <text class="t-role" x="36" y="364">センサーで現実世界のデータを取得</text>
  <text class="t-attr" x="36" y="384">温度・振動・映像・位置情報 など</text>

  <!-- 凡例 -->
  <rect class="box-surface" x="20" y="422" width="360" height="62" rx="6"/>
  <text class="t-leg" x="36" y="443" font-weight="bold" fill="#1a3a5c">データフローの特徴</text>
  <text class="t-leg" x="36" y="460">上り（→クラウド）: 前処理・集約済みデータのみ転送</text>
  <text class="t-leg" x="36" y="476">下り（→エッジ）: モデル更新・設定変更・制御指令</text>
</svg>
