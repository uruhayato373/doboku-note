  <svg width="400" height="500" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="11" style="max-width:400px;width:100%" role="img" aria-label="1時間降水量50mm以上の年間発生回数">
    <defs>
      <marker id="ar4" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5 z" fill="#222"/></marker>
    </defs>
    <!-- グラフ部分を scale(0.80) で縮小してviewBox内に収める -->
    <g transform="scale(0.80 1)">
    <!-- 軸 -->
    <line x1="50" y1="170" x2="490" y2="170" stroke="#222" stroke-width="1.5" marker-end="url(#ar4)"/>
    <line x1="50" y1="170" x2="50" y2="10" stroke="#222" stroke-width="1.5" marker-end="url(#ar4)"/>
    <!-- Y軸ラベル -->
    <text x="8" y="175" fill="#555" font-size="12">0</text>
    <text x="8" y="120" fill="#555" font-size="12">200</text>
    <text x="8" y="70" fill="#555" font-size="12">400</text>
    <text x="8" y="20" fill="#555" font-size="12">600</text>
    <line x1="46" y1="120" x2="490" y2="120" stroke="#d7d7d7" stroke-width="0.8" stroke-dasharray="4,3"/>
    <line x1="46" y1="70" x2="490" y2="70" stroke="#d7d7d7" stroke-width="0.8" stroke-dasharray="4,3"/>
    <!-- X軸ラベル（すべてscaleグループ外で再配置） -->
    <text x="50" y="185" text-anchor="middle" fill="#555" font-size="12">1975</text>
    <text x="160" y="185" text-anchor="middle" fill="#555" font-size="12">1985</text>
    <!-- 棒グラフ（概略：増加傾向を表現） -->
    <rect x="56" y="148" width="7" height="22" fill="#555"/>
    <rect x="67" y="143" width="7" height="27" fill="#555"/>
    <rect x="78" y="138" width="7" height="32" fill="#555"/>
    <rect x="89" y="133" width="7" height="37" fill="#555"/>
    <rect x="100" y="130" width="7" height="40" fill="#555"/>
    <rect x="111" y="135" width="7" height="35" fill="#555"/>
    <rect x="122" y="128" width="7" height="42" fill="#555"/>
    <rect x="133" y="122" width="7" height="48" fill="#555"/>
    <rect x="144" y="118" width="7" height="52" fill="#555"/>
    <rect x="155" y="125" width="7" height="45" fill="#555"/>
    <rect x="166" y="120" width="7" height="50" fill="#555"/>
    <rect x="177" y="115" width="7" height="55" fill="#555"/>
    <rect x="188" y="118" width="7" height="52" fill="#555"/>
    <rect x="199" y="112" width="7" height="58" fill="#555"/>
    <rect x="210" y="108" width="7" height="62" fill="#555"/>
    <rect x="221" y="130" width="7" height="40" fill="#555"/>
    <rect x="232" y="105" width="7" height="65" fill="#555"/>
    <rect x="243" y="100" width="7" height="70" fill="#555"/>
    <rect x="254" y="118" width="7" height="52" fill="#555"/>
    <rect x="265" y="95" width="7" height="75" fill="#555"/>
    <rect x="276" y="112" width="7" height="58" fill="#555"/>
    <rect x="287" y="108" width="7" height="62" fill="#555"/>
    <rect x="298" y="100" width="7" height="70" fill="#555"/>
    <rect x="309" y="90" width="7" height="80" fill="#555"/>
    <rect x="320" y="95" width="7" height="75" fill="#222"/>
    <rect x="331" y="85" width="7" height="85" fill="#222"/>
    <rect x="342" y="75" width="7" height="95" fill="#222"/>
    <rect x="353" y="92" width="7" height="78" fill="#222"/>
    <rect x="364" y="80" width="7" height="90" fill="#222"/>
    <rect x="375" y="68" width="7" height="102" fill="#222"/>
    <rect x="386" y="78" width="7" height="92" fill="#222"/>
    <rect x="397" y="75" width="7" height="95" fill="#222"/>
    <rect x="408" y="60" width="7" height="110" fill="#222"/>
    <rect x="419" y="72" width="7" height="98" fill="#222"/>
    <rect x="430" y="58" width="7" height="112" fill="#222"/>
    <rect x="441" y="65" width="7" height="105" fill="#222"/>
    <rect x="452" y="50" width="7" height="120" fill="#222"/>
    <rect x="463" y="62" width="7" height="108" fill="#222"/>
    <!-- トレンド線 -->
    <line x1="56" y1="150" x2="475" y2="58" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="395" y="55" text-anchor="end" fill="#8a8a8a" font-size="11">気象庁</text>
    <!-- Y軸タイトル -->
    <text x="30" y="100" text-anchor="middle" fill="#555" font-size="12" transform="rotate(-90,30,100)">（回）発生件数（年間）</text>
    <text x="10" y="10" fill="#555" font-size="12">500</text>
    <text x="10" y="40" fill="#555" font-size="12">400</text>
    </g>
    <!-- 1995〜2021ラベルはscaleグループ外（scale適用済み座標で配置） -->
    <text x="216" y="185" text-anchor="middle" fill="#555" font-size="12">1995</text>
    <text x="310" y="185" text-anchor="middle" fill="#555" font-size="12">2005</text>
    <text x="355" y="185" text-anchor="middle" fill="#555" font-size="12">2015</text>
    <text x="385" y="185" text-anchor="middle" fill="#555" font-size="12">2021</text>
    <text x="200" y="200" text-anchor="middle" fill="#555" font-size="10">1時間降水量50mm以上の年間発生回数の経年変化</text>
    <text x="200" y="213" text-anchor="middle" fill="#555" font-size="10">（1976〜2021年、気象庁）</text>
    <text x="200" y="224" text-anchor="middle" fill="#555" font-size="9">棒グラフ＝各年の発生件数／直線＝5 年移動平均</text>

    <!-- 下部サマリー -->
    <rect x="10" y="228" width="380" height="170" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1" rx="4"/>
    <text x="200" y="250" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">気候変動と豪雨の激甚化</text>
    <text x="20" y="278" font-size="13" fill="#555">1976〜2021 年で発生回数が約 1.4 倍に増加</text>
    <text x="20" y="305" font-size="13" fill="#555">地球温暖化による大気中の水蒸気量増加が主因</text>
    <text x="20" y="332" font-size="13" fill="#555">気候変動適応法（2018年）で対策の法制化</text>
    <text x="20" y="359" font-size="12" fill="#8a8a8a">出典：気象庁「大雨や猛暑日など（極端な天気）の長期変化」</text>
  </svg>