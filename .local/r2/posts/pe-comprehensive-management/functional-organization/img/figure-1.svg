<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  width="400" height="500"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="組織構造7形態の比較。職能別・事業部制・マトリクス・ネットワーク・ピラミッド・ティール・達成型それぞれのメリットとリスクを一覧できるカード図">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-label  { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-body   { font-size: 11px; fill: #555; }
      .t-tag    { font-size: 11px; font-weight: bold; }
      /* brand: card border */
      .card-border { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      /* positive tag */
      .tag-pos  { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1; }
      .tag-pos-t { fill: #3a7d44; }
      /* danger tag */
      .tag-dan  { fill: #f8d7da; stroke: #b22234; stroke-width: 1; }
      .tag-dan-t { fill: #b22234; }
    </style>
  </defs>

  <!-- ====== 2列4段+1レイアウト（各カード width=182, height=108, gutter=8） ======
       列1: x=8  列2: x=202
       行1: y=8   行2: y=124  行3: y=240  行4: y=356
       カードg（単独）: x=109 y=356 width=182
  ====== -->

  <!-- ── Card a: 職能別組織 (col1 row1) ── -->
  <rect class="card-border" x="8" y="8" width="182" height="108" rx="6"/>
  <circle cx="26" cy="27" r="10" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text class="t-label" x="26" y="31" text-anchor="middle" font-size="11">a</text>
  <text class="t-label" x="44" y="29">職能別組織</text>
  <text class="t-body" x="14" y="46" font-size="11">職能ごとに部門化・専門スキル育成</text>
  <rect class="tag-pos" x="12" y="56" width="174" height="20" rx="4"/>
  <text class="t-tag tag-pos-t" x="18" y="70">メリット: 専門家育成が容易</text>
  <rect class="tag-dan" x="12" y="80" width="174" height="20" rx="4"/>
  <text class="t-tag tag-dan-t" x="18" y="94">リスク: 縦割り・意思決定遅延</text>

  <!-- ── Card b: 事業部制組織 (col2 row1) ── -->
  <rect class="card-border" x="202" y="8" width="190" height="108" rx="6"/>
  <circle cx="220" cy="27" r="10" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text class="t-label" x="220" y="31" text-anchor="middle" font-size="11">b</text>
  <text class="t-label" x="238" y="29">事業部制組織</text>
  <text class="t-body" x="208" y="42" font-size="11">製品・市場別に権限と</text>
  <text class="t-body" x="208" y="54" font-size="11">利益責任を分担</text>
  <rect class="tag-pos" x="206" y="62" width="180" height="20" rx="4"/>
  <text class="t-tag tag-pos-t" x="205" y="76">メリット: 意思決定迅速・成果明確</text>
  <rect class="tag-dan" x="206" y="86" width="180" height="20" rx="4"/>
  <text class="t-tag tag-dan-t" x="212" y="100">リスク: 投資二重化・縄張り主義</text>

  <!-- ── Card c: マトリクス組織 (col1 row2) ── -->
  <rect class="card-border" x="8" y="124" width="182" height="108" rx="6"/>
  <circle cx="26" cy="143" r="10" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text class="t-label" x="26" y="147" text-anchor="middle" font-size="11">c</text>
  <text class="t-label" x="44" y="145">マトリクス組織</text>
  <text class="t-body" x="14" y="160" font-size="11">職能・事業部門に同時所属の二重構造</text>
  <rect class="tag-pos" x="12" y="172" width="174" height="20" rx="4"/>
  <text class="t-tag tag-pos-t" x="18" y="186">メリット: 柔軟な交流・知識共有</text>
  <rect class="tag-dan" x="12" y="196" width="174" height="20" rx="4"/>
  <text class="t-tag tag-dan-t" x="18" y="210">リスク: 命令系統複雑・責任曖昧</text>

  <!-- ── Card d: ネットワーク組織 (col2 row2) ── -->
  <rect class="card-border" x="202" y="124" width="190" height="108" rx="6"/>
  <circle cx="220" cy="143" r="10" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text class="t-label" x="220" y="147" text-anchor="middle" font-size="11">d</text>
  <text class="t-label" x="238" y="145">ネットワーク組織</text>
  <text class="t-body" x="206" y="175" font-size="11">自律した個人・小組織が柔軟に連携</text>
  <rect class="tag-pos" x="206" y="172" width="180" height="20" rx="4"/>
  <text class="t-tag tag-pos-t" x="212" y="186">メリット: 異分野融合・自律柔軟</text>
  <rect class="tag-dan" x="206" y="196" width="180" height="20" rx="4"/>
  <text class="t-tag tag-dan-t" x="205" y="210">リスク: 事業活動が不安定・不確実</text>

  <!-- ── Card e: ピラミッド組織 (col1 row3) ── -->
  <rect class="card-border" x="8" y="240" width="182" height="108" rx="6"/>
  <circle cx="26" cy="259" r="10" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text class="t-label" x="26" y="263" text-anchor="middle" font-size="11">e</text>
  <text class="t-label" x="44" y="261">ピラミッド組織</text>
  <text class="t-body" x="14" y="278" font-size="11">上意下達・専門化と分業で効率化</text>
  <rect class="tag-pos" x="12" y="288" width="174" height="20" rx="4"/>
  <text class="t-tag tag-pos-t" x="18" y="302">メリット: 命令系統明確・効率高</text>
  <rect class="tag-dan" x="12" y="312" width="174" height="20" rx="4"/>
  <text class="t-tag tag-dan-t" x="18" y="326">リスク: 硬直化・変化対応に遅れ</text>

  <!-- ── Card f: ティール組織 (col2 row3) ── -->
  <rect class="card-border" x="202" y="240" width="190" height="108" rx="6"/>
  <circle cx="220" cy="259" r="10" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text class="t-label" x="220" y="263" text-anchor="middle" font-size="11">f</text>
  <text class="t-label" x="238" y="261">ティール組織</text>
  <text class="t-body" x="208" y="278" font-size="11">指示系統なし・自律的に意思決定</text>
  <rect class="tag-pos" x="206" y="288" width="180" height="20" rx="4"/>
  <text class="t-tag tag-pos-t" x="205" y="302">メリット: 自律・進化・高い主体性</text>
  <rect class="tag-dan" x="206" y="312" width="180" height="20" rx="4"/>
  <text class="t-tag tag-dan-t" x="212" y="326">リスク: 組織統制が弱まる恐れ</text>

  <!-- ── Card g: 達成型組織 (中央 row4) ── -->
  <rect class="card-border" x="8" y="356" width="384" height="108" rx="6"/>
  <circle cx="30" cy="375" r="10" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text class="t-label" x="30" y="379" text-anchor="middle" font-size="11">g</text>
  <text class="t-label" x="50" y="377">達成型組織</text>
  <text class="t-body" x="18" y="394" font-size="11">目的達成のため機械部品のように機能分担</text>
  <rect class="tag-pos" x="12" y="404" width="186" height="20" rx="4"/>
  <text class="t-tag tag-pos-t" x="18" y="418">メリット: 革新的アイデアが出やすい</text>
  <rect class="tag-dan" x="206" y="424" width="180" height="20" rx="4"/>
  <text class="t-tag tag-dan-t" x="212" y="438">リスク: メンバーが疲弊しやすい</text>
</svg>
