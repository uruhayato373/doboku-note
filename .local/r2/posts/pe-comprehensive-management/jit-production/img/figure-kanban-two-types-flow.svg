<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 230" style="max-width:500px;width:100%" role="img" aria-label="かんばん 2 種類の流れ（前工程と後工程の間）">
  <rect x="40" y="90" width="130" height="60" fill="none" stroke="#222" stroke-width="1.5"/>
  <text x="105" y="126" text-anchor="middle" font-size="14" fill="#222" font-family="sans-serif">前工程</text>

  <rect x="330" y="90" width="130" height="60" fill="none" stroke="#222" stroke-width="1.5"/>
  <text x="395" y="126" text-anchor="middle" font-size="14" fill="#222" font-family="sans-serif">後工程</text>

  <line x1="170" y1="70" x2="325" y2="70" stroke="#222" stroke-width="1" stroke-dasharray="5,3"/>
  <polygon points="173,66 163,70 173,74" fill="#222"/>
  <text x="247" y="62" text-anchor="middle" font-size="12" fill="#222" font-family="sans-serif">引き取りかんばん</text>
  <text x="247" y="47" text-anchor="middle" font-size="10" fill="#555" font-family="sans-serif">（後工程が取りに来る指示）</text>

  <line x1="170" y1="120" x2="325" y2="120" stroke="#222" stroke-width="2"/>
  <polygon points="322,115 332,120 322,125" fill="#222"/>
  <text x="247" y="110" text-anchor="middle" font-size="12" fill="#222" font-family="sans-serif">部品の流れ</text>

  <line x1="325" y1="170" x2="170" y2="170" stroke="#222" stroke-width="1" stroke-dasharray="5,3"/>
  <polygon points="173,166 163,170 173,174" fill="#222"/>
  <text x="247" y="190" text-anchor="middle" font-size="12" fill="#222" font-family="sans-serif">生産指示かんばん</text>
  <text x="247" y="205" text-anchor="middle" font-size="10" fill="#555" font-family="sans-serif">（前工程に「作れ」指示）</text>

  <rect x="40" y="210" width="16" height="10" fill="none" stroke="#222" stroke-width="2"/>
  <text x="60" y="220" font-size="10" fill="#222" font-family="sans-serif" dominant-baseline="middle">実線: 部品（物）</text>
  <line x1="200" y1="215" x2="216" y2="215" stroke="#222" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="220" y="220" font-size="10" fill="#222" font-family="sans-serif" dominant-baseline="middle">破線: かんばん（情報）</text>
</svg>
