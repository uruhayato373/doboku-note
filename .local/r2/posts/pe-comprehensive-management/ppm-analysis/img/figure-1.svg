<svg viewBox="0 0 420 420" xmlns="http://www.w3.org/2000/svg" style="max-width:420px;width:100%" role="img" aria-label="PPM分析マトリクス。縦軸が市場成長率、横軸が相対的市場占有率。花形・問題児・金のなる木・負け犬の4象限と各打ち手を示す図">
  <!-- viewBox 420x420: 2×2マトリクスに軸ラベル・凡例バッジを配置するため幅500未満の最小値として420を選択 -->
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-title  { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-label  { font-size: 14px; font-weight: bold; fill: #1a3a5c; }
      .t-sub    { font-size: 12px; fill: #555; }
      .t-note   { font-size: 12px; fill: #555; }
      .t-axis   { font-size: 12px; font-weight: bold; fill: #8a8a8a; }
      .t-axistk { font-size: 11px; fill: #8a8a8a; }
      .t-icon   { font-size: 22px; }
      /* color allowlist — semantic comments */
      .box-warn    { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }  /* 花形: warn */
      .box-danger  { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }  /* 問題児: danger */
      .box-pos     { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }  /* 金のなる木: positive */
      .box-muted   { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }  /* 負け犬: surface/muted */
      .badge-warn  { fill: #ffffff; stroke: #d4a017; stroke-width: 1.5; }
      .badge-danger{ fill: #ffffff; stroke: #b22234; stroke-width: 1.5; }
      .badge-pos   { fill: #ffffff; stroke: #3a7d44; stroke-width: 1.5; }
      .badge-muted { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1.5; }
      .lbl-warn  { fill: #d4a017; font-size: 14px; font-weight: bold; }
      .lbl-danger{ fill: #b22234; font-size: 14px; font-weight: bold; }
      .lbl-pos   { fill: #3a7d44; font-size: 14px; font-weight: bold; }
      .lbl-muted { fill: #8a8a8a; font-size: 14px; font-weight: bold; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 9,3.5 0,7" fill="#8a8a8a"/>
    </marker>
  </defs>

  <!-- title -->
  <text class="t-title" x="210" y="24" text-anchor="middle">PPM分析マトリクス</text>

  <!-- 縦軸：市場成長率（高→低、上→下） -->
  <line x1="72" y1="46" x2="72" y2="358" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- 縦軸ラベル -->
  <text class="t-axis" x="20" y="205" text-anchor="middle" transform="rotate(-90,20,205)">市場成長率</text>
  <text class="t-axistk" x="60" y="60"  text-anchor="end">高</text>
  <text class="t-axistk" x="60" y="352" text-anchor="end">低</text>

  <!-- 横軸：相対的市場占有率（高←左、低→右） -->
  <line x1="72" y1="360" x2="404" y2="360" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- 横軸ラベル -->
  <text class="t-axis" x="238" y="390" text-anchor="middle">相対的市場占有率</text>
  <text class="t-axistk" x="90"  y="378">← 高</text>
  <text class="t-axistk" x="370" y="378">低 →</text>

  <!-- 中央分割線 -->
  <line x1="72" y1="200" x2="400" y2="200" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="236" y1="46" x2="236" y2="360" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- 象限1: 左上 — 花形 (Star): 市場成長率=高, 相対市場占有率=高 → warn -->
  <rect class="box-warn" x="76" y="50" width="156" height="146" rx="8"/>
  <!-- バッジ -->
  <circle class="badge-warn" cx="108" cy="82" r="18"/>
  <text class="t-icon" x="108" y="91" text-anchor="middle" fill="#d4a017">★</text>
  <!-- 象限名・打ち手 -->
  <text class="lbl-warn" x="222" y="82" text-anchor="end">花形</text>
  <text class="t-sub"    x="222" y="100" text-anchor="end">Star</text>
  <text class="t-note"   x="222" y="124" text-anchor="end">成長率：高</text>
  <text class="t-note"   x="222" y="142" text-anchor="end">占有率：高</text>
  <text class="t-sub"    x="222" y="165" text-anchor="end" font-weight="bold">→ 投資継続</text>

  <!-- 象限2: 右上 — 問題児 (Question Mark): 市場成長率=高, 相対市場占有率=低 → danger -->
  <rect class="box-danger" x="240" y="50" width="156" height="146" rx="8"/>
  <circle class="badge-danger" cx="272" cy="82" r="18"/>
  <text class="t-icon" x="272" y="91" text-anchor="middle" fill="#b22234">?</text>
  <text class="lbl-danger" x="392" y="82" text-anchor="end">問題児</text>
  <text class="t-sub"      x="392" y="100" text-anchor="end">Question Mark</text>
  <text class="t-note"     x="392" y="124" text-anchor="end">成長率：高</text>
  <text class="t-note"     x="392" y="142" text-anchor="end">占有率：低</text>
  <text class="t-sub"      x="392" y="165" text-anchor="end" font-weight="bold">→ 選択と集中</text>

  <!-- 象限3: 左下 — 金のなる木 (Cash Cow): 市場成長率=低, 相対市場占有率=高 → positive -->
  <rect class="box-pos" x="76" y="204" width="156" height="150" rx="8"/>
  <circle class="badge-pos" cx="108" cy="236" r="18"/>
  <text class="t-icon" x="108" y="245" text-anchor="middle" fill="#3a7d44">¥</text>
  <text class="lbl-pos" x="222" y="236" text-anchor="end">金のなる木</text>
  <text class="t-sub"   x="222" y="254" text-anchor="end">Cash Cow</text>
  <text class="t-note"  x="222" y="278" text-anchor="end">成長率：低</text>
  <text class="t-note"  x="222" y="296" text-anchor="end">占有率：高</text>
  <text class="t-sub"   x="222" y="320" text-anchor="end" font-weight="bold">→ 収益源</text>

  <!-- 象限4: 右下 — 負け犬 (Dog): 市場成長率=低, 相対市場占有率=低 → surface/muted -->
  <rect class="box-muted" x="240" y="204" width="156" height="150" rx="8"/>
  <circle class="badge-muted" cx="272" cy="236" r="18"/>
  <text class="t-icon" x="272" y="245" text-anchor="middle" fill="#8a8a8a">×</text>
  <text class="lbl-muted" x="392" y="236" text-anchor="end">負け犬</text>
  <text class="t-sub"     x="392" y="254" text-anchor="end">Dog</text>
  <text class="t-note"    x="392" y="278" text-anchor="end">成長率：低</text>
  <text class="t-note"    x="392" y="296" text-anchor="end">占有率：低</text>
  <text class="t-sub"     x="392" y="320" text-anchor="end" font-weight="bold">→ 撤退検討</text>
</svg>
