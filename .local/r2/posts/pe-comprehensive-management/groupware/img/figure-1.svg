<svg viewBox="0 0 400 540" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="デジタルコミュニケーションツール5分類。テレビ会議・ファイル共有・ビジネスチャット・社内SNS・グループウェアの機能定義を縦に並べた図">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-sub   { font-size: 11px; fill: #8a8a8a; }
      .t-label { font-size: 14px; font-weight: bold; fill: #1a3a5c; }
      .t-def   { font-size: 12px; fill: #555; }
      .t-num   { font-size: 13px; font-weight: bold; fill: #2e6da4; }
      .t-foot  { font-size: 11px; fill: #8a8a8a; }
      /* surface背景 + brandアクセント */
      .box-surface { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .badge-brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- タイトル -->
  <text class="t-title" x="200" y="26" text-anchor="middle">デジタルコミュニケーションツール5分類</text>
  <text class="t-sub" x="200" y="44" text-anchor="middle">機能別の定義と用途</text>

  <!-- 1 テレビ会議 -->
  <rect class="box-surface" x="18" y="58" width="364" height="78" rx="8"/>
  <rect class="badge-brand" x="18" y="58" width="6" height="78" rx="3"/>
  <!-- 番号バッジ -->
  <circle class="badge-brand" cx="46" cy="97" r="15"/>
  <text class="t-num" x="46" y="102" text-anchor="middle">1</text>
  <!-- ラベル -->
  <text class="t-label" x="72" y="86">テレビ会議</text>
  <!-- 定義 -->
  <text class="t-def" x="72" y="106">映像・音声による双方向通信で</text>
  <text class="t-def" x="72" y="122">遠隔地間の会議を実現するシステム</text>

  <!-- 2 ファイル共有 -->
  <rect class="box-surface" x="18" y="152" width="364" height="78" rx="8"/>
  <rect class="badge-brand" x="18" y="152" width="6" height="78" rx="3"/>
  <circle class="badge-brand" cx="46" cy="191" r="15"/>
  <text class="t-num" x="46" y="196" text-anchor="middle">2</text>
  <text class="t-label" x="72" y="180">ファイル共有</text>
  <text class="t-def" x="72" y="200">電子ファイルをネットワーク経由で共有。</text>
  <text class="t-def" x="72" y="216">版管理・アクセス権限設定機能を持つものも</text>

  <!-- 3 ビジネスチャット -->
  <rect class="box-surface" x="18" y="246" width="364" height="78" rx="8"/>
  <rect class="badge-brand" x="18" y="246" width="6" height="78" rx="3"/>
  <circle class="badge-brand" cx="46" cy="285" r="15"/>
  <text class="t-num" x="46" y="290" text-anchor="middle">3</text>
  <text class="t-label" x="72" y="274">ビジネスチャット</text>
  <text class="t-def" x="72" y="294">ビジネス用途に特化した</text>
  <text class="t-def" x="72" y="310">リアルタイムメッセージングサービス</text>

  <!-- 4 社内SNS -->
  <rect class="box-surface" x="18" y="340" width="364" height="78" rx="8"/>
  <rect class="badge-brand" x="18" y="340" width="6" height="78" rx="3"/>
  <circle class="badge-brand" cx="46" cy="379" r="15"/>
  <text class="t-num" x="46" y="384" text-anchor="middle">4</text>
  <text class="t-label" x="72" y="368">社内SNS</text>
  <text class="t-def" x="72" y="388">組織内限定で情報共有できる</text>
  <text class="t-def" x="72" y="404">SNSを活用したシステム</text>

  <!-- 5 グループウェア -->
  <rect class="box-surface" x="18" y="434" width="364" height="78" rx="8"/>
  <rect class="badge-brand" x="18" y="434" width="6" height="78" rx="3"/>
  <circle class="badge-brand" cx="46" cy="473" r="15"/>
  <text class="t-num" x="46" y="478" text-anchor="middle">5</text>
  <text class="t-label" x="72" y="462">グループウェア</text>
  <text class="t-def" x="72" y="482">組織内のネットワーク活用型情報共有基盤。</text>
  <text class="t-def" x="72" y="498">スケジュール管理・設備予約等の複合機能</text>

  <!-- フッター -->
  <text class="t-foot" x="200" y="528" text-anchor="middle">1〜4は機能単体・5は複合基盤（上位包含関係）</text>
</svg>
