<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 380" style="max-width:380px;width:100%" role="img" aria-label="PDCAサイクル：Plan 計画→Do 実行→Check 検証→Act 改善の 4 段階を循環させる継続的改善手法">
  <text x="190" y="22" text-anchor="middle" font-size="14" fill="#222" font-family="sans-serif" font-weight="bold">PDCA サイクル</text>
  <text x="190" y="40" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">継続的改善のための 4 段階循環</text>

  <circle cx="190" cy="200" r="40" fill="#e8f0fe" stroke="#2e6da4" stroke-width="2"/>
  <text x="190" y="196" text-anchor="middle" font-size="12" fill="#1a3a5c" font-family="sans-serif" font-weight="bold">継続的</text>
  <text x="190" y="212" text-anchor="middle" font-size="12" fill="#1a3a5c" font-family="sans-serif" font-weight="bold">改善</text>

  <g>
    <rect x="50" y="60" width="120" height="80" fill="#e8f0fe" stroke="#2e6da4" stroke-width="2" rx="6"/>
    <text x="110" y="84" text-anchor="middle" font-size="14" fill="#1a3a5c" font-family="sans-serif" font-weight="bold">P</text>
    <text x="110" y="104" text-anchor="middle" font-size="13" fill="#222" font-family="sans-serif">Plan / 計画</text>
    <text x="110" y="124" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">目標設定・行動計画</text>
  </g>

  <g>
    <rect x="210" y="60" width="120" height="80" fill="#e8f0fe" stroke="#2e6da4" stroke-width="2" rx="6"/>
    <text x="270" y="84" text-anchor="middle" font-size="14" fill="#1a3a5c" font-family="sans-serif" font-weight="bold">D</text>
    <text x="270" y="104" text-anchor="middle" font-size="13" fill="#222" font-family="sans-serif">Do / 実行</text>
    <text x="270" y="124" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">計画に基づき実施</text>
  </g>

  <g>
    <rect x="210" y="260" width="120" height="80" fill="#e8f0fe" stroke="#2e6da4" stroke-width="2" rx="6"/>
    <text x="270" y="284" text-anchor="middle" font-size="14" fill="#1a3a5c" font-family="sans-serif" font-weight="bold">C</text>
    <text x="270" y="304" text-anchor="middle" font-size="13" fill="#222" font-family="sans-serif">Check / 検証</text>
    <text x="270" y="324" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">実績・課題の評価</text>
  </g>

  <g>
    <rect x="50" y="260" width="120" height="80" fill="#e8f0fe" stroke="#2e6da4" stroke-width="2" rx="6"/>
    <text x="110" y="284" text-anchor="middle" font-size="14" fill="#1a3a5c" font-family="sans-serif" font-weight="bold">A</text>
    <text x="110" y="304" text-anchor="middle" font-size="13" fill="#222" font-family="sans-serif">Act / 改善</text>
    <text x="110" y="324" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">標準化・次計画反映</text>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3a7d44"/>
    </marker>
  </defs>

  <path d="M 170 100 Q 190 80 210 100" stroke="#3a7d44" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 270 140 Q 290 200 270 260" stroke="#3a7d44" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 210 300 Q 190 320 170 300" stroke="#3a7d44" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 110 260 Q 90 200 110 140" stroke="#3a7d44" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <g>
    <rect x="20" y="350" width="340" height="22" fill="none" stroke="#3a7d44" stroke-width="1.5" stroke-dasharray="6,3" rx="4"/>
    <text x="190" y="366" text-anchor="middle" font-size="11" fill="#3a7d44" font-family="sans-serif" font-weight="bold">回し続けるほど業務水準が螺旋階段状に向上</text>
  </g>
</svg>
