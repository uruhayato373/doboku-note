<svg viewBox="0 0 400 580" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="職務設計の5つの中核的職務特性。技能の多様性・仕事の一貫性・仕事の有意味性・自律性・フィードバックの各特性と動機付け効果を示したカード縦並び図">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-title   { font-size: 16px; font-weight: bold; fill: #1a3a5c; }
      .t-sub     { font-size: 12px; fill: #555; }
      .t-num     { font-size: 14px; font-weight: bold; fill: #1a3a5c; }
      .t-name    { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-body    { font-size: 13px; fill: #555; }
      .t-tag     { font-size: 11px; fill: #3a7d44; font-weight: bold; }
      /* brand: card backgrounds */
      .box-brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      /* positive: effect tag */
      .tag-positive { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1; }
      /* badge circles */
      .badge { fill: #ffffff; stroke: #2e6da4; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- title block -->
  <text class="t-title" x="200" y="28" text-anchor="middle">職務設計の5つの中核的職務特性</text>
  <text class="t-sub" x="200" y="48" text-anchor="middle">すべての職務はこの5特性で表現できる</text>

  <!-- ========== Card 1: 技能の多様性 ========== -->
  <rect class="box-brand" x="20" y="62" width="360" height="86" rx="8"/>
  <!-- badge -->
  <circle class="badge" cx="50" cy="105" r="18"/>
  <text class="t-num" x="50" y="110" text-anchor="middle">1</text>
  <!-- name -->
  <text class="t-name" x="80" y="90">技能の多様性</text>
  <!-- body -->
  <text class="t-body" x="80" y="110">活用できる技能・知識が多様なほど</text>
  <text class="t-body" x="80" y="126">仕事を有意義と感じる</text>
  <!-- effect tag -->
  <rect class="tag-positive" x="263" y="130" width="105" height="18" rx="4"/>
  <text class="t-tag" x="315" y="143" text-anchor="middle">有意義感の向上</text>

  <!-- ========== Card 2: 仕事の一貫性 ========== -->
  <rect class="box-brand" x="20" y="160" width="360" height="86" rx="8"/>
  <circle class="badge" cx="50" cy="203" r="18"/>
  <text class="t-num" x="50" y="208" text-anchor="middle">2</text>
  <text class="t-name" x="80" y="188">仕事の一貫性</text>
  <text class="t-body" x="80" y="208">仕事全体のうち自分がどれだけ完結</text>
  <text class="t-body" x="80" y="224">させられたかを感じる</text>
  <rect class="tag-positive" x="263" y="228" width="105" height="18" rx="4"/>
  <text class="t-tag" x="315" y="241" text-anchor="middle">達成感の向上</text>

  <!-- ========== Card 3: 仕事の有意味性 ========== -->
  <rect class="box-brand" x="20" y="258" width="360" height="86" rx="8"/>
  <circle class="badge" cx="50" cy="301" r="18"/>
  <text class="t-num" x="50" y="306" text-anchor="middle">3</text>
  <text class="t-name" x="80" y="286">仕事の有意味性</text>
  <text class="t-body" x="80" y="306">自分の仕事が他者の幸福にどれだけ</text>
  <text class="t-body" x="80" y="322">役立つかを知覚する</text>
  <rect class="tag-positive" x="263" y="326" width="105" height="18" rx="4"/>
  <text class="t-tag" x="315" y="339" text-anchor="middle">社会的意義の実感</text>

  <!-- ========== Card 4: 自律性 ========== -->
  <rect class="box-brand" x="20" y="356" width="360" height="86" rx="8"/>
  <circle class="badge" cx="50" cy="399" r="18"/>
  <text class="t-num" x="50" y="404" text-anchor="middle">4</text>
  <text class="t-name" x="80" y="384">自律性</text>
  <text class="t-body" x="80" y="404">スケジュール・手順への自由裁量が</text>
  <text class="t-body" x="80" y="420">大きいほど責任感が高まる</text>
  <rect class="tag-positive" x="263" y="424" width="105" height="18" rx="4"/>
  <text class="t-tag" x="315" y="437" text-anchor="middle">責任感の向上</text>

  <!-- ========== Card 5: フィードバック ========== -->
  <rect class="box-brand" x="20" y="454" width="360" height="86" rx="8"/>
  <circle class="badge" cx="50" cy="497" r="18"/>
  <text class="t-num" x="50" y="502" text-anchor="middle">5</text>
  <text class="t-name" x="80" y="482">フィードバック</text>
  <text class="t-body" x="80" y="502">仕事の成果について明確・直接的な</text>
  <text class="t-body" x="80" y="518">情報を受け取れる仕組みがある</text>
  <rect class="tag-positive" x="263" y="522" width="105" height="18" rx="4"/>
  <text class="t-tag" x="315" y="535" text-anchor="middle">動機付けの向上</text>

  <!-- footer note -->
  <text style="font-size:11px;fill:#8a8a8a;" x="200" y="562" text-anchor="middle">特性1〜3 → 有意義感、特性4 → 責任感、特性5 → 成果認知</text>
</svg>
