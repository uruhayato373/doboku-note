<svg width="400" height="540" viewBox="0 0 400 540"
     xmlns="http://www.w3.org/2000/svg"
     style="max-width:400px;width:100%"
     role="img"
     aria-label="出願から特許取得までのフロー：特許出願 → 方式審査 → 出願公開（1.5 年後）→ 出願審査請求（3 年以内）→ 実体審査の後、拒絶経路（拒絶理由通知 → 意見書・補正書 → 拒絶査定 → 不服審判）と取得経路（特許査定 → 特許料納付 → 登録）に分岐">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-step { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-sub { font-size: 11px; fill: #555; }
      .t-branch { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-legend { font-size: 11px; fill: #555; }
      .box-step { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-warn { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-danger { fill: #f8d7da; stroke: #b22234; stroke-width: 1.5; }
      .box-positive { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-final { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 2; }
      .box-aux { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1; stroke-dasharray: 4,3; }
      .arrow { stroke: #555; stroke-width: 1.5; fill: none; }
      .arrow-warn { stroke: #d4a017; stroke-width: 1.5; fill: none; }
      .arrow-positive { stroke: #3a7d44; stroke-width: 1.5; fill: none; stroke-dasharray: 5,3; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#555"/>
    </marker>
    <marker id="arrow-warn" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#d4a017"/>
    </marker>
    <marker id="arrow-positive" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#3a7d44"/>
    </marker>
  </defs>

  <!-- Phase 1: Steps 1-5 (centered single column) -->

  <!-- ① 特許出願 -->
  <rect class="box-step" x="100" y="10" width="200" height="36" rx="6"/>
  <text class="t-step" x="200" y="34" text-anchor="middle">① 特許出願</text>
  <line class="arrow" x1="200" y1="46" x2="200" y2="56" marker-end="url(#arrow)"/>

  <!-- ② 方式審査 -->
  <rect class="box-step" x="100" y="58" width="200" height="36" rx="6"/>
  <text class="t-step" x="200" y="82" text-anchor="middle">② 方式審査</text>
  <line class="arrow" x1="200" y1="94" x2="200" y2="104" marker-end="url(#arrow)"/>

  <!-- ③ 出願公開 -->
  <rect class="box-step" x="100" y="106" width="200" height="42" rx="6"/>
  <text class="t-step" x="200" y="124" text-anchor="middle">③ 出願公開</text>
  <text class="t-sub" x="200" y="140" text-anchor="middle">出願日から 1 年 6 ヶ月後</text>
  <line class="arrow" x1="200" y1="148" x2="200" y2="158" marker-end="url(#arrow)"/>

  <!-- ④ 出願審査請求 -->
  <rect class="box-step" x="100" y="160" width="200" height="42" rx="6"/>
  <text class="t-step" x="200" y="178" text-anchor="middle">④ 出願審査請求</text>
  <text class="t-sub" x="200" y="194" text-anchor="middle">出願日から 3 年以内（無請求は取下げ）</text>
  <line class="arrow" x1="200" y1="202" x2="200" y2="212" marker-end="url(#arrow)"/>

  <!-- ⑤ 実体審査 -->
  <rect class="box-step" x="100" y="214" width="200" height="36" rx="6"/>
  <text class="t-step" x="200" y="238" text-anchor="middle">⑤ 実体審査</text>

  <!-- Branch lines -->
  <line class="arrow" x1="200" y1="250" x2="200" y2="262"/>
  <line class="arrow" x1="80" y1="262" x2="320" y2="262"/>
  <line class="arrow-warn" x1="80" y1="262" x2="80" y2="276" marker-end="url(#arrow-warn)"/>
  <line class="arrow" x1="320" y1="262" x2="320" y2="276" marker-end="url(#arrow)"/>

  <!-- Branch labels -->
  <text class="t-branch" x="80" y="272" text-anchor="middle" fill="#d4a017">拒絶経路</text>
  <text class="t-branch" x="320" y="272" text-anchor="middle" fill="#3a7d44">取得経路</text>

  <!-- LEFT: Rejection path -->
  <rect class="box-warn" x="10" y="278" width="160" height="32" rx="6"/>
  <text class="t-step" x="90" y="298" text-anchor="middle">拒絶理由通知</text>
  <line class="arrow-warn" x1="90" y1="310" x2="90" y2="320" marker-end="url(#arrow-warn)"/>

  <rect class="box-warn" x="10" y="322" width="160" height="32" rx="6"/>
  <text class="t-step" x="90" y="342" text-anchor="middle">意見書・補正書提出</text>
  <line class="arrow-warn" x1="90" y1="354" x2="90" y2="364" marker-end="url(#arrow-warn)"/>

  <rect class="box-danger" x="10" y="366" width="160" height="32" rx="6"/>
  <text class="t-step" x="90" y="386" text-anchor="middle">拒絶査定</text>
  <line class="arrow-warn" x1="90" y1="398" x2="90" y2="408" marker-end="url(#arrow-warn)"/>

  <rect class="box-warn" x="10" y="410" width="160" height="32" rx="6"/>
  <text class="t-step" x="90" y="430" text-anchor="middle">拒絶査定不服審判</text>

  <!-- RIGHT: Grant path -->
  <rect class="box-positive" x="230" y="278" width="160" height="32" rx="6"/>
  <text class="t-step" x="310" y="298" text-anchor="middle">特許査定</text>
  <line class="arrow" x1="310" y1="310" x2="310" y2="320" marker-end="url(#arrow)"/>

  <rect class="box-positive" x="230" y="322" width="160" height="32" rx="6"/>
  <text class="t-step" x="310" y="342" text-anchor="middle">⑥ 特許料納付</text>
  <line class="arrow" x1="310" y1="354" x2="310" y2="364" marker-end="url(#arrow)"/>

  <rect class="box-final" x="230" y="366" width="160" height="42" rx="6"/>
  <text class="t-step" x="310" y="384" text-anchor="middle">⑦ 登録</text>
  <text class="t-sub" x="310" y="400" text-anchor="middle">特許権発生</text>
  <line class="arrow" x1="310" y1="408" x2="310" y2="426" marker-end="url(#arrow)"/>

  <!-- 無効審判請求 (post-grant, dashed) -->
  <rect class="box-aux" x="230" y="426" width="160" height="32" rx="6"/>
  <text class="t-step" x="310" y="446" text-anchor="middle">無効審判請求</text>
  <text class="t-sub" x="310" y="472" text-anchor="middle">登録後・何人も請求可</text>

  <!-- 補正で解消 → 特許査定への curved arrow (dashed) -->
  <path class="arrow-positive" d="M 170 338 Q 200 280 230 294" marker-end="url(#arrow-positive)"/>
  <text class="t-sub" x="200" y="295" text-anchor="middle" fill="#3a7d44">補正で解消</text>

  <!-- Footer separator -->
  <line class="arrow" x1="20" y1="498" x2="380" y2="498"/>
  <text class="t-legend" x="20" y="516">特許権の存続期間: 出願日から 20 年（医薬品等は最大 5 年延長可）</text>
  <text class="t-legend" x="20" y="532">登録後は何人も無効審判請求可能（特許の有効性を争える）</text>
</svg>
