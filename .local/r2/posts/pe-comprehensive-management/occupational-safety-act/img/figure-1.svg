<svg viewBox="0 0 480 560" xmlns="http://www.w3.org/2000/svg" style="max-width:480px;width:100%" role="img" aria-label="労働安全衛生法の安全衛生管理体制：管理者・委員会ごとの選任規模要件と根拠条文を示すマトリクス表">
  <!-- viewBox幅480: 管理者名・選任規模・条文の3列マトリクスで横幅480が最小限。理由コメント -->
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-title  { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-sub    { font-size: 11px; fill: #555; }
      .t-head   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-main   { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-note   { font-size: 11px; fill: #555; }
      .t-warn   { font-size: 12px; font-weight: bold; fill: #92640a; } /* warn強調: 人数閾値 */
      .t-code   { font-size: 11px; fill: #8a8a8a; }
      .t-foot   { font-size: 11px; fill: #555; }
      /* brand: 管理者系 #e8f0fe / stroke #2e6da4 */
      .box-brand    { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.2; }
      /* surface: 委員会系 #f5f5f5 / stroke #d7d7d7 */
      .box-surface  { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.2; }
      /* warn: 人数閾値バッジ #fff3cd / stroke #d4a017 */
      .badge-warn   { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.2; }
      /* 列ヘッダ: 淡色fill＋濃色文字（濃色背景+白文字禁止ルール適用） */
      .hdr-bg { fill: #e8f0fe; }
      .t-hdr  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      /* セパレータ */
      .sep { stroke: #d7d7d7; stroke-width: 0.8; }
    </style>
  </defs>

  <!-- タイトル -->
  <text class="t-title" x="240" y="26" text-anchor="middle">安全衛生管理体制（選任要件）</text>
  <text class="t-sub" x="240" y="44" text-anchor="middle">労働安全衛生法 第3章</text>

  <!-- テーブル外枠 -->
  <rect x="16" y="54" width="448" height="452" rx="8" fill="none" stroke="#2e6da4" stroke-width="1.5"/>

  <!-- 列ヘッダ背景 -->
  <rect x="16" y="54" width="448" height="32" rx="8" class="hdr-bg"/>
  <!-- 角丸を下辺に見せないため上辺のみ丸める補正矩形 -->
  <rect x="16" y="70" width="448" height="16" fill="#1a3a5c"/>

  <!-- 列ヘッダテキスト -->
  <text class="t-hdr" x="112" y="75" text-anchor="middle">役職・機関</text>
  <text class="t-hdr" x="308" y="75" text-anchor="middle">選任・設置規模</text>
  <text class="t-hdr" x="432" y="75" text-anchor="middle">条文</text>

  <!-- 列区切り縦線（ヘッダ内） -->
  <line x1="214" y1="54" x2="214" y2="506" class="sep"/>
  <line x1="400" y1="54" x2="400" y2="506" class="sep"/>

  <!-- ===== 管理者セクション ===== -->
  <!-- セクションラベル背景 -->
  <rect x="16" y="86" width="448" height="20" fill="#e8f0fe"/>
  <text class="t-head" x="240" y="100" text-anchor="middle">管理者（個人選任）</text>
  <!-- 行区切り -->
  <line x1="16" y1="106" x2="464" y2="106" class="sep"/>

  <!-- 行1: 総括安全衛生管理者 -->
  <rect x="16" y="106" width="198" height="76" class="box-brand"/>
  <text class="t-main" x="112" y="128" text-anchor="middle">総括安全衛生</text>
  <text class="t-main" x="112" y="146" text-anchor="middle">管理者</text>
  <text class="t-note" x="112" y="163" text-anchor="middle">安全・衛生管理者等を指揮</text>

  <rect x="214" y="106" width="186" height="76" class="box-brand"/>
  <!-- 建設業100人: warnバッジ -->
  <rect x="224" y="116" width="90" height="20" rx="4" class="badge-warn"/>
  <text class="t-warn" x="269" y="130" text-anchor="middle">建設業等 100人〜</text>
  <rect x="224" y="142" width="90" height="20" rx="4" class="badge-warn"/>
  <text class="t-warn" x="269" y="156" text-anchor="middle">製造業等 300人〜</text>
  <text class="t-note" x="390" y="148" text-anchor="middle">（施行令 第2条）</text>

  <rect x="400" y="106" width="64" height="76" class="box-brand"/>
  <text class="t-main" x="432" y="148" text-anchor="middle">第10条</text>

  <!-- 行区切り -->
  <line x1="16" y1="182" x2="464" y2="182" class="sep"/>

  <!-- 行2: 安全管理者 -->
  <rect x="16" y="182" width="198" height="54" class="box-brand"/>
  <text class="t-main" x="112" y="213" text-anchor="middle">安全管理者</text>
  <text class="t-note" x="112" y="228" text-anchor="middle">安全の技術的事項を管理</text>

  <rect x="214" y="182" width="186" height="54" class="box-brand"/>
  <rect x="224" y="192" width="90" height="20" rx="4" class="badge-warn"/>
  <text class="t-warn" x="269" y="206" text-anchor="middle">常時 50人以上</text>
  <text class="t-note" x="310" y="225" text-anchor="middle">厚労省令資格者</text>

  <rect x="400" y="182" width="64" height="54" class="box-brand"/>
  <text class="t-main" x="432" y="213" text-anchor="middle">第11条</text>

  <!-- 行区切り -->
  <line x1="16" y1="236" x2="464" y2="236" class="sep"/>

  <!-- 行3: 衛生管理者 -->
  <rect x="16" y="236" width="198" height="54" class="box-brand"/>
  <text class="t-main" x="112" y="267" text-anchor="middle">衛生管理者</text>
  <text class="t-note" x="112" y="282" text-anchor="middle">衛生の技術的事項を管理</text>

  <rect x="214" y="236" width="186" height="54" class="box-brand"/>
  <rect x="224" y="246" width="90" height="20" rx="4" class="badge-warn"/>
  <text class="t-warn" x="269" y="260" text-anchor="middle">常時 50人以上</text>
  <text class="t-note" x="310" y="279" text-anchor="middle">労働局長免許者</text>

  <rect x="400" y="236" width="64" height="54" class="box-brand"/>
  <text class="t-main" x="432" y="267" text-anchor="middle">第12条</text>

  <!-- 行区切り -->
  <line x1="16" y1="290" x2="464" y2="290" class="sep"/>

  <!-- 行4: 産業医 -->
  <rect x="16" y="290" width="198" height="54" class="box-brand"/>
  <text class="t-main" x="112" y="321" text-anchor="middle">産業医</text>
  <text class="t-note" x="112" y="336" text-anchor="middle">労働者の健康管理等</text>

  <rect x="214" y="290" width="186" height="54" class="box-brand"/>
  <rect x="224" y="300" width="90" height="20" rx="4" class="badge-warn"/>
  <text class="t-warn" x="269" y="314" text-anchor="middle">常時 50人以上</text>
  <text class="t-note" x="310" y="333" text-anchor="middle">医師のうちから選任</text>

  <rect x="400" y="290" width="64" height="54" class="box-brand"/>
  <text class="t-main" x="432" y="321" text-anchor="middle">第13条</text>

  <!-- 行区切り -->
  <line x1="16" y1="344" x2="464" y2="344" class="sep"/>

  <!-- ===== 委員会セクション ===== -->
  <rect x="16" y="344" width="448" height="20" fill="#f5f5f5" stroke="none"/>
  <text class="t-head" x="240" y="358" text-anchor="middle" fill="#555">委員会（調査審議機関）</text>
  <line x1="16" y1="364" x2="464" y2="364" class="sep"/>

  <!-- 行5: 安全委員会 -->
  <rect x="16" y="364" width="198" height="54" class="box-surface"/>
  <text class="t-main" x="112" y="392" text-anchor="middle">安全委員会</text>
  <text class="t-note" x="112" y="409" text-anchor="middle">危険防止・再発防止を審議</text>

  <rect x="214" y="364" width="186" height="54" class="box-surface"/>
  <rect x="224" y="374" width="90" height="20" rx="4" class="badge-warn"/>
  <text class="t-warn" x="269" y="388" text-anchor="middle">建設業等 50人以上</text>
  <text class="t-note" x="310" y="407" text-anchor="middle">政令で定める業種</text>

  <rect x="400" y="364" width="64" height="54" class="box-surface"/>
  <text class="t-main" x="432" y="392" text-anchor="middle" fill="#555">第17条</text>

  <!-- 行区切り -->
  <line x1="16" y1="418" x2="464" y2="418" class="sep"/>

  <!-- 行6: 衛生委員会 -->
  <rect x="16" y="418" width="198" height="54" class="box-surface"/>
  <text class="t-main" x="112" y="446" text-anchor="middle">衛生委員会</text>
  <text class="t-note" x="112" y="463" text-anchor="middle">健康障害・再発防止を審議</text>

  <rect x="214" y="418" width="186" height="54" class="box-surface"/>
  <rect x="224" y="428" width="90" height="20" rx="4" class="badge-warn"/>
  <text class="t-warn" x="269" y="442" text-anchor="middle">常時 50人以上</text>
  <text class="t-note" x="310" y="461" text-anchor="middle">全業種</text>

  <rect x="400" y="418" width="64" height="54" class="box-surface"/>
  <text class="t-main" x="432" y="446" text-anchor="middle" fill="#555">第18条</text>

  <!-- 行区切り -->
  <line x1="16" y1="472" x2="464" y2="472" class="sep"/>

  <!-- 行7: 安全衛生委員会 (第19条) -->
  <!-- 横結合セル: 両委員会設置義務事業場での代替設置 -->
  <rect x="16" y="472" width="384" height="34" class="box-surface"/>
  <text class="t-main" x="208" y="490" text-anchor="middle">安全衛生委員会（第17・18条の代替設置）</text>
  <text class="t-note" x="208" y="504" text-anchor="middle">両委員会の設置義務がある場合に安全衛生委員会を設置可</text>
  <rect x="400" y="472" width="64" height="34" class="box-surface"/>
  <text class="t-main" x="432" y="494" text-anchor="middle" fill="#555">第19条</text>

  <!-- フッター -->
  <text class="t-foot" x="240" y="530" text-anchor="middle">建設業等100人未満でも衛生委員会（50人〜）は設置義務あり</text>
</svg>
