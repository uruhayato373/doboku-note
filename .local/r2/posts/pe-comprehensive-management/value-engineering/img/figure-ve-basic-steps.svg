<svg width="400" height="500" viewBox="0 0 400 500"
     xmlns="http://www.w3.org/2000/svg"
     style="max-width:400px;width:100%"
     role="img"
     aria-label="VE の基本 3 ステップ：機能定義 → 機能評価 → 代替案作成">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-step-n  { font-size: 11px; fill: #555; }
      .t-title   { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-desc    { font-size: 11px; fill: #555; }
      .box-brand    { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-positive { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
    </style>
    <marker markerUnits="userSpaceOnUse" id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#2e6da4"/>
    </marker>
  </defs>

  <!-- Step 1 -->
  <rect class="box-brand" x="8" y="40" width="120" height="100" rx="6"/>
  <text class="t-step-n" x="68" y="62" text-anchor="middle">STEP 1</text>
  <text class="t-title"  x="68" y="83" text-anchor="middle">機能定義</text>
  <text class="t-desc"   x="68" y="108" text-anchor="middle">対象の機能を</text>
  <text class="t-desc"   x="68" y="126" text-anchor="middle">動詞形で洗い出す</text>

  <line x1="130" y1="90" x2="140" y2="90" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect class="box-brand" x="140" y="40" width="120" height="100" rx="6"/>
  <text class="t-step-n" x="200" y="62" text-anchor="middle">STEP 2</text>
  <text class="t-title"  x="200" y="83" text-anchor="middle">機能評価</text>
  <text class="t-desc"   x="200" y="108" text-anchor="middle">重要度とコストを</text>
  <text class="t-desc"   x="200" y="126" text-anchor="middle">測定し価値判定</text>

  <line x1="262" y1="90" x2="272" y2="90" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect class="box-positive" x="272" y="40" width="120" height="100" rx="6"/>
  <text class="t-step-n" x="332" y="62" text-anchor="middle">STEP 3</text>
  <text class="t-title"  x="332" y="83" text-anchor="middle">代替案作成</text>
  <text class="t-desc"   x="332" y="108" text-anchor="middle">機能を維持しつつ</text>
  <text class="t-desc"   x="332" y="126" text-anchor="middle">コスト削減案立案</text>

  <text class="t-desc" x="200" y="175" text-anchor="middle">順序が重要：機能評価が代替案作成より先に来る</text>

  <!-- VE の基本公式 -->
  <rect class="box-brand" x="8" y="195" width="384" height="50" rx="6"/>
  <text font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="12" font-weight="bold" fill="#1a3a5c" x="200" y="216" text-anchor="middle">VE の基本式</text>
  <text font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="14" font-weight="bold" fill="#1a3a5c" x="200" y="236" text-anchor="middle">V（価値） ＝ F（機能） ÷ C（コスト）</text>

  <!-- 区切り -->
  <line stroke="#d7d7d7" stroke-width="1" x1="8" y1="262" x2="392" y2="262"/>

  <!-- 詳細解説 -->
  <text font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="13" font-weight="bold" fill="#1a3a5c" x="200" y="290" text-anchor="middle">各ステップの詳細</text>

  <rect fill="#e8f0fe" stroke="#2e6da4" stroke-width="1" x="8" y="302" width="120" height="80" rx="6"/>
  <text font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" font-weight="bold" fill="#1a3a5c" x="68" y="322" text-anchor="middle">STEP 1</text>
  <text font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" fill="#555" x="68" y="340" text-anchor="middle">対象範囲の</text>
  <text font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" fill="#555" x="68" y="356" text-anchor="middle">明確化と機能</text>
  <text font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" fill="#555" x="68" y="372" text-anchor="middle">の動詞形整理</text>

  <rect fill="#e8f0fe" stroke="#2e6da4" stroke-width="1" x="140" y="302" width="120" height="80" rx="6"/>
  <text font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" font-weight="bold" fill="#1a3a5c" x="200" y="322" text-anchor="middle">STEP 2</text>
  <text font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" fill="#555" x="200" y="340" text-anchor="middle">重要度係数と</text>
  <text font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" fill="#555" x="200" y="356" text-anchor="middle">現コストの比較</text>
  <text font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" fill="#555" x="200" y="372" text-anchor="middle">で優先度を決定</text>

  <rect fill="#d0e8d0" stroke="#3a7d44" stroke-width="1" x="272" y="302" width="120" height="80" rx="6"/>
  <text font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" font-weight="bold" fill="#1a3a5c" x="332" y="322" text-anchor="middle">STEP 3</text>
  <text font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" fill="#555" x="332" y="340" text-anchor="middle">ブレインスト</text>
  <text font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" fill="#555" x="332" y="356" text-anchor="middle">ーミングで</text>
  <text font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" fill="#555" x="332" y="372" text-anchor="middle">代替案を創出</text>

  <text font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" fill="#555" x="200" y="420" text-anchor="middle">VE は品質を維持しながらコスト削減を実現する手法</text>
  <text font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" fill="#555" x="200" y="440" text-anchor="middle">総監「情報管理」「経済性管理」で頻出</text>
</svg>
