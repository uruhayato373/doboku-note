<svg width="400" height="500" viewBox="0 0 400 500"
     xmlns="http://www.w3.org/2000/svg"
     style="max-width:400px;width:100%"
     role="img"
     aria-label="V モデル。左側の設計工程（要件定義・基本設計・詳細設計・実装）を上から下へ進め、右側のテスト工程（単体・結合・システム・受入）を下から上へ進める。同じ高さの設計工程とテスト工程が対応する。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-sec   { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-box   { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .t-cap   { font-size: 11px; fill: #555; }
      .t-tag   { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .t-body  { font-size: 11px; fill: #555; }
      .box-des { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-tst { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-surf { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .corr    { stroke: #8a8a8a; stroke-width: 1.3; stroke-dasharray: 4 3; }
    </style>
    <marker id="wf-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto">
      <polygon points="0,0 10,4.5 0,9" fill="#2e6da4"/>
    </marker>
  </defs>

  <text class="t-sec" x="56"  y="22" text-anchor="middle">設計工程</text>
  <text class="t-sec" x="344" y="22" text-anchor="middle">テスト工程</text>

  <!-- 対応（破線） -->
  <line class="corr" x1="98"  y1="53"  x2="302" y2="53"/>
  <line class="corr" x1="130" y1="107" x2="270" y2="107"/>
  <line class="corr" x1="162" y1="161" x2="238" y2="161"/>
  <line class="corr" x1="194" y1="215" x2="206" y2="215"/>

  <!-- 流れ矢印（左アーム下り） -->
  <line x1="60"  y1="74"  x2="78"  y2="86"  stroke="#2e6da4" stroke-width="2" marker-end="url(#wf-arrow)"/>
  <line x1="92"  y1="128" x2="110" y2="140" stroke="#2e6da4" stroke-width="2" marker-end="url(#wf-arrow)"/>
  <line x1="124" y1="182" x2="142" y2="194" stroke="#2e6da4" stroke-width="2" marker-end="url(#wf-arrow)"/>
  <!-- 底 -->
  <line x1="196" y1="215" x2="204" y2="215" stroke="#2e6da4" stroke-width="2" marker-end="url(#wf-arrow)"/>
  <!-- 右アーム上り -->
  <line x1="268" y1="194" x2="286" y2="182" stroke="#2e6da4" stroke-width="2" marker-end="url(#wf-arrow)"/>
  <line x1="300" y1="140" x2="318" y2="128" stroke="#2e6da4" stroke-width="2" marker-end="url(#wf-arrow)"/>
  <line x1="332" y1="86"  x2="350" y2="74"  stroke="#2e6da4" stroke-width="2" marker-end="url(#wf-arrow)"/>

  <!-- 設計工程（左アーム） -->
  <rect class="box-des" x="14"  y="34"  width="84" height="38" rx="6"/>
  <text class="t-box" x="56"  y="58" text-anchor="middle">要件定義</text>
  <rect class="box-des" x="46"  y="88"  width="84" height="38" rx="6"/>
  <text class="t-box" x="88"  y="112" text-anchor="middle">基本設計</text>
  <rect class="box-des" x="78"  y="142" width="84" height="38" rx="6"/>
  <text class="t-box" x="120" y="166" text-anchor="middle">詳細設計</text>
  <rect class="box-des" x="110" y="196" width="84" height="38" rx="6"/>
  <text class="t-box" x="152" y="220" text-anchor="middle">実装</text>

  <!-- テスト工程（右アーム） -->
  <rect class="box-tst" x="206" y="196" width="84" height="38" rx="6"/>
  <text class="t-box" x="248" y="220" text-anchor="middle">単体テスト</text>
  <rect class="box-tst" x="238" y="142" width="84" height="38" rx="6"/>
  <text class="t-box" x="280" y="166" text-anchor="middle">結合テスト</text>
  <rect class="box-tst" x="270" y="88"  width="84" height="38" rx="6"/>
  <text class="t-box" x="312" y="112" text-anchor="middle">システムテスト</text>
  <rect class="box-tst" x="302" y="34"  width="84" height="38" rx="6"/>
  <text class="t-box" x="344" y="58" text-anchor="middle">受入テスト</text>

  <!-- キャプション -->
  <text class="t-cap" x="200" y="254" text-anchor="middle">各テスト工程は、同じ高さの設計工程の成果物を検証基準とする</text>

  <!-- 凡例セクション -->
  <line x1="16" y1="270" x2="384" y2="270" stroke="#d7d7d7" stroke-width="1"/>
  <text class="t-sec" x="20" y="292">設計とテストの対応関係</text>

  <rect class="box-surf" x="16" y="300" width="368" height="34" rx="5"/>
  <text class="t-tag"  x="30" y="313">要件定義</text>
  <text class="t-body" x="112" y="313">←→</text>
  <text class="t-tag"  x="140" y="313" fill="#3a7d44">受入テスト</text>
  <text class="t-body" x="230" y="313">顧客要求の達成を確認</text>
  <text class="t-body" x="30"  y="328">要件定義書がそのまま受入テストの合格基準となる</text>

  <rect class="box-surf" x="16" y="338" width="368" height="34" rx="5"/>
  <text class="t-tag"  x="30" y="351">基本設計</text>
  <text class="t-body" x="112" y="351">←→</text>
  <text class="t-tag"  x="140" y="351" fill="#3a7d44">システムテスト</text>
  <text class="t-body" x="30"  y="366">システム全体の機能・性能・信頼性を検証する</text>

  <rect class="box-surf" x="16" y="376" width="368" height="34" rx="5"/>
  <text class="t-tag"  x="30" y="389">詳細設計</text>
  <text class="t-body" x="112" y="389">←→</text>
  <text class="t-tag"  x="140" y="389" fill="#3a7d44">結合テスト</text>
  <text class="t-body" x="30"  y="404">モジュール間インターフェースを設計仕様で検証する</text>

  <rect class="box-surf" x="16" y="414" width="368" height="34" rx="5"/>
  <text class="t-tag"  x="30" y="427">実装</text>
  <text class="t-body" x="112" y="427">←→</text>
  <text class="t-tag"  x="140" y="427" fill="#3a7d44">単体テスト</text>
  <text class="t-body" x="30"  y="442">個々のモジュールをコード単位で検証する</text>

  <rect class="box-surf" x="16" y="452" width="368" height="34" rx="5"/>
  <text class="t-tag"  x="30" y="470">V モデルの利点</text>
  <text class="t-body" x="30" y="481">テスト計画を設計段階から立案でき、手戻りを削減できる</text>
</svg>
