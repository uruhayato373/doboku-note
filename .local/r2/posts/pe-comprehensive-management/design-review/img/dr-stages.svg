<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" style="max-width:720px;width:100%" role="img" aria-label="デザインレビューの 5 段階（DR0 企画〜DR4 量産移行）と各段階の審査対象">
  <text x="360" y="24" text-anchor="middle" font-size="14" fill="#222" font-family="sans-serif" font-weight="bold">デザインレビューの実施段階（DR0 〜 DR4）</text>

  <line x1="40" y1="160" x2="680" y2="160" stroke="#555" stroke-width="2"/>
  <polygon points="680,160 670,154 670,166" fill="#555"/>
  <text x="676" y="148" text-anchor="end" font-size="11" fill="#555" font-family="sans-serif">設計プロセスの進行</text>

  <g>
    <rect x="50" y="100" width="120" height="120" fill="#e8f0fe" stroke="#2e6da4" stroke-width="2" rx="6"/>
    <text x="110" y="125" text-anchor="middle" font-size="14" fill="#1a3a5c" font-family="sans-serif" font-weight="bold">DR0</text>
    <text x="110" y="146" text-anchor="middle" font-size="12" fill="#222" font-family="sans-serif">企画段階</text>
    <line x1="60" y1="156" x2="160" y2="156" stroke="#8a8a8a" stroke-width="1"/>
    <text x="110" y="174" text-anchor="middle" font-size="10" fill="#555" font-family="sans-serif">製品コンセプト</text>
    <text x="110" y="190" text-anchor="middle" font-size="10" fill="#555" font-family="sans-serif">仕様の妥当性</text>
    <text x="110" y="206" text-anchor="middle" font-size="10" fill="#555" font-family="sans-serif">を審査</text>
  </g>

  <g>
    <rect x="180" y="100" width="120" height="120" fill="#e8f0fe" stroke="#2e6da4" stroke-width="2" rx="6"/>
    <text x="240" y="125" text-anchor="middle" font-size="14" fill="#1a3a5c" font-family="sans-serif" font-weight="bold">DR1</text>
    <text x="240" y="146" text-anchor="middle" font-size="12" fill="#222" font-family="sans-serif">基本設計</text>
    <line x1="190" y1="156" x2="290" y2="156" stroke="#8a8a8a" stroke-width="1"/>
    <text x="240" y="174" text-anchor="middle" font-size="10" fill="#555" font-family="sans-serif">基本設計の</text>
    <text x="240" y="190" text-anchor="middle" font-size="10" fill="#555" font-family="sans-serif">技術的成立性</text>
    <text x="240" y="206" text-anchor="middle" font-size="10" fill="#555" font-family="sans-serif">を審査</text>
  </g>

  <g>
    <rect x="310" y="100" width="120" height="120" fill="#e8f0fe" stroke="#2e6da4" stroke-width="2" rx="6"/>
    <text x="370" y="125" text-anchor="middle" font-size="14" fill="#1a3a5c" font-family="sans-serif" font-weight="bold">DR2</text>
    <text x="370" y="146" text-anchor="middle" font-size="12" fill="#222" font-family="sans-serif">詳細設計</text>
    <line x1="320" y1="156" x2="420" y2="156" stroke="#8a8a8a" stroke-width="1"/>
    <text x="370" y="174" text-anchor="middle" font-size="10" fill="#555" font-family="sans-serif">製造容易性</text>
    <text x="370" y="190" text-anchor="middle" font-size="10" fill="#555" font-family="sans-serif">信頼性</text>
    <text x="370" y="206" text-anchor="middle" font-size="10" fill="#555" font-family="sans-serif">を審査</text>
  </g>

  <g>
    <rect x="440" y="100" width="120" height="120" fill="#e8f0fe" stroke="#2e6da4" stroke-width="2" rx="6"/>
    <text x="500" y="125" text-anchor="middle" font-size="14" fill="#1a3a5c" font-family="sans-serif" font-weight="bold">DR3</text>
    <text x="500" y="146" text-anchor="middle" font-size="12" fill="#222" font-family="sans-serif">試作・評価</text>
    <line x1="450" y1="156" x2="550" y2="156" stroke="#8a8a8a" stroke-width="1"/>
    <text x="500" y="174" text-anchor="middle" font-size="10" fill="#555" font-family="sans-serif">試作品の</text>
    <text x="500" y="190" text-anchor="middle" font-size="10" fill="#555" font-family="sans-serif">評価結果</text>
    <text x="500" y="206" text-anchor="middle" font-size="10" fill="#555" font-family="sans-serif">を審査</text>
  </g>

  <g>
    <rect x="570" y="100" width="120" height="120" fill="#e8f0fe" stroke="#2e6da4" stroke-width="2" rx="6"/>
    <text x="630" y="125" text-anchor="middle" font-size="14" fill="#1a3a5c" font-family="sans-serif" font-weight="bold">DR4</text>
    <text x="630" y="146" text-anchor="middle" font-size="12" fill="#222" font-family="sans-serif">量産移行</text>
    <line x1="580" y1="156" x2="680" y2="156" stroke="#8a8a8a" stroke-width="1"/>
    <text x="630" y="174" text-anchor="middle" font-size="10" fill="#555" font-family="sans-serif">量産準備の</text>
    <text x="630" y="190" text-anchor="middle" font-size="10" fill="#555" font-family="sans-serif">完了状況</text>
    <text x="630" y="206" text-anchor="middle" font-size="10" fill="#555" font-family="sans-serif">を審査</text>
  </g>

  <g stroke="#8a8a8a" stroke-width="1.5" fill="none">
    <line x1="170" y1="160" x2="180" y2="160"/>
    <line x1="300" y1="160" x2="310" y2="160"/>
    <line x1="430" y1="160" x2="440" y2="160"/>
    <line x1="560" y1="160" x2="570" y2="160"/>
  </g>

  <g>
    <rect x="40" y="248" width="660" height="48" fill="none" stroke="#3a7d44" stroke-width="1.5" stroke-dasharray="6,3" rx="4"/>
    <text x="370" y="268" text-anchor="middle" font-size="12" fill="#3a7d44" font-family="sans-serif" font-weight="bold">品質ゲート: 設計者以外の関係部門が多角的に審査</text>
    <text x="370" y="286" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">製造・品質・保全・調達などが参加し、設計の妥当性を確認</text>
  </g>

  <text x="360" y="316" text-anchor="middle" font-size="10" fill="#555" font-family="sans-serif">抽象 ─────────────── 設計の具体度 ─────────────── 具体</text>
</svg>
