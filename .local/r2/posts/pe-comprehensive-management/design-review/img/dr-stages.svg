<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 580" style="max-width:380px;width:100%" role="img" aria-label="デザインレビューの 5 段階（DR0 企画〜DR4 量産移行）と各段階の審査対象">
  <text x="190" y="26" text-anchor="middle" font-size="14" fill="#222" font-family="sans-serif" font-weight="bold">デザインレビュー 5 段階</text>
  <text x="190" y="44" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">DR0（企画）→ DR4（量産移行）</text>

  <line x1="190" y1="60" x2="190" y2="540" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4,3"/>

  <g>
    <rect x="40" y="64" width="300" height="80" fill="#e8f0fe" stroke="#2e6da4" stroke-width="2" rx="6"/>
    <text x="60" y="88" font-size="13" fill="#1a3a5c" font-family="sans-serif" font-weight="bold">DR0</text>
    <text x="100" y="88" font-size="13" fill="#222" font-family="sans-serif">企画段階</text>
    <text x="60" y="112" font-size="11" fill="#555" font-family="sans-serif">製品コンセプト・仕様の妥当性</text>
    <text x="60" y="130" font-size="11" fill="#555" font-family="sans-serif">を審査</text>
  </g>

  <g>
    <rect x="40" y="160" width="300" height="80" fill="#e8f0fe" stroke="#2e6da4" stroke-width="2" rx="6"/>
    <text x="60" y="184" font-size="13" fill="#1a3a5c" font-family="sans-serif" font-weight="bold">DR1</text>
    <text x="100" y="184" font-size="13" fill="#222" font-family="sans-serif">基本設計</text>
    <text x="60" y="208" font-size="11" fill="#555" font-family="sans-serif">基本設計の技術的成立性</text>
    <text x="60" y="226" font-size="11" fill="#555" font-family="sans-serif">を審査</text>
  </g>

  <g>
    <rect x="40" y="256" width="300" height="80" fill="#e8f0fe" stroke="#2e6da4" stroke-width="2" rx="6"/>
    <text x="60" y="280" font-size="13" fill="#1a3a5c" font-family="sans-serif" font-weight="bold">DR2</text>
    <text x="100" y="280" font-size="13" fill="#222" font-family="sans-serif">詳細設計</text>
    <text x="60" y="304" font-size="11" fill="#555" font-family="sans-serif">製造容易性・信頼性</text>
    <text x="60" y="322" font-size="11" fill="#555" font-family="sans-serif">を審査</text>
  </g>

  <g>
    <rect x="40" y="352" width="300" height="80" fill="#e8f0fe" stroke="#2e6da4" stroke-width="2" rx="6"/>
    <text x="60" y="376" font-size="13" fill="#1a3a5c" font-family="sans-serif" font-weight="bold">DR3</text>
    <text x="100" y="376" font-size="13" fill="#222" font-family="sans-serif">試作・評価</text>
    <text x="60" y="400" font-size="11" fill="#555" font-family="sans-serif">試作品の評価結果</text>
    <text x="60" y="418" font-size="11" fill="#555" font-family="sans-serif">を審査</text>
  </g>

  <g>
    <rect x="40" y="448" width="300" height="80" fill="#e8f0fe" stroke="#2e6da4" stroke-width="2" rx="6"/>
    <text x="60" y="472" font-size="13" fill="#1a3a5c" font-family="sans-serif" font-weight="bold">DR4</text>
    <text x="100" y="472" font-size="13" fill="#222" font-family="sans-serif">量産移行</text>
    <text x="60" y="496" font-size="11" fill="#555" font-family="sans-serif">量産準備の完了状況</text>
    <text x="60" y="514" font-size="11" fill="#555" font-family="sans-serif">を審査</text>
  </g>

  <text x="190" y="556" text-anchor="middle" font-size="11" fill="#3a7d44" font-family="sans-serif" font-weight="bold">品質ゲート: 関係部門が多角的に審査</text>
  <text x="190" y="572" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">製造・品質・保全・調達 等</text>
</svg>
