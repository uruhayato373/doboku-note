<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 510" font-family="sans-serif" style="max-width:460px;width:100%">
  <!-- Title -->
  <text x="230" y="22" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">アーンスタインの梯子（参加の8段階）</text>
  <text x="230" y="40" text-anchor="middle" font-size="11" fill="#6b7280">下から上へ、市民の実質的な決定権が増える</text>

  <!-- ============ Rung 8: 市民によるコントロール ============ -->
  <g>
    <rect x="30" y="55" width="350" height="46" fill="#bbf7d0" stroke="#16a34a" stroke-width="2" rx="6"/>
    <circle cx="58" cy="78" r="16" fill="#16a34a"/>
    <text x="58" y="83" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">8</text>
    <text x="85" y="83" font-size="14" font-weight="bold" fill="#14532d">市民によるコントロール</text>
  </g>

  <!-- Rung 7: 権限委譲 -->
  <g>
    <rect x="30" y="105" width="350" height="46" fill="#bbf7d0" stroke="#16a34a" stroke-width="2" rx="6"/>
    <circle cx="58" cy="128" r="16" fill="#16a34a"/>
    <text x="58" y="133" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">7</text>
    <text x="85" y="133" font-size="14" font-weight="bold" fill="#14532d">権限委譲</text>
  </g>

  <!-- Rung 6: パートナーシップ -->
  <g>
    <rect x="30" y="155" width="350" height="46" fill="#bbf7d0" stroke="#16a34a" stroke-width="2" rx="6"/>
    <circle cx="58" cy="178" r="16" fill="#16a34a"/>
    <text x="58" y="183" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">6</text>
    <text x="85" y="183" font-size="14" font-weight="bold" fill="#14532d">パートナーシップ</text>
  </g>

  <!-- Category label: 市民権力 -->
  <text x="420" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">市民</text>
  <text x="420" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">権力</text>

  <!-- Divider line -->
  <line x1="30" y1="209" x2="380" y2="209" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ============ Rung 5: 懐柔 ============ -->
  <g>
    <rect x="30" y="215" width="350" height="46" fill="#fef3c7" stroke="#ca8a04" stroke-width="2" rx="6"/>
    <circle cx="58" cy="238" r="16" fill="#ca8a04"/>
    <text x="58" y="243" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">5</text>
    <text x="85" y="243" font-size="14" font-weight="bold" fill="#713f12">懐柔</text>
  </g>

  <!-- Rung 4: 協議 -->
  <g>
    <rect x="30" y="265" width="350" height="46" fill="#fef3c7" stroke="#ca8a04" stroke-width="2" rx="6"/>
    <circle cx="58" cy="288" r="16" fill="#ca8a04"/>
    <text x="58" y="293" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">4</text>
    <text x="85" y="293" font-size="14" font-weight="bold" fill="#713f12">協議</text>
  </g>

  <!-- Rung 3: 情報提供 -->
  <g>
    <rect x="30" y="315" width="350" height="46" fill="#fef3c7" stroke="#ca8a04" stroke-width="2" rx="6"/>
    <circle cx="58" cy="338" r="16" fill="#ca8a04"/>
    <text x="58" y="343" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">3</text>
    <text x="85" y="343" font-size="14" font-weight="bold" fill="#713f12">情報提供</text>
  </g>

  <!-- Category label: 形式的参加 -->
  <text x="420" y="284" text-anchor="middle" font-size="12" font-weight="bold" fill="#713f12">形式的</text>
  <text x="420" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#713f12">参加</text>

  <!-- Divider line -->
  <line x1="30" y1="369" x2="380" y2="369" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ============ Rung 2: セラピー ============ -->
  <g>
    <rect x="30" y="375" width="350" height="46" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="6"/>
    <circle cx="58" cy="398" r="16" fill="#dc2626"/>
    <text x="58" y="403" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">2</text>
    <text x="85" y="403" font-size="14" font-weight="bold" fill="#7f1d1d">セラピー</text>
  </g>

  <!-- Rung 1: 操作 -->
  <g>
    <rect x="30" y="425" width="350" height="46" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="6"/>
    <circle cx="58" cy="448" r="16" fill="#dc2626"/>
    <text x="58" y="453" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">1</text>
    <text x="85" y="453" font-size="14" font-weight="bold" fill="#7f1d1d">操作</text>
  </g>

  <!-- Category label: 非参加 -->
  <text x="420" y="420" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">非</text>
  <text x="420" y="436" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">参加</text>

  <!-- Source note -->
  <text x="230" y="495" text-anchor="middle" font-size="10" fill="#9ca3af">Arnstein (1969) "A Ladder of Citizen Participation" より</text>
</svg>
