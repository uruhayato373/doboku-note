<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
     width="400" height="500"
     style="max-width:400px;width:100%"
     role="img"
     aria-label="線形回帰とロジスティック回帰の出力範囲と関数形を左右に並べた比較図">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-head  { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-label { font-size: 11px; fill: #555; }
      .t-text  { font-size: 12px; fill: #222; }
      .box-brand    { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-positive { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- 線形回帰 -->
  <rect class="box-brand" x="10" y="10" width="185" height="330" rx="8"/>
  <text x="102" y="36" class="t-head" text-anchor="middle">線形回帰</text>

  <line x1="30" y1="60" x2="30" y2="210" stroke="#555" stroke-width="1"/>
  <line x1="30" y1="210" x2="180" y2="210" stroke="#555" stroke-width="1"/>
  <text x="26" y="65" class="t-label" text-anchor="end">y</text>
  <text x="182" y="214" class="t-label">x</text>

  <line x1="40" y1="195" x2="175" y2="70" stroke="#2e6da4" stroke-width="2.2"/>

  <text x="102" y="240" class="t-text" text-anchor="middle">y = β₀ + β₁x</text>
  <text x="102" y="260" class="t-label" text-anchor="middle">出力: 実数全体（−∞ ～ +∞）</text>
  <text x="102" y="278" class="t-label" text-anchor="middle">推定: 最小二乗法</text>
  <text x="102" y="296" class="t-label" text-anchor="middle">目的: 連続値の予測</text>
  <text x="102" y="314" class="t-label" text-anchor="middle">例: 工期・コスト推定</text>

  <!-- ロジスティック回帰 -->
  <rect class="box-positive" x="205" y="10" width="185" height="330" rx="8"/>
  <text x="297" y="36" class="t-head" text-anchor="middle">ロジスティック回帰</text>

  <line x1="225" y1="60" x2="225" y2="210" stroke="#555" stroke-width="1"/>
  <line x1="225" y1="210" x2="375" y2="210" stroke="#555" stroke-width="1"/>
  <line x1="225" y1="70" x2="375" y2="70" stroke="#8a8a8a" stroke-dasharray="2,2" stroke-width="0.8"/>

  <text x="221" y="65" class="t-label" text-anchor="end">p</text>
  <text x="377" y="214" class="t-label">x</text>
  <text x="221" y="74" class="t-label" text-anchor="end">1</text>
  <text x="221" y="214" class="t-label" text-anchor="end">0</text>

  <path d="M 230 205 C 265 205, 285 180, 300 135 C 315 90, 335 70, 370 70"
        stroke="#3a7d44" stroke-width="2.2" fill="none"/>

  <text x="297" y="240" class="t-text" text-anchor="middle">p = 1 / (1 + e⁻ᶻ)</text>
  <text x="297" y="260" class="t-label" text-anchor="middle">出力: 0〜1 の確率</text>
  <text x="297" y="278" class="t-label" text-anchor="middle">推定: 最尤推定法</text>
  <text x="297" y="296" class="t-label" text-anchor="middle">目的: 2 値分類の確率推定</text>
  <text x="297" y="314" class="t-label" text-anchor="middle">例: 合否・リスク判定</text>

  <!-- 比較サマリー（下部余白を活用） -->
  <rect x="10" y="355" width="380" height="130" rx="8" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="1"/>
  <text x="200" y="378" class="t-head" text-anchor="middle" fill="#222">選択の目安</text>
  <line x1="20" y1="384" x2="380" y2="384" stroke="#d7d7d7" stroke-width="1"/>

  <text x="30" y="404" class="t-text" fill="#2e6da4">線形回帰:</text>
  <text x="30" y="422" class="t-label">目的変数が連続量（金額・日数）のとき</text>

  <text x="30" y="446" class="t-text" fill="#3a7d44">ロジスティック回帰:</text>
  <text x="30" y="464" class="t-label">目的変数が 0/1 の 2 値（成否・異常検知）のとき</text>
  <text x="30" y="478" class="t-label">→ シグモイド関数で確率に変換</text>
</svg>
