<svg width="400" height="500" viewBox="0 0 400 500"
     xmlns="http://www.w3.org/2000/svg"
     style="max-width:400px;width:100%"
     role="img"
     aria-label="API によるシステム連携。複数の利用側アプリが API という公開された取り決めを介してサービス提供側の機能・データを呼び出す。提供側の内部実装は隠蔽される。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-title  { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-api    { font-size: 22px; font-weight: bold; fill: #1a3a5c; }
      .t-strong { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-body   { font-size: 11px; fill: #555; }
      .t-mut    { font-size: 11px; fill: #8a8a8a; }
      .t-note   { font-size: 11px; fill: #222; }
      .box-user { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .box-api  { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-svc  { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-info { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1; }
    </style>
    <marker id="api-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto">
      <polygon points="0,0 10,4.5 0,9" fill="#2e6da4"/>
    </marker>
  </defs>

  <text class="t-title" x="200" y="28" text-anchor="middle">API によるシステム連携</text>

  <!-- 利用側（y+30シフト・高さ拡大） -->
  <rect class="box-user" x="12" y="54" width="104" height="46" rx="6"/>
  <text class="t-body" x="64" y="81" text-anchor="middle">モバイルアプリ</text>
  <rect class="box-user" x="12" y="122" width="104" height="46" rx="6"/>
  <text class="t-body" x="64" y="149" text-anchor="middle">他社サービス</text>
  <rect class="box-user" x="12" y="190" width="104" height="46" rx="6"/>
  <text class="t-body" x="64" y="217" text-anchor="middle">Web サイト</text>

  <line x1="118" y1="77"  x2="144" y2="77"  stroke="#2e6da4" stroke-width="2" marker-end="url(#api-arrow)"/>
  <line x1="118" y1="145" x2="144" y2="145" stroke="#2e6da4" stroke-width="2" marker-end="url(#api-arrow)"/>
  <line x1="118" y1="213" x2="144" y2="213" stroke="#2e6da4" stroke-width="2" marker-end="url(#api-arrow)"/>

  <!-- 利用側ラベル -->
  <text x="64" y="248" font-size="11" fill="#8a8a8a" text-anchor="middle">利用側</text>

  <!-- API（高さ拡大） -->
  <rect class="box-api" x="148" y="54" width="104" height="182" rx="8"/>
  <text class="t-api"  x="200" y="132" text-anchor="middle">API</text>
  <text class="t-body" x="200" y="158" text-anchor="middle">公開された</text>
  <text class="t-body" x="200" y="174" text-anchor="middle">やり取りの取り決め</text>
  <text x="200" y="248" font-size="11" fill="#8a8a8a" text-anchor="middle">インタフェース</text>

  <line x1="254" y1="130" x2="280" y2="130" stroke="#2e6da4" stroke-width="2" marker-end="url(#api-arrow)"/>
  <line x1="280" y1="158" x2="254" y2="158" stroke="#2e6da4" stroke-width="2" marker-end="url(#api-arrow)"/>
  <text class="t-mut" x="267" y="122" text-anchor="middle">呼出</text>
  <text class="t-mut" x="267" y="175" text-anchor="middle">応答</text>

  <!-- 提供側（高さ拡大） -->
  <rect class="box-svc" x="284" y="54" width="104" height="182" rx="8"/>
  <text class="t-strong" x="336" y="126" text-anchor="middle">サービス提供側</text>
  <text class="t-body"   x="336" y="148" text-anchor="middle">システム・データ</text>
  <text class="t-mut"    x="336" y="176" text-anchor="middle">内部実装は</text>
  <text class="t-mut"    x="336" y="192" text-anchor="middle">隠蔽される</text>
  <text x="336" y="248" font-size="11" fill="#8a8a8a" text-anchor="middle">提供側</text>

  <!-- 説明ボックス -->
  <rect x="15" y="268" width="370" height="132" rx="6" class="box-info"/>
  <text x="200" y="288" font-size="12" fill="#1a3a5c" text-anchor="middle" font-weight="bold">API の 3 つのメリット</text>
  <line x1="15" y1="295" x2="385" y2="295" stroke="#d7d7d7" stroke-width="1"/>
  <text x="25" y="314" class="t-note">疎結合：提供側の内部変更が利用側に影響しない</text>
  <text x="25" y="334" class="t-note">再利用性：同一 API を複数サービスが共用できる</text>
  <text x="25" y="354" class="t-note">標準化：取り決めさえ守れば言語・環境を問わない</text>
  <text x="25" y="378" font-size="11" fill="#555">→ 総監「情報管理」でシステム間連携の標準手段として頻出</text>

  <!-- フッターサマリー -->
  <rect x="15" y="418" width="370" height="64" rx="6" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1"/>
  <text x="200" y="438" font-size="12" fill="#1a3a5c" text-anchor="middle" font-weight="bold">API の定義</text>
  <text x="200" y="458" font-size="11" fill="#222" text-anchor="middle">アプリケーション間の機能・データ共有を可能にする</text>
  <text x="200" y="474" font-size="11" fill="#222" text-anchor="middle">公開されたインタフェース仕様（取り決め）</text>
</svg>
