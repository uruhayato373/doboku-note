<svg viewBox="0 0 440 380" xmlns="http://www.w3.org/2000/svg"
  style="max-width:440px;width:100%"
  role="img"
  aria-label="ジョブ型（職務主義）とメンバーシップ型（属人主義）の雇用形態を6項目で左右比較した図">
  <!-- viewBox幅440は2カラム比較レイアウト（ラベル96+ブランド152+ポジティブ156+余白）に不可避。max-widthも440で整合済み。viewBox・max-widthは据置 -->
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-title  { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-head   { font-size: 14px; font-weight: bold; fill: #1a3a5c; }
      .t-sub    { font-size: 11px; fill: #555; }
      .t-label  { font-size: 12px; fill: #8a8a8a; font-weight: bold; }
      .t-body   { font-size: 13px; fill: #222; }
      .t-note   { font-size: 11px; fill: #555; }
      /* brand = ジョブ型 */
      .col-brand-bg  { fill: #e8f0fe; }
      .col-brand-hd  { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .col-brand-row { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 0.8; } /* brand-fill */
      /* positive = メンバーシップ型 */
      .col-pos-bg    { fill: #d0e8d0; }
      .col-pos-hd    { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .col-pos-row   { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 0.8; } /* positive-fill */
      /* row label column */
      .col-label-bg  { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 0.8; }
      /* divider */
      .divider { stroke: #d7d7d7; stroke-width: 1; }
    </style>
  </defs>

  <!-- title -->
  <text class="t-title" x="220" y="24" text-anchor="middle">ジョブ型 vs メンバーシップ型</text>
  <text class="t-sub" x="220" y="42" text-anchor="middle">雇用形態の2類型</text>

  <!-- column widths: label=96, brand=160, positive=160, margins left=14 -->
  <!-- rows: header y=54, rows at y=100,144,188,232,276,320 (row h=44) -->

  <!-- === HEADER ROW === -->
  <!-- label header cell -->
  <rect class="col-label-bg" x="14" y="54" width="96" height="40" rx="4"/>
  <text class="t-label" x="62" y="78" text-anchor="middle">比較項目</text>

  <!-- brand header -->
  <rect class="col-brand-hd" x="114" y="54" width="152" height="40" rx="4"/>
  <text class="t-head" x="190" y="72" text-anchor="middle">ジョブ型</text>
  <text class="t-sub" x="190" y="87" text-anchor="middle">職務主義（欧米型）</text>

  <!-- positive header -->
  <rect class="col-pos-hd" x="270" y="54" width="156" height="40" rx="4"/>
  <text class="t-head" x="348" y="72" text-anchor="middle">メンバーシップ型</text>
  <text class="t-sub" x="348" y="87" text-anchor="middle">属人主義（日本型）</text>

  <!-- === ROW 1: 配置原則 === -->
  <rect class="col-label-bg" x="14" y="98" width="96" height="42" rx="2"/>
  <text class="t-label" x="62" y="122" text-anchor="middle">配置原則</text>

  <rect class="col-brand-row" x="114" y="98" width="152" height="42" rx="2"/>
  <text class="t-body" x="190" y="122" text-anchor="middle">仕事に人を当てる</text>

  <rect class="col-pos-row" x="270" y="98" width="156" height="42" rx="2"/>
  <text class="t-body" x="348" y="122" text-anchor="middle">人に職務を配置する</text>

  <!-- === ROW 2: 能力評価 === -->
  <rect class="col-label-bg" x="14" y="144" width="96" height="42" rx="2"/>
  <text class="t-label" x="62" y="168" text-anchor="middle">能力評価</text>

  <rect class="col-brand-row" x="114" y="144" width="152" height="42" rx="2"/>
  <text class="t-body" x="190" y="168" text-anchor="middle">顕在能力を重視</text>

  <rect class="col-pos-row" x="270" y="144" width="156" height="42" rx="2"/>
  <text class="t-body" x="348" y="168" text-anchor="middle">潜在能力も評価</text>

  <!-- === ROW 3: 採用方式 === -->
  <rect class="col-label-bg" x="14" y="190" width="96" height="42" rx="2"/>
  <text class="t-label" x="62" y="214" text-anchor="middle">採用方式</text>

  <rect class="col-brand-row" x="114" y="190" width="152" height="42" rx="2"/>
  <text class="t-body" x="190" y="208" text-anchor="middle">必要時に欠員補充</text>
  <text class="t-note" x="190" y="226" text-anchor="middle">（随時採用）</text>

  <rect class="col-pos-row" x="270" y="190" width="156" height="42" rx="2"/>
  <text class="t-body" x="348" y="208" text-anchor="middle">長期雇用・新卒</text>
  <text class="t-note" x="348" y="226" text-anchor="middle">一括採用が典型</text>

  <!-- === ROW 4: 人材育成 === -->
  <rect class="col-label-bg" x="14" y="236" width="96" height="42" rx="2"/>
  <text class="t-label" x="62" y="260" text-anchor="middle">人材育成</text>

  <rect class="col-brand-row" x="114" y="236" width="152" height="42" rx="2"/>
  <text class="t-body" x="190" y="254" text-anchor="middle">即戦力・外部調達</text>
  <text class="t-note" x="190" y="272" text-anchor="middle">OFF-JT中心</text>

  <rect class="col-pos-row" x="270" y="236" width="156" height="42" rx="2"/>
  <text class="t-body" x="348" y="254" text-anchor="middle">内部育成・</text>
  <text class="t-body" x="348" y="272" text-anchor="middle">OJT中心</text>

  <!-- === ROW 5: 報酬水準 === -->
  <rect class="col-label-bg" x="14" y="282" width="96" height="42" rx="2"/>
  <text class="t-label" x="62" y="306" text-anchor="middle">報酬水準</text>

  <rect class="col-brand-row" x="114" y="282" width="152" height="42" rx="2"/>
  <text class="t-body" x="190" y="300" text-anchor="middle">職種市場価格に連動</text>
  <text class="t-note" x="190" y="318" text-anchor="middle">（一般に高め）</text>

  <rect class="col-pos-row" x="270" y="282" width="156" height="42" rx="2"/>
  <text class="t-body" x="348" y="300" text-anchor="middle">年功・職能資格</text>
  <text class="t-note" x="348" y="318" text-anchor="middle">ベースで決定</text>

  <!-- === ROW 6: 変化対応 === -->
  <rect class="col-label-bg" x="14" y="328" width="96" height="34" rx="2"/>
  <text class="t-label" x="62" y="349" text-anchor="middle">変化対応</text>

  <rect class="col-brand-row" x="114" y="328" width="152" height="34" rx="2"/>
  <text class="t-body" x="190" y="342" text-anchor="middle">容易</text>
  <text class="t-note" x="190" y="358" text-anchor="middle">（職務単位で対応）</text>

  <rect class="col-pos-row" x="270" y="328" width="156" height="34" rx="2"/>
  <text class="t-body" x="348" y="342" text-anchor="middle">緩やか</text>
  <text class="t-note" x="348" y="358" text-anchor="middle">（異動・OJTで吸収）</text>

</svg>
