<svg viewBox="0 0 400 812" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="環境条約・会議・議定書の時系列。1971ラムサール条約から2015パリ協定・SDGsまでの主要な国際枠組みを、自然・気候・廃棄物・枠組の4分野に色分けして年代順に並べた図">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-title { font-size: 16px; font-weight: bold; fill: #1a3a5c; }
      .t-sub   { font-size: 11px; fill: #555; }
      .t-year  { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-name  { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-note  { font-size: 11px; fill: #555; }
      .t-leg   { font-size: 11px; fill: #555; }
      .t-foot  { font-size: 11px; fill: #8a8a8a; }
      .nature  { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.2; }
      .climate { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.2; }
      .pollut  { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.2; }
      .frame   { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.2; }
      .d-nature  { fill: #ffffff; stroke: #3a7d44; stroke-width: 2; }
      .d-climate { fill: #ffffff; stroke: #2e6da4; stroke-width: 2; }
      .d-pollut  { fill: #ffffff; stroke: #d4a017; stroke-width: 2; }
      .d-frame   { fill: #ffffff; stroke: #8a8a8a; stroke-width: 2; }
    </style>
  </defs>

  <!-- title -->
  <text class="t-title" x="200" y="24" text-anchor="middle">環境条約・会議・議定書の歩み</text>
  <text class="t-sub" x="200" y="42" text-anchor="middle">持続可能な開発をめぐる国際枠組みの時系列</text>

  <!-- legend -->
  <rect x="8"   y="58" width="13" height="12" rx="2" class="nature"/>
  <text class="t-leg" x="25" y="68">生物多様性</text>
  <rect x="108" y="58" width="13" height="12" rx="2" class="climate"/>
  <text class="t-leg" x="125" y="68">気候</text>
  <rect x="165" y="58" width="13" height="12" rx="2" class="pollut"/>
  <text class="t-leg" x="182" y="68">廃棄物・化学</text>
  <rect x="290" y="58" width="13" height="12" rx="2" class="frame"/>
  <text class="t-leg" x="307" y="68">枠組・理念</text>

  <!-- 時間軸 -->
  <line x1="78" y1="92" x2="78" y2="736" stroke="#8a8a8a" stroke-width="2"/>

  <!-- 1971 ラムサール -->
  <text class="t-year" x="66" y="116" text-anchor="end">1971</text>
  <circle class="d-nature" cx="78" cy="112" r="5"/>
  <rect class="nature" x="92" y="88" width="300" height="48" rx="8"/>
  <text class="t-name" x="104" y="110">ラムサール条約</text>
  <text class="t-note" x="104" y="128">水鳥の生息地となる湿地の保全・賢明な利用</text>

  <!-- 1973 ワシントン -->
  <text class="t-year" x="66" y="170" text-anchor="end">1973</text>
  <circle class="d-nature" cx="78" cy="166" r="5"/>
  <rect class="nature" x="92" y="142" width="300" height="48" rx="8"/>
  <text class="t-name" x="104" y="164">ワシントン条約（CITES）</text>
  <text class="t-note" x="104" y="182">絶滅のおそれのある野生動植物の国際取引規制</text>

  <!-- 1984 WCED -->
  <text class="t-year" x="66" y="224" text-anchor="end">1984</text>
  <circle class="d-frame" cx="78" cy="220" r="5"/>
  <rect class="frame" x="92" y="196" width="300" height="48" rx="8"/>
  <text class="t-name" x="104" y="218">WCED（環境と開発に関する世界委員会）</text>
  <text class="t-note" x="104" y="236">「持続可能な開発」の概念を提唱</text>

  <!-- 1989 バーゼル -->
  <text class="t-year" x="66" y="278" text-anchor="end">1989</text>
  <circle class="d-pollut" cx="78" cy="274" r="5"/>
  <rect class="pollut" x="92" y="250" width="300" height="48" rx="8"/>
  <text class="t-name" x="104" y="272">バーゼル条約</text>
  <text class="t-note" x="104" y="290">有害廃棄物の越境移動とその処分の規制</text>

  <!-- 1992 地球サミット -->
  <text class="t-year" x="66" y="338" text-anchor="end">1992</text>
  <circle class="d-frame" cx="78" cy="334" r="6"/>
  <rect class="frame" x="92" y="304" width="300" height="84" rx="8"/>
  <text class="t-name" x="104" y="326">地球サミット（リオ）</text>
  <text class="t-note" x="104" y="346">・リオ宣言（27原則）／アジェンダ21</text>
  <text class="t-note" x="104" y="364">・気候変動枠組条約</text>
  <text class="t-note" x="104" y="382">・生物多様性条約</text>

  <!-- 1997 京都議定書 -->
  <text class="t-year" x="66" y="426" text-anchor="end">1997</text>
  <circle class="d-climate" cx="78" cy="422" r="5"/>
  <rect class="climate" x="92" y="398" width="300" height="48" rx="8"/>
  <text class="t-name" x="104" y="420">京都議定書</text>
  <text class="t-note" x="104" y="438">先進国に温室効果ガスの数値削減目標</text>

  <!-- 2000 カルタヘナ -->
  <text class="t-year" x="66" y="480" text-anchor="end">2000</text>
  <circle class="d-nature" cx="78" cy="476" r="5"/>
  <rect class="nature" x="92" y="452" width="300" height="48" rx="8"/>
  <text class="t-name" x="104" y="474">カルタヘナ議定書</text>
  <text class="t-note" x="104" y="492">遺伝子組換え生物のバイオセーフティ確保</text>

  <!-- 2001 POPs -->
  <text class="t-year" x="66" y="534" text-anchor="end">2001</text>
  <circle class="d-pollut" cx="78" cy="530" r="5"/>
  <rect class="pollut" x="92" y="506" width="300" height="48" rx="8"/>
  <text class="t-name" x="104" y="528">ストックホルム条約（POPs）</text>
  <text class="t-note" x="104" y="546">残留性有機汚染物質の製造・使用の廃絶</text>

  <!-- 2010 名古屋議定書・30by30 -->
  <text class="t-year" x="66" y="594" text-anchor="end">2010</text>
  <circle class="d-nature" cx="78" cy="590" r="6"/>
  <rect class="nature" x="92" y="560" width="300" height="64" rx="8"/>
  <text class="t-name" x="104" y="582">名古屋議定書（生物多様性COP10）</text>
  <text class="t-note" x="104" y="600">遺伝資源の利益の公正・衡平な配分（ABS）</text>
  <text class="t-note" x="104" y="618">のち 30by30 目標へ（陸海の30%保全）</text>

  <!-- 2015 SDGs・パリ協定 -->
  <text class="t-year" x="66" y="654" text-anchor="end">2015</text>
  <circle class="d-frame" cx="78" cy="650" r="6"/>
  <rect class="frame" x="92" y="630" width="300" height="68" rx="8"/>
  <text class="t-name" x="104" y="652">SDGs ／ パリ協定</text>
  <text class="t-note" x="104" y="670">・2030アジェンダ（17目標）</text>
  <text class="t-note" x="104" y="688">・パリ協定（COP21／1.5〜2℃目標）</text>

  <!-- footer -->
  <line x1="0" y1="752" x2="400" y2="752" stroke="#d7d7d7" stroke-width="1"/>
  <text class="t-foot" x="8" y="772">年は採択・成立年（発効はこれより後）。</text>
  <text class="t-foot" x="8" y="790">ワシントン条約は通説1973年（一部教材は1971年表記）。</text>
</svg>
