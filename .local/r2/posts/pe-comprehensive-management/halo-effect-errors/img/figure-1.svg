<svg viewBox="0 0 400 620" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="人事評価の6つの評価バイアス。ハロー効果・中心化傾向・寛大化（厳格化）傾向・対比誤差・論理的誤差・遠近効果の定義を縦に並べた図">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-title  { font-size: 16px; font-weight: bold; fill: #1a3a5c; }
      .t-label  { font-size: 14px; font-weight: bold; fill: #1a3a5c; }
      .t-body   { font-size: 13px; fill: #555; }
      .t-num    { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      /* warn: 誤り注意カラー */
      .box-warn   { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .badge-warn { fill: #ffffff; stroke: #d4a017; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- タイトル -->
  <text class="t-title" x="200" y="26" text-anchor="middle">評価バイアス 6 種</text>
  <text style="font-size:12px;fill:#555;font-family:Inter,'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif"
        x="200" y="44" text-anchor="middle">人事考課で生じる代表的な誤差</text>

  <!-- カード 1: ハロー効果 -->
  <rect class="box-warn" x="16" y="58" width="368" height="78" rx="8"/>
  <circle class="badge-warn" cx="44" cy="97" r="16"/>
  <text class="t-num" x="44" y="102" text-anchor="middle">1</text>
  <text class="t-label" x="72" y="83">ハロー効果</text>
  <text class="t-body" x="72" y="101">優れた（劣った）点に引きずられ、</text>
  <text class="t-body" x="72" y="119">他の項目も同様に高く（低く）評価する</text>

  <!-- カード 2: 中心化傾向 -->
  <rect class="box-warn" x="16" y="148" width="368" height="78" rx="8"/>
  <circle class="badge-warn" cx="44" cy="187" r="16"/>
  <text class="t-num" x="44" y="192" text-anchor="middle">2</text>
  <text class="t-label" x="72" y="173">中心化傾向</text>
  <text class="t-body" x="72" y="191">人間関係を重視して無難な評価に逃げ、</text>
  <text class="t-body" x="72" y="209">評価結果が中央値に集中する</text>

  <!-- カード 3: 寛大化（厳格化）傾向 -->
  <rect class="box-warn" x="16" y="238" width="368" height="78" rx="8"/>
  <circle class="badge-warn" cx="44" cy="277" r="16"/>
  <text class="t-num" x="44" y="282" text-anchor="middle">3</text>
  <text class="t-label" x="72" y="263">寛大化（厳格化）傾向</text>
  <text class="t-body" x="72" y="281">部下との関係悪化を避けるため甘く評価する</text>
  <text class="t-body" x="72" y="299">（逆に厳しくなる場合は厳格化傾向）</text>

  <!-- カード 4: 対比誤差 -->
  <rect class="box-warn" x="16" y="328" width="368" height="78" rx="8"/>
  <circle class="badge-warn" cx="44" cy="367" r="16"/>
  <text class="t-num" x="44" y="372" text-anchor="middle">4</text>
  <text class="t-label" x="72" y="353">対比誤差</text>
  <text class="t-body" x="72" y="371">評価者自身の能力と比較してしまい、</text>
  <text class="t-body" x="72" y="389">得意分野は厳しく・苦手分野は甘くなる</text>

  <!-- カード 5: 論理的誤差 -->
  <rect class="box-warn" x="16" y="418" width="368" height="78" rx="8"/>
  <circle class="badge-warn" cx="44" cy="457" r="16"/>
  <text class="t-num" x="44" y="462" text-anchor="middle">5</text>
  <text class="t-label" x="72" y="443">論理的誤差</text>
  <text class="t-body" x="72" y="461">直接関係のない学歴や過去の失敗など</text>
  <text class="t-body" x="72" y="479">を論理的に結びつけて評価してしまう</text>

  <!-- カード 6: 遠近効果 -->
  <rect class="box-warn" x="16" y="508" width="368" height="78" rx="8"/>
  <circle class="badge-warn" cx="44" cy="547" r="16"/>
  <text class="t-num" x="44" y="552" text-anchor="middle">6</text>
  <text class="t-label" x="72" y="533">遠近効果</text>
  <text class="t-body" x="72" y="551">評価時期に近い出来事を過大視し、</text>
  <text class="t-body" x="72" y="569">時間が経った成果が過小評価される</text>

  <!-- フッター -->
  <text style="font-size:11px;fill:#8a8a8a;font-family:Inter,'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif"
        x="200" y="608" text-anchor="middle">評価者訓練（トレーニング）でバイアスを低減させることが重要</text>
</svg>
