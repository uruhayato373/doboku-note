<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" width="400" height="500" role="img" aria-label="FIT・FIP制度の仕組み。FITの資金フロー：再エネ発電事業者が電力会社に電気を売り、電力会社が消費者に電気を供給。買取費用は再エネ賦課金として全国一律で徴収。FIPは市場価格にプレミアム加算。試験引っかけ：対象5種のみ・経済産業大臣・全国一律。">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-title { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-sec   { font-size: 11px; font-weight: bold; fill: #ffffff; }
      .t-hd    { font-size: 11px; font-weight: bold; fill: #1a3a5c; }
      .t-cell  { font-size: 11px; fill: #555; }
      .t-name  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-note  { font-size: 11px; fill: #8a8a8a; }
      .t-sub   { font-size: 11px; fill: #555; }
      .t-foot  { font-size: 11px; fill: #8a8a8a; }
    </style>
  </defs>
  <rect width="400" height="500" fill="#ffffff"/>

  <!-- タイトル -->
  <text class="t-title" x="200" y="22" text-anchor="middle">FIT・FIP制度の仕組み</text>
  <line x1="20" y1="30" x2="380" y2="30" stroke="#d7d7d7" stroke-width="1"/>

  <!-- ─── Zone 1: FITの資金フロー ─── -->
  <rect x="8" y="34" width="384" height="18" rx="3" fill="#2e6da4"/>
  <text class="t-sec" x="200" y="47" text-anchor="middle">FITの資金フロー</text>

  <!-- Box A: 再エネ発電事業者 -->
  <rect x="8" y="58" width="110" height="48" rx="5" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
  <text class="t-name" x="63" y="78" text-anchor="middle">再エネ発電</text>
  <text class="t-name" x="63" y="97" text-anchor="middle">事業者</text>

  <!-- Box B: 電力会社 -->
  <rect x="144" y="58" width="112" height="48" rx="5" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text class="t-name" x="200" y="87" text-anchor="middle">電力会社</text>

  <!-- Box C: 電気消費者 -->
  <rect x="282" y="58" width="110" height="48" rx="5" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text class="t-name" x="337" y="87" text-anchor="middle" fill="#222">電気消費者</text>

  <!-- 上矢印ラベル: 電気 -->
  <text x="131" y="67" text-anchor="middle" font-size="11" fill="#3a7d44">電気</text>
  <text x="269" y="67" text-anchor="middle" font-size="11" fill="#3a7d44">電気</text>

  <!-- 上矢印: A→B (電気) -->
  <line x1="118" y1="72" x2="138" y2="72" stroke="#3a7d44" stroke-width="1.5"/>
  <polygon points="0,0 6,3 0,6" transform="translate(138,69)" fill="#3a7d44"/>

  <!-- 上矢印: B→C (電気) -->
  <line x1="256" y1="72" x2="276" y2="72" stroke="#3a7d44" stroke-width="1.5"/>
  <polygon points="0,0 6,3 0,6" transform="translate(276,69)" fill="#3a7d44"/>

  <!-- 下矢印: B→A (固定買取費用) -->
  <line x1="144" y1="94" x2="124" y2="94" stroke="#d4a017" stroke-width="1.5"/>
  <polygon points="6,0 0,3 6,6" transform="translate(118,91)" fill="#d4a017"/>

  <!-- 下矢印: C→B (再エネ賦課金) -->
  <line x1="282" y1="94" x2="262" y2="94" stroke="#d4a017" stroke-width="1.5"/>
  <polygon points="6,0 0,3 6,6" transform="translate(256,91)" fill="#d4a017"/>

  <!-- 下矢印ラベル (ボックス下) -->
  <text x="131" y="120" text-anchor="middle" font-size="11" fill="#d4a017">固定買取費用</text>
  <text x="269" y="120" text-anchor="middle" font-size="11" fill="#d4a017">再エネ賦課金</text>

  <!-- 補足ノート -->
  <text class="t-note" x="200" y="135" text-anchor="middle">買取価格：経済産業大臣が毎年設定 ／ 買取期間：太陽光等 20年</text>
  <text class="t-note" x="200" y="150" text-anchor="middle">再エネ賦課金は電気使用量に比例・全国一律単価で徴収</text>

  <!-- ─── Zone 2: FIT vs FIP 比較 ─── -->
  <rect x="8" y="158" width="384" height="18" rx="3" fill="#d4a017"/>
  <text class="t-sec" x="200" y="171" text-anchor="middle">FIT → FIP への移行（2022年）</text>

  <!-- Table header -->
  <rect x="8"   y="177" width="80"  height="22" fill="#e8f0fe" stroke="#d7d7d7" stroke-width="0.5"/>
  <rect x="88"  y="177" width="152" height="22" fill="#e8f0fe" stroke="#d7d7d7" stroke-width="0.5"/>
  <rect x="240" y="177" width="152" height="22" fill="#e8f0fe" stroke="#d7d7d7" stroke-width="0.5"/>
  <text class="t-hd" x="48"  y="193" text-anchor="middle">項目</text>
  <text class="t-hd" x="164" y="193" text-anchor="middle">FIT（固定価格買取）</text>
  <text class="t-hd" x="316" y="193" text-anchor="middle">FIP（プレミアム）</text>

  <!-- Row 1: 導入年 -->
  <rect x="8"   y="199" width="80"  height="26" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="0.5"/>
  <rect x="88"  y="199" width="152" height="26" fill="#ffffff" stroke="#d7d7d7" stroke-width="0.5"/>
  <rect x="240" y="199" width="152" height="26" fill="#ffffff" stroke="#d7d7d7" stroke-width="0.5"/>
  <text class="t-hd"   x="48"  y="217" text-anchor="middle">導入</text>
  <text class="t-cell" x="164" y="217" text-anchor="middle">2012年（再エネ特措法）</text>
  <text class="t-cell" x="316" y="217" text-anchor="middle">2022年（改正再エネ特措法）</text>

  <!-- Row 2: 買取方式 -->
  <rect x="8"   y="225" width="80"  height="38" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="0.5"/>
  <rect x="88"  y="225" width="152" height="38" fill="#ffffff" stroke="#d7d7d7" stroke-width="0.5"/>
  <rect x="240" y="225" width="152" height="38" fill="#ffffff" stroke="#d7d7d7" stroke-width="0.5"/>
  <text class="t-hd"   x="48"  y="249" text-anchor="middle">方式</text>
  <text class="t-cell" x="164" y="238" text-anchor="middle">固定価格で電力会社が</text>
  <text class="t-cell" x="164" y="254" text-anchor="middle">全量買取</text>
  <text class="t-cell" x="316" y="238" text-anchor="middle">市場価格＋</text>
  <text class="t-cell" x="316" y="254" text-anchor="middle">プレミアム（交付金）加算</text>

  <!-- Row 3: 市場連動 -->
  <rect x="8"   y="263" width="80"  height="26" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="0.5"/>
  <rect x="88"  y="263" width="152" height="26" fill="#ffffff" stroke="#d7d7d7" stroke-width="0.5"/>
  <rect x="240" y="263" width="152" height="26" fill="#ffffff" stroke="#d7d7d7" stroke-width="0.5"/>
  <text class="t-hd"   x="48"  y="281" text-anchor="middle">市場</text>
  <text class="t-cell" x="164" y="281" text-anchor="middle">連動なし（需給無関係）</text>
  <text class="t-cell" x="316" y="281" text-anchor="middle">連動あり（需給に対応）</text>

  <!-- ─── Zone 3: 引っかけポイント ─── -->
  <rect x="8" y="297" width="384" height="18" rx="3" fill="#8a8a8a"/>
  <text class="t-sec" x="200" y="310" text-anchor="middle">試験の引っかけポイント</text>

  <!-- Warn box -->
  <rect x="8" y="321" width="384" height="168" rx="6" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <rect x="8" y="321" width="5"   height="168" rx="3" fill="#d4a017"/>

  <text x="20" y="341" font-size="12" font-weight="bold" fill="#1a3a5c">FIT対象は5種のみ</text>
  <text class="t-sub" x="20" y="358">太陽光・風力・水力・地熱・バイオマス</text>
  <text x="20" y="375" font-size="11" fill="#b22234">  ✗ 波力・潮力・海洋温度差は対象外</text>

  <line x1="20" y1="385" x2="385" y2="385" stroke="#d4a017" stroke-width="0.5" stroke-dasharray="4,4"/>

  <text x="20" y="403" font-size="12" font-weight="bold" fill="#1a3a5c">賦課金・買取価格の決定者</text>
  <text class="t-sub" x="20" y="420">買取価格・賦課金単価 → 経済産業大臣が毎年設定</text>
  <text x="20" y="437" font-size="11" fill="#b22234">  ✗ 環境大臣ではない</text>

  <line x1="20" y1="447" x2="385" y2="447" stroke="#d4a017" stroke-width="0.5" stroke-dasharray="4,4"/>

  <text x="20" y="463" font-size="12" font-weight="bold" fill="#1a3a5c">賦課金は全国一律単価</text>
  <text class="t-sub" x="20" y="480">電気使用量に比例・地域差なし（電気代基本単価とは別）</text>

  <!-- フッター -->
  <text class="t-foot" x="200" y="497" text-anchor="middle">FIT=Feed-in Tariff ／ FIP=Feed-in Premium（再エネ特措法）</text>
</svg>
