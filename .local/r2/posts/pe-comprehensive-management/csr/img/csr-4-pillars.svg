<svg xmlns="http://www.w3.org/2000/svg" width="540" height="360" viewBox="0 0 540 360" style="max-width:540px;width:100%" role="img" aria-label="CSR の 4 要素の構造図：3 本柱（環境・社会・経済）とその基盤としてのガバナンス">
  <rect width="540" height="360" fill="#ffffff"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">CSR（企業の社会的責任）の 4 要素</text>

  <!-- Top beam: sustainability outcome -->
  <rect x="40" y="44" width="460" height="40" fill="#f0f4fb" stroke="#1a56db" stroke-width="1.5" rx="4"/>
  <text x="270" y="69" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a56db">持続可能な企業活動</text>

  <!-- Pillar: 環境 -->
  <rect x="50" y="100" width="140" height="170" fill="#e6f4e6" stroke="#2f7a2f" stroke-width="1.5" rx="4"/>
  <text x="120" y="125" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f7a2f">環境</text>
  <text x="120" y="143" text-anchor="middle" font-size="11" fill="#666666">Planet</text>
  <line x1="70" y1="155" x2="170" y2="155" stroke="#2f7a2f" stroke-width="0.8"/>
  <text x="120" y="178" text-anchor="middle" font-size="12" fill="#434343">環境負荷の低減</text>
  <text x="120" y="200" text-anchor="middle" font-size="12" fill="#434343">資源の持続的利用</text>
  <text x="120" y="222" text-anchor="middle" font-size="12" fill="#434343">気候変動対応</text>

  <!-- Pillar: 社会 -->
  <rect x="200" y="100" width="140" height="170" fill="#e6ecfa" stroke="#1a56db" stroke-width="1.5" rx="4"/>
  <text x="270" y="125" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a56db">社会</text>
  <text x="270" y="143" text-anchor="middle" font-size="11" fill="#666666">People</text>
  <line x1="220" y1="155" x2="320" y2="155" stroke="#1a56db" stroke-width="0.8"/>
  <text x="270" y="178" text-anchor="middle" font-size="12" fill="#434343">人権尊重</text>
  <text x="270" y="200" text-anchor="middle" font-size="12" fill="#434343">労働環境の改善</text>
  <text x="270" y="222" text-anchor="middle" font-size="12" fill="#434343">地域貢献</text>

  <!-- Pillar: 経済 -->
  <rect x="350" y="100" width="140" height="170" fill="#fdf0e4" stroke="#cc6600" stroke-width="1.5" rx="4"/>
  <text x="420" y="125" text-anchor="middle" font-size="15" font-weight="bold" fill="#cc6600">経済</text>
  <text x="420" y="143" text-anchor="middle" font-size="11" fill="#666666">Profit</text>
  <line x1="370" y1="155" x2="470" y2="155" stroke="#cc6600" stroke-width="0.8"/>
  <text x="420" y="178" text-anchor="middle" font-size="12" fill="#434343">適正な利益確保</text>
  <text x="420" y="200" text-anchor="middle" font-size="12" fill="#434343">公正な取引</text>
  <text x="420" y="222" text-anchor="middle" font-size="12" fill="#434343">長期的な価値創造</text>

  <!-- Base: Governance -->
  <rect x="40" y="285" width="460" height="55" fill="#333333" rx="4"/>
  <text x="270" y="310" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">ガバナンス（Governance）</text>
  <text x="270" y="330" text-anchor="middle" font-size="11" fill="#dddddd">コンプライアンス・情報開示・透明性の確保</text>
</svg>
