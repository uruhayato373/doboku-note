<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" style="max-width:600px;width:100%" role="img" aria-label="CSR から CSV への発展を示す図：CSR では本業と社会貢献が分離していたが、CSV では両者が統合される" font-family='Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif'>
  <rect width="600" height="300" fill="#ffffff"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">CSR から CSV への発展</text>

  <!-- Left side: CSR -->
  <text x="140" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#555">CSR</text>
  <text x="140" y="78" text-anchor="middle" font-size="11" fill="#8a8a8a">本業とは別のコスト</text>

  <!-- CSR: 本業 box -->
  <rect x="50" y="95" width="180" height="70" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5" rx="4"/>
  <text x="140" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6da4">本業</text>
  <text x="140" y="147" text-anchor="middle" font-size="11" fill="#555">利益追求</text>

  <!-- CSR: 社会貢献 box (separated) -->
  <rect x="50" y="185" width="180" height="70" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4 3" rx="4"/>
  <text x="140" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">社会貢献</text>
  <text x="140" y="237" text-anchor="middle" font-size="11" fill="#555">寄付・ボランティア</text>

  <!-- Arrow -->
  <g stroke="#2e6da4" stroke-width="2" fill="#2e6da4">
    <line x1="260" y1="175" x2="335" y2="175"/>
    <polygon points="330,168 345,175 330,182"/>
  </g>
  <text x="302" y="160" text-anchor="middle" font-size="11" fill="#2e6da4" font-weight="bold">統合</text>
  <text x="302" y="197" text-anchor="middle" font-size="10" fill="#555">ポーター（2011）</text>

  <!-- Right side: CSV -->
  <text x="475" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a7d44">CSV</text>
  <text x="475" y="78" text-anchor="middle" font-size="11" fill="#8a8a8a">本業そのものに組み込む</text>

  <!-- CSV: Integrated box -->
  <rect x="370" y="95" width="210" height="160" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5" rx="4"/>
  <text x="475" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a7d44">本業 × 社会課題解決</text>
  <line x1="395" y1="145" x2="555" y2="145" stroke="#3a7d44" stroke-width="0.8"/>
  <text x="475" y="170" text-anchor="middle" font-size="12" fill="#555">経済的価値と</text>
  <text x="475" y="192" text-anchor="middle" font-size="12" fill="#555">社会的価値を</text>
  <text x="475" y="214" text-anchor="middle" font-size="12" fill="#555">同時に創出する</text>
  <text x="475" y="240" text-anchor="middle" font-size="11" fill="#3a7d44" font-weight="bold">Win-Win</text>
</svg>
