<svg viewBox="0 0 440 490" xmlns="http://www.w3.org/2000/svg" style="max-width:440px;width:100%" role="img" aria-label="ナレッジマネジメント：形式知と暗黙知の対比、活用基盤としてデータウェアハウス・BIツール・集合知の3要素を図示">
  <!-- viewBox 440px: 2カラム比較レイアウトで各カラム190px+余白が必要なため500以内で例外適用 -->
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-title  { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-col    { font-size: 14px; font-weight: bold; }
      .t-label  { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-body   { font-size: 13px; fill: #555; }
      .t-foot   { font-size: 11px; fill: #8a8a8a; }
      .t-sec    { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-note   { font-size: 11px; fill: #555; }
      /* brand: 形式知 */
      .col-brand-bg  { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .col-brand-hd  { fill: #2e6da4; }
      /* warn: 暗黙知 */
      .col-warn-bg   { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .col-warn-hd   { fill: #d4a017; }
      /* positive: 活用基盤 */
      .col-pos-bg    { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .col-pos-hd    { fill: #3a7d44; }
      .box-pos       { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.2; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#8a8a8a"/>
    </marker>
    <marker id="arr-down" markerWidth="8" markerHeight="7" refX="4" refY="7" orient="auto">
      <polygon points="0,0 8,0 4,7" fill="#3a7d44"/>
    </marker>
  </defs>

  <!-- ===== タイトル ===== -->
  <text class="t-title" x="220" y="26" text-anchor="middle">ナレッジマネジメント</text>
  <text class="t-foot" x="220" y="44" text-anchor="middle">組織内の知識を体系的に整理・活用する取り組み</text>

  <!-- ===== 2カラムヘッダ ===== -->
  <!-- 形式知ヘッダ（brand 淡色背景＋濃色文字） -->
  <rect class="col-brand-bg" x="20" y="56" width="190" height="34" rx="6"/>
  <text font-size="15" font-weight="bold" fill="#1a3a5c" x="115" y="79" text-anchor="middle">形式知</text>

  <!-- 暗黙知ヘッダ（warn 淡色背景＋濃色文字） -->
  <rect class="col-warn-bg" x="230" y="56" width="190" height="34" rx="6"/>
  <text font-size="15" font-weight="bold" fill="#1a3a5c" x="325" y="79" text-anchor="middle">暗黙知</text>

  <!-- ===== 形式知 本体 ===== -->
  <rect class="col-brand-bg" x="20" y="94" width="190" height="178" rx="6"/>

  <!-- アイコン行 -->
  <text font-size="22" x="115" y="130" text-anchor="middle">&#128196;</text>

  <text class="t-label" x="115" y="152" text-anchor="middle">文章・図表で表現可能</text>

  <!-- 特徴 -->
  <text class="t-body" x="36" y="176">・マニュアル・報告書</text>
  <text class="t-body" x="36" y="198">・データ・数値記録</text>
  <text class="t-body" x="36" y="220">・設計図・仕様書等</text>

  <text class="t-note" x="115" y="254" text-anchor="middle">他者と共有しやすい</text>

  <!-- ===== 暗黙知 本体 ===== -->
  <rect class="col-warn-bg" x="230" y="94" width="190" height="178" rx="6"/>

  <!-- アイコン行 -->
  <text font-size="22" x="325" y="130" text-anchor="middle">&#128161;</text>

  <text class="t-label" x="325" y="152" text-anchor="middle">言語化・形式化が困難</text>

  <!-- 特徴 -->
  <text class="t-body" x="246" y="176">・個人のひらめき</text>
  <text class="t-body" x="246" y="198">・経験・勘・技能</text>
  <text class="t-body" x="246" y="220">・人脈・信頼関係等</text>

  <text class="t-note" x="325" y="254" text-anchor="middle">個人に帰属しやすい</text>

  <!-- ===== 中央の双方向矢印（相互変換） ===== -->
  <text class="t-foot" x="220" y="288" text-anchor="middle">&#8596; 相互変換・共有</text>

  <!-- ===== 区切り線 ===== -->
  <line x1="20" y1="300" x2="420" y2="300" stroke="#d7d7d7" stroke-width="1.2"/>

  <!-- ===== 活用基盤セクション ===== -->
  <text class="t-sec" x="220" y="320" text-anchor="middle">活用基盤</text>

  <!-- 下向き矢印 -->
  <line x1="220" y1="290" x2="220" y2="302" stroke="#3a7d44" stroke-width="0"/>

  <!-- 活用基盤3ボックス -->
  <!-- データウェアハウス -->
  <rect class="box-pos" x="20" y="330" width="120" height="70" rx="6"/>
  <text class="t-label" x="80" y="352" text-anchor="middle">データ</text>
  <text class="t-label" x="80" y="368" text-anchor="middle">ウェアハウス</text>
  <text class="t-note" x="80" y="388" text-anchor="middle">時系列で大量保管</text>

  <!-- BIツール -->
  <rect class="box-pos" x="160" y="330" width="120" height="70" rx="6"/>
  <text class="t-label" x="220" y="355" text-anchor="middle">BI ツール</text>
  <text class="t-note" x="220" y="375" text-anchor="middle">データ可視化</text>
  <text class="t-note" x="220" y="391" text-anchor="middle">・意思決定支援</text>

  <!-- 集合知 -->
  <rect class="box-pos" x="300" y="330" width="120" height="70" rx="6"/>
  <text class="t-label" x="360" y="355" text-anchor="middle">集合知</text>
  <text class="t-note" x="360" y="375" text-anchor="middle">多くの人の知識を</text>
  <text class="t-note" x="360" y="391" text-anchor="middle">体系化・蓄積</text>

  <!-- ===== 有効機能5要件 ===== -->
  <line x1="20" y1="418" x2="420" y2="418" stroke="#d7d7d7" stroke-width="1.2"/>
  <text class="t-sec" x="220" y="437" text-anchor="middle">有効に機能させる要件（抜粋）</text>

  <text class="t-body" x="30" y="456">1. 責任者の深い関与</text>
  <text class="t-body" x="240" y="456">2. 専任担当者・推進チーム設置</text>
  <text class="t-body" x="30" y="474">3. 参加促進の人事制度連動</text>
  <text class="t-body" x="240" y="474">4. システムの使いやすさ向上</text>

</svg>
