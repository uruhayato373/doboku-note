  <svg width="400" height="500" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" style="max-width:400px;width:100%" role="img" aria-label="5Sと品質・安全・納期の関連図">
    <!-- 外側方向ラベル -->
    <text x="200" y="22" text-anchor="middle" fill="#222" font-weight="bold" font-size="13">品質向上</text>
    <text x="200" y="394" text-anchor="middle" fill="#222" font-weight="bold" font-size="13">安全性向上</text>
    <text x="16" y="213" text-anchor="middle" fill="#222" font-weight="bold" font-size="13" transform="rotate(-90,16,213)">多品種化</text>
    <text x="384" y="213" text-anchor="middle" fill="#222" font-weight="bold" font-size="13" transform="rotate(90,384,213)">納期厳守</text>
    <!-- 外大円 -->
    <circle cx="200" cy="210" r="178" fill="none" stroke="#d7d7d7" stroke-width="1.5"/>
    <!-- セクター分割ライン（5分割） -->
    <line x1="200" y1="210" x2="200" y2="32" stroke="#d7d7d7" stroke-width="1.2"/>
    <line x1="200" y1="210" x2="357" y2="303" stroke="#d7d7d7" stroke-width="1.2"/>
    <line x1="200" y1="210" x2="299" y2="372" stroke="#d7d7d7" stroke-width="1.2"/>
    <line x1="200" y1="210" x2="101" y2="372" stroke="#d7d7d7" stroke-width="1.2"/>
    <line x1="200" y1="210" x2="43" y2="303" stroke="#d7d7d7" stroke-width="1.2"/>
    <!-- 各5Sラベル（扇の中央付近） -->
    <text x="200" y="115" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">整理</text>
    <text x="308" y="178" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">整頓</text>
    <text x="283" y="318" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">清掃</text>
    <text x="117" y="318" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">清潔</text>
    <text x="92" y="178" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">躾</text>
    <!-- 各説明文（小さく） -->
    <text x="200" y="134" text-anchor="middle" fill="#555" font-size="9">必要・不要を区別し</text>
    <text x="200" y="145" text-anchor="middle" fill="#555" font-size="9">不要なものを除くこと</text>
    <text x="306" y="196" text-anchor="middle" fill="#555" font-size="9">決められた場所に</text>
    <text x="306" y="207" text-anchor="middle" fill="#555" font-size="9">置くこと</text>
    <text x="279" y="336" text-anchor="middle" fill="#555" font-size="9">常に清潔にして</text>
    <text x="279" y="347" text-anchor="middle" fill="#555" font-size="9">わかる状態を保つ</text>
    <text x="121" y="336" text-anchor="middle" fill="#555" font-size="9">整理・整頓・清掃の</text>
    <text x="121" y="347" text-anchor="middle" fill="#555" font-size="9">3Sを維持すること</text>
    <text x="94" y="196" text-anchor="middle" fill="#555" font-size="9">決められたことを</text>
    <text x="94" y="207" text-anchor="middle" fill="#555" font-size="9">守る習慣をつける</text>
    <!-- 内円 -->
    <circle cx="200" cy="210" r="60" fill="#222" stroke="#222" stroke-width="2"/>
    <text x="200" y="205" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">5S</text>
    <text x="200" y="225" text-anchor="middle" fill="#d7d7d7" font-size="12">継続</text>
    <!-- 下部サマリー -->
    <text x="200" y="424" text-anchor="middle" fill="#1a3a5c" font-size="12" font-weight="bold">5Sは品質・安全・生産性向上の基盤</text>
    <text x="200" y="444" text-anchor="middle" fill="#555" font-size="11">「継続」が5Sを習慣化し現場改善文化を醸成する</text>
    <text x="200" y="465" text-anchor="middle" fill="#555" font-size="11">全管理要素が5Sの実践により相互に強化される</text>
    <text x="200" y="486" text-anchor="middle" fill="#3a7d44" font-size="11" font-weight="bold">ISO 9001 / OHSAS 18001 の前提的取組</text>
  </svg>