<svg viewBox="0 0 400 584" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="情報公開法の不開示情報6類型。個人情報・法人情報・国家安全情報・公共安全情報・審議検討等情報・事務事業情報を縦に並べた図">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-sub   { font-size: 12px; fill: #555; }
      .t-main  { font-size: 14px; font-weight: bold; fill: #1a3a5c; }
      .t-def   { font-size: 12px; fill: #555; }
      .t-num   { font-size: 13px; font-weight: bold; fill: #2e6da4; }
      .t-foot  { font-size: 11px; fill: #8a8a8a; }
      /* brand: 淡色背景＋濃色文字 */
      .box-base  { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .badge-brand { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- title -->
  <text class="t-title" x="200" y="26" text-anchor="middle">不開示情報の6類型</text>
  <text class="t-sub" x="200" y="46" text-anchor="middle">行政機関情報公開法 第5条（各号）</text>

  <!-- 1 個人情報 -->
  <!-- surface背景＋brandバッジ -->
  <rect class="box-base" x="44" y="58" width="338" height="68" rx="8"/>
  <circle class="badge-brand" cx="72" cy="92" r="16"/>
  <text class="t-num" x="72" y="97" text-anchor="middle">1</text>
  <text class="t-main" x="98" y="84">個人情報</text>
  <text class="t-def" x="98" y="104">特定の個人を識別できる情報</text>

  <!-- 2 法人情報 -->
  <rect class="box-base" x="44" y="140" width="338" height="68" rx="8"/>
  <circle class="badge-brand" cx="72" cy="174" r="16"/>
  <text class="t-num" x="72" y="179" text-anchor="middle">2</text>
  <text class="t-main" x="98" y="166">法人情報</text>
  <text class="t-def" x="98" y="186">法人の正当な利益を害する情報</text>

  <!-- 3 国家安全情報 -->
  <rect class="box-base" x="44" y="222" width="338" height="68" rx="8"/>
  <circle class="badge-brand" cx="72" cy="256" r="16"/>
  <text class="t-num" x="72" y="261" text-anchor="middle">3</text>
  <text class="t-main" x="98" y="248">国家安全情報</text>
  <text class="t-def" x="98" y="268">国の安全・諸外国との信頼関係を害する情報</text>

  <!-- 4 公共安全情報 -->
  <rect class="box-base" x="44" y="304" width="338" height="68" rx="8"/>
  <circle class="badge-brand" cx="72" cy="338" r="16"/>
  <text class="t-num" x="72" y="343" text-anchor="middle">4</text>
  <text class="t-main" x="98" y="330">公共安全情報</text>
  <text class="t-def" x="98" y="350">公共の安全・秩序維持に支障を及ぼす情報</text>

  <!-- 5 審議検討等情報 -->
  <rect class="box-base" x="44" y="386" width="338" height="82" rx="8"/>
  <circle class="badge-brand" cx="72" cy="427" r="16"/>
  <text class="t-num" x="72" y="432" text-anchor="middle">5</text>
  <text class="t-main" x="98" y="412">審議検討等情報</text>
  <text class="t-def" x="98" y="432">意思決定の中立性等を不当に害し、</text>
  <text class="t-def" x="98" y="450">国民に混乱を生じさせるおそれのある情報</text>

  <!-- 6 事務事業情報 -->
  <rect class="box-base" x="44" y="482" width="338" height="68" rx="8"/>
  <circle class="badge-brand" cx="72" cy="516" r="16"/>
  <text class="t-num" x="72" y="521" text-anchor="middle">6</text>
  <text class="t-main" x="98" y="508">事務事業情報</text>
  <text class="t-def" x="98" y="528">事務・事業の適正な遂行に支障を及ぼす情報</text>

  <!-- footer -->
  <text class="t-foot" x="200" y="572" text-anchor="middle">開示請求権は第3条に規定</text>
</svg>
