<svg width="700" height="220" viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="11" style="max-width:700px;width:100%">
  <!-- Stage labels -->
  <text x="80" y="18" text-anchor="middle" font-weight="bold">第一段階</text>
  <text x="230" y="18" text-anchor="middle" font-weight="bold">第二段階</text>
  <text x="400" y="18" text-anchor="middle" font-weight="bold">第三段階</text>
  <text x="580" y="18" text-anchor="middle" font-weight="bold">第四段階</text>
  <text x="630" y="18" text-anchor="middle" font-weight="bold">文象化</text>

  <!-- Stage 1: Random cards -->
  <rect x="20" y="30" width="120" height="160" fill="#f0f0f0" stroke="#999" rx="4"/>
  <rect x="30" y="40" width="35" height="22" fill="white" stroke="#666"/>
  <rect x="72" y="40" width="35" height="22" fill="white" stroke="#666"/>
  <rect x="30" y="70" width="35" height="22" fill="white" stroke="#666"/>
  <rect x="72" y="70" width="35" height="22" fill="white" stroke="#666"/>
  <rect x="30" y="100" width="35" height="22" fill="white" stroke="#666"/>
  <rect x="72" y="100" width="35" height="22" fill="white" stroke="#666"/>
  <rect x="30" y="130" width="35" height="22" fill="white" stroke="#666"/>
  <rect x="72" y="130" width="35" height="22" fill="white" stroke="#666"/>

  <!-- Arrow -->
  <line x1="150" y1="110" x2="165" y2="110" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Stage 2: Grouped cards -->
  <rect x="170" y="30" width="120" height="160" fill="#f0f0f0" stroke="#999" rx="4"/>
  <!-- Group 1 -->
  <rect x="178" y="38" width="48" height="48" fill="#d4e8ff" stroke="#4488cc" rx="3"/>
  <rect x="182" y="42" width="18" height="12" fill="white" stroke="#888"/>
  <rect x="204" y="42" width="18" height="12" fill="white" stroke="#888"/>
  <rect x="182" y="58" width="18" height="12" fill="white" stroke="#888"/>
  <rect x="204" y="58" width="18" height="12" fill="white" stroke="#888"/>
  <!-- Group 2 -->
  <rect x="230" y="38" width="48" height="48" fill="#d4ffd4" stroke="#44aa44" rx="3"/>
  <rect x="234" y="42" width="18" height="12" fill="white" stroke="#888"/>
  <rect x="256" y="42" width="18" height="12" fill="white" stroke="#888"/>
  <rect x="234" y="58" width="18" height="12" fill="white" stroke="#888"/>
  <!-- Group 3 -->
  <rect x="178" y="92" width="100" height="48" fill="#ffd4d4" stroke="#cc4444" rx="3"/>
  <rect x="182" y="96" width="18" height="12" fill="white" stroke="#888"/>
  <rect x="204" y="96" width="18" height="12" fill="white" stroke="#888"/>
  <rect x="226" y="96" width="18" height="12" fill="white" stroke="#888"/>
  <rect x="248" y="96" width="18" height="12" fill="white" stroke="#888"/>
  <rect x="182" y="112" width="18" height="12" fill="white" stroke="#888"/>
  <!-- Group 4 -->
  <rect x="178" y="148" width="48" height="35" fill="#fff0c0" stroke="#ccaa00" rx="3"/>
  <rect x="182" y="152" width="18" height="12" fill="white" stroke="#888"/>
  <rect x="204" y="152" width="18" height="12" fill="white" stroke="#888"/>

  <!-- Arrow -->
  <line x1="298" y1="110" x2="315" y2="110" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Stage 3: Labeled groups with relations -->
  <rect x="320" y="30" width="140" height="160" fill="#f0f0f0" stroke="#999" rx="4"/>
  <rect x="330" y="40" width="55" height="35" fill="#d4e8ff" stroke="#4488cc" rx="3"/>
  <text x="357" y="62" text-anchor="middle" font-size="10">グループA</text>
  <rect x="395" y="40" width="55" height="35" fill="#d4ffd4" stroke="#44aa44" rx="3"/>
  <text x="422" y="62" text-anchor="middle" font-size="10">グループB</text>
  <rect x="330" y="95" width="120" height="35" fill="#ffd4d4" stroke="#cc4444" rx="3"/>
  <text x="390" y="117" text-anchor="middle" font-size="10">グループC</text>
  <rect x="330" y="145" width="55" height="35" fill="#fff0c0" stroke="#ccaa00" rx="3"/>
  <text x="357" y="167" text-anchor="middle" font-size="10">グループD</text>
  <!-- Relations arrows -->
  <line x1="385" y1="75" x2="385" y2="95" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="360" y1="130" x2="360" y2="145" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Arrow -->
  <line x1="468" y1="110" x2="483" y2="110" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Stage 4: Final structure (文象化) -->
  <rect x="488" y="30" width="190" height="160" fill="#f0f0f0" stroke="#999" rx="4"/>
  <rect x="498" y="42" width="80" height="50" fill="#d4e8ff" stroke="#4488cc" rx="4"/>
  <text x="538" y="72" text-anchor="middle" font-size="10">グループA</text>
  <rect x="590" y="42" width="80" height="50" fill="#d4ffd4" stroke="#44aa44" rx="4"/>
  <text x="630" y="72" text-anchor="middle" font-size="10">グループB</text>
  <rect x="498" y="110" width="172" height="50" fill="#ffd4d4" stroke="#cc4444" rx="4"/>
  <text x="584" y="140" text-anchor="middle" font-size="10">グループC（統合テーマ）</text>
  <line x1="538" y1="92" x2="538" y2="110" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="630" y1="92" x2="630" y2="110" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#333"/>
    </marker>
  </defs>
</svg>