<svg width="580" height="270" viewBox="0 0 580 270" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="11" style="max-width:580px;width:100%" role="img" aria-label="BPT分布による地震発生確率（活動時期が不明な場合）">
  <defs>
    <marker id="arq2" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#222"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="290" y="18" text-anchor="middle" font-weight="bold" font-size="12">活動時期が明らかな場合の今後30年に地震が発生する確率</text>

  <!-- Axes -->
  <line x1="60" y1="220" x2="540" y2="220" stroke="#222" stroke-width="1.5" marker-end="url(#arq2)"/>
  <line x1="60" y1="220" x2="60" y2="30" stroke="#222" stroke-width="1.5" marker-end="url(#arq2)"/>

  <!-- Y-axis: probability 0-10% -->
  <text x="45" y="215" text-anchor="end" font-size="10">0</text>
  <text x="45" y="193" text-anchor="end" font-size="10">1</text>
  <text x="45" y="172" text-anchor="end" font-size="10">2</text>
  <text x="45" y="150" text-anchor="end" font-size="10">3</text>
  <text x="45" y="128" text-anchor="end" font-size="10">4</text>
  <text x="45" y="107" text-anchor="end" font-size="10">5</text>
  <text x="45" y="85"  text-anchor="end" font-size="10">6</text>
  <text x="45" y="63"  text-anchor="end" font-size="10">7</text>
  <text x="45" y="42"  text-anchor="end" font-size="10">8</text>
  <text x="14" y="130" font-size="9" transform="rotate(-90,14,130)" text-anchor="middle">今後30年以内に地震が発生する確率（%）</text>

  <!-- X-axis labels -->
  <text x="60"  y="235" text-anchor="middle" font-size="10">1000</text>
  <text x="155" y="235" text-anchor="middle" font-size="10">2000</text>
  <text x="250" y="235" text-anchor="middle" font-size="10">2500</text>
  <text x="325" y="235" text-anchor="middle" font-size="10">3000</text>
  <text x="420" y="235" text-anchor="middle" font-size="10">4000</text>
  <text x="510" y="235" text-anchor="middle" font-size="10">5000</text>
  <text x="290" y="250" text-anchor="middle" font-size="11">最新活動からの経過時間（年）</text>

  <!-- Probability curve: rises sharply around 2000-2500, peaks near 2500-3000, then falls -->
  <path d="M 60,214 C 80,213 100,212 120,210 150,207 180,200 210,185 230,165 250,130 265,100 280,72 295,55 310,50 320,52 335,65 350,88 370,120 390,150 410,170 440,188 470,200 500,208 530,212" fill="none" stroke="#2e6da4" stroke-width="2.5"/>

  <!-- 2.20% annotation -->
  <line x1="298" y1="30" x2="298" y2="220" stroke="#b22234" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="310" y="60" font-size="10" fill="#b22234">2.20%</text>
  <text x="240" y="235" text-anchor="middle" font-size="10" fill="#b22234">↑現在（2530年）</text>
</svg>