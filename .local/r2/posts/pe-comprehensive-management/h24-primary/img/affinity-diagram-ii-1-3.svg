<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="11">
  <!-- Group 1 -->
  <rect x="20" y="20" width="130" height="120" fill="#d4e8ff" stroke="#4488cc" stroke-width="2" rx="6"/>
  <text x="85" y="40" text-anchor="middle" font-weight="bold">グループ1</text>
  <rect x="30" y="50" width="50" height="25" fill="white" stroke="#888" rx="2"/>
  <text x="55" y="67" text-anchor="middle" font-size="10">カードA</text>
  <rect x="90" y="50" width="50" height="25" fill="white" stroke="#888" rx="2"/>
  <text x="115" y="67" text-anchor="middle" font-size="10">カードB</text>
  <rect x="30" y="85" width="50" height="25" fill="white" stroke="#888" rx="2"/>
  <text x="55" y="102" text-anchor="middle" font-size="10">カードC</text>
  <rect x="90" y="85" width="50" height="25" fill="white" stroke="#888" rx="2"/>
  <text x="115" y="102" text-anchor="middle" font-size="10">カードD</text>
  <rect x="55" y="120" width="50" height="12" fill="#4488cc" rx="2"/>
  <text x="80" y="130" text-anchor="middle" font-size="9" fill="white">見出しカード</text>

  <!-- Group 2 -->
  <rect x="170" y="20" width="130" height="120" fill="#d4ffd4" stroke="#44aa44" stroke-width="2" rx="6"/>
  <text x="235" y="40" text-anchor="middle" font-weight="bold">グループ2</text>
  <rect x="180" y="50" width="50" height="25" fill="white" stroke="#888" rx="2"/>
  <text x="205" y="67" text-anchor="middle" font-size="10">カードE</text>
  <rect x="240" y="50" width="50" height="25" fill="white" stroke="#888" rx="2"/>
  <text x="265" y="67" text-anchor="middle" font-size="10">カードF</text>
  <rect x="180" y="85" width="50" height="25" fill="white" stroke="#888" rx="2"/>
  <text x="205" y="102" text-anchor="middle" font-size="10">カードG</text>
  <rect x="205" y="120" width="50" height="12" fill="#44aa44" rx="2"/>
  <text x="230" y="130" text-anchor="middle" font-size="9" fill="white">見出しカード</text>

  <!-- Group 3 -->
  <rect x="320" y="20" width="140" height="120" fill="#ffd4d4" stroke="#cc4444" stroke-width="2" rx="6"/>
  <text x="390" y="40" text-anchor="middle" font-weight="bold">グループ3</text>
  <rect x="330" y="50" width="50" height="25" fill="white" stroke="#888" rx="2"/>
  <text x="355" y="67" text-anchor="middle" font-size="10">カードH</text>
  <rect x="390" y="50" width="55" height="25" fill="white" stroke="#888" rx="2"/>
  <text x="417" y="67" text-anchor="middle" font-size="10">カードI</text>
  <rect x="330" y="85" width="50" height="25" fill="white" stroke="#888" rx="2"/>
  <text x="355" y="102" text-anchor="middle" font-size="10">カードJ</text>
  <rect x="390" y="85" width="55" height="25" fill="white" stroke="#888" rx="2"/>
  <text x="417" y="102" text-anchor="middle" font-size="10">カードK</text>
  <rect x="355" y="120" width="50" height="12" fill="#cc4444" rx="2"/>
  <text x="380" y="130" text-anchor="middle" font-size="9" fill="white">見出しカード</text>

  <!-- Integrated group at bottom -->
  <rect x="100" y="180" width="280" height="100" fill="#fff0c0" stroke="#ccaa00" stroke-width="2" rx="6"/>
  <text x="240" y="200" text-anchor="middle" font-weight="bold">統合グループ（テーマ）</text>
  <rect x="115" y="210" width="60" height="25" fill="#d4e8ff" stroke="#4488cc" rx="3"/>
  <text x="145" y="227" text-anchor="middle" font-size="10">グループ1</text>
  <rect x="205" y="210" width="60" height="25" fill="#d4ffd4" stroke="#44aa44" rx="3"/>
  <text x="235" y="227" text-anchor="middle" font-size="10">グループ2</text>
  <rect x="295" y="210" width="60" height="25" fill="#ffd4d4" stroke="#cc4444" rx="3"/>
  <text x="325" y="227" text-anchor="middle" font-size="10">グループ3</text>
  <rect x="185" y="250" width="110" height="20" fill="#ccaa00" rx="3"/>
  <text x="240" y="264" text-anchor="middle" font-size="10" fill="white">まとめカード</text>

  <!-- Arrows from groups to integrated -->
  <defs>
    <marker id="arr4" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#666"/>
    </marker>
  </defs>
  <line x1="85" y1="140" x2="160" y2="180" stroke="#666" stroke-width="1.5" marker-end="url(#arr4)"/>
  <line x1="235" y1="140" x2="240" y2="180" stroke="#666" stroke-width="1.5" marker-end="url(#arr4)"/>
  <line x1="385" y1="140" x2="320" y2="180" stroke="#666" stroke-width="1.5" marker-end="url(#arr4)"/>
</svg>