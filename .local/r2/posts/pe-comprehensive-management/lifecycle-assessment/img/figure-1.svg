<svg viewBox="0 0 400 480" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;width:100%" role="img" aria-label="LCAの4プロセスと反復構造。目的及び調査範囲の設定・インベントリ分析・影響評価の3段を解釈が横断し、製品改善・戦略立案・政策立案・マーケ等の直接の用途へつながる図">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-title { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-sub   { font-size: 11px; fill: #555; }
      .t-main  { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-warn  { font-size: 13px; font-weight: bold; fill: #7a5a00; }
      .t-use   { font-size: 12px; fill: #555; }
      .t-note  { font-size: 11px; fill: #8a8a8a; }
      .box-brand   { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-warn    { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-surface { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.2; }
      .badge-brand { fill: #fff; stroke: #2e6da4; stroke-width: 1.5; }
    </style>
    <!-- downward arrow (brand blue) -->
    <marker id="ad" markerWidth="8" markerHeight="6" refX="4" refY="6" orient="auto">
      <polygon points="0,0 8,0 4,6" fill="#2e6da4"/>
    </marker>
    <!-- upward arrow (brand blue) -->
    <marker id="au" markerWidth="8" markerHeight="6" refX="4" refY="0" orient="auto">
      <polygon points="0,6 8,6 4,0" fill="#2e6da4"/>
    </marker>
    <!-- rightward arrow (warn yellow) -->
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#d4a017"/>
    </marker>
    <!-- leftward arrow (warn yellow) -->
    <marker id="al" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <polygon points="8,0 0,3 8,6" fill="#d4a017"/>
    </marker>
    <!-- rightward arrow (gray, for 用途) -->
    <marker id="ag" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#8a8a8a"/>
    </marker>
  </defs>

  <!-- title -->
  <text class="t-title" x="200" y="24" text-anchor="middle">LCAの4プロセスと反復構造</text>
  <text class="t-sub"   x="200" y="40" text-anchor="middle">ISO 14040 に基づく枠組み</text>

  <!-- ============ LEFT COLUMN: 本流3段 ============ -->
  <!-- box width=174, x=14. Badge cx=35 r=12. Text from x=52 -->

  <!-- ① 目的及び調査範囲の設定 (2 lines, height=66) -->
  <rect class="box-brand" x="14" y="56" width="174" height="66" rx="7"/>
  <circle class="badge-brand" cx="35" cy="82" r="12"/>
  <text class="t-main" x="35" y="87" text-anchor="middle">①</text>
  <text class="t-main" x="54" y="78">目的及び</text>
  <text class="t-main" x="54" y="96">調査範囲の設定</text>

  <!-- ↕ ①⇄② -->
  <line x1="92" y1="122" x2="92" y2="148" stroke="#2e6da4" stroke-width="2" marker-end="url(#ad)"/>
  <line x1="104" y1="148" x2="104" y2="122" stroke="#2e6da4" stroke-width="2" marker-end="url(#au)"/>

  <!-- ② インベントリ分析 (1 line + sub, height=66) -->
  <rect class="box-brand" x="14" y="150" width="174" height="66" rx="7"/>
  <circle class="badge-brand" cx="35" cy="176" r="12"/>
  <text class="t-main" x="35" y="181" text-anchor="middle">②</text>
  <text class="t-main" x="54" y="178">インベントリ分析</text>
  <text class="t-note" x="54" y="196">資源投入量・排出量を定量化</text>

  <!-- ↕ ②⇄③ -->
  <line x1="92" y1="216" x2="92" y2="242" stroke="#2e6da4" stroke-width="2" marker-end="url(#ad)"/>
  <line x1="104" y1="242" x2="104" y2="216" stroke="#2e6da4" stroke-width="2" marker-end="url(#au)"/>

  <!-- ③ 影響評価 (1 line + sub, height=66) -->
  <rect class="box-brand" x="14" y="244" width="174" height="66" rx="7"/>
  <circle class="badge-brand" cx="35" cy="270" r="12"/>
  <text class="t-main" x="35" y="275" text-anchor="middle">③</text>
  <text class="t-main" x="54" y="272">影響評価</text>
  <text class="t-note" x="54" y="290">分類化→特性化→重み付け</text>

  <!-- ============ CENTER: ④ 解釈 (warn, tall) ============ -->
  <!-- x=200, width=68, covering y=56 to y=310 → height=254 -->
  <rect class="box-warn" x="200" y="56" width="68" height="254" rx="7"/>
  <text class="t-warn" x="234" y="148" text-anchor="middle">④</text>
  <text class="t-warn" x="234" y="172" text-anchor="middle">解</text>
  <text class="t-warn" x="234" y="196" text-anchor="middle">釈</text>
  <text class="t-note" x="234" y="222" text-anchor="middle">結果の</text>
  <text class="t-note" x="234" y="238" text-anchor="middle">解釈</text>

  <!-- bidirectional arrows: 本流↔解釈 -->
  <!-- ①↔解釈 at y≈82/92 -->
  <line x1="188" y1="82" x2="200" y2="82" stroke="#d4a017" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="200" y1="92" x2="188" y2="92" stroke="#d4a017" stroke-width="1.8" marker-end="url(#al)"/>
  <!-- ②↔解釈 at y≈176/186 -->
  <line x1="188" y1="176" x2="200" y2="176" stroke="#d4a017" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="200" y1="186" x2="188" y2="186" stroke="#d4a017" stroke-width="1.8" marker-end="url(#al)"/>
  <!-- ③↔解釈 at y≈270/280 -->
  <line x1="188" y1="270" x2="200" y2="270" stroke="#d4a017" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="200" y1="280" x2="188" y2="280" stroke="#d4a017" stroke-width="1.8" marker-end="url(#al)"/>

  <!-- ============ RIGHT COLUMN: 直接の用途 ============ -->
  <!-- arrow from 解釈 → 用途 -->
  <line x1="268" y1="183" x2="280" y2="183" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#ag)"/>

  <rect class="box-surface" x="280" y="56" width="108" height="254" rx="7"/>
  <text class="t-note" x="334" y="82" text-anchor="middle">直接の用途</text>
  <line x1="290" y1="90" x2="378" y2="90" stroke="#d7d7d7" stroke-width="1"/>

  <text class="t-use" x="334" y="116" text-anchor="middle">製品開発・改善</text>
  <line x1="290" y1="128" x2="378" y2="128" stroke="#d7d7d7" stroke-width="1"/>
  <text class="t-use" x="334" y="154" text-anchor="middle">戦略立案</text>
  <line x1="290" y1="166" x2="378" y2="166" stroke="#d7d7d7" stroke-width="1"/>
  <text class="t-use" x="334" y="192" text-anchor="middle">政策立案</text>
  <line x1="290" y1="204" x2="378" y2="204" stroke="#d7d7d7" stroke-width="1"/>
  <text class="t-use" x="334" y="230" text-anchor="middle">マーケティング</text>
  <line x1="290" y1="244" x2="378" y2="244" stroke="#d7d7d7" stroke-width="1"/>
  <text class="t-use" x="334" y="270" text-anchor="middle">等</text>

  <!-- ============ BOTTOM: legend + note ============ -->
  <!-- legend -->
  <rect x="14" y="336" width="14" height="12" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.2" rx="2"/>
  <text class="t-note" x="34" y="347">本流3段（ISO 14040）</text>
  <rect x="180" y="336" width="14" height="12" fill="#fff3cd" stroke="#d4a017" stroke-width="1.2" rx="2"/>
  <text class="t-note" x="200" y="347">解釈（全段と双方向）</text>

  <!-- note box -->
  <rect class="box-surface" x="14" y="358" width="374" height="104" rx="7"/>
  <text class="t-note" x="24" y="378">① 目的・調査範囲の設定：分析対象・機能単位・境界を定義</text>
  <text class="t-note" x="24" y="398">② インベントリ分析：積上法 / 産業連関法で投入・排出を集計</text>
  <text class="t-note" x="24" y="418">③ 影響評価：インパクトカテゴリへの分類化・特性化・重み付け</text>
  <text class="t-note" x="24" y="438">④ 解釈：①②③すべてと反復し、直接の用途へ知見を出力する</text>
  <text class="t-note" x="24" y="456">    クローズドループ / オープンループのリサイクル配分に留意</text>
</svg>
