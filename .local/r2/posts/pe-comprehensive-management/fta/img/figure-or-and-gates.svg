<svg width="400" height="500" viewBox="0 0 400 500"
     xmlns="http://www.w3.org/2000/svg"
     style="max-width:400px;width:100%"
     role="img"
     aria-label="FTA で用いる OR ゲートと AND ゲートの記号と真理値表。OR は X+Y=Z（X か Y のいずれかが 1 なら Z=1）、AND は X·Y=Z（X と Y の両方が 1 のとき Z=1）">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-title { font-size: 14px; font-weight: bold; fill: #1a3a5c; }
      .t-section { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-formula { font-size: 12px; fill: #1a3a5c; }
      .t-label { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-th { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-td { font-size: 12px; fill: #1a3a5c; }
      .gate-line { stroke: #1a3a5c; stroke-width: 1.8; fill: none; }
      .gate-or { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.8; }
      .gate-and { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.8; }
      .tbl { fill: none; stroke: #1a3a5c; stroke-width: 0.8; }
      .tbl-h { fill: #e8f0fe; stroke: #1a3a5c; stroke-width: 0.8; }
    </style>
  </defs>

  <!-- 全体タイトル -->
  <text x="200" y="20" class="t-title" text-anchor="middle">FTA：OR ゲートと AND ゲート</text>

  <!-- ===== OR ゲート ===== -->
  <text x="60" y="50" class="t-section">OR ゲート</text>

  <!-- OR gate symbol（X+Y=Z） -->
  <line x1="20" y1="80" x2="50" y2="80" class="gate-line" />
  <line x1="20" y1="110" x2="50" y2="110" class="gate-line" />
  <path d="M50,65 Q80,95 50,125 Q90,125 110,95 Q90,65 50,65 Z" class="gate-or" />
  <line x1="110" y1="95" x2="140" y2="95" class="gate-line" />
  <text x="14" y="84" class="t-label" text-anchor="end">X</text>
  <text x="14" y="114" class="t-label" text-anchor="end">Y</text>
  <text x="146" y="99" class="t-label">Z</text>
  <text x="80" y="155" class="t-formula" text-anchor="middle">X + Y = Z</text>

  <!-- OR 真理値表（4 行 × 3 列） -->
  <!-- ヘッダー -->
  <rect x="220" y="55" width="40" height="22" class="tbl-h" />
  <rect x="260" y="55" width="40" height="22" class="tbl-h" />
  <rect x="300" y="55" width="40" height="22" class="tbl-h" />
  <text x="240" y="71" class="t-th" text-anchor="middle">X</text>
  <text x="280" y="71" class="t-th" text-anchor="middle">Y</text>
  <text x="320" y="71" class="t-th" text-anchor="middle">Z</text>
  <!-- 行データ -->
  <rect x="220" y="77" width="40" height="22" class="tbl" />
  <rect x="260" y="77" width="40" height="22" class="tbl" />
  <rect x="300" y="77" width="40" height="22" class="tbl" />
  <text x="240" y="93" class="t-td" text-anchor="middle">0</text>
  <text x="280" y="93" class="t-td" text-anchor="middle">0</text>
  <text x="320" y="93" class="t-td" text-anchor="middle">0</text>

  <rect x="220" y="99" width="40" height="22" class="tbl" />
  <rect x="260" y="99" width="40" height="22" class="tbl" />
  <rect x="300" y="99" width="40" height="22" class="tbl" />
  <text x="240" y="115" class="t-td" text-anchor="middle">0</text>
  <text x="280" y="115" class="t-td" text-anchor="middle">1</text>
  <text x="320" y="115" class="t-td" text-anchor="middle">1</text>

  <rect x="220" y="121" width="40" height="22" class="tbl" />
  <rect x="260" y="121" width="40" height="22" class="tbl" />
  <rect x="300" y="121" width="40" height="22" class="tbl" />
  <text x="240" y="137" class="t-td" text-anchor="middle">1</text>
  <text x="280" y="137" class="t-td" text-anchor="middle">0</text>
  <text x="320" y="137" class="t-td" text-anchor="middle">1</text>

  <rect x="220" y="143" width="40" height="22" class="tbl" />
  <rect x="260" y="143" width="40" height="22" class="tbl" />
  <rect x="300" y="143" width="40" height="22" class="tbl" />
  <text x="240" y="159" class="t-td" text-anchor="middle">1</text>
  <text x="280" y="159" class="t-td" text-anchor="middle">1</text>
  <text x="320" y="159" class="t-td" text-anchor="middle">1</text>

  <!-- 区切り線 -->
  <line x1="20" y1="195" x2="380" y2="195" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="3,2" />

  <!-- ===== AND ゲート ===== -->
  <text x="60" y="225" class="t-section">AND ゲート</text>

  <!-- AND gate symbol（X·Y=Z） -->
  <line x1="20" y1="255" x2="50" y2="255" class="gate-line" />
  <line x1="20" y1="285" x2="50" y2="285" class="gate-line" />
  <path d="M50,240 L80,240 Q110,240 110,270 Q110,300 80,300 L50,300 Z" class="gate-and" />
  <line x1="110" y1="270" x2="140" y2="270" class="gate-line" />
  <text x="14" y="259" class="t-label" text-anchor="end">X</text>
  <text x="14" y="289" class="t-label" text-anchor="end">Y</text>
  <text x="146" y="274" class="t-label">Z</text>
  <text x="80" y="330" class="t-formula" text-anchor="middle">X · Y = Z</text>

  <!-- AND 真理値表 -->
  <rect x="220" y="230" width="40" height="22" class="tbl-h" />
  <rect x="260" y="230" width="40" height="22" class="tbl-h" />
  <rect x="300" y="230" width="40" height="22" class="tbl-h" />
  <text x="240" y="246" class="t-th" text-anchor="middle">X</text>
  <text x="280" y="246" class="t-th" text-anchor="middle">Y</text>
  <text x="320" y="246" class="t-th" text-anchor="middle">Z</text>

  <rect x="220" y="252" width="40" height="22" class="tbl" />
  <rect x="260" y="252" width="40" height="22" class="tbl" />
  <rect x="300" y="252" width="40" height="22" class="tbl" />
  <text x="240" y="268" class="t-td" text-anchor="middle">0</text>
  <text x="280" y="268" class="t-td" text-anchor="middle">0</text>
  <text x="320" y="268" class="t-td" text-anchor="middle">0</text>

  <rect x="220" y="274" width="40" height="22" class="tbl" />
  <rect x="260" y="274" width="40" height="22" class="tbl" />
  <rect x="300" y="274" width="40" height="22" class="tbl" />
  <text x="240" y="290" class="t-td" text-anchor="middle">0</text>
  <text x="280" y="290" class="t-td" text-anchor="middle">1</text>
  <text x="320" y="290" class="t-td" text-anchor="middle">0</text>

  <rect x="220" y="296" width="40" height="22" class="tbl" />
  <rect x="260" y="296" width="40" height="22" class="tbl" />
  <rect x="300" y="296" width="40" height="22" class="tbl" />
  <text x="240" y="312" class="t-td" text-anchor="middle">1</text>
  <text x="280" y="312" class="t-td" text-anchor="middle">0</text>
  <text x="320" y="312" class="t-td" text-anchor="middle">0</text>

  <rect x="220" y="318" width="40" height="22" class="tbl" />
  <rect x="260" y="318" width="40" height="22" class="tbl" />
  <rect x="300" y="318" width="40" height="22" class="tbl" />
  <text x="240" y="334" class="t-td" text-anchor="middle">1</text>
  <text x="280" y="334" class="t-td" text-anchor="middle">1</text>
  <text x="320" y="334" class="t-td" text-anchor="middle">1</text>

  <!-- 注釈 -->
  <text x="200" y="365" class="t-formula" text-anchor="middle" fill="#555">OR：いずれか 1 で発生／AND：全て 1 で発生</text>

  <!-- 追加：ゲート活用ポイント -->
  <rect x="10" y="385" width="380" height="50" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5" rx="6"/>
  <text x="200" y="404" text-anchor="middle" font-size="12" fill="#1a3a5c" font-weight="bold" font-family="Inter, sans-serif">ゲート選択の判断基準</text>
  <text x="200" y="421" text-anchor="middle" font-size="11" fill="#222" font-family="Inter, sans-serif">OR：どれか 1 つでも失敗すれば上位事象が発生する場合</text>
  <text x="200" y="435" text-anchor="middle" font-size="11" fill="#555" font-family="Inter, sans-serif">AND：すべてが同時に失敗しないと上位事象が発生しない場合</text>

  <rect x="10" y="447" width="185" height="44" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5" rx="6"/>
  <text x="103" y="464" text-anchor="middle" font-size="11" fill="#1a3a5c" font-weight="bold" font-family="Inter, sans-serif">OR ゲート多用</text>
  <text x="103" y="480" text-anchor="middle" font-size="11" fill="#555" font-family="Inter, sans-serif">→ 信頼性向上が難しい構造</text>

  <rect x="205" y="447" width="185" height="44" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5" rx="6"/>
  <text x="297" y="464" text-anchor="middle" font-size="11" fill="#1a3a5c" font-weight="bold" font-family="Inter, sans-serif">AND ゲート多用</text>
  <text x="297" y="480" text-anchor="middle" font-size="11" fill="#555" font-family="Inter, sans-serif">→ 冗長系・多重防護構造</text>
</svg>
