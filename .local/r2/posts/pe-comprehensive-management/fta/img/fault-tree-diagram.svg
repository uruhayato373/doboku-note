  <svg viewBox="0 0 420 320" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="12" style="max-width:420px;width:100%">
    <defs>
      <marker id="ar3" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5 z" fill="#555"/></marker>
    </defs>

    <!-- 頂上事象 T -->
    <rect x="170" y="10" width="80" height="34" rx="5" fill="#444" stroke="#222"/>
    <text x="210" y="32" text-anchor="middle" fill="white" font-weight="bold" font-size="14">T</text>
    <text x="210" y="50" text-anchor="middle" fill="#555" font-size="10">頂上事象</text>

    <!-- AND ゲート -->
    <text x="210" y="74" text-anchor="middle" fill="#333" font-size="11">AND</text>
    <path d="M 185 76 Q 185 88 210 88 Q 235 88 235 76 Z" fill="#888" stroke="#555" stroke-width="1.2"/>
    <line x1="210" y1="44" x2="210" y2="76" stroke="#555" stroke-width="1.5"/>

    <!-- A1 へ（左） -->
    <line x1="210" y1="88" x2="130" y2="112" stroke="#555" stroke-width="1.5"/>
    <!-- A2 へ（右） -->
    <line x1="210" y1="88" x2="290" y2="112" stroke="#555" stroke-width="1.5"/>

    <!-- 中間事象 A1 -->
    <rect x="90" y="112" width="80" height="32" rx="5" fill="#555" stroke="#333"/>
    <text x="130" y="132" text-anchor="middle" fill="white" font-weight="bold" font-size="13">A1</text>
    <text x="130" y="150" text-anchor="middle" fill="#555" font-size="10">中間事象</text>

    <!-- A1 の AND ゲート -->
    <text x="130" y="168" text-anchor="middle" fill="#333" font-size="11">AND</text>
    <path d="M 108 170 Q 108 182 130 182 Q 152 182 152 170 Z" fill="#888" stroke="#555" stroke-width="1.2"/>
    <line x1="130" y1="144" x2="130" y2="170" stroke="#555" stroke-width="1.5"/>

    <!-- A1 → X1, X2 -->
    <line x1="130" y1="182" x2="90" y2="210" stroke="#555" stroke-width="1.5"/>
    <line x1="130" y1="182" x2="150" y2="210" stroke="#555" stroke-width="1.5"/>

    <!-- X1 -->
    <rect x="60" y="210" width="58" height="28" rx="4" fill="#777" stroke="#555"/>
    <text x="89" y="228" text-anchor="middle" fill="white" font-size="12">X1</text>
    <text x="89" y="246" text-anchor="middle" fill="#555" font-size="10">原因事象</text>

    <!-- X2 -->
    <rect x="128" y="210" width="58" height="28" rx="4" fill="#777" stroke="#555"/>
    <text x="157" y="228" text-anchor="middle" fill="white" font-size="12">X2</text>
    <text x="157" y="246" text-anchor="middle" fill="#555" font-size="10">原因事象</text>

    <!-- 中間事象 A2 -->
    <rect x="250" y="112" width="80" height="32" rx="5" fill="#555" stroke="#333"/>
    <text x="290" y="132" text-anchor="middle" fill="white" font-weight="bold" font-size="13">A2</text>
    <text x="290" y="150" text-anchor="middle" fill="#555" font-size="10">中間事象</text>

    <!-- A2 の OR ゲート -->
    <text x="290" y="168" text-anchor="middle" fill="#333" font-size="11">OR</text>
    <path d="M 268 162 Q 290 188 312 162" fill="#aaa" stroke="#555" stroke-width="1.2"/>
    <line x1="290" y1="144" x2="290" y2="162" stroke="#555" stroke-width="1.5"/>

    <!-- A2 → X3, X4/X5分岐 -->
    <line x1="290" y1="182" x2="250" y2="210" stroke="#555" stroke-width="1.5"/>
    <line x1="290" y1="182" x2="320" y2="210" stroke="#555" stroke-width="1.5"/>

    <!-- X3 -->
    <rect x="220" y="210" width="58" height="28" rx="4" fill="#777" stroke="#555"/>
    <text x="249" y="228" text-anchor="middle" fill="white" font-size="12">X3</text>
    <text x="249" y="246" text-anchor="middle" fill="#555" font-size="10">原因事象</text>

    <!-- X4/X5 OR分岐 -->
    <text x="340" y="228" text-anchor="middle" fill="#333" font-size="11">OR</text>
    <path d="M 318 222 Q 340 240 362 222" fill="#aaa" stroke="#555" stroke-width="1.2"/>
    <line x1="320" y1="210" x2="340" y2="222" stroke="#555" stroke-width="1.5"/>

    <line x1="340" y1="240" x2="320" y2="262" stroke="#555" stroke-width="1.5"/>
    <line x1="340" y1="240" x2="370" y2="262" stroke="#555" stroke-width="1.5"/>

    <!-- X4 -->
    <rect x="298" y="262" width="46" height="28" rx="4" fill="#888" stroke="#666"/>
    <text x="321" y="280" text-anchor="middle" fill="white" font-size="12">X4</text>

    <!-- X5 -->
    <rect x="356" y="262" width="46" height="28" rx="4" fill="#888" stroke="#666"/>
    <text x="379" y="280" text-anchor="middle" fill="white" font-size="12">X5</text>

    <!-- 凡例 -->
    <text x="10" y="295" fill="#555" font-size="9">頂上事象</text>
    <text x="10" y="308" fill="#555" font-size="9">中間事象</text>
    <text x="10" y="320" fill="#555" font-size="9">原因事象</text>
    <rect x="65" y="288" width="20" height="10" rx="2" fill="#444" stroke="#222"/>
    <rect x="65" y="301" width="20" height="10" rx="2" fill="#555" stroke="#333"/>
    <rect x="65" y="314" width="20" height="10" rx="2" fill="#777" stroke="#555"/>
  </svg>