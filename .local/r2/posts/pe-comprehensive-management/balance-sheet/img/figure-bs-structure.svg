<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="貸借対照表の構造：左に資産（流動・固定）、右に負債（流動・固定）と純資産を対置し、資産合計＝負債合計＋純資産合計の等式を示す" font-family='Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif'>
  <rect width="400" height="500" fill="#ffffff" stroke="#d7d7d7"/>

  <!-- Title -->
  <text x="200" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">貸借対照表（B/S）の構造</text>

  <!-- Sub-headers -->
  <text x="105" y="58" text-anchor="middle" font-size="11" fill="#555">資産の部（運用）</text>
  <text x="295" y="58" text-anchor="middle" font-size="11" fill="#555">負債・純資産の部（調達）</text>

  <!-- Left: 資産 (brand) -->
  <rect x="15" y="70" width="180" height="110" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="105" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a3a5c">流動資産</text>

  <rect x="15" y="180" width="180" height="170" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="105" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a3a5c">固定資産</text>

  <!-- Right top: 負債 (warn) -->
  <rect x="205" y="70" width="180" height="85" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text x="295" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#d4a017">流動負債</text>

  <rect x="205" y="155" width="180" height="55" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text x="295" y="187" text-anchor="middle" font-size="14" font-weight="bold" fill="#d4a017">固定負債</text>

  <!-- Right bottom: 純資産 (positive) -->
  <rect x="205" y="210" width="180" height="140" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/>
  <text x="295" y="284" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a7d44">純資産</text>
  <text x="295" y="304" text-anchor="middle" font-size="12" fill="#3a7d44">（自己資本）</text>

  <!-- Equation -->
  <text x="200" y="400" text-anchor="middle" font-size="13" fill="#555">資産合計 ＝ 負債合計 ＋ 純資産合計</text>

  <!-- サマリー -->
  <rect x="20" y="420" width="360" height="60" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1" rx="4"/>
  <text x="200" y="447" text-anchor="middle" font-size="12" fill="#222">左右の合計が一致する「貸借平均の原則」</text>
  <text x="200" y="467" text-anchor="middle" font-size="11" fill="#555">財政状態と資金調達源泉を対照表示</text>
</svg>
