<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" style="max-width:480px;width:100%" role="img" aria-label="貸借対照表の構造：左に資産（流動・固定）、右に負債（流動・固定）と純資産を対置し、資産合計＝負債合計＋純資産合計の等式を示す">
  <rect width="480" height="300" fill="white" stroke="#d7d7d7"/>

  <!-- Title -->
  <text x="240" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">貸借対照表（B/S）の構造</text>

  <!-- Sub-headers -->
  <text x="125" y="46" text-anchor="middle" font-size="11.5" fill="#555">資産の部（運用）</text>
  <text x="355" y="46" text-anchor="middle" font-size="11.5" fill="#555">負債・純資産の部（調達）</text>

  <!-- Left: 資産 (brand) -->
  <rect x="20" y="60" width="210" height="80" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/> <!-- brand-fill / brand -->
  <text x="125" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a3a5c">流動資産</text> <!-- brand-deep -->

  <rect x="20" y="140" width="210" height="120" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="125" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a3a5c">固定資産</text>

  <!-- Right top: 負債 (warn) -->
  <rect x="250" y="60" width="210" height="60" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/> <!-- warn-fill / warn -->
  <text x="355" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b5015">流動負債</text> <!-- warn deep (legibility) -->

  <rect x="250" y="120" width="210" height="40" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text x="355" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b5015">固定負債</text>

  <!-- Right bottom: 純資産 (positive) -->
  <rect x="250" y="160" width="210" height="100" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/> <!-- positive-fill / positive -->
  <text x="355" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e4d27">純資産（自己資本）</text> <!-- positive deep -->

  <!-- Equation -->
  <text x="240" y="285" text-anchor="middle" font-size="12" fill="#555">資産合計 ＝ 負債合計 ＋ 純資産合計</text>
</svg>
