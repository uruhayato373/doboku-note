<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280" style="max-width:400px;width:100%" role="img" aria-label="貸借対照表の構造：左に資産（流動・固定）、右に負債（流動・固定）と純資産を対置し、資産合計＝負債合計＋純資産合計の等式を示す" font-family='Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif'>
  <rect width="400" height="280" fill="#ffffff" stroke="#d7d7d7"/>

  <!-- Title -->
  <text x="200" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">貸借対照表（B/S）の構造</text>

  <!-- Sub-headers -->
  <text x="105" y="46" text-anchor="middle" font-size="11" fill="#555">資産の部（運用）</text>
  <text x="295" y="46" text-anchor="middle" font-size="11" fill="#555">負債・純資産の部（調達）</text>

  <!-- Left: 資産 (brand) -->
  <rect x="15" y="60" width="180" height="72" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/> <!-- brand-fill / brand -->
  <text x="105" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a3a5c">流動資産</text> <!-- brand-deep -->

  <rect x="15" y="132" width="180" height="108" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="105" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a3a5c">固定資産</text>

  <!-- Right top: 負債 (warn) -->
  <rect x="205" y="60" width="180" height="54" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/> <!-- warn-fill / warn -->
  <text x="295" y="91" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a3a5c">流動負債</text> <!-- warn deep (legibility) -->

  <rect x="205" y="114" width="180" height="36" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text x="295" y="136" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a3a5c">固定負債</text>

  <!-- Right bottom: 純資産 (positive) -->
  <rect x="205" y="150" width="180" height="90" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.5"/> <!-- positive-fill / positive -->
  <text x="295" y="199" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a7d44">純資産（自己資本）</text> <!-- positive deep -->

  <!-- Equation -->
  <text x="200" y="265" text-anchor="middle" font-size="12" fill="#555">資産合計 ＝ 負債合計 ＋ 純資産合計</text>
</svg>
