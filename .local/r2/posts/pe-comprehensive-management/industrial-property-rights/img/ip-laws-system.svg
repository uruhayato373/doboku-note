<svg width="400" height="540" viewBox="0 0 400 540"
     xmlns="http://www.w3.org/2000/svg"
     style="max-width:400px;width:100%"
     role="img"
     aria-label="知的財産権関連法規の体系：知的創作物（発明・考案・意匠・著作物等）と営業上の標識（商標・商号等）の二大区分。産業財産権法 4 法（特許・実用新案・意匠・商標）を ★ で示す">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-root { font-size: 14px; font-weight: bold; fill: #1a3a5c; }
      .t-branch { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-target { font-size: 12px; fill: #1a3a5c; }
      .t-law { font-size: 12px; fill: #1a3a5c; }
      .t-law-star { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-legend { font-size: 11px; fill: #555; }
      .box-root { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-branch-c { fill: #d0e8d0; stroke: #3a7d44; stroke-width: 1.5; }
      .box-branch-m { fill: #fff3cd; stroke: #d4a017; stroke-width: 1.5; }
      .box-target { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1; }
      .box-law-ipr { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .box-law-other { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1; }
      .conn { stroke: #8a8a8a; stroke-width: 1; fill: none; }
    </style>
  </defs>

  <!-- Root: 知的財産権 -->
  <rect class="box-root" x="120" y="10" width="160" height="36" rx="8"/>
  <text class="t-root" x="200" y="34" text-anchor="middle">知的財産権</text>

  <!-- Connection root → 知的創作物 header -->
  <line class="conn" x1="200" y1="46" x2="200" y2="60"/>

  <!-- Branch 1 header: 知的創作物 -->
  <rect class="box-branch-c" x="120" y="60" width="160" height="28" rx="6"/>
  <text class="t-branch" x="200" y="79" text-anchor="middle">知的創作物</text>

  <!-- 8 rows under 知的創作物 (row height 26, content at y+15) -->
  <!-- Row 1: 発明 → 特許法★ -->
  <rect class="box-target" x="20" y="100" width="120" height="22" rx="4"/>
  <text class="t-target" x="80" y="115" text-anchor="middle">発明</text>
  <line class="conn" x1="140" y1="111" x2="170" y2="111"/>
  <rect class="box-law-ipr" x="170" y="100" width="210" height="22" rx="4"/>
  <text class="t-law-star" x="178" y="115">★ 特許法</text>
  <text class="t-law" x="245" y="115">（産業財産権法）</text>

  <!-- Row 2: 考案 → 実用新案法★ -->
  <rect class="box-target" x="20" y="128" width="120" height="22" rx="4"/>
  <text class="t-target" x="80" y="143" text-anchor="middle">考案</text>
  <line class="conn" x1="140" y1="139" x2="170" y2="139"/>
  <rect class="box-law-ipr" x="170" y="128" width="210" height="22" rx="4"/>
  <text class="t-law-star" x="178" y="143">★ 実用新案法</text>
  <text class="t-law" x="263" y="143">（産業財産権法）</text>

  <!-- Row 3: 意匠 → 意匠法★ -->
  <rect class="box-target" x="20" y="156" width="120" height="22" rx="4"/>
  <text class="t-target" x="80" y="171" text-anchor="middle">意匠</text>
  <line class="conn" x1="140" y1="167" x2="170" y2="167"/>
  <rect class="box-law-ipr" x="170" y="156" width="210" height="22" rx="4"/>
  <text class="t-law-star" x="178" y="171">★ 意匠法</text>
  <text class="t-law" x="245" y="171">（産業財産権法）</text>

  <!-- Row 4: 著作物 → 著作権法 -->
  <rect class="box-target" x="20" y="184" width="120" height="22" rx="4"/>
  <text class="t-target" x="80" y="199" text-anchor="middle">著作物</text>
  <line class="conn" x1="140" y1="195" x2="170" y2="195"/>
  <rect class="box-law-other" x="170" y="184" width="210" height="22" rx="4"/>
  <text class="t-law" x="178" y="199">著作権法</text>

  <!-- Row 5: 営業秘密 → 不正競争防止法 -->
  <rect class="box-target" x="20" y="212" width="120" height="22" rx="4"/>
  <text class="t-target" x="80" y="227" text-anchor="middle">営業秘密</text>
  <line class="conn" x1="140" y1="223" x2="170" y2="223"/>
  <rect class="box-law-other" x="170" y="212" width="210" height="22" rx="4"/>
  <text class="t-law" x="178" y="227">不正競争防止法</text>

  <!-- Row 6: 商品の形態 → 不正競争防止法 -->
  <rect class="box-target" x="20" y="240" width="120" height="22" rx="4"/>
  <text class="t-target" x="80" y="255" text-anchor="middle">商品の形態</text>
  <line class="conn" x1="140" y1="251" x2="170" y2="251"/>
  <rect class="box-law-other" x="170" y="240" width="210" height="22" rx="4"/>
  <text class="t-law" x="178" y="255">不正競争防止法</text>

  <!-- Row 7: 半導体集積回路 → 半導体集積回路法 -->
  <rect class="box-target" x="20" y="268" width="120" height="22" rx="4"/>
  <text class="t-target" x="80" y="283" text-anchor="middle">半導体集積回路</text>
  <line class="conn" x1="140" y1="279" x2="170" y2="279"/>
  <rect class="box-law-other" x="170" y="268" width="210" height="22" rx="4"/>
  <text class="t-law" x="178" y="283">半導体集積回路法</text>

  <!-- Row 8: 植物新品種 → 種苗法 -->
  <rect class="box-target" x="20" y="296" width="120" height="22" rx="4"/>
  <text class="t-target" x="80" y="311" text-anchor="middle">植物新品種</text>
  <line class="conn" x1="140" y1="307" x2="170" y2="307"/>
  <rect class="box-law-other" x="170" y="296" width="210" height="22" rx="4"/>
  <text class="t-law" x="178" y="311">種苗法</text>

  <!-- Connection root → 営業上の標識 header (via long curve) -->
  <line class="conn" x1="200" y1="328" x2="200" y2="338"/>

  <!-- Branch 2 header: 営業上の標識 -->
  <rect class="box-branch-m" x="120" y="338" width="160" height="28" rx="6"/>
  <text class="t-branch" x="200" y="357" text-anchor="middle">営業上の標識</text>

  <!-- 4 rows under 営業上の標識 -->
  <!-- Row 1: 商標 → 商標法★ -->
  <rect class="box-target" x="20" y="378" width="120" height="22" rx="4"/>
  <text class="t-target" x="80" y="393" text-anchor="middle">商標</text>
  <line class="conn" x1="140" y1="389" x2="170" y2="389"/>
  <rect class="box-law-ipr" x="170" y="378" width="210" height="22" rx="4"/>
  <text class="t-law-star" x="178" y="393">★ 商標法</text>
  <text class="t-law" x="245" y="393">（産業財産権法）</text>

  <!-- Row 2: 商号 → 商法・会社法 -->
  <rect class="box-target" x="20" y="406" width="120" height="22" rx="4"/>
  <text class="t-target" x="80" y="421" text-anchor="middle">商号</text>
  <line class="conn" x1="140" y1="417" x2="170" y2="417"/>
  <rect class="box-law-other" x="170" y="406" width="210" height="22" rx="4"/>
  <text class="t-law" x="178" y="421">商法・会社法</text>

  <!-- Row 3: 著名商標・原産地表示 → 不正競争防止法 -->
  <rect class="box-target" x="20" y="434" width="120" height="22" rx="4"/>
  <text class="t-target" x="80" y="449" text-anchor="middle">著名商標・原産地</text>
  <line class="conn" x1="140" y1="445" x2="170" y2="445"/>
  <rect class="box-law-other" x="170" y="434" width="210" height="22" rx="4"/>
  <text class="t-law" x="178" y="449">不正競争防止法</text>

  <!-- Row 4: その他の標識 → 不正競争防止法 -->
  <rect class="box-target" x="20" y="462" width="120" height="22" rx="4"/>
  <text class="t-target" x="80" y="477" text-anchor="middle">その他の標識</text>
  <line class="conn" x1="140" y1="473" x2="170" y2="473"/>
  <rect class="box-law-other" x="170" y="462" width="210" height="22" rx="4"/>
  <text class="t-law" x="178" y="477">不正競争防止法</text>

  <!-- Legend -->
  <line class="conn" x1="20" y1="498" x2="380" y2="498"/>
  <text class="t-legend" x="20" y="515">★ = 産業財産権法 4 法（特許・実用新案・意匠・商標）</text>
  <text class="t-legend" x="20" y="530">特許庁が所管。出願・審査・登録の方式主義による独占権</text>
</svg>
