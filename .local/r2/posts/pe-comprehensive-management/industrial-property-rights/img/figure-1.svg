<svg viewBox="0 0 460 420" xmlns="http://www.w3.org/2000/svg" style="max-width:460px;width:100%" role="img" aria-label="知的財産権の存続期間ラダー。特許20年・意匠25年・種苗25〜30年・実用新案10年・半導体回路10年・商標10年更新可・著作権死後70年の7法を横バーで比較した図">
  <!-- viewBox幅460: 7法の起算区分+バー+年数ラベルを収めるため460を使用 -->
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
      .t-title  { font-size: 15px; font-weight: bold; fill: #1a3a5c; }
      .t-sub    { font-size: 11px; fill: #555; }
      .t-law    { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-years  { font-size: 13px; font-weight: bold; fill: #1a3a5c; }
      .t-note   { font-size: 11px; fill: #555; }
      .t-badge  { font-size: 11px; fill: #555; }
      .t-axis   { font-size: 11px; fill: #8a8a8a; }
      .t-head   { font-size: 11px; font-weight: bold; fill: #8a8a8a; }
    </style>
  </defs>

  <!-- タイトル -->
  <text class="t-title" x="230" y="22" text-anchor="middle">知的財産権の存続期間ラダー</text>
  <text class="t-sub" x="230" y="38" text-anchor="middle">産業財産権法・著作権法等 7 法の比較</text>

  <!-- 列ヘッダー -->
  <text class="t-head" x="4"   y="56">権利の種類</text>
  <text class="t-head" x="148" y="56">起算点</text>
  <text class="t-head" x="270" y="56">存続期間（年）</text>
  <line x1="0" y1="60" x2="460" y2="60" stroke="#d7d7d7" stroke-width="1"/>

  <!-- ===== 行1: 著作権（warn: 死後起算・特別扱い） ===== -->
  <rect x="145" y="66" width="100" height="22" rx="4" fill="#fff3cd" stroke="#d4a017" stroke-width="1"/>
  <text class="t-badge" x="195" y="81" text-anchor="middle">創作時</text>
  <!-- バー: 70単位 × 3.8px = 266px (warn色) -->
  <rect x="268" y="66" width="178" height="22" rx="3" fill="#fff3cd" stroke="#d4a017" stroke-width="1.2"/>
  <text class="t-years" x="278" y="81" fill="#d4a017">死後70年</text>
  <text class="t-note" x="456" y="79" text-anchor="end" font-size="11">更新不可</text>
  <text class="t-law" x="4" y="81">著作権</text>
  <text class="t-note" x="4" y="93" fill="#8a8a8a">著作権法</text>

  <!-- 区切り線 -->
  <line x1="0" y1="102" x2="460" y2="102" stroke="#d7d7d7" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- ===== 行2: 種苗 25(30)年 ===== -->
  <!-- バー幅: 25yr = 190px brand濃 -->
  <rect x="145" y="110" width="100" height="22" rx="4" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1"/>
  <text class="t-badge" x="195" y="125" text-anchor="middle">登録日</text>
  <rect x="268" y="110" width="190" height="22" rx="3" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.2"/>
  <text class="t-years" x="278" y="125" fill="#1a3a5c" font-size="12">25年（木本30年）</text>
  <text class="t-law" x="4" y="125">種苗権</text>
  <text class="t-note" x="4" y="137" fill="#8a8a8a">種苗法</text>

  <!-- 区切り線 -->
  <line x1="0" y1="146" x2="460" y2="146" stroke="#d7d7d7" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- ===== 行3: 意匠 25年 ===== -->
  <rect x="145" y="154" width="100" height="22" rx="4" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1"/>
  <text class="t-badge" x="195" y="169" text-anchor="middle">登録日</text>
  <!-- バー幅25年: 190px -->
  <rect x="268" y="154" width="190" height="22" rx="3" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1.2"/>
  <text class="t-years" x="278" y="169" fill="#1a3a5c" font-size="12">25年</text>
  <text class="t-law" x="4" y="169">意匠権</text>
  <text class="t-note" x="4" y="181" fill="#8a8a8a">意匠法</text>

  <!-- 区切り線 -->
  <line x1="0" y1="190" x2="460" y2="190" stroke="#d7d7d7" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- ===== 行4: 特許 20年 ===== -->
  <rect x="145" y="198" width="100" height="22" rx="4" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1"/>
  <text class="t-badge" x="195" y="213" text-anchor="middle">出願日</text>
  <!-- バー幅20年: 152px brand中 -->
  <rect x="268" y="198" width="152" height="22" rx="3" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.2"/>
  <text class="t-years" x="278" y="213" fill="#1a3a5c" font-size="12">20年</text>
  <text class="t-law" x="4" y="213">特許権</text>
  <text class="t-note" x="4" y="225" fill="#8a8a8a">特許法</text>

  <!-- 区切り線 -->
  <line x1="0" y1="234" x2="460" y2="234" stroke="#d7d7d7" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- ===== 行5: 実用新案 10年 ===== -->
  <rect x="145" y="242" width="100" height="22" rx="4" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1"/>
  <text class="t-badge" x="195" y="257" text-anchor="middle">出願日</text>
  <!-- バー幅10年: 76px brand淡 -->
  <rect x="268" y="242" width="76" height="22" rx="3" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.2"/>
  <text class="t-years" x="278" y="257" fill="#555" font-size="12">10年</text>
  <text class="t-law" x="4" y="257">実用新案権</text>
  <text class="t-note" x="4" y="269" fill="#8a8a8a">実用新案法</text>

  <!-- 区切り線 -->
  <line x1="0" y1="278" x2="460" y2="278" stroke="#d7d7d7" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- ===== 行6: 商標 10年（更新可） ===== -->
  <rect x="145" y="286" width="100" height="22" rx="4" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1"/>
  <text class="t-badge" x="195" y="301" text-anchor="middle">登録日</text>
  <!-- バー: 76px brand淡 + 更新マーク -->
  <rect x="268" y="286" width="76" height="22" rx="3" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.2"/>
  <text class="t-years" x="278" y="301" fill="#555" font-size="12">10年</text>
  <!-- 更新バッジ -->
  <rect x="352" y="288" width="40" height="18" rx="4" fill="#fff3cd" stroke="#d4a017" stroke-width="1.2"/>
  <text x="372" y="300" text-anchor="middle" font-size="11" fill="#d4a017" font-weight="bold">更新可</text>
  <text class="t-law" x="4" y="301">商標権</text>
  <text class="t-note" x="4" y="313" fill="#8a8a8a">商標法</text>

  <!-- 区切り線 -->
  <line x1="0" y1="322" x2="460" y2="322" stroke="#d7d7d7" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- ===== 行7: 半導体回路 10年 ===== -->
  <rect x="145" y="330" width="100" height="22" rx="4" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1"/>
  <text class="t-badge" x="195" y="345" text-anchor="middle">登録日</text>
  <!-- バー: 76px brand淡 -->
  <rect x="268" y="330" width="76" height="22" rx="3" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.2"/>
  <text class="t-years" x="278" y="345" fill="#555" font-size="12">10年</text>
  <text class="t-law" x="4" y="345">回路配置利用権</text>
  <text class="t-note" x="4" y="357" fill="#8a8a8a">半導体集積回路法</text>

  <!-- 下線 -->
  <line x1="0" y1="366" x2="460" y2="366" stroke="#d7d7d7" stroke-width="1"/>

  <!-- 凡例 -->
  <rect x="4"   y="374" width="14" height="10" rx="2" fill="#d0e8d0" stroke="#3a7d44" stroke-width="1"/>
  <text class="t-note" x="22" y="383">25年以上（長期）</text>
  <rect x="130" y="374" width="14" height="10" rx="2" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1"/>
  <text class="t-note" x="148" y="383">20年</text>
  <rect x="200" y="374" width="14" height="10" rx="2" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1"/>
  <text class="t-note" x="218" y="383">10年（短期）</text>
  <rect x="308" y="374" width="14" height="10" rx="2" fill="#fff3cd" stroke="#d4a017" stroke-width="1"/>
  <text class="t-note" x="326" y="383">著作権・更新可</text>

  <!-- 年数スケール目盛り -->
  <text class="t-axis" x="268" y="408" text-anchor="middle">0</text>
  <text class="t-axis" x="344" y="408" text-anchor="middle">10</text>
  <text class="t-axis" x="420" y="408" text-anchor="middle">20</text>
  <line x1="268" y1="400" x2="460" y2="400" stroke="#d7d7d7" stroke-width="0.8"/>
  <line x1="268" y1="397" x2="268" y2="403" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="344" y1="397" x2="344" y2="403" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="420" y1="397" x2="420" y2="403" stroke="#8a8a8a" stroke-width="1"/>
  <text class="t-axis" x="364" y="417" text-anchor="middle">目盛り: 10年 = 76px</text>
</svg>
