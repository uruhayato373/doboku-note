<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="自然電位法の測定回路の模式図と、電位が示すのは腐食の活動度であって腐食速度ではないことの整理">
  <defs>
    <marker id="cdi3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <text x="200" y="16" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">鉄筋と照合電極の電位差から、腐食の活動度を面的につかむ</text>

  <rect x="30" y="96" width="340" height="110" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
  <text x="42" y="116" font-family="sans-serif" font-size="11" fill="#8a8a8a">コンクリート</text>

  <line x1="50" y1="170" x2="350" y2="170" stroke="#8a8a8a" stroke-width="4"/>
  <text x="300" y="192" font-family="sans-serif" font-size="11" fill="#8a8a8a">鉄筋</text>

  <rect x="150" y="70" width="34" height="26" fill="#e8f0fe" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="192" y="80" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2e6da4">照合電極</text>
  <text x="192" y="94" font-family="sans-serif" font-size="11" fill="#555">CSE または SCE</text>

  <circle cx="70" cy="46" r="18" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
  <text x="70" y="51" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#222">V</text>
  <text x="94" y="80" font-family="sans-serif" font-size="11" fill="#555">電位差計</text>

  <path d="M88 46 L167 46 L167 70" fill="none" stroke="#222" stroke-width="1.5"/>
  <path d="M56 62 L56 170" fill="none" stroke="#222" stroke-width="1.5"/>
  <circle cx="56" cy="170" r="4" fill="#222"/>
  <text x="20" y="130" font-family="sans-serif" font-size="11" fill="#555">鉄筋へ</text>
  <text x="20" y="144" font-family="sans-serif" font-size="11" fill="#555">直接接続</text>

  <line x1="200" y1="60" x2="250" y2="60" stroke="#2e6da4" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#cdi3)"/>
  <text x="256" y="56" font-family="sans-serif" font-size="11" fill="#2e6da4">電極を移動して</text>
  <text x="256" y="72" font-family="sans-serif" font-size="11" fill="#2e6da4">面的に測定</text>

  <text x="20" y="228" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1a3a5c">卑（マイナスが大きい）ほど腐食の確率が高い</text>
  <text x="20" y="246" font-family="sans-serif" font-size="11" fill="#8a8a8a">判定区分の数値は本文の表を参照（ASTM C876）</text>

  <rect x="20" y="262" width="360" height="106" rx="6" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text x="34" y="284" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1a3a5c">この方法で分かること・分からないこと</text>
  <text x="34" y="306" font-family="sans-serif" font-size="11" fill="#555">分かる: 腐食が起きている確率（活動度）</text>
  <text x="34" y="328" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b22234">分からない: 腐食の速度・断面の減り方</text>
  <text x="34" y="352" font-family="sans-serif" font-size="11" fill="#555">→ 速度は分極抵抗法で補う</text>

  <rect x="20" y="382" width="360" height="100" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="34" y="404" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1a3a5c">測定値が動く条件（解釈の注意）</text>
  <text x="34" y="426" font-family="sans-serif" font-size="11" fill="#555">コンクリートの含水状態</text>
  <text x="34" y="448" font-family="sans-serif" font-size="11" fill="#555">酸素の供給量</text>
  <text x="34" y="470" font-family="sans-serif" font-size="11" fill="#555">温度</text>
</svg>
