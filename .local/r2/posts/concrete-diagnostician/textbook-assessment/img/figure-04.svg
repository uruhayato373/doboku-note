<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" style="max-width:400px;width:100%" role="img" aria-label="性能低下曲線が限界値に達する時点と現在時点の差として余寿命を求める概念図と、予測に伴う不確実性の要因">
  <defs>
    <marker id="cda4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="cda4b" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b22234"/>
    </marker>
  </defs>

  <text x="200" y="16" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">限界に達する時期から現在を引いた差が余寿命</text>

  <line x1="56" y1="230" x2="380" y2="230" stroke="#222" stroke-width="1.5" marker-end="url(#cda4)"/>
  <line x1="56" y1="230" x2="56" y2="40" stroke="#222" stroke-width="1.5" marker-end="url(#cda4)"/>
  <text x="378" y="248" text-anchor="end" font-family="sans-serif" font-size="11" fill="#222">経過時間</text>
  <text x="62" y="52" font-family="sans-serif" font-size="11" fill="#222">性能</text>

  <path d="M56 62 Q 140 74 210 116 Q 280 158 340 214 L340 230 L56 230 Z" fill="#e8f0fe" opacity="0.5"/>
  <path d="M56 62 Q 150 78 220 124 Q 290 170 350 220" fill="none" stroke="#2e6da4" stroke-width="2.5"/>

  <line x1="56" y1="176" x2="360" y2="176" stroke="#b22234" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="360" y="170" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b22234">性能の限界値</text>

  <line x1="160" y1="40" x2="160" y2="230" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="120" y="56" font-family="sans-serif" font-size="11" fill="#8a8a8a">現在</text>

  <circle cx="272" cy="176" r="5" fill="#b22234"/>
  <line x1="272" y1="176" x2="272" y2="230" stroke="#b22234" stroke-width="1.2" stroke-dasharray="3 3"/>

  <line x1="160" y1="252" x2="272" y2="252" stroke="#b22234" stroke-width="1.5" marker-start="url(#cda4b)" marker-end="url(#cda4b)"/>
  <text x="216" y="270" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b22234">余寿命</text>

  <text x="20" y="296" font-family="sans-serif" font-size="11" fill="#555">予測は点推定だけでなく、ばらつきの幅を添えて示す。</text>

  <rect x="20" y="308" width="360" height="174" rx="6" fill="#f5f5f5" stroke="#d7d7d7" stroke-width="1.5"/>
  <text x="200" y="328" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222">不確実性の出どころ</text>

  <rect x="30" y="338" width="340" height="42" rx="3" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text x="42" y="356" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1a3a5c">モデルの前提</text>
  <text x="42" y="373" font-family="sans-serif" font-size="11" fill="#555">平方根則は均一な環境を仮定している</text>

  <rect x="30" y="386" width="340" height="42" rx="3" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text x="42" y="404" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1a3a5c">パラメータのばらつき</text>
  <text x="42" y="421" font-family="sans-serif" font-size="11" fill="#555">速度係数・拡散係数・材料と施工の差</text>

  <rect x="30" y="434" width="340" height="40" rx="3" fill="#ffffff" stroke="#d7d7d7" stroke-width="1"/>
  <text x="42" y="452" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1a3a5c">複合劣化</text>
  <text x="42" y="469" font-family="sans-serif" font-size="11" fill="#555">機構どうしが互いを促進する場合がある</text>
</svg>
