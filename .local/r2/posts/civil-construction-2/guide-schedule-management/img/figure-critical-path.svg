<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"
  style="max-width:400px;width:100%"
  role="img"
  aria-label="クリティカルパスとフロートの関係。同じ始点と終点を結ぶ2つの経路のうち、所要日数の合計が長い方がクリティカルパスとなり全体の工期を決める。短い方の経路には差の分だけフロート（余裕）が生じる">
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
      .t-lead { font-size: 11px; fill: #555; }
      .t-node { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-actc { font-size: 11px; font-weight: bold; fill: #b22234; }
      .t-act  { font-size: 11px; fill: #222; }
      .t-cp   { font-size: 11px; font-weight: bold; fill: #b22234; }
      .t-fl   { font-size: 11px; fill: #222; }
      .t-lg   { font-size: 11px; fill: #555; }
      .t-sec  { font-size: 12px; font-weight: bold; fill: #1a3a5c; }
      .t-item { font-size: 11px; fill: #222; }
      .nd { fill: #e8f0fe; stroke: #2e6da4; stroke-width: 1.5; }
      .lk { stroke: #2e6da4; stroke-width: 1.5; fill: none; }
      .cp { stroke: #b22234; stroke-width: 3; fill: none; }
      .box-surf { fill: #f5f5f5; stroke: #d7d7d7; stroke-width: 1.5; }
      .rule { stroke: #d7d7d7; stroke-width: 1; }
    </style>
    <marker id="cp-b" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0,0 11,4.5 0,9" fill="#2e6da4"/>
    </marker>
    <marker id="cp-r" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0,0 11,4.5 0,9" fill="#b22234"/>
    </marker>
  </defs>

  <text class="t-lead" x="200" y="18" text-anchor="middle">長いほうの経路が全体の工期を決める</text>

  <line class="cp" x1="74" y1="118" x2="164" y2="90" marker-end="url(#cp-r)"/>
  <line class="cp" x1="196" y1="86" x2="292" y2="117" marker-end="url(#cp-r)"/>
  <line class="lk" x1="74" y1="134" x2="164" y2="162" marker-end="url(#cp-b)"/>
  <line class="lk" x1="196" y1="166" x2="292" y2="135" marker-end="url(#cp-b)"/>

  <circle class="nd" cx="60" cy="126" r="14"/>
  <circle class="nd" cx="180" cy="80" r="14"/>
  <circle class="nd" cx="180" cy="172" r="14"/>
  <circle class="nd" cx="306" cy="126" r="14"/>
  <text class="t-node" x="60" y="131" text-anchor="middle">1</text>
  <text class="t-node" x="180" y="85" text-anchor="middle">2</text>
  <text class="t-node" x="180" y="177" text-anchor="middle">3</text>
  <text class="t-node" x="306" y="131" text-anchor="middle">4</text>

  <text class="t-actc" x="112" y="92" text-anchor="middle">A 6 日</text>
  <text class="t-actc" x="248" y="90" text-anchor="middle">B 10 日</text>
  <text class="t-act" x="112" y="172" text-anchor="middle">C 4 日</text>
  <text class="t-act" x="248" y="172" text-anchor="middle">D 5 日</text>

  <line class="cp" x1="40" y1="212" x2="66" y2="212"/>
  <text class="t-lg" x="74" y="216">太い赤線がクリティカルパス</text>

  <text class="t-cp" x="40" y="244">上の経路　6 ＋ 10 ＝ 16 日（最長）</text>
  <text class="t-fl" x="40" y="268">下の経路　4 ＋ 5 ＝ 9 日 → フロート 7 日</text>

  <rect class="box-surf" x="20" y="300" width="360" height="182" rx="6"/>
  <text class="t-sec" x="200" y="322" text-anchor="middle">読み取り方</text>
  <line class="rule" x1="36" y1="331" x2="364" y2="331"/>
  <text class="t-item" x="40" y="356">フロートは作業に許される余裕時間</text>
  <text class="t-item" x="40" y="380">クリティカルパス上の作業にはフロートがない</text>
  <text class="t-item" x="40" y="404">矢印が作業、結合点が作業の始点・終点を表す</text>
  <text class="t-item" x="40" y="428">どの作業が遅延のリスクになるかを特定できる</text>
  <text class="t-item" x="40" y="452">並行関係も含めて工程の全体像を論理的に整理できる</text>
</svg>
